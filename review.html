<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#080d1a" name="theme-color"/>
<title>TrendPilot AI — Review Centre</title>
<style>
:root{--bg:#080d1a;--panel:#11182b;--panel2:#171f35;--text:#f7f9ff;--muted:#9ca7bd;--line:#2b3552;--accent:#7c55ff;--accent2:#55e0cf;--good:#47d18c;--bad:#ff6b7a;--warn:#f2c45e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070b16,#10172b);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:5;background:rgba(8,13,26,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px}.wrap{max-width:980px;margin:auto}h1{font-size:1.35rem;margin:0}.sub{color:var(--muted);font-size:.92rem;margin-top:3px}main{padding:18px 14px 100px}.toolbar,.stats,.manual{display:grid;gap:10px}.toolbar{grid-template-columns:1fr auto;margin-bottom:14px}input,button{font:inherit}input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px;outline:none}button{border:0;border-radius:13px;padding:12px 15px;font-weight:800;cursor:pointer}.refresh{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.stats{grid-template-columns:repeat(3,1fr);margin-bottom:16px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center}.stat b{font-size:1.3rem;display:block}.stat span{color:var(--muted);font-size:.82rem}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 14px 30px rgba(0,0,0,.18)}.card-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.title{font-size:1.08rem;font-weight:900}.slug{color:var(--accent2);font-size:.82rem;word-break:break-all}.meta{color:var(--muted);font-size:.9rem;margin:8px 0}.summary{color:#d8ddef;margin:10px 0}.badge,.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:.78rem}.badge.ready{border-color:var(--good);color:var(--good)}.badge.held{border-color:var(--warn);color:var(--warn)}.evidence{display:grid;gap:10px;margin:13px 0}.evidence-box{background:rgba(6,10,22,.38);border:1px solid var(--line);border-radius:14px;padding:11px}.evidence-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{color:#dce4ff;text-decoration:none;background:rgba(124,85,255,.08)}a.chip:hover{border-color:var(--accent2)}.reason-list{margin:0;padding-left:20px;color:#d8ddef;font-size:.86rem}.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}.metric b{display:block}.metric span{font-size:.7rem;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.approve{background:var(--good);color:#062316}.approve:disabled{opacity:.38;cursor:not-allowed}.reject{background:var(--bad);color:#2a0610}.undo{background:var(--warn);color:#2b2100;grid-column:1/-1}.status{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:.78rem;margin-top:8px}.status.approved{border-color:var(--good);color:var(--good)}.status.rejected{border-color:var(--bad);color:var(--bad)}.empty{padding:35px 18px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:20px}.manual{grid-template-columns:1fr auto auto;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:18px;margin:16px 0}.manual .a{background:var(--good);color:#062316}.manual .r{background:var(--bad);color:#2a0610}footer{position:fixed;bottom:0;left:0;right:0;background:rgba(8,13,26,.96);border-top:1px solid var(--line);padding:11px 14px}.save{display:block;width:min(980px,100%);margin:auto;background:linear-gradient(90deg,var(--accent),#6657ff);color:white;font-size:1rem}.note{color:var(--muted);font-size:.8rem;margin:10px 2px 0}@media(max-width:650px){.manual{grid-template-columns:1fr 1fr}.manual input{grid-column:1/-1}.product-grid{grid-template-columns:repeat(2,1fr)}.card-head{display:block}.badge{margin-top:8px}}
</style>
<meta content="noindex,nofollow,noarchive" name="robots"/><meta content="Private editorial review workspace for TrendPilot AI." name="description"/>  <link rel="stylesheet" href="/css/style-v9.css?v=9.0.0">
</head>
<body>
<header><div class="wrap"><h1>TrendPilot AI — Review Centre</h1><div class="sub">Review source evidence and product readiness before publishing a trend.</div></div></header>
<main class="wrap">
<div class="toolbar"><input id="search" placeholder="Search by title, slug or source"/><button class="refresh" id="refresh">Refresh</button></div>
<div class="stats"><div class="stat"><b id="pendingCount">0</b><span>Pending</span></div><div class="stat"><b id="approvedCount">0</b><span>Approved</span></div><div class="stat"><b id="rejectedCount">0</b><span>Rejected</span></div></div>
<div class="manual"><input id="manualSlug" placeholder="Manual slug, e.g. car-multimedia-head-units"/><button class="a" id="manualApprove">Approve</button><button class="r" id="manualReject">Reject</button></div>
<div class="note" id="message"></div><section id="list"></section>
</main>
<footer><button class="save" id="download">Download updated trend-approvals.json</button></footer>
<script>
(()=>{
  const state={candidates:[],approved:new Set(),rejected:new Set(),version:"0.8.0"};
  const $=id=>document.getElementById(id);
  const clean=v=>String(v||"").trim().toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"");
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[m]);
  const validUrl=v=>{try{const u=new URL(String(v||""),location.href);return /^https?:$/.test(u.protocol)?u.href:""}catch{return""}};
  async function getJson(path){const r=await fetch(path+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(path);return r.json()}
  function extract(d){return[d?.reviewQueue,d?.candidates,d?.trends].filter(Array.isArray).flat().filter(Boolean)}
  async function load(){
    $("message").textContent="Loading review data…";let review={},approvals={};
    try{review=await getJson("data/trend-review.json")}catch(e){}
    try{approvals=await getJson("config/trend-approvals.json")}catch(e){}
    let candidates=extract(review);
    if(!candidates.length)try{candidates=extract(await getJson("data/commerce-candidates.json"))}catch(e){}
    if(!candidates.length)try{candidates=extract(await getJson("data/discovered-trends.json"))}catch(e){}
    const seen=new Set();
    state.candidates=candidates.filter(item=>{const slug=clean(item.slug||item.title);if(!slug||seen.has(slug))return false;seen.add(slug);item.slug=slug;return true});
    state.version=approvals.version||state.version;
    state.approved=new Set((approvals.approvedSlugs||[]).map(clean).filter(Boolean));
    state.rejected=new Set((approvals.rejectedSlugs||[]).map(clean).filter(Boolean));
    $("message").textContent=state.candidates.length?"Candidates loaded. Approval is enabled only when product evidence is ready.":"No pending candidates found. You can still enter a slug manually.";
    render();
  }
  function decision(slug,d){slug=clean(slug);if(!slug)return;state.approved.delete(slug);state.rejected.delete(slug);if(d==="approved")state.approved.add(slug);if(d==="rejected")state.rejected.add(slug);render()}
  function status(slug){if(state.approved.has(slug))return"approved";if(state.rejected.has(slug))return"rejected";return"pending"}
  function sourceEvidence(item){
    const raw=Array.isArray(item.sourceEvidence)?item.sourceEvidence:[];
    if(raw.length)return raw;
    if(item.sourceLabel)return[{label:item.sourceLabel,url:item.sourceUrl||"",family:item.sourceId||"source"}];
    const commerce=item.commerceEvidence||{};
    return (commerce.sources||[]).map(x=>({label:x,family:x,url:""}));
  }
  function render(){
    const q=$("search").value.trim().toLowerCase();
    const items=state.candidates.filter(x=>{const sources=sourceEvidence(x).map(s=>s.label).join(" ");return!q||String(x.title||"").toLowerCase().includes(q)||x.slug.includes(q)||sources.toLowerCase().includes(q)});
    $("approvedCount").textContent=state.approved.size;$("rejectedCount").textContent=state.rejected.size;$("pendingCount").textContent=state.candidates.filter(x=>status(x.slug)==="pending").length;
    const list=$("list");list.innerHTML="";
    if(!items.length){list.innerHTML='<div class="empty">No candidates match the current search.</div>';return}
    for(const item of items){
      const st=status(item.slug),score=item.score??item.matchScore??item.productEvidence?.bestMatchScore??"—",category=item.category||"Uncategorised",summary=item.summary||item.whyNow||"";
      const ready=Boolean(item.readyForApproval),sources=sourceEvidence(item),reasons=Array.isArray(item.strengthReasons)?item.strengthReasons:[];
      const p=item.productEvidence||{},checks=p.approvalChecks||{};
      const sourceMarkup=sources.length?sources.map(s=>{const url=validUrl(s.url);const label=esc(s.label||s.family||s.id||"Source");return url?`<a class="chip" href="${esc(url)}" target="_blank" rel="noopener">${label} ↗</a>`:`<span class="chip">${label}</span>`}).join(""):"<span class=\"chip\">No external source recorded</span>";
      const reasonMarkup=reasons.length?`<ul class="reason-list">${reasons.slice(0,5).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<span class="note">No strong-signal reason recorded yet.</span>';
      const card=document.createElement("article");card.className="card";
      card.innerHTML=`<div class="card-head"><div><div class="title">${esc(item.title||item.slug)}</div><div class="slug">${esc(item.slug)}</div></div><span class="badge ${ready?'ready':'held'}">${ready?'Ready for approval':'Held for evidence'}</span></div><div class="meta">${esc(category)} · Trend score ${esc(score)} · ${esc(item.corroborationCount??0)} source families</div>${summary?`<div class="summary">${esc(summary)}</div>`:""}<div class="evidence"><div class="evidence-box"><div class="evidence-title">Trend sources</div><div class="chips">${sourceMarkup}</div></div><div class="evidence-box"><div class="evidence-title">Why the signal is strong</div>${reasonMarkup}</div><div class="evidence-box"><div class="evidence-title">Product readiness</div><div class="product-grid"><div class="metric"><b>${esc(p.matchCount??0)}</b><span>Matches</span></div><div class="metric"><b>${esc(p.bestMatchScore??0)}</b><span>Best score</span></div><div class="metric"><b>${esc(p.strongMatchCount??0)}</b><span>Strong</span></div><div class="metric"><b>${esc(p.affiliateRouteCount??0)}</b><span>Routes</span></div></div></div></div><span class="status ${st}">${st}</span><div class="actions"><button class="approve" ${ready?'':'disabled title="Product evidence is not ready yet"'}>Approve</button><button class="reject">Reject</button>${st!=="pending"?'<button class="undo">Return to pending</button>':""}</div>`;
      const approve=card.querySelector(".approve");if(ready)approve.onclick=()=>decision(item.slug,"approved");
      card.querySelector(".reject").onclick=()=>decision(item.slug,"rejected");const u=card.querySelector(".undo");if(u)u.onclick=()=>decision(item.slug,"pending");list.appendChild(card);
    }
  }
  function manual(d){const slug=clean($("manualSlug").value);if(!slug){$("message").textContent="Enter a valid slug first.";return}decision(slug,d);$("manualSlug").value="";$("message").textContent=`${slug} marked as ${d}.`}
  function download(){const output={version:state.version,approvedSlugs:[...state.approved].sort(),rejectedSlugs:[...state.rejected].sort(),instructions:"Upload this file to config/trend-approvals.json, replacing the old file, then run the GitHub Action."};const blob=new Blob([JSON.stringify(output,null,2)+"\n"],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="trend-approvals.json";document.body.appendChild(a);a.click();a.remove()}
  $("search").addEventListener("input",render);$("refresh").onclick=load;$("manualApprove").onclick=()=>manual("approved");$("manualReject").onclick=()=>manual("rejected");$("download").onclick=download;load();
})();
</script>
<script defer="" src="/js/media-v4.js?v=4.1.0"></script>  <script defer src="/js/site-v9.js?v=9.0.0"></script>
</body>
</html>
