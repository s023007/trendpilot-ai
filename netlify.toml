[build]
  publish = "."
  ignore = "test \"$BRANCH\" = \"namecheap-migration-v21\""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/comparisons"
  to = "/compare/"
  status = 301

[[redirects]]
  from = "/electronics"
  to = "/products/"
  status = 301

[[redirects]]
  from = "/business"
  to = "/sourcing/"
  status = 301

[[redirects]]
  from = "/marketplaces/*"
  to = "/find/"
  status = 301
  force = true

[[redirects]]
  from = "/compare/joom-vs-aliexpress/*"
  to = "/find/?q=electronics"
  status = 301
  force = true

[[redirects]]
  from = "/compare/geekbuying-vs-aliexpress/*"
  to = "/find/?q=electronics"
  status = 301
  force = true

[[redirects]]
  from = "/how-we-review"
  to = "/editorial-methodology.html"
  status = 301

[functions]
  included_files = ["netlify/functions/_product-data/*.json"]

# TP_PRODUCT_PREVIEW_RUNTIME_V20_9_6_START
[[redirects]]
  from = "/product"
  to = "/find/?engine=v2064"
  status = 301

[[redirects]]
  from = "/product/*"
  to = "/.netlify/functions/product-preview-v20-9-6-mobile-polish?slug=:splat"
  status = 200
  force = true

# Do not expose function source files through the public publish root.
[[redirects]]
  from = "/netlify/functions/*"
  to = "/404.html"
  status = 404
  force = true
# TP_PRODUCT_PREVIEW_RUNTIME_V20_9_6_END

[functions."product-preview-v20-6-8-3"]
  included_files = ["data/shopper-v20-6/runtime-v20-6-8-3.json"]

[functions."product-preview-v20-9-5"]
  included_files = ["data/shopper-v20-6/runtime-v20-6-8-3.json"]

[functions."product-preview-v20-9-6"]
  included_files = ["data/shopper-v20-6/runtime-v20-6-8-3.json"]

[functions."product-preview-v20-9-6-mobile-polish"]
  included_files = ["data/shopper-v20-6/runtime-v20-6-8-3.json"]