[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/affiliate-programs.html"
  to = "/affiliate-disclosure.html"
  status = 301

[[redirects]]
  from = "/verified-trends"
  to = "/trends.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
