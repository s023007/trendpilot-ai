[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/comparisons"
  to = "/compare/"
  status = 301

[[redirects]]
  from = "/electronics"
  to = "/products/"
  status = 301

[[redirects]]
  from = "/business"
  to = "/sourcing/"
  status = 301

[[redirects]]
  from = "/marketplaces/*"
  to = "/find/"
  status = 301
  force = true

[[redirects]]
  from = "/compare/joom-vs-aliexpress/*"
  to = "/find/?q=electronics"
  status = 301
  force = true

[[redirects]]
  from = "/compare/geekbuying-vs-aliexpress/*"
  to = "/find/?q=electronics"
  status = 301
  force = true

[[redirects]]
  from = "/how-we-review"
  to = "/editorial-methodology.html"
  status = 301
