name: TrendPilot Lenovo Feed Inspector V15.5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-lenovo-feed-inspector-v15-5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-lenovo-feeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      ADMITAD_CLIENT_ID_PRIMARY: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_ID_ALT: ${{ secrets.client_id }}
      ADMITAD_CLIENT_SECRET_PRIMARY: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      ADMITAD_CLIENT_SECRET_ALT: ${{ secrets.client_secret }}
      WEBSITE_ID: "2980568"
      TARGET_DOMAIN: trendpilotchoice.com

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Inspect every Lenovo feed and score laptop relevance
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64, csv, gzip, io, json, os, re, socket
          import urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          API = "https://api.admitad.com"
          WEBSITE_ID = int(os.environ["WEBSITE_ID"])
          socket.setdefaulttimeout(40)

          def first_env(*names):
              for n in names:
                  v=(os.environ.get(n) or "").strip()
                  if v:
                      return v
              return ""

          cid = first_env("ADMITAD_CLIENT_ID_PRIMARY","ADMITAD_CLIENT_ID_ALT")
          secret = first_env("ADMITAD_CLIENT_SECRET_PRIMARY","ADMITAD_CLIENT_SECRET_ALT")
          if not cid or not secret:
              raise SystemExit("Missing Admitad credentials.")

          def request(url, method="GET", headers=None, data=None, timeout=40):
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept":"*/*",
                      "User-Agent":"TrendPilot-Lenovo-Feed-Inspector/15.5",
                      **(headers or {})
                  }
              )
              return urllib.request.urlopen(req, timeout=timeout)

          def request_json(url, method="GET", headers=None, data=None):
              with request(url, method, headers, data) as resp:
                  return json.loads(resp.read().decode("utf-8","replace"))

          basic = base64.b64encode(f"{cid}:{secret}".encode()).decode()
          token_body = urllib.parse.urlencode({
              "grant_type":"client_credentials",
              "client_id":cid,
              "scope":"websites advcampaigns_for_website deeplink_generator"
          }).encode()
          token = request_json(
              f"{API}/token/",
              method="POST",
              headers={
                  "Authorization":f"Basic {basic}",
                  "Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"
              },
              data=token_body
          ).get("access_token")
          if not token:
              raise SystemExit("No Admitad access token.")
          auth={"Authorization":f"Bearer {token}"}

          q=urllib.parse.urlencode({
              "limit":200,
              "offset":0,
              "connection_status":"active"
          })
          campaigns=request_json(
              f"{API}/advcampaigns/website/{WEBSITE_ID}/?{q}",
              headers=auth
          ).get("results",[])

          lenovo = None
          for c in campaigns:
              name=str(c.get("name") or "").strip().lower()
              if "lenovo" in name:
                  lenovo = c
                  break

          if not lenovo:
              raise SystemExit("Active Lenovo campaign not found.")

          campaign_id = int(lenovo.get("id") or 0)

          def nk(v):
              return re.sub(r"[^a-z0-9]+","",str(v or "").lower())

          def pick(row, keys):
              m={nk(k):v for k,v in row.items()}
              for key in keys:
                  v=m.get(nk(key))
                  if v not in (None,""):
                      return str(v).strip()
              return ""

          TITLE=["name","title","productname","product","offername"]
          BRAND=["vendor","brand","manufacturer"]
          CATEGORY=["category","categoryname","type","section"]

          laptop_re = re.compile(
              r"\b("
              r"lenovo|thinkpad|ideapad|thinkbook|yoga|legion|loq|"
              r"laptop|notebook"
              r")\b",
              re.I
          )
          non_lenovo_noise = re.compile(
              r"\b("
              r"toy|cosmetic|makeup|shoe|handbag|barber|hydraulic|"
              r"soccer|baby|pet|nail|car kit|teapot|scaffolding|"
              r"cement|dildo|sardine|pergola"
              r")\b",
              re.I
          )

          def stream_csv(url, limit=250):
              with request(url,timeout=45) as resp:
                  raw=resp
                  enc=(resp.headers.get("Content-Encoding") or "").lower()
                  ctype=(resp.headers.get("Content-Type") or "").lower()
                  if "gzip" in enc or "gzip" in ctype or url.lower().endswith(".gz"):
                      raw=gzip.GzipFile(fileobj=resp)
                  text=io.TextIOWrapper(raw,encoding="utf-8-sig",errors="replace",newline="")
                  head=[]
                  for _ in range(25):
                      line=text.readline()
                      if not line: break
                      head.append(line)
                  sample="".join(head)
                  if not sample:
                      return
                  try:
                      dialect=csv.Sniffer().sniff(sample,delimiters=",;\t|")
                  except Exception:
                      dialect=csv.excel
                  reader=csv.DictReader(io.StringIO(sample + text.read(1024*1024)), dialect=dialect)
                  count=0
                  for row in reader:
                      if isinstance(row,dict):
                          yield {str(k or ""):v for k,v in row.items()}
                          count += 1
                          if count >= limit:
                              break

          def stream_xml(url, limit=250):
              with request(url,timeout=45) as resp:
                  count=0
                  for event,elem in ET.iterparse(resp,events=("end",)):
                      tag=str(elem.tag).split("}",1)[-1].lower()
                      if tag not in ("offer","product","item","entry"):
                          continue
                      row={}
                      for child in list(elem):
                          ctag=str(child.tag).split("}",1)[-1]
                          val=(child.text or "").strip()
                          if val:
                              row[ctag]=val
                      if row:
                          yield row
                          count += 1
                      elem.clear()
                      if count >= limit:
                          break

          feed_candidates=[]

          if lenovo.get("products_csv_link"):
              feed_candidates.append({
                  "name":"main-csv",
                  "kind":"csv",
                  "url":lenovo["products_csv_link"],
                  "source":"products_csv_link"
              })
          if lenovo.get("products_xml_link"):
              feed_candidates.append({
                  "name":"main-xml",
                  "kind":"xml",
                  "url":lenovo["products_xml_link"],
                  "source":"products_xml_link"
              })

          for i,f in enumerate(lenovo.get("feeds_info") or [], start=1):
              if not isinstance(f,dict):
                  continue
              fname=str(f.get("name") or f"feed-{i}")
              if f.get("csv_link"):
                  feed_candidates.append({
                      "name":fname,
                      "kind":"csv",
                      "url":f["csv_link"],
                      "source":"feeds_info",
                      "admitad_last_update":f.get("admitad_last_update"),
                      "advertiser_last_update":f.get("advertiser_last_update")
                  })
              if f.get("xml_link"):
                  feed_candidates.append({
                      "name":fname,
                      "kind":"xml",
                      "url":f["xml_link"],
                      "source":"feeds_info",
                      "admitad_last_update":f.get("admitad_last_update"),
                      "advertiser_last_update":f.get("advertiser_last_update")
                  })

          # Dedupe runtime-only URLs.
          unique=[]
          seen=set()
          for f in feed_candidates:
              if f["url"] in seen:
                  continue
              seen.add(f["url"])
              unique.append(f)

          reports=[]

          for idx,f in enumerate(unique, start=1):
              report={
                  "index":idx,
                  "name":f["name"],
                  "kind":f["kind"],
                  "source":f["source"],
                  "admitad_last_update":f.get("admitad_last_update"),
                  "advertiser_last_update":f.get("advertiser_last_update"),
                  "sampled":0,
                  "lenovo_like":0,
                  "laptop_like":0,
                  "noise_like":0,
                  "score":0,
                  "examples":[],
                  "error":""
              }

              try:
                  parser=stream_csv if f["kind"]=="csv" else stream_xml
                  for row in parser(f["url"]):
                      title=pick(row,TITLE)
                      brand=pick(row,BRAND)
                      category=pick(row,CATEGORY)
                      if not title:
                          continue

                      text=f"{title} {brand} {category}"
                      report["sampled"] += 1

                      is_lenovo=bool(re.search(r"\blenovo\b",text,re.I))
                      is_laptop=bool(laptop_re.search(text))
                      is_noise=bool(non_lenovo_noise.search(text))

                      if is_lenovo:
                          report["lenovo_like"] += 1
                      if is_laptop:
                          report["laptop_like"] += 1
                      if is_noise:
                          report["noise_like"] += 1

                      if len(report["examples"]) < 12:
                          report["examples"].append({
                              "title":title[:220],
                              "brand":brand[:80],
                              "category":category[:120],
                              "lenovo_like":is_lenovo,
                              "laptop_like":is_laptop,
                              "noise_like":is_noise
                          })

                  # Strongly reward laptop/Lenovo relevance, penalize obvious unrelated noise.
                  report["score"] = (
                      report["laptop_like"] * 5
                      + report["lenovo_like"] * 3
                      - report["noise_like"] * 4
                  )
              except Exception as exc:
                  report["error"]=str(exc)[:300]
                  report["score"]=-9999

              reports.append(report)

          reports.sort(key=lambda r:(r["score"],r["laptop_like"],r["lenovo_like"]), reverse=True)

          best = reports[0] if reports else None

          result={
              "version":"15.5",
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "website_id":WEBSITE_ID,
              "domain":os.environ["TARGET_DOMAIN"],
              "campaign_id":campaign_id,
              "campaign_name":lenovo.get("name"),
              "feed_count":len(reports),
              "best_feed":best,
              "feeds":reports,
              "safety":{
                  "raw_feed_urls_committed":False,
                  "site_modified":False
              }
          }

          Path("data/diagnostics").mkdir(parents=True,exist_ok=True)
          Path("data/diagnostics/lenovo-feed-inspector-v15-5.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )

          summary=Path("/tmp/lenovo-feed-summary.md")
          with summary.open("w",encoding="utf-8") as fh:
              fh.write("## Lenovo feed inspector V15.5\n\n")
              fh.write(f"- Campaign: **{lenovo.get('name')}**\n")
              fh.write(f"- Campaign ID: **{campaign_id}**\n")
              fh.write(f"- Feeds inspected: **{len(reports)}**\n\n")

              if best:
                  fh.write("### Best candidate feed\n")
                  fh.write(f"- Name: **{best['name']}**\n")
                  fh.write(f"- Format: **{best['kind']}**\n")
                  fh.write(f"- Sampled: **{best['sampled']}**\n")
                  fh.write(f"- Lenovo-like: **{best['lenovo_like']}**\n")
                  fh.write(f"- Laptop-like: **{best['laptop_like']}**\n")
                  fh.write(f"- Noise-like: **{best['noise_like']}**\n")
                  fh.write(f"- Score: **{best['score']}**\n\n")

              fh.write("### All feeds\n")
              for r in reports:
                  fh.write(
                      f"- **{r['name']} ({r['kind']})** — "
                      f"sampled {r['sampled']}, Lenovo {r['lenovo_like']}, "
                      f"laptop {r['laptop_like']}, noise {r['noise_like']}, "
                      f"score {r['score']}"
                  )
                  if r["error"]:
                      fh.write(f" — error: {r['error']}")
                  fh.write("\n")

              if best:
                  fh.write("\n### Best feed sample\n")
                  for ex in best.get("examples") or []:
                      fh.write(
                          f"- {'✅' if ex['laptop_like'] else '•'} "
                          f"{ex['title']}"
                      )
                      if ex["brand"]:
                          fh.write(f" — brand: {ex['brand']}")
                      if ex["category"]:
                          fh.write(f" — category: {ex['category']}")
                      fh.write("\n")

              fh.write("\n### Recommendation\n")
              if not best or best["laptop_like"] == 0:
                  fh.write(
                      "- None of the currently exposed Lenovo feeds produced laptop-like rows in the sample. "
                      "Do not publish the existing Lenovo staged rows. The next step should query Admitad/advertiser "
                      "for a correct product feed or use Lenovo deeplinks without product cards until the feed is corrected.\n"
                  )
              elif best["laptop_like"] < 10:
                  fh.write(
                      "- A usable Lenovo feed exists, but laptop density is low. Rebuild Lenovo by filtering "
                      "the chosen feed for Lenovo laptop model terms before publishing.\n"
                  )
              else:
                  fh.write(
                      "- A strong Lenovo laptop feed exists. Rebuild Lenovo from this feed only and replace "
                      "the incorrect 40-row sample.\n"
                  )

          print(f"Lenovo campaign: {lenovo.get('name')} ({campaign_id})")
          for r in reports:
              print(
                  f"{r['name']} [{r['kind']}]: sampled={r['sampled']} "
                  f"lenovo={r['lenovo_like']} laptop={r['laptop_like']} "
                  f"noise={r['noise_like']} score={r['score']}"
              )
          PY

          cat /tmp/lenovo-feed-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate diagnostics
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import json

          p=Path("data/diagnostics/lenovo-feed-inspector-v15-5.json")
          if not p.exists():
              raise SystemExit("Inspector output missing.")

          d=json.loads(p.read_text(encoding="utf-8"))
          if d.get("website_id") != 2980568:
              raise SystemExit("Wrong website ID.")
          if "lenovo" not in str(d.get("campaign_name") or "").lower():
              raise SystemExit("Wrong campaign.")
          if not d.get("feeds"):
              raise SystemExit("No Lenovo feeds inspected.")

          print("Lenovo feed inspection validated.")
          PY

          git diff --check

      - name: Confirm live site untouched
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            find/index.html \
            js/site-v13-5.js \
            js/product-discovery-v15.js \
            js/seller-whitelist-v14-1-5.js
          do
            if ! git diff --quiet -- "$file"; then
              echo "Safety stop: live file changed unexpectedly: $file"
              exit 1
            fi
          done

      - name: Publish diagnostic report only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/diagnostics/lenovo-feed-inspector-v15-5.json
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Diagnostic report already current."
            exit 0
          fi

          git commit -m "chore: inspect Lenovo feeds for laptop relevance"
          git push origin HEAD:main
