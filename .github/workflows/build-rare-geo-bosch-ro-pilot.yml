name: Build Rare GEO Bosch RO Pilot Landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rare-geo-bosch-ro-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rare-geo-bosch-ro-pilot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build product-matched Romanian landing and paused campaign draft
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,html,re
          from pathlib import Path

          PRODUCT_KEY='aliexpress:2b8a2b92b20569fd6e5c7928'
          src=Path('data/catalog-v19/sellers/aliexpress/products.ndjson')
          product=None
          with src.open('r',encoding='utf-8',errors='replace') as f:
            for line in f:
              try:o=json.loads(line)
              except:continue
              if o.get('productKey')==PRODUCT_KEY:
                product=o;break
          if not product: raise SystemExit('Safety stop: exact Bosch product missing from catalog')

          name=(product.get('name') or {}).get('display') if isinstance(product.get('name'),dict) else str(product.get('name') or '')
          offer=product.get('offer') or {}
          price=offer.get('price')
          currency=offer.get('currency') or 'USD'
          links=product.get('links') or {}
          affiliate=links.get('destinationUrl') or links.get('affiliateUrl') or ''
          if not affiliate or 'rzekl.com/' not in affiliate:
            raise SystemExit('Safety stop: expected tracked affiliate destination missing')

          def strings(v):
            if isinstance(v,str): return [v]
            if isinstance(v,dict):
              out=[]
              for x in v.values(): out+=strings(x)
              return out
            if isinstance(v,list):
              out=[]
              for x in v: out+=strings(x)
              return out
            return []
          image=''
          for k in ('images','image','media'):
            for s in strings(product.get(k)):
              if re.match(r'^https?://',s) and re.search(r'\.(?:jpg|jpeg|png|webp)(?:\?|$)',s,re.I):
                image=s;break
            if image:break
          if not image:
            for s in strings(product):
              if re.match(r'^https?://',s) and re.search(r'\.(?:jpg|jpeg|png|webp)(?:\?|$)',s,re.I):
                image=s;break

          path=Path('rare-products/bosch-gbh2-chuck/ro')
          path.mkdir(parents=True,exist_ok=True)
          img_html=f'<img class="product-img" src="{html.escape(image,quote=True)}" alt="Piesă mandrină SDS compatibilă GBH2-20 GBH2-24 GBH2-26" loading="eager">' if image else '<div class="product-placeholder">GBH2-20 / GBH2-24 / GBH2-26</div>'
          price_text=f'{price:g} {currency}' if isinstance(price,(int,float)) else 'Verifică prețul actual'

          page=f'''<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandrină SDS compatibilă GBH2-20 / GBH2-24 / GBH2-26 | TrendPilot</title>
<meta name="description" content="Verifică o piesă de schimb tip mandrină/nas SDS compatibilă cu GBH2-20, GBH2-24 și GBH2-26. Vezi prețul și livrarea actuală la vânzător.">
<link rel="canonical" href="https://trendpilotchoice.com/rare-products/bosch-gbh2-chuck/ro/">
<meta name="robots" content="index,follow,max-image-preview:large">
<style>
:root{{--bg:#07111f;--card:#0f1d31;--ink:#f7fbff;--muted:#a9bad0;--line:#243852;--accent:#62d7a3;--accent2:#8ab8ff}}
*{{box-sizing:border-box}}body{{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#06101c,#0a1627 45%,#07111f);color:var(--ink);line-height:1.55}}
a{{color:inherit}}.wrap{{width:min(1100px,92%);margin:auto}}header{{padding:18px 0;border-bottom:1px solid var(--line)}}.brand{{font-weight:850;letter-spacing:.2px}}.hero{{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding:54px 0 34px}}.eyebrow{{display:inline-block;padding:7px 11px;border:1px solid #31506e;border-radius:999px;color:#cfe7ff;font-size:.84rem;margin-bottom:14px}}h1{{font-size:clamp(2rem,5vw,4.2rem);line-height:1.02;margin:0 0 18px;letter-spacing:-.04em}}.lead{{color:var(--muted);font-size:1.08rem;max-width:680px}}.card{{background:linear-gradient(180deg,#11233a,#0d1a2c);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 22px 70px #0006}}.product-img{{display:block;width:100%;max-height:390px;object-fit:contain;background:#fff;border-radius:16px}}.product-placeholder{{min-height:280px;display:grid;place-items:center;text-align:center;border-radius:16px;background:#142842;font-size:1.35rem;font-weight:800;padding:20px}}.price{{font-size:1.65rem;font-weight:900;margin:18px 0 5px}}.small{{font-size:.86rem;color:var(--muted)}}.cta{{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#062116;padding:15px 18px;border-radius:14px;font-weight:900;margin-top:18px}}.cta:hover{{filter:brightness(1.05)}}.trust{{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}}.trust div{{border:1px solid var(--line);border-radius:15px;padding:14px;background:#0b192a;color:#cbd9e9;font-size:.92rem}}section{{padding:28px 0}}h2{{font-size:1.55rem;margin:0 0 14px}}ul{{padding-left:20px;color:#d8e4f2}}.warning{{border-left:4px solid #e7b65c;background:#171b24;padding:16px 18px;border-radius:10px;color:#e9edf4}}.seller{{display:flex;justify-content:space-between;gap:18px;align-items:center;border-top:1px solid var(--line);padding-top:20px;margin-top:20px}}footer{{color:#8296ad;font-size:.82rem;padding:40px 0 55px;border-top:1px solid var(--line);margin-top:34px}}@media(max-width:760px){{.hero{{grid-template-columns:1fr;padding-top:34px}}.trust{{grid-template-columns:1fr}}h1{{font-size:2.45rem}}.seller{{display:block}}}}
</style>
</head>
<body>
<header><div class="wrap brand">TrendPilot Choice</div></header>
<main class="wrap">
<div class="hero">
<div>
<span class="eyebrow">Piesă de schimb • căutare după model</span>
<h1>Mandrină SDS compatibilă GBH2‑20 / GBH2‑24 / GBH2‑26</h1>
<p class="lead">Dacă ai ajuns aici căutând exact o piesă pentru modelele GBH2‑20, GBH2‑24 sau GBH2‑26, verifică înainte de comandă modelul sculei și forma piesei. Pagina vânzătorului îți arată prețul și opțiunile de livrare disponibile în momentul cumpărării.</p>
<div class="trust"><div><b>Potrivire precisă</b><br>Modelele sunt afișate explicit.</div><div><b>Link direct</b><br>Butonul duce la produs, nu la o categorie generală.</div><div><b>Fără preț inventat</b><br>Prețul final se confirmă la vânzător.</div></div>
</div>
<div class="card">{img_html}<div class="price">Catalog: {html.escape(price_text)}</div><div class="small">Prețul, stocul, taxele și livrarea se pot schimba. Verifică valorile finale pe AliExpress.</div><a class="cta" href="{html.escape(affiliate,quote=True)}" rel="sponsored nofollow noopener" target="_blank" data-seller="AliExpress" data-product-key="{PRODUCT_KEY}">Verifică prețul și livrarea →</a></div>
</div>
<section><h2>Verifică înainte să comanzi</h2><ul><li>Modelul sculei: GBH2‑20, GBH2‑24 sau GBH2‑26.</li><li>Tipul de mandrină/nas SDS și forma piesei existente.</li><li>Fotografiile și dimensiunile de pe pagina vânzătorului.</li><li>Costul și termenul de livrare către adresa ta din România.</li></ul></section>
<section><div class="warning"><b>Important:</b> aceasta este o piesă de schimb listată ca fiind compatibilă; TrendPilot nu afirmă că este o piesă Bosch originală. Bosch este marcă a proprietarului său. Verifică compatibilitatea înainte de achiziție.</div></section>
<section class="seller"><div><h2 style="margin-bottom:4px">Ai modelul corect?</h2><div class="small">Deschide oferta și confirmă compatibilitatea, stocul și livrarea.</div></div><a class="cta" style="min-width:260px;margin:0" href="{html.escape(affiliate,quote=True)}" rel="sponsored nofollow noopener" target="_blank" data-seller="AliExpress" data-product-key="{PRODUCT_KEY}">Vezi oferta actuală →</a></section>
</main>
<footer><div class="wrap">TrendPilot poate primi comision dacă achiziționezi printr-un link afiliat, fără cost suplimentar pentru tine. Informațiile comerciale se verifică întotdeauna pe pagina vânzătorului.</div></footer>
<script>
document.addEventListener('click',function(e){{const a=e.target.closest('a[data-seller]');if(!a)return;try{{navigator.sendBeacon('/api/event',new Blob([JSON.stringify({{event:'seller_outbound_click',seller:a.dataset.seller,product_key:a.dataset.productKey,path:location.pathname,ts:new Date().toISOString()}})],{{type:'application/json'}}))}}catch(_){{}}}})
</script>
</body></html>'''
          (path/'index.html').write_text(page,encoding='utf-8')

          campaign={{
            'version':'1.0','status':'PAUSED_DRAFT','created_at':'2026-08-29',
            'campaign_name':'TrendPilot | RO | GBH2 Chuck | Search | Pilot',
            'seller':'AliExpress WW','product_key':PRODUCT_KEY,
            'landing_page':'https://trendpilotchoice.com/rare-products/bosch-gbh2-chuck/ro/',
            'geo':{{'country':'Romania','country_code':'RO','presence_only':True}},
            'languages':['Romanian','English'],
            'network':{{'google_search':True,'search_partners':False,'display':False}},
            'bidding':{{'strategy':'MANUAL_CPC','initial_max_cpc_usd':0.15,'probe_ceiling_usd':0.25,'enhanced_cpc':False}},
            'budget':{{'planned_daily_usd':2.0,'launch_status':'DO_NOT_ENABLE_YET','shares_existing_experiment_cap':True}},
            'keywords':[
              {{'text':'bosch gbh2-26 chuck replacement','match':'EXACT'}},
              {{'text':'bosch gbh2-24 chuck replacement','match':'EXACT'}},
              {{'text':'bosch gbh2-20 chuck replacement','match':'EXACT'}},
              {{'text':'bosch gbh 2-26 mandrina sds','match':'EXACT'}},
              {{'text':'gbh2-26 mandrina sds','match':'EXACT'}},
              {{'text':'gbh2-24 mandrina sds','match':'EXACT'}},
              {{'text':'bosch gbh2-26 chuck','match':'PHRASE'}},
              {{'text':'gbh2-26 sds chuck','match':'PHRASE'}}
            ],
            'negative_keywords':['aliexpress','manual','pdf','schema','diagram','youtube','tutorial','repair service','service center','free'],
            'rsa':{{
              'headlines':['GBH2-26 SDS Chuck Part','GBH2-24 Replacement Chuck','GBH2-20 Compatible Part','Check Fit Before Ordering','Direct Product Offer'],
              'descriptions':['Replacement SDS chuck/nose part listed for GBH2-20, GBH2-24 and GBH2-26. Check current price and delivery.','Verify model fit, product photos and Romania delivery on the seller page before ordering.']
            }},
            'conversion':'seller_outbound_click',
            'launch_gates':['affiliate program active','Google Ads traffic allowed','advertiser-brand bidding excluded','exact product affiliate link resolves','landing page returns HTTP 200','Romania commission GEO eligible','Romania delivery must be confirmed before enable','ticket campaign budget guard preserved']
          }}
          out=Path('marketing/google-ads/rare-geo-products')
          out.mkdir(parents=True,exist_ok=True)
          (out/'bosch-gbh2-chuck-ro-pilot.json').write_text(json.dumps(campaign,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Built landing:',path/'index.html')
          print('Built paused campaign draft:',out/'bosch-gbh2-chuck-ro-pilot.json')
          print('Affiliate link source verified from exact V19 product record; URL not printed.')
          PY
          git diff --check
      - name: Commit generated pilot assets only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rare-products/bosch-gbh2-chuck/ro/index.html marketing/google-ads/rare-geo-products/bosch-gbh2-chuck-ro-pilot.json
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "feat: add paused Romania GBH2 rare-product pilot"
          git push origin HEAD:main
