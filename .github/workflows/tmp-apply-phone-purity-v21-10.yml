name: Temporary Phone Purity Runtime Patcher

on:
  push:
    branches: [fix/phone-purity-v21-10]
    paths:
      - '.github/workflows/tmp-apply-phone-purity-v21-10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Apply strict generic phone discovery
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          p=Path('js/universal-discovery-v20-9-1.js')
          s=p.read_text(encoding='utf-8')

          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('missing patch target: '+old[:160])
              s=s.replace(old,new,1)

          rep('const RUNTIME_VERSION = "21.9.0";','const RUNTIME_VERSION = "21.10.1";')

          old='''  async function sellerFamilySamples(){\n    if(!genericFamily||!family)return{};\n    const data=await fetchJSON(`/data/v20-9/seller-family-samples.json?v=${DATA_VERSION}`);\n    const fm=data?.families?.[family]||{};\n    state.sellerSamples=fm;\n    state.sellerUniverse=Object.keys(fm).filter(s=>!BLOCK.has(L(s))).sort((a,b)=>a.localeCompare(b));\n    return fm;\n  }\n'''
          new='''  async function sellerFamilySamples(){\n    if(!genericFamily||!family)return{};\n    let fm={};\n    if(family==="phone"){\n      const data=await fetchJSON(`/data/v20-9/phone-device-samples.json?v=21.10.1`);\n      fm=data?.sellers||{};\n    }else{\n      const data=await fetchJSON(`/data/v20-9/seller-family-samples.json?v=${DATA_VERSION}`);\n      fm=data?.families?.[family]||{};\n    }\n    state.sellerSamples=fm;\n    state.sellerUniverse=Object.keys(fm).filter(s=>!BLOCK.has(L(s))).sort((a,b)=>a.localeCompare(b));\n    return fm;\n  }\n'''
          rep(old,new)

          old='''  async function candidates(samples={}){\n    const seed=balancedSampleIds(samples,4),groups=[];\n'''
          new='''  async function candidates(samples={}){\n    if(genericFamily&&family==="phone"&&Object.keys(samples).length){\n      return unique(Object.values(samples).flat()).slice(0,600);\n    }\n    const seed=balancedSampleIds(samples,4),groups=[];\n'''
          rep(old,new)

          p.write_text(s,encoding='utf-8')

          f=Path('find/index.html')
          h=f.read_text(encoding='utf-8')
          old='/js/universal-discovery-v20-9-1.js?v=21.9.0'
          if old not in h: raise SystemExit('finder runtime cache target missing')
          h=h.replace(old,'/js/universal-discovery-v20-9-1.js?v=21.10.1',1)
          f.write_text(h,encoding='utf-8')
          PY

          node --check js/universal-discovery-v20-9-1.js
          python <<'PY'
          import json
          from pathlib import Path
          s=Path('js/universal-discovery-v20-9-1.js').read_text(encoding='utf-8')
          f=Path('find/index.html').read_text(encoding='utf-8')
          x=json.loads(Path('data/v20-9/phone-device-samples.json').read_text(encoding='utf-8'))
          assert 'RUNTIME_VERSION = "21.10.1"' in s
          assert 'phone-device-samples.json?v=21.10.1' in s
          assert 'genericFamily&&family==="phone"' in s
          assert 'universal-discovery-v20-9-1.js?v=21.10.1' in f
          sellers=set(x['sellers'])
          assert {'Alibaba','AliExpress','Geekbuying','TikTok Shop US'}.issubset(sellers)
          assert 'Sunsky-online WW' not in sellers
          assert 'Govee Many GEOs' not in sellers
          assert len(x['sellers']['AliExpress'])==1
          print('Strict phone runtime patch PASS', {k:len(v) for k,v in x['sellers'].items()})
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/universal-discovery-v20-9-1.js find/index.html
          git commit -m 'Keep generic phone search to genuine phone devices'
          git push origin HEAD:fix/phone-purity-v21-10
