      - name: Validate V16 before publish
        shell: bash
        run: |
          set -euo pipefail
          node --check js/product-search-v16.js
          python - <<'PY'
          from pathlib import Path
          import json

          page = Path("find/index.html").read_text(encoding="utf-8")
          js = Path("js/product-search-v16.js").read_text(encoding="utf-8")
          approved = json.loads(Path("data/approved-product-sellers-v16.json").read_text(encoding="utf-8"))["sellers"]

          required_sellers = [
              "AliExpress","Alibaba","Geekbuying","Lenovo","Joom",
              "Diecast","FragranceShop.com","Karaca EU","MFI Medical","PandaHall","Temu"
          ]
          if approved != required_sellers:
              raise SystemExit("Approved seller registry is incorrect.")
          if page.count("TP_V16_PRODUCT_SEARCH_START") != 1:
              raise SystemExit("V16 HTML block is missing or duplicated.")
          if "/js/product-search-v16.js?v=16.0.0" not in page:
              raise SystemExit("V16 JS is not installed on Find.")
          if "/css/product-search-v16.css?v=16.0.0" not in page:
              raise SystemExit("V16 CSS is not installed on Find.")
          for needle in ["power bank","phone cases","pens","pencils","Joom","Temu","balanced(rows","federatedSearch"]:
              if needle not in js:
                  raise SystemExit(f"Required V16 search feature is missing: {needle}")
          if "site-v13-5.js" not in page:
              raise SystemExit("Existing product baseline was unexpectedly removed.")
          print("V16 validation passed.")
          PY
          git diff --check

      - name: Publish V16 safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            "find/index.html"
            "js/product-search-v16.js"
            "css/product-search-v16.css"
            "data/approved-product-sellers-v16.json"
            "data/product-search-v16-report.json"
          )

          git add -- "${files[@]}"
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V16 is already installed."
            exit 0
          fi

          git commit -m "feat: install V16 federated product search engine"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "TrendPilot V16 Product Search Engine published successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed because main may have changed."
            if [[ "$attempt" -lt 3 ]]; then
              git pull --rebase origin main
              sleep $((attempt * 2))
            fi
          done

          echo "Unable to publish after three attempts."
          exit 1
