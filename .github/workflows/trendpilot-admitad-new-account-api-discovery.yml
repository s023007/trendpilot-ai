name: TrendPilot Admitad New Account API Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-admitad-new-account-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-admitad:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      ADMITAD_CLIENT_ID_PRIMARY: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_ID_ALT: ${{ secrets.client_id }}
      ADMITAD_CLIENT_SECRET_PRIMARY: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      ADMITAD_CLIENT_SECRET_ALT: ${{ secrets.client_secret }}
      TARGET_DOMAIN: trendpilotchoice.com

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Discover new Admitad ad space and programs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          API = "https://api.admitad.com"
          TARGET = (os.environ.get("TARGET_DOMAIN") or "trendpilotchoice.com").strip().lower()

          def first_env(*names):
              for name in names:
                  value = (os.environ.get(name) or "").strip()
                  if value:
                      return value
              return ""

          client_id = first_env("ADMITAD_CLIENT_ID_PRIMARY", "ADMITAD_CLIENT_ID_ALT")
          client_secret = first_env("ADMITAD_CLIENT_SECRET_PRIMARY", "ADMITAD_CLIENT_SECRET_ALT")

          if not client_id:
              raise SystemExit("Missing Admitad client_id. Save it as ADMITAD_CLIENT_ID or client_id.")
          if not client_secret:
              raise SystemExit("Missing Admitad client_secret. Save it as ADMITAD_CLIENT_SECRET or client_secret.")

          def request_json(url, method="GET", headers=None, data=None, tries=3):
              headers = dict(headers or {})
              last = None
              for attempt in range(1, tries + 1):
                  req = urllib.request.Request(
                      url,
                      data=data,
                      method=method,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "TrendPilot-Admitad-New-Account/1.0",
                          **headers,
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          return json.loads(response.read().decode("utf-8", errors="replace"))
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")[:1200]
                      last = RuntimeError(f"HTTP {exc.code}: {body}")
                      if exc.code in (400, 401, 403, 404):
                          break
                  except Exception as exc:
                      last = exc
                  if attempt < tries:
                      time.sleep(attempt * 2)
              raise RuntimeError(str(last or "Admitad request failed"))

          basic = base64.b64encode(f"{client_id}:{client_secret}".encode()).decode()
          scopes = "websites advcampaigns_for_website deeplink_generator"
          token_body = urllib.parse.urlencode(
              {
                  "grant_type": "client_credentials",
                  "client_id": client_id,
                  "scope": scopes,
              }
          ).encode()

          token_payload = request_json(
              f"{API}/token/",
              method="POST",
              headers={
                  "Authorization": f"Basic {basic}",
                  "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
              },
              data=token_body,
          )

          token = str(token_payload.get("access_token") or "").strip()
          if not token:
              raise SystemExit("Admitad did not return access_token. Check credentials and API scopes.")

          auth = {"Authorization": f"Bearer {token}"}

          websites_payload = request_json(f"{API}/websites/v2/", headers=auth)
          websites = websites_payload.get("results", []) if isinstance(websites_payload, dict) else (websites_payload or [])

          def host_of(value):
              value = str(value or "").strip()
              if not value:
                  return ""
              if "://" not in value:
                  value = "https://" + value
              try:
                  host = (urlparse(value).hostname or "").lower()
              except Exception:
                  host = ""
              return host[4:] if host.startswith("www.") else host

          matches = []
          for site in websites:
              if not isinstance(site, dict):
                  continue
              site_host = host_of(site.get("site_url") or site.get("url"))
              name = str(site.get("name") or "").lower()
              if site_host == TARGET or TARGET in name:
                  matches.append(site)

          if not matches:
              print("Returned Admitad ad spaces:")
              for site in websites:
                  if isinstance(site, dict):
                      print(
                          f"- id={site.get('id')} | name={site.get('name')} | "
                          f"url={site.get('site_url') or site.get('url')} | status={site.get('status')}"
                      )
              raise SystemExit(f"No Admitad ad space matched {TARGET}.")

          matches.sort(
              key=lambda x: (
                  0 if host_of(x.get("site_url") or x.get("url")) == TARGET else 1,
                  0 if str(x.get("status") or "").lower() == "active" else 1,
                  int(x.get("id") or 0),
              )
          )
          website = matches[0]
          website_id = int(website["id"])

          def fetch_campaigns(status):
              rows = []
              offset = 0
              limit = 200
              while True:
                  qs = urllib.parse.urlencode(
                      {"limit": limit, "offset": offset, "connection_status": status}
                  )
                  payload = request_json(
                      f"{API}/advcampaigns/website/{website_id}/?{qs}",
                      headers=auth,
                  )
                  batch = payload.get("results") if isinstance(payload, dict) else []
                  batch = batch or []
                  rows.extend(batch)
                  if len(batch) < limit:
                      break
                  offset += limit
                  if offset > 5000:
                      break
              return rows

          active = fetch_campaigns("active")
          pending = fetch_campaigns("pending")
          declined = fetch_campaigns("declined")

          def safe_program(row):
              feeds = row.get("feeds_info") or []
              feed_meta = []
              if isinstance(feeds, list):
                  for feed in feeds:
                      if not isinstance(feed, dict):
                          continue
                      feed_meta.append(
                          {
                              "name": feed.get("name"),
                              "admitad_last_update": feed.get("admitad_last_update"),
                              "advertiser_last_update": feed.get("advertiser_last_update"),
                              "has_xml": bool(feed.get("xml_link")),
                              "has_csv": bool(feed.get("csv_link")),
                          }
                      )
              return {
                  "id": row.get("id"),
                  "name": row.get("name"),
                  "status": row.get("status"),
                  "connection_status": row.get("connection_status") or row.get("status"),
                  "allow_deeplink": bool(row.get("allow_deeplink")),
                  "show_products_links": bool(row.get("show_products_links")),
                  "has_products_xml": bool(row.get("products_xml_link")),
                  "has_products_csv": bool(row.get("products_csv_link")),
                  "feeds": feed_meta,
                  "action_countries": row.get("action_countries"),
              }

          safe_active = [safe_program(x) for x in active if isinstance(x, dict)]
          safe_pending = [safe_program(x) for x in pending if isinstance(x, dict)]
          safe_declined = [safe_program(x) for x in declined if isinstance(x, dict)]

          report = {
              "version": "1.0",
              "source": "Admitad API — new account",
              "target_domain": TARGET,
              "website": {
                  "id": website_id,
                  "name": website.get("name"),
                  "site_url": website.get("site_url") or website.get("url"),
                  "status": website.get("status"),
                  "validation_passed": website.get("validation_passed"),
              },
              "counts": {
                  "active": len(safe_active),
                  "pending": len(safe_pending),
                  "declined": len(safe_declined),
                  "active_with_products": sum(
                      1 for x in safe_active
                      if x["show_products_links"] or x["has_products_xml"] or x["has_products_csv"] or x["feeds"]
                  ),
                  "active_with_deeplink": sum(1 for x in safe_active if x["allow_deeplink"]),
              },
              "active_programs": safe_active,
              "pending_programs": safe_pending,
              "declined_programs": safe_declined,
              "safety": {
                  "access_token_persisted": False,
                  "client_secret_persisted": False,
                  "raw_feed_urls_persisted": False,
                  "old_account_modified": False,
                  "site_modified": False,
              },
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/admitad-new-account-api.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Matched ad space: {website_id} — {website.get('site_url') or website.get('name')}")
          print(f"Active programs: {len(safe_active)}")
          print(f"Pending programs: {len(safe_pending)}")
          print(f"Declined programs: {len(safe_declined)}")
          print("Active programs:")
          for row in safe_active:
              tools = []
              if row["show_products_links"] or row["has_products_xml"] or row["has_products_csv"] or row["feeds"]:
                  tools.append("products")
              if row["allow_deeplink"]:
                  tools.append("deeplink")
              print(f"- {row['name']} [{', '.join(tools) or 'no product/deeplink tool'}]")

          summary = Path("/tmp/admitad-summary.md")
          with summary.open("w", encoding="utf-8") as handle:
              handle.write("## Admitad new account API discovery\n\n")
              handle.write(f"- Domain: **{TARGET}**\n")
              handle.write(f"- Ad Space ID: **{website_id}**\n")
              handle.write(f"- Ad Space status: **{website.get('status')}**\n")
              handle.write(f"- Active programs: **{len(safe_active)}**\n")
              handle.write(f"- Pending programs: **{len(safe_pending)}**\n")
              handle.write(f"- Declined programs: **{len(safe_declined)}**\n")
              handle.write(f"- Active programs with product feeds: **{report['counts']['active_with_products']}**\n")
              handle.write(f"- Active programs with Deeplink: **{report['counts']['active_with_deeplink']}**\n\n")
              handle.write("### Active programs\n")
              for row in safe_active:
                  tools = []
                  if row["show_products_links"] or row["has_products_xml"] or row["has_products_csv"] or row["feeds"]:
                      tools.append("products")
                  if row["allow_deeplink"]:
                      tools.append("deeplink")
                  handle.write(
                      f"- **{row['name']}** — "
                      + (", ".join(tools) if tools else "no product/deeplink tool exposed by API")
                      + "\n"
                  )
          PY

          cat /tmp/admitad-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate safe discovery output
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/admitad-new-account-api.json")
          if not path.exists():
              raise SystemExit("Discovery report was not generated.")

          data = json.loads(path.read_text(encoding="utf-8"))

          if data.get("target_domain") != "trendpilotchoice.com":
              raise SystemExit("Wrong target domain.")

          website = data.get("website") or {}
          if not website.get("id"):
              raise SystemExit("Admitad Ad Space ID was not discovered.")

          safety = data.get("safety") or {}
          for key in (
              "access_token_persisted",
              "client_secret_persisted",
              "raw_feed_urls_persisted",
              "old_account_modified",
              "site_modified",
          ):
              if safety.get(key) is not False:
                  raise SystemExit(f"Safety flag is not false: {key}")

          print("Safe Admitad API discovery validated.")
          PY

          git diff --check

      - name: Publish discovery report only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/admitad-new-account-api.json
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Discovery report is already current."
            exit 0
          fi

          git commit -m "chore: discover new Admitad API programs"
          git push origin HEAD:main
