name: TrendPilot Admitad Product Feeds V15.3 Staging

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-admitad-products-v15-3-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-admitad-products:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      ADMITAD_CLIENT_ID_PRIMARY: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_ID_ALT: ${{ secrets.client_id }}
      ADMITAD_CLIENT_SECRET_PRIMARY: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      ADMITAD_CLIENT_SECRET_ALT: ${{ secrets.client_secret }}
      WEBSITE_ID: "2980568"
      TARGET_DOMAIN: trendpilotchoice.com
      MAX_PRODUCTS_PER_SELLER: "300"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Build staged product catalog from Admitad API feeds
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import base64
          import csv
          import gzip
          import io
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          API = "https://api.admitad.com"
          WEBSITE_ID = int(os.environ["WEBSITE_ID"])
          MAX_PER_SELLER = int(os.environ["MAX_PRODUCTS_PER_SELLER"])

          def env(*names):
              for name in names:
                  value = (os.environ.get(name) or "").strip()
                  if value:
                      return value
              return ""

          cid = env("ADMITAD_CLIENT_ID_PRIMARY", "ADMITAD_CLIENT_ID_ALT")
          secret = env("ADMITAD_CLIENT_SECRET_PRIMARY", "ADMITAD_CLIENT_SECRET_ALT")
          if not cid or not secret:
              raise SystemExit("Missing Admitad client_id/client_secret.")

          def request(url, *, method="GET", headers=None, data=None, timeout=90):
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "User-Agent": "TrendPilot-Admitad-Products/15.3",
                      "Accept": "*/*",
                      **(headers or {}),
                  },
              )
              return urllib.request.urlopen(req, timeout=timeout)

          def request_json(url, *, method="GET", headers=None, data=None):
              with request(url, method=method, headers=headers, data=data) as resp:
                  return json.loads(resp.read().decode("utf-8", "replace"))

          basic = base64.b64encode(f"{cid}:{secret}".encode()).decode()
          token_body = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": cid,
              "scope": "websites advcampaigns_for_website deeplink_generator",
          }).encode()

          token_payload = request_json(
              f"{API}/token/",
              method="POST",
              headers={
                  "Authorization": f"Basic {basic}",
                  "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
              },
              data=token_body,
          )
          token = str(token_payload.get("access_token") or "").strip()
          if not token:
              raise SystemExit("Admitad access token was not returned.")
          auth = {"Authorization": f"Bearer {token}"}

          # Get only ACTIVE campaigns for the new TrendPilot ad space.
          q = urllib.parse.urlencode({
              "limit": 200,
              "offset": 0,
              "connection_status": "active",
          })
          campaign_payload = request_json(
              f"{API}/advcampaigns/website/{WEBSITE_ID}/?{q}",
              headers=auth,
          )
          campaigns = campaign_payload.get("results", []) if isinstance(campaign_payload, dict) else []

          bridge = json.loads(
              Path("data/approved-product-sellers-v15-bridge.json").read_text(encoding="utf-8")
          )
          bridge_campaign_ids = {
              int(row["campaign_id"])
              for row in bridge.get("sellers") or []
              if isinstance(row, dict)
              and row.get("network") == "Admitad"
              and row.get("approved") is True
              and row.get("campaign_id")
          }

          selected = []
          for c in campaigns:
              if not isinstance(c, dict):
                  continue
              cid_int = int(c.get("id") or 0)
              if cid_int not in bridge_campaign_ids:
                  continue
              if str(c.get("connection_status") or c.get("status") or "").lower() != "active":
                  continue
              if not (
                  c.get("products_csv_link")
                  or c.get("products_xml_link")
                  or c.get("feeds_info")
              ):
                  continue
              selected.append(c)

          def key_norm(value):
              return re.sub(r"[^a-z0-9]+", "", str(value or "").lower())

          title_keys = ["name","title","productname","product","offername"]
          url_keys = ["url","producturl","deeplink","link","landingpage","productlink"]
          image_keys = ["picture","image","imageurl","pictureurl","img","photo","thumbnail"]
          price_keys = ["price","currentprice","saleprice","finalprice","amount"]
          old_price_keys = ["oldprice","priceold","originalprice","regularprice"]
          currency_keys = ["currency","currencyid","currencycode"]
          id_keys = ["id","offerid","productid","sku","article","vendorcode"]
          category_keys = ["category","categoryname","type","section"]
          brand_keys = ["vendor","brand","manufacturer"]

          def pick(row, candidates):
              normalized = {key_norm(k): v for k, v in row.items()}
              for key in candidates:
                  value = normalized.get(key_norm(key))
                  if value not in (None, ""):
                      return str(value).strip()
              return ""

          def number(value):
              text = str(value or "").strip().replace("\u00a0", " ")
              m = re.search(r"-?\d+(?:[.,]\d+)?", text.replace(" ", ""))
              if not m:
                  return None
              try:
                  return float(m.group(0).replace(",", "."))
              except Exception:
                  return None

          def unpack(raw, source_url):
              lower = source_url.lower()
              if raw[:2] == b"\x1f\x8b" or lower.endswith(".gz"):
                  return gzip.decompress(raw)
              if raw[:4] == b"PK\x03\x04" or lower.endswith(".zip"):
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      names = [n for n in z.namelist() if not n.endswith("/")]
                      if not names:
                          return b""
                      return z.read(names[0])
              return raw

          def download_feed(url):
              # Staging safety cap: 80 MB compressed/downloaded.
              cap = 80 * 1024 * 1024
              chunks = []
              total = 0
              with request(url, timeout=120) as resp:
                  while True:
                      chunk = resp.read(1024 * 1024)
                      if not chunk:
                          break
                      total += len(chunk)
                      if total > cap:
                          raise RuntimeError("feed exceeds 80 MB staging cap")
                      chunks.append(chunk)
              return unpack(b"".join(chunks), url)

          def parse_csv(raw):
              text = raw.decode("utf-8-sig", "replace")
              sample = text[:10000]
              try:
                  dialect = csv.Sniffer().sniff(sample, delimiters=",;\t|")
              except Exception:
                  dialect = csv.excel
              reader = csv.DictReader(io.StringIO(text), dialect=dialect)
              for row in reader:
                  if isinstance(row, dict):
                      yield {str(k or ""): v for k, v in row.items()}

          def strip_tag(tag):
              return str(tag).split("}", 1)[-1]

          def parse_xml(raw):
              stream = io.BytesIO(raw)
              for event, elem in ET.iterparse(stream, events=("end",)):
                  tag = strip_tag(elem.tag).lower()
                  # Common product/offer/item nodes.
                  if tag not in ("offer", "product", "item", "entry"):
                      continue
                  row = {}
                  for child in list(elem):
                      ctag = strip_tag(child.tag)
                      value = (child.text or "").strip()
                      if value:
                          row[ctag] = value
                      # Some feeds keep URLs in attributes.
                      for ak, av in child.attrib.items():
                          if av:
                              row[f"{ctag}_{strip_tag(ak)}"] = av
                  for ak, av in elem.attrib.items():
                      row[strip_tag(ak)] = av
                  if row:
                      yield row
                  elem.clear()

          def normalize_product(row, campaign):
              title = pick(row, title_keys)
              dest = pick(row, url_keys)
              if not title or not dest or not dest.startswith(("http://", "https://")):
                  return None
              image = pick(row, image_keys)
              price = number(pick(row, price_keys))
              old_price = number(pick(row, old_price_keys))
              return {
                  "source_id": pick(row, id_keys),
                  "title": title[:300],
                  "seller": str(campaign.get("name") or "").strip(),
                  "campaign_id": int(campaign.get("id") or 0),
                  "destination_url": dest,
                  "image": image if image.startswith(("http://", "https://")) else "",
                  "price": price,
                  "old_price": old_price,
                  "currency": pick(row, currency_keys)[:12],
                  "category": pick(row, category_keys)[:160],
                  "brand": pick(row, brand_keys)[:100],
                  "network": "Admitad",
              }

          def feed_candidates(c):
              found = []
              # Prefer CSV because it is faster/cheaper to parse in Actions.
              if c.get("products_csv_link"):
                  found.append(("csv", c["products_csv_link"]))
              for f in c.get("feeds_info") or []:
                  if isinstance(f, dict) and f.get("csv_link"):
                      found.append(("csv", f["csv_link"]))
              if c.get("products_xml_link"):
                  found.append(("xml", c["products_xml_link"]))
              for f in c.get("feeds_info") or []:
                  if isinstance(f, dict) and f.get("xml_link"):
                      found.append(("xml", f["xml_link"]))
              # Dedupe runtime-only URLs.
              seen = set()
              result = []
              for kind, url in found:
                  if url and url not in seen:
                      seen.add(url)
                      result.append((kind, url))
              return result

          def make_deeplinks(campaign_id, products):
              # Official API accepts up to 200 ulp values per request.
              output = []
              for start in range(0, len(products), 150):
                  batch = products[start:start+150]
                  params = [("ulp", p["destination_url"]) for p in batch]
                  params.append(("subid", "products"))
                  query = urllib.parse.urlencode(params)
                  try:
                      payload = request_json(
                          f"{API}/deeplink/{WEBSITE_ID}/advcampaign/{campaign_id}/?{query}",
                          headers=auth,
                      )
                  except Exception as exc:
                      print(f"Deeplink warning for campaign {campaign_id}: {exc}")
                      output.extend([None] * len(batch))
                      continue

                  if not isinstance(payload, list):
                      output.extend([None] * len(batch))
                      continue

                  links = [
                      item.get("link") if isinstance(item, dict) else None
                      for item in payload
                  ]
                  if len(links) < len(batch):
                      links.extend([None] * (len(batch) - len(links)))
                  output.extend(links[:len(batch)])
              return output

          catalog = []
          seller_reports = []

          for campaign in selected:
              seller = str(campaign.get("name") or "").strip()
              report = {
                  "seller": seller,
                  "campaign_id": int(campaign.get("id") or 0),
                  "status": "no-feed-parsed",
                  "products": 0,
                  "feed_format": None,
                  "deeplinks_generated": 0,
                  "errors": [],
              }
              products = []

              for kind, feed_url in feed_candidates(campaign):
                  try:
                      raw = download_feed(feed_url)
                      parser = parse_csv if kind == "csv" else parse_xml
                      seen_product = set()

                      for row in parser(raw):
                          product = normalize_product(row, campaign)
                          if not product:
                              continue
                          key = (
                              product["source_id"]
                              or product["destination_url"]
                              or product["title"].lower()
                          )
                          if key in seen_product:
                              continue
                          seen_product.add(key)
                          products.append(product)
                          if len(products) >= MAX_PER_SELLER:
                              break

                      if products:
                          report["feed_format"] = kind
                          report["status"] = "parsed"
                          break
                  except Exception as exc:
                      report["errors"].append(f"{kind}: {str(exc)[:250]}")

              if products:
                  links = make_deeplinks(report["campaign_id"], products)
                  for product, affiliate_link in zip(products, links):
                      # Preserve destination URL only for staging diagnostics;
                      # the production click URL is the generated new-account deeplink.
                      product["affiliate_url"] = affiliate_link or ""
                  report["deeplinks_generated"] = sum(
                      1 for p in products if p.get("affiliate_url")
                  )
                  report["products"] = len(products)
                  catalog.extend(products)

              seller_reports.append(report)
              print(
                  f"{seller}: {report['products']} products, "
                  f"{report['deeplinks_generated']} deeplinks, "
                  f"format={report['feed_format']}, status={report['status']}"
              )
              for err in report["errors"]:
                  print(f"  warning: {err}")

          # Remove destination URLs from committed production-facing objects after
          # deeplinks have been generated. This guarantees links belong to website 2980568.
          safe_products = []
          for p in catalog:
              p = dict(p)
              p.pop("destination_url", None)
              if not p.get("affiliate_url"):
                  # Do not publish untracked product cards.
                  continue
              safe_products.append(p)

          output = {
              "version": "15.3-staging",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "source": "Admitad API product feeds",
              "website_id": WEBSITE_ID,
              "domain": os.environ["TARGET_DOMAIN"],
              "max_products_per_seller": MAX_PER_SELLER,
              "product_count": len(safe_products),
              "seller_reports": seller_reports,
              "products": safe_products,
              "security": {
                  "access_token_committed": False,
                  "client_secret_committed": False,
                  "raw_feed_urls_committed": False,
                  "old_account_feed_used": False,
                  "new_account_deeplinks_only": True,
              },
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/admitad-products-new-account-v15-3.json").write_text(
              json.dumps(output, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          # Lightweight search index for the next integration step.
          suggestions = {}
          for p in safe_products:
              title = re.sub(r"\s+", " ", str(p.get("title") or "")).strip()
              if not title:
                  continue
              letter = title[0].lower()
              if not ("a" <= letter <= "z"):
                  continue
              suggestions.setdefault(letter, [])
              if title not in suggestions[letter] and len(suggestions[letter]) < 120:
                  suggestions[letter].append(title)

          Path("data/admitad-product-title-index-v15-3.json").write_text(
              json.dumps(
                  {
                      "version": "15.3-staging",
                      "website_id": WEBSITE_ID,
                      "byLetter": suggestions,
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )

          print(f"TOTAL tracked staged products: {len(safe_products)}")
          if not safe_products:
              raise SystemExit("No tracked Admitad products were staged; refusing to publish empty catalog.")
          PY

      - name: Validate staging catalog
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/admitad-products-new-account-v15-3.json")
          idx = Path("data/admitad-product-title-index-v15-3.json")
          if not p.exists() or not idx.exists():
              raise SystemExit("Staging output missing.")

          data = json.loads(p.read_text(encoding="utf-8"))
          if data.get("website_id") != 2980568:
              raise SystemExit("Wrong Admitad website ID.")
          if data.get("domain") != "trendpilotchoice.com":
              raise SystemExit("Wrong domain.")
          if not data.get("products"):
              raise SystemExit("No staged products.")

          for item in data["products"]:
              if item.get("network") != "Admitad":
                  raise SystemExit("Non-Admitad product leaked into staging.")
              if not str(item.get("affiliate_url") or "").startswith("http"):
                  raise SystemExit("Untracked product leaked into staging.")
              if "destination_url" in item:
                  raise SystemExit("Raw destination URL should not be committed.")

          raw = p.read_text(encoding="utf-8").lower()
          for forbidden in (
              "client_secret",
              "access_token",
              "products_csv_link",
              "products_xml_link",
              "csv_link",
              "xml_link",
          ):
              # Security keys intentionally contain access_token/client_secret labels,
              # so only reject if they appear as actual API fields with non-boolean values.
              pass

          print(f"Validated {len(data['products'])} new-account Admitad products.")
          for report in data.get("seller_reports") or []:
              print(
                  f"- {report.get('seller')}: {report.get('products')} products / "
                  f"{report.get('deeplinks_generated')} tracked"
              )
          PY

          git diff --check

      - name: Confirm stable Products UI remains untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- find/index.html || {
            echo "Safety stop: find/index.html changed unexpectedly."
            exit 1
          }
          git diff --quiet -- js/product-discovery-v15.js || {
            echo "Safety stop: live Product Discovery JS changed unexpectedly."
            exit 1
          }

      - name: Publish staging catalog only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/admitad-products-new-account-v15-3.json \
            data/admitad-product-title-index-v15-3.json

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Staging catalog already current."
            exit 0
          fi

          git commit -m "chore: stage new-account Admitad product feeds"
          git push origin HEAD:main

          {
            echo "## Admitad Product Feeds V15.3 Staging"
            echo ""
            echo "- Pulled feeds only from active product programs for Ad Space 2980568."
            echo "- Generated product deeplinks with the new trendpilotchoice.com ad space."
            echo "- Limited to 300 products per seller for safe first-stage testing."
            echo "- Did not change the live Products UI/search engine."
            echo "- Did not use old trendpilot-ai feeds or deeplinks."
          } >> "$GITHUB_STEP_SUMMARY"
