name: TrendPilot V21.16 - TikTok Shop US Geo Visibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-16-tiktok-us-geo.yml
      - netlify/edge-functions/geo-bootstrap.js
      - js/tiktok-us-geo-v21-16.js
      - js/packed-browse-v21-13-8.js
      - js/compare-v20-9.js
      - netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
      - scripts/qa-v21-16-tiktok-us-geo.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v21-16-tiktok-us-geo
  cancel-in-progress: true

jobs:
  rollout-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Wire geo policy across public HTML
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re
          bootstrap='<script src="/geo-bootstrap.js?v=21.16.0"></script><script defer src="/js/tiktok-us-geo-v21-16.js?v=21.16.0"></script>'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','node_modules','artifacts','coverage')):
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              old=s
              if 'geo-bootstrap.js?v=21.16.0' not in s and '</head>' in s.lower():
                  i=s.lower().rfind('</head>')
                  s=s[:i]+bootstrap+s[i:]
              s=re.sub(r"/js/packed-browse-v21-13-8\.js\?v=[^\"']+", '/js/packed-browse-v21-13-8.js?v=21.16.0', s)
              s=re.sub(r"/js/compare-v20-9\.js\?v=[^\"']+", '/js/compare-v20-9.js?v=21.16.0', s)
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(p.as_posix())
          print(f'Patched {len(changed)} HTML files for V21.16 geo visibility.')
          PY

      - name: Validate source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'geo-bootstrap.js?v=21.16.0' find/index.html
          grep -q 'tiktok-us-geo-v21-16.js?v=21.16.0' deals/index.html
          grep -q 'packed-browse-v21-13-8.js?v=21.16.0' find/index.html
          grep -q 'compare-v20-9.js?v=21.16.0' compare/index.html
          grep -q 'geo-bootstrap.js?v=21.16.0' handoff/index.html
          grep -q 'geo-bootstrap.js?v=21.16.0' netlify/functions/product-preview-v20-9-6-mobile-polish.cjs

      - name: Commit V21.16 HTML wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo 'V21.16 HTML wiring already current.'
          else
            git commit -m 'TrendPilot V21.16 wire US-only TikTok visibility sitewide'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lightweight DOM QA runtime
        run: npm install --no-save --ignore-scripts jsdom@26

      - name: Run V21.16 geo policy QA
        run: node scripts/qa-v21-16-tiktok-us-geo.mjs

      - name: Wait for public deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            good=1
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/geo-bootstrap.js' -o /tmp/geo.js || good=0
            grep -q '__TP_VISITOR_COUNTRY__' /tmp/geo.js 2>/dev/null || good=0
            grep -q '__TP_ALLOW_TIKTOK_US__' /tmp/geo.js 2>/dev/null || good=0
            for u in / /find/ /deals/ /compare/ /rare-used/ /tickets/ /products/ /price-watch/ /deal/ /coupon/ /handoff/; do
              curl -fsSL --max-time 20 "https://trendpilotchoice.com${u}" -o /tmp/page.html || { good=0; break; }
              grep -q 'geo-bootstrap.js?v=21.16.0' /tmp/page.html || { good=0; break; }
              grep -q 'tiktok-us-geo-v21-16.js?v=21.16.0' /tmp/page.html || { good=0; break; }
            done
            if [ "$good" = 1 ]; then
              echo 'V21.16 is live on core public routes.'
              exit 0
            fi
            echo "Waiting for V21.16 deploy ($i/45)..."
            sleep 6
          done
          exit 1

      - name: Write summary
        if: always()
        shell: bash
        run: |
          echo '# TrendPilot V21.16 - TikTok Shop US Geo Visibility' >> "$GITHUB_STEP_SUMMARY"
          if [ -s artifacts/v21-16-tiktok-geo/report.json ]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/v21-16-tiktok-geo/report.json','utf8'));
          console.log(`- Final QA: **${r.passed?'PASS':'FAIL'}**`);
          for(const [k,v] of Object.entries(r.checks||{})) console.log(`- ${v?'✅':'❌'} ${k}`);
          NODE
          else
            echo '- QA report was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload V21.16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v21-16-tiktok-us-geo
          path: artifacts/v21-16-tiktok-geo
          if-no-files-found: ignore
