name: Google Ads Big Matches — Point Dutch Ads to NL Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-ads-point-dutch-ads-to-nl-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Google Ads client
        run: pip install --disable-pip-version-check google-ads
      - name: Clone Dutch RSAs with Dutch landing URLs and pause old URLs
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from google.ads.googleads.client import GoogleAdsClient

          CAMPAIGN_ID = 24190034111
          CAMPAIGN_NAME = 'TrendPilot | GCC Big Matches | Search | 2026'
          NL_GEO = 'geoTargetConstants/2528'
          DUTCH_LANG = 'languageConstants/1010'
          BUDGET_MICROS = 5_000_000
          SPEND_STOP_USD = 18.00
          START_DATE = '2026-08-28'

          TARGETS = {
            'manchester_derby | NL': 'https://trendpilotchoice.com/events/manchester-derby-2026/nl-nl/',
            'liverpool_manunited | NL': 'https://trendpilotchoice.com/events/liverpool-v-manchester-united-2026/nl-nl/',
            'el_clasico | NL': 'https://trendpilotchoice.com/events/el-clasico-2026/nl-nl/',
            'madrid_derby | NL': 'https://trendpilotchoice.com/events/madrid-derby-2026/nl-nl/',
            'north_london_derby | NL': 'https://trendpilotchoice.com/events/north-london-derby-2026/nl-nl/',
            'arsenal_mancity | NL': 'https://trendpilotchoice.com/events/arsenal-v-manchester-city-2026/nl-nl/',
          }

          client = GoogleAdsClient.load_from_dict({
            'developer_token': os.environ['GOOGLE_ADS_DEVELOPER_TOKEN'],
            'client_id': os.environ['GOOGLE_ADS_CLIENT_ID'],
            'client_secret': os.environ['GOOGLE_ADS_CLIENT_SECRET'],
            'refresh_token': os.environ['GOOGLE_ADS_REFRESH_TOKEN'],
            'login_customer_id': os.environ['GOOGLE_ADS_LOGIN_CUSTOMER_ID'].replace('-', '').strip(),
            'use_proto_plus': True,
          })
          cid = os.environ['GOOGLE_ADS_CUSTOMER_ID'].replace('-', '').strip()
          ga = client.get_service('GoogleAdsService')

          # Fail closed on protected campaign settings.
          rows = list(ga.search(customer_id=cid, query=f'''
            SELECT campaign.resource_name,campaign.name,campaign.status,campaign.advertising_channel_type,
                   campaign.bidding_strategy_type,campaign.geo_target_type_setting.positive_geo_target_type,
                   campaign.network_settings.target_google_search,campaign.network_settings.target_search_network,
                   campaign.network_settings.target_content_network,campaign.network_settings.target_partner_search_network,
                   campaign_budget.amount_micros
            FROM campaign WHERE campaign.id={CAMPAIGN_ID} LIMIT 1
          '''))
          if len(rows) != 1: raise SystemExit('SAFETY STOP: campaign not found exactly once')
          r=rows[0]; c=r.campaign
          checks={
            'name': c.name==CAMPAIGN_NAME,
            'enabled': c.status.name=='ENABLED',
            'search': c.advertising_channel_type.name=='SEARCH',
            'manual_cpc': c.bidding_strategy_type.name=='MANUAL_CPC',
            'budget_5': int(r.campaign_budget.amount_micros or 0)==BUDGET_MICROS,
            'presence': c.geo_target_type_setting.positive_geo_target_type.name=='PRESENCE',
            'google_search': c.network_settings.target_google_search is True,
            'search_network_off': c.network_settings.target_search_network is False,
            'display_off': c.network_settings.target_content_network is False,
            'partners_off': c.network_settings.target_partner_search_network is False,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('SAFETY STOP: '+','.join(bad))

          locs=list(ga.search(customer_id=cid,query=f'''SELECT campaign_criterion.location.geo_target_constant,campaign_criterion.negative,campaign_criterion.status FROM campaign_criterion WHERE campaign.id={CAMPAIGN_ID} AND campaign_criterion.type='LOCATION' AND campaign_criterion.status!='REMOVED' '''))
          pos=sorted({x.campaign_criterion.location.geo_target_constant for x in locs if not x.campaign_criterion.negative})
          if pos != [NL_GEO]: raise SystemExit('SAFETY STOP: GEO not Netherlands-only '+repr(pos))

          langs=list(ga.search(customer_id=cid,query=f'''SELECT campaign_criterion.language.language_constant,campaign_criterion.status FROM campaign_criterion WHERE campaign.id={CAMPAIGN_ID} AND campaign_criterion.type='LANGUAGE' AND campaign_criterion.status!='REMOVED' '''))
          langset=sorted({x.campaign_criterion.language.language_constant for x in langs})
          if langset != [DUTCH_LANG]: raise SystemExit('SAFETY STOP: language not Dutch-only '+repr(langset))

          today=datetime.now(ZoneInfo('Asia/Muscat')).date().isoformat()
          costs=list(ga.search(customer_id=cid,query=f'''SELECT segments.date,metrics.cost_micros FROM campaign WHERE campaign.id={CAMPAIGN_ID} AND segments.date BETWEEN '{START_DATE}' AND '{today}' '''))
          total_cost=sum(int(x.metrics.cost_micros or 0) for x in costs)/1_000_000
          if total_cost >= SPEND_STOP_USD: raise SystemExit(f'SAFETY STOP: cumulative spend ${total_cost:.2f}')

          ad_service=client.get_service('AdGroupAdService')
          changed=[]
          for group_name,target_url in TARGETS.items():
            groups=list(ga.search(customer_id=cid,query=f'''SELECT ad_group.resource_name,ad_group.status FROM ad_group WHERE campaign.id={CAMPAIGN_ID} AND ad_group.name='{group_name}' AND ad_group.status!='REMOVED' LIMIT 1'''))
            if len(groups)!=1 or groups[0].ad_group.status.name!='ENABLED': raise SystemExit('SAFETY STOP: Dutch group missing/enabled: '+group_name)
            group_res=groups[0].ad_group.resource_name
            ads=list(ga.search(customer_id=cid,query=f'''SELECT ad_group_ad.resource_name,ad_group_ad.status,ad_group_ad.ad.final_urls,ad_group_ad.ad.responsive_search_ad.headlines,ad_group_ad.ad.responsive_search_ad.descriptions FROM ad_group_ad WHERE campaign.id={CAMPAIGN_ID} AND ad_group.name='{group_name}' AND ad_group_ad.status!='REMOVED' '''))
            if not ads: raise SystemExit('SAFETY STOP: no Dutch RSA in '+group_name)
            correct=[x for x in ads if target_url in list(x.ad_group_ad.ad.final_urls)]
            if not correct:
              src=ads[0].ad_group_ad.ad.responsive_search_ad
              op=client.get_type('AdGroupAdOperation'); aga=op.create
              aga.ad_group=group_res; aga.status=client.enums.AdGroupAdStatusEnum.ENABLED
              aga.ad.final_urls.append(target_url)
              rsa=aga.ad.responsive_search_ad
              for asset in src.headlines:
                a=client.get_type('AdTextAsset'); a.text=asset.text; rsa.headlines.append(a)
              for asset in src.descriptions:
                a=client.get_type('AdTextAsset'); a.text=asset.text; rsa.descriptions.append(a)
              ad_service.mutate_ad_group_ads(customer_id=cid,operations=[op])
              changed.append(group_name+':created')
            # Pause every legacy-url ad in this NL group, preserving it for rollback.
            ads2=list(ga.search(customer_id=cid,query=f'''SELECT ad_group_ad.resource_name,ad_group_ad.status,ad_group_ad.ad.final_urls FROM ad_group_ad WHERE campaign.id={CAMPAIGN_ID} AND ad_group.name='{group_name}' AND ad_group_ad.status!='REMOVED' '''))
            ops=[]
            for x in ads2:
              urls=list(x.ad_group_ad.ad.final_urls)
              if target_url not in urls and x.ad_group_ad.status.name!='PAUSED':
                op=client.get_type('AdGroupAdOperation'); u=op.update; u.resource_name=x.ad_group_ad.resource_name; u.status=client.enums.AdGroupAdStatusEnum.PAUSED; op.update_mask.paths.append('status'); ops.append(op)
            if ops:
              ad_service.mutate_ad_group_ads(customer_id=cid,operations=ops)
              changed.append(group_name+':paused-old')

          # Post-verify each Dutch group has an enabled ad pointing only at its NL page.
          for group_name,target_url in TARGETS.items():
            ads=list(ga.search(customer_id=cid,query=f'''SELECT ad_group_ad.status,ad_group_ad.ad.final_urls FROM ad_group_ad WHERE campaign.id={CAMPAIGN_ID} AND ad_group.name='{group_name}' AND ad_group_ad.status!='REMOVED' '''))
            enabled=[x for x in ads if x.ad_group_ad.status.name=='ENABLED']
            if not enabled: raise SystemExit('POST-VERIFY FAILED: no enabled ad '+group_name)
            if any(target_url not in list(x.ad_group_ad.ad.final_urls) for x in enabled): raise SystemExit('POST-VERIFY FAILED: enabled legacy URL '+group_name)

          print('DUTCH LANDING ROUTING SUCCESS')
          print('Dutch groups routed:', len(TARGETS))
          print('Cumulative spend before routing: $%.2f' % total_cost)
          print('Daily budget unchanged: $5.00')
          print('Netherlands only | Dutch only | Google Search only | Presence-only PASS')
          print('Changes:', changed)
          PY
