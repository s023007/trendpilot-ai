      - name: Make Product Preview the Finder-first route and clean variant presentation
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs=require('fs');
          const p='netlify/functions/_product-data/products.json';
          const o='netlify/functions/_product-data/offers.json';
          const v='netlify/functions/_product-data/variants.json';
          const products=JSON.parse(fs.readFileSync(p,'utf8'));
          const offers=JSON.parse(fs.readFileSync(o,'utf8'));
          const variants=JSON.parse(fs.readFileSync(v,'utf8'));
          const by=new Map();
          for(const x of offers){if(!by.has(x.tpid))by.set(x.tpid,[]);by.get(x.tpid).push(x)}
          const byTpid={};
          for(const x of products){const rows=by.get(x.tpid)||[];const sellers=[...new Set(rows.map(r=>r.seller).filter(Boolean))];byTpid[x.tpid]={route:x.route,name:x.name,brand:x.brand||'',type:x.type||'',sellerCount:sellers.length,offerCount:rows.length,variantCount:x.variantCount||0}}
          const map={version:'20.6.8.2',engine:'v2064',byTpid};
          fs.writeFileSync('data/product-preview-v20-6/route-map.json',JSON.stringify(map));

          const norm=v=>String(v||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
          const specLabel=text=>{
            const s=norm(text); const parts=[];
            const explicitRam=s.match(/\b(\d{1,2})\s*GB\s*RAM\b/i);
            const gbs=[...s.matchAll(/\b(\d{1,4})\s*GB\b/gi)].map(m=>Number(m[1])).filter(Number.isFinite);
            const inferred=!explicitRam&&gbs.length>=2?Math.min(...gbs.filter(n=>n<=32)):null;
            if(explicitRam)parts.push(`${explicitRam[1]}GB RAM`);else if(Number.isFinite(inferred))parts.push(`${inferred}GB RAM`);
            const storage=gbs.filter(n=>n>=32); if(storage.length)parts.push(`${Math.max(...storage)}GB`);
            const screen=s.match(/\b(\d{1,2}(?:\.\d+)?)\s*(?:inch(?:es)?|in\b|\")/i);if(screen)parts.push(`Screen ${screen[1]} in`);
            const btu=s.match(/\b(\d{4,6})\s*BTU\b/i);if(btu)parts.push(`${btu[1]} BTU`);
            const vol=s.match(/\b(\d+(?:\.\d+)?)\s*(ml|oz)\b/i);if(vol)parts.push(`${vol[1]} ${vol[2].toLowerCase()}`);
            return [...new Set(parts)].join(' · ');
          };
          const pmap=new Map(products.map(p=>[p.tpid,p]));
          const labels={version:'20.6.8.2',byTpid:{}};
          for(const v of variants){
            if(!v.tpid||!v.tpvid)continue;
            const rows=(by.get(v.tpid)||[]).filter(o=>o.tpvid===v.tpvid);
            const evidence=[v.label,v.name,pmap.get(v.tpid)?.name,...rows.slice(0,5).map(o=>o.name)].filter(Boolean).join(' ');
            let label=specLabel(evidence)||norm(v.label);
            if(!label||/^variant\s*\d+$/i.test(label)||/^TPV-[A-Z0-9]+$/i.test(label)||/^\d+$/i.test(label))label='Seller configuration';
            const screen=label.match(/^(\d{1,2}(?:\.\d+)?)\s*inches?$/i);if(screen)label=`Screen ${screen[1]} in`;
            (labels.byTpid[v.tpid]??={})[v.tpvid]=label;
          }
          fs.writeFileSync('data/product-preview-v20-6/variant-labels-v20-6-8-2.json',JSON.stringify(labels));
          NODE

          cat > js/product-preview-bridge-v20-6-8-2.js <<'JS'
          (()=>{'use strict';
            const qs=new URLSearchParams(location.search);
            const engine=(qs.get('engine')||'').toLowerCase();
            if(!['v2064','v2067'].includes(engine))return;
            const norm=v=>String(v||'').trim();
            let ROUTES=null,LABELS=null;
            async function routes(){if(ROUTES)return ROUTES;const r=await fetch('/data/product-preview-v20-6/route-map.json?v=20.6.8.2',{cache:'no-store'});if(!r.ok)throw new Error(`route-map HTTP ${r.status}`);ROUTES=await r.json();return ROUTES}
            async function labels(){if(LABELS)return LABELS;try{const r=await fetch('/data/product-preview-v20-6/variant-labels-v20-6-8-2.json?v=20.6.8.2',{cache:'no-store'});if(r.ok)LABELS=await r.json()}catch{}return LABELS||{byTpid:{}}}
            function previewUrl(hit){return `/product/${encodeURIComponent(hit.route)}/`}
            async function fixText(){
              document.querySelectorAll('[data-tpid-open]').forEach(btn=>{const id=norm(btn.dataset.tpidOpen);if(!id)return;btn.textContent='View product';btn.setAttribute('aria-label','Open product preview')});
              const currentTpid=norm(new URLSearchParams(location.search).get('tpid'));
              const vm=currentTpid?(await labels()).byTpid?.[currentTpid]||{}:{};
              document.querySelectorAll('.tp67-variant-chips button,[data-variant]').forEach(btn=>{
                const vid=norm(btn.dataset.variant);
                let t=(btn.textContent||'').replace(/\b1 sellers\b/gi,'1 seller').trim();
                const count=(t.match(/(\d+)\s+sellers?\b/i)||[])[1];
                if(vid&&vid!=='ALL'&&vm[vid])t=`${vm[vid]}${count?` · ${count} seller${count==='1'?'':'s'}`:''}`;
                else{t=t.replace(/^Variant\s+\d+\s*·/i,'Seller configuration ·');t=t.replace(/^(\d{1,2}(?:\.\d+)?)\s+Inches\s*·/i,'Screen $1 in ·')}
                btn.textContent=t;
              });
            }
            async function directExactRedirect(){
              if(qs.get('compare')==='1')return;
              const id=norm(new URLSearchParams(location.search).get('tpid'));
              if(!id)return;
              const m=await routes();const hit=m.byTpid?.[id];
              if(hit&&hit.route&&document.querySelector('.tp67-compare-head'))location.replace(previewUrl(hit));
            }
            document.addEventListener('click',async e=>{
              const btn=e.target.closest('[data-tpid-open]');
              if(!btn)return;
              const id=norm(btn.dataset.tpidOpen);if(!id)return;
              // Capture before the old comparison listener so Product Preview is truly the first shopper step.
              e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
              try{const m=await routes();const hit=m.byTpid?.[id];if(hit?.route)location.href=previewUrl(hit)}catch(err){console.warn('TrendPilot Product Preview route unavailable',err)}
            },true);
            let timer=0;
            const scan=()=>{fixText().catch(()=>{});directExactRedirect().catch(()=>{})};
            const obs=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(scan,80)});obs.observe(document.documentElement,{childList:true,subtree:true});
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',scan,{once:true});else scan();
          })();
          JS

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('find/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script[^>]+product-preview-bridge-v20-6-8(?:-2)?\.js[^>]*></script>\s*','\n',s,flags=re.I)
          tag='<script src="/js/product-preview-bridge-v20-6-8-2.js?v=20.6.8.2" defer></script>'
          if '</body>' in s:
              s=s.replace('</body>',f'  {tag}\n</body>')
          else:
              s+='\n'+tag+'\n'
          p.write_text(s,encoding='utf-8')
          PY

      - name: Harden Netlify bundling and product route configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, tomllib
          p=Path('netlify.toml')
          s=p.read_text(encoding='utf-8')

          # Remove only TrendPilot's previous product-preview redirect marker blocks.
          s=re.sub(r'(?ms)^\s*# TP_PRODUCT_PREVIEW_V20_6_8_START.*?# TP_PRODUCT_PREVIEW_V20_6_8_END\s*','\n',s)
          s=re.sub(r'(?ms)^\s*# TP_PRODUCT_PREVIEW_RUNTIME_V20_6_8_2_START.*?# TP_PRODUCT_PREVIEW_RUNTIME_V20_6_8_2_END\s*','\n',s)

          # Ensure the local JSON bundle is included for functions. Netlify documents included_files for this purpose.
          glob='netlify/functions/_product-data/*.json'
          m=re.search(r'(?m)^\[functions\][ \t]*$',s)
          if m:
              start=m.end()
              nxt=re.search(r'(?m)^\[[^\n]+\][ \t]*$',s[start:])
              end=start+(nxt.start() if nxt else len(s)-start)
              section=s[start:end]
              im=re.search(r'(?ms)^[ \t]*included_files[ \t]*=[ \t]*\[(.*?)\][ \t]*(?:\n|$)',section)
              if im:
                  body=im.group(1)
                  if glob not in body:
                      vals=[x.strip() for x in body.split(',') if x.strip()]
                      vals.append('"'+glob+'"')
                      repl='\n  included_files = ['+', '.join(vals)+']\n'
                      section=section[:im.start()]+repl+section[im.end():]
              else:
                  section='\n  included_files = ["'+glob+'"]'+section
              s=s[:start]+section+s[end:]
          else:
              s=s.rstrip()+'\n\n[functions]\n  included_files = ["'+glob+'"]\n'

          block='''
          # TP_PRODUCT_PREVIEW_RUNTIME_V20_6_8_2_START
          [[redirects]]
            from = "/product"
            to = "/find/?engine=v2064"
            status = 301

          [[redirects]]
            from = "/product/*"
            to = "/.netlify/functions/trendpilot-product?slug=:splat"
            status = 200
            force = true

          # Do not expose function source files through the public publish root.
          [[redirects]]
            from = "/netlify/functions/*"
            to = "/404.html"
            status = 404
            force = true
          # TP_PRODUCT_PREVIEW_RUNTIME_V20_6_8_2_END
          '''
          s=s.rstrip()+'\n\n'+block.strip()+'\n'
          p.write_text(s,encoding='utf-8')
          with p.open('rb') as fh: tomllib.load(fh)
          print('netlify.toml parse PASS')
          PY

      - name: Update presentation manifest without touching identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          for(const file of ['data/product-preview-v20-6/manifest.json','netlify/functions/_product-data/manifest.json']){
            if(!fs.existsSync(file))continue;
            const m=JSON.parse(fs.readFileSync(file,'utf8'));
            m.presentationVersion='20.6.8.2';
            m.runtimePathStrategy='bounded-runtime-data-discovery-no-import-meta';
            m.finderPreviewFirst=true;
            m.offerCountSellerCountSeparated=true;
            m.shopperVariantLabels=true;
            m.cpcDestinationMutation=false;
            m.identityRebuilt=false;
            m.canonicalCatalogModified=false;
            fs.writeFileSync(file,JSON.stringify(m,null,2));
          }
          NODE

      - name: Deep QA — runtime layouts, Product Preview, variants, seller counts, SEO and CPC
        shell: bash
        run: |
          set -euo pipefail
          node --check netlify/functions/trendpilot-product-data.mjs
          node --check netlify/functions/trendpilot-product.mjs
          node --check netlify/functions/trendpilot-outbound.mjs
          node --check js/product-preview-bridge-v20-6-8-2.js
          node --check js/product-preview-events-v20-6-8-2.js

          ! grep -q 'fileURLToPath(import.meta.url)' netlify/functions/trendpilot-product.mjs
          ! grep -q 'fileURLToPath(import.meta.url)' netlify/functions/trendpilot-outbound.mjs
          ! grep -q 'fileURLToPath(import.meta.url)' netlify/functions/trendpilot-product-data.mjs

          cat > /tmp/tp-v20682-qa.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import os from 'node:os';
          import { pathToFileURL } from 'node:url';
          const ROOT=process.cwd();
          const products=JSON.parse(fs.readFileSync('netlify/functions/_product-data/products.json','utf8'));
          const offers=JSON.parse(fs.readFileSync('netlify/functions/_product-data/offers.json','utf8'));
          const variants=JSON.parse(fs.readFileSync('netlify/functions/_product-data/variants.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('data/product-preview-v20-6/manifest.json','utf8'));
          const routeMap=JSON.parse(fs.readFileSync('data/product-preview-v20-6/route-map.json','utf8'));
          const variantLabels=JSON.parse(fs.readFileSync('data/product-preview-v20-6/variant-labels-v20-6-8-2.json','utf8'));
          const failures=[];
          const blocked=/^(?:Temu|Joom|FilamentPRO(?: EU CPS)?)$/i;
          const one=products.find(p=>p.tpid==='TPPH-D8C434EDE8F517')||products.find(p=>String(p.name).toLowerCase()==='oneplus 7t');
          const think=products.find(p=>p.tpid==='TPLP-935FFB3DC985AB')||products.find(p=>String(p.name).toLowerCase()==='thinkpad x1 carbon');
          const perfume=products.find(p=>p.tpid==='TPPF-C5712B5061F9E5')||products.find(p=>/al haramain badar/i.test(String(p.name)));
          if(products.length<10000)failures.push(`products-too-small=${products.length}`);
          if(offers.length<10000)failures.push(`offers-too-small=${offers.length}`);
          if(variants.length<10000)failures.push(`variants-too-small=${variants.length}`);
          if(offers.some(o=>blocked.test(String(o.seller||''))))failures.push('blocked-seller-leak');
          if(!one)failures.push('OnePlus-7T-missing');
          if(!think)failures.push('ThinkPad-X1-Carbon-missing');
          if(!perfume)failures.push('perfume-anchor-missing');
          const oneRows=one?offers.filter(o=>o.tpid===one.tpid):[];
          const oneSellers=[...new Set(oneRows.map(o=>o.seller))];
          if(oneSellers.length!==2)failures.push(`OnePlus-sellers=${JSON.stringify(oneSellers)}`);
          if(!offers.some(o=>o.cpcCapable))failures.push('no-CPC-capable-offers');
          if(manifest.identityRebuilt!==false||manifest.canonicalCatalogModified!==false)failures.push('identity-safety-flags');
          if(manifest.presentationVersion!=='20.6.8.2')failures.push('manifest-presentation-version');
          if(routeMap.version!=='20.6.8.2'||!routeMap.byTpid?.[one?.tpid]?.route)failures.push('route-map-v20682');
          if(variantLabels.version!=='20.6.8.2'||!variantLabels.byTpid?.[one?.tpid])failures.push('variant-label-map-v20682');
          const finder=fs.readFileSync('find/index.html','utf8');
          if(!finder.includes('product-preview-bridge-v20-6-8-2.js'))failures.push('finder-bridge-missing');
          if(finder.includes('product-preview-bridge-v20-6-8.js?v=20.6.8'))failures.push('old-finder-bridge-active');
          const sitemap=fs.readFileSync('sitemap.xml','utf8');
          const robots=fs.readFileSync('robots.txt','utf8');
          if(one&&!sitemap.includes(`/product/${one.route}/`))failures.push('OnePlus-product-route-missing-from-sitemap');
          if(!robots.includes('https://trendpilotchoice.com/sitemap.xml'))failures.push('robots-sitemap-missing');

          const productModule=await import(pathToFileURL(path.join(ROOT,'netlify/functions/trendpilot-product.mjs')).href+'?qa='+Date.now());
          const outboundModule=await import(pathToFileURL(path.join(ROOT,'netlify/functions/trendpilot-outbound.mjs')).href+'?qa='+Date.now());
          for(const p of [one,think,perfume].filter(Boolean)){
            const res=await productModule.handler({path:`/product/${p.route}/`,queryStringParameters:{slug:p.route}});
            if(res.statusCode!==200)failures.push(`${p.tpid}-preview-status=${res.statusCode}`);
            for(const marker of ['data-tp-product-preview="20.6.8.2"','Product preview','Configurations','Seller offers','application/ld+json','compare=1'])if(!res.body.includes(marker))failures.push(`${p.tpid}-missing-${marker}`);
            if(/This function has crashed/i.test(res.body))failures.push(`${p.tpid}-crash-page`);
          }
          if(one){
            const res=await productModule.handler({path:`/product/${one.route}/`,queryStringParameters:{slug:one.route}});
            if(!res.body.includes(`${oneRows.length} offers from 2 sellers`))failures.push(`OnePlus-offer-seller-count-copy expected=${oneRows.length}`);
            if(!res.body.includes('Compare 2 sellers'))failures.push('OnePlus-compare-two-sellers-copy');
          }
          const target=offers.find(o=>o.cpcCapable&&/^https?:\/\//i.test(o.url))||offers.find(o=>/^https?:\/\//i.test(o.url));
          if(!target)failures.push('outbound-QA-target-missing');
          else{
            const out=await outboundModule.handler({queryStringParameters:{offer:target.tpoid,src:'qa_v20682'}});
            if(out.statusCode!==302)failures.push(`outbound-status=${out.statusCode}`);
            if(out.headers?.location!==target.url)failures.push('CPC-affiliate-destination-mutated');
          }

          // Runtime-layout simulation: prove the loader works when bundled data is flat or nested.
          const temp=fs.mkdtempSync(path.join(os.tmpdir(),'tp-v20682-'));
          const layouts=[path.join(temp,'flat','_product-data'),path.join(temp,'nested','netlify','functions','_product-data')];
          for(const dir of layouts){fs.mkdirSync(dir,{recursive:true});for(const f of ['products.json','offers.json','variants.json'])fs.copyFileSync(path.join(ROOT,'netlify/functions/_product-data',f),path.join(dir,f))}
          const loaderPath=pathToFileURL(path.join(ROOT,'netlify/functions/trendpilot-product-data.mjs')).href;
          for(const [i,dir] of layouts.entries()){
            const root=i===0?path.dirname(dir):path.resolve(dir,'../../..');
            process.env.TRENDPILOT_PRODUCT_DATA_ROOT=dir;
            const mod=await import(loaderPath+`?layout=${i}&t=${Date.now()}`);
            const data=mod.loadProductData();
            if(data.products.length!==products.length||data.offers.length!==offers.length)failures.push(`runtime-layout-${i}-count-mismatch`);
            if(!data.dir.includes('_product-data'))failures.push(`runtime-layout-${i}-locator`);
            delete process.env.TRENDPILOT_PRODUCT_DATA_ROOT;
          }

          const qa={version:'20.6.8.2',createdAt:new Date().toISOString(),products:products.length,offers:offers.length,variants:variants.length,onePlus7T:{offers:oneRows.length,sellers:oneSellers},cpcCapableOffers:offers.filter(o=>o.cpcCapable).length,cpcConfirmedOffers:offers.filter(o=>o.cpcConfirmed).length,failures};
          fs.writeFileSync('data/product-preview-v20-6/qa-v20-6-8-2.json',JSON.stringify(qa,null,2));
          console.log(JSON.stringify(qa,null,2));
          if(failures.length)process.exit(1);
          NODE
          node /tmp/tp-v20682-qa.mjs

          python - <<'PY'
          import tomllib
          with open('netlify.toml','rb') as f: tomllib.load(f)
          print('TOML validation PASS')
          PY

          git diff --quiet -- data/catalog-v19 data/search-v20-6/stable-v20-6-7.json || {
            echo 'IDENTITY/CANONICAL GUARD FAILED: this release must not modify V19 or stable V20.6.7 identity.' >&2
            git diff -- data/catalog-v19 data/search-v20-6/stable-v20-6-7.json >&2
            exit 1
          }

      - name: Commit one V20.6.8.2 stabilization release only after QA passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            netlify/functions/trendpilot-product-data.mjs \
            netlify/functions/trendpilot-product.mjs \
            netlify/functions/trendpilot-outbound.mjs \
