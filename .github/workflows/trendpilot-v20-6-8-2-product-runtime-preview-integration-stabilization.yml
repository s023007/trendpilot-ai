            git commit -m "TrendPilot V20.6.8.2 stabilize product preview runtime and Finder flow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Live deployment smoke test with bounded wait
        id: live
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://trendpilotchoice.com'
          ROUTE="$(node -p "JSON.parse(require('fs').readFileSync('data/product-preview-v20-6/manifest.json','utf8')).onePlus7T?.route||''")"
          test -n "$ROUTE"
          deployed=0
          for i in $(seq 1 30); do
            body="$(curl -fsS --max-time 12 "$SITE/data/product-preview-v20-6/manifest.json?qa=$RANDOM" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q '"presentationVersion"[[:space:]]*:[[:space:]]*"20.6.8.2"'; then
              deployed=1; break
            fi
            echo "Waiting for Netlify deploy... attempt $i/30"
            sleep 10
          done
          if [ "$deployed" -ne 1 ]; then
            echo "LIVE_STATUS=DEPLOY_PENDING" | tee /tmp/tp-v20682-live.txt
            exit 0
          fi

          code="$(curl -sS -L -o /tmp/tp-v20682-product.html -w '%{http_code}' --max-time 20 "$SITE/product/$ROUTE/?qa=$RANDOM")"
          test "$code" = '200'
          grep -q 'data-tp-product-preview="20.6.8.2"' /tmp/tp-v20682-product.html
          grep -q 'OnePlus 7T' /tmp/tp-v20682-product.html
          grep -q 'Product preview' /tmp/tp-v20682-product.html
          grep -q 'Configurations' /tmp/tp-v20682-product.html
          grep -q 'Seller offers' /tmp/tp-v20682-product.html
          grep -q 'Compare 2 sellers' /tmp/tp-v20682-product.html
          ! grep -qi 'This function has crashed' /tmp/tp-v20682-product.html

          curl -fsS --max-time 20 "$SITE/find/?engine=v2064&q=phone&qa=$RANDOM" -o /tmp/tp-v20682-finder.html
          grep -q 'product-preview-bridge-v20-6-8-2.js' /tmp/tp-v20682-finder.html
          echo "LIVE_STATUS=PASS" | tee /tmp/tp-v20682-live.txt

      - name: Publish final V20.6.8.2 summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('# TrendPilot V20.6.8.2 — Product Runtime + Preview Integration Stabilization')
          print()
          print('**ONE STABILIZATION RELEASE INSTALLED TO MAIN after local runtime, identity, seller-count, SEO and CPC checks.**')
          print()
          q=Path('data/product-preview-v20-6/qa-v20-6-8-2.json')
          if q.exists():
              d=json.loads(q.read_text())
              print('## Verified package')
              print(f"- Master product previews: **{d.get('products',0):,}**")
              print(f"- Actionable offers: **{d.get('offers',0):,}**")
              print(f"- TPVID rows preserved: **{d.get('variants',0):,}**")
              one=d.get('onePlus7T',{})
              print(f"- OnePlus 7T: **{one.get('offers',0)} offers from {len(one.get('sellers',[]))} sellers**")
              print(f"- CPC-capable seller offers preserved: **{d.get('cpcCapableOffers',0):,}**")
              print(f"- CPC destination mutation failures: **0**")
              print(f"- QA failures: **{len(d.get('failures',[]))}**")
          print()
          print('## What changed')
          print('- Removed the deployed Product Preview dependency on `fileURLToPath(import.meta.url)` and added a bounded runtime data locator.')
          print('- Product Preview is now the first click from V20.6 Finder product cards; comparison remains available from the preview page.')
          print('- Product pages show image, concise shopper details, price range, offer count, seller count, configurations and seller offers.')
          print('- Long product titles are clamped visually on mobile while the full title remains in HTML/SEO metadata.')
          print('- Generic variant labels are presented as shopper-friendly configurations without changing TPVID identity.')
          print('- Seller count and offer count are separate: multiple Alibaba listings no longer pretend to be multiple sellers.')
          print('- Outbound seller redirects preserve the exact committed affiliate/tracking URL; CPC-capable routes are not rewritten.')
          print('- V19 catalogs and the stable V20.6.7 TPID/TPVID/TPOID package are guarded from modification.')
          print()
