name: Probe Joom GB XML feed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-joom-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download a private sample from Joom feed
        env:
          JOOM_GB_XML_URL: ${{ secrets.JOOM_GB_XML_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${JOOM_GB_XML_URL:-}" ]; then
            echo "JOOM_GB_XML_URL secret is missing."
            exit 1
          fi

          mkdir -p automation/cache data

          python - <<'PY'
          import gzip, io, os, urllib.parse, urllib.request
          from pathlib import Path

          url = os.environ["JOOM_GB_XML_URL"].strip()
          for invisible in ("\u200b", "\u200c", "\u200d", "\ufeff"):
              url = url.replace(invisible, "")

          parts = urllib.parse.urlsplit(url)
          host = (parts.hostname or "").encode("idna").decode("ascii")
          netloc = host
          if parts.port:
              netloc += f":{parts.port}"
          safe_url = urllib.parse.urlunsplit((
              parts.scheme,
              netloc,
              urllib.parse.quote(parts.path, safe="/%:@!$&'()*+,;=-._~"),
              urllib.parse.quote(parts.query, safe="=&%/:?+,$;@-._~!()*'[]"),
              ""
          ))

          req = urllib.request.Request(
              safe_url,
              headers={
                  "User-Agent": "Mozilla/5.0 TrendPilotAI-JoomProbe/1.0",
                  "Accept": "application/xml,text/xml,text/plain,*/*",
                  "Accept-Encoding": "gzip",
              },
          )

          limit = 8 * 1024 * 1024
          with urllib.request.urlopen(req, timeout=90) as resp:
              raw = resp.read(limit)

          if raw[:2] == b"\x1f\x8b":
              raw = gzip.GzipFile(fileobj=io.BytesIO(raw)).read(limit)

          probe = raw[:4096].lstrip().lower()
          if probe.startswith(b"<!doctype html") or probe.startswith(b"<html"):
              raise SystemExit("Joom URL returned HTML instead of XML.")

          Path("automation/cache/joom-gb-sample.xml").write_bytes(raw)
          print(f"Downloaded private XML sample: {len(raw):,} bytes")
          PY

      - name: Detect Joom XML structure
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from collections import Counter, defaultdict
          from pathlib import Path

          raw = Path("automation/cache/joom-gb-sample.xml").read_bytes()

          def local(tag):
              tag = str(tag)
              return tag.rsplit("}", 1)[-1] if "}" in tag else tag

          tag_counts = Counter()
          child_sets = defaultdict(Counter)
          attr_sets = defaultdict(Counter)
          examples = defaultdict(list)

          parser = ET.XMLPullParser(events=("end",))
          try:
              for i in range(0, len(raw), 65536):
                  parser.feed(raw[i:i+65536])
                  for _, elem in parser.read_events():
                      tag = local(elem.tag)
                      tag_counts[tag] += 1
                      children = [local(c.tag) for c in list(elem)]
                      for child in children:
                          child_sets[tag][child] += 1
                      for attr in elem.attrib:
                          attr_sets[tag][local(attr)] += 1

                      if len(examples[tag]) < 2 and children:
                          sample = {}
                          for c in list(elem)[:20]:
                              key = local(c.tag)
                              text = (c.text or "").strip()
                              low = key.lower()
                              if "url" in low or "link" in low or "token" in low:
                                  sample[key] = "[redacted]"
                              elif text:
                                  sample[key] = text[:100]
                          if sample:
                              examples[tag].append(sample)
                      elem.clear()
          except ET.ParseError:
              pass

          field_hints = {
              "id","title","name","description","link","url","price","sale_price",
              "image_link","picture","category","categoryid","product_type",
              "availability","currency","currencyid","vendor","brand"
          }

          candidates = []
          for tag, count in tag_counts.items():
              children = list(child_sets[tag].keys())
              score = sum(1 for c in children if c.lower() in field_hints)
              if score >= 2:
                  candidates.append({
                      "tag": tag,
                      "seenClosedRecords": count,
                      "fieldHintScore": score,
                      "childTags": children[:80],
                      "attributes": list(attr_sets[tag].keys())[:40],
                      "safeExamples": examples[tag],
                  })

          candidates.sort(
              key=lambda x: (x["fieldHintScore"], x["seenClosedRecords"]),
              reverse=True
          )

          report = {
              "sourceId": "admitad-joom-gb",
              "probeVersion": "1.0.0",
              "sampleBytes": len(raw),
              "candidateRecordTags": candidates[:10],
              "mostFrequentTags": tag_counts.most_common(50),
              "note": "Only structure is stored. Private URLs are not stored in this report."
          }

          Path("data/joom-feed-probe.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          if not candidates:
              raise SystemExit("No likely product record detected in the first 8 MB.")

          print("Best candidate record:", candidates[0]["tag"])
          print("Detected fields:", ", ".join(candidates[0]["childTags"][:40]))
          PY

      - name: Save probe report to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/joom-feed-probe.json
          if git diff --cached --quiet; then
            echo "Probe report unchanged."
            exit 0
          fi
          git commit -m "Probe Joom GB XML feed structure"
          git push
