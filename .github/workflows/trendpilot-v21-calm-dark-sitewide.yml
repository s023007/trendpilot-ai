name: TrendPilot V21 — Calm Dark Sitewide Rollout + Android QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-calm-dark-sitewide.yml
      - css/trendpilot-calm-dark-v21.css
      - scripts/qa-v21-calm-dark-sitewide.mjs
      - index.html
      - find/index.html
      - compare/index.html
      - deals/index.html
      - rare-used/index.html
      - products/index.html
      - price-watch/index.html
      - tickets/index.html
      - guides/index.html
      - wholesale/index.html
      - sourcing/index.html
      - software/index.html
      - netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v21-calm-dark-sitewide
  cancel-in-progress: true

jobs:
  rollout-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Calm Dark to public shopping surfaces
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          theme='<link rel="stylesheet" href="/css/trendpilot-calm-dark-v21.css?v=21.0.0">'
          pages=[
            'index.html','find/index.html','compare/index.html','deals/index.html','rare-used/index.html',
            'products/index.html','price-watch/index.html','tickets/index.html','guides/index.html',
            'wholesale/index.html','sourcing/index.html','software/index.html'
          ]
          changed=[]
          for name in pages:
            p=Path(name)
            if not p.exists():
              continue
            s=p.read_text(encoding='utf-8')
            old=s
            if 'trendpilot-calm-dark-v21.css' not in s and '</head>' in s:
              s=s.replace('</head>',theme+'</head>',1)
            s=re.sub(r'<meta name="theme-color" content="[^"]*">','<meta name="theme-color" content="#0d1630">',s,count=1,flags=re.I)
            if 'name="color-scheme"' in s:
              s=re.sub(r'<meta name="color-scheme" content="[^"]*">','<meta name="color-scheme" content="dark">',s,count=1,flags=re.I)
            elif '<head>' in s:
              s=s.replace('<head>','<head><meta name="color-scheme" content="dark">',1)
            if s!=old:
              p.write_text(s,encoding='utf-8')
              changed.append(name)

          fn=Path('netlify/functions/product-preview-v20-9-6-mobile-polish.cjs')
          if fn.exists():
            s=fn.read_text(encoding='utf-8')
            old=s
            needle='function polish(body){\n  if(!body || !/<html/i.test(body)) return body;\n'
            add=(needle+
              "  if(!/trendpilot-calm-dark-v21\\.css/i.test(body)) body=body.replace(/<\\/head>/i,'<link rel=\"stylesheet\" href=\"/css/trendpilot-calm-dark-v21.css?v=21.0.0\"></head>');\n"
              "  body=body.replace(/<meta name=\"theme-color\" content=\"[^\"]*\">/i,'<meta name=\"theme-color\" content=\"#0d1630\">');\n"
            )
            if 'trendpilot-calm-dark-v21.css' not in s:
              if needle not in s:
                raise SystemExit('Could not find product polish insertion point')
              s=s.replace(needle,add,1)
            if s!=old:
              fn.write_text(s,encoding='utf-8')
              changed.append(str(fn))

          qa=Path('.github/workflows/trendpilot-v20-9-3-live-shopper-e2e.yml')
          if qa.exists():
            s=qa.read_text(encoding='utf-8')
            old=s
            marker='      - css/trendpilot-calm-dark-v21.css\n'
            anchor='      - css/compare-v20-9.css\n'
            if marker not in s and anchor in s:
              s=s.replace(anchor,anchor+marker,1)
            if s!=old:
              qa.write_text(s,encoding='utf-8')
              changed.append(str(qa))

          print('Theme patched:', ', '.join(changed) if changed else 'already current')
          PY

      - name: Validate theme wiring before commit
        shell: bash
        run: |
          set -euo pipefail
          test -s css/trendpilot-calm-dark-v21.css
          for p in index.html find/index.html compare/index.html deals/index.html rare-used/index.html; do
            grep -q 'trendpilot-calm-dark-v21.css?v=21.0.0' "$p"
            grep -q 'theme-color" content="#0d1630"' "$p"
          done
          grep -q 'trendpilot-calm-dark-v21.css?v=21.0.0' netlify/functions/product-preview-v20-9-6-mobile-polish.cjs

      - name: Commit V21 presentation wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html find/index.html compare/index.html deals/index.html rare-used/index.html \
            products/index.html price-watch/index.html tickets/index.html guides/index.html wholesale/index.html sourcing/index.html software/index.html \
            netlify/functions/product-preview-v20-9-6-mobile-polish.cjs .github/workflows/trendpilot-v20-9-3-live-shopper-e2e.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Calm Dark wiring already committed.'
          else
            git commit -m 'TrendPilot V21 apply Calm Dark across public shopping pages'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Wait for public V21 deployment
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_URL='https://trendpilotchoice.com/product/hot-sale-original-global-official-version-xiaomi-redmi-note-8-48mp-quad-ai-back---d0f4e3ec74717f/'
          for i in $(seq 1 42); do
            css=0; home=0; finder=0; product=0; rare=0
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/css/trendpilot-calm-dark-v21.css?v=21.0.0' -o /tmp/theme.css && grep -q -- '--tp21-bg:#0d1630' /tmp/theme.css && css=1 || true
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/' -o /tmp/home.html && grep -q 'trendpilot-calm-dark-v21.css?v=21.0.0' /tmp/home.html && home=1 || true
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/find/' -o /tmp/find.html && grep -q 'trendpilot-calm-dark-v21.css?v=21.0.0' /tmp/find.html && finder=1 || true
            curl -fsSL --max-time 20 "$PRODUCT_URL" -o /tmp/product.html && grep -q 'trendpilot-calm-dark-v21.css?v=21.0.0' /tmp/product.html && product=1 || true
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/rare-used/' -o /tmp/rare.html && grep -q 'trendpilot-calm-dark-v21.css?v=21.0.0' /tmp/rare.html && rare=1 || true
            if [ "$css" = 1 ] && [ "$home" = 1 ] && [ "$finder" = 1 ] && [ "$product" = 1 ] && [ "$rare" = 1 ]; then
              echo 'V21 Calm Dark is live on core public pages.'
              exit 0
            fi
            echo "Waiting for V21 deploy ($i/42): css=$css home=$home finder=$finder product=$product rare=$rare"
            sleep 10
          done
          echo 'V21 public deployment did not become fully reachable in time.'
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run V21 site-wide Android visual QA
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        run: node scripts/qa-v21-calm-dark-sitewide.mjs

      - name: Run existing shopper truth regression QA
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa-v20-9-live-shopper.mjs
          node scripts/qa-v20-9-5-compare-seller.mjs

      - name: Write V21 summary
        if: always()
        shell: bash
        run: |
          echo '# TrendPilot V21 — Calm Dark Sitewide' >> "$GITHUB_STEP_SUMMARY"
          if [ -s artifacts/v21-calm-dark/report.json ]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/v21-calm-dark/report.json','utf8'));
          console.log(`- Visual system QA: **${r.passed?'PASS':'FAIL'}**`);
          console.log(`- Pages: **${Object.keys(r.pages||{}).join(', ')}**`);
          for(const [k,v] of Object.entries(r.checks||{})) console.log(`- ${v?'✅':'❌'} ${k}`);
          if(r.error){console.log();console.log('```');console.log(r.error);console.log('```');}
          NODE
          else
            echo '- Visual QA report was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload V21 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v21-calm-dark-sitewide
          path: artifacts/v21-calm-dark
          if-no-files-found: ignore
