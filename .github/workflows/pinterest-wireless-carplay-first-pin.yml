name: Buffer Reset + Wireless CarPlay First Pin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pinterest-wireless-carplay-first-pin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove old unsent Buffer posts and queue Wireless CarPlay Pin
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const apiKey = process.env.BUFFER_API_KEY;
          const result = {
            started_at: new Date().toISOString(),
            status: 'running',
            organization: null,
            channels: [],
            deleted_unsent: [],
            queued: null,
            error: null
          };

          const out = 'data/runtime/buffer-reset-result.json';
          fs.mkdirSync('data/runtime', { recursive: true });
          const save = () => fs.writeFileSync(out, JSON.stringify(result, null, 2) + '\n');

          async function gql(query, variables = {}, label = 'Buffer') {
            const response = await fetch('https://api.buffer.com', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${apiKey}`,
              },
              body: JSON.stringify({ query, variables }),
            });
            const raw = await response.text();
            let body;
            try { body = JSON.parse(raw); }
            catch { throw new Error(`${label}: non-JSON HTTP ${response.status}: ${raw.slice(0, 500)}`); }
            if (!response.ok || body.errors?.length) {
              throw new Error(`${label}: HTTP ${response.status} ${JSON.stringify(body)}`);
            }
            return body.data;
          }

          async function deletePost(id) {
            const data = await gql(
              `mutation Delete($input: DeletePostInput!) {
                deletePost(input: $input) {
                  __typename
                  ... on DeletePostSuccess { id }
                  ... on VoidMutationError { message }
                }
              }`,
              { input: { id } },
              `delete ${id}`,
            );
            const payload = data?.deletePost;
            if (!payload || payload.__typename !== 'DeletePostSuccess') {
              throw new Error(`Delete failed for ${id}: ${payload?.message || payload?.__typename || 'unknown error'}`);
            }
          }

          (async () => {
            if (!apiKey) throw new Error('BUFFER_API_KEY is missing');

            const account = await gql('query { account { organizations { id name } } }', {}, 'account');
            const org = account?.account?.organizations?.[0];
            if (!org) throw new Error('No Buffer organization found');
            result.organization = { id: org.id, name: org.name };

            const channelData = await gql(
              `query Channels($org: OrganizationId!) {
                channels(input: { organizationId: $org }) {
                  id name displayName service isQueuePaused
                }
              }`,
              { org: org.id },
              'channels',
            );
            const channels = channelData?.channels || [];
            result.channels = channels.map(c => ({
              id: c.id,
              service: c.service,
              name: c.displayName || c.name,
              queuePaused: !!c.isQueuePaused,
            }));

            // Clean every old post that has not been published yet.
            // Sent/sending posts are intentionally preserved.
            for (const channel of channels) {
              const pendingData = await gql(
                `query Pending($org: OrganizationId!, $channel: ChannelId!) {
                  posts(first: 50, input: {
                    organizationId: $org,
                    filter: { status: [draft, scheduled], channelIds: [$channel] }
                  }) {
                    edges { node { id text status dueAt channelService } }
                  }
                }`,
                { org: org.id, channel: channel.id },
                `pending ${channel.service}`,
              );
              const pending = (pendingData?.posts?.edges || []).map(e => e.node);
              for (const post of pending) {
                await deletePost(post.id);
                result.deleted_unsent.push({
                  id: post.id,
                  service: channel.service,
                  status: post.status,
                  dueAt: post.dueAt || null,
                  textPreview: String(post.text || '').replace(/\s+/g, ' ').trim().slice(0, 120),
                });
              }
            }

            const pinterest = channels.find(c => c.service === 'pinterest');
            if (!pinterest) throw new Error('Pinterest is not connected in Buffer');

            const boardData = await gql(
              `query PinterestBoards($id: ChannelId!) {
                channel(input: { id: $id }) {
                  metadata {
                    ... on PinterestMetadata {
                      boards { id name serviceId url }
                    }
                  }
                }
              }`,
              { id: pinterest.id },
              'Pinterest boards',
            );
            const boards = boardData?.channel?.metadata?.boards || [];
            if (!boards.length) throw new Error('No Pinterest boards are visible to Buffer');
            const board = boards.find(b => /^tech\s*&\s*gadget/i.test(String(b.name || '').trim())) || boards[0];

            const title = 'Will a Wireless CarPlay Adapter Work in Your Car?';
            const text = 'Before buying a wireless CarPlay adapter, check the one thing many shoppers miss: the common wired-to-wireless type normally expects your car to support wired Apple CarPlay first. TrendPilot shows five practical checks before you order. Affiliate disclosure: TrendPilot may earn a commission from some seller links.';
            const imageUrl = 'https://trendpilotchoice.com/images/media/carplay-compatibility.png';
            const destination = 'https://trendpilotchoice.com/products/wireless-carplay-adapters/guide/?post_id=carplay-pg01&creative_id=will-it-work-v1&utm_source=pinterest&utm_medium=organic_social&utm_campaign=wireless-carplay-pinterest-growth-v1&utm_content=will-it-work';

            const input = {
              text,
              channelId: pinterest.id,
              schedulingType: 'automatic',
              mode: 'addToQueue',
              saveToDraft: false,
              needsApproval: false,
              aiAssisted: false,
              source: 'trendpilot-buffer-reset-wireless-carplay',
              assets: [{
                image: {
                  url: imageUrl,
                  metadata: {
                    altText: 'Wireless CarPlay adapter compatibility guide explaining what to check before buying'
                  }
                }
              }],
              metadata: {
                pinterest: {
                  boardServiceId: board.serviceId,
                  title,
                  url: destination,
                }
              },
            };

            const created = await gql(
              `mutation Create($input: CreatePostInput!) {
                createPost(input: $input) {
                  __typename
                  ... on PostActionSuccess {
                    post { id text dueAt status channelId channelService }
                  }
                  ... on MutationError { message }
                  ... on InvalidInputError { message }
                  ... on UnauthorizedError { message }
                  ... on UnexpectedError { message }
                  ... on RestProxyError { message }
                  ... on LimitReachedError { message }
                }
              }`,
              { input },
              'create Wireless CarPlay Pin',
            );

            const payload = created?.createPost;
            if (!payload || payload.__typename !== 'PostActionSuccess' || !payload.post?.id) {
              throw new Error(`Buffer createPost failed: ${payload?.__typename || 'unknown'}: ${payload?.message || 'unknown error'}`);
            }

            result.status = 'ok';
            result.queued = {
              id: payload.post.id,
              status: payload.post.status,
              dueAt: payload.post.dueAt || null,
              board: board.name,
              title,
              imageUrl,
              destination,
            };
            result.finished_at = new Date().toISOString();
            save();
            console.log('BUFFER_RESET_AND_WIRELESS_CARPLAY_OK', JSON.stringify(result));
          })().catch((error) => {
            result.status = 'error';
            result.error = error?.message || String(error);
            result.finished_at = new Date().toISOString();
            save();
            console.error('BUFFER_RESET_AND_WIRELESS_CARPLAY_FAILED', result.error);
          });
          NODE

      - name: Persist reset result in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/buffer-reset-result.json
          if git diff --cached --quiet; then
            echo "No result change to commit"
            exit 0
          fi
          git commit -m "Record Buffer reset and Wireless CarPlay queue result"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce successful reset and queue
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./data/runtime/buffer-reset-result.json');
          console.log(JSON.stringify(r, null, 2));
          if (r.status !== 'ok' || !r.queued?.id) process.exit(1);
          NODE
