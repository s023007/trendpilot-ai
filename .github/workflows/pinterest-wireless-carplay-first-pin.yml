name: Buffer Clean Pending Posts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pinterest-wireless-carplay-first-pin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete every unpublished Buffer post
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const apiKey = process.env.BUFFER_API_KEY;
          const out = 'data/runtime/buffer-cleanup-result.json';
          const result = {
            started_at: new Date().toISOString(),
            status: 'running',
            channels: [],
            deleted_unsent: [],
            remaining_unsent: [],
            error: null
          };
          fs.mkdirSync('data/runtime', { recursive: true });
          const save = () => fs.writeFileSync(out, JSON.stringify(result, null, 2) + '\n');

          async function gql(query, variables = {}, label = 'Buffer') {
            const response = await fetch('https://api.buffer.com', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${apiKey}`,
              },
              body: JSON.stringify({ query, variables }),
            });
            const raw = await response.text();
            let body;
            try { body = JSON.parse(raw); }
            catch { throw new Error(`${label}: non-JSON HTTP ${response.status}: ${raw.slice(0, 500)}`); }
            if (!response.ok || body.errors?.length) {
              throw new Error(`${label}: HTTP ${response.status} ${JSON.stringify(body)}`);
            }
            return body.data;
          }

          async function deletePost(id) {
            const data = await gql(
              `mutation Delete($input: DeletePostInput!) {
                deletePost(input: $input) {
                  __typename
                  ... on DeletePostSuccess { id }
                  ... on VoidMutationError { message }
                }
              }`,
              { input: { id } },
              `delete ${id}`,
            );
            const payload = data?.deletePost;
            if (!payload || payload.__typename !== 'DeletePostSuccess') {
              throw new Error(`Delete failed for ${id}: ${payload?.message || payload?.__typename || 'unknown error'}`);
            }
          }

          async function getPending(orgId, channel) {
            const data = await gql(
              `query Pending($org: OrganizationId!, $channel: ChannelId!) {
                posts(first: 50, input: {
                  organizationId: $org,
                  filter: { status: [draft, scheduled], channelIds: [$channel] }
                }) {
                  edges { node { id text status dueAt channelService } }
                }
              }`,
              { org: orgId, channel: channel.id },
              `pending ${channel.service}`,
            );
            return (data?.posts?.edges || []).map(edge => edge.node);
          }

          (async () => {
            if (!apiKey) throw new Error('BUFFER_API_KEY is missing');

            const account = await gql('query { account { organizations { id name } } }', {}, 'account');
            const org = account?.account?.organizations?.[0];
            if (!org) throw new Error('No Buffer organization found');

            const channelData = await gql(
              `query Channels($org: OrganizationId!) {
                channels(input: { organizationId: $org }) {
                  id name displayName service isQueuePaused
                }
              }`,
              { org: org.id },
              'channels',
            );
            const channels = channelData?.channels || [];
            result.channels = channels.map(c => ({
              id: c.id,
              service: c.service,
              name: c.displayName || c.name,
              queuePaused: !!c.isQueuePaused,
            }));

            for (const channel of channels) {
              const pending = await getPending(org.id, channel);
              for (const post of pending) {
                await deletePost(post.id);
                result.deleted_unsent.push({
                  id: post.id,
                  service: channel.service,
                  status: post.status,
                  dueAt: post.dueAt || null,
                  textPreview: String(post.text || '').replace(/\s+/g, ' ').trim().slice(0, 160),
                });
              }
            }

            for (const channel of channels) {
              const pending = await getPending(org.id, channel);
              for (const post of pending) {
                result.remaining_unsent.push({
                  id: post.id,
                  service: channel.service,
                  status: post.status,
                  dueAt: post.dueAt || null,
                });
              }
            }

            result.status = result.remaining_unsent.length === 0 ? 'ok' : 'incomplete';
            result.finished_at = new Date().toISOString();
            save();
            console.log('BUFFER_CLEANUP_RESULT', JSON.stringify(result));
            if (result.status !== 'ok') process.exitCode = 1;
          })().catch((error) => {
            result.status = 'error';
            result.error = error?.message || String(error);
            result.finished_at = new Date().toISOString();
            save();
            console.error('BUFFER_CLEANUP_FAILED', result.error);
            process.exitCode = 1;
          });
          NODE

      - name: Persist cleanup result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/buffer-cleanup-result.json
          if git diff --cached --quiet; then
            echo "No cleanup result change to commit"
            exit 0
          fi
          git commit -m "Record Buffer pending-post cleanup result"
          git pull --rebase origin main
          git push origin HEAD:main
