name: Pinterest Wireless CarPlay First Pin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pinterest-wireless-carplay-first-pin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-first-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - name: Queue first Wireless CarPlay Pin in Buffer
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BUFFER_API_KEY:-}" || { echo "BUFFER_API_KEY is missing"; exit 1; }
          node <<'NODE'
          const apiKey = process.env.BUFFER_API_KEY;
          const imageUrl = 'https://trendpilotchoice.com/images/media/carplay-compatibility.png';
          const title = 'Will a Wireless CarPlay Adapter Work in Your Car?';
          const text = 'Before buying a wireless CarPlay adapter, check the one thing many shoppers miss: the common wired-to-wireless type normally expects your car to support wired Apple CarPlay first. TrendPilot shows five practical checks before you order. Affiliate disclosure: TrendPilot may earn a commission from some seller links.';
          const destination = 'https://trendpilotchoice.com/products/wireless-carplay-adapters/guide/?post_id=carplay-pg01&creative_id=will-it-work-v1&utm_source=pinterest&utm_medium=organic_social&utm_campaign=wireless-carplay-pinterest-growth-v1&utm_content=will-it-work';

          async function gql(query, variables = {}, label = 'Buffer') {
            const response = await fetch('https://api.buffer.com', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` },
              body: JSON.stringify({ query, variables }),
            });
            const raw = await response.text();
            let body;
            try { body = JSON.parse(raw); } catch { throw new Error(`${label}: non-JSON HTTP ${response.status}: ${raw.slice(0,500)}`); }
            if (!response.ok || body.errors?.length) throw new Error(`${label}: HTTP ${response.status} ${JSON.stringify(body)}`);
            return body.data;
          }

          const account = await gql('query { account { organizations { id name } } }', {}, 'account');
          const org = account?.account?.organizations?.[0];
          if (!org) throw new Error('No Buffer organization found');

          const channelData = await gql(`query Channels($org: OrganizationId!) { channels(input:{organizationId:$org}) { id name displayName service isQueuePaused } }`, { org: org.id }, 'channels');
          const pinterest = (channelData?.channels || []).find(c => c.service === 'pinterest');
          if (!pinterest) throw new Error('Pinterest is not connected in Buffer');

          const boardData = await gql(`query P($id: ChannelId!) { channel(input:{id:$id}) { metadata { ... on PinterestMetadata { boards { id name serviceId url } } } } }`, { id: pinterest.id }, 'boards');
          const boards = boardData?.channel?.metadata?.boards || [];
          if (!boards.length) throw new Error('No Pinterest boards are visible to Buffer');
          const board = boards.find(b => /^tech\s*&\s*gadget/i.test(String(b.name || '').trim())) || boards[0];
          console.log('PINTEREST_BOARD', JSON.stringify({selected: board.name, all: boards.map(b => b.name)}));

          const existingData = await gql(`query Existing($org: OrganizationId!, $channel: ChannelId!) { posts(first:50,input:{organizationId:$org,filter:{status:[draft,scheduled,sending,sent],channelIds:[$channel]}}) { edges { node { id text status dueAt } } } }`, { org: org.id, channel: pinterest.id }, 'existing posts');
          const existing = (existingData?.posts?.edges || []).map(e => e.node);
          const needle = text.replace(/\s+/g,' ').trim().toLowerCase().slice(0,140);
          const match = existing.find(p => String(p.text || '').replace(/\s+/g,' ').trim().toLowerCase().startsWith(needle));
          if (match) {
            console.log('PIN_ALREADY_EXISTS', JSON.stringify(match));
            process.exit(0);
          }

          const input = {
            text,
            channelId: pinterest.id,
            schedulingType: 'automatic',
            mode: 'addToQueue',
            saveToDraft: false,
            needsApproval: false,
            aiAssisted: true,
            source: 'trendpilot-wireless-carplay-first-pin',
            assets: [{ image: { url: imageUrl, metadata: { altText: 'Wireless CarPlay adapter compatibility guide explaining what to check before buying' } } }],
            metadata: { pinterest: { boardServiceId: board.serviceId, title, url: destination } },
          };

          const created = await gql(`mutation Create($input: CreatePostInput!) { createPost(input:$input) { __typename ... on PostActionSuccess { post { id text dueAt status channelId channelService } } ... on MutationError { message } ... on InvalidInputError { message } ... on UnauthorizedError { message } ... on UnexpectedError { message } ... on RestProxyError { message } ... on LimitReachedError { message } } }`, { input }, 'create post');
          const payload = created?.createPost;
          if (!payload || payload.__typename !== 'PostActionSuccess' || !payload.post?.id) throw new Error(`Buffer createPost failed: ${payload?.__typename || 'unknown'} ${payload?.message || ''}`);
          console.log('WIRELESS_CARPLAY_PIN_QUEUED', JSON.stringify(payload.post));
          NODE
