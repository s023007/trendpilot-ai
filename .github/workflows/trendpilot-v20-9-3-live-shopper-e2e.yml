name: TrendPilot V20.9.4 — Restored Finder Mobile E2E

on:
  push:
    branches: [main]
    paths:
      - scripts/qa-v20-9-live-shopper.mjs
      - .github/workflows/trendpilot-v20-9-3-live-shopper-e2e.yml
      - data/v20-9/**
      - find/index.html
      - item/index.html
      - compare/index.html
      - js/finder-v20-7-9.js
      - js/universal-discovery-v20-8.js
      - js/universal-discovery-v20-9-1.js
      - js/finder-shell-v20-9.js
      - js/item-detail-v20-9.js
      - js/compare-v20-9.js
      - js/compare-state-v20-9.js
      - css/v20-8-universal.css
      - css/compare-v20-9.css
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendpilot-v20-9-4-live-shopper
  cancel-in-progress: true

jobs:
  live-mobile-shopper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Wait for restored finder and V20.9.4 semantic data
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            html_ok=0
            semantic_ok=0
            if curl -fsSL --max-time 20 'https://trendpilotchoice.com/find/' -o /tmp/tp-find.html; then
              if grep -q 'finder-v20-7-9.js?v=20.7.11' /tmp/tp-find.html && grep -q 'universal-discovery-v20-8.js?v=20.8.5' /tmp/tp-find.html; then
                html_ok=1
              fi
            fi
            if curl -fsSL --max-time 20 'https://trendpilotchoice.com/data/v20-9/semantic-closeout.json?v=20.9.4' -o /tmp/tp-semantic.json; then
              if python -c "import json; x=json.load(open('/tmp/tp-semantic.json')); assert x.get('version')=='20.9.4' and x.get('violations')==0 and x.get('records')==52031 and x.get('unclassifiedAfter',999999)<=2500"; then
                semantic_ok=1
              fi
            fi
            if [ "$html_ok" = 1 ] && [ "$semantic_ok" = 1 ]; then
              echo 'Restored working finder and V20.9.4 semantic data are live.'
              exit 0
            fi
            echo "Waiting for public deploy ($i/36): finder=$html_ok semantic=$semantic_ok"
            sleep 10
          done
          echo 'Restored finder did not become reachable in time.'
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Android restored-finder journey
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        run: node scripts/qa-v20-9-live-shopper.mjs

      - name: Write shopper QA summary
        if: always()
        shell: bash
        run: |
          if [ ! -s artifacts/live-shopper/report.json ]; then
            echo '# TrendPilot V20.9.4 — Restored Finder Mobile E2E' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '**No report produced.** Browser setup or public deployment failed before the finder test could run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/live-shopper/report.json','utf8'));
          console.log('# TrendPilot V20.9.4 — Restored Finder Mobile E2E');
          console.log();
          console.log(`- Overall: **${r.passed?'PASS':'FAIL'}**`);
          console.log(`- Public site: **${r.base}**`);
          console.log(`- Finder mode: **${r.mode||'unknown'}**`);
          console.log(`- Queries tested: **${(r.queries||[]).map(x=>x.query).join(', ')}**`);
          for(const q of (r.queries||[])) console.log(`- ${q.query}: **${q.count} cards**, first render **${q.renderMs} ms**, first: ${q.first?.title||''}`);
          console.log(`- Seller filter tested: **${r.samples?.seller||'not reached'}**`);
          console.log(`- Internal detail route: **${r.samples?.detailHref||'not reached'}**`);
          console.log();
          console.log('## Checks');
          for(const [k,v] of Object.entries(r.checks||{})) console.log(`- ${v?'✅':'❌'} ${k}`);
          if(r.error){console.log();console.log('## Failure');console.log('```');console.log(r.error);console.log('```');}
          NODE

      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v20-9-4-restored-finder
          path: artifacts/live-shopper
          if-no-files-found: ignore
