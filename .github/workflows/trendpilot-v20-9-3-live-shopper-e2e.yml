name: TrendPilot V20.9.6 — Compact Product Mobile UI + Truth E2E

on:
  push:
    branches: [main]
    paths:
      - scripts/qa-v20-9-live-shopper.mjs
      - scripts/qa-v20-9-5-compare-seller.mjs
      - scripts/qa-v20-9-6-mobile-product-ui.mjs
      - .github/workflows/trendpilot-v20-9-3-live-shopper-e2e.yml
      - netlify.toml
      - netlify/functions/product-preview-v20-9-5.cjs
      - netlify/functions/product-preview-v20-9-6.cjs
      - netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
      - data/v20-9/**
      - find/index.html
      - product/index.html
      - item/index.html
      - compare/index.html
      - js/finder-v20-7-9.js
      - js/finder-restored-semantic-guard-v20-9-4.js
      - js/product-detail-truth-v20-9-5.js
      - js/universal-discovery-v20-8.js
      - js/universal-discovery-v20-9-1.js
      - js/finder-shell-v20-9.js
      - js/item-detail-v20-9.js
      - js/compare-v20-9.js
      - js/compare-state-v20-9.js
      - css/v20-8-universal.css
      - css/compare-v20-9.css
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendpilot-v20-9-6-live-shopper
  cancel-in-progress: true

jobs:
  live-mobile-shopper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Wait for restored finder, compact product UI and V20.9.4 semantic data
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_URL='https://trendpilotchoice.com/product/hot-sale-original-global-official-version-xiaomi-redmi-note-8-48mp-quad-ai-back---d0f4e3ec74717f/'
          for i in $(seq 1 36); do
            finder_ok=0
            product_ok=0
            semantic_ok=0
            if curl -fsSL --max-time 20 'https://trendpilotchoice.com/find/' -o /tmp/tp-find.html; then
              if grep -q 'finder-v20-7-9.js?v=20.7.11' /tmp/tp-find.html && grep -q 'finder-restored-semantic-guard-v20-9-4.js?v=20.9.4' /tmp/tp-find.html; then
                finder_ok=1
              fi
            fi
            if curl -fsSL --max-time 20 "$PRODUCT_URL" -o /tmp/tp-product.html; then
              if grep -q 'data-tp-product-truth="20.9.5"' /tmp/tp-product.html \
                && grep -q 'data-tp-product-ui="20.9.6"' /tmp/tp-product.html \
                && grep -q 'RAM + storage specified' /tmp/tp-product.html \
                && grep -q 'Storage-only records' /tmp/tp-product.html \
                && grep -q 'RAM and storage vary by seller record' /tmp/tp-product.html; then
                product_ok=1
              fi
            fi
            if curl -fsSL --max-time 20 'https://trendpilotchoice.com/data/v20-9/semantic-closeout.json?v=20.9.4' -o /tmp/tp-semantic.json; then
              if python -c "import json; x=json.load(open('/tmp/tp-semantic.json')); assert x.get('version')=='20.9.4' and x.get('violations')==0 and x.get('records')==52031 and x.get('unclassifiedAfter',999999)<=2500"; then
                semantic_ok=1
              fi
            fi
            if [ "$finder_ok" = 1 ] && [ "$product_ok" = 1 ] && [ "$semantic_ok" = 1 ]; then
              echo 'Restored finder, compact V20.9.6 product UI, V20.9.5 truth and V20.9.4 quality data are live.'
              exit 0
            fi
            echo "Waiting for public deploy ($i/36): finder=$finder_ok product=$product_ok semantic=$semantic_ok"
            sleep 10
          done
          echo 'Required public assets did not become reachable in time.'
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Android finder and product-detail journey
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        run: node scripts/qa-v20-9-live-shopper.mjs

      - name: Run Android compact product UI journey
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        run: node scripts/qa-v20-9-6-mobile-product-ui.mjs

      - name: Run Android compare and seller/CPC journey
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        run: node scripts/qa-v20-9-5-compare-seller.mjs

      - name: Write shopper QA summary
        if: always()
        shell: bash
        run: |
          if [ ! -s artifacts/live-shopper/report.json ]; then
            echo '# TrendPilot V20.9.6 — Compact Product Mobile UI + Truth E2E' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '**No report produced.** Browser setup or public deployment failed before the shopper test could run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/live-shopper/report.json','utf8'));
          console.log('# TrendPilot V20.9.6 — Compact Product Mobile UI + Truth E2E');
          console.log();
          console.log(`- Product/Finder journey: **${r.passed?'PASS':'FAIL'}**`);
          console.log(`- Public site: **${r.base}**`);
          console.log(`- Finder mode: **${r.mode||'unknown'}**`);
          console.log(`- Queries tested: **${(r.queries||[]).map(x=>x.query).join(', ')}**`);
          for(const q of (r.queries||[])) console.log(`- ${q.query}: **${q.count} cards**, first render **${q.renderMs} ms**, first: ${q.first?.title||''}`);
          console.log(`- Seller filter tested: **${r.samples?.seller||'not reached'}**`);
          console.log(`- Internal detail route: **${r.samples?.detailHref||'not reached'}**`);
          if(r.samples?.redmiDetail) console.log(`- Redmi Note 8 truth sample: **${r.samples.redmiDetail.title||''}**`);
          console.log();
          console.log('## Product/Finder checks');
          for(const [k,v] of Object.entries(r.checks||{})) console.log(`- ${v?'✅':'❌'} ${k}`);
          if(r.error){console.log();console.log('## Product/Finder failure');console.log('```');console.log(r.error);console.log('```');}
          if(fs.existsSync('artifacts/live-shopper/product-ui-v20-9-6.json')){
            const u=JSON.parse(fs.readFileSync('artifacts/live-shopper/product-ui-v20-9-6.json','utf8'));
            console.log();console.log(`## Compact product UI: **${u.passed?'PASS':'FAIL'}**`);
            for(const [k,v] of Object.entries(u.checks||{})) console.log(`- ${v?'✅':'❌'} ${k}`);
            if(u.error){console.log();console.log('### Product UI failure');console.log('```');console.log(u.error);console.log('```');}
          }
          if(fs.existsSync('artifacts/live-shopper/compare-seller-report.json')){
            const c=JSON.parse(fs.readFileSync('artifacts/live-shopper/compare-seller-report.json','utf8'));
            console.log();console.log(`## Compare + Seller/CPC: **${c.passed?'PASS':'FAIL'}**`);
            for(const [k,v] of Object.entries(c.checks||{})) console.log(`- ${v?'✅':'❌'} ${k}`);
            if(c.error){console.log();console.log('### Compare/Seller failure');console.log('```');console.log(c.error);console.log('```');}
          }
          NODE

      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v20-9-6-compact-product-ui-truth
          path: artifacts/live-shopper
          if-no-files-found: ignore
