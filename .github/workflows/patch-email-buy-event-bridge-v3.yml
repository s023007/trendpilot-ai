name: Patch Email Buy Event Bridge V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_email_buy_event_bridge_v3.py'
      - '.github/workflows/patch-email-buy-event-bridge-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch email buy bridge
        run: |
          python3 scripts/patch_email_buy_event_bridge_v3.py
          php -l api/save-search.php
      - name: Commit and push
        run: |
          git config user.name 'trendpilot-email-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/save-search.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix: send email buy CTA through TrendPilot event bridge'
          git pull --rebase origin main
          git push origin HEAD:main
