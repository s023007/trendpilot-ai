name: TrendPilot V21.12 — Sanitize Public Policy Data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-12-sanitize-public-policy-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Remove blocked or unnamed public sellers and coupons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          blocked=re.compile(r'(?:joom|temu|filamentpro)',re.I)

          p=Path('data/admitad-approved-sellers.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          before=len(d.get('sellers',[]))
          d['sellers']=[x for x in d.get('sellers',[]) if str(x.get('name') or '').strip() and not blocked.search(str(x.get('name') or ''))]
          d['version']='21.12.0'
          d['source']='Admitad API active programs for trendpilotchoice.com after TrendPilot public blocklist'
          d['public_blocklist']=['Joom','Temu','FilamentPRO']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('seller manifest:',before,'->',len(d['sellers']))

          p=Path('data/coupons.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows=d.get('coupons',[]);before=len(rows)
          rows=[x for x in rows if not blocked.search(' '.join([str(x.get('merchant_name') or ''),str(x.get('merchant_key') or '')]))]
          d['coupons']=rows;d['count']=len(rows);d['with_codes']=sum(bool(x.get('code')) for x in rows);d['automatic_deals']=len(rows)-d['with_codes'];d['public_blocklist']=['Joom','Temu','FilamentPRO']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('js/coupons-data.js').write_text('window.TREND_PILOT_COUPONS = '+json.dumps(d,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          print('coupons:',before,'->',len(rows))

          rp=Path('data/coupon-report.json')
          if rp.exists():
              r=json.loads(rp.read_text(encoding='utf-8'))
              r['active_coupons']=len(rows);r['public_blocklist']=['Joom','Temu','FilamentPRO'];r['policy_sanitized']=True
              rp.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate public data policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          b=re.compile(r'(?:joom|temu|filamentpro)',re.I)
          for rel in ['data/admitad-approved-sellers.json','data/coupons.json']:
              d=json.loads(Path(rel).read_text(encoding='utf-8'))
              if rel.endswith('approved-sellers.json'):
                  vals=' '.join(str(x.get('name') or '') for x in d.get('sellers',[]))
              else:
                  vals=' '.join(str(x.get('merchant_name') or '')+' '+str(x.get('merchant_key') or '') for x in d.get('coupons',[]))
              if b.search(vals): raise SystemExit('blocked seller remains in '+rel)
          print('Public seller/coupon policy clean.')
          PY
      - name: Commit sanitized data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/admitad-approved-sellers.json data/coupons.json data/coupon-report.json js/coupons-data.js
          if git diff --cached --quiet; then
            echo 'Already sanitized.'
          else
            git commit -m 'TrendPilot V21.12 sanitize public seller and coupon policy data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
