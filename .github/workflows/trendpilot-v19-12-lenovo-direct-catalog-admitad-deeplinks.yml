          set -euo pipefail
          if [ -s data/catalog-v19/V19.12-REPORT.md ]; then
            cat data/catalog-v19/V19.12-REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lenovo audit artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trendpilot-v19-12-lenovo
          path: |
            data/catalog-v19/V19.12-REPORT.md
            data/catalog-v19/source-ingestion/lenovo-admitad-audit.json
            data/catalog-v19/source-ingestion/lenovo-direct-source-audit.json
            data/source-ingestion-v19/lenovo-direct-catalog.json
            data/catalog-v19/source-manifests/lenovo.json
            data/catalog-v19/sellers/lenovo/manifest.json
            data/catalog-v19/sellers/lenovo/audit.json
            data/catalog-v19/seller-build-queue-v3.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
