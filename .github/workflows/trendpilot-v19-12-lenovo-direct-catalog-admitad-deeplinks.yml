name: TrendPilot V19.12 — Seller 12 Lenovo Direct Catalog + Admitad Deep Links

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v19-12-lenovo
  cancel-in-progress: false

jobs:
  seller-12-lenovo:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    env:
      ADMITAD_CLIENT_ID_PRIMARY: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_ID_ALT: ${{ secrets.client_id }}
      ADMITAD_CLIENT_SECRET_PRIMARY: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      ADMITAD_CLIENT_SECRET_ALT: ${{ secrets.client_secret }}
      WEBSITE_ID: "2980568"
      VERSION: "19.12.0"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Verify V19 state before Lenovo
        shell: bash
        run: |
          set -euo pipefail

          test -s scripts/catalog-v19/build-canonical-seller.mjs
          test -s scripts/catalog-v19/discover-seller-sources.mjs
          test -s scripts/catalog-v19/build-global-resolver.mjs
          test -s scripts/catalog-v19/build-source-aware-seller-queue.mjs
          test -s data/catalog-v19/catalog-set-v1.json
          test -s data/catalog-v19/seller-build-queue-v3.json
          test -s data/product-seller-registry-v17.json

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          registry = json.loads(Path("data/product-seller-registry-v17.json").read_text())
          public = {x["name"] for x in registry["sellers"] if x.get("public")}

          assert "Lenovo" in public
          for blocked in ["Joom", "Temu", "FilamentPRO EU CPS"]:
              assert blocked not in public, blocked

          catalog = json.loads((root/"catalog-set-v1.json").read_text())
          names = [x["name"] for x in catalog["sellers"]]

          assert len(names) == 11, names
          assert "MFI Medical" in names
          assert "Lenovo" not in names
          assert len(names) == len(set(names))

          queue = json.loads((root/"seller-build-queue-v3.json").read_text())
          remaining = {x["seller"]: x for x in queue.get("remaining", [])}
          assert "Lenovo" in remaining, remaining
          assert int(remaining["Lenovo"].get("qualifiedProducts", 0)) == 0

          print("V19 pre-Lenovo state PASS.")
          print("Completed sellers:", len(names))
          print("Remaining:", list(remaining))
          PY

      - name: Inspect active Lenovo Admitad campaign and feed purity
        id: admitad
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data/catalog-v19/source-ingestion
          mkdir -p /tmp/lenovo-v19

          python3 - <<'PY'
          import base64, csv, gzip, io, json, os, re, socket
          import urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone

          API = "https://api.admitad.com"
          WEBSITE_ID = int(os.environ["WEBSITE_ID"])
          VERSION = os.environ["VERSION"]
          socket.setdefaulttimeout(40)

          def env_first(*names):
              for name in names:
                  value = (os.environ.get(name) or "").strip()
                  if value:
                      return value
              return ""

          cid = env_first("ADMITAD_CLIENT_ID_PRIMARY", "ADMITAD_CLIENT_ID_ALT")
          secret = env_first("ADMITAD_CLIENT_SECRET_PRIMARY", "ADMITAD_CLIENT_SECRET_ALT")
          if not cid or not secret:
              raise SystemExit("Missing Admitad credentials.")

          def request(url, method="GET", headers=None, data=None, timeout=40):
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "*/*",
                      "User-Agent": "TrendPilot-Lenovo-V19.12/1.0",
                      **(headers or {})
                  }
              )
              return urllib.request.urlopen(req, timeout=timeout)

          def request_json(url, method="GET", headers=None, data=None):
              with request(url, method, headers, data) as resp:
                  return json.loads(resp.read().decode("utf-8", "replace"))

          basic = base64.b64encode(f"{cid}:{secret}".encode()).decode()
          token_body = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": cid,
              "scope": "websites advcampaigns_for_website deeplink_generator"
          }).encode()

          token = request_json(
              f"{API}/token/",
              method="POST",
              headers={
                  "Authorization": f"Basic {basic}",
                  "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
              },
              data=token_body
          ).get("access_token")
          if not token:
              raise SystemExit("Admitad access token was not returned.")

          auth = {"Authorization": f"Bearer {token}"}
          q = urllib.parse.urlencode({
              "limit": 200,
              "offset": 0,
              "connection_status": "active"
          })
          campaigns = request_json(
              f"{API}/advcampaigns/website/{WEBSITE_ID}/?{q}",
              headers=auth
          ).get("results", [])

          lenovo_candidates = [
              c for c in campaigns
              if "lenovo" in str(c.get("name") or "").casefold()
          ]
          if not lenovo_candidates:
              raise SystemExit("No active Lenovo campaign is attached to this Admitad website.")

          lenovo_candidates.sort(
              key=lambda c: (
                  bool(c.get("allow_deeplink")),
                  bool(c.get("show_products_links")),
                  int(c.get("id") or 0)
              ),
              reverse=True
          )
          campaign = lenovo_candidates[0]
          campaign_id = int(campaign.get("id") or 0)
          campaign_name = str(campaign.get("name") or "").strip()
          allow_deeplink = bool(campaign.get("allow_deeplink"))

          if not campaign_id:
              raise SystemExit("Lenovo campaign ID is missing.")
          if not allow_deeplink:
              raise SystemExit(
                  f"Lenovo campaign {campaign_name} ({campaign_id}) does not allow deeplinks."
              )

          def nk(v):
              return re.sub(r"[^a-z0-9]+", "", str(v or "").casefold())

          def pick(row, keys):
              mapping = {nk(k): v for k, v in row.items()}
              for key in keys:
                  value = mapping.get(nk(key))
                  if value not in (None, ""):
                      return str(value).strip()
              return ""

          TITLE = ["name", "title", "productname", "product_name", "product", "offername"]
          BRAND = ["vendor", "brand", "manufacturer", "producer"]
          CATEGORY = ["category", "categoryname", "category_name", "type", "section"]

          lenovo_signal = re.compile(
              r"\b("
              r"lenovo|thinkpad|ideapad|thinkbook|yoga|legion|loq|"
              r"thinkcentre|ideacentre|thinkstation|thinkvision|tab|motorola"
              r")\b",
              re.I
          )
          obvious_noise = re.compile(
              r"\b("
              r"baby|makeup|cosmetic|wig|shoe|dress|handbag|pet food|"
              r"teapot|scaffolding|hydraulic|sardine|sex toy|dildo|"
              r"garden pergola|false eyelash|nail polish"
              r")\b",
              re.I
          )

          def stream_csv(url, limit=300):
              with request(url, timeout=50) as resp:
                  raw = resp
                  enc = (resp.headers.get("Content-Encoding") or "").lower()
                  ctype = (resp.headers.get("Content-Type") or "").lower()
                  if "gzip" in enc or "gzip" in ctype or url.lower().endswith(".gz"):
                      raw = gzip.GzipFile(fileobj=resp)
                  text = io.TextIOWrapper(raw, encoding="utf-8-sig", errors="replace", newline="")
                  probe = text.read(256 * 1024)
                  if not probe:
                      return
                  try:
                      dialect = csv.Sniffer().sniff(probe[:20000], delimiters=",;\t|")
                  except Exception:
                      dialect = csv.excel
                  reader = csv.DictReader(io.StringIO(probe), dialect=dialect)
                  count = 0
                  for row in reader:
                      if isinstance(row, dict):
                          yield {str(k or ""): v for k, v in row.items()}
                          count += 1
                          if count >= limit:
                              break

          def stream_xml(url, limit=300):
              with request(url, timeout=50) as resp:
                  count = 0
                  for _, elem in ET.iterparse(resp, events=("end",)):
                      tag = str(elem.tag).split("}", 1)[-1].lower()
                      if tag not in ("offer", "product", "item", "entry"):
                          continue
                      row = {}
                      for child in list(elem):
                          ctag = str(child.tag).split("}", 1)[-1]
                          value = (child.text or "").strip()
                          if value:
                              row[ctag] = value
                      if row:
                          yield row
                          count += 1
                      elem.clear()
                      if count >= limit:
                          break

          feeds = []
          if campaign.get("products_csv_link"):
              feeds.append(("main-csv", "csv", campaign["products_csv_link"]))
          if campaign.get("products_xml_link"):
              feeds.append(("main-xml", "xml", campaign["products_xml_link"]))
          for i, info in enumerate(campaign.get("feeds_info") or [], start=1):
              if not isinstance(info, dict):
                  continue
              name = str(info.get("name") or f"feed-{i}")
              if info.get("csv_link"):
                  feeds.append((name, "csv", info["csv_link"]))
              if info.get("xml_link"):
                  feeds.append((name, "xml", info["xml_link"]))

          unique = []
          seen_urls = set()
          for name, kind, url in feeds:
              if url in seen_urls:
                  continue
              seen_urls.add(url)
              unique.append((name, kind, url))

          reports = []
          for index, (name, kind, url) in enumerate(unique, start=1):
              r = {
                  "index": index,
                  "name": name,
                  "kind": kind,
                  "sampled": 0,
                  "lenovoLike": 0,
                  "noiseLike": 0,
                  "purityPercent": 0,
                  "noisePercent": 0,
                  "cleanEnoughForCatalog": False,
                  "examples": [],
                  "error": ""
              }
              try:
                  parser = stream_csv if kind == "csv" else stream_xml
                  for row in parser(url):
                      title = pick(row, TITLE)
                      if not title:
                          continue
                      brand = pick(row, BRAND)
                      category = pick(row, CATEGORY)
                      combined = f"{title} {brand} {category}"

                      is_lenovo = bool(lenovo_signal.search(combined))
                      is_noise = bool(obvious_noise.search(combined))
                      r["sampled"] += 1
                      r["lenovoLike"] += int(is_lenovo)
                      r["noiseLike"] += int(is_noise)

                      if len(r["examples"]) < 8:
                          r["examples"].append({
                              "title": title[:180],
                              "brand": brand[:60],
                              "category": category[:100],
                              "lenovoLike": is_lenovo,
                              "noiseLike": is_noise
                          })
              except Exception as exc:
                  r["error"] = str(exc)[:300]

              if r["sampled"]:
                  r["purityPercent"] = round(100 * r["lenovoLike"] / r["sampled"], 1)
                  r["noisePercent"] = round(100 * r["noiseLike"] / r["sampled"], 1)
                  r["cleanEnoughForCatalog"] = (
                      r["sampled"] >= 50
                      and r["purityPercent"] >= 90
                      and r["noisePercent"] <= 2
                  )
              reports.append(r)

          best = max(
              reports,
              key=lambda r: (r["cleanEnoughForCatalog"], r["purityPercent"], -r["noisePercent"], r["sampled"]),
              default=None
          )

          audit = {
              "version": VERSION,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "websiteId": WEBSITE_ID,
              "campaignId": campaign_id,
              "campaignName": campaign_name,
              "allowDeeplink": allow_deeplink,
              "showProductsLinks": bool(campaign.get("show_products_links")),
              "feedCount": len(reports),
              "bestFeed": best,
              "feeds": reports,
              "decision": (
                  "official-lenovo-direct"
                  if not best or not best["cleanEnoughForCatalog"]
                  else "official-lenovo-direct-preferred-even-though-feed-now-clean"
              ),
              "safety": {
                  "feedUrlsCommitted": False,
                  "feedRowsUsedForCanonicalCatalog": False,
                  "reason": (
                      "Previous Lenovo feed audit was contaminated. V19.12 uses the official Lenovo site "
                      "as identity/product source and retains feed inspection only as a safety diagnostic."
                  )
              }
          }

          audit_path = Path("data/catalog-v19/source-ingestion/lenovo-admitad-audit.json")
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + "\n")

          runtime = {
              "campaignId": campaign_id,
              "campaignName": campaign_name,
              "allowDeeplink": allow_deeplink
          }
          Path("/tmp/lenovo-v19/campaign.json").write_text(json.dumps(runtime))

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"campaign_id={campaign_id}\n")
              fh.write("allow_deeplink=true\n")

          print(f"Lenovo campaign: {campaign_name} ({campaign_id})")
          print("Deeplink allowed: YES")
          print("Feeds inspected:", len(reports))
          if best:
              print(
                  "Best feed sample:",
                  f"sampled={best['sampled']}",
                  f"purity={best['purityPercent']}%",
                  f"noise={best['noisePercent']}%",
                  f"clean={best['cleanEnoughForCatalog']}"
              )
          print("Canonical source decision: official Lenovo direct catalog.")
          PY

      - name: Build bounded official Lenovo source and Admitad deeplinks
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data/source-ingestion-v19
          mkdir -p data/catalog-v19/source-ingestion
          mkdir -p /tmp/lenovo-v19

          python3 - <<'PY'
          import base64, gzip, html, json, os, re, socket, time
          import urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from datetime import datetime, timezone

          VERSION = os.environ["VERSION"]
          WEBSITE_ID = int(os.environ["WEBSITE_ID"])
          API = "https://api.admitad.com"
          BASE = "https://www.lenovo.com"
          MAX_PRODUCT_URLS = 12000
          MAX_SITEMAPS = 180
          WORKERS = 14
          socket.setdefaulttimeout(35)

          source_path = Path("data/source-ingestion-v19/lenovo-direct-catalog.json")
          audit_path = Path("data/catalog-v19/source-ingestion/lenovo-direct-source-audit.json")
          campaign = json.loads(Path("/tmp/lenovo-v19/campaign.json").read_text())
          campaign_id = int(campaign["campaignId"])

          audit = {
              "version": VERSION,
              "seller": "Lenovo",
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "sourceMode": "official-lenovo-direct+admitad-deeplinks",
              "campaignId": campaign_id,
              "sitemapsFetched": 0,
              "productUrlsDiscovered": 0,
              "productPagesFetched": 0,
              "productsStaged": 0,
              "priceCoverage": 0,
              "imageCoverage": 0,
              "stableIdCoverage": 0,
              "affiliateCoverage": 0,
              "structuredSpecsCoverage": 0,
              "deeplinkBatches": 0,
              "errors": [],
              "ready": False,
              "reason": ""
          }

          UA = "Mozilla/5.0 (compatible; TrendPilot-LenovoCatalog/19.12; +https://trendpilotchoice.com)"

          def env_first(*names):
              for name in names:
                  value = (os.environ.get(name) or "").strip()
                  if value:
                      return value
              return ""

          cid = env_first("ADMITAD_CLIENT_ID_PRIMARY", "ADMITAD_CLIENT_ID_ALT")
          secret = env_first("ADMITAD_CLIENT_SECRET_PRIMARY", "ADMITAD_CLIENT_SECRET_ALT")
          if not cid or not secret:
              raise SystemExit("Missing Admitad credentials.")

          def fetch(url, timeout=30, attempts=2, accept="*/*"):
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": UA,
                              "Accept": accept,
                              "Accept-Language": "en-US,en;q=0.8"
                          }
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          return resp.status, resp.headers, resp.read()
                  except Exception as exc:
                      last = exc
                      if attempt + 1 < attempts:
                          time.sleep(0.35 * (attempt + 1))
              raise last

          def absolute_url(value, base=BASE):
              value = html.unescape(str(value or "")).strip()
              if not value:
                  return ""
              if value.startswith("//"):
                  value = "https:" + value
              elif value.startswith("/"):
                  value = urllib.parse.urljoin(base + "/", value)
              elif not urllib.parse.urlsplit(value).scheme:
                  value = urllib.parse.urljoin(base + "/", value)
              parts = urllib.parse.urlsplit(value)
              if parts.scheme not in ("http", "https") or not parts.netloc:
                  return ""
              return urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, parts.query, ""))

          def canonical_product_url(value):
              value = absolute_url(value)
              if not value:
                  return ""
              parts = urllib.parse.urlsplit(value)
              host = parts.netloc.casefold()
              path = re.sub(r"/+", "/", parts.path)
              if host not in ("www.lenovo.com", "lenovo.com"):
                  return ""
              if not path.casefold().startswith("/us/en/p/"):
                  return ""
              if len(path.split("/")) < 7:
                  return ""
              return urllib.parse.urlunsplit(("https", "www.lenovo.com", path.rstrip("/"), "", ""))

          def xml_bytes(raw, url):
              if raw[:2] == b"\x1f\x8b" or url.casefold().endswith(".gz"):
                  return gzip.decompress(raw)
              return raw

          def parse_xml_locs(raw, url):
              try:
                  raw = xml_bytes(raw, url)
                  root = ET.fromstring(raw)
              except Exception:
                  return []
              return [
                  (node.text or "").strip()
                  for node in root.iter()
                  if node.tag.split("}")[-1].casefold() == "loc" and (node.text or "").strip()
              ]

          sitemap_queue = [
              "https://www.lenovo.com/sitemap.xml",
              "https://www.lenovo.com/us/en/sitemap.xml",
              "https://www.lenovo.com/us/en/sitemap_index.xml",
          ]

          try:
              _, _, robots_raw = fetch("https://www.lenovo.com/robots.txt", timeout=20, attempts=1)
              robots = robots_raw.decode("utf-8", "replace")
              for line in robots.splitlines():
                  if line.casefold().startswith("sitemap:"):
                      u = line.split(":", 1)[1].strip()
                      if u:
                          sitemap_queue.append(u)
          except Exception as exc:
              audit["errors"].append("robots.txt: " + str(exc)[:180])

          seen_sitemaps = set()
          product_urls = set()
          queue = [(u, 0) for u in sitemap_queue]

          while queue and len(seen_sitemaps) < MAX_SITEMAPS:
              sm_url, depth = queue.pop(0)
              sm_url = absolute_url(sm_url)
              if not sm_url or sm_url in seen_sitemaps:
                  continue
              if "lenovo.com" not in urllib.parse.urlsplit(sm_url).netloc.casefold():
                  continue
              seen_sitemaps.add(sm_url)

              try:
                  _, _, raw = fetch(sm_url, timeout=35, attempts=1)
                  audit["sitemapsFetched"] += 1
                  locs = parse_xml_locs(raw, sm_url)
              except Exception as exc:
                  if len(audit["errors"]) < 80:
                      audit["errors"].append(f"sitemap {sm_url}: {str(exc)[:180]}")
                  continue

              for loc in locs:
                  product = canonical_product_url(loc)
                  if product:
                      product_urls.add(product)
                      continue

                  low = loc.casefold()
                  is_sitemap = (
                      "sitemap" in low
                      or low.endswith(".xml")
                      or low.endswith(".xml.gz")
                  )
                  if not is_sitemap or depth >= 3:
                      continue

                  if depth == 0 or any(token in low for token in (
                      "/us/", "us-en", "usen", "product", "pdp", "shop"
                  )):
                      queue.append((loc, depth + 1))

              if len(product_urls) > MAX_PRODUCT_URLS:
                  break

          if len(product_urls) < 20:
              link_rx = re.compile(r'''href=["']([^"']+)["']''', re.I)
              landing_queue = ["https://www.lenovo.com/us/en/site-map/"]
              seen_landings = set()

              while landing_queue and len(seen_landings) < 80:
                  page = landing_queue.pop(0)
                  if page in seen_landings:
                      continue
                  seen_landings.add(page)
                  try:
                      _, _, raw = fetch(page, timeout=25, attempts=1, accept="text/html,*/*")
                      body = raw.decode("utf-8", "replace")
                  except Exception:
                      continue

                  for href in link_rx.findall(body):
                      u = absolute_url(href, page)
                      p = canonical_product_url(u)
                      if p:
                          product_urls.add(p)
                          continue
                      parts = urllib.parse.urlsplit(u)
                      path = parts.path.casefold()
                      if (
                          parts.netloc.casefold() in ("www.lenovo.com", "lenovo.com")
                          and path.startswith("/us/en/")
                          and any(k in path for k in (
                              "/laptops", "/desktops", "/workstations", "/tablets",
                              "/accessories", "/monitors", "/servers", "/storage",
                              "/gaming", "/handheld", "/phones"
                          ))
                          and "/glossary/" not in path
                          and "/support" not in path
                          and u not in seen_landings
                      ):
                          landing_queue.append(u)

          product_urls = sorted(product_urls)
          audit["productUrlsDiscovered"] = len(product_urls)

          if not product_urls:
              audit["reason"] = "No official Lenovo /us/en/p/ product URLs were discovered."
              audit_path.write_text(json.dumps(audit, indent=2) + "\n")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("ready=false\n")
              raise SystemExit(0)

          if len(product_urls) > MAX_PRODUCT_URLS:
              audit["reason"] = (
                  f"Discovery found {len(product_urls)} product URLs, above the safety ceiling "
                  f"{MAX_PRODUCT_URLS}; refusing a partial catalog."
              )
              audit_path.write_text(json.dumps(audit, indent=2) + "\n")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("ready=false\n")
              raise SystemExit(0)

          def meta_content(body, key, attr="property"):
              patterns = [
                  rf'<meta[^>]+{attr}=["\']{re.escape(key)}["\'][^>]+content=["\']([^"\']+)["\']',
                  rf'<meta[^>]+content=["\']([^"\']+)["\'][^>]+{attr}=["\']{re.escape(key)}["\']'
              ]
              for pattern in patterns:
                  m = re.search(pattern, body, re.I)
                  if m:
                      return html.unescape(m.group(1)).strip()
              return ""

          def flatten_jsonld(value):
              if isinstance(value, list):
                  for item in value:
                      yield from flatten_jsonld(item)
              elif isinstance(value, dict):
                  if "@graph" in value:
                      yield from flatten_jsonld(value["@graph"])
                  yield value

          def product_jsonld(body):
              blocks = re.findall(
                  r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',
                  body,
                  flags=re.I | re.S
              )
              for block in blocks:
                  block = html.unescape(block).strip()
                  try:
                      payload = json.loads(block)
                  except Exception:
                      continue
                  for obj in flatten_jsonld(payload):
                      kind = obj.get("@type")
                      kinds = kind if isinstance(kind, list) else [kind]
                      if any(str(x).casefold() == "product" for x in kinds if x):
                          return obj
              return {}

          def clean_text(value):
              value = re.sub(r"<[^>]+>", " ", str(value or ""))
              return html.unescape(re.sub(r"\s+", " ", value)).strip()

          def first_offer(product):
              offers = product.get("offers")
              if isinstance(offers, list):
                  offers = next((x for x in offers if isinstance(x, dict)), {})
              return offers if isinstance(offers, dict) else {}

          def parse_price(value):
              try:
                  text = str(value or "").replace(",", "").strip()
                  m = re.search(r"\d+(?:\.\d+)?", text)
                  if not m:
                      return None
                  number = float(m.group(0))
                  if 0 < number <= 200000:
                      return round(number, 2)
              except Exception:
                  pass
              return None

          def product_id_from_url(url):
              tail = urllib.parse.urlsplit(url).path.rstrip("/").split("/")[-1]
              tail = re.sub(r"[^A-Za-z0-9_-]", "", tail)
              if 5 <= len(tail) <= 40:
                  return tail
              return ""

          def parse_additional_properties(product):
              specs = {}
              props = product.get("additionalProperty") or product.get("additionalProperties") or []
              if isinstance(props, dict):
                  props = [props]
              if isinstance(props, list):
                  for item in props[:160]:
                      if not isinstance(item, dict):
                          continue
                      name = clean_text(item.get("name") or item.get("propertyID"))
                      value = clean_text(item.get("value") or item.get("valueReference"))
                      if name and value and len(name) <= 120 and len(value) <= 600:
                          specs[name] = value
              return specs

          def parse_page(url):
              try:
                  _, _, raw = fetch(url, timeout=28, attempts=2, accept="text/html,*/*")
                  body = raw.decode("utf-8", "replace")
              except Exception as exc:
                  return {"__error": str(exc)[:200], "__url": url}

              low = body.casefold()
              if "page not found" in low[:12000] or "404 not found" in low[:12000]:
                  return None

              p = product_jsonld(body)
              offer = first_offer(p)

              title = clean_text(p.get("name"))
              if not title:
                  title = meta_content(body, "og:title")
              if not title:
                  m = re.search(r"<title[^>]*>(.*?)</title>", body, re.I | re.S)
                  title = clean_text(m.group(1)) if m else ""

              if not title:
                  return None
              if re.search(r"\b(support|driver download|manual|warranty lookup)\b", title, re.I):
                  return None

              description = clean_text(p.get("description"))
              if not description:
                  description = meta_content(body, "og:description")
              if not description:
                  description = meta_content(body, "description", "name")

              sku = clean_text(p.get("sku"))
              mpn = clean_text(p.get("mpn"))
              model = clean_text(p.get("model"))
              source_id = sku or mpn or product_id_from_url(url)
              if not source_id:
                  return None

              brand = "Lenovo"
              raw_brand = p.get("brand")
              if isinstance(raw_brand, dict):
                  raw_brand = raw_brand.get("name")
              if clean_text(raw_brand):
                  brand = clean_text(raw_brand)

              price = parse_price(offer.get("price") or offer.get("lowPrice"))
              if price is None:
                  price = parse_price(meta_content(body, "product:price:amount"))
              if price is None:
                  m = re.search(
                      r"(?:Starting\s+at|Sale\s+Price|Price)\s*[:\-]?\s*\$\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)",
                      clean_text(body[:1500000]),
                      re.I
                  )
                  if m:
                      price = parse_price(m.group(1))

              currency = clean_text(offer.get("priceCurrency"))
              if not currency:
                  currency = meta_content(body, "product:price:currency") or "USD"

              image = p.get("image")
              if isinstance(image, list):
                  image = image[0] if image else ""
              if isinstance(image, dict):
                  image = image.get("url") or image.get("contentUrl")
              image = absolute_url(image or meta_content(body, "og:image"), url)

              availability = clean_text(offer.get("availability"))
              if availability:
                  availability = availability.rsplit("/", 1)[-1]
              elif "out of stock" in low:
                  availability = "out_of_stock"
              else:
                  availability = "unknown"

              path = urllib.parse.urlsplit(url).path.strip("/").split("/")
              category = ""
              subcategory = ""
              try:
                  p_index = [x.casefold() for x in path].index("p")
                  if len(path) > p_index + 1:
                      category = clean_text(path[p_index + 1].replace("-", " "))
                  if len(path) > p_index + 2:
                      subcategory = clean_text(path[p_index + 2].replace("-", " "))
              except ValueError:
                  pass

              specs = parse_additional_properties(p)

              return {
                  "seller": "Lenovo",
                  "advertiser": "Lenovo",
                  "sourceProductId": source_id,
                  "id": source_id,
                  "sku": sku,
                  "mpn": mpn,
                  "model": model,
                  "title": title,
                  "description": description[:8000],
                  "brand": brand,
                  "category": category,
                  "subcategory": subcategory,
                  "price": price,
                  "currency": currency,
                  "imageUrl": image,
                  "affiliateUrl": "",
                  "destinationUrl": url,
                  "condition": "new",
                  "availability": availability,
                  "specs": specs,
                  "network": "Admitad",
                  "source": "Lenovo official US product catalog",
                  "sourceVersion": VERSION
              }

          rows = []
          errors = []
          with ThreadPoolExecutor(max_workers=WORKERS) as executor:
              future_map = {executor.submit(parse_page, u): u for u in product_urls}
              for future in as_completed(future_map):
                  try:
                      item = future.result()
                  except Exception as exc:
                      item = {"__error": str(exc)[:200], "__url": future_map[future]}

                  if not item:
                      continue
                  if item.get("__error"):
                      if len(errors) < 120:
                          errors.append(f"{item['__url']}: {item['__error']}")
                      continue
                  rows.append(item)

          audit["productPagesFetched"] = len(product_urls) - len(errors)
          if errors:
              audit["errors"].extend(errors)

          by_id = {}
          for row in rows:
              key = str(row.get("sourceProductId") or "").casefold()
              if not key:
                  continue
              old = by_id.get(key)
              if not old:
                  by_id[key] = row
                  continue
              richness = lambda x: (
                  int(x.get("price") is not None) * 4
                  + int(bool(x.get("imageUrl"))) * 3
                  + len(x.get("specs") or {})
                  + len(x.get("description") or "") / 1000
              )
              if richness(row) > richness(old):
                  by_id[key] = row

          rows = sorted(by_id.values(), key=lambda x: (x["title"].casefold(), x["sourceProductId"].casefold()))

          def admitad_json(url, method="GET", headers=None, data=None, timeout=55):
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "TrendPilot-Lenovo-V19.12/1.0",
                      **(headers or {})
                  }
              )
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return json.loads(resp.read().decode("utf-8", "replace"))

          basic = base64.b64encode(f"{cid}:{secret}".encode()).decode()
          token_body = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": cid,
              "scope": "deeplink_generator"
          }).encode()
          token = admitad_json(
              f"{API}/token/",
              method="POST",
              headers={
                  "Authorization": f"Basic {basic}",
                  "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
              },
              data=token_body
          ).get("access_token")
          if not token:
              raise SystemExit("Could not obtain Admitad deeplink token.")

          auth = {"Authorization": f"Bearer {token}"}

          BATCH = 100
          for start in range(0, len(rows), BATCH):
              chunk = rows[start:start+BATCH]
              query = [
                  ("subid", "trendpilot-v19-lenovo"),
                  *[("ulp", x["destinationUrl"]) for x in chunk]
              ]
              url = (
                  f"{API}/deeplink/{WEBSITE_ID}/advcampaign/{campaign_id}/?"
                  + urllib.parse.urlencode(query)
              )
              try:
                  result = admitad_json(url, headers=auth, timeout=60)
              except Exception as exc:
                  audit["reason"] = f"Admitad deeplink batch failed at offset {start}: {exc}"
                  audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + "\n")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                      fh.write("ready=false\n")
                  raise SystemExit(0)

              audit["deeplinkBatches"] += 1
              if not isinstance(result, list) or len(result) != len(chunk):
                  audit["reason"] = (
                      f"Admitad deeplink batch returned {len(result) if isinstance(result,list) else 'non-list'} "
                      f"rows for {len(chunk)} destinations at offset {start}."
                  )
                  audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + "\n")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                      fh.write("ready=false\n")
                  raise SystemExit(0)

              for row, link_row in zip(chunk, result):
                  link = link_row.get("link") if isinstance(link_row, dict) else ""
                  if isinstance(link, str) and link.startswith(("http://", "https://")):
                      row["affiliateUrl"] = link

          n = len(rows)
          count = lambda fn: sum(1 for x in rows if fn(x))
          price_count = count(lambda x: x.get("price") is not None)
          image_count = count(lambda x: bool(x.get("imageUrl")))
          id_count = count(lambda x: bool(x.get("sourceProductId") or x.get("sku")))
          link_count = count(lambda x: bool(x.get("affiliateUrl")))
          specs_count = count(lambda x: bool(x.get("specs")))

          pct = lambda c: round(100 * c / n, 1) if n else 0
          audit.update({
              "productsStaged": n,
              "priceCoverage": pct(price_count),
              "imageCoverage": pct(image_count),
              "stableIdCoverage": pct(id_count),
              "affiliateCoverage": pct(link_count),
              "structuredSpecsCoverage": pct(specs_count)
          })

          if n < 20:
              audit["reason"] = f"Only {n} Lenovo products were safely staged."
          elif id_count != n:
              audit["reason"] = f"Stable ID coverage is {pct(id_count)}%, expected 100%."
          elif link_count != n:
              audit["reason"] = f"Admitad deeplink coverage is {pct(link_count)}%, expected 100%."
          elif price_count / n < 0.50:
              audit["reason"] = f"Price coverage is only {pct(price_count)}%; minimum is 50%."
          elif image_count / n < 0.70:
              audit["reason"] = f"Image coverage is only {pct(image_count)}%; minimum is 70%."
          else:
              audit["ready"] = True
              source_path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + "\n")

          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"ready={'true' if audit['ready'] else 'false'}\n")
              fh.write(f"count={n}\n")

          print(json.dumps({
              "productUrlsDiscovered": audit["productUrlsDiscovered"],
              "productsStaged": audit["productsStaged"],
              "priceCoverage": audit["priceCoverage"],
              "imageCoverage": audit["imageCoverage"],
              "stableIdCoverage": audit["stableIdCoverage"],
              "affiliateCoverage": audit["affiliateCoverage"],
              "structuredSpecsCoverage": audit["structuredSpecsCoverage"],
              "deeplinkBatches": audit["deeplinkBatches"],
              "ready": audit["ready"],
              "reason": audit["reason"]
          }, indent=2))
          PY

