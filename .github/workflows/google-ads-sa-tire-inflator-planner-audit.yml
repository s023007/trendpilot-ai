name: Google Ads SA Tire Inflator Planner Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-ads-sa-tire-inflator-planner-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - name: Install Google Ads client
        run: pip install --disable-pip-version-check google-ads

      - name: Saudi Basic Planner buyer-intent low-competition scout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          from google.ads.googleads.client import GoogleAdsClient
          from google.ads.googleads.errors import GoogleAdsException

          client=GoogleAdsClient.load_from_dict({
            'developer_token':os.environ['GOOGLE_ADS_DEVELOPER_TOKEN'],
            'client_id':os.environ['GOOGLE_ADS_CLIENT_ID'],
            'client_secret':os.environ['GOOGLE_ADS_CLIENT_SECRET'],
            'refresh_token':os.environ['GOOGLE_ADS_REFRESH_TOKEN'],
            'login_customer_id':os.environ['GOOGLE_ADS_LOGIN_CUSTOMER_ID'].replace('-','').strip(),
            'use_proto_plus':True,
          })
          cid=os.environ['GOOGLE_ADS_CUSTOMER_ID'].replace('-','').strip()
          svc=client.get_service('KeywordPlanIdeaService')
          GEO='geoTargetConstants/2682'
          NET=client.enums.KeywordPlanNetworkEnum.GOOGLE_SEARCH

          groups=[
            ('AR','languageConstants/1019',[
              'منفاخ كفرات','منفاخ هواء للسيارة','كمبروسر هواء سيارة','مضخة هواء للسيارة',
              'منفاخ كفرات لاسلكي','منفاخ كفرات كهربائي','منفاخ كفرات قابل للشحن',
              'منفاخ كفرات 12 فولت','منفاخ كفرات صغير','جهاز نفخ كفرات',
              'منفاخ اطارات سيارة','منفاخ كفرات محمول','منفاخ كفرات 150 psi','منفاخ كفرات رقمي'
            ]),
            ('EN','languageConstants/1000',[
              'tire inflator','car tire inflator','portable tire inflator','cordless tire inflator',
              'rechargeable tire inflator','wireless tire inflator','digital tire inflator',
              '150 psi tire inflator','12v tire inflator','mini tire inflator','automatic tire inflator',
              'tire pump for car','air pump for car tires','portable air compressor for car',
              'portable tyre inflator','car tyre inflator','electric tire pump'
            ])
          ]

          def field(m,name):
            pb=getattr(m,'_pb',m)
            try:
              if not pb.HasField(name): return None
            except Exception: pass
            v=getattr(m,name,None)
            return int(v) if v is not None else None

          def make(label,text,m,source):
            ci=field(m,'competition_index')
            lo=field(m,'low_top_of_page_bid_micros')
            hi=field(m,'high_top_of_page_bid_micros')
            return {
              'lang':label,'keyword':str(text).strip(),'source':source,
              'searches':int(m.avg_monthly_searches or 0),'ci':ci,
              'competition':getattr(m.competition,'name',str(m.competition)),
              'low':None if lo is None else lo/1e6,'high':None if hi is None else hi/1e6,
            }

          brand_bad=re.compile(r'\b(dewalt|milton|norshire|hyper tough|cornwell|ingco|porsche|husky|70mai|xiaomi|makita|ryobi|bosch|black.?decker)\b',re.I)
          en_bad=re.compile(r'near me|gas station|petrol station|tyre shop|tire shop|garage|motor only|compressor motor|air chuck|chuck for|hose only|connector|adapter only|gauge only|nitrogen|industrial|truck|bus|mains tyre|220v',re.I)
          ar_bad=re.compile(r'ساكو|محطة|ورشة|صيانة|تصليح|قطع غيار|شاحنة|باص|حافلة|كمبروسر صناعي',re.I)

          def buyer_relevant(r):
            t=r['keyword'].lower()
            if r['searches'] < 10: return False
            if r['ci'] is not None and r['ci'] > 50: return False
            if brand_bad.search(t): return False
            if r['lang']=='EN':
              if en_bad.search(t): return False
              return bool(re.search(r'(tire|tyre).*(inflator|pump)|(inflator|pump).*(tire|tyre)|air compressor.*(car|vehicle|portable|12v)|portable air compressor',t,re.I))
            if ar_bad.search(t): return False
            return any(x in t for x in ('منفاخ','كمبروسر','مضخة','نفخ')) and any(x in t for x in ('كفر','اطار','إطار','سيار','هواء'))

          def score(r):
            ci=55 if r['ci'] is None else r['ci']
            comp_factor=max(0.05,1-ci/100)
            intent=1.0
            t=r['keyword'].lower()
            for q in ('cordless','rechargeable','portable','12v','digital','automatic','150 psi','hand held','handheld','mini','لاسلكي','قابل للشحن','محمول','12 فولت','رقمي','150'):
              if q in t: intent += 0.08
            if 'best ' in t or 'افضل' in t or 'أفضل' in t: intent += 0.05
            bid=1.0
            if r['high'] is not None:
              bid=max(0.55,min(1.15,0.55/max(r['high'],0.05)))
            return r['searches']*comp_factor*intent*bid

          print('PLANNER|mode=READ_ONLY|geo=Saudi Arabia|network=GOOGLE_SEARCH|goal=LOW_COMPETITION_BUY_INTENT')
          rows=[]
          try:
            for label,lang,seeds in groups:
              hist=client.get_type('GenerateKeywordHistoricalMetricsRequest')
              hist.customer_id=cid; hist.keywords.extend(seeds); hist.geo_target_constants.append(GEO)
              hist.language=lang; hist.keyword_plan_network=NET
              for x in svc.generate_keyword_historical_metrics(request=hist).results:
                rows.append(make(label,x.text,x.keyword_metrics,'seed'))

              ideas=client.get_type('GenerateKeywordIdeasRequest')
              ideas.customer_id=cid; ideas.language=lang; ideas.geo_target_constants.append(GEO)
              ideas.keyword_plan_network=NET; ideas.include_adult_keywords=False
              ideas.keyword_seed.keywords.extend(seeds[:10])
              for x in svc.generate_keyword_ideas(request=ideas).results:
                rows.append(make(label,x.text,x.keyword_idea_metrics,'idea'))

            dedup={}
            for r in rows:
              k=(r['lang'],re.sub(r'\s+',' ',r['keyword'].lower()).strip())
              old=dedup.get(k)
              if old is None or (r['searches'],r['ci'] is not None)>(old['searches'],old['ci'] is not None): dedup[k]=r
            rows=list(dedup.values())
            keep=[r for r in rows if buyer_relevant(r)]
            for r in keep: r['score']=score(r)
            keep.sort(key=lambda r:(-r['score'],-r['searches'],999 if r['ci'] is None else r['ci']))

            print('SCOUT_SUMMARY|all=%d|buyer_low_comp=%d' % (len(rows),len(keep)))
            for i,r in enumerate(keep[:30],1):
              print('KEEP|rank=%d|lang=%s|keyword=%s|searches=%s|competition=%s|ci=%s|low_usd=%s|high_usd=%s|score=%.2f|source=%s' % (
                i,r['lang'],r['keyword'],r['searches'],r['competition'],r['ci'],
                '' if r['low'] is None else f"{r['low']:.2f}",
                '' if r['high'] is None else f"{r['high']:.2f}",r['score'],r['source']))

            high=[r for r in rows if r['searches']>=10 and r['ci'] is not None and r['ci']>50 and buyer_relevant({**r,'ci':50})]
            high.sort(key=lambda r:-r['searches'])
            for r in high[:15]:
              print('AVOID|lang=%s|keyword=%s|searches=%s|competition=%s|ci=%s|high_usd=%s' % (
                r['lang'],r['keyword'],r['searches'],r['competition'],r['ci'],
                '' if r['high'] is None else f"{r['high']:.2f}"))
            print('BASIC_PLANNER_ACCESS|PASS')
          except GoogleAdsException as e:
            print('BASIC_PLANNER_ACCESS|FAIL')
            print('REQUEST_ID|'+str(e.request_id))
            for er in e.failure.errors: print('ERROR|'+str(er.error_code)+'|'+str(er.message))
            raise
          PY
