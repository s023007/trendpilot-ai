name: Google Ads SA Tire Inflator Planner Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-ads-sa-tire-inflator-planner-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - name: Install Google Ads client
        run: pip install --disable-pip-version-check google-ads
      - name: Saudi Keyword Planner read-only competition audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from google.ads.googleads.client import GoogleAdsClient
          from google.ads.googleads.errors import GoogleAdsException

          client=GoogleAdsClient.load_from_dict({
            'developer_token':os.environ['GOOGLE_ADS_DEVELOPER_TOKEN'],
            'client_id':os.environ['GOOGLE_ADS_CLIENT_ID'],
            'client_secret':os.environ['GOOGLE_ADS_CLIENT_SECRET'],
            'refresh_token':os.environ['GOOGLE_ADS_REFRESH_TOKEN'],
            'login_customer_id':os.environ['GOOGLE_ADS_LOGIN_CUSTOMER_ID'].replace('-','').strip(),
            'use_proto_plus':True,
          })
          cid=os.environ['GOOGLE_ADS_CUSTOMER_ID'].replace('-','').strip()
          svc=client.get_service('KeywordPlanIdeaService')
          groups=[
            ('AR','languageConstants/1019',['منفاخ كفرات سيارة','منفاخ هواء للسيارة','منفاخ اطارات سيارة','منفاخ كفرات محمول','كمبروسر هواء سيارة','منفاخ كفرات 150 psi','منفاخ كفرات رقمي']),
            ('EN','languageConstants/1000',['tire inflator','car tire inflator','portable tire inflator','cordless tire inflator','digital tire inflator','150 psi tire inflator','car air compressor'])
          ]
          print('PLANNER|mode=READ_ONLY|geo=Saudi Arabia|network=GOOGLE_SEARCH')
          try:
            for label,lang,keywords in groups:
              req=client.get_type('GenerateKeywordHistoricalMetricsRequest')
              req.customer_id=cid
              req.keywords.extend(keywords)
              req.geo_target_constants.append('geoTargetConstants/2682')
              req.language=lang
              req.keyword_plan_network=client.enums.KeywordPlanNetworkEnum.GOOGLE_SEARCH
              res=svc.generate_keyword_historical_metrics(request=req)
              for x in res.results:
                m=x.keyword_metrics
                def v(field):
                  pb=getattr(m,'_pb',m)
                  try:
                    if not pb.HasField(field): return None
                  except Exception: pass
                  z=getattr(m,field,None); return int(z) if z is not None else None
                lo=v('low_top_of_page_bid_micros'); hi=v('high_top_of_page_bid_micros'); ci=v('competition_index')
                print('KW|lang=%s|keyword=%s|searches=%s|competition=%s|ci=%s|low_usd=%s|high_usd=%s' % (
                  label,x.text,int(m.avg_monthly_searches or 0),getattr(m.competition,'name',str(m.competition)),ci,
                  '' if lo is None else f'{lo/1e6:.2f}','' if hi is None else f'{hi/1e6:.2f}'))
            print('BASIC_PLANNER_ACCESS|PASS')
          except GoogleAdsException as e:
            print('BASIC_PLANNER_ACCESS|FAIL')
            print('REQUEST_ID|'+str(e.request_id))
            for er in e.failure.errors: print('ERROR|'+str(er.error_code)+'|'+str(er.message))
            raise
          PY
