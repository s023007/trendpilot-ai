name: Build Big Match Pages V1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_big_match_pages_v1.py'
      - '.github/workflows/build-big-match-pages-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: big-match-pages-v1
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase latest main
        run: |
          git fetch origin main
          git rebase origin/main || true
      - name: Build four campaign pages
        run: python scripts/build_big_match_pages_v1.py
      - name: Validate API PHP
        run: php -l api/save-search.php
      - name: Sanity checks
        run: |
          grep -q 'اختر مقعدك الآن' events/liverpool-v-manchester-united-2026/ar/index.html
          grep -q 'north_london_derby_2026' api/save-search.php
          grep -q 'madrid_derby_2026' api/save-search.php
      - name: Commit generated pages
        run: |
          git config user.name 'trendpilot-match-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/save-search.php events/liverpool-v-manchester-united-2026 events/madrid-derby-2026 events/north-london-derby-2026 events/arsenal-v-manchester-city-2026
          git diff --cached --quiet && exit 0
          git commit -m 'feat: publish four big-match conversion landings'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
