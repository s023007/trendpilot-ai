name: TrendPilot Products V15.6.2 Full Seller Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-6-2-full-seller-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-all-sellers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Audit all product sellers
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import json, re
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          js_path=Path("js/site-v13-5.js")
          admitad_path=Path("data/admitad-products-new-account-v15-3-2.json")
          cj_path=Path("data/cj-products.json")

          for p in (js_path,admitad_path,cj_path):
              if not p.exists():
                  raise SystemExit(f"Missing required file: {p}")

          js=js_path.read_text(encoding="utf-8")
          admitad=json.loads(admitad_path.read_text(encoding="utf-8"))
          cj=json.loads(cj_path.read_text(encoding="utf-8"))

          m=re.search(r'const\s+TP_PRODUCT_SELLERS_V15_1\s*=\s*\[(.*?)\];',js,re.S)
          if not m:
              raise SystemExit("Seller registry not found.")
          sellers=re.findall(r'"([^"]+)"',m.group(1))

          alias_map={}
          m2=re.search(r'const\s+TP_SELLER_ALIASES_V15_1\s*=\s*\{(.*?)\};',js,re.S)
          if m2:
              for k,v in re.findall(r'"([^"]+)"\s*:\s*"([^"]+)"',m2.group(1)):
                  alias_map[k.strip().lower()]=v.strip()

          def clean(v):
              return re.sub(r"\s+"," ",str(v or "").strip())

          def key(v):
              return re.sub(r"[^a-z0-9]+","",clean(v).lower())

          known={
              "aliexpressww":"AliExpress","aliexpress":"AliExpress",
              "alibabaww":"Alibaba","alibaba":"Alibaba",
              "geekbuyingww":"Geekbuying","geekbuying":"Geekbuying",
              "filamentproeucps":"FilamentPRO EU CPS",
              "goveemanygeos":"Govee Many GEOs",
              "harfingtonmanygeos":"Harfington Many GEOs",
              "sunskyonlineww":"Sunsky-online WW",
              "lenovomanygeos":"Lenovo","lenovo":"Lenovo",
              "diecast":"Diecast",
              "fragranceshopcom":"FragranceShop.com","fragranceshop":"FragranceShop.com",
              "karacaeu":"Karaca EU",
              "mfimedical":"MFI Medical",
              "pandahall":"PandaHall",
              "temu":"Temu",
          }

          def canonical(name):
              raw=clean(name)
              low=raw.lower()
              if low in alias_map:
                  return alias_map[low]
              for s in sellers:
                  if s.lower()==low:
                      return s
              return known.get(key(raw),raw)

          def rows(payload):
              if isinstance(payload,list):
                  return payload
              if isinstance(payload,dict):
                  for k in ("products","results","items","data"):
                      if isinstance(payload.get(k),list):
                          return payload[k]
              return []

          admitad_rows=rows(admitad)
          cj_rows=rows(cj)

          def field(row,*names):
              if not isinstance(row,dict):
                  return ""
              low={str(k).lower():v for k,v in row.items()}
              for n in names:
                  if n in row and row[n] not in (None,""):
                      return row[n]
                  if n.lower() in low and low[n.lower()] not in (None,""):
                      return low[n.lower()]
              return ""

          def title(row):
              return clean(field(row,"title","name","product_name","productName"))

          def seller_name(row):
              return clean(field(row,"seller","advertiser","advertiser_name","advertiserName","merchant","merchant_name","store","store_name","program"))

          def seller_id(row):
              return clean(field(row,"advertiser_id","advertiserId","campaign_id","campaignId","program_id"))

          cj_id_map={
              "2357926":"Diecast",
              "7287203":"FragranceShop.com",
              "5893489":"Karaca EU",
              "7227612":"MFI Medical",
              "4295086":"PandaHall",
              "6293473":"Temu",
          }

          def effective_seller(row,network):
              if network=="CJ":
                  rid=seller_id(row)
                  if rid in cj_id_map:
                      return cj_id_map[rid]
              return canonical(seller_name(row))

          stop={"the","and","for","with","from","this","that","new","sale","best","top","pcs","set","pack","product","products","item","items","free","shipping","many","global","online","ww","eu","cps","geo","geos"}

          def suggestions(titles):
              c=Counter()
              for t in titles:
                  for w in re.findall(r"[a-z0-9]+",t.lower()):
                      if len(w)>=3 and w not in stop and not w.isdigit():
                          c[w]+=1
              return [w for w,_ in c.most_common(5)]

          audit=[]
          for seller in sellers:
              a=[r for r in admitad_rows if effective_seller(r,"Admitad")==seller]
              c=[r for r in cj_rows if effective_seller(r,"CJ")==seller]
              ts=[title(r) for r in a+c if title(r)]
              if seller=="Lenovo":
                  status="DIRECT-LINK ONLY"
              elif not a and not c:
                  status="NO DATA"
              else:
                  status="DATA PRESENT"
              audit.append({
                  "seller":seller,
                  "status":status,
                  "admitad_count":len(a),
                  "cj_count":len(c),
                  "total_count":len(a)+len(c),
                  "suggested_queries":suggestions(ts),
                  "raw_names":sorted({seller_name(r) for r in a+c if seller_name(r)})[:8]
              })

          orphans=defaultdict(lambda:{"Admitad":0,"CJ":0})
          for network,source in (("Admitad",admitad_rows),("CJ",cj_rows)):
              for r in source:
                  s=effective_seller(r,network)
                  if s and s not in sellers:
                      orphans[s][network]+=1

          out={
              "version":"15.6.2-seller-audit",
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "seller_registry":sellers,
              "admitad_rows":len(admitad_rows),
              "cj_rows":len(cj_rows),
              "audit":audit,
              "orphans":dict(orphans)
          }

          Path("data/diagnostics").mkdir(parents=True,exist_ok=True)
          Path("data/diagnostics/product-seller-audit-v15-6-2.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )

          summary=Path("/tmp/seller-audit.md")
          with summary.open("w",encoding="utf-8") as fh:
              fh.write("## TrendPilot Full Seller Audit V15.6.2\n\n")
              fh.write(f"- Sellers in dropdown: **{len(sellers)}**\n")
              fh.write(f"- Admitad rows: **{len(admitad_rows)}**\n")
              fh.write(f"- CJ rows: **{len(cj_rows)}**\n\n")
              fh.write("| Seller | Status | Admitad | CJ | Total | Suggested test |\n")
              fh.write("|---|---|---:|---:|---:|---|\n")
              for r in audit:
                  q=", ".join(r["suggested_queries"][:3]) if r["suggested_queries"] else "—"
                  fh.write(f"| {r['seller']} | {r['status']} | {r['admitad_count']} | {r['cj_count']} | {r['total_count']} | {q} |\n")
              fh.write("\n### Sellers needing attention\n")
              for r in audit:
                  if r["status"]!="DATA PRESENT":
                      fh.write(f"- **{r['seller']}** — {r['status']} — Admitad {r['admitad_count']}, CJ {r['cj_count']}\n")
              fh.write("\n### Data sellers missing from dropdown\n")
              if not orphans:
                  fh.write("- None.\n")
              else:
                  for s,d in sorted(orphans.items()):
                      fh.write(f"- **{s}** — Admitad {d['Admitad']}, CJ {d['CJ']}\n")

          print(f"Dropdown sellers: {len(sellers)}")
          print(f"Admitad rows: {len(admitad_rows)}")
          print(f"CJ rows: {len(cj_rows)}")
          for r in audit:
              print(f"{r['seller']}: {r['status']} admitad={r['admitad_count']} cj={r['cj_count']} total={r['total_count']} queries={r['suggested_queries'][:3]}")
          PY

          cat /tmp/seller-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("data/diagnostics/product-seller-audit-v15-6-2.json")
          if not p.exists():
              raise SystemExit("Audit output missing.")
          d=json.loads(p.read_text(encoding="utf-8"))
          if d.get("version")!="15.6.2-seller-audit":
              raise SystemExit("Wrong audit version.")
          if not d.get("audit"):
              raise SystemExit("Audit is empty.")
          print("Seller audit validated.")
          PY
          git diff --check

      - name: Confirm live site untouched
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            find/index.html \
            js/site-v13-5.js \
            js/product-discovery-v15.js \
            data/admitad-products-new-account-v15-3-2.json \
            data/cj-products.json
          do
            if ! git diff --quiet -- "$file"; then
              echo "Safety stop: live/source file changed unexpectedly: $file"
              exit 1
            fi
          done

      - name: Publish diagnostic report only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics/product-seller-audit-v15-6-2.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Audit already current."
            exit 0
          fi
          git commit -m "chore: audit all product sellers"
          git push origin HEAD:main
