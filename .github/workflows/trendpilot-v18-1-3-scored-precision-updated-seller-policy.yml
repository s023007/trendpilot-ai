name: TrendPilot V18.1.3 Scored Precision + Updated Seller Policy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v18-1-3-scored-precision-policy
  cancel-in-progress: true

jobs:
  scored-precision-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Apply current affiliate and product-seller policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY1'
          from pathlib import Path
          import json, re

          APPROVED = [
              "AliExpress","Alibaba","Geekbuying","FilamentPRO EU CPS",
              "Govee Many GEOs","Harfington Many GEOs","Sunsky-online WW","Lenovo",
              "Diecast","FragranceShop.com","Karaca EU","MFI Medical","PandaHall","TikTok Shop US"
          ]
          ACTIVE_CJ = [
              {"name":"Diecast","advertiserId":"2357926","role":"product","productSeller":True},
              {"name":"FragranceShop.com","advertiserId":"7287203","role":"product","productSeller":True},
              {"name":"Karaca EU","advertiserId":"5893489","role":"product","productSeller":True},
              {"name":"MFI Medical","advertiserId":"7227612","role":"product","productSeller":True},
              {"name":"NordVPN","advertiserId":"4837117","role":"software_service","productSeller":False},
              {"name":"PandaHall","advertiserId":"4295086","role":"product","productSeller":True},
              {"name":"Sports Events 365","advertiserId":"7753674","role":"events_tickets","productSeller":False},
              {"name":"TicketNetwork","advertiserId":"2288710","role":"events_tickets","productSeller":False},
              {"name":"TikTok Shop US","advertiserId":"7563286","role":"product","productSeller":True},
              {"name":"Trip.com (Global)","advertiserId":"4368684","role":"travel","productSeller":False},
          ]

          reg_path = Path("data/product-seller-registry-v17.json")
          reg = json.loads(reg_path.read_text())
          existing = {x.get("name"): x for x in reg.get("sellers", [])}
          missing = [x for x in APPROVED if x not in existing]
          if missing: raise SystemExit(f"Missing seller definitions: {missing}")
          reg["version"] = "18.1.3"
          reg["policy"] = "explicit-approved-product-sellers-only"
          reg["notes"] = [
              "Only explicitly approved product sellers may be indexed or returned by product search.",
              "Joom is excluded because the affiliate application was not accepted.",
              "Temu is excluded until it appears as an active/accepted CJ advertiser for this publisher.",
              "CJ software, travel, and ticket partners are active affiliates but are kept outside product comparison.",
              "Raw archived data may remain on disk without being indexed or exposed."
          ]
          reg["sellers"] = [dict(existing[name], public=True) for name in APPROVED]
          reg_path.write_text(json.dumps(reg, indent=2, ensure_ascii=False) + "\n")
          Path("data/approved-product-sellers-v16.json").write_text(json.dumps({"version":"18.1.3","sellers":APPROVED}, indent=2, ensure_ascii=False)+"\n")
          cov_path=Path("data/seller-coverage-v15-1.json")
          cov=json.loads(cov_path.read_text()); cov["version"]="18.1.3"; cov["approvedProductSellers"]=APPROVED
          cov_path.write_text(json.dumps(cov, indent=2, ensure_ascii=False)+"\n")
          status={
              "version":"18.1.3","capturedDate":"2026-08-10","source":"user-confirmed CJ Active Advertisers screen",
              "activeAdvertisers":ACTIVE_CJ,
              "productSellerNames":[x["name"] for x in ACTIVE_CJ if x["productSeller"]],
              "nonProductAffiliateNames":[x["name"] for x in ACTIVE_CJ if not x["productSeller"]],
              "pendingNotActiveProductPrograms":["Temu"],"explicitlyRejectedPrograms":["Joom"]
          }
          Path("data/cj-affiliate-status-v18.json").write_text(json.dumps(status,indent=2,ensure_ascii=False)+"\n")

          aliases={
            "AliExpress":["aliexpress","ali express","aliexpress.com","aliexpress ww","aliexpressww"],
            "Alibaba":["alibaba","alibaba.com","alibaba ww","alibabaww"],
            "Geekbuying":["geekbuying","geek buying","geekbuying ww","geekbuyingww"],
            "FilamentPRO EU CPS":["filamentpro","filamentpro eu","filamentpro eu cps"],
            "Govee Many GEOs":["govee","govee many geos"],
            "Harfington Many GEOs":["harfington","harfington many geos","harrington","harrington many geos"],
            "Sunsky-online WW":["sunsky","sunsky online","sunsky-online","sunsky-online ww"],
            "Lenovo":["lenovo","lenovo many geos"],
            "Diecast":["diecast","diecast.com","diecast models wholesale","diecastmodelswholesale"],
            "FragranceShop.com":["fragranceshop.com","fragranceshop","fragrance shop","the fragrance shop"],
            "Karaca EU":["karaca","karaca eu","karaca europe"],
            "MFI Medical":["mfi","mfi medical","mfimedical"],
            "PandaHall":["pandahall","panda hall","pandahall.com"],
            "TikTok Shop US":["tiktok","tiktok shop","tiktok shop us","tiktokshop","tiktokshopus"]
          }
          policy=f'''// TrendPilot V18.1.3 - explicit public product seller policy.
          // Joom is rejected; Temu is pending/not active in this publisher's CJ account.
          // Active non-product affiliates are intentionally handled outside product comparison.
          export const PRODUCT_SELLER_POLICY_VERSION = "18.1.3";
          export const PUBLIC_PRODUCT_SELLER_NAMES = Object.freeze({json.dumps(APPROVED,ensure_ascii=False)});
          const aliasGroups = {json.dumps(aliases,ensure_ascii=False)};
          const normalizeKey = value => String(value ?? "").toLocaleLowerCase("en-US").normalize("NFKC").replace(/[^a-z0-9]+/g, "");
          const canonicalByKey = new Map();
          for (const canonical of PUBLIC_PRODUCT_SELLER_NAMES) {{
            canonicalByKey.set(normalizeKey(canonical), canonical);
            for (const alias of aliasGroups[canonical] || []) canonicalByKey.set(normalizeKey(alias), canonical);
          }}
          export function canonicalProductSeller(value) {{ const key=normalizeKey(value); return key ? (canonicalByKey.get(key)||"") : ""; }}
          export function isApprovedProductSeller(value) {{ return Boolean(canonicalProductSeller(value)); }}
          export function canonicalizePublicProduct(product) {{
            if (!product || typeof product !== "object") return null;
            const rawSeller=product.seller||product.advertiser||product.merchant||product.advertiserName||product.merchantName||"";
            const seller=canonicalProductSeller(rawSeller); if (!seller) return null;
            return {{...product,seller,advertiser:product.advertiser?seller:product.advertiser}};
          }}
          export function publicProductSellerAllowed(product) {{ return Boolean(canonicalizePublicProduct(product)); }}
          '''
          Path("netlify/functions/product-seller-policy-v17.mjs").write_text(policy)

          site_path=Path("js/site-v13-5.js"); site=site_path.read_text().replace("// TP_SELLER_POLICY_V17_2","// TP_SELLER_POLICY_V18_1_3")
          def one(pattern,repl,text,label):
              new,n=re.subn(pattern,repl,text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f"Could not patch {label}; matches={n}")
              return new
          public_js=json.dumps(APPROVED,ensure_ascii=False,separators=(",",":"))
          site=one(r'const TP_PUBLIC_PRODUCT_SELLERS_V17_2 = new Set\(\[[^;]*?\]\);',f'const TP_PUBLIC_PRODUCT_SELLERS_V17_2 = new Set({public_js});',site,"browser public set")
          site=one(r'const TP_PRODUCT_SELLERS_V15_1 = \[[^;]*?\];',f'const TP_PRODUCT_SELLERS_V15_1 = {public_js};',site,"finder list")
          site=one(r'const TP_CJ_LIVE_SELLERS_V15_7_1 = new Set\(\[[^;]*?\]\);','const TP_CJ_LIVE_SELLERS_V15_7_1 = new Set(["PandaHall","FragranceShop.com","Karaca EU","TikTok Shop US"]);',site,"browser live set")
          ids=[x["advertiserId"] for x in ACTIVE_CJ]
          names=["diecast","diecastcom","fragranceshop","fragranceshopcom","karaca","karacaeu","karacaeurope","mfi","mfimedical","nordvpn","pandahall","pandahallcom","sportsevents365","ticketnetwork","ticketnetworkcom","tiktok","tiktokshop","tiktokshopus","tripcom","tripcomglobal","thefragranceshop","thefragranceshopcom"]
          site=one(r'const TP_CJ_APPROVED_IDS = new Set\(\[[^;]*?\]\);',f'const TP_CJ_APPROVED_IDS = new Set({json.dumps(ids,separators=(",",":"))});',site,"CJ IDs")
          site=one(r'const TP_CJ_APPROVED_NAMES = new Set\(\[[^;]*?\]\);',f'const TP_CJ_APPROVED_NAMES = new Set({json.dumps(names,separators=(",",":"))});',site,"CJ names")
          site=re.sub(r'\s*"temu":"Temu","temu\.com":"Temu","shop temu":"Temu"\s*',"\n",site,count=1)
          site=site.replace('const TP_CJ_GUARD_VERSION = "13.8.8";','const TP_CJ_GUARD_VERSION = "18.1.3";')
          site_path.write_text(site)

          hybrid_path=Path("netlify/functions/products-v16-hybrid.mjs"); hybrid=hybrid_path.read_text()
          hybrid,n=re.subn(r'\n\s*"Temu",','',hybrid,count=1)
          if n!=1: raise SystemExit("Could not remove Temu from hybrid live set")
          hybrid_path.write_text(hybrid)
          cj_path=Path("netlify/functions/cj-live-products.mjs"); cj=cj_path.read_text()
          cj,n1=re.subn(r'\s*"Temu":\s*\{[^\n]*\},\n','',cj,count=1)
          cj,n2=re.subn(r'\s*if \(\["temu","temu\.com","shop temu"\]\.includes\(raw\)\) return "Temu";\n','',cj,count=1)
          if n1!=1 or n2!=1: raise SystemExit(f"Could not remove Temu from CJ live function: {n1}/{n2}")
          cj_path.write_text(cj)
          print("Policy updated to 14 product sellers; Temu/Joom blocked; 10 active CJ advertisers recorded.")
          PY1

      - name: Validate seller policy before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check netlify/functions/product-seller-policy-v17.mjs
          node --check netlify/functions/products-v16-hybrid.mjs
          node --check netlify/functions/cj-live-products.mjs
          node --check js/site-v13-5.js
          python3 - <<'PY2'
          from pathlib import Path
          import json
          expected=["AliExpress","Alibaba","Geekbuying","FilamentPRO EU CPS","Govee Many GEOs","Harfington Many GEOs","Sunsky-online WW","Lenovo","Diecast","FragranceShop.com","Karaca EU","MFI Medical","PandaHall","TikTok Shop US"]
          reg=json.loads(Path("data/product-seller-registry-v17.json").read_text()); assert [x["name"] for x in reg["sellers"] if x.get("public")]==expected
          assert json.loads(Path("data/approved-product-sellers-v16.json").read_text())["sellers"]==expected
          assert json.loads(Path("data/seller-coverage-v15-1.json").read_text())["approvedProductSellers"]==expected
          st=json.loads(Path("data/cj-affiliate-status-v18.json").read_text()); assert len(st["activeAdvertisers"])==10 and "Temu" not in st["productSellerNames"]
          policy=Path("netlify/functions/product-seller-policy-v17.mjs").read_text(); line=next(x for x in policy.splitlines() if "PUBLIC_PRODUCT_SELLER_NAMES" in x); assert "Temu" not in line and "Joom" not in line
          site=Path("js/site-v13-5.js").read_text(); assert "TP_SELLER_POLICY_V18_1_3" in site
          for marker in ["const TP_PRODUCT_SELLERS_V15_1","const TP_PUBLIC_PRODUCT_SELLERS_V17_2","const TP_CJ_LIVE_SELLERS_V15_7_1"]: assert "Temu" not in next(x for x in site.splitlines() if marker in x)
          hybrid=Path("netlify/functions/products-v16-hybrid.mjs").read_text(); assert "Temu" not in hybrid.split("const CJ_LIVE_SELLERS",1)[1].split("]);",1)[0]
          cj=Path("netlify/functions/cj-live-products.mjs").read_text(); assert '"Temu"' not in cj.split("const SELLERS",1)[1].split("};",1)[0]
          print("Static policy validation PASS")
          PY2

      - name: Commit and push updated affiliate policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/product-seller-registry-v17.json data/approved-product-sellers-v16.json data/seller-coverage-v15-1.json data/cj-affiliate-status-v18.json netlify/functions/product-seller-policy-v17.mjs netlify/functions/products-v16-hybrid.mjs netlify/functions/cj-live-products.mjs js/site-v13-5.js
          if git diff --cached --quiet; then echo "No policy changes to commit."; else git commit -m "fix: sync active affiliates and remove pending Temu product seller"; git push origin HEAD:main; fi

      - name: Wait for Netlify to serve V18.1.3 seller policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import time, urllib.request, random
          base="https://trendpilotchoice.com/js/site-v13-5.js"; deadline=time.time()+480
          while time.time()<deadline:
              try:
                  req=urllib.request.Request(f"{base}?policy={int(time.time())}-{random.randint(1000,9999)}",headers={"Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=25) as r: text=r.read().decode("utf-8","replace")
                  if "TP_SELLER_POLICY_V18_1_3" in text:
                      line=next((x for x in text.splitlines() if "const TP_PRODUCT_SELLERS_V15_1" in x),"")
                      if "Temu" in line: raise RuntimeError("Temu still public")
                      print("Netlify serves V18.1.3 policy"); break
              except Exception as e: print("Deploy retry",type(e).__name__,str(e)[:160])
              time.sleep(8)
          else: raise SystemExit("Netlify publish timeout")
          PY3

      - name: Rebuild public product index without Temu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY4'
          import json,time,urllib.request,urllib.parse,random
          origin="https://trendpilotchoice.com"
          def get(path,timeout=35):
              sep="&" if "?" in path else "?"; url=origin+path+sep+"_cb="+str(int(time.time()*1000))+"-"+str(random.randint(1000,9999))
              req=urllib.request.Request(url,headers={"Accept":"application/json","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=timeout) as r: return json.loads(r.read().decode("utf-8","replace"))
          old=get("/api/products-v16/health"); old_done=str(old.get("completedAt") or "")
          req=urllib.request.Request(origin+"/api/products-v16/rebuild?policy=18.1.3-"+str(int(time.time())),headers={"Accept":"application/json","Cache-Control":"no-cache"})
          with urllib.request.urlopen(req,timeout=45) as r: print("Rebuild trigger",r.status,r.read(300).decode("utf-8","replace"))
          deadline=time.time()+900; last=None
          while time.time()<deadline:
              try:
                  h=get("/api/products-v16/health",25); last=h; done=str(h.get("completedAt") or "")
                  names=[str(x.get("seller") or "") for x in (h.get("topSellers") or []) if isinstance(x,dict)]
                  print({"ready":h.get("ready"),"status":h.get("status"),"products":h.get("products"),"sellers":h.get("sellers"),"completedAt":done})
                  if h.get("ready") and h.get("status")=="ready" and done and done!=old_done:
                      if "Temu" in names: raise SystemExit("Fresh index still has Temu")
                      print("Fresh index PASS"); break
              except Exception as e: print("Index retry",type(e).__name__,str(e)[:160])
              time.sleep(10)
          else: raise SystemExit(f"Fresh rebuild timeout. Last={last}")
          for blocked in ["Temu","Joom"]:
              q=urllib.parse.urlencode({"q":"phone","seller":blocked,"limit":"10"}); d=get("/api/products-v16-hybrid?"+q)
              if d.get("products"): raise SystemExit(f"{blocked} returned public products")
              print(blocked,"block PASS")
          PY4

      - name: Build V18.1.3 scored precision comparison lab
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v18-1-3-lab
          mkdir -p v18-1-3-lab
          cat > v18-1-3-scored-compare.mjs <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";
          import { clean, extractProducts } from "./netlify/functions/products-v16-lib.mjs";
          import { PUBLIC_PRODUCT_SELLER_NAMES, canonicalProductSeller } from "./netlify/functions/product-seller-policy-v17.mjs";

          const OUT = "v18-1-3-lab";
          fs.mkdirSync(OUT, { recursive: true });

          const approved = [...PUBLIC_PRODUCT_SELLER_NAMES];
          if (approved.length !== 14) throw new Error(`Expected 14 product sellers, got ${approved.length}`);
          if (approved.includes("Temu") || approved.includes("Joom")) throw new Error("Temu/Joom must not be public product sellers.");

          const rx = x => new RegExp(x, "i");
          const fold = v => clean(v).toLowerCase().replace(/[^a-z0-9]+/g,"");
          const hash = v => crypto.createHash("sha1").update(String(v)).digest("hex");

          function walkJson(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walkJson(full));
              else if (entry.isFile() && entry.name.toLowerCase().endsWith(".json")) out.push(full);
            }
            return out;
          }

          const files = walkJson("data");
          const byId = new Map();
          let failedFiles = 0;
          let rawRows = 0;

          for (const file of files) {
            try {
              const payload = JSON.parse(fs.readFileSync(file, "utf8"));
              const rows = extractProducts(payload, file, 160000);
              rawRows += rows.length;
              for (const raw of rows) {
                const seller = canonicalProductSeller(raw.seller);
                if (!seller) continue;
                const row = { ...raw, seller };
                const old = byId.get(row.id);
                const richness = p =>
                  Number(Boolean(p.imageUrl)) +
                  Number(Boolean(p.affiliateUrl || p.destinationUrl)) +
                  Number(Boolean(p.brand)) +
                  Number(Boolean(p.category)) +
                  Number(p.price != null);
                if (!old || richness(row) > richness(old)) byId.set(row.id, row);
              }
            } catch {
              failedFiles++;
            }
          }

          const PHONE_MODELS = [
            rx("\\biphone\\s*\\d{1,2}(?:\\s*(?:pro max|pro|plus|mini|air))?\\b"),
            rx("\\bgalaxy\\s*[asfz]\\s*\\d{1,3}(?:\\s*(?:ultra|plus|fe|pro))?\\b"),
            rx("\\bpixel\\s*\\d{1,2}(?:\\s*(?:pro|xl|a))?\\b"),
            rx("\\b(?:redmi|poco|oneplus|realme|oppo|vivo|honor)\\s+[a-z0-9+.-]{1,22}\\b")
          ];

          const configs = {
            phone: {
              threshold: 9,
              core: [
                [8, rx("\\bsmartphone\\b")], [8, rx("\\bmobile phone\\b")], [8, rx("\\bcell phone\\b")],
                [8, rx("\\bunlocked phone\\b")], [7, rx("\\bfeature phone\\b")],
                ...PHONE_MODELS.map(p => [7,p])
              ],
              support: [
                [2, rx("\\b(?:4g|5g)\\b")], [2, rx("\\b(?:dual sim|esim)\\b")],
                [2, rx("\\b(?:snapdragon|dimensity|mediatek|mtk|exynos)\\b")],
                [2, rx("\\b\\d{4,6}\\s*mah\\b")], [2, rx("\\b\\d{2,3}\\s*mp\\b")],
                [2, rx("\\b(?:64|128|256|512|1024)\\s*gb\\b")], [2, rx("\\bandroid\\s*\\d{1,2}\\b")]
              ],
              negative: [
                [-12, rx("\\b(?:lcd|oled)\\s+(?:screen|display)\\b|\\bdigitizer\\b|\\bscreen assembly\\b|\\breplacement screen\\b")],
                [-10, rx("\\b(?:case|cover|bumper|shell|screen protector|tempered glass|sim card tray)\\b")],
                [-10, rx("\\b(?:enclosure|adapter|charging cable|usb cable|dock|stand|mount|holder)\\b")],
                [-10, rx("\\b(?:repair|tester|test power supply|motherboard|housing|flex cable|replacement battery)\\b")],
                [-10, rx("\\b(?:emergency|weather|disaster)\\s+(?:radio|receiver)\\b|\\bhand[- ]?crank\\b")]
              ],
              accessory: [rx("\\b(?:case|cover|screen|display|lcd|oled|digitizer|protector|tray|adapter|enclosure|charger|cable|repair|replacement)\\b")]
            },
            laptop: {
              threshold: 10,
              core: [
                [9, rx("\\blaptop\\b")], [9, rx("\\bnotebook computer\\b")], [8, rx("\\bgaming notebook\\b")],
                [9, rx("\\bultrabook\\b")], [9, rx("\\bchromebook\\b")], [9, rx("\\bmacbook\\s+(?:air|pro)\\b")],
                [8, rx("\\bthinkpad\\s+[a-z0-9-]{1,16}\\b")]
              ],
              support: [
                [2, rx("\\b(?:intel|amd|ryzen|celeron|pentium|core\\s*i[3579])\\b")],
                [2, rx("\\b\\d{1,2}\\s*gb\\s*ram\\b")], [2, rx("\\b(?:128|256|512|1024)\\s*gb\\s*(?:ssd|storage|rom)?\\b")],
                [2, rx("\\b\\d{1,2}(?:\\.\\d{1,2})?\\s*(?:inch|inches|\")\\b")],
                [2, rx("\\b(?:windows\\s*1[01]|chrome os|macos)\\b")]
              ],
              negative: [
                [-12, rx("\\b(?:laptop|notebook|macbook)\\s+(?:bag|case|sleeve|stand|dock|charger|adapter)\\b")],
                [-11, rx("\\b(?:keyboard film|replacement fan|cooling fan|hinge|motherboard|screen panel|display panel|battery replacement)\\b")],
                [-10, rx("\\b(?:portable monitor|monitor)\\b")], [-10, rx("\\b(?:computer desk|laptop desk|tower shelf)\\b")],
                [-9, rx("\\b(?:ssd|ram|memory)\\b.{0,28}\\b(?:drive|module|upgrade|for laptop|for notebook)\\b")]
              ],
              accessory: [rx("\\b(?:bag|case|sleeve|stand|dock|charger|adapter|replacement|monitor|desk|keyboard film)\\b")]
            },
            smartwatch: {
              threshold: 9,
              core: [[9, rx("\\bsmart ?watch\\b")], [9, rx("\\bapple watch\\b")], [9, rx("\\bgalaxy watch\\b")], [8, rx("\\bfitness watch\\b")], [8, rx("\\bgps watch\\b")]],
              support: [[2, rx("\\bgps\\b")], [2, rx("\\bbluetooth\\b")], [2, rx("\\b(?:calling|call function|phone call)\\b")], [2, rx("\\b\\d(?:\\.\\d{1,2})?\\s*(?:inch|inches|\")\\b")], [2, rx("\\b\\d{2,5}\\s*mah\\b")]],
              negative: [[-12, rx("\\b(?:strap|band|bracelet|watch case|watch cover|charger|charging dock|protector|replacement)\\b")], [-12, rx("\\b(?:lcd|oled)\\s+(?:screen|display)\\b")]],
              accessory: [rx("\\b(?:strap|band|case|cover|charger|protector|replacement|screen|display)\\b")]
            },
            air_conditioner: {
              threshold: 10,
              core: [[9, rx("\\bair conditioner\\b")], [9, rx("\\bportable air conditioner\\b")], [9, rx("\\bwindow air conditioner\\b")], [9, rx("\\bmini split\\b")], [9, rx("\\bsplit (?:air conditioner|ac|system)\\b")], [8, rx("\\bduct type air conditioner\\b")]],
              support: [[3, rx("\\b\\d{4,6}\\s*btu\\b")], [3, rx("\\b\\d(?:\\.\\d+)?\\s*ton\\b")], [2, rx("\\binverter\\b")], [2, rx("\\b(?:cooling|heat pump)\\b")], [2, rx("\\b\\d(?:\\.\\d+)?\\s*hp\\b")]],
              negative: [[-13, rx("\\b(?:bracket|connector kit|exhaust hose|remote control|receiver board|filter core|spare part|replacement part)\\b")], [-13, rx("\\b(?:grille|ventilation grille|drilling|dust cover|water collector)\\b")], [-14, rx("\\b(?:bbq|barbecue|propane|burner)\\b")]],
              accessory: [rx("\\b(?:bracket|connector|hose|remote|board|filter|part|grille|vent|drill|cover)\\b")]
            },
            power_bank: {
              threshold: 9,
              core: [[9, rx("\\bpower ?bank\\b")], [8, rx("\\bportable charger\\b")]],
              support: [[2, rx("\\b\\d{4,6}\\s*mah\\b")], [2, rx("\\b\\d{2,3}\\s*w\\b")], [2, rx("\\b(?:pd|power delivery|quick charge|qc\\s*\\d)\\b")], [2, rx("\\busb[- ]?c\\b")]],
              negative: [[-13, rx("\\b(?:battery inverter|inverter adapter|power tool battery adapter)\\b")], [-10, rx("\\bfor\\s+(?:makita|bosch|dewalt|milwaukee)\\b")]],
              accessory: [rx("\\b(?:inverter adapter|battery adapter)\\b")]
            },
            headphones: {
              threshold: 9,
              core: [[9, rx("\\bheadphones?\\b")], [9, rx("\\bearbuds?\\b")], [9, rx("\\bearphones?\\b")], [8, rx("\\bheadset\\b")], [8, rx("\\btws\\b")]],
              support: [[2, rx("\\bbluetooth\\b")], [2, rx("\\b(?:anc|noise cancell?ing|noise cancellation)\\b")], [2, rx("\\b\\d{2,4}\\s*(?:hours?|hrs?)\\b")], [2, rx("\\b\\d{2,5}\\s*mah\\b")], [1, rx("\\b(?:aac|sbc|ldac|hi-res)\\b")]],
              negative: [[-14, rx("\\b(?:headphone|earphone|earbud|airpods?)\\s+(?:cable|case|cover|stand|holder|adapter)\\b")], [-14, rx("\\b(?:replacement cable|upgrade cable|ear pads?|ear cushions?|silicone case)\\b")], [-12, rx("\\b(?:desktop microphone|usb microphone|sound card|xlr cable|audio cable)\\b")], [-12, rx("\\bbluetooth speaker\\b")]],
              accessory: [rx("\\b(?:cable|case|cover|ear pads?|ear cushions?|adapter|stand|holder)\\b")]
            },
            perfume: {
              threshold: 9,
              core: [[9, rx("\\bperfume\\b")], [9, rx("\\beau de parfum\\b")], [9, rx("\\beau de toilette\\b")], [8, rx("\\bcologne\\b")], [5, rx("\\bfragrance\\b")]],
              support: [[3, rx("\\b\\d+(?:\\.\\d+)?\\s*(?:ml|oz|fl\\.?\\s*oz)\\b")], [2, rx("\\b(?:edp|edt|parfum)\\b")]],
              negative: [[-14, rx("\\b(?:fragrance style|fragrance cup|tea cup|teacup|tea bowl)\\b")], [-14, rx("\\b(?:airpod|airpods|keychain|coat|clothes|clothing|case cover)\\b")], [-12, rx("\\b(?:empty|refillable)\\s+perfume\\s+bottle\\b")]],
              accessory: [rx("\\b(?:keychain|case|cover|empty bottle|refillable bottle)\\b")]
            },
            pet_food: {
              threshold: 9,
              core: [[9, rx("\\bdog food\\b")], [9, rx("\\bcat food\\b")], [9, rx("\\bpet food\\b")], [8, rx("\\bkibble\\b")], [8, rx("\\b(?:wet|dry)\\s+(?:dog|cat|pet)\\s+food\\b")]],
              support: [[2, rx("\\b(?:protein|nutrition|chicken|beef|salmon|lamb)\\b")], [2, rx("\\b\\d+(?:\\.\\d+)?\\s*(?:kg|g|lb|oz)\\b")]],
              negative: [[-14, rx("\\b(?:bowl|feeder|dispenser|container|storage|toy|scoop|mat)\\b")]],
              accessory: [rx("\\b(?:bowl|feeder|dispenser|container|storage|toy|scoop|mat)\\b")]
            },
            cookware: {
              threshold: 8,
              core: [[9, rx("\\bcookware\\b")], [9, rx("\\bfrying pan\\b")], [9, rx("\\bsaucepan\\b")], [9, rx("\\bpot set\\b")], [8, rx("\\bcasserole\\b")], [8, rx("\\bpressure cooker\\b")]],
              support: [[2, rx("\\b(?:stainless steel|nonstick|non-stick|cast iron|ceramic)\\b")]],
              negative: [[-12, rx("\\b(?:toy|miniature|dollhouse|ornament)\\b")]],
              accessory: []
            },
            tools: {
              threshold: 8,
              core: [[9, rx("\\b(?:drill|screwdriver|wrench|spanner|pliers|hammer|ratchet|socket set|tool kit|power tool|saw|multimeter|oscilloscope|soldering iron)\\b")]],
              support: [[2, rx("\\b(?:cordless|brushless|torque|rpm|volt|\\d{1,2}v)\\b")]],
              negative: [[-12, rx("\\b(?:screen protector|phone case|iphone case)\\b")]],
              accessory: []
            },
            "3d_filament": {
              threshold: 9,
              core: [[10, rx("\\b(?:pla|petg|abs|tpu|asa|nylon)\\s+(?:3d\\s+printing\\s+)?filament\\b")], [9, rx("\\b3d\\s+print(?:er|ing)?\\s+filament\\b")], [9, rx("\\bfilament\\s+1\\.75\\s*mm\\b")]],
              support: [[3, rx("\\b(?:1\\.75|2\\.85)\\s*mm\\b")], [2, rx("\\b\\d+(?:\\.\\d+)?\\s*kg\\b")]],
              negative: [[-15, rx("\\b(?:tea bag|phone case|airpods?|sleeve|cover)\\b")]],
              accessory: []
            },
            lighting: {
              threshold: 8,
              core: [[9, rx("\\bled strip\\b")], [9, rx("\\bsmart light\\b")], [8, rx("\\blight bulb\\b")], [8, rx("\\bwall light\\b")], [8, rx("\\bfloor lamp\\b")], [8, rx("\\btable lamp\\b")], [8, rx("\\bspotlight\\b")]],
              support: [[2, rx("\\b\\d{2,5}\\s*(?:lm|lumens?)\\b")], [2, rx("\\b\\d{1,4}\\s*w\\b")], [1, rx("\\b(?:dimmable|rgb|warm white|cool white)\\b")]],
              negative: [[-10, rx("\\b(?:charger mirror|wireless charger mirror)\\b")]],
              accessory: []
            }
          };

          function scoreConfig(p, name, cfg) {
            const title = clean(p.title);
            const titleLower = title.toLowerCase();
            const context = clean(`${p.title} ${p.category || ""} ${p.subcategory || ""} ${(p.description || "").slice(0,650)}`).toLowerCase();
            let score = 0;
            let coreHits = 0;
            let supportHits = 0;
            let negativeHits = 0;
            for (const [weight, pattern] of cfg.core) {
              if (pattern.test(titleLower)) { score += weight; coreHits++; }
            }
            for (const [weight, pattern] of cfg.support || []) {
              if (pattern.test(context)) { score += weight; supportHits++; }
            }
            for (const [weight, pattern] of cfg.negative || []) {
              if (pattern.test(titleLower)) { score += weight; negativeHits++; }
            }
            if (name === "perfume" && p.seller === "FragranceShop.com" && coreHits) score += 3;
            if (name === "3d_filament" && p.seller === "FilamentPRO EU CPS" && coreHits) score += 3;
            if (name === "cookware" && p.seller === "Karaca EU" && coreHits) score += 2;
            return {
              name, score, coreHits, supportHits, negativeHits,
              accessoryHit: (cfg.accessory || []).some(pattern => pattern.test(titleLower)),
              threshold: cfg.threshold
            };
          }

          function classify(p) {
            const scored = Object.entries(configs).map(([name,cfg]) => scoreConfig(p,name,cfg));
            scored.sort((a,b) => b.score - a.score || b.coreHits - a.coreHits);
            const best = scored[0];
            if (best && best.coreHits > 0 && best.score >= best.threshold) {
              return {
                productType: best.name,
                trusted: true,
                score: best.score,
                confidence: best.score >= best.threshold + 5 ? "high" : "medium",
                reason: `score ${best.score} >= ${best.threshold}; core ${best.coreHits}; support ${best.supportHits}; negatives ${best.negativeHits}`
              };
            }
            const rejected = scored.find(x => x.coreHits > 0 && (x.negativeHits > 0 || x.score >= x.threshold - 4));
            if (rejected) {
              return {
                productType: rejected.accessoryHit ? `${rejected.name}_accessory` : "other",
                trusted: false,
                rejectedFrom: rejected.name,
                score: rejected.score,
                confidence: "rejected",
                reason: `score ${rejected.score} < ${rejected.threshold}; core ${rejected.coreHits}; support ${rejected.supportHits}; negatives ${rejected.negativeHits}`
              };
            }
            return { productType: "other", trusted: false, score: best?.score || 0, confidence: "none", reason: "no scored product type" };
          }

          const brands = ["Apple","Samsung","Xiaomi","Redmi","Poco","OnePlus","Google","Motorola","Huawei","Honor","Nokia","Realme","Oppo","Vivo","Lenovo","Dell","HP","Asus","Acer","MSI","Microsoft","Razer","LG","Sony","JBL","Anker","Baseus","UGREEN","Govee","Bosch","Makita","DeWalt","Milwaukee","Dyson","Philips","Panasonic","TCL","Hisense","Haier","Midea","Daikin","Armani","Dior","Chanel","Gucci","Versace","Burberry","Calvin Klein","Hugo Boss","Yves Saint Laurent","YSL"];
          const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
          function inferBrand(p) {
            if (clean(p.brand)) return clean(p.brand);
            const t = clean(p.title).toLowerCase();
            return brands.find(b => new RegExp(`(^|[^a-z0-9])${escapeRe(b.toLowerCase())}([^a-z0-9]|$)`,"i").test(t)) || "";
          }
          function modelHint(title) {
            for (const p of [
              /\b(iPhone\s*\d+(?:\s*(?:Pro Max|Pro|Plus|Mini|Air))?)\b/i,
              /\b(Galaxy\s*[ASZF]\s*\d{1,3}(?:\s*(?:Ultra|Plus|FE|Pro))?)\b/i,
              /\b(Pixel\s*\d+(?:\s*(?:Pro|XL|a))?)\b/i,
              /\b(Galaxy Watch\s*\d+(?:\s*(?:Pro|Classic|Ultra))?)\b/i,
              /\b(MacBook\s+(?:Air|Pro)(?:\s*M\d)?)\b/i,
              /\b(ThinkPad\s+[A-Za-z0-9-]{2,16})\b/i,
              /\b((?:Redmi|Poco|OnePlus)\s+[A-Za-z0-9+.-]{1,18})\b/i
            ]) {
              const m = clean(title).match(p);
              if (m) return clean(m[1]);
            }
            return "";
          }
          function num(text, pattern) {
            const m = clean(text).match(pattern);
            return m ? Number(m[1]) : null;
          }
          function extractSpecs(type, title, desc) {
            const text = clean(`${title} ${(desc || "").slice(0,900)}`);
            const specs = {};
            if (["phone","laptop"].includes(type)) {
              let ram = text.match(/\b(?:ram\s*)?(2|3|4|6|8|12|16|24|32|64)\s*gb\s*(?:ram|memory)\b/i);
              if (!ram) ram = text.match(/\b(?:ram|memory)\s*(2|3|4|6|8|12|16|24|32|64)\s*gb\b/i);
              if (ram) specs.ramGB = Number(ram[1]);
              const storage = type === "phone"
                ? text.match(/\b(64|128|256|512|1024)\s*gb\b/i)
                : text.match(/\b(128|256|512|1024)\s*gb\s*(?:ssd|storage|rom|nvme)\b/i);
              if (storage) specs.storageGB = Number(storage[1]);
            }
            if (type === "phone") {
              const bat = num(text, /\b(\d{4,6})\s*mah\b/i); if (bat) specs.batteryMah = bat;
              const cam = num(text, /\b(\d{2,3})\s*mp\b/i); if (cam) specs.cameraMP = cam;
              if (/\b5g\b/i.test(text)) specs.network5G = 1;
            }
            if (type === "smartwatch") {
              const screen = num(text, /\b(\d(?:\.\d{1,2})?)\s*(?:inch|inches|\")\b/i); if (screen) specs.screenInches = screen;
              if (/\bgps\b/i.test(text)) specs.gps = 1;
            }
            if (type === "air_conditioner") {
              const btu = num(text, /\b(\d{4,6})\s*btu\b/i); if (btu) specs.btu = btu;
              const tons = num(text, /\b(\d(?:\.\d+)?)\s*ton\b/i); if (tons) specs.tons = tons;
              if (/\binverter\b/i.test(text)) specs.inverter = 1;
            }
            if (type === "power_bank") {
              const bat = num(text, /\b(\d{4,6})\s*mah\b/i); if (bat) specs.batteryMah = bat;
              const w = num(text, /\b(\d{2,3})\s*w\b/i); if (w) specs.watts = w;
            }
            if (type === "headphones") {
              if (/\bbluetooth\b/i.test(text)) specs.bluetooth = 1;
              const hrs = num(text, /\b(\d{2,4})\s*(?:hours?|hrs?)\b/i); if (hrs) specs.playtimeHours = hrs;
              if (/\b(?:anc|noise cancell?ing|noise cancellation)\b/i.test(text)) specs.noiseCancelling = 1;
            }
            if (type === "perfume") {
              const ml = num(text, /\b(\d+(?:\.\d+)?)\s*ml\b/i); if (ml) specs.volumeMl = ml;
              const oz = num(text, /\b(\d+(?:\.\d+)?)\s*(?:fl\.?\s*)?oz\b/i); if (oz) specs.volumeOz = oz;
            }
            if (type === "3d_filament") {
              const kg = num(text, /\b(\d+(?:\.\d+)?)\s*kg\b/i); if (kg) specs.weightKg = kg;
              const dia = num(text, /\b(1\.75|2\.85)\s*mm\b/i); if (dia) specs.diameterMm = dia;
            }
            if (type === "lighting") {
              const w = num(text, /\b(\d{1,4})\s*w\b/i); if (w) specs.watts = w;
              const lm = num(text, /\b(\d{2,5})\s*(?:lm|lumens?)\b/i); if (lm) specs.lumens = lm;
            }
            return specs;
          }

          const offers = [...byId.values()].map(p => {
            const cls = classify(p);
            return {
              id: p.id, seller: p.seller, title: p.title, brand: inferBrand(p), modelHint: modelHint(p.title),
              productType: cls.productType, trustedForComparison: cls.trusted,
              classificationScore: cls.score, classificationConfidence: cls.confidence,
              classificationReason: cls.reason, rejectedFrom: cls.rejectedFrom || "",
              category: p.category, subcategory: p.subcategory, price: p.price, currency: p.currency,
              imageUrl: p.imageUrl, affiliateUrl: p.affiliateUrl, destinationUrl: p.destinationUrl,
              specs: extractSpecs(cls.productType, p.title, p.description)
            };
          });

          function priceBand(price) {
            if (!(price > 0)) return "";
            if (price < 25) return "under-25";
            if (price < 50) return "25-50";
            if (price < 100) return "50-100";
            if (price < 200) return "100-200";
            if (price < 350) return "200-350";
            if (price < 500) return "350-500";
            if (price < 750) return "500-750";
            if (price < 1000) return "750-1000";
            if (price < 1500) return "1000-1500";
            return "1500-plus";
          }

          const comparableKeys = {
            phone:["ramGB","storageGB","batteryMah","cameraMP","network5G"],
            laptop:["ramGB","storageGB"],
            smartwatch:["screenInches","gps"],
            air_conditioner:["btu","tons","inverter"],
            power_bank:["batteryMah","watts"],
            headphones:["playtimeHours","noiseCancelling","bluetooth"],
            perfume:["volumeMl","volumeOz"],
            "3d_filament":["weightKg","diameterMm"],
            lighting:["watts","lumens"]
          };
          function sharedKeys(products, type) {
            return (comparableKeys[type] || []).filter(k => products.filter(p => p.specs[k] != null).length >= 2);
          }
          function specScore(p, keys) {
            return keys.reduce((sum,k) => sum + Number(p.specs[k] || 0), 0);
          }

          const buckets = new Map();
          for (const p of offers) {
            if (!p.trustedForComparison || !(p.price > 0) || !p.currency) continue;
            const band = priceBand(p.price);
            const key = `${p.productType}|${p.currency.toUpperCase()}|${band}`;
            if (!buckets.has(key)) buckets.set(key, []);
            buckets.get(key).push(p);
          }

          const comparisonSets = [];
          for (const [key, rows] of buckets) {
            const [productType, currency, band] = key.split("|");
            const bySeller = new Map();
            for (const p of rows) {
              if (!bySeller.has(p.seller)) bySeller.set(p.seller, []);
              bySeller.get(p.seller).push(p);
            }
            if (bySeller.size < 2) continue;
            const products = [];
            for (const group of bySeller.values()) {
              group.sort((a,b) =>
                b.classificationScore - a.classificationScore ||
                Object.keys(b.specs).length - Object.keys(a.specs).length ||
                a.price - b.price
              );
              products.push({ ...group[0], badges: [] });
            }
            products.sort((a,b) => a.price - b.price);
            if (products.length > 8) products.length = 8;
            products[0].badges.push("Lowest price");
            const shared = sharedKeys(products, productType);
            if (shared.length >= 2) {
              const scored = products.map(p => ({ p, score: specScore(p,shared) }));
              const strongest = scored.reduce((a,b) => a.score >= b.score ? a : b).p;
              if (strongest.id !== products[0].id) strongest.badges.push("Better specs");
              const value = scored.map(x => ({ p:x.p, value:x.score/Math.max(x.p.price,1) })).reduce((a,b)=>a.value>=b.value?a:b).p;
              if (!value.badges.length) value.badges.push("Best value");
            }
            comparisonSets.push({
              comparisonId:`cmp-${hash(key).slice(0,18)}`, productType, currency, priceBand:band,
              sellerCount:products.length, minPrice:Math.min(...products.map(x=>x.price)),
              maxPrice:Math.max(...products.map(x=>x.price)), sharedComparableSpecs:shared, products
            });
          }
          comparisonSets.sort((a,b)=>b.sellerCount-a.sellerCount||a.productType.localeCompare(b.productType)||a.minPrice-b.minPrice);

          const sameMap = new Map();
          for (const p of offers) {
            if (!p.trustedForComparison || !p.brand || !p.modelHint) continue;
            const key = `${fold(p.brand)}|${fold(p.modelHint)}`;
            if (!sameMap.has(key)) sameMap.set(key, []);
            sameMap.get(key).push(p);
          }
          const sameModelGroups = [...sameMap.entries()]
            .map(([key,rows]) => {
              const sellers = [...new Set(rows.map(x=>x.seller))].sort();
              return { key, brand:rows[0].brand, model:rows[0].modelHint, sellers, sellerCount:sellers.length, offers:rows.slice(0,20) };
            })
            .filter(x=>x.sellerCount>=2)
            .sort((a,b)=>b.sellerCount-a.sellerCount||a.brand.localeCompare(b.brand));

          const trustedCounts = new Map();
          const rejectedCounts = new Map();
          const acceptedExamples = new Map();
          const rejectedExamples = new Map();
          for (const p of offers) {
            if (p.trustedForComparison) {
              trustedCounts.set(p.productType,(trustedCounts.get(p.productType)||0)+1);
              if (!acceptedExamples.has(p.productType)) acceptedExamples.set(p.productType,[]);
              if (acceptedExamples.get(p.productType).length < 6) acceptedExamples.get(p.productType).push(p);
            }
            if (p.rejectedFrom) {
              rejectedCounts.set(p.rejectedFrom,(rejectedCounts.get(p.rejectedFrom)||0)+1);
              if (!rejectedExamples.has(p.rejectedFrom)) rejectedExamples.set(p.rejectedFrom,[]);
              if (rejectedExamples.get(p.rejectedFrom).length < 8) rejectedExamples.get(p.rejectedFrom).push(p);
            }
          }

          const routesWanted = ["phone","laptop","smartwatch","air_conditioner","power_bank","headphones","perfume","pet_food","cookware","tools","3d_filament","lighting"];
          const searchRoutes = routesWanted.map(type => {
            const sets = comparisonSets.filter(x=>x.productType===type);
            return {
              type,
              trustedOffers: trustedCounts.get(type)||0,
              comparisonSets: sets.length,
              sellers:[...new Set(sets.flatMap(s=>s.products.map(p=>p.seller)))].sort()
            };
          });

          const activeAffiliateStatus = JSON.parse(fs.readFileSync("data/cj-affiliate-status-v18.json","utf8"));
          const summary = {
            version:"18.1.3-lab",
            approvedProductSellerCount:approved.length,
            approvedProductSellers:approved,
            cjActiveAffiliateCount:activeAffiliateStatus.activeAdvertisers.length,
            cjActiveProductPartnerCount:activeAffiliateStatus.activeAdvertisers.filter(x=>x.role==="product").length,
            joomBlocked:!approved.includes("Joom"),
            temuBlocked:!approved.includes("Temu"),
            jsonFilesScanned:files.length,
            jsonFilesFailed:failedFiles,
            rawProductRowsSeen:rawRows,
            storedApprovedOffers:offers.length,
            trustedComparisonOffers:offers.filter(x=>x.trustedForComparison).length,
            scoredComparisonSets:comparisonSets.length,
            sameModelMultiSellerGroups:sameModelGroups.length,
            trustedByType:Object.fromEntries([...trustedCounts.entries()].sort((a,b)=>b[1]-a[1])),
            rejectedByType:Object.fromEntries([...rejectedCounts.entries()].sort((a,b)=>b[1]-a[1])),
            searchRoutes
          };

          fs.writeFileSync(`${OUT}/summary.json`,JSON.stringify(summary,null,2));
          fs.writeFileSync(`${OUT}/scored-offers.ndjson`,offers.map(x=>JSON.stringify(x)).join("\n")+"\n");
          fs.writeFileSync(`${OUT}/comparison-sets.json`,JSON.stringify(comparisonSets));
          fs.writeFileSync(`${OUT}/same-model-groups.json`,JSON.stringify(sameModelGroups));
          fs.writeFileSync(`${OUT}/search-routes.json`,JSON.stringify(searchRoutes,null,2));
          fs.writeFileSync(`${OUT}/accepted-examples.json`,JSON.stringify(Object.fromEntries(acceptedExamples),null,2));
          fs.writeFileSync(`${OUT}/rejected-examples.json`,JSON.stringify(Object.fromEntries(rejectedExamples),null,2));

          const money=(p,c)=>`${Number(p).toFixed(2)} ${c}`;
          const report=[];
          report.push("# TrendPilot V18.1.3 — Scored Precision + Updated Seller Policy","");
          report.push("> Seller policy is updated in production; comparison scoring remains a read-only lab.","");
          report.push("## Seller policy","");
          report.push(`- Public product sellers: **${approved.length}**`);
          report.push(`- Temu blocked from product sellers: **${summary.temuBlocked?"PASS":"FAIL"}**`);
          report.push(`- Joom blocked from product sellers: **${summary.joomBlocked?"PASS":"FAIL"}**`);
          report.push(`- Active CJ advertisers recorded: **${summary.cjActiveAffiliateCount}**`);
          report.push(`- Active CJ product partners among them: **${summary.cjActiveProductPartnerCount}**`,"");
          report.push("### Active CJ advertisers","");
          for (const row of activeAffiliateStatus.activeAdvertisers) {
            report.push(`- **${row.name}** (${row.advertiserId}) — ${row.role}${row.productSeller?" — product seller":" — separate site category"}`);
          }
          report.push("","## Scored comparison totals","");
          report.push(`- Stored approved offers: **${summary.storedApprovedOffers.toLocaleString()}**`);
          report.push(`- Trusted offers after scoring: **${summary.trustedComparisonOffers.toLocaleString()}**`);
          report.push(`- Multi-seller comparison sets: **${summary.scoredComparisonSets.toLocaleString()}**`);
          report.push(`- Same-model groups (bonus): **${summary.sameModelMultiSellerGroups.toLocaleString()}**`,"");
          report.push("## Search routes","","| Intent | Trusted offers | Comparison sets | Sellers represented |","|---|---:|---:|---|");
          for (const r of searchRoutes) report.push(`| ${r.type} | ${r.trustedOffers.toLocaleString()} | ${r.comparisonSets.toLocaleString()} | ${r.sellers.join(", ")||"—"} |`);
          report.push("","## Representative accepted products","");
          for (const type of routesWanted) {
            const rows=acceptedExamples.get(type)||[];
            if (!rows.length) continue;
            report.push(`### ${type}`);
            for (const p of rows.slice(0,4)) report.push(`- ${p.seller}: ${p.title.slice(0,155)} — score **${p.classificationScore}**`);
            report.push("");
          }
          report.push("## Representative rejected/related products","");
          for (const type of routesWanted) {
            const rows=rejectedExamples.get(type)||[];
            if (!rows.length) continue;
            report.push(`### ${type}`);
            for (const p of rows.slice(0,5)) report.push(`- ${p.seller}: ${p.title.slice(0,155)} — _${p.classificationReason}_`);
            report.push("");
          }
          report.push("## Sample visitor comparison sets","");
          for (const type of routesWanted) {
            const set=comparisonSets.find(x=>x.productType===type);
            if (!set) continue;
            report.push(`### ${type} • ${set.currency} • ${set.priceBand}`);
            report.push(`Shared objective specs for badges: ${set.sharedComparableSpecs.join(", ")||"none — Lowest price only"}`);
            for (const p of set.products) {
              const badges=p.badges.length?` — **${p.badges.join(" / ")}**`:"";
              const specs=Object.keys(p.specs).length?Object.entries(p.specs).map(([k,v])=>`${k}=${v}`).join(", "):"specs pending";
              report.push(`- ${p.seller}: ${p.title.slice(0,140)} — ${money(p.price,p.currency)}${badges} — ${specs}`);
            }
            report.push("");
          }
          report.push("## Production decision","");
          report.push("V18.2 should be deployed only after these scored samples look like real products for their categories. Specific model matching remains a bonus; broad searches can compare useful alternatives by product type and price band.");

          fs.writeFileSync(`${OUT}/report.md`,report.join("\n")+"\n");
          console.log(report.join("\n"));
          JS
          node --check ./v18-1-3-scored-compare.mjs
          node ./v18-1-3-scored-compare.mjs
          rm -f ./v18-1-3-scored-compare.mjs

      - name: Validate V18.1.3 lab outputs
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require("node:fs");
          const s=JSON.parse(fs.readFileSync("v18-1-3-lab/summary.json","utf8"));
          if(s.approvedProductSellerCount!==14) throw new Error("Expected 14 product sellers");
          if(!s.temuBlocked||!s.joomBlocked) throw new Error("Blocked seller policy failed");
          if(s.cjActiveAffiliateCount!==10||s.cjActiveProductPartnerCount!==6) throw new Error("CJ active advertiser registry mismatch");
          if(s.storedApprovedOffers<1000) throw new Error("Too few stored offers");
          for(const f of ["scored-offers.ndjson","comparison-sets.json","same-model-groups.json","search-routes.json","accepted-examples.json","rejected-examples.json","report.md"]){const p=`v18-1-3-lab/${f}`;if(!fs.existsSync(p)||fs.statSync(p).size===0)throw new Error(`Missing ${f}`)}
          console.log("V18.1.3 validation PASS",{stored:s.storedApprovedOffers,trusted:s.trustedComparisonOffers,sets:s.scoredComparisonSets,sameModel:s.sameModelMultiSellerGroups});
          JS

