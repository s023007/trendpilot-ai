name: TrendPilot Products V15.4 Admitad Live Catalog Bridge

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-4-admitad-live-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-admitad-products:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Patch live search with validated Admitad catalog
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/tp_v15_4.py
          python /tmp/tp_v15_4.py

      - name: Validate V15.4 integration
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site-v13-5.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          js=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")
          data=json.loads(Path("data/admitad-products-new-account-v15-3-2.json").read_text(encoding="utf-8"))

          checks={
              "bridge marker":"TP_ADMITAD_LIVE_BRIDGE_V15_4_START" in js,
              "loader":"loadAdmitadProductsV15_4()" in js,
              "performSearch merge":"admitadRows" in js and "...admitadRows" in js,
              "new account id":"2980568" in js,
              "catalog file":"admitad-products-new-account-v15-3-2.json" in js,
              "cache bust":"/js/site-v13-5.js?v=15.4.0" in html,
              "320 staged products":len(data.get("products") or [])==320,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Validation failed: "+", ".join(failed))

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"js/site-v13-5.js","find/index.html"}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))

          if js.count("TP_CJ_SEARCH_BRIDGE_START") != 1 or js.count("TP_CJ_SEARCH_BRIDGE_END") != 1:
              raise SystemExit("CJ bridge integrity check failed.")

          if "/js/product-discovery-v15.js?v=15.2.0" not in html:
              raise SystemExit("Product Discovery V15.2 link changed unexpectedly.")

          print("Validation passed.")
          print("- 320 tracked Admitad products enabled in live search.")
          print("- Existing CJ bridge preserved.")
          print("- Suggestions, seller whitelist, CPC and CSS untouched.")
          PY

      - name: Publish V15.4 safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/site-v13-5.js find/index.html
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.4 already installed."
            exit 0
          fi

          git commit -m "feat: bridge new-account Admitad products into live search"
          git push origin HEAD:main

          {
            echo "## TrendPilot Products V15.4"
            echo ""
            echo "- Added 320 tracked Admitad products from validated new-account staging."
            echo "- Preserved CJ, CPC, seller whitelist and V15.2 suggestions."
            echo "- Uses Ad Space 2980568 / trendpilotchoice.com only."
            echo "- No old trendpilot-ai feed/deeplink source was re-enabled."
          } >> "$GITHUB_STEP_SUMMARY"
