name: Paid Perfume Product Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paid-perfume-product-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact tracked BellaVita offer from committed qualified catalog
        run: |
          set -euo pipefail
          mkdir -p offers/bellavita-her-n-more
          node <<'NODE'
          const fs=require('fs');
          const clean=v=>String(v??'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
          const norm=s=>clean(s).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const trackingHosts=/(?:^|\.)(?:anrdoezrs\.net|apmebf\.com|awltovhc\.com|commission-junction\.com|dpbolvw\.net|emjcd\.com|ftjcfx\.com|jdoqocy\.com|kqzyfj\.com|lduhtrp\.net|qksrv\.net|tkqlhce\.com)$/i;
          const tracked=v=>{try{return trackingHosts.test(new URL(clean(v)).hostname)}catch{return false}};
          const sourcePath='data/source-ingestion-v19/tiktok-shop-us-live-catalog.json';
          if(!fs.existsSync(sourcePath)) throw new Error('Committed TikTok Shop source catalog missing');
          const source=JSON.parse(fs.readFileSync(sourcePath,'utf8'));
          const rows=Array.isArray(source.products)?source.products:[];
          const scored=rows.map(row=>{
            const n=norm(row.title);
            let score=0;
            if(n.includes('her n more')||n.includes('her nmore')) score+=120;
            if(n.includes('bella vita')||n.includes('bellavita')) score+=30;
            if(n.includes('8')&&n.includes('20ml')) score+=20;
            if(n.includes('perfume')&&n.includes('gift')) score+=10;
            if(norm(row.brand).includes('bellavita')) score+=10;
            return {row,score};
          }).filter(x=>x.score>=120&&tracked(x.row.affiliateUrl)&&/^https?:/i.test(clean(x.row.imageUrl||x.row.image)));
          scored.sort((a,b)=>b.score-a.score);
          if(!scored.length) throw new Error('Exact Her N More tracked offer not found in committed TikTok source catalog');
          const row=scored[0].row;
          const out={
            schemaVersion:'paid-campaign-product-v1',
            campaign:'TP-PIN-US-PERFUME-01',
            fetchedAt:new Date().toISOString(),
            sourceCatalogGeneratedAt:source.generatedAt||'',
            advertiserId:clean(row.advertiserId)||'7563286',
            adId:'17099898',
            seller:'TikTok Shop US',
            sellerProductId:clean(row.sourceProductId||row.id),
            catalogId:clean(row.catalogId),
            title:clean(row.title),
            brand:clean(row.brand)||'BellaVita Luxury',
            description:clean(row.description),
            price:Number(row.price||0)||null,
            currency:clean(row.currency)||'USD',
            availability:clean(row.availability),
            condition:clean(row.condition),
            imageUrl:clean(row.imageUrl||row.image),
            affiliateUrl:clean(row.affiliateUrl),
            destinationUrl:clean(row.destinationUrl),
            trackingPolicy:'exact committed CJ affiliateUrl from qualified TikTok Shop catalog; do not modify',
            priceFreshnessNote:'Partner-catalog snapshot; final current price and stock must be confirmed on TikTok Shop.'
          };
          fs.writeFileSync('offers/bellavita-her-n-more/product-data.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({...out,affiliateUrl:'[tracked URL recorded]',destinationUrl:'[destination recorded]'},null,2));
          NODE

      - name: Validate safe campaign product data
        run: |
          node <<'NODE'
          const d=require('./offers/bellavita-her-n-more/product-data.json');
          if(d.advertiserId!=='7563286') throw new Error('Wrong advertiser');
          if(!/Her N.?More/i.test(d.title)) throw new Error('Wrong product title');
          if(!/^https?:/.test(d.imageUrl)) throw new Error('Missing image');
          if(!/^https?:/.test(d.affiliateUrl)) throw new Error('Missing tracked URL');
          const host=new URL(d.affiliateUrl).hostname;
          if(!/(jdoqocy|kqzyfj|dpbolvw|tkqlhce|anrdoezrs|emjcd|qksrv|apmebf|awltovhc|ftjcfx|lduhtrp)\.(?:com|net)$/i.test(host)) throw new Error('Non-CJ tracking host: '+host);
          console.log('Exact paid-campaign product data validated:',d.title,d.price,d.currency,d.availability,host);
          NODE

      - name: Commit exact safe product data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offers/bellavita-her-n-more/product-data.json
          if git diff --cached --quiet; then
            echo 'No data change.'
            exit 0
          fi
          git commit -m 'data: refresh BellaVita paid campaign offer'
          git pull --rebase origin main
          git push origin HEAD:main
