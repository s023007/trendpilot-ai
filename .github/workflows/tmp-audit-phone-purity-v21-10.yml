name: Temporary Phone Purity Audit

on:
  push:
    branches: [fix/phone-purity-v21-10]
    paths:
      - '.github/workflows/tmp-audit-phone-purity-v21-10.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Audit phone family titles
        shell: bash
        run: |
          python <<'PY'
          import json, glob, re
          from collections import Counter, defaultdict

          rows=[]
          for path in glob.glob('data/v20-9/products/*.json'):
              with open(path,encoding='utf-8') as f: bucket=json.load(f)
              for r in bucket.values():
                  fam=str(r.get('fa') or r.get('ty') or '').strip().lower()
                  role=str(r.get('ro') or 'main').strip().lower()
                  if fam=='phone' and role in ('main','used'):
                      rows.append(r)

          strong_device=re.compile(r'\b(?:smartphone|mobile\s+phone|cell(?:ular)?\s+phone|feature\s+phone|rugged\s+(?:smart)?phone|unlocked\s+(?:smart)?phone|android\s+(?:smart)?phone|gaming\s+(?:smart)?phone|satellite\s+phone|foldable\s+(?:smart)?phone|5g\s+(?:smart)?phone|4g\s+(?:smart)?phone|iphone(?:\s+\d|\s+[xsecr])|nothing\s+phone)\b',re.I)
          strong_bad=re.compile(r'\b(?:earpiece|receiver\s+speaker|speaker\s+replacement|charging\s+port|usb\s+connector|micro\s+usb\s+connector|type[- ]?c\s+connector|socket\s+dip|lcd\s+(?:screen|display)|digitizer|touch\s+screen\s+(?:replacement|assembly)|screen\s+replacement|replacement\s+(?:screen|battery|camera|speaker|microphone|back\s+cover)|back\s+cover|housing|middle\s+frame|motherboard|mainboard|logic\s+board|flex\s+cable|ribbon\s+cable|repair\s+parts?|spare\s+parts?|phone\s+parts?|solar\s+panel|phone\s+case|protective\s+case|screen\s+protector|tempered\s+glass|phone\s+holder|phone\s+stand|phone\s+mount|phone\s+strap|phone\s+lanyard)\b',re.I)
          compatibility=re.compile(r'\b(?:for|compatible\s+with)\s+(?:apple\s+)?(?:iphone|samsung\s+galaxy|galaxy|xiaomi|redmi|poco|oneplus|huawei|honor|oppo|vivo|realme|motorola|moto|nokia|pixel)\b',re.I)
          device_specs=[
            re.compile(r'\b(?:android\s*1[0-9]|android\s*[7-9]|5g|4g\s+lte|dual\s+sim|esim|snapdragon|dimensity|helio|octa[- ]?core)\b',re.I),
            re.compile(r'\b\d{1,2}\s*gb\s*(?:ram|\+|/)|\b\d{2,4}\s*gb\s*(?:rom|storage)\b',re.I),
            re.compile(r'\b\d(?:\.\d{1,2})?[- ]?(?:inch|\")\b',re.I),
            re.compile(r'\b\d{3,5}\s*mah\b',re.I),
          ]
          model_hint=re.compile(r'\b(?:iphone|galaxy\s+(?:s|a|m|f|z|note)\d|pixel\s+\d|redmi\s+(?:note\s+)?\d|poco\s+[a-z]\d|oneplus\s+\d|nothing\s+phone|fossibot\s+f\d|oukitel\s+(?:wp|c)\d|blackview\s+(?:bv|a)\d|ulefone\s+armor|doogee\s+(?:s|v|n)\d|cubot\s+\w+|infinix\s+\w+|tecno\s+\w+|nubia\s+\w+|zte\s+\w+)\b',re.I)

          def ok(r):
              t=str(r.get('t') or '')
              if strong_bad.search(t): return False,'strong_bad'
              if compatibility.search(t) and not strong_device.search(t): return False,'compatibility'
              if strong_device.search(t): return True,'device_word'
              specs=sum(bool(x.search(t)) for x in device_specs)
              if model_hint.search(t) and specs>=1: return True,'model+spec'
              if specs>=3: return True,'specs'
              return False,'weak'

          keep=[]; reject=[]
          for r in rows:
              good,why=ok(r)
              (keep if good else reject).append((r,why))

          print('PHONE MAIN/USED TOTAL',len(rows))
          print('KEEP',len(keep),'REJECT',len(reject))
          print('SELLERS TOTAL',Counter(r.get('se') for r in rows))
          print('SELLERS KEEP',Counter(r.get('se') for r,_ in keep))
          print('REJECT REASONS',Counter(w for _,w in reject))
          for seller in sorted(set(str(r.get('se')) for r in rows)):
              print('\n===',seller,'KEEP SAMPLE ===')
              for r,w in [(r,w) for r,w in keep if str(r.get('se'))==seller][:12]:
                  print(w,'|',r.get('id'),'|',r.get('t'))
              print('===',seller,'REJECT SAMPLE ===')
              for r,w in [(r,w) for r,w in reject if str(r.get('se'))==seller][:18]:
                  print(w,'|',r.get('id'),'|',r.get('t'))
          PY
