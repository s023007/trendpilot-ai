          )

          # Internal detail page: show only fields that exist.
          detail_page = ROOT / "ticket" / "index.html"
          detail_page.parent.mkdir(parents=True, exist_ok=True)
          detail_page.write_text(
              r'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="index,follow"><title>Ticket details — TrendPilot AI</title><meta name="description" content="Review the ticket data actually supplied before opening the live provider."><link rel="canonical" href="https://trendpilotchoice.com/ticket/"><link rel="stylesheet" href="/css/style-v13-2.css?v=13.2.0"><link rel="stylesheet" href="/css/style-v13-5.css?v=13.5.0"><link rel="stylesheet" href="/css/decision-v14.css?v=14.0.0"></head><body><main class="tp-section"><div class="tp-shell" data-ticket-detail><div class="tp-empty">Loading ticket details…</div></div></main><script defer src="/js/ticket-detail-v14.js?v=14.0.0"></script></body></html>'''
              + "\n",
              encoding="utf-8",
