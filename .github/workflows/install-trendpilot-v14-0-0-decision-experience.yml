          <body data-tp-page="wholesale"><a class="tp-skip" href="#main">Skip to content</a><header class="tp-header"><div class="tp-shell tp-nav"><a class="tp-brand" href="/"><img src="/images/logo-v4.svg" alt="" width="42" height="42"><span>TrendPilot <em>AI</em></span></a><nav class="tp-links" data-tp-nav><strong class="tp-menu-title">Explore TrendPilot</strong><button class="tp-menu-close" data-tp-menu-close type="button">×</button><span class="tp-menu-section-title">Decide</span><a href="/find/">Find products</a><a href="/wholesale/" class="is-active">Wholesale & bulk</a><a href="/deals/">Deals & coupons</a><a href="/compare/">Compare</a><span class="tp-menu-section-title">Explore</span><a href="/software/">Software Finder</a><a href="/rare-used/">Rare Finds</a><a href="/tickets/">Tickets & experiences</a><a href="/sourcing/">For Business</a></nav><button class="tp-menu-button" data-tp-menu-button type="button" aria-expanded="false"><span></span><span></span><span></span></button></div><button class="tp-nav-backdrop" data-tp-nav-backdrop type="button"></button></header>
          <main id="main"><section class="tp-wholesale-hero"><div class="tp-shell"><span class="tp-eyebrow">Wholesale & bulk finder</span><h1>Find products for resale, bulk buying and business sourcing.</h1><p>TrendPilot separates ordinary retail listings from records with wholesale, MOQ, supplier or business-sourcing evidence. Marketplace capability alone is labelled clearly; it is never presented as a guaranteed MOQ.</p></div></section>
          <div class="tp-wholesale-toolbar"><div class="tp-shell"><div class="tp-wholesale-controls"><label class="tp-wholesale-search"><span class="tp-sr-only">Search wholesale products</span><input data-ws-q type="search" autocomplete="off" placeholder="Phone cases, tools, packaging, custom logo…"></label><select data-ws-platform><option value="">All marketplaces</option></select><select data-ws-evidence><option value="">All wholesale evidence</option><option value="moq">MOQ stated</option><option value="explicit">Explicit wholesale/bulk</option><option value="marketplace">Wholesale-capable marketplaces</option></select><select data-ws-sort><option value="evidence">Best evidence</option><option value="price">Lowest listing price</option><option value="moq">Lowest stated MOQ</option><option value="platform">Marketplace A–Z</option></select></div><div class="tp-wholesale-summary"><span data-ws-count>Loading wholesale catalogue…</span><span>Alibaba · AliExpress · Temu · business sourcing</span></div></div></div>
          <section class="tp-shell"><div class="tp-wholesale-grid" data-ws-results><div class="tp-empty">Loading wholesale products…</div></div><button class="tp-btn tp-btn-light" data-ws-more type="button" hidden>Show more</button><div class="tp-ticket-inventory-banner"><b>Wholesale evidence rule:</b> confirm MOQ, whether the shown price is per unit or per lot, shipping, duties, customization, sample policy and supplier terms before payment.</div></section></main>
          <footer class="tp-footer"><div class="tp-shell tp-footer-bottom"><span>© <span data-year></span> TrendPilot AI.</span><span>Marketplace and wholesale terms can change; confirm them on the provider.</span></div></footer><nav class="tp-bottom-nav"><a href="/"><b>⌂</b><span>Home</span></a><a href="/find/"><b>⌕</b><span>Search</span></a><a class="is-active" href="/wholesale/"><b>▦</b><span>Wholesale</span></a><a href="/compare/"><b>⇄</b><span>Compare</span></a></nav>
          <script defer src="/js/site-v13-5.js?v=13.8.30"></script><script defer src="/js/wholesale-v14.js?v=14.0.0"></script><script defer src="/js/smart-search-v14.js?v=14.0.0"></script></body></html>
