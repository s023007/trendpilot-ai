          tickets = tickets.replace(
              "</head>",
              '<link rel="stylesheet" href="/css/decision-v14.css?v=14.0.0">\n'
              "</head>",
              1,
          )
          tickets = tickets.replace(
              "</body>",
              '<script defer src="/js/ticket-decision-v14.js?v=14.0.0"></script>\n'
              '<script defer src="/js/smart-search-v14.js?v=14.0.0"></script>\n'
              "</body>",
              1,
          )
          tickets_path.write_text(
              "\n".join(line.rstrip() for line in tickets.splitlines()) + "\n",
