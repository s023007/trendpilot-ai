                  r'[^>]*>\s*',
                  "\n",
                  page,
              )
              page = re.sub(
                  r'\s*<script[^>]+src="/js/smart-search-v13-8-[^"]+"'
                  r'[^>]*></script>\s*',
                  "\n",
                  page,
              )
              page = re.sub(
                  r'\s*<link[^>]+href="/css/decision-v14\.css[^"]*"'
                  r'[^>]*>\s*',
                  "\n",
                  page,
              )
              page = re.sub(
                  r'\s*<script[^>]+src="/js/smart-search-v14\.js[^"]*"'
                  r'[^>]*></script>\s*',
