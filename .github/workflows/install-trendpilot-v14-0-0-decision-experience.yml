      - name: Validate V14 decision experience
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js
          node --check js/smart-search-v14.js
          node --check js/wholesale-v14.js
          node --check js/ticket-decision-v14.js
          node --check js/ticket-detail-v14.js
          git diff --check

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(f"V14 validation failed: {message}")

          wholesale = json.loads(
              Path("data/wholesale-index.json").read_text(encoding="utf-8")
          )
          inventory = json.loads(
              Path("data/ticket-inventory.json").read_text(encoding="utf-8")
          )
          ticket_events = json.loads(
              Path("data/ticket-events.json").read_text(encoding="utf-8")
          )

          smart_js = Path("js/smart-search-v14.js").read_text(encoding="utf-8")
          ticket_js = Path("js/ticket-decision-v14.js").read_text(
              encoding="utf-8"
          )
          ticket_detail = Path("js/ticket-detail-v14.js").read_text(
              encoding="utf-8"
          )
          wholesale_js = Path("js/wholesale-v14.js").read_text(
              encoding="utf-8"
          )
          wholesale_page = Path("wholesale/index.html").read_text(
              encoding="utf-8"
          )
          tickets_page = Path("tickets/index.html").read_text(
              encoding="utf-8"
          )
          find_page = Path("find/index.html").read_text(encoding="utf-8")

          require(
              wholesale.get("version") == "14.0.0",
              "wholesale dataset version is incorrect",
          )
          require(
              isinstance(wholesale.get("products"), list),
              "wholesale products is not a list",
          )
          require(
              wholesale.get("count") == len(wholesale.get("products") or []),
              "wholesale count does not match rows",
          )
          require(
              isinstance(inventory.get("listings"), list),
              "ticket inventory schema is invalid",
          )
          require(
              ticket_events.get("count", 0) >= 10,
              "current ticket route dataset is unexpectedly small",
          )

          require(
              "visualViewport" in smart_js,
              "mobile keyboard/viewport handling is missing",
          )
          require(
              "blur" not in smart_js,
              "suggestions still close directly on input blur",
          )
          require(
              ".slice(0,6)" in smart_js and ".slice(0,3)" in smart_js,
              "short suggestion limits are missing",
          )
          require(
              "View all for" in smart_js,
              "suggestion View all action is missing",
          )

          require(
              "data-ws-results" in wholesale_page
              and "data-ws-q" in wholesale_page,
              "wholesale page search/results UI is incomplete",
          )
          require(
              "data-ws-quick" in wholesale_js,
              "wholesale Quick View is missing",
          )
          require(
              "MOQ" in wholesale_page and "evidence" in wholesale_js,
              "wholesale MOQ/evidence model is incomplete",
          )

          require(
              "routeLevel" in ticket_js and "dedupe" in ticket_js,
              "ticket route intelligence is incomplete",
          )
          require(
              "data-ticket-v14-quick" in ticket_js,
              "ticket Quick View is missing",
          )
          require(
              "ticket-inventory.json" in ticket_js,
              "seat inventory data hook is missing",
          )
          require(
              '"Not supplied"' not in ticket_js
              and '"Not supplied"' not in ticket_detail,
              "ticket UI still exposes Not supplied placeholders",
          )
          require(
              tickets_page.count("ticket-decision-v14.js") == 1,
              "V14 ticket runtime is missing or duplicated",
          )
          require(
              tickets_page.count("smart-search-v14.js") == 1,
              "V14 ticket suggestions runtime is missing or duplicated",
          )
          require(
              tickets_page.count("decision-v14.css") == 1,
              "V14 ticket CSS is missing or duplicated",
          )
          require(
              "ticket-comparison-v13-8-30.js" not in tickets_page,
              "legacy ticket comparison runtime is still loaded",
          )
          require(
              "smart-search-v13-8-30.js" not in tickets_page,
              "legacy ticket suggestions runtime is still loaded",
          )
          require(
              tickets_page.count("TP_V14_TICKET_LEGEND_START") == 1,
              "ticket data-level legend is missing or duplicated",
          )
          require(
              "TP_CJ_TICKET_DIRECTORY_START" not in tickets_page,
              "redundant ticket provider directories remain",
          )

          require(
              find_page.count("TP_WHOLESALE_PROMO_START") == 1,
              "wholesale finder promotion is missing or duplicated",
          )
          require(
              Path("ticket/index.html").exists(),
              "ticket detail page is missing",
          )
          require(
              Path("wholesale/index.html").exists(),
              "wholesale page is missing",
          )

          print(
              json.dumps(
                  {
                      "status": "PASS",
                      "wholesaleProducts": wholesale.get("count", 0),
                      "wholesalePlatforms": wholesale.get(
                          "platformCounts", {}
                      ),
                      "ticketRoutes": ticket_events.get("count", 0),
                      "seatInventoryRows": len(inventory.get("listings") or []),
                      "mobileSuggestions": "short + keyboard-aware + persistent",
                      "ticketMissingFields": "hidden",
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Publish V14 only if main has not changed
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"

          if [[ "$REMOTE_SHA" != "$TP_BASE_SHA" ]]; then
            echo "::error::main changed while V14 was running."
            echo "::error::Nothing was pushed. Run V14 again after other workflows finish."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/wholesale-index.json
          git add data/ticket-inventory.json
          git add js/smart-search-v14.js
          git add js/wholesale-v14.js
          git add js/ticket-decision-v14.js
          git add js/ticket-detail-v14.js
          git add css/decision-v14.css
          git add wholesale/index.html
          git add ticket/index.html
          git add tickets/index.html
          git add find/index.html
          git add sitemap.xml 2>/dev/null || true
          git add -u

          if git diff --cached --quiet; then
            echo "V14 is already installed."
            exit 0
          fi

          git diff --cached --check
          git commit -m "feat: install V14 decision experience"
          git push origin HEAD:main
