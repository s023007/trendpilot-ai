name: Install TrendPilot V14.0.0 Decision Experience

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v14-decision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-v14-decision-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Record starting revision
        shell: bash
        run: |
          set -euo pipefail
          echo "TP_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build V14 mobile search wholesale and ticket intelligence
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          from pathlib import Path
          from typing import Any

          VERSION = "14.0.0"
          ROOT = Path(".")
          DATA = ROOT / "data"
          JS = ROOT / "js"
          CSS = ROOT / "css"

          required = [
              ROOT / "find" / "index.html",
              ROOT / "tickets" / "index.html",
              DATA / "cj-products.json",
              DATA / "ticket-events.json",
              DATA / "search-catalog" / "manifest.json",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(
                  "V14 requires the successful V13.8.30 baseline. Missing: "
                  + ", ".join(missing)
              )

          def clean(value: Any) -> str:
              return re.sub(r"\s+", " ", html.unescape(str(value or ""))).strip()

          def valid_url(value: Any) -> bool:
              return bool(re.match(r"^https?://", clean(value), flags=re.I))

          def number(value: Any) -> float | None:
              try:
                  result = float(value)
                  return result if result >= 0 else None
              except (TypeError, ValueError):
                  return None

          # ================================================================
          # A. Wholesale / bulk data layer
          # ================================================================
          wholesale_terms = re.compile(
              r"\b(wholesale|bulk|moq|minimum order|minimum quantity|manufacturer|"
              r"supplier|factory|private label|custom logo|case pack|carton|"
              r"lot of|pieces per lot|pcs per lot)\b",
              re.I,
          )
          business_groups = {"business-sourcing", "wholesale", "b2b", "sourcing"}
          known_platforms = {
              "Alibaba": ("alibaba", "alibaba.com"),
              "AliExpress": ("aliexpress", "ali express", "aliexpress.com"),
              "Temu": ("temu", "temu.com"),
          }

          def seller_name(row: dict[str, Any]) -> str:
              return clean(
                  row.get("advertiser")
                  or row.get("seller")
                  or row.get("merchant")
                  or row.get("store")
                  or row.get("shop")
                  or row.get("brand")
              )

          def platform_for(row: dict[str, Any]) -> str:
              seller = seller_name(row).lower()
              context = clean(
                  " ".join(
                      str(row.get(key) or "")
                      for key in (
                          "network",
                          "source",
                          "program",
                          "url",
                          "affiliateUrl",
                          "destination",
                      )
                  )
              ).lower()
              blob = f"{seller} {context}"
              for platform, aliases in known_platforms.items():
                  if any(alias in blob for alias in aliases):
                      return platform
              return seller_name(row) or "Other"

          def parse_moq(text: str) -> int | None:
              patterns = (
                  r"\bMOQ\s*[:=-]?\s*(\d{1,6})\b",
                  r"\bminimum\s+(?:order|quantity)\s*[:=-]?\s*(\d{1,6})\b",
                  r"\bmin\.?\s*order\s*[:=-]?\s*(\d{1,6})\b",
              )
              for pattern in patterns:
                  match = re.search(pattern, text, flags=re.I)
                  if not match:
                      continue
                  try:
                      value = int(match.group(1))
                  except ValueError:
                      continue
                  if 1 <= value <= 1000000:
                      return value
              return None

          def wholesale_evidence(
              row: dict[str, Any],
          ) -> tuple[int, str, int | None]:
              text = clean(
                  " ".join(
                      str(row.get(key) or "")
                      for key in (
                          "name",
                          "title",
                          "description",
                          "category",
                          "subcategory",
                          "family",
                          "group",
                      )
                  )
              )
              moq = parse_moq(text)
              if moq is not None:
                  return 5, "MOQ stated in listing", moq
              if wholesale_terms.search(text):
                  return 4, "Wholesale or bulk wording in listing", None
              if clean(row.get("group")).lower() in business_groups:
                  return 3, "Business-sourcing catalogue", None
              if platform_for(row) in {"Alibaba", "AliExpress", "Temu"}:
                  return 2, "Wholesale-capable marketplace", None
              return 0, "", None

          def normalize_wholesale(
              row: dict[str, Any],
          ) -> dict[str, Any] | None:
              title = clean(row.get("name") or row.get("title"))
              url = clean(
                  row.get("url")
                  or row.get("affiliateUrl")
                  or row.get("productUrl")
              )
              image = clean(
                  row.get("image")
                  or row.get("imageUrl")
                  or row.get("imageLink")
              )
              if not title or not valid_url(url):
                  return None

              score, evidence, moq = wholesale_evidence(row)
              if score <= 0:
                  return None

              platform = platform_for(row)
              if platform not in {"Alibaba", "AliExpress", "Temu"} and score < 3:
                  return None

              price = number(row.get("price"))
              currency = clean(row.get("currency")) or "USD"
              source_id = clean(row.get("id"))
              identity = source_id or hashlib.sha256(
                  f"{platform}|{title}|{url}".encode("utf-8")
              ).hexdigest()[:24]

              return {
                  "id": f"wholesale-{identity}",
                  "sourceProductId": source_id,
                  "name": title,
                  "platform": platform,
                  "seller": seller_name(row) or platform,
                  "image": image if valid_url(image) else "",
                  "url": url,
                  "price": price,
                  "currency": currency,
                  "group": clean(row.get("group")) or "other",
                  "family": clean(row.get("family")),
                  "category": clean(row.get("category")),
                  "moq": moq,
                  "evidenceScore": score,
                  "evidence": evidence,
                  "priceBasis": (
                      "Listing price; verify whether it is per unit, pack or lot"
                      if price is not None
                      else "Price shown on provider"
                  ),
                  "quality": number(row.get("quality")) or 0,
              }

          wholesale_rows: list[dict[str, Any]] = []
          wholesale_seen: set[str] = set()

          def add_wholesale(row: dict[str, Any]) -> None:
              item = normalize_wholesale(row)
              if not item:
                  return
              key = (
                  f'{item["platform"].lower()}|'
                  f'{item["name"].lower()}|{item["url"]}'
              )
              if key in wholesale_seen:
                  return
              wholesale_seen.add(key)
              wholesale_rows.append(item)

          cj_products = json.loads(
              (DATA / "cj-products.json").read_text(encoding="utf-8")
          ).get("products") or []
          for row in cj_products:
              add_wholesale(row)

          manifest = json.loads(
              (DATA / "search-catalog" / "manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          preferred_files: list[str] = []
          other_files: list[str] = []

          for segment in manifest.get("segments") or []:
              target = (
                  preferred_files
                  if clean(segment.get("group")).lower() in business_groups
                  else other_files
              )
              for value in segment.get("files") or []:
                  value = clean(value)
                  if value:
                      target.append(value)

          ordered_files: list[str] = []
          for value in [*preferred_files, *other_files]:
              if value not in ordered_files:
                  ordered_files.append(value)

          scanned_files = 0
          scanned_products = 0
          for relative in ordered_files:
              if (
                  scanned_files >= 1400
                  or scanned_products >= 260000
                  or len(wholesale_rows) >= 3200
              ):
                  break
              local = ROOT / relative.lstrip("/")
              if not local.exists() or not local.is_file():
                  continue
              try:
                  payload = json.loads(local.read_text(encoding="utf-8"))
              except Exception:
                  continue

              scanned_files += 1
              rows = payload.get("products") or []
              scanned_products += len(rows)
              for row in rows:
                  add_wholesale(row)

          wholesale_rows.sort(
              key=lambda row: (
                  -int(row["evidenceScore"]),
                  0
                  if row["platform"] == "Alibaba"
                  else 1
                  if row["platform"] == "AliExpress"
                  else 2
                  if row["platform"] == "Temu"
                  else 3,
                  -float(row.get("quality") or 0),
                  row["name"].lower(),
              )
          )
          wholesale_rows = wholesale_rows[:2400]

          platform_counts: dict[str, int] = {}
          for row in wholesale_rows:
              platform_counts[row["platform"]] = (
                  platform_counts.get(row["platform"], 0) + 1
              )

          (DATA / "wholesale-index.json").write_text(
              json.dumps(
                  {
                      "version": VERSION,
                      "count": len(wholesale_rows),
                      "platformCounts": platform_counts,
                      "scannedFiles": scanned_files,
                      "scannedProducts": scanned_products,
                      "disclosure": (
                          "Wholesale evidence comes from explicit MOQ or bulk "
                          "wording, business-sourcing catalogue data, or a "
                          "wholesale-capable marketplace. Confirm MOQ, unit/lot "
                          "price, shipping, tax, customization and supplier terms "
                          "on the provider before ordering."
                      ),
                      "products": wholesale_rows,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          # ================================================================
          # B. Ticket inventory schema
          # ================================================================
          inventory_path = DATA / "ticket-inventory.json"
          if not inventory_path.exists():
              inventory_path.write_text(
                  json.dumps(
                      {
                          "version": VERSION,
                          "schema": {
                              "id": "unique listing id",
                              "eventTitle": "exact event title",
                              "provider": "provider name",
                              "date": "event date",
                              "venue": "venue name",
                              "city": "city",
                              "section": "seat section",
                              "row": "seat row",
                              "quantity": "available ticket quantity",
                              "price": "numeric ticket price",
                              "fees": "numeric fees when supplied",
                              "currency": "ISO currency",
                              "url": "affiliate/live inventory URL",
                          },
                          "listings": [],
                      },
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )

          # ================================================================
          # C. Shared V14 CSS
          # ================================================================
          CSS.mkdir(parents=True, exist_ok=True)
          (CSS / "decision-v14.css").write_text(
              r'''
          :root{--tp-v14-blue:#3157e5;--tp-v14-ink:#13201c;--tp-v14-muted:#68746f;--tp-v14-line:#dbe3e0;--tp-v14-soft:#f1f6f4;--tp-v14-green:#14765b}
          .tp-smart-search-host{position:relative!important}
          .tp-smart-suggestions{position:absolute;z-index:5000;top:calc(100% + 7px);left:0;right:0;overflow:hidden;border:1px solid var(--tp-v14-line);border-radius:18px;background:#fff;box-shadow:0 24px 70px rgba(13,29,25,.22)}
          .tp-smart-suggestions[hidden]{display:none!important}.tp-smart-scroll{max-height:330px;overflow:auto;overscroll-behavior:contain;padding:6px}
          .tp-smart-heading{display:flex;align-items:center;justify-content:space-between;padding:7px 10px 4px;color:var(--tp-v14-blue);font-size:.67rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
          .tp-smart-close{border:0;background:transparent;color:#66716d;font-size:1.15rem;line-height:1;cursor:pointer}
          .tp-smart-option{display:grid;width:100%;gap:2px;padding:10px 11px;border:0;border-radius:12px;background:transparent;text-align:left;cursor:pointer}
          .tp-smart-option:hover,.tp-smart-option.is-active{background:#eef3ff}
          .tp-smart-option b{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;color:var(--tp-v14-ink);font-size:.9rem;line-height:1.25}
          .tp-smart-option small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tp-v14-muted);font-size:.7rem}
          .tp-smart-footer{position:sticky;bottom:0;display:flex;gap:8px;padding:8px;border-top:1px solid #e5ece9;background:rgba(255,255,255,.98)}
          .tp-smart-view-all{display:flex;flex:1;min-height:42px;align-items:center;justify-content:center;border:0;border-radius:12px;background:var(--tp-v14-blue);color:#fff;font-weight:850;cursor:pointer}
          .tp-wholesale-hero{padding:56px 0 28px;background:linear-gradient(145deg,#f5f1ff,#edfff8)}
          .tp-wholesale-hero h1{max-width:850px;margin:8px 0 14px;font-size:clamp(2.15rem,6vw,4.4rem);line-height:1}
          .tp-wholesale-hero p{max-width:780px;color:var(--tp-v14-muted);font-size:1.05rem;line-height:1.7}
          .tp-wholesale-toolbar{position:sticky;top:74px;z-index:30;padding:14px 0;background:rgba(248,248,245,.96);backdrop-filter:blur(14px)}
          .tp-wholesale-controls{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(140px,1fr));gap:10px}
          .tp-wholesale-controls input,.tp-wholesale-controls select{width:100%;min-height:48px;padding:0 13px;border:1px solid var(--tp-v14-line);border-radius:13px;background:#fff;font:inherit}
          .tp-wholesale-summary{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.tp-wholesale-summary span{padding:7px 10px;border-radius:999px;background:#edf3ff;color:#274db8;font-size:.78rem;font-weight:800}
          .tp-wholesale-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:12px 0 60px}
          .tp-wholesale-card{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--tp-v14-line);border-radius:22px;background:#fff;box-shadow:0 12px 32px rgba(12,30,24,.05)}
          .tp-wholesale-image{aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;background:#f4f6f5}.tp-wholesale-image img{width:100%;height:100%;object-fit:contain}
          .tp-wholesale-body{display:flex;flex:1;flex-direction:column;padding:16px}.tp-wholesale-platform{color:var(--tp-v14-blue);font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
          .tp-wholesale-card h2{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:3;margin:7px 0 9px;font-size:1.02rem;line-height:1.35}
          .tp-wholesale-evidence{width:max-content;max-width:100%;padding:6px 9px;border-radius:999px;background:#eaf7f2;color:var(--tp-v14-green);font-size:.7rem;font-weight:850}
          .tp-wholesale-facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.tp-wholesale-facts div{padding:9px;border-radius:12px;background:var(--tp-v14-soft)}
          .tp-wholesale-facts small{display:block;color:var(--tp-v14-muted);font-size:.65rem}.tp-wholesale-facts b{display:block;margin-top:3px;font-size:.82rem}
          .tp-wholesale-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
          .tp-wholesale-actions a,.tp-wholesale-actions button{display:flex;min-height:43px;align-items:center;justify-content:center;border:1px solid var(--tp-v14-line);border-radius:12px;background:#fff;color:var(--tp-v14-ink);font:inherit;font-size:.78rem;font-weight:850;text-decoration:none;cursor:pointer}
          .tp-wholesale-actions .primary{border-color:var(--tp-v14-blue);background:var(--tp-v14-blue);color:#fff}
          .tp-v14-modal{position:fixed;z-index:6000;inset:0;display:grid;place-items:center;padding:16px}.tp-v14-modal[hidden]{display:none}
          .tp-v14-modal-backdrop{position:absolute;inset:0;border:0;background:rgba(8,20,17,.64)}.tp-v14-modal-dialog{position:relative;z-index:1;width:min(720px,100%);max-height:88dvh;overflow:auto;padding:24px;border-radius:24px;background:#fff}
          .tp-v14-modal-close{position:absolute;top:12px;right:12px;width:42px;height:42px;border:1px solid var(--tp-v14-line);border-radius:12px;background:#fff;font-size:1.35rem}
          .tp-ticket-data-legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.tp-ticket-data-legend span{padding:7px 10px;border-radius:999px;background:#eef3ff;color:#294fb9;font-size:.72rem;font-weight:800}
          .tp-ticket-inventory-banner{margin:15px 0;padding:14px 16px;border:1px solid #d9e3df;border-radius:16px;background:#f6faf8;color:#4f5f59;line-height:1.55}
          .tp-ticket-v14-group{margin:24px 0}.tp-ticket-v14-group-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:11px}.tp-ticket-v14-group-head h3{margin:0}.tp-ticket-v14-group-head span{color:var(--tp-v14-muted);font-size:.78rem}
          .tp-ticket-v14-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.tp-ticket-v14-card{display:flex;flex-direction:column;padding:17px;border:1px solid var(--tp-v14-line);border-radius:20px;background:#fff}
          .tp-ticket-v14-card .level{width:max-content;max-width:100%;padding:5px 8px;border-radius:999px;background:#eef3ff;color:#294fb9;font-size:.68rem;font-weight:900}
          .tp-ticket-v14-card h4{margin:10px 0 7px;font-size:1.03rem;line-height:1.32}.tp-ticket-v14-card p{color:var(--tp-v14-muted);font-size:.8rem;line-height:1.48}
          .tp-ticket-v14-facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto}.tp-ticket-v14-facts div{padding:9px;border-radius:12px;background:var(--tp-v14-soft)}
          .tp-ticket-v14-facts small{display:block;color:var(--tp-v14-muted);font-size:.63rem}.tp-ticket-v14-facts b{display:block;margin-top:3px;font-size:.78rem}
          .tp-ticket-v14-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.tp-ticket-v14-actions button,.tp-ticket-v14-actions a{display:flex;min-height:42px;align-items:center;justify-content:center;border:1px solid var(--tp-v14-line);border-radius:12px;background:#fff;color:var(--tp-v14-ink);font:inherit;font-size:.76rem;font-weight:850;text-decoration:none;cursor:pointer}
          .tp-ticket-v14-actions .primary{border-color:var(--tp-v14-blue);background:var(--tp-v14-blue);color:#fff}.tp-ticket-route-note{padding:12px;border-radius:13px;background:#fff7e6;color:#6d5522;font-size:.76rem;line-height:1.45}
          @media(max-width:900px){.tp-wholesale-grid,.tp-ticket-v14-grid{grid-template-columns:1fr 1fr}.tp-wholesale-controls{grid-template-columns:1fr 1fr}}
          @media(max-width:620px){.tp-smart-suggestions{position:fixed;left:10px;right:10px;top:var(--tp-smart-top,168px);bottom:calc(var(--tp-keyboard-height,0px) + 82px + env(safe-area-inset-bottom));max-height:none;border-radius:18px}.tp-smart-scroll{max-height:100%;padding-bottom:3px}.tp-smart-option{padding:9px 10px}.tp-smart-option b{font-size:.86rem;-webkit-line-clamp:1}.tp-smart-option small{font-size:.68rem}.tp-wholesale-controls,.tp-wholesale-grid,.tp-ticket-v14-grid{grid-template-columns:1fr}.tp-wholesale-toolbar{top:64px}.tp-wholesale-actions,.tp-ticket-v14-actions{grid-template-columns:1fr}.tp-ticket-v14-facts{grid-template-columns:1fr 1fr}}
          '''
              .strip()
              + "\n",
              encoding="utf-8",
          )

          # ================================================================
          # D. Mobile-safe autocomplete
          # ================================================================
          (JS / "smart-search-v14.js").write_text(
              r'''
          (()=>{"use strict";
          const d=document,$=(s,r=d)=>r.querySelector(s),$$=(s,r=d)=>Array.from(r.querySelectorAll(s)),clean=v=>String(v??"").replace(/\s+/g," ").trim(),low=v=>clean(v).toLowerCase();
          const short=(v,n=58)=>{v=clean(v);return v.length<=n?v:v.slice(0,n-1).trimEnd()+"…";};
          let productPromise=null,ticketPromise=null,wholesalePromise=null,openPanel=null,activeInput=null,active=-1;
          const curated={product:["Phone cases","Power banks","Perfume","Printers","Wireless earbuds","Smart watches","School supplies","Car accessories","Men's T-shirts","Home & kitchen","Tools","Wholesale products"],ticket:["Premier League","Champions League","Formula 1","NBA","Concert tickets","Theatre shows","Muse","Hotels","Flights","Attractions"],software:["VPN privacy","PDF editor","Video editor","Phone transfer","Data recovery","Password manager","Antivirus"],coupon:["Temu","Lenovo","AliExpress","Geekbuying","Wondershare","NordVPN"],wholesale:["Alibaba wholesale","AliExpress bulk","Temu bulk","Private label","MOQ 10","Custom logo","Factory supplier","Bulk electronics"]};
          async function products(){if(!productPromise)productPromise=fetch(`/data/cj-products.json?v=14-${Date.now()}`,{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(x=>(x.products||[]).map(p=>({value:short(p.name),full:clean(p.name),meta:clean(p.advertiser)||"Product"}))).catch(()=>[]);return productPromise;}
          async function tickets(){if(!ticketPromise)ticketPromise=fetch(`/data/ticket-events.json?v=14-${Date.now()}`,{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(x=>(x.events||[]).map(e=>({value:short(e.title),full:clean(e.title),meta:clean(e.provider)||"Ticket source"}))).catch(()=>[]);return ticketPromise;}
          async function wholesale(){if(!wholesalePromise)wholesalePromise=fetch(`/data/wholesale-index.json?v=14-${Date.now()}`,{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(x=>(x.products||[]).map(p=>({value:short(p.name),full:clean(p.name),meta:`${clean(p.platform)} · ${clean(p.evidence)}`}))).catch(()=>[]);return wholesalePromise;}
          function context(input){const page=d.body?.dataset?.tpPage||"";if(location.pathname.startsWith("/tickets"))return"ticket";if(location.pathname.startsWith("/wholesale"))return"wholesale";if(page==="software"||location.pathname.startsWith("/software"))return"software";if(location.pathname.includes("deal")||input.matches("[data-coupon-search]"))return"coupon";return"product";}
          function host(input){const holder=input.closest(".tp-search-input,.tp-ticket-compare-form,.tp-wholesale-search,label")||input.parentElement;holder?.classList.add("tp-smart-search-host");return holder;}
          function close(){if(openPanel)openPanel.hidden=true;openPanel=null;activeInput=null;active=-1;}
          function keyboardMetrics(input){if(!window.visualViewport)return;const vv=window.visualViewport,keyboard=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);d.documentElement.style.setProperty("--tp-keyboard-height",`${keyboard}px`);const rect=input.getBoundingClientRect(),top=Math.max(74,Math.min(rect.bottom+7,vv.height-170));d.documentElement.style.setProperty("--tp-smart-top",`${top}px`);}
