          # Remove V13 ticket/smart runtimes from this page only.
          tickets = re.sub(
              r'\s*<link[^>]+href="/css/ticket-comparison-v13-8-[^"]+"'
              r'[^>]*>\s*',
              "\n",
              tickets,
          )
          tickets = re.sub(
              r'\s*<link[^>]+href="/css/smart-search-v13-8-[^"]+"'
              r'[^>]*>\s*',
              "\n",
              tickets,
          )
          tickets = re.sub(
              r'\s*<script[^>]+src="/js/ticket-comparison-v13-8-[^"]+"'
              r'[^>]*></script>\s*',
              "\n",
              tickets,
          )
          tickets = re.sub(
              r'\s*<script[^>]+src="/js/smart-search-v13-8-[^"]+"'
              r'[^>]*></script>\s*',
              "\n",
              tickets,
          )
          tickets = re.sub(
              r'\s*<link[^>]+href="/css/decision-v14\.css[^"]*"[^>]*>\s*',
              "\n",
              tickets,
          )
          tickets = re.sub(
              r'\s*<script[^>]+src="/js/ticket-decision-v14\.js[^"]*"'
              r'[^>]*></script>\s*',
              "\n",
              tickets,
          )
          tickets = re.sub(
              r'\s*<script[^>]+src="/js/smart-search-v14\.js[^"]*"'
              r'[^>]*></script>\s*',
              "\n",
              tickets,
