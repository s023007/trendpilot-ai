name: TrendPilot V20.8 Universal Discovery and Rare Finds

on:
  push:
    branches:
      - main
    paths:
      - scripts/build-v20-8-universal-discovery.py
      - scripts/clean-v20-8-universal-output.py
      - scripts/clean-v20-8-brand-truth.py
      - js/universal-discovery-v20-8.js
      - js/rare-finds-v20-8.js
      - js/home-rare-v20-8.js
      - css/v20-8-universal.css
      - netlify/functions/discovery-demand-v20-8.cjs
      - rare-used/index.html
      - find/index.html
      - .github/workflows/trendpilot-v20-8-universal-discovery-rare-finds.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-universal-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build V20.8 universal discovery index
        run: python scripts/build-v20-8-universal-discovery.py

      - name: Apply V20.8 truth cleanup
        run: python scripts/clean-v20-8-universal-output.py

      - name: Apply V20.8 brand truth guard
        run: python scripts/clean-v20-8-brand-truth.py

      - name: Syntax and safety QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build-v20-8-universal-discovery.py
          python -m py_compile scripts/clean-v20-8-universal-output.py
          python -m py_compile scripts/clean-v20-8-brand-truth.py
          node --check js/universal-discovery-v20-8.js
          node --check js/rare-finds-v20-8.js
          node --check js/home-rare-v20-8.js
          node --check netlify/functions/discovery-demand-v20-8.cjs
          test -s data/v20-8/manifest.json
          test -s data/v20-8/taxonomy-summary.json
          test -s data/v20-8/rare-index.json
          test -s sitemap-v20-8.xml
          grep -q 'brandMustAppearInTitle' data/v20-8/manifest.json
          grep -q 'trendpilotchoice.com/rare-used/' rare-used/index.html
          grep -q 'universal-discovery-v20-8.js' find/index.html
          if git status --short | grep -E 'data/catalog-v19|data/.*(tpid|tpvid|tpoid|identity)'; then
            echo 'Unexpected identity or canonical catalog mutation'
            git status --short
            exit 1
          fi

      - name: Write build summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          x=json.loads(Path('data/v20-8/taxonomy-summary.json').read_text())
          print('# TrendPilot V20.8 — Universal Discovery + Rare Finds')
          print()
          print(f"- Canonical records scanned: **{x['records']:,}**")
          print(f"- Universal product types after truth cleanup: **{len(x['types']):,}**")
          print(f"- Rare candidates before publication cleanup: **{x['rareCandidates']:,}**")
          print(f"- Rare Finds published after truth cleanup: **{x['rarePublished']:,}**")
          print(f"- Static high-evidence SEO rare pages: **{x['seoRarePages']:,}**")
          print(f"- Universal search term shards: **{x['termShards']:,}**")
          print(f"- Universal product buckets: **{x['productBuckets']:,}**")
          print()
          print('## Truth cleanup')
          print('- Brand must be explicit in listing title or an explicit `by Brand` phrase: **YES**')
          print('- Seller/network names are prevented from masquerading as brands: **YES**')
          print('- Replacement-part taxonomy can override stale category metadata: **YES**')
          print('- Near-duplicate rare model families collapsed: **YES**')
          print('- Managed queries keep their specialist finder engine: **YES**')
          print()
          print('## Safety')
          print('- V19 canonical seller catalogs rebuilt: **NO**')
          print('- TPID / TPVID / TPOID rebuilt: **NO**')
          print('- Blocked seller policy changed: **NO**')
          print('- Search result pages made indexable: **NO**')
          print('- Rare SEO pages require stronger product and destination evidence: **YES**')
          PY

      - name: Commit V20.8 generated discovery assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/v20-8 rare-used/finds sitemap-v20-8.xml robots.txt
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git commit -m 'TrendPilot V20.8 build clean universal discovery and rare finds'
          git push
