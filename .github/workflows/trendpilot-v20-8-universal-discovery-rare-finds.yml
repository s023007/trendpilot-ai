name: TrendPilot V20.9.4 — Universal Product Quality Gate

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-v20-8-universal-discovery.py
      - scripts/clean-v20-8-universal-output.py
      - scripts/clean-v20-8-brand-truth.py
      - scripts/quality-gate-v20-9-all-products.py
      - scripts/refine-v20-9-2-residual-unclassified.py
      - scripts/refine-v20-9-2-final-closeout.py
      - scripts/semantic-closeout-v20-9-4.py
      - scripts/export-v20-9-runtime-data.py
      - scripts/audit-v20-9-all-products.py
      - scripts/qa-v20-9-product-smoke.py
      - scripts/report-v20-9-2-release-contract.py
      - scripts/finalize-v20-8-9-rare-closeout.py
      - js/universal-discovery-v20-9-1.js
      - js/finder-shell-v20-9.js
      - js/item-detail-v20-9.js
      - js/compare-v20-9.js
      - js/compare-state-v20-9.js
      - find/index.html
      - item/index.html
      - compare/index.html
      - rare-used/**
      - .github/workflows/trendpilot-v20-8-universal-discovery-rare-finds.yml

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-9-product-build-main
  cancel-in-progress: true

jobs:
  build-universal-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Build universal source projection
        run: python scripts/build-v20-8-universal-discovery.py

      - name: Apply established V20.8 truth guards
        shell: bash
        run: |
          set -euo pipefail
          python scripts/clean-v20-8-universal-output.py
          python scripts/clean-v20-8-brand-truth.py

      - name: Apply V20.9 all-product quality gate
        run: python scripts/quality-gate-v20-9-all-products.py

      - name: Apply V20.9.2 high-confidence residual pass
        run: python scripts/refine-v20-9-2-residual-unclassified.py

      - name: Apply V20.9.2 final explicit-noun closeout
        run: python scripts/refine-v20-9-2-final-closeout.py

      - name: Apply V20.9.4 semantic closeout
        run: python scripts/semantic-closeout-v20-9-4.py

      - name: Export role-balanced V20.9 mobile runtime
        run: python scripts/export-v20-9-runtime-data.py

      - name: Audit final V20.9.4 product projection
        run: python scripts/audit-v20-9-all-products.py

      - name: Preserve Rare V20.8.9 closeout
        run: python scripts/finalize-v20-8-9-rare-closeout.py

      - name: Cross-family product smoke QA
        run: python scripts/qa-v20-9-product-smoke.py

      - name: Build read-only granular release contract
        run: python scripts/report-v20-9-2-release-contract.py

      - name: Syntax, semantic, runtime and safety QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build-v20-8-universal-discovery.py scripts/clean-v20-8-universal-output.py scripts/clean-v20-8-brand-truth.py scripts/quality-gate-v20-9-all-products.py scripts/refine-v20-9-2-residual-unclassified.py scripts/refine-v20-9-2-final-closeout.py scripts/semantic-closeout-v20-9-4.py scripts/export-v20-9-runtime-data.py scripts/audit-v20-9-all-products.py scripts/qa-v20-9-product-smoke.py scripts/report-v20-9-2-release-contract.py scripts/finalize-v20-8-9-rare-closeout.py
          node --check js/universal-discovery-v20-9-1.js
          node --check js/finder-shell-v20-9.js
          node --check js/item-detail-v20-9.js
          node --check js/compare-v20-9.js
          node --check js/compare-state-v20-9.js
          node --check js/rare-finds-v20-8.js
          node --check js/rare-find-detail-v20-8-7.js
          node --check js/home-rare-v20-8.js
          node --check netlify/functions/discovery-demand-v20-8.cjs
          test -s data/v20-8/manifest.json
          test -s data/v20-8/taxonomy-summary.json
          test -s data/v20-8/rare-index.json
          test -s data/v20-9/quality-report.json
          test -s data/v20-9/residual-report.json
          test -s data/v20-9/semantic-closeout.json
          test -s data/v20-9/diagnostic.json
          test -s data/v20-9/families.json
          test -s data/v20-9/family-roles.json
          test -s data/v20-9/runtime-manifest.json
          test -s data/v20-9/contract-debug.json
          test -s sitemap-v20-8.xml
          grep -q 'universal-discovery-v20-9-1.js?v=20.9.4' find/index.html
          grep -q 'finder-shell-v20-9.js?v=20.9.0' find/index.html
          grep -q 'compare-state-v20-9.js?v=20.9.0' find/index.html index.html
          grep -q 'item-detail-v20-9.js?v=20.9.0' item/index.html
          grep -q 'compare-v20-9.js?v=20.9.0' compare/index.html
          grep -q 'https://trendpilotchoice.com/compare/' compare/index.html
          grep -q 'noindex,follow' item/index.html
          grep -q 'trendpilotchoice.com/rare-used/' rare-used/index.html
          if grep -q 'finder-v20-7-9.js' find/index.html || grep -q 'buyer-decision-v20-7-11.js' find/index.html || grep -q 'v20-8-8-internal-first-guard.js' find/index.html; then
            echo 'Legacy finder/card mutator leaked into authoritative V20.9.4 finder'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/v20-9/contract-debug.json').read_text())
          q=json.loads(Path('data/v20-9/quality-report.json').read_text())
          r=json.loads(Path('data/v20-9/residual-report.json').read_text())
          s=json.loads(Path('data/v20-9/semantic-closeout.json').read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text())
          m=json.loads(Path('data/v20-8/manifest.json').read_text())
          rare=json.loads(Path('data/v20-8/rare-index.json').read_text())
          print(json.dumps(x,ensure_ascii=False,indent=2))
          if not x.get('passed'):
              raise SystemExit('V20.9.4 production contract failed: '+', '.join(x.get('failed') or []))
          assert s['version']=='20.9.4' and s['violations']==0 and s['records']==52031
          assert q.get('semanticCloseoutVersion')=='20.9.4'
          assert q.get('semanticCloseoutViolations')==0
          assert q['unclassifiedAfter']==r['unclassifiedAfterResidual']==d['unclassified']==s['unclassifiedAfter']
          assert q['unclassifiedAfter']<=2500
          assert q['blockedSellerLeaks']==0
          assert q['immutableCommerceFieldsChanged']==0
          assert rt['productBuckets']==256 and rt['maxProductBucketBytes']<500000
          assert rt.get('familyStrategy')=='role-balanced'
          assert m.get('truthCleanup',{}).get('residualUnclassifiedPassVersion')=='20.9.2'
          assert m.get('truthCleanup',{}).get('semanticCloseoutVersion')=='20.9.4'
          assert m.get('truthCleanup',{}).get('rareCloseoutVersion')=='20.8.9'
          assert m.get('rarePublished')==len(rare)
          print('V20.9.4 PRODUCTION PRODUCT CONTRACT PASS')
          PY
          if grep -RE 'new MutationObserver\([^)]*document|observe\(document' js/universal-discovery-v20-9-1.js js/finder-shell-v20-9.js js/item-detail-v20-9.js js/compare-v20-9.js js/compare-state-v20-9.js; then
            echo 'Whole-document MutationObserver is forbidden'
            exit 1
          fi
          if git status --short | grep -E 'data/catalog-v19|data/.*(tpid|tpvid|tpoid|identity)'; then
            echo 'Unexpected identity or canonical catalog mutation'
            git status --short
            exit 1
          fi

      - name: Write V20.9.4 build summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          q=json.loads(Path('data/v20-9/quality-report.json').read_text())
          r=json.loads(Path('data/v20-9/residual-report.json').read_text())
          s=json.loads(Path('data/v20-9/semantic-closeout.json').read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text())
          m=json.loads(Path('data/v20-8/manifest.json').read_text())
          rare=json.loads(Path('data/v20-8/rare-index.json').read_text())
          contract=json.loads(Path('data/v20-9/contract-debug.json').read_text())
          print('# TrendPilot V20.9.4 — All Product Families + Semantic Quality Gate')
          print()
          print(f"- Catalogue records preserved: **{q['records']:,}**")
          print(f"- Unclassified: **{q['unclassifiedBefore']:,} → {q['unclassifiedAfter']:,} ({q['unclassifiedAfterPct']}%)**")
          print(f"- Base type corrections: **{sum(x['count'] for x in q['typeChanges']):,}**")
          print(f"- Residual classifications: **{r['classifiedByResidual']:,}**")
          print(f"- Final residual closeout: **{q.get('finalCloseoutClassified',0):,}**")
          print(f"- Semantic corrections/retypes: **{s['corrected']:,}**")
          print(f"- Targeted semantic violations: **{s['violations']}**")
          print(f"- Base role corrections: **{sum(x['count'] for x in q['roleChanges']):,}**")
          print(f"- Product families: **{q['familyCount']:,}**")
          print(f"- Mobile product buckets: **{rt['productBuckets']:,}**")
          print(f"- Largest mobile bucket: **{rt['maxProductBucketBytes']:,} bytes**")
          print(f"- Family retrieval strategy: **{rt.get('familyStrategy')}**")
          print(f"- Strong accessory grammar still marked main: **{d['roleAnomalies']['mainWithStrongAccessoryGrammar']['count']:,}**")
          print(f"- Strong replacement grammar still marked main: **{d['roleAnomalies']['mainWithStrongReplacementGrammar']['count']:,}**")
          print(f"- Blocked seller leaks: **{q['blockedSellerLeaks']}**")
          print(f"- Commerce/identity evidence fields changed: **{q['immutableCommerceFieldsChanged']}**")
          print(f"- Rare Finds preserved: **{len(rare):,}**")
          print(f"- Release contract: **{'PASS' if contract.get('passed') else 'FAIL'}**")
          print()
          print('## Shopper behavior')
          print('- V20.9.4 authoritative finder: **YES**')
          print('- Generic searches exclude known semantic false positives: **YES**')
          print('- Main / accessory / replacement / used roles remain separate: **YES**')
          print('- Seller filter persists per query: **YES**')
          print('- Exact-product and seller-feed prices stay visibly separate: **YES**')
          print('- Product cards open TrendPilot details before seller exit: **YES**')
          print('- Comparison is limited to the same product family: **YES**')
          print()
          print('## Safety')
          print('- V19 canonical seller catalogs rebuilt: **NO**')
          print('- TPID / TPVID / TPOID rebuilt: **NO**')
          print('- Blocked seller policy changed: **NO**')
          print('- GEO import filter added: **NO**')
          print('- Rare closeout weakened: **NO**')
          PY

      - name: Commit V20.9.4 generated product assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'

          # Safety first: generated work must never touch canonical identity/catalog evidence.
          if git status --short | grep -E 'data/catalog-v19|data/.*(tpid|tpvid|tpoid|identity)'; then
            echo 'Unexpected identity or canonical catalog mutation before commit'
            git status --short
            exit 1
          fi

          # Commit every generated V20.8/V20.9 projection/runtime asset that the build is
          # allowed to mutate. This intentionally includes data/v20-8/products and runtime
          # shards, which were the unstaged files that previously blocked pull --rebase.
          git add data/v20-8 data/v20-9 rare-used/finds sitemap-v20-8.xml robots.txt

          # Refuse to continue if any tracked/untracked build output remains outside the
          # allowlist. A clean worktree after staging is required before rebase/push.
          if [ -n "$(git status --porcelain)" ]; then
            remaining="$(git status --porcelain | grep -vE '^[ MARC?]{2} (data/v20-8/|data/v20-9/|rare-used/finds/|sitemap-v20-8\.xml$|robots\.txt$)' || true)"
            if [ -n "$remaining" ]; then
              echo 'Unexpected generated paths remain outside the V20.9.4 commit allowlist:'
              echo "$remaining"
              exit 1
            fi
          fi

          if git diff --cached --quiet; then
            echo 'No generated product changes to commit'
            exit 0
          fi

          git commit -m 'TrendPilot V20.9.4 build final semantic runtime'

          # There must be no unstaged/untracked changes before pull --rebase.
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Worktree is not clean after generated-asset commit:'
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Safe push retry $attempt/3"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo 'Unable to push generated runtime without force.'
          exit 1
