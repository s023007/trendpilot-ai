name: Tumblr CarPlay Native Photo Final

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tumblr-carplay-photo-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
      TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
      TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
      TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet PyTumblr Pillow
      - name: Queue native photo, verify, then remove old text copy
        shell: bash
        run: |
          mkdir -p data/runtime
          python - <<'PY'
          import os,json,traceback
          from datetime import datetime,timezone
          from PIL import Image
          import pytumblr
          out={'started_at':datetime.now(timezone.utc).isoformat(),'auth_ok':False,'blog':None,'image_valid':False,'created':None,'verified':False,'photos_present':False,'deleted_old':[],'queue_after':None,'error':None}
          path='data/runtime/tumblr-native-photo-final.json'
          def save():
              with open(path,'w') as f: json.dump(out,f,indent=2); f.write('\n')
          try:
              src='images/social/carplay-ai-01.jpg'; dst='/tmp/carplay-native.jpg'
              im=Image.open(src).convert('RGB'); im.save(dst,'JPEG',quality=92,progressive=False); Image.open(dst).verify(); out['image_valid']=True
              c=pytumblr.TumblrRestClient(os.environ['TUMBLR_CONSUMER_KEY'],os.environ['TUMBLR_CONSUMER_SECRET'],os.environ['TUMBLR_OAUTH_TOKEN'],os.environ['TUMBLR_OAUTH_TOKEN_SECRET'])
              info=c.info(); out['auth_ok']=bool(info.get('user')); blogs=info['user'].get('blogs',[])
              b=next((x for x in blogs if str(x.get('name','')).lower()=='trendpilotchoice'),None) or next((x for x in blogs if x.get('primary')),None) or blogs[0]
              blog=b.get('name') or b.get('url'); out['blog']=blog
              title='Will a Wireless CarPlay Adapter Work in Your Car?'
              before=c.queue(blog,limit=50,offset=0); old=[]
              for p in before.get('posts',[]):
                  if title in str(p.get('summary','')) or any(str(t).startswith('trendpilot-carplay-') for t in p.get('tags',[])): old.append(str(p.get('id')))
              url='https://trendpilotchoice.com/products/wireless-carplay-adapters/?utm_source=tumblr&utm_medium=organic&utm_campaign=wireless-carplay-search-first&utm_content=native-photo-final'
              cap=f'<h2>{title}</h2><p>Before buying, confirm that wired CarPlay already works, the USB port carries data, firmware updates are available, and the seller has a clear return route.</p><p><a href="{url}"><strong>Read the full Wireless CarPlay buying guide</strong></a></p><p>TrendPilot — Smarter buying. Fewer surprises.</p>'
              r=c.create_photo(blog,state='queue',tags=['wireless carplay','car accessories','car gadgets','apple carplay','buying guide','smart shopping','TrendPilot'],format='html',caption=cap,link=url,data=dst)
              nid=str(r.get('id','')) if isinstance(r,dict) else ''; out['created']={'ok':bool(nid),'id':nid or None,'response':r}
              if not nid: raise RuntimeError('No post id returned: '+repr(r))
              q=c.queue(blog,limit=50,offset=0); np=next((p for p in q.get('posts',[]) if str(p.get('id'))==nid),None)
              out['verified']=bool(np); out['photos_present']=bool(np and np.get('photos'))
              if not out['photos_present']: raise RuntimeError('New queued post has no photo')
              for pid in old:
                  if pid!=nid: c.delete_post(blog,pid); out['deleted_old'].append(pid)
              q2=c.queue(blog,limit=50,offset=0); out['queue_after']=[{'id':str(p.get('id')),'type':p.get('type'),'summary':p.get('summary',''),'photos_count':len(p.get('photos') or []),'tags':p.get('tags',[])} for p in q2.get('posts',[])]
          except Exception: out['error']=traceback.format_exc()
          finally: save()
          PY
      - name: Persist verification result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/tumblr-native-photo-final.json
          git commit -m "chore: record final Tumblr native photo result" || exit 0
          git pull --rebase origin main || true
          git push || true
