name: Tumblr CarPlay Native Video Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tumblr-carplay-photo-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
      TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
      TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
      TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --quiet PyTumblr Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Initialize diagnostic
        run: |
          mkdir -p data/runtime
          printf '{"stage":"started"}\n' > data/runtime/tumblr-native-video-test.json
      - name: Build 8-second vertical MP4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          import json
          src='images/social/carplay-ai-01.jpg'
          dst='/tmp/carplay-video-source.jpg'
          im=Image.open(src).convert('RGB')
          im.save(dst,'JPEG',quality=94,progressive=False)
          Image.open(dst).verify()
          with open('data/runtime/tumblr-native-video-test.json','w') as f: json.dump({'stage':'image_valid'},f)
          PY
          ffmpeg -y -loop 1 -i /tmp/carplay-video-source.jpg \
            -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,zoompan=z='min(zoom+0.0006,1.04)':d=200:s=720x1280:fps=25,fade=t=in:st=0:d=0.3,fade=t=out:st=7.5:d=0.5,format=yuv420p" \
            -t 8 -r 25 -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p -movflags +faststart -an /tmp/carplay-tumblr-test.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,pix_fmt -of json /tmp/carplay-tumblr-test.mp4
          python - <<'PY'
          import json,os
          with open('data/runtime/tumblr-native-video-test.json','w') as f: json.dump({'stage':'video_built','video_bytes':os.path.getsize('/tmp/carplay-tumblr-test.mp4')},f)
          PY
      - name: Queue native Tumblr video and verify
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os, traceback
          from datetime import datetime, timezone
          import pytumblr

          marker='trendpilot-carplay-video-test-v3'
          title='Wireless CarPlay: Will It Work in Your Car?'
          video='/tmp/carplay-tumblr-test.mp4'
          url='https://trendpilotchoice.com/products/wireless-carplay-adapters/?utm_source=tumblr&utm_medium=organic&utm_campaign=wireless-carplay-search-first&utm_content=native-video-v3'
          tags=[marker,'wireless carplay','car accessories','car gadgets','apple carplay','buying guide','TrendPilot']
          caption=f'<h2>{title}</h2><p>Quick compatibility check before you buy: wired CarPlay should already work in your car, and the USB port should carry data.</p><p><a href="{url}"><strong>Read the full Wireless CarPlay buying guide</strong></a></p><p>TrendPilot — Smarter buying. Fewer surprises.</p>'
          out={'started_at':datetime.now(timezone.utc).isoformat(),'stage':'tumblr_upload','auth_ok':False,'blog':None,'video_bytes':os.path.getsize(video) if os.path.exists(video) else None,'created':None,'verified':False,'video_present':False,'queue_after':None,'error':None}
          path='data/runtime/tumblr-native-video-test.json'
          try:
              c=pytumblr.TumblrRestClient(os.environ['TUMBLR_CONSUMER_KEY'],os.environ['TUMBLR_CONSUMER_SECRET'],os.environ['TUMBLR_OAUTH_TOKEN'],os.environ['TUMBLR_OAUTH_TOKEN_SECRET'])
              info=c.info(); out['auth_ok']=bool(info.get('user')); blogs=info.get('user',{}).get('blogs',[])
              b=next((x for x in blogs if str(x.get('name','')).lower()=='trendpilotchoice'),None) or next((x for x in blogs if x.get('primary')),None) or (blogs[0] if blogs else None)
              if not b: raise RuntimeError('No Tumblr blog resolved')
              blog=b.get('name') or b.get('url'); out['blog']=blog
              before=c.queue(blog,limit=50,offset=0)
              old=[str(p.get('id')) for p in before.get('posts',[]) if marker in [str(t) for t in (p.get('tags') or [])]]
              r=c.create_video(blog,state='queue',tags=tags,caption=caption,data=video)
              nid=str(r.get('id','')) if isinstance(r,dict) else ''
              out['created']={'ok':bool(nid),'id':nid or None,'response':r}
              if not nid: raise RuntimeError('No video post id returned: '+repr(r))
              q=c.queue(blog,limit=50,offset=0)
              np=next((p for p in q.get('posts',[]) if str(p.get('id'))==nid),None)
              out['verified']=bool(np)
              out['video_present']=bool(np and (np.get('type')=='video' or np.get('video_url') or np.get('player')))
              if not out['video_present']: raise RuntimeError('Queued item did not verify as video')
              for pid in old:
                  if pid != nid: c.delete_post(blog,pid)
              q2=c.queue(blog,limit=50,offset=0)
              out['queue_after']=[{'id':str(p.get('id')),'type':p.get('type'),'summary':p.get('summary',''),'tags':p.get('tags',[]),'video_url':p.get('video_url')} for p in q2.get('posts',[])]
              out['stage']='done'
          except Exception:
              out['error']=traceback.format_exc()
          finally:
              with open(path,'w',encoding='utf-8') as f: json.dump(out,f,indent=2,ensure_ascii=False); f.write('\n')
          PY
      - name: Persist verification result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/tumblr-native-video-test.json || true
          git commit -m "chore: record Tumblr native video test" || exit 0
          git pull --rebase origin main || true
          git push || true
