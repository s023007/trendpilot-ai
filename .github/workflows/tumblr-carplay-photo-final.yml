# Recheck after Tumblr transcoding delay
name: Tumblr CarPlay Native Video Verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tumblr-carplay-photo-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify_video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
      TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
      TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
      TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet PyTumblr
      - name: Inspect processed Tumblr post
        shell: bash
        run: |
          mkdir -p data/runtime
          python - <<'PY'
          import json,os,traceback
          from datetime import datetime,timezone
          import pytumblr
          target='825425815229628416'
          marker='trendpilot-carplay-video-test-v3'
          out={'checked_at':datetime.now(timezone.utc).isoformat(),'auth_ok':False,'blog':None,'target_id':target,'found':False,'legacy_type':None,'summary':None,'tags':None,'content_types':[],'video_blocks':[],'video_url':None,'player_present':False,'thumbnail_url':None,'error':None}
          try:
              c=pytumblr.TumblrRestClient(os.environ['TUMBLR_CONSUMER_KEY'],os.environ['TUMBLR_CONSUMER_SECRET'],os.environ['TUMBLR_OAUTH_TOKEN'],os.environ['TUMBLR_OAUTH_TOKEN_SECRET'])
              info=c.info(); out['auth_ok']=bool(info.get('user')); blogs=info.get('user',{}).get('blogs',[])
              b=next((x for x in blogs if str(x.get('name','')).lower()=='trendpilotchoice'),None) or next((x for x in blogs if x.get('primary')),None) or (blogs[0] if blogs else None)
              if not b: raise RuntimeError('No Tumblr blog resolved')
              blog=b.get('name') or b.get('url'); out['blog']=blog
              q=c.queue(blog,limit=50,offset=0)
              p=next((p for p in q.get('posts',[]) if str(p.get('id'))==target or marker in [str(t) for t in (p.get('tags') or [])]),None)
              if p:
                  out['found']=True; out['legacy_type']=p.get('type'); out['summary']=p.get('summary'); out['tags']=p.get('tags'); out['video_url']=p.get('video_url'); out['player_present']=bool(p.get('player')); out['thumbnail_url']=p.get('thumbnail_url')
                  content=p.get('content') or []
                  out['content_types']=[blk.get('type') for blk in content if isinstance(blk,dict)]
                  out['video_blocks']=[blk for blk in content if isinstance(blk,dict) and blk.get('type')=='video']
              else:
                  out['error']='Target post not found in queue.'
          except Exception:
              out['error']=traceback.format_exc()
          with open('data/runtime/tumblr-native-video-verify.json','w',encoding='utf-8') as f: json.dump(out,f,indent=2,ensure_ascii=False); f.write('\n')
          PY
      - name: Persist verification
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/tumblr-native-video-verify.json || true
          git commit -m "chore: recheck Tumblr native video" || exit 0
          git pull --rebase origin main || true
          git push || true
