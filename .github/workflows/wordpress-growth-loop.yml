name: WordPress TrendPilot Growth Loop

# site-id-resolution-fix: 2026-08-22T06:04+04:00
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
  push:
    branches: [main]
    paths:
      - 'feed.xml'
      - '.github/workflows/wordpress-growth-loop.yml'

permissions:
  contents: write

concurrency:
  group: wordpress-trendpilot-growth-loop
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORDPRESS_CLIENT_ID: '146357'
      WORDPRESS_CLIENT_SECRET: ${{ secrets.WORDPRESS_CLIENT_SECRET }}
      WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
      WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
      WORDPRESS_SITE: 'trendpilotchoice.wordpress.com'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Publish one new TrendPilot feed item
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, html, urllib.parse, urllib.request, urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          client_id = os.environ.get('WORDPRESS_CLIENT_ID','').strip()
          client_secret = os.environ.get('WORDPRESS_CLIENT_SECRET','').strip()
          username = os.environ.get('WORDPRESS_USERNAME','').strip()
          app_password = os.environ.get('WORDPRESS_APP_PASSWORD','').strip()
          target_site = os.environ.get('WORDPRESS_SITE','trendpilotchoice.wordpress.com').strip().lower()

          state_path = Path('data/runtime/wordpress-growth-state.json')
          result_path = Path('data/runtime/wordpress-growth-last.json')
          state_path.parent.mkdir(parents=True, exist_ok=True)
          try:
              state = json.loads(state_path.read_text())
          except Exception:
              state = {'version': 1, 'published': []}
          published = {str(x.get('guid')) for x in state.get('published', []) if x.get('guid')}

          result = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': 'starting',
              'target_site': target_site,
              'site_id': None,
              'site_url': None,
              'selected': None,
              'wordpress_post': None,
              'error': None,
          }

          def persist_result():
              result_path.write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n')

          def http_json(req, label, limit=1600):
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', 'replace')[:limit]
                  result['status'] = 'error'
                  result['error'] = f'{label}: HTTP {exc.code}: {body}'
                  persist_result()
                  raise SystemExit(result['error'])
              except Exception as exc:
                  result['status'] = 'error'
                  result['error'] = f'{label}: {exc}'
                  persist_result()
                  raise SystemExit(result['error'])

          missing = [k for k,v in {
              'WORDPRESS_CLIENT_ID': client_id,
              'WORDPRESS_CLIENT_SECRET': client_secret,
              'WORDPRESS_USERNAME': username,
              'WORDPRESS_APP_PASSWORD': app_password,
          }.items() if not v]
          if missing:
              result['status'] = 'error'
              result['error'] = 'Missing GitHub secrets/settings: ' + ', '.join(missing)
              persist_result()
              raise SystemExit(result['error'])

          # 1) Get an OAuth token. A global token can legitimately return blog_id=0,
          # so never use token_data.blog_id as the publishing site identifier.
          token_body = urllib.parse.urlencode({
              'client_id': client_id,
              'client_secret': client_secret,
              'grant_type': 'password',
              'username': username,
              'password': app_password,
          }).encode()
          token_req = urllib.request.Request(
              'https://public-api.wordpress.com/oauth2/token',
              data=token_body,
              method='POST',
              headers={'Content-Type':'application/x-www-form-urlencoded'},
          )
          token_data = http_json(token_req, 'WordPress token exchange failed', 1200)
          token = str(token_data.get('access_token') or '').strip()
          if not token:
              result['status'] = 'error'
              result['error'] = 'WordPress token response did not include access_token'
              persist_result()
              raise SystemExit(result['error'])

          # 2) Resolve the actual numeric site ID from the authenticated account.
          sites_req = urllib.request.Request(
              'https://public-api.wordpress.com/rest/v1.1/me/sites?fields=ID,name,URL,capabilities',
              method='GET',
              headers={'Authorization': f'Bearer {token}'},
          )
          sites_data = http_json(sites_req, 'WordPress site discovery failed')
          sites = sites_data.get('sites') or []

          def host_of(value):
              value = str(value or '').strip()
              if not value:
                  return ''
              if '://' not in value:
                  value = 'https://' + value
              return (urllib.parse.urlsplit(value).hostname or '').lower().rstrip('.')

          target_host = host_of(target_site)
          chosen = None
          for site in sites:
              if host_of(site.get('URL')) == target_host:
                  chosen = site
                  break

          if not chosen:
              result['status'] = 'error'
              result['error'] = f"Target WordPress site '{target_site}' was not found among {len(sites)} sites available to this token"
              persist_result()
              raise SystemExit(result['error'])

          site_id = chosen.get('ID')
          site_url = chosen.get('URL')
          capabilities = chosen.get('capabilities') or {}
          if not site_id:
              result['status'] = 'error'
              result['error'] = f"WordPress returned the target site but no numeric ID for '{target_site}'"
              persist_result()
              raise SystemExit(result['error'])
          if capabilities and not capabilities.get('publish_posts', True):
              result['status'] = 'error'
              result['error'] = f"The authenticated WordPress account does not have publish_posts permission on '{target_site}'"
              persist_result()
              raise SystemExit(result['error'])

          result['site_id'] = str(site_id)
          result['site_url'] = site_url

          # 3) Pick the newest feed item that has not already been syndicated.
          root = ET.parse('feed.xml').getroot()
          channel = root.find('channel')
          items = []
          for item in channel.findall('item'):
              title = (item.findtext('title') or '').strip()
              link = (item.findtext('link') or '').strip()
              guid = (item.findtext('guid') or link).strip()
              desc = (item.findtext('description') or '').strip()
              pub_raw = (item.findtext('pubDate') or '').strip()
              category = (item.findtext('category') or 'TrendPilot Guides').strip()
              try:
                  pub_dt = parsedate_to_datetime(pub_raw)
                  if pub_dt.tzinfo is None:
                      pub_dt = pub_dt.replace(tzinfo=timezone.utc)
              except Exception:
                  pub_dt = datetime.min.replace(tzinfo=timezone.utc)
              if title and link and guid and guid not in published:
                  items.append((pub_dt, {
                      'title': title,
                      'link': link,
                      'guid': guid,
                      'description': desc,
                      'category': category,
                  }))

          if not items:
              result['status'] = 'nothing-new'
              persist_result()
              print(json.dumps(result, ensure_ascii=False))
              raise SystemExit(0)

          items.sort(key=lambda x: x[0], reverse=True)
          item = items[0][1]
          result['selected'] = item

          text = html.unescape(re.sub(r'<[^>]+>', ' ', item['description']))
          text = re.sub(r'\bSkip to content\b', ' ', text, flags=re.I)
          text = re.sub(r'\s+', ' ', text).strip()
          if len(text) > 620:
              text = text[:620].rsplit(' ',1)[0].rstrip(' ,;:-') + '…'

          parsed = urllib.parse.urlsplit(item['link'])
          q = dict(urllib.parse.parse_qsl(parsed.query, keep_blank_values=True))
          q.update({
              'utm_source':'wordpress',
              'utm_medium':'referral',
              'utm_campaign':'trendpilot_syndication',
          })
          tracked_link = urllib.parse.urlunsplit((
              parsed.scheme, parsed.netloc, parsed.path,
              urllib.parse.urlencode(q), parsed.fragment,
          ))

          body = (
              f'<p>{html.escape(text)}</p>'
              f'<p><strong>Read the complete guide on TrendPilot Choice:</strong><br>'
              f'<a href="{html.escape(tracked_link, quote=True)}">{html.escape(item["title"])}</a></p>'
              f'<p><em>Short TrendPilot summary. Product details, prices, ticket availability and schedules may change; check the full guide for the latest information.</em></p>'
          )

          # 4) Publish through the WordPress.com REST API using the resolved numeric site ID.
          payload = json.dumps({
              'title': item['title'],
              'content': body,
              'status': 'publish',
          }).encode()
          post_req = urllib.request.Request(
              f'https://public-api.wordpress.com/wp/v2/sites/{site_id}/posts',
              data=payload,
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
              },
          )
          post = http_json(post_req, 'WordPress publish failed')

          record = {
              'guid': item['guid'],
              'source_url': item['link'],
              'tracked_url': tracked_link,
              'title': item['title'],
              'category': item['category'],
              'wordpress_post_id': post.get('id') or post.get('ID'),
              'wordpress_url': post.get('link') or post.get('URL'),
              'published_at': datetime.now(timezone.utc).isoformat(),
          }
          state.setdefault('published', []).append(record)
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n')
          result.update({'status':'published','wordpress_post':record,'error':None})
          persist_result()
          print('WORDPRESS_RESULT', json.dumps(result, ensure_ascii=False))
          PY

      - name: Persist WordPress publication state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendpilot-wordpress-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/runtime/wordpress-growth-state.json data/runtime/wordpress-growth-last.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record WordPress growth publication'
          git pull --rebase origin main
          git push origin HEAD:main
