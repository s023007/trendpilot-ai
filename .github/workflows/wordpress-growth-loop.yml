name: WordPress TrendPilot Growth Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
  push:
    branches: [main]
    paths:
      - 'feed.xml'
      - 'scripts/wordpress-growth-publisher.py'
      - '.github/workflows/wordpress-growth-loop.yml'

permissions:
  contents: write

concurrency:
  group: wordpress-trendpilot-growth-loop
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORDPRESS_CLIENT_ID: '146357'
      WORDPRESS_CLIENT_SECRET: ${{ secrets.WORDPRESS_CLIENT_SECRET }}
      WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
      WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
      WORDPRESS_SITE: 'trendpilotchoice.wordpress.com'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Publish one internal-first TrendPilot feed item
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wordpress-growth-publisher.py

      - name: Persist WordPress publication state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendpilot-wordpress-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/runtime/wordpress-growth-state.json data/runtime/wordpress-growth-last.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record WordPress growth publication'
          git pull --rebase origin main
          git push origin HEAD:main
