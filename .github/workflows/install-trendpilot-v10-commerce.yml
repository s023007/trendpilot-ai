name: Install TrendPilot V10 Commerce and Coupons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and unpack V10 package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="trendpilot-v10-commerce.zip"
          test -f "$PACKAGE" || { echo "Missing $PACKAGE in repository root"; exit 1; }
          rm -rf .v10-package
          mkdir -p .v10-package
          unzip -q "$PACKAGE" -d .v10-package
          cp -R .v10-package/. ./
          rm -rf .v10-package
          rm -f "$PACKAGE"

      - name: Install V10 across the complete site
        run: python3 automation/install_v10.py

      - name: Validate commerce data and V10 assets
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site-v10.js
          python3 -m py_compile automation/install_v10.py
          test -s css/style-v10.css
          test -s js/site-v10.js
          test -s js/coupons-data.js
          test -s js/matched-products.js
          test -s deals/index.html
          grep -q '/css/style-v10.css' index.html
          grep -q '/js/coupons-data.js' index.html
          grep -q '/js/site-v10.js' index.html
          grep -q 'href="/deals/"' index.html
          grep -q 'data-v10-deals' deals/index.html
          test "$(grep -c '/js/coupons-data.js' index.html)" -eq 1
          test "$(grep -c '/js/site-v10.js' index.html)" -eq 1

      - name: Commit V10
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No V10 changes to commit."
          else
            git commit -m "Install TrendPilot V10 commerce and coupon experience"
            git push
          fi
