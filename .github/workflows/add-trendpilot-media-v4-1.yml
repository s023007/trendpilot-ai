      - name: Validate media enhancement
        shell: bash
        run: |
          set -euo pipefail
          test -f images/media/home-decision-map.webp
          test -f images/media/carplay-compatibility.png
          test -f js/media-v4.js
          test -f image-sitemap.xml
          grep -q 'Visual decision guides' index.html
          grep -q 'Official Wondershare Filmora playlist' software/filmora-review/index.html
          grep -q 'Official Alibaba.com sourcing playlist' sourcing/find-verified-alibaba-suppliers/index.html
          grep -q 'style-v4.css?v=4.1.0' index.html

      - name: Commit TrendPilot V4.1 media enhancement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "TrendPilot V4.1 media enhancement is already installed."
            exit 0
          fi
          git commit -m "feat: add editorial images, share cards and video guides"
          git push origin HEAD:main
