name: BellaVita Buffer Pinterest Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bellavita-buffer-pinterest-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Discover Buffer Pinterest channel and boards
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const apiKey=process.env.BUFFER_API_KEY;
          if(!apiKey) throw new Error('BUFFER_API_KEY is missing');
          async function gql(query,variables={}){
            const r=await fetch('https://api.buffer.com',{
              method:'POST',
              headers:{'Content-Type':'application/json',Authorization:`Bearer ${apiKey}`},
              body:JSON.stringify({query,variables})
            });
            const raw=await r.text();
            let body; try{body=JSON.parse(raw)}catch{throw new Error(`Buffer non-JSON ${r.status}: ${raw.slice(0,300)}`)}
            if(!r.ok||body.errors?.length) throw new Error(`Buffer ${r.status}: ${JSON.stringify(body)}`);
            return body.data;
          }
          const account=await gql('query { account { organizations { id name } } }');
          const orgs=account?.account?.organizations||[];
          const result={generated_at:new Date().toISOString(),organizations:[],pinterest_channels:[]};
          for(const org of orgs){
            const channels=await gql(`query Channels($org: OrganizationId!) { channels(input:{organizationId:$org}) { id name displayName service isQueuePaused } }`,{org:org.id});
            result.organizations.push({id:org.id,name:org.name,channels:(channels?.channels||[]).map(c=>({id:c.id,name:c.displayName||c.name,service:c.service,isQueuePaused:c.isQueuePaused}))});
            for(const c of channels?.channels||[]){
              if(String(c.service).toLowerCase()!=='pinterest') continue;
              const detail=await gql(`query Pinterest($id: ChannelId!) { channel(input:{id:$id}) { id name displayName service isQueuePaused metadata { ... on PinterestMetadata { boards { id name serviceId url } } } } }`,{id:c.id});
              const ch=detail?.channel;
              result.pinterest_channels.push({id:ch?.id,name:ch?.displayName||ch?.name,isQueuePaused:ch?.isQueuePaused,boards:(ch?.metadata?.boards||[]).map(b=>({id:b.id,name:b.name,serviceId:b.serviceId,url:b.url}))});
            }
          }
          fs.mkdirSync('data/runtime',{recursive:true});
          fs.writeFileSync('data/runtime/bellavita-buffer-pinterest-diagnostic.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE

      - name: Persist diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendpilot-buffer-diagnostic-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/bellavita-buffer-pinterest-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record Buffer Pinterest board diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
