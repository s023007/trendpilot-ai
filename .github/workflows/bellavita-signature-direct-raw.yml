name: BellaVita Signature Direct Raw

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bellavita-signature-direct-raw.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Cancel older in-progress signature workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids=$(gh run list --repo "${{ github.repository }}" --workflow bellavita-correct-signature-pin-v2.yml --status in_progress --json databaseId --jq '.[].databaseId' || true)
          for id in $ids; do
            gh run cancel "$id" --repo "${{ github.repository }}" || true
          done

      - name: Verify frozen creative is publicly reachable
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URL='https://raw.githubusercontent.com/s023007/trendpilot-ai/main/offers/bellavita-her-n-more/assets/signature-scent-canva.png'
          curl -fL --retry 5 --retry-delay 2 "$IMAGE_URL" -o /tmp/signature-scent-canva.png
          test -s /tmp/signature-scent-canva.png
          file --mime-type -b /tmp/signature-scent-canva.png | grep -q '^image/'

      - name: Publish corrected signature Pin
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const apiKey=process.env.BUFFER_API_KEY;
          if(!apiKey) throw new Error('BUFFER_API_KEY is missing');
          const statePath='data/runtime/bellavita-signature-direct-raw.json';
          fs.mkdirSync('data/runtime',{recursive:true});
          let state={version:1,published:false,attempts:[]};
          try{state=JSON.parse(fs.readFileSync(statePath,'utf8'))}catch{}
          if(state.published&&state.buffer_post_id&&state.buffer_status==='sent'){
            console.log('Already sent',state.buffer_post_id); process.exit(0);
          }
          const targetBoard='Perfume & Beauty Finds';
          const title='Find the scent that feels like you';
          const text='Eight mini perfumes in one discovery set. Explore different scents for different moods and discover which one feels most like you.';
          const targetUrl='https://trendpilotchoice.com/offers/bellavita-her-n-more/?utm_source=pinterest&utm_medium=organic_social&utm_campaign=TP-PIN-US-PERFUME-01&utm_content=signature_scent_designed_v2';
          const imageUrl='https://raw.githubusercontent.com/s023007/trendpilot-ai/main/offers/bellavita-her-n-more/assets/signature-scent-canva.png';
          async function gql(query,variables={}){
            const r=await fetch('https://api.buffer.com',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${apiKey}`},body:JSON.stringify({query,variables})});
            const raw=await r.text(); let body; try{body=JSON.parse(raw)}catch{throw new Error(`Buffer non-JSON ${r.status}: ${raw.slice(0,300)}`)}
            if(!r.ok||body.errors?.length) throw new Error(`Buffer ${r.status}: ${JSON.stringify(body)}`);
            return body.data;
          }
          (async()=>{
            const account=await gql('query { account { organizations { id name } } }');
            let channel=null;
            for(const org of account?.account?.organizations||[]){
              const d=await gql(`query Channels($org: OrganizationId!) { channels(input:{organizationId:$org}) { id name displayName service isQueuePaused } }`,{org:org.id});
              channel=(d?.channels||[]).find(c=>String(c.service).toLowerCase()==='pinterest'); if(channel) break;
            }
            if(!channel) throw new Error('Pinterest is not connected in Buffer');
            if(channel.isQueuePaused) throw new Error('Pinterest queue is paused in Buffer');
            const detail=await gql(`query Pinterest($id: ChannelId!) { channel(input:{id:$id}) { id metadata { ... on PinterestMetadata { boards { id name serviceId url } } } } }`,{id:channel.id});
            const boards=detail?.channel?.metadata?.boards||[];
            const board=boards.find(b=>String(b.name).trim().toLowerCase()===targetBoard.toLowerCase());
            if(!board) throw new Error(`Board not found: ${targetBoard}`);
            const data=await gql(`mutation CreatePost($input: CreatePostInput!) { createPost(input:$input) { __typename ... on PostActionSuccess { post { id text dueAt status channelId channelService } } ... on MutationError { message } ... on InvalidInputError { message } ... on UnauthorizedError { message } ... on UnexpectedError { message } ... on RestProxyError { message } ... on LimitReachedError { message } } }`,{input:{text,channelId:channel.id,schedulingType:'automatic',mode:'shareNow',saveToDraft:false,needsApproval:false,aiAssisted:false,source:'trendpilot-bellavita-signature-direct-raw',assets:[{image:{url:imageUrl,metadata:{altText:'BellaVita Her N More — Find the scent that feels like you. Eight mini perfumes, 20ml each.'}}}],metadata:{pinterest:{boardServiceId:board.serviceId,title,url:targetUrl}}}});
            const p=data?.createPost;
            if(!p||p.__typename!=='PostActionSuccess'||!p.post?.id) throw new Error(p?.message||p?.__typename||'Buffer returned no post ID');
            state={version:1,published:p.post.status==='sent',published_at:new Date().toISOString(),buffer_post_id:p.post.id,buffer_status:p.post.status,dueAt:p.post.dueAt||null,board:{name:board.name,serviceId:board.serviceId,url:board.url||null},title,text,target_url:targetUrl,image_url:imageUrl,creative:'signature_scent_designed_v2',campaign:'TP-PIN-US-PERFUME-01',attempts:state.attempts||[]};
            fs.writeFileSync(statePath,JSON.stringify(state,null,2)+'\n');
            console.log('BELLA_VITA_SIGNATURE_DIRECT_RAW_RESULT',JSON.stringify(state));
            if(p.post.status==='error') throw new Error('Pinterest returned error status');
          })().catch(err=>{
            state.attempts=[...(state.attempts||[]),{at:new Date().toISOString(),status:'error',error:err?.message||String(err)}];
            fs.writeFileSync(statePath,JSON.stringify(state,null,2)+'\n');
            console.error(err?.message||String(err)); process.exitCode=1;
          });
          NODE

      - name: Persist corrected publication state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendpilot-bellavita-buffer-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add data/runtime/bellavita-signature-direct-raw.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record BellaVita signature direct-raw publication'
          git push origin HEAD:main
