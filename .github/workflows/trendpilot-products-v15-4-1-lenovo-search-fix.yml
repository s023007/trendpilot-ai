name: TrendPilot Products V15.4.1 Lenovo Search Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-4-1-lenovo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-lenovo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Apply Lenovo fix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/tp_lenovo_fix.py
          python /tmp/tp_lenovo_fix.py

      - name: Validate Lenovo fix
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site-v13-5.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          js=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")

          required=[
              "thinkpad|ideapad|thinkbook|yoga|legion|lenovo loq|loq",
              "const selectedSeller=tpCanonicalSellerV15_1(f.merchant)",
              "const productSeller=tpCanonicalSellerV15_1(p.advertiser)",
              "currentSellerRows=(state.products||[]).filter",
              "/js/site-v13-5.js?v=15.4.1",
              "TP_ADMITAD_LIVE_BRIDGE_V15_4_START",
          ]
          blob=js+"\n"+html
          missing=[x for x in required if x not in blob]
          if missing:
              raise SystemExit("Missing validation markers: "+", ".join(missing))

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"js/site-v13-5.js","find/index.html"}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))

          if js.count("TP_CJ_SEARCH_BRIDGE_START") != 1:
              raise SystemExit("CJ bridge integrity failed.")
          if "/js/product-discovery-v15.js?v=15.2.0" not in html:
              raise SystemExit("Suggestion engine changed unexpectedly.")

          print("Validation passed.")
          PY

      - name: Publish V15.4.1
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/site-v13-5.js find/index.html
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.4.1 already installed."
            exit 0
          fi

          git commit -m "fix: surface Lenovo laptops and canonical seller filtering"
          git push origin HEAD:main
