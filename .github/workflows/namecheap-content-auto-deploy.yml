name: Namecheap Content Auto Deploy

on:
  push:
    branches: [main]
    paths:
      - 'events/**'
      - 'tickets/**'
      - '.github/workflows/namecheap-content-auto-deploy.yml'
  workflow_dispatch:

concurrency:
  group: namecheap-content-auto-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy-content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: '21098'
      CPANEL_USER: kehwgbpo
      STATIC_ROOT: /home/kehwgbpo/trendpilotchoice.com
      PUBLIC_ORIGIN: https://trendpilotchoice.com
      INDEXNOW_KEY: d3f1a9c7e5b24f6081c4a9d2e7b5f310
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Require deployment key and discover event guides
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo 'NAMECHEAP_SSH_PRIVATE_KEY is missing.'; exit 1; }
          test -d events
          test -f tickets/index.html
          find events -mindepth 2 -maxdepth 2 -type f -name index.html -print | sort > /tmp/event-files.txt
          test -s /tmp/event-files.txt || { echo 'No event landing pages found.'; exit 1; }
          awk -F/ '{print $(NF-1)}' /tmp/event-files.txt > /tmp/event-slugs.txt
          echo 'Event guides to deploy:'
          cat /tmp/event-slugs.txt

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 2
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish all event and ticket content
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap "test -d '$STATIC_ROOT' && mkdir -p '$STATIC_ROOT/events' '$STATIC_ROOT/tickets'"
          tar -czf - events tickets | ssh trendpilot-namecheap "tar -xzf - -C '$STATIC_ROOT'"
          while IFS= read -r slug; do
            test -n "$slug" || continue
            ssh trendpilot-namecheap "test -f '$STATIC_ROOT/events/$slug/index.html'"
          done < /tmp/event-slugs.txt
          ssh trendpilot-namecheap "test -f '$STATIC_ROOT/tickets/index.html'"

      - name: Verify every public event and internal ticket-hub link
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time, urllib.request, urllib.error

          origin=os.environ['PUBLIC_ORIGIN'].rstrip('/')
          run=os.environ.get('GITHUB_RUN_ID','')
          slugs=[x.strip() for x in pathlib.Path('/tmp/event-slugs.txt').read_text().splitlines() if x.strip()]

          def get(url, tries=6):
              last={'http':None,'body':'','error':''}
              for attempt in range(1,tries+1):
                  bust=('&' if '?' in url else '?')+f'deploy={run}-{attempt}'
                  req=urllib.request.Request(url+bust,headers={'User-Agent':'TrendPilotDeploymentVerifier/2.0','Cache-Control':'no-cache'})
                  try:
                      with urllib.request.urlopen(req,timeout=35) as r:
                          body=r.read().decode('utf-8','replace')
                          last={'http':r.status,'body':body,'error':''}
                          if r.status==200: return last
                  except urllib.error.HTTPError as e:
                      last={'http':e.code,'body':e.read().decode('utf-8','replace'),'error':str(e)}
                  except Exception as e:
                      last={'http':None,'body':'','error':type(e).__name__+': '+str(e)}
                  time.sleep(8)
              return last

          tickets=get(origin+'/tickets/')
          ticket_ok=tickets['http']==200 and '<html' in tickets['body'].lower()
          events={}
          all_ok=ticket_ok
          for slug in slugs:
              url=f'{origin}/events/{slug}/'
              response=get(url)
              body=response['body']
              public_ok=response['http']==200 and '<html' in body.lower() and '<title' in body.lower()
              link=f'/events/{slug}/'
              internal_ok=ticket_ok and link in tickets['body']
              events[slug]={
                  'url':url,
                  'http':response['http'],
                  'public_verified':public_ok,
                  'tickets_internal_link_verified':internal_ok,
                  'error':response['error']
              }
              all_ok=all_ok and public_ok and internal_ok

          result={
              'run_id':run,
              'tickets':{'url':origin+'/tickets/','http':tickets['http'],'public_verified':ticket_ok},
              'events':events,
              'all_public_verified':all_ok
          }
          pathlib.Path('/tmp/public-check.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if not all_ok:
              raise SystemExit('One or more public event pages or ticket-hub internal links failed verification.')
          PY

      - name: Submit all event guides to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          origin=os.environ['PUBLIC_ORIGIN'].rstrip('/')
          key=os.environ['INDEXNOW_KEY']
          slugs=[x.strip() for x in pathlib.Path('/tmp/event-slugs.txt').read_text().splitlines() if x.strip()]
          urls=[f'{origin}/events/{slug}/' for slug in slugs]
          urls.append(origin+'/tickets/')
          payload={'host':'trendpilotchoice.com','key':key,'keyLocation':f'{origin}/{key}.txt','urlList':urls}
          pathlib.Path('/tmp/indexnow.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY
          index_code="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' -d @/tmp/indexnow.json https://api.indexnow.org/indexnow || true)"
          echo "INDEXNOW_HTTP=$index_code"
          if [ "$index_code" != '200' ] && [ "$index_code" != '202' ]; then
            echo 'IndexNow did not return an accepted status.'
            cat /tmp/indexnow-response.txt || true
            exit 1
          fi
          printf '%s' "$index_code" > /tmp/indexnow-code.txt

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/runtime
          python3 - <<'PY'
          import json, os, pathlib, datetime
          def load(path, fallback):
              try: return json.loads(pathlib.Path(path).read_text())
              except Exception: return fallback
          public=load('/tmp/public-check.json',{'tickets':{},'events':{},'all_public_verified':False})
          try: index=pathlib.Path('/tmp/indexnow-code.txt').read_text().strip()
          except Exception: index=''
          result={
              'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'run_id':os.environ.get('GITHUB_RUN_ID',''),
              'source_sha':os.environ.get('GITHUB_SHA',''),
              'tickets':public.get('tickets',{}),
              'events':public.get('events',{}),
              'all_public_verified':bool(public.get('all_public_verified')),
              'indexnow_http':int(index) if index.isdigit() else None,
              'indexnow_accepted':index in ('200','202')
          }
          pathlib.Path('data/runtime/namecheap-content-deploy.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          git config user.name 'trendpilot-content-deploy-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/namecheap-content-deploy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record Namecheap content deployment'
          git pull --rebase origin main
          git push origin HEAD:main
