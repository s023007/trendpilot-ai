name: Namecheap Content Auto Deploy

on:
  push:
    branches: [main]
    paths:
      - 'events/**'
      - 'tickets/**'
      - '.github/workflows/namecheap-content-auto-deploy.yml'
  workflow_run:
    workflows: ['TrendPilot Event Factory V1']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: namecheap-content-auto-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy-content:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: '21098'
      CPANEL_USER: kehwgbpo
      STATIC_ROOT: /home/kehwgbpo/trendpilotchoice.com
      PUBLIC_ORIGIN: https://trendpilotchoice.com
      INDEXNOW_KEY: d3f1a9c7e5b24f6081c4a9d2e7b5f310
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Require deployment key and read verified event registry
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo 'NAMECHEAP_SSH_PRIVATE_KEY is missing.'; exit 1; }
          test -d events
          test -f tickets/index.html
          test -f data/event-factory/events.json
          python3 - <<'PY'
          import json, pathlib
          reg=json.load(open('data/event-factory/events.json'))
          slugs=[x['slug'] for x in reg.get('events',[]) if x.get('status')=='ready' and x.get('slug')]
          if not slugs: raise SystemExit('No ready Event Factory guides found')
          pathlib.Path('/tmp/event-slugs.txt').write_text('\n'.join(slugs)+'\n')
          print('Ready event guides:', *slugs, sep='\n- ')
          PY

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 2
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish complete event growth network and ticket hub
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap "test -d '$STATIC_ROOT' && mkdir -p '$STATIC_ROOT/events' '$STATIC_ROOT/tickets'"
          tar -czf - events tickets | ssh trendpilot-namecheap "tar -xzf - -C '$STATIC_ROOT'"
          while IFS= read -r slug; do
            test -n "$slug" || continue
            ssh trendpilot-namecheap "test -f '$STATIC_ROOT/events/$slug/index.html'"
          done < /tmp/event-slugs.txt
          ssh trendpilot-namecheap "test -f '$STATIC_ROOT/tickets/index.html'"
          if [ -f events/discover/index.html ]; then ssh trendpilot-namecheap "test -f '$STATIC_ROOT/events/discover/index.html'"; fi

      - name: Verify commercial event roots and discovery hub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.request, urllib.error
          origin=os.environ['PUBLIC_ORIGIN'].rstrip('/')
          run=os.environ.get('GITHUB_RUN_ID','')
          slugs=[x.strip() for x in pathlib.Path('/tmp/event-slugs.txt').read_text().splitlines() if x.strip()]

          def get(url, tries=5):
              last={'http':None,'body':'','error':''}
              for attempt in range(1,tries+1):
                  bust=('&' if '?' in url else '?')+f'deploy={run}-{attempt}'
                  req=urllib.request.Request(url+bust,headers={'User-Agent':'TrendPilotDeploymentVerifier/3.0','Cache-Control':'no-cache'})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:
                          body=r.read().decode('utf-8','replace')
                          last={'http':r.status,'body':body,'error':''}
                          if r.status==200: return last
                  except urllib.error.HTTPError as e:
                      last={'http':e.code,'body':e.read().decode('utf-8','replace'),'error':str(e)}
                  except Exception as e:
                      last={'http':None,'body':'','error':type(e).__name__+': '+str(e)}
                  time.sleep(5)
              return last

          tickets=get(origin+'/tickets/')
          ticket_ok=tickets['http']==200 and '<html' in tickets['body'].lower()
          events={}; all_ok=ticket_ok
          for slug in slugs:
              url=f'{origin}/events/{slug}/'
              response=get(url); body=response['body']
              public_ok=response['http']==200 and '<html' in body.lower() and '<title' in body.lower()
              link=f'/events/{slug}/'
              internal_ok=ticket_ok and link in tickets['body']
              events[slug]={'url':url,'http':response['http'],'public_verified':public_ok,'tickets_internal_link_verified':internal_ok,'error':response['error']}
              all_ok=all_ok and public_ok and internal_ok

          discover_url=origin+'/events/discover/'
          discover=get(discover_url)
          discover_ok=discover['http']==200 and '<html' in discover['body'].lower()
          result={
              'run_id':run,
              'tickets':{'url':origin+'/tickets/','http':tickets['http'],'public_verified':ticket_ok},
              'events':events,
              'discover':{'url':discover_url,'http':discover['http'],'public_verified':discover_ok,'error':discover['error']},
              'all_public_verified':all_ok and discover_ok
          }
          pathlib.Path('/tmp/public-check.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if not result['all_public_verified']:
              raise SystemExit('Commercial event root, discovery hub, or ticket-hub verification failed.')
          PY

      - name: Submit complete event URL network to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          origin=os.environ['PUBLIC_ORIGIN'].rstrip('/')
          key=os.environ['INDEXNOW_KEY']
          source=pathlib.Path('data/event-factory/public-urls.json')
          if source.exists():
              urls=json.loads(source.read_text()).get('urls',[])
          else:
              slugs=[x.strip() for x in pathlib.Path('/tmp/event-slugs.txt').read_text().splitlines() if x.strip()]
              urls=[f'{origin}/events/{slug}/' for slug in slugs]+[origin+'/tickets/']
          payload={'host':'trendpilotchoice.com','key':key,'keyLocation':f'{origin}/{key}.txt','urlList':urls}
          pathlib.Path('/tmp/indexnow.json').write_text(json.dumps(payload,indent=2)+'\n')
          print('Submitting',len(urls),'event-network URLs to IndexNow')
          PY
          index_code="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' -d @/tmp/indexnow.json https://api.indexnow.org/indexnow || true)"
          echo "INDEXNOW_HTTP=$index_code"
          if [ "$index_code" != '200' ] && [ "$index_code" != '202' ]; then
            cat /tmp/indexnow-response.txt || true
            exit 1
          fi
          printf '%s' "$index_code" > /tmp/indexnow-code.txt

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/runtime
          python3 - <<'PY'
          import json, os, pathlib, datetime
          def load(path, fallback):
              try: return json.loads(pathlib.Path(path).read_text())
              except Exception: return fallback
          public=load('/tmp/public-check.json',{'tickets':{},'events':{},'discover':{},'all_public_verified':False})
          try: index=pathlib.Path('/tmp/indexnow-code.txt').read_text().strip()
          except Exception: index=''
          urls=[]
          try: urls=json.load(open('data/event-factory/public-urls.json')).get('urls',[])
          except Exception: pass
          result={
              'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'run_id':os.environ.get('GITHUB_RUN_ID',''),
              'source_sha':os.environ.get('GITHUB_SHA',''),
              'tickets':public.get('tickets',{}),
              'events':public.get('events',{}),
              'discover':public.get('discover',{}),
              'network_url_count':len(urls),
              'all_public_verified':bool(public.get('all_public_verified')),
              'indexnow_http':int(index) if index.isdigit() else None,
              'indexnow_accepted':index in ('200','202')
          }
          pathlib.Path('data/runtime/namecheap-content-deploy.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          git config user.name 'trendpilot-content-deploy-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/namecheap-content-deploy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record Namecheap content deployment'
          git pull --rebase origin main
          git push origin HEAD:main
