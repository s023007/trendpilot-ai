name: TrendPilot Admitad Product Feeds V15.3.2 Deeplink Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-admitad-products-v15-3-2
  cancel-in-progress: true

jobs:
  build-fixed-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    env:
      ADMITAD_CLIENT_ID_PRIMARY: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_ID_ALT: ${{ secrets.client_id }}
      ADMITAD_CLIENT_SECRET_PRIMARY: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      ADMITAD_CLIENT_SECRET_ALT: ${{ secrets.client_secret }}
      WEBSITE_ID: "2980568"
      TARGET_DOMAIN: trendpilotchoice.com
      MAX_PRODUCTS_PER_SELLER: "40"
      DEEPLINK_BATCH_SIZE: "3"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Build fixed Admitad product staging
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64, csv, gzip, io, json, os, re, socket
          import urllib.parse, urllib.request, urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          API="https://api.admitad.com"
          WEBSITE_ID=int(os.environ["WEBSITE_ID"])
          MAX_PER=int(os.environ["MAX_PRODUCTS_PER_SELLER"])
          BATCH=int(os.environ["DEEPLINK_BATCH_SIZE"])
          socket.setdefaulttimeout(35)

          def first_env(*names):
              for name in names:
                  value=(os.environ.get(name) or "").strip()
                  if value:
                      return value
              return ""

          client_id=first_env("ADMITAD_CLIENT_ID_PRIMARY","ADMITAD_CLIENT_ID_ALT")
          client_secret=first_env("ADMITAD_CLIENT_SECRET_PRIMARY","ADMITAD_CLIENT_SECRET_ALT")
          if not client_id or not client_secret:
              raise SystemExit("Missing Admitad API credentials.")

          def request(url, method="GET", headers=None, data=None, timeout=35):
              req=urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept":"*/*",
                      "User-Agent":"TrendPilot-Admitad-Products/15.3.2",
                      **(headers or {})
                  }
              )
              return urllib.request.urlopen(req, timeout=timeout)

          def request_json(url, method="GET", headers=None, data=None):
              with request(url,method,headers,data) as resp:
                  return json.loads(resp.read().decode("utf-8","replace"))

          basic=base64.b64encode(f"{client_id}:{client_secret}".encode()).decode()
          token_body=urllib.parse.urlencode({
              "grant_type":"client_credentials",
              "client_id":client_id,
              "scope":"websites advcampaigns_for_website deeplink_generator"
          }).encode()

          token=request_json(
              f"{API}/token/",
              method="POST",
              headers={
                  "Authorization":f"Basic {basic}",
                  "Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"
              },
              data=token_body
          ).get("access_token")

          if not token:
              raise SystemExit("No Admitad access token returned.")

          auth={"Authorization":f"Bearer {token}"}

          q=urllib.parse.urlencode({
              "limit":200,
              "offset":0,
              "connection_status":"active"
          })
          campaigns=request_json(
              f"{API}/advcampaigns/website/{WEBSITE_ID}/?{q}",
              headers=auth
          ).get("results",[])

          bridge=json.loads(
              Path("data/approved-product-sellers-v15-bridge.json").read_text(encoding="utf-8")
          )
          allowed_ids={
              int(row["campaign_id"])
              for row in bridge.get("sellers") or []
              if isinstance(row,dict)
              and row.get("network")=="Admitad"
              and row.get("approved") is True
              and row.get("campaign_id")
          }

          campaigns=[
              c for c in campaigns
              if isinstance(c,dict)
              and int(c.get("id") or 0) in allowed_ids
              and str(c.get("connection_status") or c.get("status") or "").lower()=="active"
          ]

          def nk(value):
              return re.sub(r"[^a-z0-9]+","",str(value or "").lower())

          TITLE=["name","title","productname","product","offername"]
          URL=["url","producturl","deeplink","link","landingpage","productlink"]
          IMG=["picture","image","imageurl","pictureurl","img","photo","thumbnail"]
          PRICE=["price","currentprice","saleprice","finalprice","amount"]
          CUR=["currency","currencyid","currencycode"]
          IDS=["id","offerid","productid","sku","article","vendorcode"]
          CAT=["category","categoryname","type","section"]
          BRAND=["vendor","brand","manufacturer"]

          def pick(row,keys):
              norm={nk(k):v for k,v in row.items()}
              for key in keys:
                  v=norm.get(nk(key))
                  if v not in (None,""):
                      return str(v).strip()
              return ""

          def number(value):
              m=re.search(r"\d+(?:[.,]\d+)?",str(value or "").replace(" ",""))
              if not m:
                  return None
              try:
                  return float(m.group(0).replace(",","."))
              except Exception:
                  return None

          def normalize(row,campaign):
              title=pick(row,TITLE)
              dest=pick(row,URL)
              if not title or not dest.startswith(("http://","https://")):
                  return None
              image=pick(row,IMG)
              return {
                  "source_id":pick(row,IDS),
                  "title":title[:300],
                  "seller":str(campaign.get("name") or "").strip(),
                  "campaign_id":int(campaign.get("id") or 0),
                  "destination_url":dest,
                  "image":image if image.startswith(("http://","https://")) else "",
                  "price":number(pick(row,PRICE)),
                  "currency":pick(row,CUR)[:12],
                  "category":pick(row,CAT)[:160],
                  "brand":pick(row,BRAND)[:100],
                  "network":"Admitad"
              }

          def csv_urls(c):
              urls=[]
              if c.get("products_csv_link"):
                  urls.append(c["products_csv_link"])
              for feed in c.get("feeds_info") or []:
                  if isinstance(feed,dict) and feed.get("csv_link"):
                      urls.append(feed["csv_link"])
              out=[]
              for u in urls:
                  if u and u not in out:
                      out.append(u)
              return out

          def xml_urls(c):
              urls=[]
              if c.get("products_xml_link"):
                  urls.append(c["products_xml_link"])
              for feed in c.get("feeds_info") or []:
                  if isinstance(feed,dict) and feed.get("xml_link"):
                      urls.append(feed["xml_link"])
              out=[]
              for u in urls:
                  if u and u not in out:
                      out.append(u)
              return out

          def stream_csv(url, limit_rows=1500):
              with request(url,timeout=40) as resp:
                  raw=resp
                  enc=(resp.headers.get("Content-Encoding") or "").lower()
                  ctype=(resp.headers.get("Content-Type") or "").lower()
                  if "gzip" in enc or "gzip" in ctype or url.lower().endswith(".gz"):
                      raw=gzip.GzipFile(fileobj=resp)
                  text=io.TextIOWrapper(raw,encoding="utf-8-sig",errors="replace",newline="")
                  head=[]
                  for _ in range(30):
                      line=text.readline()
                      if not line: break
                      head.append(line)
                  sample="".join(head)
                  if not sample:
                      return
                  try:
                      dialect=csv.Sniffer().sniff(sample,delimiters=",;\t|")
                  except Exception:
                      dialect=csv.excel
                  remainder=text.read(1024*1024)
                  reader=csv.DictReader(io.StringIO(sample+remainder),dialect=dialect)
                  count=0
                  for row in reader:
                      if isinstance(row,dict):
                          yield {str(k or ""):v for k,v in row.items()}
                          count+=1
                          if count>=limit_rows:
                              break

          def stream_xml(url, limit_nodes=1800):
              with request(url,timeout=40) as resp:
                  count=0
                  for event,elem in ET.iterparse(resp,events=("end",)):
                      tag=str(elem.tag).split("}",1)[-1].lower()
                      if tag not in ("offer","product","item","entry"):
                          continue
                      row={}
                      for child in list(elem):
                          ctag=str(child.tag).split("}",1)[-1]
                          val=(child.text or "").strip()
                          if val:
                              row[ctag]=val
                          for ak,av in child.attrib.items():
                              if av:
                                  row[f"{ctag}_{ak}"]=av
                      for ak,av in elem.attrib.items():
                          row[ak]=av
                      if row:
                          yield row
                          count+=1
                      elem.clear()
                      if count>=limit_nodes:
                          break

          def collect_products(c):
              seen=set()
              products=[]
              errors=[]

              candidates=[("csv",u) for u in csv_urls(c)] + [("xml",u) for u in xml_urls(c)]
              for kind,url in candidates:
                  try:
                      parser=stream_csv if kind=="csv" else stream_xml
                      for row in parser(url):
                          p=normalize(row,c)
                          if not p:
                              continue
                          key=p["source_id"] or p["destination_url"]
                          if key in seen:
                              continue
                          seen.add(key)
                          products.append(p)
                          if len(products)>=MAX_PER:
                              return products,kind,errors
                      if products:
                          return products,kind,errors
                  except Exception as exc:
                      errors.append(f"{kind}: {str(exc)[:180]}")
              return products,None,errors

          def generate_deeplinks(campaign_id,products):
              # The previous version sent ~80 long ULP URLs in one query string,
              # which produced HTTP 414. Keep GET requests intentionally tiny.
              output=[]
              for start in range(0,len(products),BATCH):
                  batch=products[start:start+BATCH]
                  params=[]
                  for product in batch:
                      params.append(("ulp",product["destination_url"]))
                  params.append(("subid","products"))
                  qs=urllib.parse.urlencode(params)
                  endpoint=f"{API}/deeplink/{WEBSITE_ID}/advcampaign/{campaign_id}/?{qs}"

                  # Extra guardrail against URI-too-long before sending.
                  if len(endpoint)>7000 and len(batch)>1:
                      # Fall back to one URL at a time.
                      for product in batch:
                          one_qs=urllib.parse.urlencode([
                              ("ulp",product["destination_url"]),
                              ("subid","products")
                          ])
                          try:
                              payload=request_json(
                                  f"{API}/deeplink/{WEBSITE_ID}/advcampaign/{campaign_id}/?{one_qs}",
                                  headers=auth
                              )
                              link=""
                              if isinstance(payload,list) and payload and isinstance(payload[0],dict):
                                  link=payload[0].get("link") or ""
                              output.append(link)
                          except Exception:
                              output.append("")
                      continue

                  try:
                      payload=request_json(endpoint,headers=auth)
                      links=[
                          item.get("link","") if isinstance(item,dict) else ""
                          for item in (payload if isinstance(payload,list) else [])
                      ]
                      links += [""]*(len(batch)-len(links))
                      output += links[:len(batch)]
                  except urllib.error.HTTPError as exc:
                      if exc.code==414 and len(batch)>1:
                          # Retry individually if advertiser URLs are unusually long.
                          for product in batch:
                              one_qs=urllib.parse.urlencode([
                                  ("ulp",product["destination_url"]),
                                  ("subid","products")
                              ])
                              try:
                                  payload=request_json(
                                      f"{API}/deeplink/{WEBSITE_ID}/advcampaign/{campaign_id}/?{one_qs}",
                                      headers=auth
                                  )
                                  link=""
                                  if isinstance(payload,list) and payload and isinstance(payload[0],dict):
                                      link=payload[0].get("link") or ""
                                  output.append(link)
                              except Exception:
                                  output.append("")
                      else:
                          output += [""]*len(batch)
                  except Exception:
                      output += [""]*len(batch)

              return output

          staged=[]
          reports=[]

          for c in campaigns:
              seller=str(c.get("name") or "").strip()
              products,fmt,errors=collect_products(c)
              report={
                  "seller":seller,
                  "campaign_id":int(c.get("id") or 0),
                  "sampled":len(products),
                  "tracked":0,
                  "format":fmt,
                  "status":"no-valid-products" if not products else "sampled",
                  "errors":errors
              }

              if products:
                  links=generate_deeplinks(report["campaign_id"],products)
                  for product,link in zip(products,links):
                      if not link:
                          continue
                      safe=dict(product)
                      safe["affiliate_url"]=link
                      safe.pop("destination_url",None)
                      staged.append(safe)
                  report["tracked"]=sum(1 for link in links if link)
                  report["status"]="ok" if report["tracked"] else "no-deeplinks"

              reports.append(report)
              print(
                  f"{seller}: sampled={report['sampled']} "
                  f"tracked={report['tracked']} format={report['format']} "
                  f"status={report['status']}"
              )
              for err in errors:
                  print(f"  warning: {err}")

          if not staged:
              raise SystemExit("No tracked products staged after deeplink micro-batch retry.")

          result={
              "version":"15.3.2-deeplink-fix",
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "website_id":WEBSITE_ID,
              "domain":os.environ["TARGET_DOMAIN"],
              "max_products_per_seller":MAX_PER,
              "deeplink_batch_size":BATCH,
              "product_count":len(staged),
              "reports":reports,
              "products":staged
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/admitad-products-new-account-v15-3-2.json").write_text(
              json.dumps(result,ensure_ascii=False,separators=(",",":"))+"\n",
              encoding="utf-8"
          )

          print(f"TOTAL TRACKED PRODUCTS: {len(staged)}")
          PY

      - name: Validate fixed staging
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path("data/admitad-products-new-account-v15-3-2.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert data["website_id"]==2980568
          assert data["domain"]=="trendpilotchoice.com"
          assert data["version"]=="15.3.2-deeplink-fix"
          assert data["products"]

          for item in data["products"]:
              assert item["network"]=="Admitad"
              assert str(item.get("affiliate_url") or "").startswith("http")
              assert "destination_url" not in item

          print(f"Validated {len(data['products'])} tracked products.")
          for r in data.get("reports",[]):
              print(f"- {r['seller']}: {r['tracked']} tracked / {r['status']}")
          PY
          git diff --check

      - name: Confirm live Products UI untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- find/index.html
          git diff --quiet -- js/product-discovery-v15.js
          git diff --quiet -- js/site-v13-5.js

      - name: Publish staging catalog only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/admitad-products-new-account-v15-3-2.json
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "fix: stage Admitad products with safe deeplink batching"
          git push origin HEAD:main

          {
            echo "## Admitad V15.3.2 Deeplink Fix"
            echo ""
            echo "- Fixed HTTP 414 by limiting deeplink requests to 3 product URLs."
            echo "- Automatically retries one URL at a time if a batch is still too long."
            echo "- Uses CSV first and XML fallback for sellers whose CSV sample is not usable."
            echo "- Maximum 40 staged products per seller for this validation pass."
            echo "- Live Products UI remains untouched."
          } >> "$GITHUB_STEP_SUMMARY"
