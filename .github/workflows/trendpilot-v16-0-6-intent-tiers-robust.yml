name: TrendPilot V16.0.6 Intent Tiers Robust

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v16-0-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intent-tiers-robust:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Apply V16.0.6 robust intent tiers
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          search = Path("netlify/functions/products-v16.mjs")
          docs = Path("V16-UNIVERSAL-PRODUCT-INDEX.md")

          if not search.exists():
              raise SystemExit("Missing netlify/functions/products-v16.mjs")

          s = search.read_text(encoding="utf-8")

          # V16.0.5 failed before Publish, so main should still be V16.0.4.
          if 'const VERSION = "16.0.4";' in s:
              s = s.replace('const VERSION = "16.0.4";', 'const VERSION = "16.0.6";', 1)
          elif 'const VERSION = "16.0.6";' not in s:
              raise SystemExit("Expected live V16.0.4 search endpoint was not found.")

          new_accessories = r'''const accessoryWords = new Set([
            "case","cases","cover","covers","protector","protectors",
            "charger","chargers","charging","cable","cables",
            "holder","holders","stand","stands","mount","mounts",
            "repair","replacement","part","parts","tool","tools","kit","kits",
            "accessory","accessories","adapter","adapters","dock","docks",
            "screen","screens","stylus","pen","pens","strap","straps",
            "band","bands","sleeve","sleeves","pouch","pouches",
            "feeder","feeders","feeding","bowl","bowls","toy","toys",
            "storage","container","containers","dispenser","dispensers",
            "remover","tester","testing","fixture","fixtures",
            "frame","frames","shell","shells","housing","housings",
            "battery","batteries","lock","locks","box","boxes",
            "spoon","spoons","scoop","scoops","scooper","scoopers",
            "organizer","organizers","bracket","brackets","clip","clips",
            "tripod","tripods","lunch","timer","timers",
            "sticker","stickers","skin","skins","decal","decals","film","films",
            "memory","card","cards","flash","drive","drives",
            "ring","light","lights","microphone","microphones",
            "speaker","speakers","headset","headsets","earphone","earphones",
            "keyboard","keyboards","mouse","mice","gamepad","gamepads",
            "controller","controllers","remote","remotes",
            "lens","lenses","module","modules","sensor","sensors",
            "bag","bags","wallet","wallets","bumper","bumpers"
          ])'''

          acc_pattern = re.compile(
              r'const accessoryWords\s*=\s*new Set\(\[\s*.*?\s*\]\)',
              re.S
          )
          s2, n = acc_pattern.subn(lambda m: new_accessories, s, count=1)
          if n != 1:
              raise SystemExit(f"Accessory vocabulary block not found uniquely: matches={n}")
          s = s2

          rel_start = s.find("function relevanceFor(doc, q, tokens, baseRank) {")
          export_pos = s.find("export default async function handler(request)", rel_start)
          if rel_start < 0 or export_pos < 0:
              raise SystemExit("Relevance function boundaries not found.")

          rel_end = s.rfind("\n", rel_start, export_pos)
          if rel_end < rel_start:
              raise SystemExit("Could not resolve relevance function end.")

          new_relevance = r'''function relevanceFor(doc, q, tokens, baseRank) {
            const title = lower(doc.title);
            const brand = lower(doc.brand);
            const category = lower(`${doc.category || ""} ${doc.subcategory || ""}`);
            const description = lower(doc.description || "").slice(0, 1200);

            const titleWords = words(title);
            const categoryWords = words(category);
            const titleSet = new Set(titleWords);
            const brandSet = tokenSet(brand);
            const categorySet = new Set(categoryWords);
            const descriptionSet = tokenSet(description);

            const titleCoverage = countCoverage(tokens, titleSet, title);
            const brandCoverage = countCoverage(tokens, brandSet, brand);
            const categoryCoverage = countCoverage(tokens, categorySet, category);
            const descriptionCoverage = countCoverage(tokens, descriptionSet, description);

            const allInTitle = tokens.length > 0 && titleCoverage >= tokens.length;
            const allInCategory = tokens.length > 0 && categoryCoverage >= tokens.length;
            const phraseInTitle = Boolean(q && title.includes(q));
            const phraseAtStart = Boolean(
              q && (title === q || title.startsWith(q + " ") || title.startsWith(q + "-"))
            );

            const queryLooksAccessory = tokens.some(t => accessoryWords.has(t));
            const titleAccessoryWords = titleWords.filter(w => accessoryWords.has(w));
            const categoryAccessoryWords = categoryWords.filter(w => accessoryWords.has(w));
            const titleHasAccessory = titleAccessoryWords.length > 0;
            const categoryHasAccessory = categoryAccessoryWords.length > 0;

            const phraseIndex = q ? title.indexOf(q) : -1;
            const phraseWordPosition =
              phraseIndex >= 0 ? words(title.slice(0, phraseIndex)).length : 999;
            const phraseNearFront = phraseIndex >= 0 && phraseWordPosition <= 7;

            // Tier is sorted before numeric score.
            // Core products therefore cannot be displaced by a related item
            // just because that related title repeats the query many times.
            let intentTier = 0;

            if (queryLooksAccessory) {
              if (phraseInTitle && allInTitle) intentTier = 5;
              else if (allInTitle) intentTier = 4;
              else if (phraseInTitle) intentTier = 3;
              else if (allInCategory) intentTier = 2;
              else intentTier = 1;
            } else {
              const cleanTitleCore = allInTitle && !titleHasAccessory;
              const cleanPhraseCore = phraseInTitle && !titleHasAccessory;
              const cleanCategoryCore = allInCategory && !categoryHasAccessory;

              if (
                (cleanPhraseCore && phraseNearFront) ||
                (cleanTitleCore && phraseAtStart) ||
                (cleanCategoryCore && cleanPhraseCore)
              ) {
                intentTier = 5;
              } else if (cleanTitleCore || cleanCategoryCore) {
                intentTier = 4;
              } else if (cleanPhraseCore) {
                intentTier = 3;
              } else if (allInTitle || phraseInTitle) {
                intentTier = 2;
              } else if (allInCategory || titleCoverage > 0 || brandCoverage > 0) {
                intentTier = 1;
              }
            }

            let score = Number(baseRank.score || 0) + Number(baseRank.matches || 0) * 18;

            if (title === q) score += 260;
            else if (phraseAtStart) score += 145;
            else if (phraseInTitle) score += 95;

            if (allInTitle) score += 115;
            else score += titleCoverage * 34;

            if (allInCategory) score += 120;
            else score += categoryCoverage * 42;

            score += brandCoverage * 22;
            score += Math.min(descriptionCoverage, 2) * 4;

            if (brand === q) score += 55;
            if (intentTier >= 5) score += 180;
            else if (intentTier == 4) score += 90;

            let penalty = 0;

            if (!queryLooksAccessory && q) {
              const qPattern = escapeRegex(q).replace(/\s+/g, "\\s+");
              const accessoryPattern =
                "(?:case|cover|protector|charger|charging|cable|holder|stand|mount|" +
                "repair|replacement|parts?|tools?|kits?|accessor(?:y|ies)|adapter|dock|" +
                "screen|stylus|strap|band|sleeve|pouch|feeder|feeding|bowl|toy|storage|" +
                "container|dispenser|remover|tester|testing|fixture|frame|shell|housing|" +
                "batter(?:y|ies)|locks?|boxes?|spoons?|scoops?|scoopers?|organizers?|" +
                "brackets?|clips?|tripods?|lunch|timers?|stickers?|skins?|decals?|films?|" +
                "memory|cards?|flash|drives?|rings?|lights?|microphones?|speakers?|" +
                "headsets?|earphones?|keyboards?|mouse|mice|gamepads?|controllers?|" +
                "remotes?|lenses?|modules?|sensors?|bags?|wallets?|bumpers?)";

              const queryThenAccessory = new RegExp(
                qPattern + ".{0,60}\\b" + accessoryPattern + "\\b",
                "i"
              );
              const accessoryThenQuery = new RegExp(
                "\\b" + accessoryPattern + "\\b.{0,80}" + qPattern,
                "i"
              );
              const accessoryForQuery = new RegExp(
                "\\b" + accessoryPattern +
                "\\b.{0,30}\\b(?:for|compatible\\s+with|replacement\\s+for|used\\s+for)\\s+" +
                qPattern,
                "i"
              );

              if (queryThenAccessory.test(title)) penalty += 320;
              if (accessoryThenQuery.test(title)) penalty += 300;
              if (accessoryForQuery.test(title)) penalty += 340;
              if (phraseInTitle && titleHasAccessory) penalty += 130;
              if (phraseInTitle && categoryHasAccessory) penalty += 80;
              if (titleHasAccessory && titleCoverage == 0) penalty += 100;
              if (categoryHasAccessory && titleCoverage == 0) penalty += 65;
            }

            if (titleCoverage == 0 && categoryCoverage == 0 && brandCoverage == 0) {
              score -= 190;
            }
            if (titleCoverage == 0 && descriptionCoverage > 0) {
              score -= 90;
            }

            score -= penalty;

            return {
              score,
              intentTier,
              signals: {
                titleCoverage,
                categoryCoverage,
                brandCoverage,
                phraseInTitle,
                phraseAtStart,
                phraseNearFront,
                titleHasAccessory,
                titleAccessoryWords,
                intentTier,
                accessoryPenalty: penalty
              }
            };
          }

          '''

          s = s[:rel_start] + new_relevance + s[rel_end+1:]

          # Robust result-object edit: do not depend on exact indentation.
          if "intentTier: relevance.intentTier" not in s:
              result_pattern = re.compile(
                  r'(?m)^(\s*)matchScore\s*:\s*relevance\.score\s*,\s*\n'
                  r'(\s*)matchedTokens\s*:\s*rank\.matches\s*(,?)\s*$'
              )

              def result_repl(m):
                  i1 = m.group(1)
                  i2 = m.group(2)
                  return (
                      f"{i1}matchScore: relevance.score,\n"
                      f"{i2}matchedTokens: rank.matches,\n"
                      f"{i2}intentTier: relevance.intentTier"
                  )

              s2, n = result_pattern.subn(result_repl, s, count=1)
              if n != 1:
                  raise SystemExit(f"Result object anchor not found uniquely: matches={n}")
              s = s2

          # Robust sort replacement.
          if "b.intentTier - a.intentTier" not in s:
              sort_pattern = re.compile(
                  r'products\.sort\(\(a,\s*b\)\s*=>\s*'
                  r'b\.matchScore\s*-\s*a\.matchScore\s*\|\|\s*'
                  r'b\.quality\s*-\s*a\.quality\s*\|\|\s*'
                  r'a\.title\.localeCompare\(b\.title\)\s*'
                  r'\);',
                  re.S
              )
              sort_repl = '''products.sort((a, b) =>
                b.intentTier - a.intentTier ||
                b.matchScore - a.matchScore ||
                b.quality - a.quality ||
                a.title.localeCompare(b.title)
              );'''
              s2, n = sort_pattern.subn(sort_repl, s, count=1)
              if n != 1:
                  raise SystemExit(f"Product sort anchor not found uniquely: matches={n}")
              s = s2

          # Add core-candidate counts immediately before paging.
          if "const strongCoreCandidates" not in s:
              paged_pattern = re.compile(
                  r'(?m)^(\s*)const paged\s*=\s*products\.slice\(offset,\s*offset\s*\+\s*limit\);'
              )

              def paged_repl(m):
                  i = m.group(1)
                  return (
                      f"{i}const coreCandidates = products.filter(p => p.intentTier >= 4).length;\n"
                      f"{i}const strongCoreCandidates = products.filter(p => p.intentTier >= 5).length;\n"
                      f"{i}const paged = products.slice(offset, offset + limit);"
                  )

              s2, n = paged_pattern.subn(paged_repl, s, count=1)
              if n != 1:
                  raise SystemExit(f"Paged-result anchor not found uniquely: matches={n}")
              s = s2

          # Add the counts to response metadata.
          if re.search(r'(?m)^\s*strongCoreCandidates,\s*$', s) is None:
              meta_pattern = re.compile(
                  r'(?m)^(\s*)totalCandidates\s*:\s*products\.length,\s*$'
              )

              def meta_repl(m):
                  i = m.group(1)
                  return (
                      f"{i}totalCandidates: products.length,\n"
                      f"{i}coreCandidates,\n"
                      f"{i}strongCoreCandidates,"
                  )

              s2, n = meta_pattern.subn(meta_repl, s, count=1)
              if n != 1:
                  raise SystemExit(f"Response metadata anchor not found uniquely: matches={n}")
              s = s2

          s = s.replace(
              'console.error("TrendPilot V16.0.4 search failed", error);',
              'console.error("TrendPilot V16.0.6 search failed", error);',
              1
          )

          search.write_text(s, encoding="utf-8")

          d = docs.read_text(encoding="utf-8") if docs.exists() else "# TrendPilot V16 Universal Product Index\n"
          if "## V16.0.6 — robust intent tiers" not in d:
              d += r'''

          ## V16.0.6 — robust intent tiers

          - Replaces fragile exact-string workflow anchors with regex-based edits.
          - Results sort by core-product intent tier before numeric relevance.
          - Core-product candidate counts are exposed for the future live fallback.
          - Explicit accessory searches remain supported.
          - Search-only release; the 49k-product Blob index does not require rebuild.
          '''
          docs.write_text(d, encoding="utf-8")

          print("V16.0.6 robust intent-tier ranking applied.")
          PY

      - name: Validate V16.0.6
        shell: bash
        run: |
          set -euo pipefail

          node --check netlify/functions/products-v16.mjs
          git diff --check

          grep -q 'const VERSION = "16.0.6"' netlify/functions/products-v16.mjs
          grep -q 'intentTier: relevance.intentTier' netlify/functions/products-v16.mjs
          grep -q 'b.intentTier - a.intentTier' netlify/functions/products-v16.mjs
          grep -q 'const coreCandidates' netlify/functions/products-v16.mjs
          grep -q 'const strongCoreCandidates' netlify/functions/products-v16.mjs
          grep -q 'strongCoreCandidates,' netlify/functions/products-v16.mjs
          grep -q '"sticker","stickers"' netlify/functions/products-v16.mjs

          echo "V16.0.6 validation passed."

      - name: Publish V16.0.6
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            netlify/functions/products-v16.mjs \
            V16-UNIVERSAL-PRODUCT-INDEX.md

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V16.0.6 is already installed."
            exit 0
          fi

          git commit -m "fix: add robust core-product intent tiers to V16 search"
          git push origin HEAD:main

          {
            echo "## TrendPilot V16.0.6"
            echo "- fixed V16.0.5 fragile result-object anchor"
            echo "- core-product intent tiers sort before relevance score"
            echo "- API exposes coreCandidates and strongCoreCandidates"
            echo "- no product-index rebuild required"
          } >> "$GITHUB_STEP_SUMMARY"
