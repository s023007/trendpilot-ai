name: Temporary Shopper Cleanup V21.11

on:
  push:
    branches: [fix/shopper-cleanup-v21-11]
    paths:
      - '.github/workflows/tmp-shopper-cleanup-v21-11.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Remove technical shopper price controls
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p=Path('js/universal-discovery-v20-9-1.js')
          s=p.read_text(encoding='utf-8')
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('missing patch target: '+old[:180])
              s=s.replace(old,new,1)
          rep('const RUNTIME_VERSION = "21.10.1";','const RUNTIME_VERSION = "21.11.0";')
          rep('<span class="tp80-price-proof ${pi.kind}">${E(pi.proof)}</span>','')
          old='''    host.innerHTML=`<div class="tp-budget-title"><strong>Your budget</strong><button type="button" data-v209-budget-clear>Clear</button></div><div class="tp-budget-numbers"><label>Min $<input data-v209-min type="number" min="0" step="1" placeholder="0"></label><span>to</span><label>Max $<input data-v209-max type="number" min="0" step="1" placeholder="Any"></label></div><label class="tp-verified-only"><input data-v209-exact type="checkbox"><span><strong>Exact-product prices only</strong><small>Hide seller-feed prices and check-at-seller rows.</small></span></label><div class="tp-budget-status" data-v209-budget-status>No budget selected.</div>`;
    host.addEventListener("input",e=>{if(e.target.matches("[data-v209-min]"))state.min=Math.max(0,Number(e.target.value)||0);if(e.target.matches("[data-v209-max]"))state.max=Math.max(0,Number(e.target.value)||0);if(e.target.matches("[data-v209-exact]"))state.exactOnly=e.target.checked;filter()});
    host.addEventListener("change",e=>{if(e.target.matches("[data-v209-exact]")){state.exactOnly=e.target.checked;filter()}});
    host.addEventListener("click",e=>{if(!e.target.closest("[data-v209-budget-clear]"))return;state.min=state.max=0;state.exactOnly=false;const a=$("[data-v209-min]"),b=$("[data-v209-max]"),c=$("[data-v209-exact]");if(a)a.value="";if(b)b.value="";if(c)c.checked=false;filter()});
'''
          new='''    host.innerHTML=`<div class="tp-budget-title"><strong>Your budget</strong><button type="button" data-v209-budget-clear>Clear</button></div><div class="tp-budget-numbers"><label>Min $<input data-v209-min type="number" min="0" step="1" placeholder="0"></label><span>to</span><label>Max $<input data-v209-max type="number" min="0" step="1" placeholder="Any"></label></div>`;
    host.addEventListener("input",e=>{if(e.target.matches("[data-v209-min]"))state.min=Math.max(0,Number(e.target.value)||0);if(e.target.matches("[data-v209-max]"))state.max=Math.max(0,Number(e.target.value)||0);filter()});
    host.addEventListener("click",e=>{if(!e.target.closest("[data-v209-budget-clear]"))return;state.min=state.max=0;const a=$("[data-v209-min]"),b=$("[data-v209-max]");if(a)a.value="";if(b)b.value="";filter()});
'''
          rep(old,new)
          rep('if(state.max&&(price>state.max||!price))return false;if(state.exactOnly&&!r.x)return false;return true','if(state.max&&(price>state.max||!price))return false;return true')
          rep('    const status=$("[data-v209-budget-status]");if(status)status.textContent=[`${state.filtered.length} loaded`,state.exactOnly?"exact-product prices only":"all price evidence"].join(" · ");\n','')
          p.write_text(s,encoding='utf-8')

          f=Path('find/index.html')
          h=f.read_text(encoding='utf-8')
          h=h.replace('/js/universal-discovery-v20-9-1.js?v=21.10.1','/js/universal-discovery-v20-9-1.js?v=21.11.0')
          f.write_text(h,encoding='utf-8')
          PY
          node --check js/universal-discovery-v20-9-1.js
          python <<'PY'
          from pathlib import Path
          s=Path('js/universal-discovery-v20-9-1.js').read_text(encoding='utf-8')
          assert 'RUNTIME_VERSION = "21.11.0"' in s
          assert 'tp-verified-only' not in s
          assert 'data-v209-budget-status' not in s
          assert '${E(pi.proof)}' not in s
          assert 'exact-product prices only' not in s
          h=Path('find/index.html').read_text(encoding='utf-8')
          assert 'universal-discovery-v20-9-1.js?v=21.11.0' in h
          print('Shopper price cleanup PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/universal-discovery-v20-9-1.js find/index.html
          git commit -m 'Hide technical price evidence controls from shoppers'
          git push origin HEAD:fix/shopper-cleanup-v21-11
