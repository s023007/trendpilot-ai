name: TrendPilot V20.9.1 — Full Release Candidate

on:
  push:
    branches:
      - v20-9-all-product-quality-gate
    paths:
      - scripts/quality-gate-v20-9-all-products.py
      - scripts/export-v20-9-runtime-data.py
      - scripts/audit-v20-9-all-products.py
      - scripts/qa-v20-9-product-smoke.py
      - scripts/finalize-v20-8-9-rare-closeout.py
      - js/universal-discovery-v20-9-1.js
      - js/item-detail-v20-9.js
      - js/compare-v20-9.js
      - js/compare-state-v20-9.js
      - index.html
      - find/index.html
      - item/index.html
      - compare/index.html
      - css/compare-v20-9.css
      - .github/workflows/trendpilot-v20-8-universal-discovery-rare-finds.yml
      - .github/workflows/trendpilot-v20-9-release-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild universal source from canonical catalogs
        run: python scripts/build-v20-8-universal-discovery.py

      - name: Apply prior truth guards
        run: |
          python scripts/clean-v20-8-universal-output.py
          python scripts/clean-v20-8-brand-truth.py

      - name: Apply V20.9 quality gate and runtime export
        run: |
          python scripts/quality-gate-v20-9-all-products.py
          python scripts/export-v20-9-runtime-data.py
          python scripts/audit-v20-9-all-products.py
          python scripts/finalize-v20-8-9-rare-closeout.py

      - name: Cross-family product smoke QA
        run: python scripts/qa-v20-9-product-smoke.py

      - name: Runtime and page contract QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/universal-discovery-v20-9-1.js
          node --check js/item-detail-v20-9.js
          node --check js/compare-v20-9.js
          node --check js/compare-state-v20-9.js
          node --check js/rare-finds-v20-8.js
          node --check js/rare-find-detail-v20-8-7.js
          python -m py_compile scripts/quality-gate-v20-9-all-products.py scripts/export-v20-9-runtime-data.py scripts/audit-v20-9-all-products.py scripts/qa-v20-9-product-smoke.py scripts/finalize-v20-8-9-rare-closeout.py
          grep -q 'universal-discovery-v20-9-1.js?v=20.9.1' find/index.html
          grep -q 'compare-state-v20-9.js?v=20.9.0' find/index.html index.html
          grep -q 'item-detail-v20-9.js?v=20.9.0' item/index.html
          grep -q 'compare-v20-9.js?v=20.9.0' compare/index.html
          grep -q 'https://trendpilotchoice.com/compare/' compare/index.html
          grep -q 'data-tp85-fact-family' item/index.html
          grep -q 'data-tp85-compare' item/index.html
          grep -q 'tp-v209-compare' js/universal-discovery-v20-9-1.js
          grep -q 'tp-v209-compare' js/item-detail-v20-9.js
          grep -q 'tp-v209-compare' js/compare-v20-9.js
          grep -q 'tp-v209-seller:' js/universal-discovery-v20-9-1.js
          grep -q 'roleOK' js/universal-discovery-v20-9-1.js
          grep -q '/data/v20-9/products/' js/universal-discovery-v20-9-1.js js/item-detail-v20-9.js js/compare-v20-9.js
          grep -q 'V20.9 universal shopping decision engine' index.html
          grep -q 'Automotive' index.html
          grep -q 'Pet supplies' index.html
          grep -q 'Fashion' index.html
          if grep -q 'finder-v20-7-9.js' find/index.html || grep -q 'buyer-decision-v20-7-11.js' find/index.html || grep -q 'v20-8-8-internal-first-guard.js' find/index.html; then
            echo 'Legacy finder/card mutator leaked into authoritative V20.9.1 finder'
            exit 1
          fi
          if grep -RE 'new MutationObserver\([^)]*document|observe\(document' js/universal-discovery-v20-9-1.js js/item-detail-v20-9.js js/compare-v20-9.js js/compare-state-v20-9.js; then
            echo 'Whole-document MutationObserver is forbidden'
            exit 1
          fi
          if grep -q 'trendpilot-ai.netlify.app/compare' compare/index.html; then
            echo 'Old compare canonical leaked'
            exit 1
          fi

      - name: Full data contract QA
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('data/v20-9/quality-report.json').read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text())
          m=json.loads(Path('data/v20-8/manifest.json').read_text())
          s=json.loads(Path('data/v20-8/taxonomy-summary.json').read_text())
          rare=json.loads(Path('data/v20-8/rare-index.json').read_text())
          assert q['records']==52031
          assert d['records']==52031
          assert rt['records']==52031
          assert q['unclassifiedAfter']<=3500
          assert q['blockedSellerLeaks']==0
          assert q['immutableCommerceFieldsChanged']==0
          assert rt['productBuckets']==256
          assert rt['maxProductBucketBytes']<500000
          assert m.get('version')=='20.9.0'
          assert s.get('version')=='20.9.0'
          assert m.get('truthCleanup',{}).get('rareCloseoutVersion')=='20.8.9'
          assert m.get('rarePublished')==len(rare)
          assert 60 <= len(rare) <= 90
          assert m.get('seoPages')<=len(rare)
          for k in ('phoneNonMain','tabletNonMain','laptopNonMain','smartwatchNonMain','headphonesNonMain'):
              assert d['roleAnomalies'][k]['count']==0, (k,d['roleAnomalies'][k]['count'])
          print('PASS full V20.9.1 data contract')
          PY
          if git status --short | grep -E 'data/catalog-v19|data/.*(tpid|tpvid|tpoid|identity)'; then
            echo 'Unexpected V19 identity/canonical mutation'
            git status --short
            exit 1
          fi

      - name: Write release candidate summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          q=Path('data/v20-9/quality-report.json')
          if not q.exists():
              print('# V20.9.1 release candidate did not reach data report stage')
              raise SystemExit
          x=json.loads(q.read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text())
          m=json.loads(Path('data/v20-8/manifest.json').read_text())
          print('# TrendPilot V20.9.1 — Full Release Candidate')
          print()
          print(f"- Records: **{x['records']:,}**")
          print(f"- Unclassified: **{x['unclassifiedBefore']:,} → {x['unclassifiedAfter']:,} ({x['unclassifiedAfterPct']}%)**")
          print(f"- Type corrections: **{sum(i['count'] for i in x['typeChanges']):,}**")
          print(f"- Role corrections: **{sum(i['count'] for i in x['roleChanges']):,}**")
          print(f"- Families: **{x['familyCount']:,}**")
          print(f"- Mobile runtime buckets: **{rt['productBuckets']}**; largest **{rt['maxProductBucketBytes']:,} bytes**")
          print(f"- Strong accessory grammar still marked main: **{d['roleAnomalies']['mainWithStrongAccessoryGrammar']['count']:,}**")
          print(f"- Strong replacement grammar still marked main: **{d['roleAnomalies']['mainWithStrongReplacementGrammar']['count']:,}**")
          print(f"- Blocked seller leaks: **{x['blockedSellerLeaks']}**")
          print(f"- Immutable price/link/ID/seller fields changed: **{x['immutableCommerceFieldsChanged']}**")
          print(f"- Global data version: **{m.get('version')}**")
          print(f"- Rare closeout preserved: **{m.get('truthCleanup',{}).get('rareCloseoutVersion')}**")
          print()
          print('## Public product experience')
          print('- V20.9.1 authoritative finder for every query: **PASS if job green**')
          print('- Main/accessory/replacement/used intent gate: **PASS if job green**')
          print('- Per-query seller persistence: **PASS if job green**')
          print('- Exact vs seller-feed price evidence: **PASS if job green**')
          print('- Internal TrendPilot detail before seller exit: **PASS if job green**')
          print('- Same-family compare: **PASS if job green**')
          print('- Expanded homepage product families: **PASS if job green**')
          print('- Mobile two-character data buckets: **PASS if job green**')
          print('- Rare V20.8.9 closeout retained: **PASS if job green**')
          PY
