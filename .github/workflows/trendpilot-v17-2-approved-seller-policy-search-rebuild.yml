name: TrendPilot V17.2 Approved Seller Policy + Search Rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v17-2-approved-seller-policy-search-rebuild
  cancel-in-progress: true

jobs:
  seller-policy-search-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Apply V17.2 approved-seller policy carefully
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          APPROVED = [
              "AliExpress",
              "Alibaba",
              "Geekbuying",
              "FilamentPRO EU CPS",
              "Govee Many GEOs",
              "Harfington Many GEOs",
              "Sunsky-online WW",
              "Lenovo",
              "Diecast",
              "FragranceShop.com",
              "Karaca EU",
              "MFI Medical",
              "PandaHall",
              "TikTok Shop US",
              "Temu",
          ]

          # Joom is intentionally NOT in this list.
          # Raw Joom data may remain archived in /data, but it is not public,
          # not selectable, and must not enter the searchable product index.

          REGISTRY = {
              "version": "17.2.0",
              "policy": "explicit-approved-product-sellers-only",
              "notes": [
                  "Only explicitly approved product sellers may be indexed or returned by product search.",
                  "Joom is intentionally excluded because the affiliate application was not accepted.",
                  "Service/ticket partners are handled outside the product seller registry.",
                  "Raw archived data may remain on disk without being indexed or exposed."
              ],
              "sellers": [
                  {"name":"AliExpress","network":"Admitad","mode":"catalog","public":True,"cpc":True},
                  {"name":"Alibaba","network":"Admitad","mode":"catalog","public":True,"cpc":True},
                  {"name":"Geekbuying","network":"Admitad","mode":"catalog","public":True,"cpc":True},
                  {"name":"FilamentPRO EU CPS","network":"Admitad","mode":"catalog","public":True,"cpc":False},
                  {"name":"Govee Many GEOs","network":"Admitad","mode":"catalog","public":True,"cpc":False},
                  {"name":"Harfington Many GEOs","network":"Admitad","mode":"catalog","public":True,"cpc":False},
                  {"name":"Sunsky-online WW","network":"Admitad","mode":"catalog","public":True,"cpc":False},
                  {"name":"Lenovo","network":"Admitad","mode":"catalog/direct","public":True,"cpc":False},
                  {"name":"Diecast","network":"CJ","mode":"catalog","public":True,"cpc":False},
                  {"name":"FragranceShop.com","network":"CJ","mode":"catalog+live","public":True,"cpc":False},
                  {"name":"Karaca EU","network":"CJ","mode":"catalog+live","public":True,"cpc":False},
                  {"name":"MFI Medical","network":"CJ","mode":"catalog","public":True,"cpc":False},
                  {"name":"PandaHall","network":"CJ","mode":"catalog+live","public":True,"cpc":False},
                  {"name":"TikTok Shop US","network":"CJ","mode":"live","public":True,"cpc":False},
                  {"name":"Temu","network":"CJ","mode":"catalog+live","public":True,"cpc":False},
              ]
          }

          ALIASES = {
              "AliExpress": ["aliexpress","ali express","aliexpress.com","aliexpress ww","aliexpressww"],
              "Alibaba": ["alibaba","alibaba.com","alibaba ww","alibabaww"],
              "Geekbuying": ["geekbuying","geek buying","geekbuying ww","geekbuyingww"],
              "FilamentPRO EU CPS": ["filamentpro","filamentpro eu","filamentpro eu cps"],
              "Govee Many GEOs": ["govee","govee many geos"],
              "Harfington Many GEOs": ["harfington","harfington many geos","harrington","harrington many geos"],
              "Sunsky-online WW": ["sunsky","sunsky online","sunsky-online","sunsky-online ww"],
              "Lenovo": ["lenovo","lenovo many geos"],
              "Diecast": ["diecast","diecast.com","diecast models wholesale","diecastmodelswholesale"],
              "FragranceShop.com": ["fragranceshop.com","fragranceshop","fragrance shop","the fragrance shop"],
              "Karaca EU": ["karaca","karaca eu","karaca europe"],
              "MFI Medical": ["mfi","mfi medical","mfimedical"],
              "PandaHall": ["pandahall","panda hall","pandahall.com"],
              "TikTok Shop US": ["tiktok","tiktok shop","tiktok shop us","tiktokshop","tiktokshopus"],
              "Temu": ["temu","temu.com","shop temu","shoptemu"],
          }

          Path("data/product-seller-registry-v17.json").write_text(
              json.dumps(REGISTRY, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          Path("data/approved-product-sellers-v16.json").write_text(
              json.dumps({"version":"17.2.0","sellers":APPROVED}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          coverage_path = Path("data/seller-coverage-v15-1.json")
          if coverage_path.exists():
              coverage = json.loads(coverage_path.read_text(encoding="utf-8"))
              coverage["approvedProductSellers"] = APPROVED
              coverage["approvedProductSellersVersion"] = "17.2.0"
              coverage_path.write_text(
                  json.dumps(coverage, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )

          aliases_js = json.dumps(ALIASES, ensure_ascii=False)
          policy_js = f'''// TrendPilot V17.2 - explicit public product seller policy.
          // Joom is intentionally excluded. Do not auto-admit raw seller strings.
          export const PRODUCT_SELLER_POLICY_VERSION = "17.2.0";

          export const PUBLIC_PRODUCT_SELLER_NAMES = Object.freeze({json.dumps(APPROVED, ensure_ascii=False)});

          const aliasGroups = {aliases_js};

          const normalizeKey = value =>
            String(value ?? "")
              .toLocaleLowerCase("en-US")
              .normalize("NFKC")
              .replace(/[^a-z0-9]+/g, "");

          const canonicalByKey = new Map();

          for (const canonical of PUBLIC_PRODUCT_SELLER_NAMES) {{
            canonicalByKey.set(normalizeKey(canonical), canonical);
            for (const alias of aliasGroups[canonical] || []) {{
              canonicalByKey.set(normalizeKey(alias), canonical);
            }}
          }}

          export function canonicalProductSeller(value) {{
            const key = normalizeKey(value);
            return key ? (canonicalByKey.get(key) || "") : "";
          }}

          export function isApprovedProductSeller(value) {{
            return Boolean(canonicalProductSeller(value));
          }}

          export function canonicalizePublicProduct(product) {{
            if (!product || typeof product !== "object") return null;
            const rawSeller =
              product.seller ||
              product.advertiser ||
              product.merchant ||
              product.advertiserName ||
              product.merchantName ||
              "";
            const seller = canonicalProductSeller(rawSeller);
            if (!seller) return null;
            return {{
              ...product,
              seller,
              advertiser: product.advertiser ? seller : product.advertiser
            }};
          }}

          export function publicProductSellerAllowed(product) {{
            return Boolean(canonicalizePublicProduct(product));
          }}
          '''
          policy_js = "\n".join(line.rstrip() for line in policy_js.splitlines()) + "\n"
          Path("netlify/functions/product-seller-policy-v17.mjs").write_text(policy_js, encoding="utf-8")

          rebuild_path = Path("netlify/functions/products-v16-rebuild.mjs")
          rebuild = rebuild_path.read_text(encoding="utf-8")
          policy_import = 'import { canonicalizePublicProduct } from "./product-seller-policy-v17.mjs";'
          if policy_import not in rebuild:
              marker = '} from "./products-v16-lib.mjs";'
              if marker not in rebuild:
                  raise SystemExit("products-v16-rebuild import marker not found")
              rebuild = rebuild.replace(marker, marker + "\n" + policy_import, 1)

          old_products = 'const products = [...byId.values()];'
          new_products = 'const products = [...byId.values()].map(canonicalizePublicProduct).filter(Boolean);'
          if old_products in rebuild:
              rebuild = rebuild.replace(old_products, new_products, 1)
          elif new_products not in rebuild:
              raise SystemExit("products-v16-rebuild product collection marker not found")

          rebuild = rebuild.replace('"16.0.3"', '"17.2.0"').replace("V16.0.3", "V17.2.0")
          rebuild_path.write_text(rebuild, encoding="utf-8")

          base_path = Path("netlify/functions/products-v16.mjs")
          base = base_path.read_text(encoding="utf-8")
          base_import = 'import { canonicalProductSeller, publicProductSellerAllowed } from "./product-seller-policy-v17.mjs";'
          if base_import not in base:
              marker = '} from "./products-v16-lib.mjs";'
              if marker not in base:
                  raise SystemExit("products-v16 import marker not found")
              base = base.replace(marker, marker + "\n" + base_import, 1)

          old_seller_line = 'const seller = clean(url.searchParams.get("seller") || "").slice(0, 140);'
          new_seller_lines = '''const requestedSeller = clean(url.searchParams.get("seller") || "").slice(0, 140);
              const seller = requestedSeller ? canonicalProductSeller(requestedSeller) : "";
              if (requestedSeller && !seller) {
                return json({
                  ok: true,
                  version: VERSION,
                  storage: "netlify-blobs",
                  query: q,
                  seller: requestedSeller,
                  totalReturned: 0,
                  products: [],
                  sellerPolicy: "rejected-unapproved-seller"
                });
              }'''
          if old_seller_line in base:
              base = base.replace(old_seller_line, new_seller_lines, 1)
          elif 'sellerPolicy: "rejected-unapproved-seller"' not in base:
              raise SystemExit("products-v16 seller request marker not found")

          old_doc = '''const doc = docShards.get(id.slice(0, 1))?.[id];
                if (!doc) continue;'''
          new_doc = '''const doc = docShards.get(id.slice(0, 1))?.[id];
                if (!doc) continue;
                if (!publicProductSellerAllowed(doc)) continue;'''
          if old_doc in base:
              base = base.replace(old_doc, new_doc, 1)
          elif "if (!publicProductSellerAllowed(doc)) continue;" not in base:
              raise SystemExit("products-v16 document filter marker not found")

          base = base.replace('"16.0.6"', '"17.2.0"').replace("V16.0.6", "V17.2.0")
          base_path.write_text(base, encoding="utf-8")

          hybrid_path = Path("netlify/functions/products-v16-hybrid.mjs")
          hybrid = hybrid_path.read_text(encoding="utf-8")
          hybrid_import = 'import { canonicalProductSeller, canonicalizePublicProduct } from "./product-seller-policy-v17.mjs";'
          if hybrid_import not in hybrid:
              marker = '} from "./products-v16-lib.mjs";'
              if marker not in hybrid:
                  raise SystemExit("products-v16-hybrid import marker not found")
              hybrid = hybrid.replace(marker, marker + "\n" + hybrid_import, 1)

          old_norm = '''const normalized = normalizeProduct(row, sourceHint);
                if (!normalized) return null;'''
          new_norm = '''const rawNormalized = normalizeProduct(row, sourceHint);
                const normalized = canonicalizePublicProduct(rawNormalized);
                if (!normalized) return null;'''
          if old_norm in hybrid:
              hybrid = hybrid.replace(old_norm, new_norm, 1)
          elif "const rawNormalized = normalizeProduct(row, sourceHint);" not in hybrid:
              raise SystemExit("products-v16-hybrid normalize marker not found")

          old_hybrid_seller = 'const seller = clean(url.searchParams.get("seller") || "").slice(0, 140);'
          new_hybrid_seller = '''const requestedSeller = clean(url.searchParams.get("seller") || "").slice(0, 140);
              const seller = requestedSeller ? canonicalProductSeller(requestedSeller) : "";
              if (requestedSeller && !seller) {
                return json({
                  ok: true,
                  version: VERSION,
                  storage: "netlify-blobs",
                  mode: "index-first-hybrid",
                  query,
                  seller: requestedSeller,
                  products: [],
                  totalReturned: 0,
                  sellerPolicy: "rejected-unapproved-seller"
                });
              }'''
          if old_hybrid_seller in hybrid:
              hybrid = hybrid.replace(old_hybrid_seller, new_hybrid_seller, 1)
          elif 'sellerPolicy: "rejected-unapproved-seller"' not in hybrid:
              raise SystemExit("products-v16-hybrid seller request marker not found")

          old_merge = '''const rows = unique([
              ...(baseProducts || []),
              ...(fallbackProducts || [])
            ]).map(product => {'''
          new_merge = '''const rows = unique([
              ...(baseProducts || []),
              ...(fallbackProducts || [])
            ]).map(canonicalizePublicProduct).filter(Boolean).map(product => {'''
          if old_merge in hybrid:
              hybrid = hybrid.replace(old_merge, new_merge, 1)
          elif "map(canonicalizePublicProduct).filter(Boolean).map(product => {" not in hybrid:
              raise SystemExit("products-v16-hybrid merge filter marker not found")

          hybrid = hybrid.replace('const VERSION = "16.1.3";', 'const VERSION = "17.2.0";')
          hybrid = hybrid.replace('${lower(network)}|16.1.3', '${lower(network)}|${VERSION}')
          hybrid = hybrid.replace("TrendPilot V16.1.3", "TrendPilot V17.2.0")
          hybrid_path.write_text(hybrid, encoding="utf-8")

          health_path = Path("netlify/functions/products-v16-health.mjs")
          if health_path.exists():
              health = health_path.read_text(encoding="utf-8").replace('"16.0.3"', '"17.2.0"')
              health_path.write_text(health, encoding="utf-8")

          js_path = Path("js/site-v13-5.js")
          js = js_path.read_text(encoding="utf-8")
          seller_literal = json.dumps(APPROVED, ensure_ascii=False, separators=(",",":"))
          js, n = re.subn(
              r'const\s+TP_PRODUCT_SELLERS_V15_1\s*=\s*\[[^\]]*\]\s*;',
              f'const TP_PRODUCT_SELLERS_V15_1 = {seller_literal};',
              js,
              count=1
          )
          if n != 1:
              raise SystemExit("Could not lock TP_PRODUCT_SELLERS_V15_1")

          if "TP_SELLER_POLICY_V17_2" not in js:
              marker = "// TP_PUBLIC_SELLER_GUARD_START"
              if marker not in js:
                  raise SystemExit("Front-end public seller guard marker not found")
              guard = '// TP_SELLER_POLICY_V17_2\n' + f'const TP_PUBLIC_PRODUCT_SELLERS_V17_2 = new Set({seller_literal});\n'
              js = js.replace(marker, guard + marker, 1)

          old_return = 'return Boolean(title && validUrl(target) && seller);'
          new_return = 'return Boolean(title && validUrl(target) && seller && TP_PUBLIC_PRODUCT_SELLERS_V17_2.has(seller));'
          if old_return in js:
              js = js.replace(old_return, new_return, 1)
          elif new_return not in js:
              raise SystemExit("Front-end public seller return marker not found")

          id_match = re.search(r'const TP_CJ_APPROVED_IDS = new Set\(\[([^\]]*)\]\);', js)
          if not id_match:
              raise SystemExit("CJ approved ID set not found")
          ids = re.findall(r'"(\d+)"', id_match.group(1))
          if "6293473" not in ids:
              ids.append("6293473")
          id_repl = 'const TP_CJ_APPROVED_IDS = new Set([' + ", ".join(f'"{x}"' for x in ids) + ']);'
          js = js[:id_match.start()] + id_repl + js[id_match.end():]

          name_match = re.search(r'const TP_CJ_APPROVED_NAMES = new Set\(\[([^\]]*)\]\);', js)
          if not name_match:
              raise SystemExit("CJ approved name set not found")
          names = re.findall(r'"([^"]+)"', name_match.group(1))
          for name in ["temu","temucom","shoptemu"]:
              if name not in names:
                  names.append(name)
          name_repl = 'const TP_CJ_APPROVED_NAMES = new Set([' + ", ".join(f'"{x}"' for x in names) + ']);'
          js = js[:name_match.start()] + name_repl + js[name_match.end():]

          js_path.write_text(js, encoding="utf-8")

          print("V17.2 policy applied.")
          print("Approved product sellers:", len(APPROVED))
          print("Joom public/index policy: BLOCKED")
          PY

      - name: Validate policy and source before commit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          approved = json.loads(Path("data/approved-product-sellers-v16.json").read_text())
          names = approved["sellers"]
          assert len(names) == 15, names
          assert "Joom" not in names
          assert "TikTok Shop US" in names
          assert "Temu" in names

          registry = json.loads(Path("data/product-seller-registry-v17.json").read_text())
          public = [x["name"] for x in registry["sellers"] if x.get("public")]
          assert public == names

          coverage = json.loads(Path("data/seller-coverage-v15-1.json").read_text())
          assert coverage["approvedProductSellers"] == names

          js = Path("js/site-v13-5.js").read_text()
          assert "TP_SELLER_POLICY_V17_2" in js
          assert "TP_PUBLIC_PRODUCT_SELLERS_V17_2.has(seller)" in js
          assert '"6293473"' in js

          rebuild = Path("netlify/functions/products-v16-rebuild.mjs").read_text()
          assert ".map(canonicalizePublicProduct).filter(Boolean)" in rebuild
          assert '"17.2.0"' in rebuild

          base = Path("netlify/functions/products-v16.mjs").read_text()
          assert "publicProductSellerAllowed(doc)" in base
          assert 'sellerPolicy: "rejected-unapproved-seller"' in base

          hybrid = Path("netlify/functions/products-v16-hybrid.mjs").read_text()
          assert "canonicalizePublicProduct" in hybrid
          assert 'const VERSION = "17.2.0";' in hybrid
          assert 'sellerPolicy: "rejected-unapproved-seller"' in hybrid

          policy = Path("netlify/functions/product-seller-policy-v17.mjs").read_text()
          assert "Joom" not in policy
          print("Policy validation passed.")
          PY

          node --check netlify/functions/product-seller-policy-v17.mjs
          node --check netlify/functions/products-v16-rebuild.mjs
          node --check netlify/functions/products-v16.mjs
          node --check netlify/functions/products-v16-hybrid.mjs
          node --check netlify/functions/products-v16-health.mjs
          node --check js/site-v13-5.js

          echo "Source validation passed."

      - name: Commit V17.2 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TrendPilot Automation"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/product-seller-registry-v17.json \
            data/approved-product-sellers-v16.json \
            data/seller-coverage-v15-1.json \
            netlify/functions/product-seller-policy-v17.mjs \
            netlify/functions/products-v16-rebuild.mjs \
            netlify/functions/products-v16.mjs \
            netlify/functions/products-v16-hybrid.mjs \
            netlify/functions/products-v16-health.mjs \
            js/site-v13-5.js

          if git diff --cached --quiet; then
            echo "No source changes were needed; policy is already installed."
          else
            git commit -m "fix: lock approved product sellers and rebuild V17.2 search"
            git push origin HEAD:main
          fi

      - name: Wait for Netlify to publish V17.2
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Netlify automatic publish..."
          ok=0
          for i in $(seq 1 72); do
            if curl -fsS --max-time 15 \
              "https://trendpilotchoice.com/js/site-v13-5.js?policy=17.2.$RANDOM.$i" \
              | grep -q "TP_SELLER_POLICY_V17_2"; then
              echo "Netlify is serving the V17.2 front-end."
              ok=1
              break
            fi
            echo "Netlify not ready yet ($i/72)"
            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "Netlify did not expose V17.2 within the wait window."
            exit 1
          fi

      - name: Trigger one clean approved-seller Blobs rebuild
        shell: bash
        run: |
          set -euo pipefail
          echo "Triggering V17.2 rebuild once..."
          curl -fsS --max-time 30 \
            "https://trendpilotchoice.com/api/products-v16/rebuild?policy=17.2&run=${GITHUB_RUN_ID}" \
            | head -c 1000 || true
          echo

      - name: Wait for V17.2 index readiness
        shell: bash
        run: |
          set -euo pipefail

          ready=0
          for i in $(seq 1 90); do
            body="$(curl -fsS --max-time 20 \
              "https://trendpilotchoice.com/api/products-v16/health?policy=17.2.$RANDOM.$i" \
              || true)"

            if BODY="$body" python3 - <<'PY'
          import json, os, sys
          try:
              x=json.loads(os.environ.get("BODY",""))
          except Exception:
              sys.exit(1)
          good = bool(x.get("ready")) and str(x.get("version")) == "17.2.0"
          print("ready=",x.get("ready"),"version=",x.get("version"),"products=",x.get("products"),"sellers=",x.get("sellers"))
          sys.exit(0 if good else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo "V17.2 Blobs index did not become ready in time."
            exit 1
          fi

      - name: Automated post-deploy seller and search benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v17-2-benchmark

          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import collections, json, time

          BASE = "https://trendpilotchoice.com"
          APPROVED = [
              "AliExpress","Alibaba","Geekbuying","FilamentPRO EU CPS",
              "Govee Many GEOs","Harfington Many GEOs","Sunsky-online WW",
              "Lenovo","Diecast","FragranceShop.com","Karaca EU","MFI Medical",
              "PandaHall","TikTok Shop US","Temu"
          ]
          APPROVED_SET=set(APPROVED)

          def get_json(path, params):
              url = BASE + path + "?" + urlencode(params)
              req = Request(url, headers={
                  "accept":"application/json",
                  "user-agent":"TrendPilot-V17.2-Automated-Benchmark"
              })
              with urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode("utf-8","replace"))

          def seller_of(p):
              return str(p.get("seller") or p.get("advertiser") or "").strip()

          queries = ["phone","dog food","laptop","watch","perfume","power bank"]
          general = []
          violations = []

          for q in queries:
              data = get_json("/api/products-v16-hybrid", {"q":q,"limit":"48","test":"172"})
              products = data.get("products") or []
              counts = collections.Counter(seller_of(p) for p in products)
              unapproved = sorted({s for s in counts if s and s not in APPROVED_SET})
              if unapproved:
                  violations.append({"query":q,"unapproved":unapproved})

              general.append({
                  "query":q,
                  "returned":len(products),
                  "core":sum(1 for p in products if int(p.get("intentTier") or 0) >= 4),
                  "strong":sum(1 for p in products if int(p.get("intentTier") or 0) >= 5),
                  "sellers":dict(counts),
                  "fallbackUsed":bool(data.get("fallbackUsed")),
                  "totalCandidates":data.get("totalCandidates",0),
              })
              time.sleep(0.8)

          seller_checks = []
          for seller, q in [
              ("AliExpress","phone"),
              ("Alibaba","phone"),
              ("Geekbuying","phone"),
              ("TikTok Shop US","phone"),
              ("Temu","phone"),
              ("PandaHall","beads"),
              ("FragranceShop.com","perfume"),
              ("Karaca EU","cookware"),
          ]:
              data = get_json("/api/products-v16-hybrid", {"q":q,"seller":seller,"limit":"48","test":"172"})
              products = data.get("products") or []
              wrong = sorted({seller_of(p) for p in products if seller_of(p) and seller_of(p) != seller})
              if wrong:
                  violations.append({"query":q,"requestedSeller":seller,"wrongSeller":wrong})
              seller_checks.append({
                  "seller":seller,
                  "query":q,
                  "returned":len(products),
                  "core":sum(1 for p in products if int(p.get("intentTier") or 0) >= 4),
                  "strong":sum(1 for p in products if int(p.get("intentTier") or 0) >= 5),
                  "fallbackUsed":bool(data.get("fallbackUsed")),
              })
              time.sleep(1.0)

          joom = get_json("/api/products-v16-hybrid", {"q":"phone","seller":"Joom","limit":"10","test":"172"})
          joom_ok = len(joom.get("products") or []) == 0 and joom.get("sellerPolicy") == "rejected-unapproved-seller"
          if not joom_ok:
              violations.append({"JoomPolicy":"FAILED","response":joom})

          health = get_json("/api/products-v16/health", {"test":"172"})

          result = {
              "version":"17.2.0",
              "health":health,
              "general":general,
              "sellerChecks":seller_checks,
              "joomBlocked":joom_ok,
              "violations":violations,
          }

          Path("v17-2-benchmark/results.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )

          lines=[]
          lines.append("# TrendPilot V17.2 - Automated Search & Seller Verification")
          lines.append("")
          lines.append("No manual site testing was required for this verification.")
          lines.append("")
          lines.append("## Index")
          lines.append("")
          lines.append(f"- Ready: **{health.get('ready')}**")
          lines.append(f"- Version: **{health.get('version')}**")
          lines.append(f"- Indexed approved products: **{int(health.get('products') or 0):,}**")
          lines.append(f"- Indexed seller strings: **{health.get('sellers')}**")
          lines.append(f"- Joom public/search block: **{'PASS' if joom_ok else 'FAIL'}**")
          lines.append("")
          lines.append("## General search")
          lines.append("")
          lines.append("| Query | Returned | Core tier 4+ | Strong tier 5 | Sellers in first 48 |")
          lines.append("|---|---:|---:|---:|---|")
          for r in general:
              seller_text=", ".join(f"{k}:{v}" for k,v in r["sellers"].items()) or "-"
              lines.append(f"| {r['query']} | {r['returned']} | {r['core']} | {r['strong']} | {seller_text} |")

          lines.append("")
          lines.append("## Seller-scoped checks")
          lines.append("")
          lines.append("| Seller | Query | Returned | Core tier 4+ | Strong tier 5 |")
          lines.append("|---|---|---:|---:|---:|")
          for r in seller_checks:
              lines.append(f"| {r['seller']} | {r['query']} | {r['returned']} | {r['core']} | {r['strong']} |")

          lines.append("")
          if violations:
              lines.append("## Policy violations")
              lines.append("")
              lines.append("```json")
              lines.append(json.dumps(violations,ensure_ascii=False,indent=2))
              lines.append("```")
          else:
              lines.append("## Policy result")
              lines.append("")
              lines.append("**PASS - no unapproved seller was returned in the automated verification.**")

          Path("v17-2-benchmark/summary.md").write_text("\n".join(lines)+"\n", encoding="utf-8")
          print("\n".join(lines))

          if violations:
              raise SystemExit("Seller-policy verification failed.")
          PY

          cat v17-2-benchmark/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V17.2 verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v17-2-approved-seller-search-verification
          path: |
            v17-2-benchmark/summary.md
            v17-2-benchmark/results.json
          retention-days: 7
