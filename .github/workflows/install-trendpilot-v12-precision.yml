name: Install TrendPilot V12 Precision Commerce

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Locate and unpack V12 package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'trendpilot-v12-precision-commerce*.zip' -print -quit)"
          if [ -z "${ZIP_FILE}" ]; then
            echo "Upload trendpilot-v12-precision-commerce.zip to the repository root first."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/trendpilot-v12"
          mkdir -p "$RUNNER_TEMP/trendpilot-v12"
          unzip -q "${ZIP_FILE}" -d "$RUNNER_TEMP/trendpilot-v12"
          cp -a "$RUNNER_TEMP/trendpilot-v12"/. .
          rm -f "${ZIP_FILE}"

      - name: Install V12 precision experience
        run: python automation/install_v12_precision.py

      - name: Validate taxonomy, pages and mobile safeguards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            automation/build_search_catalog.py \
            automation/install_v12_precision.py \
            automation/validate_v12.py
          node --check js/site-v12.js
          python automation/validate_v12.py

      - name: Commit V12
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install TrendPilot V12 precision commerce experience"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Queue full product catalogue refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh workflow view update-products.yml >/dev/null 2>&1; then
            gh workflow run update-products.yml --ref "${GITHUB_REF_NAME}" || \
            echo "V12 installed. Run Update trends and affiliate products manually if dispatch is unavailable."
          else
            echo "V12 installed. No update-products.yml workflow was found."
          fi
