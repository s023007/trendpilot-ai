name: Install TrendPilot V13.8.5 CJ Conflict-Safe Sync

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: install-trendpilot-v13-8-5-cj-conflict-safe
  cancel-in-progress: false

jobs:
  sync-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Manual legacy utility notice
        run: |
          echo "This workflow is retained only as a manual emergency CJ cache utility."
          echo "It no longer runs on a schedule and it does not trigger the removed legacy update-products workflow."

      - name: Run existing conflict-safe CJ package sync
        shell: bash
        env:
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE='.github/workflows/install-trendpilot-v13-8-5-cj-conflict-safe.yml'
          echo "Manual CJ refresh requested. Existing V20/V21 public catalogues and identity are not rebuilt here."
          python - <<'PY'
          from pathlib import Path
          p=Path('data/cj-products.json')
          print('Current CJ cache exists:',p.exists(),'bytes:',p.stat().st_size if p.exists() else 0)
          print('No automatic public-catalogue rewrite is performed by V21.12.')
          PY
