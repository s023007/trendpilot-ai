name: Install TrendPilot V13.8.11 CJ Publication Guard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v13-8-11-cj-publication-guard
  cancel-in-progress: false

jobs:
  install-cj-publication-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch CJ at the publication layer only
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          JS_PATH = ROOT / "js" / "site-v13-5.js"
          REPORT_PATH = ROOT / "data" / "cj-publication-guard-report.json"
          VERSION = "13.8.11"

          if not JS_PATH.exists():
              raise SystemExit("js/site-v13-5.js was not found.")

          text = JS_PATH.read_text(encoding="utf-8")
          patches: list[str] = []

          text = re.sub(
              r"\n?\s*// TP_CJ_PUBLICATION_GUARD_START[\s\S]*?"
              r"// TP_CJ_PUBLICATION_GUARD_END\s*\n?",
              "\n",
              text,
          )

          helper = r'''
            // TP_CJ_PUBLICATION_GUARD_START
            const TP_CJ_GUARD_VERSION = "13.8.11";
            const TP_CJ_APPROVED_IDS = new Set([
              "2357926",
              "7287203",
              "5893489",
              "7227612",
              "4837117",
              "4295086",
              "4368684"
            ]);
            const TP_CJ_APPROVED_SELLERS = new Set([
              "diecast",
              "diecastcom",
              "fragranceshop",
              "fragranceshopcom",
              "thefragranceshop",
              "karaca",
              "karacaeu",
              "karacaeurope",
              "mfimedical",
              "mfi",
              "nordvpn",
              "nordvpncom",
              "pandahall",
              "pandahallcom",
              "tripcom",
              "tripcomglobal"
            ]);
            const TP_CJ_TRACKING_HOST_RE =
              /(?:^|\.)(?:anrdoezrs\.net|apmebf\.com|awltovhc\.com|commission-junction\.com|dpbolvw\.net|emjcd\.com|ftjcfx\.com|jdoqocy\.com|kqzyfj\.com|lduhtrp\.net|qksrv\.net|tkqlhce\.com)$/i;

            function tpCjSellerKey(value) {
              return lower(value).replace(/[^a-z0-9]+/g, "");
            }

            function tpCjFirst(p, keys) {
              for (const key of keys) {
                const value = p && p[key];
                if (value !== undefined && value !== null && String(value).trim() !== "") {
                  return value;
                }
              }
              return "";
            }

            function tpCjSeller(p) {
              return clean(tpCjFirst(p, [
                "advertiser", "advertiserName", "advertiser_name",
                "seller", "sellerName", "seller_name",
                "merchant", "merchantName", "merchant_name"
              ]));
            }

            function tpCjId(p) {
              return String(tpCjFirst(p, [
                "advertiserId", "advertiser_id", "advertiser-id",
                "advertiserCid", "advertiser_cid", "cid"
              ]) || "").replace(/\D+/g, "");
            }

            function tpCjUrl(p) {
              return clean(tpCjFirst(p, [
                "affiliateUrl", "affiliate_url", "buyUrl", "buy_url",
                "productUrl", "product_url", "clickUrl", "click_url",
                "url", "destination", "destinationUrl", "destination_url"
              ]));
            }

            function tpCjTrackingUrl(value) {
              if (!validUrl(value)) return false;
              try {
                return TP_CJ_TRACKING_HOST_RE.test(new URL(value).hostname.toLowerCase());
              } catch {
                return false;
              }
            }

            function tpCjDynamicKnownSeller(sellerKey) {
              const values = [
                ...(Array.isArray(window.TRENDPILOT_CJ_KNOWN_SELLERS)
                  ? window.TRENDPILOT_CJ_KNOWN_SELLERS : []),
                ...(Array.isArray(window.TRENDPILOT_CJ_SELLERS)
                  ? window.TRENDPILOT_CJ_SELLERS : []),
                ...(Array.isArray(window.TRENDPILOT_CJ_ADVERTISERS)
                  ? window.TRENDPILOT_CJ_ADVERTISERS : [])
              ];
              return values.some(value => {
                const name = typeof value === "string"
                  ? value
                  : (value && (value.name || value.advertiser || value.seller));
                return tpCjSellerKey(name) === sellerKey;
              });
            }

            function tpIsCjRecord(p) {
              if (!p) return false;

              const sellerKey = tpCjSellerKey(tpCjSeller(p));
              const signature = lower([
                p.network,
                p.networkName,
                p.network_name,
                p.provider,
                p.source,
                p.sourceId,
                p.source_id,
                p.program,
                p.programme,
                p.platform,
                p.affiliateNetwork,
                p.affiliate_network,
                p.id,
                p.clusterKey
              ].map(value => clean(value)).join(" "));

              return Boolean(
                tpCjTrackingUrl(tpCjUrl(p))
                || tpCjDynamicKnownSeller(sellerKey)
                || signature.includes("commission junction")
                || /(^|[^a-z])cj([^a-z]|$)/i.test(signature)
                || /\bcj[-_:]/i.test(signature)
              );
            }

            function cjPublicationAllowed(p) {
              if (!p || !tpIsCjRecord(p)) return Boolean(p);

              const advertiserId = tpCjId(p);
              const sellerKey = tpCjSellerKey(tpCjSeller(p));

              return TP_CJ_APPROVED_IDS.has(advertiserId)
                || TP_CJ_APPROVED_SELLERS.has(sellerKey);
            }

            window.TRENDPILOT_CJ_GUARD_STATUS = {
              version: TP_CJ_GUARD_VERSION,
              mode: "publication-layer",
              approvedAdvertisers: 7
            };
            // TP_CJ_PUBLICATION_GUARD_END
          '''

          insertion = re.compile(
              r'(\s*const validUrl = \(v\) => /\^https\?:\\\/\\\//i\.test\(clean\(v\)\);\n)'
          )
          match = insertion.search(text)
          if not match:
              raise SystemExit("Could not find the validUrl insertion point.")

          text = text[:match.end()] + helper + "\n" + text[match.end():]
          patches.append("helper-inserted")

          def replace_once(old: str, new: str, label: str) -> None:
              nonlocal_text[0] = nonlocal_text[0].replace(old, new, 1)
              patches.append(label)

          nonlocal_text = [text]

          def must_replace(old: str, new: str, label: str) -> None:
              if old not in nonlocal_text[0]:
                  raise SystemExit(f"Required patch point not found: {label}")
              replace_once(old, new, label)

          must_replace(
              "let out=rows.filter(p=>{",
              "let out=rows.filter(p=>{if(!cjPublicationAllowed(p))return false;",
              "search-results-filtered",
          )

          must_replace(
              "uniq(rows.map(p=>p.advertiser)).sort()",
              "uniq(rows.filter(cjPublicationAllowed).map(p=>p.advertiser)).sort()",
              "seller-dropdown-filtered",
          )

          old_offer = (
              'return rows.map(o=>({advertiser:clean(o.advertiser||p.advertiser||"Seller"),'
              'url:clean(o.url||p.url),price:Number(o.price||0)||0,oldPrice:Number(o.oldPrice||0)||0,'
              'currency:clean(o.currency||p.currency||"USD"),shippingPrice:o.shippingPrice===undefined||'
              'o.shippingPrice===null||o.shippingPrice===""?null:Number(o.shippingPrice),delivery:clean(o.delivery),'
              'condition:clean(o.condition)})).filter(o=>validUrl(o.url));'
          )
          new_offer = (
              'return rows.filter(o=>cjPublicationAllowed({...p,...o})).map(o=>({advertiser:clean(o.advertiser||p.advertiser||"Seller"),'
              'url:clean(o.url||p.url),price:Number(o.price||0)||0,oldPrice:Number(o.oldPrice||0)||0,'
              'currency:clean(o.currency||p.currency||"USD"),shippingPrice:o.shippingPrice===undefined||'
              'o.shippingPrice===null||o.shippingPrice===""?null:Number(o.shippingPrice),delivery:clean(o.delivery),'
              'condition:clean(o.condition)})).filter(o=>validUrl(o.url));'
          )
          must_replace(old_offer, new_offer, "cluster-offers-filtered")

          must_replace(
              "const cached=productCacheLookup(id); if(cached?.name&&cached?.url&&cached?.description) return {product:cached,peers:state.products};",
              "const cached=productCacheLookup(id); if(cached?.name&&cached?.url&&cached?.description&&cjPublicationAllowed(cached)) return {product:cached,peers:state.products};",
              "cached-product-guarded",
          )

          must_replace(
              "const featured=[...(m.featured||[]),...(m.dealCandidates||[]),...(m.rareUsed||[])].map(normalizeProduct);",
              "const featured=[...(m.featured||[]),...(m.dealCandidates||[]),...(m.rareUsed||[])].map(normalizeProduct).filter(cjPublicationAllowed);",
              "detail-featured-filtered",
          )

          must_replace(
              "const shard=await shardResponse.json(); const peers=(shard.products||[]).map(normalizeProduct); const product=normalizeProduct(peers[Number(entry[1])]||peers.find(p=>p.id===id));",
              "const shard=await shardResponse.json(); const peers=(shard.products||[]).map(normalizeProduct).filter(cjPublicationAllowed); const product=normalizeProduct(peers[Number(entry[1])]||peers.find(p=>p.id===id));",
              "detail-shard-filtered",
          )

          must_replace(
              "if (product?.id) {product.generatedAt=shard.generatedAt||m.generatedAt; cacheProduct(product); return {product,peers};}",
              "if (product?.id && cjPublicationAllowed(product)) {product.generatedAt=shard.generatedAt||m.generatedAt; cacheProduct(product); return {product,peers};}",
              "detail-product-guarded",
          )

          must_replace(
              "if (direct) {direct.generatedAt=m.generatedAt;cacheProduct(direct);return {product:direct,peers:featured};}",
              "if (direct && cjPublicationAllowed(direct)) {direct.generatedAt=m.generatedAt;cacheProduct(direct);return {product:direct,peers:featured};}",
              "direct-product-guarded",
          )

          must_replace(
              "const rows=readStore(compareStore,[]).map(normalizeProduct);",
              "const rows=readStore(compareStore,[]).map(normalizeProduct).filter(cjPublicationAllowed);",
              "compare-cache-filtered",
          )

          must_replace(
              "const rows=readStore(savedStore,[]).map(normalizeProduct),targets=readStore(targetStore,{});",
              "const rows=readStore(savedStore,[]).map(normalizeProduct).filter(cjPublicationAllowed),targets=readStore(targetStore,{});",
              "saved-cache-filtered",
          )

          must_replace(
              "const deals=(m.dealCandidates||[]).map(normalizeProduct).slice(0,60);",
              "const deals=(m.dealCandidates||[]).map(normalizeProduct).filter(cjPublicationAllowed).slice(0,60);",
              "deals-filtered",
          )

          must_replace(
              "const featured=(m.featured||[]).map(normalizeProduct),deals=(m.dealCandidates||[]).map(normalizeProduct),rare=(m.rareUsed||[]).map(normalizeProduct);",
              "const featured=(m.featured||[]).map(normalizeProduct).filter(cjPublicationAllowed),deals=(m.dealCandidates||[]).map(normalizeProduct).filter(cjPublicationAllowed),rare=(m.rareUsed||[]).map(normalizeProduct).filter(cjPublicationAllowed);",
              "home-products-filtered",
          )

          text = nonlocal_text[0]

          required_unchanged = [
              "const data = await r.json(); return (data.products || []).map(normalizeProduct);",
              "function mergeProducts(rows) {",
              "state.products = [...map.values()];",
          ]
          for value in required_unchanged:
              if value not in text:
                  raise SystemExit(f"Protected loading path changed unexpectedly: {value}")

          JS_PATH.write_text(text, encoding="utf-8")

          changed_html = 0
          for path in ROOT.rglob("*.html"):
              if ".git" in path.parts:
                  continue

              html = path.read_text(encoding="utf-8")
              updated = re.sub(
                  r'((?:src)=["\'](?:/|\.\./|\./)?js/site-v13-5\.js)'
                  r'(?:\?[^"\']*)?(["\'])',
                  rf'\1?v={VERSION}\2',
                  html,
                  flags=re.IGNORECASE,
              )

              if updated != html:
                  path.write_text(updated, encoding="utf-8")
                  changed_html += 1

          REPORT_PATH.parent.mkdir(parents=True, exist_ok=True)
          REPORT_PATH.write_text(
              json.dumps(
                  {
                      "version": VERSION,
                      "generatedAt": datetime.now(timezone.utc).isoformat(),
                      "status": "installed",
                      "mode": "publication-layer-only",
                      "approvedCjAdvertiserCount": 7,
                      "patches": patches,
                      "htmlFilesCacheBusted": changed_html,
                      "loadingPathTouched": False,
                      "notes": [
                          "Catalogue loading, segment fetching and mergeProducts were not changed.",
                          "Unapproved CJ records are hidden from results, seller filters, offers, detail pages, deals, saved products and comparisons.",
                          "Non-CJ sellers remain unaffected."
                      ],
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "status": "patched",
              "version": VERSION,
              "patches": patches,
              "htmlFilesCacheBusted": changed_html
          }, indent=2))
          PY

      - name: Validate JavaScript and protected loading path
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js

          python - <<'PY'
          import json
          from pathlib import Path

          script = Path("js/site-v13-5.js").read_text(encoding="utf-8")
          report = json.loads(
              Path("data/cj-publication-guard-report.json").read_text(encoding="utf-8")
          )

          assert report["status"] == "installed"
          assert report["loadingPathTouched"] is False
          assert "TP_CJ_PUBLICATION_GUARD_START" in script
          assert "if(!cjPublicationAllowed(p))return false;" in script
          assert "rows.filter(cjPublicationAllowed).map(p=>p.advertiser)" in script
          assert "const data = await r.json(); return (data.products || []).map(normalizeProduct);" in script
          assert "function mergeProducts(rows) {" in script
          assert "state.products = [...map.values()];" in script

          print("CJ publication guard validated without changing product loading.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "V13.8.11 is already installed."
            exit 0
          fi

          git commit -m "fix: guard unapproved CJ records at publication layer"

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 4))
          done

          echo "Unable to push after three attempts."
          exit 1
