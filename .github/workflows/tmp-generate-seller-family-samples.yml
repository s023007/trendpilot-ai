name: Temporary Seller Family Sample Generator

on:
  push:
    branches: [fix/phone-seller-coverage-20260815]
    paths:
      - '.github/workflows/tmp-generate-seller-family-samples.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Build compact seller coverage index
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json, glob
          from collections import defaultdict
          BLOCK={'temu','joom','filamentpro','filamentpro eu cps','filamentpro-eu-cps'}
          rows=defaultdict(lambda: defaultdict(list))
          for path in sorted(glob.glob('data/v20-9/products/*.json')):
              with open(path,encoding='utf-8') as f: bucket=json.load(f)
              for r in bucket.values():
                  seller=str(r.get('se') or '').strip()
                  if not seller or seller.lower() in BLOCK: continue
                  role=str(r.get('ro') or 'main')
                  if role not in ('main','used'): continue
                  fam=str(r.get('fa') or r.get('ty') or '').strip()
                  if not fam: continue
                  # Prefer usable shopper rows: exact destination, image, price, then rarity/quality.
                  rank=(1 if r.get('x') else 0,1 if r.get('im') else 0,1 if r.get('p') else 0,float(r.get('r') or 0))
                  rows[fam][seller].append((rank,str(r.get('id') or '')))
          out={'version':'20.9.0','families':{}}
          for fam,sellers in sorted(rows.items()):
              fm={}
              for seller,vals in sorted(sellers.items()):
                  vals=sorted(vals,key=lambda x:x[0],reverse=True)
                  ids=[]
                  for _,pid in vals:
                      if pid and pid not in ids: ids.append(pid)
                      if len(ids)>=8: break
                  if ids: fm[seller]=ids
              if fm: out['families'][fam]=fm
          with open('data/v20-9/seller-family-samples.json','w',encoding='utf-8') as f:
              json.dump(out,f,separators=(',',':'),ensure_ascii=False)
          print('families',len(out['families']))
          phone=out['families'].get('phone',{})
          print('phone sellers',sorted(phone))
          print('phone counts',{k:len(v) for k,v in phone.items()})
          assert 'Alibaba' in phone
          assert 'AliExpress' in phone
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v20-9/seller-family-samples.json
          git commit -m 'Add compact seller-family coverage index'
          git push origin HEAD:fix/phone-seller-coverage-20260815
