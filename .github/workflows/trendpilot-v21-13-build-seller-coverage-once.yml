name: TrendPilot V21.13 — Build Seller Coverage Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-13-build-seller-coverage-once.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Build strict footwear and balanced seller samples
        run: python scripts/build-v21-13-seller-coverage.py
      - name: Commit generated coverage and remove one-time writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/trendpilot-v21-13-build-seller-coverage-once.yml
          git add data/v20-9/footwear-seller-samples.json data/v20-9/seller-browse-samples.json .github/workflows/trendpilot-v21-13-build-seller-coverage-once.yml
          git commit -m 'TrendPilot V21.13 publish strict footwear and seller coverage indexes'
          git pull --rebase origin main
          git push origin HEAD:main
