name: TrendPilot V20.9 — All Product Quality Gate Candidate

on:
  push:
    branches:
      - v20-9-all-product-quality-gate
    paths:
      - scripts/quality-gate-v20-9-all-products.py
      - scripts/audit-v20-9-all-products.py
      - scripts/export-v20-9-runtime-data.py
      - scripts/finalize-v20-8-9-rare-closeout.py
      - .github/workflows/trendpilot-v20-9-quality-gate-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V20.9 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply candidate quality gate in workspace
        run: python scripts/quality-gate-v20-9-all-products.py

      - name: Export V20.9 mobile runtime data
        run: python scripts/export-v20-9-runtime-data.py

      - name: Audit remaining products after quality gate
        run: python scripts/audit-v20-9-all-products.py

      - name: Verify Rare closeout preserves V20.9 global version
        run: python scripts/finalize-v20-8-9-rare-closeout.py

      - name: Candidate semantic QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/quality-gate-v20-9-all-products.py scripts/audit-v20-9-all-products.py scripts/export-v20-9-runtime-data.py scripts/finalize-v20-8-9-rare-closeout.py
          test -s data/v20-9/quality-report.json
          test -s data/v20-9/diagnostic.json
          test -s data/v20-9/families.json
          test -s data/v20-9/runtime-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/v20-9/quality-report.json').read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text())
          m=json.loads(Path('data/v20-8/manifest.json').read_text())
          s=json.loads(Path('data/v20-8/taxonomy-summary.json').read_text())
          assert x['records']==52031, x['records']
          assert d['records']==52031, d['records']
          assert rt['records']==52031, rt['records']
          assert d['unclassified']==x['unclassifiedAfter'], (d['unclassified'],x['unclassifiedAfter'])
          assert x['blockedSellerLeaks']==0, x['blockedSellerLeaks']
          assert x['immutableCommerceFieldsChanged']==0, x['immutableCommerceFieldsChanged']
          assert x['unclassifiedAfter'] <= 3500, x['unclassifiedAfter']
          assert rt['productBuckets'] >= 240, rt['productBuckets']
          assert rt['maxProductBucketBytes'] < 500000, rt['maxProductBucketBytes']
          for k in ('phoneNonMain','tabletNonMain','laptopNonMain','smartwatchNonMain','headphonesNonMain'):
              assert x['semanticProbes'][k]==0, (k,x['semanticProbes'][k])
          assert m.get('version')=='20.9.0', m.get('version')
          assert m.get('truthCleanup',{}).get('rareCloseoutVersion')=='20.8.9'
          assert s.get('version')=='20.9.0', s.get('version')
          print('PASS candidate quality gate + mobile runtime + remaining audit + Rare version preservation')
          PY
          if git status --short | grep -E 'data/catalog-v19|data/.*(tpid|tpvid|tpoid|identity)'; then
            echo 'Unexpected identity or canonical catalog mutation'
            git status --short
            exit 1
          fi

      - name: Write candidate summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('data/v20-9/quality-report.json')
          dpath=Path('data/v20-9/diagnostic.json')
          if not p.exists():
              print('# TrendPilot V20.9 candidate did not produce a report')
              raise SystemExit
          x=json.loads(p.read_text())
          d=json.loads(dpath.read_text()) if dpath.exists() else {}
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text()) if Path('data/v20-9/runtime-manifest.json').exists() else {}
          m=json.loads(Path('data/v20-8/manifest.json').read_text())
          print('# TrendPilot V20.9 — All Product Quality Gate Candidate')
          print()
          print(f"- Records: **{x['records']:,}**")
          print(f"- Unclassified before: **{x['unclassifiedBefore']:,}**")
          print(f"- Unclassified after: **{x['unclassifiedAfter']:,} ({x['unclassifiedAfterPct']}%)**")
          print(f"- Reclassified out of Unclassified: **{x['unclassifiedReduction']:,}**")
          print(f"- Type corrections: **{sum(i['count'] for i in x['typeChanges']):,}**")
          print(f"- Role corrections: **{sum(i['count'] for i in x['roleChanges']):,}**")
          print(f"- Product families: **{x['familyCount']:,}**")
          print(f"- Marketing title cleanups: **{x['titleCleanups']:,}**")
          print(f"- Blocked seller leaks: **{x['blockedSellerLeaks']}**")
          print(f"- Immutable commerce fields changed: **{x['immutableCommerceFieldsChanged']}**")
          print(f"- Global manifest version after Rare closeout: **{m.get('version')}**")
          print(f"- Rare closeout contract: **{m.get('truthCleanup',{}).get('rareCloseoutVersion')}**")
          if rt:
              print(f"- Mobile product buckets: **{rt['productBuckets']:,}**")
              print(f"- Largest mobile product bucket: **{rt['maxProductBucketBytes']:,} bytes**")
          print()
          print('## Semantic probes')
          for k,v in x['semanticProbes'].items(): print(f'- {k}: **{v}**')
          print()
          print('## Largest type corrections')
          for i in x['typeChanges'][:20]: print(f"- {i['from']} → {i['to']}: **{i['count']:,}**")
          if d:
              print()
              print('## Remaining Unclassified probe families')
              hits=d.get('unclassifiedProbeHits',{})
              for k,v in sorted(hits.items(), key=lambda kv: kv[1]['count'], reverse=True)[:20]:
                  print(f"- {k}: **{v['count']:,}**")
          print()
          print('Candidate only. No generated product data is committed by this workflow.')
          PY
