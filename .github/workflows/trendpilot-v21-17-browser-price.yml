name: TrendPilot V21.17 — Lenovo Price + Cross-Browser Stability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-17-browser-price.yml
      - scripts/apply-v21-17-browser-price.py
      - scripts/qa-v21-17-browser-price.mjs
      - js/visitor-context-v21-17.js
      - js/tiktok-us-geo-v21-17.js
      - netlify/edge-functions/visitor-context-v21-17.js
      - js/universal-discovery-v20-9-1.js
      - js/packed-browse-v21-13-8.js
      - js/compare-v20-9.js
      - js/deals-revenue-v21-14.js
      - netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
      - find/index.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v21-17-browser-price
  cancel-in-progress: true

jobs:
  rollout-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Apply V21.17 safety patch
        run: python scripts/apply-v21-17-browser-price.py

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply-v21-17-browser-price.py
          node --check js/visitor-context-v21-17.js
          node --check js/tiktok-us-geo-v21-17.js
          node --check js/universal-discovery-v20-9-1.js
          node --check js/packed-browse-v21-13-8.js
          node --check js/compare-v20-9.js
          node --check js/deals-revenue-v21-14.js
          node --check netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          grep -q 'visitor-context-v21-17.js?v=21.17.0' find/index.html
          ! grep -q 'geo-bootstrap.js?v=21.16.0' find/index.html
          grep -q 'usablePrice' js/universal-discovery-v20-9-1.js
          grep -q 'usablePrice' js/compare-v20-9.js

      - name: Commit V21.17 rollout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V21.17 source is already current.'
          else
            git commit -m 'TrendPilot V21.17 fix Lenovo placeholder prices and browser stalls'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium and Firefox QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium firefox

      - name: Start local production mirror
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tp-v2117-http.log 2>&1 &
          echo $! > /tmp/tp-v2117-http.pid
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/find/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/tp-v2117-http.log
          exit 1

      - name: Run Chromium + Firefox regression QA
        env:
          TP_BASE_URL: http://127.0.0.1:4173
        run: node scripts/qa-v21-17-browser-price.mjs

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/tp-v2117-http.pid ]; then kill "$(cat /tmp/tp-v2117-http.pid)" 2>/dev/null || true; fi

      - name: Wait for public V21.17 deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            good=1
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/find/?q=tablets&engine=v2064&universal=1' -o /tmp/find.html || good=0
            grep -q 'visitor-context-v21-17.js?v=21.17.0' /tmp/find.html 2>/dev/null || good=0
            grep -q 'tiktok-us-geo-v21-17.js?v=21.17.0' /tmp/find.html 2>/dev/null || good=0
            if grep -q 'geo-bootstrap.js?v=21.16.0' /tmp/find.html 2>/dev/null; then good=0; fi
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/visitor-context.json' -o /tmp/context.json || good=0
            grep -q '"country"' /tmp/context.json 2>/dev/null || good=0
            if [ "$good" = 1 ]; then echo 'V21.17 is live.'; exit 0; fi
            echo "Waiting for public V21.17 deploy ($i/60)..."
            sleep 6
          done
          echo 'V21.17 did not become live within the deployment window.'
          exit 1

      - name: Write V21.17 summary
        if: always()
        shell: bash
        run: |
          echo '# TrendPilot V21.17 — Lenovo Price + Cross-Browser Stability' >> "$GITHUB_STEP_SUMMARY"
          if [ -s artifacts/v21-17-browser-price/report.json ]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/v21-17-browser-price/report.json','utf8'));
          console.log(`- Cross-browser QA: **${r.passed?'PASS':'FAIL'}**`);
          for(const [k,v] of Object.entries(r.checks||{})) console.log(`- ${v.ok?'✅':'❌'} ${k}${v.detail?`: ${v.detail}`:''}`);
          if(r.error){console.log();console.log('```');console.log(r.error);console.log('```');}
          NODE
          else
            echo '- QA report was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload V21.17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v21-17-browser-price
          path: artifacts/v21-17-browser-price
          if-no-files-found: ignore
