name: Fix Email Seller Handoff V2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_email_seller_handoff_v2.py'
      - '.github/workflows/fix-email-seller-handoff-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-email-seller-handoff-v2
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Apply patch
        run: python scripts/fix_email_seller_handoff_v2.py
      - name: Validate PHP
        run: php -l api/save-search.php
      - name: Commit and push
        run: |
          git config user.name 'trendpilot-email-handoff-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/save-search.php index.html js/email-buy-root-bridge.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make email seller handoff direct and backward compatible'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
