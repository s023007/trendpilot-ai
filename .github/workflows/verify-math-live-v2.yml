name: Verify Math Live V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-math-live-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live math page and image sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time, urllib.request
          url='https://trendpilotchoice.com/math/?verify=light-v2-'+str(int(time.time()))
          req=urllib.request.Request(url,headers={'User-Agent':'TrendPilotMathVerify/2.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              assert r.status == 200, r.status
          markers=[
              'افهم الرياضيات بطريقة',
              'math-services-v2.css',
              '30 دقيقة</span><strong>4 ر.ع',
              '60 دقيقة</span><strong>5 ر.ع',
              '4 حصص × 60 دقيقة</span><strong>20 ر.ع',
              '8 حصص × 60 دقيقة</span><strong>30 ر.ع',
              'مراجعة مكثفة 90 دقيقة</span><strong>14 ر.ع',
              'data-en-src="https://images.pexels.com/photos/5538616',
              'الخدمة مخصصة للتعليم والشرح والتدريب والمراجعة فقط'
          ]
          missing=[m for m in markers if m not in body]
          if missing:
              raise SystemExit('Missing live markers: '+repr(missing))
          for image in [
              'https://images.pexels.com/photos/6326370/pexels-photo-6326370.jpeg?auto=compress&cs=tinysrgb&w=900',
              'https://images.pexels.com/photos/5538616/pexels-photo-5538616.jpeg?auto=compress&cs=tinysrgb&w=900'
          ]:
              rq=urllib.request.Request(image,headers={'User-Agent':'TrendPilotMathVerify/2.0'})
              with urllib.request.urlopen(rq,timeout=30) as rr:
                  assert rr.status == 200, (image,rr.status)
                  assert (rr.headers.get('Content-Type') or '').startswith('image/'), rr.headers.get('Content-Type')
          print('LIVE_MATH_V2_OK')
          PY
