name: Google Basic Planner High-Intent Product Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-basic-planner-high-intent-discovery.yml'

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}

    steps:
      - uses: actions/checkout@v4
      - run: pip install --disable-pip-version-check google-ads
      - name: Read-only US Canada diecast finalist comparison
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,time
          from google.ads.googleads.client import GoogleAdsClient
          from google.api_core.exceptions import ResourceExhausted
          client=GoogleAdsClient.load_from_dict({
            'developer_token':os.environ['GOOGLE_ADS_DEVELOPER_TOKEN'],
            'client_id':os.environ['GOOGLE_ADS_CLIENT_ID'],
            'client_secret':os.environ['GOOGLE_ADS_CLIENT_SECRET'],
            'refresh_token':os.environ['GOOGLE_ADS_REFRESH_TOKEN'],
            'login_customer_id':os.environ['GOOGLE_ADS_LOGIN_CUSTOMER_ID'].replace('-','').strip(),
            'use_proto_plus':True,
          })
          cid=os.environ['GOOGLE_ADS_CUSTOMER_ID'].replace('-','').strip()
          svc=client.get_service('KeywordPlanIdeaService'); NET=client.enums.KeywordPlanNetworkEnum.GOOGLE_SEARCH
          seeds=[
            'american muscle diecast cars 1 18','american muscle 1 18 diecast cars','1 18 american muscle cars',
            'auto world american muscle 1 18','1970 dodge charger american muscle 1 18',
            'maisto diecast cars 1 18','maisto 1 18 special edition','2020 corvette c8 maisto 1 18',
            'corvette diecast 1 18','corgi diecast aircraft'
          ]
          tests=[
            ('UnitedStates','geoTargetConstants/2840'),
            ('Canada','geoTargetConstants/2124'),
          ]
          def metric(m,field):
            pb=getattr(m,'_pb',m)
            try:
              if not pb.HasField(field): return None
            except Exception: pass
            v=getattr(m,field,None); return int(v) if v is not None else None
          seed_norm={s.lower().replace(' ','') for s in seeds}
          for label,geo in tests:
            req=client.get_type('GenerateKeywordIdeasRequest'); req.customer_id=cid
            req.language='languageConstants/1000'; req.geo_target_constants.append(geo); req.keyword_plan_network=NET
            req.keyword_seed.keywords.extend(seeds)
            for attempt in range(5):
              try: results=list(svc.generate_keyword_ideas(request=req)); break
              except ResourceExhausted: time.sleep(5*(attempt+1))
            else: raise RuntimeError('rate limit persisted '+label)
            rows=[]
            for x in results:
              m=x.keyword_idea_metrics; s=int(m.avg_monthly_searches or 0)
              if s<=0: continue
              ci=metric(m,'competition_index'); lo=metric(m,'low_top_of_page_bid_micros'); hi=metric(m,'high_top_of_page_bid_micros')
              text=x.text.strip(); seed=text.lower().replace(' ','') in seed_norm
              rows.append((seed,text,s,getattr(m.competition,'name',str(m.competition)),ci,None if lo is None else round(lo/1e6,2),None if hi is None else round(hi/1e6,2)))
            rows.sort(key=lambda r:(0 if r[0] else 1,-r[2],999 if r[4] is None else r[4]))
            print(f'MARKET|{label}|ideas={len(results)}|nonzero={len(rows)}')
            for seed,text,s,comp,ci,lo,hi in rows[:60]:
              gate='GREEN' if s>=10 and ci is not None and ci<=35 and (hi is None or hi<=1.00) else ('AMBER' if s>=10 and (ci is None or ci<=60) and (hi is None or hi<=1.50) else 'RED')
              print(f'DIECAST|gate={gate}|seed={seed}|market={label}|keyword={text}|searches={s}|competition={comp}|ci={ci}|low_usd={lo}|high_usd={hi}')
            time.sleep(5)
          print('BASIC_PLANNER_ACCESS|PASS')
          print('MODE|READ_ONLY|NO_ADS_CREATED')
          PY
