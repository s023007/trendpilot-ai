name: TrendPilot V20.6.6.2 — Broad Comparison Runtime Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-6-6-2-broad-comparison-runtime-recovery
  cancel-in-progress: false

jobs:
  repair:
    name: Repair broad comparison runtime without rebuilding identity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify committed comparison package
        shell: bash
        run: |
          set -euo pipefail

          ROOT="data/search-v20-6/comparison-v20-6-4"
          test -s "$ROOT/manifest.json"
          test -s "$ROOT/types/phone.json"
          test -s "$ROOT/types/headphones.json"
          test -s "$ROOT/types/perfume.json"
          test -s js/site-v13-5.js
          test -s find/index.html

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("data/search-v20-6/comparison-v20-6-4")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))

          assert m.get("mode")=="identity-first-comparison", m
          assert int(m.get("products") or 0)>10000, m
          assert int(m.get("offers") or 0)>10000, m
          assert int(m.get("blockedSellerLeaks") or 0)==0, m
          assert int(m.get("phoneSoldObjectLeaks") or 0)==0, m
          assert int(m.get("knownSemanticLeaks") or 0)==0, m
          assert int(m.get("multiSellerProducts") or 0)>=1, m

          for t in ("phone","headphones","perfume"):
              p=root/"types"/f"{t}.json"
              data=json.loads(p.read_text(encoding="utf-8"))
              products=data.get("products")
              assert isinstance(products,list) and products, f"{t}: products missing"

              bad_variants=0
              bad_offers=0
              no_tpid=0
              for product in products:
                  if not str(product.get("tpid") or "").startswith("TP"):
                      no_tpid+=1
                  variants=product.get("variants")
                  if not isinstance(variants,list):
                      bad_variants+=1
                      continue
                  for variant in variants:
                      if not isinstance(variant.get("offers"),list):
                          bad_offers+=1

              if no_tpid or bad_variants or bad_offers:
                  raise AssertionError(
                      f"{t}: no_tpid={no_tpid}, bad_variants={bad_variants}, bad_offers={bad_offers}"
                  )
              print(f"{t}: {len(products)} products — schema PASS")

          print("Committed comparison package is healthy.")
          print("This workflow repairs only the browser broad-query runtime.")
          PY

      - name: Install V20.6.6.2 broad-query runtime recovery
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("js/site-v13-5.js")
          s=p.read_text(encoding="utf-8")

          if "// TP_V20_6_4_COMPARISON_START" not in s:
              raise SystemExit("V20.6 comparison bridge is missing")

          loader_pattern = re.compile(
              r'''async function tpLoadComparisonTypeV20_6_4\(type\)\{.*?\n          \}\n\n          function tpComparisonVariantV20_6_4''',
              re.S
          )
          loader_repl = r'''async function tpLoadComparisonTypeV20_6_4(type){
            const url=`/data/search-v20-6/comparison-v20-6-4/types/${encodeURIComponent(type)}.json?v=20.6.6.2`;
            const r=await fetch(url,{cache:'no-store',headers:{accept:'application/json'}});
            if(!r.ok)throw new Error(`V20.6.6.2 comparison type ${type}: ${r.status}`);

            const raw=await r.json();
            if(!raw || !Array.isArray(raw.products)){
              throw new Error(`V20.6.6.2 invalid comparison payload for ${type}`);
            }

            const products=raw.products
              .filter(p=>p && typeof p==='object' && clean(p.tpid))
              .map(p=>{
                const variants=(Array.isArray(p.variants)?p.variants:[])
                  .filter(v=>v && typeof v==='object')
                  .map(v=>({
                    ...v,
                    offers:(Array.isArray(v.offers)?v.offers:[])
                      .filter(o=>o && typeof o==='object')
                  }));
                return {
                  ...p,
                  variants,
                  aliases:Array.isArray(p.aliases)?p.aliases:[],
                  sellers:Array.isArray(p.sellers)?p.sellers:[],
                };
              });

            return {
              ...raw,
              products,
              comparisonSets:Array.isArray(raw.comparisonSets)?raw.comparisonSets:[]
            };
          }

          function tpComparisonVariantV20_6_4'''
          s,n=loader_pattern.subn(loader_repl,s,count=1)
          if n!=1:
              raise SystemExit(f"comparison loader patch matched {n}")

          s,n=re.subn(
              r'''function tpComparisonVariantV20_6_4\(product,intent\)\{\n\s*const variants=Array\.isArray\(product\.variants\)\?product\.variants:\[\];''',
              '''function tpComparisonVariantV20_6_4(product,intent){\n            const variants=Array.isArray(product?.variants)?product.variants:[];''',
              s,count=1
          )
          if n!=1:
              raise SystemExit(f"variant helper patch matched {n}")

          s,n=re.subn(
              r'''function tpComparisonOffersV20_6_4\(product,intent,seller=''\)\{\n\s*const variant=tpComparisonVariantV20_6_4\(product,intent\);\n\s*let offers=variant\?\.offers\|\|\[\];''',
              '''function tpComparisonOffersV20_6_4(product,intent,seller=''){\n            const variant=tpComparisonVariantV20_6_4(product,intent);\n            let offers=Array.isArray(variant?.offers)?variant.offers:[];''',
              s,count=1
          )
          if n!=1:
              raise SystemExit(f"offer helper patch matched {n}")

          anchor="          function tpResolveComparisonV20_6_4(payload,query,forcedTpid=''){"
          if anchor not in s:
              raise SystemExit("comparison resolver anchor missing")

          safe_card = r'''
          function tpComparisonSafeChoiceCardV20_6_4(product){
            try{
              return tpComparisonChoiceCardV20_6_4(product);
            }catch(error){
              console.warn('TrendPilot V20.6.6.2 skipped one broad comparison card',product?.tpid||'',error);
              return '';
            }
          }

          '''
          if "function tpComparisonSafeChoiceCardV20_6_4" not in s:
              s=s.replace(anchor,safe_card+anchor,1)

          old = r'''              const normalizedRows=(resolved.mode==='exact'&&resolved.exact)
                ? [tpComparisonMasterProductV20_6_4(resolved.exact,resolved.variantIntent,state.selectedSeller)].filter(Boolean)
                : resolved.products.slice(0,100).map(p=>tpComparisonMasterProductV20_6_4(p,{storage:'',ram:''},state.selectedSeller)).filter(Boolean);
              state.products=normalizedRows;state.exact=normalizedRows;state.alternatives=resolved.alternatives.map(p=>tpComparisonMasterProductV20_6_4(p,{storage:'',ram:''},state.selectedSeller)).filter(Boolean);'''

          new = r'''              const normalizedRows=[];
              if(resolved.mode==='exact'&&resolved.exact){
                const row=tpComparisonMasterProductV20_6_4(resolved.exact,resolved.variantIntent,state.selectedSeller);
                if(row)normalizedRows.push(row);
              }else{
                for(const p of resolved.products.slice(0,100)){
                  try{
                    const row=tpComparisonMasterProductV20_6_4(p,{storage:'',ram:''},state.selectedSeller);
                    if(row)normalizedRows.push(row);
                  }catch(error){
                    console.warn('TrendPilot V20.6.6.2 skipped one broad normalization row',p?.tpid||'',error);
                  }
                }
              }

              const normalizedAlternatives=[];
              for(const p of (Array.isArray(resolved.alternatives)?resolved.alternatives:[])){
                try{
                  const row=tpComparisonMasterProductV20_6_4(p,{storage:'',ram:''},state.selectedSeller);
                  if(row)normalizedAlternatives.push(row);
                }catch(error){
                  console.warn('TrendPilot V20.6.6.2 skipped one alternative normalization row',p?.tpid||'',error);
                }
              }

              state.products=normalizedRows;
              state.exact=normalizedRows;
              state.alternatives=normalizedAlternatives;'''

          if old not in s:
              raise SystemExit("broad normalizedRows block not found")
          s=s.replace(old,new,1)

          old_render = r'''            const visible=choices.slice(0,state.shown);
            grid.innerHTML=visible.length?visible.map(tpComparisonChoiceCardV20_6_4).join(''):'<div class="tp-empty"><h3>No master product identity found.</h3><p>Try a model name or choose another seller. Unrelated seller titles are not substituted.</p></div>';'''

          new_render = r'''            const visible=choices.slice(0,state.shown);
            const choiceCards=visible.map(tpComparisonSafeChoiceCardV20_6_4).filter(Boolean).join('');
            grid.innerHTML=choiceCards||'<div class="tp-empty"><h3>No master product identity found.</h3><p>Try a model name or choose another seller. Unrelated seller titles are not substituted.</p></div>';'''

          if old_render not in s:
              raise SystemExit("broad renderer block not found")
          s=s.replace(old_render,new_render,1)

          s=s.replace(
              "visible.map(tpComparisonChoiceCardV20_6_4).join('')",
              "visible.map(tpComparisonSafeChoiceCardV20_6_4).filter(Boolean).join('')"
          )

          s=s.replace(
              "console.error('TrendPilot V20.6.6.1 comparison failed safely',error);",
              "console.error('TrendPilot V20.6.6.2 comparison failed safely',error);"
          )
          s=s.replace("engine:'v20.6.6.1-comparison'","engine:'v20.6.6.2-comparison'")
          s=s.replace("V20.6.6.1 comparison type","V20.6.6.2 comparison type")

          p.write_text(s,encoding="utf-8")

          h=Path("find/index.html")
          hs=h.read_text(encoding="utf-8")
          pat=r'(<script\b[^>]*\bsrc=["\']/js/site-v13-5\.js)(?:\?v=[^"\']*)?(["\'][^>]*></script>)'
          hs,count=re.subn(pat,r'\1?v=20.6.6.2\2',hs,count=1,flags=re.I)
          if count!=1:
              raise SystemExit(f"Finder script cache-bust update matched {count}")
          h.write_text(hs,encoding="utf-8")

          print("V20.6.6.2 browser broad-query recovery installed.")
          PY

      - name: Validate V20.6.6.2 runtime recovery
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js

          grep -q 'TP_V20_6_4_COMPARISON_START' js/site-v13-5.js
          grep -q 'function tpComparisonSafeChoiceCardV20_6_4' js/site-v13-5.js
          grep -q "cache:'no-store'" js/site-v13-5.js
          grep -q "engine:'v20.6.6.2-comparison'" js/site-v13-5.js
          grep -q 'skipped one broad normalization row' js/site-v13-5.js
          grep -q 'choiceCards=visible.map(tpComparisonSafeChoiceCardV20_6_4)' js/site-v13-5.js
          grep -q '/js/site-v13-5.js?v=20.6.6.2' find/index.html

          python3 - <<'PY'
          import json
          from pathlib import Path

          js=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")
          root=Path("data/search-v20-6/comparison-v20-6-4/types")

          start=js.index("async function tpLoadComparisonTypeV20_6_4")
          end=js.index("function tpComparisonVariantV20_6_4",start)
          loader=js[start:end]
          assert "cache:'force-cache'" not in loader
          assert "cache:'no-store'" in loader

          assert "Array.isArray(variant?.offers)?variant.offers:[]" in js
          assert "Array.isArray(product?.variants)?product.variants:[]" in js
          assert "/js/site-v13-5.js?v=20.6.6.2" in html

          for t in ("phone","headphones","perfume"):
              data=json.loads((root/f"{t}.json").read_text(encoding="utf-8"))
              products=data["products"]
              assert products, t
              for p in products[:250]:
                  assert isinstance(p.get("variants"),list), (t,p.get("tpid"))
                  for v in p.get("variants",[]):
                      assert isinstance(v.get("offers"),list), (t,p.get("tpid"),v.get("tpvid"))

          print("V20.6.6.2 broad phone/headphones/perfume package schema PASS")
          print("V20.6.6.2 JavaScript syntax PASS")
          print("V20.6.6.2 no-store comparison loader PASS")
          print("V20.6.6.2 per-product failure isolation PASS")
          print("V20.6.6.2 Finder cache-bust PASS")
          PY

      - name: Commit V20.6.6.2 broad comparison runtime recovery
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "trendpilot-actions"
          git config user.email "actions@users.noreply.github.com"

          git add js/site-v13-5.js find/index.html

          if git diff --cached --quiet; then
            echo "No V20.6.6.2 browser changes to commit."
          else
            git commit -m "Fix TrendPilot V20.6.6.2 broad comparison runtime"
            git push origin HEAD:main
          fi

      - name: Publish V20.6.6.2 summary
        shell: bash
        run: |
          set -euo pipefail

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # TrendPilot V20.6.6.2 — Broad Comparison Runtime Recovery

          **INSTALLED TO MAIN.**

          ## What this fixes
          - Broad `phone`, `headphones`, and `perfume` comparison pages can no longer be destroyed by one malformed/edge product row.
          - Comparison type JSON is fetched with `no-store` and a new `20.6.6.2` cache key.
          - Variant and seller-offer arrays are sanitized before use.
          - Broad products are normalized independently; one bad product is skipped instead of switching the whole page to `comparison package could not be loaded`.
          - Broad choice cards are rendered independently with a safe wrapper.
          - Exact TPID/TPVID comparison behavior is preserved.
          - V19 canonical seller catalogs are not modified.
          - The committed V20.6.6.1 identity/comparison package is not rebuilt.

          ## Retest after the site deploy finishes
          - `https://trendpilotchoice.com/find/?engine=v2064&q=phone`
          - `https://trendpilotchoice.com/find/?engine=v2064&q=headphones`
          - `https://trendpilotchoice.com/find/?engine=v2064&q=perfume`
          - `https://trendpilotchoice.com/find/?engine=v2064&q=OnePlus%207T`

          **V20.6.6.2 BROAD COMPARISON RUNTIME RECOVERY COMPLETE.**
          EOF
