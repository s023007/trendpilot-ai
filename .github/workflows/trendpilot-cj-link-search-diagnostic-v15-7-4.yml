name: TrendPilot CJ Link Search Diagnostic V15.7.4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-cj-link-search-diagnostic-v15-7-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-cj-link-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Install CJ Link Search diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p netlify/functions
          echo '' | base64 -d > netlify/functions/cj-link-search-debug-v15-7-4.mjs

      - name: Validate diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node --check netlify/functions/cj-link-search-debug-v15-7-4.mjs
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          p=Path("netlify/functions/cj-link-search-debug-v15-7-4.mjs")
          text=p.read_text(encoding="utf-8")

          required=[
              "https://link-search.api.cj.com/v2/link-search",
              '"website-id"',
              '"advertiser-ids"',
              '"records-per-page"',
              "rawPreview",
              "tagCounts",
              "firstFive",
              'path: "/api/cj-link-search-debug-v15-7-4"'
          ]

          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit("Missing markers: "+", ".join(missing))

          changed=set(
              subprocess.check_output(
                  ["git","diff","--name-only"],
                  text=True
              ).splitlines()
          )

          allowed={"netlify/functions/cj-link-search-debug-v15-7-4.mjs"}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit(
                  "Unexpected files changed: "+", ".join(sorted(unexpected))
              )

          print("V15.7.4 diagnostic validation passed.")
          print("Only the diagnostic function is changed.")
          print("Products UI, V15.7.3, Admitad, CJ catalog and seller routing remain untouched.")
          PY

      - name: Publish diagnostic only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add netlify/functions/cj-link-search-debug-v15-7-4.mjs
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.7.4 diagnostic is already installed."
            exit 0
          fi

          git commit -m "diagnostic: inspect CJ Link Search response"
          git push origin HEAD:main

          {
            echo "## CJ Link Search Diagnostic V15.7.4"
            echo ""
            echo "No live Products code was modified."
            echo ""
            echo "After Netlify publishes, open:"
            echo 'https://trendpilotchoice.com/api/cj-link-search-debug-v15-7-4?seller=Temu'
          } >> "$GITHUB_STEP_SUMMARY"
