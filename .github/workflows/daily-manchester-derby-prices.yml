name: Daily Manchester Derby Price Refresh

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_manchester_derby_prices.py'
      - '.github/scripts/sync_manchester_derby_event_pages.py'
      - '.github/workflows/daily-manchester-derby-prices.yml'

concurrency:
  group: daily-manchester-derby-prices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: '21098'
      CPANEL_USER: kehwgbpo
      STATIC_ROOT: /home/kehwgbpo/trendpilotchoice.com
      PUBLIC_ORIGIN: https://trendpilotchoice.com
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh source prices
        run: python .github/scripts/update_manchester_derby_prices.py

      - name: Sync localized event price cards
        run: python .github/scripts/sync_manchester_derby_event_pages.py

      - name: Show changes
        run: git diff -- public/guides/manchester-derby-tickets-saudi-arabia/index.html events/manchester-derby-2026/ar/index.html events/manchester-derby-2026/en-gb/index.html .github/data/manchester-derby-prices.json || true

      - name: Commit refreshed prices
        shell: bash
        run: |
          set -euo pipefail
          FILES='public/guides/manchester-derby-tickets-saudi-arabia/index.html events/manchester-derby-2026/ar/index.html events/manchester-derby-2026/en-gb/index.html .github/data/manchester-derby-prices.json'
          if git diff --quiet -- $FILES; then
            echo 'No price-page changes to commit.'
          else
            git config user.name 'trendpilot-price-bot'
            git config user.email '39025908+s023007@users.noreply.github.com'
            git add $FILES
            git commit -m 'chore: refresh Manchester derby prices across landing pages'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo 'NAMECHEAP_SSH_PRIVATE_KEY is missing.'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish guide and localized event pages
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap "mkdir -p '$STATIC_ROOT/guides/manchester-derby-tickets-saudi-arabia' '$STATIC_ROOT/events/manchester-derby-2026/ar' '$STATIC_ROOT/events/manchester-derby-2026/en-gb'"
          scp public/guides/manchester-derby-tickets-saudi-arabia/index.html trendpilot-namecheap:"$STATIC_ROOT/guides/manchester-derby-tickets-saudi-arabia/index.html"
          scp events/manchester-derby-2026/ar/index.html trendpilot-namecheap:"$STATIC_ROOT/events/manchester-derby-2026/ar/index.html"
          scp events/manchester-derby-2026/en-gb/index.html trendpilot-namecheap:"$STATIC_ROOT/events/manchester-derby-2026/en-gb/index.html"
          scp events/manchester-derby-2026/derby-premium-v4.css trendpilot-namecheap:"$STATIC_ROOT/events/manchester-derby-2026/derby-premium-v4.css"

      - name: Verify localized event pages
        shell: bash
        run: |
          set -euo pipefail
          for path in events/manchester-derby-2026/ar/ events/manchester-derby-2026/en-gb/; do
            url="$PUBLIC_ORIGIN/$path?price_refresh=${GITHUB_RUN_ID}"
            ok=0
            for attempt in 1 2 3 4 5; do
              code="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$url&attempt=$attempt" || true)"
              if [ "$code" = '200' ] && grep -qi 'LiveFootballTickets' /tmp/page.html && grep -qi 'Ticombo' /tmp/page.html; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = 1 || { echo "Verification failed: $path"; exit 1; }
          done
          echo 'Localized Manchester derby price pages verified live.'
