name: Daily Manchester Derby Price Refresh

on:
  schedule:
    - cron: '15 2 * * *' # 05:15 Saudi Arabia time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_manchester_derby_prices.py'
      - '.github/workflows/daily-manchester-derby-prices.yml'

concurrency:
  group: daily-manchester-derby-prices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: '21098'
      CPANEL_USER: kehwgbpo
      STATIC_ROOT: /home/kehwgbpo/trendpilotchoice.com
      PUBLIC_ORIGIN: https://trendpilotchoice.com
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh seller prices and EUR/SAR conversions
        run: python .github/scripts/update_manchester_derby_prices.py

      - name: Show changes
        run: git diff -- public/guides/manchester-derby-tickets-saudi-arabia/index.html .github/data/manchester-derby-prices.json || true

      - name: Commit refreshed prices
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/guides/manchester-derby-tickets-saudi-arabia/index.html .github/data/manchester-derby-prices.json; then
            echo 'No price-page changes to commit.'
          else
            git config user.name 'trendpilot-price-bot'
            git config user.email '39025908+s023007@users.noreply.github.com'
            git add public/guides/manchester-derby-tickets-saudi-arabia/index.html .github/data/manchester-derby-prices.json
            git commit -m 'chore: refresh Manchester derby prices'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Validate Namecheap deploy key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo 'NAMECHEAP_SSH_PRIVATE_KEY is missing.'; exit 1; }
          test -f public/guides/manchester-derby-tickets-saudi-arabia/index.html

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 2
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish refreshed guide to Namecheap
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap "test -d '$STATIC_ROOT' && mkdir -p '$STATIC_ROOT/guides/manchester-derby-tickets-saudi-arabia'"
          scp public/guides/manchester-derby-tickets-saudi-arabia/index.html trendpilot-namecheap:"$STATIC_ROOT/guides/manchester-derby-tickets-saudi-arabia/index.html"

      - name: Verify live refreshed guide
        shell: bash
        run: |
          set -euo pipefail
          url="$PUBLIC_ORIGIN/guides/manchester-derby-tickets-saudi-arabia/?price_refresh=${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            code="$(curl -L -sS -o /tmp/guide.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$url&attempt=$attempt" || true)"
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = '200' ] && grep -qi 'ديربي مانشستر' /tmp/guide.html && grep -qi 'آخر تحديث تلقائي للأسعار' /tmp/guide.html && grep -qi 'Sports Events 365' /tmp/guide.html && grep -qi 'Ticombo' /tmp/guide.html; then
              echo 'Live daily price refresh verified on trendpilotchoice.com'
              exit 0
            fi
            sleep 5
          done
          echo 'Daily price refresh did not verify on Namecheap.'
          head -c 700 /tmp/guide.html || true
          exit 1
