name: TrendPilot TikTok Shop Tracking Audit V15.8.1

on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "TrendPilot Choice CJ Company ID"
        required: false
        default: "5917965"
        type: string
      website_pid:
        description: "TrendPilot Choice CJ Website PID"
        required: false
        default: "100655394"
        type: string

permissions:
  contents: read

jobs:
  audit-tiktok-tracking:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CJ_INPUT_COMPANY_ID: ${{ inputs.company_id }}
      CJ_INPUT_WEBSITE_PID: ${{ inputs.website_pid }}
      CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
      CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
      CJ_PAT: ${{ secrets.CJ_PAT }}
      CJ_PERSONAL_ACCESS_TOKEN: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}
      CJ_COMPANY_ID: ${{ secrets.CJ_COMPANY_ID }}
      CJ_CID: ${{ secrets.CJ_CID }}
      CJ_PUBLISHER_CID: ${{ secrets.CJ_PUBLISHER_CID }}
      CJ_WEBSITE_PID: ${{ secrets.CJ_WEBSITE_PID }}
      CJ_PID: ${{ secrets.CJ_PID }}
      CJ_WEBSITE_ID: ${{ secrets.CJ_WEBSITE_ID }}

    steps:
      - name: Inspect TikTok Shop product link tracking
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/tiktok_tracking_audit.py
          python /tmp/tiktok_tracking_audit.py

      - name: Upload tracking audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-shop-tracking-audit-v15-8-1
          path: /tmp/tiktok-shop-tracking-audit-v15-8-1.json
          if-no-files-found: error
          retention-days: 7
