name: Add Dutch Big-Match Pages to Sitemap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-dutch-event-pages-to-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add NL-NL event URLs idempotently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, os, requests
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}'; h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}
          def req(method,url,**kw):
            r=requests.request(method,url,headers=h,timeout=30,**kw); r.raise_for_status(); return r.json() if r.content else {}
          path='events/sitemap.xml'
          item=req('GET',f'{api}/contents/{path}?ref=main')
          text=base64.b64decode(item['content']).decode('utf-8')
          urls=[
            'https://trendpilotchoice.com/events/manchester-derby-2026/nl-nl/',
            'https://trendpilotchoice.com/events/liverpool-v-manchester-united-2026/nl-nl/',
            'https://trendpilotchoice.com/events/el-clasico-2026/nl-nl/',
            'https://trendpilotchoice.com/events/madrid-derby-2026/nl-nl/',
            'https://trendpilotchoice.com/events/north-london-derby-2026/nl-nl/',
            'https://trendpilotchoice.com/events/arsenal-v-manchester-city-2026/nl-nl/',
          ]
          missing=[u for u in urls if u not in text]
          if not missing:
            print('SITEMAP ALREADY CONTAINS ALL DUTCH PAGES'); raise SystemExit(0)
          block=''.join(f'\n  <url><loc>{u}</loc><lastmod>2026-08-30</lastmod><changefreq>daily</changefreq><priority>0.9</priority></url>' for u in missing)
          if '</urlset>' not in text: raise SystemExit('FAIL CLOSED: no urlset close tag')
          text=text.replace('</urlset>',block+'\n</urlset>',1)
          payload={'message':'seo: index Dutch big-match landing pages','content':base64.b64encode(text.encode()).decode(),'sha':item['sha'],'branch':'main'}
          out=req('PUT',f'{api}/contents/{path}',json=payload)
          print('SITEMAP UPDATED:',len(missing),'Dutch URLs')
          print('COMMIT:',out['commit']['sha'])
          PY
