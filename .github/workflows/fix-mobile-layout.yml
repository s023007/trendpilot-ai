          grep -q "style.css?v=3.0.1" compare/joom-vs-aliexpress/index.html

      - name: Commit responsive fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "The mobile patch is already installed."
            exit 0
          fi

          git commit -m "fix: improve mobile product cards and comparison pages"
          git push origin HEAD:main
