          from pathlib import Path
          import re

          css_path = Path("css/style.css")
          css = css_path.read_text(encoding="utf-8")
          patch = Path(__import__("os").environ["RUNNER_TEMP"], "mobile-fit.css").read_text(encoding="utf-8")

          start = "/* === TrendPilot mobile fit patch v3.0.1 — START === */"
          end = "/* === TrendPilot mobile fit patch v3.0.1 — END === */"
          pattern = re.compile(re.escape(start) + r".*?" + re.escape(end) + r"\s*", re.S)

          css = pattern.sub("", css).rstrip() + "\n\n" + patch.strip() + "\n"
          css_path.write_text(css, encoding="utf-8")

          for html_path in Path(".").rglob("*.html"):
              text = html_path.read_text(encoding="utf-8")
              updated = re.sub(
                  r'((?:\.\./)*)css/style\.css(?:\?v=[^"\']*)?',
                  r'\1css/style.css?v=3.0.1',
                  text
              )
              if updated != text:
                  html_path.write_text(updated, encoding="utf-8")
          PY

