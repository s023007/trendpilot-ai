name: TrendPilot TikTok Shop US Live Integration V15.8.4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-tiktok-shop-us-live-v15-8-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-tiktok-shop:
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Integrate TikTok Shop US robustly
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          fn = Path("netlify/functions/cj-live-products.mjs")
          js = Path("js/site-v13-5.js")
          joined = Path("js/cj-joined-sellers.js")
          html = Path("find/index.html")

          for p in (fn, js, joined, html):
              if not p.exists():
                  raise SystemExit(f"Missing required file: {p}")

          f = fn.read_text(encoding="utf-8")
          s = js.read_text(encoding="utf-8")
          j = joined.read_text(encoding="utf-8")
          h = html.read_text(encoding="utf-8")

          if '"TikTok Shop US"' not in f:
              old = '  "Karaca EU": { advertiserId: "5893489", adIds: ["15171094"] }\n};'
              new = '  "Karaca EU": { advertiserId: "5893489", adIds: ["15171094"] },\n  "TikTok Shop US": { advertiserId: "7563286", adIds: ["17099898"], strictProductTracking: true, disableLinkSearch: true }\n};'
              if old not in f:
                  raise SystemExit("TikTok seller insertion point not found.")
              f = f.replace(old, new, 1)

          if 'return "TikTok Shop US"' not in f:
              old = '  if (["karaca eu","karaca europe","karaca"].includes(raw)) return "Karaca EU";\n'
              if old not in f:
                  raise SystemExit("canonicalSeller insertion point not found.")
              f = f.replace(
                  old,
                  old + '  if (["tiktok shop us","tiktok shop","tiktok","tiktokshop"].includes(raw)) return "TikTok Shop US";\n',
                  1
              )

          if "cfg.strictProductTracking && !trackedProductUrl" not in f:
              pat = re.compile(
                  r'(const trackedProductUrl\s*=\s*\n\s*isCjTrackingUrl\(productClickUrl\)\s*\?\s*productClickUrl\s*:\s*"";\s*\n)'
              )
              m = pat.search(f)
              if not m:
                  raise SystemExit("trackedProductUrl block not found in current cj-live-products.mjs.")
              insertion = m.group(1) + '\n      if (cfg.strictProductTracking && !trackedProductUrl) return null;\n'
              f = f[:m.start()] + insertion + f[m.end():]

          if "SELLERS[seller]?.disableLinkSearch" not in f:
              pat = re.compile(
                  r'(const rows = Array\.isArray\(result\?\.resultList\) \? result\.resultList : \[\];\s*\n)(\s*const hasMissingProductClickUrl)'
              )
              m = pat.search(f)
              if not m:
                  raise SystemExit("fallback rows block not found.")
              replacement = (
                  m.group(1)
                  + '\n        if (SELLERS[seller]?.disableLinkSearch) return [seller, null];\n\n'
                  + m.group(2)
              )
              f = f[:m.start()] + replacement + f[m.end():]

          f = f.replace("TrendPilotLiveSearchV1573", "TrendPilotLiveSearchV1584")
          f = f.replace("TrendPilot-CJ-Live-Search/15.7.3", "TrendPilot-CJ-Live-Search/15.8.4")
          f = f.replace("TrendPilot-CJ-Link-Fallback/15.7.3", "TrendPilot-CJ-Link-Fallback/15.8.4")
          f = f.replace('"15.7.3"', '"15.8.4"')
          f = f.replace("|15.7.3`", "|15.8.4`")
          f = f.replace("V15.7.3 failed", "V15.8.4 failed")

          def append_to_set(text, const_name, item):
              pat = re.compile(rf'(const {re.escape(const_name)} = new Set\(\[)(.*?)(\]\);)')
              m = pat.search(text)
              if not m:
                  raise SystemExit(f"{const_name} not found.")
              if item in m.group(2):
                  return text
              middle = m.group(2).rstrip()
              if middle:
                  middle += ", "
              middle += item
              return text[:m.start(2)] + middle + text[m.end(2):]

          s = append_to_set(s, "TP_CJ_APPROVED_IDS", '"7563286"')
          s = append_to_set(s, "TP_CJ_APPROVED_NAMES", '"tiktokshopus"')
          s = append_to_set(s, "TP_CJ_KNOWN_NAMES", '"tiktokshopus"')
          s = append_to_set(s, "TP_CJ_LIVE_SELLERS_V15_7_1", '"TikTok Shop US"')

          if '"TikTok Shop US"' not in s[s.find("TP_PRODUCT_SELLERS_V15_1"):s.find("TP_PRODUCT_SELLERS_V15_1")+500]:
              old = '"PandaHall","Temu"];'
              if old not in s:
                  raise SystemExit("Product seller list insertion point not found.")
              s = s.replace(old, '"PandaHall","TikTok Shop US","Temu"];', 1)

          if '"tiktok shop us":"TikTok Shop US"' not in s:
              old = '    "pandahall":"PandaHall","panda hall":"PandaHall",\n    "temu":"Temu","temu.com":"Temu","shop temu":"Temu"'
              new = '    "pandahall":"PandaHall","panda hall":"PandaHall",\n    "tiktok":"TikTok Shop US","tiktok shop":"TikTok Shop US","tiktok shop us":"TikTok Shop US","tiktokshop":"TikTok Shop US",\n    "temu":"Temu","temu.com":"Temu","shop temu":"Temu"'
              if old not in s:
                  raise SystemExit("Seller aliases insertion point not found.")
              s = s.replace(old, new, 1)

          if '"TikTok Shop US":[]' not in s:
              old = '    "Sunsky-online WW":["phones-tablets","computers","audio","cameras","projectors-tv","smart-home","automotive","home-kitchen","tools"],\n    "Temu":[]'
              new = '    "Sunsky-online WW":["phones-tablets","computers","audio","cameras","projectors-tv","smart-home","automotive","home-kitchen","tools"],\n    "TikTok Shop US":[],\n    "Temu":[]'
              if old not in s:
                  raise SystemExit("Seller specialty insertion point not found.")
              s = s.replace(old, new, 1)

          if "TP_CJ_LIVE_SELLERS_V15_7_1.has(selected)" not in s[s.find("function initFinder"):]:
              old = """      if(x.matches('[data-filter-merchant]')&&x.value&&typeof tpLoadSellerSpecificV15_1==="function"){
                const selected=x.value;
                state.loading=true;
                renderFinder();
                await tpLoadSellerSpecificV15_1(selected);
                state.loading=false;
                populateFilters();
                const merchant=$('[data-filter-merchant]');
                if(merchant)merchant.value=selected;
              }"""
              new = """      if(x.matches('[data-filter-merchant]')&&x.value&&typeof tpLoadSellerSpecificV15_1==="function"){
                const selected=tpCanonicalSellerV15_1(x.value)||x.value;
                state.loading=true;
                renderFinder();
                if(TP_CJ_LIVE_SELLERS_V15_7_1.has(selected)){
                  const liveRows=await tpLoadCjLiveProductsV15_7_1(state.query,selected);
                  if(Array.isArray(liveRows)&&liveRows.length)mergeProducts(liveRows);
                }else{
                  await tpLoadSellerSpecificV15_1(selected);
                }
                state.loading=false;
                populateFilters();
                const merchant=$('[data-filter-merchant]');
                if(merchant)merchant.value=selected;
              }"""
              if old not in s:
                  raise SystemExit("Seller change handler not found.")
              s = s.replace(old, new, 1)

          m = re.search(r'window\.TRENDPILOT_CJ_JOINED_SELLERS=\[(.*?)\];', j)
          if not m:
              raise SystemExit("Joined sellers array not found.")
          if '"TikTok Shop US"' not in m.group(1):
              middle = m.group(1).rstrip()
              middle = middle + ("," if middle else "") + '"TikTok Shop US"'
              j = j[:m.start(1)] + middle + j[m.end(1):]

          m = re.search(r'window\.TRENDPILOT_CJ_KNOWN_SELLERS=\[(.*?)\];', j)
          if not m:
              raise SystemExit("Known sellers array not found.")
          if '"tiktok shop us"' not in m.group(1).lower():
              middle = m.group(1).rstrip()
              middle = middle + ("," if middle else "") + '"tiktok","tiktok shop","tiktok shop us","tiktokshop"'
              j = j[:m.start(1)] + middle + j[m.end(1):]

          h = re.sub(
              r'/js/cj-joined-sellers\.js\?v=[^"]+',
              '/js/cj-joined-sellers.js?v=15.8.4',
              h,
              count=1
          )
          h = re.sub(
              r'/js/site-v13-5\.js\?v=[^"]+',
              '/js/site-v13-5.js?v=15.8.4',
              h,
              count=1
          )

          fn.write_text(f.rstrip()+"\n", encoding="utf-8")
          js.write_text(s.rstrip()+"\n", encoding="utf-8")
          joined.write_text(j.rstrip()+"\n", encoding="utf-8")
          html.write_text(h.rstrip()+"\n", encoding="utf-8")

          print("V15.8.4 patch applied.")
          PY

      - name: Validate V15.8.4
        shell: bash
        run: |
          set -euo pipefail

          node --check netlify/functions/cj-live-products.mjs
          node --check js/site-v13-5.js
          node --check js/cj-joined-sellers.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          fn=Path("netlify/functions/cj-live-products.mjs").read_text(encoding="utf-8")
          js=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          joined=Path("js/cj-joined-sellers.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")

          checks = {
              "TikTok seller in CJ API": '"TikTok Shop US": { advertiserId: "7563286", adIds: ["17099898"]' in fn,
              "TikTok canonical seller": 'return "TikTok Shop US"' in fn,
              "Strict tracked-product rule": "cfg.strictProductTracking && !trackedProductUrl" in fn,
              "TikTok Link Search disabled": "SELLERS[seller]?.disableLinkSearch" in fn,
              "TikTok approved advertiser ID": '"7563286"' in js,
              "TikTok approved seller key": '"tiktokshopus"' in js,
              "TikTok seller dropdown": '"TikTok Shop US"' in js[js.find("TP_PRODUCT_SELLERS_V15_1"):js.find("TP_PRODUCT_SELLERS_V15_1")+500],
              "TikTok seller aliases": '"tiktok shop us":"TikTok Shop US"' in js,
              "TikTok live CJ seller": '"TikTok Shop US"' in js[js.find("TP_CJ_LIVE_SELLERS_V15_7_1"):js.find("TP_CJ_LIVE_SELLERS_V15_7_1")+400],
              "Live fetch after seller selection": "TP_CJ_LIVE_SELLERS_V15_7_1.has(selected)" in js[js.find("function initFinder"):],
              "TikTok joined seller": '"TikTok Shop US"' in joined,
              "Finder JS cache bust": "/js/site-v13-5.js?v=15.8.4" in html,
              "Joined sellers cache bust": "/js/cj-joined-sellers.js?v=15.8.4" in html,
          }

          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + name)

          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Validation failed: "+", ".join(failed))

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={
              "netlify/functions/cj-live-products.mjs",
              "js/site-v13-5.js",
              "js/cj-joined-sellers.js",
              "find/index.html",
          }
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))

          print("")
          print("SAFETY:")
          print("- TikTok advertiser: 7563286")
          print("- TikTok feed: 17099898")
          print("- Only CJ-tracked linkCode.clickUrl rows are allowed")
          print("- Direct TikTok destination-only rows are rejected")
          print("- No TikTok Link Search fallback")
          print("- Admitad and CPC routing untouched")
          PY

      - name: Publish V15.8.4
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             netlify/functions/cj-live-products.mjs             js/site-v13-5.js             js/cj-joined-sellers.js             find/index.html

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.8.4 is already installed."
            exit 0
          fi

          git commit -m "feat: integrate tracked TikTok Shop US products"
          git push origin HEAD:main

          {
            echo "## TikTok Shop US Live Integration V15.8.4"
            echo ""
            echo "TikTok Shop US has been added safely."
            echo ""
            echo "- CID: 7563286"
            echo "- Main feed adId: 17099898"
            echo "- Only CJ-tracked product linkCode rows are exposed"
            echo "- Destination-only TikTok URLs are rejected"
            echo "- Admitad and CPC logic unchanged"
            echo ""
            echo "After Netlify publishes, test:"
            echo "https://trendpilotchoice.com/api/cj-live-products?q=phone&seller=TikTok%20Shop%20US"
          } >> "$GITHUB_STEP_SUMMARY"
