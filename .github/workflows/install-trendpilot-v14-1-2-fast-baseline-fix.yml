                  page = re.sub(r'/js/smart-suggestions-v14\.js\?v=[^"\']+', '/js/smart-suggestions-v14.js?v=14.1.2', page, count=1)
              elif "</body>" in page:
                  page = page.replace("</body>", '<script defer src="/js/smart-suggestions-v14.js?v=14.1.2"></script>\n</body>', 1)
              page = re.sub(r'/css/decision-v14\.css\?v=[^"\']+', '/css/decision-v14.css?v=14.1.2', page)
              page_path.write_text(page, encoding="utf-8")

          # ================================================================
          # I. Internal CPC helper
          # ================================================================
          monetization_js = r'''
          (() => {
            "use strict";
            let cache=null;
            async function config(){if(cache)return cache;try{const r=await fetch(`/data/monetization-routing-v14-1.json?v=14.1-${Date.now()}`,{cache:"no-store"});cache=r.ok?await r.json():{};}catch{cache={};}return cache;}
            window.TP_MONETIZATION_V141={
              async modelFor(text){const data=await config(),q=String(text||"").toLowerCase();for(const p of data.programs||[]){const names=[p.seller,...(p.aliases||[])].map(x=>String(x||"").toLowerCase());if(names.some(x=>x&&q.includes(x)))return p.model||"";}return"";},
              async tieBreak(a,b){const ma=await this.modelFor(a?.seller||a?.advertiser||a?.brand||""),mb=await this.modelFor(b?.seller||b?.advertiser||b?.brand||"");const score=m=>m==="CPC"?2:m==="CPC-candidate"?1:0;return score(mb)-score(ma);}
            };
          })();
          '''
          (JS / "monetization-v14-1.js").write_text("\n".join(line.rstrip() for line in monetization_js.strip().splitlines()) + "\n", encoding="utf-8")

          for page_path in (ROOT / "find" / "index.html", ROOT / "wholesale" / "index.html"):
              page = page_path.read_text(encoding="utf-8")
              page = re.sub(r'\s*<script[^>]+src="/js/monetization-v14-1\.js[^"]*"[^>]*></script>\s*', "\n", page, count=1)
              if "</body>" in page:
                  page = page.replace("</body>", '<script defer src="/js/monetization-v14-1.js?v=14.1.2"></script>\n</body>', 1)
              page_path.write_text(page, encoding="utf-8")

          report = {
              "version": VERSION,
              "suggestions": {
                  "indexedTerms": len(suggestions),
                  "lettersWithAtLeast12": sum(1 for v in by_letter.values() if len(v) >= 12),
                  "oldViewAllRemoved": True,
                  "maxVisibleRows": 7,
                  "amazonStyle": True,
              },
              "tickets": {
                  "rawRoutes": len(raw_events),
                  "cleanRoutes": len(routes),
                  "searchEntities": len(entity_map),
                  "teamToCompetitionFallback": True,
                  "inventoryFile": "data/ticket-inventory.json",
              },
              "monetization": {
                  "cpcTieBreakOnly": True,
                  "publicCpcBadge": False,
                  "programsDetectedOrHinted": len(monetization["programs"]),
              },
          }
          (DATA / "v14-1-install-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Validate V14.1 experience
        shell: bash
        run: |
          set -euo pipefail

          node --check js/smart-suggestions-v14.js
          node --check js/ticket-decision-v14.js
          node --check js/ticket-detail-v14.js
          node --check js/monetization-v14-1.js
          git diff --check

          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(ok, message):
              if not ok:
                  raise SystemExit("Validation failed: " + message)

          s = json.loads(Path("data/search-suggestions-v14-1.json").read_text(encoding="utf-8"))
          t = json.loads(Path("data/ticket-discovery-v14-1.json").read_text(encoding="utf-8"))
          m = json.loads(Path("data/monetization-routing-v14-1.json").read_text(encoding="utf-8"))
          report = json.loads(Path("data/v14-1-install-report.json").read_text(encoding="utf-8"))
          smart = Path("js/smart-suggestions-v14.js").read_text(encoding="utf-8")
          ticket = Path("js/ticket-decision-v14.js").read_text(encoding="utf-8")
          css = Path("css/decision-v14.css").read_text(encoding="utf-8")
          tickets_page = Path("tickets/index.html").read_text(encoding="utf-8")

          require(s.get("version") == "14.1.2", "suggestion index version")
          require(len(s.get("byLetter", {})) == 26, "all 26 English letters must exist")
          require(len(s["byLetter"].get("b", [])) >= 6, "B suggestions are too sparse")
          require(len(s["byLetter"].get("p", [])) >= 6, "P suggestions are too sparse")
          require("tp-amazon-row" in smart, "Amazon-style rows missing")
          require("View all" not in smart, "old blue View all button still exists")
          require("tp-smart-suggestions{display:none!important}" in css, "old V14 popup is not retired")

          require(t.get("version") == "14.1.2", "ticket discovery version")
          require(t.get("routeCount", 0) >= 10, "ticket route set unexpectedly small")
          entities = {str(x.get("value","")).lower() for x in t.get("entities", [])}
          require("premier league" in entities, "Premier League entity missing")
          require("arsenal" in entities, "Arsenal fallback entity missing")
          require("expandedRouteIds" in ticket, "ticket team-to-competition fallback missing")
          require("Event-first ticket comparison" in tickets_page, "new ticket hero missing")
          require("One query, not four marketplace tabs." in tickets_page, "event-first ticket UX missing")

          require(m.get("policy", {}).get("relevanceFirst") is True, "relevance-first monetization rule missing")
          require(m.get("policy", {}).get("cpcTieBreakOnly") is True, "CPC tie-break policy missing")
          require(m.get("policy", {}).get("publicCpcBadge") is False, "CPC should not be claimed publicly without evidence")

          print(json.dumps(report, indent=2))
          PY

          {
            echo "## TrendPilot V14.1.2"
            echo ""
            echo "- Fast mode / no concurrency lock: **enabled**"
            echo "- Amazon-style autocomplete: **installed**"
            echo "- Old blue View-all suggestion button: **removed**"
            echo "- A-Z product suggestion index: **installed**"
            echo "- Ticket page: **event-first rebuild**"
            echo "- Team → competition safe fallback: **installed**"
            echo "- CPC monetization: **relevance-first tie-break layer installed**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish V14.1 only if main has not changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          CURRENT_REMOTE="$(git rev-parse origin/main)"
          if [[ "$CURRENT_REMOTE" != "$TP_BASE_SHA" ]]; then
            echo "main changed while V14.1 was building."
            echo "Expected: $TP_BASE_SHA"
            echo "Current:  $CURRENT_REMOTE"
            echo "Nothing was pushed. Run the workflow again on the newest main."
            exit 1
          fi

          files=(
            "data/search-suggestions-v14-1.json"
            "data/ticket-discovery-v14-1.json"
            "data/monetization-routing-v14-1.json"
            "data/v14-1-install-report.json"
            "js/smart-suggestions-v14.js"
            "js/ticket-decision-v14.js"
            "js/ticket-detail-v14.js"
            "js/monetization-v14-1.js"
            "css/decision-v14.css"
            "find/index.html"
            "wholesale/index.html"
            "tickets/index.html"
            "ticket/index.html"
          )

          present=()
          for f in "${files[@]}"; do
            [[ -e "$f" ]] && present+=("$f")
          done

          git add -- "${present[@]}"
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V14.1 is already present on main."
            exit 0
          fi

          git commit -m "feat: V14.1 Amazon search ticket rebuild and CPC routing"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "TrendPilot V14.1.2 pushed successfully."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; refreshing main."
            git fetch origin main --depth=1
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Unable to push V14.1.2 after three attempts."
          exit 1
