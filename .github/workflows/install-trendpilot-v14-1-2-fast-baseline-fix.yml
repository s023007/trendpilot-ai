name: Install TrendPilot V14.1.2 Fast Baseline Fix, Amazon Search, Ticket Rebuild and CPC Routing

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  install-v14-1:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Record starting revision
        shell: bash
        run: |
          set -euo pipefail
          echo "TP_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"


      - name: Build V14.1 search ticket and monetization layer
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          from collections import Counter
          from pathlib import Path
          from typing import Any

          VERSION = "14.1.2"
          ROOT = Path(".")
          DATA = ROOT / "data"
          JS = ROOT / "js"
          CSS = ROOT / "css"

          required = [
              ROOT / "find" / "index.html",
              ROOT / "tickets" / "index.html",
              ROOT / "wholesale" / "index.html",
              DATA / "ticket-events.json",
              CSS / "decision-v14.css",
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(
                  "V14.1.2 baseline is missing a required source page/data file: "
                  + ", ".join(missing)
              )

          def clean(value: Any) -> str:
              return re.sub(r"\s+", " ", html.unescape(str(value or ""))).strip()

          def low(value: Any) -> str:
              return clean(value).lower()

          def valid_url(value: Any) -> bool:
              return bool(re.match(r"^https?://", clean(value), flags=re.I))

          def read_json(path: Path, default: Any) -> Any:
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          # ================================================================
          # A. Amazon-style search suggestion index
          # ================================================================
          generic_categories = [
              "backpack", "bags", "baby products", "beauty products",
              "bluetooth speakers", "blood pressure monitor", "books",
              "battery charger", "bedroom furniture", "bathroom accessories",
              "phone cases", "power banks", "perfume", "printers", "projectors",
              "pencil case", "pet supplies", "portable charger", "phone accessories",
              "smart watches", "school supplies", "shoes", "security cameras",
              "storage organizers", "sports equipment", "skin care",
              "wireless earbuds", "wifi router", "watches", "women clothing",
              "laptops", "led lights", "lenovo laptops", "luggage",
              "tools", "toys", "tablets", "t-shirts", "travel accessories",
              "home and kitchen", "headphones", "hair care", "handbags",
              "car accessories", "cameras", "computer accessories", "cookware",
              "office supplies", "outdoor equipment", "gaming accessories",
              "jewelry", "kitchen appliances", "medical equipment",
          ]

          catalog_products: list[dict[str, Any]] = []

          # FAST MODE: reuse the already-built suggestion cache instead of
          # opening every search-catalog shard on each workflow run.
          old_suggestions = read_json(DATA / "search-suggestions-v14.json", {})
          if not old_suggestions:
              old_suggestions = read_json(DATA / "search-suggestions.json", {})

          cj_payload = read_json(DATA / "cj-products.json", {})
          if isinstance(cj_payload, dict):
              for row in cj_payload.get("products", []):
                  if isinstance(row, dict):
                      catalog_products.append(row)

          term_score: Counter[str] = Counter()
          term_image: dict[str, str] = {}
          term_meta: dict[str, str] = {}

          def add_term(term: Any, score: int, *, image: str = "", meta: str = "") -> None:
              value = clean(term)
              if len(value) < 2 or len(value) > 68:
                  return
              if "http://" in value.lower() or "https://" in value.lower():
                  return
              if len(re.findall(r"\d", value)) > max(7, len(value) // 2):
                  return
              key = value.lower()
              term_score[key] += score
              if key not in term_meta and meta:
                  term_meta[key] = clean(meta)[:42]
              if key not in term_image and valid_url(image):
                  term_image[key] = image

          for phrase in generic_categories:
              add_term(phrase, 18, meta="Popular search")

          if isinstance(old_suggestions, dict):
              old_rows = (
                  old_suggestions.get("top")
                  or old_suggestions.get("suggestions")
                  or old_suggestions.get("items")
                  or []
              )
              if isinstance(old_rows, list):
                  for row in old_rows[:2500]:
                      if isinstance(row, str):
                          add_term(row, 12, meta="Popular search")
                      elif isinstance(row, dict):
                          add_term(
                              row.get("value") or row.get("term") or row.get("name") or row.get("title"),
                              int(row.get("score") or 10),
                              image=clean(row.get("image")),
                              meta=clean(row.get("meta") or row.get("seller") or "Search"),
                          )

          for row in catalog_products[:24000]:
              name = clean(row.get("name") or row.get("title"))
              image = clean(row.get("image") or row.get("imageUrl") or row.get("imageLink"))
              seller = clean(
                  row.get("advertiser")
                  or row.get("seller")
                  or row.get("merchant")
                  or row.get("store")
                  or row.get("brand")
              )
              add_term(name, 8, image=image, meta=seller or "Product")
              for field in ("brand", "category", "subcategory", "group", "family"):
                  value = clean(row.get(field))
                  if value and value.lower() not in {"other", "all", "unknown"}:
                      add_term(value.replace("-", " "), 5, meta="Category")

              words = re.findall(r"[A-Za-z][A-Za-z0-9'+-]{2,}", name)
              if 2 <= len(words) <= 14:
                  for n in (2, 3):
                      for i in range(0, len(words) - n + 1):
                          phrase = " ".join(words[i:i+n])
                          if 5 <= len(phrase) <= 40:
                              add_term(phrase, 1, image=image, meta=seller or "Product")

          suggestions = [
              {
                  "value": key,
                  "score": score,
                  "image": term_image.get(key, ""),
                  "meta": term_meta.get(key, "Search"),
              }
              for key, score in term_score.most_common(5000)
          ]

          by_letter: dict[str, list[dict[str, Any]]] = {}
          for letter in "abcdefghijklmnopqrstuvwxyz":
              rows = [x for x in suggestions if x["value"].startswith(letter)]
              if len(rows) < 12:
                  for phrase in generic_categories:
                      if phrase.startswith(letter) and not any(x["value"] == phrase for x in rows):
                          rows.append({"value": phrase, "score": 12, "image": "", "meta": "Popular search"})
              rows.sort(key=lambda x: (-int(x["score"]), len(x["value"]), x["value"]))
              by_letter[letter] = rows[:60]

          (DATA / "search-suggestions-v14-1.json").write_text(
              json.dumps(
                  {"version": VERSION, "count": len(suggestions), "byLetter": by_letter, "top": suggestions[:300]},
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          # ================================================================
          # B. Ticket discovery index
          # ================================================================
          ticket_payload = read_json(DATA / "ticket-events.json", {})
          raw_events = ticket_payload.get("events") or []
          if not isinstance(raw_events, list):
              raw_events = []

          def clean_ticket_title(value: Any) -> str:
              text = clean(value)
              text = re.sub(r"^SportsEvents365\.com\s*-\s*", "", text, flags=re.I)
              text = re.sub(r"^PL\s*[–-]\s*", "", text, flags=re.I)
              text = re.sub(r"\s*[–-]\s*(120x600|250x250|728x90)\s*$", "", text, flags=re.I)
              text = re.sub(r"\s+Tickets?$", "", text, flags=re.I)
              text = re.sub(r"\s+", " ", text).strip(" -–")
              replacements = {
                  "Champion League": "Champions League",
                  "English Premier League": "Premier League",
                  "Spanish La Liga": "La Liga",
                  "Italian Serie A": "Serie A",
              }
              return replacements.get(text, text)

          route_seen: dict[str, dict[str, Any]] = {}
          for row in raw_events:
              if not isinstance(row, dict):
                  continue
              title = clean_ticket_title(row.get("title"))
              provider = clean(row.get("provider"))
              destination = clean(row.get("destination"))
              url = clean(row.get("url"))
              if not title or not valid_url(url):
                  continue
              if title.lower() in {
                  "sportsevents365.com", "home page", "homepage",
                  "trip.com at homepage", "trip.com austria homepage",
                  "trip.com australia homepage", "trip.com be homepage",
              }:
                  continue
              key = f"{provider.lower()}|{title.lower()}|{destination.lower()}"
              if key not in route_seen:
                  route_seen[key] = {
                      "id": clean(row.get("id")) or "ticket-" + hashlib.sha256(key.encode()).hexdigest()[:20],
                      "title": title,
                      "provider": provider,
                      "type": clean(row.get("type")) or "events",
                      "description": clean(row.get("description")),
                      "url": url,
                      "destination": destination if valid_url(destination) else "",
                      "price": row.get("price"),
                      "currency": clean(row.get("currency")),
                      "date": clean(row.get("date")),
                      "venue": clean(row.get("venue")),
                      "section": clean(row.get("section")),
                      "row": clean(row.get("row")),
                      "source": clean(row.get("source")),
                      "aliases": [],
                  }

          routes = list(route_seen.values())
          league_aliases = {
              "premier league": [
                  "arsenal", "liverpool", "chelsea", "tottenham", "spurs",
                  "manchester city", "man city", "manchester united", "man united",
                  "newcastle", "aston villa", "west ham", "everton",
              ],
              "la liga": [
                  "real madrid", "barcelona", "atletico madrid", "sevilla",
                  "real betis", "athletic bilbao",
              ],
              "serie a": [
                  "juventus", "inter milan", "inter", "ac milan", "milan",
                  "napoli", "roma", "lazio",
              ],
              "champions league": ["uefa champions league", "champions league", "ucl"],
              "formula 1": ["f1", "formula one", "grand prix", "motorsport"],
          }

          discovered_entities: list[dict[str, Any]] = []
          for row in routes:
              blob = low(f'{row["title"]} {row.get("description","")} {row.get("destination","")}')
              aliases = {row["title"]}
              for league, names in league_aliases.items():
                  if league in blob or (league == "champions league" and "champion league" in blob):
                      aliases.add(league.title())
                      aliases.update(name.title() for name in names)
              row["aliases"] = sorted(aliases)
              for alias in row["aliases"]:
                  discovered_entities.append(
                      {
                          "value": alias,
                          "routeId": row["id"],
                          "routeTitle": row["title"],
                          "provider": row["provider"],
                          "type": row["type"],
                      }
                  )

          entity_map: dict[str, dict[str, Any]] = {}
          for entity in discovered_entities:
              k = low(entity["value"])
              if not k:
                  continue
              candidate = entity_map.get(k)
              direct = low(entity["routeTitle"]) == k
              if candidate is None or direct:
                  entity_map[k] = entity

          (DATA / "ticket-discovery-v14-1.json").write_text(
              json.dumps(
                  {
                      "version": VERSION,
                      "routeCount": len(routes),
                      "entityCount": len(entity_map),
                      "routes": routes,
                      "entities": sorted(entity_map.values(), key=lambda x: (low(x["value"]), low(x["provider"]))),
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          # ================================================================
          # C. CPC-aware monetization routing: relevance first, CPC tie-break
          # ================================================================
          cpc_hint_aliases = {
              "Alibaba": ["alibaba", "alibaba.com"],
              "AliExpress": ["aliexpress", "ali express", "aliexpress.com"],
              "Geekbuying": ["geekbuying", "geek buying"],
          }
          detected_models: dict[str, dict[str, Any]] = {}

          for row in catalog_products[:24000]:
              blob = low(
                  " ".join(
                      str(row.get(k) or "")
                      for k in (
                          "advertiser", "seller", "merchant", "brand", "network",
                          "program", "commissionType", "earningModel", "paymentModel", "source",
                      )
                  )
              )
              seller = clean(row.get("advertiser") or row.get("seller") or row.get("merchant") or row.get("brand"))
              if not seller:
                  continue
              if re.search(r"\bcpc\b|cost per click|pay per click", blob):
                  detected_models.setdefault(seller.lower(), {"seller": seller, "model": "CPC", "evidence": "catalog metadata"})
              elif re.search(r"\bcpa\b|\bcps\b|commission|sale", blob):
                  detected_models.setdefault(seller.lower(), {"seller": seller, "model": "CPA/CPS", "evidence": "catalog metadata"})

          for seller, aliases in cpc_hint_aliases.items():
              detected_models.setdefault(
                  seller.lower(),
                  {
                      "seller": seller,
                      "model": "CPC-candidate",
                      "evidence": "project monetization routing hint; verify network terms",
                      "aliases": aliases,
                  },
              )

          monetization = {
              "version": VERSION,
              "policy": {
                  "relevanceFirst": True,
                  "cpcTieBreakOnly": True,
                  "publicCpcBadge": False,
                  "note": (
                      "CPC is only a tie-break between similarly relevant eligible routes. "
                      "It never makes an irrelevant result outrank a relevant result. "
                      "Network terms remain the source of truth."
                  ),
              },
              "programs": sorted(detected_models.values(), key=lambda x: low(x.get("seller"))),
          }
          (DATA / "monetization-routing-v14-1.json").write_text(
              json.dumps(monetization, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # ================================================================
          # D. Amazon-style autocomplete runtime
          # ================================================================
          smart_js = r'''
          (() => {
            "use strict";
            const d=document,$=(s,r=d)=>r.querySelector(s);
            const clean=v=>String(v??"").replace(/\s+/g," ").trim();
            const low=v=>clean(v).toLowerCase();
            const esc=v=>clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
            let productIndex=null,ticketIndex=null,activeInput=null,panel=null,openSeq=0;

            async function json(url,fallback){
              try{const r=await fetch(`${url}?v=14.1-${Date.now()}`,{cache:"no-store"});return r.ok?await r.json():fallback;}
              catch{return fallback;}
            }
            async function products(){return productIndex||(productIndex=json("/data/search-suggestions-v14-1.json",{}));}
            async function tickets(){return ticketIndex||(ticketIndex=json("/data/ticket-discovery-v14-1.json",{}));}
            function context(){return location.pathname.startsWith("/tickets")?"ticket":"product";}
            function host(input){
              const h=input.closest(".tp-search-input,.tp-ticket-v141-search,.tp-wholesale-search,form,label")||input.parentElement;
              if(h)h.classList.add("tp-amazon-search-host");
              return h;
            }
            function ensure(input){
              const h=host(input);let p=h?.querySelector(":scope > .tp-amazon-suggest");
              if(!p){p=d.createElement("div");p.className="tp-amazon-suggest";p.hidden=true;p.innerHTML='<div class="tp-amazon-list" role="listbox"></div>';h?.appendChild(p);}
              return p;
            }
            function icon(row){return row.image?`<span class="tp-amazon-thumb"><img src="${esc(row.image)}" alt="" loading="lazy"></span>`:'<span class="tp-amazon-search-icon" aria-hidden="true">⌕</span>';}
            function rank(rows,q){
              const l=low(q),parts=l.split(/\s+/).filter(Boolean);
              return rows.filter(x=>{const v=low(x.value);return v.startsWith(l)||parts.every(p=>v.includes(p));})
                .sort((a,b)=>{const av=low(a.value),bv=low(b.value),ap=av.startsWith(l)?0:1,bp=bv.startsWith(l)?0:1;return ap-bp+(b.score||0)-(a.score||0)+a.value.length-b.value.length;});
            }
            async function getRows(input){
              const q=low(input.value);if(!q)return[];
              if(context()==="ticket"){
                const data=await tickets(),entities=Array.isArray(data.entities)?data.entities:[];
                return entities.filter(x=>low(x.value).startsWith(q)||low(x.value).includes(q))
                  .sort((a,b)=>{const ap=low(a.value).startsWith(q)?0:1,bp=low(b.value).startsWith(q)?0:1;return ap-bp+a.value.length-b.value.length;})
                  .slice(0,7)
                  .map(x=>({value:x.value,meta:x.routeTitle||x.provider||"Tickets",routeId:x.routeId||"",image:""}));
              }
              const data=await products();let pool=[];
              if(q.length===1&&data.byLetter)pool=data.byLetter[q[0]]||[];
              else pool=Array.isArray(data.top)?data.top:[];
              if(q.length>1&&data.byLetter)pool=[...(data.byLetter[q[0]]||[]),...pool];
              const seen=new Set(),rows=[];
              for(const x of rank(pool,q)){const k=low(x.value);if(!k||seen.has(k))continue;seen.add(k);rows.push(x);if(rows.length>=7)break;}
              return rows;
            }
            function close(){openSeq++;if(panel)panel.hidden=true;panel=null;activeInput=null;}
            function submit(input,value,row){
              input.value=value;input.dispatchEvent(new Event("input",{bubbles:true}));close();
              if(context()==="ticket"){
                const url=new URL(location.href);url.searchParams.set("q",value);if(row?.routeId)url.searchParams.set("route",row.routeId);history.replaceState(null,"",url);
                input.dispatchEvent(new CustomEvent("tp:ticket-query",{bubbles:true,detail:{value,routeId:row?.routeId||""}}));input.form?.requestSubmit?.();return;
              }
              if(input.form){input.form.requestSubmit?.();return;}
              location.href=`/find/?q=${encodeURIComponent(value)}`;
            }
            async function render(input){
              const seq=++openSeq,q=clean(input.value);if(!q){close();return;}
              const rows=await getRows(input);if(seq!==openSeq)return;
              activeInput=input;panel=ensure(input);const list=$(".tp-amazon-list",panel);
              list.innerHTML=rows.map((row,i)=>`<button type="button" class="tp-amazon-row" role="option" data-i="${i}" data-value="${esc(row.value)}">${icon(row)}<span class="tp-amazon-copy"><b>${esc(row.value)}</b>${row.meta?`<small>${esc(row.meta)}</small>`:""}</span></button>`).join("");
              panel._rows=rows;panel.hidden=rows.length===0;
            }
            const selector='input[type="search"],input[name="q"],input[data-search],.tp-search-input input,.tp-ticket-v141-search input,.tp-wholesale-search input';
            d.addEventListener("input",e=>{if(e.target.matches(selector))render(e.target);});
            d.addEventListener("focusin",e=>{if(e.target.matches(selector)&&clean(e.target.value))render(e.target);});
            d.addEventListener("pointerdown",e=>{
              const row=e.target.closest(".tp-amazon-row");
              if(row&&activeInput&&panel){e.preventDefault();const data=panel._rows||[],item=data[Number(row.dataset.i)]||{value:row.dataset.value};submit(activeInput,item.value,item);return;}
              if(panel&&!e.target.closest(".tp-amazon-suggest")&&e.target!==activeInput)close();
            });
            d.addEventListener("keydown",e=>{if(e.key==="Escape"&&panel)close();});
          })();
          '''
          (JS / "smart-suggestions-v14.js").write_text(
              "\n".join(line.rstrip() for line in smart_js.strip().splitlines()) + "\n",
              encoding="utf-8",
          )

          # ================================================================
          # E. Ticket decision runtime
          # ================================================================
          ticket_js = r'''
          (() => {
            "use strict";
            const d=document,$=(s,r=d)=>r.querySelector(s),$$=(s,r=d)=>[...r.querySelectorAll(s)];
            const clean=v=>String(v??"").replace(/\s+/g," ").trim(),low=v=>clean(v).toLowerCase();
            const esc=v=>clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
            let discovery={routes:[],entities:[]},inventory=[],query="",type="all",shown=18;
            async function load(){
              const [a,b]=await Promise.allSettled([
                fetch(`/data/ticket-discovery-v14-1.json?v=14.1-${Date.now()}`,{cache:"no-store"}).then(r=>r.ok?r.json():{}),
                fetch(`/data/ticket-inventory.json?v=14.1-${Date.now()}`,{cache:"no-store"}).then(r=>r.ok?r.json():{})
              ]);
              discovery=a.status==="fulfilled"?a.value:{routes:[],entities:[]};inventory=b.status==="fulfilled"?(b.value.listings||[]):[];
            }
            function money(x){const n=Number(x.price);if(!Number.isFinite(n))return"";try{return new Intl.NumberFormat(undefined,{style:"currency",currency:x.currency||"USD"}).format(n)}catch{return`${x.currency||""} ${n.toFixed(2)}`.trim()}}
            const canonical=x=>clean(x.eventTitle||x.title);
            function matches(x,q){if(!q)return true;const words=low(q).split(/\s+/).filter(Boolean),blob=low(`${canonical(x)} ${x.provider||""} ${x.description||""} ${(x.aliases||[]).join(" ")}`);return words.every(w=>blob.includes(w));}
            const typeMatch=x=>type==="all"||low(x.type)===type;
            function expandedRouteIds(q){const ids=new Set(),l=low(q);if(!l)return ids;for(const e of discovery.entities||[]){const v=low(e.value);if(v===l||v.startsWith(l)||l.startsWith(v))ids.add(e.routeId);}return ids;}
            function dedupe(rows){const map=new Map();for(const r of rows){const key=low(`${canonical(r)}|${r.provider}|${r.destination||""}`);if(!map.has(key))map.set(key,r);}return[...map.values()];}
            function facts(rows){rows=rows.filter(x=>clean(x[1]));return rows.length?`<div class="tp-ticket-v141-facts">${rows.map(([k,v])=>`<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join("")}</div>`:"";}
            function routeLevel(x){const t=low(`${canonical(x)} ${x.destination||""}`);if(/competition|league|serie a|la liga|formula|grand prix/.test(t))return"Competition";if(/performer|artist|band|concert/.test(t))return"Artist / performer";if(low(x.type)==="travel")return"Travel route";return"Event route";}
            function inventoryCard(x){return`<article class="tp-ticket-v141-card is-inventory"><div class="tp-ticket-v141-card-head"><span>Live ticket inventory</span><strong>${esc(x.provider||"Provider")}</strong></div><h3>${esc(canonical(x))}</h3>${facts([["Date",x.date],["Venue",x.venue],["Section",x.section],["Row",x.row],["Quantity",x.quantity!=null?String(x.quantity):""],["Price",money(x)]])}<div class="tp-ticket-v141-actions"><button type="button" data-ticket-quick="${esc(x.id)}" data-kind="inventory">Quick view</button><a class="primary" href="/ticket/?id=${encodeURIComponent(x.id)}">Ticket details</a></div></article>`;}
            function routeCard(x,note=""){return`<article class="tp-ticket-v141-card"><div class="tp-ticket-v141-card-head"><span>${esc(routeLevel(x))}</span><strong>${esc(x.provider||"Provider")}</strong></div><h3>${esc(canonical(x))}</h3><p>${esc(x.description||"Open the connected provider to check current event dates, availability, seats and total price.")}</p>${note?`<div class="tp-ticket-v141-nearest">${esc(note)}</div>`:""}${facts([["Live price",money(x)],["Venue",x.venue],["Date",x.date]])}<div class="tp-ticket-v141-actions"><button type="button" data-ticket-quick="${esc(x.id)}" data-kind="route">Quick view</button><a class="primary" href="/ticket/?id=${encodeURIComponent(x.id)}">Review before provider</a></div></article>`;}
            function render(){
              const q=clean(query),host=$("[data-ticket-v141-results]");if(!host)return;
