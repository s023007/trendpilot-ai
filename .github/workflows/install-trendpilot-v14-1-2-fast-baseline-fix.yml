          (ROOT / "tickets" / "index.html").write_text("\n".join(line.strip() for line in tickets_html.strip().splitlines()) + "\n", encoding="utf-8")

          detail_path = ROOT / "ticket" / "index.html"
          if detail_path.exists():
              page = detail_path.read_text(encoding="utf-8")
              page = re.sub(r'/css/decision-v14\.css\?v=[^"\']+', '/css/decision-v14.css?v=14.1.2', page)
              page = re.sub(r'/js/ticket-detail-v14\.js\?v=[^"\']+', '/js/ticket-detail-v14.js?v=14.1.2', page)
