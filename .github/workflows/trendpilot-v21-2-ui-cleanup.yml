name: TrendPilot V21.2 Global UI Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trendpilot-v21-2-ui-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-24.04
    env:
      TP_BASE_URL: https://trendpilotchoice.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Apply V21.2 presentation cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          css_path = Path('css/trendpilot-graphite-navy-v21-1.css')
          css = css_path.read_text(encoding='utf-8')
          marker = 'TP_V212_UI_CLEANUP'
          block = r'''

          /* TP_V212_UI_CLEANUP — global contrast + simplified mobile navigation */
          .tp-links .tp-menu-close{
            width:44px!important;height:44px!important;display:grid!important;place-items:center!important;
            border:1px solid rgba(226,232,240,.18)!important;border-radius:14px!important;
            background:#1f2a3a!important;color:#f8fafc!important;font-size:1.35rem!important;
            box-shadow:none!important;opacity:1!important;
          }
          .tp-links .tp-menu-title{color:#f8fafc!important}
          .tp-links a{color:#eef2f7!important}

          /* Rare Finds: dark cards must use light text, never legacy black text. */
          body.tp80-rare-hub .tp80-rare-card{background:linear-gradient(155deg,#1f2d45,#1a2740)!important;color:#f8fafc!important;border-color:rgba(226,232,240,.15)!important}
          body.tp80-rare-hub .tp80-rare-card h2,
          body.tp80-rare-hub .tp80-rare-card h2 a{color:#f8fafc!important}
          body.tp80-rare-hub .tp80-brand{color:#a9bbff!important}
          body.tp80-rare-hub .tp80-card-price{color:#f8fafc!important}
          body.tp80-rare-hub .tp80-rare-meta,
          body.tp80-rare-hub .tp80-universal-meta,
          body.tp80-rare-hub .tp80-route-note{color:#cbd5e1!important}
          body.tp80-rare-hub .tp80-signals span{background:#eefbf7!important;color:#0f766e!important}
          body.tp80-rare-hub .tp80-price-proof.verified{background:#eafaf4!important;color:#08765a!important}
          body.tp80-rare-hub .tp80-price-proof.feed{background:#fff3d8!important;color:#805400!important}
          body.tp80-rare-hub .tp80-rare-stats{color:#aebbd1!important}
          body.tp80-rare-hub .tp80-bottom{background:rgba(13,20,34,.97)!important;border-color:rgba(226,232,240,.16)!important;box-shadow:0 12px 30px rgba(2,8,23,.32)!important}
          body.tp80-rare-hub .tp80-bottom a{color:#cbd5e1!important}
          body.tp80-rare-hub .tp80-bottom a.active{background:rgba(79,109,245,.22)!important;color:#f8fafc!important}

          /* Tickets: white shopping/result surfaces always use dark readable text. */
          body[data-tp-page="tickets"] .tp-ticket-v141-trust div{background:#243147!important;border-color:rgba(226,232,240,.16)!important;color:#f8fafc!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-trust b{color:#f8fafc!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-trust span{color:#cbd5e1!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-search-card,
          body[data-tp-page="tickets"] .tp-ticket-v141-card,
          body[data-tp-page="tickets"] .tp-ticket-v141-empty{background:#f8fafc!important;color:#0f172a!important;border-color:#d8dee8!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-card h3,
          body[data-tp-page="tickets"] .tp-ticket-v141-empty b{color:#0f172a!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-card p,
          body[data-tp-page="tickets"] .tp-ticket-v141-summary,
          body[data-tp-page="tickets"] .tp-ticket-v141-empty span{color:#475569!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-card-head strong{color:#08765a!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-card-head span{background:#e9efff!important;color:#3158d4!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-facts div{background:#eef2f6!important;color:#0f172a!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-facts small{color:#64748b!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-facts b{color:#0f172a!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-form input,
          body[data-tp-page="tickets"] .tp-ticket-v141-form select{background:#fff!important;color:#0f172a!important;border-color:#cbd5e1!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-form input::placeholder{color:#6b7280!important;opacity:1!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-chips button{background:#fff!important;color:#1f2937!important;border-color:#cbd5e1!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-section-title h2{color:#f8fafc!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-section-title span{color:#63ddd0!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-actions a,
          body[data-tp-page="tickets"] .tp-ticket-v141-actions button{background:#fff!important;color:#1f2937!important;border-color:#cbd5e1!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-actions .primary{background:#3158e8!important;color:#fff!important;border-color:#3158e8!important}
          body[data-tp-page="tickets"] .tp-ticket-v141-nearest{background:#fff3d8!important;color:#674d12!important}

          /* Every mobile bottom navigation uses the same dark shell and visible active item. */
          .tp-mobile-tabs{background:rgba(13,20,34,.97)!important;border:1px solid rgba(226,232,240,.16)!important;box-shadow:0 12px 30px rgba(2,8,23,.32)!important}
          .tp-mobile-tabs a{color:#cbd5e1!important}
          .tp-mobile-tabs a.is-active{background:rgba(79,109,245,.22)!important;color:#f8fafc!important}
          .tp-bottom-nav a.is-active,
          body[data-tp-page="deals"] .tp-bottom-nav a[href="/deals/"],
          body[data-tp-page="home"] .tp-bottom-nav a[href="/"]{background:rgba(79,109,245,.22)!important;color:#f8fafc!important}
          .tp-bottom-nav a.is-active b,.tp-bottom-nav a.is-active span,
          body[data-tp-page="deals"] .tp-bottom-nav a[href="/deals/"] b,
          body[data-tp-page="deals"] .tp-bottom-nav a[href="/deals/"] span{color:#f8fafc!important}

          @media(max-width:780px){
            /* The simplified menu approved in V20.8.6: discovery shortcuts only. */
            .tp-links .tp-menu-section-title,
            .tp-links .tp-nav-cta,
            .tp-links a[href="/find/"],
            .tp-links a[href="/compare/"],
            .tp-links a[href="/deals/"],
            .tp-links a[href="/products/"],
            .tp-links a[href="/software/"],
            .tp-links a[href="/wholesale/"]{display:none!important}
            .tp-links{padding-bottom:28px!important}
            .tp-links>a{font-size:1rem!important;line-height:1.3!important}
            .tp80-bottom{padding:5px!important;bottom:8px!important}
            .tp80-bottom a{padding:9px 7px!important;font-size:12px!important}
          }
          '''
          if marker not in css:
              css_path.write_text(css + block, encoding='utf-8')

          # Unify every public drawer to the previously approved simplified navigation.
          simple = ('<strong class="tp-menu-title">Explore TrendPilot</strong>'
                    '<button class="tp-menu-close" data-tp-menu-close type="button" aria-label="Close menu">×</button>'
                    '<a href="/price-watch/">Saved products</a>'
                    '<a href="/rare-used/">Rare Finds</a>'
                    '<a href="/tickets/">Tickets & experiences</a>'
                    '<a href="/guides/">Buying Guides</a>'
                    '<a href="/sourcing/">Business & wholesale</a>')
          nav_re = re.compile(r'(<nav\s+class="tp-links"[^>]*data-tp-nav[^>]*>).*?(</nav>)', re.S)
          changed=[]
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules'} for part in p.parts):
                  continue
              s=p.read_text(encoding='utf-8', errors='ignore')
              ns,n=nav_re.subn(lambda m:m.group(1)+simple+m.group(2),s)
              ns=ns.replace('/css/trendpilot-graphite-navy-v21-1.css?v=21.1.0','/css/trendpilot-graphite-navy-v21-1.css?v=21.2.0')
              if ns!=s:
                  p.write_text(ns,encoding='utf-8');changed.append(str(p))
          print('HTML files normalized:',len(changed))
          for x in changed[:30]: print(' -',x)
          PY

      - name: Commit V21.2 cleanup
        shell: bash
        run: |
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/trendpilot-graphite-navy-v21-1.css '*.html' '**/*.html' || true
          if git diff --cached --quiet; then
            echo 'No V21.2 changes to commit'
          else
            git commit -m 'TrendPilot V21.2 fix legacy menu and cross-page contrast'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for V21.2 deployment
        shell: bash
        run: |
          for i in $(seq 1 30); do
            code=$(curl -fsSL "${TP_BASE_URL}/css/trendpilot-graphite-navy-v21-1.css?v=21.2.0" || true)
            if printf '%s' "$code" | grep -q 'TP_V212_UI_CLEANUP'; then
              echo 'V21.2 CSS is live'; exit 0
            fi
            echo "waiting for deploy $i/30"; sleep 10
          done
          echo 'V21.2 did not appear on public site in time'; exit 1

      - name: Mobile contrast and menu QA
        shell: bash
        run: |
          mkdir -p artifacts/v21-2
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const BASE=process.env.TP_BASE_URL;
          const rgb=s=>{const m=String(s).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?m.slice(1,4).map(Number):null};
          const lum=a=>a.map(x=>{x/=255;return x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4)}).reduce((s,x,i)=>s+x*[.2126,.7152,.0722][i],0);
          const cr=(a,b)=>(Math.max(lum(a),lum(b))+.05)/(Math.min(lum(a),lum(b))+.05);
          const contrast=(fg,bg)=>{const a=rgb(fg),b=rgb(bg);return a&&b?cr(a,b):0};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2.75,isMobile:true,hasTouch:true});
            const p=await ctx.newPage();p.setDefaultTimeout(45000);
            const checks={};

            await p.goto(BASE+'/',{waitUntil:'domcontentloaded',timeout:90000});
            await p.click('[data-tp-menu-button]');
            await p.waitForTimeout(300);
            const menu=await p.evaluate(()=>({links:[...document.querySelectorAll('[data-tp-nav] a')].filter(a=>getComputedStyle(a).display!=='none').map(a=>a.textContent.trim()),sections:[...document.querySelectorAll('.tp-menu-section-title')].filter(x=>getComputedStyle(x).display!=='none').length,closeBg:getComputedStyle(document.querySelector('.tp-menu-close')).backgroundColor,closeColor:getComputedStyle(document.querySelector('.tp-menu-close')).color}));
            checks.menu_simplified=menu.links.length<=5&&menu.sections===0&&!menu.links.some(x=>/Find products|Deals & coupons|Compare$/i.test(x));
            checks.menu_close_visible=contrast(menu.closeColor,menu.closeBg)>=4.5;
            await p.screenshot({path:'artifacts/v21-2/home-menu.png',fullPage:false});

            await p.goto(BASE+'/rare-used/',{waitUntil:'domcontentloaded',timeout:90000});
            await p.waitForSelector('.tp80-rare-card h2 a',{timeout:60000});
            const rare=await p.evaluate(()=>{const card=document.querySelector('.tp80-rare-card'),title=card.querySelector('h2 a'),price=card.querySelector('.tp80-card-price');return{bg:getComputedStyle(card).backgroundColor,title:getComputedStyle(title).color,price:price?getComputedStyle(price).color:null}});
            checks.rare_title=contrast(rare.title,rare.bg)>=4.5;
            checks.rare_price=!rare.price||contrast(rare.price,rare.bg)>=4.5;
            await p.screenshot({path:'artifacts/v21-2/rare.png',fullPage:false});

            await p.goto(BASE+'/tickets/',{waitUntil:'domcontentloaded',timeout:90000});
            await p.waitForSelector('.tp-ticket-v141-card h3',{timeout:60000});
            const ticket=await p.evaluate(()=>{const card=document.querySelector('.tp-ticket-v141-card'),h=card.querySelector('h3'),pp=card.querySelector('p'),trust=document.querySelector('.tp-ticket-v141-trust div'),tb=trust?.querySelector('b');return{cardBg:getComputedStyle(card).backgroundColor,h:getComputedStyle(h).color,p:pp?getComputedStyle(pp).color:null,trustBg:trust?getComputedStyle(trust).backgroundColor:null,trustTitle:tb?getComputedStyle(tb).color:null}});
            checks.ticket_title=contrast(ticket.h,ticket.cardBg)>=4.5;
            checks.ticket_copy=!ticket.p||contrast(ticket.p,ticket.cardBg)>=4.5;
            checks.ticket_trust=!ticket.trustTitle||contrast(ticket.trustTitle,ticket.trustBg)>=4.5;
            await p.screenshot({path:'artifacts/v21-2/tickets.png',fullPage:false});

            await p.goto(BASE+'/deals/',{waitUntil:'domcontentloaded',timeout:90000});
            await p.waitForSelector('.tp-product-grid > *',{timeout:60000});
            const dealNav=await p.evaluate(()=>{const a=document.querySelector('.tp-bottom-nav a[href="/deals/"]');return{bg:getComputedStyle(a).backgroundColor,c:getComputedStyle(a).color}});
            checks.deals_active_nav=contrast(dealNav.c,dealNav.bg)>=4.5;
            await p.screenshot({path:'artifacts/v21-2/deals.png',fullPage:false});

            await p.goto(BASE+'/find/?q=phone&engine=v2064',{waitUntil:'domcontentloaded',timeout:90000});
            await p.waitForSelector('.tp78-card',{timeout:60000});
            const search=await p.evaluate(()=>{const c=document.querySelector('.tp78-card'),h=c.querySelector('h3 a,h3'),m=c.querySelector('.tp78-meta,.tp78-description');return{bg:getComputedStyle(c).backgroundColor,h:getComputedStyle(h).color,m:m?getComputedStyle(m).color:null}});
            checks.search_title=contrast(search.h,search.bg)>=4.5;
            checks.search_meta=!search.m||contrast(search.m,search.bg)>=4.5;
            await p.screenshot({path:'artifacts/v21-2/search.png',fullPage:false});

            const passed=Object.values(checks).every(Boolean);
            fs.writeFileSync('artifacts/v21-2/report.json',JSON.stringify({version:'21.2',checks,menu,passed},null,2));
            console.log(JSON.stringify({version:'21.2',checks,menu,passed},null,2));
            await browser.close();if(!passed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trendpilot-v21-2-mobile-cleanup
          path: artifacts/v21-2
