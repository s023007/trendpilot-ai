name: TrendPilot V20.7.11 Buyer Decision Tools

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trendpilot-v20-7-11-buyer-decision-tools.yml

permissions:
  contents: write

jobs:
  buyer-decision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply V20.7.11
        run: python scripts/apply-v20-7-11-buyer-decision.py

      - name: Syntax QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/finder-v20-7-9.js
          node --check js/buyer-decision-v20-7-11.js
          node --check netlify/functions/product-preview-v20-6-8-3.cjs
          grep -q 'data-budget-tools' find/index.html
          grep -q 'best-value' find/index.html
          grep -q 'Verified prices only' js/buyer-decision-v20-7-11.js
          grep -q 'TrendPilot will not guess a price' netlify/functions/product-preview-v20-6-8-3.cjs
          if git status --short | grep -E 'data/.*(canonical|identity|catalog|tpid|tpvid|tpoid)'; then
            echo 'Unexpected identity or catalog mutation'
            exit 1
          fi

      - name: Commit V20.7.11
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add find/index.html js/finder-v20-7-9.js js/buyer-decision-v20-7-11.js css/buyer-decision-v20-7-11.css netlify/functions/product-preview-v20-6-8-3.cjs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'TrendPilot V20.7.11 buyer decision tools'
          git push
