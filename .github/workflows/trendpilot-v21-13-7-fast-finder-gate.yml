name: TrendPilot V21.13.7 — Fast Finder Release Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-13-7-fast-finder-gate.yml
      - scripts/qa-v21-13-7-finder-fast.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Verify public release markers
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsSL --max-time 15 'https://trendpilotchoice.com/find/' -o /tmp/find.html || true
            curl -fsSL --max-time 15 'https://trendpilotchoice.com/data/v20-9/footwear-seller-samples.json?v=21.13.7' -o /tmp/foot.json || true
            if grep -q 'packed-search-cache-v21-13-7.js?v=21.13.7' /tmp/find.html 2>/dev/null && grep -q 'universal-discovery-v20-9-1.js?v=21.13.7' /tmp/find.html 2>/dev/null && grep -q '"version":"21.13.7"' /tmp/foot.json 2>/dev/null; then
              echo 'V21.13.7 public markers are live.'
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run bounded mobile finder gate
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        run: node scripts/qa-v21-13-7-finder-fast.mjs
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v21-13-7-fast-finder-gate
          path: artifacts/v21-13-7-finder-fast
          if-no-files-found: ignore
