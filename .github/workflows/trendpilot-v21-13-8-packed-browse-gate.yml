name: TrendPilot V21.13.8 — Packed Browse Release Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-13-8-packed-browse-gate.yml
      - scripts/qa-v21-13-8-packed-browse.mjs
      - js/packed-browse-v21-13-8.js
      - find/index.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Wait for V21.13.8 public finder
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            curl -fsSL --max-time 15 'https://trendpilotchoice.com/find/' -o /tmp/find.html || true
            if grep -q 'packed-browse-v21-13-8.js?v=21.13.8' /tmp/find.html 2>/dev/null; then
              echo 'V21.13.8 public finder is live.'
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime syntax
        shell: bash
        run: |
          node --check js/packed-browse-v21-13-8.js
          node --check scripts/qa-v21-13-8-packed-browse.mjs
      - name: Install browser QA runtime
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run deterministic packed browse QA
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        run: node scripts/qa-v21-13-8-packed-browse.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v21-13-8-packed-browse-gate
          path: artifacts/v21-13-8-packed-browse
          if-no-files-found: ignore
