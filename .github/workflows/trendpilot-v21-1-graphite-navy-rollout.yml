name: TrendPilot V21.1 Graphite Navy Rollout + Mobile QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-1-graphite-navy-rollout.yml
      - css/trendpilot-graphite-navy-v21-1.css
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v21-1-graphite-navy
  cancel-in-progress: true

jobs:
  rollout-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Wire V21.1 after the old presentation layer
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re
          new='<link rel="stylesheet" href="/css/trendpilot-graphite-navy-v21-1.css?v=21.1.0">'
          pages=[
            'index.html','find/index.html','compare/index.html','deals/index.html','rare-used/index.html',
            'products/index.html','price-watch/index.html','tickets/index.html','guides/index.html',
            'wholesale/index.html','sourcing/index.html','software/index.html'
          ]
          changed=[]
          for name in pages:
            p=Path(name)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8'); old=s
            if 'trendpilot-graphite-navy-v21-1.css' not in s:
              if 'trendpilot-calm-dark-v21.css?v=21.0.0' in s:
                s=s.replace('<link rel="stylesheet" href="/css/trendpilot-calm-dark-v21.css?v=21.0.0">','<link rel="stylesheet" href="/css/trendpilot-calm-dark-v21.css?v=21.0.0">'+new,1)
              elif '</head>' in s:
                s=s.replace('</head>',new+'</head>',1)
            s=re.sub(r'<meta name="theme-color" content="[^"]*">','<meta name="theme-color" content="#121721">',s,count=1,flags=re.I)
            if s!=old:
              p.write_text(s,encoding='utf-8'); changed.append(name)

          fn=Path('netlify/functions/product-preview-v20-9-6-mobile-polish.cjs')
          if fn.exists():
            s=fn.read_text(encoding='utf-8'); old=s
            if 'trendpilot-graphite-navy-v21-1.css' not in s:
              needle="  if(!/trendpilot-calm-dark-v21\\.css/i.test(body)) body=body.replace(/<\\/head>/i,'<link rel=\"stylesheet\" href=\"/css/trendpilot-calm-dark-v21.css?v=21.0.0\"></head>');\n"
              add=needle+"  if(!/trendpilot-graphite-navy-v21-1\\.css/i.test(body)) body=body.replace(/<\\/head>/i,'<link rel=\"stylesheet\" href=\"/css/trendpilot-graphite-navy-v21-1.css?v=21.1.0\"></head>');\n"
              if needle not in s: raise SystemExit('Product polish insertion point not found')
              s=s.replace(needle,add,1)
            s=s.replace('content=\"#0d1630\"','content=\"#121721\"')
            if s!=old:
              fn.write_text(s,encoding='utf-8'); changed.append(str(fn))
          print('V21.1 wired:',', '.join(changed) if changed else 'already current')
          PY

      - name: Validate wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s css/trendpilot-graphite-navy-v21-1.css
          for p in index.html find/index.html compare/index.html deals/index.html rare-used/index.html; do
            grep -q 'trendpilot-graphite-navy-v21-1.css?v=21.1.0' "$p"
          done
          grep -q 'trendpilot-graphite-navy-v21-1.css?v=21.1.0' netlify/functions/product-preview-v20-9-6-mobile-polish.cjs

      - name: Commit V21.1 wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html find/index.html compare/index.html deals/index.html rare-used/index.html \
            products/index.html price-watch/index.html tickets/index.html guides/index.html wholesale/index.html sourcing/index.html software/index.html \
            netlify/functions/product-preview-v20-9-6-mobile-polish.cjs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'V21.1 wiring already committed.'
          else
            git commit -m 'TrendPilot V21.1 wire Graphite Navy hybrid across public pages'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Wait for V21.1 deployment
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT='https://trendpilotchoice.com/product/hot-sale-original-global-official-version-xiaomi-redmi-note-8-48mp-quad-ai-back---d0f4e3ec74717f/'
          for i in $(seq 1 42); do
            css=0; home=0; find=0; product=0
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/css/trendpilot-graphite-navy-v21-1.css?v=21.1.0' | grep -q -- '--tp211-bg:#121721' && css=1 || true
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/' | grep -q 'trendpilot-graphite-navy-v21-1.css?v=21.1.0' && home=1 || true
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/find/' | grep -q 'trendpilot-graphite-navy-v21-1.css?v=21.1.0' && find=1 || true
            curl -fsSL --max-time 20 "$PRODUCT" | grep -q 'trendpilot-graphite-navy-v21-1.css?v=21.1.0' && product=1 || true
            if [ "$css" = 1 ] && [ "$home" = 1 ] && [ "$find" = 1 ] && [ "$product" = 1 ]; then echo 'V21.1 is live.'; exit 0; fi
            echo "Waiting V21.1 ($i/42): css=$css home=$home find=$find product=$product"
            sleep 10
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Android visual + contrast regression QA
        shell: bash
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        run: |
          mkdir -p artifacts/v21-1
          node <<'NODE'
          const {chromium}=require('playwright'); const fs=require('fs');
          function rgb(v){const m=String(v).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?m.slice(1,4).map(Number):null}
          function lum(a){return a.map(x=>{x/=255;return x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4)}).reduce((s,x,i)=>s+x*[.2126,.7152,.0722][i],0)}
          function contrast(a,b){const A=lum(a),B=lum(b);return (Math.max(A,B)+.05)/(Math.min(A,B)+.05)}
          (async()=>{
            const b=await chromium.launch({headless:true}); const c=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:2.75,isMobile:true,hasTouch:true});
            const p=await c.newPage(); const out={checks:{},samples:{}};
            await p.goto(process.env.TP_BASE_URL+'/',{waitUntil:'domcontentloaded',timeout:90000}); await p.waitForTimeout(900);
            const home=await p.evaluate(()=>{
              const header=document.querySelector('.tp-header'), head=document.querySelector('.v207-section-head'), nav=document.querySelector('.tp-bottom-nav');
              const grid=document.querySelector('[data-tp-home-products]'); const card=grid?.querySelector(':scope > *:not(.tp-empty)'); const title=card?.querySelector('h2,h3,a');
              const sc=x=>x?getComputedStyle(x):null;
              return {headerBg:sc(header)?.backgroundColor,headDisplay:sc(head)?.display,headWidth:head?.getBoundingClientRect().width||0,cardBg:sc(card)?.backgroundColor,cardBgImage:sc(card)?.backgroundImage,titleColor:sc(title)?.color,navBg:sc(nav)?.backgroundColor,navHeight:nav?.getBoundingClientRect().height||0};
            });
            out.samples.home=home; out.checks.header_dark=!/255, 255, 255/.test(home.headerBg||''); out.checks.section_heading_full_width=home.headWidth>330 && home.headDisplay==='block'; out.checks.bottom_nav_compact=home.navHeight>0&&home.navHeight<78;
            await p.screenshot({path:'artifacts/v21-1/home.png',fullPage:false});
            await p.goto(process.env.TP_BASE_URL+'/find/',{waitUntil:'domcontentloaded',timeout:90000}); await p.waitForSelector('.tp78-empty',{timeout:30000});
            const empty=await p.evaluate(()=>{const e=document.querySelector('.tp78-empty'),h=e?.querySelector('h3');return {bg:getComputedStyle(e).backgroundColor,bgImage:getComputedStyle(e).backgroundImage,color:getComputedStyle(h).color,text:h?.textContent||''}}); out.samples.empty=empty; out.checks.empty_not_white=!/255, 255, 255/.test(empty.bg||'')||/gradient/.test(empty.bgImage||'');
            await p.goto(process.env.TP_BASE_URL+'/find/?q=phone&engine=v2064',{waitUntil:'domcontentloaded',timeout:90000}); await p.waitForSelector('.tp78-card',{timeout:60000});
            const result=await p.evaluate(()=>{const c=document.querySelector('.tp78-card'),t=c.querySelector('h3 a,h3'),m=c.querySelector('.tp78-meta,.tp78-description');return {bg:getComputedStyle(c).backgroundColor,bgImage:getComputedStyle(c).backgroundImage,title:getComputedStyle(t).color,muted:m?getComputedStyle(m).color:null,text:t.textContent.trim()}}); out.samples.finder=result;
            const titleRGB=rgb(result.title), cardRGB=[248,250,252]; out.checks.product_card_light=/gradient/.test(result.bgImage||'')||(/24[0-9], 24[0-9], 24[0-9]/.test(result.bg||'')); out.checks.product_title_dark=titleRGB&&lum(titleRGB)<.12; out.checks.product_title_contrast=titleRGB&&contrast(titleRGB,cardRGB)>=4.5;
            await p.screenshot({path:'artifacts/v21-1/finder.png',fullPage:false});
            const PRODUCT='/product/hot-sale-original-global-official-version-xiaomi-redmi-note-8-48mp-quad-ai-back---d0f4e3ec74717f/'; await p.goto(process.env.TP_BASE_URL+PRODUCT,{waitUntil:'domcontentloaded',timeout:90000}); await p.waitForTimeout(800);
            const product=await p.evaluate(()=>({about:document.querySelector('.about-card')?.innerText||'',seller:!!document.querySelector('#seller-offers'),style:[...document.styleSheets].some(s=>String(s.href||'').includes('trendpilot-graphite-navy-v21-1.css'))})); out.samples.product=product; out.checks.product_description_preserved=product.about.length>80; out.checks.product_seller_preserved=product.seller; out.checks.v211_loaded=product.style;
            await p.screenshot({path:'artifacts/v21-1/product.png',fullPage:false});
            out.passed=Object.values(out.checks).every(Boolean); fs.writeFileSync('artifacts/v21-1/report.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2)); await b.close(); if(!out.passed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload V21.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v21-1-graphite-navy
          path: artifacts/v21-1
          if-no-files-found: ignore
