          else
            git commit -m "feat: add Lenovo canonical catalog with Admitad deeplinks"
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Publish V19.12.3 summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s data/catalog-v19/V19.12.3-REPORT.md ]; then
            cat data/catalog-v19/V19.12.3-REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lenovo audit artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trendpilot-v19-12-1-lenovo
          path: |
            data/catalog-v19/V19.12.3-REPORT.md
            data/catalog-v19/source-ingestion/lenovo-admitad-audit.json
            data/catalog-v19/source-ingestion/lenovo-direct-source-audit.json
            data/source-ingestion-v19/lenovo-direct-catalog.json
            data/catalog-v19/source-manifests/lenovo.json
            data/catalog-v19/sellers/lenovo/manifest.json
            data/catalog-v19/sellers/lenovo/audit.json
            data/catalog-v19/seller-build-queue-v3.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
