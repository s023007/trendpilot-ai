name: TrendPilot V16.2.3 Hybrid Exact Intent Gate Robust

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v16-2-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hybrid-exact-intent-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Apply robust V16.1.3 backend and V16.2.3 finder gate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          api = Path("netlify/functions/products-v16-hybrid.mjs")
          js = Path("js/site-v13-5.js")
          finder = Path("find/index.html")
          docs = Path("V16-UNIVERSAL-PRODUCT-INDEX.md")

          for p in (api, js, finder):
              if not p.exists():
                  raise SystemExit(f"Missing required file: {p}")

          # ============================================================
          # BACKEND V16.1.3
          # Replace intentRank by function boundaries instead of fragile
          # whitespace-sensitive text anchors.
          # ============================================================
          a = api.read_text(encoding="utf-8")

          if 'const VERSION = "16.1.1";' in a:
              a = a.replace('const VERSION = "16.1.1";', 'const VERSION = "16.1.3";', 1)
          elif 'const VERSION = "16.1.3";' not in a:
              raise SystemExit("Expected V16.1.1 hybrid endpoint was not found.")

          intent_start = a.find("function intentRank(product, query, tokens) {")
          intent_end = a.find("function rankedNormalize(", intent_start)
          if intent_start < 0 or intent_end < 0:
              raise SystemExit("intentRank function boundaries not found.")

          helper = r'''function relationBeforeQueryV16_1_3(titleWords, tokens) {
            if (!tokens.length || !titleWords.length) return false;

            const directRelations = new Set([
              "for","fits","fit","compatible","replacement","repair",
              "adapter","accessory","accessories"
            ]);

            for (let i = 0; i < titleWords.length; i++) {
              const word = titleWords[i];
              const queryHit = tokens.some(token =>
                word === token ||
                (token.length >= 4 && word.includes(token))
              );
              if (!queryHit) continue;

              const before = titleWords.slice(Math.max(0, i - 5), i);
              if (before.some(w => directRelations.has(w))) return true;

              const joined = before.join(" ");
              if (
                joined.includes("compatible with") ||
                joined.includes("replacement for") ||
                joined.includes("used with") ||
                joined.includes("works with") ||
                joined.includes("designed for") ||
                joined.includes("made for")
              ) return true;
            }

            return false;
          }

          '''

          new_intent = r'''function intentRank(product, query, tokens) {
            const title = lower(product?.title || product?.name);
            const category = lower(
              `${product?.category || ""} ${product?.subcategory || ""} ` +
              `${product?.group || ""} ${product?.family || ""}`
            );
            const description = lower(product?.description || "").slice(0, 1000);

            const titleWords = words(title);
            const categoryWords = words(category);
            const titleSet = new Set(titleWords);
            const categorySet = new Set(categoryWords);

            const allInTitle = tokens.length > 0 && tokens.every(t =>
              titleSet.has(t) || (t.length >= 4 && title.includes(t))
            );

            const allInCategory = tokens.length > 0 && tokens.every(t =>
              categorySet.has(t) || (t.length >= 4 && category.includes(t))
            );

            const titleHits = tokens.filter(t =>
              titleSet.has(t) || (t.length >= 4 && title.includes(t))
            ).length;

            const categoryHits = tokens.filter(t =>
              categorySet.has(t) || (t.length >= 4 && category.includes(t))
            ).length;

            const descriptionHits = tokens.filter(t =>
              description.includes(t)
            ).length;

            const phrase = querySpanInfo(titleWords, query, tokens);
            const phraseInTitle = phrase.exactPhrase;
            const phraseAtStart = Boolean(
              query &&
              (title === query ||
               title.startsWith(query + " ") ||
               title.startsWith(query + "-"))
            );

            const queryLooksAccessory = tokens.some(t => accessoryWords.has(t));
            const titleHasAccessory = titleWords.some(t => accessoryWords.has(t));
            const categoryHasAccessory = categoryWords.some(t => accessoryWords.has(t));

            const multiWordQuery = tokens.length >= 2;

            // For two-word searches such as "dog food", "dog paw print food"
            // must not be treated like the exact product phrase.
            const tightTokenSpan =
              !multiWordQuery ||
              phrase.minSpan <= Math.max(tokens.length + 1, 3);

            const looseTokenSpan =
              multiWordQuery &&
              phrase.minSpan > Math.max(tokens.length + 3, 5);

            const misleadingExactPhrase =
              multiWordQuery &&
              phraseInTitle &&
              phrase.misleadingTail;

            // Examples: "dog food bowl", "phone case", "dog food dispenser".
            // When the requested phrase is immediately followed by an
            // accessory/product-support word, it is related rather than core.
            const accessoryPhraseTail =
              phraseInTitle &&
              !queryLooksAccessory &&
              accessoryWords.has(phrase.nextWord);

            // Examples: "projector for phone", "speaker for mobile phone",
            // "replacement screen for iPhone".
            const relationBeforeQuery =
              !queryLooksAccessory &&
              relationBeforeQueryV16_1_3(titleWords, tokens);

            let intentTier = 0;

            if (queryLooksAccessory) {
              if (phraseInTitle && allInTitle && !misleadingExactPhrase) intentTier = 5;
              else if (allInTitle && tightTokenSpan) intentTier = 4;
              else if (phraseInTitle) intentTier = 3;
              else if (allInCategory) intentTier = 2;
              else intentTier = 1;
            } else {
              const cleanTitleCore =
                allInTitle &&
                !titleHasAccessory &&
                tightTokenSpan &&
                !misleadingExactPhrase &&
                !accessoryPhraseTail &&
                !relationBeforeQuery;

              const cleanPhraseCore =
                phraseInTitle &&
                !titleHasAccessory &&
                !misleadingExactPhrase &&
                !accessoryPhraseTail &&
                !relationBeforeQuery;

              // Category is supporting evidence only. It must never promote
              // an accessory title back to a core product.
              const cleanCategoryCore =
                allInCategory &&
                !categoryHasAccessory &&
                !titleHasAccessory &&
                !relationBeforeQuery;

              if (
                (cleanPhraseCore && phraseAtStart) ||
                (cleanPhraseCore && cleanCategoryCore)
              ) {
                intentTier = 5;
              } else if (cleanTitleCore || cleanCategoryCore) {
                intentTier = 4;
              } else if (cleanPhraseCore) {
                intentTier = 3;
              } else if (
                (allInTitle || phraseInTitle) &&
                !looseTokenSpan &&
                !misleadingExactPhrase &&
                !accessoryPhraseTail &&
                !relationBeforeQuery
              ) {
                intentTier = 2;
              } else if (
                allInCategory ||
                (titleHits > 0 && !looseTokenSpan)
              ) {
                intentTier = 1;
              }
            }

            // Hard caps for derived/related products.
            if (accessoryPhraseTail) intentTier = Math.min(intentTier, 2);
            if (relationBeforeQuery) intentTier = Math.min(intentTier, 1);
            if (misleadingExactPhrase) intentTier = Math.min(intentTier, 1);

            let score =
              intentTier * 1000 +
              titleHits * 90 +
              categoryHits * 65 +
              Math.min(descriptionHits, 2) * 8 +
              Number(product?.quality || 0);

            if (phraseInTitle && !misleadingExactPhrase && !accessoryPhraseTail) {
              score += 180;
            }
            if (phraseAtStart && !misleadingExactPhrase && !accessoryPhraseTail) {
              score += 120;
            }

            if (tightTokenSpan && multiWordQuery) score += 70;
            if (looseTokenSpan) score -= 260;
            if (misleadingExactPhrase) score -= 700;
            if (accessoryPhraseTail) score -= 620;
            if (relationBeforeQuery) score -= 760;

            if (!queryLooksAccessory && titleHasAccessory) score -= 320;
            if (!queryLooksAccessory && categoryHasAccessory && !allInCategory) {
              score -= 140;
            }

            return {
              intentTier,
              score,
              phraseIntegrity: {
                exactPhrase: phrase.exactPhrase,
                minSpan: phrase.minSpan,
                nextWord: phrase.nextWord,
                misleadingTail: phrase.misleadingTail,
                accessoryPhraseTail,
                relationBeforeQuery
              }
            };
          }

          '''

          # Insert helper immediately before the replacement intentRank.
          a = a[:intent_start] + helper + new_intent + a[intent_end:]

          # Add a few generic related-product words that matter across categories.
          if '"mat","mats","placemat","placemats","tray","trays"' not in a:
              accessory_end = a.find("]);", a.find("const accessoryWords"))
              if accessory_end < 0:
                  raise SystemExit("accessoryWords end not found.")
              insert_at = a.rfind("\n", 0, accessory_end)
              a = (
                  a[:insert_at] +
                  ',\n  "mat","mats","placemat","placemats","tray","trays"' +
                  a[insert_at:]
              )

          # Fresh rerank: never preserve a stale high tier from V16.0.x.
          merge_start = a.find("function mergeAndRank(")
          merge_end = a.find("export default async function handler", merge_start)
          if merge_start < 0 or merge_end < 0:
              raise SystemExit("mergeAndRank boundaries not found.")

          merge_part = a[merge_start:merge_end]

          max_pattern = re.compile(
              r'''matchScore:\s*Math\.max\(\s*
                  Number\(product\?\.matchScore\s*\|\|\s*0\),\s*
                  rank\.score\s*
                \),\s*
                intentTier:\s*Math\.max\(\s*
                  Number\(product\?\.intentTier\s*\|\|\s*0\),\s*
                  rank\.intentTier\s*
                \)''',
              re.X | re.S
          )

          if max_pattern.search(merge_part):
              merge_part = max_pattern.sub(
                  "matchScore: rank.score,\n      intentTier: rank.intentTier",
                  merge_part,
                  count=1
              )
          elif "matchScore: rank.score" not in merge_part:
              raise SystemExit("fresh-rerank matchScore block not found.")

          a = a[:merge_start] + merge_part + a[merge_end:]

          a = a.replace(
              '`${lower(query)}|${lower(seller)}|${lower(network)}|16.1.1`',
              '`${lower(query)}|${lower(seller)}|${lower(network)}|16.1.3`',
              1
          )
          a = a.replace(
              'console.error("TrendPilot V16.1.1 hybrid search failed", error);',
              'console.error("TrendPilot V16.1.3 hybrid search failed", error);',
              1
          )

          api.write_text(a, encoding="utf-8")

          # ============================================================
          # FRONTEND V16.2.3
          # Use V16 intent tiers as the authority for Exact results.
          # ============================================================
          s = js.read_text(encoding="utf-8")

          # 1) Score hybrid rows using backend tier and score.
          score_start = s.find("  function score(p, plan) {")
          score_end = s.find("  function mergeProducts(rows) {", score_start)
          if score_start < 0 or score_end < 0:
              raise SystemExit("score function boundaries not found.")

          score_part = s[score_start:score_end]

          if "TP_HYBRID_SCORE_V16_2_3" not in score_part:
              base_line = (
                  "    let n = p.quality / 10 + (p.image ? 6 : 0) + "
                  "(p.price ? 4 : 0) + Math.min(8,p.rating) + "
                  "Math.min(8,Math.log10(p.reviews + 1) * 2);"
              )
              if base_line not in score_part:
                  raise SystemExit("score base line not found.")

              score_part = score_part.replace(
                  base_line,
                  base_line + r'''
              // TP_HYBRID_SCORE_V16_2_3
              if(p._tpHybridV16_2_1){
                const tier=Math.max(0,Number(p.intentTier||0));
                const hs=Number(p.hybridMatchScore||0);
                n += tier*1000 + Math.max(-900,Math.min(900,hs/8));
              }''',
                  1
              )

              s = s[:score_start] + score_part + s[score_end:]

          # 2) Exact gate: a Hybrid product needs intent tier 4 or 5.
          strict_start = s.find("  function strictProductMatch(p, plan) {")
          strict_end = s.find("  function relatedMatch(p, plan) {", strict_start)
          if strict_start < 0 or strict_end < 0:
              raise SystemExit("strictProductMatch boundaries not found.")

          strict_part = s[strict_start:strict_end]

          if "TP_HYBRID_EXACT_GATE_V16_2_3" not in strict_part:
              first = "  function strictProductMatch(p, plan) {\n"
              if first not in strict_part:
                  raise SystemExit("strictProductMatch opening not found.")

              strict_part = strict_part.replace(
                  first,
                  first + r'''    // TP_HYBRID_EXACT_GATE_V16_2_3
            if(p._tpHybridV16_2_1){
              return Number(p.intentTier||0) >= 4;
            }
          ''',
                  1
              )
              s = s[:strict_start] + strict_part + s[strict_end:]

          # 3) Replace mergeProducts by boundaries. This avoids old V15 rows
          # rebuilding Exact when Hybrid has already classified the query.
          merge_start = s.find("  function mergeProducts(rows) {")
          merge_end = s.find("  function currency(", merge_start)
          if merge_start < 0 or merge_end < 0:
              raise SystemExit("mergeProducts boundaries not found.")

          new_merge = r'''  function mergeProducts(rows) {
            rows = (rows || []).filter(tpCjPublicAllowed);

            const map = new Map(
              state.products
                .filter(tpCjPublicAllowed)
                .map(p => [p.clusterKey || p.id,p])
            );

            rows.forEach(p => {
              const key=p.clusterKey||p.id;
              if(
                !map.has(key) ||
                score(p,state.plan)>score(map.get(key),state.plan)
              ){
                map.set(key,p);
              }
            });

            state.products = [...map.values()].filter(tpCjPublicAllowed);

            // TP_HYBRID_EXACT_POOL_V16_2_3
            const hybridRows=state.products.filter(p=>p._tpHybridV16_2_1);
            const exactSource=hybridRows.length ? hybridRows : state.products;

            const rankedExact=exactSource
              .filter(p=>strictProductMatch(p,state.plan))
              .sort((a,b)=>score(b,state.plan)-score(a,state.plan));

            state.exact=typeof tpDiversifySellersV15_1==="function"
              ? tpDiversifySellersV15_1(rankedExact)
              : rankedExact;

            const exactKeys=new Set(
              rankedExact.map(p=>p.clusterKey||p.id)
            );

            state.alternatives=state.products
              .filter(p=>{
                const key=p.clusterKey||p.id;
                if(exactKeys.has(key))return false;

                if(p._tpHybridV16_2_1){
                  return Number(p.intentTier||0)<4;
                }

                return relatedMatch(p,state.plan);
              })
              .sort((a,b)=>score(b,state.plan)-score(a,state.plan));
          }

          '''

          s = s[:merge_start] + new_merge + s[merge_end:]

          # 4) Do not refill verified Hybrid Exact using legacy catalogue pages.
          s = s.replace(
              "    if(state.exact.length<24){\n"
              "      await Promise.race([",
              "    if(state.exact.length<24 && !state.hybridMeta){\n"
              "      await Promise.race([",
              1
          )

          # 5) Hide remote "check more" for a completed Hybrid query.
          s = s.replace(
              '      const moreRemote=state.activeTab==="exact"&&!candidatePagesExhausted();',
              '      const moreRemote=state.activeTab==="exact"&&!state.hybridMeta&&!candidatePagesExhausted();',
              1
          )

          # 6) If there is a dedicated load-more remote guard, stop it too.
          s = s.replace(
              'if(state.activeTab!=="exact"||candidatePagesExhausted()||state.loading)return;',
              'if(state.activeTab!=="exact"||state.hybridMeta||candidatePagesExhausted()||state.loading)return;',
              1
          )

          js.write_text(s, encoding="utf-8")

          # Browser cache bust.
          h = finder.read_text(encoding="utf-8")
          h2, n = re.subn(
              r'/js/site-v13-5\.js\?v=[^"\']+',
              '/js/site-v13-5.js?v=16.2.3',
              h,
              count=1
          )
          if n != 1:
              raise SystemExit(f"Finder script tag not found uniquely: matches={n}")
          finder.write_text(h2, encoding="utf-8")

          # Documentation.
          d = docs.read_text(encoding="utf-8") if docs.exists() else "# TrendPilot V16 Universal Product Index\n"
          if "## V16.2.3 — robust hybrid exact intent gate" not in d:
              d += r'''

          ## V16.2.3 — robust hybrid exact intent gate

          - Replaces fragile whitespace-sensitive patch anchors with function-boundary edits.
          - Hybrid Exact accepts only intent tier 4 or 5.
          - Related machines/accessories/parts remain under Related alternatives.
          - Adds generic relation demotion for "for", "compatible with", "replacement for", etc.
          - Tightens multi-word proximity for searches such as "dog food".
          - Prevents category metadata from promoting accessory titles to core products.
          - Freshly reranks merged products instead of preserving stale old intent tiers.
          - No full product-index rebuild is required.
          '''
          docs.write_text(d, encoding="utf-8")

          print("V16.2.3 robust intent gate applied.")
          PY

      - name: Validate V16.2.3
        shell: bash
        run: |
          set -euo pipefail

          node --check netlify/functions/products-v16-hybrid.mjs
          node --check js/site-v13-5.js
          git diff --check

          grep -q 'const VERSION = "16.1.3"' netlify/functions/products-v16-hybrid.mjs
          grep -q 'relationBeforeQueryV16_1_3' netlify/functions/products-v16-hybrid.mjs
          grep -q 'accessoryPhraseTail' netlify/functions/products-v16-hybrid.mjs
          grep -q 'matchScore: rank.score' netlify/functions/products-v16-hybrid.mjs
          grep -q 'intentTier: rank.intentTier' netlify/functions/products-v16-hybrid.mjs
          grep -q '|16.1.3' netlify/functions/products-v16-hybrid.mjs

          grep -q 'TP_HYBRID_SCORE_V16_2_3' js/site-v13-5.js
          grep -q 'TP_HYBRID_EXACT_GATE_V16_2_3' js/site-v13-5.js
          grep -q 'TP_HYBRID_EXACT_POOL_V16_2_3' js/site-v13-5.js
          grep -q 'Number(p.intentTier||0) >= 4' js/site-v13-5.js
          grep -q '/js/site-v13-5.js?v=16.2.3' find/index.html

          echo "V16.2.3 validation passed."

      - name: Publish V16.2.3
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            netlify/functions/products-v16-hybrid.mjs \
            js/site-v13-5.js \
            find/index.html \
            V16-UNIVERSAL-PRODUCT-INDEX.md

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V16.2.3 is already installed."
            exit 0
          fi

          git commit -m "fix: robustly gate finder exact results by hybrid intent"
          git push origin HEAD:main

          {
            echo "## TrendPilot V16.2.3"
            echo "- fixed V16.2.2 misleadingExactPhrase anchor failure"
            echo "- Exact uses verified V16 intent tiers only"
            echo "- generic accessories and 'for query' products move to Related"
            echo "- multi-word proximity is stricter"
            echo "- stale V16 intent tiers are no longer preserved"
            echo "- no product-index rebuild required"
          } >> "$GITHUB_STEP_SUMMARY"
