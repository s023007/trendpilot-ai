name: TrendPilot V20.6.6.3 — Direct TPID Routing + Canonical Labels + Mobile UX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-6-6-3
  cancel-in-progress: false

jobs:
  repair-comparison-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify V20.6 comparison foundation
        shell: bash
        run: |
          set -euo pipefail
          test -d data/search-v20-6
          test -f find/index.html
          echo "V20.6 comparison package directory found."
          echo "This workflow will NOT rebuild TPID / TPVID / TPOID identity."
          echo "This workflow will NOT modify data/catalog-v19."

      - name: Build canonical presentation map from committed comparison package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import json, re, math

          ROOT = Path("data/search-v20-6")
          OUT = ROOT / "presentation-v20-6-6-3.json"

          TPID_RE = re.compile(r"\bTP(?:PH|LP|HP|PF|PB|DF|AC|SW|CW|TL|LT|3D|[A-Z]{2,5})-[A-F0-9]{8,}\b", re.I)
          ANY_TPID_RE = re.compile(r"\bTP[A-Z]{2,8}-[A-Z0-9]{8,}\b", re.I)
          URL_RE = re.compile(r"^https?://", re.I)

          SELLERISH = {
              "alibaba","aliexpress","geekbuying","lenovo","tiktok shop us","fragranceshop.com",
              "karaca eu","govee many geos","harfington many geos","sunsky-online ww","mfi medical",
              "pandahall","diecast","audio solutions"
          }

          NAME_KEYS = {
              "canonicalname": 120, "canonical_name": 120,
              "displayname": 118, "display_name": 118,
              "mastername": 116, "master_name": 116,
              "productname": 112, "product_name": 112,
              "identitylabel": 110, "identity_label": 110,
              "querylabel": 108, "query_label": 108,
              "canonicalmodel": 106, "canonical_model": 106,
              "modelname": 104, "model_name": 104,
              "model": 102, "title": 98, "name": 94, "label": 88
          }
          BRAND_KEYS = {"canonicalbrand","canonical_brand","brand","manufacturer","maker"}
          IMAGE_KEYS = {
              "image","imageurl","image_url","imagelink","image_link",
              "thumbnail","thumbnailurl","thumbnail_url","mainimage","main_image"
          }
          SELLER_KEYS = {"seller","sellername","seller_name","advertiser","advertisername","advertiser_name","merchant","merchantname","merchant_name"}
          TYPE_KEYS = {"type","producttype","product_type","kind","family"}
          PRICE_KEYS = {"price","saleprice","sale_price","currentprice","current_price","minprice","min_price"}

          candidates = defaultdict(list)
          brands = defaultdict(list)
          images = defaultdict(list)
          sellers = defaultdict(set)
          types = defaultdict(list)
          prices = defaultdict(list)
          variants = defaultdict(set)
          seen_tpids = set()
          source_files = []

          def clean(v):
              return re.sub(r"\s+", " ", str(v or "")).strip()

          def norm(v):
              return re.sub(r"[^a-z0-9]+", " ", clean(v).lower()).strip()

          def looks_like_id(v):
              s = clean(v)
              return bool(ANY_TPID_RE.fullmatch(s) or re.fullmatch(r"TPV-[A-Z0-9-]+", s, re.I) or re.fullmatch(r"TPO-[A-Z0-9-]+", s, re.I))

          def title_score(key, value):
              s = clean(value)
              if not s or looks_like_id(s) or URL_RE.match(s):
                  return -10_000
              n = norm(s)
              if n in SELLERISH or n in {"product","products","unknown","item","offer","listing","not provided"}:
                  return -10_000
              score = NAME_KEYS.get(key.lower(), 60)
              L = len(s)
              if 4 <= L <= 90:
                  score += 18
              elif L <= 140:
                  score += 8
              elif L > 220:
                  score -= 18
              if re.search(r"\b(?:iphone|oneplus|redmi|thinkpad|ideapad|chromebook|perfume|headphones?|earbuds?|power bank|air conditioner|dog food|tws)\b", s, re.I):
                  score += 14
              if re.search(r"\b(?:gb|tb|gen\s*\d+|series\s*\d+|pro|max|plus|carbon|x\d+|k\d+|note\s*\d+|7t)\b", s, re.I):
                  score += 10
              if re.search(r"\b(?:wholesale|factory|oem|supplier|amazon top seller)\b", s, re.I):
                  score -= 10
              return score

          def add_candidate(tpid, key, value):
              s = clean(value)
              sc = title_score(key, s)
              if sc > -1000:
                  candidates[tpid].append((sc, s, key))

          def add_brand(tpid, value):
              s = clean(value)
              if not s or looks_like_id(s) or URL_RE.match(s):
                  return
              if norm(s) in SELLERISH:
                  return
              if 1 < len(s) <= 70:
                  brands[tpid].append(s)

          def add_image(tpid, value):
              s = clean(value)
              if URL_RE.match(s):
                  images[tpid].append(s)

          def add_price(tpid, value):
              try:
                  if value is None or isinstance(value, bool):
                      return
                  x = float(str(value).replace(",","").strip())
                  if math.isfinite(x) and x > 0:
                      prices[tpid].append(x)
              except Exception:
                  pass

          def walk(obj, inherited_tpid=None):
              if isinstance(obj, dict):
                  local_tpid = inherited_tpid
                  for k, v in obj.items():
                      kl = str(k).lower()
                      if kl == "tpid" and isinstance(v, (str,int,float)):
                          vv = clean(v).upper()
                          if ANY_TPID_RE.fullmatch(vv):
                              local_tpid = vv
                              seen_tpids.add(vv)
                              break

                  if local_tpid:
                      for k, v in obj.items():
                          kl = str(k).lower()
                          if isinstance(v, (str,int,float)) and not isinstance(v, bool):
                              if kl in NAME_KEYS:
                                  add_candidate(local_tpid, kl, v)
                              if kl in BRAND_KEYS:
                                  add_brand(local_tpid, v)
                              if kl in IMAGE_KEYS:
                                  add_image(local_tpid, v)
                              if kl in SELLER_KEYS:
                                  sv = clean(v)
                                  if sv:
                                      sellers[local_tpid].add(sv)
                              if kl in TYPE_KEYS:
                                  tv = clean(v)
                                  if tv:
                                      types[local_tpid].append(tv)
                              if kl in PRICE_KEYS:
                                  add_price(local_tpid, v)
                              if kl == "tpvid":
                                  vv = clean(v).upper()
                                  if vv:
                                      variants[local_tpid].add(vv)

                  for v in obj.values():
                      if isinstance(v, (dict, list)):
                          walk(v, local_tpid)

              elif isinstance(obj, list):
                  for v in obj:
                      walk(v, inherited_tpid)

          def parse_file(path):
              try:
                  if path.suffix.lower() == ".json":
                      data = json.loads(path.read_text(encoding="utf-8"))
                      walk(data)
                      return True
                  if path.suffix.lower() in {".ndjson",".jsonl"}:
                      ok = False
                      with path.open("r", encoding="utf-8", errors="replace") as fh:
                          for line in fh:
                              line=line.strip()
                              if not line:
                                  continue
                              try:
                                  walk(json.loads(line))
                                  ok = True
                              except Exception:
                                  continue
                      return ok
              except Exception:
                  return False
              return False

          for path in sorted(ROOT.rglob("*")):
              if path.is_file() and path.suffix.lower() in {".json",".ndjson",".jsonl"}:
                  if path.name == OUT.name:
                      continue
                  if parse_file(path):
                      source_files.append(str(path))

          # Also inspect V20 identity outputs if they exist outside the persistent package.
          for extra_root in [Path("data/search-v20"), Path("data")]:
              if not extra_root.exists():
                  continue
              for path in sorted(extra_root.glob("*identity*.json")):
                  if path.is_file() and parse_file(path):
                      source_files.append(str(path))

          def choose_title(tpid):
              pool = candidates.get(tpid, [])
              if pool:
                  pool = sorted(pool, key=lambda x: (x[0], -len(x[1])), reverse=True)
                  best = pool[0][1]
              else:
                  best = ""

              b = brands.get(tpid, [])
              brand = b[0] if b else ""
              # If model is short and lacks brand, combine them.
              if best and brand and norm(brand) not in norm(best) and len(best) <= 60:
                  if not re.search(r"\b(?:perfume|headphones?|earbuds?|laptop|phone|air conditioner|power bank)\b", best, re.I):
                      best = f"{brand} {best}".strip()

              if not best:
                  t = (types.get(tpid) or ["Product"])[0]
                  best = f"{brand} {t}".strip() if brand else clean(t).replace("_"," ").title()

              if looks_like_id(best):
                  best = "Product"
              return clean(best)

          rows = []
          for tpid in sorted(seen_tpids):
              title = choose_title(tpid)
              brand = (brands.get(tpid) or [""])[0]
              image = (images.get(tpid) or [""])[0]
              typ = (types.get(tpid) or [""])[0]
              price = min(prices[tpid]) if prices.get(tpid) else None
              scount = len(sellers.get(tpid, set()))
              vcount = len(variants.get(tpid, set()))
              rows.append({
                  "tpid": tpid,
                  "name": title,
                  "brand": brand,
                  "image": image,
                  "type": typ,
                  "price": price,
                  "sellerCount": scount,
                  "variantCount": vcount,
                  "sellers": sorted(sellers.get(tpid, set())),
              })

          bad = [r for r in rows if looks_like_id(r["name"]) or not r["name"]]
          exact_id_labels = [r for r in rows if norm(r["name"]) == norm(r["tpid"])]

          # We expect the committed master registry to be well above 10k.
          assert len(rows) >= 10000, f"presentation map unexpectedly small: {len(rows)}"
          assert not exact_id_labels, f"TPID labels leaked into display names: {exact_id_labels[:5]}"

          known = next((r for r in rows if r["tpid"] == "TPPH-D8C434EDE8F517"), None)
          if known:
              assert "oneplus" in norm(known["name"]) and "7t" in norm(known["name"]), f"OnePlus 7T canonical title not recovered: {known}"

          payload = {
              "version": "20.6.6.3",
              "mode": "presentation-only",
              "identityModified": False,
              "catalogModified": False,
              "sourceFilesScanned": len(set(source_files)),
              "products": rows,
              "diagnostics": {
                  "products": len(rows),
                  "emptyOrIdLabels": len(bad),
                  "exactTpidDisplayLabels": len(exact_id_labels),
                  "onePlus7tRecovered": bool(known),
              }
          }
          OUT.write_text(json.dumps(payload, ensure_ascii=False, separators=(",",":")), encoding="utf-8")
          print(json.dumps(payload["diagnostics"], indent=2))
          PY

      - name: Install direct TPID routing and presentation repair
        shell: bash
        run: |
          set -euo pipefail

          cat > js/v20-6-6-3-comparison-presentation.js <<'JS'
          (() => {
            "use strict";

            const VERSION = "20.6.6.3";
            const params = new URLSearchParams(location.search);
            if ((params.get("engine") || "").toLowerCase() !== "v2064") return;

            const MAP_URL = `/data/search-v20-6/presentation-v20-6-6-3.json?v=${encodeURIComponent(VERSION)}`;
            const TPID_RE = /\bTP[A-Z]{2,8}-[A-Z0-9]{8,}\b/i;
            let byTpid = new Map();
            let ready = false;

            const clean = v => String(v ?? "").replace(/\s+/g, " ").trim();
            const lower = v => clean(v).toLowerCase();

            function findTpid(root) {
              const text = clean(root?.textContent || "");
              const m = text.match(TPID_RE);
              return m ? m[0].toUpperCase() : "";
            }

            function humanName(row) {
              const n = clean(row?.name);
              return n && !TPID_RE.test(n) ? n : "";
            }

            function routeFor(row) {
              const p = new URLSearchParams();
              p.set("engine", "v2064");
              p.set("tpid", row.tpid);
              p.set("q", humanName(row) || row.tpid);
              p.set("tpdirect", "1");
              return `/find/?${p.toString()}`;
            }

            function nearestCard(node) {
              return node?.closest?.(
                "article, [data-tpid], [data-product-id], .tp-product-card, .tp-v2064-card, .tp-lite-card, .tp-product-grid > div"
              ) || null;
            }

            function replaceVisibleTpidLabels(root) {
              if (!root || !ready) return;
              const all = [root, ...root.querySelectorAll?.("*") || []];
              for (const el of all) {
                if (!el || el.children?.length) continue;
                const txt = clean(el.textContent);
                if (!TPID_RE.test(txt)) continue;
                const m = txt.match(TPID_RE);
                const tpid = m?.[0]?.toUpperCase();
                const row = byTpid.get(tpid);
                const name = humanName(row);
                if (!row || !name) continue;
                if (lower(txt) === lower(tpid)) {
                  el.textContent = name;
                  el.dataset.tpCanonicalLabel = "1";
                }
              }
            }

            function repairTechnicalMeta(root) {
              if (!root) return;
              root.querySelectorAll?.("p,span,div,strong,small").forEach(el => {
                const txt = clean(el.textContent);
                if (/^TPID\s+TP[A-Z]/i.test(txt) && /TPVID\s+TPV-/i.test(txt)) {
                  el.classList.add("tp-v20663-technical-id");
                }
              });
            }

            function repairButtons(root) {
              if (!root || !ready) return;
              root.querySelectorAll?.("a,button").forEach(btn => {
                const label = lower(btn.textContent);
                if (!(label.includes("compare sellers") || label.includes("seller offer") || label === "compare")) return;
                const card = nearestCard(btn);
                const tpid = findTpid(card || btn.parentElement);
                const row = byTpid.get(tpid);
                if (!row) return;

                const count = Number(row.sellerCount || 0);
                btn.textContent = count > 1 ? `Compare ${count} sellers` : "View seller offer";
                btn.dataset.tpDirectTpid = tpid;

                if (btn.tagName === "A") {
                  btn.setAttribute("href", routeFor(row));
                }
              });
            }

            function repairBroadCards(root=document) {
              if (!ready) return;
              replaceVisibleTpidLabels(root);
              repairButtons(root);
              repairTechnicalMeta(root);
            }

            function directTpidRecovery() {
              if (!ready) return false;
              const p = new URLSearchParams(location.search);
              const rawQ = clean(p.get("q") || "");
              const rawTpid = clean(p.get("tpid") || "");
              const qId = rawQ.match(TPID_RE)?.[0]?.toUpperCase() || "";
              const tpid = (rawTpid.match(TPID_RE)?.[0] || qId || "").toUpperCase();
              if (!tpid) return false;

              const row = byTpid.get(tpid);
              const name = humanName(row);
              if (!row || !name) return false;

              // The existing V20.6 exact resolver is query-name based.
              // Never feed it the TPID string itself. Preserve TPID separately.
              if (!rawQ || lower(rawQ) === lower(tpid)) {
                p.set("engine", "v2064");
                p.set("tpid", tpid);
                p.set("q", name);
                p.set("tpdirect", "1");
                location.replace(`/find/?${p.toString()}`);
                return true;
              }
              return false;
            }

            document.addEventListener("click", e => {
              const btn = e.target.closest?.("[data-tp-direct-tpid], a, button");
              if (!btn) return;
              const label = lower(btn.textContent);
              if (!(btn.dataset.tpDirectTpid || label.includes("compare sellers") || label.includes("seller offer"))) return;

              const tpid = (btn.dataset.tpDirectTpid || findTpid(nearestCard(btn) || btn.parentElement)).toUpperCase();
              const row = byTpid.get(tpid);
              if (!row) return;

              e.preventDefault();
              e.stopImmediatePropagation();
              location.href = routeFor(row);
            }, true);

            async function boot() {
              try {
                const res = await fetch(MAP_URL, {cache: "no-store"});
                if (!res.ok) throw new Error(`presentation map HTTP ${res.status}`);
                const payload = await res.json();
                for (const row of (payload.products || [])) {
                  if (row?.tpid) byTpid.set(String(row.tpid).toUpperCase(), row);
                }
                ready = byTpid.size > 10000;
                if (!ready) throw new Error(`presentation map too small: ${byTpid.size}`);

                if (directTpidRecovery()) return;

                repairBroadCards(document);

                const observer = new MutationObserver(records => {
                  for (const rec of records) {
                    for (const n of rec.addedNodes) {
                      if (n.nodeType === 1) repairBroadCards(n);
                    }
                  }
                });
                observer.observe(document.documentElement, {subtree:true, childList:true});

                // Late renderers in the existing V20.6 runtime can replace cards after fetch.
                [250, 700, 1400, 2500, 4500].forEach(ms => setTimeout(() => repairBroadCards(document), ms));
              } catch (err) {
                console.error("[TrendPilot V20.6.6.3]", err);
              }
            }

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", boot, {once:true});
            } else {
              boot();
            }
          })();
          JS

          cat > css/v20-6-6-3-comparison-presentation.css <<'CSS'
          /* TrendPilot V20.6.6.3 — presentation-only repair. No redesign. */

          body[data-tp-page="finder"] .tp-main-col,
          body[data-tp-page="finder"] [data-tp-product-grid],
          body[data-tp-page="finder"] [data-tp-product-grid] > *,
          body[data-tp-page="finder"] .tp-results-head {
            min-width: 0;
            max-width: 100%;
          }

          body[data-tp-page="finder"] [data-tp-product-grid] h1,
          body[data-tp-page="finder"] [data-tp-product-grid] h2,
          body[data-tp-page="finder"] [data-tp-product-grid] h3,
          body[data-tp-page="finder"] [data-tp-product-grid] strong,
          body[data-tp-page="finder"] .tp-results-head h2 {
            overflow-wrap: anywhere;
            word-break: normal;
          }

          body[data-tp-page="finder"] .tp-v20663-technical-id {
            font-size: 0.72rem !important;
            line-height: 1.35 !important;
            letter-spacing: 0.04em !important;
            opacity: 0.68;
            overflow-wrap: anywhere;
          }

          body[data-tp-page="finder"] .tp-result-tabs {
            max-width: 100%;
            overflow-x: auto;
            overscroll-behavior-inline: contain;
            scrollbar-width: thin;
          }

          body[data-tp-page="finder"] [data-tp-product-grid] img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
          }

          @media (max-width: 760px) {
            body[data-tp-page="finder"] .tp-shell {
              min-width: 0;
            }

            body[data-tp-page="finder"] .tp-results-head,
            body[data-tp-page="finder"] [data-tp-product-grid] {
              scroll-margin-top: 120px;
            }

            body[data-tp-page="finder"] [data-tp-product-grid] > * {
              overflow: hidden;
            }

            body[data-tp-page="finder"] [data-tp-product-grid] a,
            body[data-tp-page="finder"] [data-tp-product-grid] button {
              max-width: 100%;
              white-space: normal;
            }

            body[data-tp-page="finder"] .tp-result-tabs > * {
              flex: 0 0 auto;
              max-width: calc(100vw - 56px);
              white-space: nowrap;
            }

            body[data-tp-page="finder"] table {
              width: 100%;
              max-width: 100%;
              table-layout: fixed;
            }

            body[data-tp-page="finder"] th,
            body[data-tp-page="finder"] td {
              overflow-wrap: anywhere;
            }
          }
          CSS

      - name: Inject V20.6.6.3 presentation layer into Finder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("find/index.html")
          s = p.read_text(encoding="utf-8")

          css = '<link rel="stylesheet" href="/css/v20-6-6-3-comparison-presentation.css?v=20.6.6.3">'
          js  = '<script defer src="/js/v20-6-6-3-comparison-presentation.js?v=20.6.6.3"></script>'

          # Idempotent: remove older copies of this same layer only.
          s = re.sub(r'\s*<link[^>]+v20-6-6-3-comparison-presentation\.css[^>]*>\s*', '\n', s, flags=re.I)
          s = re.sub(r'\s*<script[^>]+v20-6-6-3-comparison-presentation\.js[^>]*></script>\s*', '\n', s, flags=re.I)

          assert "</head>" in s and "</body>" in s, "Finder HTML contract changed"
          s = s.replace("</head>", css + "\n</head>", 1)
          s = s.replace("</body>", js + "\n</body>", 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate direct TPID routing and mobile presentation contract
        shell: bash
        run: |
          set -euo pipefail

          node --check js/v20-6-6-3-comparison-presentation.js

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          payload = json.loads(Path("data/search-v20-6/presentation-v20-6-6-3.json").read_text(encoding="utf-8"))
          rows = payload.get("products", [])
          assert len(rows) >= 10000
          by = {str(x.get("tpid","")).upper(): x for x in rows}

          # Critical route from the screenshots.
          one = by.get("TPPH-D8C434EDE8F517")
          if one:
              assert "oneplus" in str(one.get("name","")).lower()
              assert "7t" in str(one.get("name","")).lower()

          bad = [x for x in rows if re.fullmatch(r"TP[A-Z]{2,8}-[A-Z0-9]{8,}", str(x.get("name","")), re.I)]
          assert not bad, bad[:5]

          html = Path("find/index.html").read_text(encoding="utf-8")
          assert html.count("v20-6-6-3-comparison-presentation.css") == 1
          assert html.count("v20-6-6-3-comparison-presentation.js") == 1

          js = Path("js/v20-6-6-3-comparison-presentation.js").read_text(encoding="utf-8")
          assert 'p.set("tpid", row.tpid)' in js
          assert 'p.set("q", humanName(row) || row.tpid)' in js
          assert 'location.replace' in js
          assert 'View seller offer' in js
          assert 'Compare ${count} sellers' in js

          print("V20.6.6.3 validation PASS")
          print("Presentation rows:", len(rows))
          print("TPID-as-title rows:", len(bad))
          print("Identity files modified: 0")
          print("Canonical catalog files modified: 0")
          PY

          if git diff --name-only | grep -q '^data/catalog-v19/'; then
            echo "ERROR: canonical V19 catalogs must never be modified by this workflow"
            exit 1
          fi

          if git diff --name-only | grep -Eq 'master-identity|registry-v20|identity.*json'; then
            echo "ERROR: identity registry modification detected"
            exit 1
          fi

      - name: Commit V20.6.6.3 presentation repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/search-v20-6/presentation-v20-6-6-3.json \
            js/v20-6-6-3-comparison-presentation.js \
            css/v20-6-6-3-comparison-presentation.css \
            find/index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: V20.6.6.3 direct TPID comparison routing and labels"
            git push origin HEAD:main
          fi

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
