name: TrendPilot Admitad Product Feeds V15.3.1 Fast Staging

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-admitad-products-v15-3-1-fast
  cancel-in-progress: true

jobs:
  build-fast-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    env:
      ADMITAD_CLIENT_ID_PRIMARY: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_ID_ALT: ${{ secrets.client_id }}
      ADMITAD_CLIENT_SECRET_PRIMARY: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      ADMITAD_CLIENT_SECRET_ALT: ${{ secrets.client_secret }}
      WEBSITE_ID: "2980568"
      TARGET_DOMAIN: trendpilotchoice.com
      MAX_PRODUCTS_PER_SELLER: "80"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Stream small samples from active Admitad feeds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, csv, gzip, io, json, os, re, socket
          import urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          API='https://api.admitad.com'
          WEBSITE_ID=int(os.environ['WEBSITE_ID'])
          MAX_PER=int(os.environ['MAX_PRODUCTS_PER_SELLER'])
          socket.setdefaulttimeout(35)

          def env(*names):
              for n in names:
                  v=(os.environ.get(n) or '').strip()
                  if v:
                      return v
              return ''

          cid=env('ADMITAD_CLIENT_ID_PRIMARY','ADMITAD_CLIENT_ID_ALT')
          secret=env('ADMITAD_CLIENT_SECRET_PRIMARY','ADMITAD_CLIENT_SECRET_ALT')
          if not cid or not secret:
              raise SystemExit('Missing Admitad API credentials.')

          def req(url, method='GET', headers=None, data=None, timeout=35):
              r=urllib.request.Request(
                  url, data=data, method=method,
                  headers={
                      'Accept':'*/*',
                      'User-Agent':'TrendPilot-Admitad-Fast-Staging/15.3.1',
                      **(headers or {})
                  }
              )
              return urllib.request.urlopen(r, timeout=timeout)

          def req_json(url, method='GET', headers=None, data=None):
              with req(url,method,headers,data) as resp:
                  return json.loads(resp.read().decode('utf-8','replace'))

          basic=base64.b64encode(f'{cid}:{secret}'.encode()).decode()
          token_body=urllib.parse.urlencode({
              'grant_type':'client_credentials',
              'client_id':cid,
              'scope':'websites advcampaigns_for_website deeplink_generator'
          }).encode()
          token=req_json(
              f'{API}/token/', 'POST',
              {
                  'Authorization':f'Basic {basic}',
                  'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'
              },
              token_body
          ).get('access_token')
          if not token:
              raise SystemExit('No Admitad access token.')
          auth={'Authorization':f'Bearer {token}'}

          q=urllib.parse.urlencode({'limit':200,'offset':0,'connection_status':'active'})
          campaigns=req_json(
              f'{API}/advcampaigns/website/{WEBSITE_ID}/?{q}',
              headers=auth
          ).get('results',[])

          bridge=json.loads(Path('data/approved-product-sellers-v15-bridge.json').read_text(encoding='utf-8'))
          allowed_ids={
              int(x['campaign_id']) for x in bridge.get('sellers') or []
              if isinstance(x,dict)
              and x.get('network')=='Admitad'
              and x.get('campaign_id')
              and x.get('approved') is True
          }
          campaigns=[
              c for c in campaigns
              if isinstance(c,dict)
              and int(c.get('id') or 0) in allowed_ids
              and str(c.get('connection_status') or c.get('status') or '').lower()=='active'
          ]

          def nk(v):
              return re.sub(r'[^a-z0-9]+','',str(v or '').lower())

          def pick(row,keys):
              m={nk(k):v for k,v in row.items()}
              for k in keys:
                  v=m.get(nk(k))
                  if v not in (None,''):
                      return str(v).strip()
              return ''

          def num(v):
              m=re.search(r'\d+(?:[.,]\d+)?',str(v or '').replace(' ',''))
              if not m:
                  return None
              try:
                  return float(m.group(0).replace(',','.'))
              except:
                  return None

          TITLE=['name','title','productname','product','offername']
          URL=['url','producturl','deeplink','link','landingpage','productlink']
          IMG=['picture','image','imageurl','pictureurl','img','photo','thumbnail']
          PRICE=['price','currentprice','saleprice','finalprice','amount']
          CUR=['currency','currencyid','currencycode']
          IDS=['id','offerid','productid','sku','article','vendorcode']
          CAT=['category','categoryname','type','section']
          BRAND=['vendor','brand','manufacturer']

          def normalize(row,c):
              title=pick(row,TITLE)
              dest=pick(row,URL)
              if not title or not dest.startswith(('http://','https://')):
                  return None
              image=pick(row,IMG)
              return {
                  'source_id':pick(row,IDS),
                  'title':title[:300],
                  'seller':str(c.get('name') or '').strip(),
                  'campaign_id':int(c.get('id') or 0),
                  'destination_url':dest,
                  'image':image if image.startswith(('http://','https://')) else '',
                  'price':num(pick(row,PRICE)),
                  'currency':pick(row,CUR)[:12],
                  'category':pick(row,CAT)[:160],
                  'brand':pick(row,BRAND)[:100],
                  'network':'Admitad'
              }

          def csv_urls(c):
              urls=[]
              if c.get('products_csv_link'):
                  urls.append(c['products_csv_link'])
              for f in c.get('feeds_info') or []:
                  if isinstance(f,dict) and f.get('csv_link'):
                      urls.append(f['csv_link'])
              out=[]; seen=set()
              for u in urls:
                  if u and u not in seen:
                      seen.add(u); out.append(u)
              return out

          def stream_csv(url, max_bytes=512*1024):
              with req(url,timeout=35) as resp:
                  enc=(resp.headers.get('Content-Encoding') or '').lower()
                  ctype=(resp.headers.get('Content-Type') or '').lower()
                  raw=resp
                  if 'gzip' in enc or url.lower().endswith('.gz') or 'gzip' in ctype:
                      raw=gzip.GzipFile(fileobj=resp)
                  data=raw.read(max_bytes)
                  text=data.decode('utf-8-sig','replace')
                  try:
                      dialect=csv.Sniffer().sniff(text[:10000],delimiters=',;\t|')
                  except:
                      dialect=csv.excel
                  reader=csv.DictReader(io.StringIO(text),dialect=dialect)
                  for row in reader:
                      if isinstance(row,dict):
                          yield {str(k or ''):v for k,v in row.items()}

          def deeplinks(campaign_id,products):
              result=[]
              for start in range(0,len(products),80):
                  batch=products[start:start+80]
                  params=[('ulp',p['destination_url']) for p in batch]
                  params.append(('subid','products'))
                  url=f'{API}/deeplink/{WEBSITE_ID}/advcampaign/{campaign_id}/?'+urllib.parse.urlencode(params)
                  try:
                      payload=req_json(url,headers=auth)
                  except Exception as e:
                      print(f'deeplink warning {campaign_id}: {e}')
                      result += ['']*len(batch)
                      continue
                  links=[x.get('link','') if isinstance(x,dict) else '' for x in (payload if isinstance(payload,list) else [])]
                  links += ['']*(len(batch)-len(links))
                  result += links[:len(batch)]
              return result

          all_products=[]
          reports=[]

          for c in campaigns:
              name=str(c.get('name') or '').strip()
              report={'seller':name,'campaign_id':int(c.get('id') or 0),'products':0,'tracked':0,'status':'skipped','error':''}
              urls=csv_urls(c)
              if not urls:
                  report['status']='no-csv-feed'
                  reports.append(report)
                  print(f'{name}: no CSV feed, skipped')
                  continue

              try:
                  products=[]; seen=set()
                  for row in stream_csv(urls[0]):
                      p=normalize(row,c)
                      if not p:
                          continue
                      k=p['source_id'] or p['destination_url']
                      if k in seen:
                          continue
                      seen.add(k)
                      products.append(p)
                      if len(products)>=MAX_PER:
                          break

                  if not products:
                      report['status']='no-valid-products'
                      reports.append(report)
                      print(f'{name}: no valid products in sample')
                      continue

                  links=deeplinks(report['campaign_id'],products)
                  for p,link in zip(products,links):
                      if not link:
                          continue
                      p['affiliate_url']=link
                      p.pop('destination_url',None)
                      all_products.append(p)

                  report['products']=len(products)
                  report['tracked']=sum(1 for x in links if x)
                  report['status']='ok' if report['tracked'] else 'no-deeplinks'
              except Exception as e:
                  report['status']='error'
                  report['error']=str(e)[:220]

              reports.append(report)
              print(f"{name}: sampled={report['products']} tracked={report['tracked']} status={report['status']}")

          if not all_products:
              raise SystemExit('No tracked products staged. Nothing published.')

          output={
              'version':'15.3.1-fast-staging',
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'website_id':WEBSITE_ID,
              'domain':os.environ['TARGET_DOMAIN'],
              'product_count':len(all_products),
              'reports':reports,
              'products':all_products
          }
          Path('data').mkdir(exist_ok=True)
          Path('data/admitad-products-new-account-v15-3-1.json').write_text(
              json.dumps(output,ensure_ascii=False,separators=(',',':'))+'\n',
              encoding='utf-8'
          )
          print(f'TOTAL TRACKED PRODUCTS: {len(all_products)}')
          PY

      - name: Validate fast staging
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/admitad-products-new-account-v15-3-1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['website_id']==2980568
          assert d['domain']=='trendpilotchoice.com'
          assert d['products']
          for x in d['products']:
              assert x['network']=='Admitad'
              assert str(x.get('affiliate_url') or '').startswith('http')
              assert 'destination_url' not in x
          print(f"Validated {len(d['products'])} tracked products.")
          for r in d.get('reports',[]):
              print(f"- {r['seller']}: {r['tracked']} tracked / {r['status']}")
          PY
          git diff --check

      - name: Confirm live Products UI untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- find/index.html
          git diff --quiet -- js/product-discovery-v15.js

      - name: Publish fast staging only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admitad-products-new-account-v15-3-1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: stage fast Admitad product samples"
          git push origin HEAD:main
          {
            echo "## Admitad Product Feeds V15.3.1 Fast Staging"
            echo ""
            echo "- Streams only a small CSV sample instead of downloading entire feeds."
            echo "- Maximum 80 products per seller."
            echo "- Generates deeplinks for the new Ad Space 2980568."
            echo "- Skips slow/non-CSV feeds during this first fast pass."
            echo "- Does not modify the live Products page."
          } >> "$GITHUB_STEP_SUMMARY"
