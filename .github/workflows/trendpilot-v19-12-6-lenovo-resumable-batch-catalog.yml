name: TrendPilot V19.12.6 — Seller 12 Lenovo Resumable Batch Catalog

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Lenovo product pages per run. Default 240; lower it only if GitHub is slow."
        required: false
        default: "240"

permissions:
  contents: write

concurrency:
  group: trendpilot-v19-12-1-lenovo
  cancel-in-progress: false

jobs:
  seller-12-lenovo:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    env:
      ADMITAD_CLIENT_ID_PRIMARY: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_ID_ALT: ${{ secrets.client_id }}
      ADMITAD_CLIENT_SECRET_PRIMARY: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      ADMITAD_CLIENT_SECRET_ALT: ${{ secrets.client_secret }}
      WEBSITE_ID: "2980568"
      VERSION: "19.12.6"
      BATCH_SIZE: "${{ inputs.batch_size || '240' }}"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Verify V19 state before Lenovo
        shell: bash
        run: |
          set -euo pipefail

          test -s scripts/catalog-v19/build-canonical-seller.mjs
          test -s scripts/catalog-v19/discover-seller-sources.mjs
          test -s scripts/catalog-v19/build-global-resolver.mjs
          test -s scripts/catalog-v19/build-source-aware-seller-queue.mjs
          test -s data/catalog-v19/catalog-set-v1.json
          test -s data/catalog-v19/seller-build-queue-v3.json
          test -s data/product-seller-registry-v17.json

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          registry = json.loads(Path("data/product-seller-registry-v17.json").read_text())
          public = {x["name"] for x in registry["sellers"] if x.get("public")}

          assert "Lenovo" in public
          for blocked in ["Joom", "Temu", "FilamentPRO EU CPS"]:
              assert blocked not in public, blocked

          catalog = json.loads((root/"catalog-set-v1.json").read_text())
          names = [x["name"] for x in catalog["sellers"]]

          assert len(names) == 11, names
          assert "MFI Medical" in names
          assert "Lenovo" not in names
          assert len(names) == len(set(names))

          queue = json.loads((root/"seller-build-queue-v3.json").read_text())
          remaining = {x["seller"]: x for x in queue.get("remaining", [])}
          assert "Lenovo" in remaining, remaining
          assert int(remaining["Lenovo"].get("qualifiedProducts", 0)) == 0

          print("V19 pre-Lenovo state PASS.")
          print("Completed sellers:", len(names))
          print("Remaining:", list(remaining))
          PY

      - name: Prepare Lenovo checkpoint directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trendpilot-lenovo-cache /tmp/lenovo-v19 data/catalog-v19/source-ingestion data/source-ingestion-v19

      - name: Restore latest Lenovo batch checkpoint
        id: restore_checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .trendpilot-lenovo-cache
          key: trendpilot-lenovo-v19-12-6-${{ github.run_id }}
          restore-keys: |
            trendpilot-lenovo-v19-12-6-

      - name: Resolve active Lenovo Admitad relationship
        id: admitad
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFAST'
          import base64, json, os, urllib.parse, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          API="https://api.admitad.com"; WEBSITE_ID=int(os.environ["WEBSITE_ID"]); VERSION=os.environ["VERSION"]
          def first(*names):
              for n in names:
                  v=(os.environ.get(n) or "").strip()
                  if v:return v
              return ""
          cid=first("ADMITAD_CLIENT_ID_PRIMARY","ADMITAD_CLIENT_ID_ALT");secret=first("ADMITAD_CLIENT_SECRET_PRIMARY","ADMITAD_CLIENT_SECRET_ALT")
          if not cid or not secret: raise SystemExit("Missing Admitad credentials.")
          def jreq(url,method="GET",headers=None,data=None,timeout=35):
              req=urllib.request.Request(url,data=data,method=method,headers={"Accept":"application/json","User-Agent":"TrendPilot-Lenovo-V19.12.6/1.0",**(headers or {})})
              with urllib.request.urlopen(req,timeout=timeout) as r:return json.loads(r.read().decode("utf-8","replace"))
          basic=base64.b64encode(f"{cid}:{secret}".encode()).decode();body=urllib.parse.urlencode({"grant_type":"client_credentials","client_id":cid,"scope":"websites advcampaigns_for_website deeplink_generator coupons_for_website"}).encode()
          token=jreq(f"{API}/token/","POST",{"Authorization":f"Basic {basic}","Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body).get("access_token")
          if not token: raise SystemExit("Admitad token was not returned.")
          auth={"Authorization":f"Bearer {token}"};q=urllib.parse.urlencode({"limit":200,"offset":0,"connection_status":"active"})
          campaigns=jreq(f"{API}/advcampaigns/website/{WEBSITE_ID}/?{q}",headers=auth).get("results",[])
          candidates=[c for c in campaigns if "lenovo" in str(c.get("name") or "").casefold()]
          if not candidates: raise SystemExit("No active Lenovo campaign is attached to this Admitad website.")
          candidates.sort(key=lambda c:(bool(c.get("allow_deeplink")),bool(c.get("show_products_links")),int(c.get("id") or 0)),reverse=True)
          campaign=candidates[0];campaign_id=int(campaign.get("id") or 0);campaign_name=str(campaign.get("name") or "").strip()
          if not campaign_id or not bool(campaign.get("allow_deeplink")): raise SystemExit("Lenovo campaign is active but deeplinking is unavailable.")
          coupons=[];coupon_error=""
          try:
              cq=urllib.parse.urlencode({"limit":100,"offset":0,"campaign":campaign_id});d=jreq(f"{API}/coupons/website/{WEBSITE_ID}/?{cq}",headers=auth);coupons=d.get("results",[]) if isinstance(d,dict) else []
          except Exception as exc: coupon_error=str(exc)[:300]
          Path("data/catalog-v19/source-ingestion/lenovo-coupons.json").write_text(json.dumps(coupons,ensure_ascii=False,indent=2)+"\n")
          audit={"version":VERSION,"generatedAt":datetime.now(timezone.utc).isoformat(),"websiteId":WEBSITE_ID,"campaignId":campaign_id,"campaignName":campaign_name,"allowDeeplink":True,"couponsFound":len(coupons),"couponError":coupon_error,"strategy":"fast relationship verification only; contaminated feeds are not rescanned"}
          Path("data/catalog-v19/source-ingestion/lenovo-admitad-audit.json").write_text(json.dumps(audit,indent=2)+"\n")
          Path("/tmp/lenovo-v19/runtime.json").write_text(json.dumps({"campaignId":campaign_id,"campaignName":campaign_name,"token":token}))
          with open(os.environ["GITHUB_OUTPUT"],"a") as fh:
              fh.write(f"campaign_id={campaign_id}\n");fh.write("allow_deeplink=true\n")
          print(f"Lenovo relationship PASS: {campaign_name} ({campaign_id})");print("Coupons:",len(coupons));print("Old 600,000-row feed scan: SKIPPED")
          PYFAST

      - name: Build one resumable Lenovo catalog batch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trendpilot-lenovo-cache data/source-ingestion-v19 data/catalog-v19/source-ingestion .trendpilot-tmp
          npm install --no-save playwright@1.54.2 >/dev/null
          node -e "import('playwright').then(()=>console.log('Playwright module PASS')).catch(e=>{console.error(e);process.exit(1)})"
          npx playwright install --with-deps chromium >/dev/null
