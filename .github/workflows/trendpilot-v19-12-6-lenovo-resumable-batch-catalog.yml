          audit=json.loads(Path("data/catalog-v19/source-ingestion/lenovo-direct-source-audit.json").read_text());ready=bool(audit.get("ready"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as fh:
              fh.write(f"ready={'true' if ready else 'false'}\n");fh.write(f"count={int(audit.get('productsStaged',0))}\n");fh.write(f"processed={int(audit.get('productsProcessed',0))}\n");fh.write(f"remaining={int(audit.get('remainingUrls',0))}\n");fh.write(f"complete={'true' if audit.get('complete') else 'false'}\n")
          print("Lenovo batch:",audit.get("batchStart"),"to",audit.get("batchEnd"));print("Progress:",audit.get("productsProcessed"),"/",audit.get("productUrlsDiscovered"));print("Commercially complete:",audit.get("productsStaged"));print("Remaining:",audit.get("remainingUrls"));print("Final gate:","PASS" if ready else "CHECKPOINT SAVED")
          PYOUT
          rm -rf .trendpilot-tmp

      - name: Save Lenovo batch checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .trendpilot-lenovo-cache
          key: trendpilot-lenovo-v19-12-6-${{ github.run_id }}

      - name: Discover Lenovo source through V19 intake
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          node scripts/catalog-v19/discover-seller-sources.mjs \
            --seller="Lenovo" \
            --slug=lenovo \
            --version="${VERSION}"

          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("data/catalog-v19/source-manifests/lenovo.json")
          manifest = json.loads(p.read_text())

          assert manifest["seller"] == "Lenovo"
          assert manifest["qualifiedFileCount"] >= 1
          assert manifest["qualifiedUniqueProducts"] >= 20
          assert "data/source-ingestion-v19/lenovo-direct-catalog.json" in manifest["qualifiedFiles"]

          row = next(
              x for x in manifest["files"]
              if x["file"] == "data/source-ingestion-v19/lenovo-direct-catalog.json"
          )

          print("Lenovo intake metrics:", json.dumps({
              "uniqueProducts": row["uniqueProducts"],
              "stableIdPercent": row["stableIdPercent"],
              "pricePercent": row["pricePercent"],
              "imagePercent": row["imagePercent"],
              "linkPercent": row["linkPercent"],
              "qualifies": row["qualifies"]
          }, indent=2))

          assert row["qualifies"] is True, row
          assert row["stableIdPercent"] == 100, row
          assert row["linkPercent"] == 100, row
          assert row["pricePercent"] >= 50, row
          assert row["imagePercent"] >= 70, row

          print("Lenovo V19 source intake PASS.")
          PY

      - name: Build Seller 12 — Lenovo
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          node scripts/catalog-v19/build-canonical-seller.mjs \
            --seller="Lenovo" \
            --slug=lenovo \
            --version="${VERSION}" \
            --role=twelfth-canonical-catalog \
            --source-manifest=data/catalog-v19/source-manifests/lenovo.json

      - name: Validate Lenovo canonical catalog
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json, math

          root = Path("data/catalog-v19")
          intake = json.loads((root/"source-manifests/lenovo.json").read_text())
          seller = root/"sellers/lenovo"
          manifest = json.loads((seller/"manifest.json").read_text())
          audit = json.loads((seller/"audit.json").read_text())

          total = int(manifest["metrics"]["totalProducts"])
          source_total = int(intake["qualifiedUniqueProducts"])

          assert manifest["version"] == "19.12.6"
          assert manifest["seller"]["name"] == "Lenovo"
          assert total >= 20
          assert total >= math.floor(source_total * 0.95)

          metrics = manifest["metrics"]
          assert metrics["sourceQualified"] == total
          assert metrics["stableSellerId"] == total
          assert metrics["link"] == total
          assert metrics["price"] / total >= 0.50
          assert metrics["image"] / total >= 0.70
          assert metrics["brand"] / total >= 0.95

          assert audit["sourceLeak"] is False
          assert audit["blockedSellerLeak"] is False
          assert audit["duplicateProductKeys"] is False

          failed = [x for x in audit.get("roundTripSamples", []) if not x.get("resolved")]
          assert not failed, failed[:5]

          print("Lenovo canonical catalog PASS.")
          print(json.dumps({
              "canonicalProducts": total,
              "stableId": metrics["stableSellerId"],
              "brand": metrics["brand"],
              "modelAny": metrics["modelAny"],
              "structuredSpecs": metrics["structuredSpecs"],
              "derivedSpecs": metrics["derivedSpecs"],
              "price": metrics["price"],
              "image": metrics["image"],
              "affiliateOrDestinationLink": metrics["link"]
          }, indent=2))
          PY

      - name: Add Lenovo to validated catalog set
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path("data/catalog-v19/catalog-set-v1.json")
          catalog = json.loads(path.read_text())
          sellers = list(catalog.get("sellers", []))

          names = [x["name"] for x in sellers]
          assert len(names) == 11, names
          assert "MFI Medical" in names
          assert "Lenovo" not in names

          sellers.append({"name": "Lenovo", "slug": "lenovo"})

          assert len({x["name"] for x in sellers}) == 12
          for blocked in ["Joom", "Temu", "FilamentPRO EU CPS"]:
              assert blocked not in {x["name"] for x in sellers}

          catalog["version"] = "19.12.6"
          catalog["sellers"] = sellers
          path.write_text(json.dumps(catalog, indent=2) + "\n")
          print("Lenovo appended to catalog-set-v1.json.")
          PY

      - name: Rebuild twelve-seller resolver and source queue
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          for file in [
              Path("scripts/catalog-v19/build-global-resolver.mjs"),
              Path("scripts/catalog-v19/build-source-aware-seller-queue.mjs")
          ]:
              text = file.read_text()
              text, n = re.subn(
                  r'const VERSION = "[^"]+";',
                  'const VERSION = "19.12.6";',
                  text,
                  count=1
              )
              assert n == 1, file
              file.write_text(text)
          PY

          node --check scripts/catalog-v19/build-global-resolver.mjs
          node --check scripts/catalog-v19/build-source-aware-seller-queue.mjs

          node scripts/catalog-v19/build-global-resolver.mjs
          node scripts/catalog-v19/build-source-aware-seller-queue.mjs

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          cross = json.loads((root/"cross-seller-audit-v1.json").read_text())
          queue = json.loads((root/"seller-build-queue-v3.json").read_text())
          catalog = json.loads((root/"catalog-set-v1.json").read_text())

          assert cross["version"] == "19.12.6"
          assert len(catalog["sellers"]) == 12
          assert len(cross["sellers"]) == 12
          assert cross["sellerCounts"]["Lenovo"] >= 20
          assert cross["blockedSellerLeak"] is False
          assert cross["duplicateGlobalProductKeys"] is False
          assert not cross.get("insertionFailures")
          assert not cross.get("failedRoundTrips")

          completed = set(queue.get("completedSellers", []))
          assert "Lenovo" in completed

          remaining = {x["seller"] for x in queue.get("remaining", [])}
          assert remaining <= {"TikTok Shop US"}, remaining

          for blocked in ["Joom", "Temu", "FilamentPRO EU CPS"]:
              assert blocked not in completed
              assert blocked not in remaining

          print("Twelve-seller resolver PASS.")
          print("Total canonical records:", cross["totalRecords"])
          print("Remaining source work:", sorted(remaining))
          PY

      - name: Create concise V19.12.6 report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREPORT'
          from pathlib import Path
          import json
          root=Path("data/catalog-v19");report=root/"V19.12.6-REPORT.md";ap=root/"source-ingestion/lenovo-admitad-audit.json";sp=root/"source-ingestion/lenovo-direct-source-audit.json";cp=Path(".trendpilot-lenovo-cache/progress.json")
          admitad=json.loads(ap.read_text()) if ap.exists() else {};source=json.loads(sp.read_text()) if sp.exists() else {};progress=json.loads(cp.read_text()) if cp.exists() else {}
          lines=["# TrendPilot V19.12.6 — Seller 12: Lenovo Resumable Batch Catalog","","> Visitor UI/search API are unchanged. Incomplete Lenovo work is saved in a GitHub Actions checkpoint, not committed to production.","","## Admitad",f"- Campaign: **{admitad.get('campaignName','—')}**",f"- Campaign ID: **{admitad.get('campaignId','—')}**",f"- Deeplink: **{'PASS' if admitad.get('allowDeeplink') else 'NO'}**",f"- Coupons found: **{admitad.get('couponsFound',0)}**","- Contaminated 600,000-row feed scan: **SKIPPED**","","## Batch progress",f"- Official Lenovo product URLs: **{int(source.get('productUrlsDiscovered',progress.get('totalUrls',0))):,}**",f"- Processed: **{int(source.get('productsProcessed',progress.get('processed',0))):,}**",f"- Remaining: **{int(source.get('remainingUrls',0)):,}**",f"- Commercial candidates: **{int(source.get('qualifiedCandidates',progress.get('qualifiedCandidates',0))):,}**",f"- Fully visitor-ready products so far: **{int(source.get('productsStaged',progress.get('affiliateReady',0))):,}**",f"- Failed pages: **{int(source.get('failedPages',progress.get('failedPages',0))):,}**",""]
          mf=root/"sellers/lenovo/manifest.json";cf=root/"cross-seller-audit-v1.json"
          if source.get("ready") and mf.exists() and cf.exists():
              m=json.loads(mf.read_text())["metrics"];cross=json.loads(cf.read_text());lines += ["## Lenovo final gate","**PASS — full discovered URL list processed.**",f"- Canonical Lenovo products: **{m['totalProducts']:,}**",f"- Price: **{m['price']:,}**",f"- Image: **{m['image']:,}**",f"- Link: **{m['link']:,}**",f"- Shared resolver total records: **{cross['totalRecords']:,}**","","Next seller: **TikTok Shop US**."]
          else: lines += ["## Lenovo batch gate","**CHECKPOINT SAVED — not a production failure.**",source.get("reason","Run the same workflow again to continue from the saved index."),"","Run **the same V19.12.6 workflow again**. It restores the latest checkpoint and starts at the next unprocessed Lenovo URL."]
          report.write_text("\n".join(lines)+"\n");print(report.read_text())
          PYREPORT

      - name: Commit Seller 12 only after all V19.12.6 gates pass
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s data/catalog-v19/sellers/lenovo/manifest.json
          test -s data/catalog-v19/cross-seller-audit-v1.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          cross = json.loads(Path("data/catalog-v19/cross-seller-audit-v1.json").read_text())
          queue = json.loads(Path("data/catalog-v19/seller-build-queue-v3.json").read_text())
          assert cross["version"] == "19.12.6"
          assert cross["sellerCounts"]["Lenovo"] >= 20
          assert {x["seller"] for x in queue.get("remaining", [])} <= {"TikTok Shop US"}
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/source-ingestion-v19/lenovo-direct-catalog.json \
            data/catalog-v19/source-ingestion/lenovo-admitad-audit.json \
            data/catalog-v19/source-ingestion/lenovo-direct-source-audit.json \
            data/catalog-v19/source-ingestion/lenovo-coupons.json \
            data/catalog-v19/source-manifests/lenovo.json \
            data/catalog-v19/sellers/lenovo \
            data/catalog-v19/catalog-set-v1.json \
            data/catalog-v19/global-resolver-v1.json \
            data/catalog-v19/cross-seller-audit-v1.json \
            data/catalog-v19/seller-build-queue-v3.json \
            data/catalog-v19/V19.12.6-REPORT.md \
            scripts/catalog-v19/build-global-resolver.mjs \
            scripts/catalog-v19/build-source-aware-seller-queue.mjs

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Lenovo V19.12.6 state is already current."
          else
            git commit -m "feat: add Lenovo canonical catalog with Admitad deeplinks"
            if ! git push origin HEAD:main; then
