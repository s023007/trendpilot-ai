          function mergeById(rows){const m=new Map();for(const r of rows||[]){if(!r?.sourceProductId)continue;const k=String(r.sourceProductId).toLowerCase(),old=m.get(k);if(!old||richness(r)>richness(old))m.set(k,r)}return m}
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127 Safari/537.36',locale:'en-US',viewport:{width:1365,height:900}});
