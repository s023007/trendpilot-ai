          async function scrape(url){const p=await ctx.newPage(),networkJson=[];p.on('response',async r=>{try{if(networkJson.length<30&&(r.headers()['content-type']||'').toLowerCase().includes('json'))networkJson.push(await r.json())}catch{}});try{await p.goto(url,{waitUntil:'domcontentloaded',timeout:22000});await p.waitForTimeout(700);await p.mouse.wheel(0,650);await p.waitForTimeout(250);const d=await p.evaluate(()=>{const c=v=>v==null?'':String(v).replace(/\s+/g,' ').trim(),meta=(...sels)=>{for(const s of sels){const e=document.querySelector(s);if(e?.content)return e.content.trim()}return ''},products=[];for(const s of document.querySelectorAll('script[type="application/ld+json"]')){try{const j=JSON.parse(s.textContent||'null'),walk=x=>{if(!x)return;if(Array.isArray(x))return x.forEach(walk);if(typeof x!=='object')return;if(x['@graph'])walk(x['@graph']);const tt=Array.isArray(x['@type'])?x['@type']:[x['@type']];if(tt.some(z=>String(z).toLowerCase()==='product'))products.push(x);for(const v of Object.values(x))if(v&&typeof v==='object')walk(v)};walk(j)}catch{}}const q=products[0]||{};let offer=q.offers||{};if(Array.isArray(offer))offer=offer.find(x=>x&&typeof x==='object')||{};let brand=q.brand||'';if(brand&&typeof brand==='object')brand=brand.name||'';let ldImage=q.image||'';if(Array.isArray(ldImage))ldImage=ldImage[0]||'';if(ldImage&&typeof ldImage==='object')ldImage=ldImage.url||ldImage.contentUrl||'';const title=c(q.name)||meta('meta[property="og:title"]')||c(document.querySelector('h1')?.textContent),body=c(document.body?.innerText||''),unavailable=/\b(no longer available|discontinued|withdrawn|product is unavailable)\b/i.test(body),images=[],add=(u,score)=>{u=c(u);if(!u)return;try{u=new URL(u,location.href).href}catch{return}images.push({u,score})};add(ldImage,120);add(meta('meta[property="og:image"]','meta[name="twitter:image"]'),110);for(const img of document.images){const u=img.currentSrc||img.src||img.getAttribute('data-src')||img.getAttribute('data-ori