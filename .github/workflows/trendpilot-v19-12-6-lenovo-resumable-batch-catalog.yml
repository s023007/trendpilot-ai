          function canon(u){try{const x=new URL(u,'https://www.lenovo.com/');if(!(x.hostname==='lenovo.com'||x.hostname.endsWith('.lenovo.com'))||!/^\/us\/en\/p\//i.test(x.pathname))return '';x.protocol='https:';x.hostname='www.lenovo.com';x.search='';x.hash='';return x.toString().replace(/\/$/,'')}catch{return ''}}
