name: TrendPilot CJ Raw Product Diagnostic V15.7.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-cj-raw-diagnostic-v15-7-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-cj-raw-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Install diagnostic Netlify Function only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p netlify/functions
          echo '' | base64 -d > netlify/functions/cj-raw-debug-v15-7-2.mjs

      - name: Validate diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node --check netlify/functions/cj-raw-debug-v15-7-2.mjs
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          p=Path("netlify/functions/cj-raw-debug-v15-7-2.mjs")
          text=p.read_text(encoding="utf-8")

          required=[
            'shoppingProducts(',
            'keywords:',
            'imageLink',
            'linkCode(pid:',
            'fieldStats',
            'likelyCause',
            'firstFive',
            'path: "/api/cj-raw-debug-v15-7-2"'
          ]
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit("Missing diagnostic markers: "+", ".join(missing))

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"netlify/functions/cj-raw-debug-v15-7-2.mjs"}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))

          print("V15.7.2 diagnostic validation passed.")
          print("Only one new diagnostic Netlify Function is changed.")
          print("Products UI, Admitad, seller routing, static CJ data, and V15.7.1 are untouched.")
          PY

      - name: Publish diagnostic only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add netlify/functions/cj-raw-debug-v15-7-2.mjs
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.7.2 diagnostic is already installed."
            exit 0
          fi

          git commit -m "diagnostic: inspect raw CJ live product fields"
          git push origin HEAD:main

          {
            echo "## TrendPilot CJ Raw Product Diagnostic V15.7.2"
            echo ""
            echo "No live Products UI code was changed."
            echo ""
            echo "After Netlify publishes, open:"
            echo 'https://trendpilotchoice.com/api/cj-raw-debug-v15-7-2?q=power%20bank&seller=Temu'
            echo ""
            echo "Send the JSON result back for the final V15.7.3 fix."
          } >> "$GITHUB_STEP_SUMMARY"
