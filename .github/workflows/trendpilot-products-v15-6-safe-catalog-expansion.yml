name: TrendPilot Products V15.6 Safe Catalog Expansion

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-6-expansion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expand-admitad-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ADMITAD_CLIENT_ID_PRIMARY: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_ID_ALT: ${{ secrets.client_id }}
      ADMITAD_CLIENT_SECRET_PRIMARY: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      ADMITAD_CLIENT_SECRET_ALT: ${{ secrets.client_secret }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Expand valid Admitad sellers to 100 tracked products each
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/build_v15_6.py
          python /tmp/build_v15_6.py

      - name: Update live catalog cache version only
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_v15_6.py
          python /tmp/patch_v15_6.py

      - name: Validate V15.6
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site-v13-5.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          data=json.loads(Path("data/admitad-products-new-account-v15-3-2.json").read_text(encoding="utf-8"))
          products=data.get("products") or []
          reports=data.get("reports") or []

          if data.get("version")!="15.6-expanded":
              raise SystemExit("Wrong catalog version.")
          if data.get("website_id")!=2980568:
              raise SystemExit("Wrong website ID.")
          if len(products)<600:
              raise SystemExit("Expanded catalog below safe minimum.")
          if any("lenovo" in str(p.get("seller") or "").lower() for p in products):
              raise SystemExit("Lenovo bad feed leaked back into catalog.")
          if len(reports)!=7:
              raise SystemExit(f"Expected 7 valid Admitad sellers, found {len(reports)}.")

          js=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")

          for marker in (
              "TP_LENOVO_DIRECT_LINK_V15_5_3_START",
              "TP_CJ_SEARCH_BRIDGE_START",
              'admitad-products-new-account-v15-3-2.json?v=15.6.0',
              "/js/site-v13-5.js?v=15.6.0",
              "/js/product-discovery-v15.js?v=15.2.0"
          ):
              if marker not in (js+"\n"+html):
                  raise SystemExit("Missing marker: "+marker)

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={
              "data/admitad-products-new-account-v15-3-2.json",
              "js/site-v13-5.js",
              "find/index.html"
          }
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))

          print(f"Validated expanded catalog: {len(products)} tracked products.")
          for r in reports:
              print(f"- {r['seller']}: {r['tracked']} tracked")
          PY

      - name: Publish V15.6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             data/admitad-products-new-account-v15-3-2.json             js/site-v13-5.js             find/index.html

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.6 already current."
            exit 0
          fi

          git commit -m "feat: expand validated Admitad product catalog safely"
          git push origin HEAD:main

          {
            echo "## Products V15.6 Safe Catalog Expansion"
            echo ""
            echo "- Targets 100 tracked products for each of 7 valid Admitad sellers."
            echo "- Uses diversified feed sampling instead of taking only the first products."
            echo "- Keeps Lenovo feed quarantined and Lenovo direct-link fallback intact."
            echo "- Keeps CJ, CPC, suggestions and seller list intact."
            echo "- Only bumps the Admitad catalog cache version in the live search."
          } >> "$GITHUB_STEP_SUMMARY"
