name: Fix Math Mobile Scale V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-math-mobile-scale-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: '21098'
      CPANEL_USER: kehwgbpo
      STATIC_ROOT: /home/kehwgbpo/trendpilotchoice.com
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Lock mobile scale and normalize width
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('math/index-v3.html')
          s=p.read_text()
          old='<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
          new='<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('viewport meta marker not found')

          # Use percentage-based containers again; the viewport is now explicitly locked to the physical screen.
          s=s.replace('.shell{width:min(1120px,calc(100vw - 28px));max-width:calc(100vw - 28px);margin-left:auto;margin-right:auto}',
                      '.shell{width:min(1120px,calc(100% - 28px));max-width:1120px;margin-left:auto;margin-right:auto}')
          s=s.replace('.shell{width:calc(100vw - 24px)!important;max-width:none!important;margin-left:12px!important;margin-right:12px!important}',
                      '.shell{width:calc(100% - 24px)!important;max-width:none!important;margin-left:12px!important;margin-right:12px!important}')

          # Prevent delayed browser text autosizing from creating a different effective page scale.
          marker='/* MOBILE_SCALE_LOCK_V2 */'
          if marker not in s:
              extra='''\n    /* MOBILE_SCALE_LOCK_V2 */\n    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}\n    body{min-width:0!important}\n    img,video,canvas,svg,iframe{max-width:100%}\n    @media (hover:none) and (pointer:coarse){\n      html,body{min-width:0!important;width:100%!important;max-width:100%!important}\n      main,.header,.footer{min-width:0!important;width:100%!important;max-width:100%!important}\n    }\n'''
              s=s.replace('  </style>',extra+'  </style>',1)
          p.write_text(s)
          assert 'maximum-scale=1' in s
          assert 'MOBILE_SCALE_LOCK_V2' in s
          PY

      - name: Commit page fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendpilot-mobile-scale-fix'
          git config user.email '39025908+s023007@users.noreply.github.com'
          git add math/index-v3.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: lock math page mobile scale at device width'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo 'NAMECHEAP_SSH_PRIVATE_KEY missing'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish math directory
        shell: bash
        run: |
          set -euo pipefail
          tar -czf - math | ssh trendpilot-namecheap "tar -xzf - -C '$STATIC_ROOT'"

      - name: Verify live scale lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time, urllib.request
          u='https://trendpilotchoice.com/math/?scalefix='+str(int(time.time()))
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/152 Mobile Safari/537.36','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=30) as r:
              b=r.read().decode('utf-8','replace')
              assert r.status==200
          assert 'minimum-scale=1,maximum-scale=1,user-scalable=no' in b
          assert 'MOBILE_SCALE_LOCK_V2' in b
          assert 'math-upload-v1.js' in b
          print('MATH_MOBILE_SCALE_V2_OK')
          PY
