name: Deploy Derby Live
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'events/manchester-derby-2026/**'
      - '.github/workflows/deploy-derby-live.yml'
permissions:
  contents: read
concurrency:
  group: deploy-derby-live
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: '21098'
      CPANEL_USER: kehwgbpo
      WEB_ROOT: /home/kehwgbpo/trendpilotchoice.com
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config
      - name: Deploy derby pages and assets
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap "mkdir -p '$WEB_ROOT/events/manchester-derby-2026'"
          scp -r events/manchester-derby-2026/* "trendpilot-namecheap:$WEB_ROOT/events/manchester-derby-2026/"
      - name: Verify live redirect assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 'https://trendpilotchoice.com/events/manchester-derby-2026/email-buy-redirect.js?v=1.0.0' | grep -q 'api.trendpilotchoice.com/go.php'
          curl -fsS --max-time 20 'https://trendpilotchoice.com/events/manchester-derby-2026/returning-user.js?v=1.0.0' | grep -q 'RETURNING_EMAIL_SELLER_CLICK'
          curl -fsS --max-time 20 'https://trendpilotchoice.com/events/manchester-derby-2026/ar/' | grep -q 'email-buy-redirect.js'
          curl -fsS --max-time 20 'https://trendpilotchoice.com/events/manchester-derby-2026/ar/' | grep -q 'returning-user.js'
