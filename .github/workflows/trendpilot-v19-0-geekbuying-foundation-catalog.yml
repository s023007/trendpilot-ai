name: TrendPilot V19.0 Seller 1 — Geekbuying Foundation Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v19-geekbuying-foundation
  cancel-in-progress: false

jobs:
  build-geekbuying-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Verify current seller policy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { PUBLIC_PRODUCT_SELLER_NAMES } from "./netlify/functions/product-seller-policy-v17.mjs";
          const sellers = [...PUBLIC_PRODUCT_SELLER_NAMES];
          if (sellers.length !== 14) throw new Error(`Expected 14 approved product sellers, got ${sellers.length}`);
          if (!sellers.includes("Geekbuying")) throw new Error("Geekbuying is not approved.");
          if (sellers.includes("Temu") || sellers.includes("Joom")) throw new Error("Blocked seller leaked into policy.");
          console.log("Seller policy PASS.");
          JS

      - name: Build Seller 1 canonical catalog
        shell: bash
        run: |
          set -euo pipefail
          cat > v19-geekbuying-builder.mjs <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";
          import {
            clean,
            normalizeProduct,
            extractProducts,
            validUrl
          } from "./netlify/functions/products-v16-lib.mjs";
          import {
            PUBLIC_PRODUCT_SELLER_NAMES,
            canonicalProductSeller
          } from "./netlify/functions/product-seller-policy-v17.mjs";

          const VERSION = "19.0.0";
          const SELLER = "Geekbuying";
          const SELLER_SLUG = "geekbuying";
          const ROOT = "data/catalog-v19";
          const SELLER_DIR = `${ROOT}/sellers/${SELLER_SLUG}`;
          fs.mkdirSync(SELLER_DIR, { recursive: true });

          if (!PUBLIC_PRODUCT_SELLER_NAMES.includes(SELLER)) {
            throw new Error(`${SELLER} is not an approved public product seller.`);
          }
          if (PUBLIC_PRODUCT_SELLER_NAMES.includes("Temu") || PUBLIC_PRODUCT_SELLER_NAMES.includes("Joom")) {
            throw new Error("Blocked seller leaked into public product seller policy.");
          }

          const sha = value => crypto.createHash("sha256").update(String(value)).digest("hex");
          const norm = value =>
            clean(value)
              .normalize("NFKC")
              .toLocaleLowerCase("en-US")
              .replace(/[’'`]/g, "")
              .replace(/[^a-z0-9]+/g, " ")
              .trim();
          const compact = value => norm(value).replace(/\s+/g, "");
          const uniq = values => [...new Set(values.filter(Boolean))];

          function walkJson(dir) {
            const out = [];
            if (!fs.existsSync(dir)) return out;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (full.startsWith(ROOT)) continue;
                out.push(...walkJson(full));
              } else if (entry.isFile() && entry.name.toLowerCase().endsWith(".json")) {
                out.push(full);
              }
            }
            return out;
          }

          function pickDirect(obj, keys) {
            for (const key of keys) {
              const value = obj?.[key];
              if (value !== undefined && value !== null && clean(value)) return clean(value);
            }
            return "";
          }

          const FIELD_KEYS = {
            sellerProductId: [
              "sourceProductId","source_product_id","productId","product_id","itemId","item_id",
              "offerId","offer_id","goodsId","goods_id"
            ],
            sku: ["sku","SKU","sellerSku","seller_sku","productSku","product_sku","itemSku","item_sku"],
            model: ["model","modelNumber","model_number","modelNo","model_no","partNumber","part_number"],
            mpn: ["mpn","MPN","manufacturerPartNumber","manufacturer_part_number"],
            gtin: ["gtin","GTIN","gtin13","gtin14"],
            ean: ["ean","EAN","ean13","ean_code"],
            upc: ["upc","UPC","upcA","upc_code"],
            isbn: ["isbn","ISBN"],
            brand: ["brand","manufacturer","vendor","maker"]
          };

          function explicitIds(raw, normalized) {
            const sellerProductId =
              pickDirect(raw, FIELD_KEYS.sellerProductId) ||
              clean(normalized.sourceProductId);
            return {
              sellerProductId,
              sku: pickDirect(raw, FIELD_KEYS.sku),
              model: pickDirect(raw, FIELD_KEYS.model),
              mpn: pickDirect(raw, FIELD_KEYS.mpn),
              gtin: pickDirect(raw, FIELD_KEYS.gtin),
              ean: pickDirect(raw, FIELD_KEYS.ean),
              upc: pickDirect(raw, FIELD_KEYS.upc),
              isbn: pickDirect(raw, FIELD_KEYS.isbn)
            };
          }

          function modelFromTitle(title) {
            const patterns = [
              /\b(iPhone\s*\d{1,2}(?:\s*(?:Pro Max|Pro|Plus|Mini|Air))?)\b/i,
              /\b(Galaxy\s*[ASZF]\s*\d{1,3}(?:\s*(?:Ultra|Plus|FE|Pro))?)\b/i,
              /\b(Pixel\s*\d{1,2}(?:\s*(?:Pro|XL|a))?)\b/i,
              /\b(Galaxy Watch\s*\d+(?:\s*(?:Pro|Classic|Ultra))?)\b/i,
              /\b(MacBook\s+(?:Air|Pro)(?:\s*M\d)?)\b/i,
              /\b(ThinkPad\s+[A-Za-z0-9-]{2,20})\b/i,
              /\b((?:Redmi|Poco|OnePlus|Realme|Oppo|Vivo|Honor)\s+[A-Za-z0-9+._-]{1,24})\b/i,
              /\b((?:FOSSiBOT|CHUWI|Tronsmart|Creality|ERYONE|ALLIWAVA|MINIX|ZIKE)\s+[A-Za-z0-9+._-]{1,24})\b/i
            ];
            for (const pattern of patterns) {
              const match = clean(title).match(pattern);
              if (match) return clean(match[1]);
            }
            return "";
          }

          function inferBrand(title, explicit) {
            if (clean(explicit)) return clean(explicit);
            const brands = [
              "Apple","Samsung","Google","Xiaomi","Redmi","Poco","OnePlus","Realme","Oppo","Vivo","Honor",
              "Lenovo","CHUWI","Tronsmart","Creality","ERYONE","ALLIWAVA","MINIX","ZIKE","FOSSiBOT",
              "Anker","UGREEN","Baseus","Govee","Sony","JBL","Asus","Acer","MSI","Dell","HP"
            ];
            const t = ` ${norm(title)} `;
            return brands.find(brand => t.includes(` ${norm(brand)} `)) || "";
          }

          function flattenPrimitiveFields(obj, max = 80) {
            const ignored = new Set([
              "title","name","product_name","productName","product_title","productTitle",
              "description","shortDescription","short_description","summary","product_description","productDescription",
              "image","imageUrl","image_url","imageLink","image_link","picture","picture_url","photo","mainImage","main_image",
              "affiliateUrl","affiliate_url","deeplink","deep_link","trackingUrl","tracking_url","clickUrl","click_url","goto",
              "destinationUrl","destination_url","productUrl","product_url","url","link","landing_page","landingPage","product_link",
              "seller","merchant","advertiser","advertiserName","advertiser_name","merchantName","merchant_name",
              "price","salePrice","sale_price","currentPrice","current_price","amount"
            ]);
            const out = {};
            let count = 0;
            for (const [key, value] of Object.entries(obj || {})) {
              if (count >= max || ignored.has(key)) continue;
              if (value == null) continue;
              if (["string","number","boolean"].includes(typeof value)) {
                const str = clean(value);
                if (!str || str.length > 500) continue;
                out[key] = typeof value === "string" ? str : value;
                count++;
              }
            }
            return out;
          }

          function addAttribute(out, name, value) {
            const key = clean(name).slice(0, 120);
            if (!key || value == null) return;
            let text;
            if (Array.isArray(value)) {
              text = value.map(x => clean(x)).filter(Boolean).join(", ");
            } else if (typeof value === "object") {
              text = clean(value.value ?? value.text ?? value.label ?? "");
            } else {
              text = clean(value);
            }
            if (!text || text.length > 1000) return;
            if (!(key in out)) out[key] = text;
          }

          function flattenAttributeContainer(container, out, depth = 0) {
            if (depth > 3 || container == null || Object.keys(out).length >= 150) return;
            if (Array.isArray(container)) {
              for (const item of container) {
                if (Object.keys(out).length >= 150) break;
                if (item && typeof item === "object") {
                  const name = item.name ?? item.key ?? item.label ?? item.attribute ?? item.property ?? item.specification;
                  const value = item.value ?? item.values ?? item.text ?? item.option ?? item.content;
                  if (name != null && value != null) addAttribute(out, name, value);
                  else flattenAttributeContainer(item, out, depth + 1);
                }
              }
              return;
            }
            if (typeof container === "object") {
              for (const [key, value] of Object.entries(container)) {
                if (Object.keys(out).length >= 150) break;
                if (value == null) continue;
                if (["string","number","boolean"].includes(typeof value)) addAttribute(out, key, value);
                else flattenAttributeContainer(value, out, depth + 1);
              }
            }
          }

          function structuredAttributes(raw) {
            const out = {};
            const keys = [
              "attributes","attribute","specifications","specification","specs","properties","property",
              "features","feature","parameters","parameter","params","technicalSpecifications","technical_specs",
              "productSpecifications","product_specs"
            ];
            for (const key of keys) {
              if (raw?.[key] != null) flattenAttributeContainer(raw[key], out);
            }
            return out;
          }

          function variants(raw) {
            const candidates = ["variants","variant","models","options","skus","items"];
            for (const key of candidates) {
              const value = raw?.[key];
              if (!Array.isArray(value) || !value.length || value.length > 200) continue;
              return value.slice(0, 200).map((item, index) => {
                if (item == null) return { index, value:"" };
                if (["string","number","boolean"].includes(typeof item)) return { index, value:clean(item) };
                const id = pickDirect(item, ["sku","id","model_id","modelId","variantId","variant_id","itemId","item_id"]);
                const name = pickDirect(item, ["name","title","label","option","variantName","variant_name"]);
                const price = pickDirect(item, ["price","salePrice","sale_price","amount"]);
                const availability = pickDirect(item, ["stock","availability","stockStatus","stock_status"]);
                return {
                  index,
                  id,
                  name,
                  price: price || "",
                  availability: availability || "",
                  sourceFields: flattenPrimitiveFields(item, 30)
                };
              });
            }
            return [];
          }

          function rawCandidateMap(payload) {
            const byId = new Map();
            const byTitle = new Map();
            const stack = [payload];
            const seen = new Set();
            while (stack.length) {
              const value = stack.pop();
              if (!value || typeof value !== "object" || seen.has(value)) continue;
              seen.add(value);
              if (Array.isArray(value)) {
                for (const child of value) stack.push(child);
                continue;
              }

              const title = pickDirect(value, [
                "title","name","product_name","productName","product_title","productTitle",
                "offer_name","offerName","product"
              ]);
              if (title) {
                const id = pickDirect(value, [
                  ...FIELD_KEYS.sellerProductId,
                  ...FIELD_KEYS.sku
                ]);
                if (id && !byId.has(id)) byId.set(id, value);
                const titleKey = norm(title);
                if (titleKey && !byTitle.has(titleKey)) byTitle.set(titleKey, value);
              }

              for (const child of Object.values(value)) {
                if (child && typeof child === "object") stack.push(child);
              }
            }
            return { byId, byTitle };
          }

          function identityKeys(record) {
            const exactGlobal = uniq([
              record.identifiers.gtin && `gtin:${compact(record.identifiers.gtin)}`,
              record.identifiers.ean && `ean:${compact(record.identifiers.ean)}`,
              record.identifiers.upc && `upc:${compact(record.identifiers.upc)}`,
              record.identifiers.isbn && `isbn:${compact(record.identifiers.isbn)}`,
              record.identifiers.mpn && record.brand && `mpn:${compact(record.brand)}:${compact(record.identifiers.mpn)}`
            ]);

            const brandModel =
              record.brand && record.identifiers.model
                ? `brand-model:${compact(record.brand)}:${compact(record.identifiers.model)}`
                : "";

            return {
              exactGlobal,
              sellerProduct: record.identifiers.sellerProductId
                ? `seller-product:${SELLER_SLUG}:${compact(record.identifiers.sellerProductId)}`
                : "",
              sku: record.identifiers.sku
                ? `seller-sku:${SELLER_SLUG}:${compact(record.identifiers.sku)}`
                : "",
              brandModel,
              exactName: `name:${norm(record.name.display)}`,
              compactName: `compact-name:${compact(record.name.display)}`
            };
          }

          function stableProductKey(ids, normalized, raw) {
            const stable =
              ids.sellerProductId ||
              ids.sku ||
              normalized.destinationUrl ||
              normalized.affiliateUrl;
            if (stable) return `${SELLER_SLUG}:${sha(stable).slice(0, 24)}`;
            const fingerprint = [
              norm(normalized.title),
              clean(normalized.price),
              clean(normalized.currency),
              clean(normalized.imageUrl)
            ].join("|");
            return `${SELLER_SLUG}:fallback:${sha(fingerprint).slice(0, 24)}`;
          }

          const jsonFiles = walkJson("data");
          const recordsByKey = new Map();
          const sourceFiles = new Set();
          let extractedRows = 0;
          let matchedRows = 0;

          for (const file of jsonFiles) {
            let payload;
            try {
              payload = JSON.parse(fs.readFileSync(file, "utf8"));
            } catch {
              continue;
            }

            const normalizedRows = extractProducts(payload, file, 200000);
            const sellerRows = normalizedRows.filter(row => canonicalProductSeller(row.seller) === SELLER);
            if (!sellerRows.length) continue;

            sourceFiles.add(file);
            const candidates = rawCandidateMap(payload);

            for (const normalized of sellerRows) {
              extractedRows++;
              const raw =
                (normalized.sourceProductId && candidates.byId.get(normalized.sourceProductId)) ||
                candidates.byTitle.get(norm(normalized.title)) ||
                {};

              const ids = explicitIds(raw, normalized);
              const explicitModel = ids.model;
              const inferredModel = explicitModel ? "" : modelFromTitle(normalized.title);
              if (!ids.model && inferredModel) ids.model = inferredModel;

              const brand = inferBrand(normalized.title, pickDirect(raw, FIELD_KEYS.brand) || normalized.brand);
              const productKey = stableProductKey(ids, normalized, raw);
              const modelConfidence = explicitModel ? "explicit" : inferredModel ? "title-inferred" : "none";

              const record = {
                schemaVersion: VERSION,
                catalogId: SELLER_SLUG,
                productKey,
                seller: {
                  name: SELLER,
                  slug: SELLER_SLUG,
                  network: normalized.network || "Admitad"
                },
                identifiers: ids,
                identity: {
                  modelConfidence,
                  comparableExact: Boolean(
                    ids.gtin || ids.ean || ids.upc || ids.isbn ||
                    (brand && ids.mpn) ||
                    (brand && ids.model && modelConfidence === "explicit")
                  )
                },
                name: {
                  display: clean(normalized.title),
                  normalized: norm(normalized.title),
                  compact: compact(normalized.title),
                  aliases: []
                },
                brand,
                taxonomy: {
                  sourceCategory: clean(normalized.category),
                  sourceSubcategory: clean(normalized.subcategory),
                  sourcePath: uniq([clean(normalized.category), clean(normalized.subcategory)]),
                  canonicalCategory: "",
                  canonicalPath: []
                },
                specs: {
                  structured: structuredAttributes(raw),
                  sourceFields: flattenPrimitiveFields(raw, 80)
                },
                variants: variants(raw),
                offer: {
                  price: normalized.price,
                  currency: clean(normalized.currency),
                  condition: clean(normalized.condition),
                  availability: clean(normalized.availability)
                },
                media: {
                  imageUrl: validUrl(normalized.imageUrl) ? normalized.imageUrl : ""
                },
                links: {
                  affiliateUrl: validUrl(normalized.affiliateUrl) ? normalized.affiliateUrl : "",
                  destinationUrl: validUrl(normalized.destinationUrl) ? normalized.destinationUrl : ""
                },
                source: {
                  network: normalized.network,
                  sourceName: normalized.source,
                  sourceFile: file
                },
                quality: {
                  inputQuality: normalized.quality,
                  hasStableSellerId: Boolean(ids.sellerProductId || ids.sku),
                  hasBrand: Boolean(brand),
                  hasModel: Boolean(ids.model),
                  hasStructuredSpecs: Object.keys(structuredAttributes(raw)).length > 0,
                  hasPrice: normalized.price != null,
                  hasImage: Boolean(normalized.imageUrl),
                  hasAffiliateOrDestinationUrl: Boolean(normalized.affiliateUrl || normalized.destinationUrl)
                }
              };

              record.identity.keys = identityKeys(record);

              const previous = recordsByKey.get(productKey);
              if (!previous) {
                recordsByKey.set(productKey, record);
                matchedRows++;
                continue;
              }

              const richness = x =>
                Object.keys(x.specs.structured).length * 5 +
                Object.keys(x.specs.sourceFields).length +
                x.variants.length * 2 +
                Number(x.quality.hasBrand) * 3 +
                Number(x.quality.hasModel) * 4 +
                Number(x.quality.hasPrice) * 2 +
                Number(x.quality.hasImage) * 2 +
                Number(x.quality.hasAffiliateOrDestinationUrl) * 2;

              if (richness(record) > richness(previous)) recordsByKey.set(productKey, record);
            }
          }

          const records = [...recordsByKey.values()].sort((a,b) =>
            a.name.normalized.localeCompare(b.name.normalized) || a.productKey.localeCompare(b.productKey)
          );

          if (records.length < 500) {
            throw new Error(`Geekbuying catalog unexpectedly small: ${records.length}`);
          }

          const indexes = {
            version: VERSION,
            seller: SELLER,
            byGlobalId: {},
            bySellerProductId: {},
            bySku: {},
            byBrandModel: {},
            byModel: {},
            byExactName: {},
            byCompactName: {}
          };

          const conflicts = {
            globalId: [],
            sellerProductId: [],
            sku: [],
            brandModel: []
          };

          function pushIndex(obj, key, productKey) {
            if (!key) return;
            if (!obj[key]) obj[key] = [];
            if (!obj[key].includes(productKey)) obj[key].push(productKey);
          }

          for (const record of records) {
            for (const key of record.identity.keys.exactGlobal) pushIndex(indexes.byGlobalId, key, record.productKey);
            if (record.identifiers.sellerProductId) {
              pushIndex(indexes.bySellerProductId, compact(record.identifiers.sellerProductId), record.productKey);
            }
            if (record.identifiers.sku) pushIndex(indexes.bySku, compact(record.identifiers.sku), record.productKey);
            if (record.identity.keys.brandModel) pushIndex(indexes.byBrandModel, record.identity.keys.brandModel, record.productKey);
            if (record.identifiers.model) pushIndex(indexes.byModel, compact(record.identifiers.model), record.productKey);
            pushIndex(indexes.byExactName, record.name.normalized, record.productKey);
            pushIndex(indexes.byCompactName, record.name.compact, record.productKey);
          }

          for (const [key, values] of Object.entries(indexes.byGlobalId)) if (values.length > 1) conflicts.globalId.push({key, productKeys:values});
          for (const [key, values] of Object.entries(indexes.bySellerProductId)) if (values.length > 1) conflicts.sellerProductId.push({key, productKeys:values});
          for (const [key, values] of Object.entries(indexes.bySku)) if (values.length > 1) conflicts.sku.push({key, productKeys:values});
          for (const [key, values] of Object.entries(indexes.byBrandModel)) if (values.length > 1) conflicts.brandModel.push({key, productKeys:values});

          const categoryIndex = {};
          for (const record of records) {
            const key = norm(record.taxonomy.sourceCategory || "(uncategorized)");
            if (!categoryIndex[key]) categoryIndex[key] = {
              label: record.taxonomy.sourceCategory || "(uncategorized)",
              count: 0,
              productKeys: []
            };
            categoryIndex[key].count++;
            categoryIndex[key].productKeys.push(record.productKey);
          }

          const count = fn => records.filter(fn).length;
          const pct = n => Number((n * 100 / records.length).toFixed(1));

          const metrics = {
            totalProducts: records.length,
            sourceFiles: sourceFiles.size,
            stableSellerId: count(x => x.quality.hasStableSellerId),
            brand: count(x => x.quality.hasBrand),
            modelAny: count(x => x.quality.hasModel),
            modelExplicit: count(x => x.identity.modelConfidence === "explicit"),
            modelInferred: count(x => x.identity.modelConfidence === "title-inferred"),
            comparableExact: count(x => x.identity.comparableExact),
            structuredSpecs: count(x => x.quality.hasStructuredSpecs),
            price: count(x => x.quality.hasPrice),
            image: count(x => x.quality.hasImage),
            link: count(x => x.quality.hasAffiliateOrDestinationUrl),
            variants: count(x => x.variants.length > 0)
          };

          const fillRates = Object.fromEntries(
            Object.entries(metrics)
              .filter(([key]) => !["totalProducts","sourceFiles"].includes(key))
              .map(([key, value]) => [key, {count:value, percent:pct(value)}])
          );

          function resolve(query) {
            const qn = norm(query);
            const qc = compact(query);

            const exactName = indexes.byExactName[qn] || [];
            if (exactName.length) return {kind:"exact-name", productKeys:exactName};

            const compactName = indexes.byCompactName[qc] || [];
            if (compactName.length) return {kind:"compact-name", productKeys:compactName};

            const model = indexes.byModel[qc] || [];
            if (model.length) return {kind:"model", productKeys:model};

            const sellerProductId = indexes.bySellerProductId[qc] || [];
            if (sellerProductId.length) return {kind:"seller-product-id", productKeys:sellerProductId};

            const sku = indexes.bySku[qc] || [];
            if (sku.length) return {kind:"sku", productKeys:sku};

            const candidates = records.filter(r => r.name.normalized.includes(qn)).slice(0, 20);
            return {kind:candidates.length ? "name-contains" : "not-found", productKeys:candidates.map(x=>x.productKey)};
          }

          const roundTripSamples = [];
          const modelRecords = records.filter(x => x.identifiers.model).slice(0, 20);
          for (const record of modelRecords) {
            const result = resolve(record.identifiers.model);
            roundTripSamples.push({
              query: record.identifiers.model,
              expectedProductKey: record.productKey,
              resolutionKind: result.kind,
              resolved: result.productKeys.includes(record.productKey),
              resultCount: result.productKeys.length
            });
          }
          const idRecords = records.filter(x => x.identifiers.sellerProductId).slice(0, 20);
          for (const record of idRecords) {
            const result = resolve(record.identifiers.sellerProductId);
            roundTripSamples.push({
              query: record.identifiers.sellerProductId,
              expectedProductKey: record.productKey,
              resolutionKind: result.kind,
              resolved: result.productKeys.includes(record.productKey),
              resultCount: result.productKeys.length
            });
          }

          const manifest = {
            version: VERSION,
            architecture: "seller-catalog-first",
            seller: {
              name: SELLER,
              slug: SELLER_SLUG,
              network: "Admitad",
              role: "reference-foundation-catalog"
            },
            generatedAt: new Date().toISOString(),
            schema: "../../schema-v1.json",
            files: {
              products: "products.ndjson",
              identityIndex: "identity-index.json",
              categoryIndex: "category-index.json",
              audit: "audit.json"
            },
            metrics,
            fillRates,
            identityPolicy: {
              exactMergeAllowedBy: [
                "GTIN/EAN/UPC/ISBN exact match",
                "brand + explicit MPN exact match",
                "brand + explicit model exact match"
              ],
              neverAutoMergeBy: [
                "title alone",
                "price alone",
                "image alone",
                "title-inferred model alone"
              ],
              searchableButNotComparable: [
                "records without reliable cross-seller identity remain individually searchable",
                "name matches may return multiple records and are never silently merged"
              ]
            }
          };

          const audit = {
            version: VERSION,
            seller: SELLER,
            generatedAt: manifest.generatedAt,
            input: {
              jsonFilesScanned: jsonFiles.length,
              sourceFilesContainingSeller: [...sourceFiles].sort(),
              normalizedRowsSeenForSeller: extractedRows
            },
            metrics,
            fillRates,
            conflicts,
            roundTripSamples,
            blockedSellerLeak: records.some(x => ["Temu","Joom"].includes(x.seller.name)),
            duplicateProductKeys: records.length !== new Set(records.map(x=>x.productKey)).size
          };

          const schema = {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "https://trendpilotchoice.com/schema/catalog-v19-product-v1.json",
            "title": "TrendPilot Canonical Seller Product",
            "description": "Stable cross-seller contract. Every seller adapter must emit this shape before products can join the global resolver.",
            "type": "object",
            "required": [
              "schemaVersion","catalogId","productKey","seller","identifiers","identity","name",
              "brand","taxonomy","specs","variants","offer","media","links","source","quality"
            ],
            "properties": {
              "schemaVersion":{"type":"string"},
              "catalogId":{"type":"string"},
              "productKey":{"type":"string"},
              "seller":{
                "type":"object",
                "required":["name","slug","network"],
                "properties":{
                  "name":{"type":"string"},
                  "slug":{"type":"string"},
                  "network":{"type":"string"}
                }
              },
              "identifiers":{
                "type":"object",
                "required":["sellerProductId","sku","model","mpn","gtin","ean","upc","isbn"],
                "properties":{
                  "sellerProductId":{"type":"string"},
                  "sku":{"type":"string"},
                  "model":{"type":"string"},
                  "mpn":{"type":"string"},
                  "gtin":{"type":"string"},
                  "ean":{"type":"string"},
                  "upc":{"type":"string"},
                  "isbn":{"type":"string"}
                }
              },
              "identity":{
                "type":"object",
                "required":["modelConfidence","comparableExact","keys"],
                "properties":{
                  "modelConfidence":{"enum":["explicit","title-inferred","none"]},
                  "comparableExact":{"type":"boolean"},
                  "keys":{"type":"object"}
                }
              },
              "name":{
                "type":"object",
                "required":["display","normalized","compact","aliases"],
                "properties":{
                  "display":{"type":"string"},
                  "normalized":{"type":"string"},
                  "compact":{"type":"string"},
                  "aliases":{"type":"array","items":{"type":"string"}}
                }
              },
              "brand":{"type":"string"},
              "taxonomy":{"type":"object"},
              "specs":{"type":"object"},
              "variants":{"type":"array"},
              "offer":{"type":"object"},
              "media":{"type":"object"},
              "links":{"type":"object"},
              "source":{"type":"object"},
              "quality":{"type":"object"}
            }
          };

          const architecture = `# TrendPilot V19 Seller Catalog Architecture

          ## Non-negotiable rule

          Search does not decide what a product is after the visitor types a query.
          Each seller is normalized **before** search into the same canonical product contract.

          ## Seller build order

          1. Geekbuying — reference/foundation catalog.
          2. AliExpress — map to exactly the same contract.
          3. Alibaba — map to exactly the same contract.
          4. Remaining approved sellers, one by one.

          A new seller cannot join the global resolver until its adapter passes the same validation.

          ## Identity hierarchy

          Strongest to weakest:

          1. GTIN / EAN / UPC / ISBN.
          2. Brand + explicit MPN.
          3. Brand + explicit model number.
          4. Seller product ID / SKU — exact inside that seller only.
          5. Exact normalized product name — searchable, never sufficient for automatic cross-seller merging.
          6. Inferred model/name — discovery only, never silent merge.

          A serial number is intentionally not invented. Serial numbers identify individual physical units; marketplace catalogs usually expose product IDs, SKUs, model/MPN, or global trade identifiers instead.

          ## What happens on difficult events

          - **Same title, different products:** both remain separate.
          - **Same product ID repeated in multiple source shards:** richest record wins; one stable productKey remains.
          - **Price changes:** productKey stays stable because identity is not based on price.
          - **Missing price/image:** product remains searchable if identity/name is valid; offer quality flags expose the missing field.
          - **Variant SKUs:** preserved under variants and are not flattened into unrelated products.
          - **Model inferred from title:** searchable, but cannot auto-merge across sellers.
          - **Conflicting GTIN/model:** kept as a conflict for review; never silently merged.
          - **Seller removed from approved policy:** its catalog can remain archived but must not enter the public resolver.
          - **Temu/Joom:** blocked by the current public product-seller policy.
          - **Second seller and later sellers:** must emit the same schema, field meanings, normalization rules, and identity keys.

          ## Resolver behavior

          Specific query:
          - seller product ID / SKU / global ID / explicit model -> exact lookup first.
          - exact normalized name -> return matching records without merging them.
          - partial name -> discovery results.

          Broad query:
          - uses the catalog's stored taxonomy/category indexes.
          - does not invent product categories at request time.

          ## Cross-seller comparison

          Cross-seller comparison will be added only after at least two seller catalogs exist.
          Automatic grouping is allowed only when identity confidence is strong enough under the hierarchy above.
          `;

          fs.writeFileSync(`${ROOT}/schema-v1.json`, JSON.stringify(schema, null, 2) + "\n");
          fs.writeFileSync(`${ROOT}/ARCHITECTURE.md`, architecture);
          fs.writeFileSync(`${SELLER_DIR}/products.ndjson`, records.map(x => JSON.stringify(x)).join("\n") + "\n");
          fs.writeFileSync(`${SELLER_DIR}/identity-index.json`, JSON.stringify(indexes, null, 2) + "\n");
          fs.writeFileSync(`${SELLER_DIR}/category-index.json`, JSON.stringify(categoryIndex, null, 2) + "\n");
          fs.writeFileSync(`${SELLER_DIR}/manifest.json`, JSON.stringify(manifest, null, 2) + "\n");
          fs.writeFileSync(`${SELLER_DIR}/audit.json`, JSON.stringify(audit, null, 2) + "\n");

          const roundTripPassed = roundTripSamples.filter(x => x.resolved).length;
          const roundTripTotal = roundTripSamples.length;

          const report = [];
          report.push("# TrendPilot V19.0 — Seller 1: Geekbuying Foundation Catalog", "");
          report.push("> This is the first real seller catalog in the seller-by-seller architecture. It does not change the visitor UI or search API.", "");
          report.push("## Foundation result", "");
          report.push(`- Seller: **${SELLER}**`);
          report.push(`- Canonical products: **${records.length.toLocaleString()}**`);
          report.push(`- Source files containing Geekbuying: **${sourceFiles.size}**`);
          report.push(`- Stable seller ID/SKU: **${metrics.stableSellerId.toLocaleString()} (${fillRates.stableSellerId.percent}%)**`);
          report.push(`- Brand available/inferred: **${metrics.brand.toLocaleString()} (${fillRates.brand.percent}%)**`);
          report.push(`- Model available/inferred: **${metrics.modelAny.toLocaleString()} (${fillRates.modelAny.percent}%)**`);
          report.push(`- Explicit model: **${metrics.modelExplicit.toLocaleString()} (${fillRates.modelExplicit.percent}%)**`);
          report.push(`- Cross-seller exact-comparable identity: **${metrics.comparableExact.toLocaleString()} (${fillRates.comparableExact.percent}%)**`);
          report.push(`- Structured specs found: **${metrics.structuredSpecs.toLocaleString()} (${fillRates.structuredSpecs.percent}%)**`);
          report.push(`- Price: **${metrics.price.toLocaleString()} (${fillRates.price.percent}%)**`);
          report.push(`- Image: **${metrics.image.toLocaleString()} (${fillRates.image.percent}%)**`);
          report.push(`- Product link: **${metrics.link.toLocaleString()} (${fillRates.link.percent}%)**`);
          report.push(`- Products with variants preserved: **${metrics.variants.toLocaleString()} (${fillRates.variants.percent}%)**`, "");
          report.push("## Identity safety", "");
          report.push(`- Duplicate product keys: **${audit.duplicateProductKeys ? "FAIL" : "PASS"}**`);
          report.push(`- Blocked seller leak: **${audit.blockedSellerLeak ? "FAIL" : "PASS"}**`);
          report.push(`- Global-ID conflicts: **${conflicts.globalId.length}**`);
          report.push(`- Seller-product-ID conflicts: **${conflicts.sellerProductId.length}**`);
          report.push(`- SKU conflicts: **${conflicts.sku.length}**`);
          report.push(`- Brand/model collisions: **${conflicts.brandModel.length}**`);
          report.push(`- Resolver round-trip: **${roundTripPassed}/${roundTripTotal}**`, "");
          report.push("## What is persisted", "");
          report.push("- `data/catalog-v19/schema-v1.json` — contract every later seller must follow.");
          report.push("- `data/catalog-v19/ARCHITECTURE.md` — identity and failure-handling rules.");
          report.push("- `data/catalog-v19/sellers/geekbuying/products.ndjson` — full normalized Geekbuying catalog.");
          report.push("- `identity-index.json` — exact ID/model/name lookup tables.");
          report.push("- `category-index.json` — stored seller categories for broad searches.");
          report.push("- `manifest.json` + `audit.json` — counts, fill rates, conflicts and validation.", "");
          report.push("## Gate for Seller 2", "");
          const pass =
            !audit.duplicateProductKeys &&
            !audit.blockedSellerLeak &&
            records.length >= 500 &&
            roundTripPassed === roundTripTotal &&
            metrics.stableSellerId / records.length >= 0.70;
          report.push(`**${pass ? "PASS" : "REVIEW"}**`);
          report.push("");
          if (pass) {
            report.push("Seller 2 can now be built against this exact schema. The recommended next seller is **AliExpress**; its adapter must map its source fields into the same identifiers/name/taxonomy/specs/offer contract rather than invent a new structure.");
          } else {
            report.push("Do not start Seller 2 automatically. Review the audit conflicts/fill rates first; the schema itself remains the fixed contract.");
          }

          fs.writeFileSync(`${SELLER_DIR}/report.md`, report.join("\n") + "\n");
          console.log(report.join("\n"));
          JS
          node --check ./v19-geekbuying-builder.mjs
          node ./v19-geekbuying-builder.mjs
          rm -f ./v19-geekbuying-builder.mjs

      - name: Validate catalog contract and indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          seller = root / "sellers" / "geekbuying"

          required = [
              root / "schema-v1.json",
              root / "ARCHITECTURE.md",
              seller / "products.ndjson",
              seller / "identity-index.json",
              seller / "category-index.json",
              seller / "manifest.json",
              seller / "audit.json",
              seller / "report.md",
          ]
          for p in required:
              assert p.exists() and p.stat().st_size > 0, p

          manifest = json.loads((seller / "manifest.json").read_text())
          audit = json.loads((seller / "audit.json").read_text())
          schema = json.loads((root / "schema-v1.json").read_text())

          assert manifest["version"] == "19.0.0"
          assert manifest["seller"]["name"] == "Geekbuying"
          assert manifest["metrics"]["totalProducts"] >= 500
          assert audit["blockedSellerLeak"] is False
          assert audit["duplicateProductKeys"] is False
          assert schema["title"] == "TrendPilot Canonical Seller Product"

          keys = set()
          rows = 0
          with (seller / "products.ndjson").open() as f:
              for line in f:
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  rows += 1
                  assert row["schemaVersion"] == "19.0.0"
                  assert row["seller"]["name"] == "Geekbuying"
                  assert row["productKey"] not in keys
                  keys.add(row["productKey"])
                  assert row["name"]["display"]
                  assert "identifiers" in row
                  assert "specs" in row
                  assert "offer" in row
                  assert "links" in row

          assert rows == manifest["metrics"]["totalProducts"]

          idx = json.loads((seller / "identity-index.json").read_text())
          all_indexed_keys = set()
          for bucket_name in [
              "byGlobalId","bySellerProductId","bySku","byBrandModel",
              "byModel","byExactName","byCompactName"
          ]:
              for values in idx[bucket_name].values():
                  all_indexed_keys.update(values)
          assert all_indexed_keys <= keys

          samples = audit["roundTripSamples"]
          assert samples
          assert all(x["resolved"] for x in samples), [x for x in samples if not x["resolved"]][:5]

          stable = manifest["metrics"]["stableSellerId"]
          total = manifest["metrics"]["totalProducts"]
          assert stable / total >= 0.70, (stable, total)

          print("V19.0 Seller 1 validation PASS")
          print("Products:", total)
          print("Stable seller ID/SKU:", stable)
          print("Round trips:", len(samples))
          PY

      - name: Commit canonical catalog foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/catalog-v19

          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "feat: add V19 Geekbuying canonical seller catalog foundation"
            if ! git push origin HEAD:main; then
              echo "Main moved while catalog was building; rebasing once."
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Publish concise Seller 1 summary
        shell: bash
        run: |
          set -euo pipefail
          cat data/catalog-v19/sellers/geekbuying/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Seller 1 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v19-geekbuying-foundation-catalog
          path: |
            data/catalog-v19/schema-v1.json
            data/catalog-v19/ARCHITECTURE.md
            data/catalog-v19/sellers/geekbuying/manifest.json
            data/catalog-v19/sellers/geekbuying/audit.json
            data/catalog-v19/sellers/geekbuying/report.md
          retention-days: 14
          compression-level: 9
