name: TrendPilot V21.3.2 MacBook Main-Product Quality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trendpilot-v21-3-2-macbook-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    env:
      TP_BASE_URL: https://trendpilotchoice.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 3

      - name: Harden V20.9 runtime retry and explicit MacBook purity
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('js/universal-discovery-v20-9-1.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const RUNTIME_VERSION = "20.9.4";','const RUNTIME_VERSION = "21.3.2";',1)
          old='const fetchJSON=url=>{if(!cache.has(url))cache.set(url,fetch(url,{cache:"force-cache"}).then(r=>r.ok?r.json():null).catch(()=>null));return cache.get(url)};'
          new='const fetchJSON=url=>{if(!cache.has(url))cache.set(url,(async()=>{let last=null;for(let i=0;i<3;i++){try{const r=await fetch(url,{cache:i?"reload":"no-store"});if(r.ok)return await r.json();last=r.status}catch(e){last=e}await new Promise(res=>setTimeout(res,120*(i+1)))}console.warn("TrendPilot data fetch failed",url,last);return null})());return cache.get(url)};'
          if old not in s: raise SystemExit('fetchJSON source contract changed')
          s=s.replace(old,new,1)
          needle='  function semanticOK(r){\n    if(!genericFamily||intent!=="main")return true;\n    const title=L(r.t),fam=L(r.fa||r.ty);'
          repl='  const MACBOOK_BAD=/\\b(?:sleeve|case|cover|bag|handbag|briefcase|skin|shell|stand|dock|docking|charger|adapter|cable|keyboard cover|screen protector|protective film|replacement|battery for|compatible with macbook|for macbook)\\b/i;\n  function semanticOK(r){\n    const explicitMacBook=family==="laptop"&&/\\bmacbook\\b/i.test(L(q));\n    if((!genericFamily&&!explicitMacBook)||intent!=="main")return true;\n    const title=L(r.t),fam=L(r.fa||r.ty);\n    if(explicitMacBook){if(!/\\bmacbook\\b/i.test(title))return false;if(MACBOOK_BAD.test(title))return false;}'
          if needle not in s: raise SystemExit('semanticOK source contract changed')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          assert 'RUNTIME_VERSION = "21.3.2"' in s
          assert 'MACBOOK_BAD=' in s
          assert 'for(let i=0;i<3;i++)' in s
          print('V21.3.2 runtime source patch PASS')
          PY

      - name: Cache-bust finder runtime
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('find/index.html');s=p.read_text(encoding='utf-8')
          s=s.replace('/js/universal-discovery-v20-9-1.js?v=21.3.0','/js/universal-discovery-v20-9-1.js?v=21.3.2')
          p.write_text(s,encoding='utf-8')
          assert 'universal-discovery-v20-9-1.js?v=21.3.2' in s
          PY

      - name: Commit runtime hardening
        shell: bash
        run: |
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/universal-discovery-v20-9-1.js find/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'TrendPilot V21.3.2 retry data loads and reject MacBook accessories'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for V21.3.2 live
        shell: bash
        run: |
          for i in $(seq 1 36); do
            h=$(curl -fsSL "${TP_BASE_URL}/find/" || true)
            j=$(curl -fsSL "${TP_BASE_URL}/js/universal-discovery-v20-9-1.js?v=21.3.2" || true)
            if printf '%s' "$h" | grep -q 'universal-discovery-v20-9-1.js?v=21.3.2' && printf '%s' "$j" | grep -q 'RUNTIME_VERSION = "21.3.2"'; then echo 'V21.3.2 live';exit 0;fi
            echo "waiting $i/36";sleep 10
          done
          exit 1

      - name: Verify book stability, MacBook purity and detail navigation
        shell: bash
        run: |
          mkdir -p artifacts/v21-3-2
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs');const BASE=process.env.TP_BASE_URL;
          (async()=>{const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2.75,isMobile:true,hasTouch:true});const p=await ctx.newPage();p.setDefaultTimeout(90000);const out={version:'21.3.2',checks:{},book:[],macbook:null,makbook:null,detail:null};
          async function search(q,label){await p.goto(`${BASE}/find/?q=${encodeURIComponent(q)}&engine=v2064&universal=1`,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>{const c=(document.querySelector('[data-v2078-results-count]')?.textContent||'').trim();return c&&c!=='Ready'&&!/searching/i.test(c)},null,{timeout:90000});await p.waitForTimeout(300);const d=await p.evaluate(()=>({count:(document.querySelector('[data-v2078-results-count]')?.textContent||'').trim(),runtime:window.__TP_V2091_UNIVERSAL__||null,normalizer:window.__TP_QUERY_NORMALIZER__||null,cards:[...document.querySelectorAll('.tp78-card')].map(c=>({title:(c.querySelector('h3')?.textContent||'').trim(),href:c.querySelector('a.internal-detail')?.getAttribute('href')||'',role:c.dataset.v209Role||'',family:c.dataset.v209Family||''}))}));await p.screenshot({path:`artifacts/v21-3-2/${label}.png`});return d}
          for(let i=1;i<=3;i++){const b=await search('book',`book-${i}`);out.book.push({count:b.count,cards:b.cards.length,first:b.cards[0]?.title||''});out.checks[`book_${i}`]=b.cards.length>0&&b.cards.some(x=>/book/i.test(x.title));out.checks[`runtime_${i}`]=b.runtime?.runtimeVersion==='21.3.2'}
          const bad=/\b(?:sleeve|case|cover|bag|handbag|briefcase|skin|shell|stand|dock|docking|charger|adapter|cable|keyboard cover|screen protector|protective film|replacement|battery for|compatible with macbook|for macbook)\b/i;
          const m=await search('macbook','macbook');out.macbook={count:m.count,cards:m.cards.length,titles:m.cards.map(x=>x.title),roles:[...new Set(m.cards.map(x=>x.role))],families:[...new Set(m.cards.map(x=>x.family))]};out.checks.macbook_has_clean_main=m.cards.length>0&&m.cards.every(x=>/\bmacbook\b/i.test(x.title)&&!bad.test(x.title)&&x.family==='laptop');
          const t=await search('makbook','makbook');out.makbook={count:t.count,cards:t.cards.length,first:t.cards[0]?.title||'',normalizer:t.normalizer,url:p.url()};out.checks.makbook_corrected=t.normalizer?.corrected?.toLowerCase()==='macbook'&&/q=macbook/i.test(p.url());out.checks.makbook_clean=t.cards.length>0&&t.cards.every(x=>/\bmacbook\b/i.test(x.title)&&!bad.test(x.title));
          const b=await search('book','book-detail-source');const a=p.locator('a.internal-detail').first();const href=await a.getAttribute('href');await a.click();await p.waitForURL(/\/item\/\?id=/,{timeout:30000});await p.waitForFunction(()=>!!document.querySelector('[data-tp85-detail]:not([hidden])')||!!document.querySelector('[data-tp85-error]:not([hidden])'),null,{timeout:90000});out.detail=await p.evaluate(()=>({title:(document.querySelector('[data-tp85-title]')?.textContent||'').trim(),visible:!!document.querySelector('[data-tp85-detail]:not([hidden])'),error:!!document.querySelector('[data-tp85-error]:not([hidden])'),seller:(document.querySelector('[data-tp85-fact-seller]')?.textContent||'').trim(),url:location.href}));out.detail.href=href;out.checks.detail=out.detail.visible&&!out.detail.error&&out.detail.title.length>2;await p.screenshot({path:'artifacts/v21-3-2/book-detail.png'});
          out.passed=Object.values(out.checks).every(Boolean);fs.writeFileSync('artifacts/v21-3-2/report.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));await browser.close();if(!out.passed)process.exit(1)})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trendpilot-v21-3-2-search-quality
          path: artifacts/v21-3-2
