name: Tumblr CarPlay External Image Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tumblr-carplay-external-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
      TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
      TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
      TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Tumblr client
        run: npm install --no-save tumblr.js@5.0.1
      - name: Create external-image NPF post and verify image block
        shell: bash
        run: |
          set +e
          mkdir -p data/runtime
          node <<'NODE'
          const fs = require('fs');
          const tumblr = require('tumblr.js');

          const title='Will a Wireless CarPlay Adapter Work in Your Car?';
          const imageUrl='https://raw.githubusercontent.com/s023007/trendpilot-ai/main/images/social/carplay-ai-01.jpg';
          const destination='https://trendpilotchoice.com/products/wireless-carplay-adapters/?utm_source=tumblr&utm_medium=organic&utm_campaign=wireless-carplay-search-first&utm_content=npf-external-image-v1';
          const tags=['wireless carplay','car accessories','car gadgets','apple carplay','buying guide','smart shopping','TrendPilot'];
          const out={started_at:new Date().toISOString(),auth_ok:false,blog:null,created:null,verified:false,has_image_block:false,deleted_old:[],queue_after:null,error:null};
          const save=()=>fs.writeFileSync('data/runtime/tumblr-external-image-result.json',JSON.stringify(out,null,2)+'\n');
          const client=tumblr.createClient({consumer_key:process.env.TUMBLR_CONSUMER_KEY,consumer_secret:process.env.TUMBLR_CONSUMER_SECRET,token:process.env.TUMBLR_OAUTH_TOKEN,token_secret:process.env.TUMBLR_OAUTH_TOKEN_SECRET});

          (async()=>{
            try{
              const info=await client.userInfo(); out.auth_ok=true;
              const blogs=info?.user?.blogs||[];
              const preferred=blogs.find(b=>String(b.name||'').toLowerCase()==='trendpilotchoice')||blogs.find(b=>String(b.url||'').toLowerCase().includes('trendpilotchoice'))||blogs.find(b=>b.primary)||blogs[0];
              if(!preferred) throw new Error('No Tumblr blog resolved');
              const blogName=preferred.name||preferred.url; out.blog=blogName;

              const before=await client.blogQueue(blogName,{limit:50,offset:0,filter:'raw'});
              const old=(before?.posts||[]).filter(p=>
                String(p.summary||'').includes(title) ||
                (Array.isArray(p.tags)&&p.tags.some(t=>String(t).startsWith('trendpilot-carplay-')))
              );

              const response=await client.createPost(blogName,{
                state:'queue',
                tags,
                content:[
                  {type:'image',media:[{url:imageUrl,type:'image/jpeg'}],alt_text:'Wireless CarPlay adapter buying guide visual from TrendPilot'},
                  {type:'text',subtype:'heading1',text:title},
                  {type:'text',text:'Before buying, confirm that wired CarPlay already works, the USB port carries data, firmware updates are available, and the seller has a clear return route.'},
                  {type:'link',url:destination,title:'Read the full Wireless CarPlay buying guide',description:'Five practical checks before comparing adapters.',site_name:'TrendPilot'},
                  {type:'text',text:'TrendPilot — Smarter buying. Fewer surprises.'}
                ]
              });
              const newId=String(response?.id||response?.response?.id||'');
              out.created={ok:!!newId,id:newId||null,response_keys:Object.keys(response||{})};
              if(!newId) throw new Error('No post id returned');

              const verify=await client.blogQueue(blogName,{limit:50,offset:0,filter:'raw'});
              const newPost=(verify?.posts||[]).find(p=>String(p.id)===newId);
              out.verified=!!newPost;
              const blocks=newPost?.content||[];
              out.has_image_block=blocks.some(b=>b?.type==='image' && Array.isArray(b.media) && b.media.length>0);
              if(!newPost || !out.has_image_block) throw new Error('New post did not verify with an image block');

              for(const p of old){
                if(String(p.id)!==newId){
                  await client.deletePost(blogName,String(p.id));
                  out.deleted_old.push(String(p.id));
                }
              }

              const after=await client.blogQueue(blogName,{limit:50,offset:0,filter:'raw'});
              out.queue_after=(after?.posts||[]).map(p=>({
                id:String(p.id),summary:p.summary||'',tags:p.tags||[],
                content:(p.content||[]).map(b=>({type:b.type,media:b.media||null,url:b.url||null,text:b.text||null,title:b.title||null}))
              }));
            }catch(e){out.error=String(e?.stack||e);}finally{save();}
          })();
          NODE
      - name: Commit result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/tumblr-external-image-result.json
          git commit -m "chore: record Tumblr external image result" || exit 0
          git pull --rebase origin main || true
          git push || true
