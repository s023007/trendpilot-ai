name: Probe Alibaba XML structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect Alibaba XML tags
        env:
          ALIBABA_XML_URL: ${{ secrets.ALIBABA_CONSUMER_ELECTRONICS_XML_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import json
          import os
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from pathlib import Path

          url = os.environ.get("ALIBABA_XML_URL", "").strip()
          if not url:
              raise SystemExit(
                  "Missing secret ALIBABA_CONSUMER_ELECTRONICS_XML_URL"
              )

          def local_name(tag):
              if not isinstance(tag, str):
                  return str(tag)
              if "}" in tag:
                  tag = tag.rsplit("}", 1)[-1]
              if ":" in tag:
                  tag = tag.rsplit(":", 1)[-1]
              return tag

          headers = {
              "User-Agent": "Mozilla/5.0 TrendPilotAI/1.0",
              "Accept": "application/xml,text/xml,*/*",
          }
          request = urllib.request.Request(url, headers=headers)

          tag_counts = collections.Counter()
          record_samples = {}
          root_tag = None
          parsed_end_events = 0
          max_end_events = 12000

          with urllib.request.urlopen(request, timeout=90) as response:
              content_type = response.headers.get("Content-Type", "")
              final_url = response.geturl()

              for event, elem in ET.iterparse(response, events=("start", "end")):
                  tag = local_name(elem.tag)

                  if event == "start" and root_tag is None:
                      root_tag = tag

                  if event == "end":
                      parsed_end_events += 1
                      tag_counts[tag] += 1

                      children = list(elem)
                      child_names = [local_name(child.tag) for child in children]

                      if len(child_names) >= 3 and tag not in record_samples:
                          record_samples[tag] = {
                              "childFields": child_names[:40],
                              "attributes": sorted(elem.attrib.keys())[:20],
                          }

                      elem.clear()

                      if parsed_end_events >= max_end_events:
                          break

          repeated_candidates = []
          for tag, count in tag_counts.most_common():
              sample = record_samples.get(tag)
              if count >= 2 and sample:
                  repeated_candidates.append({
                      "tag": tag,
                      "countInSample": count,
                      "childFields": sample["childFields"],
                      "attributes": sample["attributes"],
                  })

          report = {
              "source": "Alibaba consumer electronics XML",
              "rootTag": root_tag,
              "contentType": content_type,
              "finalUrlHost": urllib.parse.urlparse(final_url).netloc
                  if final_url else "",
              "parsedEndEvents": parsed_end_events,
              "candidateRecordTags": repeated_candidates[:20],
              "mostCommonTags": [
                  {"tag": tag, "countInSample": count}
                  for tag, count in tag_counts.most_common(40)
              ],
              "instruction": (
                  "Use the first candidateRecordTags entry that represents one "
                  "product as itemTags in the Alibaba source configuration."
              ),
          }

          output = Path("data/alibaba-xml-probe.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit XML probe report
        shell: bash
        run: |
          if git diff --quiet -- data/alibaba-xml-probe.json; then
            echo "No probe changes to commit."
            exit 0
          fi

          git config user.name "trendpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alibaba-xml-probe.json
          git commit -m "chore: inspect Alibaba XML structure"
          git push
