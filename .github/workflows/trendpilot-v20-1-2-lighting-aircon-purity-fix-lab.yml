          const probeFailures=[];
          for(const [label,type,name,seller] of negativeProbes){
            const c=classify(fakeProduct(name,seller||"Alibaba"));
            if(c.role==="main"&&c.type===type) probeFailures.push({probe:label,expected:"not-main",actual:`${c.type}/${c.role}`,name});
          }
          for(const [label,type,name,seller] of positiveProbes){
            const c=classify(fakeProduct(name,seller||"Alibaba"));
            if(!(c.role==="main"&&c.type===type)) probeFailures.push({probe:label,expected:`${type}/main`,actual:`${c.type||"none"}/${c.role}`,name});
          }

          const blockedLeak=projection.filter(r=>isBlockedSeller(r.seller));
          const typeCounts={};
          for(const d of TYPE_DEFS){
            const main=(typeMain.get(d.type)||[]).length,related=(typeRelated.get(d.type)||[]).length;
            typeCounts[d.type]={main,related};
          }
          const roleCounts={main:0,accessory:0,replacement_part:0,related:0,unclassified:0};
          for(const r of projection) roleCounts[r.productRole]=(roleCounts[r.productRole]||0)+1;

          const exactIndexStats={
            globalIdentifiers:[...exactGlobalIdIndex.values()].reduce((a,b)=>a+b.length,0),
            uniqueSellerIdOrSku:exactUniqueStableIndex.size,
            explicitBrandModel:[...exactBrandModelIndex.values()].reduce((a,b)=>a+b.length,0),
            brandMpn:[...exactBrandMpnIndex.values()].reduce((a,b)=>a+b.length,0)
          };

          const criticalPass=approved.length===13&&missingApproved.length===0&&duplicateKeys.length===0&&blockedLeak.length===0&&regressionFailures.length===0&&catalogPurityFailures.length===0&&probeFailures.length===0;
          const sellerRows=[...sellerStats.values()].sort((a,b)=>b.records-a.records);
          const summary={
            version:"20.1.2",readOnly:true,approvedPublicSellers:approved.length,catalogFilesLoaded:catalogs.length,canonicalRecords:projection.length,
            duplicateProductKeys:duplicateKeys.length,blockedSellerLeaks:blockedLeak.length,roleCounts,typeCounts,exactIndexStats,regressionFailures:regressionFailures.length,catalogPurityFailures:catalogPurityFailures.length,probeFailures:probeFailures.length,
            queries:results.map(r=>({query:r.query,mode:r.mode,type:r.type,trustedExact:r.trustedExact.length,specificMatches:r.specificMatches.length,mainShown:r.main.length,alternatives:r.alternatives.length,sellers:uniq([...r.main,...r.alternatives].map(x=>x.seller)),relatedSeparated:r.related.length})),
            criticalPass
          };

          fs.writeFileSync(path.join(OUT,"summary.json"),JSON.stringify(summary,null,2));
          fs.writeFileSync(path.join(OUT,"strict-search-projection.json"),JSON.stringify(projection,null,2));
          fs.writeFileSync(path.join(OUT,"query-results.json"),JSON.stringify(results,null,2));
          fs.writeFileSync(path.join(OUT,"regression-failures.json"),JSON.stringify(regressionFailures,null,2));
          fs.writeFileSync(path.join(OUT,"catalog-purity-failures.json"),JSON.stringify(catalogPurityFailures,null,2));
          fs.writeFileSync(path.join(OUT,"synthetic-probe-failures.json"),JSON.stringify(probeFailures,null,2));
          const csv=["seller,records,main,accessory,replacement_part,related,unclassified,stable_id,global_id,explicit_model,price,image,link,cpc",...sellerRows.map(s=>[s.seller,s.records,s.main,s.accessory,s.replacementPart,s.related,s.unclassified,s.stableId,s.globalId,s.explicitModel,s.price,s.image,s.link,s.cpc?"yes":"no"].map(v=>`"${String(v).replaceAll('"','""')}"`).join(","))].join("\n")+"\n";
          fs.writeFileSync(path.join(OUT,"seller-coverage.csv"),csv);

          function money(r){return r.price==null?"price n/a":`${r.price} ${r.currency||""}`.trim();}
          function line(r){return `- **${r.seller}** — ${r.name} — ${money(r)}${r.cpc?" • CPC seller":""}`;}
          let md=`# TrendPilot V20.1.2 — Product-Type Purity Gate Lab\n\n`;
          md+=`> **Read-only.** Visitor UI, production Search API, Netlify Blobs and V19 canonical catalogs were not changed.\n\n`;
          md+=`## Foundation\n\n- Public product sellers: **${approved.length}**\n- Canonical catalogs loaded: **${catalogs.length}**\n- Canonical records: **${projection.length.toLocaleString()}**\n- Duplicate product keys: **${duplicateKeys.length}**\n- Blocked seller leaks (Temu/Joom/FilamentPRO): **${blockedLeak.length}**\n\n`;
          md+=`## V20.1.2 rule\n\nExact identity remains unchanged from V20.1. The rule remains strict: **a display title itself must prove the product type before a record can enter a main-product pool**. V20.1.2 aligns the classifier and catalog-wide purity validator on the same evidence functions, expands verified Govee lighting-title signals, keeps Govee control boxes separate, and distinguishes rated/installed air conditioners from USB/mist/personal coolers. Taxonomy, category paths and destination URLs may support discovery but cannot promote accessories, parts, repair tools or unrelated products into main results.\n\n`;
          md+=`## Product roles\n\n| Role | Records |\n|---|---:|\n`;
          for(const k of ["main","accessory","replacement_part","related","unclassified"])md+=`| ${k} | ${(roleCounts[k]||0).toLocaleString()} |\n`;
          md+=`\n## Trusted exact-index coverage\n\n- Global identifier entries: **${exactIndexStats.globalIdentifiers.toLocaleString()}**\n- Globally unique seller ID/SKU values: **${exactIndexStats.uniqueSellerIdOrSku.toLocaleString()}**\n- Brand + explicit model entries: **${exactIndexStats.explicitBrandModel.toLocaleString()}**\n- Brand + MPN entries: **${exactIndexStats.brandMpn.toLocaleString()}**\n\n`;
          md+=`## Precomputed product types\n\n| Type | Main | Related/accessories/parts |\n|---|---:|---:|\n`;
          for(const d of TYPE_DEFS){const x=typeCounts[d.type];md+=`| ${d.type} | ${x.main.toLocaleString()} | ${x.related.toLocaleString()} |\n`;}
          md+=`\n## Seller-aware coverage\n\n| Seller | Records | Main | Accessory | Parts | Related | Unclassified | Stable ID | Price | Image | Link | CPC |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|\n`;
          for(const s of sellerRows)md+=`| ${s.seller} | ${s.records.toLocaleString()} | ${s.main.toLocaleString()} | ${s.accessory.toLocaleString()} | ${s.replacementPart.toLocaleString()} | ${s.related.toLocaleString()} | ${s.unclassified.toLocaleString()} | ${s.stableId.toLocaleString()} | ${s.price.toLocaleString()} | ${s.image.toLocaleString()} | ${s.link.toLocaleString()} | ${s.cpc?"yes":"no"} |\n`;
          md+=`\n## Visitor-query regression tests\n\n| Query | Mode | Type | Trusted exact | Specific main matches | Main shown | Alternatives | Sellers | Related separated |\n|---|---|---|---:|---:|---:|---:|---|---:|\n`;
          for(const r of results)md+=`| ${r.query} | ${r.mode} | ${r.type||"—"} | ${r.trustedExact.length} | ${r.specificMatches.length} | ${r.main.length} | ${r.alternatives.length} | ${uniq([...r.main,...r.alternatives].map(x=>x.seller)).join(", ")||"—"} | ${r.related.length} |\n`;
          md+=`\n## Short samples\n\n`;
          for(const r of results){
            md+=`### ${r.query}\n\n`;
            if(r.trustedExact.length)md+=`**Trusted exact identity**\n${r.trustedExact.slice(0,4).map(line).join("\n")}\n\n`;
            if(r.main.length)md+=`**Main products**\n${r.main.slice(0,4).map(line).join("\n")}\n\n`;
            else md+=`**No main product match.** Accessories are not promoted to the requested product.\n\n`;
            if(r.alternatives.length)md+=`**Same-type safe alternatives**\n${r.alternatives.slice(0,4).map(line).join("\n")}\n\n`;
            if(r.related.length)md+=`**Related/accessories kept separate: ${r.related.length}**\n${r.related.slice(0,3).map(line).join("\n")}\n\n`;
          }
          md+=`## Catalog-wide purity gate\n\n- Main products checked across the full projection: **${roleCounts.main.toLocaleString()}**\n- Catalog purity failures: **${catalogPurityFailures.length}**\n- Synthetic false-positive/positive-control probe failures: **${probeFailures.length}**\n- Query regression failures: **${regressionFailures.length}**\n\n`;
          if(catalogPurityFailures.length){md+=`### First catalog purity failures\n\n`;for(const f of catalogPurityFailures.slice(0,20))md+=`- ${f.type} / ${f.seller}: ${f.reason} — ${f.name}\n`;md+=`\n`;}
          if(probeFailures.length){md+=`### Synthetic probe failures\n\n`;for(const f of probeFailures.slice(0,20))md+=`- ${f.probe}: expected ${f.expected}, got ${f.actual} — ${f.name}\n`;md+=`\n`;}
          md+=`## Precision gate\n\n- Regression failures: **${regressionFailures.length}**\n- Catalog purity failures: **${catalogPurityFailures.length}**\n- Probe failures: **${probeFailures.length}**\n- Result: **${criticalPass?"PASS":"FAIL"}**\n\n`;
          if(regressionFailures.length){md+=`### First failures\n\n`;for(const f of regressionFailures.slice(0,20))md+=`- ${f.query}: ${f.reason} — ${f.name}\n`;md+=`\n`;}
          md+=criticalPass
            ? `**V20.1.2 LAB PASS.** The product-type purity gate passed catalog-wide and query-level checks. Do not deploy automatically from this lab; review the samples first.\n`
            : `**V20.1.2 LAB FAIL.** Do not connect the visitor UI. Refine only the classifier/purity rules; canonical seller catalogs remain untouched.\n`;
          fs.writeFileSync(path.join(OUT,"report.md"),md);

          console.log(JSON.stringify(summary,null,2));
          if(!criticalPass) process.exit(2);
          JS

          node --check "$RUNNER_TEMP/v20-1-2-purity-lab.mjs"
          node "$RUNNER_TEMP/v20-1-2-purity-lab.mjs"

      - name: Validate V20.1.2 purity lab outputs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v20-1-2-lab"
          test -s "$OUT/report.md"
          test -s "$OUT/summary.json"
          test -s "$OUT/strict-search-projection.json"
          test -s "$OUT/query-results.json"
          test -s "$OUT/regression-failures.json"
          test -s "$OUT/catalog-purity-failures.json"
          test -s "$OUT/synthetic-probe-failures.json"
          test -s "$OUT/seller-coverage.csv"
          python3 - <<'PY'
          import json, os
          out=os.path.join(os.environ["RUNNER_TEMP"],"v20-1-2-lab")
          s=json.load(open(os.path.join(out,"summary.json"),encoding="utf-8"))
          assert s["approvedPublicSellers"] == 13
          assert s["catalogFilesLoaded"] >= 13
          assert s["canonicalRecords"] > 50000
          assert s["duplicateProductKeys"] == 0
          assert s["blockedSellerLeaks"] == 0
          assert s["regressionFailures"] == 0
          assert s["catalogPurityFailures"] == 0
          assert s["probeFailures"] == 0
          assert s["criticalPass"] is True
          print("V20.1.2 product-type purity gate: PASS")
          PY

      - name: Publish V20.1.2 summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v20-1-2-lab"
          if [ -s "$OUT/report.md" ]; then
            cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# TrendPilot V20.1.2 — Product-Type Purity Gate Lab"
              echo
              echo "**FAILED before report generation.** No production state was changed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload V20.1.2 purity lab artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v20-1-2-product-type-purity-gate-lab
          path: ${{ runner.temp }}/v20-1-2-lab/
          if-no-files-found: warn
          retention-days: 14
