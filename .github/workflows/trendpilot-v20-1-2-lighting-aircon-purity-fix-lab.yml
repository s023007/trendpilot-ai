name: TrendPilot V20.1.2 — Product-Type Purity Gate Lab

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Comma-separated visitor queries to test"
        required: false
        default: "iPhone 16,Galaxy S25,ThinkPad,phone,laptop,smartwatch,headphones,perfume,dog food,power bank,air conditioner,3d filament,cookware,lighting,tools"
      max_results:
        description: "Maximum main results shown per query"
        required: false
        default: "12"

permissions:
  contents: read

concurrency:
  group: trendpilot-v20-1-2-product-type-purity-lab
  cancel-in-progress: false

jobs:
  v20-1-2-purity-lab:
    name: Build strict identity with catalog-wide product-type purity gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify canonical foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f data/product-seller-registry-v17.json
          test -d data/catalog-v19/sellers
          test -f data/catalog-v19/schema-v1.json
          python3 - <<'PY'
          import json, pathlib
          reg=json.load(open("data/product-seller-registry-v17.json",encoding="utf-8"))
          sellers=[x["name"] for x in reg.get("sellers",[]) if x.get("public") is True]
          blocked={"Temu","Joom","FilamentPRO EU CPS"}
          print("Public product sellers:",len(sellers))
          for s in sellers: print(" -",s)
          assert len(sellers)==13, f"Expected 13 public product sellers, got {len(sellers)}"
          assert not (blocked & set(sellers)), f"Blocked seller leaked into public policy: {blocked & set(sellers)}"
          root=pathlib.Path("data/catalog-v19/sellers")
          files=list(root.glob("*/products.ndjson"))
          print("Canonical product files found:",len(files))
          assert len(files)>=13, f"Expected at least 13 canonical seller files, got {len(files)}"
          PY

      - name: Build V20.1.2 product-type purity lab
        shell: bash
        env:
          V20_QUERIES: ${{ inputs.queries }}
          V20_MAX_RESULTS: ${{ inputs.max_results }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v20-1-2-lab"
          mkdir -p "$OUT"

          cat > "$RUNNER_TEMP/v20-1-2-purity-lab.mjs" <<'JS'
          import fs from "node:fs";
          import path from "node:path";

          const ROOT = process.cwd();
          const OUT = path.join(process.env.RUNNER_TEMP || "/tmp", "v20-1-2-lab");
          fs.mkdirSync(OUT, { recursive: true });

          const clean = (v) => String(v ?? "").trim();
          const norm = (v) => clean(v)
            .normalize("NFKD")
            .replace(/\p{M}+/gu, "")
            .toLowerCase()
            .replace(/[’‘`´]/g, "'")
            .replace(/[“”]/g, '"')
            .replace(/[_/\\|]+/g, " ")
            .replace(/[^\p{L}\p{N}.+\-'" ]+/gu, " ")
            .replace(/\s+/g, " ")
            .trim();
          const compact = (v) => norm(v).replace(/[^\p{L}\p{N}]+/gu, "");
          const uniq = (arr) => [...new Set(arr.filter(Boolean))];
          const pct = (n,d) => d ? Math.round(n*1000/d)/10 : 0;

          function parseNdjson(file) {
            const rows=[];
            const text=fs.readFileSync(file,"utf8");
            let lineNo=0;
            for(const line of text.split(/\r?\n/)){
              lineNo++;
              if(!line.trim()) continue;
              try { rows.push(JSON.parse(line)); }
              catch(e){ throw new Error(`Invalid NDJSON ${file}:${lineNo}: ${e.message}`); }
            }
            return rows;
          }

          const registry=JSON.parse(fs.readFileSync(path.join(ROOT,"data/product-seller-registry-v17.json"),"utf8"));
          const approved=registry.sellers.filter(s=>s.public===true);
          const approvedNames=new Set(approved.map(s=>s.name));
          const approvedByName=new Map(approved.map(s=>[s.name,s]));
          const blockedPatterns=[/^temu$/i,/^joom$/i,/filamentpro/i];
          const isBlockedSeller=(name)=>blockedPatterns.some(r=>r.test(clean(name)));

          const sellersRoot=path.join(ROOT,"data/catalog-v19/sellers");
          const sellerDirs=fs.readdirSync(sellersRoot,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort();
          const catalogs=[];
          const productMap=new Map();
          const duplicateKeys=[];
          const missingApproved=[];
          const unexpectedCatalogs=[];

          for(const dir of sellerDirs){
            const file=path.join(sellersRoot,dir,"products.ndjson");
            if(!fs.existsSync(file)) continue;
            const rows=parseNdjson(file);
            if(!rows.length) continue;
            const sellerName=clean(rows[0]?.seller?.name);
            if(!approvedNames.has(sellerName)){
              unexpectedCatalogs.push({dir,sellerName,rows:rows.length});
              continue;
            }
            if(isBlockedSeller(sellerName)) throw new Error(`Blocked seller catalog entered V20.1.2: ${sellerName}`);
            let accepted=0,badSellerRows=0;
            for(const p of rows){
              if(clean(p?.seller?.name)!==sellerName){badSellerRows++;continue;}
              const key=clean(p.productKey);
              if(!key) continue;
              if(productMap.has(key)){duplicateKeys.push(key);continue;}
              productMap.set(key,p);accepted++;
            }
            catalogs.push({dir,sellerName,file,rows:rows.length,accepted,badSellerRows});
          }
          for(const a of approved) if(!catalogs.some(c=>c.sellerName===a.name)) missingApproved.push(a.name);
          if(missingApproved.length) throw new Error(`Approved seller catalogs missing: ${missingApproved.join(", ")}`);
          const products=[...productMap.values()];

          // Always rebuild searchable names from display text. Some older canonical rows contain stale/corrupt normalized names.
          const displayName=(p)=>clean(p?.name?.display || p?.name?.normalized);
          const searchName=(p)=>norm(displayName(p));

          const STOP=new Set(["the","a","an","and","or","for","with","to","of","in","on","by","from","new","hot","sale","best","top","quality","original","global","version","official","wholesale","factory","free","shipping","online","shopping"]);

          // Role is decided BEFORE product type. V20.1.2 deliberately favors precision over recall.
          // A product may enter a broad main-product pool only when its DISPLAY TITLE itself
          // proves the requested product type. Taxonomy/URLs can support discovery, but can never
          // promote an accessory, part, tool or unrelated item into a main product.
          const HARD_PART=/\b(replacement|spare\s*part|spares?|repair\s*part|digitizer|lcd\s*(?:screen|assembly|display)|touch\s*screen|screen\s*assembly|motherboard|mainboard|logic\s*board|pcb|circuit\s*board|flex\s*cable|ribbon\s*cable|connector|socket|hinge|bezel|chassis|housing|shell|sim\s*tray|card\s*tray|receiver\s*board|expansion\s*valve|servo\s*motor|filter\s*core)\b/i;
          const HARD_ACCESSORY=/\b(case|cover|screen\s*protector|protector|protective\s*case|privacy\s*filter|film|sleeve|handbag|briefcase|bag|backpack|pouch|strap|watch\s*band|band\s*for|phone\s*stand|stand\s*for|holder|mount|tripod|selfie\s*stick|cable|cord|adapter|dock|bracket|keyboard|keycap|skin|decal|sticker|stylus\s*pen|pen\s*for|charging\s*station|charger\s*for|wireless\s*charger|car\s*charger|lens\s*protector|camera\s*lens\s*protector|earpads?|ear\s*pads?|headphone\s*hook|cup\s*holder)\b/i;
          const ACCESSORY_PREFIX=/^(?:for|compatible\s+with|suitable\s+for|fit\s+for|fits\s+for)\b/i;
          const NON_DEVICE_CONTEXT=/\b(projector|monitor|speaker|microphone|radio|router|cctv|camera\s+reader|sd\s+card\s+reader|usb\s+hub|desk|chair|table|tray|water\s+bottle|garden|net|toaster|engraver|engraving\s+machine|teacup|tea\s+cup|plate|coat|keychain|tumbler|mug|briefcase|backpack|repair\s+kit|tool\s+kit|screwdriver\s+set|powerbank\s+case|power\s*bank\s+case)\b/i;

          function roleSignal(title){
            const t=clean(title);
            if(HARD_PART.test(t)) return {role:"replacement_part",reason:"hard-part-signal"};
            if(HARD_ACCESSORY.test(t)) return {role:"accessory",reason:"hard-accessory-signal"};
            if(ACCESSORY_PREFIX.test(t) && /\b(iphone|galaxy|pixel|thinkpad|ideapad|macbook|watch|airpods?|headphones?|laptop|phone)\b/i.test(t)) return {role:"accessory",reason:"compatible-for-prefix"};
            return {role:"unknown",reason:"none"};
          }

          const TYPE_DEFS=[
            {type:"phone", broad:["phone","phones","smartphone","smartphones","mobile phone","cell phone"],
             main:[/\bsmartphones?\b/i,/\bmobile\s+phones?\b/i,/\bcell\s+phones?\b/i,/\bfeature\s+phones?\b/i,/\biphone\s*(?:[6-9]|1[0-9])(?:\s*(?:pro|max|plus|mini|e))?\b/i,/\bsamsung\s+galaxy\s+s\d{1,2}\b/i,/\bgalaxy\s+s\d{1,2}\b/i,/\bgoogle\s+pixel\s+\d{1,2}\b/i,/\bpixel\s+\d{1,2}\b/i,/\bdoogee\b.*\b(?:smartphone|phone)\b/i,/\bulefone\b.*\b(?:smartphone|phone)\b/i,/\bfossibot\b.*\b(?:smartphone|phone)\b/i],
             forbidden:/\b(case|cover|protector|screen|lcd|digitizer|charger|charging|cable|adapter|stand|holder|mount|tripod|selfie|fill\s*light|phone\s*light|ring\s*light|camera\s*light|lens|enclosure|ssd|keyboard|earphone|earbud|headphone|speaker|projector|module|board|replacement|spare|repair|strap|bracelet|wristband|smart\s*watch|smartwatch|power\s*bank|powerbank|hub|reader)\b/i},
            {type:"laptop", broad:["laptop","laptops","notebook computer","notebook computers","ultrabook","ultrabooks","chromebook","chromebooks"],
             main:[/\blaptops?\b/i,/\bnotebook\s+computers?\b/i,/\bultrabooks?\b/i,/\bchromebooks?\b/i,/\bthinkpad\s+[a-z0-9]/i,/\bideapad\s+[a-z0-9]/i,/\bthinkbook\s+[a-z0-9]/i,/\blegion\s+[a-z0-9]/i,/\blenovo\s+loq\b/i,/\bmacbook\s+(?:air|pro)\b/i],
             forbidden:/\b(case|cover|protector|screen\s*protector|privacy\s*filter|film|sleeve|bag|handbag|briefcase|backpack|keyboard|keycap|ram|memory|ssd|hard\s*drive|monitor|cooling\s*fan|cooling\s*pad|notebook\s*cooler|laptop\s*cooler|battery|charger|adapter|dock|mouse|desk|chair|table|tray|pen|stylus|sticker|decal|skin|stand|screwdriver|repair\s*tool|repair\s*kit|tool\s*kit|module|wwan|lte\s*(?:4g|5g)?\s*module|wireless\s*card|network\s*card|replacement|spare|caddy|hub|&\s*more)\b/i},
            {type:"smartwatch", broad:["smartwatch","smartwatches","smart watch","smart watches"],
             main:[/\bsmart\s*watch(?:es)?\b/i,/\bsmartwatch(?:es)?\b/i,/\bgps\s+watch\b/i],
             forbidden:/\b(case|cover|protector|screen|lcd|band|strap|charger|charging|dock|adapter|replacement|spare|film|garden|net|sticker|decal|box|holder|stand)\b/i},
            {type:"headphones", broad:["headphones","headphone","earbuds","earbud","earphones","earphone","headset","headsets"],
             main:[/\bheadphones?\b/i,/\bearbuds?\b/i,/\bearphones?\b/i,/\bwireless\s+headsets?\b/i,/\btws\b.*\b(?:earbud|earphone|headphone)\b/i],
             forbidden:/\b(cable|cord|adapter|hook|case|cover|bag|earpad|ear\s*pad|replacement|spare|speaker|monitor|vr|virtual\s+reality|radio|microphone|cup\s*holder|tumbler|mug|cup|cap|hoodie|toy|stand|holder|earphone\s*(?:jack|port)|headphone\s*(?:jack|port))\b/i},
            {type:"perfume", broad:["perfume","perfumes","cologne","colognes","fragrance","fragrances"],
             main:[/\beau\s+de\s+parfum\b/i,/\beau\s+de\s+toilette\b/i,/\bpure\s+perfume\b/i,/\bperfume\s+(?:for|spray|oil)\b/i,/\bcologne\s+(?:for|spray)\b/i,/\bperfume\b/i],
             forbidden:/\b(case|cover|airpod|keychain|power\s*bank|powerbank|cup|teacup|plate|coat|pad|pads|machine|chuck|engraving|bottle\s*case|atomizer\s*case|empty\s+perfume\s+bottle|empty\s+bottle|refillable\s+bottle|spray\s+bottle|perfume\s+atomizer|car\s*perfume|cars\s*perfume|car\s*fragrance|auto\s*fragrance|automotive|air\s*freshener|car\s*air\s*freshener)\b/i},
            {type:"dog_food", broad:["dog food","dog treats","dog treat","puppy food","pet food"],
             main:[/\bdog\s+food\b/i,/\bdog\s+treats?\b/i,/\bpuppy\s+food\b/i,/\bdog\s+snacks?\b/i],
             forbidden:/\b(beads?|feeder|dispenser|pelletizer|extruder|production\s+line|machine|bowl|container|opener|can\s*opener|tab\s+buddy|kitchen\s+gadget|food\s+can\s+tab|slow\s+feeder)\b/i},
            {type:"power_bank", broad:["power bank","power banks","powerbank","powerbanks"],
             main:[/\bpower\s*banks?\b/i,/\bpowerbanks?\b/i],
             forbidden:/\b(module|circuit\s*board|pcb|kit|case|housing|replacement|spare|repair|adapter\s+for|inverter\s+adapter|battery\s+adapter|holder\s+for|mount\s+for)\b/i},
            {type:"air_conditioner", broad:["air conditioner","air conditioners","air conditioning","ac unit","ac units"],
             main:[/\bportable\s+air\s+conditioners?\b/i,/\bwindow\s+air\s+conditioners?\b/i,/\bsplit\s+air\s+conditioners?\b/i,/\bmini[-\s]?split\s+(?:air\s+conditioners?|ac\s+units?)\b/i,/\bduct(?:ed)?\s+(?:type\s+)?air\s+conditioners?\b/i,/\binverter\s+air\s+conditioners?\b/i,/\bac\s+units?\b/i,/\bportable\s+ac\b/i,/\bair\s+conditioners?\b.*\b(?:btu|btu\/h|btuh|cooling\s+capacity|heat\s+pump|compressor|\d+(?:\.\d+)?\s*(?:hp|ton))\b/i,/\b(?:btu|btu\/h|btuh|cooling\s+capacity|heat\s+pump|compressor|\d+(?:\.\d+)?\s*(?:hp|ton))\b.*\bair\s+conditioners?\b/i],
             forbidden:/\b(bracket|expansion\s+valve|receiver\s*board|filter\s*core|replacement\s+filter|hose\s+for|adapter\s+for|cleaning\s+(?:brush|tool|kit)|gap\s+cleaning|grille|grill|drill|replacement\s+(?:motor|compressor|sensor|capacitor|thermostat)|compressor\s+(?:part|replacement)|connector|cover\s+for|control\s*board|drain\s*(?:pipe|hose)|evaporative\s+air\s+cooler|air\s+cooler|mist\s+humidif(?:ier|ying)|humidifying\s+fan|water\s+cooler)\b/i},
            {type:"3d_filament", broad:["3d filament","filament","pla filament","petg filament"],
             main:[/\b(?:pla|petg|abs|tpu|asa|nylon)\b.*\bfilament\b/i,/\bfilament\b.*\b(?:1\.75\s*mm|2\.85\s*mm|kg|pla|petg|abs|tpu|asa|nylon)\b/i],
             forbidden:/\b(case|cover|bag|filter|airpod|tea\s+bag|rewinder|re-winder|winder|coiler|winding\s+machine|spool\s+rewinder|spooler|filament\s+dryer|dryer\s+box|filament\s+storage|filament\s+sensor|3d\s+printer\s*\+|3d\s+printer\s+combo|combo\s+3d\s+printer|printer\s*\+.*\bfilament\b)\b/i},
            {type:"cookware", broad:["cookware","cookware set","cookware sets","frying pan","frying pans","pots and pans"],
             main:[/\bcookware\s+sets?\b/i,/\bfrying\s+pans?\b/i,/\bsaucepans?\b/i,/\bskillets?\b/i,/\bpot\s+sets?\b/i,/\bcasseroles?\b/i],
             forbidden:/\b(chopping\s+board|cutting\s+board|utensil\s+holder|replacement|spare|case|cover|knife\s+set|food\s+cutting\s+block)\b/i},
            {type:"lighting", broad:["lighting","led lights","light","lights","lamp","lamps","led strip","led strips"],
             main:[/\bled\s+strip\s+lights?\b/i,/\bstrip\s+lights?\b/i,/\blight\s+strips?\b/i,/\bstring\s+lights?\b/i,/\bcurtain\s+lights?\b/i,/\btv\s+backlights?\b/i,/\bbacklights?\b/i,/\bfloor\s+lamps?\b/i,/\bwall\s+lights?\b/i,/\bwall\s+sconces?\b/i,/\btable\s+lamps?\b/i,/\bsmart\s+(?:led\s+)?lights?\b/i,/\bceiling\s+lights?\b/i,/\bnight\s+lights?\b/i,/\bpathway\s+lights?\b/i,/\bground\s+lights?\b/i,/\bdownlights?\b/i,/\blight\s+bars?\b/i,/\bflood\s+lights?\b/i,/\brope\s+lights?\b/i,/\bneon\s+rope\s+lights?\b/i,/\bpermanent\s+outdoor\s+lights?\b/i,/\boutdoor\s+lights?\b/i,/\bsmart\s+led\s+bulbs?\b/i,/\bled\s+bulbs?\b/i,/\blight\s+panels?\b/i,/\bgalaxy\s+light\s+projector(?:\s+pro|\s+2\s+pro)?\b/i,/\blight\s+projector\b/i,/\brgbic(?:w|ww)?\b.*\b(?:lights?|light\s+bars?|light\s+strips?|strip\s+lights?|string\s+lights?|curtain\s+lights?|backlights?|flood\s+lights?|rope\s+lights?|bulbs?|light\s+panels?)\b/i],
             forbidden:/\b(replacement|spare|adapter|cable|connector|cover|case|bracket|mount|power\s+supply\s+only|controller\s+only|light\s+show\s+box|sync\s+box|control\s+box)\b/i},
            {type:"tools", broad:["tools","tool","drill bit","drill bits","screwdriver","screwdrivers","wrench","wrenches"],
             main:[/\bdrill\s+bits?\b/i,/\bscrewdrivers?\b/i,/\bwrenches?\b/i,/\bpliers?\b/i,/\bhammer\b/i,/\bsocket\s+sets?\b/i,/\btool\s+sets?\b/i,/\bnut\s+driver\s+sets?\b/i],
             forbidden:/\b(screen\s+protector|phone\s+film|iphone|air\s+conditioner\s+tool|phone\s+repair\s+kit|mobile\s+phone\s+repair)\b/i}
          ];

          const DEF_BY_TYPE=new Map(TYPE_DEFS.map(d=>[d.type,d]));
          const broadAliasToType=new Map();
          for(const d of TYPE_DEFS) for(const a of d.broad) broadAliasToType.set(norm(a),d.type);

          // V20.1.2: keep classification and purity validation on the exact same evidence functions.
          // This prevents a seller-aware override from creating a main record that the catalog-wide gate later rejects.
          const GOVEe_LIGHT_CONTROL=/\b(light\s+show\s+box|sync\s+box|control\s+box|controller\s+only)\b/i;
          function strongAirConditionerSignal(title){
            const t=clean(title);
            const named=/\b(?:air\s+conditioners?|ac\s+units?|portable\s+ac|mini[-\s]?split\s+ac)\b/i.test(t);
            if(!named) return false;
            const rated=/\b\d{4,5}(?:\s*[-/]\s*\d{4,5})?\s*(?:btu|btu\/h|btuh)\b/i.test(t) || /\b\d+(?:\.\d+)?\s*(?:hp|ton)\b/i.test(t);
            const system=/\b(?:window|split|mini[-\s]?split|ducted?|central|compressor|heat\s+pump|cooling\s+capacity)\b/i.test(t);
            return rated || system;
          }
          function airConditionerFalsePositive(title){
            const t=clean(title);
            if(strongAirConditionerSignal(t)) return false;
            return /\b(?:usb|battery|rechargeable|personal|desktop|tabletop|mist|humidif(?:ier|ying)|evaporative\s+air\s+cooler|air\s+cooler|fan\s+cooler|cooling\s+mist|water\s+tank)\b/i.test(t);
          }
          function titleProvesMain(type,title){
            const d=DEF_BY_TYPE.get(type);
            if(!d) return false;
            if(type==="air_conditioner") return strongAirConditionerSignal(title) || (d.main.some(re=>re.test(title)) && !airConditionerFalsePositive(title));
            return d.main.some(re=>re.test(title));
          }
          function typeForbidden(type,title){
            const d=DEF_BY_TYPE.get(type);
            if(!d) return true;
            if(type==="air_conditioner" && airConditionerFalsePositive(title)) return true;
            return d.forbidden.test(title);
          }

          function textFor(p){
            const tax=p.taxonomy||{};
            return [displayName(p),p.brand,tax.canonicalCategory,...(Array.isArray(tax.canonicalPath)?tax.canonicalPath:[]),tax.sourceCategory,tax.sourceSubcategory,clean(p?.links?.destinationUrl)]
              .map(clean).filter(Boolean).join(" ");
          }

          function targetTypeForRelated(title){
            const t=clean(title);
            if(/\b(iphone|galaxy\s+s\d+|samsung\s+galaxy|pixel\s+\d+|smartphone|mobile\s+phone|cell\s+phone|phone)\b/i.test(t)) return "phone";
            if(/\b(thinkpad|ideapad|thinkbook|legion|lenovo\s+loq|macbook|chromebook|ultrabook|laptop|notebook)\b/i.test(t)) return "laptop";
            if(/\b(smart\s*watch|smartwatch|apple\s+watch|galaxy\s+watch)\b/i.test(t)) return "smartwatch";
            if(/\b(headphone|earphone|earbud|headset)\b/i.test(t)) return "headphones";
            if(/\b(perfume|cologne|fragrance)\b/i.test(t)) return "perfume";
            if(/\bdog\s+(?:food|treat|snack)\b|\bpuppy\s+food\b/i.test(t)) return "dog_food";
            if(/\b(power\s*bank|powerbank)\b/i.test(t)) return "power_bank";
            if(/\bair\s+conditioner\b/i.test(t)) return "air_conditioner";
            if(/\b(?:3d\s+)?filament\b|\bpla\b|\bpetg\b/i.test(t)) return "3d_filament";
            if(/\b(cookware|frying\s+pan|saucepan|skillet|casserole)\b/i.test(t)) return "cookware";
            if(/\b(led\s+strip|strip\s+light|light\s+strip|string\s+light|curtain\s+light|tv\s+backlight|backlight|floor\s+lamp|wall\s+light|wall\s+sconce|table\s+lamp|ceiling\s+light|smart\s+light|night\s+light|pathway\s+light|ground\s+light|downlight|light\s+bar|flood\s+light|rope\s+light|led\s+bulb|light\s+panel|light\s+projector|permanent\s+outdoor\s+light)\b/i.test(t)) return "lighting";
            if(/\b(drill\s+bit|screwdriver|wrench|pliers|hammer|socket\s+set|nut\s+driver)\b/i.test(t)) return "tools";
            return "";
          }

          function sellerAwareOverride(p,title,role){
            const seller=clean(p?.seller?.name);
            const dest=clean(p?.links?.destinationUrl);
            if(role!=="unknown") return null;
            if(seller==="Lenovo"){
              // Official Lenovo paths alone are not enough. A real consumer family must be in the display title.
              const family=/\b(thinkpad|ideapad|thinkbook|legion|lenovo\s+loq|yoga)\b/i;
              const bad=/\b(pen|stylus|adapter|dock|charger|case|cover|sleeve|bag|briefcase|keyboard|mouse|monitor|accessor|module|wwan|lte|replacement|spare|&\s*more)\b/i;
