name: Install TrendPilot V15.0.0 Product Discovery Core

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-products-v15:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Record starting revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          git rev-parse HEAD > /tmp/trendpilot-v15-start-sha

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build V15 product discovery core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path

          VERSION="15.0.0"
          ROOT=Path(".")
          FIND=ROOT/"find"/"index.html"
          SITE=ROOT/"js"/"site-v13-5.js"
          JS=ROOT/"js"; CSS=ROOT/"css"; DATA=ROOT/"data"
          if not FIND.exists(): raise SystemExit("find/index.html was not found")
          if not SITE.exists(): raise SystemExit("js/site-v13-5.js was not found")
          JS.mkdir(exist_ok=True); CSS.mkdir(exist_ok=True); DATA.mkdir(exist_ok=True)

          CURATED={
            "a":["air fryer","airpods","android phones","automotive accessories","art supplies","air purifier","action camera","ankle boots"],
            "b":["backpack","bluetooth speaker","baby products","beauty products","blood pressure monitor","bed sheets","bike accessories","building blocks"],
            "c":["camera","car accessories","chargers","computer accessories","cookware","coffee maker","cosmetics","craft supplies"],
            "d":["drill","desk accessories","dresses","digital camera","dinnerware","dog supplies","dash cam","data recovery software"],
            "e":["earbuds","electronics","electric toothbrush","espresso machine","eyewear","exercise equipment","ethernet adapter","electric tools"],
            "f":["fragrance","fitness equipment","fashion accessories","flash drive","floor lamp","food storage","face serum","furniture"],
            "g":["gaming accessories","garden tools","gift sets","glassware","gym equipment","graphics tablet","GPS accessories","guitar accessories"],
            "h":["headphones","home decor","handbags","hair care","hoodies","home appliances","health equipment","HDMI adapter"],
            "i":["iphone cases","iphone accessories","ipad accessories","ink cartridges","indoor lighting","industrial tools","iron","in-ear headphones"],
            "j":["jewelry","jewelry making supplies","jackets","juicer","jigsaw tool","jump starter","joggers","jars and containers"],
            "k":["kitchen tools","keyboard","kids clothing","kettle","kitchen appliances","knives","kids toys","knee support"],
            "l":["laptops","LED lights","luggage","laptop accessories","lipstick","lighting","lawn tools","laser printer"],
            "m":["mobile phones","men's clothing","monitors","makeup","medical equipment","mouse","memory cards","massage devices"],
            "n":["necklaces","network equipment","notebooks","nail care","night lights","Nintendo accessories","NAS storage","neck pillows"],
            "o":["office supplies","outdoor equipment","organizers","oral care","outdoor lighting","office chairs","oven accessories","oil diffusers"],
            "p":["phone cases","phones","power banks","perfume","printers","projectors","pet supplies","PS5 accessories"],
            "q":["quilt","quick charger","quadcopter accessories","quartz watches","quality tools","queen bedding","QR scanner","quilting supplies"],
            "r":["robot vacuum","routers","rings","running shoes","refrigerator accessories","RAM memory","razors","remote controls"],
            "s":["shoes","smart watches","school supplies","smartphones","speakers","skin care","storage","sports equipment"],
            "t":["t-shirts","tablets","tools","toys","TV accessories","travel bags","toothbrush","tripods"],
            "u":["USB cables","USB hubs","underwear","ultrasound equipment","umbrellas","USB chargers","utility tools","UV lamps"],
            "v":["vacuum cleaners","video cameras","VPN","video editing software","vehicle accessories","VR accessories","vanity mirrors","voltage testers"],
            "w":["wireless earbuds","watches","women's clothing","WiFi routers","wallets","workshop tools","webcams","water bottles"],
            "x":["Xbox accessories","Xiaomi phones","XLR cables","Xbox controllers","Xiaomi accessories","Xiaomi smart home","X-Acto tools","xylophone toys"],
            "y":["yoga equipment","youth clothing","yarn","yard tools","yoga mats","yoga wear","yellow gold jewelry","Y cables"],
            "z":["zipper bags","Zigbee smart home","zoom lenses","zip hoodies","zero gravity chairs","Z-wave devices","zip wallets","zippers"]
          }

          APPROVED=["AliExpress","Alibaba","Geekbuying","Lenovo","Diecast","FragranceShop.com","Karaca EU","MFI Medical","PandaHall","Temu"]
          CPC=["AliExpress","Alibaba","Geekbuying"]

          def clean(v): return re.sub(r"\s+"," ",str(v or "")).strip()
          def low(v): return clean(v).lower()
          def load(path):
            try: return json.loads(path.read_text(encoding="utf-8"))
            except Exception: return {}

          seller_aliases={
            "aliexpress":"AliExpress","ali express":"AliExpress","alibaba":"Alibaba","alibaba.com":"Alibaba",
            "geekbuying":"Geekbuying","lenovo":"Lenovo","lenovo many geos":"Lenovo","diecast":"Diecast","diecast.com":"Diecast",
            "fragranceshop.com":"FragranceShop.com","fragrance shop":"FragranceShop.com","the fragrance shop":"FragranceShop.com",
            "karaca":"Karaca EU","karaca eu":"Karaca EU","karaca europe":"Karaca EU","mfi":"MFI Medical","mfi medical":"MFI Medical",
            "mfimedical":"MFI Medical","pandahall":"PandaHall","panda hall":"PandaHall","temu":"Temu","temu.com":"Temu"
          }

          rows=[]
          for path in [DATA/"cj-products.json",DATA/"products.json",DATA/"catalog.json"]:
            if not path.exists(): continue
            payload=load(path)
            data=payload.get("products") if isinstance(payload,dict) else payload
            if isinstance(data,list): rows.extend(data)

          def seller_of(row):
            for key in ("advertiser","seller","merchant","brand","source"):
              value=low(row.get(key))
              if not value: continue
              for alias,canon in seller_aliases.items():
                if value==alias or alias in value: return canon
            return ""

          dynamic=[]; seen=set()
          for row in rows:
            if not isinstance(row,dict): continue
            title=clean(row.get("name") or row.get("title") or row.get("productName"))
            if len(title)<3 or low(title) in seen: continue
            seen.add(low(title))
            seller=seller_of(row)
            if seller and seller not in APPROVED: continue
            image=clean(row.get("image") or row.get("imageUrl") or row.get("imageLink"))
            dynamic.append({"value":title[:120],"kind":"product","seller":seller,"image":image if re.match(r"^https?://",image,re.I) else "","score":55})

          by_letter={}
          for letter,terms in CURATED.items():
            bucket=[{"value":term,"kind":"product-type","score":100-i} for i,term in enumerate(terms)]
            bucket.extend([x for x in dynamic if low(x["value"]).startswith(letter)][:80])
            bucket.extend([{"value":name,"kind":"seller","score":20} for name in APPROVED if low(name).startswith(letter)])
            by_letter[letter]=bucket

          discovery={
            "version":VERSION,
            "approvedProductSellers":APPROVED,
            "cpcSellers":CPC,
            "byLetter":by_letter,
            "dynamicProductCount":len(dynamic),
            "rules":{"maxVisible":8,"buyerIntentFirst":True,"sellerNamesDoNotBeatProductTypes":True}
          }
          (DATA/"product-discovery-v15.json").write_text(json.dumps(discovery,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          (DATA/"approved-product-sellers-v15.json").write_text(json.dumps({"version":VERSION,"approvedProductSellers":APPROVED,"cpcSellers":CPC},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # Patch Temu into the CJ public guard, idempotently.
          site=SITE.read_text(encoding="utf-8")
          def add_id(m):
            body=m.group(1)
            if '"6293473"' not in body:
              body=body.rstrip()
              if body and not body.endswith(","): body+=","
              body+=' "6293473"'
            return 'const TP_CJ_APPROVED_IDS = new Set(['+body+']);'
          def add_names(m):
            body=m.group(1)
            if '"temu"' not in body:
              body=body.rstrip()
              if body and not body.endswith(","): body+=","
              body+=' "shoptemu", "temu", "temucom"'
            return 'const TP_CJ_APPROVED_NAMES = new Set(['+body+']);'
          site=re.sub(r'const TP_CJ_APPROVED_IDS = new Set\(\[([^\]]*)\]\);',add_id,site,count=1)
          site=re.sub(r'const TP_CJ_APPROVED_NAMES = new Set\(\[([^\]]*)\]\);',add_names,site,count=1)
          SITE.write_text(site,encoding="utf-8")

          product_js=r'''(() => {
            "use strict";
            const d=document,clean=v=>String(v??"").replace(/\s+/g," ").trim(),low=v=>clean(v).toLowerCase();
            const esc=v=>clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
            let cache=null,panel=null,input=null,gesture=null,seq=0;
            const rankKind={"product-type":0,"product":1,"seller":2};
            async function data(){return cache||(cache=fetch(`/data/product-discovery-v15.json?v=15.0.0-${Date.now()}`,{cache:"no-store"}).then(r=>r.ok?r.json():{}).catch(()=>({})));}
            function ensure(el){let p=el.closest(".tp-search-input")?.querySelector(":scope > .tp-v15-suggest");if(!p){p=d.createElement("div");p.className="tp-v15-suggest";p.hidden=true;p.innerHTML='<div class="tp-v15-list" role="listbox"></div>';el.closest(".tp-search-input")?.appendChild(p);}return p;}
            function close(){seq++;if(panel)panel.hidden=true;panel=null;input=null;gesture=null;d.documentElement.classList.remove("tp-v15-search-open");}
            function score(r,q){const v=low(r.value);let s=Number(r.score||0);if(v===q)s+=500;if(v.startsWith(q))s+=300;else if(v.split(/\s+/).some(x=>x.startsWith(q)))s+=140;else if(v.includes(q))s+=60;s-=(rankKind[r.kind]??4)*35;return s;}
            async function rows(el){const q=low(el.value);if(!q)return[];const x=await data();let pool=[];if(q.length===1)pool=x.byLetter?.[q]||[];else pool=[...(x.byLetter?.[q[0]]||[]),...Object.values(x.byLetter||{}).flat()];const seen=new Set();return pool.filter(r=>{const v=low(r.value),parts=q.split(/\s+/).filter(Boolean);return v.startsWith(q)||parts.every(p=>v.includes(p));}).sort((a,b)=>score(b,q)-score(a,q)||String(a.value).length-String(b.value).length).filter(r=>{const k=low(r.value);if(seen.has(k))return false;seen.add(k);return true;}).slice(0,8);}
            function icon(r){return r.image&&/^https?:\/\//i.test(r.image)?`<span class="tp-v15-thumb"><img src="${esc(r.image)}" alt="" loading="lazy"></span>`:'<span class="tp-v15-search-icon">⌕</span>';}
            async function render(el){const n=++seq,q=clean(el.value);if(!q){close();return;}const listRows=await rows(el);if(n!==seq)return;input=el;panel=ensure(el);panel._rows=listRows;panel.querySelector(".tp-v15-list").innerHTML=listRows.map((r,i)=>`<button type="button" class="tp-v15-row" data-i="${i}">${icon(r)}<span class="tp-v15-copy"><b>${esc(r.value)}</b><small>${r.kind==="product-type"?"Popular search":r.kind==="seller"?"Seller":esc(r.seller||"Product")}</small></span></button>`).join("");panel.hidden=!listRows.length;d.documentElement.classList.toggle("tp-v15-search-open",!!listRows.length);}
            function choose(r){if(!input||!r)return;input.value=r.value;input.dispatchEvent(new Event("input",{bubbles:true}));const f=input.form;close();f?.requestSubmit?.();}
            d.addEventListener("input",e=>{if(e.target.matches("[data-tp-finder-input]"))render(e.target);});
            d.addEventListener("focusin",e=>{if(e.target.matches("[data-tp-finder-input]")&&clean(e.target.value))render(e.target);});
            d.addEventListener("pointerdown",e=>{const row=e.target.closest(".tp-v15-row");if(row&&panel&&input){gesture={row,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};return;}if(panel&&!e.target.closest(".tp-v15-suggest")&&e.target!==input)close();},{passive:true});
            d.addEventListener("pointermove",e=>{if(!gesture||gesture.id!==e.pointerId)return;if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>8)gesture.moved=true;},{passive:true});
            d.addEventListener("pointerup",e=>{if(!gesture||gesture.id!==e.pointerId)return;const g=gesture;gesture=null;if(g.moved)return;const row=e.target.closest(".tp-v15-row");if(!row||row!==g.row||!panel)return;choose((panel._rows||[])[Number(row.dataset.i)]);});
            d.addEventListener("pointercancel",()=>gesture=null);
            d.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
          })();'''
          (JS/"product-discovery-v15.js").write_text(product_js+"\n",encoding="utf-8")

          sellers_js=r'''(() => {
            "use strict";
            const d=document,clean=v=>String(v??"").replace(/\s+/g," ").trim(),low=v=>clean(v).toLowerCase();
            let allowed=[];
            const aliases={"aliexpress":["aliexpress","ali express"],"alibaba":["alibaba","alibaba.com"],"geekbuying":["geekbuying"],"lenovo":["lenovo","lenovo many geos"],"diecast":["diecast","diecast.com"],"fragranceshop.com":["fragranceshop.com","fragrance shop","the fragrance shop"],"karaca eu":["karaca eu","karaca europe","karaca"],"mfi medical":["mfi medical","mfimedical","mfi"],"pandahall":["pandahall","panda hall"],"temu":["temu","temu.com","shop temu"]};
            function canon(v){const l=low(v);for(const name of allowed){const n=low(name);if((aliases[n]||[n]).some(a=>l===a||l.includes(a)))return name;}return"";}
            function fix(){const s=d.querySelector("[data-filter-merchant]");if(!(s instanceof HTMLSelectElement)||!allowed.length)return;const prev=canon(s.options[s.selectedIndex]?.textContent||s.value),values=new Map();[...s.options].forEach(o=>{const c=canon(o.textContent||o.value);if(c&&!values.has(c))values.set(c,o.value);});s.innerHTML="";s.add(new Option("All sellers",""));allowed.forEach(name=>s.add(new Option(name,values.get(name)||name)));if(prev){const o=[...s.options].find(x=>canon(x.textContent)===prev);if(o)s.value=o.value;}s.dataset.tpSellerPolicy="15.0.0";}
            async function init(){try{const r=await fetch(`/data/approved-product-sellers-v15.json?v=15.0.0-${Date.now()}`,{cache:"no-store"});const j=r.ok?await r.json():{};allowed=Array.isArray(j.approvedProductSellers)?j.approvedProductSellers:[];}catch{}if(!allowed.length)allowed=["AliExpress","Alibaba","Geekbuying","Lenovo","Diecast","FragranceShop.com","Karaca EU","MFI Medical","PandaHall","Temu"];fix();new MutationObserver(()=>requestAnimationFrame(fix)).observe(d.documentElement,{childList:true,subtree:true});setTimeout(fix,300);setTimeout(fix,900);}
            if(d.readyState==="loading")d.addEventListener("DOMContentLoaded",init,{once:true});else init();
          })();'''
          (JS/"product-sellers-v15.js").write_text(sellers_js+"\n",encoding="utf-8")

          cpc_js=r'''(() => {
            "use strict";
            const d=document,CPC=new Set(["aliexpress","alibaba","geekbuying"]),low=v=>String(v??"").trim().toLowerCase();
            function tag(){d.querySelectorAll("[data-tp-outbound]").forEach(a=>{const m=low(a.dataset.merchant||"");if(!CPC.has(m)||a.dataset.tpCpcBound)return;a.dataset.tpCpcBound="1";a.dataset.tpMonetization="cpc-eligible";a.addEventListener("click",()=>{try{const k="tp_v15_cpc_clicks",rows=JSON.parse(localStorage.getItem(k)||"[]");rows.push({merchant:m,query:new URLSearchParams(location.search).get("q")||"",at:Date.now()});localStorage.setItem(k,JSON.stringify(rows.slice(-250)));}catch{}},{once:true});});}
            new MutationObserver(tag).observe(d.documentElement,{childList:true,subtree:true});if(d.readyState==="loading")d.addEventListener("DOMContentLoaded",tag,{once:true});else tag();
          })();'''
          (JS/"product-cpc-v15.js").write_text(cpc_js+"\n",encoding="utf-8")

          css=r'''
          .tp-v15-search-host{position:relative!important}
          .tp-v15-suggest{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:1200;background:#fff;border:1px solid #d8dee3;border-radius:0 0 16px 16px;box-shadow:0 18px 34px rgba(17,29,39,.16);overflow:hidden}
          .tp-v15-list{max-height:min(440px,52vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:#fff}
          .tp-v15-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-bottom:1px solid #edf0f2;background:#fff;color:#101820;padding:10px 13px;min-height:58px;font:inherit}
          .tp-v15-row:last-child{border-bottom:0}.tp-v15-row:active{background:#f5f7f8}
          .tp-v15-search-icon{flex:0 0 32px;width:32px;height:32px;display:grid;place-items:center;font-size:22px;color:#26343c}
          .tp-v15-thumb{flex:0 0 42px;width:42px;height:42px;border-radius:6px;overflow:hidden;background:#f1f3f4;display:grid;place-items:center}.tp-v15-thumb img{width:100%;height:100%;object-fit:contain}
          .tp-v15-copy{display:block;min-width:0;flex:1}.tp-v15-copy b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem;line-height:1.25;font-weight:800}.tp-v15-copy small{display:block;margin-top:3px;color:#717b82;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .tp-smart-suggestions,.tp-amazon-suggest{display:none!important}
          @media(max-width:680px){.tp-v15-list{max-height:min(390px,48vh)}.tp-v15-row{min-height:56px;padding:9px 12px}html.tp-v15-search-open .tp-bottom-nav{opacity:.22;pointer-events:none}}
          '''
          (CSS/"product-discovery-v15.css").write_text("\n".join(x.rstrip() for x in css.strip().splitlines())+"\n",encoding="utf-8")

          page=FIND.read_text(encoding="utf-8")
          for pattern in [
            r'\s*<script[^>]+src="/js/smart-search-v14\.js[^"]*"[^>]*></script>\s*',
            r'\s*<script[^>]+src="/js/smart-suggestions-v14\.js[^"]*"[^>]*></script>\s*',
            r'\s*<script[^>]+src="/js/seller-whitelist-v14-1-4\.js[^"]*"[^>]*></script>\s*',
            r'\s*<script[^>]+src="/js/product-discovery-v15\.js[^"]*"[^>]*></script>\s*',
            r'\s*<script[^>]+src="/js/product-sellers-v15\.js[^"]*"[^>]*></script>\s*',
            r'\s*<script[^>]+src="/js/product-cpc-v15\.js[^"]*"[^>]*></script>\s*',
            r'\s*<link[^>]+href="/css/product-discovery-v15\.css[^"]*"[^>]*>\s*'
          ]:
            page=re.sub(pattern,"\n",page)

          page=page.replace("</head>",'<link rel="stylesheet" href="/css/product-discovery-v15.css?v=15.0.0">\n</head>',1)
          page=page.replace("</body>",'<script defer src="/js/product-discovery-v15.js?v=15.0.0"></script>\n<script defer src="/js/product-sellers-v15.js?v=15.0.0"></script>\n<script defer src="/js/product-cpc-v15.js?v=15.0.0"></script>\n</body>',1)
          page=page.replace('placeholder="Search T-shirts, school supplies, laptops or a model"','placeholder="Search phones, perfume, tools, laptops..."')
          FIND.write_text(page,encoding="utf-8")

          report={"version":VERSION,"scope":"products-only","approvedProductSellers":APPROVED,"cpcSellers":CPC,"dynamicProductSuggestions":len(dynamic),"ticketsChanged":False,"wholesaleChanged":False}
          (DATA/"product-discovery-v15-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          for path in [FIND,SITE,JS/"product-discovery-v15.js",JS/"product-sellers-v15.js",JS/"product-cpc-v15.js",CSS/"product-discovery-v15.css",DATA/"product-discovery-v15.json",DATA/"approved-product-sellers-v15.json",DATA/"product-discovery-v15-report.json"]:
            text=path.read_text(encoding="utf-8")
            path.write_text("\n".join(line.rstrip() for line in text.splitlines())+"\n",encoding="utf-8")
          PY

      - name: Validate V15 product discovery
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site-v13-5.js
          node --check js/product-discovery-v15.js
          node --check js/product-sellers-v15.js
          node --check js/product-cpc-v15.js
          git diff --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          def require(c,m):
            if not c: raise SystemExit("Validation failed: "+m)
          page=Path("find/index.html").read_text(encoding="utf-8")
          site=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          data=json.loads(Path("data/product-discovery-v15.json").read_text(encoding="utf-8"))
          sellers=json.loads(Path("data/approved-product-sellers-v15.json").read_text(encoding="utf-8"))
          require('/js/smart-search-v14.js' not in page,"old smart-search is still loaded")
          require('/js/smart-suggestions-v14.js' not in page,"old smart-suggestions is still loaded")
          require('/js/seller-whitelist-v14-1-4.js' not in page,"old seller whitelist is still loaded")
          require(page.count('/js/product-discovery-v15.js')==1,"V15 autocomplete missing/duplicated")
          require(page.count('/js/product-sellers-v15.js')==1,"V15 seller controller missing/duplicated")
          require(page.count('/js/product-cpc-v15.js')==1,"V15 CPC layer missing/duplicated")
          expected=["phone cases","phones","power banks","perfume","printers","projectors","pet supplies","ps5 accessories"]
          actual=[x["value"].lower() for x in data["byLetter"]["p"][:8]]
          require(actual==expected,"P suggestions wrong: "+repr(actual))
          for letter in "abcdefghijklmnopqrstuvwxyz": require(len(data["byLetter"].get(letter,[]))>=4,f"{letter} coverage too thin")
          exact=["AliExpress","Alibaba","Geekbuying","Lenovo","Diecast","FragranceShop.com","Karaca EU","MFI Medical","PandaHall","Temu"]
          require(sellers["approvedProductSellers"]==exact,"seller list incorrect")
          require("Joom" not in exact,"Joom should remain excluded")
          require('"6293473"' in site and '"temu"' in site,"Temu CJ guard missing")
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          require("tickets/index.html" not in changed,"Tickets changed unexpectedly")
          require("wholesale/index.html" not in changed,"Wholesale changed unexpectedly")
          print("V15 validation passed")
          PY

      - name: Publish V15 safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start_sha="$(cat /tmp/trendpilot-v15-start-sha)"
          git fetch origin main
          current_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" != "$start_sha" ]]; then
            echo "main changed during this run; stopping safely."
            exit 1
          fi
          git add -- \
            find/index.html \
            js/site-v13-5.js \
            js/product-discovery-v15.js \
            js/product-sellers-v15.js \
            js/product-cpc-v15.js \
            css/product-discovery-v15.css \
            data/product-discovery-v15.json \
            data/approved-product-sellers-v15.json \
            data/product-discovery-v15-report.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "V15 is already installed."
            exit 0
          fi
          git commit -m "feat: install Product Discovery V15 core"
          git push origin HEAD:main

      - name: Add summary
        if: always()
        shell: bash
        run: |
          {
