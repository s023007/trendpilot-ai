name: Ticket Funnel Audit — Read Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ticket-email-funnel-readonly.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: google-ads-paused-create
    timeout-minutes: 10
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: '21098'
      CPANEL_USER: kehwgbpo
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
      TP_SAVE_LOG: /tmp/tp-save-search.jsonl
      TP_EMAIL_CLICK_LOG: /tmp/tp-email-clicks.jsonl
      TP_OUTBOUND_LOG: /tmp/tp-seller-outbound.jsonl
    steps:
      - name: Configure read-only SSH access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Pull private funnel logs without printing customer data
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap "test -f /home/kehwgbpo/trendpilot-private/save-search.jsonl && cat /home/kehwgbpo/trendpilot-private/save-search.jsonl || true" > "$TP_SAVE_LOG"
          ssh trendpilot-namecheap "test -f /home/kehwgbpo/trendpilot-private/email-clicks.jsonl && cat /home/kehwgbpo/trendpilot-private/email-clicks.jsonl || true" > "$TP_EMAIL_CLICK_LOG"
          ssh trendpilot-namecheap "test -f /home/kehwgbpo/trendpilot-private/seller-outbound.jsonl && cat /home/kehwgbpo/trendpilot-private/seller-outbound.jsonl || true" > "$TP_OUTBOUND_LOG"
          echo 'Private logs copied. Raw contents intentionally suppressed.'

      - name: Report aggregate paid-ticket funnel only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          TZ=ZoneInfo('Asia/Muscat'); now=datetime.now(TZ); today=now.date(); since7=today-timedelta(days=6)
          campaigns={
            'manchester_derby_2026','liverpool_manunited_2026','el_clasico_2026',
            'madrid_derby_2026','north_london_derby_2026','arsenal_mancity_2026'
          }
          def parse_dt(v):
            if not v:return None
            try:d=datetime.fromisoformat(str(v).strip().replace('Z','+00:00'))
            except Exception:return None
            if d.tzinfo is None:d=d.replace(tzinfo=timezone.utc)
            return d.astimezone(TZ)
          def rows(path):
            out=[]
            if not os.path.exists(path):return out
            for line in open(path,'r',encoding='utf-8',errors='replace'):
              try:x=json.loads(line)
              except Exception:continue
              camp=str(x.get('campaign_id') or '')
              if camp not in campaigns:continue
              d=parse_dt(x.get('created_at') or x.get('clicked_at') or x.get('timestamp'))
              if not d:continue
              x['_campaign']=camp;x['_dt']=d;out.append(x)
            return out
          def has_gclid(x):return bool(str(x.get('gclid') or '').strip())
          def today_rows(xs):return [x for x in xs if x['_dt'].date()==today]
          def last7(xs):return [x for x in xs if since7<=x['_dt'].date()<=today]

          saves=rows(os.environ['TP_SAVE_LOG'])
          email_clicks=rows(os.environ['TP_EMAIL_CLICK_LOG'])
          outbound=rows(os.environ['TP_OUTBOUND_LOG'])
          ts,te,to=map(today_rows,(saves,email_clicks,outbound))
          s7,e7,o7=map(last7,(saves,email_clicks,outbound))

          print('TICKET_FUNNEL_READ_ONLY')
          print('AS_OF_MUSCAT=',now.isoformat(timespec='seconds'))
          print('TODAY_EMAILS_SENT=',len(ts),'| WITH_GCLID=',sum(map(has_gclid,ts)))
          print('TODAY_EMAIL_LINK_CLICKS=',len(te),'| WITH_GCLID=',sum(map(has_gclid,te)))
          print('TODAY_DIRECT_SELLER_OUTBOUND=',len(to),'| WITH_GCLID=',sum(map(has_gclid,to)))
          print('TODAY_TOTAL_SELLER_CLICKS=',len(te)+len(to))
          print('LAST7_EMAILS_SENT=',len(s7),'| WITH_GCLID=',sum(map(has_gclid,s7)))
          print('LAST7_EMAIL_LINK_CLICKS=',len(e7),'| WITH_GCLID=',sum(map(has_gclid,e7)))
          print('LAST7_DIRECT_SELLER_OUTBOUND=',len(o7),'| WITH_GCLID=',sum(map(has_gclid,o7)))
          print('LAST7_TOTAL_SELLER_CLICKS=',len(e7)+len(o7))
          for camp in sorted(campaigns):
            a=[x for x in ts if x['_campaign']==camp]
            b=[x for x in te if x['_campaign']==camp]
            c=[x for x in to if x['_campaign']==camp]
            print('TODAY_CAMPAIGN=',camp,'| emails=',len(a),'| email_clicks=',len(b),'| direct_outbound=',len(c),'| total_seller_clicks=',len(b)+len(c))
          print('PRIVACY=PASS | no email, hash, lead id, seller URL, or gclid value printed')
          PY
