name: TrendPilot V20.3.3 — V20 Autocomplete Purity

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-3-3-autocomplete-purity
  cancel-in-progress: false

jobs:
  autocomplete-purity:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify V20.3.2 visitor search and 13-seller foundation
        shell: bash
        run: |
          set -euo pipefail
          test -s data/search-v20/manifest.json
          test -s data/catalog-v19/catalog-set-v1.json
          test -s js/site-v13-5.js
          test -s find/index.html
          grep -q 'TP_V20_3_CONTROLLED_START' js/site-v13-5.js
          grep -q 'TP_V20_3_SELLER_STABLE' js/site-v13-5.js
          grep -q '/api/products-v20-shadow' js/site-v13-5.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/search-v20/manifest.json').read_text())
          c=json.loads(Path('data/catalog-v19/catalog-set-v1.json').read_text())
          sellers=[x['name'] if isinstance(x,dict) else x for x in m.get('publicSellers',[])]
          catalog=[x['name'] for x in c.get('sellers',[])]
          blocked={'Temu','Joom','FilamentPRO EU CPS','FilamentPRO'}
          assert str(m.get('version','')).startswith('20.2.'), m.get('version')
          assert len(sellers)==13, sellers
          assert len(catalog)==13, catalog
          assert set(sellers)==set(catalog), (sellers,catalog)
          assert not (blocked & set(sellers)), blocked & set(sellers)
          print('V20.3.2 + canonical foundation PASS')
          PY

      - name: Install V20.3.3 autocomplete backend in shadow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/search-v20 netlify/functions js data/search-v20
          cat > scripts/search-v20/build-autocomplete-v20.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';

          const ROOT = process.cwd();
          const SEARCH = path.join(ROOT,'data','search-v20');
          const VERSION = '20.3.3';
          const manifest = JSON.parse(fs.readFileSync(path.join(SEARCH,'manifest.json'),'utf8'));
          const blocked = new Set(['temu','joom','filamentpro','filamentpro eu cps']);
          const norm = v => String(v ?? '').normalize('NFKC').toLowerCase().replace(/[’'`]/g,'').replace(/[^\p{L}\p{N}+#.-]+/gu,' ').replace(/\s+/g,' ').trim();
          const clean = v => String(v ?? '').replace(/\s+/g,' ').trim();
          const validHttp = v => /^https?:\/\//i.test(clean(v));


          const INTENT_LABELS={
            phone:['phone','smartphone'], laptop:['laptop'], smartwatch:['smartwatch','smart watch'],
            headphones:['headphones','earbuds'], perfume:['perfume','fragrance'], dog_food:['dog food'],
            power_bank:['power bank'], air_conditioner:['air conditioner'], '3d_filament':['3d filament'],
            cookware:['cookware'], lighting:['lighting'], tools:['tools']
          };

          const modelPatterns = {
            phone: [
              /\biphone\s+(?:se(?:\s*\d{4})?|\d{1,2})(?:\s+(?:pro\s+max|pro|max|plus|mini|air)){0,2}\b/ig,
              /\b(?:samsung\s+)?galaxy\s+(?:s\d{2}(?:\s*(?:ultra|plus|\+|fe))?|a\d{2,3}|m\d{2,3}|z\s*(?:fold|flip)\s*\d+|note\s*\d+)\b/ig,
              /\bgoogle\s+pixel\s+\d+(?:\s*(?:pro|pro xl|a|fold))?\b/ig,
              /\b(?:xiaomi|redmi|poco|oneplus|oppo|vivo|realme|nothing)\s+[a-z0-9][a-z0-9 +.-]{0,24}\b/ig
            ],
            laptop: [
              /\bthinkpad\s+[a-z]\d{1,3}[a-z]?(?:\s+gen\s+\d+)?\b/ig,
              /\b(?:lenovo\s+)?(?:ideapad|yoga|legion)\s+[a-z0-9][a-z0-9 +.-]{0,20}\b/ig,
              /\bmacbook\s+(?:air|pro)(?:\s+\d{2})?(?:\s+m\d(?:\s+(?:pro|max))?)?\b/ig,
              /\b(?:dell\s+)?(?:xps|latitude|inspiron)\s+\d{3,4}[a-z0-9-]*\b/ig,
              /\b(?:hp\s+)?(?:elitebook|probook|pavilion|envy)\s+[a-z0-9][a-z0-9 +.-]{0,20}\b/ig,
              /\b(?:asus\s+)?(?:zenbook|vivobook|rog|tuf)\s+[a-z0-9][a-z0-9 +.-]{0,20}\b/ig,
              /\b(?:acer\s+)?(?:aspire|swift|predator)\s+[a-z0-9][a-z0-9 +.-]{0,20}\b/ig
            ],
            smartwatch: [
              /\bapple\s+watch\s+(?:series\s+\d+|ultra(?:\s+\d+)?|se(?:\s+\d+)?)\b/ig,
              /\bgalaxy\s+watch\s+\d+(?:\s*(?:classic|pro|ultra))?\b/ig,
              /\b(?:garmin|amazfit|huawei)\s+[a-z0-9][a-z0-9 +.-]{0,24}\b/ig
            ]
          };

          function modelLabels(type,title){
            const out=[];
            for(const re0 of modelPatterns[type] || []){
              const re = new RegExp(re0.source,re0.flags);
              for(const m of title.matchAll(re)){
                let label=clean(m[0]).replace(/[,:;|/\\]+$/,'').trim();
                if(label.length>=4 && label.length<=64) out.push(label);
              }
            }
            return [...new Set(out.map(x=>x.replace(/\s+/g,' ')))];
          }

          const main=[];
          const related=[];
          const models=new Map();
          let blockedLeaks=0;
          for(const type of Object.keys(manifest.typeCounts || {}).sort()){
            const file=path.join(SEARCH,'types',`${type}.json`);
            if(!fs.existsSync(file)) continue;
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            for(const channel of ['main','related']){
              for(const row of data[channel] || []){
                const seller=clean(row.seller);
                if(blocked.has(norm(seller))){ blockedLeaks++; continue; }
                const title=clean(row.title);
                if(!title) continue;
                const compact={
                  value:title,
                  seller,
                  type:clean(row.type || type),
                  image:validHttp(row.image)?clean(row.image):'',
                  quality:Number(row.quality || 0)
                };
                (channel==='main'?main:related).push(compact);
                if(channel==='main'){
                  for(const label of modelLabels(type,title)){
                    const key=`${type}|${norm(label)}`;
                    const hit=models.get(key) || {value:label,type,sellers:new Set(),image:'',quality:0};
                    hit.sellers.add(seller);
                    if(!hit.image && compact.image) hit.image=compact.image;
                    hit.quality=Math.max(hit.quality,compact.quality);
                    if(label.length<hit.value.length) hit.value=label;
                    models.set(key,hit);
                  }
                }
              }
            }
          }

          const modelRows=[...models.values()].map(x=>({
            value:x.value,
            type:x.type,
            sellerCount:x.sellers.size,
            sellers:[...x.sellers].sort(),
            image:x.image,
            quality:x.quality
          })).sort((a,b)=>b.sellerCount-a.sellerCount || b.quality-a.quality || a.value.localeCompare(b.value));

          const intents=[];
          for(const [type,labels] of Object.entries(INTENT_LABELS)){
            if(!manifest.typeCounts?.[type])continue;
            for(const value of labels)intents.push({value,type});
          }

          const output={
            version:VERSION,
            sourceVersion:manifest.version,
            generatedAt:new Date().toISOString(),
            publicSellers:(manifest.publicSellers||[]).map(x=>typeof x==='string'?x:x.name).filter(Boolean),
            blockedSellerLeaks:blockedLeaks,
            counts:{intents:intents.length,models:modelRows.length,main:main.length,related:related.length},
            intents,
            models:modelRows,
            main,
            related
          };
          fs.writeFileSync(path.join(SEARCH,'autocomplete-v1.json'),JSON.stringify(output));
          console.log(JSON.stringify(output.counts));
          if(blockedLeaks!==0) throw new Error(`Blocked seller leak while building autocomplete: ${blockedLeaks}`);
          if(main.length<1000) throw new Error(`Unexpectedly small main autocomplete corpus: ${main.length}`);
          JS

          cat > netlify/functions/products-v20-suggest.mjs <<'JS'
          const VERSION='20.3.3';
          let cache={at:0,value:null};
          const TTL=10*60*1000;
          const clean=v=>String(v??'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
          const norm=v=>clean(v).normalize('NFKC').toLowerCase().replace(/[’'`]/g,'').replace(/[^\p{L}\p{N}+#.-]+/gu,' ').replace(/\s+/g,' ').trim();
          const blocked=new Set(['temu','joom','filamentpro','filamentpro eu cps']);
          const ACCESSORY_RE=/\b(?:case|cases|cover|covers|charger|chargers|charging|cable|cables|screen protector|protector|protectors|mount|holder|stand|strap|adapter|dock|replacement|replacement part|battery replacement|accessor(?:y|ies))\b/i;
          const DIRTY_MAIN_RE=/\b(?:case|cases|cover|covers|charger|chargers|charging cable|screen protector|protector|mount|holder|strap|replacement part|accessor(?:y|ies))\b/i;
          function json(body,status=200){return new Response(JSON.stringify(body),{status,headers:{'content-type':'application/json; charset=utf-8','cache-control':'public, max-age=0, s-maxage=60, stale-while-revalidate=300','x-content-type-options':'nosniff'}})}
          async function fetchJson(url,timeoutMs=12000){const c=new AbortController();const t=setTimeout(()=>c.abort(),timeoutMs);try{const r=await fetch(url,{headers:{accept:'application/json'},signal:c.signal});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.json()}finally{clearTimeout(t)}}
          function words(q){return norm(q).split(/\s+/).filter(Boolean)}
          function escapeRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
          function matchScore(value,q,quality=0,kind='product',sellerCount=0){
            const v=norm(value),n=norm(q),parts=words(q);
            if(!v||!n||!parts.every(p=>v.includes(p))) return -1;
            let s=Number(quality||0);
            if(v===n)s+=7000;
            if(v.startsWith(n))s+=5000;
            else if(new RegExp(`(?:^|\\s)${escapeRe(n)}`).test(v))s+=3200;
            else s+=1800;
            if(kind==='intent')s+=4000;
            if(kind==='model')s+=4500+Math.min(1200,Number(sellerCount||0)*180);
            if(kind==='related')s+=900;
            s-=Math.min(600,v.length*2);
            return s;
          }
          function publicRow(row,kind){return {value:clean(row.value),meta:kind==='intent'?`${clean(row.type)} category`:kind==='model'?`${clean(row.type)} model${row.sellerCount?` • ${row.sellerCount} seller${row.sellerCount===1?'':'s'}`:''}`:kind==='related'?`${clean(row.seller)} • related item`:clean(row.seller)||clean(row.type)||'Product',image:clean(row.image),seller:clean(row.seller),type:clean(row.type),kind};}
          function topRows(data,q,seller,limit){
            const n=norm(q),sellerNorm=norm(seller),accessoryIntent=ACCESSORY_RE.test(n);
            const pool=[];
            if(!accessoryIntent){
              for(const r of data.intents||[]){
                const score=matchScore(r.value,q,0,'intent',0);
                if(score>=0)pool.push({...publicRow(r,'intent'),_score:score});
              }
              for(const r of data.models||[]){
                if(sellerNorm && !(r.sellers||[]).some(x=>norm(x)===sellerNorm))continue;
                const score=matchScore(r.value,q,r.quality,'model',r.sellerCount);
                if(score>=0)pool.push({...publicRow(r,'model'),_score:score});
              }
              for(const r of data.main||[]){
                if(sellerNorm&&norm(r.seller)!==sellerNorm)continue;
                if(blocked.has(norm(r.seller)))continue;
                if(DIRTY_MAIN_RE.test(norm(r.value)))continue;
                const score=matchScore(r.value,q,r.quality,'product',1);
                if(score>=0)pool.push({...publicRow(r,'product'),_score:score});
              }
            }else{
              for(const r of data.related||[]){
                if(sellerNorm&&norm(r.seller)!==sellerNorm)continue;
                if(blocked.has(norm(r.seller)))continue;
                const score=matchScore(r.value,q,r.quality,'related',1);
                if(score>=0)pool.push({...publicRow(r,'related'),_score:score});
              }
            }
            pool.sort((a,b)=>b._score-a._score || a.value.length-b.value.length || a.value.localeCompare(b.value));
            const out=[],seen=new Set();
            for(const r of pool){
              const key=norm(r.value);
              if(!key||seen.has(key))continue;
              seen.add(key);
              const {_score,...safe}=r;out.push(safe);
              if(out.length>=limit)break;
            }
            return {accessoryIntent,rows:out};
          }
          export default async function handler(request){
            try{
              const u=new URL(request.url),origin=u.origin,q=clean(u.searchParams.get('q')||'').slice(0,120),seller=clean(u.searchParams.get('seller')||'').slice(0,140),limit=Math.max(1,Math.min(Number(u.searchParams.get('limit')||8),12));
              if(q.length<2)return json({ok:true,version:VERSION,query:q,rows:[]});
              const now=Date.now();
              if(!cache.value||now-cache.at>TTL){cache={at:now,value:await fetchJson(`${origin}/data/search-v20/autocomplete-v1.json?v=${VERSION}`)}}
              const data=cache.value;
              if(data?.version!==VERSION)return json({ok:false,version:VERSION,status:'autocomplete-index-not-deployed',indexVersion:data?.version||''},503);
              const result=topRows(data,q,seller,limit);
              return json({ok:true,version:VERSION,sourceVersion:data.sourceVersion,query:q,seller:seller||null,accessoryIntent:result.accessoryIntent,totalReturned:result.rows.length,rows:result.rows});
            }catch(error){return json({ok:false,version:VERSION,error:String(error?.message||error).slice(0,800)},500)}
          }
          export { topRows };
          export const config={path:'/api/products-v20-suggest',method:'GET'};
          JS

          cat > js/smart-suggestions-v20.js <<'JS'
          (() => {
            'use strict';
            const d=document;
            const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
            const esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
            const selector='input[data-tp-finder-input]';
            let panel=null,input=null,seq=0,gesture=null,timer=null,controller=null;
            function host(el){const h=el.closest('.tp-search-input')||el.parentElement;h?.classList.add('tp-amazon-search-host');return h;}
            function ensure(el){const h=host(el);let p=h?.querySelector(':scope > .tp-amazon-suggest[data-v20-suggest]');if(!p){p=d.createElement('div');p.className='tp-amazon-suggest';p.dataset.v20Suggest='';p.hidden=true;p.innerHTML='<div class="tp-amazon-list" role="listbox"></div>';h?.appendChild(p);}return p;}
            function close(){seq++;if(controller)controller.abort();controller=null;if(panel)panel.hidden=true;panel=null;input=null;gesture=null;}
            function currentSeller(){return clean(d.querySelector('[data-filter-merchant]')?.value||'');}
            async function load(q){
              if(controller)controller.abort();controller=new AbortController();
              const p=new URLSearchParams({q,limit:'8'});const seller=currentSeller();if(seller)p.set('seller',seller);
              const r=await fetch(`/api/products-v20-suggest?${p}`,{cache:'no-store',signal:controller.signal,headers:{accept:'application/json'}});
              if(!r.ok)return[];const j=await r.json();return j?.ok&&Array.isArray(j.rows)?j.rows:[];
            }
            function icon(row){return row.image&&/^https?:\/\//i.test(row.image)?`<span class="tp-amazon-thumb"><img src="${esc(row.image)}" alt="" loading="lazy"></span>`:'<span class="tp-amazon-search-icon" aria-hidden="true">⌕</span>';}
            async function render(el){const token=++seq,q=clean(el.value);if(q.length<2){close();return;}let rows=[];try{rows=await load(q);}catch(e){if(e?.name!=='AbortError')console.warn('TrendPilot V20 autocomplete unavailable',e);return;}if(token!==seq)return;input=el;panel=ensure(el);panel._rows=rows;const list=panel.querySelector('.tp-amazon-list');list.innerHTML=rows.map((row,i)=>`<button type="button" class="tp-amazon-row" role="option" data-i="${i}">${icon(row)}<span class="tp-amazon-copy"><b>${esc(row.value)}</b>${row.meta?`<small>${esc(row.meta)}</small>`:''}</span></button>`).join('');panel.hidden=!rows.length;}
            function schedule(el){clearTimeout(timer);timer=setTimeout(()=>render(el),170);}
            function choose(row){if(!input||!row)return;input.value=row.value;input.dispatchEvent(new Event('input',{bubbles:true}));const form=input.form;close();form?.requestSubmit?.();}
            d.addEventListener('input',e=>{if(e.target.matches(selector))schedule(e.target);});
            d.addEventListener('focusin',e=>{if(e.target.matches(selector)&&clean(e.target.value).length>=2)schedule(e.target);});
            d.addEventListener('pointerdown',e=>{const row=e.target.closest('.tp-amazon-row');if(row&&panel&&input){gesture={row,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};return;}if(panel&&!e.target.closest('.tp-amazon-suggest')&&e.target!==input)close();},{passive:true});
            d.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>8)gesture.moved=true;},{passive:true});
            d.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const g=gesture;gesture=null;if(g.moved)return;const row=e.target.closest('.tp-amazon-row');if(!row||row!==g.row||!panel)return;choose((panel._rows||[])[Number(row.dataset.i)]);});
            d.addEventListener('pointercancel',()=>gesture=null);
            d.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
          })();
          JS

          cat > js/seller-whitelist-v20.js <<'JS'
          (() => {
            'use strict';
            const d=document,clean=v=>String(v??'').replace(/\s+/g,' ').trim(),low=v=>clean(v).toLowerCase();
            const BLOCKED=new Set(['temu','joom','filamentpro','filamentpro eu cps']);
            const FALLBACK=['Geekbuying','AliExpress','Alibaba','PandaHall','Karaca EU','FragranceShop.com','Govee Many GEOs','Harfington Many GEOs','Sunsky-online WW','Diecast','MFI Medical','Lenovo','TikTok Shop US'];
            let allowed=[];
            function canonical(v){const n=low(v);return allowed.find(x=>low(x)===n)||'';}
            function apply(){const s=d.querySelector('[data-filter-merchant]');if(!s||!allowed.length)return;const selected=canonical(s.value)||canonical(s.options[s.selectedIndex]?.textContent||'');const current=[...s.options].map(o=>clean(o.textContent));const desired=['All sellers',...allowed];if(current.join('|')!==desired.join('|')){s.innerHTML='';s.add(new Option('All sellers',''));for(const name of allowed)s.add(new Option(name,name));}if(selected&&allowed.includes(selected))s.value=selected;else if(selected)s.value='';s.dataset.tpApprovedSellers='20.3.3';}
            async function init(){try{const r=await fetch('/data/search-v20/manifest.json?v=20.3.3',{cache:'no-store'});const j=r.ok?await r.json():{};allowed=(j.publicSellers||[]).map(x=>typeof x==='string'?x:x?.name).map(clean).filter(x=>x&&!BLOCKED.has(low(x)));}catch{allowed=[];}if(allowed.length!==13)allowed=[...FALLBACK];apply();new MutationObserver(()=>requestAnimationFrame(apply)).observe(d.body||d.documentElement,{childList:true,subtree:true});setTimeout(apply,400);setTimeout(apply,1200);}
            if(d.readyState==='loading')d.addEventListener('DOMContentLoaded',init,{once:true});else init();
          })();
          JS

          cat > scripts/search-v20/test-autocomplete-v20-3-3.mjs <<'JS'
          import fs from 'node:fs';
          import { topRows } from '../../netlify/functions/products-v20-suggest.mjs';
          const data=JSON.parse(fs.readFileSync('data/search-v20/autocomplete-v1.json','utf8'));
          const blocked=new Set(['temu','joom','filamentpro','filamentpro eu cps']);
          const norm=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const dirty=/\b(?:case|cases|cover|covers|charger|chargers|charging cable|screen protector|protector|accessor(?:y|ies)|replacement part)\b/i;
          function check(q,{requireIphone=false,allowRelated=false}={}){
            const r=topRows(data,q,'',8);
            console.log(q,JSON.stringify({accessoryIntent:r.accessoryIntent,rows:r.rows.map(x=>({value:x.value,seller:x.seller,kind:x.kind}))},null,2));
            if(!allowRelated && !r.rows.length) throw new Error(`${q}: no suggestions`);
            for(const row of r.rows){
              if(blocked.has(norm(row.seller))) throw new Error(`${q}: blocked seller ${row.seller}`);
              if(!r.accessoryIntent && dirty.test(row.value)) throw new Error(`${q}: accessory leaked into main autocomplete: ${row.value}`);
            }
            if(requireIphone && !r.rows.some(x=>/iphone/i.test(x.value))) throw new Error(`${q}: iPhone main/model suggestion missing`);
          }
          check('iph',{requireIphone:true});
          check('iphone',{requireIphone:true});
          check('lap');
          check('iphone case',{allowRelated:true});
          if(data.publicSellers.length!==13)throw new Error(`Expected 13 sellers, got ${data.publicSellers.length}`);
          for(const seller of data.publicSellers)if(blocked.has(norm(seller)))throw new Error(`Blocked public seller: ${seller}`);
          console.log('V20.3.3 autocomplete purity tests PASS');
          JS

          node --check scripts/search-v20/build-autocomplete-v20.mjs
          node --check netlify/functions/products-v20-suggest.mjs
          node --check js/smart-suggestions-v20.js
          node --check js/seller-whitelist-v20.js
          node --check scripts/search-v20/test-autocomplete-v20-3-3.mjs
          node scripts/search-v20/build-autocomplete-v20.mjs
          node scripts/search-v20/test-autocomplete-v20-3-3.mjs
          git diff --check

      - name: Commit shadow autocomplete backend only
        id: shadow_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/search-v20/autocomplete-v1.json \
            netlify/functions/products-v20-suggest.mjs \
            js/smart-suggestions-v20.js \
            js/seller-whitelist-v20.js \
            scripts/search-v20/build-autocomplete-v20.mjs \
            scripts/search-v20/test-autocomplete-v20-3-3.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "V20.3.3 shadow backend already current."
          else
            git commit -m "feat: add V20 pure autocomplete shadow backend"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for shadow autocomplete deployment
        id: shadow_deploy
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 72); do
            code=$(curl -sS -o "$RUNNER_TEMP/iph-shadow.json" -w '%{http_code}' --connect-timeout 10 --max-time 20 \
              "https://trendpilotchoice.com/api/products-v20-suggest?q=iph&limit=8&v=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$code" = "200" ] && python3 - "$RUNNER_TEMP/iph-shadow.json" <<'PY'
          import json,sys,re
          x=json.load(open(sys.argv[1]))
          rows=x.get('rows') or []
          assert x.get('ok') is True
          assert x.get('version')=='20.3.3'
          assert rows
          assert any('iphone' in str(r.get('value','')).lower() for r in rows)
          dirty=re.compile(r'\b(case|cases|cover|covers|charger|chargers|screen protector|accessor(?:y|ies)|replacement part)\b',re.I)
          blocked={'temu','joom','filamentpro','filamentpro eu cps'}
          for r in rows:
              assert str(r.get('seller','')).strip().lower() not in blocked
              assert not dirty.search(str(r.get('value','')))
          PY
            then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            echo "V20.3.3 shadow endpoint did not pass live purity checks. Visitor autocomplete was NOT changed."
            exit 1
          fi
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Cut over Finder autocomplete only after shadow PASS
        shell: bash
        run: |
          set -euo pipefail
          cp find/index.html "$RUNNER_TEMP/find-before-v20-3-3.html"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('find/index.html')
          s=p.read_text(encoding='utf-8')
          patterns=[
            r'\s*<script[^>]+src=["\']/js/smart-suggestions-v14-1-5\.js\?[^"\']*["\'][^>]*></script>',
            r'\s*<script[^>]+src=["\']/js/product-discovery-v15\.js\?[^"\']*["\'][^>]*></script>',
            r'\s*<script[^>]+src=["\']/js/seller-whitelist-v14-1-5\.js\?[^"\']*["\'][^>]*></script>',
            r'\s*<!-- TP_V20_3_3_AUTOCOMPLETE_START -->[\s\S]*?<!-- TP_V20_3_3_AUTOCOMPLETE_END -->'
          ]
          for pat in patterns:
              s=re.sub(pat,'',s,count=1,flags=re.I)
          block='\n<!-- TP_V20_3_3_AUTOCOMPLETE_START -->\n<script defer src="/js/smart-suggestions-v20.js?v=20.3.3"></script>\n<script defer src="/js/seller-whitelist-v20.js?v=20.3.3"></script>\n<!-- TP_V20_3_3_AUTOCOMPLETE_END -->'
          marker='</body>'
          if marker not in s:
              raise SystemExit('Finder body end marker not found')
          s=s.replace(marker,block+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'TP_V20_3_3_AUTOCOMPLETE_START' find/index.html
          grep -q '/js/smart-suggestions-v20.js?v=20.3.3' find/index.html
          grep -q '/js/seller-whitelist-v20.js?v=20.3.3' find/index.html
          if grep -q '/js/smart-suggestions-v14-1-5.js' find/index.html; then echo 'Old V14 autocomplete still loaded'; exit 1; fi
          if grep -q '/js/product-discovery-v15.js' find/index.html; then echo 'Old V15 autocomplete still loaded'; exit 1; fi
          if grep -q '/js/seller-whitelist-v14-1-5.js' find/index.html; then echo 'Old seller whitelist still loaded'; exit 1; fi
          git diff --check

      - name: Commit V20.3.3 Finder autocomplete cutover
        id: cutover_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add find/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "feat: cut Finder autocomplete over to V20 purity index"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Finder cutover and run live purity probes
        id: live
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for i in $(seq 1 72); do
            page=$(curl -sS --connect-timeout 10 --max-time 20 \
              "https://trendpilotchoice.com/find/?q=iphone&v=${GITHUB_RUN_ID}-${i}" || true)
            if printf '%s' "$page" | grep -q '/js/smart-suggestions-v20.js?v=20.3.3' \
              && printf '%s' "$page" | grep -q '/js/seller-whitelist-v20.js?v=20.3.3' \
              && ! printf '%s' "$page" | grep -q '/js/smart-suggestions-v14-1-5.js' \
              && ! printf '%s' "$page" | grep -q '/js/product-discovery-v15.js' \
              && ! printf '%s' "$page" | grep -q '/js/seller-whitelist-v14-1-5.js'; then
              good=true
              for q in iph iphone lap perf; do
                code=$(curl -sS -o "$RUNNER_TEMP/suggest-$q.json" -w '%{http_code}' --connect-timeout 10 --max-time 20 \
                  "https://trendpilotchoice.com/api/products-v20-suggest?q=$q&limit=8&v=${GITHUB_RUN_ID}-${i}" || true)
                [ "$code" = "200" ] || good=false
              done
              curl -sS -o "$RUNNER_TEMP/suggest-iphone-case.json" --connect-timeout 10 --max-time 20 \
                "https://trendpilotchoice.com/api/products-v20-suggest?q=iphone%20case&limit=8&v=${GITHUB_RUN_ID}-${i}" >/dev/null || good=false
              if [ "$good" = "true" ] && python3 - "$RUNNER_TEMP/suggest-iph.json" "$RUNNER_TEMP/suggest-iphone.json" "$RUNNER_TEMP/suggest-iphone-case.json" <<'PY'
          import json,sys,re
          blocked={'temu','joom','filamentpro','filamentpro eu cps'}
          dirty=re.compile(r'\b(case|cases|cover|covers|charger|chargers|screen protector|accessor(?:y|ies)|replacement part)\b',re.I)
          for f in sys.argv[1:3]:
              x=json.load(open(f)); rows=x.get('rows') or []
              assert x.get('ok') is True and x.get('version')=='20.3.3'
              assert rows
              assert any('iphone' in str(r.get('value','')).lower() for r in rows)
              for r in rows:
                  assert str(r.get('seller','')).strip().lower() not in blocked
                  assert not dirty.search(str(r.get('value','')))
          a=json.load(open(sys.argv[3]))
          assert a.get('ok') is True and a.get('accessoryIntent') is True
          for r in a.get('rows') or []:
              assert str(r.get('seller','')).strip().lower() not in blocked
          PY
              then
                ok=true
                break
              fi
            fi
            sleep 5
          done

          if [ "$ok" != "true" ]; then
            echo "Final V20.3.3 live probe failed. Restoring previous Finder HTML automatically."
            cp "$RUNNER_TEMP/find-before-v20-3-3.html" find/index.html
            git add find/index.html
            if ! git diff --cached --quiet; then
              git commit -m "rollback: restore Finder autocomplete after V20.3.3 probe failure"
              git push origin HEAD:main
            fi
            exit 1
          fi
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Publish V20.3.3 summary
        if: always()
        shell: bash
        run: |
          {
            echo "# TrendPilot V20.3.3 — V20 Autocomplete Purity"
            echo
            echo "## Safety sequence"
            echo "- V20 suggestion backend deployed and probed before visitor cutover: **${{ steps.shadow_deploy.outputs.ready || 'not-passed' }}**"
            echo "- Visitor autocomplete final probe: **${{ steps.live.outputs.ready || 'not-passed' }}**"
            echo "- Automatic HTML rollback is enabled if the final live probe fails."
            echo
            echo "## Finder autocomplete"
            echo "- Source: **V20 canonical main/related projection**"
            echo "- General typing uses **main/model only**."
            echo "- Accessories/parts enter suggestions only when the typed query explicitly asks for them."
            echo "- Old V14 and V15 competing Finder autocomplete engines: **removed from /find/**"
            echo "- Seller dropdown source: **V20 manifest, 13 sellers**"
            echo "- Temu / Joom / FilamentPRO: **blocked from autocomplete and seller list**"
            echo
            echo "## Important"
            echo "- V19 canonical seller catalogs were **not rebuilt**."
            echo "- V20.3.2 product search remains in place; this workflow changes only Finder autocomplete/seller-list presentation plus the new suggestion endpoint."
          } >> "$GITHUB_STEP_SUMMARY"
