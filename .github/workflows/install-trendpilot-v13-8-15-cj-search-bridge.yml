name: Install TrendPilot V13.8.15 CJ Products, Offers and Search Bridge

on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "CJ Publisher Company ID / CID (about 7 digits). Optional if saved as CJ_COMPANY_ID."
        required: false
        type: string
      website_id:
        description: "CJ Website / Property ID / PID. Optional if saved as CJ_WEBSITE_ID."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: trendpilot-v13-8-15-cj-products-offers-hub
  cancel-in-progress: false

jobs:
  install-cj-products-offers-search-bridge:
    runs-on: ubuntu-latest
    env:
      CJ_INPUT_COMPANY_ID: ${{ inputs.company_id }}
      CJ_INPUT_WEBSITE_ID: ${{ inputs.website_id }}

      CJ_TOKEN_PRIMARY: ${{ secrets.CJ_API_TOKEN }}
      CJ_TOKEN_ALT_1: ${{ secrets.CJ_TOKEN }}
      CJ_TOKEN_ALT_2: ${{ secrets.CJ_PAT }}
      CJ_TOKEN_ALT_3: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}

      CJ_COMPANY_PRIMARY: ${{ secrets.CJ_COMPANY_ID }}
      CJ_COMPANY_ALT_1: ${{ secrets.CJ_CID }}
      CJ_COMPANY_ALT_2: ${{ secrets.CJ_PUBLISHER_CID }}

      CJ_WEBSITE_PRIMARY: ${{ secrets.CJ_WEBSITE_ID }}
      CJ_WEBSITE_ALT_1: ${{ secrets.CJ_PID }}
      CJ_WEBSITE_ALT_2: ${{ secrets.CJ_PROPERTY_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch exact CJ products and joined offers
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          VERSION = "13.8.15"
          ROOT = Path(".")
          DATA_DIR = ROOT / "data"
          JS_DIR = ROOT / "js"
          HUB_DIR = ROOT / "cj-partners"
          GRAPHQL_URL = "https://ads.api.cj.com/query"
          LINK_URL = "https://link-search.api.cj.com/v2/link-search"

          PARTNERS = [
              {
                  "id": "2357926",
                  "name": "Diecast",
                  "aliases": ["diecast", "diecast.com"],
                  "keywords": ["diecast model car", "model car", "toy car"],
                  "kind": "Products",
                  "group": "toys-games",
                  "family": "model-cars",
              },
              {
                  "id": "7287203",
                  "name": "FragranceShop.com",
                  "aliases": ["fragranceshop.com", "fragrance shop", "the fragrance shop"],
                  "keywords": ["perfume", "fragrance", "eau de parfum"],
                  "kind": "Beauty",
                  "group": "beauty-care",
                  "family": "fragrance",
              },
              {
                  "id": "5893489",
                  "name": "Karaca EU",
                  "aliases": ["karaca eu", "karaca europe", "karaca"],
                  "keywords": ["cookware", "kitchen", "dinnerware"],
                  "kind": "Home & kitchen",
                  "group": "home-kitchen",
                  "family": "cookware",
              },
              {
                  "id": "7227612",
                  "name": "MFI Medical",
                  "aliases": ["mfi medical", "mfimedical"],
                  "keywords": ["medical equipment", "medical supplies", "diagnostic"],
                  "kind": "Medical equipment",
                  "group": "other",
                  "family": "medical-equipment",
              },
              {
                  "id": "4837117",
                  "name": "NordVPN",
                  "aliases": ["nordvpn", "nord vpn"],
                  "keywords": ["vpn", "cybersecurity", "privacy software"],
                  "kind": "Software service",
                  "group": "software",
                  "family": "vpn-software",
              },
              {
                  "id": "4295086",
                  "name": "PandaHall",
                  "aliases": ["pandahall", "panda hall"],
                  "keywords": ["beads", "jewelry making", "craft supplies"],
                  "kind": "Craft supplies",
                  "group": "jewelry-watches",
                  "family": "jewelry-making",
              },
              {
                  "id": "4368684",
                  "name": "Trip.com (Global)",
                  "aliases": ["trip.com global", "trip.com", "tripcom"],
                  "keywords": ["hotel", "flight", "travel"],
                  "kind": "Travel service",
                  "group": "other",
                  "family": "travel-service",
              },
          ]

          def first_env(*names: str) -> str:
              for name in names:
                  value = (os.environ.get(name) or "").strip()
                  if value:
                      return value
              return ""

          token = first_env(
              "CJ_TOKEN_PRIMARY",
              "CJ_TOKEN_ALT_1",
              "CJ_TOKEN_ALT_2",
              "CJ_TOKEN_ALT_3",
          )
          company_id = first_env(
              "CJ_INPUT_COMPANY_ID",
              "CJ_COMPANY_PRIMARY",
              "CJ_COMPANY_ALT_1",
              "CJ_COMPANY_ALT_2",
          )
          website_id = first_env(
              "CJ_INPUT_WEBSITE_ID",
              "CJ_WEBSITE_PRIMARY",
              "CJ_WEBSITE_ALT_1",
              "CJ_WEBSITE_ALT_2",
          )

          if not token:
              raise SystemExit(
                  "CJ token is missing. Use one of these secret names: "
                  "CJ_API_TOKEN, CJ_TOKEN, CJ_PAT, or CJ_PERSONAL_ACCESS_TOKEN."
              )

          if company_id and not re.fullmatch(r"\d{4,12}", company_id):
              raise SystemExit("CJ Company ID / CID must contain digits only.")
          if website_id and not re.fullmatch(r"\d{4,15}", website_id):
              raise SystemExit("CJ Website / Property ID must contain digits only.")

          def masked(value: str) -> str:
              if not value:
                  return "not supplied"
              return ("*" * max(0, len(value) - 4)) + value[-4:]

          def clean(value: Any) -> str:
              return re.sub(r"\s+", " ", html.unescape(str(value or ""))).strip()

          def key(value: Any) -> str:
              return re.sub(r"[^a-z0-9]+", "", clean(value).lower())

          def valid_http_url(value: Any) -> bool:
              try:
                  parsed = urllib.parse.urlparse(clean(value))
                  return parsed.scheme in {"http", "https"} and bool(parsed.netloc)
              except Exception:
                  return False

          def request_bytes(
              url: str,
              *,
              method: str = "GET",
              headers: dict[str, str] | None = None,
              body: bytes | None = None,
              attempts: int = 3,
          ) -> bytes:
              request_headers = {
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "TrendPilot-CJ-Bridge/13.8.15",
                  **(headers or {}),
              }
              last_error: Exception | None = None

              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(
                      url,
                      data=body,
                      headers=request_headers,
                      method=method,
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=75) as response:
                          return response.read()
                  except urllib.error.HTTPError as exc:
                      payload = exc.read().decode("utf-8", errors="replace")[:1200]
                      last_error = RuntimeError(f"HTTP {exc.code}: {payload}")
                      if exc.code in {400, 401, 403, 404}:
                          break
                  except Exception as exc:
                      last_error = exc

                  if attempt < attempts:
                      time.sleep(attempt * 3)

              raise RuntimeError(str(last_error or "CJ request failed"))

          def gql(query: str) -> dict[str, Any]:
              payload = json.dumps({"query": query}).encode("utf-8")
              raw = request_bytes(
                  GRAPHQL_URL,
                  method="POST",
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  body=payload,
              )
              data = json.loads(raw.decode("utf-8", errors="replace"))
              if data.get("errors"):
                  messages = "; ".join(clean(x.get("message")) for x in data["errors"])
                  raise RuntimeError(messages or "CJ GraphQL returned errors")
              return data.get("data") or {}

          def gql_string(value: str) -> str:
              return json.dumps(value, ensure_ascii=False)

          def product_query(
              query_name: str,
              partner: dict[str, Any],
              keyword: str,
              *,
              include_advertiser_filter: bool,
          ) -> str:
              advertiser_arg = (
                  f', advertiserIds: [{gql_string(partner["id"])}]'
                  if include_advertiser_filter
                  else ""
              )
              return (
                  "{ "
                  f"{query_name}("
                  f"companyId: {gql_string(company_id)}, "
                  f"keywords: [{gql_string(keyword)}], "
                  f"limit: 100, offset: 0"
                  f"{advertiser_arg}"
                  ") { "
                  "totalCount "
                  "resultList { "
                  "advertiserName "
                  "title "
                  "price { amount currency } "
                  "link "
                  "imageLink "
                  "} "
                  "} "
                  "}"
              )

          def partner_name_matches(partner: dict[str, Any], value: Any) -> bool:
              candidate = key(value)
              allowed = {key(partner["name"]), *(key(x) for x in partner["aliases"])}
              return candidate in allowed or any(
                  len(alias) >= 6 and (alias in candidate or candidate in alias)
                  for alias in allowed
                  if candidate
              )

          product_errors: list[dict[str, str]] = []
          all_products: list[dict[str, Any]] = []
          products_by_partner: dict[str, list[dict[str, Any]]] = {
              partner["id"]: [] for partner in PARTNERS
          }

          if company_id:
              for partner in PARTNERS:
                  seen: set[str] = set()

                  for keyword in partner["keywords"]:
                      products_before_keyword = len(
                          products_by_partner[partner["id"]]
                      )
                      found_products = False

                      for query_name in ("products", "shoppingProducts"):
                          for filtered in (True, False):
                              try:
                                  data = gql(
                                      product_query(
                                          query_name,
                                          partner,
                                          keyword,
                                          include_advertiser_filter=filtered,
                                      )
                                  )
                                  payload = data.get(query_name) or {}
                                  rows = payload.get("resultList") or []

                                  for row in rows:
                                      advertiser = clean(row.get("advertiserName"))
                                      if not partner_name_matches(partner, advertiser):
                                          continue

                                      title = clean(row.get("title"))
                                      link = clean(row.get("link"))
                                      image = clean(row.get("imageLink"))
                                      price_obj = row.get("price") or {}
                                      amount_raw = price_obj.get("amount")
                                      try:
                                          amount = float(amount_raw or 0)
                                      except (TypeError, ValueError):
                                          amount = 0.0

                                      if not title or not valid_http_url(link):
                                          continue

                                      identity = hashlib.sha256(
                                          f'{partner["id"]}|{title}|{link}'.encode("utf-8")
                                      ).hexdigest()[:24]
                                      if identity in seen:
                                          continue
                                      seen.add(identity)

                                      product = {
                                          "id": f"cj-product-{identity}",
                                          "advertiserId": partner["id"],
                                          "advertiser": partner["name"],
                                          "name": title,
                                          "price": amount,
                                          "currency": clean(price_obj.get("currency")) or "USD",
                                          "url": link,
                                          "image": image if valid_http_url(image) else "",
                                          "network": "CJ",
                                          "source": "CJ Product Feed GraphQL",
                                          "queryType": query_name,
                                          "matchedKeyword": keyword,
                                          "group": partner["group"],
                                          "family": partner["family"],
                                          "audience": "all",
                                          "quality": 86,
                                          "brand": partner["name"],
                                          "category": partner["kind"],
                                          "description": (
                                              f'{partner["name"]} product returned by the CJ '
                                              f'product-feed API for the keyword {keyword}.'
                                          ),
                                          "condition": "new",
                                      }
                                      products_by_partner[partner["id"]].append(product)
                                      all_products.append(product)

                                  if (
                                      len(products_by_partner[partner["id"]])
                                      > products_before_keyword
                                  ):
                                      found_products = True
                                      break
                              except Exception as exc:
                                  product_errors.append(
                                      {
                                          "partner": partner["name"],
                                          "query": query_name,
                                          "keyword": keyword,
                                          "filtered": str(filtered).lower(),
                                          "error": clean(exc)[:500],
                                      }
                                  )
                          if found_products:
                              break

                      if len(products_by_partner[partner["id"]]) >= 100:
                          break

          def xml_child_text(node: ET.Element, names: list[str]) -> str:
              wanted = {name.lower().replace("-", "") for name in names}
              for child in list(node):
                  local = child.tag.split("}")[-1].lower().replace("-", "")
                  if local in wanted:
                      return clean(child.text)
              return ""

          def fetch_links(partner: dict[str, Any]) -> tuple[list[dict[str, Any]], str]:
              if not website_id:
                  return [], "website-id-missing"

              params = {
                  "website-id": website_id,
                  "advertiser-ids": partner["id"],
                  "records-per-page": "100",
                  "page-number": "1",
              }
              url = LINK_URL + "?" + urllib.parse.urlencode(params)

              try:
                  raw = request_bytes(url)
                  root = ET.fromstring(raw)
              except Exception as exc:
                  return [], clean(exc)[:500]

              rows: list[dict[str, Any]] = []
              seen: set[str] = set()

              for node in root.iter():
                  if node.tag.split("}")[-1].lower() != "link":
                      continue

                  advertiser_id = xml_child_text(
                      node, ["advertiser-id", "advertiserId"]
                  )
                  advertiser_name = xml_child_text(
                      node, ["advertiser-name", "advertiserName"]
                  )
                  link_id = xml_child_text(node, ["link-id", "linkId"])
                  name = xml_child_text(node, ["link-name", "linkName"])
                  description = xml_child_text(node, ["description", "ad-content"])
                  click_url = xml_child_text(
                      node, ["clickUrl", "click-url", "clickurl"]
                  )
                  destination = xml_child_text(node, ["destination"])
                  link_type = xml_child_text(node, ["link-type", "linkType"])
                  promotion_type = xml_child_text(
                      node, ["promotion-type", "promotionType"]
                  )
                  coupon_code = xml_child_text(node, ["coupon-code", "couponCode"])
                  sale_commission = xml_child_text(
                      node, ["sale-commission", "saleCommission"]
                  )
                  relationship = xml_child_text(
                      node, ["relationship-status", "relationshipStatus"]
                  )

                  if advertiser_id and advertiser_id != partner["id"]:
                      continue
                  if advertiser_name and not partner_name_matches(partner, advertiser_name):
                      continue
                  if relationship and relationship.lower() != "joined":
                      continue
                  if not valid_http_url(click_url):
                      continue

                  identity = link_id or hashlib.sha256(
                      f'{partner["id"]}|{name}|{click_url}'.encode("utf-8")
                  ).hexdigest()[:24]
                  if identity in seen:
                      continue
                  seen.add(identity)

                  rows.append(
                      {
                          "id": f"cj-offer-{identity}",
                          "advertiserId": partner["id"],
                          "advertiser": partner["name"],
                          "name": name or f'{partner["name"]} offer',
                          "description": description,
                          "url": click_url,
                          "destination": destination if valid_http_url(destination) else "",
                          "linkType": link_type,
                          "promotionType": promotion_type,
                          "couponCode": coupon_code,
                          "saleCommission": sale_commission,
                          "network": "CJ",
                          "source": "CJ Link Search",
                      }
                  )

              rows.sort(
                  key=lambda row: (
                      0 if row["linkType"].lower() == "text link" else 1,
                      0 if row["promotionType"] else 1,
                      row["name"].lower(),
                  )
              )
              return rows[:30], ""

          links_by_partner: dict[str, list[dict[str, Any]]] = {}
          link_errors: list[dict[str, str]] = []

          for partner in PARTNERS:
              rows, error = fetch_links(partner)
              links_by_partner[partner["id"]] = rows
              if error:
                  link_errors.append({"partner": partner["name"], "error": error})

          product_partners: list[dict[str, Any]] = []
          offer_partners: list[dict[str, Any]] = []
          unavailable_partners: list[dict[str, Any]] = []

          for partner in PARTNERS:
              products = products_by_partner[partner["id"]]
              offers = links_by_partner[partner["id"]]
              public_partner = {
                  "advertiserId": partner["id"],
                  "name": partner["name"],
                  "kind": partner["kind"],
                  "productCount": len(products),
                  "offerCount": len(offers),
              }

              if products:
                  public_partner["products"] = products
                  public_partner["offers"] = offers[:5]
                  product_partners.append(public_partner)
              elif offers:
                  public_partner["offers"] = offers
                  offer_partners.append(public_partner)
              else:
                  public_partner["reason"] = (
                      "No searchable CJ product records or active joined links were returned."
                  )
                  unavailable_partners.append(public_partner)

          status = "complete"
          if not company_id and website_id:
              status = "offers-only-company-id-missing"
          elif company_id and not website_id:
              status = "products-only-website-id-missing"
          elif not company_id and not website_id:
              status = "credentials-incomplete"

          now = datetime.now(timezone.utc).isoformat()
          hub = {
              "version": VERSION,
              "generatedAt": now,
              "status": status,
              "network": "CJ",
              "approvedPartnerCount": len(PARTNERS),
              "productPartnerCount": len(product_partners),
              "offerPartnerCount": len(offer_partners),
              "unavailablePartnerCount": len(unavailable_partners),
              "productCount": len(all_products),
              "offerCount": sum(len(rows) for rows in links_by_partner.values()),
              "productPartners": product_partners,
              "offerPartners": offer_partners,
              "unavailablePartners": unavailable_partners,
              "disclosure": (
                  "TrendPilot may earn a commission when a visitor uses an eligible "
                  "CJ partner link. Availability, prices and terms remain on the provider."
              ),
          }

          report = {
              "version": VERSION,
              "generatedAt": now,
              "status": status,
              "companyIdMasked": masked(company_id),
              "websiteIdMasked": masked(website_id),
              "approvedAdvertisers": [
                  {"advertiserId": p["id"], "name": p["name"]} for p in PARTNERS
              ],
              "productCounts": {
                  p["name"]: len(products_by_partner[p["id"]]) for p in PARTNERS
              },
              "offerCounts": {
                  p["name"]: len(links_by_partner[p["id"]]) for p in PARTNERS
              },
              "searchEligibleProductCount": sum(
                  1
                  for product in all_products
                  if product["price"] > 0
                  and valid_http_url(product["image"])
                  and valid_http_url(product["url"])
              ),
              "searchEligibleSellers": sorted(
                  {
                      product["advertiser"]
                      for product in all_products
                      if product["price"] > 0
                      and valid_http_url(product["image"])
                      and valid_http_url(product["url"])
                  }
              ),
              "productApiErrors": product_errors[-40:],
              "linkApiErrors": link_errors,
              "notes": [
                  "Only the seven approved CJ advertiser IDs are queried.",
                  "Real CJ products are loaded into Find search; Seller shows only joined CJ sellers whose products include a title, URL, image and positive price.",
                  "Partners without real product records are kept in the separate CJ partner hub.",
              ],
          }

          DATA_DIR.mkdir(parents=True, exist_ok=True)
          JS_DIR.mkdir(parents=True, exist_ok=True)
          HUB_DIR.mkdir(parents=True, exist_ok=True)

          (DATA_DIR / "cj-partner-hub.json").write_text(
              json.dumps(hub, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (DATA_DIR / "cj-partner-hub-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (DATA_DIR / "cj-products.json").write_text(
              json.dumps(
                  {
                      "version": VERSION,
                      "generatedAt": now,
                      "products": all_products,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          (DATA_DIR / "cj-offers.json").write_text(
              json.dumps(
                  {
                      "version": VERSION,
                      "generatedAt": now,
                      "offers": [
                          offer
                          for partner in PARTNERS
                          for offer in links_by_partner[partner["id"]]
                      ],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          (JS_DIR / "cj-partner-hub.js").write_text(
              "window.TRENDPILOT_CJ_PARTNER_HUB="
              + json.dumps(hub, ensure_ascii=False, separators=(",", ":"))
              + ";\n",
              encoding="utf-8",
          )

          page = r'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="index,follow">
            <meta name="description" content="Products, services and current partner offers available through TrendPilot's connected CJ advertisers.">
            <title>CJ Partner Products and Offers — TrendPilot AI</title>
            <link rel="canonical" href="https://trendpilotchoice.com/cj-partners/">
            <style>
              :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101820;background:#f7f8f4}
              *{box-sizing:border-box}body{margin:0}a{color:inherit}
              .wrap{width:min(1120px,calc(100% - 32px));margin:auto}
              header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid #e5e7eb}
              header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
              .brand{font-size:1.35rem;font-weight:900;text-decoration:none}.brand span{color:#18a57b}
              .back{padding:10px 14px;border:1px solid #d7dce1;border-radius:14px;text-decoration:none;font-weight:750}
              main{padding:52px 0 90px}.hero{padding:34px;border-radius:30px;background:linear-gradient(135deg,#eef3ff,#edfff8);border:1px solid #dce4e7}
              .eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#2555d9;font-weight:900}
              h1{font-size:clamp(2.2rem,7vw,4.7rem);line-height:.96;margin:14px 0 20px;max-width:850px}
              .lead{font-size:1.1rem;line-height:1.75;color:#5c6670;max-width:800px}
              .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
              .stat{padding:18px;border-radius:20px;background:#fff;border:1px solid #e2e6e9}.stat b{display:block;font-size:1.7rem}
              section{margin-top:54px}h2{font-size:clamp(1.75rem,4vw,2.7rem);margin:0 0 10px}.sub{color:#68727b;margin:0 0 24px;line-height:1.65}
              .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
              .card{display:flex;flex-direction:column;min-height:100%;padding:20px;border-radius:24px;background:white;border:1px solid #e0e4e7;box-shadow:0 12px 35px rgba(14,30,37,.05)}
              .product-image{aspect-ratio:4/3;border-radius:17px;background:#f1f3f5;display:grid;place-items:center;overflow:hidden;margin-bottom:16px}
              .product-image img{width:100%;height:100%;object-fit:contain}
              .seller{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#168363}
              .card h3{font-size:1.15rem;line-height:1.35;margin:10px 0}.card p{color:#66717a;line-height:1.55}
              .price{font-size:1.35rem;font-weight:900;margin-top:auto;padding-top:12px}
              .btn{display:inline-flex;justify-content:center;align-items:center;margin-top:15px;padding:13px 16px;border-radius:15px;background:#3159e8;color:#fff;text-decoration:none;font-weight:850}
              .offer .btn{background:#108664}.tag{display:inline-flex;width:max-content;padding:6px 10px;border-radius:999px;background:#e9f7f2;color:#087557;font-weight:800;font-size:.77rem}
              .empty{padding:24px;border-radius:22px;border:1px dashed #cbd2d8;color:#69737c;background:#fbfcfc}
              .disclosure{margin-top:48px;padding:20px;border-radius:18px;background:#fff5df;color:#6d5420;line-height:1.65}
              footer{border-top:1px solid #e0e4e7;padding:30px 0;color:#657078}
              [hidden]{display:none!important}
              @media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
              @media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding:25px}.stats{grid-template-columns:1fr 1fr}header .wrap{padding:14px 0}}
            </style>
          </head>
          <body>
            <header><div class="wrap"><a class="brand" href="/">TrendPilot <span>AI</span></a><a class="back" href="/deals/">Back to deals</a></div></header>
            <main class="wrap">
              <div class="hero">
                <div class="eyebrow">Connected CJ partners</div>
                <h1>Real products when available. Useful partner offers otherwise.</h1>
                <p class="lead">This page separates product-level catalog records from general service and promotional links. A company is never placed in the product filter unless CJ supplies a real product record.</p>
                <div class="stats">
                  <div class="stat"><b data-products>0</b><span>Product records</span></div>
                  <div class="stat"><b data-offers>0</b><span>Partner offers</span></div>
                  <div class="stat"><b data-product-partners>0</b><span>Product partners</span></div>
                  <div class="stat"><b>7</b><span>Approved partners checked</span></div>
                </div>
              </div>

              <section data-product-section>
                <h2>CJ product catalog</h2>
                <p class="sub">Only real product records returned by CJ's product-feed API appear here.</p>
                <div class="grid" data-products-grid></div>
              </section>

              <section data-offer-section>
                <h2>Services and partner offers</h2>
                <p class="sub">These are joined-advertiser tracking links, not invented product listings.</p>
                <div class="grid" data-offers-grid></div>
              </section>

              <section data-waiting-section>
                <h2>Connected partners awaiting usable catalog data</h2>
                <p class="sub">They remain connected but are not shown as product sellers until CJ returns a genuine product or active link.</p>
                <div class="grid" data-waiting-grid></div>
              </section>

              <div class="disclosure" data-disclosure></div>
            </main>
            <footer><div class="wrap">TrendPilot AI · Product and offer availability can change on the provider.</div></footer>

            <script src="/js/cj-partner-hub.js?v=13.8.15"></script>
            <script>
              (() => {
                const data = window.TRENDPILOT_CJ_PARTNER_HUB || {};
                const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
                const money = product => product.price > 0 ? new Intl.NumberFormat(undefined,{style:"currency",currency:product.currency||"USD"}).format(product.price) : "Check provider";
                const productRows = (data.productPartners || []).flatMap(partner => partner.products || []);
                const offerRows = [...(data.offerPartners || []), ...(data.productPartners || [])].flatMap(partner => (partner.offers || []).map(offer => ({...offer, kind:partner.kind})));
                const waitingRows = data.unavailablePartners || [];

                document.querySelector("[data-products]").textContent = data.productCount || 0;
                document.querySelector("[data-offers]").textContent = data.offerCount || 0;
                document.querySelector("[data-product-partners]").textContent = data.productPartnerCount || 0;
                document.querySelector("[data-disclosure]").textContent = data.disclosure || "";

                const productsGrid = document.querySelector("[data-products-grid]");
                productsGrid.innerHTML = productRows.length ? productRows.map(product => `
                  <article class="card">
                    <div class="product-image">${product.image ? `<img src="${esc(product.image)}" alt="" loading="lazy">` : "Product image not supplied"}</div>
                    <span class="seller">${esc(product.advertiser)}</span>
                    <h3>${esc(product.name)}</h3>
                    <div class="price">${esc(money(product))}</div>
                    <a class="btn" href="${esc(product.url)}" target="_blank" rel="nofollow sponsored noopener">Check product ↗</a>
                  </article>`).join("") : `<div class="empty">CJ returned no usable product-level records during the latest sync. The connected offers below remain available.</div>`;

                const offersGrid = document.querySelector("[data-offers-grid]");
                offersGrid.innerHTML = offerRows.length ? offerRows.map(offer => `
                  <article class="card offer">
                    <span class="tag">${esc(offer.kind || offer.linkType || "Partner offer")}</span>
                    <span class="seller">${esc(offer.advertiser)}</span>
                    <h3>${esc(offer.name)}</h3>
                    <p>${esc(offer.description || "Open the provider to see current availability and terms.")}</p>
                    ${offer.couponCode ? `<p><b>Code:</b> ${esc(offer.couponCode)}</p>` : ""}
                    <a class="btn" href="${esc(offer.url)}" target="_blank" rel="nofollow sponsored noopener">Open partner ↗</a>
                  </article>`).join("") : `<div class="empty">No active joined-advertiser links were returned in the latest sync.</div>`;

                const waitingGrid = document.querySelector("[data-waiting-grid]");
                waitingGrid.innerHTML = waitingRows.length ? waitingRows.map(partner => `
                  <article class="card">
                    <span class="tag">${esc(partner.kind)}</span>
                    <h3>${esc(partner.name)}</h3>
                    <p>${esc(partner.reason)}</p>
                  </article>`).join("") : `<div class="empty">Every checked partner supplied either products or a usable offer.</div>`;
              })();
            </script>
          </body>
          </html>
          '''
          (HUB_DIR / "index.html").write_text(
              re.sub(r"^\s{10}", "", page, flags=re.MULTILINE),
              encoding="utf-8",
          )

          deals_path = ROOT / "deals" / "index.html"
          if deals_path.exists():
              deals = deals_path.read_text(encoding="utf-8")
              deals = re.sub(
                  r"\s*<!-- TP_CJ_HUB_START -->[\s\S]*?<!-- TP_CJ_HUB_END -->\s*",
                  "\n",
                  deals,
                  count=1,
              )
              card = r'''
              <!-- TP_CJ_HUB_START -->
              <section style="width:min(1120px,calc(100% - 32px));margin:36px auto;padding:24px;border:1px solid #dce3e6;border-radius:24px;background:linear-gradient(135deg,#eef3ff,#edfff8)">
                <p style="margin:0 0 8px;font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#2857d9">CJ partner hub</p>
                <h2 style="margin:0 0 10px">Products where CJ supplies them. Partner offers where it does not.</h2>
                <p style="margin:0 0 18px;color:#626d75;line-height:1.65">Browse the seven connected CJ partners without mixing general advertiser links into the product Seller filter.</p>
                <a href="/cj-partners/" style="display:inline-flex;padding:13px 17px;border-radius:14px;background:#3159e8;color:#fff;text-decoration:none;font-weight:850">Open CJ products and offers</a>
              </section>
              <!-- TP_CJ_HUB_END -->
              '''
              marker = "</main>"
              if marker in deals:
                  deals = deals.replace(marker, card + "\n" + marker, 1)
              else:
                  deals = deals.replace("</body>", card + "\n</body>", 1)
              deals_path.write_text(deals, encoding="utf-8")

          sitemap_path = ROOT / "sitemap.xml"
          if sitemap_path.exists():
              sitemap = sitemap_path.read_text(encoding="utf-8")
              if "https://trendpilotchoice.com/cj-partners/" not in sitemap:
                  entry = (
                      "  <url><loc>https://trendpilotchoice.com/cj-partners/</loc>"
                      "<changefreq>daily</changefreq><priority>0.8</priority></url>\n"
                  )
                  sitemap = sitemap.replace("</urlset>", entry + "</urlset>")
                  sitemap_path.write_text(sitemap, encoding="utf-8")

          print(
              json.dumps(
                  {
                      "status": status,
                      "productCount": len(all_products),
                      "offerCount": hub["offerCount"],
                      "productPartners": len(product_partners),
                      "offerPartners": len(offer_partners),
                      "unavailablePartners": len(unavailable_partners),
                      "companyId": masked(company_id),
                      "websiteId": masked(website_id),
                  },
                  indent=2,
              )
          )
          PY

      - name: Bridge real CJ products into Find search
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          VERSION = "13.8.15"
          JS_PATH = Path("js/site-v13-5.js")
          FIND_PATH = Path("find/index.html")
          PRODUCT_PATH = Path("product/index.html")

          if not JS_PATH.exists():
              raise SystemExit("js/site-v13-5.js was not found.")

          script = JS_PATH.read_text(encoding="utf-8")

          # Replace any earlier generated bridge so rerunning the workflow is safe.
          script = re.sub(
              r"\n\s*// TP_CJ_SEARCH_BRIDGE_START[\s\S]*?// TP_CJ_SEARCH_BRIDGE_END\s*\n",
              "\n",
              script,
              count=1,
          )

          loader = r'''
            // TP_CJ_SEARCH_BRIDGE_START
            let tpCjProductsPromise = null;
            async function loadCjProducts() {
              if (tpCjProductsPromise) return tpCjProductsPromise;
              tpCjProductsPromise = (async () => {
                try {
                  const r = await fetch(`/data/cj-products.json?v=13.8.15-${Date.now()}`, {cache:"no-store"});
                  if (!r.ok) throw new Error(`CJ products ${r.status}`);
                  const data = await r.json();
                  return (Array.isArray(data.products) ? data.products : []).map(normalizeProduct);
                } catch (error) {
                  console.warn("TrendPilot CJ products unavailable", error);
                  return [];
                }
              })();
              return tpCjProductsPromise;
            }
            // TP_CJ_SEARCH_BRIDGE_END
          '''
          anchor = "  function initChrome() {"
          if anchor not in script:
              raise SystemExit("Could not find initChrome anchor in js/site-v13-5.js.")
          script = script.replace(anchor, loader + "\n" + anchor, 1)

          old_search = '    const rows=state.manifest.version==="fallback"?state.products:await loadInitialSegments(); mergeProducts(rows);'
          new_search = '''    const [rows,cjRows]=await Promise.all([
                state.manifest.version==="fallback"?Promise.resolve(state.products):loadInitialSegments(),
                loadCjProducts()
              ]); mergeProducts([...rows,...cjRows]);'''
          if old_search in script:
              script = script.replace(old_search, new_search, 1)
          elif 'const [rows,cjRows]=await Promise.all([' not in script:
              raise SystemExit("Could not patch performSearch in js/site-v13-5.js.")

          # Make /find/?q=popular+products broad instead of requiring the literal
          # word “popular” in every product title.
          old_generic = 'const generic=new Set(["men","mens","women","womens","kids","kid","children","child","baby","product","products","item","items","all"]);'
          new_generic = 'const generic=new Set(["men","mens","women","womens","kids","kid","children","child","baby","product","products","item","items","all","popular"]);'
          if old_generic in script:
              script = script.replace(old_generic, new_generic, 1)
          elif '"all","popular"' not in script:
              raise SystemExit("Could not patch popular-products search intent.")

          # Resolve a CJ result on /product/ without changing the large catalogue index.
          old_manifest = '    const m=await loadManifest();\n    const featured='
          new_manifest = '    const m=await loadManifest();\n    const cjProducts=await loadCjProducts();\n    const featured='
          if old_manifest in script:
              script = script.replace(old_manifest, new_manifest, 1)
          elif 'const cjProducts=await loadCjProducts();' not in script:
              raise SystemExit("Could not patch loadProductById manifest stage.")

          old_direct = '    const direct=featured.find(p=>p.id===id)||state.products.find(p=>p.id===id);'
          new_direct = '    const direct=featured.find(p=>p.id===id)||state.products.find(p=>p.id===id)||cjProducts.find(p=>p.id===id);'
          if old_direct in script:
              script = script.replace(old_direct, new_direct, 1)
          elif '||cjProducts.find(p=>p.id===id);' not in script:
              raise SystemExit("Could not patch direct CJ product lookup.")

          JS_PATH.write_text(script, encoding="utf-8")

          for page_path in (FIND_PATH, PRODUCT_PATH):
              if not page_path.exists():
                  continue
              page = page_path.read_text(encoding="utf-8")
              page, count = re.subn(
                  r'/js/site-v13-5\.js\?v=[^"\']+',
                  '/js/site-v13-5.js?v=13.8.15',
                  page,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not update cache version in {page_path}.")
              page_path.write_text(page, encoding="utf-8")

          products_payload = json.loads(
              Path("data/cj-products.json").read_text(encoding="utf-8")
          )
          products = products_payload.get("products") or []

          def valid_url(value: object) -> bool:
              return bool(re.match(r"^https?://", str(value or ""), flags=re.I))

          eligible = [
              product
              for product in products
              if str(product.get("name") or "").strip()
              and valid_url(product.get("url"))
              and valid_url(product.get("image"))
              and float(product.get("price") or 0) > 0
          ]
          sellers = sorted({str(p.get("advertiser") or "").strip() for p in eligible})
          bridge_report = {
              "version": VERSION,
              "productsFetched": len(products),
              "searchEligibleProducts": len(eligible),
              "searchEligibleSellers": sellers,
              "sellerRule": "Joined CJ seller plus real title, URL, image and positive price.",
              "searchFile": "data/cj-products.json",
              "catalogShardsChanged": False,
          }
          Path("data/cj-search-bridge-report.json").write_text(
              json.dumps(bridge_report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # Directly fixes the earlier deals/index.html:12 trailing-whitespace error.
          touched = [
              Path("deals/index.html"),
              Path("cj-partners/index.html"),
              FIND_PATH,
              PRODUCT_PATH,
              JS_PATH,
              Path("sitemap.xml"),
          ]
          for path in touched:
              if not path.exists():
                  continue
              source = path.read_text(encoding="utf-8")
              cleaned = "\n".join(line.rstrip() for line in source.splitlines()) + "\n"
              path.write_text(cleaned, encoding="utf-8")

          print(json.dumps(bridge_report, ensure_ascii=False, indent=2))
          PY

      - name: Validate CJ hub and Find search bridge
        shell: bash
        run: |
          set -euo pipefail

          node --check js/cj-partner-hub.js
          node --check js/site-v13-5.js
          git diff --check

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          hub = json.loads(Path("data/cj-partner-hub.json").read_text(encoding="utf-8"))
          report = json.loads(
              Path("data/cj-partner-hub-report.json").read_text(encoding="utf-8")
          )
          products = json.loads(Path("data/cj-products.json").read_text(encoding="utf-8"))
          offers = json.loads(Path("data/cj-offers.json").read_text(encoding="utf-8"))
          bridge = json.loads(
              Path("data/cj-search-bridge-report.json").read_text(encoding="utf-8")
          )
          page = Path("cj-partners/index.html").read_text(encoding="utf-8")
          find_page = Path("find/index.html").read_text(encoding="utf-8")
          site_script = Path("js/site-v13-5.js").read_text(encoding="utf-8")

          approved = {
              "2357926",
              "7287203",
              "5893489",
              "7227612",
              "4837117",
              "4295086",
              "4368684",
          }

          assert hub["version"] == "13.8.15"
          assert hub["approvedPartnerCount"] == 7
          assert {row["advertiserId"] for row in report["approvedAdvertisers"]} == approved
          assert all(row["advertiserId"] in approved for row in products["products"])
          assert all(row["advertiserId"] in approved for row in offers["offers"])
          assert all(row.get("group") and row.get("family") for row in products["products"])
          assert "/js/cj-partner-hub.js?v=13.8.15" in page
          assert "CJ partner hub" in page
          assert "personal access token" not in page.lower()

          assert "TP_CJ_SEARCH_BRIDGE_START" in site_script
          assert "loadCjProducts()" in site_script
          assert "mergeProducts([...rows,...cjRows])" in site_script
          assert "cjProducts.find(p=>p.id===id)" in site_script
          assert '"all","popular"' in site_script
          assert "/js/site-v13-5.js?v=13.8.15" in find_page
          assert bridge["productsFetched"] == len(products["products"])
          assert bridge["searchEligibleProducts"] >= 0

          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          assert "js/site-v13-5.js" in changed, changed
          assert "find/index.html" in changed, changed
          assert not any(path.startswith("data/search-catalog/") for path in changed), changed

          summary = {
              "validation": "passed",
              "status": hub["status"],
              "productsFetched": len(products["products"]),
              "searchEligibleProducts": bridge["searchEligibleProducts"],
              "searchEligibleSellers": bridge["searchEligibleSellers"],
              "offers": len(offers["offers"]),
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          with Path("/tmp/cj-action-summary.md").open("w", encoding="utf-8") as handle:
              handle.write("## TrendPilot V13.8.15 CJ result\n\n")
              handle.write(f"- Products fetched: **{summary['productsFetched']}**\n")
              handle.write(
                  f"- Search-eligible products: **{summary['searchEligibleProducts']}**\n"
              )
              handle.write(
                  "- Sellers added to Find: **"
                  + (", ".join(summary["searchEligibleSellers"]) or "none returned with complete product evidence")
                  + "**\n"
              )
              handle.write(f"- Joined offers: **{summary['offers']}**\n")
          PY

          cat /tmp/cj-action-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cj-partner-hub.json
          git add data/cj-partner-hub-report.json
          git add data/cj-products.json
          git add data/cj-offers.json
          git add data/cj-search-bridge-report.json
          git add js/cj-partner-hub.js
          git add js/site-v13-5.js
          git add find/index.html
          git add product/index.html 2>/dev/null || true
          git add cj-partners/index.html
          git add deals/index.html 2>/dev/null || true
          git add sitemap.xml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No CJ hub changes to commit."
            exit 0
          fi

          git commit -m "feat: load real CJ products into Find search"

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 4))
          done

          echo "Unable to push after three attempts."
          exit 1
