name: TrendPilot V20.9.2 — Residual Classification Candidate

on:
  push:
    branches:
      - v20-9-all-product-quality-gate
    paths:
      - scripts/refine-v20-9-2-residual-unclassified.py
      - .github/workflows/trendpilot-v20-9-2-residual-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild source projection and established guards
        run: |
          python scripts/build-v20-8-universal-discovery.py
          python scripts/clean-v20-8-universal-output.py
          python scripts/clean-v20-8-brand-truth.py
          python scripts/quality-gate-v20-9-all-products.py

      - name: Apply V20.9.2 high-confidence residual pass
        run: python scripts/refine-v20-9-2-residual-unclassified.py

      - name: Export, audit and Rare closeout
        run: |
          python scripts/export-v20-9-runtime-data.py
          python scripts/audit-v20-9-all-products.py
          python scripts/finalize-v20-8-9-rare-closeout.py
          python scripts/qa-v20-9-product-smoke.py

      - name: Residual semantic and safety QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/refine-v20-9-2-residual-unclassified.py
          node --check js/universal-discovery-v20-9-1.js
          node --check js/finder-shell-v20-9.js
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/v20-9/residual-report.json').read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          q=json.loads(Path('data/v20-9/quality-report.json').read_text())
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text())
          assert r['records']==52031
          assert r['unclassifiedBeforeResidual']==3388, r['unclassifiedBeforeResidual']
          assert 0 < r['classifiedByResidual'] < 2000, r['classifiedByResidual']
          assert r['unclassifiedAfterResidual']==d['unclassified']
          assert d['unclassified']<3388
          assert q['blockedSellerLeaks']==0
          assert q['immutableCommerceFieldsChanged']==0
          assert rt['productBuckets']==256
          for k in ('phoneNonMain','tabletNonMain','laptopNonMain','smartwatchNonMain','headphonesNonMain'):
              assert d['roleAnomalies'][k]['count']==0, (k,d['roleAnomalies'][k]['count'])
          print('PASS V20.9.2 residual candidate',r['classifiedByResidual'],'additional classifications; remaining',d['unclassified'])
          PY
          if git status --short | grep -E 'data/catalog-v19|data/.*(tpid|tpvid|tpoid|identity)'; then
            echo 'Unexpected V19 identity/canonical mutation'
            exit 1
          fi

      - name: Write residual summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('data/v20-9/residual-report.json')
          if not p.exists():
              print('# V20.9.2 residual report unavailable')
              raise SystemExit
          r=json.loads(p.read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          print('# TrendPilot V20.9.2 — Residual Classification Candidate')
          print()
          print(f"- Unclassified entering residual pass: **{r['unclassifiedBeforeResidual']:,}**")
          print(f"- Additional high-confidence classifications: **{r['classifiedByResidual']:,}**")
          print(f"- Remaining intentionally unclassified: **{r['unclassifiedAfterResidual']:,} ({round(100*r['unclassifiedAfterResidual']/r['records'],2)}%)**")
          print()
          print('## Residual classifications')
          for ty,n in r['byType']:
              print(f'- {ty}: **{n:,}**')
          print()
          print(f"- Strong accessory grammar still marked main: **{d['roleAnomalies']['mainWithStrongAccessoryGrammar']['count']:,}**")
          print(f"- Strong replacement grammar still marked main: **{d['roleAnomalies']['mainWithStrongReplacementGrammar']['count']:,}**")
          print('- V19 identity/canonical catalogs changed: **NO**')
          PY
