name: TrendPilot CJ Ticket + Travel Link Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cj-ticket-travel-link-audit.yml'

permissions:
  contents: write

jobs:
  audit-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
      CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
      CJ_PAT: ${{ secrets.CJ_PAT }}
      CJ_PERSONAL_ACCESS_TOKEN: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}
      CJ_WEBSITE_PID: ${{ secrets.CJ_WEBSITE_PID }}
      CJ_PID: ${{ secrets.CJ_PID }}
      CJ_WEBSITE_ID: ${{ secrets.CJ_WEBSITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Query CJ Link Search safely
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          def first(*names):
              for n in names:
                  v=(os.environ.get(n) or '').strip()
                  if v:
                      return v
              return ''

          token=first('CJ_API_TOKEN','CJ_TOKEN','CJ_PAT','CJ_PERSONAL_ACCESS_TOKEN')
          pid=first('CJ_WEBSITE_PID','CJ_PID','CJ_WEBSITE_ID') or '100655394'
          if not token:
              raise SystemExit('CJ token is unavailable in GitHub Secrets')

          advertisers=[
              {'name':'Sports Events 365','id':'7753674','purpose':'tickets'},
              {'name':'Trip.com (Global)','id':'4368684','purpose':'travel'},
          ]

          def text(el, name):
              x=el.find(name)
              return (x.text or '').strip() if x is not None else ''

          def request_links(advertiser_id):
              qs=urllib.parse.urlencode({
                  'website-id': pid,
                  'advertiser-ids': advertiser_id,
                  'records-per-page': '100',
                  'page-number': '1',
              })
              url='https://link-search.api.cj.com/v2/link-search?'+qs
              req=urllib.request.Request(url, headers={
                  'Authorization':'Bearer '+token,
                  'Accept':'application/xml',
                  'User-Agent':'TrendPilot-CJ-Ticket-Travel-Audit/1.0',
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw=r.read().decode('utf-8','replace')
                      status=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  return {'http_status':e.code,'error_preview':raw[:500],'links':[]}
              root=ET.fromstring(raw)
              rows=[]
              for el in root.findall('.//link'):
                  row={
                      'advertiser_id':text(el,'advertiser-id'),
                      'advertiser_name':text(el,'advertiser-name'),
                      'relationship_status':text(el,'relationship-status'),
                      'link_id':text(el,'link-id'),
                      'link_name':text(el,'link-name'),
                      'link_type':text(el,'link-type'),
                      'allow_deep_linking':text(el,'allow-deep-linking'),
                      'click_url':text(el,'click-url'),
                      'destination':text(el,'destination'),
                      'targeted_countries':text(el,'targeted-countries'),
                      'sale_commission':text(el,'sale-commission'),
                      'seven_day_epc':text(el,'seven-day-epc'),
                      'three_month_epc':text(el,'three-month-epc'),
                  }
                  if not row['click_url']:
                      html=text(el,'link-code-html')
                      if html:
                          import re, html as h
                          m=re.search(r'href=[\"\']([^\"\']+)',html,re.I)
                          if m: row['click_url']=h.unescape(m.group(1))
                  rows.append(row)
              return {
                  'http_status':status,
                  'total_matched':root.attrib.get('total-matched') or root.attrib.get('total-results') or '',
                  'records_returned':len(rows),
                  'links':rows,
              }

          result={
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'website_pid':pid,
              'source':'CJ Link Search API v2',
              'advertisers':[]
          }
          for adv in advertisers:
              audit=request_links(adv['id'])
              links=audit.get('links',[])
              joined=[x for x in links if x.get('relationship_status','').lower()=='joined']
              deep=[x for x in joined if x.get('allow_deep_linking','').lower() in ('true','yes','1')]
              tracked=[x for x in joined if x.get('click_url')]
              # Store a compact public-safe selection; never write the token.
              preferred=(deep or tracked or joined or links)[:10]
              result['advertisers'].append({
                  **adv,
                  'http_status':audit.get('http_status'),
                  'total_matched':audit.get('total_matched',''),
                  'records_returned':audit.get('records_returned',0),
                  'joined_links':len(joined),
                  'deep_linkable_links':len(deep),
                  'tracked_links':len(tracked),
                  'preferred_links':preferred,
                  'error_preview':audit.get('error_preview','')
              })

          os.makedirs('data/runtime',exist_ok=True)
          with open('data/runtime/cj-ticket-travel-link-audit.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          print(json.dumps({
              'website_pid':pid,
              'summary':[{k:a[k] for k in ('name','http_status','records_returned','joined_links','deep_linkable_links','tracked_links')} for a in result['advertisers']]
          },ensure_ascii=False,indent=2))
          PY

      - name: Commit audit result
        shell: bash
        run: |
          git config user.name 'trendpilot-cj-audit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/cj-ticket-travel-link-audit.json
          if git diff --cached --quiet; then
            echo 'No audit changes.'
            exit 0
          fi
          git commit -m 'chore: update CJ ticket and travel link audit'
          git push
