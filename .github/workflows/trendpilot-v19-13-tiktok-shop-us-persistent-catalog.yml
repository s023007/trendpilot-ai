name: TrendPilot V19.13 — Seller 13 TikTok Shop US Persistent Catalog

on:
  workflow_dispatch:
    inputs:
      seed_batch_size:
        description: "CJ catalog discovery queries per run. Default 80; checkpoint resumes automatically."
        required: false
        default: "80"

permissions:
  contents: write

concurrency:
  group: trendpilot-v19-13-tiktok-shop-us
  cancel-in-progress: false

jobs:
  seller-13-tiktok:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VERSION: "19.13.0"
      SELLER: "TikTok Shop US"
      SELLER_SLUG: "tiktok-shop-us"
      EXPECTED_ADVERTISER_ID: "7563286"
      FALLBACK_AD_ID: "17099898"
      CJ_API_TOKEN_PRIMARY: ${{ secrets.CJ_API_TOKEN }}
      CJ_API_TOKEN_ALT1: ${{ secrets.CJ_TOKEN }}
      CJ_API_TOKEN_ALT2: ${{ secrets.CJ_PAT }}
      CJ_API_TOKEN_ALT3: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}
      CJ_COMPANY_ID_PRIMARY: ${{ secrets.CJ_COMPANY_ID }}
      CJ_COMPANY_ID_ALT1: ${{ secrets.CJ_CID }}
      CJ_COMPANY_ID_ALT2: ${{ secrets.CJ_PUBLISHER_CID }}
      CJ_WEBSITE_PID_PRIMARY: ${{ secrets.CJ_WEBSITE_PID }}
      CJ_WEBSITE_PID_ALT1: ${{ secrets.CJ_PID }}
      CJ_WEBSITE_PID_ALT2: ${{ secrets.CJ_WEBSITE_ID }}
      SEED_BATCH_SIZE: "${{ inputs.seed_batch_size || '80' }}"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Verify Seller 12 final state and TikTok policy
        shell: bash
        run: |
          set -euo pipefail
          test -s data/catalog-v19/catalog-set-v1.json
          test -s data/catalog-v19/seller-build-queue-v3.json
          test -s data/product-seller-registry-v17.json
          test -s scripts/catalog-v19/build-canonical-seller.mjs
          test -s scripts/catalog-v19/discover-seller-sources.mjs
          test -s scripts/catalog-v19/build-global-resolver.mjs
          test -s scripts/catalog-v19/build-source-aware-seller-queue.mjs
          test -s netlify/functions/cj-live-products.mjs

          python3 - <<'PY'
          from pathlib import Path
          import json

          registry=json.loads(Path("data/product-seller-registry-v17.json").read_text())
          public={x["name"]:x for x in registry["sellers"] if x.get("public")}
          assert "TikTok Shop US" in public, public
          assert public["TikTok Shop US"].get("network") == "CJ"
          assert public["TikTok Shop US"].get("mode") == "live"
          for blocked in ["Temu","Joom","FilamentPRO EU CPS"]:
              assert blocked not in public, blocked

          catalog=json.loads(Path("data/catalog-v19/catalog-set-v1.json").read_text())
          names=[x["name"] for x in catalog["sellers"]]
          assert len(names) == 12, names
          assert names[-1] == "Lenovo", names
          assert "TikTok Shop US" not in names
          assert len(names) == len(set(names))

          queue=json.loads(Path("data/catalog-v19/seller-build-queue-v3.json").read_text())
          remaining=[x for x in queue.get("remaining",[]) if x.get("seller")=="TikTok Shop US"]
          assert len(remaining)==1, queue
          assert int(remaining[0].get("qualifiedProducts",0))==0

          print("V19 Seller 13 preflight PASS.")
          print("Validated catalogs:", len(names))
          print("Next seller: TikTok Shop US")
          PY

      - name: Prepare TikTok checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trendpilot-tiktok-cache /tmp/tiktok-v19 data/source-ingestion-v19 data/catalog-v19/source-ingestion

      - name: Restore latest TikTok checkpoint
        id: restore_checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .trendpilot-tiktok-cache
          key: trendpilot-tiktok-v19-13-${{ github.run_id }}
          restore-keys: |
            trendpilot-tiktok-v19-13-

      - name: Resolve CJ TikTok configuration and promotions
        id: cj
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs');

          const clean=v=>String(v??'').trim();
          const first=(...names)=>{
            for(const n of names){
              const v=clean(process.env[n]);
              if(v) return v;
            }
            return '';
          };

          const token=first('CJ_API_TOKEN_PRIMARY','CJ_API_TOKEN_ALT1','CJ_API_TOKEN_ALT2','CJ_API_TOKEN_ALT3');
          if(!token) throw new Error('Missing CJ API token secret.');

          const companyId=first('CJ_COMPANY_ID_PRIMARY','CJ_COMPANY_ID_ALT1','CJ_COMPANY_ID_ALT2') || '5917965';
          const pid=first('CJ_WEBSITE_PID_PRIMARY','CJ_WEBSITE_PID_ALT1','CJ_WEBSITE_PID_ALT2') || '100655394';
          const expected=clean(process.env.EXPECTED_ADVERTISER_ID);

          const live=fs.readFileSync('netlify/functions/cj-live-products.mjs','utf8');
          const block=live.match(/"TikTok Shop US"\s*:\s*\{([\s\S]*?)\}/);
          if(!block) throw new Error('TikTok Shop US is missing from the current CJ live function.');

          const advertiser=(block[1].match(/advertiserId\s*:\s*"(\d+)"/)||[])[1] || '';
          const adBlock=(block[1].match(/adIds\s*:\s*\[([^\]]*)\]/)||[])[1] || '';
          let adIds=[...adBlock.matchAll(/"(\d+)"/g)].map(x=>x[1]);
          if(!adIds.length) adIds=[clean(process.env.FALLBACK_AD_ID)].filter(Boolean);

          if(advertiser!==expected) throw new Error(`TikTok advertiser mismatch: ${advertiser} != ${expected}`);
          if(!adIds.length) throw new Error('No TikTok CJ ad ID is available.');

          const runtime={token,companyId,pid,advertiserId:advertiser,adIds};
          fs.writeFileSync('/tmp/tiktok-v19/runtime.json',JSON.stringify(runtime));

          const trackingHosts=/(?:^|\.)(?:anrdoezrs\.net|apmebf\.com|awltovhc\.com|commission-junction\.com|dpbolvw\.net|emjcd\.com|ftjcfx\.com|jdoqocy\.com|kqzyfj\.com|lduhtrp\.net|qksrv\.net|tkqlhce\.com)$/i;
          const decode=s=>String(s||'').replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,'$1').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
          const field=(block,names)=>{
            for(const n of names){
              const m=String(block).match(new RegExp(`<${n}[^>]*>([\\s\\S]*?)<\\/${n}>`,'i'));
              if(m) return clean(decode(m[1]));
            }
            return '';
          };

          async function loadPromotions(){
            const out=[];
            for(let page=1;page<=4;page++){
              const params=new URLSearchParams({
                'website-id':pid,
                'advertiser-ids':advertiser,
                'records-per-page':'100',
                'page-number':String(page)
              });
              let r;
              try{
                r=await fetch(`https://link-search.api.cj.com/v2/link-search?${params}`,{
                  headers:{authorization:`Bearer ${token}`,accept:'application/xml,text/xml;q=0.9,*/*;q=0.5','user-agent':'TrendPilot-TikTok-V19.13/1.0'}
                });
              }catch{break}
              if(!r.ok) break;
              const xml=await r.text();
              const blocks=xml.match(/<link\b[\s\S]*?<\/link>/gi)||[];
              if(!blocks.length) break;
              for(const b of blocks){
                const adv=field(b,['advertiser-id','advertiserId']);
                if(adv && adv!==advertiser) continue;
                const clickUrl=field(b,['clickUrl','click-url','clickurl']);
                let tracked=false;
                try{tracked=trackingHosts.test(new URL(clickUrl).hostname)}catch{}
                out.push({
                  advertiserId:adv||advertiser,
                  linkId:field(b,['link-id','linkId']),
                  name:field(b,['link-name','linkName']),
                  description:field(b,['description','ad-content']),
                  promotionType:field(b,['promotion-type','promotionType']),
                  promotionStartDate:field(b,['promotion-start-date','promotionStartDate']),
                  promotionEndDate:field(b,['promotion-end-date','promotionEndDate']),
                  clickUrl:tracked?clickUrl:'',
                  destination:field(b,['destination'])
                });
              }
              if(blocks.length<100) break;
            }
            return out;
          }

          loadPromotions().then(promotions=>{
            fs.writeFileSync('.trendpilot-tiktok-cache/promotions.json',JSON.stringify(promotions,null,2)+'\n');
            fs.writeFileSync('.trendpilot-tiktok-cache/cj-runtime-audit.json',JSON.stringify({
              version:process.env.VERSION,
              seller:process.env.SELLER,
              advertiserId:advertiser,
              adIds,
              companyId,
              pidMasked:'*'.repeat(Math.max(0,pid.length-4))+pid.slice(-4),
              promotionsFound:promotions.length,
              productTrackingPolicy:'strict CJ product linkCode only',
              cpc:false
            },null,2)+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`advertiser_id=${advertiser}\nad_ids=${adIds.join(',')}\npromotions=${promotions.length}\n`);
            console.log(`TikTok CJ config PASS: advertiser ${advertiser}; ad IDs ${adIds.join(', ')}; promotions ${promotions.length}`);
          }).catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Build one resumable TikTok live-catalog batch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/tiktok-v19/batch.mjs <<'JS'
          import fs from 'node:fs';

          const VERSION=process.env.VERSION;
          const SELLER=process.env.SELLER;
          const cache='.trendpilot-tiktok-cache';
          const runtime=JSON.parse(fs.readFileSync('/tmp/tiktok-v19/runtime.json','utf8'));
          const requested=Math.max(10,Math.min(120,Number(process.env.SEED_BATCH_SIZE||80)));

          const seeds=[
            '',
            'electronics','smartphone','mobile phone','android phone','iphone','phone','phone case','screen protector','charger','wireless charger','power bank','usb cable','type c cable',
            'earbuds','wireless earbuds','headphones','bluetooth headphones','speaker','bluetooth speaker','microphone','smartwatch','smart watch','watch','tablet','laptop','computer','keyboard','mouse','webcam','camera','security camera','projector','monitor','gaming','game controller','ssd','memory card','usb hub',
            'home','home decor','kitchen','cookware','pan','pot','knife','cutting board','blender','mixer','coffee maker','coffee','air fryer','toaster','vacuum','robot vacuum','cleaning','storage organizer','furniture','bedding','pillow','blanket','curtain',
            'lighting','led light','lamp','desk lamp','floor lamp','fan','portable fan','heater','air conditioner','humidifier','dehumidifier',
            'beauty','skincare','skin care','makeup','cosmetics','foundation','lipstick','mascara','perfume','fragrance','hair dryer','hair straightener','hair curler','shampoo','nail',
            'jewelry','necklace','bracelet','ring','earrings','accessories',
            'clothing','dress','shirt','t shirt','pants','jeans','jacket','hoodie','sweater','coat','shoes','sneakers','sandals','boots','bag','handbag','backpack','wallet','sunglasses','hat',
            'baby','kids','toy','toys','educational toy','building blocks','doll','remote control car',
            'pet','pet supplies','dog','cat','dog food','cat food','dog treats','pet feeder','pet bed','pet toy',
            'fitness','gym','yoga','exercise','resistance bands','dumbbell','massage','massager','outdoor','camping','hiking','travel','luggage','car accessories','car charger','car vacuum',
            'tools','drill','screwdriver','wrench','tool set','measuring tool','garden','gardening',
            'office','stationery','printer','label maker','desk organizer',
            'gift','gifts','craft','diy','art','painting','sewing'
          ];

          const stateFile=`${cache}/progress.json`;
          const productsFile=`${cache}/products.json`;
          const failuresFile=`${cache}/failed-queries.json`;
          const read=(p,f)=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return f}};
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const clean=v=>String(v??'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();

          const trackingHosts=/(?:^|\.)(?:anrdoezrs\.net|apmebf\.com|awltovhc\.com|commission-junction\.com|dpbolvw\.net|emjcd\.com|ftjcfx\.com|jdoqocy\.com|kqzyfj\.com|lduhtrp\.net|qksrv\.net|tkqlhce\.com)$/i;
          const validHttp=v=>{try{const u=new URL(clean(v));return /^https?:$/.test(u.protocol)}catch{return false}};
          const tracked=v=>{try{return validHttp(v)&&trackingHosts.test(new URL(v).hostname)}catch{return false}};
          const restricted=/\b(?:firearm|ammunition|rifle|handgun|pistol|gun parts?|vape|vaping|e-cigarette|nicotine|cannabis|marijuana|thc\b|cbd\b|sex toy|vibrator|dildo|porn(?:ography)?|liquor|whiskey|vodka|beer|wine)\b/i;

          let state=read(stateFile,{version:VERSION,nextSeed:0,totalSeeds:seeds.length,processedSeeds:0,rawRows:0,acceptedRows:0,queryFailures:0,runs:0,complete:false});
          if(state.totalSeeds!==seeds.length){
            state.totalSeeds=seeds.length;
            state.nextSeed=Math.min(Number(state.nextSeed||0),seeds.length);
          }
          const productMap=new Map(read(productsFile,[]).map(x=>[`${x.catalogId}|${x.sourceProductId}`,x]));
          const failed=read(failuresFile,[]);

          function selection(seed){
            const keywordArg=seed ? `keywords: [${JSON.stringify(seed)}]` : '';
            const adIds=runtime.adIds.join(', ');
            return `query TrendPilotTikTokCatalog {
              shoppingProducts(
                companyId: ${runtime.companyId}
                adIds: [${adIds}]
                ${keywordArg}
                limit: 80
              ) {
                totalCount
                count
                resultList {
                  advertiserId
                  advertiserName
                  catalogId
                  id
                  title
                  description
                  link
                  imageLink
                  brand
                  availability
                  condition
                  price { amount currency }
                  linkCode(pid: ${JSON.stringify(runtime.pid)}) { clickUrl }
                }
              }
            }`;
          }

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function querySeed(seed){
            let last='';
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const controller=new AbortController();
                const timer=setTimeout(()=>controller.abort(),12000);
                const r=await fetch('https://ads.api.cj.com/query',{
                  method:'POST',
                  headers:{
                    authorization:`Bearer ${runtime.token}`,
                    'content-type':'application/json',
                    accept:'application/json',
                    'user-agent':'TrendPilot-TikTok-Persistent-Catalog/19.13.0'
                  },
                  body:JSON.stringify({query:selection(seed)}),
                  signal:controller.signal
                });
                clearTimeout(timer);
                const raw=await r.text();
                let payload;
                try{payload=JSON.parse(raw)}catch{throw new Error(`non-JSON HTTP ${r.status}`)}
                if(!r.ok) throw new Error(`HTTP ${r.status}`);
                if(payload.errors?.length) throw new Error(payload.errors.map(x=>x.message).join(' | ').slice(0,500));
                return payload?.data?.shoppingProducts || {totalCount:0,count:0,resultList:[]};
              }catch(e){
                last=String(e?.message||e);
                if(attempt<3) await sleep(500*attempt);
              }
            }
            throw new Error(last||'CJ query failed');
          }

          function normalize(row,seed){
            if(clean(row?.advertiserId)!==runtime.advertiserId) return null;
            const title=clean(row?.title);
            const id=clean(row?.id);
            const catalogId=clean(row?.catalogId);
            const image=clean(row?.imageLink);
            const affiliateUrl=clean(row?.linkCode?.clickUrl);
            const destinationUrl=clean(row?.link);
            const price=Number(row?.price?.amount||0);
            if(!title||!id||!catalogId||!validHttp(image)||!tracked(affiliateUrl)||!Number.isFinite(price)||price<=0) return null;
            if(restricted.test(`${title} ${clean(row?.description)}`)) return null;
            return {
              seller:SELLER,
              advertiser:SELLER,
              advertiserId:runtime.advertiserId,
              sourceProductId:id,
              id,
              sku:id,
              catalogId,
              title,
              description:clean(row?.description),
              brand:clean(row?.brand),
              category:'',
              subcategory:'',
              price,
              currency:clean(row?.price?.currency)||'USD',
              imageUrl:image,
              affiliateUrl,
              destinationUrl:validHttp(destinationUrl)?destinationUrl:'',
              condition:clean(row?.condition)||'new',
              availability:clean(row?.availability),
              network:'CJ',
              source:'CJ Shopping Products API — TikTok Shop US persistent live catalog',
              quality:96,
              discoverySeed:seed||'(catalog probe)'
            };
          }

          const start=Math.min(Number(state.nextSeed||0),seeds.length);
          const end=Math.min(seeds.length,start+requested);
          const batch=seeds.slice(start,end);
          const groupSize=4;

          for(let base=0;base<batch.length;base+=groupSize){
            const group=batch.slice(base,base+groupSize);
            const results=await Promise.all(group.map(async seed=>{
              try{return {seed,result:await querySeed(seed),error:''}}
              catch(e){return {seed,result:null,error:String(e?.message||e).slice(0,300)}}
            }));
            for(const item of results){
              state.processedSeeds++;
              if(item.error){
                state.queryFailures++;
                failed.push({seed:item.seed,error:item.error,at:new Date().toISOString()});
                continue;
              }
              const rows=Array.isArray(item.result?.resultList)?item.result.resultList:[];
              state.rawRows+=rows.length;
              for(const raw of rows){
                const row=normalize(raw,item.seed);
                if(!row) continue;
                const key=`${row.catalogId}|${row.sourceProductId}`;
                const old=productMap.get(key);
                if(!old || (!old.brand && row.brand) || (!old.destinationUrl && row.destinationUrl)) productMap.set(key,row);
              }
            }
            await sleep(180);
          }

          state.nextSeed=end;
          state.acceptedRows=productMap.size;
          state.complete=end>=seeds.length;
          state.runs=Number(state.runs||0)+1;
          state.updatedAt=new Date().toISOString();

          write(productsFile,[...productMap.values()].sort((a,b)=>a.title.localeCompare(b.title)||a.sourceProductId.localeCompare(b.sourceProductId)));
          write(failuresFile,failed);
          write(stateFile,state);

          if(state.complete){
            fs.mkdirSync('data/source-ingestion-v19',{recursive:true});
            const products=[...productMap.values()].sort((a,b)=>a.title.localeCompare(b.title)||a.sourceProductId.localeCompare(b.sourceProductId));
            write('data/source-ingestion-v19/tiktok-shop-us-live-catalog.json',{
              version:VERSION,
              seller:SELLER,
              advertiserId:runtime.advertiserId,
              source:'CJ Shopping Products API persistent seed sweep',
              generatedAt:new Date().toISOString(),
              products
            });
            if(fs.existsSync(`${cache}/promotions.json`)){
              fs.copyFileSync(`${cache}/promotions.json`,'data/catalog-v19/source-ingestion/tiktok-shop-us-promotions.json');
            }
            if(fs.existsSync(`${cache}/cj-runtime-audit.json`)){
              fs.copyFileSync(`${cache}/cj-runtime-audit.json`,'data/catalog-v19/source-ingestion/tiktok-shop-us-cj-audit.json');
            }
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `complete=${state.complete}\nprocessed=${state.processedSeeds}\nremaining=${Math.max(0,seeds.length-end)}\nproducts=${productMap.size}\nfailures=${state.queryFailures}\ntotal_seeds=${seeds.length}\n`
          );

          console.log(JSON.stringify({
            totalSeeds:seeds.length,
            processedSeeds:state.processedSeeds,
            remainingSeeds:Math.max(0,seeds.length-end),
            rawRowsSeen:state.rawRows,
            persistentProducts:productMap.size,
            queryFailures:state.queryFailures,
            complete:state.complete
          },null,2));
          JS

          node /tmp/tiktok-v19/batch.mjs

      - name: Save TikTok checkpoint
        uses: actions/cache/save@v4
        with:
          path: .trendpilot-tiktok-cache
          key: trendpilot-tiktok-v19-13-${{ github.run_id }}

      - name: Build Seller 13 canonical catalog
        if: steps.source.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail

          node scripts/catalog-v19/discover-seller-sources.mjs \
            --seller="TikTok Shop US" \
            --slug="tiktok-shop-us" \
            --version="$VERSION"

          node scripts/catalog-v19/build-canonical-seller.mjs \
            --seller="TikTok Shop US" \
            --slug="tiktok-shop-us" \
            --version="$VERSION" \
            --source-manifest="data/catalog-v19/source-manifests/tiktok-shop-us.json"

      - name: Hard validate TikTok canonical catalog
        if: steps.source.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root=Path("data/catalog-v19/sellers/tiktok-shop-us")
          manifest=json.loads((root/"manifest.json").read_text())
          audit=json.loads((root/"audit.json").read_text())
          products=[json.loads(x) for x in (root/"products.ndjson").read_text().splitlines() if x.strip()]

          assert manifest["seller"]["name"]=="TikTok Shop US"
          assert manifest["seller"]["network"]=="CJ"
          assert len(products)>=100, len(products)
          assert len(products)==manifest["metrics"]["totalProducts"]
          assert manifest["fillRates"]["sourceQualified"]["percent"]==100
          assert manifest["fillRates"]["stableSellerId"]["percent"]>=99
          assert manifest["fillRates"]["price"]["percent"]>=99
          assert manifest["fillRates"]["image"]["percent"]>=99
          assert manifest["fillRates"]["link"]["percent"]>=99
          assert not audit.get("blockedSellerLeak")
          assert not audit.get("sourceLeak")
          assert not audit.get("duplicateProductKeys")

          for p in products:
              assert p["seller"]["name"]=="TikTok Shop US"
              assert p["offer"]["price"] is not None
              assert p["media"]["imageUrl"].startswith(("http://","https://"))
              assert p["links"]["affiliateUrl"].startswith(("http://","https://"))
              assert p["identifiers"]["sellerProductId"]

          print("TikTok Seller 13 hard validation PASS:",len(products))
          PY

      - name: Add TikTok to catalog set and rebuild resolver
        if: steps.source.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          version="19.13.0"
          set_path=Path("data/catalog-v19/catalog-set-v1.json")
          data=json.loads(set_path.read_text())
          sellers=list(data.get("sellers",[]))
          names=[x["name"] for x in sellers]

          assert len(names)==12, names
          assert "Lenovo" in names
          assert "TikTok Shop US" not in names
          sellers.append({"name":"TikTok Shop US","slug":"tiktok-shop-us"})
          data["version"]=version
          data["sellers"]=sellers
          set_path.write_text(json.dumps(data,indent=2)+"\n")

          for file in [
              Path("scripts/catalog-v19/build-global-resolver.mjs"),
              Path("scripts/catalog-v19/build-source-aware-seller-queue.mjs")
          ]:
              text=file.read_text()
              new,n=re.subn(r'const VERSION = "[^"]+";',f'const VERSION = "{version}";',text,count=1)
              assert n==1, f"VERSION assignment not found in {file}"
              file.write_text(new)
          PY

          node --check scripts/catalog-v19/build-global-resolver.mjs
          node --check scripts/catalog-v19/build-source-aware-seller-queue.mjs
          node scripts/catalog-v19/build-global-resolver.mjs
          node scripts/catalog-v19/build-source-aware-seller-queue.mjs

      - name: Validate thirteen-seller final state
        if: steps.source.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          catalog=json.loads(Path("data/catalog-v19/catalog-set-v1.json").read_text())
          names=[x["name"] for x in catalog["sellers"]]
          assert len(names)==13, names
          assert names[-1]=="TikTok Shop US", names
          assert len(names)==len(set(names))
          for blocked in ["Temu","Joom","FilamentPRO EU CPS"]:
              assert blocked not in names

          queue=json.loads(Path("data/catalog-v19/seller-build-queue-v3.json").read_text())
          assert queue.get("remaining",[])==[], queue

          resolver=json.loads(Path("data/catalog-v19/global-resolver-v1.json").read_text())
          total=int(resolver.get("totalCanonicalRecords",resolver.get("totalRecords",0)) or 0)
          if not total:
              text=Path("data/catalog-v19/global-resolver-v1.json").read_text()
              assert "TikTok Shop US" in text
          assert Path("data/catalog-v19/sellers/tiktok-shop-us/products.ndjson").stat().st_size>0

          print("V19.13 final catalog set PASS.")
          print("Validated sellers:",len(names))
          PY
          git diff --check

      - name: Commit Seller 13 only after final gate
        if: steps.source.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/source-ingestion-v19/tiktok-shop-us-live-catalog.json \
            data/catalog-v19/source-ingestion/tiktok-shop-us-promotions.json \
            data/catalog-v19/source-ingestion/tiktok-shop-us-cj-audit.json \
            data/catalog-v19/source-manifests/tiktok-shop-us.json \
            data/catalog-v19/sellers/tiktok-shop-us \
            data/catalog-v19/catalog-set-v1.json \
            data/catalog-v19/global-resolver-v1.json \
            data/catalog-v19/seller-build-queue-v3.json \
            scripts/catalog-v19/build-global-resolver.mjs \
            scripts/catalog-v19/build-source-aware-seller-queue.mjs

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Seller 13 final state is already committed."
          else
            git commit -m "catalog: add TikTok Shop US as V19 seller 13"
            git push origin HEAD:main
          fi

      - name: Publish concise V19.13 summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          COMPLETE="${{ steps.source.outputs.complete }}"
          PROCESSED="${{ steps.source.outputs.processed }}"
          REMAINING="${{ steps.source.outputs.remaining }}"
          PRODUCTS="${{ steps.source.outputs.products }}"
          FAILURES="${{ steps.source.outputs.failures }}"
          TOTAL_SEEDS="${{ steps.source.outputs.total_seeds }}"
          PROMOTIONS="${{ steps.cj.outputs.promotions }}"

          {
            echo "# TrendPilot V19.13 — Seller 13: TikTok Shop US"
            echo ""
            echo "Persistent CJ live-catalog ingestion using the same V19 seller schema. Visitor UI/search API are unchanged during incomplete checkpoints."
            echo ""
            echo "## CJ identity"
            echo "- Advertiser ID: **${{ steps.cj.outputs.advertiser_id }}**"
            echo "- Product ad IDs: **${{ steps.cj.outputs.ad_ids }}**"
            echo "- Tracking policy: **strict product linkCode**"
            echo "- Promotions/coupon-style links recorded: **${PROMOTIONS:-0}**"
            echo "- CPC: **not enabled**"
            echo ""
            echo "## Batch progress"
            echo "- Discovery seeds: **${TOTAL_SEEDS:-0}**"
            echo "- Processed: **${PROCESSED:-0}**"
            echo "- Remaining: **${REMAINING:-0}**"
            echo "- Persistent visitor-ready products so far: **${PRODUCTS:-0}**"
            echo "- CJ query failures: **${FAILURES:-0}**"
            echo ""
            if [ "$COMPLETE" = "true" ]; then
              python3 - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path("data/catalog-v19/sellers/tiktok-shop-us/manifest.json").read_text())
          r=json.loads(Path("data/catalog-v19/global-resolver-v1.json").read_text())
          print("## Seller 13 final gate")
          print("- **PASS — TikTok Shop US canonical catalog committed.**")
          print(f"- Canonical products: **{m['metrics']['totalProducts']:,}**")
          print(f"- Stable seller ID: **{m['fillRates']['stableSellerId']['percent']}%**")
          print(f"- Price: **{m['fillRates']['price']['percent']}%**")
          print(f"- Image: **{m['fillRates']['image']['percent']}%**")
          print(f"- Link: **{m['fillRates']['link']['percent']}%**")
          print("- Validated V19 seller catalogs: **13**")
          print("- Remaining approved sellers needing catalog ingestion: **0**")
          PY
            else
              echo "## TikTok batch gate"
              echo "**CHECKPOINT SAVED — not a production failure.**"
              echo ""
              echo "Run the same **V19.13** workflow again. It restores the checkpoint and continues with the next unprocessed discovery seed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact TikTok audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v19-13-tiktok-shop-us-audit
          retention-days: 14
          if-no-files-found: ignore
          path: |
            .trendpilot-tiktok-cache/progress.json
            .trendpilot-tiktok-cache/cj-runtime-audit.json
            .trendpilot-tiktok-cache/failed-queries.json
            data/catalog-v19/source-manifests/tiktok-shop-us.json
            data/catalog-v19/sellers/tiktok-shop-us/manifest.json
            data/catalog-v19/sellers/tiktok-shop-us/audit.json

      - name: Post Checkout latest main
        if: always()
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          clean: true
