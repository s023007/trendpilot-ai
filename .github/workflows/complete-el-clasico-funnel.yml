name: Complete El Clasico Funnel

on:
  push:
    branches: [main]
    paths:
      - 'scripts/complete_el_clasico_funnel.py'
      - '.github/workflows/complete-el-clasico-funnel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-el-clasico-funnel
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Apply El Clasico funnel completion
        run: python3 scripts/complete_el_clasico_funnel.py
      - name: Validate PHP
        run: |
          php -l api/save-search.php
          php -l api/go.php
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'trendpilot-el-clasico-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/save-search.php api/go.php events/el-clasico-2026/ar/index.html events/el-clasico-2026/en-gb/index.html
          git commit -m 'feat: complete El Clasico conversion funnel'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
