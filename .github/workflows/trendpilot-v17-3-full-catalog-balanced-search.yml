name: TrendPilot V17.3 Full Catalog + Balanced Search

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v17-3-full-catalog-balanced-search
  cancel-in-progress: false

jobs:
  rebuild-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V17.3 structural fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rebuild = Path("netlify/functions/products-v16-rebuild.mjs")
          base = Path("netlify/functions/products-v16.mjs")
          hybrid = Path("netlify/functions/products-v16-hybrid.mjs")
          health = Path("netlify/functions/products-v16-health.mjs")
          policy = Path("netlify/functions/product-seller-policy-v17.mjs")

          for p in (rebuild, base, hybrid, health, policy):
              if not p.exists():
                  raise SystemExit(f"Required file missing: {p}")

          policy_text = policy.read_text()
          if "Joom is intentionally excluded" not in policy_text:
              raise SystemExit("Seller policy guard missing; refusing to patch blindly.")
          public_block = policy_text.split("PUBLIC_PRODUCT_SELLER_NAMES", 1)[-1].split("]);", 1)[0]
          if '"Joom"' in public_block:
              raise SystemExit("Joom unexpectedly appears in the approved public seller list.")

          # ------------------------------------------------------------------
          # A) Rebuild: index ALL manifest catalogue files, not only 360.
          #    Keep the token posting cap at 1800, but allocate that cap fairly
          #    across approved sellers so a huge seller cannot erase smaller
          #    sellers before the seller filter is applied.
          # ------------------------------------------------------------------
          text = rebuild.read_text()
          if 'version: "17.2.0"' not in text or 'balancedCatalogPaths(paths, max = 360)' not in text:
              raise SystemExit("Unexpected rebuild source version/shape; no changes committed.")

          text = text.replace("17.2.0", "17.3.0")
          text = text.replace("balancedCatalogPaths(paths, max = 360)", "balancedCatalogPaths(paths, max = 3000)", 1)
          text = text.replace(
              "balancedCatalogPaths([...discoveredPaths].filter(path => !seeds.includes(path)), 360)",
              "balancedCatalogPaths([...discoveredPaths].filter(path => !seeds.includes(path)), 3000)",
              1,
          )
          text = text.replace("runLimited(extras, 6, async path => {", "runLimited(extras, 12, async path => {", 1)
          text = text.replace("windowLimit: 2", "windowLimit: 6", 1)

          posting_helper = '''
          // V17.3: seller-balanced posting lists. The total cap stays 1800.
          function balancedPostingRows(byProduct, max = 1800) {
            const groups = new Map();
            for (const row of byProduct.values()) {
              const seller = row?.seller || "(unknown seller)";
              if (!groups.has(seller)) groups.set(seller, []);
              groups.get(seller).push(row);
            }

            for (const rows of groups.values()) {
              rows.sort((a, b) => Number(b.score || 0) - Number(a.score || 0));
            }

            const sellerKeys = [...groups.keys()].sort((a, b) => {
              const as = Number(groups.get(a)?.[0]?.score || 0);
              const bs = Number(groups.get(b)?.[0]?.score || 0);
              return bs - as || a.localeCompare(b);
            });

            const out = [];
            let round = 0;
            while (out.length < max) {
              let added = false;
              for (const seller of sellerKeys) {
                const row = groups.get(seller)?.[round];
                if (!row) continue;
                out.push(row);
                added = true;
                if (out.length >= max) break;
              }
              if (!added) break;
              round += 1;
            }
            return out;
          }

          '''
          if "function balancedPostingRows(" not in text:
              marker = "export default async function handler(request) {"
              if marker not in text:
                  raise SystemExit("Rebuild handler marker not found.")
              text = text.replace(marker, posting_helper + marker, 1)

          old_postings = '''const rows = [...byProduct.values()]
                .sort((a, b) => b.score - a.score)
                .slice(0, 1800);'''
          if old_postings not in text:
              raise SystemExit("Old global posting truncation block not found.")
          text = text.replace(old_postings, "const rows = balancedPostingRows(byProduct, 1800);", 1)
          rebuild.write_text(text)

          # ------------------------------------------------------------------
          # B) Base search: keep relevance tiers intact, but within the SAME
          #    tier interleave sellers for All Sellers. Seller-selected search
          #    remains untouched/pure.
          # ------------------------------------------------------------------
          text = base.read_text()
          if 'const VERSION = "17.2.0";' not in text:
              raise SystemExit("Unexpected base search version; no blind patch.")
          text = text.replace("17.2.0", "17.3.0")

          diversity_helper = '''
          function diversifyBySellerWithinTier(rows) {
            const tiers = new Map();
            for (const row of rows) {
              const tier = Number(row?.intentTier || 0);
              if (!tiers.has(tier)) tiers.set(tier, []);
              tiers.get(tier).push(row);
            }

            const out = [];
            for (const tier of [...tiers.keys()].sort((a, b) => b - a)) {
              const groups = new Map();
              for (const row of tiers.get(tier)) {
                const key = lower(row?.seller || row?.advertiser || "(unknown seller)");
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(row);
              }

              const keys = [...groups.keys()].sort((a, b) => {
                const as = Number(groups.get(a)?.[0]?.matchScore || 0);
                const bs = Number(groups.get(b)?.[0]?.matchScore || 0);
                return bs - as || a.localeCompare(b);
              });

              let round = 0;
              while (true) {
                let added = false;
                for (const key of keys) {
                  const row = groups.get(key)?.[round];
                  if (!row) continue;
                  out.push(row);
                  added = true;
                }
                if (!added) break;
                round += 1;
              }
            }
            return out;
          }

          '''
          if "function diversifyBySellerWithinTier(" not in text:
              marker = "export default async function handler(request) {"
              if marker not in text:
                  raise SystemExit("Base search handler marker not found.")
              text = text.replace(marker, diversity_helper + marker, 1)

          old_page = "const paged = products.slice(offset, offset + limit);"
          if old_page not in text:
              raise SystemExit("Base pagination marker not found.")
          text = text.replace(
              old_page,
              "const displayProducts = seller ? products : diversifyBySellerWithinTier(products);\n"
              "    const paged = displayProducts.slice(offset, offset + limit);",
              1,
          )
          base.write_text(text)

          # ------------------------------------------------------------------
          # C) Hybrid final merge: use the same within-tier seller balancing so
          #    the hybrid layer does not undo the base-search balance.
          # ------------------------------------------------------------------
          text = hybrid.read_text()
          if 'const VERSION = "17.2.0";' not in text:
              raise SystemExit("Unexpected hybrid version; no blind patch.")
          text = text.replace("17.2.0", "17.3.0")

          if "function diversifyBySellerWithinTier(" not in text:
              marker = "function mergeAndRank(baseProducts, fallbackProducts, query, tokens, limit, offset) {"
              if marker not in text:
                  raise SystemExit("Hybrid merge marker not found.")
              text = text.replace(marker, diversity_helper + marker, 1)

          old_sig = "function mergeAndRank(baseProducts, fallbackProducts, query, tokens, limit, offset) {"
          new_sig = 'function mergeAndRank(baseProducts, fallbackProducts, query, tokens, limit, offset, sellerFilter = "") {'
          if old_sig not in text:
              raise SystemExit("Hybrid merge signature not found.")
          text = text.replace(old_sig, new_sig, 1)

          old_paged = "paged: rows.slice(offset, offset + limit)"
          if old_paged not in text:
              raise SystemExit("Hybrid paged marker not found.")
          text = text.replace(
              old_paged,
              "paged: (sellerFilter ? rows : diversifyBySellerWithinTier(rows)).slice(offset, offset + limit)",
              1,
          )

          old_call = '''      limit,
                offset
              );'''
          new_call = '''      limit,
                offset,
                seller
              );'''
          if old_call not in text:
              raise SystemExit("Hybrid merge call marker not found.")
          text = text.replace(old_call, new_call, 1)
          hybrid.write_text(text)

          # Health code version changes too. After the rebuild completes, meta
          # will also carry 17.3.0.
          text = health.read_text()
          if '"17.2.0"' not in text:
              raise SystemExit("Unexpected health source version.")
          health.write_text(text.replace("17.2.0", "17.3.0"))

          print("V17.3 structural patch applied.")
          PY

      - name: Static validation before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check netlify/functions/products-v16-rebuild.mjs
          node --check netlify/functions/products-v16.mjs
          node --check netlify/functions/products-v16-hybrid.mjs
          node --check netlify/functions/products-v16-health.mjs
          node --check netlify/functions/product-seller-policy-v17.mjs

          python3 - <<'PY'
          from pathlib import Path

          rebuild = Path("netlify/functions/products-v16-rebuild.mjs").read_text()
          base = Path("netlify/functions/products-v16.mjs").read_text()
          hybrid = Path("netlify/functions/products-v16-hybrid.mjs").read_text()
          policy = Path("netlify/functions/product-seller-policy-v17.mjs").read_text()

          assert "balancedCatalogPaths(paths, max = 3000)" in rebuild
          assert "balancedPostingRows(byProduct, 1800)" in rebuild
          assert "windowLimit: 6" in rebuild
          assert 'const VERSION = "17.3.0";' in base
          assert 'const VERSION = "17.3.0";' in hybrid
          assert "diversifyBySellerWithinTier" in base
          assert "diversifyBySellerWithinTier" in hybrid
          assert "Joom is intentionally excluded" in policy
          public_block = policy.split("PUBLIC_PRODUCT_SELLER_NAMES", 1)[-1].split("]);", 1)[0]
          assert '"Joom"' not in public_block
          print("Static validation PASS.")
          PY

      - name: Commit and push V17.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            netlify/functions/products-v16-rebuild.mjs \
            netlify/functions/products-v16.mjs \
            netlify/functions/products-v16-hybrid.mjs \
            netlify/functions/products-v16-health.mjs

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: full approved catalogue and seller-balanced V17.3 search"
            git push origin HEAD:main
          fi

      - name: Wait for Netlify to serve V17.3 code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, random, time, urllib.parse, urllib.request

          deadline = time.time() + 420
          last = None
          while time.time() < deadline:
              params = urllib.parse.urlencode({
                  "q": "phone",
                  "limit": "1",
                  "_deploycheck": f"{int(time.time())}-{random.randint(1000,9999)}",
              })
              url = "https://trendpilotchoice.com/api/products-v16?" + params
              try:
                  req = urllib.request.Request(url, headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                  })
                  with urllib.request.urlopen(req, timeout=25) as r:
                      data = json.loads(r.read().decode("utf-8", "replace"))
                  last = data
                  print("Deployed search version:", data.get("version"))
                  if str(data.get("version")) == "17.3.0":
                      print("Netlify is serving V17.3 code.")
                      break
              except Exception as exc:
                  print("Deploy check retry:", type(exc).__name__, str(exc)[:160])
              time.sleep(7)
          else:
              raise SystemExit(f"Netlify did not expose V17.3 search code in time. Last={last}")
          PY

      - name: Trigger ONE full V17.3 index rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import random, time, urllib.request

          url = (
              "https://trendpilotchoice.com/api/products-v16/rebuild"
              f"?_v=17.3.0&_once={int(time.time())}-{random.randint(1000,9999)}"
          )
          req = urllib.request.Request(url, headers={
              "Accept": "application/json",
              "Cache-Control": "no-cache",
          })
          with urllib.request.urlopen(req, timeout=45) as r:
              body = r.read(1000).decode("utf-8", "replace")
              print("Rebuild trigger HTTP", r.status)
              print(body)
              if r.status not in (200, 202):
                  raise SystemExit(f"Unexpected rebuild HTTP status: {r.status}")
          PY

      - name: Wait for V17.3 full index readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, random, time, urllib.parse, urllib.request

          deadline = time.time() + 1000
          last = None
          while time.time() < deadline:
              params = urllib.parse.urlencode({
                  "_indexcheck": f"{int(time.time())}-{random.randint(1000,9999)}"
              })
              url = "https://trendpilotchoice.com/api/products-v16/health?" + params
              try:
                  req = urllib.request.Request(url, headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                  })
                  with urllib.request.urlopen(req, timeout=25) as r:
                      data = json.loads(r.read().decode("utf-8", "replace"))
                  last = data
                  snap = {
                      "version": data.get("version"),
                      "status": data.get("status"),
                      "ready": data.get("ready"),
                      "products": data.get("products"),
                      "sellers": data.get("sellers"),
                      "catalogFilesDiscovered": data.get("catalogFilesDiscovered"),
                  }
                  print("Index:", snap)
                  if (
                      str(data.get("version")) == "17.3.0"
                      and data.get("ready") is True
                      and str(data.get("status")) == "ready"
                  ):
                      print("V17.3 full index is ready.")
                      break
              except Exception as exc:
                  print("Index check retry:", type(exc).__name__, str(exc)[:160])
              time.sleep(10)
          else:
              raise SystemExit(f"V17.3 index did not become ready in time. Last={last}")
          PY

      - name: Automated seller and search verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, random, time, urllib.parse, urllib.request
          from collections import Counter
          from pathlib import Path

          ORIGIN = "https://trendpilotchoice.com"
          APPROVED = [
              ("AliExpress", "phone"),
              ("Alibaba", "phone"),
              ("Geekbuying", "phone"),
              ("FilamentPRO EU CPS", "filament"),
              ("Govee Many GEOs", "light"),
              ("Harfington Many GEOs", "tool"),
              ("Sunsky-online WW", "phone"),
              ("Lenovo", "laptop"),
              ("Diecast", "model car"),
              ("FragranceShop.com", "perfume"),
              ("Karaca EU", "cookware"),
              ("MFI Medical", "medical"),
              ("PandaHall", "beads"),
              ("TikTok Shop US", "dog food"),
              ("Temu", "phone"),
          ]
          GENERAL = ["phone", "dog food", "laptop", "watch", "perfume", "power bank"]

          def get_json(path, params=None):
              params = dict(params or {})
              params["_cb"] = f"{int(time.time()*1000)}-{random.randint(1000,9999)}"
              url = ORIGIN + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "Cache-Control": "no-cache",
              })
              with urllib.request.urlopen(req, timeout=40) as r:
                  return json.loads(r.read().decode("utf-8", "replace"))

          health = get_json("/api/products-v16/health")

          general_rows = []
          for query in GENERAL:
              data = get_json("/api/products-v16-hybrid", {"q": query, "limit": 48})
              products = data.get("products") or []
              mix = Counter(
                  (p.get("seller") or p.get("advertiser") or "").strip()
                  for p in products
              )
              mix.pop("", None)
              general_rows.append({
                  "query": query,
                  "returned": len(products),
                  "core": int(data.get("coreCandidates") or 0),
                  "strong": int(data.get("strongCoreCandidates") or 0),
                  "seller_count": len(mix),
                  "mix": ", ".join(f"{k}:{v}" for k, v in mix.most_common()),
              })

          seller_rows = []
          for seller, query in APPROVED:
              data = get_json("/api/products-v16-hybrid", {
                  "q": query,
                  "seller": seller,
                  "limit": 48,
              })
              products = data.get("products") or []
              wrong = sorted({
                  (p.get("seller") or p.get("advertiser") or "").strip()
                  for p in products
                  if (p.get("seller") or p.get("advertiser") or "").strip() != seller
              })
              seller_rows.append({
                  "seller": seller,
                  "query": query,
                  "returned": len(products),
                  "core": int(data.get("coreCandidates") or 0),
                  "strong": int(data.get("strongCoreCandidates") or 0),
                  "fallback": bool(data.get("fallbackUsed")),
                  "wrong": wrong,
              })

          joom = get_json("/api/products-v16-hybrid", {
              "q": "phone",
              "seller": "Joom",
              "limit": 10,
          })
          joom_products = joom.get("products") or []

          lines = []
          lines.append("# TrendPilot V17.3 — Full Catalog + Balanced Search Verification")
          lines.append("")
          lines.append("This report is automatic. No manual website search is required.")
          lines.append("")
          lines.append("## Index")
          lines.append(f"- Ready: **{health.get('ready')}**")
          lines.append(f"- Version: **{health.get('version')}**")
          lines.append(f"- Indexed approved products: **{int(health.get('products') or 0):,}**")
          lines.append(f"- Indexed seller strings: **{int(health.get('sellers') or 0)}**")
          lines.append(f"- Catalogue files indexed: **{int(health.get('catalogFilesDiscovered') or 0):,}**")
          lines.append(f"- Joom blocked: **{'PASS' if not joom_products else 'FAIL'}**")
          lines.append("")

          lines.append("## Stored approved sellers")
          lines.append("| Seller | Products in index |")
          lines.append("|---|---:|")
          top_sellers = health.get("topSellers") or []
          counts = {str(x.get("seller") or ""): int(x.get("products") or 0) for x in top_sellers}
          for seller, _ in APPROVED:
              lines.append(f"| {seller} | {counts.get(seller, 0):,} |")
          lines.append("")

          lines.append("## General search")
          lines.append("| Query | Returned | Core 4+ | Strong 5 | Sellers in first 48 | Mix |")
          lines.append("|---|---:|---:|---:|---:|---|")
          for row in general_rows:
              lines.append(
                  f"| {row['query']} | {row['returned']} | {row['core']} | {row['strong']} | "
                  f"{row['seller_count']} | {row['mix'] or '—'} |"
              )
          lines.append("")

          lines.append("## Every approved seller")
          lines.append("| Seller | Test query | Returned | Core 4+ | Strong 5 | Fallback | Purity |")
          lines.append("|---|---|---:|---:|---:|---|---|")
          for row in seller_rows:
              purity = "PASS" if not row["wrong"] else "FAIL: " + ", ".join(row["wrong"])
              lines.append(
                  f"| {row['seller']} | {row['query']} | {row['returned']} | {row['core']} | "
                  f"{row['strong']} | {'yes' if row['fallback'] else 'no'} | {purity} |"
              )
          lines.append("")

          products = int(health.get("products") or 0)
          sellers = int(health.get("sellers") or 0)
          files = int(health.get("catalogFilesDiscovered") or 0)
          structural_pass = products >= 38000 and sellers >= 13 and files >= 1000 and not joom_products

          lines.append("## Structural verdict")
          if structural_pass:
              lines.append(
                  "**PASS — the old 360-file partial-index bottleneck is removed, approved catalogue "
                  "coverage is substantially restored, seller purity passed, and Joom remains blocked.**"
              )
          else:
              lines.append(
                  "**REVIEW — the run completed, but full catalogue coverage is still below the expected "
                  "structural target. Use this report before changing relevance rules again.**"
              )
          lines.append("")
          lines.append("### Notes")
          lines.append("- Lenovo may remain at zero until an actual Lenovo product feed is stored.")
          lines.append("- TikTok Shop US may still use live CJ fallback because the previous audit found no persisted TikTok rows.")
          lines.append("- Relevance tuning for terms such as `dog food` and `perfume` should be done only after this structural pass.")

          summary = "\n".join(lines) + "\n"
          Path("v17-3-verification.md").write_text(summary)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(summary)

          if joom_products:
              raise SystemExit("Policy failure: Joom returned public products.")
          if any(row["wrong"] for row in seller_rows):
              raise SystemExit("Seller purity failure detected.")
          PY

      - name: Upload V17.3 verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v17-3-verification
          path: v17-3-verification.md
          if-no-files-found: error
