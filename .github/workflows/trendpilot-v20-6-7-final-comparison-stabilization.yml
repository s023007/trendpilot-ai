      - name: Wire V20.6.7 renderer into Finder without replacing legacy engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('find/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="/css/comparison-v20-6-7.css?v=20.6.7">'
          js='<script defer src="/js/comparison-v20-6-7.js?v=20.6.7"></script>'
          if css not in s:
              s=s.replace('</head>',css+'</head>')
          if js not in s:
              s=s.replace('</body>',js+'</body>')
          # Remove the obsolete Temu wording from the visible wholesale promo if still present.
          s=s.replace('Alibaba, AliExpress, Temu and business-sourcing records','Alibaba, AliExpress and business-sourcing records')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Deep static QA — data, seller counts, variants, prices, images, readability, routing
        shell: bash
        run: |
          set -euo pipefail
          node --check js/comparison-v20-6-7.js
          python - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path('data/search-v20-6/stable-v20-6-7.json').read_text())
          P=d['products']; O=d['offers']; V=d['variants']
          failures=[]
          by={}
          for o in O: by.setdefault(o['tpid'],[]).append(o)
          for p in P:
              sellers={x['seller'] for x in by.get(p['tpid'],[])}
              if p['sellerCount']!=len(sellers): failures.append(f"seller mismatch {p['name']}")
              if p['variantCount']<1: failures.append(f"variant zero {p['name']}")
          if any(o['priceReliable'] and o.get('price') is not None and o['price']<=1.01 for o in O): failures.append('visible $1 price')
          if any('temu' in o['seller'].lower() or 'joom' in o['seller'].lower() or 'filamentpro' in o['seller'].lower() for o in O): failures.append('blocked seller')
          def n(x): return re.sub(r'[^a-z0-9]+',' ',x.lower()).strip()
          one=next((p for p in P if n(p['name'])=='oneplus 7t'),None)
          if not one: failures.append('OnePlus 7T missing')
          else:
              ss={o['seller'] for o in by[one['tpid']]}
              if len(ss)!=2: failures.append(f'OnePlus 7T must expose 2 sellers, got {sorted(ss)}')
          # User-observed examples: Lenovo $1 must be hidden, fragrance offer must remain actionable.
          mono=next((p for p in P if n(p['name'])=='lenovo 100 mono usb headset'),None)
          if mono:
              for o in by[mono['tpid']]:
                  if o.get('priceReliable') and (o.get('price') or 0)<10: failures.append('Lenovo 100 Mono USB Headset low placeholder still visible')
          har=next((p for p in P if 'al haramain badar perfume' in n(p['name'])),None)
          if har and not any(o['seller'].lower().startswith('fragranceshop') and o['url'].startswith('http') for o in by[har['tpid']]): failures.append('FragranceShop offer lost')
          css=Path('css/comparison-v20-6-7.css').read_text()
          js=Path('js/comparison-v20-6-7.js').read_text()
          html=Path('find/index.html').read_text()
          for needle,label in [
              ('opacity:1!important','readability firewall'),
              ('tp67-variant-chips','variant selector'),
              ('All variants','all-variants compare mode'),
              ('priceReliable','price reliability rendering'),
              ('data-tpid-open','TPID direct routing'),
              ('comparison-v20-6-7.js?v=20.6.7','finder JS include'),
              ('comparison-v20-6-7.css?v=20.6.7','finder CSS include')]:
              hay=css+js+html
              if needle not in hay: failures.append('missing '+label)
          if failures:
              print('\n'.join(failures)); raise SystemExit(1)
          print('V20.6.7 deep static QA PASS')
          print(json.dumps(d['stats'],indent=2))
          PY

      - name: Audit user-observed scenarios before commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path('data/search-v20-6/stable-v20-6-7.json').read_text())
          P=d['products']; O=d['offers']; V=d['variants']
          byO={}; byV={}
          for x in O: byO.setdefault(x['tpid'],[]).append(x)
          for x in V: byV.setdefault(x['tpid'],[]).append(x)
          def norm(s): return re.sub(r'[^a-z0-9]+',' ',s.lower()).strip()
          tests=['OnePlus 7T','ThinkPad X1 Carbon','Lenovo 100 Mono USB Headset','Al Haramain Badar Perfume for Unisex - Pure Perfume 0.5 oz']
          for q in tests:
              p=next((x for x in P if norm(x['name'])==norm(q)),None)
              if not p:
                  print(f'{q}: not found in current canonical overlay')
                  continue
              rows=byO.get(p['tpid'],[]); vars=byV.get(p['tpid'],[])
              print('\n'+q)
              print(' TPID:',p['tpid'])
              print(' sellers:',sorted({x['seller'] for x in rows}))
              print(' variants:',[(x['label'],x['sellerCount']) for x in vars[:12]])
              print(' prices:',[(x['seller'],x.get('price'),x.get('priceReliable'),x.get('priceSuppressionReason')) for x in rows[:20]])
          PY

      - name: Commit one stabilized comparison release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trendpilot-bot"
          git config user.email "trendpilot-bot@users.noreply.github.com"
          git add data/search-v20-6/stable-v20-6-7.json js/comparison-v20-6-7.js css/comparison-v20-6-7.css find/index.html scripts/build-v20-6-7-overlay.py
          if git diff --cached --quiet; then
            echo "Nothing to commit; V20.6.7 already installed."
          else
            git commit -m "Install V20.6.7 final comparison stabilization"
            git push origin HEAD:main
          fi

