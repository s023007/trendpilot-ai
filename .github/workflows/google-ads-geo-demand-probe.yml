name: Google Ads Geo Demand Probe — Read Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-ads-geo-demand-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: google-ads-paused-create
    steps:
      - name: Install Google Ads client
        run: pip install --disable-pip-version-check google-ads

      - name: Compare keyword demand by country
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          python - <<'PY'
          import os
          from google.ads.googleads.client import GoogleAdsClient

          client = GoogleAdsClient.load_from_dict({
              'developer_token': os.environ['GOOGLE_ADS_DEVELOPER_TOKEN'],
              'client_id': os.environ['GOOGLE_ADS_CLIENT_ID'],
              'client_secret': os.environ['GOOGLE_ADS_CLIENT_SECRET'],
              'refresh_token': os.environ['GOOGLE_ADS_REFRESH_TOKEN'],
              'login_customer_id': os.environ['GOOGLE_ADS_LOGIN_CUSTOMER_ID'].replace('-', '').strip(),
              'use_proto_plus': True,
          })
          cid = os.environ['GOOGLE_ADS_CUSTOMER_ID'].replace('-', '').strip()
          svc = client.get_service('KeywordPlanIdeaService')
          seeds = [
              'manchester derby tickets',
              'el clasico tickets',
              'liverpool vs manchester united tickets',
              'madrid derby tickets',
              'north london derby tickets',
              'arsenal man city tickets',
          ]
          countries = {
              'Bahrain': 2048,
              'Kuwait': 2414,
              'Oman': 2512,
              'Qatar': 2634,
              'Saudi Arabia': 2682,
              'United Arab Emirates': 2784,
              'United Kingdom': 2826,
              'Ireland': 2372,
              'United States': 2840,
              'Canada': 2124,
              'Australia': 2036,
              'Germany': 2276,
              'France': 2250,
              'Netherlands': 2528,
              'Spain': 2724,
          }
          print('GEO DEMAND PROBE — GOOGLE SEARCH — ENGLISH')
          for country, geo_id in countries.items():
              req = client.get_type('GenerateKeywordIdeasRequest')
              req.customer_id = cid
              req.language = 'languageConstants/1000'
              req.geo_target_constants.append(f'geoTargetConstants/{geo_id}')
              req.keyword_plan_network = client.enums.KeywordPlanNetworkEnum.GOOGLE_SEARCH
              req.include_adult_keywords = False
              req.keyword_seed.keywords.extend(seeds)
              try:
                  rows = list(svc.generate_keyword_ideas(request=req))
              except Exception as e:
                  print('COUNTRY=', country, '| ERROR=', type(e).__name__, str(e)[:300])
                  continue
              by_text = {r.text.lower().strip(): r for r in rows}
              total = 0
              exact_found = 0
              details = []
              for kw in seeds:
                  r = by_text.get(kw.lower())
                  if r is None:
                      details.append((kw, 0, 'NOT_RETURNED', 0, 0))
                      continue
                  m = r.keyword_idea_metrics
                  vol = int(m.avg_monthly_searches or 0)
                  low = int(m.low_top_of_page_bid_micros or 0) / 1_000_000
                  high = int(m.high_top_of_page_bid_micros or 0) / 1_000_000
                  comp = m.competition.name if m.competition else 'UNKNOWN'
                  total += vol
                  exact_found += 1
                  details.append((kw, vol, comp, low, high))
              print('COUNTRY=', country, '| seed_avg_monthly_total=', total, '| seeds_returned=', exact_found)
              for d in details:
                  print('  KW=', repr(d[0]), '| avg_monthly=', d[1], '| competition=', d[2], '| low_bid_usd=', d[3], '| high_bid_usd=', d[4])
          print('END GEO DEMAND PROBE')
          PY

# rerun: 2026-08-30 13:00 Asia/Muscat — evaluate non-GCC GEO before live switch
