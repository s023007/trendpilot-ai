name: TrendPilot Products V15.9.2 Seller Depth and Phone Precision

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-9-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seller-depth-phone-precision:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Apply V15.9.2 focused fixes
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          site = Path("js/site-v13-5.js")
          html = Path("find/index.html")

          for p in (site, html):
              if not p.exists():
                  raise SystemExit(f"Missing required file: {p}")

          s = site.read_text(encoding="utf-8")
          h = html.read_text(encoding="utf-8")

          def replace_line_in_block(text, start_marker, end_marker, line_marker, new_line):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"Start marker not found: {start_marker}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"End marker not found after {start_marker}: {end_marker}")
              block = text[start:end]
              lines = block.splitlines()
              hits = [i for i, line in enumerate(lines) if line_marker in line]
              if len(hits) != 1:
                  raise SystemExit(f"Expected one {line_marker} line in block; found {len(hits)}")
              indent = lines[hits[0]][:len(lines[hits[0]]) - len(lines[hits[0]].lstrip())]
              lines[hits[0]] = indent + new_line
              new_block = "\n".join(lines)
              if block.endswith("\n"):
                  new_block += "\n"
              return text[:start] + new_block + text[end:]

          # ------------------------------------------------------------
          # A) Tighten exact smartphone results for TikTok and every seller.
          #    Keep real phones, reject wearables, watches, tablets and the
          #    common phone accessories that were leaking into phone results.
          # ------------------------------------------------------------
          phone_exclusion_live = (
              'const accessory=/\\b(?:case|cover|screen protector|protector|charger|charging|cable|mount|holder|stand|strap|lanyard|chain|grip|dock|adapter|cleaning|cleaner|cleaning tool|repair kit|replacement|replacement part|charging port|phone port|accessor(?:y|ies)|headphones?|earbuds?|earphones?|headsets?|power bank|battery pack|wallet|suction cup|tripod|smart ?watch(?:es)?|watch(?:es)?|apple watch|galaxy watch|fitness tracker|fitness band|smart band|wristband|bracelet|wearable|smart ring|tablet|tablets|ipad|stylus|buds)\\b/i;'
          )
          s = replace_line_in_block(
              s,
              "function tpPrepareLiveSellerRowsV15_8_9",
              "    const seen=new Set();",
              "const accessory=",
              phone_exclusion_live,
          )

          phone_exclusion_guard = (
              'const tpPhoneAccessory=/\\b(?:case|cover|screen protector|protector|charger|charging|cable|mount|holder|stand|strap|lanyard|chain|grip|dock|adapter|cleaning|cleaner|cleaning tool|repair kit|replacement|replacement part|charging port|phone port|accessor(?:y|ies)|headphones?|earbuds?|earphones?|headsets?|power bank|battery pack|wallet|suction cup|tripod|smart ?watch(?:es)?|watch(?:es)?|apple watch|galaxy watch|fitness tracker|fitness band|smart band|wristband|bracelet|wearable|smart ring|tablet|tablets|ipad|stylus|buds)\\b/i;'
          )
          s = replace_line_in_block(
              s,
              "// TP_SMARTPHONE_GUARD_V15_8_9",
              '    if(plan.families?.includes("laptops")',
              "const tpPhoneAccessory=",
              phone_exclusion_guard,
          )

          # ------------------------------------------------------------
          # B) Generic seller-depth repair for AliExpress, Alibaba,
          #    Geekbuying and every non-CJ catalogue seller.
          #
          #    The old loader stopped at only 3 pages per relevant segment.
          #    That can leave a seller with a tiny visible count even when its
          #    catalogue has many records deeper in the same segment.
          # ------------------------------------------------------------
          loader_start = s.find("  async function tpLoadSellerSpecificV15_1(seller) {")
          loader_end = s.find("  function tpDiversifySellersV15_1(rows) {", loader_start)
          if loader_start < 0 or loader_end < 0:
              raise SystemExit("Seller-specific loader boundaries not found.")

          new_loader = '''  async function tpLoadSellerSpecificV15_1(seller) {
            seller=tpCanonicalSellerV15_1(seller)||seller;
            if (!seller) return;
            const index=await tpLoadSellerCoverageV15_1();
            const sellerKeys=(index?.sellers?.[seller]?.segmentKeys||[]).filter(Boolean);
            const direct=tpPlanRelevantSellerKeysV15_1(seller,index);
            const familySet=new Set(state.plan?.families||[]);
            const groupSet=new Set(state.plan?.groups||[]);
            const familyKeys=sellerKeys.filter(key=>{const meta=segmentMeta(key);return meta&&familySet.has(meta.family);});
            const groupKeys=sellerKeys.filter(key=>{const meta=segmentMeta(key);return meta&&groupSet.has(meta.group);});
            const keys=uniq([...direct,...familyKeys,...groupKeys]).slice(0,24);
            const target=48;
            const maxPagesPerKey=12;
            const maxNewPageLoads=24;
            let newPageLoads=0;
            for (const key of keys) {
              const meta=segmentMeta(key);
              if (!meta) continue;
              const pageLimit=Math.min(meta.pages||1,maxPagesPerKey);
              for (let page=1; page<=pageLimit && newPageLoads<maxNewPageLoads; page++) {
                const before=state.segmentState.get(key);
                const alreadyLoaded=Boolean(before?.loaded?.has(page));
                const rows=await loadSegmentPage(key,page);
                if(!alreadyLoaded)newPageLoads++;
                if (rows.length) mergeProducts(rows);
                const count=state.exact.filter(p=>tpCanonicalSellerV15_1(p.advertiser)===seller).length;
                if (count>=target) return;
              }
              if(newPageLoads>=maxNewPageLoads)break;
            }
          }
          '''
          s = s[:loader_start] + new_loader + s[loader_end:]

          # Version/cache bust. No seller whitelist or CJ backend changes here.
          s = re.sub(
              r'const TP_CJ_GUARD_VERSION = "[^"]+";',
              'const TP_CJ_GUARD_VERSION = "15.9.2";',
              s,
              count=1,
          )
          s = s.replace("// TP_SELECTED_SELLER_V15_8_9", "// TP_SELECTED_SELLER_V15_9_2", 1)
          s = s.replace("// TP_SMARTPHONE_GUARD_V15_8_9", "// TP_SMARTPHONE_GUARD_V15_9_2", 1)

          h = re.sub(
              r'/js/site-v13-5\.js\?v=[^"]+',
              '/js/site-v13-5.js?v=15.9.2',
              h,
              count=1,
          )

          site.write_text(s.rstrip()+"\n", encoding="utf-8")
          html.write_text(h.rstrip()+"\n", encoding="utf-8")
          print("V15.9.2 phone precision and seller-depth patch applied.")
          PY

      - name: Validate V15.9.2
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          s=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          h=Path("find/index.html").read_text(encoding="utf-8")

          checks = {
              "phone wearables excluded": "galaxy watch|fitness tracker|fitness band|smart band|wristband|bracelet|wearable|smart ring|tablet|tablets|ipad|stylus|buds" in s,
              "live TikTok phone guard updated": "function tpPrepareLiveSellerRowsV15_8_9" in s and "const accessory=/\\b(?:case|cover" in s,
              "global smartphone guard updated": "TP_SMARTPHONE_GUARD_V15_9_2" in s and "const tpPhoneAccessory=/\\b(?:case|cover" in s,
              "seller scan target raised": "const target=48;" in s,
              "seller scan page depth raised": "const maxPagesPerKey=12;" in s,
              "seller scan bounded": "const maxNewPageLoads=24;" in s,
              "seller scan uses relevant direct/family/group keys": "const keys=uniq([...direct,...familyKeys,...groupKeys]).slice(0,24);" in s,
              "site version updated": 'const TP_CJ_GUARD_VERSION = "15.9.2";' in s,
              "site cache bust": "/js/site-v13-5.js?v=15.9.2" in h,
              "V15.9.1 seller fixes preserved": "await performSearch(state.query,false,state.scope);" in s and "merchant:($('[data-filter-merchant]')?clean($('[data-filter-merchant]').value):(state.selectedSeller||\"\"))" in s,
              "TikTok expanded queries preserved": '"samsung galaxy","google pixel","5g phone"' in s,
          }

          failed=[]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL")+": "+name)
              if not ok:
                  failed.append(name)
          if failed:
              raise SystemExit("Validation failed: "+", ".join(failed))

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"js/site-v13-5.js","find/index.html"}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))
          missing=allowed-changed
          if missing:
              raise SystemExit("Expected files were not changed: "+", ".join(sorted(missing)))

          print("V15.9.2 validation passed.")
          PY

      - name: Audit seller catalogue coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import os

          path=Path("data/seller-coverage-v15-1.json")
          if not path.exists():
              print("Seller coverage file not present; skipping summary.")
              raise SystemExit(0)
          payload=json.loads(path.read_text(encoding="utf-8"))
          sellers=payload.get("sellers",{})
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          lines=["## TrendPilot seller coverage audit", "", "| Seller | Catalogue records | Direct records | Segment keys |", "|---|---:|---:|---:|"]
          for name, row in sellers.items():
              lines.append(f"| {name} | {int(row.get('catalogueRecords',0) or 0):,} | {int(row.get('directProductRecords',0) or 0):,} | {len(row.get('segmentKeys') or [])} |")
          text="\n".join(lines)+"\n"
          print(text)
          if summary:
              with open(summary,"a",encoding="utf-8") as fh:
                  fh.write(text)
          PY

      - name: Publish V15.9.2
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/site-v13-5.js find/index.html
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.9.2 already installed."
            exit 0
          fi

          git commit -m "fix: deepen seller catalogue scans and tighten phone results"
          git push origin HEAD:main

          {
            echo "## TrendPilot Products V15.9.2"
            echo "- phone searches reject watches, wearables, tablets and phone accessories"
            echo "- TikTok keeps the broader V15.9.1 live discovery but with cleaner exact results"
            echo "- non-CJ seller selection scans deeper relevant catalogue pages"
            echo "- AliExpress/Alibaba/Geekbuying and other catalogue sellers can reach up to 48 exact matches when the indexed segment contains them"
            echo "- seller page scanning is bounded to avoid runaway mobile loading"
            echo "- V15.9.1 seller selection and All sellers fixes remain intact"
          } >> "$GITHUB_STEP_SUMMARY"
