name: Telegram Growth Loop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-growth-loop.yml'
      - 'scripts/publish-telegram.py'
  schedule:
    # 08:20, 14:20 and 20:20 Oman (UTC+4)
    - cron: '20 4,10,16 * * *'

permissions:
  contents: write

concurrency:
  group: telegram-growth-loop
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: '@TrendPilotChoice'
      TRENDPILOT_FEED_URL: https://trendpilotchoice.com/feed.xml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Telegram bot token
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN secret is missing."
            exit 1
          fi

      - name: Publish one new TrendPilot item
        run: python3 scripts/publish-telegram.py

      - name: Record publication state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/telegram-growth-state.json data/runtime/telegram-growth-last.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Telegram runtime changes to commit."
            exit 0
          fi
          git commit -m "chore: record Telegram growth publication"
          git push

# Manual first-live-post trigger after TELEGRAM_BOT_TOKEN setup: 2026-08-22
