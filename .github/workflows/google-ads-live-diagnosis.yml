name: Google Ads Live Diagnosis — Read Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-ads-live-diagnosis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: google-ads-paused-create
    steps:
      - name: Install Google Ads client
        run: pip install --disable-pip-version-check google-ads

      - name: Read-only live diagnosis
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          python - <<'PY'
          import os
          from collections import Counter
          from google.ads.googleads.client import GoogleAdsClient

          CAMPAIGN_ID = 24190034111
          client = GoogleAdsClient.load_from_dict({
              'developer_token': os.environ['GOOGLE_ADS_DEVELOPER_TOKEN'],
              'client_id': os.environ['GOOGLE_ADS_CLIENT_ID'],
              'client_secret': os.environ['GOOGLE_ADS_CLIENT_SECRET'],
              'refresh_token': os.environ['GOOGLE_ADS_REFRESH_TOKEN'],
              'login_customer_id': os.environ['GOOGLE_ADS_LOGIN_CUSTOMER_ID'].replace('-', '').strip(),
              'use_proto_plus': True,
          })
          cid = os.environ['GOOGLE_ADS_CUSTOMER_ID'].replace('-', '').strip()
          ga = client.get_service('GoogleAdsService')

          print('READ-ONLY DIAGNOSIS')
          customer_rows = list(ga.search(customer_id=cid, query='''
            SELECT customer.id, customer.descriptive_name, customer.currency_code, customer.time_zone
            FROM customer LIMIT 1
          '''))
          for r in customer_rows:
              print('CUSTOMER=', r.customer.id, '|', r.customer.descriptive_name, '|', r.customer.currency_code, '|', r.customer.time_zone)

          campaign_rows = list(ga.search(customer_id=cid, query=f'''
            SELECT campaign.id, campaign.name, campaign.status, campaign.advertising_channel_type,
                   campaign.bidding_strategy_type, campaign_budget.amount_micros,
                   campaign.network_settings.target_google_search,
                   campaign.network_settings.target_search_network,
                   campaign.network_settings.target_content_network
            FROM campaign
            WHERE campaign.id = {CAMPAIGN_ID}
            LIMIT 1
          '''))
          for r in campaign_rows:
              print('CAMPAIGN=', r.campaign.id, '|', r.campaign.name, '| status=', r.campaign.status.name,
                    '| channel=', r.campaign.advertising_channel_type.name,
                    '| bid=', r.campaign.bidding_strategy_type.name,
                    '| budget_usd=', int(r.campaign_budget.amount_micros)/1_000_000,
                    '| google_search=', r.campaign.network_settings.target_google_search,
                    '| search_network=', r.campaign.network_settings.target_search_network,
                    '| content_network=', r.campaign.network_settings.target_content_network)

          keywords = list(ga.search(customer_id=cid, query=f'''
            SELECT campaign.status, ad_group.name, ad_group.status,
                   ad_group_criterion.status, ad_group_criterion.keyword.text,
                   ad_group_criterion.keyword.match_type,
                   ad_group_criterion.system_serving_status,
                   ad_group_criterion.primary_status,
                   ad_group_criterion.primary_status_reasons,
                   ad_group_criterion.effective_cpc_bid_micros
            FROM keyword_view
            WHERE campaign.id = {CAMPAIGN_ID}
              AND ad_group_criterion.status != 'REMOVED'
          '''))
          print('KEYWORD_COUNT=', len(keywords))
          print('KEYWORD_PRIMARY_STATUS_COUNTS=', dict(Counter(r.ad_group_criterion.primary_status.name for r in keywords)))
          print('KEYWORD_SERVING_STATUS_COUNTS=', dict(Counter(r.ad_group_criterion.system_serving_status.name for r in keywords)))
          for r in keywords:
              txt = r.ad_group_criterion.keyword.text
              if ('manchester derby' in txt.lower() or 'ديربي مانشستر' in txt or
                  'el clasico' in txt.lower() or 'كلاسيكو' in txt):
                  print('KW=', repr(txt), '| match=', r.ad_group_criterion.keyword.match_type.name,
                        '| primary=', r.ad_group_criterion.primary_status.name,
                        '| serving=', r.ad_group_criterion.system_serving_status.name,
                        '| bid_usd=', int(r.ad_group_criterion.effective_cpc_bid_micros or 0)/1_000_000,
                        '| reasons=', [x.name for x in r.ad_group_criterion.primary_status_reasons])

          stats = list(ga.search(customer_id=cid, query=f'''
            SELECT segments.date, metrics.impressions, metrics.clicks, metrics.cost_micros,
                   metrics.ctr, metrics.average_cpc, metrics.conversions, metrics.all_conversions,
                   metrics.search_impression_share, metrics.search_rank_lost_impression_share,
                   metrics.search_budget_lost_impression_share
            FROM campaign
            WHERE campaign.id = {CAMPAIGN_ID}
              AND segments.date DURING TODAY
          '''))
          if not stats:
              print('TODAY=NO_ROWS | impressions=0 | clicks=0 | cost_usd=0.0 | conversions=0')
          for r in stats:
              print('TODAY=', r.segments.date,
                    '| impressions=', r.metrics.impressions,
                    '| clicks=', r.metrics.clicks,
                    '| cost_usd=', int(r.metrics.cost_micros or 0)/1_000_000,
                    '| ctr=', float(r.metrics.ctr or 0),
                    '| avg_cpc_usd=', int(r.metrics.average_cpc or 0)/1_000_000,
                    '| conversions=', float(r.metrics.conversions or 0),
                    '| all_conversions=', float(r.metrics.all_conversions or 0),
                    '| search_IS=', float(r.metrics.search_impression_share or 0),
                    '| rank_lost_IS=', float(r.metrics.search_rank_lost_impression_share or 0),
                    '| budget_lost_IS=', float(r.metrics.search_budget_lost_impression_share or 0))

          geo = list(ga.search(customer_id=cid, query=f'''
            SELECT campaign_criterion.criterion_id, campaign_criterion.location.geo_target_constant,
                   campaign_criterion.negative, campaign_criterion.status
            FROM campaign_criterion
            WHERE campaign.id = {CAMPAIGN_ID}
              AND campaign_criterion.type = 'LOCATION'
          '''))
          print('TARGET_LOCATION_CRITERIA=', [(r.campaign_criterion.criterion_id, r.campaign_criterion.negative, r.campaign_criterion.status.name) for r in geo])
          print('END READ-ONLY DIAGNOSIS')
          PY

