name: Install TrendPilot V13.7 Booking-First Tickets

on:
  workflow_dispatch:
    inputs:
      ticombo_deeplink:
        description: "Optional: paste a new Ticombo Admitad deeplink, or leave blank to keep the existing V13.6 link"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: install-trendpilot-v13-7-booking-first-tickets
  cancel-in-progress: false

jobs:
  install-v13-7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify uploaded package
        run: |
          test -f trendpilot-v13-7-booking-first-tickets.zip
          unzip -t trendpilot-v13-7-booking-first-tickets.zip

      - name: Extract installer
        run: |
          rm -rf .trendpilot-v13-7
          mkdir -p .trendpilot-v13-7
          unzip -q trendpilot-v13-7-booking-first-tickets.zip -d .trendpilot-v13-7

      - name: Install booking-first ticket experience
        env:
          TICOMBO_DEEPLINK: ${{ inputs.ticombo_deeplink }}
        run: |
          python .trendpilot-v13-7/install.py \
            --repo . \
            --package-root .trendpilot-v13-7 \
            --ticombo-deeplink "$TICOMBO_DEEPLINK"

      - name: Validate JavaScript and configuration
        run: |
          node --check js/tickets-v13-7.js
          node --check data/tickets-config.js

      - name: Validate installed booking pages
        run: |
          test -f tickets/index.html
          test -f tickets/mens-nations-league/index.html
          test -f tickets/provider/ticombo/index.html
          test -f css/style-v13-7-ticket-booking.css
          grep -q "What do you want to attend?" tickets/index.html
          grep -q "data-booking-assistant" tickets/index.html
          grep -q "Choose the match first" tickets/mens-nations-league/index.html
          grep -q "data-seat-chooser" tickets/mens-nations-league/index.html
          grep -q '"version": "13.7.0"' data/tickets-integration-status.json

      - name: Remove temporary installer files
        run: rm -rf .trendpilot-v13-7

      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit. V13.7 is already installed."
          else
            git commit -m "Install TrendPilot V13.7 Booking-First Tickets"
            git push
          fi
