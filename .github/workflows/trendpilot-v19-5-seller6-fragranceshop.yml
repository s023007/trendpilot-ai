name: TrendPilot V19.5 — Seller 6 FragranceShop.com

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v19-5-seller6-fragranceshop
  cancel-in-progress: false

jobs:
  seller-6-fragranceshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Verify Sellers 1-5 and current seller policy
        shell: bash
        run: |
          set -euo pipefail

          test -s scripts/catalog-v19/build-canonical-seller.mjs
          test -s scripts/catalog-v19/discover-seller-sources.mjs
          test -s scripts/catalog-v19/build-global-resolver.mjs
          test -s scripts/catalog-v19/build-source-aware-seller-queue.mjs
          test -s data/catalog-v19/catalog-set-v1.json

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          catalog_set = json.loads((root/"catalog-set-v1.json").read_text())

          expected = [
              ("geekbuying","Geekbuying",900),
              ("aliexpress","AliExpress",10000),
              ("alibaba","Alibaba",15000),
              ("pandahall","PandaHall",100),
              ("karaca-eu","Karaca EU",90),
          ]

          names = [x["name"] for x in catalog_set["sellers"]]
          assert names == [x[1] for x in expected], names

          for slug,name,minimum in expected:
              seller = root/"sellers"/slug
              manifest = json.loads((seller/"manifest.json").read_text())
              audit = json.loads((seller/"audit.json").read_text())

              assert manifest["seller"]["name"] == name
              assert manifest["metrics"]["totalProducts"] >= minimum
              assert manifest["metrics"]["sourceQualified"] == manifest["metrics"]["totalProducts"]
              assert audit["sourceLeak"] is False
              assert audit["blockedSellerLeak"] is False
              assert audit["duplicateProductKeys"] is False

              failed = [x for x in audit.get("roundTripSamples",[]) if not x.get("resolved")]
              assert not failed, (name, failed[:5])

          print("Sellers 1-5 foundations PASS.")
          PY

          node --input-type=module <<'JS'
          import { PUBLIC_PRODUCT_SELLER_NAMES } from "./netlify/functions/product-seller-policy-v17.mjs";

          const sellers = [...PUBLIC_PRODUCT_SELLER_NAMES];
          if (sellers.length !== 14) throw new Error(`Expected 14 public product sellers, got ${sellers.length}`);
          if (!sellers.includes("FragranceShop.com")) throw new Error("FragranceShop.com is not approved.");
          if (sellers.includes("Temu") || sellers.includes("Joom")) {
            throw new Error("Blocked seller leaked into public seller policy.");
          }

          console.log("Public seller policy PASS.");
          JS

      - name: Discover all qualified FragranceShop.com product sources
        shell: bash
        run: |
          set -euo pipefail

          node --check scripts/catalog-v19/discover-seller-sources.mjs

          node scripts/catalog-v19/discover-seller-sources.mjs \
            --seller="FragranceShop.com" \
            --slug=fragranceshop-com \
            --version=19.5.0

      - name: Validate FragranceShop source intake
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("data/catalog-v19/source-manifests/fragranceshop-com.json")
          intake = json.loads(p.read_text())

          assert intake["seller"] == "FragranceShop.com"
          assert intake["qualifiedFileCount"] >= 1
          assert intake["qualifiedUniqueProducts"] >= 90
          assert intake["qualifiedFiles"]

          forbidden = {
              "data/coupons.json",
              "data/product-seller-registry-v17.json",
              "data/approved-product-sellers-v16.json",
          }
          assert not (forbidden & set(intake["qualifiedFiles"]))

          for file in intake["qualifiedFiles"]:
              assert not file.startswith("data/catalog-v19/")
              assert not file.startswith("data/commercial-v19/")

          print("FragranceShop source intake PASS")
          print("Candidate files:", intake["candidateFiles"])
          print("Qualified files:", intake["qualifiedFileCount"])
          print("All candidate unique products:", intake["discoveredUniqueProductsAcrossAllCandidateFiles"])
          print("Qualified unique products:", intake["qualifiedUniqueProducts"])
          print("Qualified source files:", intake["qualifiedFiles"])
          PY

      - name: Build Seller 6 — FragranceShop.com
        shell: bash
        run: |
          set -euo pipefail

          node --check scripts/catalog-v19/build-canonical-seller.mjs

          node scripts/catalog-v19/build-canonical-seller.mjs \
            --seller="FragranceShop.com" \
            --slug=fragranceshop-com \
            --version=19.5.0 \
            --role=sixth-canonical-catalog \
            --source-manifest=data/catalog-v19/source-manifests/fragranceshop-com.json

      - name: Validate FragranceShop canonical catalog
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json, math

          root = Path("data/catalog-v19")
          intake = json.loads((root/"source-manifests/fragranceshop-com.json").read_text())
          seller = root/"sellers/fragranceshop-com"

          manifest = json.loads((seller/"manifest.json").read_text())
          audit = json.loads((seller/"audit.json").read_text())

          total = manifest["metrics"]["totalProducts"]
          source_total = intake["qualifiedUniqueProducts"]

          assert manifest["version"] == "19.5.0"
          assert manifest["seller"]["name"] == "FragranceShop.com"
          assert manifest["seller"]["slug"] == "fragranceshop-com"

          assert total >= 90, total
          assert total >= math.floor(source_total * 0.85), (total, source_total)
          assert manifest["metrics"]["sourceQualified"] == total

          assert audit["sourceLeak"] is False
          assert audit["blockedSellerLeak"] is False
          assert audit["duplicateProductKeys"] is False

          stable = manifest["metrics"]["stableSellerId"]
          price = manifest["metrics"]["price"]
          image = manifest["metrics"]["image"]
          link = manifest["metrics"]["link"]

          assert stable / total >= 0.70, (stable,total)
          assert price / total >= 0.80, (price,total)
          assert image / total >= 0.80, (image,total)
          assert link / total >= 0.80, (link,total)

          failed = [x for x in audit["roundTripSamples"] if not x["resolved"]]
          assert not failed, failed[:5]

          qualified = set(intake["qualifiedFiles"])
          keys = set()

          with (seller/"products.ndjson").open() as f:
              for line in f:
                  if not line.strip():
                      continue
                  row = json.loads(line)

                  assert row["source"]["sourceFile"] in qualified
                  assert row["source"]["sourceFile"] != "data/coupons.json"
                  assert row["name"]["display"]
                  assert row["name"]["normalized"]
                  assert row["productKey"] not in keys
                  keys.add(row["productKey"])

          assert len(keys) == total

          # Contract parity with the established canonical schema.
          def first_row(file):
              with file.open() as f:
                  for line in f:
                      if line.strip():
                          return json.loads(line)

          base = first_row(root/"sellers/geekbuying/products.ndjson")
          current = first_row(seller/"products.ndjson")

          assert set(base.keys()) == set(current.keys())
          for key in ["seller","identifiers","name","taxonomy","specs","offer","media","links","source"]:
              assert set(base[key].keys()) == set(current[key].keys()), key

          print("Seller 6 FragranceShop.com PASS")
          print("Qualified source products:", source_total)
          print("Canonical products:", total)
          print("Stable seller ID/SKU:", stable)
          print("Price:", price)
          print("Image:", image)
          print("Links:", link)
          PY

      - name: Bump reusable resolver and queue engine versions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          for file in [
              Path("scripts/catalog-v19/build-global-resolver.mjs"),
              Path("scripts/catalog-v19/build-source-aware-seller-queue.mjs"),
          ]:
              s = file.read_text()
              old = 'const VERSION = "19.4.0";'
              new = 'const VERSION = "19.5.0";'
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{file}: expected exactly one {old!r}, found {count}")
              file.write_text(s.replace(old,new,1))
              print("Version bumped:", file)
          PY

          node --check scripts/catalog-v19/build-global-resolver.mjs
          node --check scripts/catalog-v19/build-source-aware-seller-queue.mjs

      - name: Add FragranceShop.com to validated catalog set
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("data/catalog-v19/catalog-set-v1.json")
          data = json.loads(p.read_text())

          expected_before = [
              "Geekbuying",
              "AliExpress",
              "Alibaba",
              "PandaHall",
              "Karaca EU",
          ]

          names = [x["name"] for x in data["sellers"]]
          assert names == expected_before, names

          data["version"] = "19.5.0"
          data["sellers"].append({
              "name":"FragranceShop.com",
              "slug":"fragranceshop-com"
          })

          names = [x["name"] for x in data["sellers"]]
          assert len(names) == len(set(names)) == 6
          assert "Temu" not in names
          assert "Joom" not in names

          p.write_text(json.dumps(data,indent=2) + "\n")
          PY

      - name: Build and validate six-seller global resolver
        shell: bash
        run: |
          set -euo pipefail

          node scripts/catalog-v19/build-global-resolver.mjs

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          resolver = json.loads((root/"global-resolver-v1.json").read_text())
          audit = json.loads((root/"cross-seller-audit-v1.json").read_text())

          expected = [
              "Geekbuying",
              "AliExpress",
              "Alibaba",
              "PandaHall",
              "Karaca EU",
              "FragranceShop.com",
          ]

          assert resolver["version"] == "19.5.0"
          assert [x["name"] for x in resolver["sellers"]] == expected
          assert audit["sellerCounts"]["FragranceShop.com"] >= 90

          assert audit["blockedSellerLeak"] is False
          assert audit["duplicateGlobalProductKeys"] is False
          assert not audit.get("insertionFailures")
          assert not audit.get("failedRoundTrips")

          failed = [x for x in audit["roundTrips"] if not x["resolved"]]
          assert not failed, failed[:10]

          for group in resolver["autoGroups"]:
              assert group["sellerCount"] >= 2
              reason = str(group["reason"])
              assert (
                  reason.startswith("gtin:") or
                  reason.startswith("ean:") or
                  reason.startswith("upc:") or
                  reason.startswith("isbn:") or
                  reason.startswith("mpn:") or
                  reason.startswith("brand-model:")
              ), reason

          print("Six-seller global resolver PASS")
          print("Total canonical records:", audit["totalRecords"])
          print("Automatic exact groups:", audit["autoExactGroups"])
          print("Exact-name discovery overlaps:", audit["exactNameCrossSellerOverlaps"])
          print("Brand/model discovery overlaps:", audit["brandModelDiscoveryOverlaps"])
          PY

      - name: Rebuild dynamic source-aware seller queue
        shell: bash
        run: |
          set -euo pipefail

          node scripts/catalog-v19/build-source-aware-seller-queue.mjs

          python3 - <<'PY'
          from pathlib import Path
          import json

          queue = json.loads(Path("data/catalog-v19/seller-build-queue-v3.json").read_text())

          completed = queue["completedSellers"]
          assert "FragranceShop.com" in completed
          assert "Temu" not in completed
          assert "Joom" not in completed

          recommended = queue.get("recommendedNext")
          if recommended:
              assert recommended["seller"] not in completed
              assert recommended["qualifiedProducts"] > 0

          print("Dynamic queue PASS")
          print("Recommended next:", recommended)
          PY

      - name: Create concise V19.5 report
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          intake = json.loads((root/"source-manifests/fragranceshop-com.json").read_text())
          seller = json.loads((root/"sellers/fragranceshop-com/manifest.json").read_text())
          cross = json.loads((root/"cross-seller-audit-v1.json").read_text())
          queue = json.loads((root/"seller-build-queue-v3.json").read_text())

          def rate(key):
              return seller["fillRates"][key]["percent"]

          nxt = queue.get("recommendedNext") or {}

          report = []
          report.append("# TrendPilot V19.5 — Seller 6: FragranceShop.com")
          report.append("")
          report.append("> Seller-by-seller canonical catalog build. Visitor UI/search API are still unchanged.")
          report.append("")
          report.append("## Source intake")
          report.append(f"- Candidate product files found: **{intake['candidateFiles']}**")
          report.append(f"- Qualified product-source files: **{intake['qualifiedFileCount']}**")
          report.append(f"- Unique products in qualified sources: **{intake['qualifiedUniqueProducts']:,}**")
          report.append("- Coupons/promotions/registries/audits remain outside product identity.")
          report.append("")
          report.append("## Seller 6 — FragranceShop.com")
          report.append(f"- Canonical products: **{seller['metrics']['totalProducts']:,}**")
          report.append(f"- Qualified source coverage: **{rate('sourceQualified')}%**")
          report.append(f"- Stable seller ID/SKU: **{seller['metrics']['stableSellerId']:,} ({rate('stableSellerId')}%)**")
          report.append(f"- Brand: **{seller['metrics']['brand']:,} ({rate('brand')}%)**")
          report.append(f"- Model/name hint: **{seller['metrics']['modelAny']:,} ({rate('modelAny')}%)**")
          report.append(f"- Structured specs: **{seller['metrics']['structuredSpecs']:,} ({rate('structuredSpecs')}%)**")
          report.append(f"- Derived title specs: **{seller['metrics']['derivedSpecs']:,} ({rate('derivedSpecs')}%)**")
          report.append(f"- Price: **{seller['metrics']['price']:,} ({rate('price')}%)**")
          report.append(f"- Image: **{seller['metrics']['image']:,} ({rate('image')}%)**")
          report.append("")
          report.append("## Six-seller shared resolver")
          report.append(f"- Total canonical records: **{cross['totalRecords']:,}**")
          report.append(f"- Automatic exact cross-seller groups: **{cross['autoExactGroups']:,}**")
          report.append(f"- Exact-name discovery overlaps: **{cross['exactNameCrossSellerOverlaps']:,}**")
          report.append(f"- Brand/model discovery overlaps: **{cross['brandModelDiscoveryOverlaps']:,}**")
          report.append("")
          report.append("## Gate for Seller 7")
          report.append("**PASS**")

          if nxt:
              report.append("")
              report.append(
                  f"Recommended next seller: **{nxt.get('seller','')}** — "
                  f"**{int(nxt.get('qualifiedProducts',0)):,}** qualified products "
                  f"from **{int(nxt.get('qualifiedFiles',0))}** qualified source files."
              )
          else:
              report.append("")
              report.append(
                  "No remaining approved seller currently has a qualified persisted product feed. "
                  "The next phase should be source ingestion rather than catalog normalization."
              )

          text = "\n".join(report) + "\n"
          (root/"V19.5-REPORT.md").write_text(text)
          print(text)
          PY

      - name: Commit Seller 6 and updated catalog state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/catalog-v19/build-global-resolver.mjs \
            scripts/catalog-v19/build-source-aware-seller-queue.mjs \
            data/catalog-v19/source-manifests/fragranceshop-com.json \
            data/catalog-v19/sellers/fragranceshop-com \
            data/catalog-v19/catalog-set-v1.json \
            data/catalog-v19/global-resolver-v1.json \
            data/catalog-v19/cross-seller-audit-v1.json \
            data/catalog-v19/seller-build-queue-v3.json \
            data/catalog-v19/V19.5-REPORT.md

          if git diff --cached --quiet; then
            echo "No V19.5 catalog changes to commit."
          else
            git commit -m "feat: add FragranceShop.com canonical seller catalog"
            if ! git push origin HEAD:main; then
              echo "Main moved; rebasing once."
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Publish concise summary
        shell: bash
        run: |
          set -euo pipefail
          cat data/catalog-v19/V19.5-REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact Seller 6 audit
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v19-5-seller6-fragranceshop-audit
          path: |
            data/catalog-v19/V19.5-REPORT.md
            data/catalog-v19/source-manifests/fragranceshop-com.json
            data/catalog-v19/sellers/fragranceshop-com/manifest.json
            data/catalog-v19/sellers/fragranceshop-com/audit.json
            data/catalog-v19/cross-seller-audit-v1.json
            data/catalog-v19/seller-build-queue-v3.json
          retention-days: 14
          compression-level: 9
