name: Namecheap SmartNews Auto Deploy

on:
  push:
    branches: [main]
    paths:
      - 'smartnews.xml'
      - 'images/smartnews-logo.svg'
      - 'scripts/build-smartnews-feed.py'
      - '.github/workflows/smartnews-feed.yml'
      - '.github/workflows/namecheap-smartnews-auto-deploy.yml'
  workflow_run:
    workflows: ['SmartNews Feed']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: namecheap-smartnews-auto-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-smartnews:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: '21098'
      CPANEL_USER: kehwgbpo
      STATIC_ROOT: /home/kehwgbpo/trendpilotchoice.com
      PUBLIC_ORIGIN: https://trendpilotchoice.com
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate SmartNews source files
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo 'NAMECHEAP_SSH_PRIVATE_KEY is missing.'; exit 1; }
          test -s smartnews.xml
          test -s images/smartnews-logo.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('smartnews.xml').getroot()
          if root.tag != 'rss':
              raise SystemExit('smartnews.xml root is not <rss>')
          items=root.findall('./channel/item')
          if not items:
              raise SystemExit('smartnews.xml has no items')
          print('SmartNews feed items:', len(items))
          PY

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 2
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish SmartNews feed and logo
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap "test -d '$STATIC_ROOT' && mkdir -p '$STATIC_ROOT/images'"
          tar -czf - smartnews.xml images/smartnews-logo.svg | ssh trendpilot-namecheap "tar -xzf - -C '$STATIC_ROOT'"
          ssh trendpilot-namecheap "test -s '$STATIC_ROOT/smartnews.xml' && test -s '$STATIC_ROOT/images/smartnews-logo.svg'"

      - name: Verify public SmartNews URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          origin=os.environ['PUBLIC_ORIGIN'].rstrip('/')
          run=os.environ.get('GITHUB_RUN_ID','')
          url=origin+'/smartnews.xml'
          last=None
          for attempt in range(1,7):
              req=urllib.request.Request(
                  url+f'?deploy={run}-{attempt}',
                  headers={'User-Agent':'TrendPilotSmartNewsVerifier/1.0','Cache-Control':'no-cache'}
              )
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read()
                      last=(r.status,body)
                      if r.status==200:
                          root=ET.fromstring(body)
                          items=root.findall('./channel/item')
                          if root.tag=='rss' and items:
                              print('PUBLIC_SMARTNEWS_OK', url, 'items=', len(items))
                              raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  last=(e.code,b'')
                  print('Attempt',attempt,'HTTP',e.code)
              except Exception as e:
                  print('Attempt',attempt,type(e).__name__,str(e))
              time.sleep(5)
          raise SystemExit(f'Public SmartNews feed verification failed: {last}')
          PY
