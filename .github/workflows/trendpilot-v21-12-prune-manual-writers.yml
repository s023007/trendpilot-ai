name: TrendPilot V21.12 — Prune Obsolete Manual Writers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-12-prune-manual-writers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Remove manual workflows that can rewrite the repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.github/workflows')
          keep={
            'trendpilot-admitad-new-account-live-sync.yml',
            'update-admitad-coupons-api.yml',
            'trendpilot-v21-12-prune-manual-writers.yml',
          }
          removed=[]
          for p in sorted(root.glob('*.yml')):
              if p.name in keep:
                  continue
              s=p.read_text(encoding='utf-8',errors='replace')
              auto=bool(re.search(r'(?m)^\s{0,4}(?:push|schedule|workflow_run|pull_request)\s*:',s))
              writer=('contents: write' in s) or bool(re.search(r'\bgit\s+push\b',s))
              if writer and not auto:
                  p.unlink()
                  removed.append(p.name)
          # This workflow is one-time by design; remove it from the final tree too.
          me=root/'trendpilot-v21-12-prune-manual-writers.yml'
          if me.exists():
              me.unlink()
          print('Removed obsolete manual writer workflows:',len(removed))
          for name in removed:
              print('-',name)
          PY
      - name: Validate final writer surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          manual=[];automatic=[]
          for p in Path('.github/workflows').glob('*.yml'):
              s=p.read_text(encoding='utf-8',errors='replace')
              auto=bool(re.search(r'(?m)^\s{0,4}(?:push|schedule|workflow_run|pull_request)\s*:',s))
              writer=('contents: write' in s) or bool(re.search(r'\bgit\s+push\b',s))
              if writer and auto: automatic.append(p.name)
              elif writer: manual.append(p.name)
          allowed={'trendpilot-admitad-new-account-live-sync.yml','update-admitad-coupons-api.yml'}
          if manual:
              raise SystemExit('Manual repository writers remain: '+', '.join(sorted(manual)))
          if not set(automatic).issubset(allowed):
              raise SystemExit('Unexpected automatic writer remains: '+', '.join(sorted(automatic)))
          print('Automatic writers:',sorted(automatic))
          print('Manual writers: none')
          PY
      - name: Commit workflow pruning
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -u .github/workflows
          if git diff --cached --quiet; then
            echo 'No obsolete manual writer workflows remained.'
          else
            git commit -m 'TrendPilot V21.12 remove obsolete manual repository writers'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
