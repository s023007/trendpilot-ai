name: Namecheap Auto Deploy

on:
  push:
    branches:
      - namecheap-migration-v21
  workflow_dispatch:

concurrency:
  group: namecheap-auto-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: "21098"
      CPANEL_USER: kehwgbpo
      APP_ROOT: trendpilot-repo
      APP_DIR: /home/kehwgbpo/trendpilot-repo
      BRANCH: namecheap-migration-v21
      LIVE_PROBE_URL: https://trendpilot-test.7t7k.top/.netlify/functions/namecheap-runtime-probe-v1
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

    steps:
      - name: Require Namecheap SSH key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo "NAMECHEAP_SSH_PRIVATE_KEY is missing."; exit 1; }

      - name: Checkout TrendPilot
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate deployment source
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check server.cjs
          node --check netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          node --check netlify/functions/namecheap-runtime-probe-v1.cjs
          node --check js/post-intelligence-v21.js
          grep -q 'tp-pc-panel' netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          grep -q 'tp-trust-panel' js/post-intelligence-v21.js

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 2
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify Namecheap SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'printf "SSH_OK\n"'

      - name: Sync branch and restart Node app
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'bash -se' <<'REMOTE'
          set -eo pipefail
          APP_DIR=/home/kehwgbpo/trendpilot-repo
          BRANCH=namecheap-migration-v21
          NODE_ENV_ACTIVATE=/home/kehwgbpo/nodevenv/trendpilot-repo/20/bin/activate

          cd "$APP_DIR"
          OLD_PACKAGE="$(git show HEAD:package.json 2>/dev/null | sha256sum | awk '{print $1}' || true)"
          git fetch --prune origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard FETCH_HEAD
          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_PACKAGE="$(sha256sum package.json 2>/dev/null | awk '{print $1}' || true)"

          source "$NODE_ENV_ACTIVATE"
          node --check server.js
          node --check server.cjs
          node --check netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          node --check netlify/functions/namecheap-runtime-probe-v1.cjs
          node --check js/post-intelligence-v21.js

          if [ "$OLD_PACKAGE" != "$NEW_PACKAGE" ] || [ ! -d node_modules ]; then
            npm install --omit=dev
          fi

          mkdir -p tmp
          printf '%s\n' "$NEW_HEAD" > tmp/last-deployed-sha.txt
          touch tmp/restart.txt

          SELECTOR_BIN=""
          if command -v cloudlinux-selector >/dev/null 2>&1; then
            SELECTOR_BIN="$(command -v cloudlinux-selector)"
          elif [ -x /usr/sbin/cloudlinux-selector ]; then
            SELECTOR_BIN=/usr/sbin/cloudlinux-selector
          fi

          if [ -n "$SELECTOR_BIN" ]; then
            $SELECTOR_BIN set --json --interpreter nodejs --user kehwgbpo --app-root trendpilot-repo --startup-file server.js || true
            $SELECTOR_BIN restart --json --interpreter nodejs --user kehwgbpo --app-root trendpilot-repo || {
              $SELECTOR_BIN stop --json --interpreter nodejs --user kehwgbpo --app-root trendpilot-repo || true
              sleep 2
              $SELECTOR_BIN start --json --interpreter nodejs --user kehwgbpo --app-root trendpilot-repo || true
            }
          fi

          touch tmp/restart.txt
          sleep 5
          echo "DEPLOYED_SHA=$NEW_HEAD"
          REMOTE

      - name: Verify deployed Git commit
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(ssh trendpilot-namecheap 'git -C /home/kehwgbpo/trendpilot-repo rev-parse HEAD')"
          echo "GitHub SHA: $GITHUB_SHA"
          echo "Namecheap SHA: $REMOTE_SHA"
          test "$REMOTE_SHA" = "$GITHUB_SHA"

      - name: Verify Namecheap runtime can load deployed files
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/tp_probe_headers /tmp/tp_probe_body
          for attempt in $(seq 1 12); do
            echo "Runtime probe $attempt/12"
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' -D /tmp/tp_probe_headers -o /tmp/tp_probe_body \
              "${LIVE_PROBE_URL}?deploy=${GITHUB_SHA}&attempt=${attempt}&ts=$(date +%s)"; then
              if grep -qi '^x-trendpilot-runtime-probe:[[:space:]]*namecheap-v1' /tmp/tp_probe_headers \
                 && grep -q '"runtime":"namecheap-v1"' /tmp/tp_probe_body; then
                echo "NAMECHEAP_RUNTIME_PROBE_OK"
                exit 0
              fi
            fi
            sleep 4
          done
          echo "Runtime probe failed."
          exit 1

      - name: Safe diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '--- probe response ---'
          curl -isS --max-time 20 "${LIVE_PROBE_URL}?diagnostic=$(date +%s)" | head -80 || true
          echo '--- remote SHA ---'
          ssh trendpilot-namecheap 'git -C /home/kehwgbpo/trendpilot-repo rev-parse HEAD 2>/dev/null || true' || true
          echo '--- deploy marker ---'
          ssh trendpilot-namecheap 'cat /home/kehwgbpo/trendpilot-repo/tmp/last-deployed-sha.txt 2>/dev/null || true' || true
          echo '--- restart marker ---'
          ssh trendpilot-namecheap 'stat /home/kehwgbpo/trendpilot-repo/tmp/restart.txt 2>/dev/null | head -8 || true' || true
