name: Namecheap Auto Deploy

on:
  push:
    branches:
      - namecheap-migration-v21
  workflow_dispatch:

concurrency:
  group: namecheap-auto-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: "21098"
      CPANEL_USER: kehwgbpo
      CPANEL_REPO: /home/kehwgbpo/trendpilot-repo
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

    steps:
      - name: Require Namecheap SSH key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "NAMECHEAP_SSH_PRIVATE_KEY is missing."
            exit 1
          fi

      - name: Checkout TrendPilot
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate Namecheap runtime files
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check server.cjs
          node --check netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          grep -q 'tp-pc-panel' netlify/functions/product-preview-v20-9-6-mobile-polish.cjs

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 2
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify Namecheap SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'printf "SSH_OK\n"'

      - name: Sync GitHub branch to Namecheap and restart
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'bash -se' <<'REMOTE'
          set -euo pipefail
          REPO=/home/kehwgbpo/trendpilot-repo
          BRANCH=namecheap-migration-v21
          NODE_ENV_ACTIVATE=/home/kehwgbpo/nodevenv/trendpilot-repo/20/bin/activate
          cd "$REPO"

          OLD_HEAD="$(git rev-parse HEAD)"
          OLD_PACKAGE="$(git show HEAD:package.json 2>/dev/null | sha256sum | awk '{print $1}' || true)"

          git fetch --prune origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard FETCH_HEAD

          # Namecheap/CloudLinux exposes node/npm through the app virtual environment.
          source "$NODE_ENV_ACTIVATE"
          node --check server.js
          node --check server.cjs
          node --check netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          grep -q 'tp-pc-panel' netlify/functions/product-preview-v20-9-6-mobile-polish.cjs

          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_PACKAGE="$(sha256sum package.json 2>/dev/null | awk '{print $1}' || true)"

          if [ "$OLD_PACKAGE" != "$NEW_PACKAGE" ] || [ ! -d node_modules ]; then
            npm install --omit=dev
          fi

          mkdir -p tmp
          printf '%s\n' "$NEW_HEAD" > tmp/last-deployed-sha.txt

          # Passenger restart.txt is the cPanel-standard restart signal.
          touch tmp/restart.txt

          # Namecheap uses CloudLinux Node.js Selector. Restart it explicitly when
          # the CLI is exposed to the account; keep restart.txt as the fallback.
          if command -v cloudlinux-selector >/dev/null 2>&1; then
            cloudlinux-selector restart --json --interpreter nodejs --app-root trendpilot-repo || true
          elif [ -x /usr/sbin/cloudlinux-selector ]; then
            /usr/sbin/cloudlinux-selector restart --json --interpreter nodejs --app-root trendpilot-repo || true
          fi

          sleep 4
          echo "OLD_HEAD=$OLD_HEAD"
          echo "NEW_HEAD=$NEW_HEAD"
          echo "AUTO_DEPLOY_OK"
          REMOTE

      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(ssh trendpilot-namecheap 'git -C /home/kehwgbpo/trendpilot-repo rev-parse HEAD')"
          echo "GitHub SHA: $GITHUB_SHA"
          echo "Namecheap SHA: $REMOTE_SHA"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
