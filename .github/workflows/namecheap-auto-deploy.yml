name: Namecheap Auto Deploy

on:
  push:
    branches:
      - namecheap-migration-v21
  workflow_dispatch:

concurrency:
  group: namecheap-auto-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: "21098"
      CPANEL_USER: kehwgbpo
      APP_DIR: /home/kehwgbpo/trendpilot-repo
      STATIC_ROOT: /home/kehwgbpo/trendpilot-test.7t7k.top
      BRANCH: namecheap-migration-v21
      SITE_URL: https://trendpilot-test.7t7k.top
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

    steps:
      - name: Require Namecheap SSH key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo "NAMECHEAP_SSH_PRIVATE_KEY is missing."; exit 1; }

      - name: Checkout TrendPilot
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate static shopper build
        shell: bash
        run: |
          set -euo pipefail
          node --check js/item-detail-v20-9.js
          node --check js/item-confidence-v21-4.js
          grep -q 'item-confidence-v21-4.js' item/index.html
          test -f data/review-evidence-v21.json
          test -d data/v20-9/products

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 2
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify Namecheap SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'printf "SSH_OK\n"'

      - name: Sync GitHub branch on Namecheap
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'bash -se' <<'REMOTE'
          set -eo pipefail
          APP_DIR=/home/kehwgbpo/trendpilot-repo
          BRANCH=namecheap-migration-v21
          cd "$APP_DIR"
          git fetch --prune origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard FETCH_HEAD
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          REMOTE

      - name: Publish static site and bypass Passenger
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'bash -se' <<'REMOTE'
          set -eo pipefail
          APP_DIR=/home/kehwgbpo/trendpilot-repo
          STATIC_ROOT=/home/kehwgbpo/trendpilot-test.7t7k.top

          test -d "$STATIC_ROOT" || { echo "Static document root not found: $STATIC_ROOT"; exit 1; }

          # Copy only browser-facing site assets. Node/Passenger is no longer required
          # for normal shopper pages, so HTML/CSS/JS/JSON changes become visible immediately.
          for d in css js images data item find compare deals products sourcing; do
            if [ -d "$APP_DIR/$d" ]; then
              mkdir -p "$STATIC_ROOT/$d"
              cp -a "$APP_DIR/$d/." "$STATIC_ROOT/$d/"
            fi
          done

          for f in index.html 404.html manifest.webmanifest robots.txt sitemap.xml; do
            if [ -f "$APP_DIR/$f" ]; then
              cp -a "$APP_DIR/$f" "$STATIC_ROOT/$f"
            fi
          done

          # cPanel's Node app previously routed this domain through Passenger.
          # Disable Passenger at the document root so Apache serves the static site directly.
          cat > "$STATIC_ROOT/.htaccess" <<'HTACCESS'
          PassengerEnabled off
          Options -Indexes
          DirectoryIndex index.html
          HTACCESS

          git -C "$APP_DIR" rev-parse HEAD > "$STATIC_ROOT/namecheap-static-release.txt"
          echo "STATIC_ROOT=$STATIC_ROOT"
          echo "STATIC_SHA=$(cat "$STATIC_ROOT/namecheap-static-release.txt")"
          REMOTE

      - name: Verify deployed Git commit
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(ssh trendpilot-namecheap 'cat /home/kehwgbpo/trendpilot-test.7t7k.top/namecheap-static-release.txt')"
          echo "GitHub SHA: $GITHUB_SHA"
          echo "Static SHA: $REMOTE_SHA"
          test "$REMOTE_SHA" = "$GITHUB_SHA"

      - name: Verify live static item page
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            RELEASE="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${SITE_URL}/namecheap-static-release.txt?ts=$(date +%s)" || true)"
            ITEM="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${SITE_URL}/item/?ts=$(date +%s)" || true)"
            echo "attempt=$attempt release=$RELEASE"
            if [ "$RELEASE" = "$GITHUB_SHA" ] && grep -q 'item-confidence-v21-4.js' <<< "$ITEM"; then
              echo "STATIC_LIVE_OK sha=$RELEASE"
              exit 0
            fi
            sleep 3
          done
          echo "Static site verification failed. Passenger may still be intercepting the domain or the document root may differ."
          exit 1

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '--- live release marker ---'
          curl -isS --max-time 20 "${SITE_URL}/namecheap-static-release.txt?diagnostic=$(date +%s)" | head -40 || true
          echo '--- live item page ---'
          curl -isS --max-time 20 "${SITE_URL}/item/?diagnostic=$(date +%s)" | head -80 || true
          echo '--- remote document root ---'
          ssh trendpilot-namecheap 'ls -la /home/kehwgbpo/trendpilot-test.7t7k.top | head -50; echo ---HTACCESS---; cat /home/kehwgbpo/trendpilot-test.7t7k.top/.htaccess 2>/dev/null || true' || true
