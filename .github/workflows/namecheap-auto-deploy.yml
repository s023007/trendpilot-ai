name: Namecheap Auto Deploy

on:
  push:
    branches:
      - namecheap-migration-v21
  workflow_dispatch:

concurrency:
  group: namecheap-auto-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: "21098"
      CPANEL_USER: kehwgbpo
      APP_DIR: /home/kehwgbpo/trendpilot-repo
      TEST_ROOT: /home/kehwgbpo/trendpilot-test.7t7k.top
      PRODUCTION_ROOT: /home/kehwgbpo/trendpilotchoice.com
      BRANCH: namecheap-migration-v21
      TEST_URL: https://trendpilot-test.7t7k.top
      PRODUCTION_URL: https://trendpilotchoice.com
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

    steps:
      - name: Require Namecheap SSH key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo "NAMECHEAP_SSH_PRIVATE_KEY is missing."; exit 1; }

      - name: Checkout TrendPilot
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate static shopper build
        shell: bash
        run: |
          set -euo pipefail
          node --check js/item-detail-v20-9.js
          node --check js/item-confidence-v21-4.js
          node --check js/item-conversion-v21-5.js
          node --check js/tp-analytics-v1.js
          grep -q 'item-confidence-v21-4.js?v=21.4.2' item/index.html
          grep -q 'item-conversion-v21-5.js' item/index.html
          grep -q 'tp-analytics-v1.js' item/index.html
          test -f data/tp-track.php
          test -f data/review-evidence-v21.json
          test -d data/v20-9/products

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 2
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify Namecheap SSH and document roots
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'test -d /home/kehwgbpo/trendpilot-test.7t7k.top && test -d /home/kehwgbpo/trendpilotchoice.com && printf "SSH_AND_ROOTS_OK\n"'

      - name: Sync GitHub branch on Namecheap
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'bash -se' <<'REMOTE'
          set -eo pipefail
          APP_DIR=/home/kehwgbpo/trendpilot-repo
          BRANCH=namecheap-migration-v21
          cd "$APP_DIR"
          git fetch --prune origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard FETCH_HEAD
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          REMOTE

      - name: Publish static site to test and production
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'bash -se' <<'REMOTE'
          set -eo pipefail
          APP_DIR=/home/kehwgbpo/trendpilot-repo

          publish_root() {
            ROOT="$1"
            MARKER="$2"
            test -d "$ROOT" || { echo "Document root not found: $ROOT"; exit 1; }

            for d in css js images data item find compare deals products sourcing; do
              if [ -d "$APP_DIR/$d" ]; then
                mkdir -p "$ROOT/$d"
                cp -a "$APP_DIR/$d/." "$ROOT/$d/"
              fi
            done

            for f in index.html 404.html manifest.webmanifest robots.txt sitemap.xml; do
              if [ -f "$APP_DIR/$f" ]; then
                cp -a "$APP_DIR/$f" "$ROOT/$f"
              fi
            done

            cat > "$ROOT/.htaccess" <<'HTACCESS'
          PassengerEnabled off
          Options -Indexes
          DirectoryIndex index.html
          HTACCESS

            git -C "$APP_DIR" rev-parse HEAD > "$ROOT/$MARKER"
            echo "PUBLISHED root=$ROOT sha=$(cat "$ROOT/$MARKER")"
          }

          publish_root /home/kehwgbpo/trendpilot-test.7t7k.top namecheap-static-release.txt
          publish_root /home/kehwgbpo/trendpilotchoice.com namecheap-production-release.txt
          REMOTE

      - name: Verify deployed Git commit on both roots
        shell: bash
        run: |
          set -euo pipefail
          TEST_SHA="$(ssh trendpilot-namecheap 'cat /home/kehwgbpo/trendpilot-test.7t7k.top/namecheap-static-release.txt')"
          PROD_SHA="$(ssh trendpilot-namecheap 'cat /home/kehwgbpo/trendpilotchoice.com/namecheap-production-release.txt')"
          echo "GitHub SHA: $GITHUB_SHA"
          echo "Test SHA: $TEST_SHA"
          echo "Production SHA: $PROD_SHA"
          test "$TEST_SHA" = "$GITHUB_SHA"
          test "$PROD_SHA" = "$GITHUB_SHA"

      - name: Verify live test site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            RELEASE="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${TEST_URL}/namecheap-static-release.txt?ts=$(date +%s)" || true)"
            ITEM="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${TEST_URL}/item/?ts=$(date +%s)" || true)"
            echo "test attempt=$attempt release=$RELEASE"
            if [ "$RELEASE" = "$GITHUB_SHA" ] && grep -q 'item-confidence-v21-4.js?v=21.4.2' <<< "$ITEM" && grep -q 'item-conversion-v21-5.js' <<< "$ITEM" && grep -q 'tp-analytics-v1.js' <<< "$ITEM"; then
              echo "TEST_SITE_LIVE_OK sha=$RELEASE"
              exit 0
            fi
            sleep 3
          done
          echo "Test site verification failed."
          exit 1

      - name: Verify live production site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..16}; do
            RELEASE="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${PRODUCTION_URL}/namecheap-production-release.txt?ts=$(date +%s)" || true)"
            ITEM="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${PRODUCTION_URL}/item/?ts=$(date +%s)" || true)"
            echo "production attempt=$attempt release=$RELEASE"
            if [ "$RELEASE" = "$GITHUB_SHA" ] && grep -q 'item-confidence-v21-4.js?v=21.4.2' <<< "$ITEM" && grep -q 'item-conversion-v21-5.js' <<< "$ITEM" && grep -q 'tp-analytics-v1.js' <<< "$ITEM"; then
              echo "PRODUCTION_SITE_LIVE_OK sha=$RELEASE"
              exit 0
            fi
            sleep 4
          done
          echo "Production site verification failed."
          exit 1

      - name: Verify first-party analytics on production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            PROBE="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${PRODUCTION_URL}/data/tp-track.php?probe=1&ts=$(date +%s)" || true)"
            echo "production_analytics_probe=$PROBE"
            if [ "$PROBE" = '{"ok":true,"runtime":"analytics-v1"}' ]; then
              echo "PRODUCTION_ANALYTICS_LIVE_OK"
              exit 0
            fi
            sleep 3
          done
          echo "Production analytics endpoint is not executing as PHP on Namecheap."
          exit 1

      - name: Production auto-deploy complete
        shell: bash
        run: |
          set -euo pipefail
          echo "NAMECHEAP_PRODUCTION_AUTO_DEPLOY_OK sha=$GITHUB_SHA"

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '--- production release marker ---'
          curl -isS --max-time 20 "${PRODUCTION_URL}/namecheap-production-release.txt?diagnostic=$(date +%s)" | head -40 || true
          echo '--- production item page ---'
          curl -isS --max-time 20 "${PRODUCTION_URL}/item/?diagnostic=$(date +%s)" | head -80 || true
          echo '--- production analytics probe ---'
          curl -isS --max-time 20 "${PRODUCTION_URL}/data/tp-track.php?probe=1&diagnostic=$(date +%s)" | head -40 || true
          echo '--- remote production root ---'
          ssh trendpilot-namecheap 'ls -la /home/kehwgbpo/trendpilotchoice.com | head -50; echo ---HTACCESS---; cat /home/kehwgbpo/trendpilotchoice.com/.htaccess 2>/dev/null || true' || true
