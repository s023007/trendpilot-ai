name: Namecheap Auto Deploy

on:
  push:
    branches:
      - namecheap-migration-v21
  workflow_dispatch:

concurrency:
  group: namecheap-auto-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: "21098"
      CPANEL_USER: kehwgbpo
      CPANEL_REPO: /home/kehwgbpo/trendpilot-repo
      LIVE_PRODUCT_URL: https://trendpilot-test.7t7k.top/product/bcba2c15f61566/
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

    steps:
      - name: Require Namecheap SSH key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo "NAMECHEAP_SSH_PRIVATE_KEY is missing."; exit 1; }

      - name: Checkout TrendPilot
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate Namecheap runtime files
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check server.cjs
          node --check netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          grep -q 'tp-pc-panel' netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          grep -q 'x-trendpilot-product-confidence' netlify/functions/product-preview-v20-9-6-mobile-polish.cjs

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 2
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify Namecheap SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'printf "SSH_OK\n"'

      - name: Sync GitHub branch to Namecheap
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'bash -se' <<'REMOTE'
          set -eo pipefail
          REPO=/home/kehwgbpo/trendpilot-repo
          BRANCH=namecheap-migration-v21
          NODE_ENV_ACTIVATE=/home/kehwgbpo/nodevenv/trendpilot-repo/20/bin/activate
          cd "$REPO"

          OLD_PACKAGE="$(git show HEAD:package.json 2>/dev/null | sha256sum | awk '{print $1}' || true)"
          git fetch --prune origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard FETCH_HEAD

          source "$NODE_ENV_ACTIVATE"
          node --check server.js
          node --check server.cjs
          node --check netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          grep -q 'tp-pc-panel' netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          grep -q 'x-trendpilot-product-confidence' netlify/functions/product-preview-v20-9-6-mobile-polish.cjs

          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_PACKAGE="$(sha256sum package.json 2>/dev/null | awk '{print $1}' || true)"
          if [ "$OLD_PACKAGE" != "$NEW_PACKAGE" ] || [ ! -d node_modules ]; then
            npm install --omit=dev
          fi

          mkdir -p tmp
          printf '%s\n' "$NEW_HEAD" > tmp/last-deployed-sha.txt
          touch tmp/restart.txt

          # Best-effort selector restart. Passenger restart.txt remains the cPanel-standard signal.
          if command -v cloudlinux-selector >/dev/null 2>&1; then
            cloudlinux-selector restart --json --interpreter nodejs --domain trendpilot-test.7t7k.top --app-root trendpilot-repo || true
          elif [ -x /usr/sbin/cloudlinux-selector ]; then
            /usr/sbin/cloudlinux-selector restart --json --interpreter nodejs --domain trendpilot-test.7t7k.top --app-root trendpilot-repo || true
          fi

          echo "NEW_HEAD=$NEW_HEAD"
          REMOTE

      - name: Verify deployed Git commit
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(ssh trendpilot-namecheap 'git -C /home/kehwgbpo/trendpilot-repo rev-parse HEAD')"
          echo "GitHub SHA: $GITHUB_SHA"
          echo "Namecheap SHA: $REMOTE_SHA"
          test "$REMOTE_SHA" = "$GITHUB_SHA"

      - name: First live product check
        id: live1
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/tp_headers /tmp/tp_body
          for attempt in $(seq 1 8); do
            echo "Live verification attempt $attempt/8"
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' -D /tmp/tp_headers -o /tmp/tp_body \
              "${LIVE_PRODUCT_URL}?deploy=${GITHUB_SHA}&attempt=${attempt}&ts=$(date +%s)"; then
              if grep -qi '^x-trendpilot-product-confidence:[[:space:]]*21\.3\.0' /tmp/tp_headers \
                 && grep -q 'tp-pc-panel' /tmp/tp_body \
                 && grep -q 'FOSSiBOT F106 PRO' /tmp/tp_body; then
                echo "LIVE_PRODUCT_CONFIDENCE_OK"
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1

      - name: Recover stale Namecheap Node runtime
        if: steps.live1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap 'bash -se' <<'REMOTE'
          set -eo pipefail
          DOMAIN=trendpilot-test.7t7k.top
          USERNAME=kehwgbpo
          DEFAULT_ROOT=trendpilot-repo
          REPO=/home/kehwgbpo/trendpilot-repo
          NODE_ENV_ACTIVATE=/home/kehwgbpo/nodevenv/trendpilot-repo/20/bin/activate
          cd "$REPO"
          source "$NODE_ENV_ACTIVATE"
          mkdir -p tmp
          touch tmp/restart.txt

          SELECTOR_BIN=""
          if command -v cloudlinux-selector >/dev/null 2>&1; then SELECTOR_BIN="$(command -v cloudlinux-selector)";
          elif [ -x /usr/sbin/cloudlinux-selector ]; then SELECTOR_BIN=/usr/sbin/cloudlinux-selector; fi

          APP_ROOT="$DEFAULT_ROOT"
          if [ -n "$SELECTOR_BIN" ]; then
            SELECTOR_JSON="$($SELECTOR_BIN get --json --interpreter nodejs --user "$USERNAME" 2>/dev/null || true)"
            DETECTED_ROOT="$(printf '%s' "$SELECTOR_JSON" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                try { const root=JSON.parse(s); const target="trendpilot-test.7t7k.top"; let found="";
                  const walk=o=>{ if(!o||typeof o!=="object"||found)return; for(const [k,v] of Object.entries(o)){ if(v&&typeof v==="object"&&String(v.domain||"").toLowerCase()===target){found=k;return;} walk(v);} }; walk(root); if(found) process.stdout.write(found);
                } catch(e) {}
              });' || true)"
            if [ -n "$DETECTED_ROOT" ]; then APP_ROOT="$DETECTED_ROOT"; fi
            echo "Detected Node app root: $APP_ROOT"

            # Restart with both supported selector identities; if restart is unreliable,
            # perform a controlled stop/start on the staging app only.
            $SELECTOR_BIN restart --json --interpreter nodejs --domain "$DOMAIN" --app-root "$APP_ROOT" || \
              $SELECTOR_BIN restart --json --interpreter nodejs --user "$USERNAME" --app-root "$APP_ROOT" || true
            sleep 2
            $SELECTOR_BIN stop --json --interpreter nodejs --domain "$DOMAIN" --app-root "$APP_ROOT" || \
              $SELECTOR_BIN stop --json --interpreter nodejs --user "$USERNAME" --app-root "$APP_ROOT" || true
            sleep 2
            $SELECTOR_BIN start --json --interpreter nodejs --domain "$DOMAIN" --app-root "$APP_ROOT" || \
              $SELECTOR_BIN start --json --interpreter nodejs --user "$USERNAME" --app-root "$APP_ROOT" || true
          fi

          touch tmp/restart.txt
          sleep 4
          REMOTE

      - name: Final live product verification
        id: live2
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/tp_headers /tmp/tp_body
          for attempt in $(seq 1 12); do
            echo "Final live verification attempt $attempt/12"
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' -D /tmp/tp_headers -o /tmp/tp_body \
              "${LIVE_PRODUCT_URL}?deploy=${GITHUB_SHA}&final=${attempt}&ts=$(date +%s)"; then
              if grep -qi '^x-trendpilot-product-confidence:[[:space:]]*21\.3\.0' /tmp/tp_headers \
                 && grep -q 'tp-pc-panel' /tmp/tp_body \
                 && grep -q 'FOSSiBOT F106 PRO' /tmp/tp_body; then
                echo "LIVE_PRODUCT_CONFIDENCE_OK"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Live product is still not serving the current confidence runtime."
          echo '--- response headers ---'
          cat /tmp/tp_headers 2>/dev/null || true
          echo '--- safe body markers ---'
          grep -Eo 'tp-pc-panel|FOSSiBOT F106 PRO|data-tp-product-ui="[^"]+"' /tmp/tp_body 2>/dev/null | head -20 || true
          exit 1

      - name: Safe diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          ssh trendpilot-namecheap 'bash -se' <<'REMOTE'
          echo '--- deployed SHA ---'
          git -C /home/kehwgbpo/trendpilot-repo rev-parse HEAD || true
          echo '--- restart signal ---'
          stat /home/kehwgbpo/trendpilot-repo/tmp/restart.txt 2>/dev/null || true
          echo '--- confidence code version ---'
          grep -n 'CONFIDENCE_VERSION' /home/kehwgbpo/trendpilot-repo/netlify/functions/product-preview-v20-9-6-mobile-polish.cjs | head || true
          echo '--- registered Node app (sanitized) ---'
          if command -v cloudlinux-selector >/dev/null 2>&1; then
            cloudlinux-selector get --json --interpreter nodejs --user kehwgbpo 2>/dev/null | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);const out=[];const walk=o=>{if(!o||typeof o!=="object")return;for(const [k,v] of Object.entries(o)){if(v&&typeof v==="object"&&v.domain)out.push({app_root:k,domain:v.domain,app_uri:v.app_uri||"",startup_file:v.startup_file||"",app_status:v.app_status||""});walk(v)}};walk(x);console.log(JSON.stringify(out,null,2))}catch(e){console.log("selector config unavailable")}});' || true
          fi
          REMOTE
