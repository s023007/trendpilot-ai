name: TrendPilot CJ Global Diecast Fetch V15.6.7

on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "CJ Publisher Company ID / CID. Leave blank to use saved secret."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: trendpilot-cj-global-diecast-v15-6-7
  cancel-in-progress: true

jobs:
  fetch-global-diecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CJ_INPUT_COMPANY_ID: ${{ inputs.company_id }}
      CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
      CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
      CJ_PAT: ${{ secrets.CJ_PAT }}
      CJ_PERSONAL_ACCESS_TOKEN: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}
      CJ_COMPANY_ID: ${{ secrets.CJ_COMPANY_ID }}
      CJ_CID: ${{ secrets.CJ_CID }}
      CJ_PUBLISHER_CID: ${{ secrets.CJ_PUBLISHER_CID }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Fetch Diecast globally with no GEO restrictions
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/cj_global_diecast.py
          python /tmp/cj_global_diecast.py

      - name: Validate global fetch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          report=json.loads(Path("data/diagnostics/diecast-global-fetch-v15-6-7.json").read_text(encoding="utf-8"))
          if report.get("geoFiltersApplied") is not False:
              raise SystemExit("GEO filter safety check failed.")
          if report.get("advertiserId")!="2357926":
              raise SystemExit("Wrong advertiser.")
          if report.get("selectedCount",0)<report.get("existingCount",0):
              raise SystemExit("Diecast count regressed.")
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"data/cj-products.json","data/diagnostics/diecast-global-fetch-v15-6-7.json"}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected changed files: "+", ".join(sorted(unexpected)))
          print("Global fetch validation passed.")
          PY

      - name: Publish safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics/diecast-global-fetch-v15-6-7.json
          if ! git diff --quiet -- data/cj-products.json; then
            git add data/cj-products.json
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "feat: fetch Diecast globally without geo filters"
          git push origin HEAD:main
