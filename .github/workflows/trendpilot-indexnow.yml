name: TrendPilot IndexNow Submit

on:
  push:
    branches:
      - namecheap-migration-v21
    paths:
      - "products/**"
      - "sitemap.xml"
      - "sitemap-v20-8.xml"
      - "robots.txt"
      - ".github/workflows/trendpilot-indexnow.yml"
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendpilot-indexnow-submit
  cancel-in-progress: true

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: namecheap-migration-v21

      - name: Wait briefly for Namecheap auto-deploy
        if: github.event_name == 'push'
        shell: bash
        run: sleep 90

      - name: Submit public TrendPilot URLs to IndexNow
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path

          host = "trendpilotchoice.com"
          key = "0d2916d362aea74d9aab63e45f6ca04e"
          key_location = f"https://{host}/{key}.txt"
          urls = []
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          for name in ("sitemap.xml", "sitemap-v20-8.xml"):
              path = Path(name)
              if not path.exists() or not path.read_text(encoding="utf-8").strip():
                  continue
              root = ET.parse(path).getroot()
              for node in root.findall("sm:url/sm:loc", ns):
                  value = (node.text or "").strip()
                  if value.startswith(f"https://{host}/") and value not in urls:
                      urls.append(value)

          if not urls:
              raise SystemExit("No public URLs found in TrendPilot sitemaps")

          # Prefer the global IndexNow endpoint. Participating engines share verified URL notifications.
          payload = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": key_location,
              "urlList": urls[:10000],
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": "TrendPilot-IndexNow/2.0"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"IndexNow HTTP {response.status}; submitted {len(urls)} URLs")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              print(f"IndexNow HTTP {exc.code}: {body}")
              raise
          PY

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TrendPilot IndexNow"
            echo
            echo "- Host: trendpilotchoice.com"
            echo "- Source: sitemap.xml + sitemap-v20-8.xml"
            echo "- Trigger: search-content changes + daily safety run"
            echo "- Purpose: fast URL discovery by IndexNow-participating search engines"
          } >> "$GITHUB_STEP_SUMMARY"
