name: TrendPilot V20.6.9.1 — Emergency UI Stabilization + Visible Summary

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-6-9-1-ui-stabilization
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start visible summary
        shell: bash
        run: |
          {
            echo "# TrendPilot V20.6.9.1 — Emergency UI Stabilization"
            echo
            echo "**Purpose:** remove the risky V20.6.9 runtime loop, restore a safe buyer UI layer, and show a proper GitHub Actions Summary."
            echo
            echo "- V19/V20 identity catalogs are **not rebuilt**."
            echo "- GEO import filtering is **not added**."
            echo "- Public seller policy is **not changed**."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove risky V20.6.9 injection and install safe runtime
        shell: bash
        env:
          SAFE_JS_B64: ""
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import base64, json, os, re

          ROOT = Path(".")
          old_name = "v20-6-9-final-buyer-hardening.js"
          new_name = "v20-6-9-1-safe-buyer-ui.js"

          old_tag_re = re.compile(
              r'\s*<script[^>]+src=["\']/js/' + re.escape(old_name) + r'["\'][^>]*></script>\s*',
              re.I
          )
          new_tag = f'<script src="/js/{new_name}" defer></script>'

          removed_old_tags = 0
          inserted_new_tags = 0
          html_changed = 0

          for path in ROOT.rglob("*.html"):
              if ".git" in path.parts or "node_modules" in path.parts:
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue

              original = text
              text, n = old_tag_re.subn("\n", text)
              removed_old_tags += n

              if new_name not in text and "</body>" in text.lower():
                  idx = text.lower().rfind("</body>")
                  text = text[:idx] + f"  {new_tag}\n" + text[idx:]
                  inserted_new_tags += 1

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  html_changed += 1

          old_js = ROOT / "js" / old_name
          old_js_removed = False
          if old_js.exists():
              old_js.unlink()
              old_js_removed = True

          safe_js = base64.b64decode(os.environ["SAFE_JS_B64"]).decode("utf-8")
          safe_path = ROOT / "js" / new_name
          safe_path.parent.mkdir(parents=True, exist_ok=True)
          safe_path.write_text(safe_js, encoding="utf-8")

          diag = ROOT / "data" / "diagnostics"
          diag.mkdir(parents=True, exist_ok=True)

          report = {
              "version": "V20.6.9.1",
              "old_runtime_tags_removed": removed_old_tags,
              "old_runtime_file_removed": old_js_removed,
              "safe_runtime_tags_inserted": inserted_new_tags,
              "html_files_changed": html_changed,
              "identity_rebuilt": False,
              "geo_import_filter_added": False,
              "seller_policy_changed": False
          }

          (diag / "v20-6-9-1-stabilization-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(json.dumps(report, indent=2))
          PY

      - name: Validate stabilization
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v20-6-9-1-safe-buyer-ui.js

          python <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("data/diagnostics/v20-6-9-1-stabilization-report.json").read_text(encoding="utf-8")
          )

          assert not Path("js/v20-6-9-final-buyer-hardening.js").exists()

          remaining = []
          safe_count = 0
          for p in Path(".").rglob("*.html"):
              if ".git" in p.parts or "node_modules" in p.parts:
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              if "v20-6-9-final-buyer-hardening.js" in text:
                  remaining.append(str(p))
              safe_count += text.count("v20-6-9-1-safe-buyer-ui.js")

          assert not remaining, f"Old V20.6.9 references remain: {remaining[:10]}"
          assert safe_count > 0, "Safe V20.6.9.1 script was not injected"

          print("JavaScript syntax: PASS")
          print("Old runtime removal: PASS")
          print(f"Safe runtime references: {safe_count}")
          PY

      - name: Write visible GitHub Actions summary
        shell: bash
        run: |
          python <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          r = json.loads(
              Path("data/diagnostics/v20-6-9-1-stabilization-report.json").read_text(encoding="utf-8")
          )

          print("## Stabilization result")
          print()
          print(f"- Old V20.6.9 script tags removed: **{r['old_runtime_tags_removed']}**")
          print(f"- Old risky runtime file removed: **{'YES' if r['old_runtime_file_removed'] else 'already absent'}**")
          print(f"- Safe V20.6.9.1 runtime tags installed: **{r['safe_runtime_tags_inserted']}**")
          print(f"- HTML files changed: **{r['html_files_changed']}**")
          print()
          print("## Safety contract")
          print()
          print("- Whole-document MutationObserver reprocessing loop: **REMOVED**")
          print("- Product-title mobile compaction: **KEPT**")
          print("- Alibaba exact/generic destination honesty: **KEPT**")
          print("- TikTok dynamic availability label: **KEPT**")
          print("- TikTok image recovery: **KEPT with one-time card processing**")
          print("- Buyer explanations: **PRESERVED**")
          print("- V19/V20 identity rebuild: **NO**")
          print("- GEO import filtering: **NO**")
          print("- Seller policy changes: **NO**")
          print()
          print("### Result")
          print("**PASS — safe UI stabilization committed after validation.**")
          PY

      - name: Commit V20.6.9.1
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "TrendPilot V20.6.9.1 stabilize buyer UI and add Actions summary"
          git push
