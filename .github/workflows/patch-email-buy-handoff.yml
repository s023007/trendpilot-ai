name: Patch Email Buy Handoff
on:
  push:
    paths:
      - 'scripts/patch_email_buy_handoff.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch email buy handoff
        run: python scripts/patch_email_buy_handoff.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'trendpilot-campaign-brain'
          git config user.email '39025908+s023007@users.noreply.github.com'
          git add api/save-search.php events/manchester-derby-2026/save-search.js
          git commit -m 'fix: send email checkout through tracked affiliate handoff'
          git push
