name: TrendPilot V19.2 — Seller 3 Alibaba + Dynamic Resolver

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v19-2-seller3-alibaba
  cancel-in-progress: false

jobs:
  seller-3-alibaba:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Verify Seller 1 and Seller 2 foundations
        shell: bash
        run: |
          set -euo pipefail

          test -s scripts/catalog-v19/build-canonical-seller.mjs
          test -s data/catalog-v19/schema-v1.json
          test -s data/catalog-v19/source-policy-v1.json

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")

          for slug, name, minimum in [
              ("geekbuying","Geekbuying",900),
              ("aliexpress","AliExpress",10000),
          ]:
              seller = root / "sellers" / slug
              manifest = json.loads((seller/"manifest.json").read_text())
              audit = json.loads((seller/"audit.json").read_text())

              assert manifest["seller"]["name"] == name
              assert manifest["metrics"]["totalProducts"] >= minimum
              assert manifest["metrics"]["sourceQualified"] == manifest["metrics"]["totalProducts"]
              assert audit["sourceLeak"] is False
              assert audit["blockedSellerLeak"] is False
              assert audit["duplicateProductKeys"] is False
              assert all(x["resolved"] for x in audit["roundTripSamples"])

          print("Seller 1 + Seller 2 foundations PASS.")
          PY

          node --input-type=module <<'JS'
          import { PUBLIC_PRODUCT_SELLER_NAMES } from "./netlify/functions/product-seller-policy-v17.mjs";
          const sellers = [...PUBLIC_PRODUCT_SELLER_NAMES];
          if (sellers.length !== 14) throw new Error(`Expected 14 product sellers, got ${sellers.length}`);
          for (const required of ["Geekbuying","AliExpress","Alibaba"]) {
            if (!sellers.includes(required)) throw new Error(`${required} is not approved.`);
          }
          if (sellers.includes("Temu") || sellers.includes("Joom")) {
            throw new Error("Blocked seller leaked into policy.");
          }
          console.log("Public seller policy PASS.");
          JS

      - name: Build Seller 3 — Alibaba with the same canonical engine
        shell: bash
        run: |
          set -euo pipefail

          node --check scripts/catalog-v19/build-canonical-seller.mjs

          node scripts/catalog-v19/build-canonical-seller.mjs \
            --seller=Alibaba \
            --slug=alibaba \
            --version=19.2.0 \
            --role=third-canonical-catalog

      - name: Validate Seller 3 contract and data safety
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          seller = root / "sellers" / "alibaba"

          manifest = json.loads((seller/"manifest.json").read_text())
          audit = json.loads((seller/"audit.json").read_text())

          assert manifest["version"] == "19.2.0"
          assert manifest["seller"]["name"] == "Alibaba"
          assert manifest["schema"] == "../../schema-v1.json"

          total = manifest["metrics"]["totalProducts"]
          stable = manifest["metrics"]["stableSellerId"]
          qualified = manifest["metrics"]["sourceQualified"]

          assert total >= 15000, total
          assert qualified == total
          assert stable / total >= 0.70, (stable,total)
          assert manifest["metrics"]["price"] / total >= 0.90
          assert manifest["metrics"]["image"] / total >= 0.90

          assert audit["sourceLeak"] is False
          assert audit["blockedSellerLeak"] is False
          assert audit["duplicateProductKeys"] is False
          assert audit["roundTripSamples"]
          assert all(x["resolved"] for x in audit["roundTripSamples"])

          # Contract parity across all three seller catalogs.
          def first_row(file):
              with file.open() as f:
                  for line in f:
                      if line.strip():
                          return json.loads(line)

          rows = {
              "Geekbuying": first_row(root/"sellers/geekbuying/products.ndjson"),
              "AliExpress": first_row(root/"sellers/aliexpress/products.ndjson"),
              "Alibaba": first_row(root/"sellers/alibaba/products.ndjson"),
          }

          base = rows["Geekbuying"]
          nested = ["seller","identifiers","name","taxonomy","specs","offer","media","links","source"]

          for name,row in rows.items():
              assert set(row.keys()) == set(base.keys()), name
              for key in nested:
                  assert set(row[key].keys()) == set(base[key].keys()), (name,key)

          print("Seller 3 Alibaba PASS")
          print("Canonical products:", total)
          print("Stable seller IDs/SKUs:", stable)
          PY

      - name: Make the global resolver catalog-set driven
        shell: bash
        run: |
          set -euo pipefail

          cat > data/catalog-v19/catalog-set-v1.json <<'JSON'
          {
            "version": "19.2.0",
            "purpose": "Explicit list of validated canonical seller catalogs allowed into the global V19 resolver.",
            "sellers": [
              {"name":"Geekbuying","slug":"geekbuying"},
              {"name":"AliExpress","slug":"aliexpress"},
              {"name":"Alibaba","slug":"alibaba"}
            ]
          }
          JSON

          cat > scripts/catalog-v19/build-global-resolver.mjs <<'JS'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import { PUBLIC_PRODUCT_SELLER_NAMES } from "../../netlify/functions/product-seller-policy-v17.mjs";

          const VERSION = "19.2.0";
          const ROOT = "data/catalog-v19";
          const SET_FILE = `${ROOT}/catalog-set-v1.json`;

          if (!fs.existsSync(SET_FILE)) throw new Error(`Missing ${SET_FILE}`);

          const catalogSet = JSON.parse(fs.readFileSync(SET_FILE, "utf8"));
          const SELLERS = catalogSet.sellers || [];

          if (SELLERS.length < 2) throw new Error("Global resolver requires at least two seller catalogs.");

          for (const seller of SELLERS) {
            if (!seller?.name || !seller?.slug) throw new Error("Invalid seller entry in catalog-set-v1.json.");
            if (!PUBLIC_PRODUCT_SELLER_NAMES.includes(seller.name)) {
              throw new Error(`Unapproved seller in catalog set: ${seller.name}`);
            }
          }
          if (SELLERS.some(s => ["Temu","Joom"].includes(s.name))) {
            throw new Error("Blocked seller leaked into catalog set.");
          }

          const norm = value =>
            String(value ?? "")
              .normalize("NFKC")
              .toLocaleLowerCase("en-US")
              .replace(/[’'`]/g, "")
              .replace(/[^a-z0-9]+/g, " ")
              .trim();
          const compact = value => norm(value).replace(/\s+/g, "");
          const uniq = values => [...new Set(values.filter(Boolean))];
          const sha = value => crypto.createHash("sha256").update(String(value)).digest("hex");

          function loadNdjson(file) {
            return fs.readFileSync(file, "utf8").split(/\n/).filter(Boolean).map(JSON.parse);
          }

          const records = [];
          for (const seller of SELLERS) {
            const file = `${ROOT}/sellers/${seller.slug}/products.ndjson`;
            const manifestFile = `${ROOT}/sellers/${seller.slug}/manifest.json`;
            if (!fs.existsSync(file) || !fs.existsSync(manifestFile)) {
              throw new Error(`Missing canonical catalog for ${seller.name}`);
            }

            const manifest = JSON.parse(fs.readFileSync(manifestFile, "utf8"));
            if (manifest.seller?.name !== seller.name) throw new Error(`Manifest mismatch for ${seller.name}`);

            for (const row of loadNdjson(file)) {
              if (row.seller?.name !== seller.name || row.seller?.slug !== seller.slug) {
                throw new Error(`Seller mismatch in ${file}`);
              }
              if (!row.quality?.sourceQualified) {
                throw new Error(`Unqualified source row leaked into ${seller.name}`);
              }
              records.push(row);
            }
          }

          if (records.some(x => ["Temu","Joom"].includes(x.seller?.name))) {
            throw new Error("Blocked seller leaked into global resolver.");
          }
          if (records.length !== new Set(records.map(r => r.productKey)).size) {
            throw new Error("Duplicate productKey across canonical seller catalogs.");
          }

          const byKey = Object.fromEntries(records.map(r => [r.productKey, r]));

          const resolver = {
            version: VERSION,
            catalogSetVersion: catalogSet.version,
            sellers: SELLERS,
            generatedAt: new Date().toISOString(),

            byGlobalId: {},
            byBrandExplicitModel: {},
            byScopedSellerProductId: {},
            byScopedSku: {},
            byModelDiscovery: {},
            byExactName: {},
            byCompactName: {},
            byNameToken: {},
            byCanonicalCategory: {},

            autoGroups: [],
            discoveryOverlaps: {
              exactName: [],
              brandModelInferred: []
            }
          };

          function push(bucket, key, productKey) {
            if (!key) return;
            if (!bucket[key]) bucket[key] = [];
            if (!bucket[key].includes(productKey)) bucket[key].push(productKey);
          }

          for (const row of records) {
            for (const key of row.identity?.keys?.exactGlobal || []) {
              push(resolver.byGlobalId, key, row.productKey);
            }

            if (row.brand && row.identifiers?.model && row.identity?.modelConfidence === "explicit") {
              push(
                resolver.byBrandExplicitModel,
                `brand-model:${compact(row.brand)}:${compact(row.identifiers.model)}`,
                row.productKey
              );
            }

            if (row.identifiers?.sellerProductId) {
              push(
                resolver.byScopedSellerProductId,
                `${row.seller.slug}:${compact(row.identifiers.sellerProductId)}`,
                row.productKey
              );
            }

            if (row.identifiers?.sku) {
              push(
                resolver.byScopedSku,
                `${row.seller.slug}:${compact(row.identifiers.sku)}`,
                row.productKey
              );
            }

            if (row.identifiers?.model) {
              push(resolver.byModelDiscovery, compact(row.identifiers.model), row.productKey);
            }

            push(resolver.byExactName, row.name.normalized, row.productKey);
            push(resolver.byCompactName, row.name.compact, row.productKey);

            for (const token of uniq(
              row.name.normalized
                .split(/\s+/)
                .filter(token => token.length >= 2 && !/^\d$/.test(token))
            )) {
              push(resolver.byNameToken, token, row.productKey);
            }

            const categoryKeys = uniq([
              ...(row.taxonomy?.canonicalPath || []).map(norm),
              norm(row.taxonomy?.canonicalCategory || ""),
              norm(row.taxonomy?.sourceCategory || ""),
              norm(row.taxonomy?.sourceSubcategory || "")
            ]);
            for (const key of categoryKeys) push(resolver.byCanonicalCategory, key, row.productKey);
          }

          const autoCandidates = new Map();

          for (const [key, productKeys] of Object.entries(resolver.byGlobalId)) {
            autoCandidates.set(`global:${key}`, { reason:key, productKeys });
          }
          for (const [key, productKeys] of Object.entries(resolver.byBrandExplicitModel)) {
            autoCandidates.set(`explicit-model:${key}`, { reason:key, productKeys });
          }

          const autoConflicts = [];

          for (const [groupKey, group] of autoCandidates) {
            const rows = group.productKeys.map(k => byKey[k]).filter(Boolean);
            const sellerNames = uniq(rows.map(x => x.seller.name));
            if (sellerNames.length < 2) continue;

            const perSellerCounts = {};
            for (const row of rows) {
              perSellerCounts[row.seller.name] = (perSellerCounts[row.seller.name] || 0) + 1;
            }

            if (Object.values(perSellerCounts).some(n => n > 1)) {
              autoConflicts.push({
                groupKey,
                reason: group.reason,
                productKeys: group.productKeys,
                perSellerCounts
              });
              continue;
            }

            resolver.autoGroups.push({
              groupId: `exact-${sha(groupKey).slice(0,20)}`,
              reason: group.reason,
              sellerCount: sellerNames.length,
              sellers: sellerNames.sort(),
              productKeys: group.productKeys
            });
          }

          for (const [name, productKeys] of Object.entries(resolver.byExactName)) {
            const sellers = uniq(productKeys.map(k => byKey[k]?.seller?.name));
            if (sellers.length >= 2) {
              resolver.discoveryOverlaps.exactName.push({
                name,
                sellerCount: sellers.length,
                sellers: sellers.sort(),
                productKeys
              });
            }
          }

          const inferredBrandModel = {};
          for (const row of records) {
            if (!row.brand || !row.identifiers?.model) continue;
            const key = `brand-model:${compact(row.brand)}:${compact(row.identifiers.model)}`;
            push(inferredBrandModel, key, row.productKey);
          }
          for (const [key, productKeys] of Object.entries(inferredBrandModel)) {
            const sellers = uniq(productKeys.map(k => byKey[k]?.seller?.name));
            if (sellers.length >= 2) {
              resolver.discoveryOverlaps.brandModelInferred.push({
                key,
                sellerCount: sellers.length,
                sellers: sellers.sort(),
                productKeys
              });
            }
          }

          function tokenSearch(query, limit=100) {
            const tokens = uniq(
              norm(query)
                .split(/\s+/)
                .filter(token => token.length >= 2 && !/^\d$/.test(token))
            );
            if (!tokens.length) return [];

            let current = null;
            for (const token of tokens) {
              const bucket = new Set(resolver.byNameToken[token] || []);
              current = current == null
                ? bucket
                : new Set([...current].filter(x => bucket.has(x)));
              if (!current.size) break;
            }
            return [...(current || [])].slice(0, limit);
          }

          const roundTrips = [];
          for (const seller of SELLERS) {
            const sellerRows = records.filter(x => x.seller.slug === seller.slug);

            for (const row of sellerRows.filter(x => x.identifiers?.sellerProductId).slice(0, 20)) {
              const key = `${seller.slug}:${compact(row.identifiers.sellerProductId)}`;
              roundTrips.push({
                seller:seller.name,
                kind:"seller-product-id",
                query:row.identifiers.sellerProductId,
                expectedProductKey:row.productKey,
                resolved:(resolver.byScopedSellerProductId[key] || []).includes(row.productKey)
              });
            }

            for (const row of sellerRows.slice(0, 10)) {
              roundTrips.push({
                seller:seller.name,
                kind:"exact-name",
                query:row.name.display,
                expectedProductKey:row.productKey,
                resolved:(resolver.byExactName[row.name.normalized] || []).includes(row.productKey)
              });
            }
          }

          const tokenSamples = [];
          for (const seller of SELLERS) {
            for (const row of records.filter(x => x.seller.slug === seller.slug && x.identifiers?.model).slice(0, 10)) {
              tokenSamples.push({
                seller:seller.name,
                query:row.identifiers.model,
                expectedProductKey:row.productKey,
                resolved:tokenSearch(row.identifiers.model, 500).includes(row.productKey)
              });
            }
          }

          const audit = {
            version:VERSION,
            generatedAt:resolver.generatedAt,
            catalogSetVersion:catalogSet.version,
            sellers:SELLERS,
            totalRecords:records.length,
            sellerCounts:Object.fromEntries(
              SELLERS.map(s => [s.name, records.filter(x => x.seller.slug === s.slug).length])
            ),
            autoExactGroups:resolver.autoGroups.length,
            autoGroupConflicts:autoConflicts,
            exactNameCrossSellerOverlaps:resolver.discoveryOverlaps.exactName.length,
            brandModelDiscoveryOverlaps:resolver.discoveryOverlaps.brandModelInferred.length,
            roundTrips,
            tokenSamples,
            blockedSellerLeak:false,
            duplicateGlobalProductKeys:false
          };

          fs.writeFileSync(`${ROOT}/global-resolver-v1.json`, JSON.stringify(resolver,null,2)+"\n");
          fs.writeFileSync(`${ROOT}/cross-seller-audit-v1.json`, JSON.stringify(audit,null,2)+"\n");

          console.log(JSON.stringify({
            totalRecords:audit.totalRecords,
            sellerCounts:audit.sellerCounts,
            autoExactGroups:audit.autoExactGroups,
            exactNameCrossSellerOverlaps:audit.exactNameCrossSellerOverlaps,
            brandModelDiscoveryOverlaps:audit.brandModelDiscoveryOverlaps,
            roundTrips:`${roundTrips.filter(x=>x.resolved).length}/${roundTrips.length}`,
            tokenSamples:`${tokenSamples.filter(x=>x.resolved).length}/${tokenSamples.length}`
          },null,2));
          JS

          node --check scripts/catalog-v19/build-global-resolver.mjs

      - name: Build three-seller global identity resolver
        shell: bash
        run: |
          set -euo pipefail
          node scripts/catalog-v19/build-global-resolver.mjs

      - name: Validate global resolver across all three sellers
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          resolver = json.loads((root/"global-resolver-v1.json").read_text())
          audit = json.loads((root/"cross-seller-audit-v1.json").read_text())

          expected = ["Geekbuying","AliExpress","Alibaba"]
          assert [x["name"] for x in resolver["sellers"]] == expected

          assert audit["blockedSellerLeak"] is False
          assert audit["duplicateGlobalProductKeys"] is False
          assert audit["sellerCounts"]["Geekbuying"] >= 900
          assert audit["sellerCounts"]["AliExpress"] >= 10000
          assert audit["sellerCounts"]["Alibaba"] >= 15000

          assert audit["roundTrips"]
          assert all(x["resolved"] for x in audit["roundTrips"])

          # Automatic grouping remains deliberately strict.
          for group in resolver["autoGroups"]:
              assert group["sellerCount"] >= 2
              reason = str(group["reason"])
              assert (
                  reason.startswith("gtin:") or
                  reason.startswith("ean:") or
                  reason.startswith("upc:") or
                  reason.startswith("isbn:") or
                  reason.startswith("mpn:") or
                  reason.startswith("brand-model:")
              ), reason

          print("Three-seller global resolver PASS")
          print("Total records:", audit["totalRecords"])
          print("Automatic exact groups:", audit["autoExactGroups"])
          print("Exact-name discovery overlaps:", audit["exactNameCrossSellerOverlaps"])
          print("Brand/model discovery overlaps:", audit["brandModelDiscoveryOverlaps"])
          PY

      - name: Build remaining seller queue
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/catalog-v19/build-next-seller-queue.mjs <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import { extractProducts } from "../../netlify/functions/products-v16-lib.mjs";
          import {
            PUBLIC_PRODUCT_SELLER_NAMES,
            canonicalProductSeller
          } from "../../netlify/functions/product-seller-policy-v17.mjs";

          const ROOT = "data/catalog-v19";
          const SOURCE = "data/search-catalog/shards";
          const BUILT = new Set(["Geekbuying","AliExpress","Alibaba"]);

          function walkJson(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {
              const full = path.join(dir,entry.name);
              if (entry.isDirectory()) out.push(...walkJson(full));
              else if (entry.isFile() && entry.name.toLowerCase().endsWith(".json")) out.push(full);
            }
            return out;
          }

          const ids = new Map();
          for (const seller of PUBLIC_PRODUCT_SELLER_NAMES) {
            if (!BUILT.has(seller)) ids.set(seller,new Set());
          }

          for (const file of walkJson(SOURCE)) {
            let payload;
            try { payload = JSON.parse(fs.readFileSync(file,"utf8")); }
            catch { continue; }

            for (const row of extractProducts(payload,file,250000)) {
              const seller = canonicalProductSeller(row.seller);
              if (!ids.has(seller)) continue;
              ids.get(seller).add(row.id || row.sourceProductId || `${row.title}|${row.price}|${row.currency}`);
            }
          }

          const queue = [...ids.entries()]
            .map(([seller,set]) => ({seller,qualifiedProducts:set.size}))
            .sort((a,b)=>b.qualifiedProducts-a.qualifiedProducts || a.seller.localeCompare(b.seller));

          const result = {
            version:"19.2.0",
            generatedAt:new Date().toISOString(),
            completedSellers:["Geekbuying","AliExpress","Alibaba"],
            remaining:queue,
            recommendedNext:queue.find(x=>x.qualifiedProducts>0) || null
          };

          fs.writeFileSync(`${ROOT}/seller-build-queue-v1.json`,JSON.stringify(result,null,2)+"\n");
          console.log(JSON.stringify(result,null,2));
          JS

          node --check scripts/catalog-v19/build-next-seller-queue.mjs
          node scripts/catalog-v19/build-next-seller-queue.mjs

      - name: Create concise Seller 3 report
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")

          geek = json.loads((root/"sellers/geekbuying/manifest.json").read_text())
          ali = json.loads((root/"sellers/aliexpress/manifest.json").read_text())
          baba = json.loads((root/"sellers/alibaba/manifest.json").read_text())
          cross = json.loads((root/"cross-seller-audit-v1.json").read_text())
          queue = json.loads((root/"seller-build-queue-v1.json").read_text())

          def r(m,key):
              return m["fillRates"][key]["percent"]

          nxt = queue.get("recommendedNext") or {}

          report = []
          report.append("# TrendPilot V19.2 — Seller 3: Alibaba")
          report.append("")
          report.append("> Seller-by-seller canonical catalog build. Visitor UI/search API are still unchanged.")
          report.append("")
          report.append("## Existing foundations")
          report.append(f"- Geekbuying: **{geek['metrics']['totalProducts']:,}** canonical products")
          report.append(f"- AliExpress: **{ali['metrics']['totalProducts']:,}** canonical products")
          report.append("")
          report.append("## Seller 3 — Alibaba")
          report.append(f"- Canonical products: **{baba['metrics']['totalProducts']:,}**")
          report.append(f"- Qualified source coverage: **{r(baba,'sourceQualified')}%**")
          report.append(f"- Stable seller ID/SKU: **{baba['metrics']['stableSellerId']:,} ({r(baba,'stableSellerId')}%)**")
          report.append(f"- Brand: **{baba['metrics']['brand']:,} ({r(baba,'brand')}%)**")
          report.append(f"- Model/name hint: **{baba['metrics']['modelAny']:,} ({r(baba,'modelAny')}%)**")
          report.append(f"- Explicit model: **{baba['metrics']['modelExplicit']:,} ({r(baba,'modelExplicit')}%)**")
          report.append(f"- Structured specs: **{baba['metrics']['structuredSpecs']:,} ({r(baba,'structuredSpecs')}%)**")
          report.append(f"- Derived title specs: **{baba['metrics']['derivedSpecs']:,} ({r(baba,'derivedSpecs')}%)**")
          report.append(f"- Price: **{baba['metrics']['price']:,} ({r(baba,'price')}%)**")
          report.append(f"- Image: **{baba['metrics']['image']:,} ({r(baba,'image')}%)**")
          report.append("")
          report.append("## Three-seller shared resolver")
          report.append("- The resolver is now **catalog-set driven**, so future sellers do not require a new resolver architecture.")
          report.append("- Seller IDs/SKUs remain scoped to their seller.")
          report.append("- Only global IDs or brand+explicit-model can automatically merge across sellers.")
          report.append("- Exact names/inferred models remain search/discovery only.")
          report.append(f"- Total canonical records in resolver: **{cross['totalRecords']:,}**")
          report.append(f"- Automatic exact cross-seller groups: **{cross['autoExactGroups']:,}**")
          report.append(f"- Exact-name discovery overlaps: **{cross['exactNameCrossSellerOverlaps']:,}**")
          report.append(f"- Brand/model discovery overlaps: **{cross['brandModelDiscoveryOverlaps']:,}**")
          report.append("")
          report.append("## Gate for Seller 4")
          report.append("**PASS**")
          if nxt:
              report.append("")
              report.append(
                  f"Recommended Seller 4 from the remaining qualified catalog data: "
                  f"**{nxt.get('seller','')}** — **{int(nxt.get('qualifiedProducts',0)):,}** qualified products."
              )
          report.append("")
          report.append("No visitor-facing search changes are made yet. We continue seller-by-seller until the catalog base is sufficiently complete.")

          text = "\n".join(report) + "\n"
          (root/"V19.2-REPORT.md").write_text(text)
          print(text)
          PY

      - name: Commit Seller 3 + dynamic resolver
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/catalog-v19/build-global-resolver.mjs \
            scripts/catalog-v19/build-next-seller-queue.mjs \
            data/catalog-v19/catalog-set-v1.json \
            data/catalog-v19/sellers/alibaba \
            data/catalog-v19/global-resolver-v1.json \
            data/catalog-v19/cross-seller-audit-v1.json \
            data/catalog-v19/seller-build-queue-v1.json \
            data/catalog-v19/V19.2-REPORT.md

          if git diff --cached --quiet; then
            echo "No V19.2 changes to commit."
          else
            git commit -m "feat: add Alibaba canonical catalog and dynamic V19 resolver"
            if ! git push origin HEAD:main; then
              echo "Main moved; rebasing once."
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Publish concise summary
        shell: bash
        run: |
          set -euo pipefail
          cat data/catalog-v19/V19.2-REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact Seller 3 audit
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v19-2-seller3-alibaba-audit
          path: |
            data/catalog-v19/V19.2-REPORT.md
            data/catalog-v19/catalog-set-v1.json
            data/catalog-v19/sellers/alibaba/manifest.json
            data/catalog-v19/sellers/alibaba/audit.json
            data/catalog-v19/cross-seller-audit-v1.json
            data/catalog-v19/seller-build-queue-v1.json
          retention-days: 14
          compression-level: 9
