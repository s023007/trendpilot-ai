name: TrendPilot V16.2 Connect Hybrid Finder

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v16-2-finder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connect-hybrid-finder:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Connect V16.1 hybrid API to public finder
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          js = Path("js/site-v13-5.js")
          finder = Path("find/index.html")

          if not js.exists():
              raise SystemExit("Missing js/site-v13-5.js")
          if not finder.exists():
              raise SystemExit("Missing find/index.html")

          s = js.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # 1) Install one reusable hybrid bridge.
          # ------------------------------------------------------------
          if "// TP_V16_2_HYBRID_FINDER_START" not in s:
              anchor = "  // TP_CJ_SEARCH_BRIDGE_START"
              pos = s.find(anchor)
              if pos < 0:
                  raise SystemExit("CJ search bridge anchor not found.")

              block = r'''  // TP_V16_2_HYBRID_FINDER_START
          async function tpLoadHybridProductsV16_2(query, requestedSeller="") {
            const q=clean(query);
            const seller=tpCanonicalSellerV15_1(requestedSeller)||clean(requestedSeller);

            if(q.length<2 || lower(q)==="popular products"){
              return {rows:[],meta:null};
            }

            const params=new URLSearchParams({
              q,
              limit:"100",
              test:"162"
            });
            if(seller)params.set("seller",seller);

            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),12000);

            try{
              const response=await fetch(`/api/products-v16-hybrid?${params.toString()}`,{
                cache:"no-store",
                signal:controller.signal,
                headers:{"accept":"application/json"}
              });

              if(!response.ok)return {rows:[],meta:null};

              const payload=await response.json();
              if(!payload?.ok || !Array.isArray(payload.products)){
                return {rows:[],meta:payload||null};
              }

              const rows=payload.products
                .map(row=>{
                  const source={...row};

                  source.name=clean(
                    source.name ||
                    source.title ||
                    source.productName ||
                    source.product_name
                  );

                  source.url=clean(
                    source.url ||
                    source.affiliateUrl ||
                    source.affiliate_url ||
                    source.destinationUrl ||
                    source.destination_url ||
                    source.productUrl ||
                    source.product_url
                  );

                  source.image=clean(
                    source.image ||
                    source.imageUrl ||
                    source.image_url
                  );

                  source.advertiser=clean(
                    source.advertiser ||
                    source.seller ||
                    source.merchant ||
                    source.network
                  );

                  let p=normalizeProduct(source);

                  if(typeof tpEnrichCjTaxonomyV15_6_4==="function"){
                    p=tpEnrichCjTaxonomyV15_6_4(p);
                  }

                  p._tpHybridV16_2=true;
                  p.intentTier=Number(row.intentTier||0)||0;
                  p.hybridMatchScore=Number(row.matchScore||0)||0;
                  p.hybridFallbackSource=clean(
                    row.fallbackSource ||
                    payload.fallbackSources?.join(", ") ||
                    "v16-index"
                  );

                  return p;
                })
                .filter(tpCjPublicAllowed)
                .filter(tpPublicSellerAllowed);

              return {rows,meta:payload};
            }catch(error){
              if(error?.name!=="AbortError"){
                console.warn("TrendPilot V16.2 hybrid finder unavailable",error);
              }
              return {rows:[],meta:null};
            }finally{
              clearTimeout(timer);
            }
          }
          // TP_V16_2_HYBRID_FINDER_END

          '''
              s = s[:pos] + block + s[pos:]

          # ------------------------------------------------------------
          # 2) Preserve V16 intent ranking when rows enter the current UI.
          #    Existing exact-match, category, seller and public guards remain.
          # ------------------------------------------------------------
          if "p._tpHybridV16_2" not in s[s.find("function score("):s.find("function mergeProducts(")]:
              score_anchor = (
                  '    let n = p.quality / 10 + (p.image ? 6 : 0) + (p.price ? 4 : 0) '
                  '+ Math.min(8,p.rating) + Math.min(8,Math.log10(p.reviews + 1) * 2);'
              )
              if score_anchor not in s:
                  raise SystemExit("Score anchor not found.")

              score_repl = score_anchor + r'''
              if(p._tpHybridV16_2){
                const tier=Math.max(0,Number(p.intentTier||0));
                const hybridScore=Math.max(0,Number(p.hybridMatchScore||0));
                n += tier*900 + Math.min(850,hybridScore/8);
              }'''
              s = s.replace(score_anchor, score_repl, 1)

          # ------------------------------------------------------------
          # 3) Make hybrid search a first-class source in performSearch.
          # ------------------------------------------------------------
          if "hybridPromiseV16_2" not in s:
              live_block = r'''  const cjLiveQueryV15_7_1=state.query;
            const cjLivePromiseV15_7_1=(preservedSeller && TP_CJ_LIVE_SELLERS_V15_7_1.has(preservedSeller))
              ? tpLoadSelectedLiveSellerV15_8_9(preservedSeller,cjLiveQueryV15_7_1)
              : tpLoadCjLiveProductsV15_7_1(cjLiveQueryV15_7_1,preservedSeller);'''

              replacement = r'''  const cjLiveQueryV15_7_1=state.query;

            // V16.2: the hybrid endpoint owns all-seller live fallback.
            // Keep the older direct CJ call only as a selected-seller safety net.
            const cjLivePromiseV15_7_1=(preservedSeller && TP_CJ_LIVE_SELLERS_V15_7_1.has(preservedSeller))
              ? tpLoadSelectedLiveSellerV15_8_9(preservedSeller,cjLiveQueryV15_7_1)
              : Promise.resolve([]);

            const hybridPromiseV16_2=tpLoadHybridProductsV16_2(
              state.query,
              preservedSeller
            );'''

              if live_block not in s:
                  raise SystemExit("performSearch live promise block not found.")
              s = s.replace(live_block, replacement, 1)

              old_results = r'''    const results=await Promise.allSettled([
                state.manifest.version==="fallback"?Promise.resolve(state.products):loadInitialSegments(),
                loadCjProducts(),
                typeof tpLoadBalancedSellerRowsV15_1==="function"?tpLoadBalancedSellerRowsV15_1():Promise.resolve([]),
                loadAdmitadProductsV15_4()
              ]);
              const rows=results[0].status==="fulfilled"?results[0].value:[];
              const cjRows=results[1].status==="fulfilled"?results[1].value:[];
              const balancedRows=results[2].status==="fulfilled"?results[2].value:[];
              const admitadRows=results[3].status==="fulfilled"?results[3].value:[];
              mergeProducts([...rows,...cjRows,...balancedRows,...admitadRows]);
              await Promise.race([ensureMinimumExact(24),new Promise(resolve=>setTimeout(resolve,6500))]);'''

              new_results = r'''    const results=await Promise.allSettled([
                hybridPromiseV16_2,
                state.manifest.version==="fallback"?Promise.resolve(state.products):loadInitialSegments(),
                loadCjProducts(),
                typeof tpLoadBalancedSellerRowsV15_1==="function"?tpLoadBalancedSellerRowsV15_1():Promise.resolve([]),
                loadAdmitadProductsV15_4()
              ]);

              const hybridPayload=results[0].status==="fulfilled"
                ? results[0].value
                : {rows:[],meta:null};

              const rows=results[1].status==="fulfilled"?results[1].value:[];
              const cjRows=results[2].status==="fulfilled"?results[2].value:[];
              const balancedRows=results[3].status==="fulfilled"?results[3].value:[];
              const admitadRows=results[4].status==="fulfilled"?results[4].value:[];

              state.hybridMeta=hybridPayload?.meta||null;

              mergeProducts([
                ...(hybridPayload?.rows||[]),
                ...rows,
                ...cjRows,
                ...balancedRows,
                ...admitadRows
              ]);

              if(state.exact.length<24){
                await Promise.race([
                  ensureMinimumExact(24),
                  new Promise(resolve=>setTimeout(resolve,6500))
                ]);
              }'''

              if old_results not in s:
                  raise SystemExit("performSearch source merge block not found.")
              s = s.replace(old_results, new_results, 1)

          # ------------------------------------------------------------
          # 4) Use the hybrid API when a seller is selected too.
          #    Only fall back to old seller-specific loaders when needed.
          # ------------------------------------------------------------
          if "hybridSellerResultV16_2" not in s:
              seller_block = r'''          if(selected){
                    state.loading=true;
                    renderFinder();
                    if(TP_CJ_LIVE_SELLERS_V15_7_1.has(selected)){
                      const liveRows=await tpLoadSelectedLiveSellerV15_8_9(selected,state.query);
                      if(liveRows.length)mergeProducts(liveRows);
                    }else if(typeof tpLoadSellerSpecificV15_1==="function"){
                      await tpLoadSellerSpecificV15_1(selected);
                    }
                    state.loading=false;'''

              seller_repl = r'''          if(selected){
                    state.loading=true;
                    renderFinder();

                    const hybridSellerResultV16_2=await tpLoadHybridProductsV16_2(
                      state.query,
                      selected
                    );

                    if(hybridSellerResultV16_2?.rows?.length){
                      state.hybridMeta=hybridSellerResultV16_2.meta||state.hybridMeta;
                      mergeProducts(hybridSellerResultV16_2.rows);
                    }else if(TP_CJ_LIVE_SELLERS_V15_7_1.has(selected)){
                      const liveRows=await tpLoadSelectedLiveSellerV15_8_9(selected,state.query);
                      if(liveRows.length)mergeProducts(liveRows);
                    }else if(typeof tpLoadSellerSpecificV15_1==="function"){
                      await tpLoadSellerSpecificV15_1(selected);
                    }

                    state.loading=false;'''

              if seller_block not in s:
                  raise SystemExit("Selected-seller loader block not found.")
              s = s.replace(seller_block, seller_repl, 1)

          # ------------------------------------------------------------
          # 5) Show a small status hint without changing the result UI.
          # ------------------------------------------------------------
          if "hybridStatusV16_2" not in s:
              status_anchor = r'''      const correction=state.queryCorrected?`Corrected “${state.originalQuery}” to “${state.query}”. `:"";
              status.textContent=`${correction}Showing ${fmt.format(visible.length)} of ${fmt.format(renderRows.length)} ${selectedSeller&&renderRows!==rows?"seller matches":noun}. ${fmt.format(scan)} candidates checked. ${progress}`;'''

              status_repl = r'''      const correction=state.queryCorrected?`Corrected “${state.originalQuery}” to “${state.query}”. `:"";
              const hybridStatusV16_2=state.hybridMeta
                ? (state.hybridMeta.fallbackUsed
                    ? " Wider live/catalogue sources were added."
                    : " V16 hybrid index active.")
                : "";
              status.textContent=`${correction}Showing ${fmt.format(visible.length)} of ${fmt.format(renderRows.length)} ${selectedSeller&&renderRows!==rows?"seller matches":noun}. ${fmt.format(scan)} candidates checked. ${progress}${hybridStatusV16_2}`;'''

              if status_anchor not in s:
                  raise SystemExit("Finder status anchor not found.")
              s = s.replace(status_anchor, status_repl, 1)

          js.write_text(s, encoding="utf-8")

          # ------------------------------------------------------------
          # 6) Bust the browser cache on the public finder only.
          # ------------------------------------------------------------
          h = finder.read_text(encoding="utf-8")
          h2, n = re.subn(
              r'/js/site-v13-5\.js\?v=[^"\']+',
              '/js/site-v13-5.js?v=16.2.0',
              h,
              count=1
          )
          if n != 1:
              raise SystemExit(f"Finder site-v13-5 script tag not found uniquely: matches={n}")
          finder.write_text(h2, encoding="utf-8")

          print("V16.2 public finder bridge installed.")
          PY

      - name: Validate V16.2
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js
          git diff --check

          grep -q 'TP_V16_2_HYBRID_FINDER_START' js/site-v13-5.js
          grep -q '/api/products-v16-hybrid' js/site-v13-5.js
          grep -q 'hybridPromiseV16_2' js/site-v13-5.js
          grep -q 'hybridSellerResultV16_2' js/site-v13-5.js
          grep -q 'p._tpHybridV16_2' js/site-v13-5.js
          grep -q 'V16 hybrid index active' js/site-v13-5.js
          grep -q '/js/site-v13-5.js?v=16.2.0' find/index.html

          echo "V16.2 finder integration validation passed."

      - name: Publish V16.2
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            js/site-v13-5.js \
            find/index.html

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V16.2 finder integration is already installed."
            exit 0
          fi

          git commit -m "feat: connect V16 hybrid search to public finder"
          git push origin HEAD:main

          {
            echo "## TrendPilot V16.2 Public Finder"
            echo "- connected /find/ to the verified V16.1.1 hybrid endpoint"
            echo "- V16 intent tiers are preserved in the existing result ranking"
            echo "- seller selection remains persistent and now queries hybrid seller results"
            echo "- all-seller searches avoid the old duplicate direct-CJ live request"
            echo "- legacy catalog/CJ/Admitad loaders remain as safety fallbacks"
            echo "- no product-index rebuild required"
          } >> "$GITHUB_STEP_SUMMARY"
