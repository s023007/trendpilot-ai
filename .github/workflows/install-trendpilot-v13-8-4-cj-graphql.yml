                  network = normalise(offer.get("network") or offer.get("sourceNetwork"))
                  if not name or not valid_public_url(url):
                      rejected["missingCoreFields"] += 1
                      continue
                  # CJ GraphQL product records are already limited to products available
                  # to this publisher Company ID. Do not reject their real advertiser
