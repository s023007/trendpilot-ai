        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trendpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            automation/cj_api_fetch.py \
            automation/build_search_catalog.py \
            config/sources/cj-api-products.json \
            data/cj-api-report.json \
            data/cj-link-catalog.json
          git add -f automation/cache/cj-products.json

          if git diff --cached --quiet; then
            echo "CJ GraphQL bridge and product cache are already current."
            exit 0
          fi

          git commit -m "fix: load real CJ products through GraphQL"
          git pull --rebase origin main
          git push origin HEAD:main
