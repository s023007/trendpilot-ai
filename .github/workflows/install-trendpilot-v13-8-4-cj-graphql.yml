      - name: Fetch real CJ products
        env:
          CJ_PERSONAL_ACCESS_TOKEN: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}
          CJ_COMPANY_ID: ${{ secrets.CJ_COMPANY_ID }}
          CJ_WEBSITE_ID: ${{ secrets.CJ_WEBSITE_ID }}
          CJ_MAX_PRODUCTS: "20000"
          CJ_PAGE_SIZE: "250"
        run: python automation/cj_api_fetch.py

      - name: Validate non-empty CJ catalogue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("data/cj-api-report.json")
          cache_path = Path("automation/cache/cj-products.json")
          if not report_path.exists() or not cache_path.exists():
              raise SystemExit("CJ report or cache was not created.")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          cache = json.loads(cache_path.read_text(encoding="utf-8"))
          products = cache.get("products", [])
          print("CJ status:", report.get("status"))
          print("CJ products:", len(products))
          print("CJ sellers:", report.get("topAdvertisers", {}))
          print("Joined advertisers:", report.get("advertiserLookup", {}).get("recordsReturned", 0))
          if not products:
              print(json.dumps(report.get("productSearch", {}), ensure_ascii=False, indent=2))
              raise SystemExit(
                  "CJ returned zero real products. Check CJ_COMPANY_ID and the productSearch diagnostics above."
              )
          if len(products) > 50000:
              raise SystemExit("CJ cache exceeded the configured safety limit.")
          raw = report_path.read_text(encoding="utf-8")
          if "CJ_PERSONAL_ACCESS_TOKEN" in raw or "Authorization: Bearer" in raw:
              raise SystemExit("Unsafe credential text detected in the public report.")
          PY

