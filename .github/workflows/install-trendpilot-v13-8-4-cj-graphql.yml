name: Install TrendPilot V13.8.4 CJ GraphQL Products

on:
  workflow_dispatch:
  schedule:
    # Runs after the older CJ diagnostic and before the main catalogue update.
    - cron: "20 2 * * *"

permissions:
  contents: write

concurrency:
  group: trendpilot-cj-graphql-v13-8-4
  cancel-in-progress: false

jobs:
  install-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate CJ secrets
        env:
          CJ_PERSONAL_ACCESS_TOKEN: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}
          CJ_COMPANY_ID: ${{ secrets.CJ_COMPANY_ID }}
          CJ_WEBSITE_ID: ${{ secrets.CJ_WEBSITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CJ_PERSONAL_ACCESS_TOKEN:-}" || {
            echo "::error::CJ_PERSONAL_ACCESS_TOKEN is missing."
            exit 1
          }
          test -n "${CJ_COMPANY_ID:-}" || {
            echo "::error::CJ_COMPANY_ID is missing. Add your CJ Company ID (CID), not the promotional property/PID."
            exit 1
          }
          test -n "${CJ_WEBSITE_ID:-}" || {
            echo "::error::CJ_WEBSITE_ID is missing. This is the promotional property/PID used by Link Search."
            exit 1
          }
          if [ "${CJ_COMPANY_ID}" = "${CJ_WEBSITE_ID}" ]; then
            echo "::warning::CJ_COMPANY_ID and CJ_WEBSITE_ID are identical. Confirm that one is the Company ID (CID) and the other is the promotional property/PID."
          fi
          echo "Required CJ secrets are present."

      - name: Install the CJ GraphQL bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/cache config/sources data

          cat > automation/cj_api_fetch.py <<'PY'
          #!/usr/bin/env python3
          """Fetch real joined CJ products through the current GraphQL Ads API.

          The legacy product-search REST endpoint was deprecated. This bridge uses
          ads.api.cj.com/query, discovers the live GraphQL schema, fetches only
          records available to the publisher Company ID, and keeps Link Search as
          a separate diagnostic because Link Search does not provide product links.
          """
          from __future__ import annotations

          import collections
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          ROOT = Path(__file__).resolve().parents[1]
          CACHE = ROOT / "automation" / "cache" / "cj-products.json"
          REPORT = ROOT / "data" / "cj-api-report.json"
          LINK_REPORT = ROOT / "data" / "cj-link-catalog.json"

          GRAPHQL_ENDPOINT = "https://ads.api.cj.com/query"
          ADVERTISER_ENDPOINT = "https://advertiser-lookup.api.cj.com/v2/advertiser-lookup"
          LINK_ENDPOINT = "https://link-search.api.cj.com/v2/link-search"

          PRODUCT_ROOT_PREFERENCE = (
              "products",
              "shoppingProducts",
              "travelExperienceProducts",
          )
          RESULT_LIST_PREFERENCE = (
              "resultList",
              "results",
              "records",
              "items",
              "products",
              "edges",
          )
          COUNT_FIELD_PREFERENCE = ("totalCount", "count", "total")
          KEYWORD_SEEDS = (
              "jewelry", "beads", "bracelet", "necklace", "craft",
              "diecast", "model car", "collectible", "toy",
              "electronics", "computer", "phone", "home", "kitchen",
              "beauty", "clothing", "shoes", "sports", "tools",
              "travel", "hotel", "flight", "ticket", "accessories",
          )

          TYPE_REF = """
          kind
          name
          ofType {
            kind
            name
            ofType {
              kind
              name
              ofType {
                kind
                name
                ofType { kind name }
              }
            }
          }
          """

          def now_iso() -> str:
              return datetime.now(timezone.utc).replace(microsecond=0).isoformat()

          def clean(value: object) -> str:
              return re.sub(r"\s+", " ", str(value or "")).strip()

          def gql_string(value: object) -> str:
              return json.dumps(str(value), ensure_ascii=False)

          def local_name(tag: object) -> str:
              return str(tag).rsplit("}", 1)[-1].strip().lower()

          def unwrap_type(type_ref: dict | None) -> tuple[str, bool, bool]:
              current = type_ref or {}
              required = current.get("kind") == "NON_NULL"
              is_list = False
              while current and current.get("kind") in {"NON_NULL", "LIST"}:
                  if current.get("kind") == "LIST":
                      is_list = True
                  current = current.get("ofType") or {}
              return clean(current.get("name")), is_list, required

          def post_graphql(token: str, query: str) -> dict:
              payload = json.dumps({"query": query}, separators=(",", ":")).encode("utf-8")
              request = urllib.request.Request(
                  GRAPHQL_ENDPOINT,
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "TrendPilotChoice-CJ-GraphQL/13.8.4",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  body = exc.read(1200).decode("utf-8", errors="replace")
                  raise RuntimeError(f"CJ GraphQL HTTP {exc.code}: {body}") from exc
              except urllib.error.URLError as exc:
                  raise RuntimeError(f"CJ GraphQL connection failed: {exc}") from exc
              try:
                  decoded = json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  sample = raw[:800].decode("utf-8", errors="replace")
                  raise RuntimeError(f"CJ GraphQL returned invalid JSON: {sample}") from exc
              errors = decoded.get("errors") or []
              if errors:
                  messages = "; ".join(clean(item.get("message")) for item in errors if isinstance(item, dict))
                  raise RuntimeError(f"CJ GraphQL errors: {messages[:1500]}")
              data = decoded.get("data")
              if not isinstance(data, dict):
                  raise RuntimeError("CJ GraphQL response did not contain a data object.")
              return data

          def request_xml(endpoint: str, params: dict[str, object], token: str) -> ET.Element:
              query = urllib.parse.urlencode(
                  {key: value for key, value in params.items() if value not in (None, "")}
              )
              request = urllib.request.Request(
                  f"{endpoint}?{query}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/xml,text/xml,*/*",
                      "User-Agent": "TrendPilotChoice-CJ-Diagnostics/13.8.4",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  body = exc.read(800).decode("utf-8", errors="replace")
                  raise RuntimeError(f"CJ REST HTTP {exc.code} from {endpoint}: {body}") from exc
              except urllib.error.URLError as exc:
                  raise RuntimeError(f"CJ REST connection failed for {endpoint}: {exc}") from exc
              try:
                  return ET.fromstring(raw)
              except ET.ParseError as exc:
                  sample = raw[:800].decode("utf-8", errors="replace")
                  raise RuntimeError(f"CJ REST returned invalid XML: {sample}") from exc

          def flatten_xml(element: ET.Element) -> dict[str, str]:
              row: dict[str, str] = {}
              for node in element.iter():
                  key = local_name(node.tag)
                  value = clean(node.text)
                  if key and value and key not in row:
                      row[key] = value
                  for attr, attr_value in node.attrib.items():
                      attr_key = local_name(attr)
                      if attr_key and clean(attr_value):
                          row.setdefault(attr_key, clean(attr_value))
                          row.setdefault(f"{key}-{attr_key}", clean(attr_value))
              return row

          def first(mapping: dict[str, Any], *keys: str) -> Any:
              lowered = {str(key).lower(): key for key in mapping}
              for wanted in keys:
                  key = lowered.get(wanted.lower())
                  if key is None:
                      continue
                  value = mapping.get(key)
                  if value not in (None, "", [], {}):
                      return value
              return ""

          def flatten_json(value: Any, prefix: str = "") -> dict[str, Any]:
              output: dict[str, Any] = {}
              if not isinstance(value, dict):
                  return output
              for key, item in value.items():
                  full = f"{prefix}.{key}" if prefix else str(key)
                  if isinstance(item, dict):
                      nested = flatten_json(item, full)
                      output.update(nested)
                      for nested_key, nested_value in nested.items():
                          output.setdefault(nested_key.rsplit(".", 1)[-1], nested_value)
                  else:
                      output[full] = item
                      output.setdefault(str(key), item)
              return output

          def as_number(value: object) -> float | None:
              raw = clean(value).replace(",", "").replace("%", "")
              match = re.search(r"-?\d+(?:\.\d+)?", raw)
              if not match:
                  return None
              try:
                  return float(match.group(0))
              except ValueError:
                  return None

          def inspect_schema(token: str) -> dict[str, dict]:
              query = f"""
              query TrendPilotRootSchema {{
                __schema {{
                  queryType {{
                    fields {{
                      name
                      args {{ name defaultValue type {{ {TYPE_REF} }} }}
                      type {{ {TYPE_REF} }}
                    }}
                  }}
                }}
              }}
              """
              data = post_graphql(token, query)
              fields = (((data.get("__schema") or {}).get("queryType") or {}).get("fields") or [])
              return {
                  clean(field.get("name")): field
                  for field in fields
                  if isinstance(field, dict) and clean(field.get("name"))
              }

          def inspect_type(token: str, type_name: str) -> dict[str, dict]:
              query = f"""
              query TrendPilotTypeSchema {{
                __type(name: {gql_string(type_name)}) {{
                  fields {{
                    name
                    args {{ name defaultValue type {{ {TYPE_REF} }} }}
                    type {{ {TYPE_REF} }}
                  }}
                }}
              }}
              """
              data = post_graphql(token, query)
              fields = ((data.get("__type") or {}).get("fields") or [])
              return {
                  clean(field.get("name")): field
                  for field in fields
                  if isinstance(field, dict) and clean(field.get("name"))
              }

          def choose_field(fields: dict[str, dict], preferred: tuple[str, ...]) -> str:
              lowered = {name.lower(): name for name in fields}
              for candidate in preferred:
                  if candidate.lower() in lowered:
                      return lowered[candidate.lower()]
              return ""

          def scalar_selection_for_type(token: str, type_name: str) -> str:
              fields = inspect_type(token, type_name)
              wanted = {
                  "id", "sku", "catalogId", "advertiserId", "advertiserName",
                  "title", "name", "description", "productType", "category",
                  "categoryName", "brand", "condition", "link", "buyUrl",
                  "clickUrl", "destinationUrl", "imageLink", "imageUrl",
                  "availability", "inStock", "currency", "upc", "gtin",
                  "manufacturerName", "lastUpdated", "updatedAt", "travelType",
                  "locationName", "city", "country", "startDate", "endDate",
              }
              nested_wanted = {
                  "price", "salePrice", "retailPrice", "shipping", "image", "advertiser"
              }
              selected: list[str] = []
              for name, info in fields.items():
                  base, is_list, _ = unwrap_type(info.get("type"))
                  kind = (info.get("type") or {}).get("kind")
                  current = info.get("type") or {}
                  while current and current.get("kind") in {"NON_NULL", "LIST"}:
                      current = current.get("ofType") or {}
                  kind = current.get("kind")
                  if name in wanted and kind in {"SCALAR", "ENUM"}:
                      selected.append(name)
                  elif name in nested_wanted and base:
                      nested_fields = inspect_type(token, base)
                      nested_scalars = []
                      for nested_name, nested_info in nested_fields.items():
                          nested_current = nested_info.get("type") or {}
                          while nested_current and nested_current.get("kind") in {"NON_NULL", "LIST"}:
                              nested_current = nested_current.get("ofType") or {}
                          if nested_current.get("kind") in {"SCALAR", "ENUM"} and nested_name in {
                              "amount", "currency", "value", "url", "link", "name", "id"
                          }:
                              nested_scalars.append(nested_name)
                      if nested_scalars:
                          selected.append(f"{name} {{ {' '.join(nested_scalars)} }}")
              # The public product record must contain at least a title and route.
              return " ".join(selected)

          def build_root_plan(token: str, root_name: str, root_info: dict) -> dict:
              result_type, result_is_list, _ = unwrap_type(root_info.get("type"))
              if not result_type:
                  raise RuntimeError(f"Could not determine result type for {root_name}.")
              if result_is_list:
                  item_type = result_type
                  result_list_field = ""
                  count_field = ""
                  item_selection = scalar_selection_for_type(token, item_type)
              else:
                  result_fields = inspect_type(token, result_type)
                  result_list_field = choose_field(result_fields, RESULT_LIST_PREFERENCE)
                  count_field = choose_field(result_fields, COUNT_FIELD_PREFERENCE)
                  if not result_list_field:
                      raise RuntimeError(f"No product list field found inside {root_name} result type {result_type}.")
                  list_info = result_fields[result_list_field]
                  item_type, _, _ = unwrap_type(list_info.get("type"))
                  if not item_type:
                      raise RuntimeError(f"Could not determine item type for {root_name}.{result_list_field}.")
                  if result_list_field.lower() == "edges":
                      edge_fields = inspect_type(token, item_type)
                      node_field = choose_field(edge_fields, ("node", "item", "product"))
                      if not node_field:
                          raise RuntimeError(f"No node field found inside {root_name}.edges.")
                      node_type, _, _ = unwrap_type(edge_fields[node_field].get("type"))
                      item_selection = f"{node_field} {{ {scalar_selection_for_type(token, node_type)} }}"
                  else:
                      item_selection = scalar_selection_for_type(token, item_type)
              if not item_selection:
                  raise RuntimeError(f"No usable product fields were found for {root_name}.")
              return {
                  "root": root_name,
                  "args": root_info.get("args") or [],
                  "resultIsList": result_is_list,
                  "listField": result_list_field,
                  "countField": count_field,
                  "selection": item_selection,
              }

          def argument_literal(arg: dict, value: Any) -> str:
              base, is_list, _ = unwrap_type(arg.get("type"))
              if is_list:
                  values = value if isinstance(value, list) else [value]
                  return "[" + ",".join(gql_string(item) for item in values) + "]"
              if base in {"Int", "Float", "Long"}:
                  return str(int(value))
              if base == "Boolean":
                  return "true" if bool(value) else "false"
              return gql_string(value)

          def root_arguments(
              plan: dict,
              company_id: str,
              website_id: str,
              limit: int,
              position: int,
              keyword: str | None,
              advertiser_ids: list[str],
          ) -> tuple[str, str]:
              assignments: list[str] = []
              paging_mode = "none"
              known = set()
              for arg in plan["args"]:
                  name = clean(arg.get("name"))
                  lower = name.lower()
                  _, _, required = unwrap_type(arg.get("type"))
                  value: Any = None
                  if lower in {"companyid", "company_id", "requestorcid", "requestor-cid"}:
                      value = company_id
                  elif lower in {"websiteid", "website_id", "propertyid", "property_id", "pid"}:
                      value = website_id
                  elif lower in {"limit", "maxresults", "max_results", "first", "pagesize", "page_size"}:
                      value = limit
                      paging_mode = paging_mode if paging_mode != "none" else "offset"
                  elif lower in {"offset", "start", "startindex", "start_index"}:
                      value = position
                      paging_mode = "offset"
                  elif lower in {"page", "pagenumber", "page_number"}:
                      value = position // max(1, limit) + 1
                      paging_mode = "page"
                  elif lower in {"keywords", "keyword", "searchterms", "search_terms", "query"}:
                      if keyword:
                          value = [keyword] if unwrap_type(arg.get("type"))[1] else keyword
                      elif required:
                          value = ["product"] if unwrap_type(arg.get("type"))[1] else "product"
                  elif lower in {"advertiserids", "advertiser_ids", "advertisers"} and advertiser_ids:
                      value = advertiser_ids if unwrap_type(arg.get("type"))[1] else ",".join(advertiser_ids)
                  elif required and arg.get("defaultValue") is None:
                      raise RuntimeError(f"Unsupported required argument {name} on {plan['root']}.")
                  if value is not None:
                      assignments.append(f"{name}: {argument_literal(arg, value)}")
                      known.add(lower)
              return ", ".join(assignments), paging_mode

          def extract_rows(payload: Any, plan: dict) -> tuple[list[dict], int]:
              if plan["resultIsList"]:
                  rows = payload if isinstance(payload, list) else []
                  return [item for item in rows if isinstance(item, dict)], len(rows)
              if not isinstance(payload, dict):
                  return [], 0
              total = as_number(payload.get(plan["countField"])) if plan["countField"] else None
              container = payload.get(plan["listField"])
              rows: list[dict] = []
              if isinstance(container, list):
                  for item in container:
                      if not isinstance(item, dict):
                          continue
                      if plan["listField"].lower() == "edges":
                          node = first(item, "node", "item", "product")
                          if isinstance(node, dict):
                              rows.append(node)
                      else:
                          rows.append(item)
              return rows, int(total or len(rows))

          def normalize_product(row: dict, root_name: str) -> dict | None:
              flat = flatten_json(row)
              title = clean(first(flat, "title", "name", "productName"))
              affiliate_url = clean(first(
                  flat, "link", "buyUrl", "clickUrl", "affiliateUrl",
                  "advertiserTrackingUrl", "destinationUrl"
              ))
              if not title or not affiliate_url.startswith(("http://", "https://")):
                  return None
              advertiser = clean(first(flat, "advertiserName", "advertiser.name", "advertiser")) or "CJ advertiser"
              advertiser_id = clean(first(flat, "advertiserId", "advertiser.id"))
              sku = clean(first(flat, "sku", "id", "catalogId", "upc", "gtin"))
              stable_source = "|".join(part for part in (advertiser_id, sku, title, affiliate_url) if part)
              product_id = sku or hashlib.sha1(stable_source.encode("utf-8")).hexdigest()[:24]
              price = as_number(first(
                  flat,
                  "salePrice.amount", "price.amount", "retailPrice.amount",
                  "salePrice", "price", "amount"
              ))
              old_price = as_number(first(flat, "retailPrice.amount", "retailPrice"))
              if old_price is not None and price is not None and old_price <= price:
                  old_price = None
              currency = clean(first(
                  flat,
                  "salePrice.currency", "price.currency", "retailPrice.currency", "currency"
              )) or "USD"
              category = clean(first(
                  flat, "productType", "categoryName", "category", "travelType"
              ))
              description = clean(first(flat, "description", "productHighlight"))
              image = clean(first(flat, "imageLink", "imageUrl", "image.url"))
              brand = clean(first(flat, "brand", "manufacturerName"))
              availability = clean(first(flat, "availability", "inStock")) or "true"
              return {
                  "productId": product_id,
                  "sku": sku,
                  "name": title,
                  "description": description,
                  "category": category,
                  "brand": brand,
                  "affiliateUrl": affiliate_url,
                  "productUrl": clean(first(flat, "destinationUrl")),
                  "imageUrl": image,
                  "price": price,
                  "oldPrice": old_price,
                  "currency": currency,
                  "availability": availability,
                  "advertiser": advertiser,
                  "advertiserId": advertiser_id,
                  "catalogId": clean(first(flat, "catalogId")),
                  "country": clean(first(flat, "country")),
                  "vertical": root_name,
                  "updatedAt": now_iso(),
                  "sourceNetwork": "CJ",
              }

          def fetch_joined_advertisers(token: str, company_id: str) -> tuple[list[dict], dict]:
              advertisers: list[dict] = []
              page = 1
              while page <= 20:
                  root = request_xml(
                      ADVERTISER_ENDPOINT,
                      {
                          "requestor-cid": company_id,
                          "advertiser-ids": "joined",
                          "records-per-page": 100,
                          "page-number": page,
                      },
                      token,
                  )
                  rows = []
                  for node in root.iter():
                      if local_name(node.tag) == "advertiser":
                          rows.append(flatten_xml(node))
                  for row in rows:
                      advertiser_id = clean(first(row, "advertiser-id", "advertiserid", "cid"))
                      name = clean(first(row, "advertiser-name", "advertisername", "program-name"))
                      if advertiser_id or name:
                          advertisers.append({"advertiserId": advertiser_id, "advertiserName": name})
                  if len(rows) < 100:
                      break
                  page += 1
                  time.sleep(0.25)
              unique: dict[str, dict] = {}
              for item in advertisers:
                  key = item["advertiserId"] or item["advertiserName"].lower()
                  unique[key] = item
              values = list(unique.values())
              return values, {
                  "endpoint": ADVERTISER_ENDPOINT,
                  "recordsReturned": len(values),
                  "advertisers": values[:100],
              }

          def fetch_link_diagnostic(token: str, website_id: str) -> tuple[list[dict], dict]:
              links: list[dict] = []
              page = 1
              while page <= 10:
                  root = request_xml(
                      LINK_ENDPOINT,
                      {
                          "website-id": website_id,
                          "advertiser-ids": "joined",
                          "records-per-page": 100,
                          "page-number": page,
                      },
                      token,
                  )
                  rows = []
                  for node in root.iter():
                      if local_name(node.tag) == "link":
                          rows.append(flatten_xml(node))
                  for row in rows:
                      links.append({
                          "advertiser": clean(first(row, "advertiser-name", "advertisername")),
                          "name": clean(first(row, "link-name", "linkname", "description")),
                          "linkType": clean(first(row, "link-type", "linktype")),
                          "clickUrl": clean(first(row, "click-url", "clickurl")),
                          "destinationUrl": clean(first(row, "destination", "destination-url", "destinationurl")),
                      })
                  if len(rows) < 100:
                      break
                  page += 1
                  time.sleep(0.25)
              advertisers = collections.Counter(item["advertiser"] or "Unknown" for item in links)
              link_types = collections.Counter(item["linkType"] or "Unknown" for item in links)
              return links, {
                  "endpoint": LINK_ENDPOINT,
                  "recordsReturned": len(links),
                  "topAdvertisers": dict(advertisers.most_common(30)),
                  "linkTypes": dict(link_types.most_common()),
                  "note": "Link Search is retained for banners and promotional links; it is not used to invent product records.",
              }

          def fetch_graphql_products(
              token: str,
              company_id: str,
              website_id: str,
              joined_ids: list[str],
              max_products: int,
          ) -> tuple[list[dict], dict]:
              schema = inspect_schema(token)
              roots = [name for name in PRODUCT_ROOT_PREFERENCE if name in schema]
              if not roots:
                  available = [name for name in schema if "product" in name.lower()]
                  raise RuntimeError(
                      "CJ GraphQL schema contains no supported product query. "
                      f"Product-like fields: {available[:30]}"
                  )
              products: list[dict] = []
              seen: set[str] = set()
              root_reports = []
              per_page = min(500, max(25, int(os.environ.get("CJ_PAGE_SIZE", "250"))))
              for root_name in roots:
                  if len(products) >= max_products:
                      break
                  try:
                      plan = build_root_plan(token, root_name, schema[root_name])
                  except Exception as exc:
                      root_reports.append({"root": root_name, "status": "schema-error", "error": clean(exc)[:1000]})
                      continue
                  arg_names = {clean(item.get("name")).lower() for item in plan["args"]}
                  keyword_required = False
                  for arg in plan["args"]:
                      name = clean(arg.get("name")).lower()
                      _, _, required = unwrap_type(arg.get("type"))
                      if name in {"keywords", "keyword", "searchterms", "search_terms", "query"} and required and arg.get("defaultValue") is None:
                          keyword_required = True
                  keyword_rounds: list[str | None] = list(KEYWORD_SEEDS) if keyword_required else [None]
                  # If a keyword-free query is accepted but produces zero rows, a
                  # second pass with useful buyer categories is attempted.
                  root_accepted_before = len(products)
                  pages_read = 0
                  total_reported = 0
                  errors: list[str] = []
                  for pass_index in range(2):
                      rounds = keyword_rounds if pass_index == 0 else list(KEYWORD_SEEDS)
                      if pass_index == 1 and (keyword_required or len(products) > root_accepted_before):
                          break
                      for keyword in rounds:
                          position = 0
                          while len(products) < max_products:
                              try:
                                  args, paging_mode = root_arguments(
                                      plan,
                                      company_id,
                                      website_id,
                                      per_page,
                                      position,
                                      keyword,
                                      joined_ids[:100],
                                  )
                                  body_fields = []
                                  if plan["countField"]:
                                      body_fields.append(plan["countField"])
                                  if plan["resultIsList"]:
                                      query = f"query TrendPilotProducts {{ {root_name}({args}) {{ {plan['selection']} }} }}"
                                  else:
                                      body_fields.append(f"{plan['listField']} {{ {plan['selection']} }}")
                                      query = f"query TrendPilotProducts {{ {root_name}({args}) {{ {' '.join(body_fields)} }} }}"
                                  data = post_graphql(token, query)
                                  rows, total = extract_rows(data.get(root_name), plan)
                                  pages_read += 1
                                  total_reported = max(total_reported, total)
                              except Exception as exc:
                                  errors.append(clean(exc)[:1000])
                                  break
                              accepted_this_page = 0
                              for row in rows:
                                  item = normalize_product(row, root_name)
                                  if not item:
                                      continue
                                  stable = "|".join([
                                      item.get("advertiserId", ""),
                                      item.get("productId", ""),
                                      item.get("affiliateUrl", ""),
                                  ])
                                  if stable in seen:
                                      continue
                                  seen.add(stable)
                                  products.append(item)
                                  accepted_this_page += 1
                                  if len(products) >= max_products:
                                      break
                              print(
                                  f"CJ {root_name} keyword={keyword!r} position={position}: "
                                  f"rows={len(rows)}, accepted={accepted_this_page}, total={len(products)}"
                              )
                              if not rows or len(rows) < per_page or paging_mode == "none":
                                  break
                              position += per_page
                              time.sleep(0.3)
                          if len(products) >= max_products:
                              break
                      if len(products) >= max_products:
                          break
                  root_reports.append({
                      "root": root_name,
                      "status": "processed" if len(products) > root_accepted_before else "no-products",
                      "pagesRead": pages_read,
                      "totalReported": total_reported,
                      "recordsAccepted": len(products) - root_accepted_before,
                      "errors": errors[:5],
                  })
              return products, {
                  "endpoint": GRAPHQL_ENDPOINT,
                  "schemaProductRoots": roots,
                  "recordsAccepted": len(products),
                  "limitApplied": max_products,
                  "roots": root_reports,
              }

          def write_outputs(products: list[dict], report: dict, links: list[dict]) -> None:
              CACHE.parent.mkdir(parents=True, exist_ok=True)
              REPORT.parent.mkdir(parents=True, exist_ok=True)
              CACHE.write_text(
                  json.dumps({"products": products}, ensure_ascii=False, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              REPORT.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              LINK_REPORT.write_text(
                  json.dumps({"generatedAt": now_iso(), "links": links}, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          def main() -> int:
              token = os.environ.get("CJ_PERSONAL_ACCESS_TOKEN", "").strip()
              company_id = os.environ.get("CJ_COMPANY_ID", "").strip()
              website_id = os.environ.get("CJ_WEBSITE_ID", "").strip()
              max_products = max(100, min(50000, int(os.environ.get("CJ_MAX_PRODUCTS", "20000"))))
              if not token or not company_id:
                  raise SystemExit("CJ_PERSONAL_ACCESS_TOKEN and CJ_COMPANY_ID are required.")

              report: dict[str, Any] = {
                  "version": "13.8.4",
                  "generatedAt": now_iso(),
                  "companyIdMasked": f"***{company_id[-4:]}" if len(company_id) >= 4 else "***",
                  "websiteIdMasked": f"***{website_id[-4:]}" if len(website_id) >= 4 else "",
                  "status": "started",
                  "advertiserLookup": {},
                  "productSearch": {},
                  "linkSearch": {},
                  "topAdvertisers": {},
                  "notes": [],
              }
              joined: list[dict] = []
              links: list[dict] = []
              try:
                  joined, report["advertiserLookup"] = fetch_joined_advertisers(token, company_id)
              except Exception as exc:
                  report["advertiserLookup"] = {"status": "error", "error": clean(exc)[:1200]}
                  print(f"Advertiser Lookup warning: {exc}", file=sys.stderr)
              joined_ids = [item["advertiserId"] for item in joined if item.get("advertiserId")]
              try:
                  products, report["productSearch"] = fetch_graphql_products(
                      token, company_id, website_id, joined_ids, max_products
                  )
              except Exception as exc:
                  products = []
                  report["productSearch"] = {
                      "endpoint": GRAPHQL_ENDPOINT,
                      "status": "error",
                      "error": clean(exc)[:1800],
                      "recordsAccepted": 0,
                  }
                  print(f"Product GraphQL warning: {exc}", file=sys.stderr)
              if website_id:
                  try:
                      links, report["linkSearch"] = fetch_link_diagnostic(token, website_id)
                  except Exception as exc:
                      report["linkSearch"] = {"status": "error", "error": clean(exc)[:1200]}
                      print(f"Link Search warning: {exc}", file=sys.stderr)
              advertiser_counts = collections.Counter(
                  item.get("advertiser") or "Unknown" for item in products
              )
              report["topAdvertisers"] = dict(advertiser_counts.most_common(50))
              report["status"] = "success" if products else "connected-no-products"
              if not products:
                  report["notes"].append(
                      "CJ authentication was tested but no usable GraphQL product records were returned. "
                      "Confirm CJ_COMPANY_ID is the publisher Company ID/CID, confirm the advertisers expose "
                      "searchable product feeds, and inspect productSearch.errors."
                  )
              write_outputs(products, report, links)
              print(f"CJ joined advertisers detected: {len(joined):,}")
              print(f"CJ GraphQL products accepted: {len(products):,}")
              print(f"CJ advertisers represented: {len(advertiser_counts):,}")
              print(f"CJ promotional links diagnosed: {len(links):,}")
              errors = json.dumps(report, ensure_ascii=False)
              if "HTTP 401" in errors or "HTTP 403" in errors:
                  return 3
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY

