          for path in (SITE_JS, FIND_PAGE, TICKETS_PAGE):
              if not path.exists():
                  raise SystemExit(f"Required file not found: {path}")

          site = SITE_JS.read_text(encoding="utf-8")

          approved_ids = [
              "2357926", "7287203", "5893489", "7227612", "4295086",
              "6293473", "4837117", "7753674", "2288710", "4368684",
          ]
          approved_names = [
              "diecast", "diecastcom", "diecastmodelswholesale",
              "diecastmodelswholesalecom", "fragranceshop", "fragranceshopcom",
              "thefragranceshop", "thefragranceshopcom", "karaca", "karacaeu",
              "karacaeurope", "mfi", "mfimedical", "pandahall", "pandahallcom",
              "temu", "temucom", "shoptemu", "nordvpn", "sportsevents365",
              "ticketnetwork", "ticketnetworkcom", "tripcom", "tripcomglobal",
          ]

          site = re.sub(
              r'const TP_CJ_GUARD_VERSION = "[^"]+";',
              f'const TP_CJ_GUARD_VERSION = "{VERSION}";',
              site,
              count=1,
          )
          site = re.sub(
              r'const TP_CJ_APPROVED_IDS = new Set\(\[[^\]]*\]\);',
              'const TP_CJ_APPROVED_IDS = new Set(' + json.dumps(approved_ids) + ');',
              site,
              count=1,
          )
          site = re.sub(
              r'const TP_CJ_APPROVED_NAMES = new Set\(\[[^\]]*\]\);',
              'const TP_CJ_APPROVED_NAMES = new Set(' + json.dumps(approved_names) + ');',
              site,
              count=1,
          )
          site = re.sub(
              r'const TP_CJ_KNOWN_NAMES = new Set\(\[[^\]]*\]\);',
              'const TP_CJ_KNOWN_NAMES = new Set(' + json.dumps(["cjjoinedadvertisers", *approved_names]) + ');',
              site,
              count=1,
          )

          # V13.8.22 called this function but never defined it, which stopped
          # renderFinder() and left the page on “Loading products…”.
          site = re.sub(
              r'\n\s*// TP_PUBLIC_SELLER_GUARD_START[\s\S]*?// TP_PUBLIC_SELLER_GUARD_END\s*\n',
              '\n',
              site,
              count=1,
          )
          public_guard = r'''
            // TP_PUBLIC_SELLER_GUARD_START
            function tpPublicSellerAllowed(p) {
              if (!p) return false;
              const title = clean(p.name || p.title);
              const target = clean(p.url || p.affiliateUrl || p.productUrl);
              return Boolean(title && validUrl(target));
            }
            // TP_PUBLIC_SELLER_GUARD_END
          '''
          guard_anchor = "  // TP_CJ_EXACT_GUARD_END"
          if guard_anchor not in site:
              raise SystemExit("CJ guard anchor was not found in site-v13-5.js")
          site = site.replace(guard_anchor, guard_anchor + "\n" + textwrap.dedent(public_guard).rstrip(), 1)

          # Seller choices must come from matched results, not unrelated catalogue rows.
          old_sellers = 'const sellers=uniq(rows.filter(tpCjPublicAllowed).map(p=>p.advertiser)).filter(Boolean).sort();'
          new_sellers = '''const matchedRows=uniqProducts([...(state.exact||[]),...(state.alternatives||[])]);
              const sellerSource=matchedRows.length?matchedRows:rows;
              const sellers=uniq(sellerSource.filter(p=>tpCjPublicAllowed(p)&&tpPublicSellerAllowed(p)).map(p=>p.advertiser)).filter(Boolean).sort();'''
          if old_sellers in site:
              site = site.replace(old_sellers, new_sellers, 1)
          elif "const matchedRows=uniqProducts" not in site:
              raise SystemExit("Seller filter patch anchor was not found")

          # Never allow one slow catalogue request or a rendering error to leave the UI frozen.
          robust_search = r'''  async function performSearch(query,push=true,scope=""){
            const normalized=normalizeQuery(query);
            state.originalQuery=normalized.original; state.query=normalized.query; state.queryCorrected=normalized.corrected;
            state.scope=scope||""; state.shown=24; state.activeTab="exact"; state.products=[]; state.exact=[]; state.alternatives=[]; state.segmentState.clear(); state.loading=true;
            resetFilterControls();
            const grid=$('[data-tp-product-grid]');
            if(grid)grid.innerHTML='<div class="tp-empty"><h3>Checking matching products…</h3><p>TrendPilot is loading the most relevant catalogue records.</p></div>';
            try {
              const m=await loadManifest(); state.plan=makePlan(state.query,m,state.scope); state.segments=state.plan.segmentKeys.map(segmentMeta).filter(Boolean);
              if(push){const params=new URLSearchParams({q:state.query});if(state.scope)params.set("scope",state.scope);history.replaceState(null,"",`/find/?${params.toString()}`);}
              const input=$('[data-tp-finder-input]');if(input)input.value=state.query;
              const scopeSelect=$('[data-tp-finder-scope]');if(scopeSelect)scopeSelect.value=state.scope;
              const results=await Promise.allSettled([
                state.manifest.version==="fallback"?Promise.resolve(state.products):loadInitialSegments(),
                loadCjProducts()
              ]);
              const rows=results[0].status==="fulfilled"?results[0].value:[];
              const cjRows=results[1].status==="fulfilled"?results[1].value:[];
              mergeProducts([...rows,...cjRows]);
              await Promise.race([ensureMinimumExact(24),new Promise(resolve=>setTimeout(resolve,6500))]);
              populateFilters(); renderFinder();
            } catch(error) {
              console.error("TrendPilot product search failed safely",error);
              if(!state.plan){state.plan={q:state.query,groups:[],family:"",families:[],audience:"",segmentKeys:[],alternativeKeys:[],intentTokens:[],exactIntent:false};}
              try { populateFilters(); renderFinder(); } catch(renderError) {
                console.error("TrendPilot finder fallback failed",renderError);
                if(grid)grid.innerHTML='<div class="tp-empty"><h3>Products could not be displayed.</h3><p>Refresh once or try another search. No unrelated products were substituted.</p></div>';
              }
              const status=$('[data-tp-finder-status]');if(status)status.textContent="The catalogue could not finish loading. Try again or change the search.";
            } finally {
              state.loading=false;
            }
          }
          '''
          # Locate the two function boundaries without depending on indentation.
          # Earlier releases formatted the closing brace at different indentation
          # levels, so a whitespace-sensitive regular expression was unreliable.
          perform_marker = 'async function performSearch(query,push=true,scope=""){'
          show_more_marker = 'async function showMore(){'

          perform_start = site.find(perform_marker)
          if perform_start < 0:
              raise SystemExit("performSearch function was not found")

          show_more_start = site.find(
              show_more_marker,
              perform_start + len(perform_marker),
          )
          if show_more_start < 0:
              raise SystemExit("showMore function was not found after performSearch")

          perform_line_start = site.rfind("\n", 0, perform_start) + 1
          show_more_line_start = site.rfind("\n", 0, show_more_start) + 1
