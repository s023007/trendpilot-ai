          function tpCjTitle(p) {{ return clean(tpCjValue(p,["title","name","productName","product_name"])); }}
          function tpCjTrackingUrl(value) {{ if(!validUrl(value))return false; try{{return TP_CJ_TRACKING_HOST_RE.test(new URL(value).hostname.toLowerCase());}}catch{{return false;}} }}
          function tpIsCjItem(p) {{ const seller=tpCjSellerKey(tpCjSeller(p)); const context=lower([p&&p.network,p&&p.networkName,p&&p.provider,p&&p.source,p&&p.sourceId,p&&p.programme,p&&p.program,p&&p.platform,p&&p.affiliateNetwork].map(value=>clean(value)).join(" ")); return Boolean(TP_CJ_KNOWN_NAMES.has(seller)||TP_CJ_APPROVED_IDS.has(tpCjId(p))||context.includes("commission junction")||/(^|[^a-z])cj([^a-z]|$)/i.test(context)||tpCjTrackingUrl(tpCjUrl(p))); }}
          function tpCjSpecificEvidence(p) {{ const title=tpCjTitle(p),seller=tpCjSeller(p),titleKey=tpCjSellerKey(title),sellerKey=tpCjSellerKey(seller),url=tpCjUrl(p),image=tpCjImage(p); if(!title||!validUrl(url)||!validUrl(image))return false; if(TP_CJ_GENERIC_TITLES.has(titleKey))return false; if(titleKey&&sellerKey&&titleKey===sellerKey)return false; return true; }}
          function tpCjApproved(p) {{ const id=tpCjId(p),seller=tpCjSellerKey(tpCjSeller(p)); return TP_CJ_APPROVED_IDS.has(id)||TP_CJ_APPROVED_NAMES.has(seller); }}
          function tpCjPublicAllowed(p) {{ if(!p||!tpIsCjItem(p))return Boolean(p); return tpCjApproved(p)&&tpCjSpecificEvidence(p); }}
          function tpCjOfferAllowed(offer,parent) {{ const row=Object.assign({{}},parent||{{}},offer||{{}}); if(!tpIsCjItem(row))return true; return tpCjApproved(row)&&validUrl(tpCjUrl(row)); }}
          // TP_CJ_EXACT_GUARD_END'''
          site, guard_count = re.subn(
              r"\s*// TP_CJ_EXACT_GUARD_START[\s\S]*?// TP_CJ_EXACT_GUARD_END",
              lambda _match: "\n" + guard_block,
              site,
              count=1,
          )
          if guard_count != 1:
              raise SystemExit("Could not replace the complete CJ browser guard")
          SITE_JS.write_text(site, encoding="utf-8")

          # Build an event-first dataset from every joined CJ ticket/travel link returned,
          # not only the small preview list stored in the partner directory.
          offers_payload = json.loads((DATA / "cj-offers.json").read_text(encoding="utf-8"))
          ticket_ids = {"7753674", "2288710", "4368684"}
          generic_names = {
              "generalhomepage", "homepage", "home", "allliveevents", "all events",
              "currentoffer", "currentoffers", "shopnow", "browse", "officialsite",
          }

          def infer_type(provider: str, title: str, description: str) -> str:
              text = f"{title} {description}".lower()
              if provider == "Trip.com (Global)":
                  return "travel"
              if re.search(r"\b(concert|tour|music|festival|singer|band|muse|halsey|bon jovi)\b", text):
                  return "concerts"
              if re.search(r"\b(theatre|theater|musical|broadway|show|opera|ballet|comedy)\b", text):
                  return "theatre"
              return "sports"

          def parse_price(text: str) -> tuple[float | None, str]:
              patterns = [
                  (r"(?:USD|US\$|\$)\s*([0-9]+(?:[.,][0-9]{1,2})?)", "USD"),
                  (r"(?:EUR|€)\s*([0-9]+(?:[.,][0-9]{1,2})?)", "EUR"),
                  (r"(?:GBP|£)\s*([0-9]+(?:[.,][0-9]{1,2})?)", "GBP"),
                  (r"(?:OMR)\s*([0-9]+(?:[.,][0-9]{1,3})?)", "OMR"),
              ]
              for pattern, currency in patterns:
                  match = re.search(pattern, text, flags=re.I)
                  if match:
                      try:
                          return float(match.group(1).replace(",", ".")), currency
                      except ValueError:
                          pass
              return None, ""

          def parse_field(text: str, pattern: str) -> str:
              match = re.search(pattern, text, flags=re.I)
              return clean(match.group(1)) if match else ""

          events: list[dict[str, Any]] = []
          seen: set[str] = set()
          for row in offers_payload.get("offers") or []:
              advertiser_id = clean(row.get("advertiserId"))
              if advertiser_id not in ticket_ids:
                  continue
              title = clean(row.get("name"))
              description = clean(row.get("description"))
              url = clean(row.get("url"))
              if not title or not valid_url(url):
                  continue
              key = re.sub(r"[^a-z0-9]+", "", title.lower())
              if key in {re.sub(r"[^a-z0-9]+", "", value.lower()) for value in generic_names}:
                  continue
              provider = clean(row.get("advertiser"))
              combined = f"{title} {description}"
              price, currency = parse_price(combined)
              event_id = "ticket-" + hashlib.sha256(f"{advertiser_id}|{title}|{url}".encode("utf-8")).hexdigest()[:22]
              if event_id in seen:
                  continue
              seen.add(event_id)
              events.append({
                  "id": event_id,
                  "title": title,
                  "provider": provider,
                  "advertiserId": advertiser_id,
                  "type": infer_type(provider, title, description),
                  "description": description or "Open the live provider listing to confirm the event, date, seat and final total.",
                  "url": url,
                  "destination": clean(row.get("destination")),
                  "price": price,
                  "currency": currency,
                  "date": parse_field(combined, r"\b((?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{1,2}(?:,?\s+\d{4})?)\b"),
                  "venue": parse_field(combined, r"\bat\s+([^|,;]{3,70})"),
                  "section": parse_field(combined, r"\bsection\s*[:#-]?\s*([A-Za-z0-9 -]{1,24})"),
                  "row": parse_field(combined, r"\brow\s*[:#-]?\s*([A-Za-z0-9 -]{1,16})"),
                  "priceStatus": "feed" if price is not None else "live-provider",
                  "source": "CJ joined link feed",
              })

          events.sort(key=lambda row: (row["type"], row["provider"], row["title"].lower()))
          (DATA / "ticket-events.json").write_text(
              json.dumps({"version": VERSION, "count": len(events), "events": events}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
