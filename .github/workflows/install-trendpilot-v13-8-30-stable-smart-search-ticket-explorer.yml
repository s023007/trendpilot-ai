          .tp-cj-card-top{display:flex;align-items:center;gap:13px}.tp-cj-icon{display:grid;place-items:center;flex:0 0 48px;width:48px;height:48px;border-radius:15px;background:#eaf1ff;color:#244fbd;font-weight:950;font-size:.83rem}
