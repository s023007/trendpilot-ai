          ''', encoding="utf-8")

          SMART_JS.write_text(r'''
          (()=>{"use strict";const d=document,$=(s,r=d)=>r.querySelector(s),$$=(s,r=d)=>Array.from(r.querySelectorAll(s));const clean=v=>String(v??"").replace(/\s+/g," ").trim();const low=v=>clean(v).toLowerCase();let productsPromise=null,ticketsPromise=null;
          const curated={product:["Phone cases","Wireless earbuds","Smart watches","Men's T-shirts","Women's fashion","Home & kitchen","Car accessories","School supplies","Beauty & skincare","Tools","Toys","Craft supplies"],ticket:["Premier League","Champions League","Formula 1","NBA","NFL","Concert tickets","Theatre shows","Muse","Halsey","Hotels","Flights","Attractions"],software:["VPN privacy","Edit PDF","Create video","Transfer WhatsApp","Phone data recovery","Password manager","Antivirus"],coupon:["Temu","Lenovo","AliExpress","Geekbuying","Wondershare","NordVPN"]};
          async function productRows(){if(!productsPromise)productsPromise=fetch(`/data/cj-products.json?v=13.8.30-${Date.now()}`,{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(x=>(x.products||[]).map(p=>({value:clean(p.name),meta:`${clean(p.advertiser)} · ${clean(p.family||p.category)}`}))).catch(()=>[]);return productsPromise;}
          async function ticketRows(){if(!ticketsPromise)ticketsPromise=fetch(`/data/ticket-events.json?v=13.8.30-${Date.now()}`,{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(x=>(x.events||[]).map(e=>({value:clean(e.title),meta:`${clean(e.provider)} · ${clean(e.type)}`}))).catch(()=>[]);return ticketsPromise;}
          function kind(input){if(input.matches('[name="ticketQuery"]')||d.body.matches('[data-tp-page="tickets"]'))return"ticket";if(input.matches('[data-coupon-search]'))return"coupon";if(input.closest('[data-tp-tool-form]'))return"software";return"product";}
          function rank(query,row){const value=low(row.value),q=low(query);if(value===q)return-2;if(value.startsWith(q))return-1;if(value.split(/\s+/).some(w=>w.startsWith(q)))return 0;const pos=value.indexOf(q);return pos<0?999:pos+2;}
          async function source(input){const k=kind(input),base=(curated[k]||[]).map(value=>({value,meta:"Popular suggestion"}));if(k==="product")return[...base,...await productRows()];if(k==="ticket")return[...base,...await ticketRows()];if(k==="coupon"){const rows=(globalThis.TREND_PILOT_COUPONS||globalThis.TRENDPILOT_COUPONS||{}).coupons||[];return[...base,...rows.map(c=>({value:clean(c.merchant_name||c.merchant_key||c.title),meta:"Coupon or merchant"}))];}return base;}
          function choose(input,value){input.value=value;input.dispatchEvent(new Event("input",{bubbles:true}));input.dispatchEvent(new Event("change",{bubbles:true}));const form=input.form||input.closest("form");if(kind(input)!=="coupon"&&form){setTimeout(()=>form.requestSubmit?form.requestSubmit():form.submit(),0);}else input.focus();}
          function attach(input){if(input.dataset.tpSmartReady)return;input.dataset.tpSmartReady="1";const host=input.parentElement;host?.classList.add("tp-smart-search-host");const box=d.createElement("div");box.className="tp-smart-suggestions";box.hidden=true;box.setAttribute("role","listbox");host?.appendChild(box);let active=-1,current=[];
          async function update(){const q=clean(input.value);if(q.length<1){box.hidden=true;return;}const rows=await source(input);const seen=new Set;current=rows.filter(r=>r.value).sort((a,b)=>rank(q,a)-rank(q,b)).filter(r=>rank(q,r)<999).filter(r=>{const key=low(r.value);if(seen.has(key))return false;seen.add(key);return true;}).slice(0,9);active=-1;box.innerHTML=current.length?`<div class="tp-smart-heading">Suggestions</div>`+current.map((r,i)=>`<button class="tp-smart-option" type="button" role="option" data-smart-index="${i}"><b>${r.value.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}</b><small>${r.meta||""}</small></button>`).join(""):"";box.hidden=!current.length;}
          input.addEventListener("input",()=>{clearTimeout(input._tpSuggestTimer);input._tpSuggestTimer=setTimeout(update,80);});input.addEventListener("focus",()=>{if(clean(input.value))update();});box.addEventListener("pointerdown",e=>{const b=e.target.closest("[data-smart-index]");if(!b)return;e.preventDefault();box.hidden=true;choose(input,current[Number(b.dataset.smartIndex)].value);});input.addEventListener("keydown",e=>{if(box.hidden||!current.length)return;if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();active=(active+(e.key==="ArrowDown"?1:-1)+current.length)%current.length;$$('[data-smart-index]',box).forEach((b,i)=>b.classList.toggle("is-active",i===active));}else if(e.key==="Enter"&&active>=0){e.preventDefault();const row=current[active];box.hidden=true;choose(input,row.value);}else if(e.key==="Escape")box.hidden=true;});d.addEventListener("pointerdown",e=>{if(!host?.contains(e.target))box.hidden=true;});}
          function init(){$$('input[type="search"],[data-coupon-search]').forEach(attach);}if(d.readyState==="loading")d.addEventListener("DOMContentLoaded",init,{once:true});else init();})();
          ''', encoding="utf-8")

          # Enhanced ticket explorer: event cards first, provider comparison second,
          # Quick View, internal details, and all current event-level CJ links.
          TICKET_JS.write_text(r'''
          (()=>{"use strict";const d=document,$=(s,r=d)=>r.querySelector(s),$$=(s,r=d)=>Array.from(r.querySelectorAll(s));const clean=v=>String(v??"").replace(/\s+/g," ").trim();const low=v=>clean(v).toLowerCase();const esc=v=>clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));let directory={sections:{}},events=[],shown=18;
          const providerBase={ticombo:{name:"Ticombo",type:"Ticket marketplace",bestFor:"Broad event discovery",coverage:"Sports, concerts and theatre",primary:"https://www.ticombo.com/en",affiliate:false},"7753674":{name:"Sports Events 365",type:"Sports ticket provider",bestFor:"International sports tickets",coverage:"Football, basketball, tennis and motorsport",affiliate:true},"2288710":{name:"TicketNetwork",type:"Event ticket marketplace",bestFor:"Broad live-event marketplace",coverage:"Concerts, theatre and sports",affiliate:true},"4368684":{name:"Trip.com (Global)",type:"Travel booking platform",bestFor:"Travel and attraction bookings",coverage:"Flights, hotels, trains and attractions",affiliate:true}};
          function sections(name){return Array.isArray(directory.sections?.[name])?directory.sections[name]:[];}function partner(id){return [...sections("sports"),...sections("events"),...sections("travel")].find(x=>String(x.advertiserId)===id)||null;}function provider(id,q,type){const base={...(providerBase[id]||{})};if(id!=="ticombo"){const p=partner(id);if(!p)return null;base.primary=p.primaryOffer?.url||p.offers?.[0]?.url||"";base.links=(p.offers||[]).filter(o=>!q||low(`${o.name} ${o.description}`).includes(low(q))).slice(0,4);}else{base.links=[{name:type==="sports"||low(q).includes("premier")?"Premier League":"All live events",url:base.primary}];}return{id,...base};}
          function typeIds(type){if(type==="sports")return["ticombo","7753674","2288710"];if(type==="concerts"||type==="theatre")return["ticombo","2288710"];if(type==="travel")return["4368684"];return["ticombo","7753674","2288710","4368684"];}
          function money(e){return e.price!=null&&e.currency?new Intl.NumberFormat(undefined,{style:"currency",currency:e.currency}).format(e.price):"Live price";}function eventMatches(e,q,type){if(type!=="all"&&e.type!==type)return false;if(!q)return true;const terms=low(q).split(/\s+/).filter(Boolean);const text=low(`${e.title} ${e.description} ${e.provider} ${e.venue}`);return terms.every(t=>text.includes(t));}
          function eventCard(e){return`<article class="tp-ticket-event-card"><span>${esc(e.provider)}</span><h4>${esc(e.title)}</h4><p>${esc(e.description)}</p><div class="tp-ticket-event-facts"><div><small>Type</small><b>${esc(e.type)}</b></div><div><small>Price</small><b>${esc(money(e))}</b></div><div><small>Date</small><b>${esc(e.date||"Confirm live")}</b></div><div><small>Seat</small><b>${esc(e.section?`Section ${e.section}${e.row?`, row ${e.row}`:""}`:"Not in link feed")}</b></div></div><div class="tp-ticket-event-actions"><button data-ticket-quick-id="${esc(e.id)}" type="button">Quick view</button><a class="is-primary" href="/ticket/?id=${encodeURIComponent(e.id)}">Event details</a></div></article>`;}
          function providerCard(row){const links=(row.links||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="${row.affiliate?'nofollow sponsored noopener':'noopener'}">${esc(x.name)} ↗</a>`).join("");return`<article class="tp-ticket-provider-card"><header><h3>${esc(row.name)}</h3><span>${esc(row.type)}</span></header><p>${esc(row.bestFor)}</p><div class="tp-ticket-provider-meta"><div><small>Coverage</small><b>${esc(row.coverage)}</b></div><div><small>Price evidence</small><b>Live on provider</b></div></div><div class="tp-ticket-route-list">${links||'<span>No matching route returned.</span>'}</div>${row.primary?`<a class="tp-ticket-provider-primary" href="${esc(row.primary)}" target="_blank" rel="${row.affiliate?'nofollow sponsored noopener':'noopener'}">Check live availability ↗</a>`:""}</article>`;}
          function matrix(rows){return`<div class="tp-ticket-matrix"><table><thead><tr><th>Provider</th><th>Best for</th><th>Coverage</th><th>Prices here</th><th>Tracking</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.bestFor)}</td><td>${esc(r.coverage)}</td><td>Shown only when supplied; otherwise live</td><td>${r.affiliate?'Affiliate link':'Direct link'}</td></tr>`).join("")}</tbody></table></div>`;}
          function quick(e){let modal=$('[data-ticket-quick]');if(!modal){modal=d.createElement("div");modal.className="tp-ticket-quick";modal.hidden=true;modal.dataset.ticketQuick="";modal.innerHTML='<button class="tp-ticket-quick-backdrop" data-ticket-quick-close type="button" aria-label="Close"></button><section class="tp-ticket-quick-dialog" role="dialog" aria-modal="true"><button class="tp-ticket-quick-close" data-ticket-quick-close type="button">×</button><div data-ticket-quick-content></div></section>';d.body.appendChild(modal);}const c=$('[data-ticket-quick-content]',modal);c.innerHTML=`<span class="tp-kicker">${esc(e.provider)}</span><h2>${esc(e.title)}</h2><p>${esc(e.description)}</p><div class="tp-ticket-quick-grid"><div><small>Type</small><b>${esc(e.type)}</b></div><div><small>Price</small><b>${esc(money(e))}</b></div><div><small>Date</small><b>${esc(e.date||"Confirm live")}</b></div><div><small>Venue</small><b>${esc(e.venue||"Not supplied")}</b></div><div><small>Section</small><b>${esc(e.section||"Not supplied")}</b></div><div><small>Row</small><b>${esc(e.row||"Not supplied")}</b></div></div><p><b>Before checkout:</b> confirm the exact event, adjacent seats, restricted-view wording, fees, tax and currency.</p><div class="tp-ticket-quick-actions"><a class="secondary" href="/ticket/?id=${encodeURIComponent(e.id)}">Full details</a><a class="primary" href="${esc(e.url)}" target="_blank" rel="nofollow sponsored noopener">Check live price ↗</a></div>`;modal.hidden=false;}
          function render(){const form=$('[data-ticket-compare-form]'),input=$('input[name="ticketQuery"]',form),select=$('select[name="ticketType"]',form),type=clean(select?.value||"all"),q=clean(input?.value||"");$$('[data-ticket-type]').forEach(b=>b.classList.toggle("is-active",b.dataset.ticketType===type));const matched=events.filter(e=>eventMatches(e,q,type));const host=$('[data-ticket-event-results]');if(host)host.innerHTML=matched.slice(0,shown).map(eventCard).join("")||'<div class="tp-empty"><h3>No event-level links matched.</h3><p>Try a team, artist, venue or broader event type.</p></div>';const count=$('[data-ticket-event-count]');if(count)count.textContent=`${matched.length} current event route${matched.length===1?'':'s'}`;const more=$('[data-ticket-show-more]');if(more){more.hidden=matched.length<=shown;more.textContent=`Show ${Math.min(18,matched.length-shown)} more events`;}const rows=typeIds(type).map(id=>provider(id,q,type)).filter(Boolean);const ph=$('[data-ticket-provider-results]');if(ph)ph.innerHTML=rows.map(providerCard).join("");const summary=$('[data-ticket-match-summary]');if(summary)summary.textContent=`${matched.length} current event route${matched.length===1?'':'s'} and ${rows.length} provider${rows.length===1?'':'s'} considered${q?` for “${q}”`:""}.`;const matrixHost=$('[data-ticket-provider-matrix]');if(matrixHost)matrixHost.innerHTML=matrix(rows);const pc=$('[data-ticket-provider-count]');if(pc)pc.textContent=String(rows.length);}
          async function init(){const results=await Promise.allSettled([fetch(`/data/cj-category-directory.json?v=13.8.30-${Date.now()}`,{cache:"no-store"}).then(r=>r.ok?r.json():{}),fetch(`/data/ticket-events.json?v=13.8.30-${Date.now()}`,{cache:"no-store"}).then(r=>r.ok?r.json():{})]);directory=results[0].status==="fulfilled"?results[0].value:{sections:{}};events=results[1].status==="fulfilled"?(results[1].value.events||[]):[];const form=$('[data-ticket-compare-form]');form?.addEventListener("submit",e=>{e.preventDefault();shown=18;render();});$$('[data-ticket-type]').forEach(b=>b.addEventListener("click",()=>{const s=$('select[name="ticketType"]',form);if(s)s.value=b.dataset.ticketType||"all";shown=18;render();}));$('select[name="ticketType"]',form)?.addEventListener("change",()=>{shown=18;render();});$('[data-ticket-show-more]')?.addEventListener("click",()=>{shown+=18;render();});d.addEventListener("click",e=>{const q=e.target.closest('[data-ticket-quick-id]');if(q){const row=events.find(x=>x.id===q.dataset.ticketQuickId);if(row)quick(row);return;}if(e.target.closest('[data-ticket-quick-close]')){const m=$('[data-ticket-quick]');if(m)m.hidden=true;}});render();}if(d.readyState==="loading")d.addEventListener("DOMContentLoaded",init,{once:true});else init();})();
          ''', encoding="utf-8")

          # Add the event-results region to the comparison panel. This is
          # idempotent and accepts multiple safe anchors from older page versions.
          tickets = TICKETS_PAGE.read_text(encoding="utf-8")
          event_region = '''
                <!-- TP_TICKET_EVENT_EXPLORER_START -->
                <div class="tp-ticket-event-head"><div><span class="tp-kicker">Current event routes</span><h3>Matches, concerts, shows and travel links available now</h3></div><span data-ticket-event-count>Loading event routes…</span></div>
                <div class="tp-ticket-event-results" data-ticket-event-results><div class="tp-empty">Loading current event links…</div></div>
                <button class="tp-btn tp-btn-light tp-ticket-show-more" data-ticket-show-more type="button" hidden>Show more events</button>
                <!-- TP_TICKET_EVENT_EXPLORER_END -->
          '''
          tickets = re.sub(
              r"\s*<!-- TP_TICKET_EVENT_EXPLORER_START -->[\s\S]*?<!-- TP_TICKET_EVENT_EXPLORER_END -->\s*",
              "\n",
              tickets,
              count=1,
          )
          event_html = textwrap.dedent(event_region).strip()
          insertion_anchors = [
              '<div class="tp-ticket-provider-results" data-ticket-provider-results></div>',
              '<div data-ticket-provider-matrix></div>',
              '<div class="tp-ticket-honesty">',
          ]
          installed = False
          for anchor in insertion_anchors:
              if anchor in tickets:
                  tickets = tickets.replace(anchor, event_html + "\n" + anchor, 1)
                  installed = True
                  break
          if not installed:
              raise SystemExit("Ticket comparison surface has no safe event insertion anchor")
          tickets = re.sub(
              r'/js/ticket-comparison-v13-8-[^"\']+\.js\?v=[^"\']+',
              f'/js/ticket-comparison-v13-8-30.js?v={VERSION}',
              tickets,
          )
          if tickets.count('data-ticket-event-results') != 1:
              raise SystemExit("Ticket event explorer was not installed exactly once")
          TICKETS_PAGE.write_text("\n".join(line.rstrip() for line in tickets.splitlines()) + "\n", encoding="utf-8")

          # Internal event detail page shown before the outbound provider.
          TICKET_DETAIL_PAGE.parent.mkdir(parents=True, exist_ok=True)
          TICKET_DETAIL_PAGE.write_text(f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="index,follow"><title>Event details — TrendPilot AI</title><meta name="description" content="Review event, provider, seat and price evidence before opening the live ticket marketplace."><link rel="canonical" href="https://trendpilotchoice.com/ticket/"><link rel="stylesheet" href="/css/style-v13-2.css?v=13.2.0"><link rel="stylesheet" href="/css/style-v13-5.css?v=13.5.0"><link rel="stylesheet" href="/css/ticket-comparison-v13-8-30.css?v={VERSION}"><link rel="stylesheet" href="/css/smart-search-v13-8-30.css?v={VERSION}"></head><body><main class="tp-section"><div class="tp-shell" data-ticket-detail><div class="tp-empty">Loading event details…</div></div></main><script defer src="/js/ticket-detail-v13-8-30.js?v={VERSION}"></script></body></html>''', encoding="utf-8")
          TICKET_DETAIL_JS.write_text(r'''
          (()=>{"use strict";const d=document,$=(s,r=d)=>r.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),clean=v=>String(v??"").replace(/\s+/g," ").trim();function money(e){return e.price!=null&&e.currency?new Intl.NumberFormat(undefined,{style:"currency",currency:e.currency}).format(e.price):"Live price at provider";}async function init(){const host=$('[data-ticket-detail]'),id=new URLSearchParams(location.search).get("id")||"";try{const r=await fetch(`/data/ticket-events.json?v=13.8.30-${Date.now()}`,{cache:"no-store"});const data=r.ok?await r.json():{};const e=(data.events||[]).find(x=>x.id===id);if(!e)throw new Error("not found");d.title=`${clean(e.title)} — TrendPilot AI`;host.innerHTML=`<a href="/tickets/">← Back to ticket search</a><section class="tp-ticket-quick-dialog" style="margin:20px auto;max-width:850px"><span class="tp-kicker">${esc(e.provider)}</span><h1>${esc(e.title)}</h1><p>${esc(e.description)}</p><div class="tp-ticket-quick-grid"><div><small>Type</small><b>${esc(e.type)}</b></div><div><small>Price evidence</small><b>${esc(money(e))}</b></div><div><small>Date</small><b>${esc(e.date||"Not supplied in CJ link")}</b></div><div><small>Venue</small><b>${esc(e.venue||"Not supplied")}</b></div><div><small>Section</small><b>${esc(e.section||"Not supplied")}</b></div><div><small>Row</small><b>${esc(e.row||"Not supplied")}</b></div></div><div class="tp-ticket-honesty"><b>Check before buying:</b> exact event and local time, seat adjacency, restricted view, ticket quantity, fees, tax, delivery, currency, refund and event-change terms.</div><div class="tp-ticket-quick-actions"><a class="secondary" href="/tickets/">Compare other sources</a><a class="primary" href="${esc(e.url)}" target="_blank" rel="nofollow sponsored noopener">Continue to live provider ↗</a></div></section>`;}catch(error){host.innerHTML='<div class="tp-empty"><h1>Event information unavailable</h1><p>Return to ticket search and choose another current listing.</p><a href="/tickets/">Back to tickets</a></div>';}}if(d.readyState==="loading")d.addEventListener("DOMContentLoaded",init,{once:true});else init();})();
          ''', encoding="utf-8")

          # Add autocomplete assets to every HTML page that contains a search field.
          for page_path in ROOT.rglob("*.html"):
              page = page_path.read_text(encoding="utf-8")
              if 'type="search"' not in page and "type='search'" not in page and "data-coupon-search" not in page:
                  continue
              page = re.sub(r'\s*<link[^>]+href="/css/smart-search-v13-8-[^"?]+\.css[^\"]*"[^>]*>\s*', "\n", page)
              page = re.sub(r'\s*<script[^>]+src="/js/smart-search-v13-8-[^"?]+\.js[^\"]*"[^>]*></script>\s*', "\n", page)
              if "</head>" in page:
                  page = page.replace("</head>", f'<link rel="stylesheet" href="/css/smart-search-v13-8-30.css?v={VERSION}">\n</head>', 1)
              if "</body>" in page:
                  page = page.replace("</body>", f'<script defer src="/js/smart-search-v13-8-30.js?v={VERSION}"></script>\n</body>', 1)
              page_path.write_text("\n".join(line.rstrip() for line in page.splitlines()) + "\n", encoding="utf-8")

          print(json.dumps({
              "version": VERSION,
              "ticketEventRoutes": len(events),
              "autocomplete": "all HTML search fields",
              "productQuickView": "existing product modal preserved",
              "ticketQuickView": True,
              "ticketDetailPage": "/ticket/?id=...",
              "seatPriceRule": "show only when supplied by feed; otherwise live provider",
          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate CJ category distribution
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js
          node --check js/cj-partner-hub.js
          node --check js/cj-joined-sellers.js
          node --check js/cj-category-distribution.js
          node --check js/ticket-comparison-v13-8-30.js
          node --check js/smart-search-v13-8-30.js
          node --check js/ticket-detail-v13-8-30.js
          git diff --check

          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          VERSION = "13.8.30"

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(f"Validation failed: {message}")

          directory = json.loads(Path("data/cj-category-directory.json").read_text(encoding="utf-8"))
          report = json.loads(Path("data/cj-partner-hub-report.json").read_text(encoding="utf-8"))
          products = json.loads(Path("data/cj-products.json").read_text(encoding="utf-8"))
          offers = json.loads(Path("data/cj-offers.json").read_text(encoding="utf-8"))
          software = json.loads(Path("data/cj-software-services.json").read_text(encoding="utf-8"))
          travel = json.loads(Path("data/cj-travel-services.json").read_text(encoding="utf-8"))
          bridge = json.loads(Path("data/cj-search-bridge-report.json").read_text(encoding="utf-8"))

          sections = directory.get("sections") or {}
          product_names = [row.get("name") for row in sections.get("products", [])]
          software_names = [row.get("name") for row in sections.get("software", [])]
          sports_names = [row.get("name") for row in sections.get("sports", [])]
          event_names = [row.get("name") for row in sections.get("events", [])]
          travel_names = [row.get("name") for row in sections.get("travel", [])]
          all_names = product_names + software_names + sports_names + event_names + travel_names

          require(directory.get("version") == VERSION, "directory version is incorrect")
          require(directory.get("partnerCount") == 10, "partner count is not 10")
          require(len(all_names) == 10 and len(set(all_names)) == 10, "a partner is missing or duplicated")
          require(
              product_names == ["Diecast", "FragranceShop.com", "Karaca EU", "MFI Medical", "PandaHall", "Temu"],
              "physical-product distribution is incorrect",
          )
          require("Temu" in product_names, "Temu is missing from Find products")
          temu_rows = [row for row in sections.get("products", []) if row.get("name") == "Temu"]
          require(len(temu_rows) == 1 and temu_rows[0].get("advertiserId") == "6293473", "Temu advertiser ID is incorrect")
          require(software_names == ["NordVPN"], "NordVPN is not isolated in Software Finder")
          require(sports_names == ["Sports Events 365"], "sports-ticket distribution is incorrect")
          require(event_names == ["TicketNetwork"], "event-ticket distribution is incorrect")
          require(travel_names == ["Trip.com (Global)"], "travel distribution is incorrect")
          require(report.get("productFilterArgument") == "partnerIds", "CJ product filter is not partnerIds")
          require(
              all(row.get("entityType") == "product" and row.get("surface") == "find"
                  for row in products.get("products", [])),
              "cj-products.json contains a service or travel record",
          )
          require([row.get("name") for row in software.get("services", [])] == ["NordVPN"], "software dataset is incorrect")
          require([row.get("name") for row in travel.get("services", [])] == ["Sports Events 365", "TicketNetwork", "Trip.com (Global)"], "tickets and travel dataset is incorrect")

          site_js = Path("js/site-v13-5.js").read_text(encoding="utf-8")
          find_page = Path("find/index.html").read_text(encoding="utf-8")
          software_page = Path("software/index.html").read_text(encoding="utf-8")
          tickets_page = Path("tickets/index.html").read_text(encoding="utf-8")
          hub_page = Path("cj-partners/index.html").read_text(encoding="utf-8")

          require('"health-medical"' in site_js, "health-medical group was not added")
          require('"arts-crafts"' in site_js, "arts-crafts group was not added")
          require(f'/data/cj-products.json?v={VERSION}-' in site_js, "CJ product cache version is stale")
          require('<option value="medical">' in find_page, "medical scope is missing from Find")
          require('<option value="crafts">' in find_page, "crafts scope is missing from Find")
          require('data-cj-directory="products"' in find_page, "product seller directory is missing")
          require('data-cj-directory="software"' in software_page, "NordVPN software section is missing")
          ticket_js = Path("js/ticket-comparison-v13-8-30.js").read_text(encoding="utf-8")
          smart_js = Path("js/smart-search-v13-8-30.js").read_text(encoding="utf-8")
          ticket_events = json.loads(Path("data/ticket-events.json").read_text(encoding="utf-8"))
          require('data-ticket-compare' in tickets_page, "ticket comparison surface is missing")
          require('data-ticket-event-results' in tickets_page, "event-first ticket results are missing")
          require('data-ticket-quick-id' in ticket_js, "ticket Quick View is missing")
          require('/ticket/?id=' in ticket_js, "internal event details route is missing")
          require(
              '"7753674"' in ticket_js and '"2288710"' in ticket_js and '"4368684"' in ticket_js,
              "sports, event or travel provider mapping is missing",
          )
          require(ticket_events.get("count", 0) >= 10, "too few current ticket/event routes were generated")
          require('Phone cases' in smart_js and 'Premier League' in smart_js, "smart suggestion dictionaries are incomplete")
          require('"6293473"' in site_js and 'temucom' in site_js, "Temu is still missing from the browser guard")
          require('data-quick-view-id' in site_js, "product Quick View trigger is missing")
          require(hub_page.count('data-cj-directory=') == 5, "CJ hub does not contain all five sections")
          require(bridge.get("categoryGroupsAdded") == ["health-medical", "arts-crafts"], "bridge report is incorrect")
          require('function tpPublicSellerAllowed' in site_js, "public seller runtime guard is missing")
          require('"6293473"' in site_js and 'temucom' in site_js, "Temu is missing from the browser CJ guard")
          require('Promise.allSettled' in site_js, "product search safe loading is missing")
          perform_start = site_js.find('async function performSearch(query,push=true,scope=""){')
          show_more_start = site_js.find('async function showMore(){', perform_start + 1)
          require(perform_start >= 0 and show_more_start > perform_start, "product search function boundaries are missing")
          perform_body = site_js[perform_start:show_more_start]
          require('loadCjProducts()' in perform_body, "product search does not load CJ products")
          require('state.loading=false' in perform_body, "product search cannot reliably leave loading state")
          require('data-ticket-compare' in tickets_page, "ticket provider comparison is missing")
          require(tickets_page.count('ticket-comparison-v13-8-30.js') == 1, "ticket comparison script is missing or duplicated")
          require(tickets_page.count('ticket-comparison-v13-8-30.css') == 1, "ticket comparison stylesheet is missing or duplicated")
          require(tickets_page.count('smart-search-v13-8-30.js') == 1, "ticket autocomplete script is missing or duplicated")
          smart_asset_versions = re.findall(r'smart-search-v13-8-([0-9]+)\.(?:js|css)', tickets_page)
          require(
              smart_asset_versions and set(smart_asset_versions) == {VERSION.rsplit(".", 1)[-1]},
              f"smart-search asset versions are inconsistent: {smart_asset_versions}",
          )
          ticket_asset_versions = re.findall(
              r'ticket-comparison-v13-8-([0-9]+)\.(?:js|css)',
              tickets_page,
          )
          require(
              ticket_asset_versions and set(ticket_asset_versions) == {VERSION.rsplit(".", 1)[-1]},
              f"ticket comparison asset versions are inconsistent: {ticket_asset_versions}",
          )
          require(Path("ticket/index.html").exists(), "internal ticket detail page is missing")
          require('Sports Events 365' in tickets_page and 'TicketNetwork' in tickets_page and 'Trip.com' in tickets_page, "ticket providers are not explained on the page")
          require('data-provider="ticombo"' not in tickets_page, "old Ticombo-only controls remain on the ticket page")
          require(tickets_page.count('/css/cj-category-distribution.css') == 0, "duplicate old CJ ticket CSS remains")

          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          require(
              not any(path.startswith("data/search-catalog/") for path in changed),
              "a large search-catalog shard was unexpectedly changed",
          )

          summary = {
              "productsFetched": len(products.get("products", [])),
              "searchEligibleProducts": report.get("searchEligibleProductCount", 0),
              "searchEligibleSellers": report.get("searchEligibleSellers", []),
              "offersFetched": len(offers.get("offers", [])),
              "productNames": product_names,
              "softwareNames": software_names,
              "sportsNames": sports_names,
              "eventNames": event_names,
              "travelNames": travel_names,
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          with Path("/tmp/cj-category-summary.md").open("w", encoding="utf-8") as handle:
              handle.write("## TrendPilot V13.8.30 CJ category distribution\n\n")
              handle.write("- Product companies: **" + ", ".join(product_names) + "**\n")
              handle.write("- Software services: **" + ", ".join(software_names) + "**\n")
              handle.write("- Sports tickets: **" + ", ".join(sports_names) + "**\n")
              handle.write("- Event tickets: **" + ", ".join(event_names) + "**\n")
              handle.write("- Travel and bookings: **" + ", ".join(travel_names) + "**\n")
              handle.write(f"- Product records fetched: **{summary['productsFetched']}**\n")
              handle.write(f"- Comparison-ready products: **{summary['searchEligibleProducts']}**\n")
              handle.write(
                  "- Sellers added to the product filter: **"
                  + (", ".join(summary["searchEligibleSellers"]) or "none returned with complete product evidence")
                  + "**\n"
              )
              handle.write(f"- Joined CJ links fetched: **{summary['offersFetched']}**\n")
              handle.write("- Product API advertiser filter: **partnerIds**\n")
              handle.write("- Temu catalogue strategy: **expanded targeted queries with real CJ product evidence only**\n")
          PY

          cat /tmp/cj-category-summary.md >> "$GITHUB_STEP_SUMMARY"


      - name: Publish only if main has not changed
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"

          if [[ "$REMOTE_SHA" != "$TP_BASE_SHA" ]]; then
            echo "::error::The main branch changed while V13.8.30 was running."
            echo "::error::Nothing was pushed. Run this workflow again after other workflows finish."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cj-category-directory.json
          git add data/cj-partner-hub.json
          git add data/cj-partner-hub-report.json
          git add data/cj-products.json
          git add data/cj-offers.json
          git add data/cj-software-services.json
          git add data/cj-travel-services.json
          git add data/cj-search-bridge-report.json
          git add js/cj-partner-hub.js
          git add js/cj-joined-sellers.js
          git add js/cj-category-distribution.js
          git add js/ticket-comparison-v13-8-30.js
          git add js/smart-search-v13-8-30.js
          git add js/ticket-detail-v13-8-30.js
          git add data/ticket-events.json
          git add ticket/index.html
          git add js/site-v13-5.js
          git add css/cj-category-distribution.css
          git add css/ticket-comparison-v13-8-30.css
          git add css/smart-search-v13-8-30.css
          git add -u
          git add find/index.html
          git add product/index.html 2>/dev/null || true
          git add software/index.html
          git add tickets/index.html
          git add cj-partners/index.html
          git add deals/index.html 2>/dev/null || true
          git add sitemap.xml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "The latest main already contains this CJ update."
            exit 0
          fi

          git diff --cached --check
          git commit -m "fix: restore product results and compare ticket providers"
          git push origin HEAD:main
