          .tp-ticket-event-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:24px 0 13px}.tp-ticket-event-head h3{margin:0;font-size:1.25rem}.tp-ticket-event-head span{color:#65716d}.tp-ticket-event-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.tp-ticket-event-card{display:flex;flex-direction:column;padding:17px;border:1px solid #dde5e2;border-radius:20px;background:#fff}.tp-ticket-event-card>span{width:max-content;padding:5px 8px;border-radius:999px;background:#eaf7f2;color:#127157;font-size:.68rem;font-weight:900}.tp-ticket-event-card h4{margin:10px 0 6px;font-size:1.02rem;line-height:1.3}.tp-ticket-event-card p{margin:0 0 12px;color:#69736f;font-size:.8rem;line-height:1.5}.tp-ticket-event-facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto}.tp-ticket-event-facts div{padding:9px;border-radius:12px;background:#f1f5f4}.tp-ticket-event-facts small{display:block;color:#6b7772;font-size:.62rem}.tp-ticket-event-facts b{display:block;margin-top:3px;font-size:.76rem}.tp-ticket-event-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.tp-ticket-event-actions a,.tp-ticket-event-actions button{display:inline-flex;min-height:42px;align-items:center;justify-content:center;padding:9px 10px;border:1px solid #d4dedb;border-radius:12px;background:#fff;color:#24332f;text-decoration:none;font:inherit;font-size:.76rem;font-weight:850;cursor:pointer}.tp-ticket-event-actions .is-primary{border-color:#3157e5;background:#3157e5;color:#fff}.tp-ticket-show-more{display:flex;margin:16px auto 0}.tp-ticket-quick{position:fixed;z-index:3000;inset:0;display:grid;place-items:center;padding:18px}.tp-ticket-quick[hidden]{display:none}.tp-ticket-quick-backdrop{position:absolute;inset:0;border:0;background:rgba(8,20,17,.62)}.tp-ticket-quick-dialog{position:relative;z-index:1;width:min(720px,100%);max-height:88dvh;overflow:auto;padding:25px;border-radius:25px;background:#fff;box-shadow:0 32px 90px rgba(8,20,17,.32)}.tp-ticket-quick-close{position:absolute;top:12px;right:12px;width:42px;height:42px;border:1px solid #d7dfdc;border-radius:12px;background:#fff;font-size:1.45rem}.tp-ticket-quick-dialog h2{margin:7px 45px 12px 0}.tp-ticket-quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.tp-ticket-quick-grid div{padding:11px;border-radius:13px;background:#f1f5f4}.tp-ticket-quick-grid small{display:block;color:#6b7672}.tp-ticket-quick-actions{display:flex;flex-wrap:wrap;gap:9px}.tp-ticket-quick-actions a{display:inline-flex;padding:12px 15px;border-radius:13px;text-decoration:none;font-weight:850}.tp-ticket-quick-actions .primary{background:#3157e5;color:#fff}.tp-ticket-quick-actions .secondary{border:1px solid #d5dfdc;color:#25332f}
