name: Fix Paid Ticket Funnel V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-paid-ticket-funnel-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fail-closed migration
        run: python .github/scripts/apply_paid_ticket_funnel_fix.py
      - name: Validate syntax
        run: |
          php -l api/save-search.php
          php -l api/seller-outbound.php
          node --check events/manchester-derby-2026/save-search.js
          node --check events/_factory/locale-router-v1.js
      - name: Commit core funnel fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/save-search.php events/
          if git diff --cached --quiet; then
            echo 'No core changes needed.'
            exit 0
          fi
          git commit -m "fix: localize Dutch ticket funnel and track direct seller clicks"
          git pull --rebase origin main
          git push origin HEAD:main
