          base64 --decode "$RUNNER_TEMP/patch-cj-sellers.py.b64" > "$RUNNER_TEMP/patch-cj-sellers.py"
          python "$RUNNER_TEMP/patch-cj-sellers.py"

      - name: Validate CJ sellers and browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile automation/build_decision_catalog.py
          if [ -f automation/build_search_catalog.py ]; then
            python -m py_compile automation/build_search_catalog.py
          fi
          found_js=0
          for file in js/site-v13-*.js; do
            if [ -f "$file" ]; then
              node --check "$file"
              found_js=1
            fi
          done
          test "$found_js" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("data/cj-seller-bridge-report.json")
          manifest_path = Path("data/search-catalog/manifest.json")
          coverage_path = Path("data/search-catalog/coverage-report.json")
          cache_path = Path("automation/cache/cj-products.json")

          for path in (report_path, manifest_path, coverage_path, cache_path):
              if not path.exists():
                  raise SystemExit(f"Required output is missing: {path}")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          cache = json.loads(cache_path.read_text(encoding="utf-8"))

          accepted = report.get("acceptedCjAdvertisers", {})
          sellers = set(manifest.get("advertisers", []))
          products = cache.get("products", [])

          print("CJ cache products:", len(products))
          print("Accepted CJ sellers:", accepted)
          print("All manifest sellers:", len(sellers))
          print("Catalogue products:", manifest.get("productCount", 0))

          if not products:
              raise SystemExit("CJ cache is empty.")
          if not accepted:
              raise SystemExit("No CJ seller reached the public catalogue.")
          missing = sorted(set(accepted) - sellers)
          if missing:
              raise SystemExit("CJ sellers missing from manifest: " + ", ".join(missing))
          if report.get("status") != "success":
              raise SystemExit("CJ seller bridge report did not finish successfully.")
          PY

      - name: Commit the CJ seller bridge safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trendpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation/build_decision_catalog.py
          if [ -f automation/build_search_catalog.py ]; then
            git add automation/build_search_catalog.py
          fi
          git add config/sources/cj-api-products.json
          git add -f automation/cache/cj-products.json
          git add data/search-catalog data/cj-seller-bridge-report.json
          git add js/site-v13-*.js
          find . -type f -name '*.html' -not -path './.git/*' -print0 | xargs -0 -r git add --

          if git diff --cached --quiet; then
            echo "CJ Seller Bridge is already installed and the catalogue is current."
            exit 0
          fi

          git commit -m "fix: expose accepted CJ sellers in search"
          git pull --rebase origin main
          git push origin HEAD:main
