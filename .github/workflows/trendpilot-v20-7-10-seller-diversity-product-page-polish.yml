name: TrendPilot V20.7.10 — Seller Diversity + Product Page Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trendpilot-v20-7-10-seller-diversity-product-page-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply V20.7.10
        run: python scripts/v20_7_10_patch.py
      - name: Syntax QA
        run: |
          node --check js/finder-v20-7-9.js
          node --check netlify/functions/product-preview-v20-6-8-3.cjs
          grep -q '20.7.10' find/index.html
          grep -q 'diversifyRows' js/finder-v20-7-9.js
          grep -q 'hasExact' netlify/functions/product-preview-v20-6-8-3.cjs
      - name: Commit
        run: |
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/finder-v20-7-9.js find/index.html netlify/functions/product-preview-v20-6-8-3.cjs
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'TrendPilot V20.7.10 seller diversity and mobile product polish'
            git push origin main
          fi
