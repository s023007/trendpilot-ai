name: TrendPilot V16.0.3 Smart Relevance and Balanced Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v16-0-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smart-relevance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Apply V16.0.3 relevance fixes
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          lib = Path("netlify/functions/products-v16-lib.mjs")
          search = Path("netlify/functions/products-v16.mjs")
          health = Path("netlify/functions/products-v16-health.mjs")
          rebuild = Path("netlify/functions/products-v16-rebuild.mjs")
          docs = Path("V16-UNIVERSAL-PRODUCT-INDEX.md")

          for p in (lib, search, health, rebuild):
              if not p.exists():
                  raise SystemExit(f"Missing V16 file: {p}")

          # 1) Fix network metadata robustly across formatting differences.
          import re
          s = lib.read_text(encoding="utf-8")

          if 'const explicitNetwork = clean(pick(obj' not in s:
              pattern = re.compile(
                  r'(?ms)^(\s*)const network\s*=\s*\n'
                  r'\1\s*clean\(pick\(obj, \[\s*\n'
                  r'.*?source_network"\s*\n'
                  r'\1\s*\]\)\)\.slice\(0, 120\)\s*\|\|\s*\n'
                  r'\1\s*clean\(sourceHint\)\.split\(":"\)\[0\]\.slice\(0, 120\)\s*\|\|\s*\n'
                  r'\1\s*"catalog";'
              )
              def repl(m):
                  i = m.group(1)
                  return (
                      i + 'const explicitNetwork = clean(pick(obj, [\n' +
                      i + '  "network", "affiliateNetwork", "affiliate_network", "sourceNetwork", "source_network"\n' +
                      i + '])).slice(0, 120);\n\n' +
                      i + 'const network =\n' +
                      i + '  explicitNetwork &&\n' +
                      i + '  !explicitNetwork.includes("/") &&\n' +
                      i + '  !/\\.json(?:$|\\?)/i.test(explicitNetwork)\n' +
                      i + '    ? explicitNetwork\n' +
                      i + '    : "catalog";'
                  )
              s2, n = pattern.subn(repl, s, count=1)
              if n != 1:
                  raise SystemExit(f"V16 network metadata block not found uniquely: matches={n}")
              s = s2

          lib.write_text(s, encoding="utf-8")

          # 2) Replace search endpoint with relevance-first ranking.
          search.write_text(r'''import { getStore } from "@netlify/blobs";
          import {
            STORE_NAME,
            clean,
            lower,
            queryTokens,
            tokenBucket
          } from "./products-v16-lib.mjs";

          const VERSION = "16.0.3";

          const json = (body, status = 200) =>
            new Response(JSON.stringify(body), {
              status,
              headers: {
                "content-type": "application/json; charset=utf-8",
                "cache-control": "public, max-age=0, s-maxage=60, stale-while-revalidate=300",
                "x-content-type-options": "nosniff"
              }
            });

          const safeGetJSON = async (store, key) => {
            try {
              return await store.get(key, { type: "json" });
            } catch {
              return null;
            }
          };

          const escapeRegex = value =>
            String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

          const words = value =>
            lower(value).normalize("NFKC").match(/[\p{L}\p{N}]+/gu) || [];

          const accessoryWords = new Set([
            "case","cases","cover","covers","protector","protectors",
            "charger","chargers","charging","cable","cables",
            "holder","holders","stand","stands","mount","mounts",
            "repair","replacement","part","parts","tool","tools","kit","kits",
            "accessory","accessories","adapter","adapters","dock","docks",
            "screen","screens","stylus","pen","pens","strap","straps",
            "band","bands","sleeve","sleeves","pouch","pouches",
            "feeder","feeders","feeding","bowl","bowls","toy","toys",
            "storage","container","containers","dispenser","dispensers",
            "remover","tester","testing","fixture","fixtures",
            "frame","frames","shell","shells","housing","housings"
          ]);

          function tokenSet(value) {
            return new Set(words(value));
          }

          function countCoverage(tokens, set, textLower = "") {
            let count = 0;
            for (const token of tokens) {
              if (set.has(token) || (token.length >= 4 && textLower.includes(token))) count++;
            }
            return count;
          }

          function relevanceFor(doc, q, tokens, baseRank) {
            const title = lower(doc.title);
            const brand = lower(doc.brand);
            const category = lower(`${doc.category || ""} ${doc.subcategory || ""}`);
            const description = lower(doc.description || "").slice(0, 1200);

            const titleSet = tokenSet(title);
            const brandSet = tokenSet(brand);
            const categorySet = tokenSet(category);
            const descriptionSet = tokenSet(description);

            const titleCoverage = countCoverage(tokens, titleSet, title);
            const brandCoverage = countCoverage(tokens, brandSet, brand);
            const categoryCoverage = countCoverage(tokens, categorySet, category);
            const descriptionCoverage = countCoverage(tokens, descriptionSet, description);

            const allInTitle = tokens.length > 0 && titleCoverage >= tokens.length;
            const allInCategory = tokens.length > 0 && categoryCoverage >= tokens.length;
            const phraseInTitle = Boolean(q && title.includes(q));
            const phraseAtStart = Boolean(q && (title === q || title.startsWith(q + " ") || title.startsWith(q + "-")));
            const queryLooksAccessory = tokens.some(t => accessoryWords.has(t));

            let score = Number(baseRank.score || 0) + Number(baseRank.matches || 0) * 18;

            if (title === q) score += 220;
            else if (phraseAtStart) score += 120;
            else if (phraseInTitle) score += 80;

            if (allInTitle) score += 105;
            else score += titleCoverage * 32;

            if (allInCategory) score += 115;
            else score += categoryCoverage * 40;

            score += brandCoverage * 20;
            score += Math.min(descriptionCoverage, 2) * 5;

            if (brand === q) score += 50;

            let penalty = 0;
            if (!queryLooksAccessory && q) {
              const qPattern = escapeRegex(q).replace(/\s+/g, "\\s+");
              const accessoryPattern =
                "(?:case|cover|protector|charger|charging|cable|holder|stand|mount|" +
                "repair|replacement|parts?|tools?|kits?|accessor(?:y|ies)|adapter|dock|" +
                "screen|stylus|strap|band|sleeve|pouch|feeder|feeding|bowl|toy|storage|" +
                "container|dispenser|remover|tester|testing|fixture|frame|shell|housing)";

              const queryThenAccessory = new RegExp(
                qPattern + ".{0,45}\\b" + accessoryPattern + "\\b",
                "i"
              );
              const accessoryForQuery = new RegExp(
                "\\b(?:for|compatible\\s+with|replacement\\s+for|used\\s+for)\\s+" + qPattern,
                "i"
              );

              if (queryThenAccessory.test(title)) penalty += 170;
              if (accessoryForQuery.test(title)) penalty += 160;

              const titleHasAccessory = words(title).some(w => accessoryWords.has(w));
              const categoryHasAccessory = words(category).some(w => accessoryWords.has(w));

              if (titleHasAccessory && categoryCoverage == 0) penalty += 55;
              if (categoryHasAccessory && categoryCoverage == 0) penalty += 45;
            }

            if (titleCoverage == 0 && categoryCoverage == 0 && brandCoverage == 0) {
              score -= 140;
            }

            if (titleCoverage == 0 && descriptionCoverage > 0) {
              score -= 60;
            }

            score -= penalty;

            return {
              score,
              signals: {
                titleCoverage,
                categoryCoverage,
                brandCoverage,
                phraseInTitle,
                phraseAtStart,
                accessoryPenalty: penalty
              }
            };
          }

          export default async function handler(request) {
            if (request.method !== "GET") {
              return json({ ok: false, error: "Method not allowed" }, 405);
            }

            try {
              const url = new URL(request.url);
              const q = clean(url.searchParams.get("q") || "").slice(0, 180);
              const seller = clean(url.searchParams.get("seller") || "").slice(0, 140);
              const network = clean(url.searchParams.get("network") || "").slice(0, 100);
              const limit = Math.max(1, Math.min(100, Number(url.searchParams.get("limit") || 48) || 48));
              const offset = Math.max(0, Math.min(1000, Number(url.searchParams.get("offset") || 0) || 0));
              const debug = url.searchParams.get("debug") === "1";

              const store = getStore({ name: STORE_NAME, consistency: "strong" });
              const meta = await safeGetJSON(store, "meta");

              if (!meta?.ready) {
                return json({
                  ok: false,
                  version: VERSION,
                  storage: "netlify-blobs",
                  error: "Universal product index is not ready yet.",
                  next: "Run /api/products-v16/rebuild once, then re-check /api/products-v16/health."
                }, 503);
              }

              const tokens = queryTokens(q);
              if (!tokens.length) {
                return json({
                  ok: true,
                  version: VERSION,
                  storage: "netlify-blobs",
                  query: q,
                  seller: seller || null,
                  network: network || null,
                  totalReturned: 0,
                  products: []
                });
              }

              const bucketNames = [...new Set(tokens.map(tokenBucket))];
              const bucketPairs = await Promise.all(
                bucketNames.map(async bucket => [bucket, await safeGetJSON(store, `tokens/${bucket}`)])
              );
              const buckets = new Map(bucketPairs);

              const sellerLower = lower(seller);
              const networkLower = lower(network);
              const scores = new Map();

              for (const token of tokens) {
                const bucket = buckets.get(tokenBucket(token)) || {};
                const rows = Array.isArray(bucket[token]) ? bucket[token] : [];

                for (const row of rows) {
                  if (!row?.id) continue;
                  if (sellerLower && row.seller !== sellerLower) continue;
                  if (networkLower && row.network !== networkLower) continue;

                  const previous = scores.get(row.id) || { score: 0, matches: 0 };
                  previous.score += Number(row.score || 0);
                  previous.matches += 1;
                  scores.set(row.id, previous);
                }
              }

              const candidateLimit = Math.min(1800, Math.max(1000, limit * 25));
              const ranked = [...scores.entries()]
                .sort((a, b) =>
                  b[1].matches - a[1].matches ||
                  b[1].score - a[1].score
                )
                .slice(0, candidateLimit);

              if (!ranked.length) {
                return json({
                  ok: true,
                  version: VERSION,
                  storage: "netlify-blobs",
                  query: q,
                  seller: seller || null,
                  network: network || null,
                  totalReturned: 0,
                  products: []
                });
              }

              const docShardNames = [...new Set(ranked.map(([id]) => id.slice(0, 1)))];
              const docPairs = await Promise.all(
                docShardNames.map(async shard => [shard, await safeGetJSON(store, `docs/${shard}`)])
              );
              const docShards = new Map(docPairs);

              const qLower = lower(q);
              const products = [];

              for (const [id, rank] of ranked) {
                const doc = docShards.get(id.slice(0, 1))?.[id];
                if (!doc) continue;

                const relevance = relevanceFor(doc, qLower, tokens, rank);

                const result = {
                  ...doc,
                  url: doc.affiliateUrl || doc.destinationUrl,
                  image: doc.imageUrl,
                  matchScore: relevance.score,
                  matchedTokens: rank.matches
                };

                if (debug) result.relevance = relevance.signals;
                products.push(result);
              }

              products.sort((a, b) =>
                b.matchScore - a.matchScore ||
                b.quality - a.quality ||
                a.title.localeCompare(b.title)
              );

              const paged = products.slice(offset, offset + limit);

              return json({
                ok: true,
                version: VERSION,
                storage: "netlify-blobs",
                query: q,
                queryTokens: tokens,
                seller: seller || null,
                network: network || null,
                indexedProducts: meta.products || 0,
                totalCandidates: products.length,
                totalReturned: paged.length,
                products: paged
              });
            } catch (error) {
              console.error("TrendPilot V16.0.3 search failed", error);
              return json({
                ok: false,
                version: VERSION,
                storage: "netlify-blobs",
                error: "Universal product search failed.",
                detail: String(error?.message || error).slice(0, 500)
              }, 503);
            }
          }

          export const config = {
            path: "/api/products-v16",
            method: "GET"
          };
          ''', encoding="utf-8")

          # 3) Make catalog selection balanced.
          r = rebuild.read_text(encoding="utf-8")
          r = r.replace('collectCatalogJsonPaths(payload, 250)', 'collectCatalogJsonPaths(payload, 3000)')

          helper = r'''
          function balancedCatalogPaths(paths, max = 360) {
            const groups = new Map();

            for (const path of paths) {
              const match = String(path).match(/\/shards\/([^/]+)\//i);
              const group = match?.[1] || "other";
              if (!groups.has(group)) groups.set(group, []);
              groups.get(group).push(path);
            }

            for (const rows of groups.values()) {
              rows.sort((a, b) => {
                const aAll = /\/all\/|\/all\d|\/all\./i.test(a) ? 0 : 1;
                const bAll = /\/all\/|\/all\d|\/all\./i.test(b) ? 0 : 1;
                return aAll - bAll || a.localeCompare(b);
              });
            }

            const names = [...groups.keys()].sort();
            const out = [];
            let round = 0;

            while (out.length < max) {
              let added = false;

              for (const name of names) {
                const row = groups.get(name)?.[round];
                if (!row) continue;
                out.push(row);
                added = true;
                if (out.length >= max) break;
              }

              if (!added) break;
              round++;
            }

            return out;
          }

          '''

          if 'function balancedCatalogPaths(' not in r:
              anchor = 'export default async function handler(request) {'
              if anchor not in r:
                  raise SystemExit("V16 rebuild handler anchor not found.")
              r = r.replace(anchor, helper + anchor, 1)

          old_extras = 'const extras = [...discoveredPaths].filter(path => !seeds.includes(path)).slice(0, 250);'
          new_extras = 'const extras = balancedCatalogPaths([...discoveredPaths].filter(path => !seeds.includes(path)), 360);'
          if old_extras in r:
              r = r.replace(old_extras, new_extras, 1)
          elif new_extras not in r:
              raise SystemExit("V16 catalog extras anchor not found.")

          r = r.replace('"16.0.1"', '"16.0.3"')
          r = r.replace('V16.0.1', 'V16.0.3')
          rebuild.write_text(r, encoding="utf-8")

          h = health.read_text(encoding="utf-8").replace('"16.0.1"', '"16.0.3"')
          health.write_text(h, encoding="utf-8")

          d = docs.read_text(encoding="utf-8") if docs.exists() else "# TrendPilot V16 Universal Product Index\n"
          d += r'''

          ## V16.0.3 — relevance and catalog balance

          - Wider candidate rescoring before the final result list.
          - Strong boosts for direct title/category product matches.
          - Generic down-ranking of repair tools, cases, stands, feeders,
            containers, replacement parts and other accessory-intent results
            when the visitor searched for the core product itself.
          - Accessory searches remain supported: a query such as `phone case`
            is not penalized for containing `case`.
          - Catalog shard selection is balanced across top-level product groups
            instead of taking only the first paths found in the manifest.
          - Catalog shard file paths no longer appear as affiliate network names.
          '''
          docs.write_text(d, encoding="utf-8")

          print("V16.0.3 smart relevance patch applied.")
          PY

      - name: Validate V16.0.3
        shell: bash
        run: |
          set -euo pipefail

          node --check netlify/functions/products-v16-lib.mjs
          node --check netlify/functions/products-v16.mjs
          node --check netlify/functions/products-v16-health.mjs
          node --check netlify/functions/products-v16-rebuild.mjs
          git diff --check

          grep -q 'const VERSION = "16.0.3"' netlify/functions/products-v16.mjs
          grep -q 'candidateLimit' netlify/functions/products-v16.mjs
          grep -q 'accessoryPenalty' netlify/functions/products-v16.mjs
          grep -q 'function balancedCatalogPaths' netlify/functions/products-v16-rebuild.mjs
          grep -q 'collectCatalogJsonPaths(payload, 3000)' netlify/functions/products-v16-rebuild.mjs
          grep -q 'const explicitNetwork' netlify/functions/products-v16-lib.mjs

          echo "V16.0.3 validation passed."

      - name: Publish V16.0.3
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            netlify/functions/products-v16-lib.mjs \
            netlify/functions/products-v16.mjs \
            netlify/functions/products-v16-health.mjs \
            netlify/functions/products-v16-rebuild.mjs \
            V16-UNIVERSAL-PRODUCT-INDEX.md

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V16.0.3 is already installed."
            exit 0
          fi

          git commit -m "fix: improve V16 product relevance and balance catalog coverage"
          git push origin HEAD:main

          {
            echo "## TrendPilot V16.0.3"
            echo "- relevance-first generic product ranking"
            echo "- accessories/repair results down-ranked when core product is requested"
            echo "- explicit accessory queries remain supported"
            echo "- wider candidate pool before final ranking"
            echo "- balanced manifest shard sampling"
            echo "- catalog file paths no longer counted as affiliate networks"
            echo "- after deploy: run /api/products-v16/rebuild once"
          } >> "$GITHUB_STEP_SUMMARY"
