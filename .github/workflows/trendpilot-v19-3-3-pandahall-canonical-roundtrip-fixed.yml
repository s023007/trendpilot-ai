name: TrendPilot V19.3.3 — PandaHall + Canonical Round-Trip Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v19-3-seller4-pandahall
  cancel-in-progress: false

jobs:
  seller-4-pandahall:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Verify three existing canonical seller foundations
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          expected = [
              ("geekbuying","Geekbuying",900),
              ("aliexpress","AliExpress",10000),
              ("alibaba","Alibaba",15000),
          ]

          for slug,name,minimum in expected:
              seller = root/"sellers"/slug
              manifest = json.loads((seller/"manifest.json").read_text())
              audit = json.loads((seller/"audit.json").read_text())

              assert manifest["seller"]["name"] == name
              assert manifest["metrics"]["totalProducts"] >= minimum
              assert manifest["metrics"]["sourceQualified"] == manifest["metrics"]["totalProducts"]
              assert audit["sourceLeak"] is False
              assert audit["blockedSellerLeak"] is False
              assert audit["duplicateProductKeys"] is False

          print("Seller 1-3 foundations PASS.")
          PY

          node --input-type=module <<'JS'
          import { PUBLIC_PRODUCT_SELLER_NAMES } from "./netlify/functions/product-seller-policy-v17.mjs";
          const sellers = [...PUBLIC_PRODUCT_SELLER_NAMES];
          if (sellers.length !== 14) throw new Error(`Expected 14 public product sellers, got ${sellers.length}`);
          if (!sellers.includes("PandaHall")) throw new Error("PandaHall is not approved.");
          if (sellers.includes("Temu") || sellers.includes("Joom")) throw new Error("Blocked seller leaked into public policy.");
          console.log("Public seller policy PASS.");
          JS

      - name: Install source-intake discovery engine
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scripts/catalog-v19 data/catalog-v19/source-manifests

          cat > scripts/catalog-v19/discover-seller-sources.mjs <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import {
            clean,
            extractProducts
          } from "../../netlify/functions/products-v16-lib.mjs";
          import {
            PUBLIC_PRODUCT_SELLER_NAMES,
            canonicalProductSeller
          } from "../../netlify/functions/product-seller-policy-v17.mjs";

          const args = Object.fromEntries(
            process.argv.slice(2).map(arg => {
              const i = arg.indexOf("=");
              return i < 0 ? [arg, ""] : [arg.slice(0,i), arg.slice(i+1)];
            })
          );

          const SELLER = args["--seller"];
          const SLUG = args["--slug"];
          const VERSION = args["--version"] || "19.3.3";

          if (!SELLER || !SLUG) throw new Error("Missing --seller or --slug.");
          if (!PUBLIC_PRODUCT_SELLER_NAMES.includes(SELLER)) {
            throw new Error(`${SELLER} is not an approved public product seller.`);
          }
          if (PUBLIC_PRODUCT_SELLER_NAMES.includes("Temu") || PUBLIC_PRODUCT_SELLER_NAMES.includes("Joom")) {
            throw new Error("Blocked seller leaked into public seller policy.");
          }

          const ROOT = "data";
          const OUT_DIR = "data/catalog-v19/source-manifests";
          fs.mkdirSync(OUT_DIR,{recursive:true});

          const norm = v => clean(v).normalize("NFKC").toLocaleLowerCase("en-US").replace(/[^a-z0-9]+/g," ").trim();

          function walkJson(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {
              const full = path.join(dir,entry.name);
              if (entry.isDirectory()) {
                if (
                  full.startsWith("data/catalog-v19") ||
                  full.startsWith("data/commercial-v19")
                ) continue;
                out.push(...walkJson(full));
              } else if (entry.isFile() && entry.name.toLowerCase().endsWith(".json")) {
                out.push(full);
              }
            }
            return out;
          }

          function forbiddenPath(file) {
            const lower = file.toLowerCase();
            const base = path.basename(lower);
            const explicit = [
              "coupons.json",
              "product-seller-registry-v17.json",
              "approved-product-sellers-v16.json",
              "seller-coverage-v15-1.json",
              "cj-affiliate-status-v18.json"
            ];
            if (explicit.includes(base)) return "explicit-metadata-or-commercial-file";

            if (
              /(^|\/)(audit|audits|reports?|summaries|health|manifests?|resolver|queue)(\/|$)/i.test(lower)
            ) return "generated-or-audit-directory";

            if (
              /(seller-audit|coverage-report|comparison-sets|search-routes|same-model|lab-report|benchmark|verification)/i.test(base)
            ) return "generated-analysis-file";

            return "";
          }

          function keyFor(row) {
            return clean(
              row.id ||
              row.sourceProductId ||
              row.affiliateUrl ||
              row.destinationUrl ||
              `${row.seller}|${row.title}|${row.price}|${row.currency}`
            );
          }

          const stats = [];
          const qualifiedFiles = [];
          const allUnique = new Set();
          const qualifiedUnique = new Set();

          for (const file of walkJson(ROOT)) {
            let payload;
            try {
              payload = JSON.parse(fs.readFileSync(file,"utf8"));
            } catch {
              continue;
            }

            let rows;
            try {
              rows = extractProducts(payload,file,250000)
                .filter(row => canonicalProductSeller(row.seller) === SELLER);
            } catch {
              continue;
            }
            if (!rows.length) continue;

            const uniq = new Map();
            for (const row of rows) {
              const key = keyFor(row);
              if (key && !uniq.has(key)) uniq.set(key,row);
              if (key) allUnique.add(key);
            }

            const values = [...uniq.values()];
            const n = values.length;
            const stable = values.filter(x => clean(x.sourceProductId || x.id)).length;
            const price = values.filter(x => x.price != null).length;
            const image = values.filter(x => clean(x.imageUrl)).length;
            const link = values.filter(x => clean(x.affiliateUrl || x.destinationUrl)).length;
            const title = values.filter(x => clean(x.title)).length;

            const rate = x => n ? x/n : 0;
            const forbidden = forbiddenPath(file);

            // Qualified source rule:
            // - actual normalized product records for this seller
            // - not commercial/audit/registry metadata
            // - stable identity on most records
            // - working product destination/tracking link on most records
            // - at least price or image coverage proving this behaves like a product feed
            const isShard = file.startsWith("data/search-catalog/shards/");
            const qualifies =
              !forbidden &&
              title === n &&
              rate(stable) >= 0.50 &&
              rate(link) >= 0.50 &&
              (rate(price) >= 0.25 || rate(image) >= 0.25);

            let reason = "qualified-product-source";
            if (forbidden) reason = forbidden;
            else if (!qualifies) {
              reason = [
                rate(stable) < 0.50 ? "low-stable-id" : "",
                rate(link) < 0.50 ? "low-product-link" : "",
                (rate(price) < 0.25 && rate(image) < 0.25) ? "no-price-or-image-signal" : ""
              ].filter(Boolean).join("+") || "failed-product-source-rule";
            }

            stats.push({
              file,
              rows:rows.length,
              uniqueProducts:n,
              stableIdPercent:Number((rate(stable)*100).toFixed(1)),
              pricePercent:Number((rate(price)*100).toFixed(1)),
              imagePercent:Number((rate(image)*100).toFixed(1)),
              linkPercent:Number((rate(link)*100).toFixed(1)),
              alreadyQualifiedShard:isShard,
              qualifies,
              reason
            });

            if (qualifies) {
              qualifiedFiles.push(file);
              for (const [key] of uniq) qualifiedUnique.add(key);
            }
          }

          stats.sort((a,b) =>
            Number(b.qualifies)-Number(a.qualifies) ||
            b.uniqueProducts-a.uniqueProducts ||
            a.file.localeCompare(b.file)
          );

          if (!qualifiedFiles.length) throw new Error(`No qualified product sources discovered for ${SELLER}.`);

          const result = {
            version:VERSION,
            seller:SELLER,
            slug:SLUG,
            generatedAt:new Date().toISOString(),
            policy:{
              purpose:"Discover all repository product-feed sources for one approved seller before building its canonical V19 catalog.",
              productCatalogOnly:true,
              couponsAndPromotionsExcluded:true,
              auditsAndGeneratedAnalysisExcluded:true
            },
            candidateFiles:stats.length,
            qualifiedFileCount:qualifiedFiles.length,
            discoveredUniqueProductsAcrossAllCandidateFiles:allUnique.size,
            qualifiedUniqueProducts:qualifiedUnique.size,
            qualifiedFiles:qualifiedFiles.sort(),
            files:stats
          };

          fs.writeFileSync(`${OUT_DIR}/${SLUG}.json`,JSON.stringify(result,null,2)+"\n");
          console.log(JSON.stringify({
            seller:SELLER,
            candidateFiles:result.candidateFiles,
            qualifiedFileCount:result.qualifiedFileCount,
            allCandidateUniqueProducts:result.discoveredUniqueProductsAcrossAllCandidateFiles,
            qualifiedUniqueProducts:result.qualifiedUniqueProducts,
            qualifiedFiles:result.qualifiedFiles
          },null,2));
          JS

          node --check scripts/catalog-v19/discover-seller-sources.mjs

      - name: Seller 4 — discover every qualified PandaHall product source
        shell: bash
        run: |
          set -euo pipefail

          node scripts/catalog-v19/discover-seller-sources.mjs \
            --seller=PandaHall \
            --slug=pandahall \
            --version=19.3.3

      - name: Validate PandaHall source intake before catalog build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          intake = json.loads(Path("data/catalog-v19/source-manifests/pandahall.json").read_text())

          assert intake["seller"] == "PandaHall"
          assert intake["qualifiedFileCount"] >= 1
          assert intake["qualifiedUniqueProducts"] >= 27
          assert intake["qualifiedFiles"]
          assert "data/coupons.json" not in intake["qualifiedFiles"]

          for file in intake["qualifiedFiles"]:
              assert not file.startswith("data/catalog-v19/")
              assert not file.startswith("data/commercial-v19/")

          print("PandaHall source intake PASS")
          print("Candidate files:", intake["candidateFiles"])
          print("Qualified files:", intake["qualifiedFileCount"])
          print("All candidate unique products:", intake["discoveredUniqueProductsAcrossAllCandidateFiles"])
          print("Qualified unique products:", intake["qualifiedUniqueProducts"])
          PY

      - name: Upgrade reusable V19 seller engine to accept per-seller source manifests
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/catalog-v19/build-canonical-seller.mjs")
          s = p.read_text()

          def once(old,new,label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              s = s.replace(old,new,1)

          once(
              'const SOURCE_ROOT = "data/search-catalog/shards";',
              'const SOURCE_ROOT = args["--source-root"] || "data/search-catalog/shards";\n'
              'const SOURCE_MANIFEST = args["--source-manifest"] || "";',
              "source args"
          )

          once(
              'if (!fs.existsSync(SOURCE_ROOT)) throw new Error(`${SOURCE_ROOT} is missing.`);',
              'if (SOURCE_MANIFEST && !fs.existsSync(SOURCE_MANIFEST)) throw new Error(`${SOURCE_MANIFEST} is missing.`);\n'
              'if (!SOURCE_MANIFEST && !fs.existsSync(SOURCE_ROOT)) throw new Error(`${SOURCE_ROOT} is missing.`);',
              "source existence"
          )

          once(
              'const files = walkJson(SOURCE_ROOT);',
              'const manifestInput = SOURCE_MANIFEST ? JSON.parse(fs.readFileSync(SOURCE_MANIFEST, "utf8")) : null;\n'
              'const files = SOURCE_MANIFEST ? [...(manifestInput.qualifiedFiles || [])] : walkJson(SOURCE_ROOT);\n'
              'const qualifiedFileSet = new Set(files.map(file => path.normalize(file)));\n'
              'if (!files.length) throw new Error(`No qualified source files supplied for ${SELLER}.`);',
              "source file selection"
          )

          once(
              'sourceQualified: file.startsWith(`${SOURCE_ROOT}/`),',
              'sourceQualified: qualifiedFileSet.has(path.normalize(file)),',
              "record source qualification"
          )

          once(
              'sourceLeak:records.some(x => !x.source.sourceFile.startsWith(`${SOURCE_ROOT}/`)),',
              'sourceManifest: SOURCE_MANIFEST,\n'
              '  sourceLeak:records.some(x => !qualifiedFileSet.has(path.normalize(x.source.sourceFile))),',
              "audit source qualification"
          )

          old_norm = '''const norm = value =>
            clean(value)
              .normalize("NFKC")
              .toLocaleLowerCase("en-US")
              .replace(/[’'`]/g, "")
              .replace(/[^a-z0-9]+/g, " ")
              .trim();'''

          new_norm = '''const norm = value => {
            const base = clean(value)
              .normalize("NFKC")
              .toLocaleLowerCase("en-US")
              .replace(/[’'`]/g, "");
            const searchable = base
              .replace(/[^\\\\p{L}\\\\p{N}]+/gu, " ")
              .trim();
            return searchable || base.replace(/\\\\s+/g, " ").trim();
          };'''

          if old_norm not in s:
              raise SystemExit("unicode name normalization: expected builder normalizer was not found")
          s = s.replace(old_norm, new_norm, 1)

          # Keep every index prototype-safe. Seller IDs or names must never collide
          # with Object.prototype keys such as constructor/toString/__proto__.
          old_indexes = '''const indexes = {
            version: VERSION,
            seller: SELLER,
            byGlobalId: {},
            bySellerProductId: {},
            bySku: {},
            byBrandModel: {},
            byModel: {},
            byExactName: {},
            byCompactName: {}
          };'''

          new_indexes = '''const indexes = {
            version: VERSION,
            seller: SELLER,
            byGlobalId: Object.create(null),
            bySellerProductId: Object.create(null),
            bySku: Object.create(null),
            byBrandModel: Object.create(null),
            byModel: Object.create(null),
            byExactName: Object.create(null),
            byCompactName: Object.create(null)
          };'''

          if old_indexes not in s:
              raise SystemExit("prototype-safe indexes: expected index block was not found")
          s = s.replace(old_indexes, new_indexes, 1)

          # Round-trips must verify the SAME index that was populated.
          # The old generic resolve(query) could return a different index first
          # and falsely report a valid product ID/model as unresolved.
          old_roundtrip = '''function resolve(query) {
            const qn = norm(query);
            const qc = compact(query);

            for (const [kind, bucket, key] of [
              ["exact-name", indexes.byExactName, qn],
              ["compact-name", indexes.byCompactName, qc],
              ["model", indexes.byModel, qc],
              ["seller-product-id", indexes.bySellerProductId, qc],
              ["sku", indexes.bySku, qc]
            ]) {
              const values = bucket[key] || [];
              if (values.length) return {kind, productKeys:values};
            }

            const candidates = records.filter(r => r.name.normalized.includes(qn)).slice(0,20);
            return {kind:candidates.length ? "name-contains" : "not-found", productKeys:candidates.map(x=>x.productKey)};
          }

          const roundTripSamples = [];
          for (const record of records.filter(x => x.identifiers.model).slice(0,20)) {
            const result = resolve(record.identifiers.model);
            roundTripSamples.push({
              query:record.identifiers.model,
              expectedProductKey:record.productKey,
              resolutionKind:result.kind,
              resolved:result.productKeys.includes(record.productKey),
              resultCount:result.productKeys.length
            });
          }
          for (const record of records.filter(x => x.identifiers.sellerProductId).slice(0,20)) {
            const result = resolve(record.identifiers.sellerProductId);
            roundTripSamples.push({
              query:record.identifiers.sellerProductId,
              expectedProductKey:record.productKey,
              resolutionKind:result.kind,
              resolved:result.productKeys.includes(record.productKey),
              resultCount:result.productKeys.length
            });
          }'''

          new_roundtrip = '''const roundTripSamples = [];

          for (const record of records.filter(x => x.identifiers.model).slice(0,20)) {
            const indexKey = compact(record.identifiers.model);
            const productKeys = indexes.byModel[indexKey] || [];
            roundTripSamples.push({
              query:record.identifiers.model,
              indexKey,
              expectedProductKey:record.productKey,
              resolutionKind:"model-index",
              resolved:productKeys.includes(record.productKey),
              resultCount:productKeys.length
            });
          }

          for (const record of records.filter(x => x.identifiers.sellerProductId).slice(0,20)) {
            const indexKey = compact(record.identifiers.sellerProductId);
            const productKeys = indexes.bySellerProductId[indexKey] || [];
            roundTripSamples.push({
              query:record.identifiers.sellerProductId,
              indexKey,
              expectedProductKey:record.productKey,
              resolutionKind:"seller-product-id-index",
              resolved:productKeys.includes(record.productKey),
              resultCount:productKeys.length
            });
          }

          for (const record of records.slice(0,20)) {
            const indexKey = record.name.normalized;
            const productKeys = indexes.byExactName[indexKey] || [];
            roundTripSamples.push({
              query:record.name.display,
              indexKey,
              expectedProductKey:record.productKey,
              resolutionKind:"exact-name-index",
              resolved:productKeys.includes(record.productKey),
              resultCount:productKeys.length
            });
          }

          const failedRoundTrips = roundTripSamples.filter(x => !x.resolved);
          if (failedRoundTrips.length) {
            throw new Error(`Canonical seller index round-trip failures: ${JSON.stringify(failedRoundTrips.slice(0,10))}`);
          }'''

          if old_roundtrip not in s:
              raise SystemExit("direct round-trip patch: expected generic resolver block was not found")
          s = s.replace(old_roundtrip, new_roundtrip, 1)

          p.write_text(s)
          PY

          node --check scripts/catalog-v19/build-canonical-seller.mjs

      - name: Rebuild Sellers 1-3 with the same Unicode-safe canonical engine
        shell: bash
        run: |
          set -euo pipefail

          node scripts/catalog-v19/build-canonical-seller.mjs \
            --seller=Geekbuying \
            --slug=geekbuying \
            --version=19.3.3 \
            --role=reference-foundation-catalog

          node scripts/catalog-v19/build-canonical-seller.mjs \
            --seller=AliExpress \
            --slug=aliexpress \
            --version=19.3.3 \
            --role=second-canonical-catalog

          node scripts/catalog-v19/build-canonical-seller.mjs \
            --seller=Alibaba \
            --slug=alibaba \
            --version=19.3.3 \
            --role=third-canonical-catalog

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          for slug,name,minimum in [
              ("geekbuying","Geekbuying",900),
              ("aliexpress","AliExpress",10000),
              ("alibaba","Alibaba",15000),
          ]:
              seller = root/"sellers"/slug
              manifest = json.loads((seller/"manifest.json").read_text())
              audit = json.loads((seller/"audit.json").read_text())

              assert manifest["version"] == "19.3.3"
              assert manifest["seller"]["name"] == name
              assert manifest["metrics"]["totalProducts"] >= minimum
              assert manifest["metrics"]["sourceQualified"] == manifest["metrics"]["totalProducts"]
              assert audit["sourceLeak"] is False
              assert audit["blockedSellerLeak"] is False
              assert audit["duplicateProductKeys"] is False
              assert audit["roundTripSamples"]
              failed = [x for x in audit["roundTripSamples"] if not x["resolved"]]
              assert not failed, (name, failed[:5])

              blank = 0
              with (seller/"products.ndjson").open() as f:
                  for line in f:
                      if not line.strip():
                          continue
                      row = json.loads(line)
                      assert row["name"]["display"]
                      if not row["name"]["normalized"]:
                          blank += 1
              assert blank == 0, (name, blank)

          print("Sellers 1-3 Unicode-safe rebuild PASS.")
          PY

      - name: Seller 4 — build PandaHall from its qualified source manifest
        shell: bash
        run: |
          set -euo pipefail

          node scripts/catalog-v19/build-canonical-seller.mjs \
            --seller=PandaHall \
            --slug=pandahall \
            --version=19.3.3 \
            --role=fourth-canonical-catalog \
            --source-manifest=data/catalog-v19/source-manifests/pandahall.json

      - name: Seller 4 — hard catalog validation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json, math

          root = Path("data/catalog-v19")
          intake = json.loads((root/"source-manifests/pandahall.json").read_text())
          seller = root/"sellers/pandahall"
          manifest = json.loads((seller/"manifest.json").read_text())
          audit = json.loads((seller/"audit.json").read_text())

          total = manifest["metrics"]["totalProducts"]
          source_total = intake["qualifiedUniqueProducts"]

          assert manifest["seller"]["name"] == "PandaHall"
          assert total >= 25, total
          assert total >= math.floor(source_total * 0.85), (total,source_total)
          assert manifest["metrics"]["sourceQualified"] == total
          assert audit["sourceLeak"] is False
          assert audit["blockedSellerLeak"] is False
          assert audit["duplicateProductKeys"] is False
          assert audit["roundTripSamples"]
          failed_roundtrips = [x for x in audit["roundTripSamples"] if not x["resolved"]]
          if failed_roundtrips:
              raise AssertionError(
                  "PandaHall canonical index round-trip failures: " +
                  json.dumps(failed_roundtrips[:10], ensure_ascii=False)
              )

          stable = manifest["metrics"]["stableSellerId"]
          assert stable / total >= 0.70, (stable,total)

          qualified = set(intake["qualifiedFiles"])
          with (seller/"products.ndjson").open() as f:
              for line in f:
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  assert row["source"]["sourceFile"] in qualified
                  assert row["source"]["sourceFile"] != "data/coupons.json"
                  assert row["name"]["display"]
                  assert row["name"]["normalized"], row["productKey"]

          # Same canonical contract as Sellers 1-3.
          def first_row(file):
              with file.open() as f:
                  for line in f:
                      if line.strip():
                          return json.loads(line)

          base = first_row(root/"sellers/geekbuying/products.ndjson")
          current = first_row(seller/"products.ndjson")

          assert set(base.keys()) == set(current.keys())
          for key in ["seller","identifiers","name","taxonomy","specs","offer","media","links","source"]:
              assert set(base[key].keys()) == set(current[key].keys()), key

          print("Seller 4 PandaHall PASS")
          print("Qualified source products:", source_total)
          print("Canonical products:", total)
          print("Stable seller IDs/SKUs:", stable)
          PY

      - name: Add PandaHall and install deterministic global resolver
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("data/catalog-v19/catalog-set-v1.json")
          data = json.loads(p.read_text())

          data["version"] = "19.3.3"
          data["sellers"] = [
              {"name":"Geekbuying","slug":"geekbuying"},
              {"name":"AliExpress","slug":"aliexpress"},
              {"name":"Alibaba","slug":"alibaba"},
              {"name":"PandaHall","slug":"pandahall"},
          ]
          p.write_text(json.dumps(data,indent=2) + "\n")
          PY

          cat > scripts/catalog-v19/build-global-resolver.mjs <<'JS'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import { PUBLIC_PRODUCT_SELLER_NAMES } from "../../netlify/functions/product-seller-policy-v17.mjs";

          const VERSION = "19.3.3";
          const ROOT = "data/catalog-v19";
          const SET_FILE = `${ROOT}/catalog-set-v1.json`;

          const catalogSet = JSON.parse(fs.readFileSync(SET_FILE,"utf8"));
          const SELLERS = catalogSet.sellers || [];

          if (SELLERS.length < 2) throw new Error("At least two validated seller catalogs are required.");
          for (const seller of SELLERS) {
            if (!seller?.name || !seller?.slug) throw new Error("Invalid catalog-set seller.");
            if (!PUBLIC_PRODUCT_SELLER_NAMES.includes(seller.name)) throw new Error(`Unapproved seller: ${seller.name}`);
          }
          if (SELLERS.some(x => ["Temu","Joom"].includes(x.name))) throw new Error("Blocked seller leaked into catalog set.");

          const norm = value => {
            const base = String(value ?? "")
              .normalize("NFKC")
              .toLocaleLowerCase("en-US")
              .replace(/[’'`]/g,"");
            const searchable = base.replace(/[^\p{L}\p{N}]+/gu," ").trim();
            return searchable || base.replace(/\s+/g," ").trim();
          };
          const compact = value => norm(value).replace(/\s+/g,"");
          const uniq = values => [...new Set(values.filter(Boolean))];
          const sha = value => crypto.createHash("sha256").update(String(value)).digest("hex");
          const exactNameKey = row => norm(row?.name?.display || row?.name?.normalized || "");

          function loadNdjson(file) {
            return fs.readFileSync(file,"utf8").split(/\n/).filter(Boolean).map(JSON.parse);
          }

          const maps = {
            byGlobalId:new Map(),
            byBrandExplicitModel:new Map(),
            byScopedSellerProductId:new Map(),
            byScopedSku:new Map(),
            byModelDiscovery:new Map(),
            byExactName:new Map(),
            byCompactName:new Map(),
            byNameToken:new Map(),
            byCanonicalCategory:new Map()
          };

          function push(map,key,productKey) {
            if (!key) return;
            let set=map.get(key);
            if (!set) {
              set=new Set();
              map.set(key,set);
            }
            set.add(productKey);
          }
          function mapToObject(map) {
            const out=Object.create(null);
            for (const [key,set] of map) out[key]=[...set];
            return out;
          }

          const records=[];
          for (const seller of SELLERS) {
            const productsFile=`${ROOT}/sellers/${seller.slug}/products.ndjson`;
            const manifestFile=`${ROOT}/sellers/${seller.slug}/manifest.json`;

            if (!fs.existsSync(productsFile) || !fs.existsSync(manifestFile)) {
              throw new Error(`Missing validated catalog for ${seller.name}`);
            }

            const manifest=JSON.parse(fs.readFileSync(manifestFile,"utf8"));
            if (manifest.seller?.name !== seller.name) throw new Error(`Manifest mismatch for ${seller.name}`);

            for (const row of loadNdjson(productsFile)) {
              if (row.seller?.name !== seller.name || row.seller?.slug !== seller.slug) {
                throw new Error(`Seller mismatch in ${productsFile}`);
              }
              if (!row.quality?.sourceQualified) throw new Error(`Unqualified product source in ${seller.name}`);
              if (!row.name?.display) throw new Error(`Blank display title in ${seller.name}: ${row.productKey}`);
              if (!exactNameKey(row)) throw new Error(`Unsearchable title in ${seller.name}: ${row.productKey}`);
              records.push(row);
            }
          }

          if (records.some(x => ["Temu","Joom"].includes(x.seller?.name))) throw new Error("Blocked seller leaked into records.");
          if (records.length !== new Set(records.map(x=>x.productKey)).size) throw new Error("Duplicate productKey across catalogs.");

          const byKey=new Map(records.map(row=>[row.productKey,row]));

          for (const row of records) {
            for (const key of row.identity?.keys?.exactGlobal || []) push(maps.byGlobalId,key,row.productKey);

            if (row.brand && row.identifiers?.model && row.identity?.modelConfidence === "explicit") {
              push(maps.byBrandExplicitModel,`brand-model:${compact(row.brand)}:${compact(row.identifiers.model)}`,row.productKey);
            }

            if (row.identifiers?.sellerProductId) {
              push(maps.byScopedSellerProductId,`${row.seller.slug}:${compact(row.identifiers.sellerProductId)}`,row.productKey);
            }
            if (row.identifiers?.sku) {
              push(maps.byScopedSku,`${row.seller.slug}:${compact(row.identifiers.sku)}`,row.productKey);
            }
            if (row.identifiers?.model) push(maps.byModelDiscovery,compact(row.identifiers.model),row.productKey);

            const nameKey=exactNameKey(row);
            push(maps.byExactName,nameKey,row.productKey);
            push(maps.byCompactName,compact(row.name.display),row.productKey);

            for (const token of uniq(nameKey.split(/\s+/).filter(x=>x.length>=2 && !/^\d$/.test(x)))) {
              push(maps.byNameToken,token,row.productKey);
            }

            for (const category of uniq([
              ...(row.taxonomy?.canonicalPath || []).map(norm),
              norm(row.taxonomy?.canonicalCategory || ""),
              norm(row.taxonomy?.sourceCategory || ""),
              norm(row.taxonomy?.sourceSubcategory || "")
            ])) {
              push(maps.byCanonicalCategory,category,row.productKey);
            }
          }

          const insertionFailures=[];
          for (const row of records) {
            if (row.identifiers?.sellerProductId) {
              const key=`${row.seller.slug}:${compact(row.identifiers.sellerProductId)}`;
              if (!maps.byScopedSellerProductId.get(key)?.has(row.productKey)) {
                insertionFailures.push({seller:row.seller.name,kind:"seller-product-id",key,productKey:row.productKey});
              }
            }

            const nameKey=exactNameKey(row);
            if (!maps.byExactName.get(nameKey)?.has(row.productKey)) {
              insertionFailures.push({seller:row.seller.name,kind:"exact-name",key:nameKey,productKey:row.productKey});
            }
          }
          if (insertionFailures.length) {
            throw new Error(`Resolver insertion failures: ${JSON.stringify(insertionFailures.slice(0,10))}`);
          }

          const resolver={
            version:VERSION,
            catalogSetVersion:catalogSet.version,
            sellers:SELLERS,
            generatedAt:new Date().toISOString(),
            byGlobalId:mapToObject(maps.byGlobalId),
            byBrandExplicitModel:mapToObject(maps.byBrandExplicitModel),
            byScopedSellerProductId:mapToObject(maps.byScopedSellerProductId),
            byScopedSku:mapToObject(maps.byScopedSku),
            byModelDiscovery:mapToObject(maps.byModelDiscovery),
            byExactName:mapToObject(maps.byExactName),
            byCompactName:mapToObject(maps.byCompactName),
            byNameToken:mapToObject(maps.byNameToken),
            byCanonicalCategory:mapToObject(maps.byCanonicalCategory),
            autoGroups:[],
            discoveryOverlaps:{exactName:[],brandModelInferred:[]}
          };

          const autoCandidates=new Map();
          for (const [key,set] of maps.byGlobalId) autoCandidates.set(`global:${key}`,{reason:key,productKeys:[...set]});
          for (const [key,set] of maps.byBrandExplicitModel) autoCandidates.set(`explicit-model:${key}`,{reason:key,productKeys:[...set]});

          const autoConflicts=[];
          for (const [groupKey,group] of autoCandidates) {
            const rows=group.productKeys.map(k=>byKey.get(k)).filter(Boolean);
            const sellerNames=uniq(rows.map(x=>x.seller.name));
            if (sellerNames.length<2) continue;

            const perSellerCounts={};
            for (const row of rows) perSellerCounts[row.seller.name]=(perSellerCounts[row.seller.name]||0)+1;

            if (Object.values(perSellerCounts).some(n=>n>1)) {
              autoConflicts.push({groupKey,reason:group.reason,productKeys:group.productKeys,perSellerCounts});
              continue;
            }

            resolver.autoGroups.push({
              groupId:`exact-${sha(groupKey).slice(0,20)}`,
              reason:group.reason,
              sellerCount:sellerNames.length,
              sellers:sellerNames.sort(),
              productKeys:group.productKeys
            });
          }

          for (const [name,set] of maps.byExactName) {
            const productKeys=[...set];
            const sellers=uniq(productKeys.map(k=>byKey.get(k)?.seller?.name));
            if (sellers.length>=2) {
              resolver.discoveryOverlaps.exactName.push({name,sellerCount:sellers.length,sellers:sellers.sort(),productKeys});
            }
          }

          const inferredBrandModel=new Map();
          for (const row of records) {
            if (!row.brand || !row.identifiers?.model) continue;
            push(inferredBrandModel,`brand-model:${compact(row.brand)}:${compact(row.identifiers.model)}`,row.productKey);
          }
          for (const [key,set] of inferredBrandModel) {
            const productKeys=[...set];
            const sellers=uniq(productKeys.map(k=>byKey.get(k)?.seller?.name));
            if (sellers.length>=2) {
              resolver.discoveryOverlaps.brandModelInferred.push({key,sellerCount:sellers.length,sellers:sellers.sort(),productKeys});
            }
          }

          const roundTrips=[];
          for (const seller of SELLERS) {
            const sellerRows=records.filter(x=>x.seller.slug===seller.slug);

            for (const row of sellerRows.filter(x=>x.identifiers?.sellerProductId).slice(0,20)) {
              const indexKey=`${seller.slug}:${compact(row.identifiers.sellerProductId)}`;
              roundTrips.push({
                seller:seller.name,kind:"seller-product-id",query:row.identifiers.sellerProductId,
                indexKey,expectedProductKey:row.productKey,
                resolved:Boolean(maps.byScopedSellerProductId.get(indexKey)?.has(row.productKey))
              });
            }

            for (const row of sellerRows.slice(0,10)) {
              const indexKey=exactNameKey(row);
              roundTrips.push({
                seller:seller.name,kind:"exact-name",query:row.name.display,
                indexKey,expectedProductKey:row.productKey,
                resolved:Boolean(maps.byExactName.get(indexKey)?.has(row.productKey))
              });
            }
          }

          const failedRoundTrips=roundTrips.filter(x=>!x.resolved);
          if (failedRoundTrips.length) {
            throw new Error(`Resolver round-trip failures: ${JSON.stringify(failedRoundTrips.slice(0,10))}`);
          }

          const audit={
            version:VERSION,
            generatedAt:resolver.generatedAt,
            catalogSetVersion:catalogSet.version,
            sellers:SELLERS,
            totalRecords:records.length,
            sellerCounts:Object.fromEntries(SELLERS.map(s=>[s.name,records.filter(x=>x.seller.slug===s.slug).length])),
            autoExactGroups:resolver.autoGroups.length,
            autoGroupConflicts:autoConflicts,
            exactNameCrossSellerOverlaps:resolver.discoveryOverlaps.exactName.length,
            brandModelDiscoveryOverlaps:resolver.discoveryOverlaps.brandModelInferred.length,
            insertionFailures,
            roundTrips,
            failedRoundTrips,
            blockedSellerLeak:false,
            duplicateGlobalProductKeys:false
          };

          fs.writeFileSync(`${ROOT}/global-resolver-v1.json`,JSON.stringify(resolver,null,2)+"\n");
          fs.writeFileSync(`${ROOT}/cross-seller-audit-v1.json`,JSON.stringify(audit,null,2)+"\n");

          console.log(JSON.stringify({
            totalRecords:audit.totalRecords,
            sellerCounts:audit.sellerCounts,
            autoExactGroups:audit.autoExactGroups,
            exactNameCrossSellerOverlaps:audit.exactNameCrossSellerOverlaps,
            brandModelDiscoveryOverlaps:audit.brandModelDiscoveryOverlaps,
            roundTrips:`${roundTrips.length}/${roundTrips.length}`
          },null,2));
          JS

          node --check scripts/catalog-v19/build-global-resolver.mjs
          node scripts/catalog-v19/build-global-resolver.mjs

      - name: Validate four-seller shared resolver
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          resolver = json.loads((root/"global-resolver-v1.json").read_text())
          audit = json.loads((root/"cross-seller-audit-v1.json").read_text())

          expected = ["Geekbuying","AliExpress","Alibaba","PandaHall"]
          assert [x["name"] for x in resolver["sellers"]] == expected

          assert audit["blockedSellerLeak"] is False
          assert audit["duplicateGlobalProductKeys"] is False
          assert audit["sellerCounts"]["PandaHall"] >= 25
          assert audit["roundTrips"]
          failed = [x for x in audit["roundTrips"] if not x["resolved"]]
          if failed:
              raise AssertionError("Round-trip failures: " + json.dumps(failed[:10], ensure_ascii=False))
          assert not audit.get("failedRoundTrips")
          assert not audit.get("insertionFailures")

          print("Four-seller global resolver PASS")
          print("Total records:", audit["totalRecords"])
          print("Automatic exact groups:", audit["autoExactGroups"])
          print("Exact-name overlaps:", audit["exactNameCrossSellerOverlaps"])
          print("Brand/model discovery overlaps:", audit["brandModelDiscoveryOverlaps"])
          PY

      - name: Build source-aware remaining seller queue
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/catalog-v19/build-source-aware-seller-queue.mjs <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import {
            clean,
            extractProducts
          } from "../../netlify/functions/products-v16-lib.mjs";
          import {
            PUBLIC_PRODUCT_SELLER_NAMES,
            canonicalProductSeller
          } from "../../netlify/functions/product-seller-policy-v17.mjs";

          const ROOT = "data";
          const BUILT = new Set(["Geekbuying","AliExpress","Alibaba","PandaHall"]);

          function walkJson(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {
              const full = path.join(dir,entry.name);
              if (entry.isDirectory()) {
                if (
                  full.startsWith("data/catalog-v19") ||
                  full.startsWith("data/commercial-v19")
                ) continue;
                out.push(...walkJson(full));
              } else if (entry.isFile() && entry.name.toLowerCase().endsWith(".json")) {
                out.push(full);
              }
            }
            return out;
          }

          function forbiddenPath(file) {
            const lower = file.toLowerCase();
            const base = path.basename(lower);
            if ([
              "coupons.json",
              "product-seller-registry-v17.json",
              "approved-product-sellers-v16.json",
              "seller-coverage-v15-1.json",
              "cj-affiliate-status-v18.json"
            ].includes(base)) return true;

            return (
              /(^|\/)(audit|audits|reports?|summaries|health|manifests?|resolver|queue)(\/|$)/i.test(lower) ||
              /(seller-audit|coverage-report|comparison-sets|search-routes|same-model|lab-report|benchmark|verification)/i.test(base)
            );
          }

          function keyFor(row) {
            return clean(
              row.id ||
              row.sourceProductId ||
              row.affiliateUrl ||
              row.destinationUrl ||
              `${row.seller}|${row.title}|${row.price}|${row.currency}`
            );
          }

          const remaining = PUBLIC_PRODUCT_SELLER_NAMES.filter(x => !BUILT.has(x));
          const sellers = new Map(
            remaining.map(s => [s,{
              seller:s,
              allCandidateKeys:new Set(),
              qualifiedKeys:new Set(),
              candidateFiles:new Set(),
              qualifiedFiles:new Set()
            }])
          );

          for (const file of walkJson(ROOT)) {
            if (forbiddenPath(file)) continue;

            let payload;
            try { payload = JSON.parse(fs.readFileSync(file,"utf8")); }
            catch { continue; }

            let rows;
            try { rows = extractProducts(payload,file,250000); }
            catch { continue; }

            const perSeller = new Map();
            for (const row of rows) {
              const seller = canonicalProductSeller(row.seller);
              if (!sellers.has(seller)) continue;
              if (!perSeller.has(seller)) perSeller.set(seller,[]);
              perSeller.get(seller).push(row);
            }

            for (const [seller, sellerRows] of perSeller) {
              const stat = sellers.get(seller);
              stat.candidateFiles.add(file);

              const uniq = new Map();
              for (const row of sellerRows) {
                const key = keyFor(row);
                if (key && !uniq.has(key)) uniq.set(key,row);
                if (key) stat.allCandidateKeys.add(key);
              }

              const values = [...uniq.values()];
              const n = values.length;
              if (!n) continue;

              const stable = values.filter(x => clean(x.sourceProductId || x.id)).length;
              const price = values.filter(x => x.price != null).length;
              const image = values.filter(x => clean(x.imageUrl)).length;
              const link = values.filter(x => clean(x.affiliateUrl || x.destinationUrl)).length;
              const rate = x => n ? x/n : 0;

              const qualifies =
                rate(stable) >= 0.50 &&
                rate(link) >= 0.50 &&
                (rate(price) >= 0.25 || rate(image) >= 0.25);

              if (qualifies) {
                stat.qualifiedFiles.add(file);
                for (const [key] of uniq) stat.qualifiedKeys.add(key);
              }
            }
          }

          const rows = [...sellers.values()].map(x => ({
            seller:x.seller,
            candidateFiles:x.candidateFiles.size,
            qualifiedFiles:x.qualifiedFiles.size,
            allCandidateUniqueProducts:x.allCandidateKeys.size,
            qualifiedProducts:x.qualifiedKeys.size
          })).sort((a,b) =>
            b.qualifiedProducts-a.qualifiedProducts ||
            b.allCandidateUniqueProducts-a.allCandidateUniqueProducts ||
            a.seller.localeCompare(b.seller)
          );

          const result = {
            version:"19.3.3",
            generatedAt:new Date().toISOString(),
            completedSellers:["Geekbuying","AliExpress","Alibaba","PandaHall"],
            sourceAware:true,
            remaining:rows,
            recommendedNext:rows.find(x => x.qualifiedProducts > 0) || null
          };

          fs.writeFileSync("data/catalog-v19/seller-build-queue-v2.json",JSON.stringify(result,null,2)+"\n");
          console.log(JSON.stringify(result,null,2));
          JS

          node --check scripts/catalog-v19/build-source-aware-seller-queue.mjs
          node scripts/catalog-v19/build-source-aware-seller-queue.mjs

      - name: Create concise V19.3 report
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("data/catalog-v19")
          intake = json.loads((root/"source-manifests/pandahall.json").read_text())
          panda = json.loads((root/"sellers/pandahall/manifest.json").read_text())
          cross = json.loads((root/"cross-seller-audit-v1.json").read_text())
          queue = json.loads((root/"seller-build-queue-v2.json").read_text())

          def rate(key):
              return panda["fillRates"][key]["percent"]

          nxt = queue.get("recommendedNext") or {}

          report = []
          report.append("# TrendPilot V19.3.3 — Seller 4: PandaHall")
          report.append("")
          report.append("> Seller-by-seller canonical catalog build. Visitor UI/search API are still unchanged.")
          report.append("")
          report.append("## Source intake correction")
          report.append("- The old Seller 4 queue counted only `data/search-catalog/shards`, which showed 27 PandaHall records.")
          report.append("- V19.3 now discovers and validates product-feed sources across the repository before a seller is built.")
          report.append(f"- Candidate PandaHall product files found: **{intake['candidateFiles']}**")
          report.append(f"- Qualified product-source files: **{intake['qualifiedFileCount']}**")
          report.append(f"- Unique products in qualified sources: **{intake['qualifiedUniqueProducts']:,}**")
          report.append("- Coupons, campaigns, registries and generated audit/report files are excluded from product identity.")
          report.append("")
          report.append("## Seller 4 — PandaHall")
          report.append(f"- Canonical products: **{panda['metrics']['totalProducts']:,}**")
          report.append(f"- Qualified source coverage: **{rate('sourceQualified')}%**")
          report.append(f"- Stable seller ID/SKU: **{panda['metrics']['stableSellerId']:,} ({rate('stableSellerId')}%)**")
          report.append(f"- Brand: **{panda['metrics']['brand']:,} ({rate('brand')}%)**")
          report.append(f"- Model/name hint: **{panda['metrics']['modelAny']:,} ({rate('modelAny')}%)**")
          report.append(f"- Structured specs: **{panda['metrics']['structuredSpecs']:,} ({rate('structuredSpecs')}%)**")
          report.append(f"- Derived title specs: **{panda['metrics']['derivedSpecs']:,} ({rate('derivedSpecs')}%)**")
          report.append(f"- Price: **{panda['metrics']['price']:,} ({rate('price')}%)**")
          report.append(f"- Image: **{panda['metrics']['image']:,} ({rate('image')}%)**")
          report.append("")
          report.append("## Four-seller shared resolver")
          report.append(f"- Total canonical records: **{cross['totalRecords']:,}**")
          report.append(f"- Automatic exact cross-seller groups: **{cross['autoExactGroups']:,}**")
          report.append(f"- Exact-name discovery overlaps: **{cross['exactNameCrossSellerOverlaps']:,}**")
          report.append(f"- Brand/model discovery overlaps: **{cross['brandModelDiscoveryOverlaps']:,}**")
          report.append("")
          report.append("## Gate for Seller 5")
          report.append("**PASS**")
          if nxt:
              report.append("")
              report.append(
                  f"Recommended next seller using the new source-aware queue: "
                  f"**{nxt.get('seller','')}** — **{int(nxt.get('qualifiedProducts',0)):,}** qualified products "
                  f"from **{int(nxt.get('qualifiedFiles',0))}** qualified source files."
              )
          else:
              report.append("")
              report.append("No remaining seller currently has a qualified persisted product feed; the next task should be ingestion for the approved live/catalog seller with the highest commercial priority.")

          text = "\n".join(report) + "\n"
          (root/"V19.3-REPORT.md").write_text(text)
          print(text)
          PY

