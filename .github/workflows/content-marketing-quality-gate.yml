name: TrendPilot Content Marketing Quality Gate

on:
  pull_request:
    paths:
      - 'events/**'
      - 'docs/CONTENT-MARKETING-STANDARD.md'
      - 'docs/EVENT-MOBILE-CONVERSION-STANDARD.md'
      - 'config/content-distribution-channels.json'
      - '.github/workflows/content-marketing-quality-gate.yml'
  push:
    branches: [main]
    paths:
      - 'events/**'
      - 'docs/CONTENT-MARKETING-STANDARD.md'
      - 'docs/EVENT-MOBILE-CONVERSION-STANDARD.md'
      - 'config/content-distribution-channels.json'
      - '.github/workflows/content-marketing-quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce TrendPilot commercial content standard on changed event pages
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > /tmp/changed.txt
          else
            git ls-files > /tmp/changed.txt
          fi
          echo 'Changed files:'
          cat /tmp/changed.txt

          python3 - <<'PY'
          import pathlib, re, sys

          changed=[x.strip() for x in pathlib.Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          pages=[p for p in changed if p.startswith('events/') and p.endswith('/index.html')]
          errors=[]
          checked=[]

          for p in pages:
              path=pathlib.Path(p)
              if not path.exists():
                  continue
              parts=path.parts
              if len(parts) < 3:
                  continue
              event_dir=pathlib.Path(parts[0]) / parts[1]
              html=path.read_text(encoding='utf-8', errors='replace')
              low=html.lower()
              checked.append(p)

              rules={
                  'large image preview': 'max-image-preview:large' in low,
                  'visual storytelling': '<img ' in low,
                  'open graph image': 'property="og:image"' in low or "property='og:image'" in low,
                  'primary CTA': 'class="button primary' in low or "class='button primary" in low,
                  'affiliate disclosure/link marking': 'sponsored' in low,
              }
              for label, ok in rules.items():
                  if not ok:
                      errors.append(f'{p}: missing {label}')

              # The first mobile screen must show the CTA before a large visual.
              first_img=low.find('<img ')
              cta_candidates=[x for x in (low.find('class="button primary'), low.find("class='button primary")) if x >= 0]
              first_cta=min(cta_candidates) if cta_candidates else -1
              if first_img >= 0 and (first_cta < 0 or first_img < first_cta):
                  errors.append(f'{p}: primary CTA must appear before the first image in DOM')

              # Do not hotlink production event images from third-party hosts.
              img_srcs=re.findall(r'<img\b[^>]*\bsrc=["\']([^"\']+)["\']',html,re.I)
              remote=[s for s in img_srcs if re.match(r'^https?://',s,re.I)]
              if remote:
                  errors.append(f'{p}: third-party image hotlinks are not allowed: {remote}')
              local=[s for s in img_srcs if not re.match(r'^(?:https?://|data:)',s,re.I)]
              if not local:
                  errors.append(f'{p}: at least one local event visual is required')
              for src in local:
                  clean=src.split('#',1)[0].split('?',1)[0]
                  asset=(path.parent/clean).resolve()
                  try:
                      asset.relative_to(pathlib.Path.cwd().resolve())
                  except ValueError:
                      errors.append(f'{p}: local image escapes repository: {src}')
                      continue
                  if not asset.exists():
                      errors.append(f'{p}: referenced local image does not exist: {src}')

              # Localized event pages are concise conversion landings by default.
              if len(parts) >= 4 and 'data-longform-approved' not in low:
                  section_count=len(re.findall(r'<section\b',low))
                  if section_count > 7:
                      errors.append(f'{p}: {section_count} sections is too long for localized mobile landing (max 7)')

              # Arabic rendering safety for mixed RTL/LTR content.
              if '/ar/' in p.replace('\\','/'):
                  if not re.search(r'<html[^>]*lang=["\']ar["\'][^>]*dir=["\']rtl["\']',low):
                      errors.append(f'{p}: Arabic page must declare lang="ar" dir="rtl"')
                  mixed_terms=('Ticombo','Manchester United','Manchester City','Old Trafford')
                  if any(term in html for term in mixed_terms) and not ('class="latin"' in low or 'dir="ltr"' in low or '<bdi' in low):
                      errors.append(f'{p}: mixed Latin names must be directionally isolated')

              pack=event_dir/'distribution-pack.json'
              if not pack.exists():
                  errors.append(f'{p}: missing {pack} (commercial articles require a distribution pack)')

          # CSS must not force the hero image ahead of sales copy on mobile.
          for p in changed:
              if not p.startswith('events/') or not p.endswith('.css'):
                  continue
              path=pathlib.Path(p)
              if not path.exists():
                  continue
              css=path.read_text(encoding='utf-8', errors='replace').lower()
              if re.search(r'\.hero-media\s*\{[^}]*order\s*:\s*-1', css, re.S):
                  errors.append(f'{p}: hero-media uses order:-1; sales copy and CTA must appear first on mobile')

          if checked:
              required=[pathlib.Path('docs/CONTENT-MARKETING-STANDARD.md'),pathlib.Path('docs/EVENT-MOBILE-CONVERSION-STANDARD.md'),pathlib.Path('config/content-distribution-channels.json')]
              for req in required:
                  if not req.exists(): errors.append(f'Missing {req}')

          print('Pages checked:', checked)
          if errors:
              print('\nQUALITY GATE FAILED')
              for e in errors: print('-', e)
              sys.exit(1)
          print('TrendPilot content marketing quality gate: PASS')
          PY
