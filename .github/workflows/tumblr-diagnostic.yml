name: Tumblr End-to-End Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tumblr-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
      TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
      TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
      TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tumblr client
        run: npm install --no-save tumblr.js@5.0.1

      - name: Diagnose Tumblr posting paths
        shell: bash
        run: |
          set +e
          mkdir -p data/runtime
          node <<'NODE'
          const fs = require('fs');
          const tumblr = require('tumblr.js');
          const out = {
            started_at: new Date().toISOString(),
            missing_secrets: [],
            auth_ok: false,
            blog: null,
            queue_before: null,
            text_probe: null,
            npf_image_probe: null,
            legacy_photo_probe: null,
            queue_after: null,
            error: null
          };
          const save = () => fs.writeFileSync('data/runtime/tumblr-diagnostic-result.json', JSON.stringify(out, null, 2) + '\n');
          const req = ['TUMBLR_CONSUMER_KEY','TUMBLR_CONSUMER_SECRET','TUMBLR_OAUTH_TOKEN','TUMBLR_OAUTH_TOKEN_SECRET'];
          out.missing_secrets = req.filter(k => !process.env[k]);
          if (out.missing_secrets.length) { out.error = 'missing secrets'; save(); process.exit(0); }

          const client = tumblr.createClient({
            consumer_key: process.env.TUMBLR_CONSUMER_KEY,
            consumer_secret: process.env.TUMBLR_CONSUMER_SECRET,
            token: process.env.TUMBLR_OAUTH_TOKEN,
            token_secret: process.env.TUMBLR_OAUTH_TOKEN_SECRET,
          });

          const destination = 'https://trendpilotchoice.com/products/wireless-carplay-adapters/?utm_source=tumblr&utm_medium=organic&utm_campaign=wireless-carplay-search-first&utm_content=diagnostic';
          const source = 'https://raw.githubusercontent.com/s023007/trendpilot-ai/main/images/social/carplay-ai-01.jpg';

          (async () => {
            try {
              const info = await client.userInfo();
              out.auth_ok = true;
              const blogs = info?.user?.blogs || [];
              const preferred = blogs.find(b => String(b.name||'').toLowerCase() === 'trendpilotchoice')
                || blogs.find(b => String(b.url||'').toLowerCase().includes('trendpilotchoice'))
                || blogs.find(b => b.primary) || blogs[0];
              if (!preferred) throw new Error('No Tumblr blog resolved');
              const blogName = preferred.name || preferred.url;
              out.blog = blogName;

              const q1 = await client.blogQueue(blogName, {limit: 50, offset: 0});
              out.queue_before = (q1?.posts || []).map(p => ({id:String(p.id), summary:p.summary||'', tags:p.tags||[]}));

              try {
                const tp = await client.createPost(blogName, {
                  state: 'queue',
                  tags: ['trendpilot-diagnostic-text'],
                  content: [{type:'text', text:'TrendPilot Tumblr diagnostic probe'}]
                });
                const tid = String(tp?.id || tp?.response?.id || '');
                out.text_probe = {ok: !!tid, id: tid || null, response_keys: Object.keys(tp||{})};
                if (tid) await client.deletePost(blogName, tid);
              } catch (e) {
                out.text_probe = {ok:false, error:String(e?.stack || e)};
              }

              try {
                const st = fs.statSync('images/social/carplay-ai-01.jpg');
                const ip = await client.createPost(blogName, {
                  state: 'queue',
                  tags: ['trendpilot-carplay-ai-01','wireless carplay','car accessories','TrendPilot'],
                  content: [
                    {type:'image', media: fs.createReadStream('images/social/carplay-ai-01.jpg'), alt_text:'TrendPilot Wireless CarPlay image'},
                    {type:'text', subtype:'heading1', text:'Will a Wireless CarPlay Adapter Work in Your Car?'},
                    {type:'text', text:'Check wired CarPlay support, the USB data port, firmware updates and return terms before buying.'},
                    {type:'link', url:destination, title:'Read the full Wireless CarPlay buying guide', description:'Five practical checks before comparing adapters.', site_name:'TrendPilot'}
                  ]
                });
                const iid = String(ip?.id || ip?.response?.id || '');
                out.npf_image_probe = {ok: !!iid, id: iid || null, bytes: st.size, response_keys: Object.keys(ip||{})};
              } catch (e) {
                let bytes = null;
                try { bytes = fs.statSync('images/social/carplay-ai-01.jpg').size; } catch {}
                out.npf_image_probe = {ok:false, bytes, error:String(e?.stack || e)};
              }

              try {
                const lp = await client.createLegacyPost(blogName, {
                  type: 'photo', state: 'queue',
                  tags: 'trendpilot-legacy-photo-probe,wireless carplay,TrendPilot',
                  source, link: destination,
                  caption: '<p>TrendPilot legacy photo probe</p>'
                });
                const lid = String(lp?.id || lp?.response?.id || '');
                out.legacy_photo_probe = {ok: !!lid, id: lid || null, response_keys: Object.keys(lp||{}), source};
                if (lid) await client.deletePost(blogName, lid);
              } catch (e) {
                out.legacy_photo_probe = {ok:false, source, error:String(e?.stack || e)};
              }

              const q2 = await client.blogQueue(blogName, {limit: 50, offset: 0});
              out.queue_after = (q2?.posts || []).map(p => ({id:String(p.id), summary:p.summary||'', tags:p.tags||[]}));
            } catch (e) {
              out.error = String(e?.stack || e);
            } finally { save(); }
          })();
          NODE

      - name: Commit diagnostic result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/tumblr-diagnostic-result.json
          git commit -m "chore: record Tumblr diagnostic result" || exit 0
          git push
