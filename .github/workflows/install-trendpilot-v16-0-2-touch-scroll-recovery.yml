name: Install TrendPilot V16.0.2 Touch & Scroll Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v16-0-2-touch-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-products-touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Record starting revision
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build V16.0.2 touch recovery
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          VERSION = "16.0.2"
          find_path = Path("find/index.html")
          css_path = Path("css/product-touch-recovery-v16-0-2.css")
          js_path = Path("js/product-touch-recovery-v16-0-2.js")

          if not find_path.exists():
              raise SystemExit("find/index.html is missing.")

          page = find_path.read_text(encoding="utf-8")

          # V14 and V15 both attach autocomplete listeners to the same product input.
          # Keep only the newer V15 engine on the Products page.
          page = re.sub(
              r'\s*<script[^>]+src="/js/smart-suggestions-v14-1-5\.js[^"]*"[^>]*></script>\s*',
              "\n",
              page,
              count=1,
              flags=re.I,
          )

          # Remove earlier V16.0.2 recovery includes so reruns are safe.
          page = re.sub(
              r'\s*<link[^>]+href="/css/product-touch-recovery-v16-0-2\.css[^"]*"[^>]*>\s*',
              "\n",
              page,
              flags=re.I,
          )
          page = re.sub(
              r'\s*<script[^>]+src="/js/product-touch-recovery-v16-0-2\.js[^"]*"[^>]*></script>\s*',
              "\n",
              page,
              flags=re.I,
          )

          css_tag = f'<link rel="stylesheet" href="/css/product-touch-recovery-v16-0-2.css?v={VERSION}">'
          if "</head>" not in page:
              raise SystemExit("Could not find </head> in find/index.html.")
          page = page.replace("</head>", css_tag + "\n</head>", 1)

          js_tag = f'<script defer src="/js/product-touch-recovery-v16-0-2.js?v={VERSION}"></script>'
          if "</body>" not in page:
              raise SystemExit("Could not find </body> in find/index.html.")
          page = page.replace("</body>", js_tag + "\n</body>", 1)

          css = r'''
          /* TrendPilot V16.0.2 — Products touch/scroll recovery.
             Scope deliberately limited to the Products finder page. */

          html:has(body[data-tp-page="finder"]),
          body[data-tp-page="finder"] {
            min-height: 100%;
            height: auto !important;
            max-height: none !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            overscroll-behavior-y: auto !important;
            touch-action: pan-y pinch-zoom !important;
            -webkit-overflow-scrolling: touch;
          }

          body[data-tp-page="finder"] main,
          body[data-tp-page="finder"] .tp-finder-hero,
          body[data-tp-page="finder"] .tp-finder-layout,
          body[data-tp-page="finder"] .tp-main-col,
          body[data-tp-page="finder"] .tp-filter-panel {
            touch-action: pan-y pinch-zoom;
          }

          body[data-tp-page="finder"] input,
          body[data-tp-page="finder"] select,
          body[data-tp-page="finder"] button,
          body[data-tp-page="finder"] a {
            pointer-events: auto;
          }

          body[data-tp-page="finder"] [data-tp-finder-input] {
            position: relative;
            z-index: 2;
            touch-action: manipulation;
            -webkit-user-select: text;
            user-select: text;
          }

          body[data-tp-page="finder"] .tp-v15-suggest {
            z-index: 16000 !important;
            pointer-events: auto !important;
          }

          body[data-tp-page="finder"] .tp-v15-list {
            max-height: min(360px, 44dvh) !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            overscroll-behavior: contain !important;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch !important;
          }

          body[data-tp-page="finder"] .tp-v15-row {
            touch-action: pan-y !important;
          }

          body[data-tp-page="finder"] .tp-amazon-suggest,
          body[data-tp-page="finder"] .tp-smart-suggestions {
            display: none !important;
            pointer-events: none !important;
          }

          html.tp-v15-search-open,
          html.tp-v15-search-open body[data-tp-page="finder"] {
            overflow-y: auto !important;
            height: auto !important;
            touch-action: pan-y pinch-zoom !important;
          }

          @media (max-width: 680px) {
            body[data-tp-page="finder"] .tp-v15-suggest {
              left: 0 !important;
              right: 0 !important;
              width: auto !important;
              max-width: none !important;
            }

            body[data-tp-page="finder"] .tp-v15-list {
              max-height: min(300px, 38dvh) !important;
            }
          }
          '''

          js = r'''
          (() => {
            "use strict";

            const d = document;
            const root = d.documentElement;
            const body = d.body;

            if (!body || body.dataset.tpPage !== "finder") return;

            const unlock = () => {
              for (const node of [root, body]) {
                node.style.removeProperty("overflow");
                node.style.removeProperty("overflow-y");
                node.style.removeProperty("height");
                node.style.removeProperty("max-height");
                node.style.removeProperty("position");
                node.style.removeProperty("top");
                node.style.removeProperty("width");
                node.style.removeProperty("touch-action");
              }

              const staleClasses = [
                "modal-open",
                "no-scroll",
                "scroll-lock",
                "menu-open",
                "tp-no-scroll",
                "tp-scroll-lock",
                "tp-modal-open"
              ];
              staleClasses.forEach(name => {
                root.classList.remove(name);
                body.classList.remove(name);
              });
            };

            const removeLegacyPanels = () => {
              d.querySelectorAll(".tp-amazon-suggest,.tp-smart-suggestions").forEach(node => {
                node.hidden = true;
                node.remove();
              });
            };

            const input = d.querySelector("[data-tp-finder-input]");

            const closeSuggestionPanel = () => {
              const panel = d.querySelector(".tp-v15-suggest");
              if (panel) panel.hidden = true;
              root.classList.remove("tp-v15-search-open");
              unlock();
            };

            unlock();
            removeLegacyPanels();

            if (input) {
              input.removeAttribute("readonly");
              input.removeAttribute("disabled");

              input.addEventListener("search", () => {
                if (!input.value) closeSuggestionPanel();
              }, { passive: true });

              input.addEventListener("keydown", event => {
                if (event.key === "Escape") closeSuggestionPanel();
              });
            }

            d.addEventListener("touchend", unlock, { passive: true });
            d.addEventListener("pointercancel", unlock, { passive: true });

            window.addEventListener("pageshow", () => {
              unlock();
              removeLegacyPanels();
            }, { passive: true });

            const observer = new MutationObserver(records => {
              let legacyInserted = false;
              for (const record of records) {
                for (const node of record.addedNodes) {
                  if (!(node instanceof Element)) continue;
                  if (
                    node.matches?.(".tp-amazon-suggest,.tp-smart-suggestions") ||
                    node.querySelector?.(".tp-amazon-suggest,.tp-smart-suggestions")
                  ) {
                    legacyInserted = true;
                  }
                }
              }
              if (legacyInserted) removeLegacyPanels();
            });
            observer.observe(body, { childList: true, subtree: true });

            const releaseHiddenFixedLayers = () => {
              d.querySelectorAll(
                ".tp-v15-suggest[hidden],.tpv16-suggest[hidden],.tpv16-modal[hidden],.tp-nav-backdrop"
              ).forEach(node => {
                if (node.hidden || node.getAttribute("aria-hidden") === "true") {
                  node.style.pointerEvents = "none";
                }
              });
            };
            releaseHiddenFixedLayers();

            console.info("TrendPilot V16.0.2 touch recovery active");
          })();
          '''

          css_path.write_text(
              "\n".join(line.rstrip() for line in css.strip().splitlines()) + "\n",
              encoding="utf-8",
          )
          js_path.write_text(
              "\n".join(line.rstrip() for line in js.strip().splitlines()) + "\n",
              encoding="utf-8",
          )
          find_path.write_text(
              "\n".join(line.rstrip() for line in page.splitlines()) + "\n",
              encoding="utf-8",
          )

          print("V16.0.2 recovery files installed.")
          PY

      - name: Validate V16.0.2 recovery
        shell: bash
        run: |
          set -euo pipefail

          node --check js/product-touch-recovery-v16-0-2.js
          git diff --check

          python - <<'PY'
          from pathlib import Path

          page = Path("find/index.html").read_text(encoding="utf-8")
          css = Path("css/product-touch-recovery-v16-0-2.css").read_text(encoding="utf-8")
          js = Path("js/product-touch-recovery-v16-0-2.js").read_text(encoding="utf-8")

          def require(ok, message):
              if not ok:
                  raise SystemExit("Validation failed: " + message)

          require(
              "/css/product-touch-recovery-v16-0-2.css?v=16.0.2" in page,
              "recovery CSS is not linked",
          )
          require(
              "/js/product-touch-recovery-v16-0-2.js?v=16.0.2" in page,
              "recovery JS is not linked",
          )
          require(
              "smart-suggestions-v14-1-5.js" not in page,
              "legacy V14 suggestion engine is still active on Products",
          )
          require(
              "product-discovery-v15.js" in page,
              "V15 product discovery engine was accidentally removed",
          )
          require(
              "overflow-y: auto !important" in css,
              "document scroll recovery CSS is missing",
          )
          require(
              "removeLegacyPanels" in js and "MutationObserver" in js,
              "legacy-overlay protection is missing",
          )

          print("Validation passed.")
          print("- Products page remains vertically scrollable.")
          print("- Search input remains editable.")
          print("- V14/V15 autocomplete conflict removed.")
          print("- V15 suggestions remain available.")
          print("- Hidden stale overlays are neutralized.")
          PY

      - name: Publish V16.0.2 safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            "find/index.html"
            "css/product-touch-recovery-v16-0-2.css"
            "js/product-touch-recovery-v16-0-2.js"
          )

          git add -- "${files[@]}"
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V16.0.2 recovery is already present."
            exit 0
          fi

          git fetch origin main
          current_remote="$(git rev-parse origin/main)"
          starting="${{ steps.base.outputs.sha }}"

          if [[ "$current_remote" != "$starting" ]]; then
            echo "main changed while this workflow was running."
            echo "Nothing was pushed. Run V16.0.2 again from the latest main."
            exit 1
          fi

          git commit -m "fix: recover product page touch and scrolling"
          git push origin HEAD:main

          echo "TrendPilot V16.0.2 Touch & Scroll Recovery published successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Changes:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Removed the older V14 autocomplete engine from Products only." >> "$GITHUB_STEP_SUMMARY"
          echo "- Kept V15 product discovery and seller/CPC logic untouched." >> "$GITHUB_STEP_SUMMARY"
          echo "- Restored normal mobile page scrolling and input editing." >> "$GITHUB_STEP_SUMMARY"
          echo "- Neutralized stale invisible overlays and scroll locks." >> "$GITHUB_STEP_SUMMARY"
