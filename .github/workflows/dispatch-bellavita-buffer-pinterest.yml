name: Dispatch BellaVita Buffer Pinterest Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-bellavita-buffer-pinterest.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch BellaVita publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run bellavita-buffer-pinterest-publish.yml \
            --repo "${{ github.repository }}" \
            --ref main
          echo "BellaVita publish workflow dispatched."
