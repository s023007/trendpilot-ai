name: Publish CarPlay AI Pinterest Pins V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-carplay-ai-pins-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish five separate Pinterest Pins
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const apiKey = process.env.BUFFER_API_KEY;
          if (!apiKey) throw new Error('BUFFER_API_KEY is missing');

          const outPath = 'data/runtime/carplay-ai-pins-buffer.json';
          fs.mkdirSync('data/runtime', { recursive: true });
          const result = {
            started_at: new Date().toISOString(),
            status: 'running',
            board: null,
            deleted_old_unsent: [],
            created: [],
            errors: []
          };
          const save = () => fs.writeFileSync(outPath, JSON.stringify(result, null, 2) + '\n');

          async function gql(query, variables = {}, label = 'Buffer') {
            const response = await fetch('https://api.buffer.com', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${apiKey}`,
              },
              body: JSON.stringify({ query, variables }),
            });
            const raw = await response.text();
            let body;
            try { body = JSON.parse(raw); }
            catch { throw new Error(`${label}: non-JSON HTTP ${response.status}: ${raw.slice(0, 600)}`); }
            if (!response.ok || body.errors?.length) {
              throw new Error(`${label}: HTTP ${response.status} ${JSON.stringify(body)}`);
            }
            return body.data;
          }

          async function deletePost(id) {
            const data = await gql(
              `mutation Delete($input: DeletePostInput!) {
                deletePost(input: $input) {
                  __typename
                  ... on DeletePostSuccess { id }
                  ... on VoidMutationError { message }
                }
              }`,
              { input: { id } },
              `delete ${id}`,
            );
            const p = data?.deletePost;
            if (!p || p.__typename !== 'DeletePostSuccess') throw new Error(`Delete failed ${id}: ${p?.message || p?.__typename}`);
          }

          (async () => {
            const account = await gql('query { account { organizations { id name } } }', {}, 'account');
            const org = account?.account?.organizations?.[0];
            if (!org) throw new Error('No Buffer organization found');

            const channelsData = await gql(
              `query Channels($org: OrganizationId!) {
                channels(input: { organizationId: $org }) { id name displayName service isQueuePaused }
              }`,
              { org: org.id },
              'channels',
            );
            const pinterest = (channelsData?.channels || []).find(c => c.service === 'pinterest');
            if (!pinterest) throw new Error('Pinterest is not connected in Buffer');
            if (pinterest.isQueuePaused) throw new Error('Pinterest queue is paused in Buffer');

            const boardData = await gql(
              `query PinterestBoard($id: ChannelId!) {
                channel(input: { id: $id }) {
                  metadata {
                    ... on PinterestMetadata { boards { id name serviceId url } }
                  }
                }
              }`,
              { id: pinterest.id },
              'boards',
            );
            const boards = boardData?.channel?.metadata?.boards || [];
            const norm = s => String(s || '').trim().toLowerCase();
            const board = boards.find(b => norm(b.name) === 'car accessories')
              || boards.find(b => /^tech\s*&\s*gadget/i.test(String(b.name || '').trim()));
            if (!board) throw new Error(`Car Accessories board not found. Boards: ${boards.map(b=>b.name).join(' | ')}`);
            result.board = { name: board.name, serviceId: board.serviceId };

            // Clean only unpublished Pinterest items so the queue contains the new campaign only.
            const pendingData = await gql(
              `query Pending($org: OrganizationId!, $channel: ChannelId!) {
                posts(first: 50, input: {
                  organizationId: $org,
                  filter: { status: [draft, scheduled], channelIds: [$channel] }
                }) {
                  edges { node { id text status dueAt channelService } }
                }
              }`,
              { org: org.id, channel: pinterest.id },
              'pending Pinterest',
            );
            const pending = (pendingData?.posts?.edges || []).map(e => e.node);
            for (const post of pending) {
              await deletePost(post.id);
              result.deleted_old_unsent.push({ id: post.id, status: post.status, dueAt: post.dueAt || null });
            }

            const base = 'https://trendpilotchoice.com/products/wireless-carplay-adapters/';
            const pins = [
              {
                id: 'carplay-ai-01',
                title: 'Will a Wireless CarPlay Adapter Work in Your Car?',
                text: 'Wireless CarPlay adapter compatibility comes first. Check whether your car already supports wired Apple CarPlay, whether the USB port carries data, and what the adapter maker says about your vehicle before buying. Full checklist on TrendPilot. AI-generated illustrative image.',
                alt: 'AI-generated illustration of a wireless CarPlay adapter beside a vehicle infotainment screen',
                image: 'https://media.canva.com/v2/document-image/hash:289530324/height:547/id:DAHSuhmdSi4/type:B/width:365?brand=BAGXuDAhsfg&csig=AAAAAAAAAAAAAAAAAAAAAOqvIQx-9fwB14B11dm--Mr8HCdrR95BOkQfhhcuVlSi&disableexport=T&exp=1787138512&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FmdSi4%2FDAHSuhmdSi4%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260818%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260818T222205Z%26X-Amz-Expires%3D46787%26X-Amz-Signature%3D9f78ffc4bdb263e538f7a0a789f73f06877ec346b38ddfb39f58ca7bd747caf4%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252019%2520Aug%25202026%252011%253A21%253A52%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAABIQFEpBIVXw033xYqlX261oGJjjeAElAVdWcpp2I3eq&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1'
              },
              {
                id: 'carplay-ai-02',
                title: '5 Things to Check Before Buying a Wireless CarPlay Adapter',
                text: 'Before buying a wireless CarPlay adapter, check wired CarPlay support, USB data, startup and reconnection behavior, firmware update method, and return terms. TrendPilot explains why each check matters. AI-generated illustrative image.',
                alt: 'AI-generated wireless CarPlay adapter buying checklist visual in a modern car interior',
                image: 'https://media.canva.com/v2/document-image/hash:-1955337347/height:547/id:DAHSugyLl5o/type:B/width:365?brand=BAGXuDAhsfg&csig=AAAAAAAAAAAAAAAAAAAAAO5q_TgRpSpC12qjDR8lcW_8U6aDlsO7pILglJYPs-ak&disableexport=T&exp=1787138548&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FyLl5o%2FDAHSugyLl5o%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260818%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260818T190032Z%26X-Amz-Expires%3D58916%26X-Amz-Signature%3D49875ec527bfce86eae34335f21b5c26a6adf5e06af52c143ddb32121690529d%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252019%2520Aug%25202026%252011%253A22%253A28%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAN7Q-lX3z5bM7WaaDIKdgRCdx8dNZk-FCYM8MtT8wH5j&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1'
              },
              {
                id: 'carplay-ai-03',
                title: 'Wired vs Wireless CarPlay: What Actually Changes?',
                text: 'Wired and wireless CarPlay can feel different in daily use. Compare cable convenience, startup and reconnection behavior, charging needs, and compatibility before deciding if an adapter makes sense for your car. AI-generated illustrative image.',
                alt: 'AI-generated visual comparing wired and wireless CarPlay use in a vehicle',
                image: 'https://media.canva.com/v2/document-image/hash:1142303456/height:547/id:DAHSumFcOpY/type:B/width:365?brand=BAGXuDAhsfg&csig=AAAAAAAAAAAAAAAAAAAAABwrcDJ2xbtNmv9zCV9dyJ3l5bboneAmpavCQKrfINOB&disableexport=T&exp=1787138570&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FFcOpY%2FDAHSumFcOpY%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260818%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260818T122205Z%26X-Amz-Expires%3D82845%26X-Amz-Signature%3Df2611f686c11ad5545be3d055132bfd10d72a1c5455124c361b67bffa868e99b%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252019%2520Aug%25202026%252011%253A22%253A50%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAANL_L8J7gfUjiC5lykR1rtsY91xMCiDNST1W8Vpdn8q7&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1'
              },
              {
                id: 'carplay-ai-04',
                title: 'Wireless CarPlay Not Connecting? Check These First',
                text: 'If a wireless CarPlay adapter does not connect reliably, check the wired CarPlay baseline, the USB data port, phone Bluetooth and Wi-Fi, adapter firmware, and vehicle or head-unit compatibility. AI-generated illustrative image.',
                alt: 'AI-generated wireless CarPlay troubleshooting visual with an adapter and infotainment display',
                image: 'https://media.canva.com/v2/document-image/hash:253096609/height:547/id:DAHSuhG_vM4/type:B/width:365?brand=BAGXuDAhsfg&csig=AAAAAAAAAAAAAAAAAAAAAFHO10vfyRl2Zsnhxlkj0YddSzdxGJQomb-qmHRJYiAQ&disableexport=T&exp=1787138596&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FG_vM4%2FDAHSuhG_vM4%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260819%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260819T075742Z%26X-Amz-Expires%3D12334%26X-Amz-Signature%3Dae3a27be3a429301be0d16729363b31cc1fdf264856bfa35e9f2591c49316bb3%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252019%2520Aug%25202026%252011%253A23%253A16%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAAisGNQbmjLWts9K7JLLSMu7Ja6uy8RPtEk5S49LbHKm&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1'
              },
              {
                id: 'carplay-ai-05',
                title: 'Is a Wireless CarPlay Adapter Worth It?',
                text: 'A wireless CarPlay adapter can reduce the cable routine, but value depends on compatibility, reconnection behavior, firmware support, and return terms. Use TrendPilot’s checklist before comparing prices. AI-generated illustrative image.',
                alt: 'AI-generated illustration of a wireless CarPlay adapter in a modern car interior',
                image: 'https://media.canva.com/v2/document-image/hash:-1628390496/height:547/id:DAHSuqDO7VM/type:B/width:365?brand=BAGXuDAhsfg&csig=AAAAAAAAAAAAAAAAAAAAAHdZj-2N8cHvfQclwnIG3AeZQQHqMxMjWXjdOfj9LM4b&disableexport=T&exp=1787138616&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FDO7VM%2FDAHSuqDO7VM%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260819%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260819T031016Z%26X-Amz-Expires%3D29600%26X-Amz-Signature%3D8d312ab73ff27f894d7531df7826ec45fd8cee483db831622f108e7e7eaeb2f9%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252019%2520Aug%25202026%252011%253A23%253A36%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAMSkMONcTDcX-R79ewwGmE38PjJpRyZx8BQPfykNvv0K&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1'
              }
            ];

            for (let i = 0; i < pins.length; i++) {
              const pin = pins[i];
              const destination = `${base}?utm_source=pinterest&utm_medium=organic&utm_campaign=wireless-carplay-ai-v1&utm_content=${pin.id}`;
              try {
                const data = await gql(
                  `mutation CreatePost($input: CreatePostInput!) {
                    createPost(input: $input) {
                      __typename
                      ... on PostActionSuccess { post { id text dueAt status channelId channelService } }
                      ... on MutationError { message }
                      ... on InvalidInputError { message }
                      ... on UnauthorizedError { message }
                      ... on UnexpectedError { message }
                      ... on RestProxyError { message }
                      ... on LimitReachedError { message }
                    }
                  }`,
                  { input: {
                    text: pin.text,
                    channelId: pinterest.id,
                    schedulingType: 'automatic',
                    mode: 'addToQueue',
                    saveToDraft: false,
                    needsApproval: false,
                    aiAssisted: true,
                    source: 'trendpilot-carplay-ai-v1',
                    assets: [{ image: { url: pin.image, metadata: { altText: pin.alt } } }],
                    metadata: { pinterest: { boardServiceId: board.serviceId, title: pin.title, url: destination } },
                  } },
                  `create ${pin.id}`,
                );
                const payload = data?.createPost;
                if (!payload || payload.__typename !== 'PostActionSuccess' || !payload.post?.id) {
                  throw new Error(`${payload?.__typename || 'unknown'}: ${payload?.message || 'no post returned'}`);
                }
                result.created.push({
                  pin_id: pin.id,
                  title: pin.title,
                  buffer_post_id: payload.post.id,
                  status: payload.post.status,
                  dueAt: payload.post.dueAt || null,
                  destination,
                });
              } catch (error) {
                result.errors.push({ pin_id: pin.id, message: error?.message || String(error) });
              }
            }

            result.status = result.errors.length === 0 && result.created.length === pins.length ? 'ok' : 'partial';
            result.finished_at = new Date().toISOString();
            save();
            console.log('CARPLAY_AI_PINS_RESULT', JSON.stringify(result));
            if (result.status !== 'ok') process.exitCode = 1;
          })().catch((error) => {
            result.status = 'error';
            result.errors.push({ pin_id: null, message: error?.message || String(error) });
            result.finished_at = new Date().toISOString();
            save();
            console.error('CARPLAY_AI_PINS_FAILED', error?.stack || error);
            process.exitCode = 1;
          });
          NODE

      - name: Persist publication result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/carplay-ai-pins-buffer.json
          if git diff --cached --quiet; then
            echo "No result file change"
            exit 0
          fi
          git commit -m "Record separate CarPlay AI Pinterest publication"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### Wireless CarPlay AI Pinterest campaign" >> "$GITHUB_STEP_SUMMARY"
          echo "Five Pins are created as separate Buffer items, each with its own title, description, image, destination UTM and Car Accessories board assignment." >> "$GITHUB_STEP_SUMMARY"
