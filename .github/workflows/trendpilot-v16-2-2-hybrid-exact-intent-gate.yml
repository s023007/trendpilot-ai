name: TrendPilot V16.2.2 Hybrid Exact Intent Gate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v16-2-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hybrid-exact-intent-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Apply V16.1.2 backend and V16.2.2 finder gate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          api = Path("netlify/functions/products-v16-hybrid.mjs")
          js = Path("js/site-v13-5.js")
          finder = Path("find/index.html")
          docs = Path("V16-UNIVERSAL-PRODUCT-INDEX.md")

          for p in (api, js, finder):
              if not p.exists():
                  raise SystemExit(f"Missing required file: {p}")

          # ============================================================
          # BACKEND: V16.1.2
          # ============================================================
          a = api.read_text(encoding="utf-8")

          if 'const VERSION = "16.1.1";' in a:
              a = a.replace('const VERSION = "16.1.1";', 'const VERSION = "16.1.2";', 1)
          elif 'const VERSION = "16.1.2";' not in a:
              raise SystemExit("Expected V16.1.1 hybrid API was not found.")

          # Generic relation detector:
          # "projector for smart mobile phone", "speaker for phone",
          # "case compatible with phone", etc. should not become the core product.
          if "function relationBeforeQueryV16_1_2" not in a:
              anchor = "function intentRank(product, query, tokens) {"
              pos = a.find(anchor)
              if pos < 0:
                  raise SystemExit("intentRank anchor not found.")

              helper = r'''
          function relationBeforeQueryV16_1_2(titleWords, tokens) {
            if (!tokens.length || !titleWords.length) return false;

            const relationSingles = new Set([
              "for","fits","fit","compatible","replacement","repair",
              "adapter","accessory","accessories"
            ]);

            for (let i = 0; i < titleWords.length; i++) {
              const word = titleWords[i];
              const isQueryHit = tokens.some(token =>
                word === token || (token.length >= 4 && word.includes(token))
              );
              if (!isQueryHit) continue;

              const from = Math.max(0, i - 4);
              const before = titleWords.slice(from, i);

              if (before.some(w => relationSingles.has(w))) return true;

              const joined = before.join(" ");
              if (
                joined.includes("compatible with") ||
                joined.includes("replacement for") ||
                joined.includes("used with") ||
                joined.includes("works with") ||
                joined.includes("designed for")
              ) {
                return true;
              }
            }

            return false;
          }

          '''
              a = a[:pos] + helper + a[pos:]

          # Make multi-word proximity stricter:
          # dog paw print food -> no longer a high-tier match for "dog food".
          a = a.replace(
              "    !multiWordQuery || phrase.minSpan <= Math.max(tokens.length + 2, 4);",
              "    !multiWordQuery || phrase.minSpan <= Math.max(tokens.length + 1, 3);",
              1
          )
          a = a.replace(
              "    multiWordQuery && phrase.minSpan > Math.max(tokens.length + 4, 6);",
              "    multiWordQuery && phrase.minSpan > Math.max(tokens.length + 3, 5);",
              1
          )

          # Add generic derived-product signals immediately after misleadingExactPhrase.
          if "const accessoryPhraseTailV16_1_2" not in a:
              anchor = r'''  const misleadingExactPhrase =
            multiWordQuery &&
            phraseInTitle &&
            phrase.misleadingTail;
          '''
              if anchor not in a:
                  raise SystemExit("misleadingExactPhrase anchor not found.")

              repl = anchor + r'''
            const accessoryPhraseTailV16_1_2 =
              multiWordQuery &&
              phraseInTitle &&
              !queryLooksAccessory &&
              accessoryWords.has(phrase.nextWord);

            const relationBeforeQueryHitV16_1_2 =
              !queryLooksAccessory &&
              relationBeforeQueryV16_1_2(titleWords, tokens);
          '''
              a = a.replace(anchor, repl, 1)

          # Cap intent tier after the normal classifier.
          if "TP_INTENT_CAP_V16_1_2" not in a:
              anchor = r'''  let score =
            intentTier * 1000 +'''
              if anchor not in a:
                  raise SystemExit("intent tier -> score anchor not found.")

              cap = r'''  // TP_INTENT_CAP_V16_1_2
            if (accessoryPhraseTailV16_1_2) {
              intentTier = Math.min(intentTier, 2);
            }
            if (relationBeforeQueryHitV16_1_2) {
              intentTier = Math.min(intentTier, 1);
            }

            let score =
              intentTier * 1000 +'''
              a = a.replace(anchor, cap, 1)

          # Add penalties for those generic derived-product patterns.
          if "relationBeforeQueryHitV16_1_2) score -= 700" not in a:
              anchor = "  if (misleadingExactPhrase) score -= 650;"
              if anchor not in a:
                  raise SystemExit("score penalty anchor not found.")

              a = a.replace(
                  anchor,
                  anchor + "\n"
                  "  if (accessoryPhraseTailV16_1_2) score -= 520;\n"
                  "  if (relationBeforeQueryHitV16_1_2) score -= 700;",
                  1
              )

          # Fresh rerank must overwrite stale base tiers/scores.
          mathmax_pattern = re.compile(
              r'''matchScore:\s*Math\.max\(\s*
                  Number\(product\?\.matchScore\s*\|\|\s*0\),\s*
                  rank\.score\s*
                \),\s*
                intentTier:\s*Math\.max\(\s*
                  Number\(product\?\.intentTier\s*\|\|\s*0\),\s*
                  rank\.intentTier\s*
                \)''',
              re.X | re.S
          )
          if mathmax_pattern.search(a):
              a = mathmax_pattern.sub(
                  "matchScore: rank.score,\n      intentTier: rank.intentTier",
                  a,
                  count=1
              )
          elif "matchScore: rank.score" not in a or "intentTier: rank.intentTier" not in a:
              raise SystemExit("Hybrid fresh-rerank block not found.")

          a = a.replace(
              '`${lower(query)}|${lower(seller)}|${lower(network)}|16.1.1`',
              '`${lower(query)}|${lower(seller)}|${lower(network)}|16.1.2`',
              1
          )

          a = a.replace(
              'console.error("TrendPilot V16.1.1 hybrid search failed", error);',
              'console.error("TrendPilot V16.1.2 hybrid search failed", error);',
              1
          )

          api.write_text(a, encoding="utf-8")

          # ============================================================
          # FRONTEND: V16.2.2
          # ============================================================
          s = js.read_text(encoding="utf-8")

          # Hybrid rows need to retain their backend ranking in the UI.
          score_start = s.find("  function score(p, plan) {")
          score_end = s.find("  function mergeProducts(rows) {", score_start)
          if score_start < 0 or score_end < 0:
              raise SystemExit("score function boundaries not found.")

          score_part = s[score_start:score_end]

          if "TP_HYBRID_SCORE_V16_2_2" not in score_part:
              line = (
                  "    let n = p.quality / 10 + (p.image ? 6 : 0) + "
                  "(p.price ? 4 : 0) + Math.min(8,p.rating) + "
                  "Math.min(8,Math.log10(p.reviews + 1) * 2);"
              )
              if line not in score_part:
                  raise SystemExit("score base line not found.")

              add = line + r'''
              // TP_HYBRID_SCORE_V16_2_2
              if(p._tpHybridV16_2_1){
                const tier=Math.max(0,Number(p.intentTier||0));
                const hybridScore=Number(p.hybridMatchScore||0);
                n += tier*1000 + Math.max(-900,Math.min(900,hybridScore/8));
              }'''
              score_part = score_part.replace(line, add, 1)
              s = s[:score_start] + score_part + s[score_end:]

          # Hybrid exactness is authoritative.
          strict_start = s.find("  function strictProductMatch(p, plan) {")
          strict_end = s.find("  function relatedMatch(p, plan) {", strict_start)
          if strict_start < 0 or strict_end < 0:
              raise SystemExit("strictProductMatch boundaries not found.")

          strict_part = s[strict_start:strict_end]

          if "TP_HYBRID_EXACT_GATE_V16_2_2" not in strict_part:
              anchor = "  function strictProductMatch(p, plan) {\n"
              gate = anchor + r'''    // TP_HYBRID_EXACT_GATE_V16_2_2
            // The V16 backend has already classified intent. Do not let the
            // older lexical matcher promote accessories back into Exact.
            if(p._tpHybridV16_2_1){
              return Number(p.intentTier||0) >= 4;
            }
          '''
              strict_part = strict_part.replace(anchor, gate, 1)
              s = s[:strict_start] + strict_part + s[strict_end:]

          # When hybrid rows exist, Exact must be built from hybrid core rows only.
          merge_start = s.find("  function mergeProducts(rows) {")
          merge_end = s.find("  function currency(", merge_start)
          if merge_start < 0 or merge_end < 0:
              raise SystemExit("mergeProducts boundaries not found.")

          merge_part = s[merge_start:merge_end]

          if "TP_HYBRID_EXACT_POOL_V16_2_2" not in merge_part:
              old = r'''    state.products = [...map.values()].filter(tpCjPublicAllowed);
              const rankedExact = state.products.filter(p => strictProductMatch(p,state.plan)).sort((a,b)=>score(b,state.plan)-score(a,state.plan));
              state.exact = typeof tpDiversifySellersV15_1 === "function" ? tpDiversifySellersV15_1(rankedExact) : rankedExact;
              state.alternatives = state.products.filter(p => relatedMatch(p,state.plan)).sort((a,b)=>score(b,state.plan)-score(a,state.plan));
          '''

              new = r'''    state.products = [...map.values()].filter(tpCjPublicAllowed);

              // TP_HYBRID_EXACT_POOL_V16_2_2
              const hybridRowsV16_2_2=state.products.filter(p=>p._tpHybridV16_2_1);
              const exactSourceV16_2_2=hybridRowsV16_2_2.length
                ? hybridRowsV16_2_2
                : state.products;

              const rankedExact = exactSourceV16_2_2
                .filter(p => strictProductMatch(p,state.plan))
                .sort((a,b)=>score(b,state.plan)-score(a,state.plan));

              state.exact = typeof tpDiversifySellersV15_1 === "function"
                ? tpDiversifySellersV15_1(rankedExact)
                : rankedExact;

              const exactKeysV16_2_2=new Set(
                rankedExact.map(p=>p.clusterKey||p.id)
              );

              state.alternatives = state.products
                .filter(p=>{
                  const key=p.clusterKey||p.id;
                  if(exactKeysV16_2_2.has(key))return false;
                  if(p._tpHybridV16_2_1)return Number(p.intentTier||0)<4;
                  return relatedMatch(p,state.plan);
                })
                .sort((a,b)=>score(b,state.plan)-score(a,state.plan));
          '''

              if old not in merge_part:
                  raise SystemExit("Current mergeProducts exact block not found.")

              merge_part = merge_part.replace(old, new, 1)
              s = s[:merge_start] + merge_part + s[merge_end:]

          # Do not re-fill Exact with legacy shard matches after Hybrid already responded.
          s = s.replace(
              "    if(state.exact.length<24){\n"
              "      await Promise.race([",
              "    if(state.exact.length<24 && !state.hybridMeta){\n"
              "      await Promise.race([",
              1
          )

          # Do not load legacy pages when Show More reaches the end of verified hybrid Exact.
          old_show = (
              '    if(state.activeTab!=="exact"||candidatePagesExhausted()||state.loading)return;'
          )
          if old_show in s:
              s = s.replace(
                  old_show,
                  '    if(state.activeTab!=="exact"||state.hybridMeta||candidatePagesExhausted()||state.loading)return;',
                  1
              )

          js.write_text(s, encoding="utf-8")

          # Bust finder browser cache.
          h = finder.read_text(encoding="utf-8")
          h2, n = re.subn(
              r'/js/site-v13-5\.js\?v=[^"\']+',
              '/js/site-v13-5.js?v=16.2.2',
              h,
              count=1
          )
          if n != 1:
              raise SystemExit(f"Finder script tag not found uniquely: matches={n}")
          finder.write_text(h2, encoding="utf-8")

          # Documentation.
          d = docs.read_text(encoding="utf-8") if docs.exists() else "# TrendPilot V16 Universal Product Index\n"
          if "## V16.2.2 — hybrid exact intent gate" not in d:
              d += r'''

          ## V16.2.2 — hybrid exact intent gate

          - Exact results now trust V16 intent tiers instead of the older V15
            lexical matcher.
          - Hybrid rows need intent tier 4 or 5 to appear under Exact.
          - Lower-tier machines, accessories, parts and incidental mentions move
            to Related alternatives.
          - Adds generic "for / compatible with / replacement for" demotion.
          - Tightens multi-word token proximity so separated terms do not become
            high-tier matches.
          - Fixes stale `Math.max()` intent preservation in the hybrid backend.
          - No full product-index rebuild is required.
          '''
          docs.write_text(d, encoding="utf-8")

          print("V16.2.2 hybrid exact intent gate applied.")
          PY

      - name: Validate V16.2.2
        shell: bash
        run: |
          set -euo pipefail

          node --check netlify/functions/products-v16-hybrid.mjs
          node --check js/site-v13-5.js
          git diff --check

          grep -q 'const VERSION = "16.1.2"' netlify/functions/products-v16-hybrid.mjs
          grep -q 'relationBeforeQueryV16_1_2' netlify/functions/products-v16-hybrid.mjs
          grep -q 'accessoryPhraseTailV16_1_2' netlify/functions/products-v16-hybrid.mjs
          grep -q 'matchScore: rank.score' netlify/functions/products-v16-hybrid.mjs
          grep -q 'intentTier: rank.intentTier' netlify/functions/products-v16-hybrid.mjs
          grep -q '|16.1.2' netlify/functions/products-v16-hybrid.mjs

          grep -q 'TP_HYBRID_SCORE_V16_2_2' js/site-v13-5.js
          grep -q 'TP_HYBRID_EXACT_GATE_V16_2_2' js/site-v13-5.js
          grep -q 'TP_HYBRID_EXACT_POOL_V16_2_2' js/site-v13-5.js
          grep -q 'Number(p.intentTier||0) >= 4' js/site-v13-5.js
          grep -q '/js/site-v13-5.js?v=16.2.2' find/index.html

          echo "V16.2.2 validation passed."

      - name: Publish V16.2.2
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            netlify/functions/products-v16-hybrid.mjs \
            js/site-v13-5.js \
            find/index.html \
            V16-UNIVERSAL-PRODUCT-INDEX.md

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V16.2.2 is already installed."
            exit 0
          fi

          git commit -m "fix: gate finder exact results by V16 hybrid intent"
          git push origin HEAD:main

          {
            echo "## TrendPilot V16.2.2"
            echo "- exact tab now uses verified V16 intent tiers"
            echo "- generic accessories and 'for query' products move to Related"
            echo "- multi-word proximity is stricter"
            echo "- backend fresh rerank no longer preserves stale tiers"
            echo "- no product-index rebuild required"
          } >> "$GITHUB_STEP_SUMMARY"
