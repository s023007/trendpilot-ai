name: TrendPilot Lenovo Quarantine V15.5.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-lenovo-quarantine-v15-5-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quarantine-lenovo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Remove incorrect Lenovo rows from staged catalog
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("data/admitad-products-new-account-v15-3-2.json")
          if not path.exists():
              raise SystemExit("Missing staged Admitad catalog.")

          data = json.loads(path.read_text(encoding="utf-8"))
          products = data.get("products") or []

          lenovo_rows = [
              p for p in products
              if "lenovo" in str(p.get("seller") or "").lower()
          ]

          if len(lenovo_rows) != 40:
              raise SystemExit(
                  f"Safety stop: expected 40 Lenovo rows from diagnostics, found {len(lenovo_rows)}."
              )

          clean_products = [
              p for p in products
              if "lenovo" not in str(p.get("seller") or "").lower()
          ]

          data["products"] = clean_products
          data["product_count"] = len(clean_products)
          data["lenovo_quarantine"] = {
              "enabled": True,
              "campaign_id": 18201,
              "campaign_name": "Lenovo Many GEOs",
              "removed_rows": 40,
              "reason": "All inspected Lenovo feeds returned unrelated marketplace products",
              "diagnostic_version": "15.5"
          }

          path.write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8"
          )

          print(f"Removed Lenovo rows: {len(lenovo_rows)}")
          print(f"Remaining staged products: {len(clean_products)}")
          PY

      - name: Validate Lenovo quarantine
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          path = Path("data/admitad-products-new-account-v15-3-2.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          products = data.get("products") or []

          if any("lenovo" in str(p.get("seller") or "").lower() for p in products):
              raise SystemExit("Lenovo rows still present after quarantine.")

          meta = data.get("lenovo_quarantine") or {}
          if meta.get("enabled") is not True:
              raise SystemExit("Lenovo quarantine metadata missing.")
          if meta.get("removed_rows") != 40:
              raise SystemExit("Unexpected Lenovo removed-row count.")

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True
              ).splitlines()
          )

          allowed = {"data/admitad-products-new-account-v15-3-2.json"}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(
                  "Unexpected files changed: " + ", ".join(sorted(unexpected))
              )

          print("Lenovo quarantine validated.")
          print(f"Remaining products: {len(products)}")
          PY

          git diff --check

      - name: Confirm live UI untouched
        shell: bash
        run: |
          set -euo pipefail

          for file in             find/index.html             js/site-v13-5.js             js/product-discovery-v15.js             js/seller-whitelist-v14-1-5.js
          do
            if ! git diff --quiet -- "$file"; then
              echo "Safety stop: live UI file changed unexpectedly: $file"
              exit 1
            fi
          done

          echo "Live Products UI remains untouched."

      - name: Publish quarantine only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/admitad-products-new-account-v15-3-2.json
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Lenovo quarantine already current."
            exit 0
          fi

          git commit -m "fix: quarantine incorrect Lenovo feed rows"
          git push origin HEAD:main

          {
            echo "## Lenovo Quarantine V15.5.1"
            echo ""
            echo "- Removed 40 incorrect Lenovo-labelled product rows."
            echo "- Kept all other Admitad and CJ products untouched."
            echo "- Did not modify the live Products UI or search code."
          } >> "$GITHUB_STEP_SUMMARY"
