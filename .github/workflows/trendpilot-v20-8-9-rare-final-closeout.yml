name: TrendPilot V20.8.9 — Rare Finds Final Closeout

on:
  push:
    branches:
      - v20-8-9-rare-final-closeout
    paths:
      - '.github/workflows/trendpilot-v20-8-9-rare-final-closeout.yml'
      - 'scripts/finalize-v20-8-9-rare-closeout.py'
      - 'js/rare-finds-v20-8.js'
      - 'js/rare-find-detail-v20-8-7.js'
      - 'css/v20-8-9-rare-closeout.css'
      - 'rare-used/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rare-final-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Finalize Rare Finds data truth
        run: python scripts/finalize-v20-8-9-rare-closeout.py

      - name: JavaScript syntax QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/rare-finds-v20-8.js
          node --check js/rare-find-detail-v20-8-7.js

      - name: Rare semantic QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path

          rows=json.loads(Path('data/v20-8/rare-index.json').read_text())
          assert isinstance(rows,list) and len(rows)>=20, f'Rare list unexpectedly small: {len(rows)}'
          assert all(int(r.get('rareScore') or 0)>=60 for r in rows), 'Rare score below publication threshold'

          promo=re.compile(r'^\s*(?:\[(?:free\s+shipping|hot\s+sale|new\s+arrival|best\s+seller)\]|free\s+shipping|hot\s+sale|new\s+arrival|best\s+seller)',re.I)
          assert not any(promo.search(r.get('title','')) for r in rows), 'Marketing prefix leaked into Rare title'

          blocked={'temu','joom','filamentpro','filamentpro eu cps','filamentpro-eu-cps'}
          assert not any(str(r.get('seller','')).strip().lower() in blocked for r in rows), 'Blocked seller leaked into Rare Finds'

          # Ordinary accessory must not masquerade as the collectible itself.
          assert not any('mini doll outfit' in r.get('title','').lower() for r in rows), 'Mini Doll accessory still published as Rare'
          assert not any('acgam' in r.get('title','').lower() and 'desk' in r.get('title','').lower() for r in rows), 'Ordinary desk leaked into Rare'
          assert not any('robore' in r.get('title','').lower() and 'exercise bike' in r.get('title','').lower() for r in rows), 'Ordinary exercise bike leaked into Rare'
          assert not any('dust collector' in r.get('title','').lower() and 'collector' in (r.get('signals') or []) for r in rows), 'Dust collector false collector signal'

          cb=[r for r in rows if 'carbon brush' in r.get('title','').lower() and 'cb440' in r.get('title','').lower()]
          assert cb, 'CB440 evidence unexpectedly disappeared'
          assert all(r.get('type')=='power-tool-parts' and r.get('role')=='replacement_part' for r in cb), 'CB440 role/type regression'

          # Accessories can only survive Rare if genuinely scarce/discontinued.
          for r in rows:
              if r.get('role')=='accessory':
                  sig=set(r.get('signals') or [])
                  assert sig & {'used-scarce','discontinued'}, f'Ordinary accessory in Rare: {r.get("title")}'

          manifest=json.loads(Path('data/v20-8/manifest.json').read_text())
          assert manifest.get('version')=='20.8.9'
          assert manifest.get('rarePublished')==len(rows)
          print(f'PASS: {len(rows)} high-evidence Rare Finds')
          PY

      - name: UI and routing QA
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const V="20.8.9"' js/rare-finds-v20-8.js
          grep -q 'const V="20.8.9"' js/rare-find-detail-v20-8-7.js
          grep -q 'Seller-feed price' js/rare-finds-v20-8.js
          grep -q '✓ Exact price' js/rare-finds-v20-8.js
          grep -q 'tp80-rare-card .tp-price-confidence{display:none!important}' css/v20-8-9-rare-closeout.css
          grep -q 'noindex,follow' rare-used/view/index.html
          grep -q 'View details' js/rare-finds-v20-8.js
          grep -q 'Open exact product on' js/rare-find-detail-v20-8-7.js
          grep -q 'Check TikTok Shop US availability' js/rare-find-detail-v20-8-7.js
          if grep -q 'target="_blank"' js/rare-finds-v20-8.js; then
            echo 'Rare hub must never open seller directly'
            exit 1
          fi
          if grep -E 'new MutationObserver\([^)]*document|observe\(document' js/rare-finds-v20-8.js js/rare-find-detail-v20-8-7.js; then
            echo 'Whole-document observer is forbidden'
            exit 1
          fi

      - name: Safety QA
        shell: bash
        run: |
          set -euo pipefail
          if git status --short | grep -Ei '(canonical|identity|tpid|tpvid|tpoid|v19)'; then
            echo 'Unexpected identity/catalog mutation'
            git status --short
            exit 1
          fi
          echo 'Identity catalogs untouched; GEO import and seller policy unchanged.'

      - name: Commit finalized Rare data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/v20-8/rare-index.json data/v20-8/manifest.json data/v20-8/products/*.json || true
          if git diff --cached --quiet; then
            echo 'No generated data changes to commit.'
            exit 0
          fi
          git commit -m 'TrendPilot V20.8.9 finalize Rare Finds data truth'
          git push

      - name: Write closeout summary
        if: always()
        shell: bash
        run: |
          {
            echo '# TrendPilot V20.8.9 — Rare Finds Final Closeout'
            echo
            echo '- Promo prefixes removed from Rare display data.'
            echo '- Accessory vs main-product role truth enforced.'
            echo '- Rare Score requires real rarity evidence.'
            echo '- Exact price and seller-feed price are mutually exclusive UI states.'
            echo '- Rare cards remain TrendPilot-internal first.'
            echo '- TikTok Shop US uses explicit regional availability wording.'
            echo '- Dynamic detail pages remain noindex,follow.'
            echo '- V19 / TPID / TPVID / TPOID identity catalogs are untouched.'
          } >> "$GITHUB_STEP_SUMMARY"
