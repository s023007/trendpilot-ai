name: Google Ads GCC AliExpress Winner Scout — Read Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-ads-gcc-aliexpress-winner-scout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - name: Install Google Ads client
        run: pip install --disable-pip-version-check google-ads

      - name: Compare GCC product keyword economics without mutations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,time
          from collections import defaultdict
          from google.ads.googleads.client import GoogleAdsClient
          from google.api_core.exceptions import ResourceExhausted

          client = GoogleAdsClient.load_from_dict({
              'developer_token': os.environ['GOOGLE_ADS_DEVELOPER_TOKEN'],
              'client_id': os.environ['GOOGLE_ADS_CLIENT_ID'],
              'client_secret': os.environ['GOOGLE_ADS_CLIENT_SECRET'],
              'refresh_token': os.environ['GOOGLE_ADS_REFRESH_TOKEN'],
              'login_customer_id': os.environ['GOOGLE_ADS_LOGIN_CUSTOMER_ID'].replace('-', '').strip(),
              'use_proto_plus': True,
          })
          cid = os.environ['GOOGLE_ADS_CUSTOMER_ID'].replace('-', '').strip()
          ga = client.get_service('GoogleAdsService')
          kp = client.get_service('KeywordPlanIdeaService')

          wanted_countries = {'SA':'Saudi Arabia','AE':'United Arab Emirates','OM':'Oman','KW':'Kuwait','QA':'Qatar','BH':'Bahrain'}
          geo_rows = ga.search(customer_id=cid, query="""
            SELECT geo_target_constant.resource_name, geo_target_constant.id,
                   geo_target_constant.name, geo_target_constant.country_code,
                   geo_target_constant.target_type, geo_target_constant.status
            FROM geo_target_constant
            WHERE geo_target_constant.country_code IN ('SA','AE','OM','KW','QA','BH')
              AND geo_target_constant.target_type = 'Country'
              AND geo_target_constant.status = 'ENABLED'
          """)
          geos={r.geo_target_constant.country_code:r.geo_target_constant.resource_name for r in geo_rows}
          if set(geos) != set(wanted_countries):
              raise SystemExit('SAFETY STOP: GCC GEO resolution incomplete: '+repr(geos))

          lang_rows=ga.search(customer_id=cid,query="""
            SELECT language_constant.resource_name,language_constant.code,language_constant.targetable
            FROM language_constant
            WHERE language_constant.code IN ('ar','en')
          """)
          langs={r.language_constant.code:r.language_constant.resource_name for r in lang_rows if r.language_constant.targetable}
          if 'ar' not in langs or 'en' not in langs:
              raise SystemExit('SAFETY STOP: language resolution failed: '+repr(langs))

          families={
            'wireless_carplay':{
              'en':['wireless carplay adapter','carplay wireless adapter','wireless android auto adapter'],
              'ar':['محول كاربلاي لاسلكي','كاربلاي لاسلكي','محول اندرويد اوتو لاسلكي','اندرويد اوتو لاسلكي']},
            'tire_inflator':{
              'en':['portable tire inflator','cordless tire inflator','car tire air compressor'],
              'ar':['منفاخ اطارات سيارة','منفاخ كفرات','منفاخ هواء للسيارة','كمبروسر هواء للسيارة']},
            'jump_starter':{
              'en':['car jump starter','jump starter with air compressor','portable battery jump starter'],
              'ar':['اشتراك بطارية سيارة','بوستر بطارية سيارة','شاحن بطارية سيارة متنقل','جهاز تشغيل بطارية السيارة']},
            'car_vacuum':{
              'en':['cordless car vacuum','car vacuum cleaner','portable car vacuum'],
              'ar':['مكنسة سيارة لاسلكية','مكنسة سيارة','مكنسة محمولة للسيارة']},
            'dash_cam':{
              'en':['4k dash cam','car dash cam','dash camera for car'],
              'ar':['داش كام 4k','داش كام للسيارة','كاميرا سيارة أمامية','كاميرا مراقبة للسيارة']},
          }
          lookup={}
          for family,by_lang in families.items():
            for lang_code,words in by_lang.items():
              for w in words: lookup[(lang_code,w.lower())]=family

          totals=defaultdict(lambda:{'vol':0,'wcpc':0.0,'wcomp':0.0})
          print('=== GCC ALIEXPRESS WINNER SCOUT / GOOGLE ADS HISTORICAL METRICS ===')
          print('MODE|READ_ONLY|NO_CAMPAIGN_MUTATIONS|NO_BUDGET_CHANGES')

          for cc in wanted_countries:
            for lang_code in ('ar','en'):
              all_words=[]
              for family in families:
                all_words.extend(families[family][lang_code])
              req=client.get_type('GenerateKeywordHistoricalMetricsRequest')
              req.customer_id=cid
              req.keywords.extend(all_words)
              req.geo_target_constants.append(geos[cc])
              req.language=langs[lang_code]
              req.keyword_plan_network=client.enums.KeywordPlanNetworkEnum.GOOGLE_SEARCH
              for attempt in range(4):
                try:
                  resp=kp.generate_keyword_historical_metrics(request=req)
                  break
                except ResourceExhausted:
                  if attempt==3: raise
                  wait=6*(attempt+1)
                  print(f'RATE_LIMIT|geo={cc}|lang={lang_code}|retry_in={wait}s')
                  time.sleep(wait)
              for row in resp.results:
                text=row.text
                family=lookup.get((lang_code,text.lower()),'unknown')
                m=row.keyword_metrics
                vol=int(m.avg_monthly_searches or 0)
                low=float(m.low_top_of_page_bid_micros or 0)/1_000_000
                high=float(m.high_top_of_page_bid_micros or 0)/1_000_000
                comp_idx=int(m.competition_index or 0)
                mid=(low+high)/2 if (low or high) else 0.0
                print(f'KW|geo={cc}|lang={lang_code}|family={family}|text={text}|vol={vol}|comp={m.competition.name}|comp_idx={comp_idx}|low_cpc={low:.2f}|high_cpc={high:.2f}|mid_cpc={mid:.2f}')
                if family!='unknown':
                  k=(cc,family)
                  totals[k]['vol']+=vol
                  totals[k]['wcpc']+=mid*max(vol,1)
                  totals[k]['wcomp']+=comp_idx*max(vol,1)
              time.sleep(6)

          print('=== FAMILY SUMMARY ===')
          ranked=[]
          for (cc,family),v in totals.items():
            denom=max(v['vol'],1)
            cpc=v['wcpc']/denom
            comp=v['wcomp']/denom
            score=v['vol']/((1+comp/40.0)*(0.20+cpc)) if v['vol'] else 0
            ranked.append((score,cc,family,v['vol'],cpc,comp))
          for score,cc,family,vol,cpc,comp in sorted(ranked,reverse=True):
            print(f'FAMILY|geo={cc}|family={family}|combined_vol={vol}|weighted_mid_cpc={cpc:.2f}|weighted_comp_idx={comp:.1f}|score={score:.1f}')
          print('=== TOP 10 ===')
          for i,(score,cc,family,vol,cpc,comp) in enumerate(sorted(ranked,reverse=True)[:10],1):
            print(f'RANK|{i}|geo={cc}|family={family}|vol={vol}|mid_cpc={cpc:.2f}|comp_idx={comp:.1f}|score={score:.1f}')
          print('=== END / READ ONLY ===')
          PY
