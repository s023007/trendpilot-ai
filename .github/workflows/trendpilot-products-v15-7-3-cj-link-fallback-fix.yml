name: TrendPilot Products V15.7.3 CJ Link Fallback Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-7-3-cj-link-fallback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-cj-live-product-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Install V15.7.3 live CJ link fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p netlify/functions
          echo '' | base64 -d > netlify/functions/cj-live-products.mjs

      - name: Validate V15.7.3
        shell: bash
        run: |
          set -euo pipefail

          node --check netlify/functions/cj-live-products.mjs
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          p=Path("netlify/functions/cj-live-products.mjs")
          text=p.read_text(encoding="utf-8")

          required=[
              'CJ_LINK_SEARCH_ENDPOINT',
              'link-search.api.cj.com/v2/link-search',
              'link',
              'linkCode(pid:',
              'loadSellerTrackingLinks',
              'bestSellerTrackingLink',
              'destination-only',
              'link-search-fallback',
              'product-linkCode',
              'version: "15.7.3"',
              'path: "/api/cj-live-products"'
          ]

          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit("Missing V15.7.3 markers: "+", ".join(missing))

          changed=set(
              subprocess.check_output(
                  ["git","diff","--name-only"],
                  text=True
              ).splitlines()
          )

          allowed={
              "netlify/functions/cj-live-products.mjs"
          }

          unexpected=changed-allowed
          if unexpected:
              raise SystemExit(
                  "Unexpected files changed: "+
                  ", ".join(sorted(unexpected))
              )

          print("V15.7.3 validation passed.")
          print("- Products UI untouched.")
          print("- Admitad untouched.")
          print("- Seller routing untouched.")
          print("- Product Feed now requests direct product field: link.")
          print("- Product linkCode remains first priority.")
          print("- CJ Link Search is second priority and cached for 30 minutes.")
          print("- Direct product destination is final non-fabricated fallback.")
          PY

      - name: Publish V15.7.3
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add netlify/functions/cj-live-products.mjs
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.7.3 is already installed."
            exit 0
          fi

          git commit -m "fix: keep CJ live products when product clickUrl is null"
          git push origin HEAD:main

          {
            echo "## TrendPilot Products V15.7.3"
            echo ""
            echo "CJ live link priority:"
            echo "1. Product Feed linkCode.clickUrl"
            echo "2. CJ Link Search tracked click URL"
            echo "3. Product Feed direct product link"
            echo ""
            echo "No Products UI, Admitad catalog, or seller-routing code was changed."
            echo ""
            echo "After Netlify publishes, test:"
            echo 'https://trendpilotchoice.com/api/cj-live-products?q=power%20bank&seller=Temu'
            echo ""
            echo "Expected improvement:"
            echo '- total should be greater than 0'
            echo '- products should no longer be []'
            echo '- coverage.returned should be greater than 0'
            echo '- tracking shows which link method is being used'
          } >> "$GITHUB_STEP_SUMMARY"
