name: TrendPilot Lenovo Deeplink Only V15.5.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-lenovo-deeplink-only-v15-5-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enable-lenovo-deeplink-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMITAD_CLIENT_ID_PRIMARY: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_ID_ALT: ${{ secrets.client_id }}
      ADMITAD_CLIENT_SECRET_PRIMARY: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      ADMITAD_CLIENT_SECRET_ALT: ${{ secrets.client_secret }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Resolve Lenovo approved affiliate link
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/resolve_lenovo.py
          python /tmp/resolve_lenovo.py

      - name: Install Lenovo direct-link fallback
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_lenovo.py
          python /tmp/patch_lenovo.py

      - name: Validate V15.5.2
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site-v13-5.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          cfg=json.loads(Path("data/lenovo-deeplink-only-v15-5-2.json").read_text(encoding="utf-8"))
          assert cfg["website_id"]==2980568
          assert cfg["campaign_id"]==18201
          assert cfg["mode"]=="deeplink-only"
          assert str(cfg["affiliate_url"]).startswith("http")

          js=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")
          blob=js+"\n"+html
          for marker in (
              "TP_LENOVO_DEEPLINK_ONLY_V15_5_2_START",
              "Visit Lenovo",
              'selectedSeller==="lenovo"',
              "/js/site-v13-5.js?v=15.5.2"
          ):
              if marker not in blob:
                  raise SystemExit("Missing marker: "+marker)

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={
              "data/lenovo-deeplink-only-v15-5-2.json",
              "js/site-v13-5.js",
              "find/index.html"
          }
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))

          if js.count("TP_CJ_SEARCH_BRIDGE_START") != 1:
              raise SystemExit("CJ bridge integrity failed.")
          if "/js/product-discovery-v15.js?v=15.2.0" not in html:
              raise SystemExit("Suggestion engine changed unexpectedly.")

          print("V15.5.2 validation passed.")
          PY

      - name: Publish V15.5.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lenovo-deeplink-only-v15-5-2.json js/site-v13-5.js find/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "V15.5.2 already installed."
            exit 0
          fi
          git commit -m "feat: enable Lenovo deeplink-only fallback"
          git push origin HEAD:main
