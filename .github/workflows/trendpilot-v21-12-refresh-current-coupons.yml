name: TrendPilot V21.12 — Refresh Current Coupons

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-12-refresh-current-coupons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate coupon engine
        run: |
          python -m py_compile automation/admitad_coupon_api.py
          python automation/admitad_coupon_api.py --self-test
      - name: Refresh policy-safe coupons from current ad space
        env:
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_WEBSITE_ID: '2980568'
        run: python automation/admitad_coupon_api.py
      - name: Validate current ad space and blocklist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          r=json.loads(Path('data/coupon-report.json').read_text(encoding='utf-8'))
          c=json.loads(Path('data/coupons.json').read_text(encoding='utf-8'))
          assert int(r['ad_space']['id'])==2980568, r['ad_space']
          assert 'trendpilotchoice.com' in str(r['ad_space']['site_url']).lower(), r['ad_space']
          names=' '.join(str(x.get('merchant_name') or '') for x in c.get('coupons',[]))
          assert not re.search(r'(?:joom|temu|filamentpro)',names,re.I), names
          assert c['count']==len(c['coupons'])
          assert r['active_coupons']==len(c['coupons'])
          print('Current ad space:',r['ad_space'])
          print('Policy-safe coupons:',len(c['coupons']))
          PY
      - name: Commit refreshed coupons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/coupons.json data/coupon-report.json js/coupons-data.js
          if git diff --cached --quiet; then
            echo 'Coupons already current.'
          else
            git commit -m 'TrendPilot V21.12 refresh coupons from current ad space'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
