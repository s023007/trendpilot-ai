name: TrendPilot V20.8.2 Metadata Truth

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trendpilot-v20-8-2-metadata-truth.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply metadata truth normalization
        run: python scripts/apply-v20-8-2-metadata-truth.py

      - name: Rebuild universal discovery and Rare Finds
        run: python scripts/build-v20-8-universal-discovery.py

      - name: Truth QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/universal-discovery-v20-8.js
          node --check js/rare-finds-v20-8.js
          python -m py_compile scripts/build-v20-8-universal-discovery.py
          grep -q "V='20.8.2'" scripts/build-v20-8-universal-discovery.py
          grep -q '20.8.2' data/v20-8/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/v20-8/rare-index.json').read_text())
          cb=[r for r in rows if 'cb440' in (r.get('title') or '').lower()]
          if not cb:
              raise SystemExit('CB440 truth probe missing')
          if any(r.get('type')!='power-tool-parts' for r in cb):
              raise SystemExit('CB440 category truth failed: '+str([(r.get('type'),r.get('title')) for r in cb[:3]]))
          if any((r.get('brand') or '').lower()=='poco' for r in cb):
              raise SystemExit('CB440 stale brand leak')
          if any(r.get('role')=='replacement_part' and 'jeans' in (r.get('title') or '').lower() for r in rows):
              raise SystemExit('Fashion fit false replacement role leak')
          strong={'used-scarce','collector','discontinued'}
          bad=[r for r in rows if r.get('role')=='replacement_part' and not strong.intersection(r.get('signals') or []) and int(r.get('rareScore') or 0)>79]
          if bad:
              raise SystemExit('Replacement rarity cap failed')
          print('V20.8.2 metadata truth QA: PASS')
          PY
          if git status --short | grep -E 'data/catalog-v19|data/.*(tpid|tpvid|tpoid|identity)'; then
            echo 'Unexpected canonical identity/catalog mutation'
            exit 1
          fi

      - name: Commit V20.8.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/build-v20-8-universal-discovery.py js/universal-discovery-v20-8.js js/rare-finds-v20-8.js find/index.html rare-used/index.html data/v20-8 rare-used/finds sitemap-v20-8.xml robots.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'TrendPilot V20.8.2 normalize universal metadata truth'
          git push
