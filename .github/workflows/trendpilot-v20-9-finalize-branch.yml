name: TrendPilot V20.9.1 — Finalize Release Branch

on:
  push:
    branches:
      - v20-9-all-product-quality-gate
    paths:
      - .github/workflows/trendpilot-v20-9-finalize-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild source projection
        run: python scripts/build-v20-8-universal-discovery.py

      - name: Apply established truth guards
        run: |
          python scripts/clean-v20-8-universal-output.py
          python scripts/clean-v20-8-brand-truth.py

      - name: Apply V20.9 product quality gate
        run: python scripts/quality-gate-v20-9-all-products.py

      - name: Export final V20.9 mobile runtime
        run: python scripts/export-v20-9-runtime-data.py

      - name: Audit final product projection
        run: python scripts/audit-v20-9-all-products.py

      - name: Preserve Rare V20.8.9 closeout
        run: python scripts/finalize-v20-8-9-rare-closeout.py

      - name: Cross-family shopper smoke QA
        run: python scripts/qa-v20-9-product-smoke.py

      - name: Final runtime and safety contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build-v20-8-universal-discovery.py scripts/clean-v20-8-universal-output.py scripts/clean-v20-8-brand-truth.py scripts/quality-gate-v20-9-all-products.py scripts/export-v20-9-runtime-data.py scripts/audit-v20-9-all-products.py scripts/qa-v20-9-product-smoke.py scripts/finalize-v20-8-9-rare-closeout.py
          node --check js/universal-discovery-v20-9-1.js
          node --check js/finder-shell-v20-9.js
          node --check js/item-detail-v20-9.js
          node --check js/compare-v20-9.js
          node --check js/compare-state-v20-9.js
          node --check js/rare-finds-v20-8.js
          node --check js/rare-find-detail-v20-8-7.js
          grep -q 'finder-shell-v20-9.js?v=20.9.0' find/index.html
          grep -q 'universal-discovery-v20-9-1.js?v=20.9.1' find/index.html
          grep -q 'item-detail-v20-9.js?v=20.9.0' item/index.html
          grep -q 'compare-v20-9.js?v=20.9.0' compare/index.html
          grep -q 'compare-state-v20-9.js?v=20.9.0' index.html find/index.html
          grep -q 'https://trendpilotchoice.com/compare/' compare/index.html
          if grep -q 'finder-v20-7-9.js' find/index.html || grep -q 'buyer-decision-v20-7-11.js' find/index.html || grep -q 'v20-8-8-internal-first-guard.js' find/index.html; then
            echo 'Legacy finder/card mutator leaked into authoritative finder'
            exit 1
          fi
          if grep -RE 'new MutationObserver\([^)]*document|observe\(document' js/universal-discovery-v20-9-1.js js/finder-shell-v20-9.js js/item-detail-v20-9.js js/compare-v20-9.js js/compare-state-v20-9.js; then
            echo 'Whole-document MutationObserver is forbidden'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('data/v20-9/quality-report.json').read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text())
          fam=json.loads(Path('data/v20-9/families.json').read_text())
          roles=json.loads(Path('data/v20-9/family-roles.json').read_text())
          m=json.loads(Path('data/v20-8/manifest.json').read_text())
          s=json.loads(Path('data/v20-8/taxonomy-summary.json').read_text())
          rare=json.loads(Path('data/v20-8/rare-index.json').read_text())
          assert q['records']==52031
          assert d['records']==52031
          assert rt['records']==52031
          assert q['unclassifiedBefore']==9355
          assert q['unclassifiedAfter']<=3500
          assert q['blockedSellerLeaks']==0
          assert q['immutableCommerceFieldsChanged']==0
          assert rt['productBuckets']==256
          assert rt['maxProductBucketBytes']<500000
          assert rt.get('familyStrategy')=='role-balanced'
          assert len(fam)>=100 and len(roles)>=100
          assert m.get('version')=='20.9.0'
          assert s.get('version')=='20.9.0'
          assert m.get('truthCleanup',{}).get('rareCloseoutVersion')=='20.8.9'
          assert m.get('rarePublished')==len(rare)
          assert 60 <= len(rare) <= 90
          for k in ('phoneNonMain','tabletNonMain','laptopNonMain','smartwatchNonMain','headphonesNonMain'):
              assert q['semanticProbes'][k]==0, (k,q['semanticProbes'][k])
              assert d['roleAnomalies'][k]['count']==0, (k,d['roleAnomalies'][k]['count'])
          for family,role in (('phone','main'),('phone','accessory'),('phone','replacement_part'),('tablet','main'),('tablet','accessory'),('laptop','main'),('laptop','accessory'),('camera','main'),('camera','accessory'),('tools','main'),('tools','replacement_part'),('automotive','accessory'),('automotive','replacement_part')):
              assert roles.get(family,{}).get(role), (family,role)
          print('FINAL V20.9.1 BRANCH CONTRACT PASS')
          PY
          if git status --short | grep -E 'data/catalog-v19|data/.*(tpid|tpvid|tpoid|identity)'; then
            echo 'Unexpected V19 identity/canonical mutation'
            git status --short
            exit 1
          fi

      - name: Write finalization summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          q=json.loads(Path('data/v20-9/quality-report.json').read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text())
          m=json.loads(Path('data/v20-8/manifest.json').read_text())
          rare=json.loads(Path('data/v20-8/rare-index.json').read_text())
          print('# TrendPilot V20.9.1 — Final Release Materialization')
          print()
          print(f"- Records: **{q['records']:,}**")
          print(f"- Unclassified: **{q['unclassifiedBefore']:,} → {q['unclassifiedAfter']:,} ({q['unclassifiedAfterPct']}%)**")
          print(f"- Reclassified from Unclassified: **{q['unclassifiedReduction']:,}**")
          print(f"- Type corrections: **{sum(x['count'] for x in q['typeChanges']):,}**")
          print(f"- Role corrections: **{sum(x['count'] for x in q['roleChanges']):,}**")
          print(f"- Product families: **{q['familyCount']:,}**")
          print(f"- Mobile buckets: **{rt['productBuckets']}**, largest **{rt['maxProductBucketBytes']:,} bytes**")
          print(f"- Family retrieval: **{rt.get('familyStrategy')}**")
          print(f"- Strong accessory grammar still marked main: **{d['roleAnomalies']['mainWithStrongAccessoryGrammar']['count']:,}**")
          print(f"- Strong replacement grammar still marked main: **{d['roleAnomalies']['mainWithStrongReplacementGrammar']['count']:,}**")
          print(f"- Blocked seller leaks: **{q['blockedSellerLeaks']}**")
          print(f"- Immutable price/link/ID/seller fields changed: **{q['immutableCommerceFieldsChanged']}**")
          print(f"- Rare Finds: **{len(rare)}**, closeout **{m.get('truthCleanup',{}).get('rareCloseoutVersion')}**")
          print()
          print('Generated runtime data is being committed to the release branch so the final merge contains code and data together.')
          PY

      - name: Commit final generated runtime to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/v20-8/manifest.json data/v20-8/taxonomy-summary.json data/v20-8/rare-index.json data/v20-9 rare-used/finds sitemap-v20-8.xml robots.txt
          if git diff --cached --quiet; then
            echo 'Final generated runtime already matches release branch'
            exit 0
          fi
          git commit -m 'TrendPilot V20.9.1 materialize final product runtime'
          git push
