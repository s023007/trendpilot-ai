name: Refine WAU LED landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-wau-led-cnet-editorial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply WAU landing refinement
        run: python scripts/refine_wau_led_cnet.py
      - name: Commit refined landing page
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'trendpilot-campaign-brain'
          git config user.email '39025908+s023007@users.noreply.github.com'
          git add products/led-face-mask/bg/index.html
          git commit -m 'landing: refine WAU LED page with editorial decision guide'
          git push
