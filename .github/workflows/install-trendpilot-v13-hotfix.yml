name: Install TrendPilot V13 Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install-v13-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Locate and unpack V13 hotfix
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="trendpilot-v13-decision-engine-hotfix.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Upload $ZIP_FILE to the repository root first."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/trendpilot-v13-hotfix"
          mkdir -p "$RUNNER_TEMP/trendpilot-v13-hotfix"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/trendpilot-v13-hotfix"
          cp -a "$RUNNER_TEMP/trendpilot-v13-hotfix"/. .
          rm -f "$ZIP_FILE" trendpilot-v13-decision-engine.zip

      - name: Install V13 decision engine
        shell: bash
        run: |
          set -euo pipefail
          python automation/install_v13_decision_engine.py

      - name: Validate V13 hotfix
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            automation/build_decision_catalog.py \
            automation/install_v13_decision_engine.py \
            automation/validate_v13.py \
            automation/build_search_catalog.py
          node --check js/site-v13.js
          python automation/validate_v13.py
          if ! git diff --quiet -- .github/workflows; then
            echo "The hotfix must not change workflow files from inside GitHub Actions."
            git diff -- .github/workflows
            exit 1
          fi

      - name: Commit V13 hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install TrendPilot V13 decision engine hotfix"
          for attempt in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after three attempts."
              exit 1
            fi
            echo "Push attempt $attempt failed; rebasing and retrying."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done

      - name: Queue full feed refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          if gh workflow run update-products.yml --ref "${GITHUB_REF_NAME}"; then
            echo "Full feed refresh queued."
          else
            echo "::warning::V13 installed successfully, but the feed refresh could not be queued automatically. Run 'Update trends and affiliate products' manually."
          fi
