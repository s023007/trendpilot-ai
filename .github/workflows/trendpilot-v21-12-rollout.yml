name: TrendPilot V21.12 — Final Wiring + Rare SEO Refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-12-rollout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v21-12-rollout
  cancel-in-progress: true

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Apply final runtime wiring
        run: python scripts/apply-v21-12-wiring.py

      - name: Refresh Rare Find SEO pages from existing Rare index
        run: python scripts/refresh-v21-12-rare-seo.py

      - name: Validate changed runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/smart-suggestions-v20-7-7.js
          node --check js/query-normalizer-v21-3.js
          node --check js/rare-finds-v20-8.js
          node --check js/rare-find-detail-v20-8-7.js
          node --check js/ticket-decision-v14.js
          node --check js/ticket-detail-v14.js
          node --check netlify/functions/products-v20-suggest.mjs
          grep -q 'smart-suggestions-v20-7-7.js?v=21.12.0' index.html
          grep -q 'smart-suggestions-v20-7-7.js?v=21.12.0' find/index.html
          grep -q 'query-normalizer-v21-3.js?v=21.12.0' find/index.html
          grep -q 'rare-finds-v20-8.js?v=21.12.0' rare-used/index.html
          grep -q 'rare-find-detail-v20-8-7.js?v=21.12.0' rare-used/view/index.html

      - name: Commit focused V21.12 generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html find/index.html tickets/index.html ticket/index.html rare-used/finds
          if git diff --cached --quiet; then
            echo 'V21.12 wiring and Rare SEO pages already current.'
          else
            git commit -m 'TrendPilot V21.12 refresh final runtime wiring and Rare SEO pages'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Summary
        shell: bash
        run: |
          echo '# TrendPilot V21.12 rollout' >> "$GITHUB_STEP_SUMMARY"
          echo '- ✅ Search/autocomplete runtime cache wiring' >> "$GITHUB_STEP_SUMMARY"
          echo '- ✅ Rare Find dynamic detail runtime wiring' >> "$GITHUB_STEP_SUMMARY"
          echo '- ✅ Static Rare Find SEO pages regenerated from the existing Rare index only' >> "$GITHUB_STEP_SUMMARY"
          echo '- ✅ JavaScript syntax checks' >> "$GITHUB_STEP_SUMMARY"
