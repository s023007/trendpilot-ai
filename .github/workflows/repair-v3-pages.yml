TREND_PAGES_PAYLOAD
          base64 --decode "$RUNNER_TEMP/trendpilot-v3-pages.tgz.b64" > "$RUNNER_TEMP/trendpilot-v3-pages.tgz"
          tar -xzf "$RUNNER_TEMP/trendpilot-v3-pages.tgz" -C .

          # Verify every public decision page exists before committing.
          test -f "products/index.html"
          test -f "products/wireless-carplay-adapters/index.html"
          test -f "compare/index.html"
          test -f "compare/joom-vs-aliexpress/index.html"
          test -f "compare/geekbuying-vs-aliexpress/index.html"
          test -f "compare/filmora-vs-capcut/index.html"
          test -f "software/index.html"
          test -f "software/filmora-review/index.html"
          test -f "software/best-video-editor-for-beginners/index.html"
          test -f "sourcing/index.html"
          test -f "sourcing/alibaba-vs-aliexpress/index.html"
          test -f "sourcing/how-to-find-verified-suppliers/index.html"
          test -f "404.html"

          # The 404 page must load root assets even when served for a deep missing URL.
          grep -q '<base href="/">' 404.html

      - name: Commit repaired pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products compare software sourcing research 404.html

          if git diff --cached --quiet; then
            echo "No repair was needed; all files already match."
            exit 0
          fi

          git commit -m "fix: restore v3 decision pages and nested 404 assets"
          git push origin HEAD:main
