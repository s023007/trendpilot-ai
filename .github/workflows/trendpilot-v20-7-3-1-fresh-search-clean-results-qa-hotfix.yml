name: TrendPilot V20.7.3.1 — Fresh Search + Clean Results QA Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-7-3-1-search-card-repair
  cancel-in-progress: false

jobs:
  repair-public-finder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Start visible summary
        shell: bash
        run: |
          {
            echo "# TrendPilot V20.7.3.1 — Fresh Search + Clean Results QA Hotfix"
            echo
            echo "**Observed production issues addressed in one release:**"
            echo "- New finder keywords can remain on stale Phone state."
            echo "- Exact Phone still admits strong accessory/part listings."
            echo "- V20 identity result cards are not receiving the intended shopper styling."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install V20.7.3 finder repair
        shell: bash
        env:
          V2073_JS_B64: ""
          V2073_CSS_B64: ""
        run: |
          set -euo pipefail

          python <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          ROOT = Path(".")
          FIND = ROOT / "find" / "index.html"
          SITE = ROOT / "js" / "site-v13-5.js"

          if not FIND.exists():
              raise SystemExit("find/index.html missing")
          if not SITE.exists():
              raise SystemExit("js/site-v13-5.js missing")

          html = FIND.read_text(encoding="utf-8")
          site = SITE.read_text(encoding="utf-8")

          js = base64.b64decode(os.environ["V2073_JS_B64"]).decode("utf-8")
          css = base64.b64decode(os.environ["V2073_CSS_B64"]).decode("utf-8")

          js_path = ROOT / "js" / "v20-7-3-search-card-repair.js"
          css_path = ROOT / "css" / "v20-7-3-search-card-repair.css"
          js_path.write_text(js.strip() + "\n", encoding="utf-8")
          css_path.write_text(css.strip() + "\n", encoding="utf-8")

          css_tag = '<link rel="stylesheet" href="/css/v20-7-3-search-card-repair.css?v=20.7.3.1">'
          js_tag = '<script defer src="/js/v20-7-3-search-card-repair.js?v=20.7.3.1"></script>'

          if "v20-7-3-search-card-repair.css" not in html:
              pos = html.lower().find("</head>")
              if pos < 0:
                  raise SystemExit("finder has no </head>")
              html = html[:pos] + css_tag + "\n" + html[pos:]

          if "v20-7-3-search-card-repair.js" not in html:
              pos = html.lower().rfind("</body>")
              if pos < 0:
                  raise SystemExit("finder has no </body>")
              html = html[:pos] + js_tag + "\n" + html[pos:]

          # V20.7.3.1 intentionally does NOT patch site-v13-5.js.
          # New keyword searches are intercepted in capture phase and navigate
          # to a fresh /find/?q=...&engine=v2064 URL. This resets stale Phone
          # state before the old in-page history code can run.
          history_strategy = "not_required_fresh_navigation"

          FIND.write_text(html, encoding="utf-8")

          report = {
              "version": "V20.7.3.1",
              "fresh_navigation_on_finder_submit": True,
              "fresh_navigation_on_quick_search": True,
              "forced_engine": "v2064",
              "history_engine_strategy": history_strategy,
              "phone_strong_accessory_guard": True,
              "generic_battery_word_not_blocked": True,
              "v20_group_card_enhancer": True,
              "seller_variant_spacing_repair": True,
              "whole_document_observer": False,
              "identity_rebuilt": False,
              "geo_import_filter_added": False,
              "seller_policy_changed": False
          }

          diag = ROOT / "data" / "diagnostics"
          diag.mkdir(parents=True, exist_ok=True)
          (diag / "v20-7-3-1-search-card-repair-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(json.dumps(report, indent=2))
          PY

      - name: JavaScript and routing QA
        shell: bash
        run: |
          set -euo pipefail

          node --check js/v20-7-3-search-card-repair.js

          python <<'PY'
          from pathlib import Path
          import json

          html = Path("find/index.html").read_text(encoding="utf-8")
          js = Path("js/v20-7-3-search-card-repair.js").read_text(encoding="utf-8")
          checks = {
              "finder_contract": all(x in html for x in (
                  "data-tp-finder-form",
                  "data-tp-finder-input",
                  "data-tp-product-grid",
                  "data-tp-result-tabs"
              )),
              "repair_css_loaded": "v20-7-3-search-card-repair.css" in html,
              "repair_js_loaded": "v20-7-3-search-card-repair.js" in html,
              "capture_submit": 'addEventListener("submit"' in js and 'stopImmediatePropagation()' in js,
              "full_navigation": "location.assign(buildFinderUrl" in js,
              "engine_v2064": 'p.set("engine", "v2064")' in js,
              "query_is_dynamic": 'new URLSearchParams(location.search).get("q")' in js,
              "phone_controller_guard": "gamepad" in js and "joystick" in js,
              "phone_battery_replacement_guard": "replacement" in js and "battery" in js,
              "no_broad_battery_rejection": "const PHONE_NON_MAIN = /\\b(?:battery\\b" not in js,
              "card_enhancer": "v2073-result-card" in js,
              "grid_scoped_observer": "new MutationObserver(schedule).observe(grid" in js,
              "no_document_observer": "observe(document.documentElement" not in js,
              "fresh_navigation_owns_engine": (
                  "location.assign(buildFinderUrl" in js
                  and 'p.set("engine", "v2064")' in js
                  and "stopImmediatePropagation()" in js
              )
          }

          print(json.dumps(checks, indent=2))
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit("V20.7.3.1 QA failed: " + ", ".join(failed))
          PY

      - name: Static phone role probes
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const reject = /\b(?:phone\s+case|protective\s+case|phone\s+cover|screen\s+protector|tempered\s+glass|sim\s*(?:card\s*)?tray|ssd\s+enclosure|m\.?2\s+enclosure|game\s*controller|gamepad|joystick|game\s*handle|phone\s+holder|phone\s+mount|phone\s+stand|phone\s+strap|lanyard|back\s+glass|digitizer|flex\s+cable|charging\s+port|replacement\s+(?:battery|screen|display|camera|housing)|battery\s+(?:for|compatible\s+with)\s+(?:iphone|samsung|galaxy|pixel|xiaomi|redmi|oneplus|oppo|vivo|realme|motorola)|(?:iphone|samsung|galaxy|pixel|xiaomi|redmi|oneplus|oppo|vivo|realme|motorola)\s+replacement\s+battery)\b/i;

          const mustReject = [
            "0 cycle brand new battery lithium ion polymer battery bateria for iphone 5",
            "[Gold] H9 Game Controller with Fan Joystick H9 GamePad Mobile Phone Game Handle",
            "For Google Pixel 10 SIM Card Tray",
            "Z850 USB-C Magnetic M.2 2230 NVMe SSD Enclosure for iPhone 16"
          ];

          const mustKeep = [
            "[HK Stock] Factory price Original Xiaomi Mi 9T Pro, 48MP Camera, 6GB+128GB, Global Official Version Mobile phone 4000mAh Battery",
            "OnePlus 7T 8GB 128GB Smartphone",
            "Samsung Galaxy S25 256GB Mobile Phone"
          ];

          for (const x of mustReject) {
            if (!reject.test(x)) throw new Error("Should reject accessory/part: " + x);
          }
          for (const x of mustKeep) {
            if (reject.test(x)) throw new Error("Should keep real phone: " + x);
          }

          console.log("Phone role probes: PASS");
          NODE

      - name: Safety QA
        shell: bash
        run: |
          set -euo pipefail

          if git status --short | grep -E 'data/.*(canonical|tpid|tpvid|tpoid|identity|catalog)' >/dev/null; then
            echo "Unexpected identity/catalog mutation detected."
            git status --short
            exit 1
          fi

          echo "Identity/catalog rebuild: NO"
          echo "GEO import filter: NO"
          echo "Seller policy change: NO"

      - name: Write visible V20.7.3.1 Summary
        shell: bash
        run: |
          python <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          r = json.loads(
              Path("data/diagnostics/v20-7-3-1-search-card-repair-report.json")
              .read_text(encoding="utf-8")
          )

          print("## Fresh search behavior")
          print()
          print("- Every finder submit starts a fresh page state: **PASS**")
          print("- New query URL includes `engine=v2064`: **PASS**")
          print("- Quick-search chips also start fresh V20 search: **PASS**")
          print("- Old in-page history patch: **NOT REQUIRED — fresh navigation owns every new keyword**")
          print()
          print("## Exact product purity")
          print()
          print("- Phone cases / SIM trays / SSD enclosures: **BLOCKED from exact Phone**")
          print("- Controllers / gamepads / joysticks: **BLOCKED from exact Phone**")
          print("- Replacement batteries: **BLOCKED from exact Phone**")
          print("- Real phones mentioning battery capacity: **PRESERVED**")
          print()
          print("## Result-card UI")
          print()
          print("- V13 product cards: **STYLED**")
          print("- V20 identity/group cards: **ENHANCER INSTALLED**")
          print("- `1 seller1 variant` spacing repair: **INSTALLED**")
          print("- Native-looking View product CTA repair: **INSTALLED**")
          print()
          print("## Safety")
          print()
          print("- Whole-document observer: **NO**")
          print("- V19/V20 identity rebuild: **NO**")
          print("- GEO import filtering: **NO**")
          print("- Seller policy change: **NO**")
          print()
          print("### Result")
          print("**PASS — V20.7.3.1 passed corrected QA and is ready to test Phone, Laptop and Perfume as separate fresh searches.**")
          PY

      - name: Commit V20.7.3.1
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "TrendPilot V20.7.3.1 fresh search and result-card QA hotfix"
          git push
