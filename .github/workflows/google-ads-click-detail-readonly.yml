name: Google Ads Click Detail — Read Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-ads-click-detail-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: google-ads-paused-create
    steps:
      - name: Install Google Ads client
        run: pip install --disable-pip-version-check google-ads
      - name: Read click detail
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          python - <<'PY'
          import os
          from google.ads.googleads.client import GoogleAdsClient
          CAMPAIGN_ID=24190034111
          client=GoogleAdsClient.load_from_dict({
            'developer_token':os.environ['GOOGLE_ADS_DEVELOPER_TOKEN'],
            'client_id':os.environ['GOOGLE_ADS_CLIENT_ID'],
            'client_secret':os.environ['GOOGLE_ADS_CLIENT_SECRET'],
            'refresh_token':os.environ['GOOGLE_ADS_REFRESH_TOKEN'],
            'login_customer_id':os.environ['GOOGLE_ADS_LOGIN_CUSTOMER_ID'].replace('-','').strip(),
            'use_proto_plus':True,
          })
          cid=os.environ['GOOGLE_ADS_CUSTOMER_ID'].replace('-','').strip()
          ga=client.get_service('GoogleAdsService')

          print('CLICK DETAIL READ ONLY')
          q=f'''
            SELECT ad_group.name, ad_group_criterion.keyword.text,
                   ad_group_criterion.keyword.match_type,
                   ad_group_criterion.effective_cpc_bid_micros,
                   metrics.impressions, metrics.clicks, metrics.cost_micros,
                   metrics.conversions, metrics.all_conversions,
                   metrics.search_impression_share,
                   metrics.search_rank_lost_impression_share
            FROM keyword_view
            WHERE campaign.id={CAMPAIGN_ID}
              AND segments.date DURING TODAY
              AND metrics.impressions > 0
          '''
          rows=list(ga.search(customer_id=cid,query=q))
          print('KEYWORDS_WITH_IMPRESSIONS=',len(rows))
          for r in rows:
            print('KW=',repr(r.ad_group_criterion.keyword.text),'| match=',r.ad_group_criterion.keyword.match_type.name,
                  '| adgroup=',r.ad_group.name,
                  '| bid_usd=',int(r.ad_group_criterion.effective_cpc_bid_micros or 0)/1_000_000,
                  '| impr=',r.metrics.impressions,'| clicks=',r.metrics.clicks,
                  '| cost_usd=',int(r.metrics.cost_micros or 0)/1_000_000,
                  '| conv=',float(r.metrics.conversions or 0),'| all_conv=',float(r.metrics.all_conversions or 0),
                  '| search_IS=',float(r.metrics.search_impression_share or 0),
                  '| rank_lost_IS=',float(r.metrics.search_rank_lost_impression_share or 0))

          q=f'''
            SELECT search_term_view.search_term, ad_group.name,
                   metrics.impressions, metrics.clicks, metrics.cost_micros,
                   metrics.conversions, metrics.all_conversions,
                   segments.device
            FROM search_term_view
            WHERE campaign.id={CAMPAIGN_ID}
              AND segments.date DURING TODAY
              AND metrics.impressions > 0
          '''
          rows=list(ga.search(customer_id=cid,query=q))
          print('SEARCH_TERMS=',len(rows))
          for r in rows:
            print('TERM=',repr(r.search_term_view.search_term),'| adgroup=',r.ad_group.name,
                  '| device=',r.segments.device.name,'| impr=',r.metrics.impressions,
                  '| clicks=',r.metrics.clicks,'| cost_usd=',int(r.metrics.cost_micros or 0)/1_000_000,
                  '| conv=',float(r.metrics.conversions or 0),'| all_conv=',float(r.metrics.all_conversions or 0))

          q=f'''
            SELECT ad_group.name, metrics.impressions, metrics.clicks,
                   metrics.cost_micros, metrics.conversions, metrics.all_conversions
            FROM ad_group
            WHERE campaign.id={CAMPAIGN_ID}
              AND segments.date DURING TODAY
              AND metrics.impressions > 0
          '''
          rows=list(ga.search(customer_id=cid,query=q))
          print('ADGROUPS_WITH_IMPRESSIONS=',len(rows))
          for r in rows:
            print('ADGROUP=',r.ad_group.name,'| impr=',r.metrics.impressions,
                  '| clicks=',r.metrics.clicks,'| cost_usd=',int(r.metrics.cost_micros or 0)/1_000_000,
                  '| conv=',float(r.metrics.conversions or 0),'| all_conv=',float(r.metrics.all_conversions or 0))

          try:
            q=f'''
              SELECT user_location_view.country_criterion_id,
                     metrics.impressions, metrics.clicks, metrics.cost_micros,
                     metrics.conversions
              FROM user_location_view
              WHERE campaign.id={CAMPAIGN_ID}
                AND segments.date DURING TODAY
                AND metrics.impressions > 0
            '''
            rows=list(ga.search(customer_id=cid,query=q))
            names={2048:'Bahrain',2414:'Kuwait',2512:'Oman',2634:'Qatar',2682:'Saudi Arabia',2784:'United Arab Emirates',2826:'United Kingdom',2372:'Ireland',2528:'Netherlands'}
            print('USER_LOCATIONS=',len(rows))
            for r in rows:
              geo=int(r.user_location_view.country_criterion_id)
              print('COUNTRY=',names.get(geo,str(geo)),'| geo_id=',geo,
                    '| impr=',r.metrics.impressions,'| clicks=',r.metrics.clicks,
                    '| cost_usd=',int(r.metrics.cost_micros or 0)/1_000_000,
                    '| conv=',float(r.metrics.conversions or 0))
          except Exception as e:
            print('USER_LOCATION_QUERY_ERROR=',type(e).__name__,str(e)[:500])
          print('END CLICK DETAIL')
          PY

