name: TrendPilot Approved Product Sellers Bridge

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-approved-product-sellers-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-product-sellers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Build Products seller bridge from new Admitad API + current CJ sellers
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          admitad_path = Path("data/admitad-approved-sellers.json")
          current_products_path = Path("data/approved-product-sellers-v14-1-5.json")
          out_path = Path("data/approved-product-sellers-v15-bridge.json")

          if not admitad_path.exists():
              raise SystemExit("Missing data/admitad-approved-sellers.json. Run Admitad Live Sync first.")

          admitad = json.loads(admitad_path.read_text(encoding="utf-8"))
          current = {}
          if current_products_path.exists():
              current = json.loads(current_products_path.read_text(encoding="utf-8"))

          # Keep only currently active Admitad sellers that can actually support Products.
          admitad_product_sellers = []
          excluded_admitad = []

          NON_PRODUCT_KEYWORDS = (
              "vpn",
              "ticket",
              "tickets",
              "software",
              "hosting",
              "travel",
              "flight",
              "hotel",
              "insurance",
          )

          for seller in admitad.get("sellers") or []:
              if not isinstance(seller, dict):
                  continue

              name = str(seller.get("name") or "").strip()
              if not name:
                  excluded_admitad.append({"reason": "empty-name", "id": seller.get("id")})
                  continue

              if seller.get("approved") is not True:
                  excluded_admitad.append({"reason": "not-approved", "name": name, "id": seller.get("id")})
                  continue

              if seller.get("has_product_feed") is not True:
                  excluded_admitad.append({"reason": "no-product-feed", "name": name, "id": seller.get("id")})
                  continue

              lowered = name.lower()
              if any(word in lowered for word in NON_PRODUCT_KEYWORDS):
                  excluded_admitad.append({"reason": "non-product-program", "name": name, "id": seller.get("id")})
                  continue

              admitad_product_sellers.append(
                  {
                      "name": name,
                      "network": "Admitad",
                      "approved": True,
                      "campaign_id": seller.get("id"),
                      "allow_deeplink": bool(seller.get("allow_deeplink")),
                      "has_product_feed": True,
                      "source": "admitad-new-account-api",
                  }
              )

          # Preserve the already-working CJ sellers from the stable Products baseline.
          # We intentionally do NOT copy Admitad entries from the old static list.
          current_rows = []
          if isinstance(current, dict):
              current_rows = current.get("sellers") or current.get("approved_sellers") or []
          elif isinstance(current, list):
              current_rows = current

          cj_sellers = []
          for seller in current_rows:
              if isinstance(seller, str):
                  name = seller.strip()
                  network = ""
                  row = {"name": name}
              elif isinstance(seller, dict):
                  name = str(seller.get("name") or seller.get("seller") or "").strip()
                  network = str(seller.get("network") or "").strip()
                  row = dict(seller)
              else:
                  continue

              if not name:
                  continue

              # Keep CJ-only rows from the stable list. Explicit names are used as a fallback
              # because some older data files did not store "network".
              known_cj = {
                  "diecast",
                  "fragranceshop.com",
                  "karaca eu",
                  "mfi medical",
                  "pandahall",
                  "temu",
              }
              is_cj = network.lower() == "cj" or name.lower() in known_cj

              if not is_cj:
                  continue

              cj_sellers.append(
                  {
                      "name": name,
                      "network": "CJ",
                      "approved": True,
                      "source": "stable-products-baseline",
                  }
              )

          # Dedupe case-insensitively, keeping Admitad and CJ identities distinct by network.
          merged = []
          seen = set()
          for seller in admitad_product_sellers + cj_sellers:
              key = (seller["network"].lower(), seller["name"].lower())
              if key in seen:
                  continue
              seen.add(key)
              merged.append(seller)

          merged.sort(key=lambda x: (x["network"].lower(), x["name"].lower()))

          result = {
              "version": "15-bridge-1",
              "purpose": "Products seller bridge without touching the stable UI",
              "rules": {
                  "admitad_source": "new-account-active-only",
                  "admitad_requires_product_feed": True,
                  "cj_source": "stable-products-baseline",
                  "joom_policy": "excluded-until-active-for-trendpilotchoice.com",
                  "empty_names_excluded": True,
                  "ui_modified": False,
              },
              "counts": {
                  "admitad_product_sellers": len(admitad_product_sellers),
                  "cj_product_sellers": len(cj_sellers),
                  "merged_product_sellers": len(merged),
                  "excluded_admitad": len(excluded_admitad),
              },
              "sellers": merged,
              "excluded_admitad": excluded_admitad,
          }

          out_path.write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print("Approved Products seller bridge created.")
          print(f"Admitad product sellers: {len(admitad_product_sellers)}")
          print(f"CJ product sellers:      {len(cj_sellers)}")
          print(f"Merged sellers:          {len(merged)}")
          print("")
          for seller in merged:
              print(f"- {seller['network']}: {seller['name']}")
          PY

      - name: Validate bridge
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          bridge = json.loads(
              Path("data/approved-product-sellers-v15-bridge.json").read_text(encoding="utf-8")
          )

          sellers = bridge.get("sellers") or []
          if not sellers:
              raise SystemExit("No product sellers were generated.")

          # Hard safety checks.
          for seller in sellers:
              name = str(seller.get("name") or "").strip()
              if not name:
                  raise SystemExit("Blank seller name leaked into Products bridge.")
              if seller.get("approved") is not True:
                  raise SystemExit(f"Unapproved seller leaked: {name}")

          if any("joom" in str(s.get("name") or "").lower() for s in sellers):
              raise SystemExit("Joom must remain excluded until active for trendpilotchoice.com.")

          # Products UI must remain untouched in this workflow.
          if not Path("find/index.html").exists():
              raise SystemExit("find/index.html missing unexpectedly.")

          print("Bridge validation passed.")
          PY

          git diff --check

      - name: Confirm Products page untouched
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- find/index.html; then
            echo "Safety stop: this workflow unexpectedly changed Products UI."
            git diff -- find/index.html
            exit 1
          fi

          echo "Products page remains untouched."

      - name: Publish bridge only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/approved-product-sellers-v15-bridge.json
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Seller bridge already current."
            exit 0
          fi

          git commit -m "chore: build approved Products seller bridge"
          git push origin HEAD:main

          {
            echo "## Approved Products seller bridge"
            echo ""
            echo "- Built from new Admitad API active product programs."
            echo "- Preserved current working CJ product sellers."
            echo "- Joom excluded until approved for trendpilotchoice.com."
            echo "- Products page and search engine were not modified."
          } >> "$GITHUB_STEP_SUMMARY"
