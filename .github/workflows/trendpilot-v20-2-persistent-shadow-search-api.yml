          JS
          
          mkdir -p "$(dirname 'netlify/functions/products-v20-shadow-lib.mjs')"
          cat > 'netlify/functions/products-v20-shadow-lib.mjs' <<'JS'
          const TYPE_ALIASES = {
            phone: ['phone','phones','smartphone','smartphones','mobile phone','cell phone','iphone','galaxy s','pixel'],
            laptop: ['laptop','laptops','notebook','notebooks','chromebook','thinkpad','macbook','ideapad'],
            smartwatch: ['smartwatch','smartwatches','smart watch','smart watches','apple watch','galaxy watch'],
            headphones: ['headphones','headphone','earbuds','earbud','earphones','earphone','headset','headsets'],
            perfume: ['perfume','perfumes','eau de parfum','eau de toilette','cologne','fragrance','attar'],
            dog_food: ['dog food','puppy food','canine food','dog kibble','kibble'],
            power_bank: ['power bank','power banks','powerbank','powerbanks','portable charger'],
            air_conditioner: ['air conditioner','air conditioners','portable ac','window ac','mini split','split ac'],
            '3d_filament': ['3d filament','filament','pla filament','petg filament','abs filament','tpu filament'],
            cookware: ['cookware','cookware set','frying pan','saucepan','skillet','casserole','dutch oven'],
            lighting: ['lighting','light','lights','lamp','lamps','bulb','bulbs','led strip','light strip','light bar','flood light','neon rope'],
            tools: ['tools','tool','drill','screwdriver','wrench','pliers','ratchet','socket set','hammer','grinder','circular saw','jigsaw']
          };
          const MODEL_HINTS = [
            ['phone', /\biphone\s?(?:1[0-9]|[6-9])\b/],
            ['phone', /\bgalaxy\s+s\d{1,2}\b/],
            ['phone', /\bpixel\s+\d{1,2}\b/],
            ['laptop', /\bthinkpad\b/],
            ['laptop', /\bmacbook\b/],
            ['laptop', /\bideapad\b/],
            ['smartwatch', /\bapple watch\b/],
            ['smartwatch', /\bgalaxy watch\b/]
          ];
          export function normalize(value='') {
            return String(value).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,' and ').replace(/[^\p{L}\p{N}]+/gu,' ').replace(/\s+/g,' ').trim();
          }
          export function inferType(query='') {
            const q = normalize(query);
            if (!q) return '';
            for (const [type,re] of MODEL_HINTS) if (re.test(q)) return type;
            const exact = Object.entries(TYPE_ALIASES).find(([,aliases]) => aliases.some(a => normalize(a) === q));
            if (exact) return exact[0];
            const contained = Object.entries(TYPE_ALIASES).find(([,aliases]) => aliases.some(a => {
              const n = normalize(a); return n.length >= 4 && (` ${q} `).includes(` ${n} `);
            }));
            return contained?.[0] || '';
          }
          function queryMode(query, type) {
            const q = normalize(query);
            if (!type) return 'unknown';
            return TYPE_ALIASES[type].some(a => normalize(a) === q) ? 'broad' : 'specific';
          }
          function tokenList(q) {
            return normalize(q).split(' ').filter(Boolean).filter(t => !['for','the','with','and','of','a','an'].includes(t));
          }
          function score(row, query) {
            const q = normalize(query);
            const t = row.titleNorm || normalize(row.title);
            const tokens = tokenList(query);
            let s = Number(row.quality || 0);
            if (t === q) s += 2000;
            if (t.startsWith(q + ' ')) s += 900;
            if (t.includes(q)) s += 700;
            const hits = tokens.filter(x => (` ${t} `).includes(` ${x} `) || (x.length >= 4 && t.includes(x))).length;
            s += hits * 180;
            if (tokens.length && hits === tokens.length) s += 650;
            if (row.image) s += 20;
            if (row.url) s += 20;
            if (row.price > 0) s += 20;
            return s;
          }
          function allTokensMatch(row, query) {
            const t = row.titleNorm || normalize(row.title);
            const tokens = tokenList(query);
            return tokens.length > 0 && tokens.every(x => (` ${t} `).includes(` ${x} `) || (x.length >= 4 && t.includes(x)));
          }
          function sellerBalanced(rows, limit) {
            const groups = new Map();
            for (const row of rows) {
              if (!groups.has(row.seller)) groups.set(row.seller, []);
              groups.get(row.seller).push(row);
            }
            for (const arr of groups.values()) arr.sort((a,b) => (b._score||0)-(a._score||0) || Number(b.quality||0)-Number(a.quality||0) || Number(a.price||0)-Number(b.price||0));
            const sellers = [...groups.keys()].sort((a,b) => (groups.get(b)?.[0]?._score||0)-(groups.get(a)?.[0]?._score||0));
            const out=[];
            for (let i=0; out.length<limit; i++) {
              let added=false;
              for (const seller of sellers) {
                const r=groups.get(seller)?.[i];
                if (!r) continue;
                out.push(r); added=true;
                if (out.length>=limit) break;
              }
              if (!added) break;
            }
            return out;
          }
          function publicRow(r) {
            const { titleNorm, _score, ...rest } = r;
            return rest;
          }
          function median(values) {
            const a = values.filter(x=>Number.isFinite(x)&&x>0).sort((x,y)=>x-y);
            if (!a.length) return 0;
            const m=Math.floor(a.length/2);
            return a.length%2 ? a[m] : (a[m-1]+a[m])/2;
          }
          function priceBandAlternatives(rows, target, limit) {
            let pool = rows;
            if (target > 0) {
              const lo = target * 0.55, hi = target * 1.8;
              const near = rows.filter(r => r.price > 0 && r.price >= lo && r.price <= hi);
              if (near.length >= 4) pool = near;
            }
            return sellerBalanced(pool, limit);
          }
          export async function runShadowSearch({query='', seller='', limit=12, includeRelated=true}, manifest, loadType) {
            const type = inferType(query);
            if (!type || !manifest?.typeCounts?.[type]) {
              return { version:manifest?.version||'20.2.0', ready:true, query, mode:'unknown', type:'', message:'Query is outside the currently validated V20.2 shadow taxonomy.', main:[], alternatives:[], related:[], relatedCount:0, sellers:[] };
            }
            const mode = queryMode(query, type);
            const data = await loadType(type);
            const sellerNorm = normalize(seller);
            const mainBase = (data.main||[]).filter(r => !sellerNorm || normalize(r.seller)===sellerNorm);
            const relatedBase = (data.related||[]).filter(r => !sellerNorm || normalize(r.seller)===sellerNorm);
            const lim = Math.max(1, Math.min(Number(limit)||12, 48));
            let main=[]; let alternatives=[]; let related=[];
            if (mode === 'broad') {
              const ranked = mainBase.map(r => ({...r,_score:Number(r.quality||0)}));
              main = sellerBalanced(ranked, lim);
            } else {
              const specific = mainBase.filter(r => allTokensMatch(r,query)).map(r => ({...r,_score:score(r,query)})).sort((a,b)=>b._score-a._score);
              main = sellerBalanced(specific, lim);
              const target = median(main.map(r=>Number(r.price||0)));
              if (main.length < Math.min(4,lim)) {
                const used = new Set(main.map(r=>r.key));
                const altPool = mainBase.filter(r=>!used.has(r.key)).map(r=>({...r,_score:Number(r.quality||0)}));
                alternatives = priceBandAlternatives(altPool,target,Math.min(6,lim));
              }
              if (includeRelated) {
                related = relatedBase.filter(r => allTokensMatch(r,query)).map(r=>({...r,_score:score(r,query)})).sort((a,b)=>b._score-a._score).slice(0,Math.min(8,lim));
              }
            }
            const sellers = [...new Set([...main,...alternatives].map(r=>r.seller))];
            return {
              version:manifest.version,
              ready:true,
              query,
              mode,
              type,
              main:main.map(publicRow),
              alternatives:alternatives.map(publicRow),
              related:related.map(publicRow),
              relatedCount: mode==='broad' ? Number(manifest.typeCounts[type]?.related||0) : relatedBase.filter(r=>allTokensMatch(r,query)).length,
              totalMainForType:Number(manifest.typeCounts[type]?.main||0),
              sellers
            };
          }
          
          JS
          
          mkdir -p "$(dirname 'netlify/functions/products-v20-shadow.mjs')"
          cat > 'netlify/functions/products-v20-shadow.mjs' <<'JS'
          import { runShadowSearch } from './products-v20-shadow-lib.mjs';
          const VERSION='20.2.0';
          let manifestCache={at:0,value:null};
          const typeCache=new Map();
          const TTL=10*60*1000;
          function json(body,status=200){return new Response(JSON.stringify(body),{status,headers:{'content-type':'application/json; charset=utf-8','cache-control':'public, max-age=0, s-maxage=60, stale-while-revalidate=300','x-content-type-options':'nosniff'}})}
          async function fetchJson(url,timeoutMs=10000){const c=new AbortController();const t=setTimeout(()=>c.abort(),timeoutMs);try{const r=await fetch(url,{headers:{accept:'application/json'},signal:c.signal});if(!r.ok)throw new Error(`HTTP ${r.status} ${url}`);return await r.json()}finally{clearTimeout(t)}}
          export default async function handler(request){
            try{
              const u=new URL(request.url); const origin=u.origin;
              const now=Date.now();
              if(!manifestCache.value || now-manifestCache.at>TTL){manifestCache={at:now,value:await fetchJson(`${origin}/data/search-v20/manifest.json?v=${VERSION}`)}}
              const manifest=manifestCache.value;
              if(manifest?.version!==VERSION) return json({ready:false,version:manifest?.version||'',expected:VERSION,status:'projection-not-deployed'},503);
              if(u.searchParams.get('meta')==='1') return json({ready:true,version:VERSION,manifest});
              const query=u.searchParams.get('q')||'';
              if(!query.trim()) return json({ready:true,version:VERSION,message:'Use ?q=phone or another validated query. Add &seller=SellerName to scope results.'});
              const loadType=async(type)=>{
                const hit=typeCache.get(type); if(hit && now-hit.at<TTL) return hit.value;
                const value=await fetchJson(`${origin}/data/search-v20/types/${encodeURIComponent(type)}.json?v=${VERSION}`,15000);
                typeCache.set(type,{at:now,value}); return value;
              };
              const result=await runShadowSearch({query,seller:u.searchParams.get('seller')||'',limit:u.searchParams.get('limit')||12,includeRelated:u.searchParams.get('related')!=='0'},manifest,loadType);
              return json(result);
            }catch(error){return json({ready:false,version:VERSION,error:String(error?.message||error).slice(0,1000)},500)}
          }
          export const config={path:'/api/products-v20-shadow',method:'GET'};
          
          JS
          
          mkdir -p "$(dirname 'scripts/search-v20/test-v20-2.mjs')"
          cat > 'scripts/search-v20/test-v20-2.mjs' <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { runShadowSearch, normalize } from '../../netlify/functions/products-v20-shadow-lib.mjs';
          const ROOT=process.cwd();
          const manifest=JSON.parse(fs.readFileSync(path.join(ROOT,'data/search-v20/manifest.json'),'utf8'));
          const loadType=async(type)=>JSON.parse(fs.readFileSync(path.join(ROOT,'data/search-v20/types',`${type}.json`),'utf8'));
          const blocked=new Set(['temu','joom','filamentpro','filamentpro eu cps']);
          const dirty={
           phone:['case','cover','charger','cable','stand','holder','screen','protector','adapter','keyboard','bracelet','wristband','selfie light'],
           laptop:['keyboard','briefcase','bag','sleeve','ssd','solid state drive','vacuum','screwdriver','adapter','dock','hub'],
           smartwatch:['band','strap','case','bracelet','wristband'],
           headphones:['monitor','tumbler','mug','radio','vr glasses'],
           perfume:['power bank','powerbank','keychain','airpods','car perfume','air freshener'],
           dog_food:['feeder','bowl','opener','tab buddy','storage','dispenser'],
           air_conditioner:['brush','filter','bracket','cover','drill','evaporative air cooler','mist fan','usb powered'],
           '3d_filament':['rewinder','winder','winding machine','3d printer','printer combo'],
          };
          function hasDirty(type,title){const t=normalize(title);return (dirty[type]||[]).some(x=>t.includes(normalize(x)))}
          const queries=['phone','laptop','smartwatch','headphones','perfume','dog food','power bank','air conditioner','3d filament','lighting','tools','ThinkPad','iPhone 16','Galaxy S25'];
          const results=[];
          let failures=[];
          for(const q of queries){
           const r=await runShadowSearch({query:q,limit:12,includeRelated:true},manifest,loadType); results.push({q,mode:r.mode,type:r.type,main:r.main.length,alternatives:r.alternatives.length,related:r.relatedCount,sellers:r.sellers});
           if(!r.ready) failures.push(`${q}:not-ready`);
           for(const row of r.main){
             if(row.role!=='main') failures.push(`${q}:non-main:${row.title}`);
             if(row.type!==r.type) failures.push(`${q}:wrong-type:${row.type}:${row.title}`);
             if(blocked.has(normalize(row.seller))) failures.push(`${q}:blocked-seller:${row.seller}`);
             if(hasDirty(r.type,row.title)) failures.push(`${q}:dirty-main:${row.title}`);
           }
          }
          for(const q of ['iPhone 16','Galaxy S25']){
           const r=await runShadowSearch({query:q,limit:12,includeRelated:true},manifest,loadType);
           if(r.main.some(x=>hasDirty('phone',x.title))) failures.push(`${q}:accessory-promoted`);
          }
          if(manifest.publicSellers.length!==13) failures.push(`public-sellers:${manifest.publicSellers.length}`);
          if(manifest.catalogFilesLoaded!==13) failures.push(`catalog-files:${manifest.catalogFilesLoaded}`);
          if(manifest.blockedSellerLeaks!==0) failures.push(`blocked-leaks:${manifest.blockedSellerLeaks}`);
          if(Number(manifest.roleCounts.main||0)<5000) failures.push(`main-count-too-low:${manifest.roleCounts.main}`);
          console.log(JSON.stringify({version:manifest.version,results,failures},null,2));
          if(failures.length) process.exit(2);
          
          JS
          node --check scripts/search-v20/build-v20-2-projection.mjs
          node --check scripts/search-v20/test-v20-2.mjs
          node --check netlify/functions/products-v20-shadow-lib.mjs
          node --check netlify/functions/products-v20-shadow.mjs

      - name: Build persistent V20.2 projection
        id: build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/search-v20/build-v20-2-projection.mjs | tee "$RUNNER_TEMP/v20-2-build.json"
          test -s data/search-v20/manifest.json
          test -s data/search-v20/REPORT.md
          test -s data/search-v20/types/phone.json
          test -s data/search-v20/types/laptop.json
          test -s data/search-v20/types/lighting.json
          echo "Projection disk usage:"
          du -sh data/search-v20
          echo "Largest files:"
          find data/search-v20 -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Run local shadow-search precision tests
        id: local_test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/search-v20/test-v20-2.mjs | tee "$RUNNER_TEMP/v20-2-local-tests.json"

      - name: Validate persistent output contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYV'
          import json
          from pathlib import Path
          m=json.loads(Path('data/search-v20/manifest.json').read_text())
          assert m['version']=='20.2.0', m['version']
          assert m['publicSellers'] and len(m['publicSellers'])==13
          assert m['catalogFilesLoaded']==13
          assert m['duplicateProductKeys']==0
          assert m['blockedSellerLeaks']==0
          assert m['roleCounts']['main']>=5000
          for t in ['phone','laptop','smartwatch','headphones','perfume','dog_food','power_bank','air_conditioner','3d_filament','lighting','tools']:
              assert t in m['typeCounts'], t
              assert Path(f'data/search-v20/types/{t}.json').exists(), t
          blocked={'Temu','Joom','FilamentPRO EU CPS','FilamentPRO'}
          assert not blocked.intersection(x['name'] for x in m['publicSellers'])
          print('Persistent projection contract PASS')
          PYV

      - name: Commit isolated V20.2 shadow stage
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/search-v20             scripts/search-v20/build-v20-2-projection.mjs             scripts/search-v20/test-v20-2.mjs             netlify/functions/products-v20-shadow-lib.mjs             netlify/functions/products-v20-shadow.mjs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No V20.2 file changes to commit."
          else
            git commit -m "V20.2 persist isolated shadow product search"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for isolated Netlify shadow endpoint
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="https://trendpilotchoice.com/api/products-v20-shadow?meta=1&v=20260811"
          READY=0
          LAST_STATUS=""
          for i in $(seq 1 72); do
            CODE=$(curl -sS -o "$RUNNER_TEMP/v20-meta.json" -w '%{http_code}' --connect-timeout 10 --max-time 20 "$URL" || true)
            LAST_STATUS="$CODE"
            if [ "$CODE" = "200" ]; then
              if python - "$RUNNER_TEMP/v20-meta.json" <<'PYV'
          import json,sys
          try:
              x=json.load(open(sys.argv[1]))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if x.get('ready') is True and x.get('version')=='20.2.0' else 1)
          PYV
              then
                READY=1
                break
              fi
            fi
            sleep 10
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "last_http=$LAST_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$READY" = "1" ]; then
            echo "Shadow endpoint V20.2 is live."
          else
            echo "::warning::V20.2 files passed locally and were committed, but the isolated Netlify shadow endpoint was not visible within the wait window. Visitor production search is unchanged."
          fi

      - name: Run live shadow API smoke tests
        if: steps.deploy.outputs.ready == '1'
        id: live_test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYV'
          import json, subprocess, urllib.parse
          base='https://trendpilotchoice.com/api/products-v20-shadow'
          queries=['phone','laptop','smartwatch','headphones','perfume','dog food','power bank','air conditioner','3d filament','lighting','tools','ThinkPad','iPhone 16','Galaxy S25']
          out=[]
          blocked={'temu','joom','filamentpro','filamentpro eu cps'}
          for q in queries:
              url=base+'?'+urllib.parse.urlencode({'q':q,'limit':'12'})
              raw=subprocess.check_output(['curl','-sS','--connect-timeout','10','--max-time','25',url], text=True)
              data=json.loads(raw)
              assert data.get('ready') is True, (q,data)
              assert data.get('version')=='20.2.0', (q,data.get('version'))
              for row in data.get('main',[]):
                  assert row.get('role')=='main', (q,row)
                  assert row.get('type')==data.get('type'), (q,row)
                  assert str(row.get('seller','')).strip().lower() not in blocked, (q,row.get('seller'))
              out.append({'query':q,'mode':data.get('mode'),'type':data.get('type'),'main':len(data.get('main',[])),'alternatives':len(data.get('alternatives',[])),'relatedCount':data.get('relatedCount',0),'sellers':data.get('sellers',[])})
          print(json.dumps(out,indent=2))
          open('/tmp/v20-2-live-tests.json','w').write(json.dumps(out,indent=2))
          PYV

      - name: Publish V20.2 summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s data/search-v20/REPORT.md ]; then
            cat data/search-v20/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# TrendPilot V20.2 — Persistent Shadow Search API" >> "$GITHUB_STEP_SUMMARY"
