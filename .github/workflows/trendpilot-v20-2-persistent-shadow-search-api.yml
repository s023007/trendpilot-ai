            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/v20-2-local-tests.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s /tmp/v20-2-live-tests.json ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "## Live shadow API smoke tests" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/v20-2-live-tests.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "## Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "If local tests pass and the live shadow endpoint reports V20.2.0, the next stage is V20.3 controlled visitor cutover. Do **not** replace the production search from this workflow." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare compact V20.2 audit artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v20-2-audit"
          cp -f data/search-v20/manifest.json "$RUNNER_TEMP/v20-2-audit/" 2>/dev/null || true
          cp -f data/search-v20/samples.json "$RUNNER_TEMP/v20-2-audit/" 2>/dev/null || true
          cp -f data/search-v20/REPORT.md "$RUNNER_TEMP/v20-2-audit/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/v20-2-local-tests.json" "$RUNNER_TEMP/v20-2-audit/local-tests.json" 2>/dev/null || true
          cp -f /tmp/v20-2-live-tests.json "$RUNNER_TEMP/v20-2-audit/live-tests.json" 2>/dev/null || true

      - name: Upload compact V20.2 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v20-2-persistent-shadow-search-audit
          path: ${{ runner.temp }}/v20-2-audit
          retention-days: 14
          if-no-files-found: warn
