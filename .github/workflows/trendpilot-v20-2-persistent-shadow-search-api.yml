          echo "- Existing visitor UI: **UNCHANGED**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing production product search endpoint: **UNCHANGED**" >> "$GITHUB_STEP_SUMMARY"
          echo "- New shadow endpoint: \`/api/products-v20-shadow\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Netlify shadow endpoint ready during this run: **${{ steps.deploy.outputs.ready || 'not-checked' }}**" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
