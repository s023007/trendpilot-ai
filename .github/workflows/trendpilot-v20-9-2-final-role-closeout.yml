name: TrendPilot V20.9.2 — Final Role Closeout

on:
  workflow_run:
    workflows: ["TrendPilot V20.9.2 — Universal Product Quality Gate"]
    types: [completed]

permissions:
  contents: write

jobs:
  final-role-closeout:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main after product build
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild authoritative product projection
        run: |
          python scripts/build-v20-8-universal-discovery.py
          python scripts/clean-v20-8-universal-output.py
          python scripts/clean-v20-8-brand-truth.py
          python scripts/quality-gate-v20-9-all-products.py
          python scripts/refine-v20-9-2-residual-unclassified.py
          python scripts/fix-v20-9-2-final-role-anomalies.py
          python scripts/export-v20-9-runtime-data.py
          python scripts/audit-v20-9-all-products.py
          python scripts/finalize-v20-8-9-rare-closeout.py
          python scripts/qa-v20-9-product-smoke.py
          python scripts/report-v20-9-2-release-contract.py

      - name: Final semantic contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('data/v20-9/quality-report.json').read_text())
          f=json.loads(Path('data/v20-9/final-role-fix-report.json').read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text())
          c=json.loads(Path('data/v20-9/contract-debug.json').read_text())
          m=json.loads(Path('data/v20-8/manifest.json').read_text())
          rare=json.loads(Path('data/v20-8/rare-index.json').read_text())
          assert c['passed'], c['failed']
          assert q['records']==52031
          assert q['unclassifiedBefore']==9355
          assert q['unclassifiedAfter']==2453
          assert q['unclassifiedAfterPct']==4.71
          assert q['residualClassified']==935
          assert q['blockedSellerLeaks']==0
          assert q['immutableCommerceFieldsChanged']==0
          assert f['fixes']==3, f['fixes']
          assert d['roleAnomalies']['mainWithStrongAccessoryGrammar']['count']==0
          assert d['roleAnomalies']['mainWithStrongReplacementGrammar']['count']==0
          for k in ('phoneNonMain','tabletNonMain','laptopNonMain','smartwatchNonMain','headphonesNonMain'):
              assert d['roleAnomalies'][k]['count']==0, (k,d['roleAnomalies'][k]['count'])
          assert rt['productBuckets']==256
          assert rt['maxProductBucketBytes']<500000
          assert rt['familyStrategy']=='role-balanced'
          assert m['truthCleanup']['finalRoleAnomalyFixVersion']=='20.9.2'
          assert m['truthCleanup']['residualUnclassifiedPassVersion']=='20.9.2'
          assert m['truthCleanup']['rareCloseoutVersion']=='20.8.9'
          assert len(rare)==72
          print('V20.9.2 FINAL ROLE CLOSEOUT PASS')
          PY
          node --check js/universal-discovery-v20-9-1.js
          node --check js/finder-shell-v20-9.js
          node --check js/item-detail-v20-9.js
          node --check js/compare-v20-9.js
          if git status --short | grep -E 'data/catalog-v19|data/.*(tpid|tpvid|tpoid|identity)'; then
            echo 'Unexpected V19 identity/canonical mutation'
            exit 1
          fi

      - name: Write final closeout summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          q=json.loads(Path('data/v20-9/quality-report.json').read_text())
          f=json.loads(Path('data/v20-9/final-role-fix-report.json').read_text())
          d=json.loads(Path('data/v20-9/diagnostic.json').read_text())
          rt=json.loads(Path('data/v20-9/runtime-manifest.json').read_text())
          print('# TrendPilot V20.9.2 — Final Role Closeout')
          print(f"- Records: **{q['records']:,}**")
          print(f"- Unclassified: **{q['unclassifiedBefore']:,} → {q['unclassifiedAfter']:,} ({q['unclassifiedAfterPct']}%)**")
          print(f"- Residual high-confidence classifications: **{q['residualClassified']:,}**")
          print(f"- Final explicit role anomalies fixed: **{f['fixes']}**")
          print(f"- Strong accessory grammar still Main: **{d['roleAnomalies']['mainWithStrongAccessoryGrammar']['count']}**")
          print(f"- Strong replacement grammar still Main: **{d['roleAnomalies']['mainWithStrongReplacementGrammar']['count']}**")
          print(f"- Runtime buckets: **{rt['productBuckets']}**, max **{rt['maxProductBucketBytes']:,} bytes**")
          print('- V19 identity rebuilt: **NO**')
          print('- Seller policy changed: **NO**')
          print('- GEO import filtering added: **NO**')
          PY

      - name: Commit final role-correct runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/v20-8/manifest.json data/v20-8/taxonomy-summary.json data/v20-8/rare-index.json data/v20-9 rare-used/finds sitemap-v20-8.xml robots.txt
          if git diff --cached --quiet; then
            echo 'No final runtime changes to commit'
            exit 0
          fi
          git commit -m 'TrendPilot V20.9.2 finalize all-product roles and runtime'
          git push origin main
