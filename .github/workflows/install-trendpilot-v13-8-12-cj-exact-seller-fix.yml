name: Install TrendPilot V13.8.12 CJ Exact Seller Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v13-8-12-cj-exact-seller-fix
  cancel-in-progress: false

jobs:
  install-cj-exact-seller-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply structure-aware CJ fix
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          VERSION = "13.8.12"
          ROOT = Path(".")
          SCRIPT = ROOT / "js" / "site-v13-5.js"
          REPORT = ROOT / "data" / "cj-exact-seller-fix-report.json"
          APPROVED_FILE = ROOT / "data" / "cj-approved-advertisers.json"

          if not SCRIPT.exists():
              raise SystemExit("js/site-v13-5.js was not found.")

          text = SCRIPT.read_text(encoding="utf-8")
          patches = []

          text = re.sub(
              r"\n?\s*// TP_CJ_EXACT_SELLER_FIX_START[\s\S]*?"
              r"// TP_CJ_EXACT_SELLER_FIX_END\s*\n?",
              "\n",
              text,
              count=1,
          )

          helper = r'''
            // TP_CJ_EXACT_SELLER_FIX_START
            const TP_CJ_FIX_VERSION = "13.8.12";
            const TP_CJ_APPROVED_IDS = new Set([
              "2357926",
              "7287203",
              "5893489",
              "7227612",
              "4837117",
              "4295086",
              "4368684"
            ]);
            const TP_CJ_APPROVED_SELLERS = new Set([
              "diecast",
              "diecastcom",
              "fragranceshop",
              "fragranceshopcom",
              "thefragranceshop",
              "karaca",
              "karacaeu",
              "karacaeurope",
              "mfimedical",
              "mfi",
              "nordvpn",
              "nordvpncom",
              "pandahall",
              "pandahallcom",
              "tripcom",
              "tripcomglobal"
            ]);
            const TP_CJ_TRACKING_HOST_RE =
              /(?:^|\.)(?:anrdoezrs\.net|apmebf\.com|awltovhc\.com|commission-junction\.com|dpbolvw\.net|emjcd\.com|ftjcfx\.com|jdoqocy\.com|kqzyfj\.com|lduhtrp\.net|qksrv\.net|tkqlhce\.com)$/i;

            function tpCjKey(value) {
              return lower(value).replace(/[^a-z0-9]+/g, "");
            }

            function tpCjFirst(record, keys) {
              for (const key of keys) {
                const value = record && record[key];
                if (value !== undefined && value !== null && String(value).trim() !== "") {
                  return value;
                }
              }
              return "";
            }

            function tpCjSeller(record) {
              return clean(tpCjFirst(record, [
                "advertiser", "advertiserName", "advertiser_name",
                "seller", "sellerName", "seller_name",
                "merchant", "merchantName", "merchant_name"
              ]));
            }

            function tpCjAdvertiserId(record) {
              return String(tpCjFirst(record, [
                "advertiserId", "advertiser_id", "advertiser-id",
                "advertiserCid", "advertiser_cid", "cid"
              ]) || "").replace(/\D+/g, "");
            }

            function tpCjUrl(record) {
              return clean(tpCjFirst(record, [
                "affiliateUrl", "affiliate_url", "buyUrl", "buy_url",
                "productUrl", "product_url", "clickUrl", "click_url",
                "url", "destination", "destinationUrl", "destination_url"
              ]));
            }

            function tpCjTrackingUrl(value) {
              if (!validUrl(value)) return false;
              try {
                return TP_CJ_TRACKING_HOST_RE.test(new URL(value).hostname.toLowerCase());
              } catch {
                return false;
              }
            }

            function tpCjKnownSellerFromBridge(sellerKey) {
              const lists = [
                window.TRENDPILOT_CJ_KNOWN_SELLERS,
                window.TRENDPILOT_CJ_SELLERS,
                window.TRENDPILOT_CJ_ADVERTISERS,
                window.TREND_PILOT_CJ_SELLERS
              ];

              return lists.some(list => Array.isArray(list) && list.some(value => {
                const name = typeof value === "string"
                  ? value
                  : value && (value.name || value.advertiser || value.seller || value.merchant);
                return tpCjKey(name) === sellerKey;
              }));
            }

            function tpIsCjRecord(record) {
              if (!record) return false;

              const sellerKey = tpCjKey(tpCjSeller(record));
              const signature = lower([
                record.network,
                record.networkName,
                record.network_name,
                record.provider,
                record.source,
                record.sourceName,
                record.source_name,
                record.sourceId,
                record.source_id,
                record.program,
                record.programme,
                record.platform,
                record.affiliateNetwork,
                record.affiliate_network,
                record.id,
                record.clusterKey
              ].map(value => clean(value)).join(" "));

              return Boolean(
                tpCjTrackingUrl(tpCjUrl(record))
                || tpCjKnownSellerFromBridge(sellerKey)
                || signature.includes("commission junction")
                || /(^|[^a-z0-9])cj([^a-z0-9]|$)/i.test(signature)
                || /\bcj[-_:]/i.test(signature)
              );
            }

            function tpCjAllowed(record) {
              if (!record) return false;
              if (!tpIsCjRecord(record)) return true;

              const id = tpCjAdvertiserId(record);
              const sellerKey = tpCjKey(tpCjSeller(record));

              return TP_CJ_APPROVED_IDS.has(id)
                || TP_CJ_APPROVED_SELLERS.has(sellerKey);
            }

            window.TRENDPILOT_CJ_GUARD_STATUS = {
              version: TP_CJ_FIX_VERSION,
              mode: "exact-seven-search-and-seller",
              approvedAdvertisers: 7
            };
            // TP_CJ_EXACT_SELLER_FIX_END
          '''

          valid_url_pattern = re.compile(
              r'(\s*const\s+validUrl\s*=\s*\(v\)\s*=>\s*/\^https\?:\\\/\\\//i'
              r'\.test\(clean\(v\)\);\s*)'
          )
          match = valid_url_pattern.search(text)
          if not match:
              raise SystemExit("The validUrl insertion point was not found.")

          text = text[:match.end()] + "\n" + helper + "\n" + text[match.end():]
          patches.append("helper-installed")

          if "if(!tpCjAllowed(p))return false;" not in text:
              text, count = re.subn(
                  r'(let\s+out\s*=\s*rows\.filter\(p\s*=>\s*\{)',
                  r'\1if(!tpCjAllowed(p))return false;',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("The search-results filter point was not found.")
              patches.append("search-results-filtered")
          else:
              patches.append("search-results-already-filtered")

          merchant_replacement = (
              'if(merchant){'
              'const current=merchant.value; '
              'const sellerRows=rows.filter(tpCjAllowed); '
              'merchant.innerHTML=\'<option value="">All sellers</option>\'+'
              'uniq(sellerRows.map(p=>p.advertiser)).sort().map(v=>'
              '`<option value="${esc(v)}">${esc(v)}</option>`).join(""); '
              'merchant.value=current;'
              '}'
          )

          populate_start = text.find("function populateFilters()")
          if populate_start < 0:
              raise SystemExit("function populateFilters() was not found.")

          populate_end = text.find("function updateFilterCount()", populate_start)
          if populate_end < 0:
              raise SystemExit("The end of populateFilters() was not found.")

          populate_block = text[populate_start:populate_end]

          populate_block, merchant_count = re.subn(
              r'if\s*\(\s*merchant\s*\)\s*\{'
              r'[\s\S]*?merchant\.value\s*=\s*current\s*;\s*\}',
              merchant_replacement,
              populate_block,
              count=1,
          )

          if merchant_count != 1:
              context = populate_block[-1800:]
              print("populateFilters context follows:")
              print(context)
              raise SystemExit("The merchant dropdown block was not found.")

          text = text[:populate_start] + populate_block + text[populate_end:]
          patches.append("seller-dropdown-filtered")

          protected_fragments = [
              "const data = await r.json(); return (data.products || []).map(normalizeProduct);",
              "function mergeProducts(rows) {",
              "state.products = [...map.values()];",
              "function renderFinder() {"
          ]
          for fragment in protected_fragments:
              if fragment not in text:
                  raise SystemExit(f"Protected product-loading code is missing: {fragment}")

          SCRIPT.write_text(text, encoding="utf-8")

          approved = {
              "version": VERSION,
              "advertisers": [
                  {"id": "2357926", "name": "Diecast"},
                  {"id": "7287203", "name": "FragranceShop.com"},
                  {"id": "5893489", "name": "Karaca EU"},
                  {"id": "7227612", "name": "MFI Medical"},
                  {"id": "4837117", "name": "NordVPN"},
                  {"id": "4295086", "name": "PandaHall"},
                  {"id": "4368684", "name": "Trip.com (Global)"}
              ]
          }
          APPROVED_FILE.parent.mkdir(parents=True, exist_ok=True)
          APPROVED_FILE.write_text(
              json.dumps(approved, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          changed_html = 0
          for path in ROOT.rglob("*.html"):
              if ".git" in path.parts:
                  continue

              html = path.read_text(encoding="utf-8")
              updated = re.sub(
                  r'((?:src)=["\'](?:/|\.\./|\./)?js/site-v13-5\.js)'
                  r'(?:\?[^"\']*)?(["\'])',
                  rf'\1?v={VERSION}\2',
                  html,
                  flags=re.IGNORECASE,
              )

              if updated != html:
                  path.write_text(updated, encoding="utf-8")
                  changed_html += 1

          REPORT.parent.mkdir(parents=True, exist_ok=True)
          REPORT.write_text(
              json.dumps(
                  {
                      "version": VERSION,
                      "generatedAt": datetime.now(timezone.utc).isoformat(),
                      "status": "installed",
                      "patches": patches,
                      "approvedCjAdvertiserCount": 7,
                      "htmlFilesCacheBusted": changed_html,
                      "productLoadingPathTouched": False
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "status": "installed",
              "version": VERSION,
              "patches": patches,
              "htmlFilesCacheBusted": changed_html
          }, indent=2))
          PY

      - name: Validate exact seller fix
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js

          python - <<'PY'
          import json
          from pathlib import Path

          script = Path("js/site-v13-5.js").read_text(encoding="utf-8")
          report = json.loads(
              Path("data/cj-exact-seller-fix-report.json").read_text(encoding="utf-8")
          )

          assert report["status"] == "installed", report
          assert report["approvedCjAdvertiserCount"] == 7, report
          assert report["productLoadingPathTouched"] is False, report
          assert "if(!tpCjAllowed(p))return false;" in script
          assert "const sellerRows=rows.filter(tpCjAllowed);" in script
          assert "uniq(sellerRows.map(p=>p.advertiser))" in script
          assert "const data = await r.json(); return (data.products || []).map(normalizeProduct);" in script
          assert "function mergeProducts(rows) {" in script
          assert "function renderFinder() {" in script

          print("V13.8.12 validation passed.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "V13.8.12 is already installed."
            exit 0
          fi

          git commit -m "fix: filter CJ sellers without touching product loading"

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 4))
          done

          echo "Unable to push after three attempts."
          exit 1
