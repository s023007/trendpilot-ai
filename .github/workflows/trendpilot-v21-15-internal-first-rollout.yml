name: TrendPilot V21.15 — Internal First Seller Routing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-15-internal-first-rollout.yml

permissions:
  contents: write

concurrency:
  group: trendpilot-v21-15-internal-first
  cancel-in-progress: false

jobs:
  rollout-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Inject internal-first guard into public HTML
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          marker='seller-handoff-v21-15.js?v=21.15.0'
          tag='<script defer src="/js/seller-handoff-v21-15.js?v=21.15.0"></script>'
          changed=[]
          skipped=[]
          for p in Path('.').rglob('*.html'):
              parts=set(p.parts)
              if any(x in parts for x in {'.git','node_modules','artifacts','coverage'}):
                  continue
              if p.as_posix()=='handoff/index.html':
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except Exception:
                  skipped.append(p.as_posix()); continue
              if marker in s or '</body>' not in s.lower():
                  continue
              idx=s.lower().rfind('</body>')
              s=s[:idx]+tag+s[idx:]
              p.write_text(s,encoding='utf-8')
              changed.append(p.as_posix())

          Path('artifacts/v21-15-internal-first').mkdir(parents=True,exist_ok=True)
          Path('artifacts/v21-15-internal-first/injection.json').write_text(json.dumps({
              'version':'21.15.0','patchedHtml':len(changed),'skippedUnreadable':skipped,'sample':changed[:80]
          },indent=2),encoding='utf-8')
          print(f'Patched {len(changed)} HTML files with the V21.15 seller guard.')
          if not changed:
              print('All public HTML files were already current.')
          PY

      - name: Validate internal-first runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/seller-handoff-v21-15.js
          node --check scripts/qa-v21-15-internal-first.mjs
          node --check netlify/functions/product-preview-v20-9-6-mobile-polish.cjs
          grep -q 'seller-handoff-v21-15.js?v=21.15.0' deals/index.html
          grep -q 'seller-handoff-v21-15.js?v=21.15.0' find/index.html
          grep -q 'seller-handoff-v21-15.js?v=21.15.0' rare-used/index.html
          grep -q 'seller-handoff-v21-15.js?v=21.15.0' tickets/index.html
          grep -q 'seller-handoff-v21-15.js?v=21.15.0' deal/index.html
          grep -q 'seller-handoff-v21-15.js?v=21.15.0' coupon/index.html
          ! grep -q 'seller-handoff-v21-15.js' handoff/index.html

      - name: Commit sitewide V21.15 guard wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo 'All public HTML was already wired.'
          else
            git commit -m 'TrendPilot V21.15 enforce internal-first seller routing across public pages'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Wait for public V21.15 deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 50); do
            good=1
            for u in / /find/ /deals/ /rare-used/ /tickets/ /compare/ /products/ /price-watch/ /guides/ /sourcing/ /wholesale/ /software/ /deal/ /coupon/; do
              curl -fsSL --max-time 20 "https://trendpilotchoice.com${u}" -o /tmp/tp-page.html || { good=0; break; }
              grep -q 'seller-handoff-v21-15.js?v=21.15.0' /tmp/tp-page.html || { good=0; break; }
            done
            curl -fsSL --max-time 20 'https://trendpilotchoice.com/handoff/' -o /tmp/tp-handoff.html || good=0
            grep -q 'Seller handoff' /tmp/tp-handoff.html 2>/dev/null || good=0
            if [ "$good" = 1 ]; then
              echo 'V21.15 is live on all core public routes.'
              exit 0
            fi
            echo "Waiting for V21.15 deploy ($i/50)..."
            sleep 6
          done
          echo 'V21.15 did not become live on all core routes in time.'
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run sitewide internal-first mobile QA
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        run: node scripts/qa-v21-15-internal-first.mjs

      - name: Write summary
        if: always()
        shell: bash
        run: |
          echo '# TrendPilot V21.15 — Internal First Seller Routing' >> "$GITHUB_STEP_SUMMARY"
          if [ -s artifacts/v21-15-internal-first/injection.json ]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('artifacts/v21-15-internal-first/injection.json','utf8'));
          console.log(`- HTML pages wired: **${x.patchedHtml}**`);
          NODE
          fi
          if [ -s artifacts/v21-15-internal-first/report.json ]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/v21-15-internal-first/report.json','utf8'));
          console.log(`- Final mobile QA: **${r.passed?'PASS':'FAIL'}**`);
          for(const [k,v] of Object.entries(r.checks||{})) console.log(`- ${v?'✅':'❌'} ${k}`);
          if(r.failures?.length){console.log();console.log('```json');console.log(JSON.stringify(r.failures,null,2));console.log('```');}
          NODE
          else
            echo '- QA report was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload V21.15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v21-15-internal-first
          path: artifacts/v21-15-internal-first
          if-no-files-found: ignore
