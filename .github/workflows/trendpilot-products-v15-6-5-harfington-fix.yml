name: TrendPilot Products V15.6.5 Harfington Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-6-5-harfington-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-harfington:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Preserve Harfington seller and expand hose suggestions
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/tp_v15_6_5.py
          python /tmp/tp_v15_6_5.py

      - name: Validate V15.6.5
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site-v13-5.js
          node --check js/product-discovery-v15.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          site=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          discjs=Path("js/product-discovery-v15.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")
          disc=json.loads(Path("data/product-discovery-v15.json").read_text(encoding="utf-8"))

          required=[
              '"harrington":"Harfington Many GEOs"',
              '"hose":["hose","hoses","hose fitting"',
              "TP_PRESERVE_SELLER_V15_6_5",
              "preservedSeller",
              "/js/site-v13-5.js?v=15.6.5",
              "/js/product-discovery-v15.js?v=15.6.5",
              "/data/product-discovery-v15.json?v=15.6.5"
          ]
          blob=site+"\n"+discjs+"\n"+html
          missing=[x for x in required if x not in blob]
          if missing:
              raise SystemExit("Missing markers: "+", ".join(missing))

          if disc.get("version")!="15.6.5":
              raise SystemExit("Wrong product discovery version.")

          h=disc.get("byLetter",{}).get("h",[])
          values=[str(x.get("value","")).lower() for x in h if isinstance(x,dict)]
          for term in ("hose","hose fittings","hydraulic hose"):
              if term not in values:
                  raise SystemExit("Missing autocomplete term: "+term)

          if "Harfington Many GEOs" not in disc.get("approvedProductSellers",[]):
              raise SystemExit("Harfington missing from discovery seller registry.")

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={
              "js/site-v13-5.js",
              "js/product-discovery-v15.js",
              "data/product-discovery-v15.json",
              "find/index.html"
          }
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected changed files: "+", ".join(sorted(unexpected)))

          for marker in ("TP_CJ_SEARCH_BRIDGE_START","TP_LENOVO_DIRECT_LINK_V15_5_3_START"):
              if marker not in site:
                  raise SystemExit("Safety marker missing: "+marker)

          print("V15.6.5 validation passed.")
          print("- Seller survives a new search instead of resetting to All sellers.")
          print("- Harfington/Harrington aliases both canonicalize.")
          print("- hose, hose fittings and hydraulic hose are autocomplete entries.")
          print("- Real Harfington hose/fitting product titles were added when present.")
          PY

      - name: Publish V15.6.5
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             js/site-v13-5.js             js/product-discovery-v15.js             data/product-discovery-v15.json             find/index.html

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.6.5 already installed."
            exit 0
          fi

          git commit -m "fix: preserve Harfington seller and add hose autocomplete"
          git push origin HEAD:main
