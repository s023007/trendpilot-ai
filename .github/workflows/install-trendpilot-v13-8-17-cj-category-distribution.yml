          tickets_path.write_text(tickets_page, encoding="utf-8")

          hub_page = '''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>CJ Partner Directory — TrendPilot AI</title><meta name="description" content="Connected CJ partners separated into physical products, software services and travel bookings."><link rel="canonical" href="https://trendpilotchoice.com/cj-partners/"><link rel="icon" href="/images/favicon-v4.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/style-v13-2.css?v=13.2.0"><link rel="stylesheet" href="/css/style-v13-5.css?v=13.5.0"><link rel="stylesheet" href="/css/cj-category-distribution.css?v=13.8.17"></head>
          <body><header class="tp-header"><div class="tp-shell tp-nav"><a class="tp-brand" href="/"><img src="/images/logo-v4.svg" alt="" width="42" height="42"><span>TrendPilot <em>AI</em></span></a><a class="tp-btn tp-btn-light" href="/deals/">Back to deals</a></div></header><main>
          <section class="tp-cj-directory-section tp-cj-white"><div class="tp-shell"><div class="tp-cj-directory-head"><div><span class="tp-kicker">Connected CJ partners</span><h1>Each company appears in the section that matches what it sells.</h1><p>Physical products stay in product discovery, NordVPN appears as software, and Trip.com appears under travel and bookings.</p></div></div></div></section>
          <section class="tp-cj-directory-section"><div class="tp-shell"><div class="tp-cj-directory-head"><div><span class="tp-kicker">Physical products</span><h2>Product sellers</h2><p>Individual items enter comparison only when CJ supplies a real title, image, price and product URL.</p></div></div><div class="tp-cj-directory-grid" data-cj-directory="products"></div></div></section>
          <section class="tp-cj-directory-section tp-cj-white"><div class="tp-shell"><div class="tp-cj-directory-head"><div><span class="tp-kicker">Digital service</span><h2>Software & privacy</h2><p>Subscription services use service and plan links instead of physical-product cards.</p></div></div><div class="tp-cj-directory-grid" data-cj-directory="software"></div></div></section>
          <section class="tp-cj-directory-section"><div class="tp-shell"><div class="tp-cj-directory-head"><div><span class="tp-kicker">Bookings</span><h2>Travel, tickets & experiences</h2><p>Booking prices remain live and date-dependent on the provider.</p></div></div><div class="tp-cj-directory-grid" data-cj-directory="travel"></div><div class="tp-cj-disclosure" data-cj-disclosure></div></div></section>
          </main><script defer src="/js/cj-category-distribution.js?v=13.8.17"></script></body></html>'''
          (ROOT / "cj-partners" / "index.html").write_text(
