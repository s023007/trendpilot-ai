          (DATA / "cj-products.json").write_text(
              json.dumps(products_payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          offers_payload = json.loads((DATA / "cj-offers.json").read_text(encoding="utf-8"))
          enriched_offers = []
          offers_by_partner = {row["id"]: [] for row in PARTNERS}
          for row in offers_payload.get("offers") or []:
              advertiser_id = clean(row.get("advertiserId"))
              partner = META.get(advertiser_id)
              if not partner:
                  continue
              item = {
                  **row,
                  "advertiser": partner["name"],
                  "entityType": partner["entityType"],
                  "surface": partner["surface"],
                  "group": partner["group"],
                  "family": partner["family"],
              }
              enriched_offers.append(item)
              offers_by_partner[advertiser_id].append(item)

          offers_payload["version"] = VERSION
