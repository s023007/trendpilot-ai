          def public_offer(row: dict[str, Any]) -> dict[str, Any]:
              return {
                  "id": row.get("id", ""),
                  "name": row.get("name", ""),
                  "description": row.get("description", ""),
                  "url": row.get("url", ""),
                  "destination": row.get("destination", ""),
                  "linkType": row.get("linkType", ""),
                  "promotionType": row.get("promotionType", ""),
                  "couponCode": row.get("couponCode", ""),
              }

          def offer_score(partner: dict[str, Any], row: dict[str, Any]) -> tuple[int, int, str]:
              text = clean(f'{row.get("name")} {row.get("description")} {row.get("promotionType")}').lower()
              score = 0
              if clean(row.get("linkType")).lower() == "text link":
                  score += 20
              if clean(row.get("promotionType")).lower() in {"product", "sale/discount", "coupon"}:
                  score += 8
              if any(word in text for word in ["shop now", "browse", "deal", "discount", "official"]):
                  score += 5
              if partner["name"] == "NordVPN" and any(
                  word in text for word in ["vpn", "2-year", "1-year", "monthly", "basic", "plus", "complete"]
              ):
                  score += 10
              if partner["name"] == "Trip.com (Global)" and any(
                  word in text for word in ["hotel", "flight", "train", "attraction", "car rental", "travel"]
              ):
                  score += 10
              return (-score, len(clean(row.get("destination"))), clean(row.get("name")).lower())

          directory_rows = []
