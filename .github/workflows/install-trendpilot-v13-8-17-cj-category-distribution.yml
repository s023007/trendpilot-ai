                  "searchQuery": "craft jewelry making supplies",
                  "icon": "PH",
                  "description": "Beads, findings, tools, cords, chains and supplies for crafts and jewelry making.",
              },
              {
                  "id": "4368684",
                  "name": "Trip.com (Global)",
                  "aliases": ["trip.com global", "trip.com", "tripcom"],
                  "entityType": "travel_booking",
                  "surface": "tickets",
                  "group": "travel-bookings",
                  "family": "travel-booking-platform",
                  "scope": "tickets",
                  "department": "Tickets, travel & bookings",
                  "specialty": "Flights, hotels, trains & activities",
