          )

          def insert_object_entries(source: str, const_name: str, entries: dict[str, str]) -> str:
              pattern = rf"(const {re.escape(const_name)}\s*=\s*\{{)([\s\S]*?)(\n\s*\}};)"
              match = re.search(pattern, source)
              if not match:
                  raise SystemExit(f"Could not find {const_name} in js/site-v13-5.js.")
              body = match.group(2).rstrip()
              additions = []
              for item_key, value in entries.items():
                  if re.search(rf'["\']{re.escape(item_key)}["\']\s*:', body):
                      continue
                  additions.append(f'    "{item_key}":{value}')
              if additions:
                  if body and not body.endswith(","):
                      body += ","
                  body += "\n" + ",\n".join(additions)
                  source = source[:match.start()] + match.group(1) + body + match.group(3) + source[match.end():]
              return source

          def insert_array_rows(source: str, const_name: str, rows: list[str]) -> str:
              pattern = rf"(const {re.escape(const_name)}\s*=\s*\[)([\s\S]*?)(\n\s*\];)"
              match = re.search(pattern, source)
