              <section style="width:min(1120px,calc(100% - 32px));margin:36px auto;padding:24px;border:1px solid #dce3e6;border-radius:24px;background:linear-gradient(135deg,#eef3ff,#edfff8)"><p style="margin:0 0 8px;font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#2857d9">CJ partner directory</p><h2 style="margin:0 0 10px">Products, software and travel are now separated correctly.</h2><p style="margin:0 0 18px;color:#626d75;line-height:1.65">Browse all seven connected CJ companies and see which TrendPilot section each one belongs to.</p><a href="/cj-partners/" style="display:inline-flex;padding:13px 17px;border-radius:14px;background:#3159e8;color:#fff;text-decoration:none;font-weight:850">Open the CJ partner directory</a></section>
