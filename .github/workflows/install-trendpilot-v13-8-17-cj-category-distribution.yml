                  "icon": "TR",
                  "description": "Travel booking services for flights, hotels, trains, attractions, activities and transport.",
              },
          ]
          META = {row["id"]: row for row in PARTNERS}
          PRODUCT_IDS = {row["id"] for row in PARTNERS if row["entityType"] == "product"}

          def clean(value: Any) -> str:
              return re.sub(r"\s+", " ", str(value or "")).strip()

          def valid_url(value: Any) -> bool:
              return bool(re.match(r"^https?://", clean(value), flags=re.I))

          def classify_product(partner: dict[str, Any], title: str) -> tuple[str, str]:
              text = clean(title).lower()
              if partner["name"] == "Karaca EU":
                  routes = [
                      ("coffee-tea-machines", r"\b(coffee|espresso|tea maker|kettle|turkish coffee)\b"),
                      ("kitchen-appliances", r"\b(blender|mixer|toaster|air fryer|appliance|vacuum)\b"),
                      ("dinnerware", r"\b(dinnerware|dinner set|plate|bowl|tableware|serveware)\b"),
                      ("cutlery", r"\b(cutlery|flatware|fork|knife set|spoon)\b"),
                      ("home-textiles", r"\b(bedding|duvet|pillow|towel|blanket|textile)\b"),
                      ("cookware", r"\b(cookware|pot|pan|casserole|pressure cooker|frying)\b"),
                  ]
                  for family, pattern in routes:
                      if re.search(pattern, text):
                          return "home-kitchen", family
                  return "home-kitchen", "home-accessories"

              if partner["name"] == "MFI Medical":
                  routes = [
                      ("diagnostic-equipment", r"\b(diagnostic|otoscope|ophthalmoscope|stethoscope|ultrasound|ecg|ekg)\b"),
                      ("patient-monitoring", r"\b(patient monitor|vital signs|pulse oximeter|blood pressure|spo2)\b"),
                      ("exam-room-equipment", r"\b(exam table|exam room|medical stool|exam light)\b"),
                      ("hospital-furniture", r"\b(hospital bed|stretcher|medical cart|cabinet|furniture)\b"),
                      ("emergency-equipment", r"\b(emergency|defibrillator|aed|resuscitation|trauma)\b"),
                      ("rehabilitation-equipment", r"\b(rehabilitation|wheelchair|walker|mobility|therapy)\b"),
                      ("medical-supplies", r"\b(supplies|glove|syringe|dressing|bandage|disposable)\b"),
                  ]
                  for family, pattern in routes:
                      if re.search(pattern, text):
                          return "health-medical", family
                  return "health-medical", "medical-equipment"

              if partner["name"] == "PandaHall":
                  routes = [
                      ("beads", r"\b(bead|beads|gemstone beads|glass beads)\b"),
                      ("jewelry-findings", r"\b(findings|clasp|jump ring|earring hook|pendant setting)\b"),
                      ("jewelry-making-tools", r"\b(pliers|jewelry tool|tool kit|beading needle)\b"),
                      ("cords-chains-wires", r"\b(cord|chain|wire|thread|string)\b"),
                      ("storage-organization", r"\b(storage|organizer|display|box|container)\b"),
                      ("finished-jewelry", r"\b(necklace|bracelet|earrings|ring)\b"),
                      ("sewing-diy", r"\b(sewing|embroidery|crochet|knitting|fabric)\b"),
                  ]
                  for family, pattern in routes:
                      if re.search(pattern, text):
                          return "arts-crafts", family
                  return "arts-crafts", "craft-supplies"

              return partner["group"], partner["family"]

          products_payload = json.loads((DATA / "cj-products.json").read_text(encoding="utf-8"))
          raw_products = products_payload.get("products") or []
          products = []
          for row in raw_products:
              advertiser_id = clean(row.get("advertiserId"))
              if advertiser_id not in PRODUCT_IDS:
                  continue
              partner = META[advertiser_id]
              group, family = classify_product(partner, clean(row.get("name")))
              item = {
