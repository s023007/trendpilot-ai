name: TrendPilot V21.10 Phone Purity E2E

on:
  push:
    branches:
      - main
      - fix/phone-purity-v21-10
    paths:
      - '.github/workflows/trendpilot-v21-10-phone-purity-e2e.yml'
      - 'find/index.html'
      - 'js/universal-discovery-v20-9-1.js'
      - 'data/v20-9/phone-device-samples.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-phone-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate strict phone dataset and runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check js/universal-discovery-v20-9-1.js
          python <<'PY'
          import json
          from pathlib import Path
          runtime=Path('js/universal-discovery-v20-9-1.js').read_text(encoding='utf-8')
          finder=Path('find/index.html').read_text(encoding='utf-8')
          data=json.loads(Path('data/v20-9/phone-device-samples.json').read_text(encoding='utf-8'))
          sellers=data['sellers']
          expected={'Alibaba','AliExpress','Geekbuying','TikTok Shop US'}
          assert set(sellers)==expected, set(sellers)
          assert sellers['AliExpress']==['eb935d316cad43'], sellers['AliExpress']
          flat={x for ids in sellers.values() for x in ids}
          for bad in ('07d8fed6c3d11e','4ee3556fde707f','c4bf181f847f81'):
              assert bad not in flat, bad
          assert 'RUNTIME_VERSION = "21.10.1"' in runtime
          assert 'phone-device-samples.json?v=21.10.1' in runtime
          assert 'genericFamily&&family==="phone"' in runtime
          assert 'universal-discovery-v20-9-1.js?v=21.10.1' in finder
          print('Strict phone static contract PASS', {k:len(v) for k,v in sellers.items()})
          PY

  live-phone-mobile:
    if: github.ref == 'refs/heads/main'
    needs: static-phone-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TP_BASE_URL: https://trendpilotchoice.com
    steps:
      - uses: actions/checkout@v5
      - name: Wait for production deploy
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 42); do
            finder=$(curl -fsSL "${TP_BASE_URL}/find/" || true)
            phones=$(curl -fsSL "${TP_BASE_URL}/data/v20-9/phone-device-samples.json?v=21.10.1" || true)
            if printf '%s' "$finder" | grep -q 'universal-discovery-v20-9-1.js?v=21.10.1' \
              && printf '%s' "$phones" | grep -q 'eb935d316cad43' \
              && printf '%s' "$phones" | grep -q 'TikTok Shop US'; then
              echo 'Strict phone runtime is live'; exit 0
            fi
            echo "waiting for production $i/42"; sleep 10
          done
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify phone results on mobile
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const BASE=process.env.TP_BASE_URL;
          const banned=/\b(?:solar\s+panel|usb\s+connector|socket\s+dip|earpiece\s+speaker|screen\s+protector|tempered\s+glass|phone\s+case|protective\s+case|power\s*bank|charger\s+cable|charging\s+station|repair\s+tool|screwdriver|sim\s+card\s+tray|back\s+housing|watch\s+band|projector)\b/i;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2.5,isMobile:true,hasTouch:true});
            const page=await ctx.newPage();
            page.setDefaultTimeout(50000);
            await page.goto(`${BASE}/find/?q=phone&engine=v2064&universal=1`,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>{
              const vals=[...document.querySelectorAll('[data-filter-merchant] option')].map(o=>o.value).filter(Boolean);
              return vals.includes('AliExpress') && vals.includes('TikTok Shop US') && document.querySelectorAll('[data-v209-card]').length>=4;
            });
            await page.waitForTimeout(500);

            const snapshot=await page.evaluate(()=>({
              sellers:[...document.querySelectorAll('[data-filter-merchant] option')].map(o=>o.value).filter(Boolean),
              cards:[...document.querySelectorAll('[data-v209-card]')].map(x=>({seller:x.getAttribute('data-v209-seller'),title:(x.querySelector('h3')?.textContent||'').trim()}))
            }));
            const expected=['Alibaba','AliExpress','Geekbuying','TikTok Shop US'];
            const missing=expected.filter(x=>!snapshot.sellers.includes(x));
            const unexpected=snapshot.sellers.filter(x=>!expected.includes(x));
            if(missing.length)throw new Error(`Missing genuine phone sellers: ${missing.join(', ')}`);
            if(unexpected.length)throw new Error(`Non-phone sellers leaked into phone filter: ${unexpected.join(', ')}`);
            if(snapshot.sellers.includes('Sunsky-online WW')||snapshot.sellers.includes('Govee Many GEOs'))throw new Error('Seller with no genuine phone leaked into phone filter');
            const badCards=snapshot.cards.filter(x=>banned.test(x.title));
            if(badCards.length)throw new Error(`Non-phone cards leaked: ${JSON.stringify(badCards)}`);
            for(const seller of expected){
              if(!snapshot.cards.some(x=>x.seller===seller))throw new Error(`${seller} missing from All sellers results`);
            }

            const select=page.locator('[data-filter-merchant]');
            await select.selectOption('AliExpress');
            await page.waitForFunction(()=>{
              const cards=[...document.querySelectorAll('[data-v209-card]')];
              return cards.length>0 && cards.every(x=>x.getAttribute('data-v209-seller')==='AliExpress');
            });
            const ali=await page.locator('[data-v209-card] h3').allTextContents();
            if(ali.length!==1)throw new Error(`Expected one genuine AliExpress phone, got ${ali.length}`);
            if(banned.test(ali[0]))throw new Error(`AliExpress false phone survived: ${ali[0]}`);
            if(!/mobile phone|phone/i.test(ali[0]))throw new Error(`AliExpress result does not look like a phone: ${ali[0]}`);

            await select.selectOption('');
            await page.waitForFunction(()=>new Set([...document.querySelectorAll('[data-v209-card]')].map(x=>x.getAttribute('data-v209-seller'))).size>=4);
            console.log(JSON.stringify({sellers:snapshot.sellers,firstPage:snapshot.cards,aliExpress:ali},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
