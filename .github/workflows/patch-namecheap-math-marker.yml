name: Patch Namecheap Math Marker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-namecheap-math-marker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Update math public verification marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/namecheap-full-static-auto-deploy.yml')
          s=p.read_text()
          old="'/math/': ['مسألة رياضيات أوقفتك؟']"
          new="'/math/': ['افهم الرياضيات بطريقة']"
          if old not in s:
              raise SystemExit('old math marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit verifier update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendpilot-math-redesign'
          git config user.email '39025908+s023007@users.noreply.github.com'
          git add .github/workflows/namecheap-full-static-auto-deploy.yml
          git commit -m 'fix: verify redesigned math page marker'
          git push origin HEAD:main
