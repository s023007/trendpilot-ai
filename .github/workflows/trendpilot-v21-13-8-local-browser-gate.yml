name: TrendPilot V21.13.8 — Local Browser + Live Release Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-13-8-local-browser-gate.yml
      - scripts/qa-v21-13-8-local-browser.py
      - js/packed-browse-v21-13-8.js
      - find/index.html
      - data/v20-9/footwear-seller-samples.json
      - data/v20-9/seller-browse-samples.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Check runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/packed-browse-v21-13-8.js
          python -m py_compile scripts/qa-v21-13-8-local-browser.py
      - name: Run deterministic local Chromium and exact live-deployment gate
        run: python scripts/qa-v21-13-8-local-browser.py
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v21-13-8-local-browser-gate
          path: artifacts/v21-13-8-local-browser
          if-no-files-found: ignore
