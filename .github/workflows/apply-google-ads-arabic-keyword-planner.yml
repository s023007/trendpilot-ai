name: Apply Google Ads Arabic Keyword Planner

on:
  push:
    paths:
      - 'marketing/google-ads/manchester-derby-sa/keyword-planner-arabic-sa-2026-08-26.json'
      - '.github/scripts/apply_google_ads_arabic_planner.py'
      - '.github/workflows/apply-google-ads-arabic-keyword-planner.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Arabic Planner review
        run: python .github/scripts/apply_google_ads_arabic_planner.py

      - name: Validate campaign draft
        run: python .github/scripts/validate_google_ads_campaign.py

      - name: Commit campaign update
        run: |
          if git diff --quiet; then
            echo "No campaign changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/google-ads/manchester-derby-sa/campaign.json
          git commit -m "ads: apply Arabic Keyword Planner launch decision"
          git push origin HEAD:main
