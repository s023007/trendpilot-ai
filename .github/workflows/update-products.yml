name: Update trends and affiliate products

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:37 UTC (06:37 Oman time).
    - cron: "37 2 * * *"

permissions:
  contents: write

concurrency:
  group: trendpilot-daily-engine
  cancel-in-progress: true

jobs:
  discover-and-match:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest all enabled affiliate sources
        env:
          ADMITAD_ALIEXPRESS_FEED_25_40: ${{ secrets.ADMITAD_ALIEXPRESS_FEED_25_40 }}
          AFFILIATE_SOURCE_URLS_JSON: ${{ secrets.AFFILIATE_SOURCE_URLS_JSON }}
        run: python automation/source_ingestion.py

      - name: Discover public trend signals
        run: python automation/trend_discovery.py

      - name: Discover commerce-first opportunities
        run: python automation/commerce_discovery.py

      - name: Match offers across every connected network
        run: python automation/multi_network_matcher.py

      - name: Commit clean public outputs and review evidence
        run: |
          FILES="data/source-ingestion-report.json data/offer-catalog-summary.json data/trend-discovery-report.json data/trend-rejections.json data/commerce-candidates.json data/commerce-discovery-report.json data/trend-review.json data/discovered-trends.json data/matched-products.json data/product-matcher-report.json js/discovered-trends.js js/matched-products.js"
          if git diff --quiet -- $FILES; then
            echo "No catalogue, trend or product changes to commit."
            exit 0
          fi

          git config user.name "trendpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: refresh multi-network commerce and trend engine"
          git push
