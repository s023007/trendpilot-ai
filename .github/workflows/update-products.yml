name: Update trends and affiliate products

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:37 UTC (06:37 Oman time).
    - cron: "37 2 * * *"

permissions:
  contents: write

concurrency:
  group: trendpilot-daily-engine
  cancel-in-progress: true

jobs:
  discover-and-match:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover current monetisable trends
        run: python automation/trend_discovery.py

      - name: Match trends to approved products
        env:
          ADMITAD_ALIEXPRESS_FEED_25_40: ${{ secrets.ADMITAD_ALIEXPRESS_FEED_25_40 }}
        run: python automation/product_matcher.py

      - name: Commit clean public outputs
        run: |
          FILES="data/discovered-trends.json data/trend-discovery-report.json js/discovered-trends.js data/matched-products.json data/product-matcher-report.json js/matched-products.js"
          if git diff --quiet -- $FILES; then
            echo "No trend or product changes to commit."
            exit 0
          fi

          git config user.name "trendpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: refresh automatic trends and affiliate matches"
          git push
