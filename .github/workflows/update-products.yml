name: Update trends and affiliate products

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:37 UTC (06:37 Oman time).
    - cron: "37 2 * * *"

permissions:
  contents: write

concurrency:
  group: trendpilot-daily-engine
  cancel-in-progress: true

jobs:
  discover-and-match:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare optional affiliate source URL map
        env:
          SOURCE_URLS_JSON: ${{ secrets.AFFILIATE_SOURCE_URLS_JSON }}
          LEGACY_ALIBABA_URL: ${{ secrets.ALIBABA_CONSUMER_ELECTRONICS_XML_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          raw = os.environ.get("SOURCE_URLS_JSON", "").strip()
          if raw:
              try:
                  source_urls = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"AFFILIATE_SOURCE_URLS_JSON is not valid JSON: {exc}"
                  )
              if not isinstance(source_urls, dict):
                  raise SystemExit(
                      "AFFILIATE_SOURCE_URLS_JSON must contain a JSON object."
                  )
          else:
              source_urls = {}

          # Backward compatibility only. Alibaba is optional, not mandatory.
          legacy_alibaba = os.environ.get("LEGACY_ALIBABA_URL", "").strip()
          if legacy_alibaba:
              source_urls.setdefault(
                  "alibaba-consumer-electronics",
                  legacy_alibaba,
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(
                  "AFFILIATE_SOURCE_URLS_JSON<<TREND_PILOT_SOURCE_URLS\n"
              )
              output.write(
                  json.dumps(source_urls, separators=(",", ":")) + "\n"
              )
              output.write("TREND_PILOT_SOURCE_URLS\n")
          PY


      - name: Download Geekbuying feed privately
        env:
          GEEKBUYING_CSV_URL: ${{ secrets.GEEKBUYING_CSV_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/cache

          if [ -z "${GEEKBUYING_CSV_URL:-}" ]; then
            echo "GEEKBUYING_CSV_URL is missing."
            exit 1
          fi

          TMP_FILE="$(mktemp)"
          curl \
            --fail \
            --location \
            --globoff \
            --compressed \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 240 \
            --user-agent "Mozilla/5.0 TrendPilotAI/1.0" \
            --output "$TMP_FILE" \
            "$GEEKBUYING_CSV_URL"

          python - "$TMP_FILE" <<'PY'
          import csv
          import gzip
          import io
          import os
          import shutil
          import sys
          import zipfile
          from pathlib import Path

          src = Path(sys.argv[1])
          dst = Path("automation/cache/geekbuying-main.csv")
          raw = src.read_bytes()

          if raw[:2] == b"PK":
              with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                  members = [
                      name for name in zf.namelist()
                      if not name.endswith("/") and name.lower().endswith((".csv", ".txt"))
                  ]
                  if not members:
                      raise SystemExit("Geekbuying download is ZIP but contains no CSV/TXT feed.")
                  raw = zf.read(members[0])
          elif raw[:2] == b"\x1f\x8b":
              raw = gzip.decompress(raw)

          # Reject login/error HTML pages instead of reporting a misleading 0 offers.
          probe = raw[:4096].lstrip().lower()
          if probe.startswith(b"<!doctype html") or probe.startswith(b"<html"):
              raise SystemExit(
                  "Geekbuying URL returned an HTML page instead of the CSV feed. "
                  "Regenerate/copy the direct CSV feed URL in Admitad and update GEEKBUYING_CSV_URL."
              )

          text = raw.decode("utf-8-sig", errors="replace")
          first_line = text.splitlines()[0] if text.splitlines() else ""
          required = {"name", "url", "price", "picture"}
          headers = {item.strip() for item in first_line.split(";")}

          if not required.issubset(headers):
              raise SystemExit(
                  "Geekbuying download is not the expected Main CSV feed. "
                  f"Header sample: {first_line[:250]}"
              )

          dst.write_text(text, encoding="utf-8", newline="")
          print(f"Geekbuying feed downloaded: {len(raw):,} bytes")
          print(f"Geekbuying header fields: {len(headers)}")
          PY


      - name: Download FilamentPRO EU feed privately
        env:
          FILAMENTPRO_EU_CSV_URL: ${{ secrets.FILAMENTPRO_EU_CSV_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/cache

          if [ -z "${FILAMENTPRO_EU_CSV_URL:-}" ]; then
            echo "FILAMENTPRO_EU_CSV_URL is missing."
            exit 1
          fi

          TMP_FILE="$(mktemp)"
          curl \
            --fail \
            --location \
            --globoff \
            --compressed \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 240 \
            --user-agent "Mozilla/5.0 TrendPilotAI/1.0" \
            --output "$TMP_FILE" \
            "$FILAMENTPRO_EU_CSV_URL"

          python - "$TMP_FILE" <<'PY'
          import gzip
          import io
          import sys
          import zipfile
          from pathlib import Path

          src = Path(sys.argv[1])
          dst = Path("automation/cache/filamentpro-eu.csv")
          raw = src.read_bytes()

          if raw[:2] == b"PK":
              with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                  members = [
                      name for name in zf.namelist()
                      if not name.endswith("/") and name.lower().endswith((".csv", ".txt"))
                  ]
                  if not members:
                      raise SystemExit("FilamentPRO download is ZIP but contains no CSV/TXT feed.")
                  raw = zf.read(members[0])
          elif raw[:2] == b"\x1f\x8b":
              raw = gzip.decompress(raw)

          probe = raw[:4096].lstrip().lower()
          if probe.startswith(b"<!doctype html") or probe.startswith(b"<html"):
              raise SystemExit(
                  "FilamentPRO URL returned an HTML page instead of the CSV feed. "
                  "Copy the direct CSV feed URL from Admitad and update FILAMENTPRO_EU_CSV_URL."
              )

          text = raw.decode("utf-8-sig", errors="replace")
          first_line = text.splitlines()[0] if text.splitlines() else ""
          headers = {item.strip() for item in first_line.split(";")}
          required = {"id", "name", "url", "price", "picture", "categoryId", "currencyId"}

          if not required.issubset(headers):
              raise SystemExit(
                  "FilamentPRO download is not the expected EU CSV feed. "
                  f"Header sample: {first_line[:250]}"
              )

          dst.write_text(text, encoding="utf-8", newline="")
          print(f"FilamentPRO EU feed downloaded: {len(raw):,} bytes")
          print(f"FilamentPRO header fields: {len(headers)}")
          PY


      - name: Download Joom GB XML feed privately
        env:
          JOOM_GB_XML_URL: ${{ secrets.JOOM_GB_XML_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/cache

          if [ -z "${JOOM_GB_XML_URL:-}" ]; then
            echo "JOOM_GB_XML_URL is missing."
            exit 1
          fi

          TMP_FILE="$(mktemp)"
          DEST_FILE="automation/cache/joom-gb.xml"

          curl \
            --fail \
            --location \
            --globoff \
            --compressed \
            --retry 3 \
            --retry-delay 4 \
            --connect-timeout 30 \
            --max-time 900 \
            --user-agent "Mozilla/5.0 TrendPilotAI/1.0" \
            --output "$TMP_FILE" \
            "$JOOM_GB_XML_URL"

          python - "$TMP_FILE" "$DEST_FILE" <<'PY'
          import gzip
          import shutil
          import sys
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])

          if src.stat().st_size < 1024:
              raise SystemExit("Joom feed download is unexpectedly small.")

          with src.open("rb") as fh:
              magic = fh.read(4)

          if magic[:2] == b"\x1f\x8b":
              with gzip.open(src, "rb") as source, dst.open("wb") as target:
                  shutil.copyfileobj(source, target, length=1024 * 1024)

          elif magic[:2] == b"PK":
              with zipfile.ZipFile(src) as zf:
                  candidates = [
                      info for info in zf.infolist()
                      if not info.is_dir()
                      and info.filename.lower().endswith((".xml", ".xml.gz"))
                  ]
                  if not candidates:
                      raise SystemExit("Joom ZIP contains no XML feed.")
                  chosen = max(candidates, key=lambda item: item.file_size)
                  with zf.open(chosen) as source, dst.open("wb") as target:
                      shutil.copyfileobj(source, target, length=1024 * 1024)

          else:
              shutil.move(str(src), str(dst))

          with dst.open("rb") as fh:
              probe = fh.read(4096).lstrip().lower()

          if probe.startswith(b"<!doctype html") or probe.startswith(b"<html"):
              raise SystemExit(
                  "Joom URL returned HTML instead of the XML feed. "
                  "Regenerate the GB XML link in Admitad and update JOOM_GB_XML_URL."
              )

          # Validate the discovered structure without loading the large file in memory.
          seen_offer = False
          fields = set()
          for _, element in ET.iterparse(dst, events=("end",)):
              tag = str(element.tag).rsplit("}", 1)[-1].lower()
              if tag != "offer":
                  continue
              seen_offer = True
              for child in list(element):
                  fields.add(str(child.tag).rsplit("}", 1)[-1])
              fields.update(
                  str(key).rsplit("}", 1)[-1]
                  for key in element.attrib
              )
              element.clear()
              break

          required = {
              "id", "name", "url", "availability",
              "categoryId", "currencyId", "picture", "price", "vendor"
          }

          if not seen_offer or not required.issubset(fields):
              raise SystemExit(
                  "Joom XML structure does not match the successful probe. "
                  f"Detected fields: {sorted(fields)}"
              )

          print(f"Joom GB XML downloaded: {dst.stat().st_size:,} bytes")
          print("Joom XML structure: verified <offer> records")
          PY

      - name: Raise private catalogue limit for Joom
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config/affiliate-sources.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          current = int(data.get("maxOffersInCache", 100000))
          data["maxOffersInCache"] = max(current, 180000)
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Runtime offer cache limit:", data["maxOffersInCache"])
          PY

      - name: Ingest all enabled affiliate sources
        env:
          # Legacy AliExpress source remains optional.
          ADMITAD_ALIEXPRESS_FEED_25_40: ${{ secrets.ADMITAD_ALIEXPRESS_FEED_25_40 }}
          AFFILIATE_SOURCE_URLS_JSON: ${{ env.AFFILIATE_SOURCE_URLS_JSON }}
        run: python automation/source_ingestion.py

      - name: Discover public trend signals
        run: python automation/trend_discovery.py

      - name: Discover commerce-first opportunities
        run: python automation/commerce_discovery.py

      - name: Match offers across every connected network
        run: python automation/multi_network_matcher.py

      - name: Verify exact products across all connected networks
        run: python automation/product_link_guard.py

      - name: Commit clean public outputs and review evidence
        run: |
          FILES="data/source-ingestion-report.json data/offer-catalog-summary.json data/trend-discovery-report.json data/trend-rejections.json data/commerce-candidates.json data/commerce-discovery-report.json data/trend-review.json data/discovered-trends.json data/matched-products.json data/product-matcher-report.json data/product-link-validation-report.json js/discovered-trends.js js/matched-products.js"
          if git diff --quiet -- $FILES; then
            echo "No catalogue, trend or product changes to commit."
            exit 0
          fi

          git config user.name "trendpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: refresh multi-network commerce and trend engine"
          git push
