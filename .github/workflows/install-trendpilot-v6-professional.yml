name: Install TrendPilot V6 Professional Site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install V6 package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="trendpilot-v6-professional-package.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Upload $ZIP_FILE to the repository root first."
            exit 1
          fi

          TEMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          CONTENT_DIR="$TEMP_DIR"
          TOP_COUNT="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          TOP_ITEM="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -print -quit)"

          if [ "$TOP_COUNT" = "1" ] && [ -d "$TOP_ITEM" ]; then
            CONTENT_DIR="$TOP_ITEM"
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude="$ZIP_FILE" \
            "$CONTENT_DIR/" ./

          rm -f "$ZIP_FILE"

          test -f index.html
          test -f css/style-v6.css
          test -f js/site-v6.js
          test -f images/og/home.jpg
          test -f image-sitemap.xml
          test -f video-sitemap.xml

      - name: Validate pages and internal links
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('.')
          pages = list(root.rglob('*.html'))
          forbidden = [
              'Buyer feeling first',
              'Human tone',
              'SEO-friendly structure',
              'Trust and CPC kept separate',
              'Why this page feels different',
              'Made for human readers',
              'In plain English: this page is built',
          ]

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      value = dict(attrs).get('href')
                      if value:
                          self.links.append(value)

          errors = []
          for page in pages:
              text = page.read_text(encoding='utf-8', errors='replace')
              if '<main' not in text or 'style-v6.css' not in text:
                  errors.append(f'{page}: missing V6 structure')
              for phrase in forbidden:
                  if phrase.lower() in text.lower():
                      errors.append(f'{page}: forbidden internal phrase: {phrase}')
              parser = LinkParser()
              parser.feed(text)
              for href in parser.links:
                  if not href.startswith('/') or href.startswith('//'):
                      continue
                  clean = urlsplit(href).path
                  if not clean:
                      continue
                  target = root / clean.lstrip('/')
                  if clean.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      errors.append(f'{page}: broken internal link {href}')

          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print(f'Validated {len(pages)} HTML pages successfully.')
          PY

      - name: Commit installed site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install TrendPilot V6 professional buyer experience"
          git push origin HEAD:main
