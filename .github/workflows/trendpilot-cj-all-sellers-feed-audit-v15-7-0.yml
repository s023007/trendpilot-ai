name: TrendPilot CJ All Sellers Feed Audit V15.7.0

on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "TrendPilot Choice CJ CID (default is current known CID)"
        required: false
        default: "5917965"
        type: string

permissions:
  contents: read

jobs:
  audit-cj-feeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CJ_INPUT_COMPANY_ID: ${{ inputs.company_id }}
      CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
      CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
      CJ_PAT: ${{ secrets.CJ_PAT }}
      CJ_PERSONAL_ACCESS_TOKEN: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}
      CJ_COMPANY_ID: ${{ secrets.CJ_COMPANY_ID }}
      CJ_CID: ${{ secrets.CJ_CID }}
      CJ_PUBLISHER_CID: ${{ secrets.CJ_PUBLISHER_CID }}

    steps:
      - name: Audit all known CJ seller product feeds
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/cj_all_seller_feed_audit.py
          python /tmp/cj_all_seller_feed_audit.py

      - name: Upload diagnostic JSON
        uses: actions/upload-artifact@v4
        with:
          name: cj-all-seller-feed-audit-v15-7-0
          path: /tmp/cj-all-seller-feed-audit-v15-7-0.json
          if-no-files-found: error
          retention-days: 7
