name: Build WAU Bulgaria LED Landing

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_wau_led_bg_landing.py'
      - '.github/workflows/build-wau-led-bg-landing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-wau-led-bg-landing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Build landing support + email handoff
        run: python scripts/build_wau_led_bg_landing.py
      - name: Preserve curated conversion page
        shell: bash
        run: |
          set -euo pipefail
          # The builder maintains assets/API wiring. The public HTML is now a hand-curated
          # conversion page based on the current WAU offer and should not be overwritten
          # by the older generated layout on future workflow runs.
          git checkout HEAD -- products/led-face-mask/bg/index.html
      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          test -s products/led-face-mask/bg/index.html
          test -s products/led-face-mask/bg/assets/hero.png
          test -s products/led-face-mask/bg/assets/care.png
          grep -q 'wau_led_mask_bg' api/save-search.php
          grep -q 'allowedWauHosts' api/go.php
          grep -q 'products/led-face-mask/bg/' products/sitemap.xml
          php -l api/save-search.php
          php -l api/go.php
          git diff --check
      - name: Commit generated support files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendpilot-wau-landing-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            products/led-face-mask/bg/index.html \
            products/led-face-mask/bg/assets/hero.png \
            products/led-face-mask/bg/assets/care.png \
            products/sitemap.xml \
            api/save-search.php \
            api/go.php
          if git diff --cached --quiet; then
            echo 'No landing support changes to commit.'
            exit 0
          fi
          git commit -m 'feat: refresh WAU LED Bulgaria landing support'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
