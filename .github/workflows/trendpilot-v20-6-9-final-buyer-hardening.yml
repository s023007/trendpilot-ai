name: TrendPilot V20.6.9 — Final Buyer Routing, TikTok Media & Compact Titles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-6-9-final-buyer-hardening
  cancel-in-progress: false

jobs:
  harden-buyer-experience:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply V20.6.9 final buyer hardening
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          ROOT = Path(".")
          REPORT = {
              "version": "V20.6.9",
              "mode": "safe-runtime-hardening",
              "alibaba_records_seen": 0,
              "alibaba_exact_destination_found": 0,
              "alibaba_generic_destination_marked": 0,
              "tiktok_records_seen": 0,
              "tiktok_images_recovered": 0,
              "tiktok_dynamic_availability_marked": 0,
              "json_files_changed": 0,
              "html_files_injected": 0,
              "blocked_seller_mutations": 0,
              "notes": [],
          }

          BLOCKED_PUBLIC = {"temu", "joom", "filamentpro", "filamentpro eu cps"}

          def clean(value):
              return re.sub(r"\s+", " ", str(value or "")).strip()

          def seller_text(d):
              vals = []
              for key in (
                  "seller", "sellerName", "seller_name",
                  "advertiser", "advertiserName", "advertiser_name",
                  "merchant", "merchantName", "merchant_name",
                  "store", "storeName", "store_name",
                  "network", "source", "program", "programme"
              ):
                  if key in d and d.get(key) not in (None, ""):
                      vals.append(clean(d.get(key)))
              return " | ".join(vals).lower()

          def http_url(value):
              s = clean(value)
              return s if re.match(r"^https?://", s, re.I) else ""

          def looks_like_alibaba(d):
              return "alibaba" in seller_text(d)

          def looks_like_tiktok(d):
              text = seller_text(d)
              return "tiktok" in text or "tik tok" in text

          def is_exact_alibaba_url(value):
              s = http_url(value)
              if not s:
                  return False
              try:
                  p = urlparse(s)
              except Exception:
                  return False
              host = p.netloc.lower()
              path = p.path.lower()
              return "alibaba.com" in host and "/product-detail/" in path and path.rstrip("/").endswith(".html")

          def candidate_urls(d):
              priority = [
                  "clickUrl", "click_url", "deeplink", "deepLink", "deep_link",
                  "affiliateUrl", "affiliate_url", "trackingUrl", "tracking_url",
                  "productUrl", "product_url", "productLink", "product_link",
                  "landingPage", "landing_page", "destinationUrl", "destination_url",
                  "url", "link",
              ]
              seen = set()
              out = []
              for key in priority:
                  v = d.get(key)
                  if isinstance(v, str):
                      u = http_url(v)
                      if u and u not in seen:
                          seen.add(u)
                          out.append((key, u))

              link_code = d.get("linkCode")
              if isinstance(link_code, dict):
                  for key in ("clickUrl", "click_url", "url"):
                      v = link_code.get(key)
                      if isinstance(v, str):
                          u = http_url(v)
                          if u and u not in seen:
                              seen.add(u)
                              out.append((f"linkCode.{key}", u))
              return out

          IMAGE_KEYS = (
              "image", "imageUrl", "image_url",
              "thumbnail", "thumbnailUrl", "thumbnail_url",
              "cover", "coverUrl", "cover_url",
              "mainImage", "main_image",
              "picture", "pictureUrl", "picture_url",
              "mediaImage", "media_image",
          )

          def candidate_image(d):
              for key in IMAGE_KEYS:
                  v = d.get(key)
                  if isinstance(v, str):
                      u = http_url(v)
                      if u:
                          return key, u

              for key in ("images", "imageUrls", "image_urls", "media", "gallery"):
                  v = d.get(key)
                  if isinstance(v, list):
                      for item in v:
                          if isinstance(item, str):
                              u = http_url(item)
                              if u:
                                  return key, u
                          elif isinstance(item, dict):
                              for k2 in ("url", "src", "image", "thumbnail", "cover"):
                                  u = http_url(item.get(k2))
                                  if u:
                                      return f"{key}.{k2}", u
                  elif isinstance(v, dict):
                      for k2 in ("url", "src", "image", "thumbnail", "cover"):
                          u = http_url(v.get(k2))
                          if u:
                              return f"{key}.{k2}", u
              return None, None

          def mutate_record(d):
              changed = False
              seller = seller_text(d)

              if any(b in seller for b in BLOCKED_PUBLIC):
                  return False

              if looks_like_alibaba(d):
                  REPORT["alibaba_records_seen"] += 1
                  exact = None
                  exact_key = None
                  for key, url in candidate_urls(d):
                      if is_exact_alibaba_url(url):
                          exact_key, exact = key, url
                          break

                  if exact:
                      if d.get("destination_exact") is not True:
                          d["destination_exact"] = True
                          changed = True
                      if d.get("destination_quality") != "exact_product":
                          d["destination_quality"] = "exact_product"
                          changed = True
                      if d.get("destination_label") != "View exact product":
                          d["destination_label"] = "View exact product"
                          changed = True
                      if d.get("exact_product_url") != exact:
                          d["exact_product_url"] = exact
                          changed = True
                      if d.get("exact_product_url_source") != exact_key:
                          d["exact_product_url_source"] = exact_key
                          changed = True

                      tracked_sources = {
                          "clickUrl", "click_url", "deeplink", "deepLink", "deep_link",
                          "affiliateUrl", "affiliate_url", "trackingUrl", "tracking_url",
                          "linkCode.clickUrl", "linkCode.click_url"
                      }
                      if exact_key in tracked_sources and d.get("url") != exact:
                          if d.get("url"):
                              d.setdefault("previous_url_v20_6_9", d.get("url"))
                          d["url"] = exact
                          changed = True

                      REPORT["alibaba_exact_destination_found"] += 1
                  else:
                      if d.get("destination_exact") is not False:
                          d["destination_exact"] = False
                          changed = True
                      if d.get("destination_quality") != "seller_search_or_category":
                          d["destination_quality"] = "seller_search_or_category"
                          changed = True
                      if d.get("destination_label") != "Search on Alibaba":
                          d["destination_label"] = "Search on Alibaba"
                          changed = True
                      warning = "Exact Alibaba product destination is not proven for this offer."
                      if d.get("destination_warning") != warning:
                          d["destination_warning"] = warning
                          changed = True
                      REPORT["alibaba_generic_destination_marked"] += 1

              if looks_like_tiktok(d):
                  REPORT["tiktok_records_seen"] += 1
                  if d.get("availability_dynamic") is not True:
                      d["availability_dynamic"] = True
                      changed = True
                  if d.get("availability_label") != "Check availability on TikTok":
                      d["availability_label"] = "Check availability on TikTok"
                      changed = True
                  REPORT["tiktok_dynamic_availability_marked"] += 1

                  current_img = http_url(d.get("image"))
                  if not current_img:
                      image_key, image_url = candidate_image(d)
                      if image_url:
                          d["image"] = image_url
                          d["image_recovered_from"] = image_key
                          changed = True
                          REPORT["tiktok_images_recovered"] += 1

              return changed

          def walk(node):
              changed = False
              if isinstance(node, dict):
                  if mutate_record(node):
                      changed = True
                  for value in node.values():
                      if walk(value):
                          changed = True
              elif isinstance(node, list):
                  for value in node:
                      if walk(value):
                          changed = True
              return changed

          for base in (ROOT / "data", ROOT / "config"):
              if not base.exists():
                  continue
              for path in base.rglob("*.json"):
                  if "node_modules" in path.parts:
                      continue
                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  if walk(data):
                      path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                      REPORT["json_files_changed"] += 1

          guard_js = r'''(() => {
            "use strict";

            const EXACT_ALIBABA_RE = /https?:\/\/(?:[^/]+\.)?alibaba\.com\/product-detail\/[^?#]+\.html(?:[?#].*)?$/i;
            const hostOf = (u) => { try { return new URL(u, location.href).hostname; } catch { return ""; } };
            const isAlibaba = (u) => /(^|\.)alibaba\.com$/i.test(hostOf(u));
            const isTikTok = (u) => /(^|\.)tiktok\.com$/i.test(hostOf(u));

            const style = document.createElement("style");
            style.id = "tp-v20-6-9-compact-title-style";
            style.textContent = `
              .offer-card h3,
              .product-card h3,
              .product-card .product-title,
              .product-card [data-product-title],
              [data-product-card] h3,
              [data-product-card] [data-product-title],
              .tp-product-title {
                font-size: clamp(0.92rem, 2.8vw, 1.08rem) !important;
                line-height: 1.32 !important;
                font-weight: 700 !important;
                display: -webkit-box !important;
                -webkit-line-clamp: 3 !important;
                -webkit-box-orient: vertical !important;
                overflow: hidden !important;
                margin-block: 0.45rem 0.55rem !important;
              }

              .tp-destination-note {
                display: inline-flex;
                align-items: center;
                gap: .35rem;
                font-size: .76rem;
                line-height: 1.25;
                opacity: .76;
                margin-top: .35rem;
              }

              .tp-destination-note[data-kind="warning"] {
                opacity: .88;
              }
            `;
            if (!document.getElementById(style.id)) document.head.appendChild(style);

            function cardFor(el) {
              return el.closest("article, .offer-card, .product-card, [data-product-card], [data-product], .result-card");
            }

            function buttonLike(anchor) {
              const txt = (anchor.textContent || "").trim();
              const cls = String(anchor.className || "");
              return /buy|view|open|shop|deal|price|offer|visit|↗/i.test(txt) ||
                     /button|action|cta|buy|shop|offer/i.test(cls);
            }

            function setLabel(anchor, label) {
              if (!buttonLike(anchor)) return;
              if (anchor.children.length === 0) {
                anchor.textContent = label;
                return;
              }
              anchor.setAttribute("aria-label", label);
            }

            function ensureNote(card, text, kind = "info") {
              if (!card) return;
              if ([...card.querySelectorAll(".tp-destination-note")].some(n => n.textContent === text)) return;
              const note = document.createElement("div");
              note.className = "tp-destination-note";
              note.dataset.kind = kind;
              note.textContent = text;
              const body = card.querySelector(".offer-card-body, .product-card-body, .card-body") || card;
              body.appendChild(note);
            }

            function processAlibaba(anchor) {
              const href = anchor.href || "";
              if (!isAlibaba(href)) return;
              const card = cardFor(anchor);
              const exact = EXACT_ALIBABA_RE.test(href);

              if (!exact) {
                setLabel(anchor, "Search on Alibaba");
                anchor.setAttribute("aria-label", "Search on Alibaba — exact product page not proven");
                anchor.title = "This route is not proven to land on the exact product page.";
                ensureNote(card, "Alibaba: exact product link not proven", "warning");

                if (card) {
                  card.querySelectorAll(".verified-corner, .direct-product, [data-direct-product]").forEach((badge) => {
                    if (/direct product/i.test(badge.textContent || "")) badge.textContent = "Seller route";
                  });
                }
              } else {
                setLabel(anchor, "View exact product");
                anchor.setAttribute("aria-label", "View exact Alibaba product");
              }
            }

            function processTikTok(anchor) {
              const href = anchor.href || "";
              if (!isTikTok(href)) return;
              const card = cardFor(anchor);
              setLabel(anchor, "Check availability");
              anchor.setAttribute("aria-label", "Check current availability on TikTok");
              ensureNote(card, "TikTok availability can change", "info");
            }

            function compactTitles(root = document) {
              root.querySelectorAll(
                ".offer-card h3, .product-card h3, .product-card .product-title, " +
                ".product-card [data-product-title], [data-product-card] h3, " +
                "[data-product-card] [data-product-title]"
              ).forEach(el => el.classList.add("tp-product-title"));
            }

            function process(root = document) {
              compactTitles(root);

              root.querySelectorAll('a[href^="http"]').forEach((a) => {
                processAlibaba(a);
                processTikTok(a);
              });

              root.querySelectorAll("article, .offer-card, .product-card, [data-product-card]").forEach((card) => {
                const text = (card.textContent || "").toLowerCase();
                if (!text.includes("tiktok")) return;
                const media = card.querySelector(".offer-media, .product-media, .card-media, [data-product-media]");
                if (!media || media.querySelector("img[src]")) return;

                const holder = card.querySelector(
                  "[data-image], [data-image-url], [data-thumbnail], [data-thumbnail-url], [data-cover], [data-cover-url]"
                ) || card;

                const possible = [
                  holder.dataset?.image,
                  holder.dataset?.imageUrl,
                  holder.dataset?.thumbnail,
                  holder.dataset?.thumbnailUrl,
                  holder.dataset?.cover,
                  holder.dataset?.coverUrl,
                ].find(v => /^https?:\/\//i.test(String(v || "")));

                if (possible) {
                  const img = document.createElement("img");
                  img.src = possible;
                  img.alt = (card.querySelector("h3, .product-title")?.textContent || "TikTok product").trim();
                  img.loading = "lazy";
                  img.referrerPolicy = "no-referrer";
                  img.setAttribute("data-product-image", "");
                  media.prepend(img);
                  media.classList.add("image-ready");
                }
              });
            }

            let scheduled = false;
            const schedule = () => {
              if (scheduled) return;
              scheduled = true;
              requestAnimationFrame(() => {
                scheduled = false;
                process(document);
              });
            };

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", schedule, { once: true });
            } else {
              schedule();
            }

            new MutationObserver(schedule).observe(document.documentElement, {
              childList: true,
              subtree: true
            });
          })();
          '''

          js_dir = ROOT / "js"
          js_dir.mkdir(parents=True, exist_ok=True)
          guard_path = js_dir / "v20-6-9-final-buyer-hardening.js"
          guard_path.write_text(guard_js.strip() + "\n", encoding="utf-8")

          script_tag = '<script src="/js/v20-6-9-final-buyer-hardening.js" defer></script>'
          for path in ROOT.rglob("*.html"):
              if ".git" in path.parts or "node_modules" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              if "v20-6-9-final-buyer-hardening.js" in text:
                  continue
              lower_text = text.lower()
              if "</body>" not in lower_text:
                  continue
              idx = lower_text.rfind("</body>")
              text = text[:idx] + f"  {script_tag}\n" + text[idx:]
              path.write_text(text, encoding="utf-8")
              REPORT["html_files_injected"] += 1

          diagnostics = ROOT / "data" / "diagnostics"
          diagnostics.mkdir(parents=True, exist_ok=True)

          contract_path = diagnostics / "v20-6-9-buyer-routing-contract.json"
          contract_path.write_text(json.dumps({
              "version": "V20.6.9",
              "rules": {
                  "alibaba": {
                      "direct_product_claim_requires": "alibaba.com/product-detail/*.html exact destination evidence",
                      "generic_route_label": "Search on Alibaba",
                      "tracked_exact_route_preferred": True,
                      "do_not_claim_direct_when_unproven": True
                  },
                  "tiktok": {
                      "availability_is_dynamic": True,
                      "button_label": "Check availability",
                      "recover_media_from_existing_catalog_fields": True
                  },
                  "ui": {
                      "product_title_max_lines": 3,
                      "compact_mobile_title": True,
                      "buyer_explanation_preserved": True
                  },
                  "catalog": {
                      "do_not_rebuild_v19_v20_identity": True,
                      "do_not_apply_geo_import_filter": True,
                      "blocked_public_sellers_unchanged": ["Temu", "Joom", "FilamentPRO EU CPS"]
                  }
              }
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          report_path = diagnostics / "v20-6-9-final-buyer-hardening-report.json"
          report_path.write_text(json.dumps(REPORT, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(json.dumps(REPORT, indent=2))
          PY

      - name: Validate generated JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v20-6-9-final-buyer-hardening.js

          python <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("data/diagnostics/v20-6-9-buyer-routing-contract.json"),
              Path("data/diagnostics/v20-6-9-final-buyer-hardening-report.json"),
          ]
          for p in required:
              json.loads(p.read_text(encoding="utf-8"))

          print("V20.6.9 validation PASS")
          PY

      - name: Safety audit
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("data/diagnostics/v20-6-9-final-buyer-hardening-report.json")
              .read_text(encoding="utf-8")
          )

          assert report["blocked_seller_mutations"] == 0
          print("Blocked-seller mutation guard: PASS")
          print("V19/V20 identity rebuild: NOT PERFORMED")
          print("GEO import filtering: NOT ADDED")
          PY

      - name: Show summary
        shell: bash
        run: |
          echo "=== TrendPilot V20.6.9 summary ==="
          cat data/diagnostics/v20-6-9-final-buyer-hardening-report.json
          echo
          echo "=== Changed files ==="
          git status --short

      - name: Commit V20.6.9
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "TrendPilot V20.6.9 final buyer routing and media hardening"
          git push
