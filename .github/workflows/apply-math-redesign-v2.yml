name: Apply Math Redesign V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-math-redesign-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Write redesigned math page
        shell: bash
        env:
          MATH_HTML_GZ_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$MATH_HTML_GZ_B64" | base64 -d | gzip -dc > math/index.html
          grep -q 'افهم الرياضيات بطريقة' math/index.html
          grep -q '30 دقيقة</span><strong>4' math/index.html
          grep -q 'math-services-v2.css' math/index.html
          grep -q 'data-en-src="https://images.pexels.com' math/index.html
          node --check js/math-services-v2.js
      - name: Commit page redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendpilot-math-redesign'
          git config user.email '39025908+s023007@users.noreply.github.com'
          git add math/index.html
          if git diff --cached --quiet; then
            echo 'No math page changes to commit.'
            exit 0
          fi
          git commit -m 'feat: launch light bilingual math services page'
          git push origin HEAD:main
