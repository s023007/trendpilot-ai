name: TrendPilot V20.6.8.4 — Shopper Truth + Exact Destination + Product Explainer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-6-8-4-shopper-truth
  cancel-in-progress: false

jobs:
  stabilize-shopper-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify current TrendPilot foundations
        shell: bash
        run: |
          set -euo pipefail
          test -d data
          test -f find/index.html
          test -d js
          test -d css
          test -d data/catalog-v19/sellers
          COUNT=$(find data/catalog-v19/sellers -name products.ndjson -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 10 ]; then
            echo "Expected canonical V19 seller catalogs; found $COUNT" >&2
            exit 1
          fi
          echo "Canonical seller files: $COUNT"
          git status --short

      - name: Build V20.6.8.4 shopper truth overlay from committed data
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v20684-build.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { URL } from 'node:url';

          const ROOT = process.cwd();
          const OUT = path.join(ROOT, 'data/shopper-v20-6-8-4');
          const SHARDS = path.join(OUT, 'products');
          fs.rmSync(OUT, { recursive: true, force: true });
          fs.mkdirSync(SHARDS, { recursive: true });

          const BLOCKED = /^(?:Temu|Joom|FilamentPRO EU CPS)$/i;
          const TPID_RE = /^TP(?!V|O|C)[A-Z]{2,5}-[A-F0-9]{10,}$/i;
          const TPOID_RE = /^TPO[A-Z0-9-]{8,}$/i;
          const URL_KEY_RE = /(url|link|destination|href|click)/i;
          const PRODUCT_HINT_RE = /(product-preview|comparison|search-v20-6|shopper|master-products|seller-offers|offers-v20|identity-v20)/i;
          const MAX_JSON_BYTES = 120 * 1024 * 1024;

          const clean = v => String(v ?? '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
          const lower = v => clean(v).toLowerCase();
          const nprice = v => {
            if (typeof v === 'number' && Number.isFinite(v)) return v;
            const m = clean(v).replace(/,/g, '').match(/(?:US\$|USD|\$)?\s*(\d+(?:\.\d+)?)/i);
            return m ? Number(m[1]) : null;
          };
          const first = (obj, keys) => {
            for (const k of keys) {
              const v = obj?.[k];
              if (v !== undefined && v !== null && clean(v)) return v;
            }
            return '';
          };
          const slugify = v => lower(v).normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'product';
          const suffixFromTpid = tpid => clean(tpid).split('-').pop().toLowerCase();
          const routeFor = (title, tpid) => `/product/${slugify(title)}--${suffixFromTpid(tpid)}/`;

          const HARD_PHONE_FALSE = /\b(?:phone\s+case|mobile\s+case|protective\s+case|cover\s+for|screen\s+protector|tempered\s+glass|charging\s+station|phone\s+charging\s+station|charging\s+locker|charging\s+port|port\s+clean(?:er|ing)|dust\s+removal|cleaning\s+(?:kit|tool)|repair\s+(?:kit|tool)|replacement\s+(?:battery|screen|part)|battery\s+(?:for|replacement)|battery\s+case|power\s+bank|charger\b|charging\s+cable|usb\s+cable|data\s+cable|phone\s+holder|phone\s+stand|phone\s+mount|car\s+mount|tripod|selfie\s+stick|game\s*controller|gamepad|joystick|trigger\s+for\s+pubg|phone\s+cooler|cooling\s+fan|smartwatch|smart\s+watch|watch\s+band|earbuds?|earphones?|headphones?|headsets?|speaker|microphone|tablet|ipad|projector|digitizer|touch\s+screen\s+replacement|lcd\s+screen\s+replacement|flex\s+cable|motherboard|housing|back\s+cover|camera\s+lens|phone\s+strap|lanyard|wallet\s+case|phone\s+accessor(?:y|ies)|coin[- ]?operated|vending\s+machine|lockers?|charging\s+cabinet)\b/i;
          const PHONE_MODEL = /\b(?:iphone\s*(?:[5-9x]|1[0-9])(?:\s*(?:pro|max|plus|mini))?|samsung\s+galaxy\s+[a-zmfsz]\s*\d+|galaxy\s+s\d+|google\s+pixel\s+\d+|oneplus\s+\d+[a-z]?(?:\s+pro)?|xiaomi\s+\d+[a-z]?(?:\s+pro)?|redmi\s+(?:note\s+)?[a-z0-9]+|poco\s+[a-z]\d+|oppo\s+[a-z0-9]+|vivo\s+[a-z0-9]+|realme\s+[a-z0-9]+|motorola\s+(?:moto\s+)?[a-z0-9]+|moto\s+g\d+|honor\s+[a-z0-9]+|huawei\s+(?:mate|p|nova)\s*\d+|nokia\s+[a-z0-9.]+|sony\s+xperia\s+[a-z0-9]+|nothing\s+phone\s*\(?\d+\)?|asus\s+(?:rog\s+phone|zenfone)\s*\d+|zte\s+[a-z0-9]+|nubia\s+[a-z0-9]+|infinix\s+[a-z0-9]+|tecno\s+[a-z0-9]+)\b/i;
          const GENERIC_PHONE = /\b(?:smart\s*phone|smartphone|mobile\s+phone|cell\s+phone|android\s+phone|unlocked\s+phone|5g\s+phone)\b/i;
          const PHONE_HARDWARE = /\b(?:android\s*\d*|dual\s+sim|single\s+sim|5g|4g|lte|gsm|snapdragon|dimensity|helio|octa[- ]?core|\d+\s*gb\s+ram|\d+\s*gb\s+(?:rom|storage)|\d{3,5}\s*mah)\b/ig;

          function isPhoneHandset(title, model = '') {
            const text = clean(`${title} ${model}`);
            if (!text || HARD_PHONE_FALSE.test(text)) return false;
            if (PHONE_MODEL.test(text)) return true;
            if (/\bsmartphones?\b/i.test(text)) return true;
            if (GENERIC_PHONE.test(text)) {
              const hits = text.match(PHONE_HARDWARE) || [];
              return hits.length >= 1;
            }
            return false;
          }

          function shopperType(title, originalType = '', model = '') {
            const t = lower(`${title} ${model}`);
            if (/\b(?:charging station|charging locker|charging cabinet|coin[- ]?operated|vending machine).*\b(?:phone|charging)|\bphone charging station\b/i.test(t)) return 'phone_charging_station';
            if (/\b(?:cleaning kit|cleaning tool|dust removal|port cleaning)\b/i.test(t)) return 'phone_cleaning_kit';
            if (/\b(?:game controller|gamepad|joystick|trigger for pubg|phone cooler|cooling fan)\b/i.test(t)) return 'gaming_accessory';
            if (/\b(?:battery for|replacement battery|battery replacement)\b/i.test(t)) return 'replacement_battery';
            if (/\b(?:case|cover|screen protector|tempered glass|holder|stand|mount|strap|lanyard)\b/i.test(t) && /\b(?:phone|iphone|galaxy|pixel|oneplus|xiaomi|redmi)\b/i.test(t)) return 'phone_accessory';
            if (isPhoneHandset(title, model)) return 'phone';
            const o = lower(originalType).replace(/[\s-]+/g, '_');
            if (/headphone|earbud|earphone|headset/.test(o)) return 'headphones';
            if (/perfume|fragrance/.test(o)) return 'perfume';
            if (/laptop|notebook/.test(o)) return 'laptop';
            if (/power.?bank/.test(o)) return 'power_bank';
            if (/air.?condition/.test(o)) return 'air_conditioner';
            if (/dog.?food|pet.?food/.test(o)) return 'dog_food';
            if (/smart.?watch/.test(o)) return 'smartwatch';
            if (/cookware/.test(o)) return 'cookware';
            if (/light/.test(o)) return 'lighting';
            if (/tool/.test(o)) return 'tools';
            if (/3d.?filament|filament/.test(o)) return '3d_filament';
            return o || 'product';
          }

          function cleanShopperTitle(raw) {
            let s = clean(raw)
              .replace(/^\s*[\[(](?:hot|new|sale|free\s*ship|freeship|live|limited[- ]?time|us local shipping|hk stock|gold)[^\])]*[\])]\s*/ig, '')
              .replace(/^\s*(?:popular products?\s*\d{4}|annual best[- ]selling products?|factory price|top quality)\s*[:：-]?\s*/ig, '')
              .replace(/\s+/g, ' ').trim();
            return s || clean(raw);
          }

          function extractFacts(text, obj = {}) {
            const src = clean(`${text} ${JSON.stringify(obj?.specs || obj?.attributes || {})}`);
            const facts = {};
            const ram = src.match(/\b(\d{1,2})\s*GB\s*RAM\b/i);
            const storage = src.match(/\b(\d{2,4})\s*GB\b/i);
            const screen = src.match(/\b(\d(?:\.\d{1,2})?)\s*(?:inch|inches|in\b|[”"])/i);
            const battery = src.match(/\b(\d{3,5})\s*mAh\b/i);
            if (ram) facts.ram = `${ram[1]}GB`;
            if (storage) facts.storage = `${storage[1]}GB`;
            if (screen) facts.screen = `${screen[1]} in`;
            if (battery) facts.battery = `${battery[1]}mAh`;
            return facts;
          }

          function explanationFor(p) {
            const title = cleanShopperTitle(p.title || p.model || 'Product');
            const type = p.shopperType;
            const f = p.facts || {};
            const factBits = [];
            if (f.screen) factBits.push(`${f.screen} screen`);
            if (f.ram) factBits.push(`${f.ram} RAM`);
            if (f.storage) factBits.push(`${f.storage} storage`);
            if (f.battery) factBits.push(`${f.battery} battery`);
            const facts = factBits.length ? ` Current catalogue evidence includes ${factBits.join(', ')}.` : '';
            if (type === 'phone') return {
              summary: `${title} is a smartphone.${facts} Seller listings can represent different storage, memory or regional configurations, so choose the exact configuration before comparing prices.`,
              buyerNote: `Compare like-for-like configurations. Supplier/bulk listings and ordinary retail listings should not be treated as the same buying mode.`
            };
            if (type === 'phone_charging_station') return {
              summary: `${title} is commercial phone-charging equipment for venues or businesses. It is a charging station/locker, not a smartphone.`,
              buyerNote: `Check locker count, payment method, power requirements and commercial installation details with the supplier.`
            };
            if (type === 'phone_cleaning_kit') return {
              summary: `${title} is a cleaning or maintenance kit for phone ports and devices. It is an accessory, not a phone.`,
              buyerNote: `Check tool contents and device compatibility before ordering.`
            };
            if (type === 'gaming_accessory') return {
              summary: `${title} is a gaming accessory used with a phone. It is not a smartphone.`,
              buyerNote: `Check supported phone sizes, connection method and game compatibility.`
            };
            if (type === 'replacement_battery') return {
              summary: `${title} is a replacement battery or repair part for a phone. It is not a complete phone.`,
              buyerNote: `Confirm the exact model and battery part number before purchase.`
            };
            if (type === 'phone_accessory') return {
              summary: `${title} is a phone accessory rather than a complete handset.`,
              buyerNote: `Confirm device/model compatibility before purchase.`
            };
            if (type === 'headphones') return {
              summary: `${title} is an audio product in the headphones/earbuds category.${facts} Check connection type, battery life and fit against the seller listing.`,
              buyerNote: `Seller titles may bundle accessories or multipacks; compare the exact configuration.`
            };
            if (type === 'perfume') return {
              summary: `${title} is a fragrance product. Check concentration, bottle size, target audience and whether the listing is a single bottle or bundle before comparing price.`,
              buyerNote: `Fragrance prices are meaningful only when size and concentration match.`
            };
            if (type === 'laptop') return {
              summary: `${title} is a laptop/computer product.${facts} Compare processor, RAM, storage, screen and generation before treating two offers as equivalent.`,
              buyerNote: `Model family names can cover several generations and configurations.`
            };
            if (type === 'power_bank') return {
              summary: `${title} is a portable power bank.${facts} Check rated capacity, output power, charging standards and included cables.`,
              buyerNote: `Advertised capacity and usable delivered capacity can differ.`
            };
            if (type === 'air_conditioner') return {
              summary: `${title} is an air-conditioning product. Check cooling capacity, voltage, room size, installation type and whether heating is included.`,
              buyerNote: `Installation and electrical requirements can materially change total cost.`
            };
            return {
              summary: `${title} is the product represented by this TrendPilot listing group. Review the seller listing for the exact specification, included items, stock and delivery terms before purchase.`,
              buyerNote: `TrendPilot keeps seller listings separate when the evidence is not strong enough to claim that configurations are identical.`
            };
          }

          function nestedTarget(raw) {
            const seen = new Set();
            let current = clean(raw);
            for (let depth = 0; depth < 4; depth++) {
              if (!/^https?:\/\//i.test(current) || seen.has(current)) break;
              seen.add(current);
              try {
                const u = new URL(current);
                const keys = ['ulp','url','u','redirect','redirect_url','destination','destinationUrl','dest','target','to','r'];
                let next = '';
                for (const k of keys) {
                  const v = u.searchParams.get(k);
                  if (!v) continue;
                  try { next = decodeURIComponent(v); } catch { next = v; }
                  if (/^https?:\/\//i.test(next)) break;
                  next = '';
                }
                if (!next) break;
                current = next;
              } catch { break; }
            }
            return current;
          }

          function isTrackingUrl(raw, key = '') {
            const s = lower(raw);
            return /affiliate|click|tracking/.test(lower(key)) || /admitad|ad\.admitad|anrdoezrs|jdoqocy|dpbolvw|kqzyfj|tkqlhce|qksrv|commission-junction|impact\.com|awin1|linksynergy|partnerize/.test(s);
          }

          function exactDestination(raw, seller = '') {
            if (!/^https?:\/\//i.test(clean(raw))) return false;
            const target = nestedTarget(raw);
            let u;
            try { u = new URL(target); } catch { return false; }
            const host = u.hostname.toLowerCase();
            const p = u.pathname.toLowerCase();
            const s = lower(seller);
            if (s.includes('alibaba') && !s.includes('aliexpress')) return /\/product-detail\//.test(p) || /\/product\//.test(p) || /_\d{6,}\.html$/.test(p);
            if (s.includes('aliexpress')) return /\/item\/\d+\.html/.test(p) || /\/i\/\d+\.html/.test(p);
            if (s.includes('tiktok')) return /\/view\/product\/\d+/.test(p) || /\/shop\/.*product/.test(p);
            if (s.includes('geekbuying')) return /\/item\//.test(p) || /-\d+\.html$/.test(p);
            if (s.includes('lenovo')) return /\/p\//.test(p) || /\/product\//.test(p);
            if (/fragranceshop/.test(host)) return p.split('/').filter(Boolean).length >= 2;
            return p.split('/').filter(Boolean).length >= 2 && !/\/(?:search|category|categories|shop|store|products?|browse|offers?)\/?$/.test(p);
          }

          function routeKind(raw, seller, key = '') {
            const tracking = isTrackingUrl(raw, key);
            const exact = exactDestination(raw, seller);
            if (exact && tracking) return 'exact-tracked';
            if (exact) return 'exact-direct';
            if (tracking) return 'generic-tracked';
            return 'generic-direct';
          }

          function sellerName(obj) {
            return clean(first(obj, ['seller','sellerName','seller_name','advertiser','advertiserName','advertiser_name','merchant','merchantName','merchant_name','store','storeName','store_name']));
          }
          function titleName(obj) {
            return clean(first(obj, ['displayName','display_name','canonicalName','canonical_name','productName','product_name','name','title']));
          }
          function modelName(obj) {
            return clean(first(obj, ['canonicalModel','canonical_model','model','modelName','model_name','explicitModel','explicit_model']));
          }
          function productTypeName(obj) {
            return clean(first(obj, ['productType','product_type','type','family','kind','category']));
          }
          function imageValue(obj) {
            return clean(first(obj, ['image','imageUrl','image_url','imageLink','image_link','thumbnail','thumbnailUrl','thumbnail_url']));
          }
          function tpidValue(obj) {
            for (const k of ['tpid','TPID','masterProductId','master_product_id','productIdentity','product_identity']) {
              const v = clean(obj?.[k]);
              if (TPID_RE.test(v)) return v.toUpperCase();
            }
            for (const [k,v] of Object.entries(obj || {}).slice(0, 60)) {
              if (typeof v === 'string' && TPID_RE.test(v)) return v.toUpperCase();
            }
            return '';
          }
          function tpoidValue(obj) {
            for (const k of ['tpoid','TPOID','offerId','offer_id','listingId','listing_id']) {
              const v = clean(obj?.[k]);
              if (TPOID_RE.test(v)) return v.toUpperCase();
            }
            return '';
          }
          function urlsFrom(obj) {
            const out = [];
            for (const [k,v] of Object.entries(obj || {})) {
              if (!URL_KEY_RE.test(k) || typeof v !== 'string') continue;
              const url = clean(v);
              if (/^https?:\/\//i.test(url)) out.push({key:k,url});
            }
            return out;
          }

          function listFiles(dir, out = []) {
            if (!fs.existsSync(dir)) return out;
            for (const ent of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) listFiles(p, out);
              else if (/\.(?:json|ndjson)$/i.test(ent.name)) out.push(p);
            }
            return out;
          }

          const allFiles = listFiles(path.join(ROOT, 'data'))
            .filter(p => {
              try { return fs.statSync(p).size <= MAX_JSON_BYTES; } catch { return false; }
            })
            .sort((a,b) => {
              const pa = PRODUCT_HINT_RE.test(a) ? 0 : /catalog-v19/.test(a) ? 2 : 1;
              const pb = PRODUCT_HINT_RE.test(b) ? 0 : /catalog-v19/.test(b) ? 2 : 1;
              return pa - pb || a.localeCompare(b);
            });

          const products = new Map();
          const canonicalByTpoid = new Map();
          const canonicalBySellerTitlePrice = new Map();
          let parseErrors = 0;
          let objectsSeen = 0;

          function ensureProduct(tpid) {
            if (!products.has(tpid)) products.set(tpid, {
              tpid, title:'', model:'', brand:'', originalType:'', image:'', route:'', facts:{}, offers:[], sourcePriority:99
            });
            return products.get(tpid);
          }

          function mergeProduct(p, obj, filePriority) {
            const title = titleName(obj);
            const model = modelName(obj);
            const originalType = productTypeName(obj);
            const image = imageValue(obj);
            const brand = clean(first(obj, ['canonicalBrand','canonical_brand','brand','brandName','brand_name']));
            const route = clean(first(obj, ['route','productRoute','product_route','previewRoute','preview_route']));
            const facts = extractFacts(`${title} ${model}`, obj);
            if ((title && !p.title) || (title && filePriority < p.sourcePriority)) p.title = title;
            if ((model && !p.model) || (model && filePriority < p.sourcePriority)) p.model = model;
            if ((originalType && !p.originalType) || (originalType && filePriority < p.sourcePriority)) p.originalType = originalType;
            if (image && !p.image) p.image = image;
            if (brand && !p.brand) p.brand = brand;
            if (route.startsWith('/product/')) p.route = route;
            p.facts = {...p.facts, ...facts};
            p.sourcePriority = Math.min(p.sourcePriority, filePriority);
          }

          function addOffer(tpid, obj, filePath) {
            const seller = sellerName(obj);
            if (!seller || BLOCKED.test(seller)) return;
            const urls = urlsFrom(obj);
            if (!urls.length) return;
            const price = nprice(first(obj, ['price','salePrice','sale_price','currentPrice','current_price','amount','minPrice','min_price']));
            const title = titleName(obj);
            const tpoid = tpoidValue(obj);
            const quantityText = clean(`${first(obj,['moq','minimumOrder','minimum_order','minOrder','min_order','quantity'])} ${title}`);
            const supplier = /alibaba/i.test(seller) && !/aliexpress/i.test(seller) || /\b(?:moq|minimum order|pieces?\/lot|supplier|wholesale|bulk|factory)\b/i.test(quantityText);
            const availabilityRaw = first(obj,['availability','availabilityStatus','availability_status','stockStatus','stock_status','status','isAvailable','is_available','available']);
            const availabilityText = lower(availabilityRaw);
            let availability='unknown';
            if (availabilityRaw === false || /(?:unavailable|out[_ -]?of[_ -]?stock|sold[_ -]?out|inactive|deleted|expired|discontinued|not available)/i.test(availabilityText)) availability='unavailable';
            else if (availabilityRaw === true || /(?:in[_ -]?stock|available|active|live)/i.test(availabilityText)) availability='available';
            const candidates = urls.map(x => ({...x, kind: routeKind(x.url, seller, x.key)}));
            const key = tpoid || `${lower(seller)}|${lower(title)}|${price ?? ''}|${candidates[0]?.url || ''}`;
            const p = ensureProduct(tpid);
            if (p.offers.some(o => o._key === key)) return;
            p.offers.push({_key:key,tpoid,seller,title,price,supplier,availability,candidates,file:path.relative(ROOT,filePath)});
          }

          function indexCanonical(obj) {
            const tpoid = tpoidValue(obj);
            const seller = sellerName(obj);
            const title = titleName(obj);
            const price = nprice(first(obj, ['price','salePrice','sale_price','currentPrice','current_price','amount','minPrice','min_price']));
            const urls = urlsFrom(obj);
            if (!urls.length || !seller || BLOCKED.test(seller)) return;
            const rec = {seller,title,price,tpoid,urls};
            if (tpoid) canonicalByTpoid.set(tpoid, rec);
            if (title) canonicalBySellerTitlePrice.set(`${lower(seller)}|${lower(title)}|${price ?? ''}`, rec);
          }

          function walk(node, ctx, filePath, filePriority, depth = 0) {
            if (depth > 8 || node == null) return;
            if (Array.isArray(node)) {
              for (const x of node) walk(x, ctx, filePath, filePriority, depth + 1);
              return;
            }
            if (typeof node !== 'object') return;
            objectsSeen++;
            const ownTpid = tpidValue(node);
            const tpid = ownTpid || ctx?.tpid || '';
            if (/catalog-v19/.test(filePath)) indexCanonical(node);
            if (tpid) {
              const p = ensureProduct(tpid);
              mergeProduct(p, node, filePriority);
              addOffer(tpid, node, filePath);
            }
            const next = {tpid};
            for (const [k,v] of Object.entries(node)) {
              if (k === 'raw' || k === 'html') continue;
              if (v && (typeof v === 'object')) walk(v, next, filePath, filePriority, depth + 1);
            }
          }

          for (const file of allFiles) {
            const rel = path.relative(ROOT, file);
            const priority = PRODUCT_HINT_RE.test(rel) ? 0 : /catalog-v19/.test(rel) ? 2 : 1;
            try {
              const text = fs.readFileSync(file, 'utf8');
              if (/\.ndjson$/i.test(file)) {
                for (const line of text.split(/\r?\n/)) {
                  if (!line.trim()) continue;
                  try { walk(JSON.parse(line), {}, file, priority); } catch { parseErrors++; }
                }
              } else {
                walk(JSON.parse(text), {}, file, priority);
              }
            } catch { parseErrors++; }
          }

          // Enrich offer URL choices from canonical source records when TPOID/title evidence is available.
          for (const p of products.values()) {
            for (const offer of p.offers) {
              let rec = offer.tpoid ? canonicalByTpoid.get(offer.tpoid) : null;
              if (!rec && offer.title) rec = canonicalBySellerTitlePrice.get(`${lower(offer.seller)}|${lower(offer.title)}|${offer.price ?? ''}`);
              if (rec) {
                for (const x of rec.urls) {
                  if (!offer.candidates.some(c => c.url === x.url)) offer.candidates.push({...x, kind: routeKind(x.url, offer.seller, x.key)});
                }
              }
            }
          }

          function chooseGroup(group) {
            const all = group.offers.flatMap(o => o.candidates.map(c => ({...c, offer:o})));
            const exactTracked = all.filter(x => x.kind === 'exact-tracked');
            const exactDirect = all.filter(x => x.kind === 'exact-direct');
            const genericTracked = all.filter(x => x.kind === 'generic-tracked');
            const genericDirect = all.filter(x => x.kind === 'generic-direct');
            const byPrice = arr => arr.sort((a,b) => (a.offer.price ?? 1e12) - (b.offer.price ?? 1e12));
            const primary = byPrice(exactTracked)[0] || byPrice(exactDirect)[0] || byPrice(genericTracked)[0] || byPrice(genericDirect)[0] || null;
            const partnerSecondary = primary && primary.kind.startsWith('exact-') ? byPrice(genericTracked)[0] || null : null;
            const prices = group.offers.map(o => o.price).filter(Number.isFinite);
            const seller = group.seller;
            let availability = 'unknown';
            if (group.offers.length && group.offers.every(o=>o.availability==='unavailable')) availability='unavailable';
            else if (group.offers.some(o=>o.availability==='available')) availability='available';
            else if (/tiktok/i.test(seller)) availability='check-live';
            return {
              seller,
              offerCount: group.offers.length,
              supplier: group.offers.some(o => o.supplier),
              minPrice: prices.length ? Math.min(...prices) : null,
              maxPrice: prices.length ? Math.max(...prices) : null,
              primary: primary ? {url:primary.url,kind:primary.kind,price:primary.offer.price,tpoid:primary.offer.tpoid} : null,
