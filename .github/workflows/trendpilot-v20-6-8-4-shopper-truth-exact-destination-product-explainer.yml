            if(!marker.test(s) || !/<\/body>/i.test(s))continue;
            const orig=s;
            if(!s.includes('shopper-v20-6-8-4.css')&&/<\/head>/i.test(s))s=s.replace(/<\/head>/gi,`${CSS}</head>`);
            if(!s.includes('shopper-v20-6-8-4.js'))s=s.replace(/<\/body>/gi,`${JS}</body>`);
            if(s!==orig){fs.writeFileSync(f,s);patched.push(path.relative(ROOT,f));runtimePatched++;}
          }
          fs.writeFileSync('data/shopper-v20-6-8-4/wiring.json',JSON.stringify({version:'20.6.8.4',patched,runtimePatched},null,2));
          if(!fs.readFileSync('find/index.html','utf8').includes('shopper-v20-6-8-4.js'))throw new Error('Finder overlay was not wired');
          if(!fs.readFileSync('product/index.html','utf8').includes('shopper-v20-6-8-4.js'))throw new Error('Product static shell overlay was not wired');
