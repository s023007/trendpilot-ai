            ${{ runner.temp }}/trendpilot-v20-5-identity-lab/multi-seller-variants.json
            ${{ runner.temp }}/trendpilot-v20-5-identity-lab/comparison-sets.json
            ${{ runner.temp }}/trendpilot-v20-5-identity-lab/query-probes.json
