name: TrendPilot Traffic Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traffic-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: '21098'
      CPANEL_USER: kehwgbpo
      DOMAIN: trendpilotchoice.com
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo 'NAMECHEAP_SSH_PRIVATE_KEY is missing.'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Build privacy-safe traffic report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          ssh trendpilot-namecheap 'bash -s' > reports/traffic-audit.txt <<'REMOTE'
          set -euo pipefail
          DOMAIN='trendpilotchoice.com'
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          : > "$TMP/files"
          for d in "$HOME/access-logs" "$HOME/logs"; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 -type f -readable \( -name "$DOMAIN*" -o -name "*$DOMAIN*" \) -print 2>/dev/null >> "$TMP/files" || true
          done
          for p in "$HOME/access-logs/$DOMAIN" "$HOME/access-logs/$DOMAIN-ssl_log" "$HOME/logs/$DOMAIN" "$HOME/logs/$DOMAIN-ssl_log"; do
            [ -r "$p" ] && printf '%s\n' "$p" >> "$TMP/files"
          done
          sort -u "$TMP/files" -o "$TMP/files"
          if [ ! -s "$TMP/files" ]; then
            echo 'TRAFFIC_AUDIT_ERROR=no_readable_access_logs_found'
            exit 2
          fi
          : > "$TMP/all.log"
          while IFS= read -r f; do
            case "$f" in *.gz) gzip -cd -- "$f" >> "$TMP/all.log" || true;; *) cat -- "$f" >> "$TMP/all.log" || true;; esac
          done < "$TMP/files"
          python3 - "$TMP/all.log" <<'PY'
          import sys,re,datetime,collections,urllib.parse,json
          p=sys.argv[1]
          now=datetime.datetime.now(datetime.timezone.utc)
          cuts={'24h':now-datetime.timedelta(hours=24),'7d':now-datetime.timedelta(days=7),'prev7d':now-datetime.timedelta(days=14)}
          bot=re.compile(r'(bot|spider|crawler|slurp|bingpreview|facebookexternalhit|whatsapp|telegrambot|discordbot|linkedinbot|pinterestbot|applebot|bytespider|semrush|ahrefs|mj12bot|dotbot|petalbot|yandex)',re.I)
          asset=re.compile(r'\.(?:css|js|mjs|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|map|xml|txt|json|pdf|zip)(?:\?|$)',re.I)
          rx=re.compile(r'^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+) ([^ ]+)(?: HTTP/[^\"]+)?" (\d{3}) (\S+) "([^\"]*)" "([^\"]*)"')
          def dt(s):
            try:return datetime.datetime.strptime(s,'%d/%b/%Y:%H:%M:%S %z')
            except:return None
          def rd(r):
            if not r or r=='-': return '(direct/unknown)'
            try:return (urllib.parse.urlparse(r).hostname or '').lower().removeprefix('www.') or '(direct/unknown)'
            except:return '(direct/unknown)'
          data={w:{'req':0,'pv':0,'ips':set(),'bots':0,'pages':collections.Counter(),'refs':collections.Counter()} for w in cuts}
          channels=['t.me','telegram.me','bsky.app','mastodon.social','threads.net','linkedin.com','x.com','twitter.com','pinterest.com','facebook.com','reddit.com','dev.to','medium.com','flipboard.com','google.com','bing.com','duckduckgo.com','yahoo.com']
          ch={w:collections.Counter() for w in cuts}
          oldest=newest=None
          with open(p,errors='replace') as f:
            for line in f:
              m=rx.match(line)
              if not m: continue
              ip,ds,method,url,status,size,ref,ua=m.groups(); t=dt(ds)
              if not t: continue
              oldest=t if oldest is None or t<oldest else oldest; newest=t if newest is None or t>newest else newest
              wins=[]
              if t>=cuts['24h']: wins.append('24h')
              if t>=cuts['7d']: wins.append('7d')
              elif cuts['prev7d']<=t<cuts['7d']: wins.append('prev7d')
              if not wins: continue
              isbot=bool(bot.search(ua)); path=urllib.parse.urlsplit(url).path or '/'
              ispage=method in ('GET','HEAD') and status.startswith(('2','3')) and not asset.search(path)
              refdom=rd(ref)
              for w in wins:
                d=data[w]; d['req']+=1
                if isbot:d['bots']+=1
                elif ispage:
                  d['pv']+=1; d['ips'].add(ip); d['pages'][path]+=1; d['refs'][refdom]+=1
                  for dom in channels:
                    if refdom==dom or refdom.endswith('.'+dom): ch[w][dom]+=1
          print('TRAFFIC_AUDIT_VERSION=2')
          print('GENERATED_UTC='+now.isoformat())
          print('LOG_OLDEST_UTC='+(oldest.isoformat() if oldest else 'none'))
          print('LOG_NEWEST_UTC='+(newest.isoformat() if newest else 'none'))
          for w in ('24h','7d','prev7d'):
            d=data[w]
            print('WINDOW='+w)
            print('REQUESTS='+str(d['req']))
            print('HUMAN_PAGEVIEWS='+str(d['pv']))
            print('APPROX_UNIQUE_VISITORS='+str(len(d['ips'])))
            print('BOT_REQUESTS='+str(d['bots']))
            print('TOP_PAGES='+json.dumps(d['pages'].most_common(15),ensure_ascii=False))
            print('TOP_REFERRERS='+json.dumps(d['refs'].most_common(20),ensure_ascii=False))
            print('CHANNEL_REFERRALS='+json.dumps(ch[w].most_common(),ensure_ascii=False))
          def delta(a,b): return 'NA' if b==0 and a else ('0.0%' if b==0 else f'{((a-b)/b)*100:.1f}%')
          print('WOW_PAGEVIEWS_DELTA='+delta(data['7d']['pv'],data['prev7d']['pv']))
          print('WOW_VISITORS_DELTA='+delta(len(data['7d']['ips']),len(data['prev7d']['ips'])))
          PY
          REMOTE
          cat reports/traffic-audit.txt

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/traffic-audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh traffic audit report'
          git push origin HEAD:main
