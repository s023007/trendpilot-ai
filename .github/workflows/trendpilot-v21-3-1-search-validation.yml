name: TrendPilot V21.3.1 Settled Search Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trendpilot-v21-3-1-search-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      TP_BASE_URL: https://trendpilotchoice.com
    steps:
      - uses: actions/checkout@v5
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate settled book, MacBook, typo and details
        shell: bash
        run: |
          mkdir -p artifacts/v21-3-1
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const BASE=process.env.TP_BASE_URL;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2.75,isMobile:true,hasTouch:true});
            const p=await ctx.newPage();p.setDefaultTimeout(90000);
            const out={version:'21.3.1',checks:{},book:[],macbook:null,makbook:null,detail:null};
            async function search(q,label){
              await p.goto(`${BASE}/find/?q=${encodeURIComponent(q)}&engine=v2064&universal=1`,{waitUntil:'domcontentloaded',timeout:90000});
              await p.waitForFunction(()=>{
                const c=(document.querySelector('[data-v2078-results-count]')?.textContent||'').trim();
                return c && c!=='Ready' && !/searching/i.test(c);
              },null,{timeout:90000});
              await p.waitForTimeout(350);
              const d=await p.evaluate(()=>({
                countText:(document.querySelector('[data-v2078-results-count]')?.textContent||'').trim(),
                cards:[...document.querySelectorAll('.tp78-card')].map(c=>({title:(c.querySelector('h3')?.textContent||'').trim(),href:c.querySelector('a.internal-detail')?.getAttribute('href')||'',family:c.dataset.v209Family||''})),
                runtime:window.__TP_V2091_UNIVERSAL__||null,
                normalizer:window.__TP_QUERY_NORMALIZER__||null,
                noResult:!!document.querySelector('.tp80-no-result')
              }));
              await p.screenshot({path:`artifacts/v21-3-1/${label}.png`});
              return d;
            }
            for(let i=1;i<=3;i++){
              const x=await search('book',`book-${i}`);out.book.push({count:x.cards.length,countText:x.countText,first:x.cards[0]?.title||''});
              out.checks[`book_${i}`]=x.cards.length>0&&x.cards.some(r=>/book/i.test(r.title))&&!x.noResult;
              out.checks[`engine_${i}`]=x.runtime?.runtimeVersion==='20.9.4';
            }
            const m=await search('macbook','macbook');out.macbook={count:m.cards.length,countText:m.countText,first:m.cards[0]?.title||'',families:[...new Set(m.cards.map(x=>x.family).filter(Boolean))]};
            out.checks.macbook=m.cards.length>0&&!m.noResult;
            const t=await search('makbook','makbook');out.makbook={count:t.cards.length,countText:t.countText,first:t.cards[0]?.title||'',normalizer:t.normalizer,url:p.url()};
            out.checks.makbook=t.cards.length>0&&t.normalizer?.corrected?.toLowerCase()==='macbook'&&/q=macbook/i.test(p.url());
            const b=await search('book','book-detail-source');const link=p.locator('a.internal-detail').first();const href=await link.getAttribute('href');await link.click();await p.waitForURL(/\/item\/\?id=/,{timeout:30000});await p.waitForFunction(()=>!!document.querySelector('[data-tp85-detail]:not([hidden])')||!!document.querySelector('[data-tp85-error]:not([hidden])'),null,{timeout:90000});
            out.detail=await p.evaluate(()=>({url:location.href,title:(document.querySelector('[data-tp85-title]')?.textContent||'').trim(),visible:!!document.querySelector('[data-tp85-detail]:not([hidden])'),error:!!document.querySelector('[data-tp85-error]:not([hidden])'),seller:(document.querySelector('[data-tp85-fact-seller]')?.textContent||'').trim()}));out.detail.href=href;
            out.checks.detail=out.detail.visible&&!out.detail.error&&out.detail.title.length>2;
            await p.screenshot({path:'artifacts/v21-3-1/book-detail.png'});
            out.passed=Object.values(out.checks).every(Boolean);fs.writeFileSync('artifacts/v21-3-1/report.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));await browser.close();if(!out.passed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trendpilot-v21-3-1-settled-search
          path: artifacts/v21-3-1
