name: Apply Math Payments and CTA V1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-math-payments-cta-v1.yml'
      - '.github/scripts/patch_math_payments.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply payment and CTA patch
        run: python3 .github/scripts/patch_math_payments.py

      - name: Validate JavaScript
        run: node --check js/math-services-v2.js

      - name: Commit changes
        run: |
          git config user.name 'trendpilot-math-payments'
          git config user.email '39025908+s023007@users.noreply.github.com'
          git add math/index.html css/math-services-v2.css js/math-services-v2.js
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'feat: add math payment policy and clean mobile footer CTA'
          git pull --rebase origin main
          git push origin HEAD:main
