name: Blogarama Ownership Verification

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/blogarama-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogarama-verification
  cancel-in-progress: false

jobs:
  verify-blogarama:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CPANEL_HOST: 198.54.120.162
      CPANEL_PORT: '21098'
      CPANEL_USER: kehwgbpo
      STATIC_ROOT: /home/kehwgbpo/trendpilotchoice.com
      PUBLIC_ORIGIN: https://trendpilotchoice.com
      DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
      BLOGARAMA_META: '<meta name="blogarama-site-verification" content="blogarama-45190723-1ec1-4518-9a32-98709fcec0c4">'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Blogarama verification meta tag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<meta name="blogarama-site-verification" content="blogarama-45190723-1ec1-4518-9a32-98709fcec0c4">'
          if tag not in s:
              marker='<meta name="google-site-verification" content="NLGueGJcrqk6i3-npqWlfIo7puWffXSFu8bIE1dwkKw" />'
              if marker in s:
                  s=s.replace(marker, marker+'\n  '+tag, 1)
              elif '</head>' in s:
                  s=s.replace('</head>', '  '+tag+'\n</head>', 1)
              else:
                  raise SystemExit('Could not find </head> in index.html')
              p.write_text(s, encoding='utf-8')
              print('Added Blogarama meta tag to index.html')
          else:
              print('Blogarama meta tag already present')
          PY

      - name: Commit verification tag if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No repository change required.'
          else
            git commit -m 'chore: add Blogarama verification meta tag'
            git push
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo 'NAMECHEAP_SSH_PRIVATE_KEY is missing.'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap_deploy
          chmod 600 ~/.ssh/namecheap_deploy
          cat > ~/.ssh/config <<EOF
          Host trendpilot-namecheap
            HostName $CPANEL_HOST
            Port $CPANEL_PORT
            User $CPANEL_USER
            IdentityFile ~/.ssh/namecheap_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 2
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish homepage
        shell: bash
        run: |
          set -euo pipefail
          ssh trendpilot-namecheap "test -d '$STATIC_ROOT'"
          cat index.html | ssh trendpilot-namecheap "cat > '$STATIC_ROOT/index.html'"
          ssh trendpilot-namecheap "grep -F 'blogarama-site-verification' '$STATIC_ROOT/index.html' >/dev/null"

      - name: Verify public meta tag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time,urllib.request
          url=os.environ['PUBLIC_ORIGIN'].rstrip('/')+'/'
          needle='blogarama-45190723-1ec1-4518-9a32-98709fcec0c4'
          for i in range(1,7):
              req=urllib.request.Request(url+f'?blogarama_verify={i}',headers={'User-Agent':'TrendPilotBlogaramaVerifier/1.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read().decode('utf-8','replace')
                      if r.status==200 and needle in body:
                          print('BLOGARAMA_META_LIVE_OK')
                          raise SystemExit(0)
              except Exception as e:
                  print('Attempt',i,type(e).__name__,str(e))
              time.sleep(5)
          raise SystemExit('Blogarama verification meta tag is not public yet')
          PY
