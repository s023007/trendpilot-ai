name: Temporary Detailed Phone Seller Audit

on:
  push:
    branches: [fix/phone-purity-v21-10]
    paths:
      - '.github/workflows/tmp-audit-phone-sellers-v21-10.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Print phone-family rows for small sellers
        shell: bash
        run: |
          python <<'PY'
          import json,glob
          wanted={'AliExpress','Geekbuying','Sunsky-online WW','TikTok Shop US','Govee Many GEOs'}
          rows=[]
          for path in glob.glob('data/v20-9/products/*.json'):
            with open(path,encoding='utf-8') as f: b=json.load(f)
            for r in b.values():
              if str(r.get('se')) in wanted and str(r.get('fa') or r.get('ty') or '').lower()=='phone' and str(r.get('ro') or 'main') in ('main','used'):
                rows.append(r)
          for seller in sorted(wanted):
            print('\n###',seller)
            for r in sorted([x for x in rows if x.get('se')==seller], key=lambda x:str(x.get('id'))):
              print(r.get('id'),'| role=',r.get('ro'),'| type=',r.get('ty'),'|',r.get('t'))
          PY
