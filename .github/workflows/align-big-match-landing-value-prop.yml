name: Align Big Match Landing Value Proposition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-big-match-landing-value-prop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-landing-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Patch landing pages in one fail-closed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, os, requests

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}

          def req(method, url, **kwargs):
              r = requests.request(method, url, headers=headers, timeout=30, **kwargs)
              r.raise_for_status()
              return r.json() if r.content else {}

          en = {
            'events/liverpool-v-manchester-united-2026/en-gb/index.html': 'Liverpool vs Manchester United',
            'events/madrid-derby-2026/en-gb/index.html': 'Atlético Madrid vs Real Madrid',
            'events/north-london-derby-2026/en-gb/index.html': 'Tottenham Hotspur vs Arsenal',
            'events/arsenal-v-manchester-city-2026/en-gb/index.html': 'Arsenal vs Manchester City',
          }
          ar = {
            'events/liverpool-v-manchester-united-2026/ar/index.html': 'ليفربول ضد مانشستر يونايتد',
            'events/madrid-derby-2026/ar/index.html': 'أتلتيكو مدريد ضد ريال مدريد',
            'events/north-london-derby-2026/ar/index.html': 'توتنهام ضد أرسنال',
            'events/arsenal-v-manchester-city-2026/ar/index.html': 'أرسنال ضد مانشستر سيتي',
          }

          ref = req('GET', f'{api}/git/ref/heads/main')
          head_sha = ref['object']['sha']
          commit = req('GET', f'{api}/git/commits/{head_sha}')
          base_tree = commit['tree']['sha']
          tree = []

          def patch(path, pairs):
              item = req('GET', f'{api}/contents/{path}?ref={head_sha}')
              doc = base64.b64decode(item['content']).decode('utf-8')
              changed = False
              for old, new in pairs:
                  old_n, new_n = doc.count(old), doc.count(new)
                  if old_n == 1:
                      doc = doc.replace(old, new)
                      changed = True
                  elif old_n == 0 and new_n >= 1:
                      continue
                  else:
                      raise SystemExit(f'Fail closed for {path}: old={old_n}, new={new_n}: {old}')
              if not changed:
                  print('Already aligned:', path)
                  return
              blob = req('POST', f'{api}/git/blobs', json={'content': doc, 'encoding': 'utf-8'})
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              print('Prepared:', path)

          for path, match in en.items():
              patch(path, [
                (f'<h1>{match} — choose your seat before prices move.</h1>', f'<h1>{match} — compare ticket prices, seats and fees.</h1>'),
                ('<a class="btn btn-primary" href="#prices">See available tickets now</a>', '<a class="btn btn-primary" href="#prices">Compare ticket prices &amp; seats</a>'),
                ('<h2>High-demand seats move quickly for big fixtures.</h2>', '<h2>Compare the whole offer, not only the headline price.</h2>'),
                ('Prices and availability change quickly, and resale prices may exceed face value.', 'Prices and availability can change, and resale prices may exceed face value.'),
              ])

          for path, match in ar.items():
              patch(path, [
                (f'<h1>{match}… اختر مقعدك قبل أن ترتفع الأسعار.</h1>', f'<h1>{match} — قارن أسعار التذاكر والمقاعد والرسوم.</h1>'),
                ('<a class="btn btn-primary" href="#prices">شاهد التذاكر المتاحة الآن</a>', '<a class="btn btn-primary" href="#prices">قارن أسعار التذاكر والمقاعد</a>'),
                ('<h2>المقاعد المطلوبة تتحرك بسرعة في المباريات الكبرى.</h2>', '<h2>قارن العرض كاملًا، وليس السعر الظاهر فقط.</h2>'),
                ('الأسعار والتوفر يتغيران بسرعة، وقد تكون أسعار إعادة البيع أعلى من القيمة الاسمية.', 'الأسعار والتوفر قد يتغيران، وقد تكون أسعار إعادة البيع أعلى من القيمة الاسمية.'),
              ])

          if not tree:
              print('No landing-page changes needed.')
              raise SystemExit(0)

          new_tree = req('POST', f'{api}/git/trees', json={'base_tree': base_tree, 'tree': tree})
          new_commit = req('POST', f'{api}/git/commits', json={
              'message': 'landing: align ticket comparison message with RSA test',
              'tree': new_tree['sha'],
              'parents': [head_sha],
          })
          req('PATCH', f'{api}/git/refs/heads/main', json={'sha': new_commit['sha'], 'force': False})
          print('Committed:', new_commit['sha'])
          PY
