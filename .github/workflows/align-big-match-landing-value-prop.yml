name: Align Big Match Landing Value Proposition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-big-match-landing-value-prop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-landing-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align four template landing pages with RSA test
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = {
            'events/liverpool-v-manchester-united-2026/en-gb/index.html': ('Liverpool vs Manchester United', 'Anfield'),
            'events/madrid-derby-2026/en-gb/index.html': ('Atlético Madrid vs Real Madrid', 'Riyadh Air Metropolitano'),
            'events/north-london-derby-2026/en-gb/index.html': ('Tottenham Hotspur vs Arsenal', 'Tottenham Hotspur Stadium'),
            'events/arsenal-v-manchester-city-2026/en-gb/index.html': ('Arsenal vs Manchester City', 'Emirates Stadium'),
          }

          for file, (match, venue) in pages.items():
              p = Path(file)
              doc = p.read_text('utf-8')
              expected = [
                  f'<h1>{match} — choose your seat before prices move.</h1>',
                  '<a class="btn btn-primary" href="#prices">See available tickets now</a>',
                  '<h2>High-demand seats move quickly for big fixtures.</h2>',
                  'Prices and availability change quickly, and resale prices may exceed face value.',
              ]
              for old in expected:
                  if doc.count(old) != 1:
                      raise SystemExit(f'Fail closed: expected exactly one match in {file}: {old}')
              doc = doc.replace(
                  f'<h1>{match} — choose your seat before prices move.</h1>',
                  f'<h1>{match} — compare ticket prices, seats and fees.</h1>'
              )
              doc = doc.replace(
                  '<a class="btn btn-primary" href="#prices">See available tickets now</a>',
                  '<a class="btn btn-primary" href="#prices">Compare ticket prices &amp; seats</a>'
              )
              doc = doc.replace(
                  '<h2>High-demand seats move quickly for big fixtures.</h2>',
                  '<h2>Compare the whole offer, not only the headline price.</h2>'
              )
              doc = doc.replace(
                  'Prices and availability change quickly, and resale prices may exceed face value.',
                  'Prices and availability can change, and resale prices may exceed face value.'
              )
              p.write_text(doc, 'utf-8')
              print('Aligned EN:', file)

          pages_ar = {
            'events/liverpool-v-manchester-united-2026/ar/index.html': 'ليفربول ضد مانشستر يونايتد',
            'events/madrid-derby-2026/ar/index.html': 'أتلتيكو مدريد ضد ريال مدريد',
            'events/north-london-derby-2026/ar/index.html': 'توتنهام ضد أرسنال',
            'events/arsenal-v-manchester-city-2026/ar/index.html': 'أرسنال ضد مانشستر سيتي',
          }

          for file, match in pages_ar.items():
              p = Path(file)
              doc = p.read_text('utf-8')
              expected = [
                  f'<h1>{match}… اختر مقعدك قبل أن ترتفع الأسعار.</h1>',
                  '<a class="btn btn-primary" href="#prices">شاهد التذاكر المتاحة الآن</a>',
                  '<h2>المقاعد المطلوبة تتحرك بسرعة في المباريات الكبرى.</h2>',
                  'الأسعار والتوفر يتغيران بسرعة، وقد تكون أسعار إعادة البيع أعلى من القيمة الاسمية.',
              ]
              for old in expected:
                  if doc.count(old) != 1:
                      raise SystemExit(f'Fail closed: expected exactly one match in {file}: {old}')
              doc = doc.replace(
                  f'<h1>{match}… اختر مقعدك قبل أن ترتفع الأسعار.</h1>',
                  f'<h1>{match} — قارن أسعار التذاكر والمقاعد والرسوم.</h1>'
              )
              doc = doc.replace(
                  '<a class="btn btn-primary" href="#prices">شاهد التذاكر المتاحة الآن</a>',
                  '<a class="btn btn-primary" href="#prices">قارن أسعار التذاكر والمقاعد</a>'
              )
              doc = doc.replace(
                  '<h2>المقاعد المطلوبة تتحرك بسرعة في المباريات الكبرى.</h2>',
                  '<h2>قارن العرض كاملًا، وليس السعر الظاهر فقط.</h2>'
              )
              doc = doc.replace(
                  'الأسعار والتوفر يتغيران بسرعة، وقد تكون أسعار إعادة البيع أعلى من القيمة الاسمية.',
                  'الأسعار والتوفر قد يتغيران، وقد تكون أسعار إعادة البيع أعلى من القيمة الاسمية.'
              )
              p.write_text(doc, 'utf-8')
              print('Aligned AR:', file)
          PY

      - name: Commit landing copy alignment
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            events/liverpool-v-manchester-united-2026/en-gb/index.html \
            events/liverpool-v-manchester-united-2026/ar/index.html \
            events/madrid-derby-2026/en-gb/index.html \
            events/madrid-derby-2026/ar/index.html \
            events/north-london-derby-2026/en-gb/index.html \
            events/north-london-derby-2026/ar/index.html \
            events/arsenal-v-manchester-city-2026/en-gb/index.html \
            events/arsenal-v-manchester-city-2026/ar/index.html
          git commit -m "landing: align ticket comparison message with RSA test"
          git push origin HEAD:main
