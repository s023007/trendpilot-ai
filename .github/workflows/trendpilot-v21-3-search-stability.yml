name: TrendPilot Final Search + Product E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trendpilot-v21-3-search-stability.yml'
      - 'index.html'
      - 'find/index.html'
      - 'item/index.html'
      - 'js/query-normalizer-v21-3.js'
      - 'js/universal-discovery-v20-9-1.js'
      - 'js/smart-suggestions-v20-7-7.js'
      - 'js/shopper-language-v21-4.js'
      - 'js/item-detail-v20-9.js'
      - 'netlify/functions/products-v20-suggest.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendpilot-final-live-qa
  cancel-in-progress: true

jobs:
  search-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TP_BASE_URL: https://trendpilotchoice.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Static finder and product contract
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          home=Path('index.html').read_text(encoding='utf-8')
          f=Path('find/index.html').read_text(encoding='utf-8')
          i=Path('item/index.html').read_text(encoding='utf-8')
          suggest=Path('js/smart-suggestions-v20-7-7.js').read_text(encoding='utf-8')
          language=Path('js/shopper-language-v21-4.js').read_text(encoding='utf-8')
          api=Path('netlify/functions/products-v20-suggest.mjs').read_text(encoding='utf-8')

          assert f.count('universal-discovery-v20-9-1.js') == 1
          assert f.count('query-normalizer-v21-3.js') == 1
          assert f.count('smart-suggestions-v20-7-7.js') == 1
          for old in ('finder-v20-7-9.js','universal-discovery-v20-8.js','finder-restored-semantic-guard-v20-9-4.js'):
              assert old not in f, old

          assert 'smart-suggestions-v20-7-7.js?v=21.5.0' in home
          assert 'smart-suggestions-v20-7-7.js?v=21.5.0' in f
          assert 'shopper-language-v21-4.js?v=21.5.0' in f
          assert 'item-detail-v20-9.js?v=21.5.1' in i
          assert 'TrendPilot first, seller second' not in i

          # One-character autocomplete is strict at both browser and API layers.
          assert "if(v.startsWith(n))return 0" in suggest
          assert "if(n.length===1)return 99" in suggest
          assert "if(n.length===1&&!v.startsWith(n))return -1" in api

          # Internal/debug language and opaque IDs must not leak into shopper details.
          detail=Path('js/item-detail-v20-9.js').read_text(encoding='utf-8')
          assert 'TrendPilot classifies this as' not in detail
          assert 'exact-product destination' not in detail
          assert 'Product family' not in i
          assert 'Main product' not in i
          assert '[a-f0-9]{12,40}' in detail
          assert 'tp(?:id|vid|oid)' in detail

          # Finder cards stay polished for shoppers.
          assert "document.querySelectorAll('.tp80-universal-meta').forEach(el=>el.hidden=true)" in language
          print('Static shopper contract PASS')
          PY
          node --check js/query-normalizer-v21-3.js
          node --check js/universal-discovery-v20-9-1.js
          node --check js/smart-suggestions-v20-7-7.js
          node --check js/shopper-language-v21-4.js
          node --check js/item-detail-v20-9.js
          node --check netlify/functions/products-v20-suggest.mjs

      - name: Wait for production deploy
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            home=$(curl -fsSL "${TP_BASE_URL}/" || true)
            finder=$(curl -fsSL "${TP_BASE_URL}/find/" || true)
            item=$(curl -fsSL "${TP_BASE_URL}/item/" || true)
            if printf '%s' "$home" | grep -q 'smart-suggestions-v20-7-7.js?v=21.5.0' \
              && printf '%s' "$finder" | grep -q 'smart-suggestions-v20-7-7.js?v=21.5.0' \
              && printf '%s' "$finder" | grep -q 'shopper-language-v21-4.js?v=21.5.0' \
              && printf '%s' "$item" | grep -q 'item-detail-v20-9.js?v=21.5.1'; then
              echo 'Final shopper UI is live'; exit 0
            fi
            echo "waiting for production $i/30"; sleep 10
          done
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Mobile shopper E2E
        shell: bash
        run: |
          mkdir -p artifacts/final-live-qa
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const BASE=process.env.TP_BASE_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2.5,isMobile:true,hasTouch:true});
            const page=await ctx.newPage();
            page.setDefaultTimeout(70000);
            const out={checks:{},details:{}};

            await page.goto(`${BASE}/find/`,{waitUntil:'domcontentloaded'});
            const input=page.locator('[data-tp-finder-input]');
            await input.fill('B');
            await page.waitForTimeout(1200);
            const suggestions=await page.locator('.tp-amazon-row b').allTextContents();
            out.details.bSuggestions=suggestions;
            out.checks.b_prefix_only=suggestions.length>0 && suggestions.every(x=>x.trim().toLowerCase().startsWith('b'));

            const apiRows=await page.evaluate(async()=>{
              const r=await fetch('/api/products-v20-suggest?q=B&limit=12',{cache:'no-store'});
              const j=await r.json();return Array.isArray(j.rows)?j.rows.map(x=>x.value):[];
            });
            out.details.bApiRows=apiRows;
            out.checks.b_api_prefix_only=apiRows.length>0 && apiRows.every(x=>String(x).trim().toLowerCase().startsWith('b'));

            async function search(q){
              await page.goto(`${BASE}/find/?q=${encodeURIComponent(q)}&engine=v2064&universal=1`,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelectorAll('.tp78-card').length>0 || !!document.querySelector('.tp80-no-result,.tp78-empty'),null,{timeout:70000});
              await sleep(900);
              return page.locator('.tp78-card');
            }

            const bookRuns=[];
            for(let n=0;n<3;n++){
              const cards=await search('book');
              const titles=await cards.locator('h3').allTextContents();
              bookRuns.push(titles.length);
            }
            out.details.bookRuns=bookRuns;
            out.checks.book_repeat_stable=bookRuns.every(x=>x>0);

            let cards=await search('laptop');
            const laptopTitles=await cards.locator('h3').allTextContents();
            out.details.laptopTitles=laptopTitles.slice(0,8);
            out.checks.laptop_results=laptopTitles.length>0;
            out.checks.laptop_no_obvious_accessory=laptopTitles.slice(0,8).every(x=>!/\b(?:sleeve|case|cover|bag|charger|adapter|cable|stand|dock|replacement)\b/i.test(x));

            cards=await search('macbook');
            const macTitles=await cards.locator('h3').allTextContents();
            out.details.macTitles=macTitles.slice(0,8);
            out.checks.macbook_safe=macTitles.length===0 || macTitles.slice(0,8).every(x=>/macbook/i.test(x)&&!/\b(?:sleeve|case|cover|bag|charger|adapter|cable|stand|dock|replacement)\b/i.test(x));

            cards=await search('phone');
            const seller=page.locator('[data-filter-merchant]');
            const sellerValues=await seller.locator('option').evaluateAll(opts=>opts.map(o=>o.value).filter(Boolean));
            out.details.sellers=sellerValues;
            out.checks.seller_filter_present=sellerValues.length>0;
            if(sellerValues.length){
              await seller.selectOption(sellerValues[0]);
              await page.waitForTimeout(250);
              const filtered=await page.locator('[data-v209-card]').evaluateAll(xs=>xs.map(x=>x.getAttribute('data-v209-seller')));
              out.checks.seller_filter_applies=filtered.length>0 && filtered.every(x=>x===sellerValues[0]);
              await seller.selectOption('');
              await page.waitForTimeout(250);
              const allCount=await page.locator('[data-v209-card]').count();
              out.checks.all_sellers_restores=allCount>=filtered.length;
            } else {
              out.checks.seller_filter_applies=false;
              out.checks.all_sellers_restores=false;
            }

            cards=await search('book');
            const first=cards.locator('a.internal-detail').first();
            const href=await first.getAttribute('href');
            out.checks.internal_detail_href=/^\/item\/\?id=[a-f0-9]{14}/i.test(href||'');
            if(out.checks.internal_detail_href){
              await first.click();
              await page.waitForURL(/\/item\/\?id=/,{timeout:30000});
              await page.waitForFunction(()=>!!document.querySelector('[data-tp85-detail]:not([hidden])') || !!document.querySelector('[data-tp85-error]:not([hidden])'),null,{timeout:70000});
              const detail=await page.evaluate(()=>({
                visible:!!document.querySelector('[data-tp85-detail]:not([hidden])'),
                title:(document.querySelector('[data-tp85-title]')?.textContent||'').trim(),
                text:(document.querySelector('[data-tp85-detail]')?.textContent||''),
                ids:[...document.querySelectorAll('[data-tp85-identifiers] code')].map(x=>x.textContent.trim())
              }));
              out.details.detail=detail;
              out.checks.detail_visible=detail.visible&&detail.title.length>2;
              out.checks.detail_plain_language=!/TrendPilot classifies|exact-product destination|seller route|Product family|Main product/i.test(detail.text);
              out.checks.detail_no_internal_hash=detail.ids.every(x=>!(/^[a-f0-9]{14,64}$/i.test(x)||/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(x)));
            } else {
              out.checks.detail_visible=false;out.checks.detail_plain_language=false;out.checks.detail_no_internal_hash=false;
            }

            out.passed=Object.values(out.checks).every(Boolean);
            fs.writeFileSync('artifacts/final-live-qa/report.json',JSON.stringify(out,null,2));
            console.log(JSON.stringify(out,null,2));
            await page.screenshot({path:'artifacts/final-live-qa/mobile.png',fullPage:false});
            await browser.close();
            if(!out.passed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trendpilot-final-live-qa
          path: artifacts/final-live-qa
