name: TrendPilot Products V15.8.9 TikTok Seller Lock and Real Phone Results

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-8-9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-tiktok-phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 7

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Apply V15.8.9 robust focused fixes
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          js = Path("js/site-v13-5.js")
          html = Path("find/index.html")

          if not js.exists():
              raise SystemExit("Missing js/site-v13-5.js")
          if not html.exists():
              raise SystemExit("Missing find/index.html")

          s = js.read_text(encoding="utf-8")
          h = html.read_text(encoding="utf-8")

          # A) Persist selected seller.
          if "TP_SELECTED_SELLER_V15_8_9" not in s:
              state_anchor = '    originalQuery: "", queryCorrected: false'
              if state_anchor not in s:
                  raise SystemExit("State anchor not found.")
              s = s.replace(
                  state_anchor,
                  '    originalQuery: "", queryCorrected: false, selectedSeller: "" // TP_SELECTED_SELLER_V15_8_9',
                  1
              )

          old_filter = 'merchant:$(\'[data-filter-merchant]\')?.value||"", price:$(\'[data-filter-price]\')?.value||"", sort:$(\'[data-filter-sort]\')?.value||"smart",'
          new_filter = 'merchant:$(\'[data-filter-merchant]\')?.value||state.selectedSeller||"", price:$(\'[data-filter-price]\')?.value||"", sort:$(\'[data-filter-sort]\')?.value||"smart",'
          if old_filter in s:
              s = s.replace(old_filter, new_filter, 1)

          old_current = '      const current=tpCanonicalSellerV15_1(merchant.value)||merchant.value;'
          new_current = '      const current=state.selectedSeller||tpCanonicalSellerV15_1(merchant.value)||merchant.value;'
          if old_current in s:
              s = s.replace(old_current, new_current, 1)
          elif new_current not in s:
              raise SystemExit("Seller dropdown current-value anchor not found.")

          old_preserve = '  const preservedSeller=tpCanonicalSellerV15_1(merchantBeforeSearch?.value)||merchantBeforeSearch?.value||"";'
          new_preserve = (
              '  const preservedSeller=state.selectedSeller||tpCanonicalSellerV15_1(merchantBeforeSearch?.value)||merchantBeforeSearch?.value||"";\n'
              '  state.selectedSeller=preservedSeller;'
          )
          if old_preserve in s:
              s = s.replace(old_preserve, new_preserve, 1)
          elif 'state.selectedSeller=preservedSeller;' not in s:
              raise SystemExit("Search seller-preservation anchor not found.")

          # B) Replace current multi-line smartphone guard robustly.
          smartphone_guard = "\n".join([
              '    // TP_SMARTPHONE_GUARD_V15_8_9',
              '    if(plan.families?.includes("smartphones")) {',
              '      const tpPhoneText=lower(`${p.name||""} ${p.category||""} ${p.brand||""}`);',
              '      const tpPhoneAccessory=/\\b(?:case|cover|screen protector|protector|charger|charging|cable|mount|holder|stand|strap|lanyard|chain|grip|dock|adapter|cleaning|cleaner|cleaning tool|repair kit|replacement|replacement part|charging port|phone port|accessor(?:y|ies)|headphones?|earbuds?|earphones?|headsets?|power bank|battery pack|wallet|suction cup|tripod)\\b/i;',
              '      const tpRealPhone=/\\b(?:smartphones?|mobile phones?|cell phones?|android phones?|unlocked phones?|iphones?|samsung galaxy(?:\\s+[a-z0-9+.-]+)?|google pixel(?:\\s+[a-z0-9+.-]+)?|motorola(?:\\s+moto)?|moto\\s+g\\d*|oneplus|xiaomi|redmi|oppo|vivo|realme|nothing phone)\\b/i;',
              '      if(tpPhoneAccessory.test(tpPhoneText))return false;',
              '      if(!tpRealPhone.test(tpPhoneText) && p.family!=="smartphones")return false;',
              '    }',
              ''
          ])

          guard_pattern = re.compile(
              r'\n\s*if\(plan\.families\?\.includes\("smartphones"\)\)\s*\{.*?\n\s*\}\n'
              r'(?=\s*if\(plan\.families\?\.includes\("laptops"\))',
              re.S
          )
          if "TP_SMARTPHONE_GUARD_V15_8_9" not in s:
              s2, n = guard_pattern.subn(lambda _m: "\n" + smartphone_guard, s, count=1)
              if n != 1:
                  raise SystemExit(f"Current smartphone guard block not found uniquely: matches={n}")
              s = s2

          # C) Improve real-phone taxonomy.
          old_family_route = '["smartphones", /\\b(smartphones?|mobile phones?|iphone)\\b/i],'
          new_family_route = '["smartphones", /\\b(?:smartphones?|mobile phones?|cell phones?|android phones?|unlocked phones?|iphones?|samsung galaxy|google pixel|motorola(?: moto)?|moto g\\d*|oneplus|xiaomi|redmi|oppo|vivo|realme|nothing phone)\\b/i],'
          if old_family_route in s:
              s = s.replace(old_family_route, new_family_route, 1)

          # D) Add TikTok live seller helpers.
          if "TP_TIKTOK_LIVE_SELLER_V15_8_9_START" not in s:
              marker = "  // TP_CJ_LIVE_SEARCH_V15_7_1_END\n"
              if marker not in s:
                  raise SystemExit("CJ live search marker not found.")

              helper = "\n".join([
                  '  // TP_TIKTOK_LIVE_SELLER_V15_8_9_START',
                  '  function tpLiveSellerQueriesV15_8_9(query,seller){',
                  '    const q=lower(query||"").trim();',
                  '    const canonical=tpCanonicalSellerV15_1(seller)||clean(seller);',
                  '    if(canonical==="TikTok Shop US" && /^(?:phone|phones|smartphone|smartphones|mobile phone|mobile phones)$/i.test(q)){',
                  '      return ["smartphone","unlocked smartphone","android smartphone","mobile phone","iphone"];',
                  '    }',
                  '    return [clean(query)].filter(Boolean);',
                  '  }',
                  '',
                  '  function tpPrepareLiveSellerRowsV15_8_9(rows,seller,query){',
                  '    const canonical=tpCanonicalSellerV15_1(seller)||clean(seller);',
                  '    const q=lower(query||"").trim();',
                  '    let out=Array.isArray(rows)?rows.filter(Boolean):[];',
                  '    if(canonical==="TikTok Shop US" && /^(?:phone|phones|smartphone|smartphones|mobile phone|mobile phones)$/i.test(q)){',
                  '      const accessory=/\\b(?:case|cover|screen protector|protector|charger|charging|cable|mount|holder|stand|strap|lanyard|chain|grip|dock|adapter|cleaning|cleaner|cleaning tool|repair kit|replacement|replacement part|charging port|phone port|accessor(?:y|ies)|headphones?|earbuds?|earphones?|headsets?|power bank|battery pack|wallet|suction cup|tripod)\\b/i;',
                  '      const device=/\\b(?:smartphones?|mobile phones?|cell phones?|android phones?|unlocked phones?|iphones?|samsung galaxy(?:\\s+[a-z0-9+.-]+)?|google pixel(?:\\s+[a-z0-9+.-]+)?|motorola(?:\\s+moto)?|moto\\s+g\\d*|oneplus|xiaomi|redmi|oppo|vivo|realme|nothing phone)\\b/i;',
                  '      out=out.filter(p=>{',
                  '        const text=lower(`${p.name||""} ${p.category||""} ${p.brand||""}`);',
                  '        return device.test(text) && !accessory.test(text);',
                  '      }).map(p=>Object.assign({},p,{group:"phones-tablets",family:"smartphones"}));',
                  '    }',
                  '    const seen=new Set();',
                  '    return out.filter(p=>{',
                  '      const key=clean(p.clusterKey||p.id||p.url||p.name);',
                  '      if(!key || seen.has(key))return false;',
                  '      seen.add(key);',
                  '      return true;',
                  '    });',
                  '  }',
                  '',
                  '  async function tpLoadSelectedLiveSellerV15_8_9(seller,query=state.query){',
                  '    const queries=tpLiveSellerQueriesV15_8_9(query,seller);',
                  '    const settled=await Promise.allSettled(queries.map(q=>tpLoadCjLiveProductsV15_7_1(q,seller)));',
                  '    const rows=[];',
                  '    settled.forEach(result=>{',
                  '      if(result.status==="fulfilled" && Array.isArray(result.value))rows.push(...result.value);',
                  '    });',
                  '    return tpPrepareLiveSellerRowsV15_8_9(rows,seller,query);',
                  '  }',
                  '  // TP_TIKTOK_LIVE_SELLER_V15_8_9_END',
                  ''
              ])
              s = s.replace(marker, marker + helper, 1)

          # E) Seller-aware live search on normal search.
          old_live_promise = '  const cjLivePromiseV15_7_1=tpLoadCjLiveProductsV15_7_1(cjLiveQueryV15_7_1,preservedSeller);'
          new_live_promise = (
              '  const cjLivePromiseV15_7_1=(preservedSeller && TP_CJ_LIVE_SELLERS_V15_7_1.has(preservedSeller))\n'
              '    ? tpLoadSelectedLiveSellerV15_8_9(preservedSeller,cjLiveQueryV15_7_1)\n'
              '    : tpLoadCjLiveProductsV15_7_1(cjLiveQueryV15_7_1,preservedSeller);'
          )
          if old_live_promise in s:
              s = s.replace(old_live_promise, new_live_promise, 1)
          elif 'tpLoadSelectedLiveSellerV15_8_9(preservedSeller,cjLiveQueryV15_7_1)' not in s:
              raise SystemExit("CJ live promise anchor not found.")

          # F) Replace merchant change handler.
          old_handler = "\n".join([
              "      if(x.matches('[data-filter-merchant]')&&x.value&&typeof tpLoadSellerSpecificV15_1===\"function\"){",
              "        const selected=x.value;",
              "        state.loading=true;",
              "        renderFinder();",
              "        await tpLoadSellerSpecificV15_1(selected);",
              "        state.loading=false;",
              "        populateFilters();",
              "        const merchant=$('[data-filter-merchant]');",
              "        if(merchant)merchant.value=selected;",
              "      }",
          ])
          new_handler = "\n".join([
              "      if(x.matches('[data-filter-merchant]')){",
              "        const selected=tpCanonicalSellerV15_1(x.value)||clean(x.value);",
              "        state.selectedSeller=selected;",
              "        if(selected){",
              "          state.loading=true;",
              "          renderFinder();",
              "          if(TP_CJ_LIVE_SELLERS_V15_7_1.has(selected)){",
              "            const liveRows=await tpLoadSelectedLiveSellerV15_8_9(selected,state.query);",
              "            if(liveRows.length)mergeProducts(liveRows);",
              "          }else if(typeof tpLoadSellerSpecificV15_1===\"function\"){",
              "            await tpLoadSellerSpecificV15_1(selected);",
              "          }",
              "          state.loading=false;",
              "          populateFilters();",
              "          const merchant=$('[data-filter-merchant]');",
              "          if(merchant)merchant.value=selected;",
              "        }",
              "      }",
          ])
          if old_handler in s:
              s = s.replace(old_handler, new_handler, 1)
          elif 'const liveRows=await tpLoadSelectedLiveSellerV15_8_9(selected,state.query);' not in s:
              raise SystemExit("Current merchant change handler not found.")

          # G) Explicit clear actions.
          reset_old = "$('[data-reset-filters]')?.addEventListener('click',()=>{$$('[data-filter-panel] select').forEach(x=>x.value='');"
          reset_new = "$('[data-reset-filters]')?.addEventListener('click',()=>{state.selectedSeller='';$$('[data-filter-panel] select').forEach(x=>x.value='');"
          if reset_old in s:
              s = s.replace(reset_old, reset_new, 1)

          all_old = "const allSellers=e.target.closest('[data-tp-search-all-sellers]');if(allSellers){const merchant=$('[data-filter-merchant]');if(merchant)merchant.value=\"\";"
          all_new = "const allSellers=e.target.closest('[data-tp-search-all-sellers]');if(allSellers){state.selectedSeller='';const merchant=$('[data-filter-merchant]');if(merchant)merchant.value=\"\";"
          if all_old in s:
              s = s.replace(all_old, all_new, 1)

          # H) Version/cache bust.
          s = re.sub(
              r'const TP_CJ_GUARD_VERSION = "[^"]+";',
              'const TP_CJ_GUARD_VERSION = "15.8.9";',
              s,
              count=1
          )
          h = re.sub(
              r'/js/site-v13-5\.js\?v=[^"]+',
              '/js/site-v13-5.js?v=15.8.9',
              h,
              count=1
          )

          js.write_text(s.rstrip()+"\n", encoding="utf-8")
          html.write_text(h.rstrip()+"\n", encoding="utf-8")

          print("V15.8.9 robust TikTok/phone patch applied.")
          PY

      - name: Validate V15.8.9
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          s=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          h=Path("find/index.html").read_text(encoding="utf-8")

          checks = {
              "selected seller state": "TP_SELECTED_SELLER_V15_8_9" in s,
              "filters fallback to seller state": "value||state.selectedSeller||" in s,
              "dropdown uses persisted seller": "const current=state.selectedSeller||" in s,
              "search preserves seller state": "state.selectedSeller=preservedSeller;" in s,
              "robust smartphone guard": "TP_SMARTPHONE_GUARD_V15_8_9" in s,
              "TikTok multi-query helper": "tpLiveSellerQueriesV15_8_9" in s,
              "TikTok row preparation": "tpPrepareLiveSellerRowsV15_8_9" in s,
              "live seller loader": "tpLoadSelectedLiveSellerV15_8_9" in s,
              "merchant handler uses live loader": "const liveRows=await tpLoadSelectedLiveSellerV15_8_9(selected,state.query);" in s,
              "reset clears selected seller": "state.selectedSeller='';$$('[data-filter-panel] select')" in s,
              "all sellers clears selected seller": "if(allSellers){state.selectedSeller='';" in s,
              "cache bust": "/js/site-v13-5.js?v=15.8.9" in h,
          }

          failed=[]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL")+": "+name)
              if not ok:
                  failed.append(name)

          if failed:
              raise SystemExit("Validation failed: "+", ".join(failed))

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"js/site-v13-5.js","find/index.html"}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))

          print("V15.8.9 validation passed.")
          PY

      - name: Publish V15.8.9
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/site-v13-5.js find/index.html
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.8.9 already installed."
            exit 0
          fi

          git commit -m "fix: persist TikTok seller and tighten real phone results"
          git push origin HEAD:main

          {
            echo "## TrendPilot Products V15.8.9"
            echo "- TikTok Shop US selection persists"
            echo "- TikTok seller uses CJ Live API directly"
            echo "- phone searches use multiple device-oriented CJ queries"
            echo "- phone accessories are excluded from smartphone exact results"
            echo "- existing autocomplete and approved seller list are left intact"
          } >> "$GITHUB_STEP_SUMMARY"
