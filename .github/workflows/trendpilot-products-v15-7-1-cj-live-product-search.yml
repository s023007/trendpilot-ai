name: TrendPilot Products V15.7.1 CJ Live Product Search

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-7-1-cj-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-cj-live-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Install Netlify CJ live search function
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p netlify/functions
          echo '' | base64 -d > netlify/functions/cj-live-products.mjs

      - name: Connect live CJ results to Products search
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/tp_v15_7_1_patch.py
          python /tmp/tp_v15_7_1_patch.py

      - name: Validate V15.7.1
        shell: bash
        run: |
          set -euo pipefail
          node --check netlify/functions/cj-live-products.mjs
          node --check js/site-v13-5.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          function=Path("netlify/functions/cj-live-products.mjs").read_text(encoding="utf-8")
          site=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")

          required_function=[
              'const CJ_ENDPOINT = "https://ads.api.cj.com/query"',
              '"Temu"',
              '"PandaHall"',
              '"FragranceShop.com"',
              '"Karaca EU"',
              '15501511',
              '15609716',
              '16941446',
              '15171094',
              'shoppingProducts(',
              'keywords:',
              'imageLink',
              'linkCode(pid:',
              'process.env.CJ_API_TOKEN',
              'path: "/api/cj-live-products"'
          ]
          missing=[x for x in required_function if x not in function]
          if missing:
              raise SystemExit("Missing function markers: "+", ".join(missing))

          required_site=[
              "TP_CJ_LIVE_SEARCH_V15_7_1_START",
              "tpLoadCjLiveProductsV15_7_1",
              "cjLivePromiseV15_7_1",
              "mergeProducts(liveRows)",
              "TP_PRESERVE_SELLER_V15_6_5",
              "TP_CJ_SEARCH_BRIDGE_START"
          ]
          missing=[x for x in required_site if x not in site]
          if missing:
              raise SystemExit("Missing site markers: "+", ".join(missing))

          if "/js/site-v13-5.js?v=15.7.1" not in html:
              raise SystemExit("Finder cache-bust was not updated.")

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={
              "netlify/functions/cj-live-products.mjs",
              "js/site-v13-5.js",
              "find/index.html"
          }
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))

          print("V15.7.1 validation passed.")
          print("- Existing static CJ catalog remains intact.")
          print("- Admitad files remain untouched.")
          print("- Live CJ search is additive and asynchronous.")
          print("- Supported live sellers: Temu, PandaHall, FragranceShop.com, Karaca EU.")
          print("- If Netlify CJ token is missing, current search continues unchanged.")
          PY

      - name: Publish V15.7.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             netlify/functions/cj-live-products.mjs             js/site-v13-5.js             find/index.html

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.7.1 is already installed."
            exit 0
          fi

          git commit -m "feat: add CJ live product search via Netlify function"
          git push origin HEAD:main

          {
            echo "## TrendPilot Products V15.7.1"
            echo ""
            echo "Installed additive CJ live Product Feed search for:"
            echo "- Temu — adId 15501511"
            echo "- PandaHall — adId 15609716"
            echo "- FragranceShop.com — adId 16941446"
            echo "- Karaca EU — adId 15171094"
            echo ""
            echo "### Netlify runtime setting"
            echo "Required private environment variable:"
            echo "- CJ_API_TOKEN = your CJ Personal Access Token"
            echo ""
            echo "Optional overrides:"
            echo "- CJ_COMPANY_ID"
            echo "- CJ_WEBSITE_PID"
            echo ""
            echo "Without the Netlify token, existing product search stays active and the live layer fails safely."
          } >> "$GITHUB_STEP_SUMMARY"
