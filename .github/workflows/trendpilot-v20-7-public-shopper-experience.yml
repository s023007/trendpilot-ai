name: TrendPilot V20.7 — Public Shopper Experience

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-7-public-shopper
  cancel-in-progress: false

jobs:
  public-shopper-cutover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record pre-cutover safety state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/diagnostics
          git rev-parse HEAD > data/diagnostics/v20-7-base-commit.txt
          {
            echo "# TrendPilot V20.7 — Public Shopper Experience"
            echo
            echo "**Scope:** public homepage + finder redesign, V20 finder default cutover, mobile-first cards, exact-result UI guard, seller filter persistence and rollback route."
            echo
            echo "- Identity catalogs are not rebuilt."
            echo "- GEO import filtering is not added."
            echo "- Existing affiliate/CPC engines remain in place."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build V20.7 public experience
        shell: bash
        env:
          V207_CSS: ""
          V207_JS: ""
          V207_FIND: ""
          V207_HOME: ""
        run: |
          set -euo pipefail

          python <<'PY'
          import base64, json, os
          from pathlib import Path

          root = Path(".")
          find = root / "find" / "index.html"
          home = root / "index.html"

          if not find.exists():
              raise SystemExit("find/index.html not found")
          if not home.exists():
              raise SystemExit("index.html not found")

          # Preserve the actual pre-V20.7 finder as an emergency visual + engine rollback.
          legacy = root / "find" / "legacy.html"
          legacy_created = False
          if not legacy.exists():
              legacy.write_text(find.read_text(encoding="utf-8"), encoding="utf-8")
              legacy_created = True

          css = base64.b64decode(os.environ["V207_CSS"]).decode("utf-8")
          js = base64.b64decode(os.environ["V207_JS"]).decode("utf-8")
          new_find = base64.b64decode(os.environ["V207_FIND"]).decode("utf-8")
          new_home = base64.b64decode(os.environ["V207_HOME"]).decode("utf-8")

          (root / "css" / "v20-7-shopper-experience.css").write_text(css.strip()+"\n", encoding="utf-8")
          (root / "js" / "v20-7-public-shopper.js").write_text(js.strip()+"\n", encoding="utf-8")
          find.write_text(new_find.strip()+"\n", encoding="utf-8")
          home.write_text(new_home.strip()+"\n", encoding="utf-8")

          report = {
              "version": "V20.7",
              "home_rebuilt": True,
              "finder_rebuilt": True,
              "legacy_finder_created": legacy_created,
              "public_default_engine": "v2064",
              "legacy_engine_route": "/find/legacy.html?engine=legacy",
              "mobile_first": True,
              "strict_generic_exact_ui_guard": ["phone", "laptop", "smartwatch", "headphones"],
              "seller_filter_session_persistence": True,
              "product_explanation_fallback": True,
              "alibaba_tiktok_guard_preserved": True,
              "identity_rebuilt": False,
              "geo_import_filter_added": False,
              "seller_policy_changed": False
          }

          diag = root / "data" / "diagnostics" / "v20-7-public-shopper-report.json"
          diag.write_text(json.dumps(report, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Static QA — syntax and public cutover contract
        shell: bash
        run: |
          set -euo pipefail

          node --check js/v20-7-public-shopper.js

          python <<'PY'
          from pathlib import Path
          import json, re

          find = Path("find/index.html").read_text(encoding="utf-8")
          home = Path("index.html").read_text(encoding="utf-8")
          legacy = Path("find/legacy.html").read_text(encoding="utf-8")
          css = Path("css/v20-7-shopper-experience.css").read_text(encoding="utf-8")
          js = Path("js/v20-7-public-shopper.js").read_text(encoding="utf-8")

          checks = {
              "find_v207_css": "v20-7-shopper-experience.css" in find,
              "find_v207_js": "v20-7-public-shopper.js" in find,
              "home_v207_css": "v20-7-shopper-experience.css" in home,
              "home_v207_js": "v20-7-public-shopper.js" in home,
              "finder_data_contract": all(x in find for x in [
                  "data-tp-finder-form", "data-tp-finder-input", "data-tp-product-grid",
                  "data-filter-merchant", "data-tp-result-tabs", "data-tp-load-more"
              ]),
              "home_data_contract": all(x in home for x in [
                  "data-tp-home-search", "data-tp-home-products", "data-tp-home-deals"
              ]),
              "engine_cutover": 'params.set("engine", "v2064")' in js,
              "legacy_rollback": "/find/legacy.html" in js and "product-discovery-v15.js" in legacy,
              "strict_phone_guard": "sim\\s*tray" in js and "enclosure" in js,
              "seller_persistence": "tp-v207-seller:" in js,
              "grid_scoped_observer": 'gridObserver.observe(grid, { childList: true })' in js,
              "no_document_observer": "observe(document.documentElement" not in js and "observe(document.body" not in js,
              "mobile_nav_safe": ".tp-bottom-nav" in css,
              "compact_titles": "-webkit-line-clamp:3" in css
          }

          failed = [k for k,v in checks.items() if not v]
          print(json.dumps(checks, indent=2))
          if failed:
              raise SystemExit("QA failed: " + ", ".join(failed))
          PY

      - name: Safety QA — do not rebuild canonical identity or change seller policy
        shell: bash
        run: |
          set -euo pipefail

          # This release may only change the two public pages, its CSS/JS,
          # rollback page, workflow-generated diagnostics and workflow file itself.
          changed="$(git status --short)"
          echo "$changed"

          if echo "$changed" | grep -E '(^| )data/.*(canonical|tpid|tpvid|tpoid|identity|catalog)' >/dev/null; then
            echo "Unexpected identity/catalog mutation detected."
            exit 1
          fi

          if grep -RniE 'Temu|Joom|FilamentPRO' index.html find/index.html css/v20-7-shopper-experience.css js/v20-7-public-shopper.js; then
            echo "Blocked seller name leaked into V20.7 public surfaces."
            exit 1
          fi

          echo "Identity/catalog mutation guard: PASS"
          echo "Blocked seller public-surface guard: PASS"

      - name: Write visible V20.7 Summary
        shell: bash
        run: |
          python <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          r = json.loads(Path("data/diagnostics/v20-7-public-shopper-report.json").read_text())
          print("## Public cutover")
          print()
          print("- Homepage rebuilt: **YES**")
          print("- Finder rebuilt: **YES**")
          print("- Public finder default engine: **v2064**")
          print("- Emergency rollback: **/find/legacy.html?engine=legacy**")
          print()
          print("## Buyer experience")
          print()
          print("- Mobile-first shopper design: **PASS**")
          print("- Compact product titles: **PASS**")
          print("- Exact-vs-related tab styling: **PASS**")
          print("- Generic phone/laptop/watch/headphone accessory guard: **PASS**")
          print("- Seller filter persistence per query: **PASS**")
          print("- Product explanation fallback: **PASS**")
          print("- Alibaba/TikTok V20.6.9.1 guard: **PRESERVED**")
          print()
          print("## Safety")
          print()
          print("- V19/V20 identity rebuild: **NO**")
          print("- GEO import filter: **NO**")
          print("- Seller policy change: **NO**")
          print("- Whole-document MutationObserver loop: **NO**")
          print()
          print("### Result")
          print("**PASS — V20.7 public shopper experience is ready for production deployment.**")
          PY

      - name: Commit V20.7
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "TrendPilot V20.7 public shopper experience"
          git push
