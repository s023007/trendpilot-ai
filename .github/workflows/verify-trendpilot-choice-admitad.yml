name: Verify TrendPilot Choice in Admitad

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-trendpilot-choice-admitad
  cancel-in-progress: false

jobs:
  verify-admitad:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate homepage and add Admitad verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          verification_tag = '<meta name="verify-admitad" content="179d0dbedc" />'

          preferred = [
              Path("index.html"),
              Path("public/index.html"),
              Path("src/index.html"),
          ]

          homepage = next((p for p in preferred if p.is_file()), None)

          if homepage is None:
              ignored = {".git", "node_modules", "dist", "build"}
              matches = []
              for path in Path(".").rglob("index.html"):
                  if not any(part in ignored for part in path.parts):
                      matches.append(path)
              homepage = matches[0] if matches else None

          if homepage is None:
              raise SystemExit(
                  "Could not find the source homepage index.html. "
                  "Expected index.html, public/index.html, or src/index.html."
              )

          html = homepage.read_text(encoding="utf-8")

          existing = re.compile(
              r'<meta\s+name=["\']verify-admitad["\'][^>]*>',
              re.IGNORECASE,
          )

          if existing.search(html):
              updated = existing.sub(verification_tag, html, count=1)
              action = "updated"
          else:
              head = re.search(r"<head\b[^>]*>", html, re.IGNORECASE)
              if not head:
                  raise SystemExit(f"No <head> tag found in {homepage}")
              updated = html[:head.end()] + "\n  " + verification_tag + html[head.end():]
              action = "added"

          homepage.write_text(updated, encoding="utf-8")
          Path(".admitad-homepage-path").write_text(str(homepage), encoding="utf-8")
          print(f"Admitad verification tag {action} in {homepage}")
          PY

      - name: Validate verification tag
        shell: bash
        run: |
          HOMEPAGE="$(cat .admitad-homepage-path)"
          echo "Checking: $HOMEPAGE"
          grep -n -F '<meta name="verify-admitad" content="179d0dbedc" />' "$HOMEPAGE"

      - name: Commit and push verification
        shell: bash
        run: |
          HOMEPAGE="$(cat .admitad-homepage-path)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$HOMEPAGE"

          if git diff --cached --quiet; then
            echo "Verification tag is already installed. Nothing to commit."
          else
            git commit -m "Verify TrendPilot Choice ownership in Admitad"
            git push origin HEAD:main
          fi
