name: Rare GEO Priority Link Audit — Read Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rare-geo-priority-link-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact product destinations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          wanted={
            'aliexpress:2b8a2b92b20569fd6e5c7928',
            'aliexpress:16dba243dcd0dd53a44ac931',
            'aliexpress:2d42de1034c9472289323ae9',
            'aliexpress:2ec53b1b035fd4b1d1428e00',
            'aliexpress:6d3042f25bdc12e59beca401',
          }
          p=Path('data/catalog-v19/sellers/aliexpress/products.ndjson')
          found={}
          with p.open('r',encoding='utf-8',errors='replace') as f:
            for line in f:
              try:o=json.loads(line)
              except:continue
              key=o.get('productKey')
              if key in wanted: found[key]=o

          def name(o):
            n=o.get('name') or {}
            if isinstance(n,dict): return n.get('display') or n.get('normalized') or ''
            return str(n)

          print('=== PRIORITY PRODUCT LINK AUDIT ===')
          print(f'found={len(found)}/{len(wanted)}')
          for key in sorted(wanted):
            o=found.get(key)
            if not o:
              print(f'ITEM|{key}|MISSING')
              continue
            links=o.get('links') or {}
            url=links.get('destinationUrl') or links.get('affiliateUrl') or ''
            parsed=urllib.parse.urlparse(url)
            qs=urllib.parse.parse_qs(parsed.query)
            ulp=(qs.get('ulp') or [''])[0]
            decoded=urllib.parse.unquote(ulp) if ulp else ''
            item_id=''
            for candidate in (decoded,url):
              if '/item/' in candidate:
                tail=candidate.split('/item/',1)[1]
                item_id=tail.split('.html',1)[0].split('?',1)[0].strip('/')
                break
            if not item_id:
              # Deep-link URLs can contain encoded item ids in dl_target_url.
              marker='item%252F'
              if marker in url:
                item_id=url.split(marker,1)[1].split('.html',1)[0].split('%253F',1)[0]
            print(f'ITEM|{key}|title={name(o)[:220]}|price={(o.get("offer") or {}).get("price")}|host={parsed.netloc}|exact_item_id={item_id or "UNKNOWN"}|has_url={bool(url)}')

            # Resolve tracking redirect, but print only status and final host/path, never the full tracking query.
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'},method='GET')
              with urllib.request.urlopen(req,timeout=15) as r:
                final=r.geturl(); fp=urllib.parse.urlparse(final)
                print(f'HTTP|{key}|status={r.status}|final_host={fp.netloc}|final_path={fp.path[:180]}')
            except Exception as e:
              print(f'HTTP|{key}|error={type(e).__name__}:{str(e)[:160]}')
          print('=== END LINK AUDIT ===')
          PY
