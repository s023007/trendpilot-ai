name: Install TrendPilot V6 Professional Site FIXED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-v6-fixed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and install V6 package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="trendpilot-v6-professional-package.zip"
          MANIFEST_FILE="$RUNNER_TEMP/trendpilot-v6-html-manifest.txt"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::The file $ZIP_FILE is missing from the repository root."
            echo "Files currently in the repository root:"
            find . -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          echo "Package found:"
          ls -lh "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"

          TEMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          CONTENT_DIR="$TEMP_DIR"
          TOP_COUNT="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          TOP_ITEM="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -print -quit)"

          if [ "$TOP_COUNT" = "1" ] && [ -d "$TOP_ITEM" ]; then
            CONTENT_DIR="$TOP_ITEM"
          fi

          # Record only the HTML pages that belong to the V6 package.
          # Older legacy HTML files in the repository must not make validation fail.
          (
            cd "$CONTENT_DIR"
            find . -type f -name '*.html' -print | sed 's#^./##' | sort
          ) > "$MANIFEST_FILE"

          if [ ! -s "$MANIFEST_FILE" ]; then
            echo "::error::No HTML pages were found inside the V6 package."
            exit 1
          fi

          echo "V6 pages included in this installation:"
          cat "$MANIFEST_FILE"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude="$ZIP_FILE" \
            "$CONTENT_DIR/" ./

          test -f index.html
          test -f css/style-v6.css
          test -f js/site-v6.js
          test -f images/og/home.jpg
          test -f image-sitemap.xml
          test -f video-sitemap.xml

      - name: Validate V6 pages and internal links
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import os

          root = Path('.')
          manifest_path = Path(os.environ['RUNNER_TEMP']) / 'trendpilot-v6-html-manifest.txt'

          if not manifest_path.exists():
              raise SystemExit('V6 HTML manifest was not created.')

          pages = [root / line.strip() for line in manifest_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          forbidden = [
              'Buyer feeling first',
              'Human tone',
              'SEO-friendly structure',
              'Trust and CPC kept separate',
              'Why this page feels different',
              'Made for human readers',
              'In plain English: this page is built',
          ]

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      value = dict(attrs).get('href')
                      if value:
                          self.links.append(value)

          errors = []

          for page in pages:
              if not page.exists():
                  errors.append(f'{page}: missing after installation')
                  continue

              text = page.read_text(encoding='utf-8', errors='replace')

              if '<main' not in text:
                  errors.append(f'{page}: missing <main> structure')
              if 'style-v6.css' not in text:
                  errors.append(f'{page}: V6 stylesheet is not linked')

              for phrase in forbidden:
                  if phrase.lower() in text.lower():
                      errors.append(f'{page}: internal design phrase is still visible: {phrase}')

              parser = LinkParser()
              parser.feed(text)

              for href in parser.links:
                  if not href.startswith('/') or href.startswith('//'):
                      continue

                  clean = urlsplit(href).path
                  if not clean:
                      continue

                  target = root / clean.lstrip('/')
                  if clean.endswith('/'):
                      target = target / 'index.html'

                  if not target.exists():
                      errors.append(f'{page}: broken internal link {href}')

          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)

          print(f'Validated {len(pages)} V6 HTML pages successfully.')
          PY

      - name: Commit installed V6 site
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="trendpilot-v6-professional-package.zip"
          rm -f "$ZIP_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit. The V6 site is already installed."
            exit 0
          fi

          git commit -m "Install TrendPilot V6 professional buyer experience"
          git push origin HEAD:main
