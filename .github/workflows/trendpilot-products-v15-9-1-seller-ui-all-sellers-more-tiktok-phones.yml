name: TrendPilot Products V15.9.1 Seller UI, All Sellers and More TikTok Phones

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-9-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-seller-ui-and-tiktok-depth:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Apply V15.9.1 focused fixes
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          site = Path("js/site-v13-5.js")
          whitelist = Path("js/seller-whitelist-v14-1-5.js")
          fn = Path("netlify/functions/cj-live-products.mjs")
          html = Path("find/index.html")

          for p in (site, whitelist, fn, html):
              if not p.exists():
                  raise SystemExit(f"Missing required file: {p}")

          s = site.read_text(encoding="utf-8")
          w = whitelist.read_text(encoding="utf-8")
          f = fn.read_text(encoding="utf-8")
          h = html.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # A) The visible Seller select is authoritative.
          #    If it says All sellers (empty value), do NOT fall back to
          #    an older state.selectedSeller value.
          # ------------------------------------------------------------
          old_filter = 'merchant:$(\'[data-filter-merchant]\')?.value||state.selectedSeller||"", price:$(\'[data-filter-price]\')?.value||"", sort:$(\'[data-filter-sort]\')?.value||"smart",'
          new_filter = 'merchant:($(\'[data-filter-merchant]\')?clean($(\'[data-filter-merchant]\').value):(state.selectedSeller||"")), price:$(\'[data-filter-price]\')?.value||"", sort:$(\'[data-filter-sort]\')?.value||"smart",'
          if old_filter in s:
              s = s.replace(old_filter, new_filter, 1)
          elif new_filter not in s:
              raise SystemExit("Merchant filter-authority anchor not found.")

          # ------------------------------------------------------------
          # B) Selecting All sellers forces a fresh all-seller search.
          #    This prevents stale rows from the previously selected seller.
          # ------------------------------------------------------------
          old_end = "\n".join([
              "          const merchant=$('[data-filter-merchant]');",
              "          if(merchant)merchant.value=selected;",
              "        }",
              "      }",
              "      state.shown=24;",
              "      renderFinder();",
          ])
          new_end = "\n".join([
              "          const merchant=$('[data-filter-merchant]');",
              "          if(merchant)merchant.value=selected;",
              "        }else{",
              "          state.selectedSeller=\"\";",
              "          state.shown=24;",
              "          await performSearch(state.query,false,state.scope);",
              "          return;",
              "        }",
              "      }",
              "      state.shown=24;",
              "      renderFinder();",
          ])
          if old_end in s:
              s = s.replace(old_end, new_end, 1)
          elif 'await performSearch(state.query,false,state.scope);' not in s:
              raise SystemExit("All-sellers merchant handler anchor not found.")

          old_button = "const allSellers=e.target.closest('[data-tp-search-all-sellers]');if(allSellers){state.selectedSeller='';const merchant=$('[data-filter-merchant]');if(merchant)merchant.value=\"\";state.shown=24;renderFinder();return;}"
          new_button = "const allSellers=e.target.closest('[data-tp-search-all-sellers]');if(allSellers){state.selectedSeller='';const merchant=$('[data-filter-merchant]');if(merchant)merchant.value=\"\";state.shown=24;performSearch(state.query,false,state.scope);return;}"
          if old_button in s:
              s = s.replace(old_button, new_button, 1)
          elif new_button not in s:
              raise SystemExit("All-sellers button anchor not found.")

          # ------------------------------------------------------------
          # C) Expand TikTok phone discovery terms without allowing
          #    accessories to become exact smartphone matches.
          # ------------------------------------------------------------
          old_queries = 'return ["smartphone","unlocked smartphone","android smartphone","mobile phone","iphone"];'
          new_queries = 'return ["smartphone","unlocked phone","android phone","mobile phone","cell phone","iphone","samsung galaxy","google pixel","5g phone"];'
          if old_queries in s:
              s = s.replace(old_queries, new_queries, 1)
          elif new_queries not in s:
              raise SystemExit("TikTok multi-query anchor not found.")

          # Give larger CJ responses a little more time to arrive.
          old_timeout = 'const timer=setTimeout(()=>controller.abort(),5000);'
          new_timeout = 'const timer=setTimeout(()=>controller.abort(),10000);'
          if old_timeout in s:
              s = s.replace(old_timeout, new_timeout, 1)
          elif new_timeout not in s:
              raise SystemExit("CJ live browser timeout anchor not found.")

          # ------------------------------------------------------------
          # D) Fix the separate seller-whitelist observer.
          #    It was seeing labels such as "TikTok Shop US (21)" as a
          #    different option set, rebuilding the select, and visually
          #    returning it to All sellers even while state kept TikTok.
          # ------------------------------------------------------------
          old_signatures = "\n".join([
              "  function desiredSignature(){",
              "    return [\"All sellers\",...allowed].join(\"|\");",
              "  }",
              "",
              "  function currentSignature(s){",
              "    return [...s.options].map(o=>clean(o.textContent)).join(\"|\");",
              "  }",
          ])
          new_signatures = "\n".join([
              "  function signatureName(value){",
              "    const raw=clean(value).replace(/\\s*\\(\\d+\\)\\s*$/,\" \").trim();",
              "    if(low(raw)===\"all sellers\") return \"All sellers\";",
              "    return canon(raw)||raw;",
              "  }",
              "  function desiredSignature(){",
              "    return [\"All sellers\",...allowed].map(signatureName).sort((a,b)=>a.localeCompare(b)).join(\"|\");",
              "  }",
              "",
              "  function currentSignature(s){",
              "    return [...s.options].map(o=>signatureName(o.value||o.textContent)).sort((a,b)=>a.localeCompare(b)).join(\"|\");",
              "  }",
          ])
          if old_signatures in w:
              w = w.replace(old_signatures, new_signatures, 1)
          elif 'function signatureName(value)' not in w:
              raise SystemExit("Seller whitelist signature anchor not found.")

          old_selected = '    const selected=canon(s.options[s.selectedIndex]?.textContent||s.value);'
          new_selected = '    const selected=canon(s.value)||canon(clean(s.options[s.selectedIndex]?.textContent||"").replace(/\\s*\\(\\d+\\)\\s*$/,""));'
          if old_selected in w:
              w = w.replace(old_selected, new_selected, 1)
          elif new_selected not in w:
              raise SystemExit("Seller whitelist selected-value anchor not found.")

          w = w.replace('s.dataset.tpApprovedSellers="15.8.6";', 's.dataset.tpApprovedSellers="15.9.1";', 1)
          w = w.replace('/data/approved-product-sellers-v14-1-5.json?v=15.8.6', '/data/approved-product-sellers-v14-1-5.json?v=15.9.1', 1)

          # ------------------------------------------------------------
          # E) Increase TikTok CJ API depth while keeping strict affiliate
          #    tracking. We do NOT remove strictProductTracking.
          # ------------------------------------------------------------
          # Patch only buildSelection(), using the function boundaries instead of
          # depending on the exact safeQuery/return formatting.
          backend_limit = 'limit: ${seller === "TikTok Shop US" ? 80 : 40}'
          if backend_limit not in f:
              build_start = f.find("function buildSelection(alias, seller, query)")
              build_end = f.find("\nasync function queryCj", build_start)
              if build_start < 0 or build_end < 0:
                  raise SystemExit("CJ buildSelection function boundaries not found.")
              build = f[build_start:build_end]
              build2, n = re.subn(r'(?m)^(\s*)limit:\s*40\s*$', lambda m: m.group(1) + 'limit: ${seller === "TikTok Shop US" ? 80 : 40}', build, count=1)
              if n != 1:
                  raise SystemExit(f"CJ buildSelection limit not found uniquely: matches={n}")
              f = f[:build_start] + build2 + f[build_end:]

          old_slice = '    .slice(0, 28);'
          new_slice = '    .slice(0, seller === "TikTok Shop US" ? 60 : 28);'
          if old_slice in f:
              f = f.replace(old_slice, new_slice, 1)
          elif new_slice not in f:
              raise SystemExit("CJ normalized-row cap anchor not found.")

          # Version/cache identifiers.
          s = re.sub(
              r'const TP_CJ_GUARD_VERSION = "[^"]+";',
              'const TP_CJ_GUARD_VERSION = "15.9.1";',
              s,
              count=1
          )
          f = f.replace('TrendPilotLiveSearchV1585', 'TrendPilotLiveSearchV1591')
          f = f.replace('TrendPilot-CJ-Live-Search/15.8.5', 'TrendPilot-CJ-Live-Search/15.9.1')
          f = f.replace('TrendPilot-CJ-Link-Fallback/15.8.5', 'TrendPilot-CJ-Link-Fallback/15.9.1')
          f = f.replace('|15.8.5`', '|15.9.1`')
          f = f.replace('version: "15.8.5"', 'version: "15.9.1"')
          f = f.replace('CJ live search V15.8.5 failed', 'CJ live search V15.9.1 failed')

          h = re.sub(
              r'/js/site-v13-5\.js\?v=[^"]+',
              '/js/site-v13-5.js?v=15.9.1',
              h,
              count=1
          )
          h = re.sub(
              r'/js/seller-whitelist-v14-1-5\.js\?v=[^"]+',
              '/js/seller-whitelist-v14-1-5.js?v=15.9.1',
              h,
              count=1
          )

          site.write_text(s.rstrip()+"\n", encoding="utf-8")
          whitelist.write_text(w.rstrip()+"\n", encoding="utf-8")
          fn.write_text(f.rstrip()+"\n", encoding="utf-8")
          html.write_text(h.rstrip()+"\n", encoding="utf-8")

          print("V15.9.1 seller UI / All sellers / TikTok depth patch applied.")
          PY

      - name: Validate V15.9.1
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js
          node --check js/seller-whitelist-v14-1-5.js
          node --check netlify/functions/cj-live-products.mjs
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          s=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          w=Path("js/seller-whitelist-v14-1-5.js").read_text(encoding="utf-8")
          f=Path("netlify/functions/cj-live-products.mjs").read_text(encoding="utf-8")
          h=Path("find/index.html").read_text(encoding="utf-8")

          checks = {
              "All sellers does not fall back to stale state": "merchant:($('[data-filter-merchant]')?clean($('[data-filter-merchant]').value):(state.selectedSeller||\"\"))" in s,
              "All sellers reloads fresh results": "await performSearch(state.query,false,state.scope);" in s,
              "All sellers button reloads": "performSearch(state.query,false,state.scope);return;}" in s,
              "expanded TikTok phone queries": '"samsung galaxy","google pixel","5g phone"' in s,
              "longer CJ browser timeout": "controller.abort(),10000" in s,
              "whitelist ignores count suffixes": "function signatureName(value)" in w and "localeCompare" in w,
              "whitelist preserves selected value": "const selected=canon(s.value)||canon(" in w,
              "TikTok backend limit raised": 'limit: ${seller === "TikTok Shop US" ? 80 : 40}' in f,
              "TikTok normalized cap raised": '.slice(0, seller === "TikTok Shop US" ? 60 : 28);' in f,
              "strict TikTok tracking preserved": 'strictProductTracking: true' in f,
              "site cache bust": "/js/site-v13-5.js?v=15.9.1" in h,
              "whitelist cache bust": "/js/seller-whitelist-v14-1-5.js?v=15.9.1" in h,
          }

          failed=[]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL")+": "+name)
              if not ok:
                  failed.append(name)

          if failed:
              raise SystemExit("Validation failed: "+", ".join(failed))

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={
              "js/site-v13-5.js",
              "js/seller-whitelist-v14-1-5.js",
              "netlify/functions/cj-live-products.mjs",
              "find/index.html",
          }
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))

          missing=allowed-changed
          if missing:
              raise SystemExit("Expected files were not changed: "+", ".join(sorted(missing)))

          print("V15.9.1 validation passed.")
          PY

      - name: Publish V15.9.1
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/site-v13-5.js js/seller-whitelist-v14-1-5.js netlify/functions/cj-live-products.mjs find/index.html
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.9.1 already installed."
            exit 0
          fi

          git commit -m "fix: seller selector state and expand TikTok phone coverage"
          git push origin HEAD:main

          {
            echo "## TrendPilot Products V15.9.1"
            echo "- selected seller remains visibly selected"
            echo "- seller whitelist no longer resets labels with result counts"
            echo "- All sellers clears stale seller state and reloads all-seller results"
            echo "- TikTok phone search uses broader phone queries"
            echo "- TikTok CJ query depth increased while strict affiliate tracking remains enabled"
          } >> "$GITHUB_STEP_SUMMARY"
