name: TrendPilot CJ Diecast Expansion V15.6.6

on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "CJ Publisher Company ID / CID. Leave blank to use saved secret."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: trendpilot-cj-diecast-expansion-v15-6-6
  cancel-in-progress: true

jobs:
  expand-diecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CJ_INPUT_COMPANY_ID: ${{ inputs.company_id }}
      CJ_TOKEN_PRIMARY: ${{ secrets.CJ_API_TOKEN }}
      CJ_TOKEN_ALT_1: ${{ secrets.CJ_TOKEN }}
      CJ_TOKEN_ALT_2: ${{ secrets.CJ_PAT }}
      CJ_TOKEN_ALT_3: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}
      CJ_COMPANY_PRIMARY: ${{ secrets.CJ_COMPANY_ID }}
      CJ_COMPANY_ALT_1: ${{ secrets.CJ_CID }}
      CJ_COMPANY_ALT_2: ${{ secrets.CJ_PUBLISHER_CID }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Fetch and expand Diecast only
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/diecast_expand.py
          python /tmp/diecast_expand.py
          cat /tmp/diecast-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Diecast expansion
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          report=json.loads(Path("data/diagnostics/diecast-expansion-v15-6-6.json").read_text(encoding="utf-8"))
          if report.get("advertiserId")!="2357926":
              raise SystemExit("Wrong advertiser ID.")
          if report.get("selectedCount",0)<report.get("existingDiecastCount",0):
              raise SystemExit("Diecast count regressed.")

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={
              "data/cj-products.json",
              "data/diagnostics/diecast-expansion-v15-6-6.json"
          }
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected changed files: "+", ".join(sorted(unexpected)))

          if Path("data/cj-products.json").as_posix() in changed:
              data=json.loads(Path("data/cj-products.json").read_text(encoding="utf-8"))
              products=data.get("products") or []
              diecast=[p for p in products if str(p.get("advertiserId") or "")=="2357926"]
              others=[p for p in products if str(p.get("advertiserId") or "")!="2357926"]
              if len(diecast)<10:
                  raise SystemExit("Published catalog has fewer than 10 Diecast products.")
              if len(others)<900:
                  raise SystemExit("Safety stop: too many non-Diecast CJ products disappeared.")
              print(f"Validated Diecast products: {len(diecast)}")
              print(f"Preserved non-Diecast CJ products: {len(others)}")
          else:
              print("Diagnostic-only run: live CJ catalog left untouched.")
          PY

      - name: Publish Diecast expansion safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/diagnostics/diecast-expansion-v15-6-6.json
          if ! git diff --quiet -- data/cj-products.json; then
            git add data/cj-products.json
          fi

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi

          git commit -m "feat: expand Diecast CJ product coverage safely"
          git push origin HEAD:main
