name: TrendPilot V21.12 — Product Data Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-12-product-data-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Audit public product identity and seller data
        run: python scripts/audit-v21-12-product-data.py
      - name: Upload product data audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v21-12-product-data-audit
          path: artifacts/v21-12-product-data
          if-no-files-found: ignore
