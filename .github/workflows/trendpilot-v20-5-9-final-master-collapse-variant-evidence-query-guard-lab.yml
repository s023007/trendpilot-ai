                report+=`- \`${s.tpcid}\` — ${s.currency} ${s.priceBand} — ${s.sellerCount} sellers — ${s.productCount} products\n`;
              }
            }
          }

          report+=`\n## Gate
          - Failures: **${failures.length}**
          - Warnings: **${warnings.length}**
          - Result: **${summary.pass?"PASS":"FAIL"}**
          `;
          for(const x of failures)report+=`- FAILURE: ${x}\n`;
          for(const x of warnings)report+=`- WARNING: ${x}\n`;

          if(summary.pass){
            report+=`\n**V20.5.9 LAB PASS.** Review TPID grouping quality and multi-seller examples before any production integration.\n`;
          }else{
            report+=`\n**V20.5.9 LAB FAIL.** The site remains unchanged. Fix identity purity/integrity before integration.\n`;
          }

          setStage("write-report");
          fs.writeFileSync(path.join(OUT,"report.md"),report);
          setStage("complete");

          console.log(JSON.stringify(summary,null,2));
          if(!summary.pass)process.exit(2);
