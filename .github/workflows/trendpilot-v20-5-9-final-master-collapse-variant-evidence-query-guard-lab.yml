              }
            }

            if(altRows.length){
              report+=`\nAlternatives:\n`;
              for(const f of altRows.slice(0,8)){
                report+=`- ALT **${f.label}** — \`${f.tpid}\` — ${f.sellerCount} sellers — ${f.confidence||"n/a"}\n`;
              }
            }

            if(safeArr(q.comparisonSets).length){
              report+=`\nComparison sets:\n`;
