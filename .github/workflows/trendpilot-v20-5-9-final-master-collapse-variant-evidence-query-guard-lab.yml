name: TrendPilot V20.5.9 — Final Master Collapse + Variant Evidence + Query Guard Lab

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Comma-separated identity/search probes"
        required: false
        default: "H,F,iph,iphone,iPhone 16,iPhone 16 128GB,iPhone 16 Pro 128GB,phone,Galaxy S25,Redmi,ThinkPad,ThinkPad X1,ThinkPad X1 Carbon,MacBook Pro,Chromebook,laptop,headphones,power bank,perfume,dog food,air conditioner"

permissions:
  contents: read

concurrency:
  group: trendpilot-v20-5-9-final-master-collapse-variant-evidence-query-guard-lab
  cancel-in-progress: false

jobs:
  identity-registry-lab:
    name: Build read-only TPID / TPVID / TPOID registry
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify V19 canonical + V20 projection foundation
        shell: bash
        run: |
          set -euo pipefail
          test -s data/product-seller-registry-v17.json
          test -s data/catalog-v19/catalog-set-v1.json
          test -s data/catalog-v19/global-resolver-v1.json
          test -d data/catalog-v19/sellers
          test -s data/search-v20/manifest.json
          test -d data/search-v20/types

          python3 - <<'PY'
          from pathlib import Path
          import json

          blocked={"Temu","Joom","FilamentPRO EU CPS"}

          reg=json.loads(Path("data/product-seller-registry-v17.json").read_text())
          public=[x["name"] for x in reg.get("sellers",[]) if x.get("public") is True]
          assert len(public)==13, public
          assert not (set(public)&blocked), set(public)&blocked

          cat=json.loads(Path("data/catalog-v19/catalog-set-v1.json").read_text())
          names=[x["name"] for x in cat.get("sellers",[])]
          assert len(names)==13, names
          assert set(names)==set(public), (names,public)

          files=list(Path("data/catalog-v19/sellers").glob("*/products.ndjson"))
          assert len(files)>=13, len(files)

          m=json.loads(Path("data/search-v20/manifest.json").read_text())
          assert str(m.get("version","")).startswith("20.2."), m.get("version")
          assert m.get("catalogFilesLoaded")==13
          assert int(m.get("canonicalRecords",0))>50000
          assert m.get("duplicateProductKeys")==0
          assert m.get("blockedSellerLeaks")==0
          assert len(m.get("publicSellers",[]))==13

          print("Foundation PASS")
          print("Public sellers:",len(public))
          print("Canonical seller files:",len(files))
          print("Canonical records:",m.get("canonicalRecords"))
          print("Persisted search projection:",m.get("version"))
          PY

      - name: Build V20.5 master identity registry
        shell: bash
        env:
          TP_QUERIES: ${{ inputs.queries }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/v20-5-master-identity.mjs" <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";

          const ROOT=process.cwd();
          const OUT=path.join(process.env.RUNNER_TEMP||"/tmp","trendpilot-v20-5-identity-lab");
          fs.mkdirSync(OUT,{recursive:true});

          const norm=v=>String(v??"").normalize("NFKD").replace(/\p{M}+/gu,"").toLowerCase()
            .replace(/[’‘`´]/g,"'").replace(/[_/\\|]+/g," ")
            .replace(/[^\p{L}\p{N}.+\-'" ]+/gu," ").replace(/\s+/g," ").trim();
          const compact=v=>norm(v).replace(/[^\p{L}\p{N}]+/gu,"");
          const clean=v=>String(v??"").replace(/\s+/g," ").trim();
          const uniq=a=>[...new Set((a||[]).filter(Boolean))];
          const sha=v=>crypto.createHash("sha256").update(String(v)).digest("hex");
          const code=(prefix,key,n=14)=>`${prefix}-${sha(key).slice(0,n).toUpperCase()}`;
          const validUrl=v=>/^https?:\/\//i.test(clean(v));
          const arr=v=>Array.isArray(v)?v:[];
          const safeArr=v=>Array.isArray(v)?v:[];
          const safeObj=v=>(v&&typeof v==="object"&&!Array.isArray(v))?v:{};
          let TP_STAGE="startup";
          const setStage=s=>{ TP_STAGE=s; console.log(`[TP_STAGE] ${s}`); };

          process.on("uncaughtException",err=>{
            console.error(`[TP_FATAL] stage=${TP_STAGE}`);
            console.error(err?.stack||err);
            process.exit(1);
          });
          process.on("unhandledRejection",err=>{
            console.error(`[TP_FATAL] stage=${TP_STAGE}`);
            console.error(err?.stack||err);
            process.exit(1);
          });
          const get=(o,p,d="")=>{
            try{
              let x=o;
              for(const k of p.split(".")){ if(x==null)return d; x=x[k]; }
              return x==null?d:x;
            }catch{return d;}
          };
          const first=(...xs)=>xs.find(x=>clean(x))??"";
          const number=v=>{
            if(v&&typeof v==="object")v=v.amount??v.value??v.price??v.current??0;
            const n=Number(String(v??"").replace(/[^0-9.+-]/g,""));
            return Number.isFinite(n)&&n>0?n:null;
          };

          const BLOCKED=new Set(["temu","joom","filamentpro","filamentpro eu cps"]);

          const registry=JSON.parse(fs.readFileSync(path.join(ROOT,"data/product-seller-registry-v17.json"),"utf8"));
          const publicSellers=registry.sellers.filter(x=>x.public===true).map(x=>clean(x.name));
          const publicSet=new Set(publicSellers);
          if(publicSellers.length!==13)throw new Error(`Expected 13 public sellers, got ${publicSellers.length}`);
          for(const s of publicSellers)if(BLOCKED.has(norm(s)))throw new Error(`Blocked public seller: ${s}`);

          const catalogSet=JSON.parse(fs.readFileSync(path.join(ROOT,"data/catalog-v19/catalog-set-v1.json"),"utf8"));
          const catalogSellerNames=(catalogSet.sellers||[]).map(x=>clean(x.name));
          if(catalogSellerNames.length!==13)throw new Error("V19 catalog set is not 13 sellers.");

          const v19Resolver=JSON.parse(fs.readFileSync(path.join(ROOT,"data/catalog-v19/global-resolver-v1.json"),"utf8"));
          const searchRoot=path.join(ROOT,"data/search-v20");
          const searchManifest=JSON.parse(fs.readFileSync(path.join(searchRoot,"manifest.json"),"utf8"));

          // V20 persisted type/role projection: only a classification input.
          const supportedTypes=Object.keys(searchManifest.typeCounts||{});
          const typeMeta=new Map();
          for(const type of supportedTypes){
            const p=path.join(searchRoot,"types",`${type}.json`);
            if(!fs.existsSync(p))continue;
            const payload=JSON.parse(fs.readFileSync(p,"utf8"));
            for(const r of arr(payload.main)){
              if(!r?.key)continue;
              typeMeta.set(r.key,{type,role:"main",shadow:r});
            }
            for(const r of arr(payload.related)){
              if(!r?.key)continue;
              const prev=typeMeta.get(r.key)||{};
              if(!prev.role)typeMeta.set(r.key,{...prev,type,role:"related",shadow:r});
            }
          }

          function canonicalRow(raw){
            const seller=clean(first(get(raw,"seller.name"),raw.seller,get(raw,"merchant.name"),raw.merchant));
            if(!seller||!publicSet.has(seller)||BLOCKED.has(norm(seller)))return null;
            const productKey=clean(raw.productKey);
            const name=clean(first(get(raw,"name.display"),raw.name,raw.title));
            if(!productKey||!name)return null;

            const ids0=raw.identifiers||{};
            const identity=raw.identity||{};
            const tm=typeMeta.get(productKey)||{};
            const shadow=tm.shadow||{};
            const brand=clean(first(raw.brand,get(raw,"manufacturer.name")));
            const model=clean(first(ids0.model,ids0.explicitModel,get(raw,"model.name"),shadow.identifiers?.model));
            const modelConfidence=clean(identity.modelConfidence||"none");

            const image=clean(first(
              get(raw,"media.primaryImage"),get(raw,"media.image"),get(raw,"image.url"),
              raw.imageUrl,arr(get(raw,"media.images"))[0],arr(raw.images)[0]
            ));
            const url=clean(first(
              get(raw,"links.affiliate"),get(raw,"links.affiliateUrl"),
              get(raw,"links.destination"),get(raw,"links.destinationUrl"),
              raw.affiliateUrl,raw.destinationUrl,raw.url
            ));

            const ids={
              sellerProductId:clean(first(ids0.sellerProductId,shadow.identifiers?.sellerProductId)),
              sku:clean(first(ids0.sku,shadow.identifiers?.sku)),
              mpn:clean(first(ids0.mpn,shadow.identifiers?.mpn)),
              model,
              explicitModel:clean(first(modelConfidence==="explicit"?model:"",shadow.identifiers?.model)),
              gtin:clean(first(ids0.gtin,shadow.identifiers?.gtin)),
              ean:clean(first(ids0.ean,shadow.identifiers?.ean)),
              upc:clean(first(ids0.upc,shadow.identifiers?.upc)),
              isbn:clean(first(ids0.isbn,shadow.identifiers?.isbn))
            };

            return {
              productKey,seller,name,brand,modelConfidence,ids,
              type:clean(tm.type),role:clean(tm.role),
              price:number(first(get(raw,"offer.price"),get(raw,"offer.currentPrice"),raw.price)),
              currency:clean(first(get(raw,"offer.currency"),raw.currency,"USD"))||"USD",
              image:validUrl(image)?image:"",
              url:validUrl(url)?url:"",
              quality:Number(get(raw,"quality.score",raw.quality)||shadow.quality||0)||0
            };
          }

          const catalogFiles=[];
          const catalogRoot=path.join(ROOT,"data/catalog-v19/sellers");
          for(const ent of fs.readdirSync(catalogRoot,{withFileTypes:true})){
            if(!ent.isDirectory())continue;
            const p=path.join(catalogRoot,ent.name,"products.ndjson");
            if(fs.existsSync(p))catalogFiles.push(p);
          }

          setStage("load-canonical-rows");
          const rows=[];
          const productKeys=new Set();
          const duplicateProductKeys=[];
          for(const p of catalogFiles){
            for(const line of fs.readFileSync(p,"utf8").split(/\r?\n/)){
              if(!line.trim())continue;
              let raw; try{raw=JSON.parse(line)}catch{continue;}
              const r=canonicalRow(raw); if(!r)continue;
              if(productKeys.has(r.productKey)){duplicateProductKeys.push(r.productKey);continue;}
              productKeys.add(r.productKey); rows.push(r);
            }
          }
          if(rows.length<50000)throw new Error(`Canonical foundation unexpectedly small: ${rows.length}`);
          if(duplicateProductKeys.length)throw new Error(`Duplicate product keys: ${duplicateProductKeys.length}`);

          // ------------------------------------------------------------
          // Product essence: classify the thing being sold, not a compatible target.
          // ------------------------------------------------------------
          // ------------------------------------------------------------
          // V20.5.8 Object-Noun Truth Gate
          // Determine WHAT is actually being sold before identity/model extraction.
          // A compatibility target ("for iPhone 15") must never redefine the object.
          // ------------------------------------------------------------
          // ------------------------------------------------------------
          // V20.5.8 Global Object-Noun Truth vocabulary.
          // These rules are seller-agnostic: all 13 public sellers pass through
          // the same object gate before model extraction or TPID grouping.
          // ------------------------------------------------------------
          const phoneTarget=/\b(iphone|galaxy|redmi|pixel|oneplus|poco|realme|smartphone|smart phone|mobile phone|cell phone)\b/i;
          const laptopTarget=/\b(thinkpad|ideapad|macbook|chromebook|vivobook|zenbook|latitude|elitebook|probook|laptop|notebook|ultrabook)\b/i;
          const watchTarget=/\b(apple watch|galaxy watch|smartwatch|smart watch|fitness watch)\b/i;

          const phoneAccessoryObject=/\b(case|cover|screen protector|protector|tempered glass|charger|charging cable|cable|adapter|holder|stand|mount|gimbal|microphone|ssd|enclosure|dongle|armband|speaker|sticker|skin|housing|digitizer|lcd|display assembly|replacement screen|battery replacement|repair kit|camera lens|phone charm)\b/i;

          const laptopHardAccessoryObject=/\b(module|lte module|4g module|5g module|wwan module|keyboard|trackpad|touchpad|top case|topcase|palmrest|motherboard|logic board|mainboard|display assembly|screen assembly|screen panel|digitizer|screen protector|privacy filter|skin|sticker|camera cover|webcam cover|camera dome cover|charger|power adapter|dock|docking station|usb hub|usb-c hub|usb c hub|hub|converter|displayport adapter|mini displayport|hdmi cable|video cable|sleeve|bag|backpack|messenger|topload|stand|cooling pad|laptop cooler|hinge|bezel|repair service|repair and exchange|replacement part)\b/i;
          const laptopComponentObject=/\b(lcd|display|screen|touch screen|battery|replacement battery|ssd|solid state drive|hard drive|hdd|storage drive|ram|memory|memory module|ram module|ddr3|ddr4|ddr5|sodimm|so-dimm|so dimm)\b/i;
          const laptopCompatibilityContext=/\b(for|compatible with|replacement for|fit for|fits)\b.{0,80}\b(macbook|thinkpad|ideapad|chromebook|laptop|notebook)\b/i;
          const laptopComponentForContext=/\b(lcd|display|screen|battery|ssd|hard drive|hdd|ram|memory|ddr3|ddr4|ddr5|sodimm|so-dimm)\b.{0,50}\b(for|compatible with|replacement for|fit for|fits)\b/i;

          function laptopAccessoryTruth(t){
            const s=clean(t);
            if(laptopHardAccessoryObject.test(s))return true;
            if(/\blaptop\s+(ssd|ram|memory|hard drive|hdd|battery|screen|display)\b/i.test(s))return true;
            if(laptopComponentObject.test(s) && (laptopCompatibilityContext.test(s)||laptopComponentForContext.test(s)))return true;
            if(/\b(replacement|repair)\b/i.test(s) && laptopComponentObject.test(s))return true;
            return false;
          }

          const watchAccessoryObject=/\b(watch band|watch strap|replacement band|replacement strap|watch case|watch cover|watch protector|watch charger|charging dock|watch screen protector)\b/i;

          const perfumeContainerOrNonPerfume=/\b(empty perfume|empty refillable|empty bottle|refillable bottle|refillable perfume|perfume dispenser|perfume spray bottle|spray bottle|travel perfume bottle|portable perfume bottle|atomizer|perfume atomizer|organizer|holder|display stand|car air vent|vent clip|fragrance cup|smelling cup|tea[- ]?tasting fragrance cup|teacup|tea cup|tea bowl|tea set|tableware|jianzhan|ceramic cup)\b/i;

          const perfumeStrong=/\b(perfume|parfum|eau de parfum|eau de toilette|eau de cologne|cologne|attar|perfume oil|fragrance spray|fragrance mist|body mist|\bEDP\b|\bEDT\b)\b/i;

          const powerBankStrong=/\b(power bank|powerbank|portable battery pack|external battery pack|solar power bank)\b/i;
          const chargerOnlyObject=/\b(wall charger|charger block|charging block|usb charger|pd charger|gan charger|charger cable|charging cable|usb[- ]?c cable|type[- ]?c cable|lightning cable|power adapter)\b/i;

          const headphonesStrong=/\b(headphones?|headsets?|earbuds?|earphones?|airpods?|air pods|tws pods)\b/i;
          const speakerObject=/\b(bluetooth speaker|wireless speaker|portable speaker|speakerphone)\b/i;
          const headphonesContainerObject=/\b(headset bag|headphone bag|earbud bag|earphone bag|cosmetics? bag|mini duffle bag|storage pouch|headphone case|headset case|earbud case|earphone case|keychain bag|zipper bag)\b/i;

          const dogFoodStrong=/\b(dog food|puppy food|canine food|dog kibble|puppy kibble|dog treats|puppy treats)\b/i;
          const dogFoodAccessory=/\b(feeder|dispenser|bowl|container|storage bin|food maker|food processor|machine)\b/i;

          const airConditionerStrong=/\b(air conditioner|air conditioning|split ac|portable ac|window ac|ac unit)\b/i;
          const airConditionerPart=/\b(remote|filter|control board|pcb|capacitor|compressor part|fan motor|sensor|cover|replacement part|tool|reamer|flaring tool|pliers|clamp|pipe|copper pipe|tube|tubing|refrigerant tube|liquid tube|hose|brush|cleaning brush|grille|ventilation grille|vent grille|belt|generator belt|air conditioning belt|outlet gap|dust brush|bracket|mounting bracket|window bracket|drain hose|duct adapter)\b/i;
          const airConditionerPseudoUnit=/\b(evaporative cooler|swamp cooler|air cooler fan|water cooling fan|cooling mist|mist fan|humidifier|usb rechargeable fan|rechargeable fan|desktop air cooler|personal air cooler|mini air conditioner fan|portable air conditioner fan|air conditioner fan|mini air cooler|portable air cooler)\b/i;
          const airConditionerUnitProof=/\b(\d{4,5}\s*BTU|BTU|mini[- ]?split|split air conditioner|window air conditioner|portable air conditioner|duct(?:ed)? air conditioner|inverter air conditioner)\b/i;

          const filamentStrong=/\b(3d filament|printer filament|pla filament|petg filament|abs filament|tpu filament|filament 1\.75)\b/i;
          const cookwareStrong=/\b(cookware|frying pan|saucepan|stockpot|casserole|skillet|wok|cooking pot)\b/i;
          const cookwarePart=/\b(replacement handle|pot handle|pan handle|replacement lid|glass lid only|cookware rack)\b/i;
          const lightingStrong=/\b(ceiling light|wall light|led strip|light bulb|lamp|lighting)\b/i;
          const lightingPart=/\b(led connector|strip connector|light controller|led controller|driver only|lamp holder|bulb holder|mounting bracket)\b/i;
          const toolsStrong=/\b(power tool|hand tool|drill|screwdriver|wrench|pliers|hammer|saw|cutter|multimeter|socket set|angle grinder)\b/i;



          function rawPhoneModelFromTitle(t){
            let m;
            m=t.match(/\b(iPhone\s*(?:XS(?:\s*Max)?|XR|X|5|6|7|8|11|12|13|14|15|16|17)(?:\s*(?:Pro Max|Pro|Plus|Mini|Max))?)\b/i);
            if(m)return clean(m[1]);
            m=t.match(/\b((?:Xiaomi\s+)?Redmi(?:\s+Note)?\s*[A-Z0-9]+(?:\s*(?:Pro\+?|Pro|Plus|Ultra|5G))?)\b/i);
            if(m){
              const candidate=clean(m[1]);
              if(/\b(airdot|airdots|buds?|band|watch|case|cover)\b/i.test(candidate))return "";
              return candidate;
            }
            m=t.match(/\b((?:Samsung\s+)?Galaxy\s*(?:S|A|M|Z|Note)\s*\d+(?:\s*(?:Ultra|Plus|\+|FE|5G))?)\b/i);
            if(m)return clean(m[1]);
            m=t.match(/\b((?:Google\s+)?Pixel\s*\d+(?:\s*(?:Pro|XL|a))?)\b/i);
            if(m)return clean(m[1]);
            m=t.match(/\b(OnePlus\s*\d+(?:\s*(?:Pro|R|T))?)\b/i); if(m)return clean(m[1]);
            m=t.match(/\b(POCO\s+[A-Z]\d+(?:\s*(?:Pro|GT))?)\b/i); if(m)return clean(m[1]);
            m=t.match(/\b(realme\s+[A-Z0-9]+\s*(?:Pro\+?|Pro|5G)?)\b/i); if(m)return clean(m[1]);
            return "";
          }

          function rawLaptopModelFromTitle(t){
            let m;
            m=t.match(/\b(ThinkPad\s+(?:X1(?:\s+(?:Carbon|Yoga|Nano|Extreme|Fold|Tablet))?|T\d{2,3}[A-Z]?|X\d{2,3}[A-Z]?|L\d{2,3}[A-Z]?|E\d{2,3}[A-Z]?|P\d{2,3}[A-Z]?|Z\d{2,3}[A-Z]?))\b/i);
            if(m)return clean(m[1]);
            m=t.match(/\b(IdeaPad\s+[A-Z0-9][A-Z0-9\- ]{0,18})\b/i); if(m)return clean(m[1]);
            m=t.match(/\b(MacBook\s+(?:Air|Pro)(?:\s+\d{2})?)\b/i); if(m)return clean(m[1]);
            m=t.match(/\b(VivoBook\s+[A-Z0-9\-]+)\b/i); if(m)return clean(m[1]);
            m=t.match(/\b(ZenBook\s+[A-Z0-9\-]+)\b/i); if(m)return clean(m[1]);
            m=t.match(/\b(Latitude\s+\d{4})\b/i); if(m)return clean(m[1]);
            m=t.match(/\b(EliteBook\s+[A-Z0-9\- ]{2,16})\b/i); if(m)return clean(m[1]);
            m=t.match(/\b(ProBook\s+[A-Z0-9\- ]{2,16})\b/i); if(m)return clean(m[1]);
            m=t.match(/\b([A-Z0-9\-]*Chromebook[A-Z0-9\- ]*)\b/i); if(m)return clean(m[1]).slice(0,48);
            return "";
          }

          function productTruth(r){
            const t=clean(r.name);
            const current=clean(r.type);

            // 1) Explicit services/replacement objects always beat a compatible target.
            if(/\b(repair service|repair and exchange|replacement service|for repair|replacement part)\b/i.test(t)){
              return {core:false,type:"related",objectClass:"service-or-replacement",reason:"sold-object-service-or-replacement"};
            }

            // 2) Strong whole-product object classes with high-precision exclusions.
            if(powerBankStrong.test(t)){
              return {core:true,type:"power_bank",objectClass:"power-bank",reason:"sold-object-power-bank"};
            }
            if(chargerOnlyObject.test(t) && !powerBankStrong.test(t)){
              return {core:false,type:"related",objectClass:"charger-or-cable",reason:"charger-not-power-bank"};
            }

            if(perfumeContainerOrNonPerfume.test(t) ||
               (/\b(refillable|empty|portable|travel)\b/i.test(t) && /\b(bottle|dispenser|atomizer)\b/i.test(t) && /\bperfume\b/i.test(t))){
              return {core:false,type:"related",objectClass:"perfume-container-or-nonperfume",reason:"perfume-word-not-product"};
            }
            if(perfumeStrong.test(t)){
              return {core:true,type:"perfume",objectClass:"perfume",reason:"sold-object-perfume"};
            }
            // Bare word "fragrance" is discovery text only, never enough for perfume.
            if(/\bfragrance\b/i.test(t) && !perfumeStrong.test(t)){
              return {core:false,type:"related",objectClass:"fragrance-context-only",reason:"bare-fragrance-not-perfume"};
            }

            if(speakerObject.test(t) && !headphonesStrong.test(t)){
              return {core:false,type:"related",objectClass:"speaker",reason:"speaker-not-headphones"};
            }
            if(headphonesStrong.test(t)){
              if(headphonesContainerObject.test(t) ||
                 /\b(headphone plug|headset plug|headphone stand|headset stand|airpod case|airpods case|replacement ear pads?|ear cushions?)\b/i.test(t)){
                return {core:false,type:"related",objectClass:"headphone-accessory",reason:"headphone-accessory-object"};
              }
              return {core:true,type:"headphones",objectClass:"headphones",reason:"sold-object-headphones"};
            }

            if(watchAccessoryObject.test(t)){
              return {core:false,type:"related",objectClass:"watch-accessory",reason:"watch-accessory-object"};
            }
            if(/\b(smartwatch|smart watch|apple watch|galaxy watch|fitness watch)\b/i.test(t)){
              return {core:true,type:"smartwatch",objectClass:"smartwatch",reason:"sold-object-smartwatch"};
            }

            if(dogFoodStrong.test(t)){
              if(dogFoodAccessory.test(t)){
                return {core:false,type:"related",objectClass:"pet-food-accessory",reason:"pet-food-machine-or-container"};
              }
              return {core:true,type:"dog_food",objectClass:"dog-food",reason:"sold-object-dog-food"};
            }

            if(airConditionerStrong.test(t)){
              if(airConditionerPart.test(t)){
                return {core:false,type:"related",objectClass:"air-conditioner-part",reason:"ac-part-not-unit"};
              }
              if(airConditionerPseudoUnit.test(t)){
                return {core:false,type:"related",objectClass:"air-cooler-not-ac",reason:"evaporative-or-fan-not-air-conditioner"};
              }
              if(!airConditionerUnitProof.test(t)){
                return {core:false,type:"related",objectClass:"ac-unproven-unit",reason:"air-conditioner-without-unit-proof"};
              }
              return {core:true,type:"air_conditioner",objectClass:"air-conditioner",reason:"sold-object-air-conditioner"};
            }

            if(filamentStrong.test(t)){
              return {core:true,type:"3d_filament",objectClass:"3d-filament",reason:"sold-object-filament"};
            }
            if(cookwareStrong.test(t)){
              if(cookwarePart.test(t)){
                return {core:false,type:"related",objectClass:"cookware-part",reason:"cookware-part-not-set"};
              }
              return {core:true,type:"cookware",objectClass:"cookware",reason:"sold-object-cookware"};
            }
            if(lightingStrong.test(t)){
              if(lightingPart.test(t)){
                return {core:false,type:"related",objectClass:"lighting-part",reason:"lighting-part-not-light"};
              }
              return {core:true,type:"lighting",objectClass:"lighting",reason:"sold-object-lighting"};
            }
            if(toolsStrong.test(t)){
              return {core:true,type:"tools",objectClass:"tool",reason:"sold-object-tool"};
            }

            // 3) Device-family target + explicit accessory/component noun.
            if(laptopTarget.test(t) && laptopAccessoryTruth(t)){
              return {core:false,type:"related",objectClass:"laptop-accessory-or-part",reason:"laptop-target-is-compatibility-only"};
            }
            if(phoneTarget.test(t) && phoneAccessoryObject.test(t)){
              return {core:false,type:"related",objectClass:"phone-accessory-or-part",reason:"phone-target-is-compatibility-only"};
            }

            // 4) Only after object exclusions may a device model define the sold object.
            const pm=rawPhoneModelFromTitle(t);
            if(pm||/\b(smartphone|smart phone|mobile phone|cell phone|feature phone|android phone)\b/i.test(t)){
              return {core:true,type:"phone",objectClass:"phone",reason:pm?"sold-object-phone-model":"sold-object-phone"};
            }

            const lm=rawLaptopModelFromTitle(t);
            if(lm||/\b(laptop|notebook|chromebook|ultrabook|2[- ]in[- ]1 laptop)\b/i.test(t)){
              return {core:true,type:"laptop",objectClass:"laptop",reason:lm?"sold-object-laptop-model":"sold-object-laptop"};
            }

            // 5) Keep legacy MAIN fallback only for less ambiguous object types.
            if(r.role==="main" && current && ![
              "phone","laptop","perfume","power_bank","smartwatch","headphones",
              "dog_food","air_conditioner","cookware","lighting"
            ].includes(current)){
              return {core:true,type:current,objectClass:current,reason:"v20-main-fallback"};
            }

            return {core:false,type:current||"related",objectClass:"unproven",reason:"no-sold-object-proof"};
          }

          function essenceMain(r){
            return productTruth(r).core===true;
          }

          function deriveBrand(r,truthType=""){
            const t=r.name;
            const type=truthType||productTruth(r).type;
            if(type==="phone"){
              if(/\biphone\b/i.test(t))return "Apple";
              if(/\bredmi\b|\bxiaomi\b|\bmi \d/i.test(t))return "Xiaomi";
              if(/\bgalaxy\b/i.test(t))return "Samsung";
              if(/\bpixel\s*\d/i.test(t))return "Google";
              if(/\boneplus\b/i.test(t))return "OnePlus";
              if(/\bpoco\b/i.test(t))return "POCO";
              if(/\brealme\b/i.test(t))return "realme";
            }
            if(type==="laptop"){
              if(/\bthinkpad\b|\bideapad\b|\blegion\b/i.test(t))return "Lenovo";
              if(/\bmacbook\b/i.test(t))return "Apple";
              if(/\bvivobook\b|\bzenbook\b/i.test(t))return "ASUS";
              if(/\blatitude\b/i.test(t))return "Dell";
              if(/\belitebook\b|\bprobook\b/i.test(t))return "HP";
            }
            return clean(r.brand);
          }

          function titleModel(r,truthType=""){
            const type=truthType||productTruth(r).type;
            if(type==="phone")return rawPhoneModelFromTitle(clean(r.name));
            if(type==="laptop")return rawLaptopModelFromTitle(clean(r.name));
            if(type==="smartwatch"){
              let m;
              m=r.name.match(/\b(Apple Watch\s+(?:Series\s*)?\d+(?:\s*Ultra\s*\d*)?)\b/i); if(m)return clean(m[1]);
              m=r.name.match(/\b(Galaxy Watch\s*\d+(?:\s*(?:Pro|Classic|Ultra))?)\b/i); if(m)return clean(m[1]);
            }
            return "";
          }

          function canonicalModel(r,truthType=""){
            const type=truthType||productTruth(r).type;
            const raw=clean(titleModel(r,type));
            if(!raw)return "";
            let s=raw;

            if(type==="phone"){
              s=s.replace(/^iphone\s*/i,"iPhone ");
              s=s.replace(/^iPhone\s+(XS)\s*Max$/i,"iPhone XS Max");
              s=s.replace(/^iPhone\s+(XS|XR|X)$/i,(_,x)=>`iPhone ${x.toUpperCase()}`);
              s=s.replace(/^iPhone\s+(\d+)\s*(Pro Max|Pro|Plus|Mini|Max)?$/i,
                (_,n,v)=>{
                  const vv=clean(v).toLowerCase();
                  const map={"pro max":"Pro Max","pro":"Pro","plus":"Plus","mini":"Mini","max":"Max"};
                  return `iPhone ${n}${vv?` ${map[vv]||clean(v)}`:""}`;
                });
              s=s.replace(/^xiaomi\s+/i,"Xiaomi ");
              s=s.replace(/\bredmi\s+note\s*/i,"Redmi Note ");
              s=s.replace(/\bredmi\s*/i,"Redmi ");
              s=s.replace(/\bgalaxy\s+([samz])\s*(\d+)/i,(_,p,n)=>`Galaxy ${p.toUpperCase()}${n}`);
              s=s.replace(/\bpixel\s*(\d+)/i,(_,n)=>`Pixel ${n}`);
            }

            if(type==="laptop"){
              s=s.replace(/^thinkpad\s+/i,"ThinkPad ");
              s=s.replace(/^ideapad\s+/i,"IdeaPad ");
            }

            return clean(s);
          }

          // ------------------------------------------------------------
          // V20.5.8 Global model ambiguity framework
          // Applies to ALL public sellers before TPID grouping.
          // Generic family/root names are SEARCH ALIASES, never exact identities.
          // ------------------------------------------------------------
          function modelFamilyAlias(type,brand,model){
            const m=clean(model);
            if(!m)return "";

            if(type==="laptop"){
              if(/^ThinkPad X1(?:\s|$)/i.test(m))return "ThinkPad X1";
              if(/^ThinkPad T\d{2,3}[A-Z]?/i.test(m))return m.match(/^ThinkPad T\d{2,3}[A-Z]?/i)?.[0]||m;
              if(/^ThinkPad X\d{2,3}[A-Z]?/i.test(m))return m.match(/^ThinkPad X\d{2,3}[A-Z]?/i)?.[0]||m;
              if(/^ThinkPad L\d{2,3}[A-Z]?/i.test(m))return m.match(/^ThinkPad L\d{2,3}[A-Z]?/i)?.[0]||m;
              if(/^ThinkPad E\d{2,3}[A-Z]?/i.test(m))return m.match(/^ThinkPad E\d{2,3}[A-Z]?/i)?.[0]||m;
              if(/^ThinkPad P\d{2,3}[A-Z]?/i.test(m))return m.match(/^ThinkPad P\d{2,3}[A-Z]?/i)?.[0]||m;
              if(/^MacBook Pro(?:\s|$)/i.test(m))return "MacBook Pro";
              if(/^MacBook Air(?:\s|$)/i.test(m))return "MacBook Air";
              if(/^IdeaPad\b/i.test(m))return clean(m.split(/\s+/).slice(0,2).join(" "));
              if(/\bChromebook\b/i.test(m))return "Chromebook";
            }

            if(type==="phone"){
              const p=m.match(/^iPhone\s+(XS(?:\s+Max)?|XR|X|\d+)/i);
              if(p){
                const v=clean(p[1]);
                if(/^xs\s+max$/i.test(v))return "iPhone XS Max";
                return `iPhone ${v.toUpperCase()}`;
              }
              const r=m.match(/^(?:Xiaomi\s+)?Redmi(?:\s+Note)?\s+[A-Z0-9]+/i);
              if(r)return clean(r[0]);
              const g=m.match(/^(?:Samsung\s+)?Galaxy\s+[SAMZ]\d+/i);
              if(g)return clean(g[0]);
              const px=m.match(/^(?:Google\s+)?Pixel\s+\d+/i);
              if(px)return clean(px[0]);
            }

            if(type==="smartwatch"){
              const a=m.match(/^Apple Watch(?:\s+Series)?\s+\d+/i); if(a)return clean(a[0]);
              const g=m.match(/^Galaxy Watch\s+\d+/i); if(g)return clean(g[0]);
            }

            return "";
          }

          function canonicalModelSpecificity(type,brand,model,name=""){
            const m=clean(model);
            const n=clean(name);
            if(!m)return {specific:false,ambiguous:true,reason:"no-model",familyAlias:""};

            const familyAlias=modelFamilyAlias(type,brand,m);

            if(type==="laptop"){
              if(/^ThinkPad X1$/i.test(m)){
                return {specific:false,ambiguous:true,reason:"generic-thinkpad-x1",familyAlias:"ThinkPad X1"};
              }
              if(/^MacBook (?:Pro|Air)$/i.test(m)){
                return {specific:false,ambiguous:true,reason:"generic-macbook-family",familyAlias:m};
              }
              if(/^Chromebook$/i.test(m)){
                return {specific:false,ambiguous:true,reason:"generic-chromebook",familyAlias:"Chromebook"};
              }
              if(/^IdeaPad$/i.test(m)){
                return {specific:false,ambiguous:true,reason:"generic-ideapad",familyAlias:"IdeaPad"};
              }

              if(/^ThinkPad X1\s+(Carbon|Yoga|Nano|Extreme|Fold|Tablet)\b/i.test(m)){
                return {specific:true,ambiguous:false,reason:"specific-thinkpad-x1-branch",familyAlias:"ThinkPad X1"};
              }

              if(familyAlias && /\bGen(?:eration)?\s*\d+\b/i.test(n)){
                return {specific:true,ambiguous:false,reason:"family-plus-generation",familyAlias};
              }
            }

            if(type==="phone"){
              if(/^iPhone\s+(?:X|XS|XR|\d+)(?:\s+(?:Pro Max|Pro|Plus|Mini|Max))?$/i.test(m)){
                return {specific:true,ambiguous:false,reason:"iphone-generation",familyAlias};
              }
              if(/\b(?:Redmi|Galaxy|Pixel|OnePlus|POCO|realme)\b/i.test(m) && /\d/i.test(m)){
                return {specific:true,ambiguous:false,reason:"numbered-phone-model",familyAlias};
              }
            }

            const tokens=norm(m).split(/\s+/).filter(Boolean);
            if(tokens.length===1 && !/\d/.test(m)){
              return {specific:false,ambiguous:true,reason:"single-token-generic-model",familyAlias:familyAlias||m};
            }

            return {specific:true,ambiguous:false,reason:"model-specific-enough",familyAlias};
          }

          function generationFromTitle(t){
            const m=String(t).match(/\bGen(?:eration)?\s*(\d+)\b/i);
            return m?`Gen ${m[1]}`:"";
          }

          function usableExplicitModel(r,truthType=""){
            const m=clean(r.ids.explicitModel);
            if(!m||m.length<2||m.length>70)return "";
            const type=truthType||productTruth(r).type;
            if(type!=="phone" && rawPhoneModelFromTitle(m))return "";
            if(type!=="laptop" && rawLaptopModelFromTitle(m))return "";
            if(/\b(case|cover|charger|cable|adapter|battery|pen|cooler|organizer|atomizer|bottle)\b/i.test(m))return "";
            return m;
          }

          function globalId(r){
            for(const f of ["gtin","ean","upc","isbn"]){
              const v=compact(r.ids[f]);
              if(v.length>=6)return `${f}:${v}`;
            }
            return "";
          }

          function storageOf(t){
            const s=String(t);
            const vals=[];

            // Combined memory notation: 8+128GB, 8GB+128GB, 12/256GB.
            for(const m of s.matchAll(/\b(?:2|3|4|6|8|12|16|18|24|32)\s*(?:GB|G)?\s*[+\/]\s*(32|64|128|256|512|1024|2048)\s*(?:GB|G)\b/ig)){
              vals.push(Number(m[1]));
            }

            // Explicit storage/ROM/SSD notation.
            for(const m of s.matchAll(/\b(32|64|128|256|512|1024|2048)\s*(?:GB|G)\s*(?:ROM|Storage|SSD|UFS)?\b/ig)){
              const whole=m[0];
              if(/\b(?:RAM|Memory)\b/i.test(whole))continue;
              vals.push(Number(m[1]));
            }

            for(const m of s.matchAll(/\b(1|2|4)\s*TB\s*(?:SSD|Storage|ROM)?\b/ig)){
              vals.push(Number(m[1])*1024);
            }

            if(!vals.length)return "";
            return `${Math.max(...vals)}GB`;
          }

          function ramOf(t){
            const s=String(t);
            let m=s.match(/\b(2|3|4|6|8|12|16|18|24|32|64)\s*(?:GB|G)\s*(?:RAM|Memory)\b/i);
            if(m)return `${m[1]}GB`;
            m=s.match(/\b(?:RAM|Memory)\s*[:\-]?\s*(2|3|4|6|8|12|16|18|24|32|64)\s*(?:GB|G)\b/i);
            return m?`${m[1]}GB`:"";
          }

          function variantIntentOf(q){
            const s=String(q);
            return {
              storage:storageOf(s),
              ram:ramOf(s),
              generation:generationFromTitle(s),
              condition:conditionOf(s)
            };
          }

          function hasVariantIntent(v){
            return !!(v.storage||v.ram||v.generation||v.condition);
          }

          function variantMatchesIntent(v,intent){
            if(intent.storage && clean(v.storage)!==clean(intent.storage))return false;
            if(intent.ram && clean(v.ram)!==clean(intent.ram))return false;
            if(intent.generation && clean(v.generation)!==clean(intent.generation))return false;
            if(intent.condition && clean(v.condition)!==clean(intent.condition))return false;
            return true;
          }

          // ------------------------------------------------------------
          // Safe reuse of V19 identity hints.
          // A historical V19 group is allowed to define a TPID only when ALL
          // available members are clean MAIN products and all share one type.
          // This prevents "case for iPhone 11" from inheriting the phone TPID.
          // ------------------------------------------------------------
          const rowByKey=new Map(rows.map(r=>[r.productKey,r]));
          const rejectedV19StrongGroups=[];
          const rejectedV19ModelGroups=[];

          function pureIdentityMembers(productKeys){
            const keys=uniq(productKeys||[]);
            const members=keys.map(k=>rowByKey.get(k)).filter(Boolean);
            if(members.length<1)return {ok:false,members,reason:"no-members"};
            if(members.length!==keys.length)return {ok:false,members,reason:"missing-members"};
            const truths=members.map(productTruth);
            if(truths.some(x=>!x.core))return {ok:false,members,reason:"non-core-member"};
            const types=uniq(truths.map(x=>x.type).filter(Boolean));
            if(types.length!==1)return {ok:false,members,reason:"mixed-truth-types"};
            return {ok:true,members,type:types[0],reason:"pure"};
          }

          const v19StrongByProduct=new Map();
          for(const g of arr(v19Resolver.autoGroups)){
            const p=pureIdentityMembers(g.productKeys);
            if(!p.ok){
              rejectedV19StrongGroups.push({
                groupId:clean(g.groupId||""),
                reason:clean(g.reason||""),
                rejection:p.reason,
                productKeys:arr(g.productKeys)
              });
              continue;
            }
            for(const r of p.members){
              if(!v19StrongByProduct.has(r.productKey)){
                v19StrongByProduct.set(r.productKey,{
                  groupId:clean(g.groupId||""),
                  reason:clean(g.reason||""),
                  type:p.type
                });
              }
            }
          }

          const v19ModelKeyByProduct=new Map();
          for(const [k,keys] of Object.entries(v19Resolver.byBrandExplicitModel||{})){
            const p=pureIdentityMembers(keys);
            if(!p.ok){
              rejectedV19ModelGroups.push({
                key:k,rejection:p.reason,productKeys:arr(keys)
              });
              continue;
            }
            for(const r of p.members){
              if(!v19ModelKeyByProduct.has(r.productKey))v19ModelKeyByProduct.set(r.productKey,k);
            }
          }

          const typeCode={
            phone:"PH",laptop:"LP",smartwatch:"SW",headphones:"HP",perfume:"PF",
            dog_food:"DF",power_bank:"PB",air_conditioner:"AC","3d_filament":"3D",
            cookware:"CW",lighting:"LG",tools:"TL"
          };

          function conditionOf(t){
            const s=norm(t);
            if(/\b(refurbished|renewed|reconditioned)\b/i.test(s))return "refurbished";
            if(/\b(used|pre owned|pre-owned|second hand)\b/i.test(s))return "used";
            if(/\b(open box|open-box)\b/i.test(s))return "open-box";
            if(/\b(new|brand new|sealed)\b/i.test(s))return "new";
            return "";
          }

          function identityFor(r){
            const truth=productTruth(r);
            const t=truth.type||r.type||"other";
            const tc=typeCode[t]||"OT";
            const tpoid=code("TPO",r.productKey,14);
            const sellerId=compact(r.ids.sellerProductId||r.ids.sku||r.productKey);

            if(!truth.core){
              const familyKey=`related:${t}:${norm(r.seller)}:${sellerId}`;
              const tpid=code("TPR",familyKey,14);
              const tpvid=code("TPV",`${familyKey}|base`,14);
              return {
                tpoid,tpid,tpvid,familyKey,variantKey:`${familyKey}|base`,
                confidence:"related",source:`truth:${truth.reason}`,
                brand:clean(r.brand),model:"",familyAlias:"",modelSpecificity:"related",
                generation:"",storage:"",ram:"",
                condition:conditionOf(r.name),type:t,role:r.role,
                truthReason:truth.reason,objectClass:truth.objectClass||"related",core:false,comparable:false
              };
            }

            const brand=deriveBrand(r,t);
            const explicit=usableExplicitModel(r,t);
            const derived=canonicalModel(r,t);
            const specificity=canonicalModelSpecificity(t,brand,derived,r.name);
            const familyAlias=specificity.familyAlias||"";
            const generation=generationFromTitle(r.name);
            const strong=v19StrongByProduct.get(r.productKey);
            const v19ModelKey=v19ModelKeyByProduct.get(r.productKey);
            const gid=globalId(r);
            const mpn=compact(r.ids.mpn);
            const b=compact(brand);

            let familyKey="",confidence="",source="",model="";

            if(b&&derived&&specificity.specific){
              familyKey=`canonical-model:${t}:${b}:${compact(derived)}`;
              confidence="candidate";
              source="truth-brand-canonical-model";
              model=derived;
            }else if(gid){
              familyKey=`global:${t}:${gid}`;
              confidence="verified";
              source="global-id";
              model=explicit||clean(r.ids.model);
            }else if(b&&mpn){
              familyKey=`brand-mpn:${t}:${b}:${mpn}`;
              confidence="verified";
              source="brand-mpn";
              model=explicit||clean(r.ids.model);
            }else if(strong?.groupId){
              familyKey=`v19-strong:${strong.groupId}`;
              confidence="verified";
              source=`v19-pure:${strong.reason||"strong"}`;
              model=explicit||clean(r.ids.model);
            }else if(v19ModelKey){
              familyKey=`v19-model:${t}:${v19ModelKey}`;
              confidence="high";
              source="v19-pure-brand-explicit-model";
              model=explicit||clean(r.ids.model);
            }else if(b&&explicit){
              const explicitSpecificity=canonicalModelSpecificity(t,brand,explicit,r.name);
              if(explicitSpecificity.specific){
                familyKey=`canonical-explicit:${t}:${b}:${compact(explicit)}`;
                confidence="high";
                source="canonical-explicit-model";
                model=explicit;
              }else{
                familyKey=`seller-only:${t}:${norm(r.seller)}:${sellerId}`;
                confidence="seller-only";
                source=`ambiguous-explicit-family:${explicitSpecificity.reason}`;
                model="";
              }
            }else{
              familyKey=`seller-only:${t}:${norm(r.seller)}:${sellerId}`;
              confidence="seller-only";
              source="seller-listing-only";
              model="";
            }

            const tpid=code(`TP${tc}`,familyKey,14);
            const storage=storageOf(r.name);
            const ram=ramOf(r.name);
            const condition=conditionOf(r.name);
            const variantBits=[
              storage?`storage:${storage}`:"",
              ram?`ram:${ram}`:"",
              generation?`generation:${generation}`:"",
              condition?`condition:${condition}`:""
            ].filter(Boolean);
            const variantKey=variantBits.length?`${familyKey}|${variantBits.join("|")}`:`${familyKey}|base`;
            const tpvid=code("TPV",variantKey,14);

            return {
              tpoid,tpid,tpvid,familyKey,variantKey,confidence,source,
              brand,model,familyAlias,modelSpecificity:specificity.reason,
              generation,storage,ram,condition,type:t,role:r.role,
              truthReason:truth.reason,objectClass:truth.objectClass||t,core:true,comparable:confidence!=="seller-only"
            };
          }

          setStage("build-offer-identities");
          const offers=[];
          for(const r of rows){
            const id=identityFor(r);
            offers.push({
              ...id,
              productKey:r.productKey,seller:r.seller,sellerProductId:r.ids.sellerProductId,
              sku:r.ids.sku,mpn:r.ids.mpn,gtin:r.ids.gtin,ean:r.ids.ean,upc:r.ids.upc,
              name:r.name,price:r.price,currency:r.currency,image:r.image,url:r.url,
              quality:r.quality
            });
          }

          // ------------------------------------------------------------
          // V20.5.8 Global Canonical Rekey
          // Clean type + canonical brand + specific canonical model becomes
          // ONE TPID regardless of the original V19/global/seller identity path.
          // ------------------------------------------------------------
          function canonicalRekeyDescriptor(o){
            if(!o.core)return null;

            // Use BOTH raw seller title and already-resolved identity model.
            // This is the final safety net for offers whose raw title is noisy
            // but whose earlier identity path already found "iPhone 16 Pro".
            const modelFromTitle=canonicalModel({name:o.name},o.type);
            const modelFromIdentity=canonicalModel({name:clean(o.model)},o.type)||clean(o.model);
            const model=clean(modelFromTitle||modelFromIdentity);
            if(!model)return null;

            const brand=deriveBrand({
              name:`${clean(o.name)} ${model}`,
              brand:o.brand
            },o.type);
            if(!brand)return null;

            const spec=canonicalModelSpecificity(o.type,brand,model,o.name);
            if(!spec.specific)return null;

            if(o.type==="laptop" && /^(MacBook (?:Pro|Air)|Chromebook|IdeaPad)$/i.test(model))return null;

            const key=`${o.type}|${compact(brand)}|${compact(model)}`;
            return {key,brand,model,spec};
          }

          setStage("global-canonical-rekey");
          let canonicalRekeyedOffers=0;
          const canonicalRekeyKeys=new Set();

          for(const o of offers){
            const d=canonicalRekeyDescriptor(o);
            if(!d)continue;

            const tc=typeCode[o.type]||"OT";
            const oldTpid=o.tpid;
            const newFamilyKey=`canonical-rekey:${d.key}`;
            const newTpid=code(`TP${tc}`,newFamilyKey,14);

            o.preRekeyTpid=oldTpid;
            o.preRekeySource=o.source;
            o.familyKey=newFamilyKey;
            o.tpid=newTpid;
            o.brand=d.brand;
            o.model=d.model;
            o.familyAlias=d.spec.familyAlias||o.familyAlias||"";
            o.modelSpecificity=d.spec.reason;
            o.source=`canonical-rekey<-${o.preRekeySource}`;
            o.confidence=(o.confidence==="verified"||o.confidence==="high")?o.confidence:"candidate";

            const variantBits=[
              o.storage?`storage:${o.storage}`:"",
              o.ram?`ram:${o.ram}`:"",
              o.generation?`generation:${o.generation}`:"",
              o.condition?`condition:${o.condition}`:""
            ].filter(Boolean);
            o.variantKey=variantBits.length?`${newFamilyKey}|${variantBits.join("|")}`:`${newFamilyKey}|base`;
            o.tpvid=code("TPV",o.variantKey,14);

            if(oldTpid!==newTpid)canonicalRekeyedOffers++;
            canonicalRekeyKeys.add(d.key);
          }

          // ------------------------------------------------------------
          // Build master product families and variants.
          // ------------------------------------------------------------
          setStage("build-families-and-variants");
          const familyMap=new Map();
          const variantMap=new Map();

          function addOfferToFamily(o){
            if(!familyMap.has(o.tpid)){
              familyMap.set(o.tpid,{
                tpid:o.tpid,type:o.type,brand:o.brand,model:o.model,
                confidence:o.confidence,identitySource:o.source,
                offerIds:[],variantIds:new Set(),sellers:new Set(),
                labels:new Map(),aliases:new Set(),specificityReasons:new Set(),
                images:[],priceByCurrency:new Map(),
                coreOffers:0,comparableOffers:0
              });
            }
            const f=familyMap.get(o.tpid);
            f.offerIds.push(o.tpoid);
            f.variantIds.add(o.tpvid);
            f.sellers.add(o.seller);
            if(o.familyAlias)f.aliases.add(o.familyAlias);
            if(o.modelSpecificity)f.specificityReasons.add(o.modelSpecificity);
            if(o.core)f.coreOffers++;
            if(o.comparable)f.comparableOffers++;
            const label=clean(o.model)||clean(o.name);
            if(label)f.labels.set(label,(f.labels.get(label)||0)+1);
            if(o.image)f.images.push(o.image);
            if(o.price&&o.currency){
              const prev=f.priceByCurrency.get(o.currency);
              if(prev==null||o.price<prev)f.priceByCurrency.set(o.currency,o.price);
            }
          }

          function addOfferToVariant(o){
            if(!variantMap.has(o.tpvid)){
              variantMap.set(o.tpvid,{
                tpvid:o.tpvid,tpid:o.tpid,type:o.type,brand:o.brand,model:o.model,
                storage:o.storage,ram:o.ram,generation:o.generation,condition:o.condition,confidence:o.confidence,
                offerIds:[],sellers:new Set(),prices:new Map()
              });
            }
            const v=variantMap.get(o.tpvid);
            v.offerIds.push(o.tpoid);
            v.sellers.add(o.seller);
            if(o.price&&o.currency){
              const prev=v.prices.get(o.currency);
              if(prev==null||o.price<prev)v.prices.set(o.currency,o.price);
            }
          }

          for(const o of offers){
            addOfferToFamily(o);
            addOfferToVariant(o);
          }

          const confidenceRank={verified:5,high:4,candidate:3,"seller-only":2,related:1};

          const families=[...familyMap.values()].map(f=>{
            const label=[...f.labels.entries()].sort((a,b)=>b[1]-a[1]||a[0].length-b[0].length)[0]?.[0]||f.tpid;
            return {
              tpid:f.tpid,type:f.type,brand:f.brand,model:f.model,label,
              confidence:f.confidence,identitySource:f.identitySource,
              sellerCount:f.sellers.size,sellers:[...f.sellers].sort(),
              offerCount:f.offerIds.length,coreOffers:f.coreOffers,comparableOffers:f.comparableOffers,
              variantCount:f.variantIds.size,variantIds:[...f.variantIds].sort(),
              aliases:[...f.aliases].sort(),specificityReasons:[...f.specificityReasons].sort(),
              offerIds:f.offerIds,
              image:f.images[0]||"",
              minPriceByCurrency:Object.fromEntries([...f.priceByCurrency.entries()].sort())
            };
          });

          const variants=[...variantMap.values()].map(v=>({
            tpvid:v.tpvid,tpid:v.tpid,type:v.type,brand:v.brand,model:v.model,
            storage:v.storage,ram:v.ram,generation:v.generation,condition:v.condition,confidence:v.confidence,
            sellerCount:v.sellers.size,sellers:[...v.sellers].sort(),
            offerCount:v.offerIds.length,offerIds:v.offerIds,
            minPriceByCurrency:Object.fromEntries([...v.prices.entries()].sort())
          }));

          // A family with seller-only identity must never become a cross-seller comparison.
          const comparableFamilies=families.filter(f=>f.sellerCount>=2&&!["seller-only","related"].includes(f.confidence)&&f.comparableOffers>=2&&f.comparableOffers===f.offerCount);
          const comparableVariants=variants.filter(v=>v.sellerCount>=2&&!["seller-only","related"].includes(v.confidence));
          const offerByTpoid=new Map(offers.map(o=>[o.tpoid,o]));

          comparableFamilies.sort((a,b)=>b.sellerCount-a.sellerCount||b.offerCount-a.offerCount||clean(a.label).localeCompare(clean(b.label)));
          comparableVariants.sort((a,b)=>b.sellerCount-a.sellerCount||b.offerCount-a.offerCount||clean(a.model).localeCompare(clean(b.model)));

          // ------------------------------------------------------------
          // Search / autocomplete operates ONLY on the master product registry.
          // It never searches raw offer titles to determine product identity.
          // ------------------------------------------------------------
          const typeAliases=new Map([
            ["phone","phone"],["phones","phone"],["smartphone","phone"],["smartphones","phone"],
            ["laptop","laptop"],["laptops","laptop"],["notebook","laptop"],
            ["smartwatch","smartwatch"],["smart watch","smartwatch"],
            ["headphones","headphones"],["headphone","headphones"],["earbuds","headphones"],
            ["perfume","perfume"],["fragrance","perfume"],
            ["dog food","dog_food"],["power bank","power_bank"],["air conditioner","air_conditioner"],
            ["3d filament","3d_filament"],["cookware","cookware"],["lighting","lighting"],["tools","tools"]
          ]);

          const masterIndex=families
            .filter(f=>f.confidence!=="related"&&f.coreOffers>0)
            .map(f=>({
              tpid:f.tpid,type:f.type,brand:f.brand,model:f.model,label:f.label,aliases:f.aliases,
              confidence:f.confidence,sellerCount:f.sellerCount,sellers:f.sellers,
              offerCount:f.offerCount,coreOffers:f.coreOffers,comparableOffers:f.comparableOffers,
              variantCount:f.variantCount,image:f.image,
              minPriceByCurrency:f.minPriceByCurrency
            }));

          function canonicalMasterKey(f){
            const type=clean(f.type);
            const model=canonicalModel({name:clean(f.model)||clean(f.label)},type)||clean(f.model);
            if(!type||!model)return "";
            const brand=deriveBrand({name:`${clean(f.label)} ${model}`,brand:f.brand},type);
            if(!brand)return "";
            const spec=canonicalModelSpecificity(type,brand,model,f.label);
            if(!spec.specific)return "";
            return `${type}|${compact(brand)}|${compact(model)}`;
          }

          const finalMasterKeyMap=new Map();
          for(const f of masterIndex){
            const k=canonicalMasterKey(f);
            if(!k)continue;
            if(!finalMasterKeyMap.has(k))finalMasterKeyMap.set(k,[]);
            finalMasterKeyMap.get(k).push(f);
          }
          const finalMasterDuplicateGroups=[...finalMasterKeyMap.entries()]
            .filter(([,fs])=>new Set(fs.map(x=>x.tpid)).size>1)
            .map(([key,fs])=>({key,tpids:[...new Set(fs.map(x=>x.tpid))],labels:fs.map(x=>x.label)}));


          function stripVariantQuery(q){
            return clean(String(q)
              .replace(/\b(?:2|3|4|6|8|12|16|18|24|32)\s*(?:GB|G)?\s*[+\/]\s*(?:32|64|128|256|512|1024|2048)\s*(?:GB|G)\b/ig," ")
              .replace(/\b(?:32|64|128|256|512|1024|2048)\s*(?:GB|G)\s*(?:ROM|Storage|SSD|UFS)?\b/ig," ")
              .replace(/\b(?:1|2|4)\s*TB\s*(?:SSD|Storage|ROM)?\b/ig," ")
              .replace(/\b(?:2|3|4|6|8|12|16|18|24|32|64)\s*(?:GB|G)\s*(?:RAM|Memory)\b/ig," ")
              .replace(/\b(?:RAM|Memory)\s*[:\-]?\s*(?:2|3|4|6|8|12|16|18|24|32|64)\s*(?:GB|G)\b/ig," ")
              .replace(/\b(?:refurbished|renewed|reconditioned|used|pre[- ]?owned|second hand|open[- ]?box)\b/ig," "));
          }

          // ------------------------------------------------------------
          // TPCID = TrendPilot Comparison Set ID.
          // TPID answers "is it the same product?"
          // TPCID answers "what useful alternatives can be compared across sellers?"
          // Sets use the same product type + same currency + nearby price band.
          // They never rewrite TPID or pretend alternatives are identical.
          // ------------------------------------------------------------
          const minimumCorePriceByType={
            phone:20,
            laptop:75,
            smartwatch:10,
            headphones:2,
            perfume:2,
            power_bank:3,
            air_conditioner:50
          };

          function priceBand(price){
            const p=Number(price);
            if(!Number.isFinite(p)||p<=0)return "";
            const bands=[
              [0,25],[25,50],[50,100],[100,200],[200,400],
              [400,800],[800,1600],[1600,3200],[3200,999999999]
            ];
            for(const [lo,hi] of bands)if(p>=lo&&p<hi)return `${lo}-${hi}`;
            return "";
          }

          const comparisonBuckets=new Map();
          for(const f of masterIndex){
            if(!f.type||!f.coreOffers)continue;
            for(const [currency,price] of Object.entries(f.minPriceByCurrency||{})){
              const floor=minimumCorePriceByType[f.type]||0;
              if(Number(price)<floor)continue;
              const band=priceBand(price);
              if(!band)continue;
              const key=`${f.type}|${currency}|${band}`;
              if(!comparisonBuckets.has(key))comparisonBuckets.set(key,[]);
              comparisonBuckets.get(key).push({...f,currency,referencePrice:price,priceBand:band});
            }
          }

          const comparisonSets=[];
          for(const [key,items0] of comparisonBuckets){
            const items=[...items0].sort((a,b)=>
              b.sellerCount-a.sellerCount||
              b.offerCount-a.offerCount||
              a.referencePrice-b.referencePrice||
              clean(a.label).localeCompare(clean(b.label))
            );

            const chosen=[];
            const sellerCoverage=new Set();

            // First pass: maximize seller diversity.
            for(const item of items){
              const adds=item.sellers.some(s=>!sellerCoverage.has(s));
              if(!adds)continue;
              chosen.push(item);
              for(const s of item.sellers)sellerCoverage.add(s);
              if(chosen.length>=8)break;
            }

            // Second pass: fill useful alternatives.
            if(chosen.length<8){
              for(const item of items){
                if(chosen.some(x=>x.tpid===item.tpid))continue;
                chosen.push(item);
                for(const s of item.sellers)sellerCoverage.add(s);
                if(chosen.length>=8)break;
              }
            }

            if(chosen.length<2||sellerCoverage.size<2)continue;

            const [type,currency,band]=key.split("|");
            comparisonSets.push({
              tpcid:code("TPC",key,14),
              type,currency,priceBand:band,
              sellerCount:sellerCoverage.size,
              sellers:[...sellerCoverage].sort(),
              productCount:chosen.length,
              products:chosen.map(x=>({
                tpid:x.tpid,label:x.label,brand:x.brand,model:x.model,
                sellerCount:x.sellerCount,sellers:x.sellers,
                offerCount:x.offerCount,referencePrice:x.referencePrice,
                confidence:x.confidence
              }))
            });
          }

          comparisonSets.sort((a,b)=>
            b.sellerCount-a.sellerCount||
            b.productCount-a.productCount||
            clean(a.type).localeCompare(clean(b.type))||
            clean(a.priceBand).localeCompare(clean(b.priceBand))
          );

          const comparisonSetsByType=new Map();
          for(const set of comparisonSets){
            if(!comparisonSetsByType.has(set.type))comparisonSetsByType.set(set.type,[]);
            comparisonSetsByType.get(set.type).push(set);
          }

          function familyScore(f,q){
            const nq=norm(stripVariantQuery(q)||q);
            const label=norm(f.label),brand=norm(f.brand),model=norm(f.model);
            const aliases=(f.aliases||[]).map(norm);
            if(!nq)return -1;
            let s=0;
            if(label===nq||model===nq||aliases.includes(nq))s+=5000;
            if(model.startsWith(nq))s+=3000;
            else if(aliases.some(a=>a.startsWith(nq)))s+=2800;
            else if(label.startsWith(nq))s+=2500;
            else if(brand.startsWith(nq))s+=1200;
            else if(nq.length>=2&&(model.includes(nq)||label.includes(nq)||aliases.some(a=>a.includes(nq))))s+=700;
            else return -1;
            s+=f.sellerCount*500;
            s+=(confidenceRank[f.confidence]||0)*200;
            return s;
          }

          function inferQueryType(q){
            const s=norm(q);
            const alias=typeAliases.get(s);
            if(alias)return alias;

            if(/\biphone\b/i.test(q))return "phone";
            if(/\b(redmi|galaxy\s*(?:s|a|m|z|note)\s*\d+|pixel\s*\d+|oneplus\s*\d+|poco\s+[a-z]\d+|realme\s+[a-z0-9]+)\b/i.test(q))return "phone";
            if(/\b(thinkpad|ideapad|macbook|vivobook|zenbook|latitude\s+\d+|elitebook|probook|chromebook|legion)\b/i.test(q))return "laptop";
            if(/\b(apple watch|galaxy watch|smartwatch|smart watch)\b/i.test(q))return "smartwatch";
            if(/\b(headphones?|headsets?|earbuds?|earphones?|tws)\b/i.test(q))return "headphones";
            if(/\b(power bank|powerbank|portable charger)\b/i.test(q))return "power_bank";
            if(/\b(perfume|parfum|fragrance|eau de parfum|eau de toilette)\b/i.test(q))return "perfume";
            if(/\b(dog food|puppy food|kibble)\b/i.test(q))return "dog_food";
            if(/\b(air conditioner|split ac|portable ac|window ac)\b/i.test(q))return "air_conditioner";
            if(/\b(3d filament|pla filament|petg filament|abs filament|tpu filament)\b/i.test(q))return "3d_filament";
            return "";
          }

          function searchMaster(q,limit=20,seller=""){
            const nq=norm(q);
            if(nq.length<2)return [];
            const exactBroadType=typeAliases.get(nq)||"";
            const intentType=inferQueryType(q);
            let pool=masterIndex;
            if(intentType)pool=pool.filter(f=>f.type===intentType);
            if(seller)pool=pool.filter(f=>f.sellers.includes(seller));

            if(exactBroadType){
              return [...pool]
                .sort((a,b)=>b.sellerCount-a.sellerCount||b.offerCount-a.offerCount||clean(a.label).localeCompare(clean(b.label)))
                .slice(0,limit);
            }

            return pool.map(f=>({...f,_score:familyScore(f,q)}))
              .filter(f=>f._score>=0)
              .sort((a,b)=>b._score-a._score||b.sellerCount-a.sellerCount||clean(a.label).localeCompare(clean(b.label)))
              .slice(0,limit)
              .map(({_score,...f})=>f);
          }

          function exactQueryModel(q,type){
            if(!type)return "";
            const m=canonicalModel({name:stripVariantQuery(q)},type);
            if(!m)return "";
            const spec=canonicalModelSpecificity(type,"",m,q);
            return spec.specific?m:"";
          }

          function resolveMasterQuery(q,limit=20,seller=""){
            const intentType=inferQueryType(q);
            const baseQuery=stripVariantQuery(q);
            const queryModel=exactQueryModel(q,intentType);
            const variantIntent=variantIntentOf(q);

            if(norm(baseQuery).length<2){
              return {
                query:q,baseQuery,intentType,queryModel:"",
                mode:"suggestions-only",variantIntent,
                exactProducts:[],exactVariants:[],exactOffers:[],alternatives:[]
              };
            }

            const searched=searchMaster(baseQuery,Math.max(limit*3,40),seller);
            const exactProducts=queryModel
              ? searched.filter(f=>compact(f.model)===compact(queryModel))
              : [];

            const alternatives=(queryModel
              ? searched.filter(f=>compact(f.model)!==compact(queryModel))
              : searched
            ).slice(0,limit);

            const exactVariants=[];
            const exactOffers=[];
            if(queryModel && hasVariantIntent(variantIntent)){
              const exactTpids=new Set(exactProducts.map(f=>f.tpid));
              for(const v of safeArr(variants)){
                if(!v||!exactTpids.has(v.tpid))continue;
                if(!variantMatchesIntent(v,variantIntent))continue;
                if(seller && !safeArr(v.sellers).includes(seller))continue;
                exactVariants.push(v);

                for(const offerId of safeArr(v.offerIds)){
                  const o=offerByTpoid.get(offerId);
                  if(o && (!seller||o.seller===seller))exactOffers.push(o);
                }
              }
            }

            return {
              query:q,
              baseQuery,
              intentType,
              queryModel,
              mode:queryModel?(hasVariantIntent(variantIntent)?"exact-variant":"exact-model"):(typeAliases.has(norm(baseQuery))?"broad":"family"),
              variantIntent,
              exactProducts:safeArr(exactProducts).slice(0,limit),
              exactVariants:safeArr(exactVariants).slice(0,limit*3),
              exactOffers:safeArr(exactOffers).slice(0,limit*5),
              alternatives:safeArr(alternatives)
            };
          }

          const familyAliasMap=new Map();
          for(const o of offers){
            if(!o.core||!o.familyAlias)continue;
            const aliasBrand=deriveBrand({name:`${o.familyAlias} ${o.model||""} ${o.name||""}`,brand:o.brand},o.type)||clean(o.brand);
            const key=`${o.type}|${compact(aliasBrand)}|${compact(o.familyAlias)}`;
            if(!familyAliasMap.has(key)){
              familyAliasMap.set(key,{
                alias:o.familyAlias,type:o.type,brand:aliasBrand,
                sellers:new Set(),tpids:new Set(),offerIds:[],models:new Set()
              });
            }
            const a=familyAliasMap.get(key);
            a.sellers.add(o.seller);
            a.tpids.add(o.tpid);
            a.offerIds.push(o.tpoid);
            if(o.model)a.models.add(o.model);
          }

          const familyAliasVisibleMap=new Map();
          for(const a of familyAliasMap.values()){
            const vk=`${a.type}|${compact(a.alias)}`;
            if(!familyAliasVisibleMap.has(vk)){
              familyAliasVisibleMap.set(vk,{
                alias:a.alias,type:a.type,brand:a.brand,
                sellers:new Set(),tpids:new Set(),offerIds:[],models:new Set()
              });
            }
            const v=familyAliasVisibleMap.get(vk);
            for(const s of a.sellers)v.sellers.add(s);
            for(const x of a.tpids)v.tpids.add(x);
            for(const id of a.offerIds)v.offerIds.push(id);
            for(const m of a.models)v.models.add(m);
            if(!v.brand&&a.brand)v.brand=a.brand;
          }

          const familyAliases=[...familyAliasVisibleMap.values()].map(a=>({
            alias:a.alias,type:a.type,brand:a.brand,
            sellerCount:a.sellers.size,sellers:[...a.sellers].sort(),
            productCount:a.tpids.size,tpids:[...a.tpids].sort(),
            models:[...a.models].sort(),offerCount:a.offerIds.length
          })).sort((a,b)=>b.sellerCount-a.sellerCount||b.productCount-a.productCount||clean(a.alias).localeCompare(clean(b.alias)));

          const brandCoverage=new Map();
          for(const f of masterIndex){
            const b=clean(f.brand); if(!b)continue;
            if(!brandCoverage.has(b))brandCoverage.set(b,new Set());
            for(const s of f.sellers)brandCoverage.get(b).add(s);
          }

          function autocomplete(q,limit=12){
            const nq=norm(q);
            if(!nq)return [];
            const rows=[];
            const broadType=typeAliases.get(nq);
            const intentType=inferQueryType(q);

            if(broadType)rows.push({kind:"category",value:q,type:broadType,sellerCount:13});

            for(const [brand,sellers] of brandCoverage){
              const nb=norm(brand);
              if(nb.startsWith(nq)||(nq.length>=2&&nb.includes(nq))){
                rows.push({kind:"brand",value:brand,sellerCount:sellers.size});
              }
            }

            for(const a of familyAliases){
              if(intentType && a.type!==intentType)continue;
              const av=norm(a.alias);
              if(av.startsWith(nq)||(nq.length>=2&&av.includes(nq))){
                rows.push({
                  kind:"product-family",value:a.alias,type:a.type,brand:a.brand,
                  sellerCount:a.sellerCount,productCount:a.productCount
                });
              }
            }

            for(const f of masterIndex){
              if(intentType && f.type!==intentType)continue;
              const model=clean(f.model);
              const label=clean(f.label);
              const source=model||label;
              const n=norm(source);
              if(!n)continue;
              if(nq.length===1&&!model)continue;
              const ok=n.startsWith(nq)||(nq.length>=2&&n.includes(nq));
              if(!ok)continue;
              rows.push({
                kind:model?"product-model":"product-name",
                value:source,tpid:f.tpid,type:f.type,brand:f.brand,
                sellerCount:f.sellerCount,offerCount:f.offerCount,
                confidence:f.confidence
              });
            }

            const seen=new Set();
            return rows
              .sort((a,b)=>(b.sellerCount||0)-(a.sellerCount||0)||
                (a.kind==="product-model"?-1:0)-(b.kind==="product-model"?-1:0)||
                (a.value||"").length-(b.value||"").length)
              .filter(x=>{
                const k=`${x.kind}:${norm(x.value)}:${x.type||""}`;
                if(seen.has(k))return false;
                seen.add(k); return true;
              })
              .slice(0,limit);
          }

          const queries=(process.env.TP_QUERIES||"H,F,iph,iphone,iPhone 16,iPhone 16 128GB,iPhone 16 Pro 128GB,phone,Galaxy S25,Redmi,ThinkPad,ThinkPad X1,ThinkPad X1 Carbon,MacBook Pro,Chromebook,laptop,headphones,power bank,perfume,dog food,air conditioner")
            .split(",").map(clean).filter(Boolean);

          setStage("build-query-probes");
          const queryProbes=queries.map(q=>{
            const resolution=resolveMasterQuery(q,20);
            return {
              query:q,
              mode:resolution.mode,
              intentType:resolution.intentType,
              queryModel:resolution.queryModel,
              variantIntent:resolution.variantIntent,
              autocomplete:autocomplete(q,12),
              exactProducts:safeArr(resolution.exactProducts).map(f=>({
                tpid:f.tpid,label:f.label,model:f.model,type:f.type,
                sellerCount:f.sellerCount,sellers:f.sellers,
                variantCount:f.variantCount,confidence:f.confidence
              })),
              exactVariants:safeArr(resolution.exactVariants).map(v=>({
                tpvid:v.tpvid,tpid:v.tpid,model:v.model,
                storage:v.storage,ram:v.ram,generation:v.generation,condition:v.condition,
                sellerCount:v.sellerCount,sellers:v.sellers,offerCount:v.offerCount
              })),
              exactOfferCount:resolution.exactOffers.length,
              alternatives:safeArr(resolution.alternatives).map(f=>({
                tpid:f.tpid,label:f.label,model:f.model,type:f.type,
                sellerCount:f.sellerCount,sellers:f.sellers,confidence:f.confidence
              })),
              comparisonSets:resolution.mode==="suggestions-only"?[]:
                (comparisonSetsByType.get(resolution.intentType)||[]).slice(0,3)
                .map(s=>({tpcid:s.tpcid,type:s.type,currency:s.currency,priceBand:s.priceBand,
                  sellerCount:s.sellerCount,sellers:s.sellers,productCount:s.productCount}))
            };
          });

          // Seller-specific truth based on master identities, not raw keyword hits.
          const sellerProbes=[
            ["phone","TikTok Shop US"],["phone","Alibaba"],["phone","AliExpress"],["phone","Geekbuying"],
            ["laptop","Lenovo"]
          ].map(([q,seller])=>({
            query:q,seller,
            masterProducts:searchMaster(q,200,seller).length,
            sample:searchMaster(q,8,seller).map(x=>({tpid:x.tpid,label:x.label,sellerCount:x.sellerCount}))
          }));

          // ------------------------------------------------------------
          // Integrity gates.
          // ------------------------------------------------------------
          setStage("integrity-gates");
          const failures=[];
          const warnings=[];

          const tpoids=new Set(),tpvids=new Set(),tpids=new Set();
          for(const o of offers){
            if(tpoids.has(o.tpoid))failures.push(`Duplicate TPOID ${o.tpoid}`);
            tpoids.add(o.tpoid); tpvids.add(o.tpvid); tpids.add(o.tpid);
            if(BLOCKED.has(norm(o.seller)))failures.push(`Blocked seller leaked: ${o.seller}`);
            if(!o.tpid||!o.tpvid||!o.tpoid)failures.push(`Missing identity code for ${o.productKey}`);
          }

          const cleanCoreOfferCount=offers.filter(o=>o.core===true).length;
          if(cleanCoreOfferCount===0)failures.push("Identity builder produced zero clean core offers.");
          if(masterIndex.length===0)failures.push("Master search index is empty.");

          // No TPID may merge conflicting known product types.
          const typeByTpid=new Map();
          for(const o of offers){
            if(!o.type)continue;
            if(!typeByTpid.has(o.tpid))typeByTpid.set(o.tpid,new Set());
            typeByTpid.get(o.tpid).add(o.type);
          }
          for(const [tpid,types] of typeByTpid){
            if(types.size>1)failures.push(`TPID type conflict ${tpid}: ${[...types].join(",")}`);
          }

          const objectClassCounts={};
          const truthReasonCounts={};
          for(const o of offers){
            objectClassCounts[o.objectClass||"unknown"]=(objectClassCounts[o.objectClass||"unknown"]||0)+1;
            truthReasonCounts[o.truthReason||"unknown"]=(truthReasonCounts[o.truthReason||"unknown"]||0)+1;
          }

          function coreObjectViolation(o){
            if(!o.core)return "";
            const t=clean(o.name);

            if(o.type==="laptop" && laptopTarget.test(t) && laptopAccessoryTruth(t)){
              return "laptop-component";
            }
            if(o.type==="phone" && phoneTarget.test(t) && phoneAccessoryObject.test(t)){
              return "phone-accessory";
            }
            if(o.type==="perfume"){
              if(perfumeContainerOrNonPerfume.test(t))return "perfume-container";
              if(!perfumeStrong.test(t))return "perfume-without-product-proof";
            }
            if(o.type==="power_bank"){
              if(chargerOnlyObject.test(t) && !powerBankStrong.test(t))return "charger-not-power-bank";
              if(!powerBankStrong.test(t))return "power-bank-without-object-proof";
            }
            if(o.type==="headphones"){
              if(headphonesContainerObject.test(t))return "headphones-container";
              if(speakerObject.test(t) && !headphonesStrong.test(t))return "speaker-not-headphones";
              if(!headphonesStrong.test(t))return "headphones-without-object-proof";
            }
            if(o.type==="smartwatch" && watchAccessoryObject.test(t))return "watch-accessory";
            if(o.type==="dog_food" && dogFoodAccessory.test(t))return "pet-food-accessory";
            if(o.type==="air_conditioner" && airConditionerPart.test(t))return "ac-part";
            if(o.type==="air_conditioner" && airConditionerPseudoUnit.test(t))return "air-cooler-not-ac";
            if(o.type==="air_conditioner" && !airConditionerUnitProof.test(t))return "ac-without-unit-proof";
            if(o.type==="cookware" && cookwarePart.test(t))return "cookware-part";
            if(o.type==="lighting" && lightingPart.test(t))return "lighting-part";

            return "";
          }

          const globalObjectTruthLeaks=offers
            .map(o=>({offer:o,violation:coreObjectViolation(o)}))
            .filter(x=>x.violation);

          if(globalObjectTruthLeaks.length){
            failures.push(`Global sold-object truth leaks: ${globalObjectTruthLeaks.slice(0,15).map(x=>`${x.violation}:${x.offer.seller}:${x.offer.name}`).join(" | ")}`);
          }

          const crossTypeModelConflicts=offers.filter(o=>{
            if(!o.core)return false;
            const m=clean(o.model);
            if(!m)return false;
            if(rawPhoneModelFromTitle(m) && o.type!=="phone")return true;
            if(rawLaptopModelFromTitle(m) && o.type!=="laptop")return true;
            return false;
          });
          if(crossTypeModelConflicts.length){
            failures.push(`Cross-type model conflicts: ${crossTypeModelConflicts.slice(0,12).map(o=>`${o.type}:${o.model}:${o.name}`).join(" | ")}`);
          }

          const contaminatedMasterFamilies=families.filter(f=>
            !["seller-only","related"].includes(f.confidence) &&
            f.comparableOffers>0 &&
            f.comparableOffers!==f.offerCount
          );
          if(contaminatedMasterFamilies.length){
            failures.push(`Master TPID contamination: ${contaminatedMasterFamilies.slice(0,12).map(f=>f.tpid).join(", ")}`);
          }

          const ambiguousCanonicalPromotions=offers.filter(o=>
            o.core &&
            o.familyAlias &&
            o.model &&
            !canonicalModelSpecificity(o.type,o.brand,o.model,o.name).specific &&
            String(o.source).startsWith("truth-brand-canonical-model")
          );
          if(ambiguousCanonicalPromotions.length){
            failures.push(`Ambiguous model promoted to canonical TPID: ${ambiguousCanonicalPromotions.slice(0,10).map(o=>`${o.seller}:${o.type}:${o.model}`).join(" | ")}`);
          }

          const postRekeyCanonicalKeyToTpids=new Map();
          for(const o of offers){
            const d=canonicalRekeyDescriptor(o);
            if(!d)continue;
            if(!postRekeyCanonicalKeyToTpids.has(d.key))postRekeyCanonicalKeyToTpids.set(d.key,new Set());
            postRekeyCanonicalKeyToTpids.get(d.key).add(o.tpid);
          }
          const postRekeyDuplicateKeys=[...postRekeyCanonicalKeyToTpids.entries()]
            .filter(([,ids])=>ids.size>1)
            .map(([key,ids])=>({key,tpids:[...ids]}));
          if(postRekeyDuplicateKeys.length){
            failures.push(`Post-rekey canonical duplicate TPIDs: ${postRekeyDuplicateKeys.slice(0,12).map(x=>x.key).join(" | ")}`);
          }
          if(finalMasterDuplicateGroups.length){
            failures.push(`FINAL master registry duplicate canonical models: ${finalMasterDuplicateGroups.slice(0,12).map(x=>`${x.key}=>${x.tpids.join(",")}`).join(" | ")}`);
          }

          const canonicalKeyToTpids=new Map();
          for(const o of offers){
            if(!o.core||!o.brand||!o.model)continue;
            const spec=canonicalModelSpecificity(o.type,o.brand,o.model,o.name);
            if(!spec.specific)continue;
            const key=`${o.type}|${compact(o.brand)}|${compact(o.model)}`;
            if(!canonicalKeyToTpids.has(key))canonicalKeyToTpids.set(key,new Set());
            canonicalKeyToTpids.get(key).add(o.tpid);
          }
          const canonicalModelDuplicates=[...canonicalKeyToTpids.entries()]
            .filter(([,ids])=>ids.size>1)
            .map(([key,ids])=>({key,tpids:[...ids]}));
          if(canonicalModelDuplicates.length){
            failures.push(`Canonical model maps to multiple TPIDs: ${canonicalModelDuplicates.slice(0,10).map(x=>x.key).join(" | ")}`);
          }

          // User-requested purity checks.
          const iphone16=searchMaster("iPhone 16",50);
          const thinkpad=searchMaster("ThinkPad",50);
          const thinkpadX1=searchMaster("ThinkPad X1",50);
          const macbookPro=searchMaster("MacBook Pro",100);
          const perfumeProbe=searchMaster("perfume",100);
          const powerBankProbe=searchMaster("power bank",100);
          const headphonesProbe=searchMaster("headphones",100);
          const redmiProbe=searchMaster("Redmi",100);
          const phone=searchMaster("phone",100);
          const iphone16WrongType=iphone16.filter(f=>f.type!=="phone");
          const thinkpadWrongType=thinkpad.filter(f=>f.type!=="laptop");
          if(iphone16WrongType.length)failures.push(`iPhone 16 query returned non-phone TPIDs: ${iphone16WrongType.map(x=>`${x.type}:${x.label}`).join(" | ")}`);
          if(thinkpadWrongType.length)failures.push(`ThinkPad query returned non-laptop TPIDs: ${thinkpadWrongType.map(x=>`${x.type}:${x.label}`).join(" | ")}`);

          const offerById=new Map(offers.map(o=>[o.tpoid,o]));
          function familyOffers(f){
            const full=familyMap.get(f.tpid);
            return (full?.offerIds||[]).map(id=>offerById.get(id)).filter(Boolean);
          }

          function badFamilyOffers(families, predicate){
            return families.flatMap(f=>familyOffers(f)).filter(predicate).slice(0,30);
          }

          const macbookAccessoryLeaks=badFamilyOffers(macbookPro,o=>
            !o.core || o.type!=="laptop" || (laptopTarget.test(o.name)&&laptopAccessoryTruth(o.name))
          );
          const perfumeSemanticLeaks=badFamilyOffers(perfumeProbe,o=>
            !o.core || o.type!=="perfume" || perfumeContainerOrNonPerfume.test(o.name) || !perfumeStrong.test(o.name)
          );
          const powerBankSemanticLeaks=badFamilyOffers(powerBankProbe,o=>
            !o.core || o.type!=="power_bank" || !powerBankStrong.test(o.name)
          );
          const headphonesSemanticLeaks=badFamilyOffers(headphonesProbe,o=>
            !o.core || o.type!=="headphones" || (speakerObject.test(o.name)&&!headphonesStrong.test(o.name))
          );
          const redmiNonPhoneLeaks=badFamilyOffers(redmiProbe,o=>
            !o.core || o.type!=="phone" || /\b(airdot|airdots|earbuds?|headphones?|case|cover|charger|cable)\b/i.test(o.name)
          );

          if(macbookAccessoryLeaks.length)failures.push(`MacBook Pro sold-object leaks: ${macbookAccessoryLeaks.map(x=>x.name).join(" | ")}`);
          if(perfumeSemanticLeaks.length)failures.push(`Perfume sold-object leaks: ${perfumeSemanticLeaks.map(x=>x.name).join(" | ")}`);
          if(powerBankSemanticLeaks.length)failures.push(`Power bank sold-object leaks: ${powerBankSemanticLeaks.map(x=>x.name).join(" | ")}`);
          if(headphonesSemanticLeaks.length)failures.push(`Headphones sold-object leaks: ${headphonesSemanticLeaks.map(x=>x.name).join(" | ")}`);
          if(redmiNonPhoneLeaks.length)failures.push(`Redmi non-phone leaks: ${redmiNonPhoneLeaks.map(x=>x.name).join(" | ")}`);

          const iphoneBad=iphone16.flatMap(f=>familyOffers(f))
            .filter(o=>!o.core||o.type!=="phone").slice(0,20);
          const thinkpadBad=thinkpad.flatMap(f=>familyOffers(f))
            .filter(o=>!o.core||o.type!=="laptop").slice(0,20);
          const phoneBad=phone.flatMap(f=>familyOffers(f))
            .filter(o=>!o.core||o.type!=="phone").slice(0,20);

          if(iphoneBad.length)failures.push(`iPhone family accessory leak: ${iphoneBad.map(x=>x.name).join(" | ")}`);
          if(thinkpadBad.length)failures.push(`ThinkPad family accessory leak: ${thinkpadBad.map(x=>x.name).join(" | ")}`);
          if(phoneBad.length)failures.push(`Phone family accessory leak: ${phoneBad.map(x=>x.name).join(" | ")}`);

          const iphone16ModelResolution=resolveMasterQuery("iPhone 16",50);
          const iphone16_128Resolution=resolveMasterQuery("iPhone 16 128GB",50);
          const iphone16Pro_128Resolution=resolveMasterQuery("iPhone 16 Pro 128GB",50);

          function variantEvidenceFor(resolution){
            const tpids=new Set(safeArr(resolution.exactProducts).map(x=>x.tpid));
            const rows=[];
            for(const o of offers){
              if(!tpids.has(o.tpid))continue;
              rows.push({
                seller:o.seller,tpid:o.tpid,tpvid:o.tpvid,
                name:o.name,storage:o.storage||"",ram:o.ram||"",
                generation:o.generation||"",condition:o.condition||"",
                variantKey:o.variantKey||""
              });
            }
            return rows.sort((a,b)=>clean(a.seller).localeCompare(clean(b.seller))||clean(a.name).localeCompare(clean(b.name)));
          }

          const iphone16ProVariantEvidence=variantEvidenceFor(iphone16Pro_128Resolution);
          const iphone16VariantEvidence=variantEvidenceFor(iphone16_128Resolution);

          const exactResolutionWrongModels=[
            ...safeArr(iphone16ModelResolution.exactProducts).filter(f=>compact(f.model)!==compact("iPhone 16")),
            ...safeArr(iphone16_128Resolution.exactProducts).filter(f=>compact(f.model)!==compact("iPhone 16")),
            ...safeArr(iphone16Pro_128Resolution.exactProducts).filter(f=>compact(f.model)!==compact("iPhone 16 Pro"))
          ];

          const exactVariantFalsePositives=[
            ...safeArr(iphone16_128Resolution.exactVariants).filter(v=>v.storage!=="128GB"),
            ...safeArr(iphone16Pro_128Resolution.exactVariants).filter(v=>v.storage!=="128GB")
          ];

          if(exactResolutionWrongModels.length){
            failures.push(`Exact model resolver returned wrong model: ${exactResolutionWrongModels.map(x=>x.model||x.label).join(" | ")}`);
          }
          if(exactVariantFalsePositives.length){
            failures.push(`Variant resolver returned wrong storage: ${exactVariantFalsePositives.map(x=>`${x.model}:${x.storage}`).join(" | ")}`);
          }

          const oneCharSearchViolations=["H","F","P"].flatMap(q=>{
            const r=resolveMasterQuery(q,20);
            return (r.exactProducts.length||r.alternatives.length)?[{q,r}]:[];
          });
          if(oneCharSearchViolations.length){
            failures.push(`One-character queries returned products: ${oneCharSearchViolations.map(x=>x.q).join(",")}`);
          }

          const iphAuto=autocomplete("iph",12);
          const iphWrongType=iphAuto.filter(x=>x.kind==="product-model" && x.type!=="phone");
          if(!iphAuto.some(x=>/iphone/i.test(x.value)))warnings.push("No iPhone model surfaced for iph in the current catalog.");
          if(iphWrongType.length)failures.push(`iph autocomplete returned non-phone models: ${iphWrongType.map(x=>`${x.type}:${x.value}`).join(" | ")}`);
          if(iphAuto.some(x=>/\b(case|cover|charger|battery|speaker|earphone|headphone|microphone|ssd|watch|armband)\b/i.test(x.value))){
            failures.push("Accessory/non-product leaked into master autocomplete for iph.");
          }

          // Multi-seller counts are diagnostic, not a hard failure.
          if(!comparableFamilies.length)warnings.push("No exact/same-product multi-seller TPID family found yet; do not force one.");
          if(!comparableVariants.length)warnings.push("No exact same-variant multi-seller TPVID found yet; do not force one.");
          if(!comparisonSets.length)warnings.push("No alternative multi-seller TPCID comparison set found yet.");

          const confidenceCounts={verified:0,high:0,candidate:0,"seller-only":0,related:0};
          for(const f of families)confidenceCounts[f.confidence]=(confidenceCounts[f.confidence]||0)+1;

          const sellerCountDistribution={};
          for(const f of families){
            const k=String(f.sellerCount);
            sellerCountDistribution[k]=(sellerCountDistribution[k]||0)+1;
          }

          const summary={
            version:"20.5.9",readOnly:true,
            foundation:{
              publicSellers:publicSellers.length,
              canonicalSellerFiles:catalogFiles.length,
              canonicalOffers:rows.length,
              v20ProjectionVersion:searchManifest.version,
              blockedSellerLeaks:offers.filter(o=>BLOCKED.has(norm(o.seller))).length,
              duplicateCanonicalProductKeys:duplicateProductKeys.length
            },
            identity:{
              offerIds:tpoids.size,
              masterProductIds:tpids.size,
              masterVariantIds:tpvids.size,
              cleanCoreOffers:cleanCoreOfferCount,
              searchableMasterProducts:masterIndex.length,
              comparableMainOffers:offers.filter(o=>o.comparable).length,
              isolatedRelatedOffers:offers.filter(o=>o.confidence==="related").length,
              rejectedUnsafeV19StrongGroups:rejectedV19StrongGroups.length,
              rejectedUnsafeV19ModelGroups:rejectedV19ModelGroups.length,
              contaminatedMasterFamilies:contaminatedMasterFamilies.length,
              crossTypeModelConflicts:crossTypeModelConflicts.length,
              canonicalModelDuplicateKeys:canonicalModelDuplicates.length,
              postRekeyCanonicalDuplicateKeys:postRekeyDuplicateKeys.length,
              finalMasterDuplicateCanonicalGroups:finalMasterDuplicateGroups.length,
              canonicalRekeyedOffers,
              canonicalRekeyKeys:canonicalRekeyKeys.size,
              ambiguousCanonicalPromotions:ambiguousCanonicalPromotions.length,
              familyAliasCount:familyAliases.length,
              multiSellerFamilyAliases:familyAliases.filter(a=>a.sellerCount>=2).length,
              truthCoreOffers:offers.filter(o=>o.core).length,
              truthRelatedOffers:offers.filter(o=>!o.core).length,
              globalObjectTruthLeaks:globalObjectTruthLeaks.length,
              objectClassCounts,
              truthReasonCounts,
              confidenceCounts,
              sellerCountDistribution
            },
            comparison:{
              multiSellerProducts2Plus:comparableFamilies.length,
              multiSellerVariants2Plus:comparableVariants.length,
              products3PlusSellers:comparableFamilies.filter(f=>f.sellerCount>=3).length,
              products4PlusSellers:comparableFamilies.filter(f=>f.sellerCount>=4).length,
              alternativeComparisonSets:comparisonSets.length,
              phoneComparisonSets:(comparisonSetsByType.get("phone")||[]).length,
              laptopComparisonSets:(comparisonSetsByType.get("laptop")||[]).length,
              headphonesComparisonSets:(comparisonSetsByType.get("headphones")||[]).length,
              perfumeComparisonSets:(comparisonSetsByType.get("perfume")||[]).length
            },
            targetedPurity:{
              iphone16MasterProducts:iphone16.length,
              iphone16WrongTypeResults:iphone16WrongType.length,
              iphone16AccessoryLeaks:iphoneBad.length,
              thinkpadMasterProducts:thinkpad.length,
              thinkpadX1SearchProducts:thinkpadX1.length,
              thinkpadWrongTypeResults:thinkpadWrongType.length,
              thinkpadAccessoryLeaks:thinkpadBad.length,
              broadPhoneMasterProducts:phone.length,
              broadPhoneAccessoryLeaks:phoneBad.length,
              macbookProMasterProducts:macbookPro.length,
              macbookAccessoryLeaks:macbookAccessoryLeaks.length,
              perfumeMasterProducts:perfumeProbe.length,
              perfumeSemanticLeaks:perfumeSemanticLeaks.length,
              powerBankMasterProducts:powerBankProbe.length,
              powerBankSemanticLeaks:powerBankSemanticLeaks.length,
              headphonesMasterProducts:headphonesProbe.length,
              headphonesSemanticLeaks:headphonesSemanticLeaks.length,
              redmiMasterProducts:redmiProbe.length,
              redmiNonPhoneLeaks:redmiNonPhoneLeaks.length,
              iphone16ExactProducts:safeArr(iphone16ModelResolution.exactProducts).length,
              iphone16ExactAlternatives:safeArr(iphone16ModelResolution.alternatives).length,
              iphone16_128ExactProducts:safeArr(iphone16_128Resolution.exactProducts).length,
              iphone16_128ExactVariants:safeArr(iphone16_128Resolution.exactVariants).length,
              iphone16_128ExactOffers:safeArr(iphone16_128Resolution.exactOffers).length,
              iphone16Pro_128ExactProducts:safeArr(iphone16Pro_128Resolution.exactProducts).length,
              iphone16Pro_128ExactVariants:safeArr(iphone16Pro_128Resolution.exactVariants).length,
              variantFalsePositives:exactVariantFalsePositives.length,
              exactModelFalsePositives:exactResolutionWrongModels.length,
              oneCharSearchViolations:oneCharSearchViolations.length,
              iphone16ProVariantEvidenceCount:iphone16ProVariantEvidence.length,
              iphone16VariantEvidenceCount:iphone16VariantEvidence.length,
              iphAutocomplete:iphAuto,
              iphWrongTypeSuggestions:iphWrongType.length
            },
            sellerProbes,
            failures,warnings,
            pass:failures.length===0
          };

          // ------------------------------------------------------------
          // Write artifacts.
          // ------------------------------------------------------------
          const offerStream=fs.createWriteStream(path.join(OUT,"offer-identity-map.ndjson"));
          for(const o of offers)offerStream.write(JSON.stringify(o)+"\n");
          offerStream.end();

          const productStream=fs.createWriteStream(path.join(OUT,"master-products.ndjson"));
          for(const f of families.sort((a,b)=>clean(a.tpid).localeCompare(clean(b.tpid))))productStream.write(JSON.stringify(f)+"\n");
          productStream.end();

          const variantStream=fs.createWriteStream(path.join(OUT,"master-variants.ndjson"));
          for(const v of variants.sort((a,b)=>clean(a.tpvid).localeCompare(clean(b.tpvid))))variantStream.write(JSON.stringify(v)+"\n");
          variantStream.end();

          fs.writeFileSync(path.join(OUT,"master-product-index.json"),JSON.stringify(masterIndex,null,2));
          fs.writeFileSync(path.join(OUT,"multi-seller-products.json"),JSON.stringify(comparableFamilies.slice(0,1000),null,2));
          fs.writeFileSync(path.join(OUT,"multi-seller-variants.json"),JSON.stringify(comparableVariants.slice(0,1000),null,2));
          fs.writeFileSync(path.join(OUT,"comparison-sets.json"),JSON.stringify(comparisonSets,null,2));
          fs.writeFileSync(path.join(OUT,"query-probes.json"),JSON.stringify(queryProbes,null,2));
          fs.writeFileSync(path.join(OUT,"seller-probes.json"),JSON.stringify(sellerProbes,null,2));
          fs.writeFileSync(path.join(OUT,"rejected-v19-identity-groups.json"),JSON.stringify({
            strong:rejectedV19StrongGroups,
            brandExplicitModel:rejectedV19ModelGroups
          },null,2));
          fs.writeFileSync(path.join(OUT,"product-truth-diagnostics.json"),JSON.stringify({
            crossTypeModelConflicts,
            canonicalModelDuplicates,
            ambiguousCanonicalPromotions,
            globalObjectTruthLeaks:globalObjectTruthLeaks.slice(0,500),
            objectClassCounts,
            truthReasonCounts,
            targeted:{
              macbookAccessoryLeaks,
              perfumeSemanticLeaks,
              powerBankSemanticLeaks,
              headphonesSemanticLeaks,
              redmiNonPhoneLeaks
            },
            rekey:{
              canonicalRekeyedOffers,
              canonicalRekeyKeys:[...canonicalRekeyKeys].slice(0,500),
              postRekeyDuplicateKeys
            },
            variants:{
              iphone16:iphone16ModelResolution,
              iphone16_128:iphone16_128Resolution,
              iphone16Pro_128:iphone16Pro_128Resolution,
              iphone16VariantEvidence,
              iphone16ProVariantEvidence,
              exactVariantFalsePositives,
              exactResolutionWrongModels
            },
            finalMasterCollapse:{
              finalMasterDuplicateGroups
            }
          },null,2));
          fs.writeFileSync(path.join(OUT,"family-aliases.json"),JSON.stringify(familyAliases,null,2));
          fs.writeFileSync(path.join(OUT,"summary.json"),JSON.stringify(summary,null,2));

          const groupLine=f=>`- **${f.label}** — \`${f.tpid}\` — ${f.sellerCount} sellers: ${f.sellers.join(", ")} — ${f.offerCount} offers`;

          setStage("build-report");
          let report=`# TrendPilot V20.5.9 — Final Master Collapse + Variant Evidence + Query Guard Lab

          > **READ-ONLY LAB.** No V19 catalog, visitor UI, Netlify function, or production search file is modified.

          ## Identity architecture
          - **TPOID** = one seller listing / offer.
          - **TPID** = TrendPilot master product/model identity.
          - **TPVID** = a product variant identity such as storage/RAM when detected.
          - Search/autocomplete reads the **TPID registry**, not raw product titles.

          ## Foundation
          - Public sellers: **${publicSellers.length}**
          - Canonical seller files: **${catalogFiles.length}**
          - Canonical offers scanned: **${rows.length.toLocaleString()}**
          - V20 persisted projection: **${searchManifest.version}**

          ## Registry size
          - TPOIDs: **${tpoids.size.toLocaleString()}**
          - TPIDs: **${tpids.size.toLocaleString()}**
          - TPVIDs: **${tpvids.size.toLocaleString()}**
          - Clean core offers: **${cleanCoreOfferCount.toLocaleString()}**
          - Searchable master products: **${masterIndex.length.toLocaleString()}**
          - Exact/same-model comparable offers: **${offers.filter(o=>o.comparable).length.toLocaleString()}**

          ## Identity confidence
          - Verified: **${confidenceCounts.verified||0}**
          - High: **${confidenceCounts.high||0}**
          - Candidate: **${confidenceCounts.candidate||0}**
          - Seller-only: **${confidenceCounts["seller-only"]||0}**
          - Related/non-core isolated: **${confidenceCounts.related||0}**

          ## Product Truth + identity safety
          - Truth-core offers: **${offers.filter(o=>o.core).length.toLocaleString()}**
          - Truth-related/non-core offers: **${offers.filter(o=>!o.core).length.toLocaleString()}**
          - Unsafe V19 strong groups rejected: **${rejectedV19StrongGroups.length}**
          - Unsafe V19 explicit-model groups rejected: **${rejectedV19ModelGroups.length}**
          - Master TPID contaminated families: **${contaminatedMasterFamilies.length}**
          - Cross-type model conflicts: **${crossTypeModelConflicts.length}**
          - Canonical model duplicate keys: **${canonicalModelDuplicates.length}**
          - Post-rekey canonical duplicate keys: **${postRekeyDuplicateKeys.length}**
          - FINAL master-registry duplicate canonical groups: **${finalMasterDuplicateGroups.length}**
          - Offers rekeyed to canonical TPIDs: **${canonicalRekeyedOffers.toLocaleString()}**
          - Canonical rekey keys: **${canonicalRekeyKeys.size.toLocaleString()}**
          - Ambiguous models incorrectly promoted to TPID: **${ambiguousCanonicalPromotions.length}**
          - Global sold-object truth leaks: **${globalObjectTruthLeaks.length}**
          - Global family aliases: **${familyAliases.length}**
          - Family aliases represented by 2+ sellers: **${familyAliases.filter(a=>a.sellerCount>=2).length}**
          - Related/accessory offers isolated before TPID grouping: **${offers.filter(o=>o.confidence==="related").length}**

          ## Sold-object truth distribution
          ${Object.entries(objectClassCounts).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([k,v])=>`- **${k}**: ${v.toLocaleString()}`).join("\n")}

          ## Global family aliases — search-only, never exact identity
          ${safeArr(familyAliases).slice(0,20).map(a=>`- **${a.alias}** — ${a.type} — ${a.sellerCount} sellers — ${a.productCount} TPIDs — models: ${safeArr(a.models).slice(0,5).join(", ")||"n/a"}`).join("\n")||"- None"}

          ## Cross-seller comparison potential
          - Multi-seller TPIDs (same product, 2+): **${comparableFamilies.length}**
          - Multi-seller TPVIDs (same variant, 2+): **${comparableVariants.length}**
          - TPIDs at 3+ sellers: **${comparableFamilies.filter(f=>f.sellerCount>=3).length}**
          - TPIDs at 4+ sellers: **${comparableFamilies.filter(f=>f.sellerCount>=4).length}**
          - TPCIDs — alternative comparison sets: **${comparisonSets.length}**
          - Phone TPCIDs: **${(comparisonSetsByType.get("phone")||[]).length}**
