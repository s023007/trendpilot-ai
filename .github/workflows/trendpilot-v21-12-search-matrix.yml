name: TrendPilot V21.12 — Search Quality Matrix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-12-search-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run search quality matrix
        env:
          TP_BASE_URL: https://trendpilotchoice.com
        run: node scripts/qa-v21-12-search-matrix.mjs
      - name: Upload search matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v21-12-search-matrix
          path: artifacts/v21-12-search-matrix
          if-no-files-found: ignore
