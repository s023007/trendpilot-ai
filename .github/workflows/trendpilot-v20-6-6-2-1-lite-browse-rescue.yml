name: TrendPilot V20.6.6.2.1 — Lite Browse Rescue

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-6-6-2-1-lite-browse-rescue
  cancel-in-progress: false

jobs:
  repair:
    name: Build lite TPID browse index + rescue broad comparison
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify existing comparison package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data/search-v20-6/comparison-v20-6-4"
          test -s "$ROOT/manifest.json"
          test -d "$ROOT/types"
          test -s js/site-v13-5.js
          test -s find/index.html

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("data/search-v20-6/comparison-v20-6-4")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))

          assert int(m.get("products") or 0) > 10000, m
          assert int(m.get("offers") or 0) > 10000, m
          assert int(m.get("blockedSellerLeaks") or 0) == 0, m
          assert int(m.get("phoneSoldObjectLeaks") or 0) == 0, m
          assert int(m.get("knownSemanticLeaks") or 0) == 0, m

          files=sorted((root/"types").glob("*.json"))
          assert len(files) >= 10, len(files)

          print("Comparison manifest PASS")
          print("Type files:", len(files))
          PY

      - name: Build lightweight TPID browse files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          root=Path("data/search-v20-6/comparison-v20-6-4")
          src=root/"types"
          dst=root/"browse-lite"
          dst.mkdir(parents=True, exist_ok=True)

          blocked={"temu","joom","filamentpro eu cps","filamentpro"}
          http_prefix=("http://","https://")

          def text(v):
              return str(v or "").strip()

          def valid_url(v):
              v=text(v)
              return v.startswith(http_prefix)

          def first_url(*values):
              for v in values:
                  if valid_url(v):
                      return text(v)
              return ""

          def seller_name(row):
              if not isinstance(row,dict):
                  return ""
              return text(
                  row.get("seller")
                  or row.get("advertiser")
                  or row.get("merchant")
                  or row.get("sellerName")
                  or row.get("advertiserName")
              )

          def price_value(v):
              try:
                  x=float(v)
                  return x if x > 0 else None
              except Exception:
                  return None

          def product_summary(p,ptype):
              variants=p.get("variants") if isinstance(p.get("variants"),list) else []
              offers=[]
              for v in variants:
                  if not isinstance(v,dict):
                      continue
                  vos=v.get("offers")
                  if isinstance(vos,list):
                      offers.extend(o for o in vos if isinstance(o,dict))

              direct_offers=p.get("offers")
              if isinstance(direct_offers,list):
                  offers.extend(o for o in direct_offers if isinstance(o,dict))

              clean_offers=[]
              for o in offers:
                  s=seller_name(o).lower()
                  if any(b in s for b in blocked):
                      continue
                  clean_offers.append(o)
              offers=clean_offers

              sellers=[]
              for s in (p.get("sellers") if isinstance(p.get("sellers"),list) else []):
                  name=text(s if not isinstance(s,dict) else seller_name(s))
                  if name and not any(b in name.lower() for b in blocked):
                      sellers.append(name)
              for o in offers:
                  name=seller_name(o)
                  if name and not any(b in name.lower() for b in blocked):
                      sellers.append(name)
              sellers=sorted(dict.fromkeys(sellers))

              aliases=p.get("aliases") if isinstance(p.get("aliases"),list) else []
              aliases=[text(x) for x in aliases if text(x)]

              image=first_url(
                  p.get("image"), p.get("imageUrl"), p.get("image_url"),
                  p.get("thumbnail"), p.get("thumbnailUrl")
              )
              if not image:
                  for v in variants:
                      if not isinstance(v,dict):
                          continue
                      image=first_url(
                          v.get("image"), v.get("imageUrl"), v.get("image_url"),
                          v.get("thumbnail"), v.get("thumbnailUrl")
                      )
                      if image:
                          break
              if not image:
                  for o in offers:
                      image=first_url(
                          o.get("image"), o.get("imageUrl"), o.get("image_url"),
                          o.get("thumbnail"), o.get("thumbnailUrl")
                      )
                      if image:
                          break

              prices=[]
              currency=text(p.get("currency") or p.get("priceCurrency") or "")
              for key in ("minPrice","fromPrice","price"):
                  val=price_value(p.get(key))
                  if val is not None:
                      prices.append(val)
              for o in offers:
                  for key in ("price","salePrice","amount","minPrice"):
                      val=price_value(o.get(key))
                      if val is not None:
                          prices.append(val)
                          if not currency:
                              currency=text(o.get("currency") or o.get("priceCurrency") or "")
                          break

              tpid=text(p.get("tpid"))
              name=text(p.get("name") or p.get("title") or p.get("canonicalName") or tpid)
              brand=text(p.get("brand") or p.get("canonicalBrand") or "")
              variant_count=len(variants)
              seller_count=max(
                  len(sellers),
                  int(p.get("sellerCount") or 0) if str(p.get("sellerCount") or "").isdigit() else 0
              )

              search=" ".join([name,brand,*aliases]).lower()

              return {
                  "tpid": tpid,
                  "type": ptype,
                  "name": name,
                  "brand": brand,
                  "image": image,
                  "price": min(prices) if prices else None,
                  "currency": currency or "USD",
                  "sellerCount": seller_count,
                  "variantCount": variant_count,
                  "sellers": sellers,
                  "search": search,
              }

          totals={}
          for path in sorted(src.glob("*.json")):
              data=json.loads(path.read_text(encoding="utf-8"))
              products=data.get("products")
              if not isinstance(products,list):
                  continue

              ptype=path.stem
              rows=[]
              seen=set()
              for p in products:
                  if not isinstance(p,dict):
                      continue
                  row=product_summary(p,ptype)
                  if not row["tpid"] or row["tpid"] in seen:
                      continue
                  seen.add(row["tpid"])
                  rows.append(row)

              payload={
                  "version":"20.6.6.2.1",
                  "mode":"tpid-browse-lite",
                  "type":ptype,
                  "count":len(rows),
                  "products":rows,
              }
              (dst/f"{ptype}.json").write_text(
                  json.dumps(payload,ensure_ascii=False,separators=(",",":")),
                  encoding="utf-8"
              )
              totals[ptype]=len(rows)

          (dst/"manifest.json").write_text(
              json.dumps({
                  "version":"20.6.6.2.1",
                  "mode":"tpid-browse-lite",
                  "types":totals,
                  "totalProducts":sum(totals.values()),
              },ensure_ascii=False,indent=2),
              encoding="utf-8"
          )

          assert totals.get("phone",0) > 500, totals
          assert totals.get("headphones",0) > 1000, totals
          assert totals.get("perfume",0) > 100, totals
          assert sum(totals.values()) > 10000, totals

          print("Lite browse total:", sum(totals.values()))
          print(json.dumps(totals,indent=2))
          PY

      - name: Install standalone broad-query rescue
        shell: bash
        run: |
          set -euo pipefail

          cat > js/tp-v20-6-6-2-1-browse-rescue.js <<'JS'
          (() => {
            "use strict";

            const VERSION="20.6.6.2.1";
            const params=()=>new URLSearchParams(location.search);
            const active=()=>params().get("engine")==="v2064" && !params().get("tpid");
            const $=(s,r=document)=>r.querySelector(s);
            const clean=v=>String(v??"").replace(/\s+/g," ").trim();
            const esc=v=>clean(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[c]));
            const validUrl=v=>/^https?:\/\//i.test(clean(v));
            const store=new Map();
            let rendering=false;
            let lastKey="";
            let observer=null;

            const TYPE_RULES=[
              ["dog_food",/\b(dog food|dog treats?|puppy food|canine food)\b/i],
              ["air_conditioner",/\b(air conditioners?|air conditioner|portable ac|mini split|ductless ac|\bac\b)\b/i],
              ["3d_filament",/\b(3d filament|filament|pla filament|petg filament|abs filament)\b/i],
              ["power_bank",/\b(power banks?|powerbank|portable chargers?|battery pack)\b/i],
              ["smartwatch",/\b(smart ?watch|apple watch|wearable watch)\b/i],
              ["headphones",/\b(headphones?|headsets?|earbuds?|earphones?|tws|airpods?|soundcore|jlab)\b/i],
              ["perfume",/\b(perfumes?|fragrances?|cologne|eau de parfum|eau de toilette|edp|edt)\b/i],
              ["laptop",/\b(laptops?|notebooks?|thinkpad|ideapad|thinkbook|chromebook|macbook|legion|lenovo|vivobook)\b/i],
              ["phone",/\b(phones?|smartphones?|iphone|oneplus|xiaomi|redmi|galaxy|samsung|pixel|motorola|moto|oppo|vivo|realme)\b/i],
              ["cookware",/\b(cookware|pots?|pans?|frying pan|saucepan|casserole)\b/i],
              ["lighting",/\b(lighting|lights?|led|lamp|bulb|light strip)\b/i],
              ["tools",/\b(tools?|drill|saw|multimeter|oscilloscope|workshop|screwdriver|wrench)\b/i],
            ];

            function inferType(query){
              const q=clean(query).toLowerCase();
              for(const [type,re] of TYPE_RULES){
                if(re.test(q)) return type;
              }
              return "";
            }

            function tokens(query){
              return clean(query).toLowerCase()
                .replace(/[^a-z0-9]+/g," ")
                .split(/\s+/)
                .filter(x=>x.length>1 && !["for","the","and","with","from","best","buy"].includes(x));
            }

            function score(row,query,type){
              const q=clean(query).toLowerCase();
              const hay=clean(row.search||`${row.brand||""} ${row.name||""}`).toLowerCase();
              if(!q || q===type.replaceAll("_"," ")) return 100;
              const ts=tokens(query);
              if(!ts.length) return 1;
              let n=0;
              for(const t of ts){
                if(hay.includes(t)) n+=1;
              }
              if(n===ts.length) return 200+n;
              if(n) return 50+n;
              return 0;
            }

            async function loadType(type){
              if(store.has(type)) return store.get(type);
              const url=`/data/search-v20-6/comparison-v20-6-4/browse-lite/${encodeURIComponent(type)}.json?v=${VERSION}`;
              const r=await fetch(url,{cache:"no-store",headers:{accept:"application/json"}});
              if(!r.ok) throw new Error(`browse-lite ${type}: ${r.status}`);
              const data=await r.json();
              if(!data || !Array.isArray(data.products)) throw new Error(`invalid browse-lite ${type}`);
              store.set(type,data);
              return data;
            }

            function money(row){
              const p=Number(row.price);
              if(!(p>0)) return "Price at seller";
              const cur=clean(row.currency||"USD").toUpperCase();
              return `From ${cur==="USD"?"US$":cur+" "}${p.toLocaleString(undefined,{maximumFractionDigits:2})}`;
            }

            function exactUrl(row){
              const u=new URL(location.href);
              u.searchParams.set("engine","v2064");
              u.searchParams.set("q",clean(row.name));
              u.searchParams.set("tpid",clean(row.tpid));
              return u.pathname+"?"+u.searchParams.toString();
            }

            function card(row){
              const image=validUrl(row.image)
                ? `<img src="${esc(row.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:contain">`
                : `<div style="display:grid;place-items:center;width:100%;height:100%;font-weight:800;font-size:1.35rem">TP</div>`;

              return `<article data-v206621-card="${esc(row.tpid)}" style="display:grid;grid-template-columns:minmax(120px,32%) 1fr;background:#fff;border:1px solid rgba(19,38,35,.12);border-radius:24px;overflow:hidden;min-height:250px">
                <div style="background:#f3f6f5;min-height:250px;padding:18px;display:grid;place-items:center">${image}</div>
                <div style="padding:22px;display:flex;flex-direction:column;justify-content:center;gap:12px">
                  ${row.brand?`<div style="font-weight:800;color:#3260d9">${esc(row.brand)}</div>`:""}
                  <h3 style="margin:0;font-size:1.25rem;line-height:1.2">${esc(row.name)}</h3>
                  <strong style="font-size:1.45rem">${esc(money(row))}</strong>
                  <div style="display:flex;gap:8px;flex-wrap:wrap;color:#5c6765">
                    <span>${Number(row.sellerCount||0)} seller${Number(row.sellerCount||0)===1?"":"s"}</span>
                    <span>•</span>
                    <span>${Number(row.variantCount||0)} variant${Number(row.variantCount||0)===1?"":"s"}</span>
                  </div>
                  <a class="tp-btn tp-btn-primary" href="${esc(exactUrl(row))}" style="width:max-content;max-width:100%">Compare sellers</a>
                </div>
              </article>`;
            }

            function updateSellerFilter(rows){
              const sel=$("[data-filter-merchant]");
              if(!sel) return;
              const current=clean(sel.value);
              const sellers=[...new Set(rows.flatMap(r=>Array.isArray(r.sellers)?r.sellers:[]).map(clean).filter(Boolean))].sort();
              sel.innerHTML='<option value="">All sellers</option>'+sellers.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");
              if(sellers.includes(current)) sel.value=current;
            }

            function filtered(rows){
              const seller=clean($("[data-filter-merchant]")?.value||"");
              const price=clean($("[data-filter-price]")?.value||"");
              const sort=clean($("[data-filter-sort]")?.value||"smart");
              let out=rows.slice();

              if(seller){
                out=out.filter(r=>Array.isArray(r.sellers)&&r.sellers.includes(seller));
              }

              if(price){
                out=out.filter(r=>{
                  const p=Number(r.price);
                  if(!(p>0)) return false;
                  if(price==="0-10") return p<10;
                  if(price==="10-25") return p>=10&&p<25;
                  if(price==="25-50") return p>=25&&p<50;
                  if(price==="50-100") return p>=50&&p<100;
                  if(price==="100+") return p>=100;
                  return true;
                });
              }

              if(sort==="price-low") out.sort((a,b)=>(Number(a.price)||1e15)-(Number(b.price)||1e15));
              if(sort==="price-high") out.sort((a,b)=>(Number(b.price)||-1)-(Number(a.price)||-1));
              if(sort==="smart") out.sort((a,b)=>(b.__score||0)-(a.__score||0)||Number(b.sellerCount||0)-Number(a.sellerCount||0));

              return out;
            }

            async function render(query,{replaceHistory=false}={}){
              if(!active() || rendering) return;
              const type=inferType(query);
              if(!type) return;

              rendering=true;
              try{
                const key=`${type}|${clean(query).toLowerCase()}`;
                lastKey=key;

                const data=await loadType(type);
                let rows=data.products.map(r=>({...r,__score:score(r,query,type)}));
                const isBroad=clean(query).toLowerCase()===type.replaceAll("_"," ")
                  || ["phone","phones","smartphone","smartphones","headphones","perfume","laptop","tools","lighting","cookware","smartwatch","power bank","dog food","air conditioner","3d filament"].includes(clean(query).toLowerCase());

                const scored=rows.filter(r=>isBroad || r.__score>0);
                if(scored.length) rows=scored;

                updateSellerFilter(rows);
                rows=filtered(rows);

                const grid=$("[data-tp-product-grid]");
                const title=$("[data-tp-results-title]");
                const status=$("[data-tp-finder-status]");
                const count=$("[data-tp-results-count]");
                const tabs=$("[data-tp-result-tabs]");
                const more=$("[data-tp-load-more]");
                if(!grid) return;

                if(replaceHistory){
                  const u=new URL(location.href);
                  u.searchParams.set("engine","v2064");
                  u.searchParams.set("q",clean(query));
                  u.searchParams.delete("tpid");
                  history.replaceState(null,"",u.pathname+"?"+u.searchParams.toString());
                }

                grid.dataset.v206621Rescue="1";
                grid.innerHTML=rows.slice(0,60).map(card).join("") || '<div class="tp-empty"><h3>No TPID product choices found.</h3><p>Try another product model or category.</p></div>';

                if(title) title.textContent=`Choose a product to compare for “${clean(query)}”`;
                if(status) status.textContent="TPID master products. Select one to compare its seller offers.";
                if(count) count.textContent=`${rows.length} master products`;
                if(tabs) tabs.innerHTML="";
                if(more) more.hidden=true;

                const input=$("[data-tp-finder-input]");
                if(input) input.value=clean(query);

                window.__TP_V206621_LAST_RENDER__={version:VERSION,type,query:clean(query),count:rows.length};
              }catch(error){
                console.error("TrendPilot V20.6.6.2.1 lite browse rescue failed",error);
              }finally{
                rendering=false;
              }
            }

            function currentQuery(){
              return params().get("q") || clean($("[data-tp-finder-input]")?.value||"");
            }

            function boot(){
              if(!active()) return;

              const form=$("[data-tp-finder-form]");
              if(form){
                document.addEventListener("submit",e=>{
                  if(!active() || e.target!==form) return;
                  const q=clean($("[data-tp-finder-input]")?.value||"");
                  if(!inferType(q)) return;
                  e.preventDefault();
                  e.stopImmediatePropagation();
                  render(q,{replaceHistory:true});
                },true);
              }

              document.addEventListener("change",e=>{
                if(!active()) return;
                if(e.target.matches("[data-filter-merchant],[data-filter-price],[data-filter-sort]")){
                  render(currentQuery());
                }
              },true);

              render(currentQuery());

              const grid=$("[data-tp-product-grid]");
              if(grid){
                observer=new MutationObserver(()=>{
                  if(!active() || rendering) return;
                  const text=clean(grid.textContent).toLowerCase();
                  const lost=grid.dataset.v206621Rescue!=="1";
                  const failed=text.includes("comparison package could not be loaded")
                    || text.includes("products could not be displayed");
                  if((lost||failed) && inferType(currentQuery())){
                    setTimeout(()=>render(currentQuery()),20);
                  }
                });
                observer.observe(grid,{childList:true,subtree:true,characterData:true});
              }

              setTimeout(()=>{
                if(active() && inferType(currentQuery())) render(currentQuery());
              },1200);
            }

            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",boot,{once:true});
            }else{
              boot();
            }
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("find/index.html")
          s=p.read_text(encoding="utf-8")

          # Remove older rescue reference if this workflow is rerun.
          s=re.sub(
              r'\s*<script\b[^>]*src=["\']/js/tp-v20-6-6-2-1-browse-rescue\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*',
              '\n',
              s,
              flags=re.I
          )

          tag='<script defer src="/js/tp-v20-6-6-2-1-browse-rescue.js?v=20.6.6.2.1"></script>'
          if "</body>" not in s:
              raise SystemExit("find/index.html has no </body>")
          s=s.replace("</body>",tag+"\n</body>",1)

          p.write_text(s,encoding="utf-8")
          print("Standalone rescue script installed without patching site-v13-5.js internals.")
          PY

      - name: Validate lite browse rescue
        shell: bash
        run: |
          set -euo pipefail

          node --check js/tp-v20-6-6-2-1-browse-rescue.js
          grep -q '/js/tp-v20-6-6-2-1-browse-rescue.js?v=20.6.6.2.1' find/index.html

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("data/search-v20-6/comparison-v20-6-4/browse-lite")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))

          assert m["version"]=="20.6.6.2.1",m
          assert int(m["totalProducts"])>10000,m

          for t,minimum in {
              "phone":500,
              "headphones":1000,
              "perfume":100,
              "laptop":300,
              "power_bank":500,
          }.items():
              p=root/f"{t}.json"
              assert p.exists(),t
              data=json.loads(p.read_text(encoding="utf-8"))
              assert len(data["products"])>=minimum,(t,len(data["products"]))
              for row in data["products"][:100]:
                  assert str(row.get("tpid") or "").startswith("TP"),(t,row)
                  assert row.get("name"),(t,row)

          js=Path("js/tp-v20-6-6-2-1-browse-rescue.js").read_text(encoding="utf-8")
          assert 'params().get("engine")==="v2064"' in js
          assert 'params().get("tpid")' in js
          assert 'browse-lite' in js
          assert 'MutationObserver' in js
          assert 'Compare sellers' in js

          print("Lite browse manifest PASS")
          print("TPID summary rows PASS")
          print("Standalone JS syntax PASS")
          print("No brittle site-v13-5.js function matching is used")
          PY

      - name: Commit V20.6.6.2.1 rescue
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "trendpilot-actions"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/search-v20-6/comparison-v20-6-4/browse-lite \
            js/tp-v20-6-6-2-1-browse-rescue.js \
            find/index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install V20.6.6.2.1 lite TPID browse rescue"
            git push origin HEAD:main
          fi

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # TrendPilot V20.6.6.2.1 — Lite Browse Rescue

          **INSTALLED TO MAIN.**

          ## Why this version is different
          - It does **not** regex-rewrite `tpLoadComparisonTypeV20_6_4`.
          - It does **not** rebuild TPID / TPVID / TPOID identity.
          - It does **not** modify the 52,032 canonical seller records.
          - It builds a lightweight TPID browse layer for broad queries.
          - Exact product comparison remains on the existing TPID/TPVID comparison route.
          - One failed legacy/broad renderer can no longer leave `phone`, `headphones`, or `perfume` stuck on `comparison package could not be loaded`.

          ## Test
          - `https://trendpilotchoice.com/find/?engine=v2064&q=phone`
          - `https://trendpilotchoice.com/find/?engine=v2064&q=headphones`
          - `https://trendpilotchoice.com/find/?engine=v2064&q=perfume`
          - `https://trendpilotchoice.com/find/?engine=v2064&q=ThinkPad%20X1%20Carbon`
          - then press **Compare sellers** on one product.

          **V20.6.6.2.1 LITE BROWSE RESCUE COMPLETE.**
          EOF
