name: Apply Math Payment Message V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-math-payment-message-v2.yml'
      - '.github/scripts/patch_math_payment_message_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch payment wording
        run: python3 .github/scripts/patch_math_payment_message_v2.py
      - name: Commit payment wording
        run: |
          git config user.name 'trendpilot-math-payments'
          git config user.email '39025908+s023007@users.noreply.github.com'
          git add math/index-v3.html
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'feat: simplify math payment instructions'
          git pull --rebase origin main
          git push origin HEAD:main
