name: Install TrendPilot V9 Buyer Comfort

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-v9:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and unpack V9 package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="trendpilot-v9-buyer-comfort.zip"
          test -f "$PACKAGE" || { echo "Missing $PACKAGE in repository root"; exit 1; }
          rm -rf .v9-package
          mkdir -p .v9-package
          unzip -q "$PACKAGE" -d .v9-package
          cp -R .v9-package/. ./
          rm -rf .v9-package
          rm -f "$PACKAGE"

      - name: Install V9 across site pages
        run: python3 automation/install_v9.py

      - name: Validate V9 files
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site-v9.js
          python3 -m py_compile automation/install_v9.py
          test -s css/style-v9.css
          test -s js/site-v9.js
          grep -R -l '/css/style-v9.css' --include='*.html' . | head -n 1
          grep -R -l '/js/site-v9.js' --include='*.html' . | head -n 1

      - name: Commit V9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No V9 changes to commit."
          else
            git commit -m "Install TrendPilot V9 buyer comfort improvements"
            git push
          fi
