name: TrendPilot V20.6.8.3 — Shopper Truth + Seller Grouping + CPC Guard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-6-8-3-shopper-stabilization
  cancel-in-progress: false

jobs:
  stabilize-shopper-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify current TrendPilot foundations
        shell: bash
        run: |
          set -euo pipefail
          test -f find/index.html
          test -f netlify.toml
          test -d data
          test -d netlify/functions
          test -f js/site-v13-5.js
          if [ -n "$(git status --porcelain)" ]; then
            echo "Checkout is not clean before V20.6.8.3."
            git status --short
            exit 1
          fi
          echo "Foundation files present."

      - name: Build shopper truth overlay and stable Product Preview
        shell: bash
        env:
          TP_V20683_BUILDER_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$TP_V20683_BUILDER_B64" | base64 --decode > "$RUNNER_TEMP/trendpilot-v20-6-8-3.py"
          python "$RUNNER_TEMP/trendpilot-v20-6-8-3.py"

      - name: Syntax and package validation
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/shopper-v20-6/runtime-v20-6-8-3.json >/dev/null
          python -m json.tool data/shopper-v20-6/qa-v20-6-8-3.json >/dev/null
          node --check netlify/functions/product-preview-v20-6-8-3.cjs
          node --check js/shopper-v20-6-8-3.js
          python -c 'import tomllib; tomllib.load(open("netlify.toml","rb")); print("netlify.toml PASS")'

      - name: Deep local render QA
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const f=require("./netlify/functions/product-preview-v20-6-8-3.cjs"); f.handler({queryStringParameters:{slug:"oneplus-7t--d8c434ede8f517"}}).then(r=>{ if(r.statusCode!==200) throw new Error("OnePlus render status "+r.statusCode); const b=r.body||""; for(const s of ["OnePlus 7T","2 sellers","Alibaba","TikTok Shop US","Available configurations"]) if(!b.includes(s)) throw new Error("missing render marker: "+s); for(const s of ["Affiliate/CPC-capable route","TPVID identity remains unchanged"]) if(b.includes(s)) throw new Error("forbidden shopper copy: "+s); console.log("OnePlus local render PASS"); }).catch(e=>{console.error(e);process.exit(1)})'
          python -c 'import json; q=json.load(open("data/shopper-v20-6/qa-v20-6-8-3.json")); assert not q["failures"], q["failures"]; assert q["cpcDestinationMutationFailures"]==0; assert q["blockedSellerLeaks"]==0; assert q["onePlus7T"]["sellerCount"]==2; print("QA contract PASS")'

      - name: Guard stable identity and canonical catalogs
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git diff --name-only | grep -E '^(data/catalog-v19/|data/search-v20/|data/search-v20-6/|data/product-preview-v20-6/|data/comparison-|data/master-identity)' || true)"
          if [ -n "$bad" ]; then
            echo "V20.6.8.3 attempted to modify a protected identity/catalog package:"
            echo "$bad"
            exit 1
          fi
          echo "Stable identity/catalog guard PASS."

      - name: Commit V20.6.8.3 only after QA passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shopper-v20-6/runtime-v20-6-8-3.json
          git add data/shopper-v20-6/qa-v20-6-8-3.json
          git add netlify/functions/product-preview-v20-6-8-3.cjs
          git add js/shopper-v20-6-8-3.js
          git add find/index.html
          git add netlify.toml
          if git diff --cached --quiet; then
            echo "No V20.6.8.3 changes to commit."
          else
            git commit -m "TrendPilot V20.6.8.3 shopper truth seller grouping CPC guard"
            git push origin HEAD:main
          fi

      - name: Publish V20.6.8.3 summary
        if: success()
        shell: bash
        env:
          TP_V20683_SUMMARY_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$TP_V20683_SUMMARY_B64" | base64 --decode > "$RUNNER_TEMP/trendpilot-v20-6-8-3-summary.py"
          python "$RUNNER_TEMP/trendpilot-v20-6-8-3-summary.py"
