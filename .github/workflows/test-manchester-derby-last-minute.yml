name: Test Manchester Derby Last-Minute Landing

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/test_manchester_derby_last_minute.py'
      - 'events/manchester-derby-2026/nl-nl/index.html'
      - '.github/workflows/test-manchester-derby-last-minute.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/test_manchester_derby_last_minute.py
