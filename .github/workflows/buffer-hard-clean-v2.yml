name: Buffer Hard Clean V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/buffer-hard-clean-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hard-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete every unpublished Buffer post
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const apiKey = process.env.BUFFER_API_KEY;
          const out = 'data/runtime/buffer-hard-clean-v2.json';
          const result = {
            started_at: new Date().toISOString(),
            status: 'running',
            channels: [],
            found: [],
            deleted: [],
            delete_errors: [],
            remaining: [],
            error: null
          };
          fs.mkdirSync('data/runtime', { recursive: true });
          const save = () => fs.writeFileSync(out, JSON.stringify(result, null, 2) + '\n');

          async function gql(query, variables = {}, label = 'Buffer') {
            const response = await fetch('https://api.buffer.com', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${apiKey}`,
              },
              body: JSON.stringify({ query, variables }),
            });
            const raw = await response.text();
            let body;
            try { body = JSON.parse(raw); }
            catch { throw new Error(`${label}: non-JSON HTTP ${response.status}: ${raw.slice(0,500)}`); }
            if (!response.ok || body.errors?.length) throw new Error(`${label}: HTTP ${response.status} ${JSON.stringify(body)}`);
            return body.data;
          }

          async function getUnpublished(orgId, channelId, service) {
            const data = await gql(
              `query Pending($org: OrganizationId!, $channel: ChannelId!) {
                posts(first: 100, input: {
                  organizationId: $org,
                  filter: { status: [draft, scheduled, sending], channelIds: [$channel] }
                }) {
                  edges { node { id text status dueAt channelService createdAt } }
                }
              }`,
              { org: orgId, channel: channelId },
              `unpublished ${service}`,
            );
            return (data?.posts?.edges || []).map(e => e.node);
          }

          async function deletePost(id) {
            const data = await gql(
              `mutation Delete($input: DeletePostInput!) {
                deletePost(input: $input) {
                  __typename
                  ... on DeletePostSuccess { id }
                  ... on VoidMutationError { message }
                }
              }`,
              { input: { id } },
              `delete ${id}`,
            );
            const payload = data?.deletePost;
            if (!payload || payload.__typename !== 'DeletePostSuccess') {
              throw new Error(payload?.message || payload?.__typename || 'unknown delete error');
            }
          }

          (async () => {
            if (!apiKey) throw new Error('BUFFER_API_KEY is missing');
            const account = await gql('query { account { organizations { id name } } }', {}, 'account');
            const org = account?.account?.organizations?.[0];
            if (!org) throw new Error('No Buffer organization found');

            const channelData = await gql(
              `query Channels($org: OrganizationId!) {
                channels(input:{organizationId:$org}) { id name displayName service isQueuePaused }
              }`,
              { org: org.id },
              'channels',
            );
            const channels = channelData?.channels || [];
            result.channels = channels.map(c => ({ id:c.id, service:c.service, name:c.displayName || c.name, queuePaused:!!c.isQueuePaused }));

            for (const channel of channels) {
              const posts = await getUnpublished(org.id, channel.id, channel.service);
              for (const post of posts) {
                const item = {
                  id: post.id,
                  service: channel.service,
                  status: post.status,
                  dueAt: post.dueAt || null,
                  textPreview: String(post.text || '').replace(/\s+/g,' ').trim().slice(0,180),
                };
                result.found.push(item);
                try {
                  await deletePost(post.id);
                  result.deleted.push(item);
                } catch (e) {
                  result.delete_errors.push({ ...item, error: e?.message || String(e) });
                }
              }
            }

            await new Promise(r => setTimeout(r, 2500));
            for (const channel of channels) {
              const posts = await getUnpublished(org.id, channel.id, channel.service);
              for (const post of posts) {
                result.remaining.push({
                  id: post.id,
                  service: channel.service,
                  status: post.status,
                  dueAt: post.dueAt || null,
                  textPreview: String(post.text || '').replace(/\s+/g,' ').trim().slice(0,180),
                });
              }
            }

            result.status = result.remaining.length === 0 ? 'ok' : 'incomplete';
            result.finished_at = new Date().toISOString();
            save();
            console.log('BUFFER_HARD_CLEAN_V2', JSON.stringify(result));
            if (result.remaining.length) process.exitCode = 1;
          })().catch(err => {
            result.status = 'error';
            result.error = err?.message || String(err);
            result.finished_at = new Date().toISOString();
            save();
            console.error('BUFFER_HARD_CLEAN_V2_FAILED', result.error);
            process.exitCode = 1;
          });
          NODE

      - name: Persist audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/buffer-hard-clean-v2.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Buffer hard-clean V2 result"
          git pull --rebase origin main
          git push origin HEAD:main
