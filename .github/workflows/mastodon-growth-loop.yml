name: Mastodon Growth Loop

on:
  workflow_dispatch:
  schedule:
    # 11:20 and 20:20 Oman (UTC+4)
    - cron: '20 7,16 * * *'

permissions:
  contents: write

concurrency:
  group: mastodon-growth-loop
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MASTODON_BASE_URL: https://mastodon.social
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      TRENDPILOT_FEED_URL: https://trendpilotchoice.com/feed.xml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Mastodon access token
        run: |
          if [ -z "$MASTODON_ACCESS_TOKEN" ]; then
            echo "MASTODON_ACCESS_TOKEN secret is missing."
            exit 1
          fi

      - name: Publish one new TrendPilot item
        run: python3 scripts/publish-mastodon.py

      - name: Record publication state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/mastodon-growth-state.json data/runtime/mastodon-growth-last.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Mastodon runtime changes to commit."
            exit 0
          fi
          git commit -m "chore: record Mastodon growth publication"
          git push
