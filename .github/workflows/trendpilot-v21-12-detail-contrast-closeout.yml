name: TrendPilot V21.12 — Detail Contrast Closeout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendpilot-v21-12-detail-contrast-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Apply contrast closeout
        run: python scripts/apply-v21-12-detail-contrast.py
      - name: Remove one-time workflow
        run: rm -f .github/workflows/trendpilot-v21-12-detail-contrast-closeout.yml
      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/trendpilot-v21-2-1-final.css
          git add -u .github/workflows/trendpilot-v21-12-detail-contrast-closeout.yml
          git diff --cached --check
          git commit -m 'TrendPilot V21.12 close ticket-detail and trust-form contrast gaps'
          git pull --rebase origin main
          git push origin HEAD:main
