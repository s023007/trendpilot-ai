name: TrendPilot Products V15.6.1 Seller Routing Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-6-1-seller-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-seller-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Fix Admitad seller persistence and CJ Temu guard
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/tp_v15_6_1.py
          python /tmp/tp_v15_6_1.py

      - name: Validate seller routing
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          js=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")
          blob=js+"\n"+html

          required=[
              '"FilamentPRO EU CPS"',
              '"Govee Many GEOs"',
              '"Harfington Many GEOs"',
              '"Sunsky-online WW"',
              '"govee many geos":"Govee Many GEOs"',
              '"sunsky-online ww":"Sunsky-online WW"',
              "const wantedSeller=tpCanonicalSellerV15_1(f.merchant)",
              "const rowSeller=tpCanonicalSellerV15_1(p.advertiser)",
              '"6293473"',
              '"temu"',
              "/js/site-v13-5.js?v=15.6.1",
              "TP_LENOVO_DIRECT_LINK_V15_5_3_START",
              "TP_CJ_SEARCH_BRIDGE_START"
          ]
          missing=[x for x in required if x not in blob]
          if missing:
              raise SystemExit("Missing validation markers: "+", ".join(missing))

          seller_line=js.split("const TP_PRODUCT_SELLERS_V15_1 =",1)[1].split(";",1)[0]
          for seller in [
              "AliExpress","Alibaba","Geekbuying","FilamentPRO EU CPS",
              "Govee Many GEOs","Harfington Many GEOs","Sunsky-online WW"
          ]:
              if f'"{seller}"' not in seller_line:
                  raise SystemExit("Missing seller from dropdown registry: "+seller)

          id_line=js.split("TP_CJ_APPROVED_IDS",1)[1].split(";",1)[0]
          name_line=js.split("TP_CJ_APPROVED_NAMES",1)[1].split(";",1)[0]
          if '"6293473"' not in id_line or '"temu"' not in name_line:
              raise SystemExit("Temu is still not in the CJ exact allow-list.")

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"js/site-v13-5.js","find/index.html"}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected files changed: "+", ".join(sorted(unexpected)))

          if "/js/product-discovery-v15.js?v=15.2.0" not in html:
              raise SystemExit("Suggestion engine changed unexpectedly.")

          print("V15.6.1 validation passed.")
          print("- Admitad sellers no longer reset to All sellers.")
          print("- Seller filtering canonicalizes both selected seller and product seller.")
          print("- Temu advertiser 6293473 is allowed by the CJ exact guard.")
          print("- Lenovo direct-link, CJ bridge, CPC and suggestions remain intact.")
          PY

      - name: Publish V15.6.1
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/site-v13-5.js find/index.html
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.6.1 already installed."
            exit 0
          fi

          git commit -m "fix: preserve Admitad sellers and allow CJ Temu products"
          git push origin HEAD:main
