name: TrendPilot V20.3 — Controlled Visitor Cutover

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-3-controlled-cutover
  cancel-in-progress: false

jobs:
  controlled-cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify V20.2 shadow foundation
        shell: bash
        run: |
          set -euo pipefail

          test -s data/search-v20/manifest.json
          test -s data/search-v20/types/phone.json
          test -s data/search-v20/types/laptop.json
          test -s netlify/functions/products-v20-shadow.mjs
          test -s netlify/functions/products-v20-shadow-lib.mjs
          test -s js/site-v13-5.js
          test -s find/index.html
          test -s data/product-seller-registry-v17.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest=json.loads(Path("data/search-v20/manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("version")=="20.2.0", manifest.get("version")
          assert manifest.get("catalogFilesLoaded")==13, manifest.get("catalogFilesLoaded")
          assert manifest.get("duplicateProductKeys")==0, manifest.get("duplicateProductKeys")
          assert manifest.get("blockedSellerLeaks")==0, manifest.get("blockedSellerLeaks")
          assert int(manifest.get("roleCounts",{}).get("main",0))>=5000

          blocked={"Temu","Joom","FilamentPRO EU CPS","FilamentPRO"}
          names={x.get("name","") for x in manifest.get("publicSellers",[])}
          assert len(names)==13, names
          assert not (names & blocked), names & blocked

          required={
              "phone","laptop","smartwatch","headphones","perfume","dog_food",
              "power_bank","air_conditioner","3d_filament","lighting","tools"
          }
          assert required.issubset(set(manifest.get("typeCounts",{}))), required-set(manifest.get("typeCounts",{}))
          print("V20.2 foundation PASS.")
          print("V20.2 public sellers:", sorted(names))
          PY

      - name: Enforce 13-seller public product policy
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          ALLOWED=[
              "AliExpress","Alibaba","Geekbuying","Govee Many GEOs",
              "Harfington Many GEOs","Sunsky-online WW","Lenovo","Diecast",
              "FragranceShop.com","Karaca EU","MFI Medical","PandaHall",
              "TikTok Shop US"
          ]
          BLOCKED={"Temu","Joom","FilamentPRO EU CPS","FilamentPRO"}

          registry_path=Path("data/product-seller-registry-v17.json")
          registry=json.loads(registry_path.read_text(encoding="utf-8"))

          for row in registry.get("sellers",[]):
              name=str(row.get("name","")).strip()
              if name in BLOCKED:
                  row["public"]=False
                  row["publicReason"]="blocked-from-TrendPilot-product-comparison"
              elif name in ALLOWED:
                  row["public"]=True

          public=[x["name"] for x in registry.get("sellers",[]) if x.get("public") is True]
          unknown=[x for x in public if x not in ALLOWED]
          missing=[x for x in ALLOWED if x not in public]
          if unknown or missing or len(public)!=13:
              raise SystemExit(f"Seller policy mismatch. public={public}; unknown={unknown}; missing={missing}")

          registry["version"]="20.3.0"
          notes=list(registry.get("notes",[]))
          note="V20.3 controlled cutover: FilamentPRO EU CPS, Temu and Joom are blocked from public product comparison."
          if note not in notes:
              notes.append(note)
          registry["notes"]=notes
          registry_path.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          aliases={
              "AliExpress":["aliexpress","ali express","aliexpress.com","aliexpress ww","aliexpressww"],
              "Alibaba":["alibaba","alibaba.com","alibaba ww","alibabaww"],
              "Geekbuying":["geekbuying","geek buying","geekbuying ww","geekbuyingww"],
              "Govee Many GEOs":["govee","govee many geos"],
              "Harfington Many GEOs":["harfington","harfington many geos","harrington","harrington many geos"],
              "Sunsky-online WW":["sunsky","sunsky online","sunsky-online","sunsky-online ww"],
              "Lenovo":["lenovo","lenovo many geos"],
              "Diecast":["diecast","diecast.com","diecast models wholesale","diecastmodelswholesale"],
              "FragranceShop.com":["fragranceshop.com","fragranceshop","fragrance shop","the fragrance shop"],
              "Karaca EU":["karaca","karaca eu","karaca europe"],
              "MFI Medical":["mfi","mfi medical","mfimedical"],
              "PandaHall":["pandahall","panda hall","pandahall.com"],
              "TikTok Shop US":["tiktok","tiktok shop","tiktok shop us","tiktokshop","tiktokshopus"],
          }

          policy = f'''// TrendPilot V20.3 - explicit public product seller policy.
          // Temu and Joom are not approved for public product comparison.
          // FilamentPRO EU CPS is intentionally excluded by owner policy.
          export const PRODUCT_SELLER_POLICY_VERSION = "20.3.0";
          export const PUBLIC_PRODUCT_SELLER_NAMES = Object.freeze({json.dumps(ALLOWED,ensure_ascii=False)});
          const aliasGroups = {json.dumps(aliases,ensure_ascii=False)};
          const normalizeKey = value => String(value ?? "").toLocaleLowerCase("en-US").normalize("NFKC").replace(/[^a-z0-9]+/g, "");
          const canonicalByKey = new Map();
          for (const canonical of PUBLIC_PRODUCT_SELLER_NAMES) {{
            canonicalByKey.set(normalizeKey(canonical), canonical);
            for (const alias of aliasGroups[canonical] || []) canonicalByKey.set(normalizeKey(alias), canonical);
          }}
          export function canonicalProductSeller(value) {{ const key=normalizeKey(value); return key ? (canonicalByKey.get(key)||"") : ""; }}
          export function isApprovedProductSeller(value) {{ return Boolean(canonicalProductSeller(value)); }}
          export function canonicalizePublicProduct(product) {{
            if (!product || typeof product !== "object") return null;
            const rawSeller=product.seller||product.advertiser||product.merchant||product.advertiserName||product.merchantName||"";
            const seller=canonicalProductSeller(rawSeller); if (!seller) return null;
            return {{...product,seller,advertiser:product.advertiser?seller:product.advertiser}};
          }}
          export function publicProductSellerAllowed(product) {{ return Boolean(canonicalizePublicProduct(product)); }}
          '''
          policy="\n".join(line.rstrip() for line in policy.splitlines())+"\n"
          Path("netlify/functions/product-seller-policy-v17.mjs").write_text(policy,encoding="utf-8")

          site_path=Path("js/site-v13-5.js")
          s=site_path.read_text(encoding="utf-8")
          allowed_json=json.dumps(ALLOWED,ensure_ascii=False,separators=(",",":"))

          s,n=re.subn(
              r'const TP_PUBLIC_PRODUCT_SELLERS_V17_2 = new Set\(\[[^\n]*\]\);',
              f'const TP_PUBLIC_PRODUCT_SELLERS_V17_2 = new Set({allowed_json});',
              s,count=1
          )
          if n!=1:
              raise SystemExit("TP_PUBLIC_PRODUCT_SELLERS_V17_2 marker not found uniquely.")

          s,n=re.subn(
              r'const TP_PRODUCT_SELLERS_V15_1 = \[[^\n]*\];',
              f'const TP_PRODUCT_SELLERS_V15_1 = {allowed_json};',
              s,count=1
          )
          if n!=1:
              raise SystemExit("TP_PRODUCT_SELLERS_V15_1 marker not found uniquely.")

          s,n=re.subn(
              r'const TP_CJ_GUARD_VERSION = "[^"]+";',
              'const TP_CJ_GUARD_VERSION = "20.3.0";',
              s,count=1
          )
          if n!=1:
              raise SystemExit("TP_CJ_GUARD_VERSION marker not found uniquely.")

          # Enforce the public-seller guard on every existing product array path.
          s=s.replace(
              ".filter(tpCjPublicAllowed).filter(tpPublicSellerAllowed).filter(tpPublicSellerAllowed)",
              ".filter(tpCjPublicAllowed).filter(tpPublicSellerAllowed)"
          )
          s=s.replace(
              ".filter(tpCjPublicAllowed)",
              ".filter(tpCjPublicAllowed).filter(tpPublicSellerAllowed)"
          )
          s=s.replace(
              ".filter(tpCjPublicAllowed).filter(tpPublicSellerAllowed).filter(tpPublicSellerAllowed)",
              ".filter(tpCjPublicAllowed).filter(tpPublicSellerAllowed)"
          )

          # Saved/cache cleanup must also remove any seller no longer public.
          s=s.replace(
              "if(tpCjPublicAllowed(p))safe[id]=row;",
              "if(tpCjPublicAllowed(p)&&tpPublicSellerAllowed(p))safe[id]=row;"
          )

          site_path.write_text(s,encoding="utf-8")
          print("13-seller public product policy enforced.")
          PY

      - name: Install V20.3 controlled finder bridge
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          site=Path("js/site-v13-5.js")
          finder=Path("find/index.html")
          s=site.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # A) Add controlled V20 loader immediately after the existing
          #    V16 bridge. V16/V17 stay available only as fallback.
          # ------------------------------------------------------------
          if "TP_V20_3_CONTROLLED_START" not in s:
              anchor="// TP_V16_2_1_HYBRID_FINDER_END"
              pos=s.find(anchor)
              if pos<0:
                  raise SystemExit("V16.2.1 hybrid bridge end marker not found.")
              pos=s.find("\n",pos)
              if pos<0:
                  raise SystemExit("Could not place V20.3 bridge.")

              block=r'''
          // TP_V20_3_CONTROLLED_START
          const TP_V20_3_BLOCKED_SELLERS = new Set(["Temu","Joom","FilamentPRO EU CPS","FilamentPRO"]);
          const TP_V20_3_UI_TYPE = Object.freeze({
            phone:{group:"phones-tablets",family:"smartphones"},
            laptop:{group:"computers",family:"laptops"},
            smartwatch:{group:"jewelry-watches",family:"watches"},
            headphones:{group:"audio",family:"headphones"},
            perfume:{group:"beauty-care",family:"fragrance"},
            dog_food:{group:"pet-supplies",family:"dog-food"},
            power_bank:{group:"phones-tablets",family:"power-banks"},
            air_conditioner:{group:"home-kitchen",family:"air-conditioner"},
            "3d_filament":{group:"printing-3d",family:"3d-filament"},
            cookware:{group:"home-kitchen",family:"cookware"},
            lighting:{group:"smart-home",family:"smart-lighting"},
            tools:{group:"tools",family:"tools"}
          });

          function tpV20RowV20_3(row,type,channel){
            if(!row || typeof row!=="object")return null;
            const seller=clean(row.seller||"");
            if(!seller || TP_V20_3_BLOCKED_SELLERS.has(seller))return null;
            const ui=TP_V20_3_UI_TYPE[type]||{group:"other",family:type||"other"};
            const source={
              id:clean(row.key||row.url||`${seller}:${row.title||""}`),
              clusterKey:clean(row.key||row.url||`${seller}:${row.title||""}`),
              name:clean(row.title||""),
              url:clean(row.url||""),
              image:clean(row.image||""),
              advertiser:seller,
              network:clean(row.network||""),
              brand:clean(row.brand||""),
              group:ui.group,
              family:ui.family,
              audience:"all",
              price:Number(row.price||0)||0,
              currency:clean(row.currency||"USD"),
              quality:Number(row.quality||0)||0,
              specs:row.specs&&typeof row.specs==="object"?row.specs:{},
              category:type,
              description:"",
              offerCount:1,
              storeCount:1
            };
            let p=normalizeProduct(source);
            p._tpV20_3=true;
            p._tpV20Role=clean(row.role||channel||"");
            p._tpV20Type=type;
            p._tpV20Channel=channel;
            return tpPublicSellerAllowed(p)?p:null;
          }

          async function tpLoadV20ControlledV20_3(query,requestedSeller=""){
            const q=clean(query);
            const seller=tpCanonicalSellerV15_1(requestedSeller)||clean(requestedSeller);
            const no={usable:false,main:[],alternatives:[],related:[],meta:null};

            if(q.length<2 || lower(q)==="popular products")return {...no,reason:"popular-or-empty"};
            if(seller && (!TP_PUBLIC_PRODUCT_SELLERS_V17_2.has(seller) || TP_V20_3_BLOCKED_SELLERS.has(seller))){
              return {...no,reason:"seller-not-public"};
            }

            const params=new URLSearchParams({q,limit:"48",related:"1",cutover:"20.3"});
            if(seller)params.set("seller",seller);

            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),9000);
            try{
              const response=await fetch(`/api/products-v20-shadow?${params.toString()}`,{
                cache:"no-store",
                signal:controller.signal,
                headers:{"accept":"application/json"}
              });
              if(!response.ok)return {...no,reason:`http-${response.status}`};

              const payload=await response.json();
              if(payload?.ready!==true || payload?.version!=="20.2.0"){
                return {...no,meta:payload||null,reason:"projection-not-ready"};
              }
              if(payload.mode==="unknown" || !payload.type || !TP_V20_3_UI_TYPE[payload.type]){
                return {...no,meta:payload,reason:"unsupported-type"};
              }

              const rawMain=Array.isArray(payload.main)?payload.main:[];
              const rawAlt=Array.isArray(payload.alternatives)?payload.alternatives:[];
              const rawRelated=Array.isArray(payload.related)?payload.related:[];

              for(const row of rawMain){
                if(clean(row.role)!=="main" || clean(row.type)!==clean(payload.type)){
                  console.warn("TrendPilot V20.3 rejected impure main row",row);
                  return {...no,meta:payload,reason:"impure-main-row"};
                }
                if(TP_V20_3_BLOCKED_SELLERS.has(clean(row.seller))){
                  return {...no,meta:payload,reason:"blocked-seller-row"};
                }
              }

              const main=rawMain.map(r=>tpV20RowV20_3(r,payload.type,"main")).filter(Boolean);
              const alternatives=rawAlt.map(r=>tpV20RowV20_3(r,payload.type,"same-type-alternative")).filter(Boolean);
              const related=rawRelated.map(r=>tpV20RowV20_3(r,payload.type,"related")).filter(Boolean);

              const meta={
                ...payload,
                engine:"v20.3-controlled",
                fallbackUsed:false,
                sourceEndpoint:"/api/products-v20-shadow"
              };

              return {
                usable:main.length>0,
                main,
                alternatives,
                related,
                meta,
                reason:main.length?"v20-main-ready":"no-main-results"
              };
            }catch(error){
              if(error?.name!=="AbortError")console.warn("TrendPilot V20.3 controlled search unavailable",error);
              return {...no,reason:error?.name==="AbortError"?"timeout":"request-failed"};
            }finally{
              clearTimeout(timer);
            }
          }

          function tpApplyV20ControlledV20_3(payload){
            const main=uniqProducts((payload?.main||[]).filter(tpPublicSellerAllowed));
            const alternatives=uniqProducts([
              ...(payload?.alternatives||[]),
              ...(payload?.related||[])
            ].filter(tpPublicSellerAllowed));

            state.v20Active=true;
            state.v20Meta=payload?.meta||null;
            state.hybridMeta={...(payload?.meta||{}),engine:"v20.3-controlled",fallbackUsed:false};
            state.exact=main;
            state.alternatives=alternatives;
            state.products=uniqProducts([...main,...alternatives]);
            state.segmentState.clear();
          }
          // TP_V20_3_CONTROLLED_END
          '''
              s=s[:pos+1]+block+s[pos+1:]

          # ------------------------------------------------------------
          # B) Add V20 state.
          # ------------------------------------------------------------
          old='originalQuery: "", queryCorrected: false, selectedSeller: "" // TP_SELECTED_SELLER_V15_9_2'
          new='originalQuery: "", queryCorrected: false, selectedSeller: "", v20Active:false, v20Meta:null // TP_SELECTED_SELLER_V15_9_2'
          if old in s:
              s=s.replace(old,new,1)
          elif "v20Active:false" not in s:
              raise SystemExit("State marker for V20.3 not found.")

          # V20 has already exhausted its persisted projection; never mix
          # legacy pages via Show More after a successful V20 result.
          old_candidate='''  function candidatePagesExhausted() {
            return state.plan.segmentKeys.every(key => {'''
          new_candidate='''  function candidatePagesExhausted() {
            if(state.v20Active)return true;
            return state.plan.segmentKeys.every(key => {'''
          if old_candidate in s:
              s=s.replace(old_candidate,new_candidate,1)
          elif "if(state.v20Active)return true;" not in s:
              raise SystemExit("candidatePagesExhausted marker not found.")

          old_scan='''  function scannedCandidateCount() {
            return state.plan.segmentKeys.reduce((total,key) => {'''
          new_scan='''  function scannedCandidateCount() {
            if(state.v20Active)return Number(state.v20Meta?.totalMainForType||state.products.length||0);
            return state.plan.segmentKeys.reduce((total,key) => {'''
          if old_scan in s:
              s=s.replace(old_scan,new_scan,1)
          elif "state.v20Meta?.totalMainForType" not in s:
              raise SystemExit("scannedCandidateCount marker not found.")

          # ------------------------------------------------------------
          # C) Replace performSearch by function boundaries.
          #    V20 first. Legacy executes only if V20 is unsupported,
          #    unavailable, or has no main result for the requested seller.
          # ------------------------------------------------------------
          start=s.find("  async function performSearch(query,push=true,scope=\"\"){")
          end=s.find("  async function showMore(){",start)
          if start<0 or end<0:
              raise SystemExit("performSearch boundaries not found.")

          perform=r'''  async function performSearch(query,push=true,scope=""){
            // TP_V20_3_CONTROLLED_PERFORM
            const merchantBeforeSearch=$('[data-filter-merchant]');
            const preservedSeller=state.selectedSeller||tpCanonicalSellerV15_1(merchantBeforeSearch?.value)||merchantBeforeSearch?.value||"";
            state.selectedSeller=TP_PUBLIC_PRODUCT_SELLERS_V17_2.has(preservedSeller)?preservedSeller:"";

            const normalized=normalizeQuery(query);
            state.originalQuery=normalized.original;
            state.query=normalized.query;
            state.queryCorrected=normalized.corrected;
            state.scope=scope||"";
            state.shown=24;
            state.activeTab="exact";
            state.products=[];
            state.exact=[];
            state.alternatives=[];
            state.segmentState.clear();
            state.loading=true;
            state.v20Active=false;
            state.v20Meta=null;
            state.hybridMeta=null;

            resetFilterControls();
            const grid=$('[data-tp-product-grid]');
            if(grid)grid.innerHTML='<div class="tp-empty"><h3>Checking matching products…</h3><p>TrendPilot is loading the verified product projection first.</p></div>';

            try{
              const [m,v20]=await Promise.all([
                loadManifest(),
                tpLoadV20ControlledV20_3(state.query,state.selectedSeller)
              ]);

              state.plan=makePlan(state.query,m,state.scope);
              state.segments=state.plan.segmentKeys.map(segmentMeta).filter(Boolean);

              if(push){
                const params=new URLSearchParams({q:state.query});
                if(state.scope)params.set("scope",state.scope);
                history.replaceState(null,"",`/find/?${params.toString()}`);
              }
              const input=$('[data-tp-finder-input]');
              if(input)input.value=state.query;
              const scopeSelect=$('[data-tp-finder-scope]');
              if(scopeSelect)scopeSelect.value=state.scope;

              if(v20?.usable){
                tpApplyV20ControlledV20_3(v20);
                populateFilters();
                if(state.selectedSeller){
                  const merchant=$('[data-filter-merchant]');
                  if(merchant && [...merchant.options].some(o=>o.value===state.selectedSeller)){
                    merchant.value=state.selectedSeller;
                  }
                }
                renderFinder();
                return;
              }

              // Controlled fallback: preserve the proven V16/V17 behavior only
              // when V20 does not cover this query or cannot provide a main row.
              state.v20Active=false;
              state.v20Meta=v20?.meta||null;

              const cjLiveQuery=state.query;
              const cjLivePromise=(state.selectedSeller && TP_CJ_LIVE_SELLERS_V15_7_1.has(state.selectedSeller))
                ? tpLoadSelectedLiveSellerV15_8_9(state.selectedSeller,cjLiveQuery)
                : Promise.resolve([]);

              const results=await Promise.allSettled([
                tpLoadHybridProductsV16_2_1(state.query,state.selectedSeller),
                state.manifest.version==="fallback"?Promise.resolve(state.products):loadInitialSegments(),
                loadCjProducts(),
                typeof tpLoadBalancedSellerRowsV15_1==="function"?tpLoadBalancedSellerRowsV15_1():Promise.resolve([]),
                loadAdmitadProductsV15_4()
              ]);

              const hybridPayload=results[0].status==="fulfilled"?results[0].value:{rows:[],meta:null};
              const rows=results[1].status==="fulfilled"?results[1].value:[];
              const cjRows=results[2].status==="fulfilled"?results[2].value:[];
              const balancedRows=results[3].status==="fulfilled"?results[3].value:[];
              const admitadRows=results[4].status==="fulfilled"?results[4].value:[];

              state.hybridMeta={
                ...(hybridPayload?.meta||{}),
                engine:"legacy-fallback",
                v20Reason:v20?.reason||"not-used"
              };

              mergeProducts([
                ...(hybridPayload?.rows||[]),
                ...rows,
                ...cjRows,
                ...balancedRows,
                ...admitadRows
              ].filter(tpPublicSellerAllowed));

              if(state.exact.length<24){
                await Promise.race([
                  ensureMinimumExact(24),
                  new Promise(resolve=>setTimeout(resolve,6500))
                ]);
              }

              populateFilters();
              if(state.selectedSeller){
                const merchant=$('[data-filter-merchant]');
                if(merchant && [...merchant.options].some(o=>o.value===state.selectedSeller)){
                  merchant.value=state.selectedSeller;
                }
              }
              renderFinder();

              cjLivePromise.then(liveRows=>{
                if(cjLiveQuery!==state.query || state.v20Active || !Array.isArray(liveRows) || !liveRows.length)return;
                mergeProducts(liveRows.filter(tpPublicSellerAllowed));
                populateFilters();
                if(state.selectedSeller){
                  const merchant=$('[data-filter-merchant]');
                  if(merchant && [...merchant.options].some(o=>o.value===state.selectedSeller)){
                    merchant.value=state.selectedSeller;
                  }
                }
                renderFinder();
              }).catch(()=>{});
            }catch(error){
              console.error("TrendPilot V20.3 product search failed safely",error);
              state.v20Active=false;
              if(!state.plan){
                state.plan={q:state.query,groups:[],family:"",families:[],audience:"",segmentKeys:[],alternativeKeys:[],intentTokens:[],exactIntent:false};
              }
              try{populateFilters();renderFinder();}catch(renderError){
                console.error("TrendPilot finder fallback failed",renderError);
                if(grid)grid.innerHTML='<div class="tp-empty"><h3>Products could not be displayed.</h3><p>Refresh once or try another search. No unrelated products were substituted.</p></div>';
              }
              const status=$('[data-tp-finder-status]');
              if(status)status.textContent="The catalogue could not finish loading. Try again or change the search.";
            }finally{
              state.loading=false;
            }
          }
          '''
          s=s[:start]+perform+s[end:]

          # ------------------------------------------------------------
          # D) Seller filter: rerun the controlled search with the seller
          #    instead of stacking old seller rows into the previous state.
          # ------------------------------------------------------------
          init_start=s.find("  function initFinder(){")
          init_end=s.find("  function initEvents(){",init_start)
          if init_start<0 or init_end<0:
              raise SystemExit("initFinder boundaries not found.")

          init=r'''  function initFinder(){
            // TP_V20_3_SELLER_STABLE
            const form=$('[data-tp-finder-form]');
            if(!form)return;

            form.addEventListener('submit',e=>{
              e.preventDefault();
              const scope=$('[data-tp-finder-scope]')?.value||'';
              performSearch(
                $('[data-tp-finder-input]')?.value||scope||'popular products',
                true,
                scope
              );
            });

            $$('[data-search-suggestion]').forEach(b=>
              b.addEventListener('click',()=>
                performSearch(
                  b.dataset.searchSuggestion,
                  true,
                  b.dataset.searchScope||''
                )
              )
            );

            $('[data-tp-load-more]')?.addEventListener('click',showMore);

            $$('[data-filter-group],[data-filter-family],[data-filter-audience],[data-filter-merchant],[data-filter-price],[data-filter-sort],[data-filter-coupon],[data-filter-rare]')
              .forEach(x=>x.addEventListener('change',async()=>{
                if(x.matches('[data-filter-group]'))populateFilters();

                if(x.matches('[data-filter-merchant]')){
                  const selected=tpCanonicalSellerV15_1(x.value)||clean(x.value);
                  state.selectedSeller=TP_PUBLIC_PRODUCT_SELLERS_V17_2.has(selected)?selected:"";
                  state.shown=24;
                  await performSearch(state.query,false,state.scope);
                  return;
                }

                state.shown=24;
                renderFinder();
              }));

            $('[data-reset-filters]')?.addEventListener('click',()=>{
              state.selectedSeller='';
              $$('[data-filter-panel] select').forEach(x=>x.value='');
              $$('[data-filter-panel] input[type="checkbox"]').forEach(x=>x.checked=false);
              state.shown=24;
              performSearch(state.query,false,state.scope);
            });

            $('[data-tp-filter-toggle]')?.addEventListener('click',e=>{
              const p=$('[data-tp-filter-panel]');
              p?.classList.toggle('is-expanded');
              e.currentTarget.setAttribute(
                'aria-expanded',
                String(p?.classList.contains('is-expanded'))
              );
            });

            const params=new URLSearchParams(location.search);
            performSearch(
              params.get('q')||"popular products",
              false,
              params.get('scope')||''
            );
          }
          '''
          s=s[:init_start]+init+s[init_end:]

          # ------------------------------------------------------------
          # E) V20-aware result status.
          # ------------------------------------------------------------
          old=r'''      const scan=scannedCandidateCount();
                const progress=candidatePagesExhausted()?"Catalogue check complete.":"More relevant catalogue pages can still be checked.";
                const correction=state.queryCorrected?`Corrected “${state.originalQuery}” to “${state.query}”. `:"";
                const hybridStatusV16_2_1=state.hybridMeta
                  ? (state.hybridMeta.fallbackUsed
                      ? " Wider live/catalogue sources were added."
                      : " V16 hybrid index active.")
                  : "";
                status.textContent=`${correction}Showing ${fmt.format(visible.length)} of ${fmt.format(renderRows.length)} ${selectedSeller&&renderRows!==rows?"seller matches":noun}. ${fmt.format(scan)} candidates checked. ${progress}${hybridStatusV16_2_1}`;'''
          new=r'''      const scan=scannedCandidateCount();
                const progress=state.v20Active
                  ? "Verified V20 projection loaded."
                  : (candidatePagesExhausted()?"Catalogue check complete.":"More relevant catalogue pages can still be checked.");
                const correction=state.queryCorrected?`Corrected “${state.originalQuery}” to “${state.query}”. `:"";
                const engineStatusV20_3=state.v20Active
                  ? ` V20 controlled search active${state.v20Meta?.type?` (${state.v20Meta.type})`:""}.`
                  : (state.hybridMeta
                      ? (state.hybridMeta.fallbackUsed
                          ? " Wider live/catalogue sources were added."
                          : " Legacy fallback search active.")
                      : "");
                status.textContent=`${correction}Showing ${fmt.format(visible.length)} of ${fmt.format(renderRows.length)} ${selectedSeller&&renderRows!==rows?"seller matches":noun}. ${fmt.format(scan)} candidates checked. ${progress}${engineStatusV20_3}`;'''
          if old in s:
              s=s.replace(old,new,1)
          elif "engineStatusV20_3" not in s:
              raise SystemExit("Finder status block not found.")

          # ------------------------------------------------------------
          # F) Preserve trusted V20 marker in saved/compare snapshots so
          #    product details can be recovered from local storage.
          # ------------------------------------------------------------
          snapshot_old='"rareScore","raritySignals","generatedAt"]'
          snapshot_new='"rareScore","raritySignals","generatedAt","_tpV20_3","_tpV20Role","_tpV20Type","_tpV20Channel"]'
          if snapshot_old in s:
              s=s.replace(snapshot_old,snapshot_new,1)

          # Trust a persisted V20 row only through the current 13-seller policy.
          cj_start=s.find("  function tpCjPublicAllowed(p) {")
          if cj_start<0:
              raise SystemExit("tpCjPublicAllowed function not found.")
          cj_line='    if (p && p._tpV20_3 === true) return tpPublicSellerAllowed(p);\n'
          body_pos=s.find("\n",cj_start)+1
          if cj_line.strip() not in s[cj_start:cj_start+500]:
              s=s[:body_pos]+cj_line+s[body_pos:]

          site.write_text(s,encoding="utf-8")

          # Finder cache bust.
          h=finder.read_text(encoding="utf-8")
          h2,n=re.subn(
              r'/js/site-v13-5\.js\?v=[^"\']+',
              '/js/site-v13-5.js?v=20.3.0',
              h,
              count=1
          )
          if n!=1:
              raise SystemExit(f"Finder JS tag not found uniquely: matches={n}")
          finder.write_text(h2,encoding="utf-8")

          print("V20.3 controlled visitor cutover installed.")
          PY

      - name: Write V20.3 architecture note
        shell: bash
        run: |
          set -euo pipefail
          cat > V20-3-CONTROLLED-CUTOVER.md <<'MD'
          # TrendPilot V20.3 — Controlled Visitor Cutover

          ## Search order

          1. `/find/` calls the verified persistent V20.2 projection first.
          2. If V20 recognizes the product type and returns at least one `main` row,
             V20 owns the visitor result set.
          3. V20 `main` rows go to **Exact matches**.
          4. Same-type alternatives plus related/accessory/part rows remain in the
             separate **Related alternatives** channel.
          5. V16/V17 catalogue/live search runs only when V20 does not support the
             query, is unavailable, or has no main result for the requested seller.
          6. After V20 succeeds, legacy “Show more catalogue pages” cannot mix old
             rows into the verified V20 result set.

          ## Seller policy

          Public product comparison contains exactly 13 approved sellers.

          Permanently blocked from public product search in this stage:
          - Temu
          - Joom
          - FilamentPRO EU CPS

          ## Safety

          - V20.2 persistent projection remains unchanged.
          - `/api/products-v20-shadow` remains the V20 data endpoint.
          - The previous V16/V17 path is retained as an automatic fallback.
          - Seller selection reruns the same controlled search using the selected
            seller, preventing the old “seller resets to All sellers” behavior.
          - No GEO/serviceable-area filter is introduced.
          MD

      - name: Validate V20.3 source contract
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js
          node --check netlify/functions/product-seller-policy-v17.mjs
          node --check netlify/functions/products-v20-shadow.mjs
          node --check netlify/functions/products-v20-shadow-lib.mjs
          git diff --check

          grep -q 'TP_V20_3_CONTROLLED_START' js/site-v13-5.js
          grep -q 'TP_V20_3_CONTROLLED_PERFORM' js/site-v13-5.js
          grep -q 'TP_V20_3_SELLER_STABLE' js/site-v13-5.js
          grep -q '/api/products-v20-shadow' js/site-v13-5.js
          grep -q 'v20Active' js/site-v13-5.js
          grep -q '/js/site-v13-5.js?v=20.3.0' find/index.html

          python3 - <<'PY'
          import json,re
          from pathlib import Path

          allowed=[
              "AliExpress","Alibaba","Geekbuying","Govee Many GEOs",
              "Harfington Many GEOs","Sunsky-online WW","Lenovo","Diecast",
              "FragranceShop.com","Karaca EU","MFI Medical","PandaHall",
              "TikTok Shop US"
          ]
          blocked={"Temu","Joom","FilamentPRO EU CPS","FilamentPRO"}

          reg=json.loads(Path("data/product-seller-registry-v17.json").read_text())
          public=[x["name"] for x in reg["sellers"] if x.get("public") is True]
          assert public==allowed, (public,allowed)
          assert not blocked.intersection(public)

          manifest=json.loads(Path("data/search-v20/manifest.json").read_text())
          projected=[x["name"] for x in manifest["publicSellers"]]
          assert set(projected)==set(allowed), (projected,allowed)

          js=Path("js/site-v13-5.js").read_text()
          for var in ("TP_PUBLIC_PRODUCT_SELLERS_V17_2","TP_PRODUCT_SELLERS_V15_1"):
              m=re.search(rf'{var}\s*=\s*(?:new Set\()?(\[[^\n]+\])',js)
              assert m, var
              arr=json.loads(m.group(1))
              assert arr==allowed, (var,arr)

          assert "TP_V20_3_CONTROLLED_START" in js
          assert "engineStatusV20_3" in js
          assert "if(state.v20Active)return true;" in js
          print("V20.3 source contract PASS.")
          PY

      - name: Commit V20.3 controlled cutover
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/product-seller-registry-v17.json \
            netlify/functions/product-seller-policy-v17.mjs \
            js/site-v13-5.js \
            find/index.html \
            V20-3-CONTROLLED-CUTOVER.md

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "V20.3 controlled cutover is already installed."
          else
            git commit -m "V20.3 connect verified product projection to visitor finder"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Netlify V20.3 deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          READY=0
          LAST=""
          for i in $(seq 1 72); do
            PAGE_CODE=$(curl -sS -o "$RUNNER_TEMP/find.html" -w '%{http_code}' --connect-timeout 10 --max-time 20 \
              "https://trendpilotchoice.com/find/?q=phone&v=203" || true)
            JS_CODE=$(curl -sS -o "$RUNNER_TEMP/site.js" -w '%{http_code}' --connect-timeout 10 --max-time 20 \
              "https://trendpilotchoice.com/js/site-v13-5.js?v=20.3.0" || true)
            API_CODE=$(curl -sS -o "$RUNNER_TEMP/v20-meta.json" -w '%{http_code}' --connect-timeout 10 --max-time 20 \
              "https://trendpilotchoice.com/api/products-v20-shadow?meta=1&v=203" || true)

            LAST="page=$PAGE_CODE js=$JS_CODE api=$API_CODE"

            if [ "$PAGE_CODE" = "200" ] && [ "$JS_CODE" = "200" ] && [ "$API_CODE" = "200" ]; then
              if grep -q '/js/site-v13-5.js?v=20.3.0' "$RUNNER_TEMP/find.html" \
                && grep -q 'TP_V20_3_CONTROLLED_START' "$RUNNER_TEMP/site.js" \
                && grep -q '/api/products-v20-shadow' "$RUNNER_TEMP/site.js" \
                && python3 - "$RUNNER_TEMP/v20-meta.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          raise SystemExit(0 if x.get("ready") is True and x.get("version")=="20.2.0" else 1)
          PY
              then
                READY=1
                break
              fi
            fi

            sleep 10
          done

          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

          if [ "$READY" != "1" ]; then
            echo "Netlify did not expose the V20.3 visitor bridge within the wait window."
            echo "Last status: $LAST"
            exit 1
          fi

          echo "Netlify V20.3 visitor bridge is live."

      - name: Run live V20.3 safety probes
        id: live
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          import urllib.parse
          from pathlib import Path

          base="https://trendpilotchoice.com/api/products-v20-shadow"
          probes=[
              "phone","iPhone 16","Galaxy S25","laptop","ThinkPad","smartwatch",
              "headphones","perfume","dog food","power bank","air conditioner",
              "3d filament","lighting","tools"
          ]
          blocked={"temu","joom","filamentpro","filamentpro eu cps"}
          rows=[]

          for q in probes:
              url=base+"?"+urllib.parse.urlencode({"q":q,"limit":"24","related":"1","cutover":"20.3-live"})
              raw=subprocess.check_output(
                  ["curl","-sS","--connect-timeout","10","--max-time","25",url],
                  text=True
              )
              data=json.loads(raw)
              assert data.get("ready") is True, (q,data)
              assert data.get("version")=="20.2.0", (q,data.get("version"))

              for p in data.get("main",[]):
                  assert p.get("role")=="main", (q,p)
                  assert p.get("type")==data.get("type"), (q,p.get("type"),data.get("type"))
                  assert str(p.get("seller","")).strip().lower() not in blocked, (q,p.get("seller"))

              for p in [*data.get("alternatives",[]),*data.get("related",[])]:
                  assert str(p.get("seller","")).strip().lower() not in blocked, (q,p.get("seller"))

              rows.append({
                  "query":q,
                  "mode":data.get("mode"),
                  "type":data.get("type"),
                  "main":len(data.get("main",[])),
                  "alternatives":len(data.get("alternatives",[])),
                  "related":len(data.get("related",[])),
                  "sellers":data.get("sellers",[])
              })

          # Explicit blocked-seller probe.
          for seller in ["FilamentPRO EU CPS","Temu","Joom"]:
              url=base+"?"+urllib.parse.urlencode({"q":"phone","seller":seller,"limit":"12"})
              raw=subprocess.check_output(
                  ["curl","-sS","--connect-timeout","10","--max-time","25",url],
                  text=True
              )
              data=json.loads(raw)
              assert len(data.get("main",[]))==0, (seller,data.get("main",[])[:2])

          Path("/tmp/v20-3-live.json").write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY

      - name: Publish V20.3 summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# TrendPilot V20.3 — Controlled Visitor Cutover"
            echo
            echo "## Deployment"
            echo "- Visitor finder V20 bridge ready: **${{ steps.deploy.outputs.ready || 'not-checked' }}**"
            echo "- V20 data endpoint: \`/api/products-v20-shadow\`"
            echo "- Visitor script: \`/js/site-v13-5.js?v=20.3.0\`"
            echo "- Previous V16/V17 search: **retained as automatic fallback**"
            echo
            echo "## Seller safety"
            echo "- Public product sellers: **13**"
            echo "- Temu: **BLOCKED**"
            echo "- Joom: **BLOCKED**"
            echo "- FilamentPRO EU CPS: **BLOCKED**"
            echo
            echo "## Cutover rule"
            echo "- Supported query + V20 main result → **V20 owns visitor results**"
            echo "- Unsupported/unavailable/no-main query → **legacy fallback**"
            echo "- V20 success → **no legacy Show More mixing**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/v20-3-live.json ]; then
            {
              echo
              echo "## Live V20 probes"
              echo '```json'
              cat /tmp/v20-3-live.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare V20.3 audit artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v20-3-audit"
          cp -f V20-3-CONTROLLED-CUTOVER.md "$RUNNER_TEMP/v20-3-audit/" 2>/dev/null || true
          cp -f data/search-v20/manifest.json "$RUNNER_TEMP/v20-3-audit/v20-2-manifest.json" 2>/dev/null || true
          cp -f data/product-seller-registry-v17.json "$RUNNER_TEMP/v20-3-audit/" 2>/dev/null || true
          cp -f /tmp/v20-3-live.json "$RUNNER_TEMP/v20-3-audit/live-probes.json" 2>/dev/null || true

      - name: Upload V20.3 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendpilot-v20-3-controlled-visitor-cutover-audit
          path: ${{ runner.temp }}/v20-3-audit
          retention-days: 14
          if-no-files-found: warn
