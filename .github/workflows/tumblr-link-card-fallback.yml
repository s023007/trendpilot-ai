name: Tumblr Visual Link Card Fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tumblr-link-card-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
      TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
      TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
      TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Tumblr client
        run: npm install --no-save tumblr.js@5.0.1
      - name: Queue link card using Tumblr OpenGraph fetch
        shell: bash
        run: |
          set +e
          mkdir -p data/runtime
          node <<'NODE'
          const fs = require('fs');
          const tumblr = require('tumblr.js');
          const marker = 'trendpilot-carplay-linkcard-v2';
          const destination = 'https://trendpilotchoice.com/products/wireless-carplay-adapters/?utm_source=tumblr&utm_medium=organic&utm_campaign=wireless-carplay-search-first&utm_content=link-card-v2';
          const out = { started_at:new Date().toISOString(), auth_ok:false, blog:null, created:null, queue_verified:false, queue:null, error:null };
          const save=()=>fs.writeFileSync('data/runtime/tumblr-link-card-result.json',JSON.stringify(out,null,2)+'\n');
          const required=['TUMBLR_CONSUMER_KEY','TUMBLR_CONSUMER_SECRET','TUMBLR_OAUTH_TOKEN','TUMBLR_OAUTH_TOKEN_SECRET'];
          const missing=required.filter(k=>!process.env[k]);
          if(missing.length){out.error='Missing secrets: '+missing.join(', ');save();process.exit(0);}
          const client=tumblr.createClient({consumer_key:process.env.TUMBLR_CONSUMER_KEY,consumer_secret:process.env.TUMBLR_CONSUMER_SECRET,token:process.env.TUMBLR_OAUTH_TOKEN,token_secret:process.env.TUMBLR_OAUTH_TOKEN_SECRET});
          (async()=>{
            try{
              const info=await client.userInfo(); out.auth_ok=true;
              const blogs=info?.user?.blogs||[];
              const preferred=blogs.find(b=>String(b.name||'').toLowerCase()==='trendpilotchoice')||blogs.find(b=>String(b.url||'').toLowerCase().includes('trendpilotchoice'))||blogs.find(b=>b.primary)||blogs[0];
              if(!preferred) throw new Error('No Tumblr blog resolved');
              const blogName=preferred.name||preferred.url; out.blog=blogName;
              const before=await client.blogQueue(blogName,{limit:50,offset:0});
              for(const p of (before?.posts||[])){
                if(Array.isArray(p.tags)&&(p.tags.includes(marker)||p.tags.includes('trendpilot-carplay-linkcard-v1')||p.tags.includes('trendpilot-carplay-ai-01'))){
                  await client.deletePost(blogName,String(p.id));
                }
              }
              const response=await client.createPost(blogName,{
                state:'queue',
                tags:[marker,'wireless carplay','car accessories','car gadgets','apple carplay','buying guide','smart shopping','TrendPilot'],
                content:[
                  {type:'text',subtype:'heading1',text:'Will a Wireless CarPlay Adapter Work in Your Car?'},
                  {type:'text',text:'Before buying, confirm that wired CarPlay already works, the USB port carries data, firmware updates are available, and the seller has a clear return route.'},
                  {type:'link',url:destination},
                  {type:'text',text:'TrendPilot — Smarter buying. Fewer surprises.'}
                ]
              });
              const id=String(response?.id||response?.response?.id||'');
              out.created={ok:!!id,id:id||null,response_keys:Object.keys(response||{})};
              const after=await client.blogQueue(blogName,{limit:50,offset:0});
              out.queue=(after?.posts||[]).map(p=>({id:String(p.id),summary:p.summary||'',tags:p.tags||[]}));
              out.queue_verified=out.queue.some(p=>p.id===id || (p.tags||[]).includes(marker));
            }catch(e){out.error=String(e?.stack||e);}finally{save();}
          })();
          NODE
      - name: Commit result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/tumblr-link-card-result.json
          git commit -m "chore: record Tumblr link-card result" || exit 0
          git pull --rebase origin main || true
          git push || true
