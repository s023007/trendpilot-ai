name: Install TrendPilot V13.8.8 CJ Exact 7 Guard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update trends and affiliate products
      - Install TrendPilot V13.8.6 CJ Seller Bridge
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: trendpilot-cj-exact-seven-guard
  cancel-in-progress: false

jobs:
  install-cj-exact-seven-guard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact CJ advertiser guard
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/install_cj_exact_guard.py
          python /tmp/install_cj_exact_guard.py

      - name: Validate exact seven configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          approved = json.loads(
              Path("data/cj-approved-advertisers.json").read_text(encoding="utf-8")
          )
          report = json.loads(
              Path("data/cj-exact-seven-guard-report.json").read_text(encoding="utf-8")
          )
          script = Path("js/site-v13-5.js").read_text(encoding="utf-8")

          expected = {
              "2357926": "Diecast",
              "7287203": "FragranceShop.com",
              "5893489": "Karaca EU",
              "7227612": "MFI Medical",
              "4837117": "NordVPN",
              "4295086": "PandaHall",
              "4368684": "Trip.com (Global)",
          }
          actual = {
              str(item["cid"]): item["name"]
              for item in approved.get("advertisers", [])
          }

          assert actual == expected, (actual, expected)
          assert report.get("status") == "exact-seven-installed", report
          assert "TP_CJ_EXACT_GUARD_START" in script
          assert "const rows=state.products.filter(tpCjPublicAllowed);" in script
          assert "filter(tpCjPublicAllowed)" in script
          assert "TP_CJ_BROWSER_CACHE_CLEANUP" in script

          print("Exact CJ allowlist validated:")
          for cid, name in expected.items():
              print(f"- {cid}: {name}")
          PY

      - name: Commit exact CJ advertiser guard
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             data/cj-approved-advertisers.json             data/cj-exact-seven-guard-report.json             data/search-catalog/manifest.json             js/site-v13-5.js             js/site-v13-4.js             '*.html'             find/*.html product/*.html products/*.html deals/*.html compare/*.html             price-watch/*.html rare-used/*.html software/*.html             2>/dev/null || true

          if git diff --cached --quiet; then
            echo "The exact CJ guard is already installed."
            exit 0
          fi

          git commit -m "fix: restrict CJ to seven confirmed active advertisers"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 4))
          done

          echo "Unable to push after three attempts."
          exit 1
