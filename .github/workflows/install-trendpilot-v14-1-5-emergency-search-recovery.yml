name: Install TrendPilot V14.1.5 Emergency Search Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v14-1-5-search-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Record starting revision
        id: start
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused search recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          VERSION = "14.1.5"
          root = Path(".")
          site_path = root / "js" / "site-v13-5.js"
          find_path = root / "find" / "index.html"

          if not site_path.exists() or not find_path.exists():
              raise SystemExit("Required search files are missing.")

          site = site_path.read_text(encoding="utf-8")

          site, n1 = re.subn(
              r'const TP_CJ_APPROVED_IDS = new Set\(\[([^\]]*)\]\);',
              lambda m: (
                  'const TP_CJ_APPROVED_IDS = new Set(['
                  + ",".join(dict.fromkeys(
                      [x.strip() for x in m.group(1).split(",") if x.strip()]
                      + ['"6293473"']
                  ))
                  + ']);'
              ),
              site,
              count=1,
          )
          if n1 != 1:
              raise SystemExit("Could not locate TP_CJ_APPROVED_IDS.")

          site, n2 = re.subn(
              r'const TP_CJ_APPROVED_NAMES = new Set\(\[([^\]]*)\]\);',
              lambda m: (
                  'const TP_CJ_APPROVED_NAMES = new Set(['
                  + ",".join(dict.fromkeys(
                      [x.strip() for x in m.group(1).split(",") if x.strip()]
                      + ['"temu"','"temucom"','"shoptemu"']
                  ))
                  + ']);'
              ),
              site,
              count=1,
          )
          if n2 != 1:
              raise SystemExit("Could not locate TP_CJ_APPROVED_NAMES.")

          site = re.sub(
              r'/data/cj-products\.json\?v=[^`"\']+',
              '/data/cj-products.json?v=14.1.5-${Date.now()}',
              site,
              count=1,
          )

          site_path.write_text(site, encoding="utf-8")

          approved = {
              "version": VERSION,
              "approvedProductSellers": [
                  "AliExpress",
                  "Alibaba",
                  "Geekbuying",
                  "Lenovo",
                  "Diecast",
                  "FragranceShop.com",
                  "Karaca EU",
                  "MFI Medical",
                  "PandaHall",
                  "Temu"
              ],
              "notes": [
                  "Product seller dropdown is restricted to joined/approved product programs.",
                  "Software and ticket providers belong on their own comparison pages.",
                  "Joom is not included until approval is confirmed."
              ]
          }
          (root / "data" / "approved-product-sellers-v14-1-5.json").write_text(
              json.dumps(approved, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          seller_js = r'''(() => {
            "use strict";
            const d=document;
            const clean=v=>String(v??"").replace(/\s+/g," ").trim();
            const low=v=>clean(v).toLowerCase();
            const aliases={
              "aliexpress":["aliexpress","ali express"],
              "alibaba":["alibaba","alibaba.com"],
              "geekbuying":["geekbuying"],
              "lenovo":["lenovo","lenovo many geos"],
              "diecast":["diecast","diecast.com"],
              "fragranceshop.com":["fragranceshop.com","fragrance shop","the fragrance shop"],
              "karaca eu":["karaca eu","karaca europe","karaca"],
              "mfi medical":["mfi medical","mfimedical","mfi"],
              "pandahall":["pandahall","panda hall"],
              "temu":["temu","temu.com","shop temu"]
            };
            let allowed=[];
            let applying=false;

            function isSeller(s){
              if(!(s instanceof HTMLSelectElement)) return false;
              const key=low(`${s.id} ${s.name} ${s.getAttribute("aria-label")||""}`);
              const labels=[...s.options].map(o=>low(o.textContent));
              return /seller|merchant|store/.test(key)||labels.includes("all sellers");
            }

            function canon(v){
              const l=low(v);
              for(const name of allowed){
                const n=low(name);
                if((aliases[n]||[n]).some(a=>l===low(a))) return name;
              }
              return "";
            }

            function desiredSignature(){
              return ["All sellers",...allowed].join("|");
            }

            function currentSignature(s){
              return [...s.options].map(o=>clean(o.textContent)).join("|");
            }

            function fix(s){
              if(!isSeller(s)||!allowed.length) return;
              if(currentSignature(s)===desiredSignature()) return;

              const selected=canon(s.options[s.selectedIndex]?.textContent||s.value);
              const oldValues=new Map();
              for(const o of [...s.options]){
                const c=canon(o.textContent||o.value);
                if(c&&!oldValues.has(c)) oldValues.set(c,o.value);
              }

              applying=true;
              try{
                s.innerHTML="";
                s.add(new Option("All sellers",""));
                for(const name of allowed) s.add(new Option(name,oldValues.get(name)||name));
                if(selected){
                  const opt=[...s.options].find(o=>canon(o.textContent)===selected);
                  if(opt) s.value=opt.value;
                }
                s.dataset.tpApprovedSellers="14.1.5";
              } finally {
                applying=false;
              }
            }

            function apply(){
              if(applying) return;
              d.querySelectorAll("select").forEach(fix);
            }

            async function init(){
              try{
                const r=await fetch(`/data/approved-product-sellers-v14-1-5.json?v=${Date.now()}`,{cache:"no-store"});
                const j=r.ok?await r.json():{};
                allowed=Array.isArray(j.approvedProductSellers)?j.approvedProductSellers:[];
              }catch{
                allowed=["AliExpress","Alibaba","Geekbuying","Lenovo","Diecast","FragranceShop.com","Karaca EU","MFI Medical","PandaHall","Temu"];
              }
              apply();
              new MutationObserver(mutations=>{
                if(applying) return;
                let relevant=false;
                for(const m of mutations){
                  if(m.addedNodes && m.addedNodes.length){ relevant=true; break; }
                }
                if(relevant) requestAnimationFrame(apply);
              }).observe(d.body||d.documentElement,{childList:true,subtree:true});

              setTimeout(apply,500);
              setTimeout(apply,1500);
            }

            if(d.readyState==="loading") d.addEventListener("DOMContentLoaded",init,{once:true});
            else init();
          })();'''

          (root / "js" / "seller-whitelist-v14-1-5.js").write_text(
              seller_js.strip() + "\n", encoding="utf-8"
          )

          suggestions_js = r'''(() => {
            "use strict";
            const d=document;
            const clean=v=>String(v??"").replace(/\s+/g," ").trim();
            const low=v=>clean(v).toLowerCase();
            const esc=v=>clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
            const FALLBACK=[
              "backpack","baby stroller","beauty products","bluetooth speaker",
              "camera","car accessories","charger","computer accessories","cookware",
              "dress","earbuds","fitness equipment","fragrance","gaming accessories",
              "headphones","home decor","jewelry","keyboard","kitchen appliances",
              "laptop","makeup","medical equipment","monitor","office supplies",
              "perfume","pet supplies","phone","phone cases","power banks",
              "printer","projector","school supplies","shoes","smart watch",
              "smartphone","sports equipment","tablet","tools","toys","t-shirts",
              "vacuum","wireless carplay adapter"
            ];

            let indexPromise=null;
            let activeInput=null;
            let panel=null;
            let seq=0;

            async function index(){
              if(indexPromise) return indexPromise;
              indexPromise=fetch(`/data/search-suggestions-v14-1.json?v=14.1.5-${Date.now()}`,{cache:"no-store"})
                .then(r=>r.ok?r.json():{})
                .catch(()=>({}));
              return indexPromise;
            }

            function host(input){
              const h=input.closest(".tp-search-input,.tp-wholesale-search,form,label")||input.parentElement;
              h?.classList.add("tp-amazon-search-host");
              return h;
            }

            function ensure(input){
              const h=host(input);
              let p=h?.querySelector(":scope > .tp-amazon-suggest");
              if(!p){
                p=d.createElement("div");
                p.className="tp-amazon-suggest";
                p.hidden=true;
                p.innerHTML='<div class="tp-amazon-list" role="listbox"></div>';
                h?.appendChild(p);
              }
              return p;
            }

            function fallbackRows(q){
              const l=low(q);
              return FALLBACK.filter(v=>low(v).startsWith(l)||low(v).includes(l))
                .slice(0,8)
                .map(v=>({value:v,meta:"Popular search",image:"",score:20}));
            }

            function rank(rows,q){
              const l=low(q);
              const parts=l.split(/\s+/).filter(Boolean);
              return rows
                .filter(x=>{
                  const v=low(x.value);
                  return v.startsWith(l)||parts.every(p=>v.includes(p));
                })
                .sort((a,b)=>{
                  const av=low(a.value),bv=low(b.value);
                  const ap=av.startsWith(l)?0:1,bp=bv.startsWith(l)?0:1;
                  return ap-bp+(Number(b.score||0)-Number(a.score||0))+a.value.length-b.value.length;
                });
            }

            async function rows(input){
              const q=low(input.value);
              if(!q) return [];
              const data=await index();
              let pool=[];
              if(data.byLetter){
                pool=[...(data.byLetter[q[0]]||[])];
              }
              if(Array.isArray(data.top)) pool.push(...data.top);

              const seen=new Set();
              const out=[];
              for(const x of rank(pool,q)){
                const k=low(x.value);
                if(!k||seen.has(k)) continue;
                seen.add(k);
                out.push(x);
                if(out.length>=8) break;
              }
              for(const x of fallbackRows(q)){
                const k=low(x.value);
                if(!seen.has(k)){
                  seen.add(k);
                  out.push(x);
                  if(out.length>=8) break;
                }
              }
              return out;
            }

            function icon(row){
              return row.image
                ? `<span class="tp-amazon-thumb"><img src="${esc(row.image)}" alt="" loading="lazy"></span>`
                : '<span class="tp-amazon-search-icon" aria-hidden="true">⌕</span>';
            }

            function close(){
              seq++;
              if(panel) panel.hidden=true;
              panel=null;
              activeInput=null;
            }

            function submit(input,value){
              input.value=value;
              input.dispatchEvent(new Event("input",{bubbles:true}));
              close();
              if(input.form?.requestSubmit) input.form.requestSubmit();
              else location.href=`/find/?q=${encodeURIComponent(value)}`;
            }

            async function render(input){
              const token=++seq;
              const q=clean(input.value);
              if(!q){close();return;}
              const data=await rows(input);
              if(token!==seq) return;

              activeInput=input;
              panel=ensure(input);
              const list=panel.querySelector(".tp-amazon-list");
              list.innerHTML=data.map((row,i)=>`
                <button type="button" class="tp-amazon-row" role="option" data-i="${i}">
                  ${icon(row)}
                  <span class="tp-amazon-copy">
                    <b>${esc(row.value)}</b>
                    ${row.meta?`<small>${esc(row.meta)}</small>`:""}
                  </span>
                </button>`).join("");
              panel._rows=data;
              panel.hidden=data.length===0;
            }

            const selector='input[data-tp-finder-input],.tp-search-input input[type="search"]';

            d.addEventListener("input",e=>{
              if(e.target.matches(selector)) render(e.target);
            });

            d.addEventListener("focusin",e=>{
              if(e.target.matches(selector)&&clean(e.target.value)) render(e.target);
            });

            let gesture=null;
            d.addEventListener("pointerdown",e=>{
              const row=e.target.closest(".tp-amazon-row");
              if(row&&activeInput&&panel){
                gesture={row,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};
                return;
              }
              if(panel&&!e.target.closest(".tp-amazon-suggest")&&e.target!==activeInput) close();
            },{passive:true});

            d.addEventListener("pointermove",e=>{
              if(!gesture||gesture.id!==e.pointerId) return;
              if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>8) gesture.moved=true;
            },{passive:true});

            d.addEventListener("pointerup",e=>{
              if(!gesture||gesture.id!==e.pointerId) return;
              const g=gesture; gesture=null;
              if(g.moved) return;
              const row=e.target.closest(".tp-amazon-row");
              if(!row||row!==g.row||!activeInput||!panel) return;
              const item=(panel._rows||[])[Number(row.dataset.i)];
              if(item) submit(activeInput,item.value);
            });

            d.addEventListener("pointercancel",()=>{gesture=null;});
            d.addEventListener("keydown",e=>{if(e.key==="Escape") close();});
          })();'''

          (root / "js" / "smart-suggestions-v14-1-5.js").write_text(
              suggestions_js.strip() + "\n", encoding="utf-8"
          )

          page = find_path.read_text(encoding="utf-8")

          page = re.sub(
              r'\s*<script[^>]+src="/js/smart-search-v14\.js[^"]*"[^>]*></script>\s*',
              "\n",
              page,
          )
          page = re.sub(
              r'\s*<script[^>]+src="/js/smart-suggestions-v14(?:-1-5)?\.js[^"]*"[^>]*></script>\s*',
              "\n",
              page,
          )
          page = re.sub(
              r'\s*<script[^>]+src="/js/seller-whitelist-v14-1-4\.js[^"]*"[^>]*></script>\s*',
              "\n",
              page,
          )

          page = re.sub(
              r'/js/site-v13-5\.js\?v=[^"\']+',
              '/js/site-v13-5.js?v=14.1.5',
              page,
              count=1,
          )

          insert = (
              '<script defer src="/js/smart-suggestions-v14-1-5.js?v=14.1.5"></script>\n'
              '<script defer src="/js/seller-whitelist-v14-1-5.js?v=14.1.5"></script>\n'
          )
          if "</body>" not in page:
              raise SystemExit("Could not find </body> in find/index.html.")
          page = page.replace("</body>", insert + "</body>", 1)
          find_path.write_text(page, encoding="utf-8")

          print("Focused V14.1.5 search recovery applied.")
          PY

      - name: Validate recovery before publish
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js
          node --check js/smart-suggestions-v14-1-5.js
          node --check js/seller-whitelist-v14-1-5.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import json

          def require(ok, msg):
              if not ok:
                  raise SystemExit("Validation failed: " + msg)

          site = Path("js/site-v13-5.js").read_text(encoding="utf-8")
          page = Path("find/index.html").read_text(encoding="utf-8")
          approved = json.loads(Path("data/approved-product-sellers-v14-1-5.json").read_text(encoding="utf-8"))
          suggestions = json.loads(Path("data/search-suggestions-v14-1.json").read_text(encoding="utf-8"))
          cj = json.loads(Path("data/cj-products.json").read_text(encoding="utf-8"))

          require('"6293473"' in site, "Temu CJ advertiser ID is not approved by the core search guard")
          require('"temu"' in site and '"temucom"' in site, "Temu names are missing from the core search guard")

          allowed = approved.get("approvedProductSellers") or []
          require("Temu" in allowed, "Temu is missing from the approved seller list")
          require("Joom" not in allowed, "Joom must remain excluded while approval is pending")

          require("smart-search-v14.js" not in page, "old competing smart-search autocomplete is still loaded")
          require("smart-suggestions-v14.js?v=14.1.4" not in page, "old V14.1.4 suggestions are still loaded")
          require("seller-whitelist-v14-1-4.js" not in page, "old self-triggering seller whitelist is still loaded")
          require(page.count("smart-suggestions-v14-1-5.js") == 1, "recovery suggestions script must be loaded exactly once")
          require(page.count("seller-whitelist-v14-1-5.js") == 1, "recovery seller script must be loaded exactly once")

          by_letter = suggestions.get("byLetter") or {}
          require(isinstance(by_letter.get("p"), list) and len(by_letter["p"]) > 0, "P suggestions are unavailable")
          require(any("phone" in str(x.get("value","")).lower() for x in by_letter.get("p", [])), "phone suggestion is missing from P")

          products = cj.get("products") or []
          temu_phone = [
              p for p in products
              if str(p.get("advertiserId")) == "6293473"
              and "phone" in str(p.get("name","")).lower()
              and str(p.get("url","")).startswith(("http://","https://"))
              and str(p.get("image","")).startswith(("http://","https://"))
          ]
          require(len(temu_phone) > 0, "CJ data contains no usable Temu phone products")

          require("async function performSearch(" in site, "performSearch is missing")
          require("Promise.allSettled([" in site and "loadCjProducts()" in site, "CJ products are not bridged into product search")
          require("mergeProducts([...rows,...cjRows])" in site, "CJ rows are not merged into search results")

          print(f"Validated Temu phone products: {len(temu_phone)}")
          print("V14.1.5 recovery validation passed.")
          PY

      - name: Publish only if main has not changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             js/site-v13-5.js             js/smart-suggestions-v14-1-5.js             js/seller-whitelist-v14-1-5.js             data/approved-product-sellers-v14-1-5.json             find/index.html

          if git diff --cached --quiet; then
            echo "No changes are required."
            exit 0
          fi

          git fetch origin main
          current_remote="$(git rev-parse origin/main)"
          starting="${{ steps.start.outputs.sha }}"

          if [[ "$current_remote" != "$starting" ]]; then
            echo "main changed while this workflow was validating."
            echo "Nothing was pushed. Run this workflow again from the newest main."
            exit 1
          fi

          git commit -m "fix: restore product search suggestions and Temu visibility"
          git push origin HEAD:main

          echo "TrendPilot V14.1.5 Emergency Search Recovery published successfully."
