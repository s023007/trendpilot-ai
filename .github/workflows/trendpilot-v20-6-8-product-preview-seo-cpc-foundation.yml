      - name: Wire Netlify product routes safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('netlify.toml')
          s=p.read_text(encoding='utf-8')
          a='# TP_PRODUCT_PREVIEW_V20_6_8_START'
          b='# TP_PRODUCT_PREVIEW_V20_6_8_END'
          if a in s and b in s:
              s=s.split(a,1)[0].rstrip()+'\n'+s.split(b,1)[1].lstrip('\n')

          # Merge included_files into an existing [functions] table instead of creating a duplicate TOML table.
          glob='netlify/functions/_product-data/*.json'
          m=re.search(r'(?m)^\[functions\][ \t]*$',s)
          if m:
              sec_start=m.end()
              next_sec=re.search(r'(?m)^\[[^\n]+\][ \t]*$',s[sec_start:])
              sec_end=sec_start+(next_sec.start() if next_sec else len(s)-sec_start)
              section=s[sec_start:sec_end]
              im=re.search(r'(?m)^[ \t]*included_files[ \t]*=[ \t]*\[(.*?)\][ \t]*$',section)
              if im:
                  existing=im.group(1).strip()
                  if glob not in existing:
                      replacement='  included_files = ['+(existing+', ' if existing else '')+'"'+glob+'"]'
                      section=section[:im.start()]+replacement+section[im.end():]
              else:
                  section='\n  included_files = ["'+glob+'"]'+section
              s=s[:sec_start]+section+s[sec_end:]
          else:
              s=s.rstrip()+'\n\n[functions]\n  included_files = ["'+glob+'"]\n'

          block='''
          # TP_PRODUCT_PREVIEW_V20_6_8_START
          [[redirects]]
            from = "/product"
            to = "/find/"
            status = 301

          [[redirects]]
            from = "/product/*"
            to = "/.netlify/functions/trendpilot-product?slug=:splat"
            status = 200
            force = true

          # Never expose function source paths through the publish root.
          [[redirects]]
            from = "/netlify/functions/*"
            to = "/404.html"
            status = 404
            force = true
          # TP_PRODUCT_PREVIEW_V20_6_8_END
          '''
          s=s.rstrip()+'\n\n'+block.strip()+'\n'
          p.write_text(s,encoding='utf-8')
          PY

      - name: Deep QA — package, SSR page, variants, sellers, CPC preservation and SEO
        shell: bash
        run: |
          set -euo pipefail
          node --check netlify/functions/trendpilot-product.mjs
          node --check netlify/functions/trendpilot-outbound.mjs
          node --check netlify/functions/trendpilot-event.mjs
          node --check js/product-preview-bridge-v20-6-8.js
          node --check js/product-preview-events-v20-6-8.js

          cat > /tmp/tp-v20-6-8-qa.mjs <<'NODE'
          import fs from 'node:fs';
          const { handler: productHandler } = await import('file://' + process.cwd() + '/netlify/functions/trendpilot-product.mjs');
          const { handler: outboundHandler } = await import('file://' + process.cwd() + '/netlify/functions/trendpilot-outbound.mjs');
          const manifest=JSON.parse(fs.readFileSync('data/product-preview-v20-6/manifest.json','utf8'));
          const products=JSON.parse(fs.readFileSync('netlify/functions/_product-data/products.json','utf8'));
          const offers=JSON.parse(fs.readFileSync('netlify/functions/_product-data/offers.json','utf8'));
          const variants=JSON.parse(fs.readFileSync('netlify/functions/_product-data/variants.json','utf8'));
          const blocked=/^(?:Temu|Joom|FilamentPRO EU CPS)$/i;
          const fails=[];
          const one=products.find(p=>p.tpid==='TPPH-D8C434EDE8F517')||products.find(p=>p.name.toLowerCase()==='oneplus 7t');
          const think=products.find(p=>p.name.toLowerCase()==='thinkpad x1 carbon');
          if(!one)fails.push('OnePlus 7T missing');
          if(one&&one.sellerCount!==2)fails.push(`OnePlus sellerCount ${one.sellerCount}`);
          if(!think)fails.push('ThinkPad X1 Carbon missing');
          if(offers.some(o=>blocked.test(o.seller)))fails.push('blocked seller leaked');
          if(products.some(p=>!p.route||!p.name||!p.tpid))fails.push('invalid product preview row');
          if(manifest.identityRebuilt!==false||manifest.canonicalCatalogModified!==false)fails.push('identity safety flag wrong');
          if(manifest.seoIndexableProducts<1000)fails.push('SEO page pool too small');
          if(!fs.readFileSync('sitemap.xml','utf8').includes('https://trendpilotchoice.com/product/'))fails.push('product sitemap missing');
          if(fs.readFileSync('sitemap.xml','utf8').includes('trendpilot-ai.netlify.app'))fails.push('old Netlify domain still in sitemap');
          if(!fs.readFileSync('robots.txt','utf8').includes('https://trendpilotchoice.com/sitemap.xml'))fails.push('robots sitemap wrong');
          if(!fs.readFileSync('find/index.html','utf8').includes('product-preview-bridge-v20-6-8.js'))fails.push('Finder bridge missing');
          const page=one?await productHandler({path:`/product/${one.route}/`,queryStringParameters:{slug:one.route}}):null;
          if(!page||page.statusCode!==200)fails.push('OnePlus SSR page failed');
          if(page&&(!page.body.includes('OnePlus 7T')||!page.body.includes('Product overview')||!page.body.includes('Seller offers')||!page.body.includes('application/ld+json')))fails.push('OnePlus SSR content incomplete');
          if(page&&!(page.body.match(/Alibaba/g)||[]).length)fails.push('Alibaba missing from OnePlus preview');
          if(page&&!(page.body.match(/TikTok Shop US/g)||[]).length)fails.push('TikTok missing from OnePlus preview');
          if(page&&!page.body.includes('Variants'))fails.push('variants UI missing');
          const oneOffers=one?offers.filter(o=>o.tpid===one.tpid):[];
          const target=oneOffers[0];
          if(target){
            const redir=await outboundHandler({queryStringParameters:{offer:target.tpoid,src:'qa'}});
            if(redir.statusCode!==302||redir.headers.location!==target.url)fails.push('outbound redirect does not preserve exact source URL');
          } else fails.push('OnePlus outbound offer missing');
          const cpcCapable=offers.filter(o=>o.cpcCapable);
          if(!cpcCapable.length)fails.push('no CPC-capable offers detected');
          console.log(JSON.stringify({manifest,qa:{onePlusSellers:one?.sellers,onePlusOffers:oneOffers.length,onePlusVariants:one?variants.filter(v=>v.tpid===one.tpid).length:0,cpcCapableOffers:cpcCapable.length,cpcConfirmedOffers:offers.filter(o=>o.cpcConfirmed).length,failures:fails}},null,2));
          if(fails.length)process.exit(1);
          NODE
          node /tmp/tp-v20-6-8-qa.mjs | tee /tmp/tp-v20-6-8-qa.log

