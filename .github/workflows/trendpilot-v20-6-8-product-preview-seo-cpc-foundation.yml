name: TrendPilot V20.6.8 — Product Preview + SEO + CPC Foundation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-v20-6-8-product-preview-seo-cpc
  cancel-in-progress: false

jobs:
  product-preview-seo-cpc:
    name: Build product preview, SEO pages and protected outbound tracking
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify TrendPilot foundations
        shell: bash
        run: |
          set -euo pipefail
          test -f netlify.toml
          test -f find/index.html
          test -d data
          test -d js
          echo "HEAD=$(git rev-parse HEAD)"
          echo "V19 canonical seller files: $(find data/catalog-v19/sellers -type f -name 'products.ndjson' 2>/dev/null | wc -l | tr -d ' ')"
          test "$(find data/catalog-v19/sellers -type f -name 'products.ndjson' 2>/dev/null | wc -l | tr -d ' ')" -ge 10

      - name: Build normalized Product Preview package without rebuilding identity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/tp-build-product-preview-v20-6-8.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const ROOT = process.cwd();
          const OUT_PUBLIC = path.join(ROOT, 'data', 'product-preview-v20-6');
          const OUT_PRIVATE = path.join(ROOT, 'netlify', 'functions', '_product-data');
          const SITE = 'https://trendpilotchoice.com';
          const ENGINE = 'v2064';
          const BLOCKED = new Set(['temu', 'joom', 'filamentpro eu cps']);
          // CPC-capable means the user has an approved CPC route/program for the seller.
          // A click is marked cpcConfirmed only when the underlying offer metadata also contains CPC/click-payment evidence.
          const CPC_CAPABLE = new Set(['AliExpress', 'Alibaba', 'Geekbuying']);

          const clean = (v) => String(v ?? '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
          const lower = (v) => clean(v).toLowerCase();
          const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const validUrl = (v) => {
            try { const u = new URL(clean(v)); return /^https?:$/.test(u.protocol); } catch { return false; }
          };
          const slugify = (v) => lower(v)
            .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
            .replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '').slice(0, 78) || 'product';
          const hash = (v, n = 12) => crypto.createHash('sha256').update(String(v)).digest('hex').slice(0, n).toUpperCase();
          const uniq = (a) => [...new Set(a.filter(Boolean))];
          const pick = (o, keys) => {
            if (!o || typeof o !== 'object') return '';
            for (const k of keys) {
              const v = o[k];
              if (v !== undefined && v !== null && String(v).trim() !== '') return v;
            }
            return '';
          };
          const getTPID = (o) => clean(pick(o, ['tpid','TPID','masterProductId','master_product_id','masterId','productIdentity','product_identity']));
          const getTPVID = (o) => clean(pick(o, ['tpvid','TPVID','variantId','variant_id','variantIdentity','variant_identity']));
          const getTPOID = (o) => clean(pick(o, ['tpoid','TPOID','offerId','offer_id','listingId','listing_id','sellerListingId']));
          const getName = (o) => clean(pick(o, ['displayName','canonicalName','canonical_name','productName','product_name','name','title','label']));
          const getBrand = (o) => clean(pick(o, ['canonicalBrand','canonical_brand','displayBrand','brand','manufacturer','maker']));
          const getType = (o) => clean(pick(o, ['productType','product_type','type','categoryType','kind'])).toLowerCase().replace(/[\s-]+/g,'_');
          const getSeller = (o) => clean(pick(o, ['seller','sellerName','seller_name','advertiser','advertiserName','merchant','merchantName','store','storeName']));
          const getImage = (o) => clean(pick(o, ['image','imageUrl','image_url','imageLink','image_link','thumbnail','thumbnailUrl','thumbnail_url','mainImage','main_image']));
          const getUrl = (o) => clean(pick(o, ['affiliateUrl','affiliate_url','trackingUrl','tracking_url','clickUrl','click_url','actionUrl','action_url','buyUrl','buy_url','url','productUrl','product_url','destinationUrl','destination_url','link']));
          const getCurrency = (o) => clean(pick(o, ['currency','priceCurrency','price_currency','currencyCode','currency_code'])) || 'USD';
          const num = (v) => {
            if (typeof v === 'number' && Number.isFinite(v)) return v;
            const m = String(v ?? '').replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);
            return m ? Number(m[0]) : null;
          };
          const getPrice = (o) => {
            if (!o || typeof o !== 'object') return null;
            if (o.priceSuppressed === true || o.price_suppressed === true || o.priceReliable === false || o.price_reliable === false || o.unreliablePrice === true) return null;
            for (const k of ['displayPrice','display_price','currentPrice','current_price','salePrice','sale_price','price','amount','minPrice']) {
              const n = num(o[k]);
              if (n !== null && n >= 0) return n;
            }
            return null;
          };
          const normalizedNameKey = (v) => lower(v).replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
          const sellerBlocked = (seller) => BLOCKED.has(lower(seller));

          function recursiveFiles(dir) {
            const out = [];
            if (!fs.existsSync(dir)) return out;
            for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) {
                if (/node_modules|\.git|product-preview-v20-6|_product-data/i.test(p)) continue;
                out.push(...recursiveFiles(p));
              } else if (/\.(?:json|ndjson)$/i.test(e.name)) out.push(p);
            }
            return out;
          }

          function readAny(file) {
            const st = fs.statSync(file);
            if (st.size > 80 * 1024 * 1024) return null;
            const text = fs.readFileSync(file, 'utf8').trim();
            if (!text) return null;
            if (/\.ndjson$/i.test(file)) {
              const rows=[];
              for (const line of text.split(/\r?\n/)) {
                const t=line.trim(); if (!t) continue;
                try { rows.push(JSON.parse(t)); } catch {}
              }
              return rows;
            }
            try { return JSON.parse(text); } catch { return null; }
          }

          function arraysFrom(value, label='root') {
            const out=[];
            if (Array.isArray(value)) { out.push({label, rows:value}); return out; }
            if (!value || typeof value !== 'object') return out;
            for (const [k,v] of Object.entries(value)) {
              if (Array.isArray(v)) out.push({label:k,rows:v});
              else if (v && typeof v === 'object' && !Array.isArray(v)) {
                for (const [k2,v2] of Object.entries(v)) if (Array.isArray(v2)) out.push({label:`${k}.${k2}`,rows:v2});
              }
            }
            return out;
          }

          function recency(file) {
            try {
              const ts = Number(execFileSync('git',['log','-1','--format=%ct','--',path.relative(ROOT,file)],{encoding:'utf8'}).trim());
              return Number.isFinite(ts) ? ts : 0;
            } catch { return 0; }
          }

          function sampleScore(rows, kind) {
            const sample = rows.slice(0, Math.min(rows.length, 250));
            if (!sample.length) return -Infinity;
            let hit=0, aux=0;
            for (const r of sample) {
              if (!r || typeof r !== 'object') continue;
              const tpid=getTPID(r), tpvid=getTPVID(r), tpoid=getTPOID(r);
              if (kind==='products') {
                if (/^TP[A-Z]{1,5}-/i.test(tpid) && getName(r) && !/^TPO-/i.test(tpoid)) hit++;
                if (getImage(r) || getType(r) || getBrand(r)) aux++;
                if (/^TPO-/i.test(tpoid)) aux-=2;
              } else if (kind==='offers') {
                if (/^TP[A-Z]{1,5}-/i.test(tpid) && (/^TPO-/i.test(tpoid) || getSeller(r)) && getSeller(r) && getUrl(r)) hit++;
                if (getUrl(r) || getPrice(r)!==null || getTPVID(r)) aux++;
              } else if (kind==='variants') {
                if (/^TP[A-Z]{1,5}-/i.test(tpid) && /^TPV-/i.test(tpvid) && !/^TPO-/i.test(tpoid)) hit++;
                if (clean(pick(r,['displayLabel','display_label','variantLabel','variant_label','label'])) || pick(r,['ram','storage','screenSize','screen_size','color','size'])) aux++;
                if (/^TPO-/i.test(tpoid) || getSeller(r) || getUrl(r)) aux-=2;
              }
            }
            return (hit/sample.length)*100 + (aux/sample.length)*20;
          }

          function discover(kind) {
            const files = recursiveFiles(path.join(ROOT,'data'));
            const candidates=[];
            for (const file of files) {
              const base=path.basename(file).toLowerCase();
              const rel=path.relative(ROOT,file).replaceAll('\\','/');
              if (!/(v20|search|comparison|master|identity|offer|variant|product)/i.test(rel)) continue;
              const value=readAny(file); if (value===null) continue;
              for (const a of arraysFrom(value)) {
                const rows=a.rows; if (rows.length<20) continue;
                let score=sampleScore(rows,kind);
                if (!Number.isFinite(score) || score<35) continue;
                if (kind==='products' && rows.length>30000) score-=45;
                if (kind==='offers' && rows.length>30000) score-=30;
                if (kind==='variants' && rows.length>30000) score-=25;
                if (/20[-_.]?6|v20[-_.]?6|comparison/i.test(rel)) score+=22;
                if (/normalized|stable|visitor|presentation|browse|comparison/i.test(rel)) score+=18;
                if (kind==='products' && /product|master|browse/i.test(base+' '+a.label)) score+=12;
                if (kind==='offers' && /offer|seller|listing/i.test(base+' '+a.label)) score+=12;
                if (kind==='variants' && /variant|tpvid/i.test(base+' '+a.label)) score+=12;
                score += Math.min(18, recency(file)/1e8);
                candidates.push({file,rel,label:a.label,rows,score,count:rows.length});
              }
            }
            candidates.sort((a,b)=>b.score-a.score || Math.abs(13000-a.count)-Math.abs(13000-b.count));
            if (!candidates.length) throw new Error(`Unable to discover ${kind} input`);
            return candidates[0];
          }

          const productSrc=discover('products');
          const offerSrc=discover('offers');
          const variantSrc=discover('variants');
          console.log('Product source', productSrc.rel, productSrc.label, productSrc.count, productSrc.score.toFixed(2));
          console.log('Offer source', offerSrc.rel, offerSrc.label, offerSrc.count, offerSrc.score.toFixed(2));
          console.log('Variant source', variantSrc.rel, variantSrc.label, variantSrc.count, variantSrc.score.toFixed(2));

          // Normalize offers first; product seller counts are always recomputed from actual actionable TPOIDs.
          const offers=[];
          for (const r of offerSrc.rows) {
            const tpid=getTPID(r); if (!/^TP[A-Z]{1,5}-/i.test(tpid)) continue;
            const seller=getSeller(r); if (!seller || sellerBlocked(seller)) continue;
            const url=getUrl(r); if (!validUrl(url)) continue;
            const tpoid=getTPOID(r) || `TPO-PREVIEW-${hash(`${tpid}|${seller}|${url}`,16)}`;
            const tpvid=getTPVID(r);
            const image=validUrl(getImage(r)) ? getImage(r) : '';
            const price=getPrice(r);
            const currency=getCurrency(r);
            const metaText=lower([
              pick(r,['monetizationMode','monetization_mode','paymentModel','payment_model','commissionModel','commission_model','payoutType','payout_type','actionType','action_type','affiliateType','affiliate_type']),
              pick(r,['network','networkName','provider','source','sourceName','program','programme','trackingType','tracking_type'])
            ].join(' '));
            const cpcCapable=CPC_CAPABLE.has(seller);
            const cpcConfirmed=Boolean(cpcCapable && /\b(cpc|cost per click|pay per click|paid click|click payout|click commission)\b/i.test(metaText));
            offers.push({
              tpid,tpvid: /^TPV-/i.test(tpvid)?tpvid:'',tpoid,seller,url,image,
              price: price!==null && price>0 ? Number(price.toFixed(2)) : null,
              currency,
              cpcCapable,cpcConfirmed,
              sourceNetwork: clean(pick(r,['network','networkName','provider','source','sourceName'])),
              sourceProgram: clean(pick(r,['program','programme','campaign','campaignName']))
            });
          }
          const offersByTpid=new Map();
          for (const o of offers) { if (!offersByTpid.has(o.tpid)) offersByTpid.set(o.tpid,[]); offersByTpid.get(o.tpid).push(o); }

          // Normalize variant labels while preserving the existing TPVID identity exactly.
          const variantLabelFrom = (r) => {
            const direct=clean(pick(r,['displayLabel','display_label','variantLabel','variant_label','label','name','title']));
            if (direct && !/^TPV-/i.test(direct)) return direct.slice(0,160);
            const bits=[];
            for (const [label,keys] of [
              ['RAM',['ram','memoryRam','memory_ram']], ['Storage',['storage','capacity','storageCapacity','storage_capacity']],
              ['Screen',['screen','screenSize','screen_size','displaySize','display_size']], ['Color',['color','colour']],
              ['Size',['size']], ['Generation',['generation','gen']], ['Capacity',['batteryCapacity','battery_capacity','mah']],
              ['BTU',['btu','coolingCapacity','cooling_capacity']], ['Volume',['volume','ml','oz']]
            ]) {
              const v=clean(pick(r,keys)); if (v) bits.push(`${label}: ${v}`);
            }
            return bits.join(' · ').slice(0,160);
          };
          const variants=[];
          const seenVariant=new Set();
          for (const r of variantSrc.rows) {
            const tpid=getTPID(r), tpvid=getTPVID(r); if (!/^TP[A-Z]{1,5}-/i.test(tpid) || !/^TPV-/i.test(tpvid)) continue;
            const key=`${tpid}|${tpvid}`; if (seenVariant.has(key)) continue; seenVariant.add(key);
            variants.push({tpid,tpvid,label:variantLabelFrom(r)});
          }
          // Add TPVIDs seen only in normalized offers.
          for (const o of offers) {
            if (!o.tpvid) continue; const key=`${o.tpid}|${o.tpvid}`;
            if (!seenVariant.has(key)) { seenVariant.add(key); variants.push({tpid:o.tpid,tpvid:o.tpvid,label:''}); }
          }
          const variantsByTpid=new Map();
          for (const v of variants) { if (!variantsByTpid.has(v.tpid)) variantsByTpid.set(v.tpid,[]); variantsByTpid.get(v.tpid).push(v); }

          // Product normalization: no TPID is created, merged, split, or re-keyed here.
          const productMap=new Map();
          for (const r of productSrc.rows) {
            const tpid=getTPID(r); if (!/^TP[A-Z]{1,5}-/i.test(tpid)) continue;
            const ownOffers=offersByTpid.get(tpid)||[]; if (!ownOffers.length) continue;
            const sellers=uniq(ownOffers.map(o=>o.seller));
            const name=getName(r); if (!name || /^TP[A-Z]{1,5}-/i.test(name)) continue;
            const brand=getBrand(r);
            const type=getType(r) || clean(pick(r,['kind','family'])).toLowerCase().replace(/[\s-]+/g,'_');
            const imageCandidate=getImage(r) || ownOffers.map(o=>o.image).find(validUrl) || '';
            const image=validUrl(imageCandidate)?imageCandidate:'';
            const knownPrices=ownOffers.filter(o=>o.price!==null && o.price>0 && o.currency==='USD').map(o=>o.price);
            const variantRows=variantsByTpid.get(tpid)||[];
            const confidence=clean(pick(r,['confidence','identityConfidence','identity_confidence','status','identityStatus'])).toLowerCase();
            const token=tpid.replace(/[^A-Za-z0-9]/g,'').slice(-14).toLowerCase();
            const route=`${slugify(name)}--${token}`;
            const ugly = name.length>150 || /\b(factory|wholesale|supplier|manufacturer|hot sale|top seller|cheap|bulk|oem|odm|dropship)\b/i.test(name);
            let seoScore=0;
            if (image) seoScore+=25;
            if (sellers.length) seoScore+=25;
            if (type) seoScore+=12;
            if (brand) seoScore+=13;
            if (name.length>=5 && name.length<=110) seoScore+=10;
            if (/verified|candidate|high/.test(confidence)) seoScore+=10;
            if (sellers.length>=2) seoScore+=8;
            if (ugly) seoScore-=25;
            const seoIndexable=seoScore>=62;
            productMap.set(tpid,{
              tpid,route,name,brand,type,image,confidence,
              sellerCount:sellers.length,offerCount:ownOffers.length,variantCount:variantRows.length,
              sellers,
              priceMin:knownPrices.length?Math.min(...knownPrices):null,
              priceMax:knownPrices.length?Math.max(...knownPrices):null,
              currency:'USD',
              seoScore,seoIndexable,
              cpcCapableSellerCount:uniq(ownOffers.filter(o=>o.cpcCapable).map(o=>o.seller)).length,
              cpcConfirmedOfferCount:ownOffers.filter(o=>o.cpcConfirmed).length
            });
          }
          const products=[...productMap.values()];
          if (products.length<10000) throw new Error(`Discovered product package is too small: ${products.length}`);

          // Cross-check against offers. Products must never advertise a seller count that differs from actionable TPOIDs.
          const sellerCountMismatches=[];
          for (const p of products) {
            const actual=uniq((offersByTpid.get(p.tpid)||[]).map(o=>o.seller)).length;
            if (p.sellerCount!==actual) sellerCountMismatches.push({tpid:p.tpid,declared:p.sellerCount,actual});
          }
          if (sellerCountMismatches.length) throw new Error(`Seller count mismatches: ${JSON.stringify(sellerCountMismatches.slice(0,5))}`);

          // Build useful facts from existing variant labels. These are presented as detected options, not invented specifications.
          const factRegexes=[
            ['Storage',/\b(\d{2,4}\s?(?:GB|TB))\b/ig],
            ['RAM',/\b(\d{1,3}\s?GB)\s*(?:RAM)?\b/ig],
            ['Screen',/\b(\d{1,2}(?:\.\d{1,2})?\s*(?:inch(?:es)?|\"))\b/ig],
            ['Capacity',/\b(\d{3,6}\s?mAh)\b/ig],
            ['Cooling',/\b(\d{4,6}\s?BTU)\b/ig],
            ['Volume',/\b(\d+(?:\.\d+)?\s?(?:ml|oz))\b/ig]
          ];
          const productDetails=[];
          for (const p of products) {
            const ownOffers=offersByTpid.get(p.tpid)||[];
            const ownVariants=variantsByTpid.get(p.tpid)||[];
            const text=[p.name,...ownVariants.map(v=>v.label)].join(' ');
            const facts=[];
            for (const [label,re0] of factRegexes) {
              const re=new RegExp(re0.source,re0.flags); const vals=[]; let m;
              while ((m=re.exec(text)) && vals.length<8) vals.push(clean(m[1]));
              const u=uniq(vals); if (u.length) facts.push({label,values:u.slice(0,6)});
            }
            const sellerGroups=[];
            for (const seller of p.sellers) {
              const rows=ownOffers.filter(o=>o.seller===seller);
              const prices=rows.filter(o=>o.price!==null && o.currency==='USD').map(o=>o.price);
              sellerGroups.push({
                seller,offerCount:rows.length,
                minPrice:prices.length?Math.min(...prices):null,
                maxPrice:prices.length?Math.max(...prices):null,
                cpcCapable:rows.some(o=>o.cpcCapable),
                cpcConfirmed:rows.some(o=>o.cpcConfirmed)
              });
            }
            productDetails.push({...p,facts,sellerGroups});
          }

          // Name/brand route maps for the non-destructive Finder bridge.
          const byName={}; const byBrandName={}; const byTpid={};
          for (const p of productDetails) {
            const nk=normalizedNameKey(p.name); const bk=normalizedNameKey(`${p.brand} ${p.name}`);
            if (!byName[nk]) byName[nk]=[]; byName[nk].push({route:p.route,tpid:p.tpid,name:p.name,brand:p.brand,type:p.type});
            if (bk) { if (!byBrandName[bk]) byBrandName[bk]=[]; byBrandName[bk].push({route:p.route,tpid:p.tpid,name:p.name,brand:p.brand,type:p.type}); }
            byTpid[p.tpid]={route:p.route,name:p.name,brand:p.brand,type:p.type};
          }

          // Sitemap contains only quality-gated canonical product pages. Low-quality previews remain accessible but noindex.
          const seoProducts=productDetails.filter(p=>p.seoIndexable).sort((a,b)=>b.seoScore-a.seoScore || b.sellerCount-a.sellerCount);
          const today=new Date().toISOString().slice(0,10);
          const staticUrls=[
            '/', '/find/', '/compare/', '/products/', '/software/', '/sourcing/', '/about.html',
            '/editorial-methodology.html','/how-we-test.html','/contact.html','/affiliate-disclosure.html','/privacy.html','/terms.html','/corrections.html'
          ];
          const existingSitemap=fs.existsSync(path.join(ROOT,'sitemap.xml'))?fs.readFileSync(path.join(ROOT,'sitemap.xml'),'utf8'):'';
          const existingLocs=[...existingSitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map(m=>clean(m[1])).filter(Boolean).map(u=>{
            try { const x=new URL(u); return `${SITE}${x.pathname}${x.search}`; } catch { return ''; }
          }).filter(Boolean);
          const xmlEsc=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const sitemapEntries=uniq([...existingLocs,...staticUrls.map(u=>`${SITE}${u}`),...seoProducts.map(p=>`${SITE}/product/${encodeURIComponent(p.route)}/`)]);
          const sitemap=`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${sitemapEntries.map(u=>`  <url><loc>${xmlEsc(u)}</loc><lastmod>${today}</lastmod></url>`).join('\n')}\n</urlset>\n`;

          fs.rmSync(OUT_PUBLIC,{recursive:true,force:true}); fs.mkdirSync(OUT_PUBLIC,{recursive:true});
          fs.rmSync(OUT_PRIVATE,{recursive:true,force:true}); fs.mkdirSync(OUT_PRIVATE,{recursive:true});
          const compactOffers=offers.filter(o=>productMap.has(o.tpid));
          const compactVariants=variants.filter(v=>productMap.has(v.tpid));
          fs.writeFileSync(path.join(OUT_PUBLIC,'route-map.json'),JSON.stringify({version:'20.6.8',engine:ENGINE,byName,byBrandName,byTpid}));
          fs.writeFileSync(path.join(OUT_PUBLIC,'products-lite.json'),JSON.stringify(productDetails.map(p=>({tpid:p.tpid,route:p.route,name:p.name,brand:p.brand,type:p.type,image:p.image,sellerCount:p.sellerCount,variantCount:p.variantCount,priceMin:p.priceMin,priceMax:p.priceMax,seoIndexable:p.seoIndexable}))));
          fs.writeFileSync(path.join(OUT_PRIVATE,'products.json'),JSON.stringify(productDetails));
          fs.writeFileSync(path.join(OUT_PRIVATE,'offers.json'),JSON.stringify(compactOffers));
          fs.writeFileSync(path.join(OUT_PRIVATE,'variants.json'),JSON.stringify(compactVariants));
          fs.writeFileSync(path.join(ROOT,'sitemap.xml'),sitemap);
          let robots=fs.existsSync(path.join(ROOT,'robots.txt'))?fs.readFileSync(path.join(ROOT,'robots.txt'),'utf8'):'';
          robots=robots.split(/\r?\n/).filter(line=>!/^\s*Sitemap:/i.test(line)).join('\n').trim();
          if(!/User-agent:/i.test(robots)) robots=`User-agent: *\nAllow: /${robots?`\n${robots}`:''}`;
          robots=`${robots}\nSitemap: ${SITE}/sitemap.xml\n`;
          fs.writeFileSync(path.join(ROOT,'robots.txt'),robots);

