          (()=>{"use strict";const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();let map=null;async function load(){if(map)return map;map=await fetch('/data/product-preview-v20-6/route-map.json?v=20.6.8',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('route map');return r.json()});return map}function candidateCard(el){let n=el;for(let i=0;i<7&&n;i++,n=n.parentElement){const t=(n.innerText||'').trim();if(t.length>15&&t.length<1500&&(n.querySelector('img')||/seller|variant|from us\$|compare/i.test(t)))return n}return el.parentElement}function titleFrom(card,el){try{const href=el.getAttribute('href')||'';if(href){const u=new URL(href,location.href),q=u.searchParams.get('q');if(q&&!/^TP[A-Z0-9-]+$/i.test(q))return q}}catch{}for(const s of ['h2','h3','h4','[class*="title"]','[class*="name"]','strong']){for(const x of card.querySelectorAll(s)){const t=(x.textContent||'').trim();if(t.length>=3&&t.length<=180&&!/compare|seller offer|from us\$|variant/i.test(t))return t}}return ''}function brandFrom(card){for(const s of ['[class*="brand"]','small','b']){for(const x of card.querySelectorAll(s)){const t=(x.textContent||'').trim();if(t.length>=2&&t.length<=45&&!/seller|variant|from|compare|offer/i.test(t))return t}}return ''}function resolve(m,title,brand){const nk=norm(title),bk=norm(`${brand} ${title}`);const a=m.byBrandName?.[bk]||m.byName?.[nk]||[];return a.length?a[0]:null}async function scan(){let m;try{m=await load()}catch{return}const controls=[...document.querySelectorAll('a,button')].filter(x=>/compare sellers|compare \d+ sellers|view seller offer|seller offer|check seller/i.test((x.textContent||'').trim()));for(const el of controls){const card=candidateCard(el);if(!card||card.querySelector('.tp-preview-link-v2068'))continue;const title=titleFrom(card,el);if(!title)continue;const hit=resolve(m,title,brandFrom(card));if(!hit)continue;const a=document.createElement('a');a.className='tp-preview-link-v2068';a.href=`/product/${encodeURIComponent(hit.route)}/`;a.textContent='Product preview';a.style.cssText='display:inline-flex;align-items:center;justify-content:center;margin-top:10px;padding:10px 14px;border-radius:13px;border:1px solid #dbe2df;color:#315bea;background:#fff;text-decoration:none;font-weight:800;font-size:.92rem;';a.addEventListener('click',()=>{try{navigator.sendBeacon('/.netlify/functions/trendpilot-event',new Blob([JSON.stringify({event:'preview_open',tpid:hit.tpid,source:'finder'})],{type:'application/json'}))}catch{}});el.insertAdjacentElement('afterend',a)}}const obs=new MutationObserver(()=>{clearTimeout(window.__tpPreviewScan);window.__tpPreviewScan=setTimeout(scan,180)});obs.observe(document.documentElement,{childList:true,subtree:true});scan()})();
          JS

