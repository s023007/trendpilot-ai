name: TrendPilot Lenovo Direct Link V15.5.3 Render Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-lenovo-direct-link-v15-5-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lenovo-direct-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMITAD_CLIENT_ID_PRIMARY: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_ID_ALT: ${{ secrets.client_id }}
      ADMITAD_CLIENT_SECRET_PRIMARY: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      ADMITAD_CLIENT_SECRET_ALT: ${{ secrets.client_secret }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Resolve Lenovo approved affiliate link
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/resolve_lenovo.py
          python /tmp/resolve_lenovo.py > /tmp/lenovo_link.txt
          test -s /tmp/lenovo_link.txt

      - name: Patch existing Lenovo seller no-result renderer
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_lenovo.py
          LENOVO_LINK="$(tail -n 1 /tmp/lenovo_link.txt)"
          python /tmp/patch_lenovo.py "$LENOVO_LINK"

      - name: Validate V15.5.3
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site-v13-5.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          js=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")
          blob=js+"\n"+html

          required=[
              "TP_LENOVO_DIRECT_LINK_V15_5_3_START",
              "Lenovo product feed temporarily unavailable.",
              "Visit Lenovo",
              'data-tp-lenovo-direct-link="15.5.3"',
              "/js/site-v13-5.js?v=15.5.3"
          ]
          missing=[x for x in required if x not in blob]
          if missing:
              raise SystemExit("Missing validation markers: "+", ".join(missing))

          if js.count("function tpSellerNoResultMarkupV15_1") != 1:
              raise SystemExit("Seller no-result renderer count is not exactly one.")
          if js.count("TP_CJ_SEARCH_BRIDGE_START") != 1:
              raise SystemExit("CJ bridge integrity failed.")
          if "/js/product-discovery-v15.js?v=15.2.0" not in html:
              raise SystemExit("Suggestion engine changed unexpectedly.")

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"js/site-v13-5.js","find/index.html"}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected changed files: "+", ".join(sorted(unexpected)))

          print("V15.5.3 validation passed.")
          PY

      - name: Publish V15.5.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/site-v13-5.js find/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "V15.5.3 already installed."
            exit 0
          fi
          git commit -m "fix: add Lenovo direct-link fallback to existing renderer"
          git push origin HEAD:main
