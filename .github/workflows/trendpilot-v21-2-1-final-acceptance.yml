name: TrendPilot V21.2.1 Final Visual Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trendpilot-v21-2-1-final-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-acceptance:
    runs-on: ubuntu-24.04
    env:
      TP_BASE_URL: https://trendpilotchoice.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Load V21.2.1 last on all static public pages
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          link='<link rel="stylesheet" href="/css/trendpilot-v21-2-1-final.css?v=21.2.1">'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if any(x in {'.git','node_modules'} for x in p.parts): continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'trendpilot-graphite-navy-v21-1.css' not in s or 'trendpilot-v21-2-1-final.css' in s: continue
              ns=s.replace('</head>',link+'</head>',1)
              if ns!=s:
                  p.write_text(ns,encoding='utf-8');changed.append(str(p))
          print('V21.2.1 linked pages:',len(changed))
          for x in changed[:40]: print(' -',x)
          PY

      - name: Commit V21.2.1 links
        shell: bash
        run: |
          git config user.name 'TrendPilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html' '**/*.html' || true
          if ! git diff --cached --quiet; then
            git commit -m 'TrendPilot V21.2.1 load final presentation layer'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for deployment
        shell: bash
        run: |
          for i in $(seq 1 30); do
            page=$(curl -fsSL "${TP_BASE_URL}/" || true)
            if printf '%s' "$page" | grep -q 'trendpilot-v21-2-1-final.css'; then
              echo 'V21.2.1 is live'; exit 0
            fi
            echo "waiting $i/30"; sleep 10
          done
          exit 1

      - name: Verify six mobile surfaces
        shell: bash
        run: |
          mkdir -p artifacts/v21-2-1
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const BASE=process.env.TP_BASE_URL;
          const rgb=s=>{const m=String(s).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?m.slice(1,4).map(Number):null};
          const lum=a=>a.map(x=>{x/=255;return x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4)}).reduce((s,x,i)=>s+x*[.2126,.7152,.0722][i],0);
          const cr=(a,b)=>(Math.max(lum(a),lum(b))+.05)/(Math.min(lum(a),lum(b))+.05);
          const contrast=(fg,bg)=>{const a=rgb(fg),b=rgb(bg);return a&&b?cr(a,b):0};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2.75,isMobile:true,hasTouch:true});
            const p=await ctx.newPage();p.setDefaultTimeout(60000);const checks={};

            await p.goto(BASE+'/',{waitUntil:'domcontentloaded',timeout:90000});await p.click('[data-tp-menu-button]');await p.waitForTimeout(250);
            const menu=await p.evaluate(()=>{const nav=document.querySelector('[data-tp-nav]'),source=nav.querySelector('a[href="/sourcing/"]');return{links:[...nav.querySelectorAll('a')].filter(a=>getComputedStyle(a).display!=='none').map(a=>a.textContent.trim()),after:getComputedStyle(source,'::after').content,bg:getComputedStyle(nav).backgroundColor,close:getComputedStyle(document.querySelector('.tp-menu-close')).color,closeBg:getComputedStyle(document.querySelector('.tp-menu-close')).backgroundColor}});
            checks.menu_exact=JSON.stringify(menu.links)===JSON.stringify(['Saved products','Rare Finds','Tickets & experiences','Buying Guides','Business & wholesale']);
            checks.menu_no_duplicate=menu.after==='none'||menu.after==='normal'||menu.after==='""';
            checks.menu_opaque=!/rgba\([^)]*,\s*0(?:\.\d+)?\)/.test(menu.bg)&&contrast(menu.close,menu.closeBg)>=4.5;
            await p.screenshot({path:'artifacts/v21-2-1/home-menu.png'});

            await p.goto(BASE+'/find/?q=phone&engine=v2064',{waitUntil:'domcontentloaded',timeout:90000});await p.waitForSelector('.tp78-card',{timeout:60000});
            const sc=await p.evaluate(()=>{const c=document.querySelector('.tp78-card'),h=c.querySelector('h3 a,h3'),m=c.querySelector('.tp78-meta,.tp78-description'),media=c.querySelector('.tp78-media');return{bg:getComputedStyle(c).backgroundColor,h:getComputedStyle(h).color,m:m?getComputedStyle(m).color:null,media:media?getComputedStyle(media).backgroundColor:null}});
            checks.search_card_light=lum(rgb(sc.bg))>.82;checks.search_title=contrast(sc.h,sc.bg)>=4.5;checks.search_meta=!sc.m||contrast(sc.m,sc.bg)>=4.5;
            await p.locator('.tp78-card').first().scrollIntoViewIfNeeded();await p.screenshot({path:'artifacts/v21-2-1/search-card.png'});

            await p.goto(BASE+'/deals/',{waitUntil:'domcontentloaded',timeout:90000});await p.waitForSelector('.tp-product-grid > *',{timeout:60000});
            const dn=await p.evaluate(()=>{const a=document.querySelector('.tp-bottom-nav a[href="/deals/"]');return{bg:getComputedStyle(a).backgroundColor,c:getComputedStyle(a).color}});checks.deals_nav=contrast(dn.c,dn.bg)>=4.5;
            await p.screenshot({path:'artifacts/v21-2-1/deals.png'});

            await p.goto(BASE+'/rare-used/',{waitUntil:'domcontentloaded',timeout:90000});await p.waitForSelector('.tp80-rare-card h2 a',{timeout:60000});
            const rc=await p.evaluate(()=>{const c=document.querySelector('.tp80-rare-card'),h=c.querySelector('h2 a'),price=c.querySelector('.tp80-card-price');return{bg:getComputedStyle(c).backgroundColor,h:getComputedStyle(h).color,p:price?getComputedStyle(price).color:null}});checks.rare_title=contrast(rc.h,rc.bg)>=4.5;checks.rare_price=!rc.p||contrast(rc.p,rc.bg)>=4.5;
            await p.locator('.tp80-rare-card').first().scrollIntoViewIfNeeded();await p.screenshot({path:'artifacts/v21-2-1/rare-card.png'});

            await p.goto(BASE+'/tickets/',{waitUntil:'domcontentloaded',timeout:90000});await p.waitForSelector('.tp-ticket-v141-card h3',{timeout:60000});
            const tc=await p.evaluate(()=>{const c=document.querySelector('.tp-ticket-v141-card'),h=c.querySelector('h3'),pp=c.querySelector('p');return{bg:getComputedStyle(c).backgroundColor,h:getComputedStyle(h).color,p:pp?getComputedStyle(pp).color:null}});checks.ticket_title=contrast(tc.h,tc.bg)>=4.5;checks.ticket_copy=!tc.p||contrast(tc.p,tc.bg)>=4.5;
            await p.locator('.tp-ticket-v141-card').first().scrollIntoViewIfNeeded();await p.screenshot({path:'artifacts/v21-2-1/ticket-card.png'});

            const product='/product/hot-sale-original-global-official-version-xiaomi-redmi-note-8-48mp-quad-ai-back---d0f4e3ec74717f/';
            await p.goto(BASE+product,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForSelector('.about-copy',{timeout:60000});
            const pd=await p.evaluate(()=>({desc:document.querySelector('.about-copy')?.textContent.trim()||'',seller:!!document.querySelector('#seller-offers'),body:getComputedStyle(document.body).backgroundColor}));checks.product_description=pd.desc.length>80;checks.product_seller=pd.seller;
            await p.screenshot({path:'artifacts/v21-2-1/product.png'});

            const passed=Object.values(checks).every(Boolean);const out={version:'21.2.1',checks,menu,search:sc,deals:dn,rare:rc,ticket:tc,passed};
            fs.writeFileSync('artifacts/v21-2-1/report.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));await browser.close();if(!passed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trendpilot-v21-2-1-six-surface-acceptance
          path: artifacts/v21-2-1
