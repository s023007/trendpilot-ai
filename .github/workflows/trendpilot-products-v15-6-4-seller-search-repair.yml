name: TrendPilot Products V15.6.4 Seller Search Repair

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendpilot-products-v15-6-4-seller-search-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-seller-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Apply seller search repair to current source
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/tp_v15_6_4.py
          python /tmp/tp_v15_6_4.py

      - name: Validate V15.6.4
        shell: bash
        run: |
          set -euo pipefail

          node --check js/site-v13-5.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          js=Path("js/site-v13-5.js").read_text(encoding="utf-8")
          html=Path("find/index.html").read_text(encoding="utf-8")
          blob=js+"\n"+html

          required=[
              "TP_SELLER_SEARCH_REPAIR_V15_6_4_START",
              "tpEnrichCjTaxonomyV15_6_4",
              "tpSellerScopedRelevantV15_6_4",
              "tpSellerSuggestionsV15_6_4",
              ".map(tpEnrichCjTaxonomyV15_6_4).filter(tpCjPublicAllowed)",
              'selectedSeller!=="Lenovo"',
              "seller matches",
              "/js/site-v13-5.js?v=15.6.4",
              "TP_LENOVO_DIRECT_LINK_V15_5_3_START",
              "TP_CJ_SEARCH_BRIDGE_START"
          ]
          missing=[x for x in required if x not in blob]
          if missing:
              raise SystemExit("Missing validation markers: "+", ".join(missing))

          if js.count("function renderFinder()") != 1:
              raise SystemExit("renderFinder count changed unexpectedly.")

          if js.count("TP_CJ_SEARCH_BRIDGE_START") != 1:
              raise SystemExit("CJ bridge integrity failed.")

          if "/js/product-discovery-v15.js?v=15.2.0" not in html:
              raise SystemExit("Suggestion engine changed unexpectedly.")

          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"js/site-v13-5.js","find/index.html"}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit("Unexpected changed files: "+", ".join(sorted(unexpected)))

          print("V15.6.4 validation passed.")
          print("- Patch matches current main source.")
          print("- Admitad loader is left untouched.")
          print("- CJ taxonomy and seller-scoped fallback are repaired.")
          print("- Lenovo direct-link remains intact.")
          PY

      - name: Publish V15.6.4
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/site-v13-5.js find/index.html
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "V15.6.4 already installed."
            exit 0
          fi

          git commit -m "fix: repair seller search against current main source"
          git push origin HEAD:main
