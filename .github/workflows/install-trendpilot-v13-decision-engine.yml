name: Install TrendPilot V13 Decision Engine

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Locate and unpack V13 package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'trendpilot-v13-decision-engine*.zip' -print -quit)"
          if [ -z "${ZIP_FILE}" ]; then
            echo "Upload trendpilot-v13-decision-engine.zip to the repository root first."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/trendpilot-v13"
          mkdir -p "$RUNNER_TEMP/trendpilot-v13"
          unzip -q "${ZIP_FILE}" -d "$RUNNER_TEMP/trendpilot-v13"
          cp -a "$RUNNER_TEMP/trendpilot-v13"/. .
          rm -f "${ZIP_FILE}"

      - name: Install V13 shopping decision engine
        shell: bash
        run: |
          set -euo pipefail
          python automation/install_v13_decision_engine.py

      - name: Validate V13
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            automation/build_decision_catalog.py \
            automation/install_v13_decision_engine.py \
            automation/validate_v13.py
          node --check js/site-v13.js
          python automation/validate_v13.py

      - name: Commit V13
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install TrendPilot V13 shopping decision engine"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Queue full feed refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh workflow view update-products.yml >/dev/null 2>&1; then
            echo "V13 is installed with the migrated current catalogue, but update-products.yml was not found."
            exit 1
          fi
          gh workflow run update-products.yml --ref "${GITHUB_REF_NAME}"
          echo "Full feed refresh queued. Confirm that Update products finishes successfully."
